<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skylanders Codex — Characters by Element</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0D0B1A;
    --panel: #17142E;
    --panel-2: #1F1B3D;
    --ink: #F5F1E6;
    --muted: #9088AE;
    --gold: #E8B94B;
    --gold-dim: #a9853a;

    --fire: #FF5A36;
    --water: #2FA8E0;
    --air: #6BE0CC;
    --earth: #C9903F;
    --life: #5FD35C;
    --undead: #A177E8;
    --magic: #FF4FD8;
    --tech: #FFD23F;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3, .display{
    font-family: 'Baloo 2', sans-serif;
  }

  /* ---------- background texture ---------- */
  .sky-bg{
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 60% 40% at 15% 8%, rgba(255,210,63,0.06), transparent 60%),
      radial-gradient(ellipse 50% 35% at 90% 15%, rgba(161,119,232,0.10), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(47,168,224,0.08), transparent 60%),
      var(--bg);
  }
  .sky-bg::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.55) 1px, transparent 1px);
    background-size: 140px 140px;
    opacity: 0.15;
  }

  /* ---------- hero ---------- */
  .hero{
    position: relative;
    max-width: 1080px;
    margin: 0 auto;
    padding: 88px 24px 60px;
    text-align: center;
  }

  .portal{
    width: 190px;
    height: 190px;
    margin: 0 auto 34px;
    position: relative;
  }
  .portal .ring{
    position:absolute; inset:0;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      var(--fire), var(--tech), var(--earth), var(--life),
      var(--air), var(--water), var(--undead), var(--magic), var(--fire));
    animation: spin 14s linear infinite;
    filter: saturate(1.1);
  }
  .portal .ring-mask{
    position:absolute; inset: 10px;
    border-radius: 50%;
    background: var(--bg);
  }
  .portal .core{
    position:absolute; inset: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #2a2350, #100d22 70%);
    border: 1px solid rgba(232,185,75,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .portal .core svg{ width: 58px; height: 58px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .portal .ring{ animation: none; } }

  .eyebrow{
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gold);
    margin: 0 0 14px;
  }

  h1.title{
    font-size: clamp(38px, 6vw, 62px);
    font-weight: 800;
    margin: 0 0 16px;
    line-height: 1.05;
    background: linear-gradient(180deg, #fff, #cfc7ff 70%, var(--gold) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle{
    font-size: 17px;
    color: var(--muted);
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.65;
  }

  /* ---------- filter nav ---------- */
  .nav-wrap{
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(10px);
    background: rgba(13,11,26,0.82);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav{
    max-width: 1080px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar{ display:none; }
  .pill{
    flex: 0 0 auto;
    padding: 8px 16px;
    border-radius: 999px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: 1.5px solid var(--pill-c, var(--gold));
    color: var(--pill-c, var(--gold));
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }
  .pill:hover{ transform: translateY(-1px); }
  .pill.active{
    background: var(--pill-c, var(--gold));
    color: #0D0B1A;
  }

  /* ---------- sections ---------- */
  main{
    max-width: 1080px;
    margin: 0 auto;
    padding: 10px 20px 100px;
  }

  .element-section{
    margin-top: 56px;
    scroll-margin-top: 76px;
  }

  .section-head{
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 16px;
    margin-bottom: 22px;
    border-bottom: 2px solid var(--ec);
  }
  .section-head .badge{
    width: 46px; height: 46px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--ec) 18%, transparent);
    border: 1.5px solid var(--ec);
    display:flex; align-items:center; justify-content:center;
    flex: 0 0 auto;
  }
  .section-head .badge svg{ width: 24px; height: 24px; }
  .section-head h2{
    font-size: 26px;
    margin: 0;
    color: var(--ec);
    font-weight: 700;
  }
  .section-head .count{
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 600;
  }

  .card-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }

  .card{
    position: relative;
    background: linear-gradient(165deg, var(--panel-2), var(--panel));
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 18px 16px 16px;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    overflow: hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height: 3px;
    background: var(--ec);
  }
  .card:hover{
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--ec) 60%, transparent);
    box-shadow: 0 10px 26px -10px color-mix(in srgb, var(--ec) 55%, transparent);
  }
  .card .emblem{
    width: 52px; height: 52px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--ec) 16%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--ec) 55%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .card .emblem svg{ width: 28px; height: 28px; }
  .card .name{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 16.5px;
    margin: 0 0 3px;
  }
  .card .tag{
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  footer{
    text-align: center;
    padding: 30px 20px 60px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }
  footer a{ color: var(--gold); text-decoration: none; }
</style>
</head>
<body>

<div class="sky-bg"></div>

<header class="hero">
  <div class="portal">
    <div class="ring"></div>
    <div class="ring-mask"></div>
    <div class="core">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E8B94B" stroke-width="1.4">
        <path d="M12 2 L14.5 9 L22 9 L16 13.5 L18 21 L12 16.5 L6 21 L8 13.5 L2 9 L9.5 9 Z" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
  <p class="eyebrow">Skylander guide</p>
  <h1 class="title">Skylanders Codex</h1>
  <p class="subtitle">Alle Skylanders, soteret med elementer</header>

<div class="nav-wrap">
  <nav class="nav" id="nav"></nav>
</div>

<main id="main"></main>

<footer>
    Lavet til folk som elsker skylanders

</footer>

<script>
const ELEMENTS = [
  {
    id: "fire", name: "Fire", color: "var(--fire)",
    icon: '<path d="M12 2c1 3-2 4-2 7a4 4 0 1 0 8 0c0-1-1-2-1-2 1 3-1 4-2 3 1-2-1-3-1-5-1 2-3 3-2 6a3 3 0 1 1-6 0c0-4 4-5 6-9z"/>',
    chars: [
      { n: "Ignitor", t: "Fiery knight", icon: '<path d="M12 3l1 8h5l-9 10 1-8H4z" stroke-linejoin="round"/>' },
      { n: "Flameslinger", t: "Flame archer", icon: '<path d="M4 4c8 0 12 4 12 12M13 5l7 7M13 12h7" stroke-linecap="round"/>' },
      { n: "Sunburn", t: "Phoenix guardian", icon: '<path d="M12 4c3 3 3 6 0 9-3-3-3-6 0-9zM3 15c3-2 6-2 9 0-3 2-6 2-9 0zM21 15c-3-2-6-2-9 0 3 2 6 2 9 0z" stroke-linejoin="round"/>' },
      { n: "Eruptor", t: "Living lava", icon: '<path d="M4 19l4-9 4 4 3-8 5 13z" stroke-linejoin="round"/><circle cx="12" cy="6" r="1.2"/>' },
      { n: "Hot Head", t: "Molten enforcer", icon: '<circle cx="12" cy="14" r="6"/><path d="M12 8c1.5-2 1-4-1-5 1 2-1 3-1 5" stroke-linecap="round"/>' }
    ]
  },
  {
    id: "water", name: "Water", color: "var(--water)",
    icon: '<path d="M12 2s7 8.5 7 13a7 7 0 1 1-14 0c0-4.5 7-13 7-13z"/>',
    chars: [
      { n: "Gill Grunt", t: "Deep-sea gunner" },
      { n: "Zap", t: "Electric eel" },
      { n: "Wham-Shell", t: "Shell warrior" },
      { n: "Slam Bam", t: "Ice yeti" },
      { n: "Chill", t: "Frost archer" }
    ]
  },
  {
    id: "air", name: "Air", color: "var(--air)",
    icon: '<path d="M3 8h11a3 3 0 1 0-3-3 M3 13h15a3 3 0 1 1-3 3 M3 18h9a2.5 2.5 0 1 0-2.5-2.5" stroke-linecap="round"/>',
    chars: [
      { n: "Warnado", t: "Living whirlwind" },
      { n: "Lightning Rod", t: "Storm giant" },
      { n: "Sonic Boom", t: "Griffin flyer" },
      { n: "Whirlwind", t: "Rainbow unicorn" },
      { n: "Jet-Vac", t: "Sky ranger" }
    ]
  },
  {
    id: "earth", name: "Earth", color: "var(--earth)",
    icon: '<path d="M4 20l4-9 4 5 3-7 5 11z" stroke-linejoin="round"/>',
    chars: [
      { n: "Terrafin", t: "Sand shark" },
      { n: "Dino-Rang", t: "Boomerang dino" },
      { n: "Prism Break", t: "Crystal golem" },
      { n: "Bash", t: "Rock rhino" },
      { n: "Crusher", t: "Granite giant" }
    ]
  },
  {
    id: "life", name: "Life", color: "var(--life)",
    icon: '<path d="M12 21s-7-4.6-9.5-9.2C.8 8 3 4 7 4c2 0 4 1.2 5 3 1-1.8 3-3 5-3 4 0 6.2 4 4.5 7.8C19 16.4 12 21 12 21z"/>',
    chars: [
      { n: "Stealth Elf", t: "Ninja ranger" },
      { n: "Camo", t: "Watermelon dino" },
      { n: "Zook", t: "Bamboo gunner" },
      { n: "Stump Smash", t: "Living tree stump" },
      { n: "Tree Rex", t: "Ancient guardian" }
    ]
  },
  {
    id: "undead", name: "Undead", color: "var(--undead)",
    icon: '<path d="M12 2a7 7 0 0 0-7 7v5l2 3 1.5-2 1.5 2 1-1.4 1 1.4 1.5-2 1.5 2 2-3V9a7 7 0 0 0-7-7z" stroke-linejoin="round"/><circle cx="9.5" cy="9" r="1"/><circle cx="14.5" cy="9" r="1"/>',
    chars: [
      { n: "Chop Chop", t: "Undead knight" },
      { n: "Hex", t: "Skeletal sorceress" },
      { n: "Ghost Roaster", t: "Spirit devourer" },
      { n: "Cynder", t: "Shadow dragon" },
      { n: "Fright Rider", t: "Skeleton jockey" }
    ]
  },
  {
    id: "magic", name: "Magic", color: "var(--magic)",
    icon: '<path d="M12 2 L14.2 9 L21.5 9 L15.6 13.3 L17.8 20.5 L12 16.2 L6.2 20.5 L8.4 13.3 L2.5 9 L9.8 9 Z" stroke-linejoin="round"/>',
    chars: [
      { n: "Spyro", t: "The purple dragon" },
      { n: "Voodood", t: "Tribal spearman" },
      { n: "Wrecking Ball", t: "Wrecking-ball dragon" },
      { n: "Double Trouble", t: "Duplicating mage" },
      { n: "Star Strike", t: "Astral warrior" }
    ]
  },
  {
    id: "tech", name: "Tech", color: "var(--tech)",
    icon: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke-linecap="round"/>',
    chars: [
      { n: "Trigger Happy", t: "Gold-loving gunslinger" },
      { n: "Drobot", t: "Robotic dragon" },
      { n: "Boomer", t: "Dwarf demolitionist" },
      { n: "Drill Sergeant", t: "Drill-armed commander" },
      { n: "Bouncer", t: "Robotic outlaw" }
    ]
  }
];

const nav = document.getElementById('nav');
const main = document.getElementById('main');

ELEMENTS.forEach(el => {
  const pill = document.createElement('button');
  pill.className = 'pill';
  pill.textContent = el.name;
  pill.style.setProperty('--pill-c', el.color);
  pill.addEventListener('click', () => {
    document.getElementById('sec-' + el.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  nav.appendChild(pill);

  const section = document.createElement('section');
  section.className = 'element-section';
  section.id = 'sec-' + el.id;
  section.style.setProperty('--ec', el.color);

  section.innerHTML = `
    <div class="section-head">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="${el.color}" stroke-width="1.5">${el.icon}</svg>
      </div>
      <h2>${el.name}</h2>
      <span class="count">${el.chars.length} Skylanders</span>
    </div>
    <div class="card-grid">
      ${el.chars.map(c => `
        <div class="card" style="--ec:${el.color}">
          <svg class="gem" viewBox="0 0 24 24" fill="none" stroke="${el.color}" stroke-width="1.5">${el.icon}</svg>
          <p class="name">${c.n}</p>
          <p class="tag">${c.t}</p>
        </div>
      `).join('')}
    </div>
  `;
  main.appendChild(section);
});

const sections = ELEMENTS.map(el => document.getElementById('sec-' + el.id));
const pills = Array.from(nav.children);

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const idx = sections.indexOf(entry.target);
    if (entry.isIntersecting && idx !== -1) {
      pills.forEach(p => p.classList.remove('active'));
      pills[idx].classList.add('active');
    }
  });
}, { rootMargin: '-40% 0px -50% 0px' });

sections.forEach(s => observer.observe(s));
</script>

</body>
</html>
