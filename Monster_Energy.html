<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ULTRA CLICKER</title>
<style>
  :root{
    --bg-dark:#0a0d12;
    --bg-panel:#12161d;
    --silver:#d8dde3;
    --silver-dark:#9aa3ad;
    --ice:#8fd7e8;
    --ice-glow:#c7f3ff;
    --accent:#e8eef2;
    --gold:#ffcf5c;
    --danger:#5a6472;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:
      radial-gradient(circle at 30% 0%, #1a2230 0%, transparent 55%),
      radial-gradient(circle at 80% 100%, #0f2530 0%, transparent 50%),
      var(--bg-dark);
    color:var(--accent);
    font-family:'Segoe UI', Arial, sans-serif;
    overflow:hidden;
  }
  #app{
    display:flex;
    height:100%;
  }
  /* ---------- LEFT: CLICK ZONE ---------- */
  #clickzone{
    flex:1.15;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    border-right:1px solid #1e2530;
    user-select:none;
  }
  #counterPanel{
    position:relative;
    padding:22px 44px;
    border-radius:20px;
    background:linear-gradient(160deg, rgba(28,36,48,0.75), rgba(15,20,28,0.85));
    border:1px solid rgba(143,215,232,0.25);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 8px 30px rgba(0,0,0,0.5),
      0 0 40px rgba(79,184,212,0.08);
    backdrop-filter:blur(6px);
    margin-bottom:32px;
    text-align:center;
    overflow:hidden;
  }
  #counterPanel::before{
    content:'';
    position:absolute;
    top:-40%; left:-20%;
    width:140%; height:180%;
    background:conic-gradient(from 0deg, transparent, rgba(143,215,232,0.12), transparent 30%);
    animation:sweep 6s linear infinite;
    pointer-events:none;
  }
  @keyframes sweep{
    to{ transform:rotate(360deg); }
  }
  #counter{
    position:relative;
    font-size:3.1rem;
    font-weight:800;
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(90deg, #eaf7fb, #8fd7e8 40%, #c7f3ff 60%, #eaf7fb);
    background-size:220% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shimmer 4s linear infinite;
    text-shadow:0 0 30px rgba(143,215,232,0.35);
    transition:transform 0.12s ease;
  }
  @keyframes shimmer{
    to{ background-position:-220% center; }
  }
  #counter.pulse{
    transform:scale(1.06);
  }
  #unit{
    -webkit-text-fill-color:initial;
    background:none;
    color:var(--ice-glow);
    font-size:0.55em;
    letter-spacing:4px;
    vertical-align:middle;
    margin-left:6px;
    opacity:0.85;
  }
  #perSec{
    position:relative;
    color:var(--silver-dark);
    margin-top:6px;
    margin-bottom:0;
    font-size:0.85rem;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  #perSec .bolt{
    color:var(--gold);
    filter:drop-shadow(0 0 4px rgba(255,207,92,0.6));
  }
  #canWrap{
    cursor:pointer;
    transform:scale(1);
    transition:transform 0.08s ease;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,0.6));
  }
  #canWrap:active{
    transform:scale(0.94) rotate(-1deg);
  }
  #hint{
    margin-top:22px;
    color:var(--danger);
    font-size:0.8rem;
    letter-spacing:0.5px;
  }
  #saveRow{
    margin-top:14px;
    display:flex;
    gap:10px;
    align-items:center;
  }
  #saveStatus{
    font-size:0.72rem;
    color:var(--silver-dark);
    min-width:90px;
  }
  #resetBtn{
    background:none;
    border:1px solid #3a4250;
    color:var(--danger);
    font-size:0.7rem;
    letter-spacing:1px;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  #resetBtn:hover{
    border-color:#c0596a;
    color:#e08a97;
  }
  .floater{
    position:absolute;
    font-weight:700;
    color:var(--ice-glow);
    pointer-events:none;
    animation:floatUp 0.9s ease-out forwards;
    text-shadow:0 0 6px rgba(143,215,232,0.6);
  }
  @keyframes floatUp{
    0%{opacity:1; transform:translateY(0) scale(1);}
    100%{opacity:0; transform:translateY(-70px) scale(1.2);}
  }

  /* ---------- RIGHT: SHOP ---------- */
  #shop{
    flex:1;
    max-width:420px;
    display:flex;
    flex-direction:column;
    background:var(--bg-panel);
  }
  #shopHeader{
    padding:18px 20px 12px 20px;
    border-bottom:1px solid #1e2530;
  }
  #shopHeader h1{
    margin:0;
    font-size:1.1rem;
    letter-spacing:2px;
    color:var(--silver);
  }
  #shopHeader p{
    margin:4px 0 0 0;
    font-size:0.75rem;
    color:var(--danger);
  }
  #tabs{
    display:flex;
    border-bottom:1px solid #1e2530;
  }
  .tabBtn{
    flex:1;
    padding:10px;
    text-align:center;
    background:none;
    border:none;
    color:var(--silver-dark);
    font-size:0.8rem;
    letter-spacing:1px;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tabBtn.active{
    color:var(--ice-glow);
    border-bottom:2px solid var(--ice);
  }
  #list{
    flex:1;
    overflow-y:auto;
    padding:12px;
  }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    margin-bottom:8px;
    border-radius:10px;
    border:1px solid #232b38;
    background:#161c26;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s, opacity 0.2s ease;
  }
  .item:hover:not(.disabled){
    background:#1c2430;
    border-color:var(--ice);
  }
  .item.disabled{
    opacity:0.45;
    cursor:default;
  }
  .itemIcon{
    width:38px;
    height:38px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.3rem;
  }
  .itemInfo{flex:1;}
  .itemName{
    font-weight:700;
    font-size:0.88rem;
    color:var(--accent);
  }
  .itemDesc{
    font-size:0.72rem;
    color:var(--silver-dark);
    margin-top:1px;
  }
  .itemRight{
    text-align:right;
    min-width:64px;
  }
  .itemCost{
    font-size:0.82rem;
    font-weight:700;
    color:var(--gold);
  }
  .itemOwned{
    font-size:0.72rem;
    color:var(--silver-dark);
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#232b38;border-radius:4px;}

  #backBtn{
    position:fixed;
    top:16px;
    left:16px;
    z-index:50;
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:999px;
    background:rgba(18,22,29,0.85);
    border:1px solid rgba(143,215,232,0.3);
    color:var(--accent);
    text-decoration:none;
    font-size:0.8rem;
    letter-spacing:0.5px;
    backdrop-filter:blur(4px);
    transition:border-color 0.15s, color 0.15s, transform 0.1s;
  }
  #backBtn:hover{
    border-color:var(--ice);
    color:var(--ice-glow);
    transform:translateY(-1px);
  }
  #backBtn svg{
    width:14px;
    height:14px;
    stroke:currentColor;
  }
</style>
</head>
<body>
<a id="backBtn" href="index.html">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  Tilbage
</a>
<div id="app">

  <div id="clickzone">
    <div id="counterPanel">
      <div id="counter">0 <span id="unit">ENERGY</span></div>
      <div id="perSec"><span class="bolt">⚡</span><span id="perSecText">0 energy / sec</span></div>
    </div>
    <div id="canWrap">
      <svg id="theCan" width="180" height="420" viewBox="0 0 180 420" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#eef2f5"/>
            <stop offset="12%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#cfd6dc"/>
            <stop offset="50%" stop-color="#f7fafc"/>
            <stop offset="70%" stop-color="#c3ccd3"/>
            <stop offset="88%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#dfe4e8"/>
          </linearGradient>
          <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f5f7f8"/>
            <stop offset="50%" stop-color="#aab2b9"/>
            <stop offset="100%" stop-color="#e7ebee"/>
          </linearGradient>
        </defs>

        <!-- lid -->
        <rect x="30" y="6" width="120" height="26" rx="10" fill="url(#capGrad)" stroke="#8b929a" stroke-width="1.5"/>
        <ellipse cx="90" cy="8" rx="60" ry="6" fill="#c7ccd1"/>

        <!-- body -->
        <rect x="18" y="30" width="144" height="372" rx="20" fill="url(#bodyGrad)" stroke="#9aa3ad" stroke-width="2"/>

        <!-- top ring -->
        <rect x="18" y="34" width="144" height="10" fill="#00000010"/>

        <!-- ZERO SUGAR band -->
        <rect x="18" y="46" width="144" height="26" fill="#101317"/>
        <text x="90" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="15" fill="#ffffff" letter-spacing="2">ZERO SUGAR</text>

        <!-- bolt mark (original, not brand logo) -->
        <g stroke="#0d0f12" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M55 105 L70 190 L85 150 L95 260"/>
          <path d="M90 105 L105 190 L120 150 L130 260"/>
          <path d="M125 105 L140 190 L150 150 L145 250" opacity="0.85"/>
        </g>

        <!-- wordmark -->
        <text x="90" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="27" fill="#12151a" letter-spacing="1">COLD</text>
        <text x="90" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#4fb8d4" letter-spacing="4">ENERGY</text>
        <rect x="55" y="345" width="70" height="20" rx="4" fill="#101317"/>
        <text x="90" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="3">ULTRA</text>

        <!-- bottom rim -->
        <rect x="18" y="392" width="144" height="10" fill="#00000012"/>
        <ellipse cx="90" cy="402" rx="72" ry="7" fill="#b9c0c6"/>
      </svg>
    </div>
    <div id="hint">click the can</div>
    <div id="saveRow">
      <span id="saveStatus">progress saved</span>
      <button id="resetBtn">RESET SAVE</button>
    </div>
  </div>

  <div id="shop">
    <div id="shopHeader">
      <h1>SUPPLY CHAIN</h1>
      <p>spend energy to make more energy</p>
    </div>
    <div id="tabs">
      <button class="tabBtn active" data-tab="buildings">PRODUCERS</button>
      <button class="tabBtn" data-tab="upgrades">UPGRADES</button>
    </div>
    <div id="list"></div>
  </div>

</div>

<script>
(function(){
  let energy = 0;
  let clickPower = 1;
  let perSec = 0;
  let currentTab = 'buildings';

  const buildings = [
    { id:'vend',   name:'Vending Machine',   desc:'A humble start.',        icon:'🥤', base:15,      rate:0.1,  owned:0 },
    { id:'intern', name:'Intern Runner',     desc:'Fetches from the fridge.', icon:'🏃', base:100,     rate:1,    owned:0 },
    { id:'truck',  name:'Delivery Truck',    desc:'Cases by the hour.',     icon:'🚚', base:1100,    rate:8,    owned:0 },
    { id:'plant',  name:'Bottling Plant',    desc:'Cans off the line.',     icon:'🏭', base:12000,   rate:47,   owned:0 },
    { id:'ware',   name:'Warehouse',         desc:'Pallets stacked high.',  icon:'📦', base:130000,  rate:260,  owned:0 },
    { id:'dist',   name:'Distribution Hub',  desc:'Nationwide reach.',      icon:'🛰️', base:1400000, rate:1400, owned:0 },
    { id:'sat',    name:'Orbital Dispenser', desc:'Energy, from space.',    icon:'🛸', base:2e7,      rate:26000,owned:0 },
  ];

  const upgrades = [
    { id:'grip',  name:'Better Grip',      desc:'Double click power.',       icon:'✋', cost:100,   applied:false, effect:()=>{clickPower*=2;} },
    { id:'ice',   name:'Ice Cold Formula', desc:'Double click power again.', icon:'🧊', cost:1000,  applied:false, effect:()=>{clickPower*=2;} },
    { id:'crate', name:'Bulk Crates',      desc:'Producers +25% output.',    icon:'🗃️', cost:5000,  applied:false, effect:()=>{applyProdBoost(1.25);} },
    { id:'ads',   name:'Extreme Marketing',desc:'Producers +50% output.',    icon:'📣', cost:50000, applied:false, effect:()=>{applyProdBoost(1.5);} },
    { id:'gold',  name:'Golden Can',       desc:'Click power x5.',           icon:'⭐', cost:250000,applied:false, effect:()=>{clickPower*=5;} },
  ];

  let prodMultiplier = 1;
  function applyProdBoost(mult){ prodMultiplier *= mult; }

  const counterEl = document.getElementById('counter');
  const unitEl = document.getElementById('unit');
  const perSecTextEl = document.getElementById('perSecText');
  const listEl = document.getElementById('list');
  const canWrap = document.getElementById('canWrap');
  const saveStatusEl = document.getElementById('saveStatus');
  const resetBtn = document.getElementById('resetBtn');

  const SAVE_KEY = 'ultraClickerSave';

  function saveGame(){
    try{
      const data = {
        energy,
        clickPower,
        prodMultiplier,
        buildings: buildings.map(b=>({ id:b.id, owned:b.owned })),
        upgrades: upgrades.map(u=>({ id:u.id, applied:u.applied }))
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      if(saveStatusEl) saveStatusEl.textContent = 'progress saved';
    }catch(err){
      console.error('Save failed:', err);
      if(saveStatusEl) saveStatusEl.textContent = 'save failed';
    }
  }

  function loadGame(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      energy = data.energy || 0;
      clickPower = data.clickPower || 1;
      prodMultiplier = data.prodMultiplier || 1;
      (data.buildings || []).forEach(saved=>{
        const b = buildings.find(x=>x.id === saved.id);
        if(b) b.owned = saved.owned || 0;
      });
      (data.upgrades || []).forEach(saved=>{
        const u = upgrades.find(x=>x.id === saved.id);
        if(u) u.applied = !!saved.applied;
      });
    }catch(err){
      console.error('Load failed:', err);
    }
  }

  resetBtn.addEventListener('click', ()=>{
    if(!confirm('Reset all progress? This cannot be undone.')) return;
    try{ localStorage.removeItem(SAVE_KEY); }catch(err){ console.error(err); }
    energy = 0;
    clickPower = 1;
    prodMultiplier = 1;
    buildings.forEach(b=> b.owned = 0);
    upgrades.forEach(u=> u.applied = false);
    recalcPerSec();
    render();
  });

  function fmt(n){
    if(n < 1000) return Math.floor(n).toString();
    const units = ['K','M','B','T','Qa','Qi'];
    let u = -1;
    let num = n;
    while(num >= 1000 && u < units.length-1){ num/=1000; u++; }
    return num.toFixed(2) + units[u];
  }

  function buildingCost(b){
    return Math.ceil(b.base * Math.pow(1.15, b.owned));
  }

  function recalcPerSec(){
    perSec = buildings.reduce((sum,b)=> sum + b.rate*b.owned, 0) * prodMultiplier;
  }

  function render(){
    counterEl.innerHTML = fmt(energy) + ' <span id="unit">ENERGY</span>';
    perSecTextEl.textContent = fmt(perSec) + ' energy / sec';
    updateShop();
  }

  const buildingRowEls = {};
  const upgradeRowEls = {};
  let shopBuilt = false;

  function buildShop(){
    listEl.innerHTML = '';

    const buildingsWrap = document.createElement('div');
    buildingsWrap.id = 'buildingsWrap';
    buildings.forEach(b=>{
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div class="itemIcon">${b.icon}</div>
        <div class="itemInfo">
          <div class="itemName">${b.name}</div>
          <div class="itemDesc">${b.desc} · +${fmt(b.rate)}/s each</div>
        </div>
        <div class="itemRight">
          <div class="itemCost"></div>
          <div class="itemOwned"></div>
        </div>
      `;
      el.addEventListener('click', ()=>{
        const c = buildingCost(b);
        if(energy >= c){
          energy -= c;
          b.owned++;
          recalcPerSec();
          render();
        }
      });
      buildingRowEls[b.id] = {
        row: el,
        costEl: el.querySelector('.itemCost'),
        ownedEl: el.querySelector('.itemOwned')
      };
      buildingsWrap.appendChild(el);
    });

    const upgradesWrap = document.createElement('div');
    upgradesWrap.id = 'upgradesWrap';
    upgradesWrap.style.display = 'none';
    upgrades.forEach(u=>{
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div class="itemIcon">${u.icon}</div>
        <div class="itemInfo">
          <div class="itemName">${u.name}</div>
          <div class="itemDesc">${u.desc}</div>
        </div>
        <div class="itemRight">
          <div class="itemCost"></div>
        </div>
      `;
      el.addEventListener('click', ()=>{
        if(!u.applied && energy >= u.cost){
          energy -= u.cost;
          u.applied = true;
          u.effect();
          recalcPerSec();
          render();
        }
      });
      upgradeRowEls[u.id] = {
        row: el,
        costEl: el.querySelector('.itemCost')
      };
      upgradesWrap.appendChild(el);
    });

    listEl.appendChild(buildingsWrap);
    listEl.appendChild(upgradesWrap);
    shopBuilt = true;
  }

  function updateShop(){
    if(!shopBuilt) buildShop();

    buildings.forEach(b=>{
      const cost = buildingCost(b);
      const refs = buildingRowEls[b.id];
      const canAfford = energy >= cost;
      refs.row.classList.toggle('disabled', !canAfford);
      refs.costEl.textContent = fmt(cost);
      refs.ownedEl.textContent = 'owned: ' + b.owned;
    });

    upgrades.forEach(u=>{
      const refs = upgradeRowEls[u.id];
      const canAfford = energy >= u.cost && !u.applied;
      refs.row.classList.toggle('disabled', !canAfford && !u.applied);
      refs.costEl.textContent = u.applied ? 'OWNED' : fmt(u.cost);
    });
  }

  document.querySelectorAll('.tabBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      if(!shopBuilt) buildShop();
      document.getElementById('buildingsWrap').style.display = currentTab === 'buildings' ? '' : 'none';
      document.getElementById('upgradesWrap').style.display = currentTab === 'upgrades' ? '' : 'none';
    });
  });

  function spawnFloater(x, y, amount){
    const f = document.createElement('div');
    f.className = 'floater';
    f.textContent = '+' + fmt(amount);
    f.style.left = x + 'px';
    f.style.top = y + 'px';
    document.getElementById('clickzone').appendChild(f);
    setTimeout(()=> f.remove(), 900);
  }

  canWrap.addEventListener('click', (e)=>{
    energy += clickPower;
    const rect = canWrap.getBoundingClientRect();
    spawnFloater(e.clientX - rect.left + 60, e.clientY - rect.top, clickPower);
    render();
    counterEl.classList.add('pulse');
    setTimeout(()=> counterEl.classList.remove('pulse'), 120);
  });

  setInterval(()=>{
    if(perSec > 0){
      energy += perSec / 10;
      render();
    }
  }, 100);

  setInterval(saveGame, 3000);
  window.addEventListener('beforeunload', saveGame);

  loadGame();
  recalcPerSec();
  render();
})();
</script>
</body>
</html>
