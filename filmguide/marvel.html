  function renderFilterChips() {
    const uKey = View.uKey;
    const uni = UNIVERSES[uKey];
    const all = MOVIES[uKey];
    const seenCount = all.filter((m) => Store.isWatched(uKey, m.id)).length;
    const released = releasedMovies(uKey).length;
    const f = View.filter;

    const chip = (key, label, count, active) =>
      `<button type="button" class="chip ${active ? "is-active" : ""}" data-filter="${esc(key)}" aria-pressed="${active}">${label} <span class="chip__count">${count}</span></button>`;

    let html = chip("all", "Alle", all.length, f.type === "all");
    html += chip("unseen", "○ Ikke set", released - seenCount, f.type === "unseen");
    html += chip("seen", "✓ Set", seenCount, f.type === "seen");
    html += uni.groups
      .map((g) => {
        const c = uni.groupBy === "continuity" ? CONTINUITIES[g] : null;
        const label = c ? `${c.swatch} ${esc(c.label.replace(/^Transformers – |^Separat univers – /, ""))}` : esc(g);
        const count = all.filter((m) => groupOf(uKey, m) === g).length;
        const active = f.type === "group" && f.groups.length === 1 && f.groups[0] === g;
        return chip("g:" + g, label, count, active);
      })
      .join("");
    $("#filter-chips").innerHTML = html;
  }

  /** Byg filmlisten ud fra visning, filter og søgning */
  function renderMovieList(animate) {
    const uKey = View.uKey;
    const uni = UNIVERSES[uKey];
    const ordered = sortedMovies(uKey, View.view);
    const next = nextMovie(uKey);
    const q = View.query;

    const visible = ordered.filter((m) => {
      const f = View.filter;
      if (f.type === "seen" && !Store.isWatched(uKey, m.id)) return false;
      if (f.type === "unseen" && (Store.isWatched(uKey, m.id) || m.upcoming)) return false;
      if (f.type === "group" && !f.groups.includes(groupOf(uKey, m))) return false;
      if (q) {
        const hay = [m.title, m.year, m.phase, ...(m.characters || []), ...(m.links || [])].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (!visible.length) {
      $("#movie-list").innerHTML = `<div class="empty"><div class="empty__icon">🔍</div>Ingen film matcher dit filter${
        q ? ` eller din søgning "<strong>${esc(q)}</strong>"` : ""
      }.<br><button type="button" class="btn btn--ghost btn--sm" style="margin-top:14px" data-filter="all" data-clear-search>Vis alle film</button></div>`;
      return;
    }

    let html = "";
    let prev = null;
    visible.forEach((m) => {
      html += dividerHTML(uKey, uni, m, prev);
      const num = ordered.indexOf(m) + 1;
      html += movieCardHTML(uKey, m, num, View.view, next && next.id === m.id);
      prev = m;
    });
    $("#movie-list").innerHTML = html;
    observeReveal(animate);
  }

  /** Overskrifter mellem grupper i listen (faser / universskift) */
  function dividerHTML(uKey, uni, m, prev) {
    const view = View.view;
    const cont = continuityOf(m);

    // Universvisning: gruppér efter kontinuitet
    if (view === "universes") {
      if (prev && prev.continuity === m.continuity) return "";
      return `<div class="list-divider"><span class="list-divider__label"><span class="dot" style="--c:${cont.color}"></span>${esc(cont.label)}</span><span class="list-divider__line"></span></div>
        <p class="list-divider__desc">${esc(cont.description)}</p>`;
    }

    // Tidslinje-afsnit (fx Marvel) i anbefalet visning
    if (view === "recommended" && uni.eras) {
      const eraOf = (x) => uni.eras.filter((e) => x.recommendedOrder >= e.from).pop();
      const era = eraOf(m);
      if (!era || (prev && eraOf(prev) === era)) return "";
      return `<div class="list-divider"><span class="list-divider__label">${esc(era.label)}</span><span class="list-divider__line"></span></div>
        ${era.desc ? `<p class="list-divider__desc">${esc(era.desc)}</p>` : ""}`;
    }

    // Faser (Marvel) i anbefalet- og udgivelsesvisning
    if (uni.groupBy === "phase" && view !== "chronological") {
      if (prev && prev.phase === m.phase) return "";
      const info = (uni.groupInfo || {})[m.phase] || "";
      return `<div class="list-divider"><span class="list-divider__label">🎞 ${esc(m.phase)}</span><span class="list-divider__line"></span></div>
        ${info ? `<p class="list-divider__desc">${esc(info)}</p>` : ""}`;
    }

    // Kontinuitetsskift (Transformers) i anbefalet visning
    if (uni.groupBy === "continuity" && view === "recommended") {
      if (prev && prev.continuity === m.continuity) return "";
      const isSwitch = Boolean(prev);
      return `<div class="list-divider ${isSwitch ? "list-divider--switch" : ""}"><span class="list-divider__label">${
        isSwitch ? "⚡ Nyt univers:" : "▶ Start:"
      } <span class="dot" style="--c:${cont.color}"></span>${esc(cont.label)}</span><span class="list-divider__line"></span></div>
        <p class="list-divider__desc">${esc(cont.description)}${isSwitch ? " Historien starter forfra her." : ""}</p>`;
    }
    return "";
  }

  /** Scroll til et filmkort og få det til at lyse op */
  function gotoCard(id) {
    let card = document.getElementById("film-" + id);
    if (!card && View.uKey) {
      // Filmen er skjult af et filter → nulstil filter og søgning
      View.filter = { type: "all" };
      View.query = "";
      const s = $("#search");
      if (s) s.value = "";
      refreshUniverse();
      card = document.getElementById("film-" + id);
    }
    if (!card) return;
    card.classList.add("is-visible");
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.remove("flash");
    void card.offsetWidth; // genstart animation
    card.classList.add("flash");
  }

  /* ======================================================================
     9) PROFILSIDE – "Min Film-Profil"
     ====================================================================== */
  function renderProfile() {
    const app = $("#progression");
    if (!app) return;
    const total = totalProgress();

    const uniCards = universeKeys()
      .map((k) => {
        const u = UNIVERSES[k];
        const p = progressFor(k);
        const next = nextMovie(k);
        const groups = u.groups
          .map((g) => {
            const gp = progressFor(k, (m) => groupOf(k, m) === g);
            if (!gp.total) return "";
            return `<div style="display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:10px;align-items:center;font-size:.8rem;color:var(--text-2)">
              <span>${esc(groupLabel(k, g).replace(/^Transformers – |^Separat univers – /, ""))}</span>${meterHTML(gp.pct, "meter--sm")}<span>${gp.seen}/${gp.total}</span></div>`;
          })
          .join("");
        return `<div class="glass stat-card reveal" style="--g:${u.gradient};--accent:${u.accent}">
          <div class="stat-card__head">
            <div class="stat-card__name"><span style="font-size:1.6rem">${u.icon}</span>${esc(u.shortName)}</div>
            <div class="stat-card__pct">${p.pct}%</div>
          </div>
          <div class="stat-card__count"><strong>${p.seen} / ${p.total}</strong> set</div>
          ${meterHTML(p.pct, "meter--lg")}
          <div style="display:grid;gap:8px;margin-top:18px">${groups}</div>
          <div class="stat-card__extra">
            <span>${next ? `Næste: <strong style="color:var(--text)">${esc(next.title)}</strong>` : "🏆 Alle film set!"}</span>
            <a class="btn btn--ghost btn--sm" href="${esc(u.page)}">Åbn ${esc(u.shortName)} →</a>
          </div>
        </div>`;
      })
      .join("");

    // Senest sete film
    const recent = [];
    universeKeys().forEach((k) =>
      MOVIES[k].forEach((m) => {
        const ts = Store.watchedAt(k, m.id);
        if (ts) recent.push({ k, m, ts });
      })
    );
    recent.sort((a, b) => b.ts - a.ts);

    const recentHTML = recent.length
      ? recent
          .slice(0, 10)
          .map(
            ({ k, m, ts }) => `<button type="button" class="recent-item" data-open="${esc(m.id)}" data-uni="${k}">
              ${posterHTML(m, k)}
              <div><div class="recent-item__title">${esc(m.title)}</div><div class="recent-item__sub">${esc(UNIVERSES[k].shortName)} · ${m.year}</div></div>
              <div class="recent-item__date">✓ ${esc(fmtWatchedAt(ts))}</div>
            </button>`
          )
          .join("")
      : `<div class="empty"><div class="empty__icon">🍿</div>Du har ikke markeret nogen film som set endnu.<br>
          <a class="btn btn--primary btn--sm" style="margin-top:14px" href="#universer">Find din første film</a></div>`;

    app.innerHTML = `
      <section class="container section--tight">
        <div class="section__kicker">Min progression</div>
        <h2 class="section__title">Min Film-Profil</h2>
        <p class="section__sub">Din progression gemmes automatisk i din browser – du kan lukke siden og komme tilbage senere.</p>
      </section>

      <section class="container section--tight">
        <div class="glass stat-card stat-card--total reveal" style="display:flex;flex-wrap:wrap;gap:28px;align-items:center">
          <div class="ring" style="--p:${total.pct}"><div class="ring__inner">${total.pct}%</div></div>
          <div style="flex:1;min-width:220px">
            <div class="section__kicker">Alle film</div>
            <div class="stat-card__count" style="margin:6px 0 12px"><strong>${total.seen} / ${total.total}</strong> film set</div>
            ${meterHTML(total.pct, "meter--lg")}
          </div>
          <button type="button" class="btn btn--primary" data-next="">🎬 Hvad skal jeg se nu?</button>
        </div>
      </section>

      <section class="container section--tight">
        <div class="stats-grid">${uniCards}</div>
      </section>

      <section class="container section">
        <div class="section__head"><div><div class="section__kicker">Historik</div><h2 class="section__title">Senest sete film</h2></div></div>
        <div class="recent-list">${recentHTML}</div>
        <div style="margin-top:40px;text-align:center">
          <button type="button" class="reset-btn" data-reset>Nulstil min progression</button>
        </div>
      </section>`;
    observeReveal(true);
  }

  /* ======================================================================
     10) GLOBALE KLIK, ANIMATIONER & OPSTART
     ====================================================================== */
  let revealObserver = null;
  function observeReveal(animate) {
    const els = $$(".reveal:not(.is-visible)");
    if (!animate || !("IntersectionObserver" in window)) {
      els.forEach((el) => el.classList.add("is-visible"));
      return;
    }
    if (!revealObserver) {
      revealObserver = new IntersectionObserver(
        (entries) =>
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("is-visible");
              revealObserver.unobserve(e.target);
            }
          }),
        { rootMargin: "0px 0px -40px 0px", threshold: 0.05 }
      );
    }
    els.forEach((el) => revealObserver.observe(el));
  }

  /** Opdater alt på den aktuelle side efter en ændring (set / reset) */
  function refreshPage() {
    const page = document.body.dataset.page;
    if (page === "home") {
      renderHome();
      renderProfile();
      observeReveal(false);
    } else if (page === "universe" && View.uKey) {
      refreshUniverse();
    }
    // Hold et åbent detaljevindue opdateret
    if (Modal.isOpen() && Modal.current && Modal.current.type === "movie") {
      openMovie(Modal.current.uKey, Modal.current.id, { keepScroll: true });
    }
  }

  function handleToggleWatched(btn) {
    const uKey = btn.dataset.uni;
    const id = btn.dataset.watch;
    const m = MOVIES[uKey].find((x) => x.id === id);
    const nowWatched = Store.toggleWatched(uKey, id);
    refreshPage();

    // Lille "pop" på den nye knap
    $$(`[data-watch="${CSS.escape(id)}"]`).forEach((b) => b.classList.add("pop"));

    if (nowWatched) {
      const n = nextMovie(uKey);
      toast(`✓ ${m.title} er markeret som set${n ? ` · Næste: ${n.title}` : " · 🏆 Alle film set!"}`);
    } else {
      toast(`○ ${m.title} er markeret som ikke set`);
    }
  }

  function revealSpoiler(el) {
    el.classList.add("is-revealed");
    el.removeAttribute("role");
    el.removeAttribute("tabindex");
  }

  function bindGlobalEvents() {
    document.addEventListener("click", (e) => {
      const t = e.target;

      // Spoiler – klik for at vise (må ikke åbne kortet)
      const sp = t.closest(".spoiler");
      if (sp && !sp.classList.contains("is-revealed") && !Store.spoilers) {
        e.stopPropagation();
        revealSpoiler(sp);
        return;
      }

      const closeBtn = t.closest("[data-close]");
      if (closeBtn) return Modal.close();

      const watchBtn = t.closest("[data-watch]");
      if (watchBtn) return handleToggleWatched(watchBtn);

      const openBtn = t.closest("[data-open]");
      if (openBtn) return openMovie(openBtn.dataset.uni, openBtn.dataset.open);

      const nextBtn = t.closest("[data-next]");
      if (nextBtn) return openNext(nextBtn.dataset.next || null);

      const gotoBtn = t.closest("[data-goto]");
      if (gotoBtn) {
        Modal.close();
        return gotoCard(gotoBtn.dataset.goto);
      }

      if (t.closest("[data-reset]")) return openResetConfirm();

      if (t.closest("[data-confirm-reset]")) {
        Store.resetProgress();
        Modal.close();
        refreshPage();
        return toast("Din progression er nulstillet");
      }

      const spoilerToggle = t.closest("[data-spoiler-toggle]");
      if (spoilerToggle) {
        Store.spoilers = !Store.spoilers;
        $$(".spoiler.is-revealed").forEach((s) => s.classList.remove("is-revealed"));
        applySpoilerState();
        return toast(Store.spoilers ? "⚠️ Spoilere er slået TIL" : "🔒 Spoilere er slået FRA");
      }

      // ----- Kun på universsider -----
      const viewBtn = t.closest("[data-view]");
      if (viewBtn && View.uKey) {
        View.view = viewBtn.dataset.view;
        Store.setPref(View.uKey, "view", View.view);
        refreshUniverse();
        return;
      }

      const filterBtn = t.closest("[data-filter]");
      if (filterBtn && View.uKey) {
        const key = filterBtn.dataset.filter;
        if (key.startsWith("g:")) View.filter = { type: "group", groups: [key.slice(2)] };
        else View.filter = { type: key };
        if (filterBtn.hasAttribute("data-clear-search")) {
          View.query = "";
          $("#search").value = "";
        }
        refreshUniverse();
        return;
      }

      const tl = t.closest("[data-timeline]");
      if (tl && View.uKey) {
        const item = UNIVERSES[View.uKey].timeline[Number(tl.dataset.timeline)];
        const groups = [].concat(item.filter);
        const isActive = View.filter.type === "group" && sameGroups(View.filter.groups, groups);
        View.filter = isActive ? { type: "all" } : { type: "group", groups };
        refreshUniverse();
        $("#film-liste").scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }

      // Klik på selve filmkortet åbner detaljevinduet
      const card = t.closest("[data-card]");
      if (card && !t.closest("a, button, input")) {
        openMovie(card.dataset.uni, card.dataset.card);
      }
    });

    // Tastatur: Enter/mellemrum på spoilere
    document.addEventListener("keydown", (e) => {
      const sp = e.target.closest && e.target.closest(".spoiler[role=button]");
      if (sp && (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        revealSpoiler(sp);
      }
    });
  }

  function init() {
    if (typeof MOVIES === "undefined" || typeof UNIVERSES === "undefined") {
      console.error("movies.js er ikke indlæst før app.js");
      return;
    }
    Store.load();
    renderNav();
    renderFooter();
    applySpoilerState();
    Modal.init();
    bindGlobalEvents();

    const page = document.body.dataset.page;
    if (page === "home") {
      renderHome();
      renderProfile();
    } else if (page === "universe") {
      renderUniversePage();
    }
    observeReveal(true);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

  </script>
</body>
