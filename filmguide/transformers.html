/* ==========================================================================
   GREJS FILM GUIDE – STYLESHEET
   Mørkt, moderne tema inspireret af streamingtjenester.
   Indhold: 1) Tokens  2) Basis  3) Navigation  4) Knapper  5) Hero/forside
            6) Sektioner & info  7) Tidslinje  8) Filtre & søgning
            9) Progress  10) Filmkort  11) Spoilere  12) Modal
            13) Profil  14) Footer & toast  15) Animationer  16) Responsiv
   ========================================================================== */

/* ---------- 1) Design tokens ---------- */
:root {
  --bg: #07080d;
  --bg-2: #0d0f17;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-2: rgba(255, 255, 255, 0.07);
  --surface-solid: #12141e;
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.18);
  --text: #f2f3f7;
  --text-2: #b4b8c8;
  --text-3: #7d8296;
  --brand: #ff5a4e;
  --brand-2: #ff9a3d;
  --ok: #3ddc97;
  --ok-bg: rgba(61, 220, 151, 0.12);
  --warn: #ffc857;
  --accent: var(--brand); /* overskrives pr. univers */
  --accent-ink: #fff;     /* tekstfarve oven på accentfarven */
  --radius-sm: 10px;
  --radius: 18px;
  --radius-lg: 26px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.6);
  --nav-h: 68px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Bebas Neue", "Inter", sans-serif;
  color-scheme: dark;
}

/* ---------- 2) Basis ---------- */
*,
*::before,
*::after { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 80px); }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}

/* Diskret baggrundsglød */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(900px 500px at 10% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
    radial-gradient(700px 500px at 100% 0%, rgba(90, 110, 255, 0.12), transparent 70%),
    var(--bg);
}

body.modal-open { overflow: hidden; }

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
p { margin: 0; }

.container { width: min(1280px, 100% - 32px); margin-inline: auto; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* ---------- 3) Navigation ---------- */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--nav-h);
  background: rgba(7, 8, 13, 0.72);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--border);
}
.nav__inner { height: 100%; display: flex; align-items: center; gap: 18px; }

.nav__back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.82rem; font-weight: 600; color: var(--text-2);
  transition: all 0.25s var(--ease);
  white-space: nowrap;
}
.nav__back:hover { color: var(--text); border-color: var(--border-strong); transform: translateX(-2px); }

.nav__logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  font-size: 1.6rem; letter-spacing: 0.06em;
  white-space: nowrap;
}
.nav__logo-mark {
  display: grid; place-items: center;
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  font-size: 1.1rem;
  box-shadow: 0 6px 20px rgba(255, 90, 78, 0.35);
}

.nav__links { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.nav__link {
  padding: 8px 14px; border-radius: 999px;
  font-size: 0.92rem; font-weight: 500; color: var(--text-2);
  transition: color 0.2s, background 0.2s;
}
.nav__link:hover { color: var(--text); background: var(--surface-2); }
.nav__link.is-active { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }

/* Spoiler-kontakt */
.spoiler-toggle {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 6px 8px 6px 14px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 0.82rem; font-weight: 600;
  white-space: nowrap;
}
.spoiler-toggle__track {
  position: relative; width: 40px; height: 22px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  transition: background 0.25s var(--ease);
}
.spoiler-toggle__track::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff;
  transition: transform 0.25s var(--ease);
}
.spoiler-toggle[aria-checked="true"] .spoiler-toggle__track { background: var(--warn); }
.spoiler-toggle[aria-checked="true"] .spoiler-toggle__track::after { transform: translateX(18px); }
.spoiler-toggle__state { color: var(--text-3); }
.spoiler-toggle[aria-checked="true"] .spoiler-toggle__state { color: var(--warn); }

.nav__burger {
  display: none;
  width: 42px; height: 42px; margin-left: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  position: relative;
}
.nav__burger span,
.nav__burger span::before,
.nav__burger span::after {
  position: absolute; left: 50%; width: 18px; height: 2px; border-radius: 2px;
  background: var(--text); transform: translateX(-50%);
  transition: transform 0.3s var(--ease), opacity 0.2s;
}
.nav__burger span { top: 50%; margin-top: -1px; }
.nav__burger span::before,
.nav__burger span::after { content: ""; left: 0; transform: none; }
.nav__burger span::before { top: -6px; }
.nav__burger span::after { top: 6px; }
.nav.is-open .nav__burger span { background: transparent; }
.nav.is-open .nav__burger span::before { transform: translateY(6px) rotate(45deg); }
.nav.is-open .nav__burger span::after { transform: translateY(-6px) rotate(-45deg); }

/* ---------- 4) Knapper ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 600; font-size: 0.95rem;
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s, border-color 0.25s, color 0.25s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0) scale(0.98); }
.btn--primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: #fff;
  box-shadow: 0 10px 30px rgba(255, 90, 78, 0.35);
}
.btn--primary:hover { box-shadow: 0 14px 40px rgba(255, 90, 78, 0.5); }
.btn--accent {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 40%, transparent);
}
.btn--ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn--ghost:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn--danger { background: #d9433a; color: #fff; }
.btn--danger:hover { background: #e8544a; }
.btn--sm { padding: 8px 14px; font-size: 0.85rem; }
.btn--block { width: 100%; }

/* Set / ikke set-knap */
.watch-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: transparent;
  font-weight: 600; font-size: 0.88rem;
  color: var(--text-2);
  transition: all 0.25s var(--ease);
}
.watch-btn:hover { color: var(--text); border-color: var(--text-2); }
.watch-btn__icon {
  display: grid; place-items: center;
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid currentColor;
  font-size: 0.7rem; line-height: 1;
  transition: all 0.25s var(--ease);
}
.watch-btn.is-watched { background: var(--ok-bg); border-color: rgba(61, 220, 151, 0.5); color: var(--ok); }
.watch-btn.is-watched .watch-btn__icon { background: var(--ok); border-color: var(--ok); color: #05150e; }
.watch-btn.pop { animation: pop 0.4s var(--ease); }

/* ---------- 5) Hero / forside ---------- */
.hero {
  position: relative;
  padding: clamp(64px, 12vw, 140px) 0 clamp(48px, 8vw, 90px);
  overflow: hidden;
}
.hero__glow {
  position: absolute; inset: -20% -10% auto; height: 120%;
  background:
    radial-gradient(40% 50% at 25% 40%, rgba(255, 90, 78, 0.35), transparent 70%),
    radial-gradient(35% 45% at 75% 30%, rgba(75, 143, 229, 0.32), transparent 70%),
    radial-gradient(30% 40% at 55% 80%, rgba(162, 116, 229, 0.22), transparent 70%);
  filter: blur(30px);
  animation: drift 18s ease-in-out infinite alternate;
  z-index: -1;
}
.hero__grid {
  position: absolute; inset: 0; z-index: -1;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 75%);
}
.hero__eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-2);
  backdrop-filter: blur(10px);
}
.hero__title {
  margin-top: 22px;
  font-size: clamp(2.6rem, 7.5vw, 5.8rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  max-width: 14ch;
}
.hero__title .grad {
  background: linear-gradient(100deg, #fff 10%, var(--brand-2) 45%, var(--brand) 70%, #b77bff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero__sub { margin-top: 20px; max-width: 58ch; font-size: clamp(1.05rem, 2vw, 1.25rem); color: var(--text-2); }
.hero__actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
.hero__stats { margin-top: 44px; display: flex; flex-wrap: wrap; gap: 28px; color: var(--text-3); font-size: 0.9rem; }
.hero__stats strong { display: block; font-family: var(--font-display); font-size: 2.2rem; color: var(--text); letter-spacing: 0.03em; line-height: 1; }

/* Universkort på forsiden */
.universe-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 24px; }
.universe-card {
  position: relative;
  display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 360px;
  padding: 32px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  isolation: isolate;
  box-shadow: var(--shadow);
  transition: transform 0.45s var(--ease), box-shadow 0.45s var(--ease);
}
.universe-card__bg { position: absolute; inset: 0; z-index: -2; transition: transform 0.8s var(--ease); }
.universe-card::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, transparent 15%, rgba(5, 6, 10, 0.88) 90%);
}
.universe-card__icon {
  position: absolute; right: -10px; top: -20px; z-index: -1;
  font-size: 12rem; opacity: 0.22; filter: saturate(0.6);
  transition: transform 0.8s var(--ease);
}
.universe-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.universe-card:hover .universe-card__bg { transform: scale(1.06); }
.universe-card:hover .universe-card__icon { transform: rotate(-8deg) scale(1.08); }
.universe-card__kicker { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.25em; opacity: 0.85; }
.universe-card__title { margin-top: 4px; font-size: clamp(1.8rem, 3.5vw, 2.5rem); font-weight: 800; }
.universe-card__text { margin-top: 10px; color: rgba(255, 255, 255, 0.82); max-width: 42ch; }
.universe-card__footer { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.universe-card__cta {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.95); color: #0b0c12;
  font-weight: 700; font-size: 0.92rem;
  transition: transform 0.3s var(--ease);
}
.universe-card:hover .universe-card__cta { transform: translateX(4px); }
.universe-card__progress { min-width: 160px; flex: 1; max-width: 240px; font-size: 0.8rem; color: rgba(255, 255, 255, 0.8); }

/* Kommer-snart-kort */
.soon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.soon-card {
  position: relative;
  padding: 22px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  min-height: 130px;
  display: flex; flex-direction: column; justify-content: flex-end;
  transition: transform 0.3s var(--ease), border-color 0.3s;
}
.soon-card:hover { transform: translateY(-3px); border-color: var(--border-strong); }
.soon-card__bg { position: absolute; inset: 0; z-index: -1; opacity: 0.55; }
.soon-card__icon { font-size: 2rem; }
.soon-card__name { margin-top: 8px; font-weight: 700; }
.soon-card__tag {
  position: absolute; top: 12px; right: 12px;
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.45); color: var(--text-2);
}

/* "Fortsæt hvor du slap" */
.continue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; }
.continue-card {
  display: flex; gap: 16px; align-items: center;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(12px);
  transition: border-color 0.3s, transform 0.3s var(--ease);
  text-align: left;
  width: 100%;
}
.continue-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.continue-card .poster { width: 72px; flex: none; }
.continue-card__label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
.continue-card__title { font-weight: 700; font-size: 1.05rem; margin-top: 2px; }
.continue-card__meta { font-size: 0.85rem; color: var(--text-2); margin-top: 2px; }

/* ---------- 6) Sektioner & info-bokse ---------- */
.section { padding: clamp(40px, 7vw, 80px) 0; }
.section--tight { padding: 28px 0; }
.section__head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.section__kicker { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.section__title { font-size: clamp(1.7rem, 3.8vw, 2.6rem); font-weight: 800; margin-top: 6px; }
.section__sub { color: var(--text-2); max-width: 64ch; margin-top: 8px; }

.page-hero { padding: clamp(40px, 7vw, 80px) 0 24px; position: relative; }
.page-hero__crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.85rem; color: var(--text-3); }
.page-hero__crumbs a:hover { color: var(--text); }
.page-hero__title { margin-top: 14px; font-size: clamp(2.2rem, 6vw, 4.2rem); font-weight: 800; letter-spacing: -0.035em; }
.page-hero__title span { color: var(--accent); }
.page-hero__intro {
  margin-top: 18px; max-width: 70ch;
  padding: 16px 20px;
  border-left: 3px solid var(--accent);
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 12%, transparent), transparent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text);
  font-size: 1.05rem;
}

.glass {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
}

.why-box { padding: clamp(20px, 3vw, 32px); }
.why-box__head { display: flex; align-items: center; gap: 12px; }
.why-box__head h2 { font-size: 1.4rem; }
.why-box__icon {
  display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px;
  background: color-mix(in srgb, var(--accent) 22%, transparent); font-size: 1.2rem;
}
.why-box__grid { margin-top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.why-option {
  position: relative;
  text-align: left;
  padding: 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.02);
  transition: all 0.3s var(--ease);
}
.why-option:hover { border-color: var(--border-strong); background: var(--surface-2); }
.why-option h3 { font-size: 1.02rem; display: flex; align-items: center; gap: 8px; }
.why-option p { margin-top: 8px; font-size: 0.9rem; color: var(--text-2); }
.why-option.is-active {
  border-color: color-mix(in srgb, var(--accent) 70%, transparent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), 0 10px 30px color-mix(in srgb, var(--accent) 15%, transparent);
}
.why-option__tag {
  position: absolute; top: -10px; right: 14px;
  font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
}
.why-box__note { margin-top: 16px; font-size: 0.88rem; color: var(--text-3); }

/* Univers-farvesystem (legende) */
.legend { display: flex; flex-wrap: wrap; gap: 10px; }
.legend__item {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  font-size: 0.8rem; font-weight: 600;
  background: var(--surface); border: 1px solid var(--border);
}
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--accent)); flex: none; box-shadow: 0 0 10px var(--c, var(--accent)); }

/* Univers-forklaringer (Transformers) */
.continuity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; margin-top: 18px; }
.continuity-card {
  padding: 18px; border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 14%, transparent), transparent 70%);
  border-top: 3px solid var(--c);
}
.continuity-card h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; }
.continuity-card p { margin-top: 8px; font-size: 0.88rem; color: var(--text-2); }
.continuity-card__films { margin-top: 10px; font-size: 0.8rem; color: var(--text-3); }

/* ---------- 7) Tidslinje ---------- */
.timeline {
  display: flex; align-items: stretch; gap: 0;
  overflow-x: auto;
  padding: 6px 2px 14px;
  scrollbar-width: thin;
}
.timeline__step { display: flex; align-items: center; flex: none; }
.timeline__step:not(:last-child)::after {
  content: "→";
  padding: 0 8px;
  color: var(--text-3);
  font-size: 1.1rem;
}
.timeline__node {
  min-width: 128px;
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all 0.3s var(--ease);
}
.timeline__node:hover { transform: translateY(-3px); border-color: var(--border-strong); }
.timeline__node strong { display: block; font-size: 0.98rem; }
.timeline__node small { display: block; color: var(--text-3); font-size: 0.78rem; margin-top: 2px; }
.timeline__bar { margin-top: 10px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.timeline__bar span { display: block; height: 100%; background: var(--ok); border-radius: 4px; transition: width 0.6s var(--ease); }
.timeline__node--saga {
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 25%, transparent), color-mix(in srgb, var(--accent) 5%, transparent));
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
}
.timeline__node.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 30px color-mix(in srgb, var(--accent) 25%, transparent); }

/* ---------- 8) Filtre & søgning ---------- */
.toolbar { display: flex; flex-direction: column; gap: 14px; }
.toolbar__row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

.segmented {
  display: inline-flex; padding: 4px; gap: 4px;
  border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border);
  max-width: 100%; overflow-x: auto;
}
.segmented button {
  padding: 8px 16px; border-radius: 999px; border: 0; background: transparent;
  font-size: 0.88rem; font-weight: 600; color: var(--text-2);
  white-space: nowrap;
  transition: all 0.25s var(--ease);
}
.segmented button:hover { color: var(--text); }
.segmented button.is-active { background: var(--text); color: #0b0c12; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.85rem; font-weight: 500; color: var(--text-2);
  transition: all 0.2s var(--ease);
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.is-active { color: #fff; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 25%, transparent); }
.chip__count { font-size: 0.72rem; opacity: 0.7; }

.search { position: relative; flex: 1; min-width: 220px; max-width: 380px; }
.search input {
  width: 100%;
  padding: 11px 16px 11px 42px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font: inherit; font-size: 0.92rem;
  transition: border-color 0.2s, background 0.2s;
}
.search input::placeholder { color: var(--text-3); }
.search input:focus { outline: none; border-color: var(--accent); background: var(--surface-2); }
.search__icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 0.95rem; opacity: 0.7; pointer-events: none; }

/* ---------- 9) Progress ---------- */
.progress-bar {
  position: sticky; top: var(--nav-h); z-index: 40;
  background: rgba(7, 8, 13, 0.8);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.progress-bar__inner { display: flex; align-items: center; gap: 18px; padding: 12px 0; }
.progress-bar__label { font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
.progress-bar__label small { display: block; color: var(--text-3); font-weight: 500; font-size: 0.78rem; }
.progress-bar__meter { flex: 1; }
.progress-bar__pct { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: 0.03em; min-width: 3.4ch; text-align: right; }

.meter { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; position: relative; }
.meter__fill {
  height: 100%; width: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #ffd36b));
  transition: width 0.8s var(--ease);
  position: relative;
}
.meter__fill::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  animation: shimmer 2.6s infinite;
}
.meter--sm { height: 6px; }
.meter--lg { height: 14px; }

/* ---------- 10) Filmkort ---------- */
.movie-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 22px; }

.list-divider {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  margin-top: 18px;
}
.list-divider:first-child { margin-top: 0; }
.list-divider__label {
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
  font-weight: 800; font-size: 1.25rem;
}
.list-divider__line { min-width: 24px; }
.list-divider__line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-strong), transparent); }
.list-divider__desc { grid-column: 1 / -1; margin-top: -10px; color: var(--text-2); font-size: 0.92rem; max-width: 80ch; }
.list-divider--switch .list-divider__label { color: var(--warn); }

.movie-card {
  --c: var(--accent);
  position: relative;
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 22px;
  padding: 20px;
  border-radius: var(--radius-lg);
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015));
  border: 1px solid var(--border);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  cursor: pointer;
  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), border-color 0.4s, opacity 0.4s;
  overflow: hidden;
  isolation: isolate;
}
.movie-card::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(500px 220px at 0% 0%, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%);
  opacity: 0.8; transition: opacity 0.4s;
}
.movie-card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--c) 45%, var(--border)); box-shadow: var(--shadow-lg); }
.movie-card:hover::before { opacity: 1; }

.movie-card__num {
  position: absolute; top: 10px; right: 18px;
  font-family: var(--font-display);
  font-size: 4.2rem; line-height: 1;
  color: rgba(255, 255, 255, 0.07);
  letter-spacing: 0.02em;
  pointer-events: none;
  transition: color 0.4s;
}
.movie-card:hover .movie-card__num { color: color-mix(in srgb, var(--c) 35%, transparent); }

.movie-card__body { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.movie-card__top { padding-right: 70px; }
.movie-card__order { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
.movie-card__title { font-size: 1.4rem; font-weight: 800; margin-top: 3px; }

.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta__item {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.78rem; font-weight: 500;
  padding: 4px 9px; border-radius: 8px;
  background: rgba(255, 255, 255, 0.06); color: var(--text-2);
}
.meta__item--universe { background: color-mix(in srgb, var(--c) 18%, transparent); color: #fff; }
.meta__item--soon { background: rgba(255, 200, 87, 0.18); color: var(--warn); }

.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.74rem; font-weight: 600;
  padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--text-2);
  background: rgba(0, 0, 0, 0.2);
}
.badge--story { border-color: rgba(255, 200, 87, 0.4); color: #ffd98a; }
.badge--universe { border-color: rgba(255, 120, 80, 0.45); color: #ffab8a; }
.badge--connector { border-color: rgba(120, 180, 255, 0.4); color: #a9cdff; }
.badge--info { border-color: rgba(255, 160, 60, 0.45); color: #ffc58a; }
.badge--long { border-color: rgba(190, 150, 255, 0.4); color: #d0b6ff; }

.movie-card__desc { color: var(--text-2); font-size: 0.93rem; }

.why-here {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--c) 9%, rgba(255, 255, 255, 0.03));
  border: 1px solid color-mix(in srgb, var(--c) 22%, transparent);
  font-size: 0.9rem;
}
.why-here strong { display: block; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: color-mix(in srgb, var(--c) 60%, #fff); margin-bottom: 4px; }

.info-row { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 0.86rem; }
.info-row dt { color: var(--text-3); font-weight: 600; white-space: nowrap; }
.info-row dd { margin: 0; color: var(--text-2); }
.tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 0.78rem; padding: 2px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); color: var(--text-2); }
.conn-link { color: var(--text); font-weight: 500; border-bottom: 1px dashed var(--border-strong); background: none; border-top: 0; border-left: 0; border-right: 0; padding: 0; font-size: inherit; }
.conn-link:hover { color: var(--accent); border-color: var(--accent); }

.post-credit {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: rgba(255, 200, 87, 0.07);
  border: 1px dashed rgba(255, 200, 87, 0.3);
  font-size: 0.86rem;
}
.post-credit__icon { font-size: 1.1rem; line-height: 1.3; }
.post-credit strong { color: var(--warn); }
.post-credit--none { background: rgba(255, 255, 255, 0.03); border-color: var(--border); color: var(--text-3); }
.post-credit--none strong { color: var(--text-2); }

.watch-first { font-size: 0.85rem; padding: 10px 12px; border-radius: var(--radius-sm); background: rgba(255, 160, 60, 0.07); border: 1px solid rgba(255, 160, 60, 0.25); }
.watch-first strong { color: #ffc58a; }
.watch-first ul { margin: 4px 0 0; padding-left: 18px; color: var(--text-2); }

.movie-card__actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: auto; padding-top: 4px; }

/* Set-tilstand */
.movie-card.is-watched { border-color: rgba(61, 220, 151, 0.35); }
.movie-card.is-watched::before { background: radial-gradient(500px 220px at 0% 0%, rgba(61, 220, 151, 0.14), transparent 70%); }
.movie-card.is-watched .poster { filter: grayscale(0.55) brightness(0.75); }
.movie-card.is-watched .poster__seen { opacity: 1; transform: scale(1); }
.movie-card.is-watched .movie-card__title { color: var(--text-2); }
.movie-card.is-next { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 50%, transparent), var(--shadow); }
.next-flag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
  animation: pulse 2.2s infinite;
}
.movie-card.is-upcoming { opacity: 0.78; }
.movie-card.flash { animation: flash 1.6s var(--ease); }

/* Genereret plakat */
.poster {
  position: relative;
  aspect-ratio: 2 / 3;
  border-radius: 14px;
  overflow: hidden;
  background: var(--poster-bg, linear-gradient(160deg, #333, #111));
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  transition: filter 0.4s, transform 0.5s var(--ease);
  container-type: inline-size;
}
.movie-card:hover .poster { transform: scale(1.03) rotate(-0.6deg); }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster__shine { position: absolute; inset: 0; background: linear-gradient(130deg, rgba(255, 255, 255, 0.18), transparent 40%); pointer-events: none; }
.poster__icon {
  position: absolute; top: 14%; left: 50%; transform: translateX(-50%);
  font-size: 38cqw; line-height: 1;
  filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
}
.poster__title {
  position: absolute; left: 8%; right: 8%; bottom: 13%;
  font-family: var(--font-display);
  font-size: 13cqw; line-height: 0.95; letter-spacing: 0.02em;
  text-transform: uppercase;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
  overflow-wrap: anywhere;
}
.poster__year { position: absolute; left: 8%; bottom: 5%; font-size: 7cqw; font-weight: 700; opacity: 0.75; letter-spacing: 0.1em; }
.poster__uni { position: absolute; top: 6%; left: 8%; font-size: 6cqw; font-weight: 800; letter-spacing: 0.18em; opacity: 0.8; }
.poster__seen {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(5, 20, 14, 0.35);
  font-size: 24cqw; color: var(--ok);
  opacity: 0; transform: scale(0.6);
  transition: all 0.4s var(--ease);
  text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}

/* ---------- 11) Spoilere ---------- */
.spoiler {
  position: relative;
  display: inline;
  padding: 1px 6px;
  border-radius: 6px;
  border: 0;
  background: rgba(255, 255, 255, 0.08);
  font-size: inherit; text-align: left;
  color: var(--text-2);
}
.spoiler__text { display: none; }
.spoiler__lock { font-weight: 600; color: var(--text-2); }
.spoiler:hover .spoiler__lock { color: var(--text); }
.spoiler.is-revealed,
body.spoilers-on .spoiler { background: transparent; padding: 0; cursor: text; }
.spoiler.is-revealed .spoiler__text,
body.spoilers-on .spoiler .spoiler__text { display: inline; color: var(--text-2); animation: fadeIn 0.4s var(--ease); }
.spoiler.is-revealed .spoiler__lock,
body.spoilers-on .spoiler .spoiler__lock { display: none; }

.spoiler-block { padding: 14px 16px; border-radius: var(--radius); background: rgba(255, 90, 78, 0.06); border: 1px solid rgba(255, 90, 78, 0.22); }
.spoiler-block h4 { font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; color: #ff9b93; margin-bottom: 6px; }

/* ---------- 12) Modal ---------- */
.modal {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  padding: 20px;
  background: rgba(3, 4, 8, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s var(--ease), visibility 0.3s;
}
.modal.is-open { opacity: 1; visibility: visible; }
.modal__dialog {
  --c: var(--accent);
  position: relative;
  width: min(940px, 100%);
  max-height: calc(100vh - 40px);
  max-height: calc(100dvh - 40px);
  overflow-y: auto;
  border-radius: var(--radius-lg);
  background: var(--surface-solid);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  transform: translateY(24px) scale(0.97);
  transition: transform 0.4s var(--ease);
  scrollbar-width: thin;
}
.modal.is-open .modal__dialog { transform: none; }
.modal__dialog--sm { width: min(460px, 100%); }
.modal__close {
  position: absolute; top: 14px; right: 14px; z-index: 5;
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(8px);
  font-size: 1.1rem;
  transition: transform 0.25s var(--ease), background 0.25s;
}
.modal__close:hover { transform: rotate(90deg); background: rgba(255, 255, 255, 0.12); }

.detail__hero {
  position: relative;
  padding: 36px;
  display: grid; grid-template-columns: 220px 1fr; gap: 30px; align-items: end;
  background:
    linear-gradient(180deg, transparent, var(--surface-solid) 95%),
    var(--poster-bg);
  overflow: hidden;
}
.detail__hero::before { content: ""; position: absolute; inset: 0; background: rgba(10, 11, 18, 0.55); }
.detail__hero > * { position: relative; }
.detail__kicker { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.75); }
.detail__title { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; margin-top: 6px; text-transform: uppercase; letter-spacing: -0.01em; }
.detail__stars { margin-top: 8px; color: var(--warn); letter-spacing: 0.1em; font-size: 1.1rem; }
.detail__stars small { color: var(--text-3); letter-spacing: normal; font-size: 0.78rem; margin-left: 6px; }
.detail__hero .meta, .detail__hero .badges { margin-top: 12px; }
.detail__body { padding: 8px 36px 36px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; }
.detail__section + .detail__section { margin-top: 22px; }
.detail__section h3 { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.detail__section p { color: var(--text-2); }
.detail__side { display: flex; flex-direction: column; gap: 18px; }
.detail__connections { display: flex; flex-direction: column; gap: 6px; }
.detail__connections button {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border);
  text-align: left; font-size: 0.9rem; font-weight: 500;
  transition: all 0.2s var(--ease);
}
.detail__connections button:hover { border-color: var(--accent); transform: translateX(3px); }
.detail__connections .is-seen { color: var(--ok); margin-left: auto; font-size: 0.8rem; }
.detail__footer {
  position: sticky; bottom: 0;
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;
  padding: 16px 36px;
  background: rgba(18, 20, 30, 0.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
}
.detail__nav { display: flex; gap: 8px; }

/* Næste-film & bekræftelse */
.next-film { padding: 32px; text-align: center; }
.next-film__label { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.next-film .poster { width: 150px; margin: 18px auto; }
.next-film h2 { font-size: 1.6rem; }
.next-film p { color: var(--text-2); margin-top: 8px; }
.next-film__actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
.confirm { padding: 30px; }
.confirm__icon { font-size: 2.2rem; }
.confirm h2 { font-size: 1.35rem; margin-top: 10px; }
.confirm p { color: var(--text-2); margin-top: 8px; }
.confirm__actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; flex-wrap: wrap; }

/* ---------- 13) Profil ---------- */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.stat-card { padding: 24px; position: relative; overflow: hidden; }
.stat-card::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--g, none); opacity: 0.2; }
.stat-card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stat-card__name { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
.stat-card__pct { font-family: var(--font-display); font-size: 2.4rem; line-height: 1; letter-spacing: 0.02em; }
.stat-card__count { margin: 14px 0 10px; color: var(--text-2); }
.stat-card__count strong { color: var(--text); font-size: 1.3rem; }
.stat-card__extra { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-3); }
.stat-card--total { --g: linear-gradient(135deg, var(--brand), #6b5bff); }

.ring { --p: 0; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), rgba(255, 255, 255, 0.08) 0); flex: none; }
.ring__inner { width: 96px; height: 96px; border-radius: 50%; background: var(--bg-2); display: grid; place-items: center; font-family: var(--font-display); font-size: 1.9rem; }

.recent-list { display: grid; gap: 10px; }
.recent-item {
  display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center;
  padding: 10px 14px 10px 10px;
  border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border);
  text-align: left; width: 100%;
  transition: border-color 0.2s, transform 0.25s var(--ease);
}
.recent-item:hover { border-color: var(--border-strong); transform: translateX(3px); }
.recent-item .poster { width: 48px; border-radius: 8px; }
.recent-item__title { font-weight: 700; }
.recent-item__sub { font-size: 0.82rem; color: var(--text-3); }
.recent-item__date { font-size: 0.8rem; color: var(--text-3); text-align: right; white-space: nowrap; }

.empty {
  grid-column: 1 / -1;
  padding: 40px 20px;
  text-align: center;
  color: var(--text-3);
  border: 1px dashed var(--border-strong);

.footer { margin-top: 60px; border-top: 1px solid var(--border); background: rgba(255, 255, 255, 0.015); }
.footer__inner { padding: 32px 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; color: var(--text-3); font-size: 0.88rem; }

.footer__links a:hover { color: var(--text); }
.reset-btn {
  background: none; border: 1px solid var(--border); border-radius: 999px;
  padding: 7px 14px; font-size: 0.8rem; color: var(--text-3);
  transition: all 0.2s;
}
.reset-btn:hover { color: #ff8a82; border-color: rgba(255, 90, 78, 0.5); }

.toast-wrap { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast {
  padding: 12px 18px; border-radius: 999px;
  background: rgba(20, 22, 32, 0.95); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow);
  font-size: 0.9rem; font-weight: 500;
  animation: toastIn 0.4s var(--ease);
}
.toast.out { animation: toastOut 0.35s var(--ease) forwards; }

/* Floating "Hvad skal jeg se nu?" på mobil */
.fab {
  position: fixed; right: 16px; bottom: 16px; z-index: 45;
  display: none;
  padding: 14px 18px; border-radius: 999px; border: 0;
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #ffb347));
  color: var(--accent-ink); font-weight: 700; font-size: 0.9rem;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
}

/* ---------- 15) Animationer ---------- */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
.reveal.is-visible { opacity: 1; transform: none; }

@keyframes drift { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(3%, 3%, 0) scale(1.08); } }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(14px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }

  "use strict";

  /* ======================================================================
     1) LAGRING – alt gemmes i én nøgle i localStorage
     ====================================================================== */
  const STORAGE_KEY = "grejsFilmGuide.v1";
  const DEFAULT_STATE = { watched: {}, spoilers: false, prefs: {} };

  const Store = {
    state: null,

    load() {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (e) {
        saved = null; // privat vindue / blokeret lager → kør videre i hukommelsen
      }
      this.state = Object.assign({}, DEFAULT_STATE, saved || {});
      this.state.watched = this.state.watched || {};
      this.state.prefs = this.state.prefs || {};
    },

    save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      } catch (e) {
        /* Lager utilgængeligt – siden virker stadig, men husker ikke */
      }
    },

    key: (uKey, id) => uKey + "/" + id,

    isWatched(uKey, id) {
      return Boolean(this.state.watched[this.key(uKey, id)]);
    },

    watchedAt(uKey, id) {
      return this.state.watched[this.key(uKey, id)] || null;
    },

    toggleWatched(uKey, id) {
      const k = this.key(uKey, id);
      if (this.state.watched[k]) delete this.state.watched[k];
      else this.state.watched[k] = Date.now();
      this.save();
      return Boolean(this.state.watched[k]);
    },

    resetProgress() {
      this.state.watched = {};
      this.save();
    },

    get spoilers() {
      return this.state.spoilers;
    },
    set spoilers(v) {
      this.state.spoilers = Boolean(v);
      this.save();
    },

    getPref(uKey, name, fallback) {
      const p = this.state.prefs[uKey];
      return p && p[name] !== undefined ? p[name] : fallback;
    },
    setPref(uKey, name, value) {
      this.state.prefs[uKey] = Object.assign({}, this.state.prefs[uKey], { [name]: value });
      this.save();
    }
  };

  // Hold flere åbne faner synkroniseret
  window.addEventListener("storage", (e) => {
    if (e.key === STORAGE_KEY) {
      Store.load();
      applySpoilerState();
      refreshPage();
    }
  });

  /* ======================================================================
     2) HJÆLPEFUNKTIONER
     ====================================================================== */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  /** Escape tekst før den sættes ind som HTML */
  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  const pad = (n) => String(n).padStart(2, "0");

  function fmtRuntime(min) {
    if (!min) return "Ukendt";
    const h = Math.floor(min / 60);
    const m = min % 60;
    return h ? `${h} t ${m} min` : `${m} min`;
  }

  function fmtDate(iso) {
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("da-DK", { day: "numeric", month: "long", year: "numeric" });
  }

  function fmtWatchedAt(ts) {
    const d = new Date(ts);
    const diff = Date.now() - ts;
    const day = 86400000;
    if (diff < 60000) return "Lige nu";
    if (diff < 3600000) return `${Math.round(diff / 60000)} min siden`;
    if (diff < day) return `${Math.round(diff / 3600000)} t siden`;
    if (diff < 2 * day) return "I går";
    if (diff < 7 * day) return `${Math.floor(diff / day)} dage siden`;
    return d.toLocaleDateString("da-DK", { day: "numeric", month: "short", year: "numeric" });
  }

  /** Simpel hash → bruges til at give hver genereret plakat sin egen farvetone */
  function hashHue(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 360;
  }

  const LONG_FILM_MINUTES = 145;

  /* ======================================================================
     3) FILMDATA-FUNKTIONER
     ====================================================================== */
  const universeKeys = () => Object.keys(UNIVERSES).filter((k) => Array.isArray(MOVIES[k]));

  const continuityOf = (m) => CONTINUITIES[m.continuity] || { label: m.continuity, color: "#888", swatch: "⬜", description: "" };

  /** Film sorteret efter valgt visning */
  function sortedMovies(uKey, view = "recommended") {
    const list = (MOVIES[uKey] || []).slice();
    const uni = UNIVERSES[uKey];
    switch (view) {
      case "release":
        return list.sort((a, b) => a.released.localeCompare(b.released));
      case "chronological":
        return list.sort((a, b) => a.chronoOrder - b.chronoOrder);
      case "universes": {
        const order = uni.groups || [];
        return list.sort(
          (a, b) => order.indexOf(a.continuity) - order.indexOf(b.continuity) || a.recommendedOrder - b.recommendedOrder
        );
      }
      default:
        return list.sort((a, b) => a.recommendedOrder - b.recommendedOrder);
    }
  }

  /** Kun udgivne film tæller med i progression */
  const releasedMovies = (uKey) => (MOVIES[uKey] || []).filter((m) => !m.upcoming);

  function progressFor(uKey, filterFn) {
    let list = releasedMovies(uKey);
    if (filterFn) list = list.filter(filterFn);
    const seen = list.filter((m) => Store.isWatched(uKey, m.id)).length;
    const total = list.length;
    return { seen, total, pct: total ? Math.round((seen / total) * 100) : 0 };
  }

  function totalProgress() {
    return universeKeys().reduce(
      (acc, k) => {
        const p = progressFor(k);
        acc.seen += p.seen;
        acc.total += p.total;
        acc.pct = acc.total ? Math.round((acc.seen / acc.total) * 100) : 0;
        return acc;
      },
      { seen: 0, total: 0, pct: 0 }
    );
  }

  /** "Hvad skal jeg se nu?" – første ikke-sete film i anbefalet rækkefølge */
  function nextMovie(uKey) {
    return sortedMovies(uKey, "recommended").find((m) => !m.upcoming && !Store.isWatched(uKey, m.id)) || null;
  }

  function findMovie(id, preferUni) {
    const keys = preferUni ? [preferUni, ...universeKeys().filter((k) => k !== preferUni)] : universeKeys();
    for (const k of keys) {
      const m = (MOVIES[k] || []).find((x) => x.id === id);
      if (m) return { movie: m, uKey: k };
    }
    return null;
  }

  function groupLabel(uKey, g) {
    const uni = UNIVERSES[uKey];
    if (uni.groupBy === "continuity") return (CONTINUITIES[g] || {}).label || g;
    return g;
  }

  const groupOf = (uKey, m) => (UNIVERSES[uKey].groupBy === "continuity" ? m.continuity : m.phase);

  /* ======================================================================
     4) HTML-BYGGEKLODSER
     ====================================================================== */
  const BADGES = {
    story: { icon: "⭐", label: "Vigtig for historien" },
    universe: { icon: "🔥", label: "Stor betydning for universet" },
    connector: { icon: "🧩", label: "Forbinder flere film" },
    info: { icon: "⚠️", label: "Indeholder vigtig information" },
    long: { icon: "⏱", label: "Lang film" }
  };

  function badgesFor(m) {
    const list = (m.badges || []).slice();
    if (m.runtime && m.runtime >= LONG_FILM_MINUTES) list.push("long");
    return list;
  }

  function badgesHTML(m) {
    const list = badgesFor(m);
    if (!list.length) return "";
    return `<div class="badges">${list
      .map((b) => BADGES[b] && `<span class="badge badge--${b}" title="${esc(BADGES[b].label)}">${BADGES[b].icon} ${esc(BADGES[b].label)}</span>`)
      .join("")}</div>`;
  }

  /** Spoiler-tekst: skjult indtil klik, eller altid vist hvis spoilere er TIL */
  function spoilerHTML(text, lockLabel = "🔒 Spoiler – klik for at vise") {
    if (!text) return "";
    return `<span class="spoiler" role="button" tabindex="0" aria-label="Vis spoiler"><span class="spoiler__lock">${esc(lockLabel)}</span><span class="spoiler__text">${esc(text)}</span></span>`;
  }

  function posterBg(m) {
    const c = continuityOf(m).color;
    const hue = hashHue(m.id);
    return `linear-gradient(165deg, ${c} 0%, hsl(${hue} 45% 26%) 52%, #090a10 100%)`;
  }

  /** Plakat: bruger m.poster hvis den findes, ellers en genereret plakat */
  function posterHTML(m, uKey) {
    const uni = UNIVERSES[uKey];
    const img = m.poster
      ? `<img src="${esc(m.poster)}" alt="Plakat: ${esc(m.title)}" loading="lazy" onerror="this.remove()">`
      : "";
    return `<div class="poster" style="--poster-bg:${posterBg(m)}" aria-hidden="${m.poster ? "false" : "true"}">
      <span class="poster__uni">${esc(uni ? uni.kicker : "")}</span>
      <span class="poster__icon">${m.icon || "🎬"}</span>
      <span class="poster__title">${esc(m.title)}</span>
      <span class="poster__year">${m.year}</span>
      ${img}
      <span class="poster__shine"></span>
      <span class="poster__seen">✓</span>
    </div>`;
  }

  function watchBtnHTML(uKey, m, extraClass = "") {
    if (m.upcoming) {
      return `<span class="watch-btn" aria-disabled="true">🔜 Udkommer ${esc(fmtDate(m.released))}</span>`;
    }
    const w = Store.isWatched(uKey, m.id);
    return `<button type="button" class="watch-btn ${w ? "is-watched" : ""} ${extraClass}" data-watch="${esc(m.id)}" data-uni="${uKey}" aria-pressed="${w}">
      <span class="watch-btn__icon">${w ? "✓" : ""}</span>${w ? "Set" : "Ikke set – marker som set"}
    </button>`;
  }

  function postCreditHTML(m) {
    const pc = m.postCredit;
    if (!pc) {
      return `<div class="post-credit post-credit--none"><span class="post-credit__icon">🎬</span><div><strong>Ekstra scener:</strong> ${
        m.upcoming ? "Info kommer, når filmen udkommer." : "Ingen info endnu – bliv siddende for en sikkerheds skyld."
      }</div></div>`;
    }
    if (!pc.count) {
      return `<div class="post-credit post-credit--none"><span class="post-credit__icon">🎬</span><div><strong>Efter rulleteksterne:</strong> ${esc(pc.text)}</div></div>`;
    }
    return `<div class="post-credit"><span class="post-credit__icon">🍿</span><div>
      <strong>${pc.count > 1 ? pc.count + " post-credit scener" : "Post-credit scene"}</strong> – husk at blive til efter rulleteksterne.<br>
      ${spoilerHTML(pc.text)}
    </div></div>`;
  }

  function metaHTML(uKey, m, opts = {}) {
    const uni = UNIVERSES[uKey];
    const cont = continuityOf(m);
    const items = [];
    if (m.upcoming) items.push(`<span class="meta__item meta__item--soon">🔜 Kommer ${esc(fmtDate(m.released))}</span>`);
    items.push(`<span class="meta__item">📅 ${m.year}</span>`);
    if (uni.groupBy === "phase") items.push(`<span class="meta__item">🎞 ${esc(m.phase)}</span>`);
    items.push(`<span class="meta__item">⏱ ${esc(fmtRuntime(m.runtime))}</span>`);
    items.push(`<span class="meta__item" title="Hvornår filmen foregår i universet">🕰 ${esc(m.setting)}</span>`);
    if (opts.universe !== false) {
      items.push(`<span class="meta__item meta__item--universe">${cont.swatch} ${esc(cont.label)}</span>`);
    }
    return `<div class="meta">${items.join("")}</div>`;
  }

  function connectionsInline(uKey, m) {
    const links = (m.connections || [])
      .map((id) => findMovie(id, uKey))
      .filter(Boolean)
      .map((r) => `<button type="button" class="conn-link" data-open="${esc(r.movie.id)}" data-uni="${r.uKey}">${esc(r.movie.title)}</button>`);
    return links.join(", ");
  }

  const VIEW_LABELS = {
    recommended: { tab: "⭐ Anbefalet", order: "Anbefalet #", title: "Anbefalet rækkefølge", icon: "⭐" },
    release: { tab: "📅 Udgivelse", order: "Udgivet som nr. ", title: "Udgivelsesrækkefølge", icon: "📅" },
    chronological: { tab: "🕰 Kronologisk", order: "Kronologisk #", title: "Kronologisk rækkefølge", icon: "🕰" },
    universes: { tab: "🌐 Universer", order: "Univers-visning #", title: "Universer / tidslinjer", icon: "🌐" }
  };

  /** Det store filmkort i listen */
  function movieCardHTML(uKey, m, num, view, isNext) {
    const w = Store.isWatched(uKey, m.id);
    const cont = continuityOf(m);
    const whyLabel = view === "recommended" ? "Hvorfor skal den ses her?" : "Hvorfor ligger den her i den anbefalede rækkefølge?";
    const recNote = view !== "recommended" ? ` · Anbefalet #${m.recommendedOrder}` : "";

    return `<article class="movie-card reveal ${w ? "is-watched" : ""} ${isNext ? "is-next" : ""} ${m.upcoming ? "is-upcoming" : ""}"
        id="film-${esc(m.id)}" data-card="${esc(m.id)}" data-uni="${uKey}" style="--c:${cont.color}" tabindex="-1">
      <span class="movie-card__num" aria-hidden="true">${pad(num)}</span>
      ${posterHTML(m, uKey)}
      <div class="movie-card__body">
        <div class="movie-card__top">
          <div class="movie-card__order">${esc(VIEW_LABELS[view].order)}${num}${recNote} ${isNext ? '<span class="next-flag">▶ Næste film</span>' : ""}</div>
          <h3 class="movie-card__title">${esc(m.title)}</h3>
        </div>
        ${metaHTML(uKey, m)}
        ${badgesHTML(m)}
        <p class="movie-card__desc">${esc(m.description)}</p>
        <div class="why-here"><strong>${whyLabel}</strong>${esc(m.whyHere)}</div>
        <dl class="info-row">
          <dt>Karakterer</dt><dd><div class="tag-list">${m.characters.map((c) => `<span class="tag">${esc(c)}</span>`).join("")}</div></dd>
          ${m.links && m.links.length ? `<dt>Forbinder til</dt><dd>${m.links.map(esc).join(" · ")}</dd>` : ""}
          ${m.connections && m.connections.length ? `<dt>Se også</dt><dd>${connectionsInline(uKey, m)}</dd>` : ""}
          ${m.stones ? `<dt>💎 Infinity Sten</dt><dd>${m.stones.map(esc).join(", ")}</dd>` : ""}
        </dl>
        ${watchFirstHTML(m)}
        ${postCreditHTML(m)}
        <div class="movie-card__actions">
          ${watchBtnHTML(uKey, m)}
          <button type="button" class="btn btn--ghost btn--sm" data-open="${esc(m.id)}" data-uni="${uKey}">Detaljer →</button>
        </div>
      </div>
    </article>`;
  }

  function watchFirstHTML(m) {
    if (!m.watchFirst || !m.watchFirst.length) return "";
    return `<div class="watch-first"><strong>⚠️ Bedre forståelse:</strong> se gerne først
      <ul>${m.watchFirst.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>`;
  }

  function meterHTML(pct, size = "") {
    return `<div class="meter ${size}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="meter__fill" style="width:${pct}%"></div></div>`;
  }

  /* ======================================================================
     5) MODAL, NÆSTE FILM, BEKRÆFTELSE & TOAST
     ====================================================================== */
  const Modal = {
    el: null,
    dialog: null,
    lastFocus: null,
    current: null, // { type:'movie', uKey, id } – bruges til at genopfriske indholdet

    init() {
      this.el = document.createElement("div");
      this.el.className = "modal";
      this.el.setAttribute("aria-hidden", "true");
      this.el.innerHTML = `<div class="modal__dialog" role="dialog" aria-modal="true" aria-label="Detaljer"></div>`;
      document.body.appendChild(this.el);
      this.dialog = $(".modal__dialog", this.el);

      // Luk ved klik udenfor vinduet
      this.el.addEventListener("mousedown", (e) => {
        if (e.target === this.el) this.close();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && this.isOpen()) this.close();
        if (e.key === "Tab" && this.isOpen()) this.trapFocus(e);
      });
    },

    isOpen() {
      return this.el.classList.contains("is-open");
    },

    open(html, { small = false, label = "Dialog", accent = null } = {}) {
      if (!this.isOpen()) this.lastFocus = document.activeElement;
      const nav = $("#site-nav");
      if (nav) nav.classList.remove("is-open"); // luk mobilmenuen bag modalen
      this.dialog.className = "modal__dialog" + (small ? " modal__dialog--sm" : "");
      this.dialog.setAttribute("aria-label", label);
      this.dialog.style.setProperty("--c", accent || "var(--accent)");
      this.dialog.innerHTML = `<button type="button" class="modal__close" data-close aria-label="Luk">✕</button>${html}`;
      this.dialog.scrollTop = 0;
      this.el.classList.add("is-open");
      this.el.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      requestAnimationFrame(() => $(".modal__close", this.dialog).focus());
    },

    close() {
      this.el.classList.remove("is-open");
      this.el.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      this.current = null;
      if (this.lastFocus && document.contains(this.lastFocus)) this.lastFocus.focus();
    },

    trapFocus(e) {
      const f = $$('button, [href], input, [tabindex]:not([tabindex="-1"])', this.dialog).filter((x) => !x.disabled);
      if (!f.length) return;
      const first = f[0];
      const last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        last.focus();
        e.preventDefault();
      } else if (!e.shiftKey && document.activeElement === last) {
        first.focus();
        e.preventDefault();
      }
    }
  };

  /** Stort detaljevindue for en film */
  function openMovie(uKey, id, { keepScroll = false } = {}) {
    const m = (MOVIES[uKey] || []).find((x) => x.id === id);
    if (!m) return;
    const uni = UNIVERSES[uKey];
    const cont = continuityOf(m);
    const rec = sortedMovies(uKey, "recommended");
    const idx = rec.findIndex((x) => x.id === id);
    const prev = rec[idx - 1];
    const next = rec[idx + 1];
    const stars = "★".repeat(m.importance || 0) + "☆".repeat(5 - (m.importance || 0));
    const scroll = Modal.dialog.scrollTop;

    const connections = (m.connections || [])
      .map((cid) => findMovie(cid, uKey))
      .filter(Boolean)
      .map(
        (r) => `<button type="button" data-open="${esc(r.movie.id)}" data-uni="${r.uKey}">
          → ${esc(r.movie.title)} <small style="color:var(--text-3)">(${r.movie.year})</small>
          ${Store.isWatched(r.uKey, r.movie.id) ? '<span class="is-seen">✓ Set</span>' : ""}
        </button>`
      )
      .join("");

    const html = `
      <div class="detail">
        <header class="detail__hero" style="--poster-bg:${posterBg(m)}">
          ${posterHTML(m, uKey)}
          <div>
            <div class="detail__kicker">${esc(uni.kicker)} · Anbefalet #${m.recommendedOrder} af ${rec.length}</div>
            <h2 class="detail__title">${esc(m.title)}</h2>
            <div class="detail__stars" title="Betydning for den samlede historie">${stars}<small>betydning for historien</small></div>
            ${metaHTML(uKey, m)}
            ${badgesHTML(m)}
          </div>
        </header>
        <div class="detail__body">
          <div>
            <section class="detail__section"><h3>Om filmen</h3><p>${esc(m.description)}</p></section>
            <section class="detail__section"><h3>Hvorfor ser jeg den nu?</h3><p>${esc(m.whyHere)}</p></section>
            ${m.watchFirst ? `<section class="detail__section">${watchFirstHTML(m)}</section>` : ""}
            <section class="detail__section"><h3>Post-credit scene</h3>${postCreditHTML(m)}</section>
            ${
              m.spoiler
                ? `<section class="detail__section spoiler-block"><h4>Stor afsløring</h4>${spoilerHTML(m.spoiler, "🔒 Spoiler skjult – klik for at vise")}</section>`
                : ""
            }
          </div>
          <aside class="detail__side">
            <section><div class="detail__section"><h3>Vigtige karakterer</h3><div class="tag-list">${m.characters
              .map((c) => `<span class="tag">${esc(c)}</span>`)
              .join("")}</div></div></section>
            ${m.links ? `<section class="detail__section"><h3>Forbinder til</h3><p>${m.links.map(esc).join(" · ")}</p></section>` : ""}
            ${m.stones ? `<section class="detail__section"><h3>💎 Infinity Sten</h3><p>${m.stones.map(esc).join(", ")}</p></section>` : ""}
            <section class="detail__section"><h3>Univers</h3><p><span class="dot" style="--c:${cont.color};display:inline-block;margin-right:6px"></span>${esc(cont.label)}</p><p style="font-size:.85rem;margin-top:4px">${esc(cont.description)}</p></section>
            ${connections ? `<section class="detail__section"><h3>Forbindelser</h3><div class="detail__connections">${connections}</div></section>` : ""}
          </aside>
        </div>
        <footer class="detail__footer">
          ${watchBtnHTML(uKey, m)}
          <div class="detail__nav">
            ${prev ? `<button type="button" class="btn btn--ghost btn--sm" data-open="${esc(prev.id)}" data-uni="${uKey}" title="${esc(prev.title)}">← Forrige</button>` : ""}
            ${next ? `<button type="button" class="btn btn--ghost btn--sm" data-open="${esc(next.id)}" data-uni="${uKey}" title="${esc(next.title)}">Næste →</button>` : ""}
          </div>
        </footer>
      </div>`;

    Modal.open(html, { label: m.title, accent: cont.color });
    Modal.current = { type: "movie", uKey, id };
    if (keepScroll) Modal.dialog.scrollTop = scroll;
  }

  /** "Hvad skal jeg se nu?" – for ét univers, eller alle hvis uKey er tom */
  function openNext(uKey) {
    const keys = uKey ? [uKey] : universeKeys();
    const blocks = keys.map((k) => {
      const uni = UNIVERSES[k];
      const m = nextMovie(k);
      if (!m) {
        return `<div class="next-film">
          <div class="next-film__label">🏆 ${esc(uni.shortName)}</div>
          <h2 style="margin-top:14px">Du har set alle film!</h2>
          <p>Flot klaret – du har gennemført hele den anbefalede ${esc(uni.shortName)}-rækkefølge.</p>
        </div>`;
      }
      const p = progressFor(k);
      return `<div class="next-film">
        <div class="next-film__label">🎬 Din næste film${keys.length > 1 ? " · " + esc(uni.shortName) : ""}</div>
        ${posterHTML(m, k)}
        <h2>${esc(m.title)}</h2>
        <p>Dette er den næste film i din anbefalede ${esc(uni.shortName)}-rækkefølge (#${m.recommendedOrder}).</p>

  function toast(msg) {
    let wrap = $(".toast-wrap");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.className = "toast-wrap";
      wrap.setAttribute("aria-live", "polite");
      document.body.appendChild(wrap);
    }
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => t.classList.add("out"), 2600);
    setTimeout(() => t.remove(), 3000);
  }

    const uni = UNIVERSES[View.uKey];
    $("#view-tabs").innerHTML = uni.views

        (v) =>

  function renderFilterChips() {
    const uKey = View.uKey;
    const uni = UNIVERSES[uKey];
    const all = MOVIES[uKey];
    const seenCount = all.filter((m) => Store.isWatched(uKey, m.id)).length;
    const released = releasedMovies(uKey).length;
    const f = View.filter;

    const chip = (key, label, count, active) =>
      `<button type="button" class="chip ${active ? "is-active" : ""}" data-filter="${esc(key)}" aria-pressed="${active}">${label} <span class="chip__count">${count}</span></button>`;

    let html = chip("all", "Alle", all.length, f.type === "all");
    html += chip("unseen", "○ Ikke set", released - seenCount, f.type === "unseen");
    html += chip("seen", "✓ Set", seenCount, f.type === "seen");
    html += uni.groups
      .map((g) => {
        const c = uni.groupBy === "continuity" ? CONTINUITIES[g] : null;
        const label = c ? `${c.swatch} ${esc(c.label.replace(/^Transformers – |^Separat univers – /, ""))}` : esc(g);
        const count = all.filter((m) => groupOf(uKey, m) === g).length;
        const active = f.type === "group" && f.groups.length === 1 && f.groups[0] === g;
        return chip("g:" + g, label, count, active);
      })
      .join("");
    $("#filter-chips").innerHTML = html;
  }

  /** Byg filmlisten ud fra visning, filter og søgning */
  function renderMovieList(animate) {
    const uKey = View.uKey;
    const uni = UNIVERSES[uKey];
    const ordered = sortedMovies(uKey, View.view);
    const next = nextMovie(uKey);
    const q = View.query;

    const visible = ordered.filter((m) => {
      const f = View.filter;
      if (f.type === "seen" && !Store.isWatched(uKey, m.id)) return false;
      if (f.type === "unseen" && (Store.isWatched(uKey, m.id) || m.upcoming)) return false;
      if (f.type === "group" && !f.groups.includes(groupOf(uKey, m))) return false;
      if (q) {
        const hay = [m.title, m.year, m.phase, ...(m.characters || []), ...(m.links || [])].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (!visible.length) {
      $("#movie-list").innerHTML = `<div class="empty"><div class="empty__icon">🔍</div>Ingen film matcher dit filter${
        q ? ` eller din søgning "<strong>${esc(q)}</strong>"` : ""
      }.<br><button type="button" class="btn btn--ghost btn--sm" style="margin-top:14px" data-filter="all" data-clear-search>Vis alle film</button></div>`;
      return;
    }

    let html = "";
    let prev = null;
    visible.forEach((m) => {
      html += dividerHTML(uKey, uni, m, prev);
      const num = ordered.indexOf(m) + 1;
      html += movieCardHTML(uKey, m, num, View.view, next && next.id === m.id);
      prev = m;
    });
    $("#movie-list").innerHTML = html;
    observeReveal(animate);
  }

  /** Overskrifter mellem grupper i listen (faser / universskift) */
  function dividerHTML(uKey, uni, m, prev) {
    const view = View.view;
    const cont = continuityOf(m);

    // Universvisning: gruppér efter kontinuitet
    if (view === "universes") {
      if (prev && prev.continuity === m.continuity) return "";
      return `<div class="list-divider"><span class="list-divider__label"><span class="dot" style="--c:${cont.color}"></span>${esc(cont.label)}</span><span class="list-divider__line"></span></div>
        <p class="list-divider__desc">${esc(cont.description)}</p>`;
    }

    // Tidslinje-afsnit (fx Marvel) i anbefalet visning
    if (view === "recommended" && uni.eras) {
      const eraOf = (x) => uni.eras.filter((e) => x.recommendedOrder >= e.from).pop();
      const era = eraOf(m);
      if (!era || (prev && eraOf(prev) === era)) return "";
      return `<div class="list-divider"><span class="list-divider__label">${esc(era.label)}</span><span class="list-divider__line"></span></div>
        ${era.desc ? `<p class="list-divider__desc">${esc(era.desc)}</p>` : ""}`;
    }

    // Faser (Marvel) i anbefalet- og udgivelsesvisning
    if (uni.groupBy === "phase" && view !== "chronological") {
      if (prev && prev.phase === m.phase) return "";
      const info = (uni.groupInfo || {})[m.phase] || "";
      return `<div class="list-divider"><span class="list-divider__label">🎞 ${esc(m.phase)}</span><span class="list-divider__line"></span></div>
        ${info ? `<p class="list-divider__desc">${esc(info)}</p>` : ""}`;
    }

    // Kontinuitetsskift (Transformers) i anbefalet visning
    if (uni.groupBy === "continuity" && view === "recommended") {
      if (prev && prev.continuity === m.continuity) return "";
      const isSwitch = Boolean(prev);
      return `<div class="list-divider ${isSwitch ? "list-divider--switch" : ""}"><span class="list-divider__label">${
        isSwitch ? "⚡ Nyt univers:" : "▶ Start:"
      } <span class="dot" style="--c:${cont.color}"></span>${esc(cont.label)}</span><span class="list-divider__line"></span></div>
        <p class="list-divider__desc">${esc(cont.description)}${isSwitch ? " Historien starter forfra her." : ""}</p>`;
    }
    return "";
  }

  /** Scroll til et filmkort og få det til at lyse op */
  function gotoCard(id) {
    let card = document.getElementById("film-" + id);
    if (!card && View.uKey) {
      // Filmen er skjult af et filter → nulstil filter og søgning
      View.filter = { type: "all" };
      View.query = "";
      const s = $("#search");
      if (s) s.value = "";
      refreshUniverse();
      card = document.getElementById("film-" + id);
    }
    if (!card) return;
    card.classList.add("is-visible");
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.remove("flash");
    void card.offsetWidth; // genstart animation
    card.classList.add("flash");
  }

  function renderProfile() {

    const total = totalProgress();

      .map((k) => {

          .join("");
