<script>
/* =====================================================================
 * GREJS FACTORY — combat.js
 * Weapons, projectiles, explosions, turrets and walls.
 * Bullets / pellets / lasers are hitscan with a short tracer effect;
 * grenades, rockets, cannon shells and enemy acid are simulated.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const K = GF.Kinds;

  const C = { proj: [], tracers: [], damaged: new Set(), _noAmmoT: 0 };
  C.reset = function () { C.proj = []; C.tracers = []; C.damaged = new Set(); };

  const dmgMult = () => 1 + GF.Research.bonus.dmg;

  /* ---------------------------- damage ---------------------------- */
  C.damageUnit = function (u, dmg, pierce) {
    if (u.dead) return;
    const armor = Math.max(0, (u.armor || 0) - (pierce || 0));
    const d = Math.max(dmg * 0.2, dmg - armor);
    u.hp -= d;
    u.hitT = 0.12;
    u.provoked = true;
    if (u.hp <= 0) GF.Enemies.killUnit(u);
  };

  C.damageEntity = function (e, dmg, source) {
    if (!e || e.dead) return;
    e.hp -= dmg;
    e.hitT = 0.15;
    if (!e.def.enemy) C.damaged.add(e);
    if (e.def.enemy) { e.provoked = true; GF.Enemies.onHiveHit(e, source); }
    if (e.hp <= 0) C.destroyEntity(e);
  };

  C.destroyEntity = function (e) {
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    GF.Particles.emit('explosion', cx, cy, 1, { size: Math.max(e.w, e.h) * 0.7 });
    GF.Particles.emit('debris', cx, cy, 8 + e.w * 3);
    GF.Audio.play('explode', { x: cx, y: cy });
    GF.Render.shake(Math.min(8, 2 + e.w));
    if (e.def.enemy) { GF.Enemies.onHiveKilled(e); GF.Ent.remove(e, { destroyed: true }); return; }
    GF.Ent.remove(e, { destroyed: true });
    C.damaged.delete(e);
    GF.UI.toast(e.def.name + ' blev ødelagt!', 'bad');
    GF.Progress.stat('buildingsLost', 1);
  };

  C.damagePlayer = function (dmg) {
    const p = GF.player;
    if (!p || p.dead || p.god) return;
    p.hp -= dmg * GF.Game.diff().dmgTaken;
    p.hurtT = 0.25;
    p.regenCd = 8;
    if (p.hp <= 0) p.die();
  };

  /** area damage (explosions from the player side hit enemies only) */
  C.explode = function (x, y, radius, dmg, team) {
    GF.Particles.emit('explosion', x, y, 1, { size: radius * 0.6 });
    GF.Particles.emit('debris', x, y, 10);
    GF.Audio.play('explode', { x, y });
    GF.Render.shake(Math.min(10, radius * 1.6));
    if (team === 'player') {
      GF.Enemies.query(x, y, radius + 1).forEach((u) => {
        const d = U.dist(x, y, u.x, u.y);
        if (d <= radius + u.r) C.damageUnit(u, dmg * (1 - (d / (radius + u.r)) * 0.6), 5);
      });
      GF.Ent.near(x, y, radius + 2, (e) => e.def.enemy).forEach((h) => C.damageEntity(h, dmg * 0.6, 'player'));
    } else {
      if (GF.player && U.dist(x, y, GF.player.x, GF.player.y) < radius) C.damagePlayer(dmg);
      GF.Ent.near(x, y, radius + 1, (e) => !e.def.enemy).forEach((e) => C.damageEntity(e, dmg * 0.7));
    }
  };

  /* ---------------------------- hitscan ---------------------------- */
  /** returns {x,y,hit} of first enemy along a ray (units or hives) */
  C.rayHit = function (x, y, ang, range) {
    const dx = Math.cos(ang), dy = Math.sin(ang);
    let best = null, bt = range;
    GF.Enemies.query(x + dx * range / 2, y + dy * range / 2, range / 2 + 2).forEach((u) => {
      const ux = u.x - x, uy = u.y - y;
      const t = ux * dx + uy * dy;
      if (t < 0 || t > bt) return;
      const px = ux - dx * t, py = uy - dy * t;
      if (px * px + py * py <= u.r * u.r) { bt = t; best = u; }
    });
    // hives: march along the ray
    for (let t = 0.5; t < bt; t += 0.5) {
      const e = GF.Ent.at(Math.floor(x + dx * t), Math.floor(y + dy * t));
      if (e && e.def.enemy) { bt = t; best = e; break; }
    }
    return { x: x + dx * bt, y: y + dy * bt, hit: best };
  };

  function hitTarget(target, dmg, pierce) {
    if (!target) return;
    if (target.def) C.damageEntity(target, dmg, 'player');
    else C.damageUnit(target, dmg, pierce);
  }

  C.shootRay = function (x, y, ang, range, dmg, pierce, kind) {
    const r = C.rayHit(x, y, ang, range);
    hitTarget(r.hit, dmg, pierce);
    C.tracers.push({ x0: x, y0: y, x1: r.x, y1: r.y, life: kind === 'laser' ? 0.1 : 0.05, max: kind === 'laser' ? 0.1 : 0.05, kind });
    if (r.hit) GF.Particles.emit(kind === 'laser' ? 'spark' : 'blood', r.x, r.y, 2, kind === 'laser' ? { color: '#8ff' } : null);
    return r;
  };

  /* --------------------------- projectiles -------------------------- */
  /** type: grenade | rocket | cannon | acid */
  C.launch = function (type, x, y, tx, ty, dmg, splash, team, speed) {
    const d = U.dist(x, y, tx, ty) || 0.01;
    speed = speed || { grenade: 12, rocket: 20, cannon: 26, acid: 11 }[type];
    C.proj.push({ type, x, y, sx: x, sy: y, tx, ty, vx: ((tx - x) / d) * speed, vy: ((ty - y) / d) * speed, t: 0, T: d / speed, dmg, splash, team });
  };

  C.update = function (dt) {
    C._noAmmoT -= dt;
    for (const p of C.proj) {
      p.t += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'rocket' && Math.random() < 0.6) GF.Particles.emit('smoke', p.x, p.y, 1, { size: 0.3, life: 0.6 });
      let boom = p.t >= p.T;
      if (!boom && p.type === 'rocket') {
        const us = GF.Enemies.query(p.x, p.y, 1.2);
        if (us.length) boom = true;
      }
      if (!boom && p.type === 'acid') {
        const pl = GF.player;
        if (pl && !pl.dead && U.dist(p.x, p.y, pl.x, pl.y) < 0.5) boom = true;
      }
      if (boom) {
        p.dead = true;
        if (p.type === 'acid') {
          GF.Particles.emit('acid', p.x, p.y, 6);
          const pl = GF.player;
          if (pl && U.dist(p.x, p.y, pl.x, pl.y) < 1.1) C.damagePlayer(p.dmg);
          const e = GF.Ent.at(Math.floor(p.x), Math.floor(p.y));
          if (e && !e.def.enemy) C.damageEntity(e, p.dmg);
        } else C.explode(p.x, p.y, p.splash, p.dmg, p.team);
      }
    }
    if (C.proj.some((p) => p.dead)) C.proj = C.proj.filter((p) => !p.dead);
    for (const t of C.tracers) t.life -= dt;
    if (C.tracers.length) C.tracers = C.tracers.filter((t) => t.life > 0);
    // prune repaired entities
    if (C.damaged.size) for (const e of C.damaged) if (e.dead || e.hp >= e.maxHp) C.damaged.delete(e);
  };

  /* ------------------------- player weapons ------------------------- */
  C.weaponsOf = function (inv) {
    const out = [];
    ['pistol', 'rifle', 'shotgun', 'laser_gun', 'rocket_launcher', 'grenade'].forEach((w) => { if (inv.count(w) > 0) out.push(w); });
    return out;
  };

  function findAmmo(inv, type, prefer) {
    if (prefer && inv.count(prefer) > 0 && GF.ITEMS[prefer].ammo.type === type) return prefer;
    for (const s of inv.slots) if (s && GF.ITEMS[s.id].ammo && GF.ITEMS[s.id].ammo.type === type && !GF.ITEMS[s.id].weapon) return s.id;
    return null;
  }
  C.ammoCount = function (inv, weapon) {
    const w = GF.ITEMS[weapon] && GF.ITEMS[weapon].weapon;
    if (!w) return 0;
    if (w.thrown) return inv.count(weapon);
    let n = 0;
    inv.slots.forEach((s) => { if (s && GF.ITEMS[s.id].ammo && GF.ITEMS[s.id].ammo.type === w.ammo && !GF.ITEMS[s.id].weapon) n += s.n; });
    return n;
  };

  /** player shoots at world point (tx,ty). Returns true if a shot was fired */
  C.playerFire = function (p, tx, ty) {
    const wid = p.weapon;
    if (!wid || p.inv.count(wid) <= 0) return false;
    const w = GF.ITEMS[wid].weapon;
    if (p.fireCd > 0 || p.reload > 0) return false;
    const ang = Math.atan2(ty - p.y, tx - p.x);
    p.aim = ang;
    const mx = p.x + Math.cos(ang) * 0.5, my = p.y + Math.sin(ang) * 0.5;
    if (w.thrown) {
      p.inv.remove(wid, 1);
      const d = Math.min(w.range, U.dist(p.x, p.y, tx, ty));
      const am = GF.ITEMS[wid].ammo;
      C.launch('grenade', mx, my, p.x + Math.cos(ang) * d, p.y + Math.sin(ang) * d, am.dmg * dmgMult(), am.splash, 'player');
      p.fireCd = 1 / w.rate;
      GF.Audio.play('throw');
      return true;
    }
    if (p.mag <= 0 || !p.magType || GF.ITEMS[p.magType].ammo.type !== w.ammo) {
      const aid = findAmmo(p.inv, w.ammo, p.magType);
      if (!aid) {
        if (C._noAmmoT <= 0) { GF.UI.toast('Ingen ammunition til ' + GF.itemName(wid), 'warn'); C._noAmmoT = 3; GF.Audio.play('click'); }
        return false;
      }
      p.inv.remove(aid, 1);
      p.magType = aid;
      p.mag = GF.ITEMS[aid].ammo.rounds;
    }
    const am = GF.ITEMS[p.magType].ammo;
    const dmg = am.dmg * dmgMult();
    if (w.proj === 'rocket') {
      const d = Math.min(w.range, U.dist(p.x, p.y, tx, ty));
      C.launch('rocket', mx, my, p.x + Math.cos(ang) * d, p.y + Math.sin(ang) * d, dmg, am.splash, 'player');
      GF.Audio.play('rocket');
    } else {
      const pellets = w.pellets || 1;
      for (let i = 0; i < pellets; i++) {
        const a = ang + (Math.random() - 0.5) * 2 * w.spread;
        C.shootRay(mx, my, a, w.range * (pellets > 1 ? 0.8 + Math.random() * 0.2 : 1), dmg, am.pierce || 0, w.proj);
      }
      GF.Audio.play(w.proj === 'laser' ? 'laser' : w.proj === 'pellet' ? 'shotgun' : 'shot');
      GF.Particles.emit('flash', mx, my, 1, { color: w.proj === 'laser' ? '#8ff' : '#ffd070' });
    }
    p.mag--;
    p.fireCd = 1 / w.rate;
    if (p.mag <= 0) { p.reload = findAmmo(p.inv, w.ammo, p.magType) ? w.reload : 0; }
    GF.Enemies.playerShot();
    return true;
  };

  /* ----------------------------- turrets ----------------------------- */
  K.wall = {};
  K.turret = {
    init(e, s) {
      s = s || {};
      e.ammo = s.am && GF.ITEMS[s.am[0]] ? { id: s.am[0], n: s.am[1] } : null;
      e.mag = s.mg || 0; e.magType = s.mt || null;
      e.cd = 0; e.scan = Math.random() * 0.2; e.ang = s.an || -Math.PI / 2; e.target = null; e.st = '';
      e.charge = 0;
    },
    save(e) { return { am: e.ammo ? [e.ammo.id, e.ammo.n] : null, mg: e.mag, mt: e.magType, an: +e.ang.toFixed(2) }; },
    contents(e) { return e.ammo ? [{ id: e.ammo.id, n: e.ammo.n }] : []; },
    canInsert(e, id, n, fi) {
      if (e.def.laser) return 0;
      const a = GF.ITEMS[id] && GF.ITEMS[id].ammo;
      if (!a || a.type !== e.def.ammo || GF.ITEMS[id].weapon) return 0;
      if (e.ammo && e.ammo.id !== id) return 0;
      const cur = e.ammo ? e.ammo.n : 0;
      const lim = fi ? 10 : GF.stackOf(id);
      return Math.max(0, Math.min(n, lim - cur));
    },
    insert(e, id, n, fi) {
      const a = this.canInsert(e, id, n, fi);
      if (a > 0) { if (!e.ammo) e.ammo = { id, n: 0 }; e.ammo.n += a; }
      return a;
    },
    update(e, dt) {
      const d = e.def;
      const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
      e.cd -= dt;
      e.scan -= dt;
      if (e.scan <= 0) {
        e.scan = 0.25;
        e.target = null;
        let best = null, bd = d.range * d.range;
        GF.Enemies.query(cx, cy, d.range).forEach((u) => {
          const dd = U.dist2(cx, cy, u.x, u.y);
          if (dd < bd && (!d.minRange || dd > d.minRange * d.minRange)) { bd = dd; best = u; }
        });
        if (!best) {
          const hs = GF.Ent.near(cx, cy, d.range, (h) => h.def.enemy);
          if (hs.length) best = hs[0];
        }
        e.target = best;
      }
      const t = e.target;
      if (d.laser) e.demand = t ? d.power : d.power * 0.02;
      if (!t || t.dead) { e.st = 'Klar'; e.warn = null; return; }
      const tx = t.def ? t.x + t.w / 2 : t.x, ty = t.def ? t.y + t.h / 2 : t.y;
      const want = Math.atan2(ty - cy, tx - cx);
      let da = want - e.ang;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      const turn = (d.laser ? 8 : 5) * dt;
      e.ang += U.clamp(da, -turn, turn);
      if (Math.abs(da) > 0.15 || e.cd > 0) return;
      const mx = cx + Math.cos(e.ang) * e.w * 0.45, my = cy + Math.sin(e.ang) * e.w * 0.45;
      if (d.laser) {
        const sat = GF.Power.sat(e);
        if (sat < 0.2) { e.st = e.net ? 'Lav strøm' : 'Ingen strøm'; e.warn = 'nopower'; return; }
        e.warn = null; e.st = 'Skyder';
        C.shootRay(mx, my, e.ang, d.range + 1, d.dmg * dmgMult(), 3, 'laser');
        e.cd = 1 / (d.rate * sat);
        GF.Audio.play('laser', { x: cx, y: cy, vol: 0.5 });
        return;
      }
      if (e.mag <= 0) {
        if (!e.ammo || e.ammo.n <= 0) { e.st = 'Mangler ammunition'; e.warn = 'noammo'; return; }
        e.magType = e.ammo.id; e.mag = GF.ITEMS[e.ammo.id].ammo.rounds;
        e.ammo.n--; if (e.ammo.n <= 0) e.ammo = null;
        GF.Progress.record('consume', e.magType, 1);
      }
      e.warn = null; e.st = 'Skyder';
      const am = GF.ITEMS[e.magType].ammo;
      if (d.ammo === 'cannon') {
        C.launch('cannon', mx, my, tx, ty, am.dmg * dmgMult(), am.splash, 'player');
        GF.Audio.play('cannon', { x: cx, y: cy });
        GF.Particles.emit('smoke', mx, my, 4, { size: 0.6 });
        GF.Render.shake(1.5);
      } else {
        C.shootRay(mx, my, e.ang + (Math.random() - 0.5) * 0.05, d.range + 1, am.dmg * dmgMult(), am.pierce || 0, 'bullet');
        GF.Audio.play('shot', { x: cx, y: cy, vol: 0.45 });
        GF.Particles.emit('flash', mx, my, 1, { color: '#ffd070' });
      }
      e.mag--;
      e.cd = 1 / d.rate;
      e.flash = 0.06;
    },
    status(e) {
      const a = e.def.laser ? '' : ' · Ammo: ' + ((e.ammo ? e.ammo.n : 0) + (e.mag > 0 ? 1 : 0));
      return (e.st || 'Klar') + a;
    },
  };

  C.save = () => ({});
  C.load = () => { C.reset(); };

  GF.Combat = C;
})(window.GF);

<script>
/* =====================================================================
 * GREJS FACTORY — enemies.js
 * Crawler hives, crawler units, "noise" (the factory's disturbance that
 * spreads between chunks and angers hives), evolution and expansion.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const CH = U.CHUNK;

  const TYPES = {
    kryb: { name: 'Lille kryber', hp: 18, dmg: 7, speed: 2.4, r: 0.35, range: 0.9, rate: 1.2, color: '#b0406a', armor: 0, evo: 0, size: 0.7 },
    spytter: { name: 'Spyttekryber', hp: 45, dmg: 12, speed: 1.7, r: 0.4, range: 9, rate: 0.7, color: '#6aa040', armor: 0, evo: 0.15, ranged: true, size: 0.8 },
    kriger: { name: 'Krigerkryber', hp: 90, dmg: 17, speed: 2.1, r: 0.5, range: 1.1, rate: 1.1, color: '#8a2a5a', armor: 3, evo: 0.22, size: 1.0 },
    panser: { name: 'Panserkryber', hp: 420, dmg: 40, speed: 1.45, r: 0.7, range: 1.3, rate: 1.0, color: '#4a3a7a', armor: 9, evo: 0.5, size: 1.35 },
    mutant: { name: 'Muteret bæst', hp: 1700, dmg: 95, speed: 1.6, r: 1.0, range: 1.7, rate: 0.8, color: '#5a1a2a', armor: 15, evo: 0.8, size: 1.9 },
  };

  const E = {
    TYPES,
    units: [], grid: new Map(), noise: new Map(),
    hiveChunks: new Set(), pending: [],
    evolution: 0, expandT: 0, _nT: 0, uid: 1, attacks: 0, _shotT: 0,
  };

  E.cfg = function () {
    const o = (GF.Game && GF.Game.opts) || {};
    return {
      activity: o.enemyActivity != null ? o.enemyActivity : 1,  // 0 = peaceful
      strength: o.enemyStrength || 1,
      freq: GF.Settings.get('enemyFrequency') || 1,
    };
  };

  E.reset = function () {
    E.units = []; E.grid = new Map(); E.noise = new Map(); E.hiveChunks = new Set(); E.pending = [];
    E.evolution = 0; E.expandT = 0; E._nT = 0; E.attacks = 0;
  };

  /* ------------------------------ noise ----------------------------- */
  E.addNoise = function (x, y, amt) {
    const k = U.key(Math.floor(x / CH), Math.floor(y / CH));
    E.noise.set(k, (E.noise.get(k) || 0) + amt);
    E.evolution = Math.min(1, E.evolution + amt * 0.000006 * GF.Game.diff().evo);
  };
  E.noiseAt = (cx, cy) => E.noise.get(U.key(cx, cy)) || 0;

  function spreadNoise() {
    const next = new Map();
    for (const [k, v] of E.noise) {
      if (v < 0.05) continue;
      const [cx, cy] = U.unkey(k);
      const share = v * 0.06;
      next.set(k, (next.get(k) || 0) + v * 0.755); // 0.5% decay per step
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const nk = U.key(cx + dx, cy + dy);
        next.set(nk, (next.get(nk) || 0) + share);
      });
    }
    E.noise = next;
  }

  /* --------------------------- spatial grid -------------------------- */
  function rebuildGrid() {
    E.grid.clear();
    for (const u of E.units) {
      const k = U.key(Math.floor(u.x / 4), Math.floor(u.y / 4));
      let a = E.grid.get(k);
      if (!a) { a = []; E.grid.set(k, a); }
      a.push(u);
    }
  }
  E.query = function (x, y, r) {
    const out = [];
    const x0 = Math.floor((x - r) / 4), x1 = Math.floor((x + r) / 4), y0 = Math.floor((y - r) / 4), y1 = Math.floor((y + r) / 4);
    const r2 = r * r;
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      const a = E.grid.get(U.key(gx, gy));
      if (a) for (const u of a) if (!u.dead && (u.x - x) * (u.x - x) + (u.y - y) * (u.y - y) <= r2) out.push(u);
    }
    return out;
  };
  E.unitBlocking = function (tx, ty) {
    const a = E.query(tx + 0.5, ty + 0.5, 0.9);
    return a.length > 0;
  };

  /* ------------------------------ units ------------------------------ */
  function pickType() {
    const evo = E.evolution;
    const cands = Object.keys(TYPES).filter((t) => TYPES[t].evo <= evo + 0.001);
    // weight newest types lower
    const w = cands.map((t) => (t === 'kryb' ? Math.max(0.2, 1.2 - evo) : 0.4 + (evo - TYPES[t].evo)));
    let s = w.reduce((a, b) => a + b, 0), r = Math.random() * s;
    for (let i = 0; i < cands.length; i++) { r -= w[i]; if (r <= 0) return cands[i]; }
    return 'kryb';
  }

  E.spawnUnit = function (type, x, y, hive, state) {
    if (E.units.length >= 400) return null;
    const t = TYPES[type];
    const cfg = E.cfg();
    const u = {
      id: E.uid++, type, t, x, y, hp: t.hp * cfg.strength, maxHp: t.hp * cfg.strength, r: t.r, armor: t.armor,
      hive, state: state || 'idle', target: null, cd: Math.random(), ang: Math.random() * 6.28, anim: Math.random() * 10,
      stuck: 0, wander: 0, gx: x, gy: y, think: Math.random() * 0.5, hitT: 0,
    };
    E.units.push(u);
    return u;
  };

  E.killUnit = function (u) {
    if (u.dead) return;
    u.dead = true;
    GF.Particles.emit('gore', u.x, u.y, 6 + Math.round(u.t.size * 4), { color: u.t.color });
    GF.Audio.play('squish', { x: u.x, y: u.y });
    GF.Progress.stat('enemiesKilled', 1);
    if (u.hive && !u.hive.dead) u.hive.guards = Math.max(0, (u.hive.guards || 0) - (u.guard ? 1 : 0));
  };

  /** nearest player building to (x,y) within radius (tiles) */
  E.nearestBuilding = function (x, y, radius) {
    let best = null, bd = Infinity;
    const cx0 = Math.floor((x - radius) / CH), cx1 = Math.floor((x + radius) / CH);
    const cy0 = Math.floor((y - radius) / CH), cy1 = Math.floor((y + radius) / CH);
    GF.Ent.forChunks(cx0, cy0, cx1, cy1, (e) => {
      if (e.def.enemy) return;
      const d = U.dist2(x, y, e.x + e.w / 2, e.y + e.h / 2);
      if (d < bd) { bd = d; best = e; }
    });
    return bd <= radius * radius ? best : null;
  };

  function unitTargetPos(u) {
    const t = u.target;
    if (!t) return null;
    if (t === GF.player) return { x: t.x, y: t.y, w: 0, h: 0 };
    return { x: t.x + t.w / 2, y: t.y + t.h / 2, w: t.w, h: t.h };
  }
  function distToTarget(u, p) {
    if (!p.w) return U.dist(u.x, u.y, p.x, p.y);
    // distance to rectangle
    const dx = Math.max(Math.abs(u.x - p.x) - p.w / 2, 0), dy = Math.max(Math.abs(u.y - p.y) - p.h / 2, 0);
    return Math.hypot(dx, dy);
  }

  function blockedTerrain(x, y) {
    const tx = Math.floor(x), ty = Math.floor(y);
    const t = GF.World.terrain(tx, ty);
    return GF.World.TERRAIN[t].solid;
  }

  function updateUnit(u, dt) {
    const t = u.t;
    u.anim += dt * t.speed * 3;
    u.cd -= dt;
    u.hitT = Math.max(0, u.hitT - dt);
    const pl = GF.player;
    const plValid = pl && !pl.dead && !GF.Game.opts.peacefulPlayer;
    u.think -= dt;
    if (u.think <= 0) {
      u.think = 0.4 + Math.random() * 0.3;
      if (u.target && (u.target.dead || (u.target === pl && (pl.dead || pl.inVehicle && false)))) u.target = null;
      const aggro = (u.state === 'attack' ? 7 : 9) * (GF.Game.darkness() > 0.4 ? 1.3 : 1);
      const peaceful = E.cfg().activity === 0 && !u.provoked;
      if (plValid && !peaceful && U.dist(u.x, u.y, pl.x, pl.y) < aggro) u.target = pl;
      if (u.state === 'attack' && !u.target) {
        u.target = E.nearestBuilding(u.x, u.y, 24) || (plValid && U.dist(u.x, u.y, pl.x, pl.y) < 30 ? pl : null);
        if (!u.target) { u.state = 'idle'; u.gx = u.hive && !u.hive.dead ? u.hive.x + 1 : u.x; u.gy = u.hive && !u.hive.dead ? u.hive.y + 1 : u.y; }
      }
      if (u.state === 'idle' && u.target === pl && peaceful) u.target = null;
    }
    let goal = null;
    const tp = unitTargetPos(u);
    if (tp) {
      const d = distToTarget(u, tp);
      const range = t.range + (tp.w ? 0 : 0.3);
      if (d <= range) {
        // attack
        u.ang = Math.atan2(tp.y - u.y, tp.x - u.x);
        if (u.cd <= 0) {
          u.cd = 1 / t.rate;
          const dmg = t.dmg * E.cfg().strength * GF.Game.diff().enemyDmg;
          if (t.ranged) GF.Combat.launch('acid', u.x, u.y, tp.x + (Math.random() - 0.5), tp.y + (Math.random() - 0.5), dmg, 1, 'enemy');
          else if (u.target === pl) { GF.Combat.damagePlayer(dmg); GF.Audio.play('bite', { x: u.x, y: u.y }); }
          else { GF.Combat.damageEntity(u.target, dmg); GF.Particles.emit('spark', tp.x, tp.y, 2); GF.Audio.play('bite', { x: u.x, y: u.y, vol: 0.4 }); }
          u.lunge = 0.15;
        }
        u.lunge = Math.max(0, (u.lunge || 0) - dt);
        return;
      }
      goal = tp;
    } else if (u.state === 'idle') {
      u.wander -= dt;
      if (u.wander <= 0) {
        u.wander = 2 + Math.random() * 4;
        const hx = u.hive && !u.hive.dead ? u.hive.x + 1.5 : u.gx, hy = u.hive && !u.hive.dead ? u.hive.y + 1.5 : u.gy;
        u.gx = hx + (Math.random() - 0.5) * 12; u.gy = hy + (Math.random() - 0.5) * 12;
      }
      goal = { x: u.gx, y: u.gy };
      if (U.dist(u.x, u.y, goal.x, goal.y) < 0.6) return;
    }
    if (!goal) return;
    // steering with simple obstacle avoidance
    let ang = Math.atan2(goal.y - u.y, goal.x - u.x);
    if (u.stuck > 2) ang += u.detour;
    const sp = t.speed * (u.state === 'idle' ? 0.45 : 1) * dt;
    const tries = [0, 0.6, -0.6, 1.2, -1.2, 1.9, -1.9];
    let moved = false;
    for (const off of tries) {
      const a = ang + off;
      const nx = u.x + Math.cos(a) * sp, ny = u.y + Math.sin(a) * sp;
      if (blockedTerrain(nx + Math.cos(a) * u.r, ny + Math.sin(a) * u.r)) continue;
      const be = GF.Ent.at(Math.floor(nx + Math.cos(a) * u.r), Math.floor(ny + Math.sin(a) * u.r));
      if (be && be.def.solid !== false && !be.def.enemy) {
        if (u.state === 'attack' || u.target) { u.target = be; u.think = 1; return; }
        continue;
      }
      u.x = nx; u.y = ny; u.ang = a; moved = true;
      break;
    }
    if (!moved) { u.stuck += dt; if (u.stuck > 2 && !u.detour) u.detour = (Math.random() < 0.5 ? 1 : -1) * 1.4; if (u.stuck > 6) { u.stuck = 0; u.detour = 0; } }
    else if (u.stuck > 0) { u.stuck = Math.max(0, u.stuck - dt * 0.5); if (u.stuck === 0) u.detour = 0; }
  }

  function separate() {
    for (const a of E.grid.values()) {
      for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
        const u = a[i], v = a[j];
        const dx = v.x - u.x, dy = v.y - u.y, rr = u.r + v.r;
        const d2 = dx * dx + dy * dy;
        if (d2 < rr * rr && d2 > 1e-6) {
          const d = Math.sqrt(d2), push = (rr - d) * 0.3;
          const ox = (dx / d) * push, oy = (dy / d) * push;
          if (!blockedTerrain(u.x - ox, u.y - oy)) { u.x -= ox; u.y -= oy; }
          if (!blockedTerrain(v.x + ox, v.y + oy)) { v.x += ox; v.y += oy; }
        }
      }
    }
  }

  /* ------------------------------ hives ------------------------------ */
  GF.Kinds.hive = {
    init(e, s) {
      s = s || {};
      e.anger = s.an || 0; e.guards = 0; e.spawnCd = 3 + Math.random() * 5; e.pulse = Math.random() * 6; e.provoked = false; e.think = Math.random();
    },
    save(e) { return { an: +e.anger.toFixed(1) }; },
    update(e, dt) {
      e.pulse += dt;
      e.think -= dt;
      if (e.think > 0) return;
      const step = 1;
      e.think = step;
      const cfg = E.cfg();
      const cx = e.x + 1.5, cy = e.y + 1.5;
      const pl = GF.player;
      const pd = pl ? U.dist(cx, cy, pl.x, pl.y) : 999;
      // guards
      if (pd < 70) {
        e.spawnCd -= step;
        const maxG = 3 + Math.floor(E.evolution * 6);
        if (e.spawnCd <= 0 && e.guards < maxG) {
          e.spawnCd = 6 + Math.random() * 6;
          const a = Math.random() * 6.28;
          const u = E.spawnUnit(pickType(), cx + Math.cos(a) * 2.2, cy + Math.sin(a) * 2.2, e, 'idle');
          if (u) { u.guard = true; e.guards++; }
        }
      }
      if (cfg.activity === 0 && !e.provoked) return;
      // absorb noise → anger
      const k = U.key(Math.floor(cx / CH), Math.floor(cy / CH));
      const n = E.noise.get(k) || 0;
      if (n > 0) {
        const take = Math.min(n, 2.5 * step);
        E.noise.set(k, n - take);
        const night = GF.Game.darkness() > 0.4 ? 1.5 : 1;
        e.anger += take * cfg.activity * cfg.freq * night;
      }
      // the factory's mere presence nearby slowly agitates the hive
      e.presT = (e.presT || 0) - step;
      if (e.presT <= 0) { e.presT = 5; e.near = !!E.nearestBuilding(cx, cy, 160); }
      if (e.near) e.anger += 0.06 * cfg.activity * cfg.freq * (1 + E.evolution) * step;
      const thr = 55 / GF.Game.diff().aggro;
      if (e.anger >= thr) {
        e.anger = 0;
        E.launchAttack(e);
      }
    },
    status(e) { return 'Vrede: ' + Math.round(e.anger) + ' · Udvikling ' + Math.round(E.evolution * 100) + '%'; },
  };

  E.launchAttack = function (hive, forceTarget) {
    const cx = hive.x + 1.5, cy = hive.y + 1.5;
    const target = forceTarget || E.nearestBuilding(cx, cy, 220);
    if (!target) return;
    const size = U.clamp(Math.round(3 + E.evolution * 14 + Math.random() * 3) * (E.cfg().strength > 1 ? 1.3 : 1), 3, 30);
    for (let i = 0; i < size; i++) {
      const a = Math.random() * 6.28;
      const u = E.spawnUnit(pickType(), cx + Math.cos(a) * 2.5, cy + Math.sin(a) * 2.5, hive, 'attack');
      if (u) u.target = target;
    }
    E.attacks++;
    GF.bus.emit('enemyAttack', { x: target.x, y: target.y, size });
  };

  E.onHiveHit = function (h, source) {
    if (h.defendCd > GF.Game.time) return;
    h.defendCd = GF.Game.time + 4;
    E.query(h.x + 1.5, h.y + 1.5, 16).forEach((u) => { if (!u.dead && GF.player && !GF.player.dead) { u.target = GF.player; u.provoked = true; u.state = 'attack'; } });
    for (let i = 0; i < 2; i++) {
      const u = E.spawnUnit(pickType(), h.x + 1.5, h.y + 1.5, h, 'attack');
      if (u) { u.provoked = true; u.target = GF.player; }
    }
  };
  E.onHiveKilled = function (h) {
    GF.Progress.stat('hivesDestroyed', 1);
    E.evolution = Math.min(1, E.evolution + 0.003 * GF.Game.diff().evo);
    GF.UI.toast('Kryberede ødelagt!', 'good');
  };
  E.playerShot = function () { E._shotT = 1; };

  /** deterministic hive generation for new chunks */
  E.onChunkGen = function (c) {
    const k = U.key(c.cx, c.cy);
    if (E.hiveChunks.has(k)) return;
    E.hiveChunks.add(k);
    const cx = (c.cx + 0.5) * CH, cy = (c.cy + 0.5) * CH;
    const dist = Math.hypot(cx, cy);
    const act = (GF.Game.opts && GF.Game.opts.enemyActivity != null) ? GF.Game.opts.enemyActivity : 1;
    const R0 = act === 0 ? 150 : act < 1 ? 230 : act > 1 ? 150 : 180;
    if (dist < R0) return;
    const rnd = U.rng(U.ihash(c.cx, c.cy, GF.World.seed + 4242));
    const p = U.clamp((dist - R0) / 900, 0, 0.14) + 0.035 * Math.min(1.5, act || 0.5);
    if (rnd() > p) return;
    const count = 1 + Math.floor(rnd() * (dist > 500 ? 3 : 2));
    for (let i = 0; i < count; i++) E.pending.push({ x: c.cx * CH + 4 + Math.floor(rnd() * (CH - 8)), y: c.cy * CH + 4 + Math.floor(rnd() * (CH - 8)) });
  };

  function hiveSpotOk(x, y) {
    for (let ty = y; ty < y + 3; ty++) for (let tx = x; tx < x + 3; tx++) {
      if (!GF.World.inBounds(tx, ty)) return false;
      if (GF.World.TERRAIN[GF.World.terrain(tx, ty)].solid) return false;
      if (GF.Ent.at(tx, ty)) return false;
    }
    return true;
  }

  function expand() {
    const hives = [];
    for (const e of GF.Ent.list.values()) if (e.def.enemy) hives.push(e);
    if (!hives.length || hives.length > 600) return;
    const h = hives[Math.floor(Math.random() * hives.length)];
    for (let tries = 0; tries < 8; tries++) {
      const a = Math.random() * 6.28, d = 7 + Math.random() * 10;
      const x = Math.round(h.x + Math.cos(a) * d), y = Math.round(h.y + Math.sin(a) * d);
      if (!hiveSpotOk(x, y)) continue;
      if (E.nearestBuilding(x, y, 36)) continue;
      if (GF.player && U.dist(x, y, GF.player.x, GF.player.y) < 30) continue;
      GF.Ent.place('hive', x, y, 0, {});
      return;
    }
  }

  E.update = function (dt) {
    // pending hive spawns from chunk generation
    if (E.pending.length) {
      const list = E.pending; E.pending = [];
      list.forEach((p) => { if (hiveSpotOk(p.x, p.y)) GF.Ent.place('hive', p.x, p.y, 0, {}); });
    }
    E._shotT = Math.max(0, E._shotT - dt);
    E.evolution = Math.min(1, E.evolution + dt * 0.0000045 * GF.Game.diff().evo);
    E._nT += dt;
    if (E._nT >= 2) { E._nT = 0; spreadNoise(); }
    const cfg = E.cfg();
    if (cfg.activity > 0) {
      E.expandT += dt * cfg.activity * cfg.freq;
      if (E.expandT > 900) { E.expandT = 0; expand(); }
    }
    rebuildGrid();
    for (const u of E.units) if (!u.dead) updateUnit(u, dt);
    separate();
    if (E.units.some((u) => u.dead)) E.units = E.units.filter((u) => !u.dead);
  };

  E.save = function () {
    const nz = [];
    for (const [k, v] of E.noise) if (v > 0.2) nz.push([k, +v.toFixed(1)]);
    return {
      evo: E.evolution, expandT: E.expandT, attacks: E.attacks,
      units: E.units.filter((u) => u.state === 'attack').map((u) => [u.type, +u.x.toFixed(2), +u.y.toFixed(2), Math.round(u.hp)]),
      noise: nz,
      hc: Array.from(E.hiveChunks),
    };
  };
  E.load = function (d) {
    E.reset();
    if (!d) return;
    E.evolution = d.evo || 0; E.expandT = d.expandT || 0; E.attacks = d.attacks || 0;
    (d.noise || []).forEach(([k, v]) => E.noise.set(k, v));
    (d.hc || []).forEach((k) => E.hiveChunks.add(k));
    (d.units || []).forEach(([t, x, y, hp]) => { if (TYPES[t]) { const u = E.spawnUnit(t, x, y, null, 'attack'); if (u) u.hp = hp; } });
  };

  GF.bus.on('chunkGen', (c) => E.onChunkGen(c));
  GF.Enemies = E;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — particles.js
 * Pooled canvas particles: smoke, sparks, dust, fire, explosions,
 * debris, gore, acid, electric arcs and muzzle flashes.
 * Positions are in tile units; the renderer converts to pixels.
 * ===================================================================== */
'use strict';
(function (GF) {
  const P = { list: [], max: 1800 };

  P.reset = () => { P.list = []; };

  function add(o) {
    if (P.list.length >= P.max) P.list.shift();
    P.list.push(o);
  }

  /** emit n particles of a type at tile position (x,y) */
  P.emit = function (type, x, y, n, opt) {
    if (!GF.Settings.get('particles') && type !== 'explosion' && type !== 'flash') return;
    const q = GF.Settings.get('quality');
    if (q === 'low') n = Math.ceil(n / 3); else if (q === 'medium') n = Math.ceil(n / 1.5);
    opt = opt || {};
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      switch (type) {
        case 'smoke':
          add({ type, x: x + (Math.random() - 0.5) * 0.3, y, vx: (Math.random() - 0.5) * 0.25 + 0.15, vy: -0.5 - Math.random() * 0.4,
            life: opt.life || 2.2 + Math.random(), t: 0, size: opt.size || 0.35, color: opt.color || '120,120,125', grow: 0.5 });
          break;
        case 'steam':
          add({ type: 'smoke', x, y, vx: (Math.random() - 0.5) * 0.3, vy: -0.9 - Math.random() * 0.5, life: 1.4, t: 0, size: 0.3, color: '235,240,245', grow: 0.7 });
          break;
        case 'spark': {
          const s = 2 + Math.random() * 3;
          add({ type, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.25 + Math.random() * 0.3, t: 0, color: opt.color || '#ffd070' });
          break;
        }
        case 'dust': {
          const s = 0.6 + Math.random();
          add({ type, x: x + (Math.random() - 0.5) * 0.6, y: y + (Math.random() - 0.5) * 0.6, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.3,
            life: 0.5 + Math.random() * 0.4, t: 0, color: opt.color || '#b09a78', size: 0.08 + Math.random() * 0.08 });
          break;
        }
        case 'debris': {
          const s = 2 + Math.random() * 5;
          add({ type: 'dust', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.6, t: 0, color: opt.color || '#555', size: 0.08 + Math.random() * 0.12, drag: 3 });
          break;
        }
        case 'gore': {
          const s = 1 + Math.random() * 3;
          add({ type: 'dust', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.8, t: 0, color: opt.color || '#a03060', size: 0.1 + Math.random() * 0.12, drag: 4 });
          break;
        }
        case 'blood': {
          const s = 1 + Math.random() * 2;
          add({ type: 'dust', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + Math.random() * 0.3, t: 0, color: '#c04070', size: 0.07, drag: 4 });
          break;
        }
        case 'acid': {
          const s = 0.5 + Math.random() * 2;
          add({ type: 'dust', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.4, t: 0, color: '#9f4', size: 0.1, drag: 4, glow: true });
          break;
        }
        case 'fire':
          add({ type, x: x + (Math.random() - 0.5) * 0.4, y, vx: (Math.random() - 0.5) * 0.3, vy: -0.8 - Math.random(), life: 0.6 + Math.random() * 0.4, t: 0, size: 0.25 });
          break;
        case 'explosion':
          add({ type, x, y, life: 0.55, t: 0, size: opt.size || 1 });
          for (let k = 0; k < 6; k++) add({ type: 'smoke', x: x + (Math.random() - 0.5), y: y + (Math.random() - 0.5), vx: (Math.random() - 0.5), vy: -0.4 - Math.random() * 0.4, life: 1.6 + Math.random(), t: 0, size: 0.5 * (opt.size || 1), color: '60,55,50', grow: 0.9 });
          for (let k = 0; k < 10; k++) { const b = Math.random() * 6.28, s = 3 + Math.random() * 5; add({ type: 'spark', x, y, vx: Math.cos(b) * s, vy: Math.sin(b) * s, life: 0.4 + Math.random() * 0.3, t: 0, color: '#ffb040' }); }
          break;
        case 'flash':
          add({ type, x, y, life: 0.06, t: 0, color: opt.color || '#ffd070' });
          break;
        case 'electric':
          add({ type, x, y, x2: opt.x2, y2: opt.y2, life: 0.15, t: 0 });
          break;
        default: break;
      }
    }
  };

  P.update = function (dt) {
    const L = P.list;
    let w = 0;
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      p.t += dt;
      if (p.t >= p.life) continue;
      if (p.vx !== undefined) {
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.drag) { p.vx *= 1 - Math.min(1, p.drag * dt); p.vy *= 1 - Math.min(1, p.drag * dt); }
        if (p.type === 'spark') { p.vx *= 0.93; p.vy *= 0.93; }
      }
      L[w++] = p;
    }
    L.length = w;
  };

  /** draw with ctx already in pixel space; toS(x,y) → screen coords, s = px per tile */
  P.draw = function (ctx, toSx, toSy, s, view) {
    for (const p of P.list) {
      if (p.x < view.x0 - 2 || p.x > view.x1 + 2 || p.y < view.y0 - 2 || p.y > view.y1 + 2) continue;
      const k = p.t / p.life;
      const X = toSx(p.x), Y = toSy(p.y);
      switch (p.type) {
        case 'smoke': {
          const r = (p.size + p.grow * k) * s;
          ctx.fillStyle = 'rgba(' + p.color + ',' + (0.35 * (1 - k)).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.283); ctx.fill();
          break;
        }
        case 'spark':
          ctx.strokeStyle = p.color; ctx.globalAlpha = 1 - k; ctx.lineWidth = Math.max(1, s * 0.05);
          ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X - p.vx * s * 0.03, Y - p.vy * s * 0.03); ctx.stroke();
          ctx.globalAlpha = 1;
          break;
        case 'dust':
          ctx.fillStyle = p.color; ctx.globalAlpha = 1 - k;
          ctx.fillRect(X - p.size * s / 2, Y - p.size * s / 2, p.size * s, p.size * s);
          ctx.globalAlpha = 1;
          break;
        case 'fire': {
          const r = p.size * (1 - k * 0.6) * s;
          ctx.fillStyle = k < 0.4 ? 'rgba(255,220,120,' + (0.9 - k) + ')' : 'rgba(255,110,30,' + (0.8 - k * 0.8) + ')';
          ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.283); ctx.fill();
          break;
        }
        case 'explosion': {
          const r = p.size * s * (0.6 + k * 1.6);
          const g = ctx.createRadialGradient(X, Y, 0, X, Y, r);
          g.addColorStop(0, 'rgba(255,250,220,' + (1 - k) + ')');
          g.addColorStop(0.4, 'rgba(255,160,40,' + (0.9 - k) + ')');
          g.addColorStop(1, 'rgba(120,30,0,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.283); ctx.fill();
          break;
        }
        case 'flash': {
          const r = s * 0.35;
          ctx.fillStyle = p.color; ctx.globalAlpha = 0.9;
          ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
          break;
        }
        case 'electric': {

<script>
/* =====================================================================
 * GREJS FACTORY — sprites.js

 * Static bodies are cached per (type, direction) into offscreen canvases;

 * Coordinates inside painters are in TILE units (1 = one tile).

'use strict';

  function paintBelt(c, tier, curve, phase) {
    const col = BELT_COL[tier];
    if (curve) {
      c.save();

      // quarter annulus centred at (0,0)

      c.strokeStyle = col; c.lineWidth = 0.05;
      for (let k = 0; k < 4; k++) {
        const p = ((k + phase) / 4);
        const a = (Math.PI / 2) * (1 - p);
        const x = Math.cos(a) * 0.5, y = Math.sin(a) * 0.5;
        const tx = Math.sin(a), ty = -Math.cos(a); // direction of travel (towards angle 0)
        const nx = Math.cos(a), ny = Math.sin(a);
        c.beginPath();
        c.moveTo(x - nx * 0.22 - tx * 0.08, y - ny * 0.22 - ty * 0.08);
        c.lineTo(x + tx * 0.04, y + ty * 0.04);
        c.lineTo(x + nx * 0.22 - tx * 0.08, y + ny * 0.22 - ty * 0.08);
        c.stroke();
      }
      c.restore();
      return;
    }
    c.fillStyle = shade(col, -0.35); c.fillRect(0, 0, 0.1, 1); c.fillRect(0.9, 0, 0.1, 1);
    c.fillStyle = col; c.fillRect(0.02, 0, 0.05, 1); c.fillRect(0.93, 0, 0.05, 1);
    c.fillStyle = '#34373c'; c.fillRect(0.1, 0, 0.8, 1);
    c.strokeStyle = shade(col, -0.1); c.lineWidth = 0.05;
    for (let k = -1; k < 5; k++) {
      const y = 1 - (k + phase) * 0.25;
      c.beginPath(); c.moveTo(0.26, y + 0.1); c.lineTo(0.5, y); c.lineTo(0.74, y + 0.1); c.stroke();
