<style>
/* =====================================================================
 * GREJS FACTORY — style.css
 * Design tokens, base elements, buttons and the main menu.
 * Palette: blued steel panels, hazard amber accent, electric cyan.
 * The game deliberately commits to one dark industrial look.
 * ===================================================================== */
:root {
  color-scheme: dark;
  --bg: #0b0f14;
  --panel: #151b23;
  --panel-2: #1c242e;
  --panel-3: #243040;
  --line: #2f3b4a;
  --line-2: #3d4b5c;
  --text: #e4eaf1;
  --muted: #8d9aab;
  --dim: #647184;
  --amber: #f2a93b;
  --amber-2: #ffcf7a;
  --amber-ink: #1d1406;
  --cyan: #4fc3e8;
  --good: #5fd38a;
  --warn: #ffb347;
  --bad: #ff5a4f;
  --radius: 4px;
  --f-display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --f-ui: 'Barlow Semi Condensed', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 500 15px/1.35 var(--f-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
#app { position: fixed; inset: 0; overflow: hidden; }
.hidden { display: none !important; }
.screen { position: absolute; inset: 0; }
canvas { display: block; }
#bg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
b { font-weight: 700; }
.dim { color: var(--muted); }
.good { color: var(--good); }
.bad { color: var(--bad); }
kbd {
  display: inline-block; min-width: 22px; padding: 1px 6px; margin: 0 2px;
  border: 1px solid var(--line-2); border-bottom-width: 3px; border-radius: 4px;
  background: var(--panel-2); font: 500 12px var(--f-mono); color: var(--text); text-align: center;
}
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ------------------------------ buttons ------------------------------ */
.btn {
  appearance: none; cursor: pointer;
  font: 600 14px/1 var(--f-ui); letter-spacing: 0.02em; color: var(--text);
  background: linear-gradient(#27313e, #1e2631);
  border: 1px solid var(--line-2); border-radius: var(--radius);
  padding: 9px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 0 rgba(0,0,0,.35);
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { border-color: var(--amber); background: linear-gradient(#303c4b, #252f3b); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; cursor: not-allowed; border-color: var(--line); }
.btn.sm { padding: 5px 9px; font-size: 13px; }
.btn.big { padding: 13px 20px; font: 700 18px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.btn-primary { background: linear-gradient(#f7b84d, #d98d1f); color: var(--amber-ink); border-color: #ffd48a; }
.btn-primary:hover { background: linear-gradient(#ffc862, #e89a28); border-color: #fff0c8; }
.btn-danger:hover { border-color: var(--bad); color: #ffd0cc; }
.btn-ghost { background: transparent; box-shadow: none; }
.btn small { display: block; font: 500 12px var(--f-ui); letter-spacing: 0; text-transform: none; opacity: .75; margin-top: 3px; }
.btn.big small { margin-left: 8px; margin-top: 0; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.btn-col { display: flex; flex-direction: column; gap: 6px; }
.hidden-file { display: none; }
label.btn { cursor: pointer; }

.inp {
  font: 500 15px var(--f-ui); color: var(--text); background: #0f141a;
  border: 1px solid var(--line-2); border-radius: var(--radius); padding: 8px 10px; min-width: 0;
  user-select: text;
}
.inp:focus { border-color: var(--amber); outline: none; }
.inp.sm { width: 76px; padding: 4px 6px; font-size: 14px; }
.inp.code { width: 100%; font: 500 12px var(--f-mono); resize: vertical; }

/* ------------------------------ main menu ------------------------------ */
#menu { display: flex; align-items: center; justify-content: center; overflow: auto; padding-inline: 16px; }
.menu-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 32px; width: 100%; max-width: 980px; }
.logo { display: flex; align-items: center; gap: 18px; }
.logo-gear { width: 92px; height: 92px; fill: var(--amber); animation: spin 18s linear infinite; filter: drop-shadow(0 0 18px rgba(242,169,59,.35)); }
.logo-gear circle { fill: #0b0f14; }
.logo-text { display: flex; flex-direction: column; line-height: .86; }
.logo-text .l1 { font: 700 76px var(--f-display); letter-spacing: .08em; color: var(--text); text-shadow: 0 4px 0 #000, 0 0 40px rgba(79,195,232,.25); }
.logo-text .l2 { font: 700 34px var(--f-display); letter-spacing: .52em; color: var(--amber); padding-left: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
.menu-sub { font: 600 14px var(--f-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.menu-col { display: flex; flex-direction: column; gap: 10px; width: min(340px, 100%); }
.menu-col a.btn { text-decoration: none; }
.menu-col .btn.alley-back { margin-top: 6px; border-left-color: var(--amber); }
.menu-col .btn { justify-content: flex-start; background: linear-gradient(90deg, rgba(28,36,46,.95), rgba(21,27,35,.85)); border-left: 4px solid var(--line-2); }
.menu-col .btn:hover:not([disabled]) { border-left-color: var(--amber); }
.menu-col .btn-primary { background: linear-gradient(90deg, #f7b84d, #d98d1f); border-left-color: #fff0c8; }
.menu-foot { font-size: 12px; color: var(--dim); letter-spacing: .04em; }
.panel {
  background: rgba(17, 22, 29, .94); border: 1px solid var(--line); border-radius: 6px;
  padding: 22px 24px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.55);
}
.panel h2 { margin: 0 0 14px; font: 700 26px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--amber); text-wrap: balance; }
.ng-cols { display: flex; gap: 24px; flex-wrap: wrap; }
.ng-form { flex: 1 1 460px; display: flex; flex-direction: column; gap: 6px; }
.ng-prev { flex: 0 0 240px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
#ng-preview { width: 240px; height: 240px; max-width: 100%; border: 1px solid var(--line-2); border-radius: 4px; background: #05070a; image-rendering: pixelated; }
.set-row { display: flex; align-items: center; gap: 10px; min-height: 36px; flex-wrap: wrap; }
.set-row > span:first-child { flex: 0 0 170px; color: var(--muted); font-weight: 600; }
.set-row .inp { flex: 1; }
.set-row input[type=range] { flex: 1; accent-color: var(--amber); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
.seg button {
  font: 600 13px var(--f-ui); color: var(--muted); background: #121820; border: 0; border-right: 1px solid var(--line);
  padding: 6px 11px; cursor: pointer;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--amber); color: var(--amber-ink); }
.loading { display: flex; align-items: center; gap: 14px; font: 600 18px var(--f-display); letter-spacing: .06em; color: var(--muted); }
.spinner { width: 26px; height: 26px; border: 3px solid var(--line-2); border-top-color: var(--amber); border-radius: 50%; animation: spin .8s linear infinite; }
.credits p { max-width: 62ch; color: var(--muted); }
.credits .logo { transform: scale(.7); transform-origin: left; }
.tbl.ctl td:first-child { white-space: nowrap; padding-right: 18px; }

/* mobile notice */
#mobile-note { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(5,8,12,.85); padding-inline: 16px; }
#mobile-note.open { display: flex; }
.mn-box { max-width: 420px; background: var(--panel); border: 1px solid var(--amber); padding: 20px; border-radius: 6px; }
.mn-box p { color: var(--muted); }
.noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }

@media (max-width: 640px) {
  .logo-text .l1 { font-size: 48px; }
  .logo-text .l2 { font-size: 22px; }
  .logo-gear { width: 60px; height: 60px; }
  .set-row > span:first-child { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .logo-gear, .spinner { animation: none; }
}

</style>
<style>
/* =====================================================================
 * GREJS FACTORY — game.css
 * In-game HUD: top status bar, player panel, tutorial card, minimap,
 * selection info, warnings, hotbar, crafting queue and debug overlay.
 * ===================================================================== */
#game-canvas { position: absolute; inset: 0; cursor: crosshair; }
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud button, #hud [data-a], .hud-panel, #hud-warnings .warn-item, #hud-hotbar, #hud-craftq .cq, .mm-wrap { pointer-events: auto; }

.hud-panel {
  background: linear-gradient(180deg, rgba(24,31,40,.92), rgba(16,21,28,.92));
  border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 6px 18px rgba(0,0,0,.4);
}

/* top status bar */
#hud-top {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: stretch; gap: 0; max-width: calc(100% - 520px);
  background: rgba(14,19,25,.92); border: 1px solid var(--line); border-top: 2px solid var(--amber);
  border-radius: 0 0 var(--radius) var(--radius); font: 600 14px var(--f-ui); pointer-events: auto;
  font-variant-numeric: tabular-nums;
}
.ht-cell { padding: 7px 12px; border-right: 1px solid var(--line); white-space: nowrap; display: flex; align-items: center; gap: 6px; overflow: hidden; }
.ht-cell[data-a] { cursor: pointer; }
.ht-cell[data-a]:hover { background: rgba(255,255,255,.04); }
.ht-cell.bad { color: var(--bad); }
.ht-cell b { font-family: var(--f-display); letter-spacing: .04em; }
.ht-menu { display: flex; }
.ht-menu button { background: none; border: 0; border-right: 1px solid var(--line); color: var(--text); padding: 0 10px; cursor: pointer; font-size: 16px; }
.ht-menu button:last-child { border-right: 0; }
.ht-menu button:hover { background: rgba(242,169,59,.15); }

/* left column */
#hud-leftcol { position: absolute; top: 8px; left: 8px; width: 250px; display: flex; flex-direction: column; gap: 8px; }
#hud-left { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.pl-row { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.pl-name { font: 700 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.pl-hp { font: 500 12px var(--f-mono); color: var(--muted); }
.pl-ammo { margin-left: auto; font: 500 13px var(--f-mono); color: var(--amber-2); }
#hud-tutorial { padding: 10px 12px; border-left: 3px solid var(--cyan); }
.tut-head { display: flex; justify-content: space-between; align-items: center; font: 700 11px var(--f-display); letter-spacing: .18em; color: var(--cyan); }
.tut-x { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 12px; }
.tut-title { font: 700 17px var(--f-display); margin: 4px 0; }
.tut-hint { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
.tut-hint b { color: var(--amber-2); }

/* right column */
#hud-right { position: absolute; top: 8px; right: 8px; width: 236px; display: flex; flex-direction: column; gap: 8px; }
.mm-wrap { position: relative; padding: 6px; }
#minimap { width: 222px; height: 222px; border-radius: 2px; background: #05070a; cursor: pointer; image-rendering: pixelated; }
.mm-ctrl { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 3px; }
.mm-ctrl button { width: 24px; height: 24px; background: rgba(12,16,22,.85); color: var(--text); border: 1px solid var(--line-2); border-radius: 3px; cursor: pointer; font-size: 13px; padding: 0; }
.mm-ctrl button:hover { border-color: var(--amber); }
#hud-select { padding: 8px 10px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
.sel-title { display: flex; align-items: center; gap: 6px; font: 700 15px var(--f-display); }
.sel-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#hud-warnings { display: flex; flex-direction: column; gap: 4px; }
.warn-item {
  background: rgba(40,18,12,.9); border: 1px solid #6a2a1c; border-left: 3px solid var(--bad);
  padding: 5px 9px; font-size: 13px; cursor: pointer; border-radius: 3px; color: #ffd6cf;
}
.warn-item:hover { border-color: var(--bad); }

/* bottom: hotbar & craft queue */
#hud-bottom { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
#hud-craftq { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 560px; }
.cq { position: relative; width: 38px; height: 38px; background: rgba(16,21,28,.92); border: 1px solid var(--line-2); border-radius: 3px; cursor: pointer; overflow: hidden; }
.cq .ico { width: 34px; height: 34px; margin: 1px; position: relative; z-index: 1; }
.cq-bar { position: absolute; left: 0; bottom: 0; width: 100%; background: rgba(242,169,59,.35); }
.cq:hover { border-color: var(--bad); }
#hud-hotbar { display: flex; gap: 4px; padding: 5px; background: rgba(12,16,22,.9); border: 1px solid var(--line); border-radius: var(--radius); }
.hb-slot {
  position: relative; width: 50px; height: 50px; border: 1px solid var(--line-2); border-radius: 3px; cursor: pointer;
  background: linear-gradient(#1f2833, #161d25);
}
.hb-slot:hover { border-color: var(--amber); }
.hb-slot.active { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(242,169,59,.5), inset 0 0 12px rgba(242,169,59,.25); }
.hb-slot.empty .hb-ico { opacity: .35; filter: grayscale(1); }
.hb-slot em { position: absolute; left: 3px; top: 1px; font: 500 11px var(--f-mono); color: var(--dim); font-style: normal; z-index: 2; }
.hb-slot b { position: absolute; right: 3px; bottom: 1px; font: 700 12px var(--f-ui); text-shadow: 0 1px 2px #000, 0 0 3px #000; z-index: 2; }
.hb-ico { position: absolute; inset: 5px; }

#debug {
  position: absolute; left: 270px; top: 56px; padding: 8px 10px; background: rgba(0,0,0,.72); border: 1px solid #2c6;
  font: 500 12px/1.5 var(--f-mono); color: #9f9; pointer-events: none; font-variant-numeric: tabular-nums;
}

/* toasts */
#toasts { position: fixed; bottom: 12px; left: 12px; max-width: min(420px, calc(100vw - 24px)); display: flex; flex-direction: column; align-items: flex-start; gap: 5px; z-index: 60; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; font: 600 14px var(--f-ui);
  background: rgba(16,21,28,.95); border: 1px solid var(--line-2); border-radius: 3px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  animation: tin .25s ease-out;
}
.toast .ico { width: 22px; height: 22px; }
.toast .tn { color: var(--amber); }
.toast.t-good { border-color: #2f7a4a; border-left: 3px solid var(--good); }
.toast.t-warn { border-color: #7a5a1f; border-left: 3px solid var(--warn); }
.toast.t-bad { border-color: #7a2f2a; border-left: 3px solid var(--bad); }
.toast.t-mile { border-color: var(--amber); background: linear-gradient(90deg, rgba(60,40,10,.95), rgba(16,21,28,.95)); font-family: var(--f-display); font-size: 16px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: all .35s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* screen sizes */
@media (max-width: 1400px) {
  #hud-top { max-width: calc(100% - 520px); font-size: 13px; }
  .ht-cell { padding: 6px 8px; }
}
@media (max-width: 1100px) {
  #hud-top { top: auto; bottom: 128px; max-width: calc(100% - 16px); flex-wrap: wrap; justify-content: center; border-radius: var(--radius); }
  #hud-leftcol { width: 220px; }
  #hud-right { width: 200px; }
  #minimap { width: 186px; height: 186px; }
  .hb-slot { width: 42px; height: 42px; }
}
@media (max-height: 720px) {
  #hud-tutorial .tut-hint { font-size: 12.5px; }
  #minimap { width: 170px; height: 170px; }
  #hud-right { width: 184px; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

</style>
<style>
/* =====================================================================
 * GREJS FACTORY — ui.css
 * Windows, slots & icons, tabs, tables, bars, tooltips, modal dialogs,
 * technology tree, map, saves and settings.
 * ===================================================================== */

/* ------------------------------ icons ------------------------------ */
.ico { display: inline-block; position: relative; width: 26px; height: 26px; background-size: contain; background-repeat: no-repeat; background-position: center; vertical-align: middle; flex: none; }
.ico > b { position: absolute; right: -2px; bottom: -3px; font: 700 11px var(--f-ui); color: #fff; text-shadow: 0 1px 2px #000, 0 0 2px #000, 0 0 3px #000; white-space: nowrap; pointer-events: none; }
.ico.mini { width: 16px; height: 16px; }

/* ------------------------------ windows ------------------------------ */
#windows { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
.win {
  pointer-events: auto; position: relative;
  max-width: calc(100vw - 32px); max-height: calc(100vh - 150px);
  background: linear-gradient(180deg, #1a212b, #131920);
  border: 1px solid var(--line-2); border-top: 3px solid var(--amber); border-radius: var(--radius);
  box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
  display: flex; flex-direction: column; animation: win-in .14s ease-out;
}
@keyframes win-in { from { opacity: 0; transform: translateY(8px) scale(.99); } }
.win-head { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px 8px 14px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.18); }
.win-head h2 { margin: 0; font: 700 17px var(--f-display); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.win-head .hp-mini { font: 500 12px var(--f-mono); color: var(--muted); text-transform: none; letter-spacing: 0; }
.win-x { background: none; border: 1px solid transparent; color: var(--muted); font-size: 16px; cursor: pointer; width: 28px; height: 28px; border-radius: 3px; }
.win-x:hover { color: var(--text); border-color: var(--bad); }
.win-body { padding: 12px 14px 14px; overflow: auto; min-height: 0; }
.cols { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sec-title { font: 700 12px var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.lbl { font: 600 11px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.4; max-width: 62ch; }
.hint b { color: var(--amber-2); }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
.row.status b { color: var(--text); }
.row.status.bad b { color: var(--bad); }
.scroll { overflow: auto; }

/* ------------------------------ slots & grids ------------------------------ */
.grid { display: grid; gap: 3px; }
.grid.g10 { grid-template-columns: repeat(10, 42px); }
.grid.g8 { grid-template-columns: repeat(8, 42px); }
.slots { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.slot {
  position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(#212a35, #1a212a); border: 1px solid #2c3743; border-radius: 3px; cursor: pointer;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
}
.slot:hover { border-color: var(--amber); background: #26303c; }
.slot.empty { background: #161c23; cursor: default; }
.slot.empty:hover { border-color: #3a4655; }
.slot .ico { width: 34px; height: 34px; }
.slot.ghosted .ico { opacity: .35; }
.slot.fuel { border-color: #6a4a1f; }
.slot.filter { border-style: dashed; border-color: var(--cyan); }
.slot.sel { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.slot.recipe.none .ico { opacity: .45; filter: grayscale(.7); }
.slot.recipe.sub { border-color: #4a5a3a; }
.slot.locked .ico { opacity: .25; filter: grayscale(1); }
.slot .lock { position: absolute; font-size: 12px; font-style: normal; }
.inv-scroll { max-height: 360px; }
.inv-scroll.small { max-height: 300px; }

<script>
/* =====================================================================
 * GREJS FACTORY — util.js
 * Shared helpers: constants, seeded RNG, gradient noise, formatting,
 * a tiny event bus and small DOM helpers.
 * Everything lives on the global namespace `GF` (classic scripts are
 * used on purpose so the game also works from file://).
 * ===================================================================== */
'use strict';
window.GF = window.GF || {};

(function (GF) {
  const U = {};

  U.TS = 32;              // pixels per tile at zoom 1
  U.CHUNK = 32;           // tiles per chunk side
  U.DIRS = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }]; // N E S W
  U.DIR_NAMES = ['Nord', 'Øst', 'Syd', 'Vest'];

  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.smooth = (t) => t * t * (3 - 2 * t);
  U.dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  U.dist2 = (x1, y1, x2, y2) => (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);

  /** numeric map key for integer tile / chunk coordinates */
  U.key = (x, y) => (x + 32768) * 65536 + (y + 32768);
  U.unkey = (k) => [Math.floor(k / 65536) - 32768, (k % 65536) - 32768];

  /** FNV-1a string hash → uint32 */
  U.hashString = function (str) {
    let h = 0x811c9dc5;
    str = String(str);
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  };

  /** Seeded PRNG (mulberry32). Returns function → [0,1) */
  U.rng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /** Integer hash of a coordinate pair and seed → uint32 */
  U.ihash = function (x, y, s) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return h >>> 0;
  };
  U.hash2 = (x, y, s) => U.ihash(x, y, s) / 4294967296;

  // 16 unit gradients for gradient noise
  const GR = [];
  for (let i = 0; i < 16; i++) GR.push([Math.cos((i / 16) * Math.PI * 2), Math.sin((i / 16) * Math.PI * 2)]);
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);

  /** 2D gradient (Perlin-style) noise, roughly in [-1, 1] */
  U.noise2 = function (x, y, s) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x - x0, fy = y - y0;
    const g00 = GR[U.ihash(x0, y0, s) & 15], g10 = GR[U.ihash(x0 + 1, y0, s) & 15];
    const g01 = GR[U.ihash(x0, y0 + 1, s) & 15], g11 = GR[U.ihash(x0 + 1, y0 + 1, s) & 15];
    const n00 = g00[0] * fx + g00[1] * fy;
    const n10 = g10[0] * (fx - 1) + g10[1] * fy;
    const n01 = g01[0] * fx + g01[1] * (fy - 1);
    const n11 = g11[0] * (fx - 1) + g11[1] * (fy - 1);
    const u = fade(fx), v = fade(fy);
    return (n00 + (n10 - n00) * u + (n01 - n00) * v + (n00 - n10 - n01 + n11) * u * v) * 1.414;
  };

  /** fractal Brownian motion */
  U.fbm = function (x, y, s, oct) {
    let sum = 0, amp = 1, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) {
      sum += U.noise2(x * f, y * f, s + i * 1013) * amp;
      norm += amp;
      amp *= 0.5;
      f *= 2;
    }
    return sum / norm;
  };

  /* ---------- formatting ---------- */
  U.fmt = function (n) {
    n = +n || 0;
    const a = Math.abs(n);
    if (a >= 1e9) return (n / 1e9).toFixed(1) + 'G';
    if (a >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (a >= 1e4) return (n / 1e3).toFixed(1) + 'k';
    if (a >= 100 || Number.isInteger(n)) return Math.round(n).toString();
    return n.toFixed(1);
  };
  U.fmtW = function (w) {
    const a = Math.abs(w);
    if (a >= 1e9) return (w / 1e9).toFixed(2) + ' GW';
    if (a >= 1e6) return (w / 1e6).toFixed(2) + ' MW';
    if (a >= 1e3) return (w / 1e3).toFixed(1) + ' kW';
    return Math.round(w) + ' W';
  };
  U.fmtJ = function (j) {
    const a = Math.abs(j);
    if (a >= 1e12) return (j / 1e12).toFixed(2) + ' TJ';
    if (a >= 1e9) return (j / 1e9).toFixed(2) + ' GJ';
    if (a >= 1e6) return (j / 1e6).toFixed(2) + ' MJ';
    if (a >= 1e3) return (j / 1e3).toFixed(1) + ' kJ';
    return Math.round(j) + ' J';
  };
  U.fmtTime = function (sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + 't ' + String(m).padStart(2, '0') + 'm';
    if (m > 0) return m + 'm ' + String(s).padStart(2, '0') + 's';
    return s + 's';
  };
  U.fmtClock = function (frac) {
    const mins = Math.floor(frac * 24 * 60) % (24 * 60);
    return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
  };

  /* ---------- base64 for typed arrays (save files) ---------- */
  U.u8ToB64 = function (u8) {
    let s = '';
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  };
  U.b64ToU8 = function (b) {
    const s = atob(b);
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  };

  /* ---------- DOM helpers ---------- */
  U.$ = (sel, root) => (root || document).querySelector(sel);
  U.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  U.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.el = function (tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };

  /** safe JSON parse with fallback */
  U.parse = function (str, fallback) {
    try { const v = JSON.parse(str); return v == null ? fallback : v; } catch (e) { return fallback; }
  };

  /** safe localStorage access (may throw in private mode / file://) */
  U.ls = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };

  GF.U = U;

  /* ---------- tiny event bus ---------- */
  const handlers = {};
  GF.bus = {
    on(ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); },
    off(ev, fn) { if (handlers[ev]) handlers[ev] = handlers[ev].filter((f) => f !== fn); },
    emit(ev, a, b, c) {
      const list = handlers[ev];
      if (!list) return;
      for (let i = 0; i < list.length; i++) {
        try { list[i](a, b, c); } catch (err) { console.error('[bus]', ev, err); }
      }
    },
  };
})(window.GF);

</script>

<script>
/* =====================================================================
 * GREJS FACTORY — inventory.js
 * Slot based inventory with stack limits. Used by the player, chests,
 * vehicles and a few machines. `ver` increments on every change so the
 * UI can cheaply detect when to redraw.
 * ===================================================================== */
'use strict';
(function (GF) {
  class Inventory {
    constructor(size, filter) {
      this.size = size;
      this.slots = new Array(size).fill(null);
      this.ver = 0;
      this.filter = filter || null; // optional (id) => bool
    }

    touch() { this.ver++; }

    count(id) {
      let n = 0;
      for (const s of this.slots) if (s && s.id === id) n += s.n;
      return n;
    }

    /** total map id → count */
    totals() {
      const m = {};
      for (const s of this.slots) if (s) m[s.id] = (m[s.id] || 0) + s.n;
      return m;
    }

    isEmpty() { return this.slots.every((s) => !s); }
    freeSlots() { return this.slots.filter((s) => !s).length; }

    /** how many of `id` could be added */
    room(id) {
      if (this.filter && !this.filter(id)) return 0;
      const st = GF.stackOf(id);
      let r = 0;
      for (const s of this.slots) {
        if (!s) r += st;
        else if (s.id === id) r += Math.max(0, st - s.n);
      }
      return r;
    }
    canAdd(id, n) { return this.room(id) >= (n || 1); }

    /** add items, returns the amount that did NOT fit */
    add(id, n) {
      if (!id || n <= 0) return 0;
      if (this.filter && !this.filter(id)) return n;
      const st = GF.stackOf(id);
      let left = n;
      for (const s of this.slots) {
        if (left <= 0) break;
        if (s && s.id === id && s.n < st) { const a = Math.min(st - s.n, left); s.n += a; left -= a; }
      }
      for (let i = 0; i < this.slots.length && left > 0; i++) {
        if (!this.slots[i]) { const a = Math.min(st, left); this.slots[i] = { id, n: a }; left -= a; }
      }
      if (left !== n) this.touch();
      return left;
    }

    /** remove up to n items, returns amount removed */
    remove(id, n) {
      let left = n;
      for (let i = this.slots.length - 1; i >= 0 && left > 0; i--) {
        const s = this.slots[i];
        if (s && s.id === id) {
          const a = Math.min(s.n, left);
          s.n -= a; left -= a;
          if (s.n <= 0) this.slots[i] = null;
        }
      }
      if (left !== n) this.touch();
      return n - left;
    }

    /** first item id matching filter */
    firstMatching(fn) {
      for (const s of this.slots) if (s && (!fn || fn(s.id))) return s.id;
      return null;
    }

    has(map) {
      for (const id in map) if (this.count(id) < map[id]) return false;
      return true;
    }

    /** merge stacks and sort by item group/name */
    sort() {
      const tot = this.totals();
      const order = GF.GROUPS.map((g) => g[0]);
      const ids = Object.keys(tot).sort((a, b) => {
        const ga = order.indexOf(GF.item(a).group), gb = order.indexOf(GF.item(b).group);
        return ga - gb || GF.itemName(a).localeCompare(GF.itemName(b));
      });
      this.slots.fill(null);
      let i = 0;
      ids.forEach((id) => {
        let n = tot[id];
        const st = GF.stackOf(id);
        while (n > 0 && i < this.size) { const a = Math.min(st, n); this.slots[i++] = { id, n: a }; n -= a; }
      });
      this.touch();
    }

    /** move a whole slot's content into another inventory, returns moved amount */
    transferSlot(i, other, amount) {
      const s = this.slots[i];
      if (!s) return 0;
      const want = Math.min(amount == null ? s.n : amount, s.n);
      const left = other.add(s.id, want);
      const moved = want - left;
      if (moved > 0) {
        s.n -= moved;
        if (s.n <= 0) this.slots[i] = null;
        this.touch();
      }
      return moved;
    }

    /** move all of an item id into another inventory */
    transferAll(id, other) {
      const n = this.count(id);
      const left = other.add(id, n);
      this.remove(id, n - left);
      return n - left;
    }

    list() { return this.slots.filter(Boolean).map((s) => ({ id: s.id, n: s.n })); }

    resize(size) {
      const items = this.list();
      this.size = size;
      this.slots = new Array(size).fill(null);
      const over = [];
      items.forEach((it) => { const l = this.add(it.id, it.n); if (l) over.push({ id: it.id, n: l }); });
      this.touch();
      return over;
    }

    toJSON() { return this.slots.map((s) => (s ? [s.id, s.n] : 0)); }
    static from(arr, size, filter) {
      const inv = new Inventory(size || (arr ? arr.length : 10), filter);
      if (Array.isArray(arr)) {
        arr.forEach((s, i) => {
          if (s && i < inv.size && GF.ITEMS[s[0]] && s[1] > 0) inv.slots[i] = { id: s[0], n: Math.min(s[1], GF.stackOf(s[0])) };
        });
      }
      return inv;
    }
  }

  GF.Inventory = Inventory;
})(window.GF);

</script>

    turret_laser: { name: 'Lasertårn', w: 2, h: 2, hp: 1000, kind: 'turret', range: 24, rate: 3, dmg: 22, energy: 'electric', power: 600 * k, laser: true, group: 'defense', light: 3, stack: 50, desc: 'Elektrisk forsvarstårn. Kræver strøm.' },
    turret_cannon: { name: 'Kanonstilling', w: 3, h: 3, hp: 1200, kind: 'turret', range: 34, minRange: 6, rate: 0.5, ammo: 'cannon', group: 'defense', light: 3, stack: 20, desc: 'Langtrækkende kanon med områdeskade. Kræver kanongranater.' },

  };
  // inserter default stack for item stack (typo guard)
  delete D.inserter.stack_;

  GF.DEFS = D;
  GF.Kinds = GF.Kinds || {};

  // generate building items
  for (const id in D) {
    const d = D[id];
    d.id = id;
    if (d.noItem) continue;
    GF.ITEMS[id] = Object.assign(GF.ITEMS[id] || {}, {
      name: d.name, stack: d.stackSize || (typeof d.stack === 'number' && d.kind !== 'inserter' ? d.stack : 50),
      group: d.group, place: id, desc: d.desc,
    });
    if (id === 'pipe') GF.ITEMS.pipe.stack = 100;
  }
  // belts & pipes stack to 100
  ['belt', 'fast_belt', 'express_belt', 'wall', 'pipe'].forEach((id) => { GF.ITEMS[id].stack = 100; });

  /* ==================================================================
   * ENTITY MANAGER
   * ================================================================== */
  const CH = U.CHUNK;
  const Ent = {
    list: new Map(),        // id → entity
    tiles: new Map(),       // tileKey → entity
    chunks: new Map(),      // chunkKey → Set(entity)
    updaters: [],
    updDirty: true,
    nextId: 1,
    count: 0,
  };

  Ent.reset = function () {
    Ent.list.clear(); Ent.tiles.clear(); Ent.chunks.clear();
    Ent.updaters = []; Ent.updDirty = true; Ent.nextId = 1; Ent.count = 0;
  };

  Ent.size = function (type, dir) {
    const d = D[type];
    if (!d) return { w: 1, h: 1 };
    return (dir & 1) ? { w: d.h, h: d.w } : { w: d.w, h: d.h };
  };

  Ent.at = (x, y) => Ent.tiles.get(U.key(x, y)) || null;
  Ent.solidAt = function (x, y) {
    const e = Ent.tiles.get(U.key(x, y));
    return !!(e && e.def.solid !== false);
  };
  Ent.center = (e) => ({ x: e.x + e.w / 2, y: e.y + e.h / 2 });

  /** iterate entities whose top-left chunk is in the (inclusive) chunk range */
  Ent.forChunks = function (cx0, cy0, cx1, cy1, fn) {
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const set = Ent.chunks.get(U.key(cx, cy));
        if (set) for (const e of set) fn(e);
      }
    }
  };

  /** entities intersecting the tile rectangle [x0..x1]×[y0..y1] */
  Ent.inRect = function (x0, y0, x1, y1) {
    const out = [];
    const cx0 = Math.floor((x0 - 8) / CH), cy0 = Math.floor((y0 - 8) / CH);
    const cx1 = Math.floor(x1 / CH), cy1 = Math.floor(y1 / CH);
    Ent.forChunks(cx0, cy0, cx1, cy1, (e) => {
      if (e.x <= x1 && e.x + e.w - 1 >= x0 && e.y <= y1 && e.y + e.h - 1 >= y0) out.push(e);
    });
    return out;
  };

  /** entities whose centre lies within radius r of (x,y) (tile units) */
  Ent.near = function (x, y, r, filter) {
    const out = [];
    const cx0 = Math.floor((x - r - 8) / CH), cy0 = Math.floor((y - r - 8) / CH);
    const cx1 = Math.floor((x + r) / CH), cy1 = Math.floor((y + r) / CH);
    const r2 = r * r;
    Ent.forChunks(cx0, cy0, cx1, cy1, (e) => {
      const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
      if ((ex - x) * (ex - x) + (ey - y) * (ey - y) <= r2 && (!filter || filter(e))) out.push(e);
    });
    return out;
  };

  /** tile in front of the entity (output side) */
  Ent.frontTile = function (e, dist) {
    dist = dist || 1;
    const { x, y, w, h } = e;
    switch (e.dir) {
      case 0: return { x: x + ((w - 1) >> 1), y: y - dist };
      case 1: return { x: x + w - 1 + dist, y: y + ((h - 1) >> 1) };
      case 2: return { x: x + (w >> 1), y: y + h - 1 + dist };
      default: return { x: x - dist, y: y + (h >> 1) };
    }
  };

  /** Validate a placement. Returns {ok, reason, replace} */
  Ent.canPlace = function (type, x, y, dir, opts) {
    opts = opts || {};
    const d = D[type];
    if (!d) return { ok: false, reason: 'Ukendt bygning' };
    const { w, h } = Ent.size(type, dir);
    const W = GF.World;
    let replace = null;
    for (let ty = y; ty < y + h; ty++) {
      for (let tx = x; tx < x + w; tx++) {
        if (!W.inBounds(tx, ty)) return { ok: false, reason: 'Uden for kortet' };
        const t = W.terrain(tx, ty);
        if (W.TERRAIN[t].solid) {
          return { ok: false, reason: W.TERRAIN[t].water ? 'Kan ikke bygge på vand' : 'Terrænet er ufremkommeligt' };
        }
        const other = Ent.at(tx, ty);
        if (other && other !== opts.ignore) {
          // fast-replace of belts (rotate / upgrade) and similar 1x1 swaps
          if (w === 1 && h === 1 && other.w === 1 && other.h === 1 && GF.Belts && GF.Belts.isBeltFamily(other) &&
              GF.Belts.isBeltFamily({ def: d }) && d.kind === other.def.kind && (other.type !== type || other.dir !== dir)) {
            replace = other;
          } else if (other.def.enemy) {
            return { ok: false, reason: 'Kryberede i vejen' };
          } else {
            return { ok: false, reason: 'Optaget af ' + other.def.name };
          }
        }
        if (GF.Enemies && GF.Enemies.unitBlocking && GF.Enemies.unitBlocking(tx, ty)) return { ok: false, reason: 'Fjende i vejen' };
      }
    }
    // resource requirements
    if (d.kind === 'drill') {
      const a = d.area;
      let found = false;
      for (let ty = y - a; ty < y + h + a && !found; ty++) {
        for (let tx = x - a; tx < x + w + a; tx++) {
          const o = W.ore(tx, ty);
          if (o && o.type !== 'crude') { found = true; break; }
        }
      }
      if (!found) return { ok: false, reason: 'Ingen malm under boret' };
    }
    if (d.kind === 'oilpump') {
      let found = false;
      for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++) { const o = W.ore(tx, ty); if (o && o.type === 'crude') found = true; }
      if (!found) return { ok: false, reason: 'Skal stå på en oliekilde' };
    }
    if (d.kind === 'offshore') {
      let water = false;
      for (let i = 0; i < 4; i++) { const v = U.DIRS[i]; if (W.TERRAIN[W.terrain(x + v.x, y + v.y)].water) water = true; }
      if (!water) return { ok: false, reason: 'Skal placeres ved siden af vand' };
    }
    return { ok: true, reason: '', replace };
  };

  function register(e) {
    for (let ty = e.y; ty < e.y + e.h; ty++) for (let tx = e.x; tx < e.x + e.w; tx++) Ent.tiles.set(U.key(tx, ty), e);
    const ck = U.key(Math.floor(e.x / CH), Math.floor(e.y / CH));
    let set = Ent.chunks.get(ck);
    if (!set) { set = new Set(); Ent.chunks.set(ck, set); }
    set.add(e);
  }
  function unregister(e) {
    for (let ty = e.y; ty < e.y + e.h; ty++) for (let tx = e.x; tx < e.x + e.w; tx++) {
      const kk = U.key(tx, ty);
      if (Ent.tiles.get(kk) === e) Ent.tiles.delete(kk);
    }
    const ck = U.key(Math.floor(e.x / CH), Math.floor(e.y / CH));
    const set = Ent.chunks.get(ck);
    if (set) { set.delete(e); if (!set.size) Ent.chunks.delete(ck); }
  }

  /** mark dependent systems dirty after a change around an entity */
  function touchSystems(e) {
    const d = e.def;
    if (d.kind === 'pole' || d.energy === 'electric' || ['burnergen', 'steamengine', 'solar', 'accumulator', 'reactor'].includes(d.kind)) GF.Power.dirty = true;
    if (d.fluidBox) GF.Fluids.dirty = true;
    if (GF.Belts && GF.Belts.isBeltFamily(e)) GF.Belts.reshapeAround(e);
    if (d.kind === 'roboport' || d.logi) GF.Logistics.dirty = true;
    Ent.updDirty = true;
  }

  /**
   * Create an entity. `state` is optional saved kind-state.
   * Does NOT check inventory or placement validity (callers do).
   */
  Ent.place = function (type, x, y, dir, state) {
    const d = D[type];
    if (!d) return null;
    dir = d.rot ? (dir | 0) & 3 : 0;
    const { w, h } = Ent.size(type, dir);
    // clear decorations (trees/rocks) under the footprint
    for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++) {
      if (GF.World.deco(tx, ty)) {
        const drops = GF.World.removeDeco(tx, ty);
        if (drops && GF.player && !state) GF.player.giveOrDrop(drops.id, drops.n);
      }
    }
    const e = {
      id: Ent.nextId++, type, def: d, kind: d.kind, x, y, w, h, dir,
      hp: d.hp, maxHp: d.hp, on: true, prio: false,
    };
    if (state && state.hp != null) e.hp = state.hp;
    if (state && state.on === false) e.on = false;
    if (state && state.prio) e.prio = true;
    const K = GF.Kinds[d.kind];
    if (K && K.init) K.init(e, state || null);
    Ent.list.set(e.id, e);
    register(e);
    Ent.count++;
    touchSystems(e);
    if (K && K.onBuild) K.onBuild(e, !!state);
    GF.bus.emit('built', e, !!state);
    return e;
  };

  /** list of items contained in an entity (returned when removed) */
  Ent.contents = function (e) {
    const K = GF.Kinds[e.kind];
    return (K && K.contents) ? K.contents(e) : [];
  };

  /**
   * Remove an entity.
   * opts.inv: Inventory to receive the building + contents
   * opts.destroyed: no item returned (destroyed by enemies)
   * Returns list of {id,n} that could not be stored.
   */
  Ent.remove = function (e, opts) {
    opts = opts || {};
    if (!e || e.dead) return [];
    const K = GF.Kinds[e.kind];
    const items = [];
    if (!opts.destroyed) {
      if (!e.def.noItem) items.push({ id: e.type, n: 1 });
      Ent.contents(e).forEach((it) => { if (it && it.n > 0) items.push(it); });
    }
    if (K && K.onRemove) K.onRemove(e);
    e.dead = true;
    unregister(e);
    Ent.list.delete(e.id);
    Ent.count--;
    touchSystems(e);
    GF.bus.emit('removed', e, opts);
    const left = [];
    items.forEach((it) => {
      let rest = it.n;
      if (opts.inv) rest = opts.inv.add(it.id, it.n);
      if (rest > 0) left.push({ id: it.id, n: rest });
    });
    return left;
  };

  /** rebuild the update list (entities that have an update function) */
  Ent.getUpdaters = function () {
    if (Ent.updDirty) {
      Ent.updaters = [];
      for (const e of Ent.list.values()) {
        const K = GF.Kinds[e.kind];
        if (K && K.update) Ent.updaters.push(e);
      }
      // stable order by kind priority so producers run before movers
      const order = { drill: 0, oilpump: 0, offshore: 0, crafter: 1, lab: 1, boiler: 1, burnergen: 1, reactor: 1, core: 1, inserter: 2, belt: 3, ug: 3, splitter: 4, merger: 4 };
      Ent.updaters.sort((a, b) => (order[a.kind] ?? 5) - (order[b.kind] ?? 5));
      Ent.updDirty = false;
    }
    return Ent.updaters;
  };

  /** save all entities */
  Ent.serialize = function () {
    const out = [];
    for (const e of Ent.list.values()) {
      const K = GF.Kinds[e.kind];
      const s = (K && K.save) ? (K.save(e) || {}) : {};
      if (e.hp < e.maxHp) s.hp = Math.round(e.hp);
      if (e.on === false) s.on = false;
      if (e.prio) s.prio = true;
      out.push([e.type, e.x, e.y, e.dir, s]);
    }
    return out;
  };

  Ent.deserialize = function (arr) {
    (arr || []).forEach((row) => {
      try {
        const [type, x, y, dir, s] = row;
        if (!D[type]) return;
        Ent.place(type, x, y, dir, s || {});
      } catch (err) { console.warn('entity load failed', row, err); }
    });
    // post-load linking (underground pairs etc.)
    for (const e of Ent.list.values()) {
      const K = GF.Kinds[e.kind];
      if (K && K.postLoad) K.postLoad(e);
    }
  };

  GF.Ent = Ent;
})(window.GF);

      for (const id in rec.out) sim.set(id, (sim.get(id) || 0) + rec.out[id] * q.n);

      const subTimes = Math.ceil(missing / sub.out[ing]);
      if (!planRec(sub.id, subTimes, sim, steps, depth + 1)) return false;
      // sub-plan added its output to sim; consume what we needed
      sim.set(ing, Math.max(0, (sim.get(ing) || 0) - missing));
    }
    for (const o in rec.out) sim.set(o, (sim.get(o) || 0) + rec.out[o] * times);
    steps.push({ rid, n: times });
    return true;
  }

  Craft.plan = function (rid, times, inv) {
    const sim = simAfterQueue(inv);
    const steps = [];
    return planRec(rid, times, sim, steps, 0) ? steps : null;
  };

  Craft.maxCraftable = function (rid, inv, cap) {
    cap = cap || 100;
    if (!Craft.plan(rid, 1, inv)) return 0;
    let lo = 1, hi = cap;
    if (Craft.plan(rid, hi, inv)) return hi;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (Craft.plan(rid, mid, inv)) lo = mid; else hi = mid;
    }
    return lo;
  };

  /** queue a hand-craft. Returns true if queued. */
  Craft.enqueue = function (rid, times, inv) {
    const rec = R[rid];
    if (!rec || !rec.hand || !Craft.unlocked.has(rid)) return false;
    const steps = Craft.plan(rid, times, inv);
    if (!steps) return false;
    steps.forEach((s, i) => {
      const last = Craft.queue[Craft.queue.length - 1];
      if (last && last.rid === s.rid && !last.started && Craft.queue.length > 1) last.n += s.n;
      else Craft.queue.push({ rid: s.rid, n: s.n, t: 0, started: false, top: i === steps.length - 1 });
    });
    GF.bus.emit('craftQueue');
    return true;
  };

  Craft.cancel = function (idx, inv) {
    const q = Craft.queue[idx];
    if (!q) return;
    if (q.started) {
      const rec = R[q.rid];
      for (const id in rec.in) GF.player.giveOrDrop(id, rec.in[id]);
    }
    Craft.queue.splice(idx, 1);
    GF.bus.emit('craftQueue');
  };

  Craft.update = function (dt, inv) {
    const q = Craft.queue[0];
    if (!q) return;
    const rec = R[q.rid];
    if (!q.started) {
      for (const id in rec.in) {
        if (inv.count(id) < rec.in[id]) {
          GF.UI && GF.UI.toast('Crafting afbrudt: mangler ' + GF.itemName(id), 'warn');
          Craft.queue.shift();
          GF.bus.emit('craftQueue');
          return;
        }
      }
      for (const id in rec.in) { inv.remove(id, rec.in[id]); GF.Progress.record('consume', id, rec.in[id]); }
      q.started = true;
      q.t = 0;
    }
    q.t += dt * Craft.speed * (GF.cheat ? 20 : 1);
    if (q.t >= rec.time) {
      for (const id in rec.out) {
        GF.player.giveOrDrop(id, rec.out[id]);
        GF.Progress.record('produce', id, rec.out[id], 'hand');
      }
      GF.Audio && GF.Audio.play('craft');
      q.n--;
      q.started = false;
      q.t = 0;
      if (q.n <= 0) Craft.queue.shift();
      GF.bus.emit('craftQueue');
    }
  };

  Craft.save = () => ({ unlocked: Array.from(Craft.unlocked), queue: Craft.queue.map((q) => [q.rid, q.n, q.started ? 1 : 0, q.t]) });
  Craft.load = function (d) {
    Craft.reset();
    if (!d) return;
    (d.unlocked || []).forEach((id) => { if (R[id]) Craft.unlocked.add(id); });
    Craft.queue = (d.queue || []).filter((q) => R[q[0]]).map((q) => ({ rid: q[0], n: q[1], started: !!q[2], t: q[3] || 0 }));
  };

  Craft.reset();
  GF.Craft = Craft;
})(window.GF);

</script>

  GF.TECH = T;

  /** compute tree layout: tier (depth) per tech, column within branch */
  GF.techLayout = function () {
    const depth = {};
    function d(id) {
      if (depth[id] != null) return depth[id];
      const pre = T[id].pre;
      depth[id] = pre.length ? 1 + Math.max(...pre.map(d)) : 0;
      return depth[id];
    }
    Object.keys(T).forEach(d);

<script>
/* =====================================================================
 * GREJS FACTORY — research.js
 * Research state: current technology, progress, queue and bonuses.
 * Labs (machines.js) call Research.addWork() while consuming packs.
 * ===================================================================== */
'use strict';
(function (GF) {
  const T = () => GF.TECH;

  const R = {
    current: null,
    partial: {},       // techId → units done (kept when switching)
    done: new Set(),
    queue: [],
    bonus: { miningProd: 0, dmg: 0, stack: 0, botSpeed: 0, labSpeed: 0 },
    rate: 0,           // units/min estimate
    _acc: 0, _accT: 0,
  };

  R.reset = function () {
    R.current = null; R.partial = {}; R.done = new Set(); R.queue = [];
    R.bonus = { miningProd: 0, dmg: 0, stack: 0, botSpeed: 0, labSpeed: 0 };
    R.rate = 0;
  };

  R.isDone = (id) => R.done.has(id);
  R.available = (id) => {
    const t = T()[id];
    return !!t && !R.done.has(id) && t.pre.every((p) => R.done.has(p));
  };
  R.progress = (id) => (R.partial[id] || 0) / T()[id].count;

  R.start = function (id) {
    if (!R.available(id)) return false;
    R.current = id;
    R.queue = R.queue.filter((q) => q !== id);
    GF.bus.emit('research');
    return true;
  };

  /** add to queue (and start if idle) */
  R.enqueue = function (id) {
    if (R.done.has(id) || R.queue.includes(id) || R.current === id) return;
    // add missing prerequisites first
    const add = (tid) => {
      if (R.done.has(tid) || R.queue.includes(tid) || R.current === tid) return;
      T()[tid].pre.forEach(add);
      R.queue.push(tid);
    };
    add(id);
    if (!R.current) R.next();
    GF.bus.emit('research');
  };

  R.next = function () {
    R.current = null;
    for (let i = 0; i < R.queue.length; i++) {
      if (R.available(R.queue[i])) { R.current = R.queue.splice(i, 1)[0]; break; }
    }
    GF.bus.emit('research');
  };

  R.cancel = function () { R.current = null; GF.bus.emit('research'); };

  /** add completed research units (can be fractional) */
  R.addWork = function (units) {
    if (!R.current) return;
    const id = R.current;
    const t = T()[id];
    R.partial[id] = (R.partial[id] || 0) + units;
    R._acc += units;
    if (R.partial[id] >= t.count - 1e-6) R.complete(id);
  };

  R.applyTech = function (id) {
    const t = T()[id];
    t.unlocks.forEach((rid) => GF.Craft.unlock(rid));
    if (t.bonus) for (const b in t.bonus) R.bonus[b] = (R.bonus[b] || 0) + t.bonus[b];
  };

  R.complete = function (id) {
    R.done.add(id);
    delete R.partial[id];
    R.applyTech(id);
    GF.Progress && GF.Progress.stat('researchCompleted', 1);
    GF.UI && GF.UI.toast('Forskning færdig: ' + T()[id].name, 'good', 'sci_red');
    GF.Audio && GF.Audio.play('research');
    GF.bus.emit('researchDone', id);
    R.next();
  };

  R.update = function (dt) {
    R._accT += dt;
    if (R._accT >= 5) { R.rate = R.rate * 0.6 + (R._acc / R._accT) * 60 * 0.4; R._acc = 0; R._accT = 0; }
  };

  R.save = () => ({ current: R.current, partial: R.partial, done: Array.from(R.done), queue: R.queue });
  R.load = function (d) {
    R.reset();
    if (!d) return;
    (d.done || []).forEach((id) => { if (T()[id]) { R.done.add(id); R.applyTech(id); } });
    R.partial = d.partial || {};
    R.queue = (d.queue || []).filter((id) => T()[id]);
    R.current = d.current && T()[d.current] && !R.done.has(d.current) ? d.current : null;
  };

  GF.Research = R;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — world.js
 * Chunk based procedural world. Chunks (32×32 tiles) are generated lazily
 * from the seed, so the same seed always produces the same map.
 * Per tile we store: terrain type, ore type, ore amount, decoration.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const CH = U.CHUNK, AREA = CH * CH;

  const TERRAIN = [
    { name: 'Græs', color: '#4f7a3a', c2: '#5d8a44' },               // 0
    { name: 'Jord', color: '#6f5a3e', c2: '#7c6647' },               // 1
    { name: 'Ødemark', color: '#b39a68', c2: '#c4ab78' },            // 2
    { name: 'Klippe', color: '#6b6a66', c2: '#7a7974' },             // 3
    { name: 'Vand', color: '#2e6aa8', c2: '#3a7cbc', solid: true, water: true },   // 4
    { name: 'Dybt vand', color: '#1f4f86', c2: '#255a95', solid: true, water: true }, // 5
    { name: 'Bjerg', color: '#4a4744', c2: '#57534f', solid: true },  // 6
    { name: 'Krystalslette', color: '#5a4a7a', c2: '#6a5890' },       // 7
    { name: 'Skovbund', color: '#3d6630', c2: '#477338' },            // 8
    { name: 'Afgrund', color: '#07080c', c2: '#0b0c12', solid: true }, // 9
  ];
  const ORES = [null, 'iron_ore', 'copper_ore', 'coal', 'stone', 'grejsite', 'crystal', 'crude'];
  const ORE_COLORS = [null, '#8fa4be', '#d7864e', '#1b1b1f', '#a7a196', '#6dff5a', '#b98cff', '#141014'];
  const ORE_INDEX = {};
  ORES.forEach((o, i) => { if (o) ORE_INDEX[o] = i; });
  // decorations: 1-3 trees, 4 boulder, 5 dead tree
  const DECO_DROPS = { 1: ['wood', 4], 2: ['wood', 4], 3: ['wood', 5], 4: ['stone', 24], 5: ['wood', 2] };

  const W = {
    TERRAIN, ORES, ORE_COLORS, ORE_INDEX,
    chunks: new Map(),
    opts: null,
    seed: 0,
    half: 0,
    start: null,
  };

  /**
   * opts: {seed:int, size:tiles(0=infinite), resAmount, resDensity}
   */
  W.reset = function (opts) {
    W.chunks = new Map();
    W.opts = Object.assign({ size: 1024, resAmount: 1, resDensity: 1 }, opts);
    W.seed = W.opts.seed >>> 0;
    W.half = W.opts.size ? W.opts.size / 2 : 0;
    const rnd = U.rng(W.seed ^ 0x9e3779b9);
    const a = rnd() * Math.PI * 2;
    const P = (ang, d) => ({ x: Math.round(Math.cos(ang) * d), y: Math.round(Math.sin(ang) * d) });
    W.start = {
      lake: P(a + 2.2, 30),
      patches: [
        { ore: 1, ...P(a, 19), r: 7.5 },
        { ore: 2, ...P(a + 1.5, 23), r: 6.5 },
        { ore: 3, ...P(a + 3.1, 17), r: 6.5 },
        { ore: 4, ...P(a + 4.6, 24), r: 5.5 },
        { ore: 1, ...P(a + 0.7, 48), r: 9 },
      ],
      oil: P(a + 3.9, 70),
    };
  };

  W.inBounds = (x, y) => !W.half || (x >= -W.half && x < W.half && y >= -W.half && y < W.half);

  /* ---------------- generation ---------------- */
  function genTile(x, y, out) {
    const s = W.seed;
    if (!W.inBounds(x, y)) { out.t = 9; out.o = 0; out.a = 0; out.d = 0; return; }
    const dist = Math.hypot(x, y);
    let elev = U.fbm(x / 170, y / 170, s + 11, 4);
    const sb = U.smooth(U.clamp((dist - 30) / 90, 0, 1));
    elev = elev * sb + 0.04 * (1 - sb);
    // soft map border
    if (W.half) {
      const edge = W.half - Math.max(Math.abs(x), Math.abs(y));
      if (edge < 12) elev = Math.min(elev, -0.35 + edge * 0.02);
    }
    const moist = U.fbm(x / 130, y / 130, s + 23, 3);
    let t;
    // guaranteed starting lake
    const L = W.start.lake;
    const ld = Math.hypot(x - L.x, y - L.y) + U.noise2(x / 5, y / 5, s + 5) * 2.2;
    if (ld < 6.5) t = ld < 3.5 ? 5 : 4;
    else if (elev < -0.3) t = 5;
    else if (elev < -0.2) t = 4;
    else if (elev > 0.43) t = 6;
    else if (elev > 0.31) t = 3;
    else if (dist > 260 && U.fbm(x / 220, y / 220, s + 77, 2) > 0.4) t = 7;
    else if (moist > 0.16) t = 8;
    else if (moist < -0.28) t = 2;
    else t = U.noise2(x / 14, y / 14, s + 31) > 0.3 ? 1 : 0;
    out.t = t;
    out.o = 0; out.a = 0; out.d = 0;
    if (TERRAIN[t].solid) return;

    // ---------- ores ----------
    const h = U.hash2(x, y, s + 99);
    const amt = W.opts.resAmount;
    if (dist < 75) {
      for (const p of W.start.patches) {
        const pd = Math.hypot(x - p.x, y - p.y) + U.noise2(x / 3.5, y / 3.5, s + p.ore * 7) * 1.6;
        if (pd < p.r) {
          out.o = p.ore;
          out.a = Math.round((500 + (1 - pd / p.r) * 1100) * amt * (0.85 + h * 0.3));
          return;
        }
      }
    } else {
      const dens = W.opts.resDensity;
      const th = 0.36 + 0.1 / dens;
      let best = 0, bestV = 0;
      for (let k = 1; k <= 4; k++) {
        const n = U.fbm(x / 26, y / 26, s + 100 + k * 37, 3) + U.fbm(x / 400, y / 400, s + 900 + k, 1) * 0.25;
        const v = n - th - (k === 4 ? 0.03 : 0);
        if (v > bestV) { bestV = v; best = k; }
      }
      if (dist > 330) {
        const n = U.fbm(x / 22, y / 22, s + 555, 3) - th - 0.06;
        if (n > bestV) { bestV = n; best = 5; }
      }
      if (t === 7) {
        const n = U.fbm(x / 14, y / 14, s + 666, 2) - 0.12;
        if (n > bestV) { bestV = n; best = 6; }
      }
      if (best) {
        out.o = best;
        out.a = Math.round((350 + bestV * 5200) * (1 + dist / 320) * amt * (0.85 + h * 0.3));
        return;
      }
      // oil wells
      if (U.fbm(x / 70, y / 70, s + 444, 2) > 0.38 && h < 0.035) {
        out.o = 7; out.a = Math.round(40 + U.hash2(x, y, s + 3) * 160);
        return;
      }
    }
    // starting oil field
    const O = W.start.oil;
    if (Math.hypot(x - O.x, y - O.y) < 6 && h < 0.09) { out.o = 7; out.a = Math.round(60 + U.hash2(x, y, s + 3) * 90); return; }

    // ---------- decorations ----------
    if (dist < 9) return;
    const h2 = U.hash2(x, y, s + 7);
    if (t === 8) {
      const dens = U.clamp((moist - 0.16) * 3.2, 0.12, 0.6);
      if (h2 < dens) out.d = 1 + (U.ihash(x, y, s + 8) % 3);
    } else if (t === 0) {
      if (h2 < 0.018) out.d = 1 + (U.ihash(x, y, s + 8) % 3);
    } else if (t === 2) {
      if (h2 < 0.008) out.d = 5; else if (h2 < 0.02) out.d = 4;
    } else if (t === 3) {
      if (h2 < 0.045) out.d = 4;
    } else if (t === 7) {
      if (h2 < 0.012) out.d = 4;
    } else if (t === 1) {
      if (h2 < 0.008) out.d = 4;
    }
  }

  function generate(cx, cy) {
    const c = {
      cx, cy,
      t: new Uint8Array(AREA), o: new Uint8Array(AREA), a: new Uint32Array(AREA), d: new Uint8Array(AREA),
      mod: false,
    };
    const tmp = { t: 0, o: 0, a: 0, d: 0 };
    const x0 = cx * CH, y0 = cy * CH;
    for (let ly = 0; ly < CH; ly++) {
      for (let lx = 0; lx < CH; lx++) {
        genTile(x0 + lx, y0 + ly, tmp);
        const i = ly * CH + lx;
        c.t[i] = tmp.t; c.o[i] = tmp.o; c.a[i] = tmp.a; c.d[i] = tmp.d;
      }
    }
    return c;
  }

  W.chunk = function (cx, cy) {
    const k = U.key(cx, cy);
    let c = W.chunks.get(k);
    if (!c) {
      c = generate(cx, cy);
      W.chunks.set(k, c);
      GF.bus.emit('chunkGen', c);
    }
    return c;
  };
  W.hasChunk = (cx, cy) => W.chunks.has(U.key(cx, cy));

  function loc(x, y) {
    const cx = Math.floor(x / CH), cy = Math.floor(y / CH);
    const c = W.chunk(cx, cy);
    return [c, (y - cy * CH) * CH + (x - cx * CH)];
  }

  W.terrain = function (x, y) { const [c, i] = loc(x, y); return c.t[i]; };
  W.oreIndex = function (x, y) { const [c, i] = loc(x, y); return c.a[i] > 0 ? c.o[i] : 0; };
  W.ore = function (x, y) {
    const [c, i] = loc(x, y);
    if (!c.o[i] || c.a[i] <= 0) return null;
    return { type: ORES[c.o[i]], amount: c.a[i] };
  };
  W.deco = function (x, y) { const [c, i] = loc(x, y); return c.d[i]; };
  W.isSolid = function (x, y) {
    const [c, i] = loc(x, y);
    return !!(TERRAIN[c.t[i]].solid || c.d[i]);
  };
  W.isWater = function (x, y) { return !!TERRAIN[W.terrain(x, y)].water; };

  function markMod(c) {
    c.mod = true;
    if (GF.Render) GF.Render.invalidateChunk(c.cx, c.cy);
    if (GF.Map) GF.Map.invalidateChunk(c.cx, c.cy);
  }

  /** remove up to n ore from a tile; returns item id taken or null */
  W.takeOre = function (x, y, n) {
    const [c, i] = loc(x, y);
    if (!c.o[i] || c.a[i] <= 0) return null;
    const type = ORES[c.o[i]];
    if (type === 'crude') return type; // oil wells do not deplete
    c.a[i] = Math.max(0, c.a[i] - (n || 1));
    if (c.a[i] === 0) { c.o[i] = 0; markMod(c); } else c.mod = true;
    return type;
  };

  /** remove decoration, returns drop {id,n} */
  W.removeDeco = function (x, y) {
    const [c, i] = loc(x, y);
    const d = c.d[i];
    if (!d) return null;
    c.d[i] = 0;
    markMod(c);
    const drop = DECO_DROPS[d];
    return drop ? { id: drop[0], n: drop[1] } : null;
  };

  /** what the player would get by mining this tile manually */
  W.mineInfo = function (x, y) {
    const d = W.deco(x, y);
    if (d) return { kind: 'deco', id: DECO_DROPS[d][0], time: d === 4 ? 1.6 : 0.9, deco: d };
    const o = W.ore(x, y);
    if (o && o.type !== 'crude') return { kind: 'ore', id: o.type, time: o.type === 'stone' ? 0.6 : 0.75 };
    return null;
  };

  /* ---------------- save / load ---------------- */
  W.save = function () {
    const mods = {};
    for (const [k, c] of W.chunks) {
      if (!c.mod) continue;
      mods[c.cx + ',' + c.cy] = {
        o: U.u8ToB64(c.o), a: U.u8ToB64(new Uint8Array(c.a.buffer)), d: U.u8ToB64(c.d),
      };
    }
    return { opts: W.opts, mods };
  };

  W.load = function (data) {
    W.reset(data.opts);
    const mods = data.mods || {};
    for (const key in mods) {
      try {
        const [cx, cy] = key.split(',').map(Number);
        const c = generate(cx, cy);
        const m = mods[key];
        c.o.set(U.b64ToU8(m.o).subarray(0, AREA));
        const ab = U.b64ToU8(m.a);
        c.a.set(new Uint32Array(ab.buffer, 0, AREA));
        c.d.set(U.b64ToU8(m.d).subarray(0, AREA));
        c.mod = true;
        W.chunks.set(U.key(cx, cy), c);
      } catch (e) { console.warn('chunk restore failed', key, e); }
    }
  };

  /** find a nearby free land position (tile units) */
  W.findFree = function (x, y, maxR) {
    x = Math.floor(x); y = Math.floor(y);
    for (let r = 0; r < (maxR || 20); r++) {
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const tx = x + dx, ty = y + dy;
        if (!W.isSolid(tx, ty) && !GF.Ent.solidAt(tx, ty)) return { x: tx + 0.5, y: ty + 0.5 };
      }
    }
    return { x: x + 0.5, y: y + 0.5 };
  };

  GF.World = W;
})(window.GF);
