<script>
/* =====================================================================
 * GREJS FACTORY — power.js
 * Electric networks. Poles connect by wire reach; any electric entity
 * touching a pole's supply area joins that pole's network.
 * Each tick: demand (set by consumers last tick) is compared with the
 * generators' capacity; accumulators buffer surplus / deficit.
 * Satisfaction (0..1) slows down or stops machines.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const GEN_KINDS = ['burnergen', 'steamengine', 'solar', 'reactor'];

  const P = {
    nets: [],
    wires: [],        // [[poleA, poleB]] for rendering
    dirty: true,
    total: { prod: 0, cons: 0, cap: 0, stored: 0, storeCap: 0, demand: 0 },
    history: [],      // [{prod, cons, demand}] 1 Hz
    _hT: 0, _hProd: 0, _hCons: 0, _hDem: 0, _hN: 0,
  };

  P.reset = function () { P.nets = []; P.wires = []; P.dirty = true; P.history = []; };

  function isConsumer(e) { return e.def.energy === 'electric'; }
  function isGen(e) { return GEN_KINDS.includes(e.kind); }
  P.isElectric = (def) => def.energy === 'electric' || GEN_KINDS.includes(def.kind) || def.kind === 'accumulator';

  /** supply rectangle of a pole (tile inclusive bounds) */
  P.supplyRect = function (p) {
    const s = p.def.supply;
    return { x0: p.x - s, y0: p.y - s, x1: p.x + p.w - 1 + s, y1: p.y + p.h - 1 + s };
  };

  /** poles whose supply area overlaps rect */
  P.polesCovering = function (x, y, w, h) {
    const out = [];
    GF.Ent.near(x + w / 2, y + h / 2, 12 + Math.max(w, h), (e) => e.kind === 'pole').forEach((p) => {
      const r = P.supplyRect(p);
      if (r.x0 <= x + w - 1 && r.x1 >= x && r.y0 <= y + h - 1 && r.y1 >= y) out.push(p);
    });
    return out;
  };

  P.rebuild = function () {
    P.dirty = false;
    const poles = [];
    const all = [];
    for (const e of GF.Ent.list.values()) {
      e.net = null;
      if (e.kind === 'pole') poles.push(e);
      else if (isConsumer(e) || isGen(e) || e.kind === 'accumulator') all.push(e);
    }
    // union-find over poles
    const parent = new Map();
    const find = (a) => { while (parent.get(a) !== a) { parent.set(a, parent.get(parent.get(a))); a = parent.get(a); } return a; };
    poles.forEach((p) => parent.set(p.id, p.id));
    const wires = [];
    const wireSeen = new Set();
    poles.forEach((p) => {
      const pc = GF.Ent.center(p);
      const cand = GF.Ent.near(pc.x, pc.y, p.def.wire, (q) => q.kind === 'pole' && q !== p);
      cand.sort((a, b) => U.dist2(pc.x, pc.y, a.x + a.w / 2, a.y + a.h / 2) - U.dist2(pc.x, pc.y, b.x + b.w / 2, b.y + b.h / 2));
      let drawn = 0;
      cand.forEach((q) => {
        const qc = GF.Ent.center(q);
        if (U.dist(pc.x, pc.y, qc.x, qc.y) > Math.min(p.def.wire, q.def.wire)) return;
        const ra = find(p.id), rb = find(q.id);
        const key = Math.min(p.id, q.id) + ':' + Math.max(p.id, q.id);
        if (ra !== rb) { parent.set(ra, rb); if (!wireSeen.has(key)) { wireSeen.add(key); wires.push([p, q]); } drawn++; }
        else if (drawn < 2 && !wireSeen.has(key)) { wireSeen.add(key); wires.push([p, q]); drawn++; }
      });
    });
    P.wires = wires;
    const netMap = new Map();
    P.nets = [];
    let nid = 1;
    poles.forEach((p) => {
      const root = find(p.id);
      let net = netMap.get(root);
      if (!net) {
        net = { id: nid++, poles: [], cons: [], gens: [], accs: [], satH: 0, satL: 0, sat: 0, prod: 0, demand: 0, cap: 0, stored: 0, storeCap: 0 };
        netMap.set(root, net);
        P.nets.push(net);
      }
      p.net = net;
      net.poles.push(p);
    });
    all.forEach((e) => {
      const covering = P.polesCovering(e.x, e.y, e.w, e.h);
      if (!covering.length) return;
      const net = covering[0].net;
      e.net = net;
      if (isGen(e)) net.gens.push(e);
      else if (e.kind === 'accumulator') net.accs.push(e);
      else net.cons.push(e);
    });
  };

  /** satisfaction for a consumer (0..1) */
  P.sat = function (e) {
    const n = e.net;
    if (!n) return 0;
    return e.prio ? n.satH : n.satL;
  };

  P.update = function (dt) {
    if (P.dirty) P.rebuild();
    const T = P.total;
    T.prod = 0; T.cons = 0; T.cap = 0; T.stored = 0; T.storeCap = 0; T.demand = 0;
    for (const net of P.nets) {
      let dH = 0, dL = 0;
      for (const c of net.cons) { const d = c.demand || 0; if (c.prio) dH += d; else dL += d; }
      const demand = dH + dL;
      let cap = 0;
      for (const g of net.gens) {
        const K = GF.Kinds[g.kind];
        g.cap = K && K.powerCap ? K.powerCap(g, dt) : 0;
        cap += g.cap;
      }
      let stored = 0, storeCap = 0, accIn = 0, accOut = 0;
      for (const a of net.accs) {
        stored += a.charge; storeCap += a.def.capacity;
        accIn += Math.min(a.def.rate, (a.def.capacity - a.charge) / dt);
        accOut += Math.min(a.def.rate, a.charge / dt);
      }
      let genSupply, satH, satL;
      if (cap >= demand) {
        const charge = Math.min(cap - demand, accIn);
        // distribute charge
        if (charge > 0 && accIn > 0) for (const a of net.accs) {
          const want = Math.min(a.def.rate, (a.def.capacity - a.charge) / dt);
          a.charge = Math.min(a.def.capacity, a.charge + (want / accIn) * charge * dt);
        }
        genSupply = demand + charge;
        satH = satL = 1;
      } else {
        const deficit = demand - cap;
        const dis = Math.min(deficit, accOut);
        if (dis > 0 && accOut > 0) for (const a of net.accs) {
          const can = Math.min(a.def.rate, a.charge / dt);
          a.charge = Math.max(0, a.charge - (can / accOut) * dis * dt);
        }
        const avail = cap + dis;
        satH = dH > 0 ? Math.min(1, avail / dH) : 1;
        const rem = avail - dH * satH;
        satL = dL > 0 ? U.clamp(rem / dL, 0, 1) : 1;
        genSupply = cap;
      }
      // generators deliver proportionally
      for (const g of net.gens) {
        const K = GF.Kinds[g.kind];
        const w = cap > 0 ? (g.cap / cap) * genSupply : 0;
        g.output = w;
        if (K && K.powerSupply) K.powerSupply(g, w, dt);
      }
      net.satH = satH; net.satL = satL;
      net.sat = demand > 0 ? Math.min(1, (cap + (cap < demand ? accOut : 0)) / demand) : 1;
      net.prod = genSupply; net.demand = demand; net.cap = cap;
      net.cons = net.cons; net.used = Math.min(demand, genSupply + (cap < demand ? accOut : 0));
      net.stored = stored; net.storeCap = storeCap;
      T.prod += genSupply; T.cons += net.used; T.cap += cap; T.stored += stored; T.storeCap += storeCap; T.demand += demand;
    }
    GF.Progress.stat('powerGenerated', T.prod * dt);
    GF.Progress.stat('powerConsumed', T.cons * dt);
    // 1 Hz history
    P._hT += dt; P._hProd += T.prod; P._hCons += T.cons; P._hDem += T.demand; P._hN++;
    if (P._hT >= 1) {
      P.history.push({ prod: P._hProd / P._hN, cons: P._hCons / P._hN, dem: P._hDem / P._hN });
      if (P.history.length > 120) P.history.shift();
      P._hT = 0; P._hProd = 0; P._hCons = 0; P._hDem = 0; P._hN = 0;
    }
  };

  /* --------- kinds: pole & accumulator --------- */
  GF.Kinds.pole = {
    status(e) { return e.net ? 'Netværk #' + e.net.id + ' (' + e.net.poles.length + ' master)' : 'Ikke forbundet'; },
  };
  GF.Kinds.accumulator = {
    init(e, s) { e.charge = s && s.charge ? s.charge : 0; },
    save(e) { return { charge: Math.round(e.charge) }; },
    status(e) { return e.net ? 'Ladning ' + Math.round((e.charge / e.def.capacity) * 100) + '%' : 'Ingen forbindelse'; },
  };

  P.save = () => ({});
  P.load = () => { P.dirty = true; };

  GF.Power = P;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — fluids.js
 * Simple pooled fluid simulation. Connected pipes / tanks / underground
 * pipes form a network holding ONE fluid type with a total capacity.
 * Machines (fluidBox) exchange fluid with any adjacent network:
 *  - pull(e, fluid, n)  from networks carrying that fluid
 *  - push(e, fluid, n)  into networks of that fluid or empty ones
 * Pumps move fluid from the network behind to the one in front.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const NODE = { pipe: 1, ugpipe: 1, tank: 1 };

  const F = { nets: [], dirty: true, _t: 0 };
  F.isNode = (e) => !!(e && NODE[e.kind]);
  F.reset = function () { F.nets = []; F.dirty = true; };

  /** tiles orthogonally adjacent to an entity's footprint */
  F.adjacent = function (e) {
    const out = [];
    for (let x = e.x; x < e.x + e.w; x++) { out.push([x, e.y - 1, 0]); out.push([x, e.y + e.h, 2]); }
    for (let y = e.y; y < e.y + e.h; y++) { out.push([e.x - 1, y, 3]); out.push([e.x + e.w, y, 1]); }
    return out;
  };

  /** does node `a` connect to neighbour entity `b` located in direction d from a? */
  function nodeLinks(a, b, d) {
    if (!b || b === a) return false;
    if (a.kind === 'ugpipe' && d !== (a.dir + 2) % 4) return false;
    if (b.kind === 'ugpipe' && (d + 2) % 4 !== (b.dir + 2) % 4) return false;
    return true;
  }

  /** find partner for an underground pipe */
  F.findUgPair = function (e) {
    const v = U.DIRS[e.dir];
    for (let i = 1; i <= e.def.maxDist; i++) {
      const o = GF.Ent.at(e.x + v.x * i, e.y + v.y * i);
      if (o && o.kind === 'ugpipe') return o.dir === (e.dir + 2) % 4 ? o : null;
    }
    return null;
  };

  F.rebuild = function () {
    F.dirty = false;
    // 1) write old network contents back into nodes
    F.nets.forEach((n) => {
      n.nodes.forEach((e) => {
        if (e.dead) return;
        e.ft = n.type;
        e.fa = n.cap > 0 ? (n.amount * e.def.capacity) / n.cap : 0;
      });
    });
    const nodes = [];
    for (const e of GF.Ent.list.values()) {
      if (NODE[e.kind]) { nodes.push(e); e.fnet = null; if (e.kind === 'ugpipe') e.pair = F.findUgPair(e); }
    }
    F.nets = [];
    let nid = 1;
    nodes.forEach((start) => {
      if (start.fnet) return;
      const net = { id: nid++, type: null, amount: 0, cap: 0, nodes: [], flow: 0, prod: 0, _in: 0, _out: 0 };
      const amounts = {};
      const stack = [start];
      start.fnet = net;
      while (stack.length) {
        const e = stack.pop();
        net.nodes.push(e);
        net.cap += e.def.capacity;
        if (e.ft && e.fa > 0) amounts[e.ft] = (amounts[e.ft] || 0) + e.fa;
        else if (e.ft && !net.type) net.type = e.ft;
        F.adjacent(e).forEach(([x, y, d]) => {
          const o = GF.Ent.at(x, y);
          if (o && NODE[o.kind] && !o.fnet && nodeLinks(e, o, d)) { o.fnet = net; stack.push(o); }
        });
        if (e.kind === 'ugpipe' && e.pair && !e.pair.fnet && !e.pair.dead) { e.pair.fnet = net; stack.push(e.pair); }
      }
      let best = null, bestA = 0;
      for (const t in amounts) if (amounts[t] > bestA) { bestA = amounts[t]; best = t; }
      if (best) { net.type = best; net.amount = Math.min(bestA, net.cap); }
      F.nets.push(net);
    });
    // 2) machine adjacency
    for (const e of GF.Ent.list.values()) {
      if (!e.def.fluidBox || NODE[e.kind]) continue;
      if (e.kind === 'pump') {
        const v = U.DIRS[e.dir];
        const b = GF.Ent.at(e.x - v.x, e.y - v.y), f = GF.Ent.at(e.x + v.x, e.y + v.y);
        e.fin = b && NODE[b.kind] && nodeLinks(b, e, e.dir) ? b.fnet : null;
        e.fout = f && NODE[f.kind] && nodeLinks(f, e, (e.dir + 2) % 4) ? f.fnet : null;
        continue;
      }
      const set = new Set();
      F.adjacent(e).forEach(([x, y, d]) => {
        const o = GF.Ent.at(x, y);
        if (o && NODE[o.kind] && nodeLinks(o, e, (d + 2) % 4)) set.add(o.fnet);
      });
      e.fnets = Array.from(set);
    }
  };

  F.nets_of = (e) => e.fnets || [];

  F.avail = function (e, fluid) {
    let a = 0;
    for (const n of F.nets_of(e)) if (n.type === fluid) a += n.amount;
    return a;
  };
  F.room = function (e, fluid) {
    let r = 0;
    for (const n of F.nets_of(e)) if (n.type === fluid || (!n.type && n.amount <= 0)) r += n.cap - n.amount;
    return r;
  };
  F.pull = function (e, fluid, amt) {
    let got = 0;
    for (const n of F.nets_of(e)) {
      if (n.type !== fluid || got >= amt) continue;
      const t = Math.min(n.amount, amt - got);
      n.amount -= t; n._out += t; got += t;
    }
    return got;
  };
  F.push = function (e, fluid, amt) {
    let put = 0;
    const nets = F.nets_of(e);
    // prefer networks that already carry the fluid
    for (let pass = 0; pass < 2 && put < amt; pass++) {
      for (const n of nets) {
        if (put >= amt) break;
        if (pass === 0 && n.type !== fluid) continue;
        if (pass === 1 && (n.type || n.amount > 0)) continue;
        const t = Math.min(n.cap - n.amount, amt - put);
        if (t <= 0) continue;
        n.type = fluid; n.amount += t; n._in += t; put += t;
      }
    }
    return put;
  };
  F.flush = function (net) { net.amount = 0; net.type = null; net.nodes.forEach((e) => { e.ft = null; e.fa = 0; }); };

  F.update = function (dt) {
    if (F.dirty) F.rebuild();
    F._t += dt;
    if (F._t >= 1) {
      F.nets.forEach((n) => { n.flow = n._out / F._t; n.prod = n._in / F._t; n._in = 0; n._out = 0; });
      F._t = 0;
    }
  };

  /* ---------------- kinds ---------------- */
  const nodeKind = {
    init(e, s) { e.ft = s && s.ft ? s.ft : null; e.fa = s && s.fa ? s.fa : 0; },
    save(e) {
      const n = e.fnet;
      if (!n || !n.type) return {};
      return { ft: n.type, fa: +(n.cap > 0 ? (n.amount * e.def.capacity) / n.cap : 0).toFixed(1) };
    },
    onRemove(e) {
      const n = e.fnet;
      if (n && n.cap > 0) { const share = (n.amount * e.def.capacity) / n.cap; n.amount -= share; n.cap -= e.def.capacity; }
    },
    status(e) {
      const n = e.fnet;
      if (!n) return 'Tom';
      return (n.type ? GF.itemName(n.type) : 'Tom') + ' ' + U.fmt(n.amount) + '/' + U.fmt(n.cap);
    },
  };
  GF.Kinds.pipe = nodeKind;
  GF.Kinds.tank = nodeKind;
  GF.Kinds.ugpipe = Object.assign({}, nodeKind, {
    onBuild(e, loaded) {
      if (loaded) return;
      // auto-orient: if an unpaired underground pipe points at us from behind, face it
      const back = (e.dir + 2) % 4, v = U.DIRS[back];
      for (let i = 1; i <= e.def.maxDist; i++) {
        const o = GF.Ent.at(e.x + v.x * i, e.y + v.y * i);
        if (o && o.kind === 'ugpipe') {
          if (o.dir === e.dir && !F.findUgPair(o)) { e.dir = back; F.dirty = true; }
          break;
        }
      }
    },
  });

  GF.Kinds.pump = {
    update(e, dt) {
      const sat = GF.Power.sat(e);
      const a = e.fin, b = e.fout;
      e.demand = e.def.power * 0.05;
      e.working = false;
      if (!a || !b || a === b || !a.type || a.amount <= 0 || !e.on) return;
      if (b.type && b.type !== a.type) return;
      e.demand = e.def.power;
      const amt = Math.min(e.def.rate * dt * sat, a.amount, b.cap - b.amount);
      if (amt <= 0) return;
      a.amount -= amt; a._out += amt;
      b.type = a.type; b.amount += amt; b._in += amt;
      e.working = true;
    },
    status(e) {
      if (!e.net) return 'Ingen strøm';
      if (!e.fin || !e.fout) return 'Mangler rør';
      return e.working ? 'Pumper' : 'Venter';
    },
  };

  GF.Kinds.offshore = {
    update(e, dt) {
      const put = F.push(e, 'water', 150 * dt);
      e.working = put > 0;
    },
    status(e) { return e.working ? 'Pumper vand (150/s)' : (F.nets_of(e).length ? 'Rør fyldt' : 'Mangler rør'); },
  };

  GF.Fluids = F;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — belts.js
 * Transport belts, underground belts, splitters and mergers.
 *
 * A belt tile holds items at positions p ∈ [0,1] along its direction
 * (items[0] is the front-most). Items move with speed×dt and keep a
 * minimum GAP. At p=1 an item is handed to whatever is in front
 * (via that entity's beltAccept). Side-loading inserts at p=0.5;
 * a belt fed only from one side becomes a curve.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const GAP = 0.25;
  const FAMILY = { belt: 1, ug: 1, splitter: 1, merger: 1 };

  const B = { GAP };
  B.isBeltFamily = (e) => !!(e && e.def && FAMILY[e.def.kind]);

  /* ---------- item insertion helpers on belt-like arrays ---------- */
  function insertBack(e, id) {
    const it = e.items;
    const last = it[it.length - 1];
    if (last && last.p < GAP) return false;
    it.push({ id, p: 0 });
    return true;
  }
  /** insert at position p (keeping order & gaps). */
  function insertAt(e, id, p) {
    const it = e.items;
    let k = 0;
    while (k < it.length && it[k].p > p) k++;
    if (k > 0 && it[k - 1].p - p < GAP) return false;
    if (k < it.length && p - it[k].p < GAP) return false;
    it.splice(k, 0, { id, p });
    return true;
  }
  B.insertAt = insertAt;

  /** entity kinds that take items from belts/drills */
  function pushTo(target, id, fromDir, from) {
    if (!target) return false;
    const K = GF.Kinds[target.kind];
    if (K && K.beltAccept) return K.beltAccept(target, id, fromDir, from);
    return false;
  }
  B.pushTo = pushTo;

  /** Drill / machine output onto a tile: belt-like or insertable entity */
  B.outputTo = function (x, y, id, fromDir, from) {
    const t = GF.Ent.at(x, y);
    if (!t) return false;
    if (B.isBeltFamily(t)) {
      if (t.kind === 'belt') return insertAt(t, id, 0.5) || insertAt(t, id, 0.25) || insertAt(t, id, 0.75);
      return pushTo(t, id, fromDir, from);
    }
    const K = GF.Kinds[t.kind];
    if (K && K.insert && K.canInsert && K.canInsert(t, id, 1, true) > 0) return K.insert(t, id, 1, true) > 0;
    return false;
  };

  /* ---------- shape (curves) ---------- */
  function feeds(o, x, y) {
    // does belt-like o push into tile (x,y)?
    if (!o || !B.isBeltFamily(o)) return false;
    if (o.kind === 'splitter') return false;
    if (o.kind === 'ug' && o.ugType === 'in') return false;
    const v = U.DIRS[o.dir];
    return o.x + v.x === x && o.y + v.y === y;
  }
  B.recalcShape = function (e) {
    if (e.kind !== 'belt') return;
    const back = U.DIRS[(e.dir + 2) % 4];
    const l = U.DIRS[(e.dir + 3) % 4], r = U.DIRS[(e.dir + 1) % 4];
    const fb = feeds(GF.Ent.at(e.x + back.x, e.y + back.y), e.x, e.y);
    const fl = feeds(GF.Ent.at(e.x + l.x, e.y + l.y), e.x, e.y);
    const fr = feeds(GF.Ent.at(e.x + r.x, e.y + r.y), e.x, e.y);
    e.curve = 0; // 0 straight, -1 from left, +1 from right
    if (!fb && fl && !fr) e.curve = -1;
    if (!fb && fr && !fl) e.curve = 1;
  };
  B.reshapeAround = function (e) {
    const x0 = e.x - 1, y0 = e.y - 1, x1 = e.x + e.w, y1 = e.y + e.h;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const o = GF.Ent.at(x, y);
      if (o && o.kind === 'belt' && !o.dead) B.recalcShape(o);
    }
  };

  /** world position (tile units) of an item at p on belt e */
  B.itemPos = function (e, p) {
    const cx = e.x + 0.5, cy = e.y + 0.5;
    const v = U.DIRS[e.dir];
    if (e.kind === 'belt' && e.curve) {
      // quarter arc from the side edge to the front edge
      const side = U.DIRS[(e.dir + (e.curve < 0 ? 3 : 1)) % 4];
      // arc centre is the corner shared by the entry side and the exit side
      const ox = cx + (side.x + v.x) * 0.5, oy = cy + (side.y + v.y) * 0.5;
      const a0 = Math.atan2(-v.y, -v.x);        // start (entry side midpoint relative to corner)
      const a1 = Math.atan2(-side.y, -side.x);  // end (exit midpoint)
      let da = a1 - a0;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      const a = a0 + da * p;
      return { x: ox + Math.cos(a) * 0.5, y: oy + Math.sin(a) * 0.5 };
    }
    return { x: cx + v.x * (p - 0.5), y: cy + v.y * (p - 0.5) };
  };

  /** move items forward; front item tries to hand over at p≥1 */
  function moveItems(e, dt, len, handOver) {
    const items = e.items;
    if (!items.length) { e.jam = false; return; }
    const mv = e.def.speed * dt;
    e.jam = false;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      let np = it.p + mv;
      if (i === 0) {
        if (np >= len) {
          if (handOver(it.id)) { items.shift(); i--; continue; }
          np = len;
          e.jam = true;
        }
      } else {
        const lim = items[i - 1].p - GAP;
        if (np > lim) np = Math.max(it.p, lim);
      }
      it.p = np;
    }
  }

  /** take one item matching filter from a belt-like entity (for inserters) */
  B.take = function (e, filter) {
    const items = e.items;
    if (!items) return null;
    for (let i = 0; i < items.length; i++) {
      if (!filter || filter(items[i].id)) { const id = items[i].id; items.splice(i, 1); return id; }
    }
    return null;
  };
  B.peek = function (e, filter) {
    const items = e.items;
    if (!items) return null;
    for (let i = 0; i < items.length; i++) if (!filter || filter(items[i].id)) return items[i].id;
    return null;
  };
  /** drop from an inserter onto a belt-like entity */
  B.drop = function (e, id) {
    if (e.kind === 'belt' || (e.kind === 'ug' && e.ugType === 'out')) return insertAt(e, id, 0.5) || insertAt(e, id, 0.75) || insertAt(e, id, 0.25);
    if (e.kind === 'ug') return insertAt(e, id, 0.25) || insertBack(e, id);
    const K = GF.Kinds[e.kind];
    return K.beltAccept ? K.beltAccept(e, id, e.dir, null) : false;
  };
  B.canDrop = function (e) {
    const it = e.items || [];
    if (e.kind === 'splitter') return e.buf.length < 4;
    if (e.kind === 'merger') return e.buf.length < 2;
    // any free position?
    for (const p of [0.5, 0.75, 0.25]) {
      let ok = true;
      for (const x of it) if (Math.abs(x.p - p) < GAP) { ok = false; break; }
      if (ok) return true;
    }
    return false;
  };

  function beltContents(e) {
    const m = {};
    (e.items || []).forEach((it) => { m[it.id] = (m[it.id] || 0) + 1; });
    (e.buf || []).forEach((it) => { m[it.id] = (m[it.id] || 0) + 1; });
    return Object.keys(m).map((id) => ({ id, n: m[id] }));
  }
  function saveItems(e) { return { it: (e.items || []).map((i) => [i.id, +i.p.toFixed(3)]) }; }
  function loadItems(e, s) {
    e.items = [];
    if (s && s.it) s.it.forEach(([id, p]) => { if (GF.ITEMS[id]) e.items.push({ id, p }); });
    e.items.sort((a, b) => b.p - a.p);
  }

  /* =========================== BELT =========================== */
  GF.Kinds.belt = {
    init(e, s) { loadItems(e, s); e.curve = 0; e.jam = false; },
    onBuild(e) { B.recalcShape(e); },
    save: saveItems,
    contents: beltContents,
    update(e, dt) {
      const v = U.DIRS[e.dir];
      moveItems(e, dt, 1, (id) => pushTo(GF.Ent.at(e.x + v.x, e.y + v.y), id, e.dir, e));
    },
    beltAccept(e, id, fromDir) {
      if (fromDir === e.dir) return insertBack(e, id);
      if (fromDir === (e.dir + 2) % 4) return false;
      // side input: curve or side-load
      const fromLeft = fromDir === (e.dir + 1) % 4; // moving east into a north belt → came from west = left
      if (e.curve && ((e.curve < 0 && fromLeft) || (e.curve > 0 && !fromLeft))) return insertBack(e, id);
      return insertAt(e, id, 0.5);
    },
    status(e) { return e.jam ? 'Båndet står stille (fyldt)' : (e.items.length ? e.items.length + ' genstande' : 'Tomt'); },
  };

  /* ====================== UNDERGROUND BELT ===================== */
  B.findUgPartner = function (e) {
    // an 'in' looks forward for an 'out'; an 'out' looks backward for an 'in'
    const fwd = e.ugType === 'in';
    const v = U.DIRS[fwd ? e.dir : (e.dir + 2) % 4];
    for (let i = 1; i <= e.def.maxDist; i++) {
      const o = GF.Ent.at(e.x + v.x * i, e.y + v.y * i);
      if (o && o.kind === 'ug' && o.def.tier === e.def.tier && o.dir === e.dir) {
        if (o.ugType !== e.ugType) return { o, d: i };
        return null;
      }
    }
    return null;
  };
  function linkUg(e) {
    if (e.pair && !e.pair.dead) return;
    e.pair = null;
    const f = B.findUgPartner(e);
    if (f && (!f.o.pair || f.o.pair.dead)) {
      e.pair = f.o; f.o.pair = e;
      const entrance = e.ugType === 'in' ? e : f.o;
      entrance.len = f.d;
    }
  }
  GF.Kinds.ug = {
    init(e, s) {
      loadItems(e, s);
      e.ugType = (s && s.ug) || null;
      e.pair = null; e.len = 1; e.jam = false;
    },
    onBuild(e, loaded) {
      if (!e.ugType) {
        // auto: become exit if an unpaired entrance of same tier/dir is behind us
        const v = U.DIRS[(e.dir + 2) % 4];
        e.ugType = 'in';
        for (let i = 1; i <= e.def.maxDist; i++) {
          const o = GF.Ent.at(e.x + v.x * i, e.y + v.y * i);
          if (o && o.kind === 'ug' && o.def.tier === e.def.tier && o.dir === e.dir) {
            if (o.ugType === 'in' && (!o.pair || o.pair.dead)) e.ugType = 'out';
            break;
          }
        }
      }
      if (!loaded) linkUg(e);
    },
    postLoad(e) { linkUg(e); },
    onRemove(e) { if (e.pair) { e.pair.pair = null; e.pair = null; } },
    save(e) { const s = saveItems(e); s.ug = e.ugType; return s; },
    contents: beltContents,
    update(e, dt) {
      if (e.ugType === 'in') {
        if (!e.pair || e.pair.dead) { linkUg(e); moveItems(e, dt, 1, () => false); return; }
        moveItems(e, dt, e.len, (id) => insertBack(e.pair, id));
      } else {
        const v = U.DIRS[e.dir];
        moveItems(e, dt, 1, (id) => pushTo(GF.Ent.at(e.x + v.x, e.y + v.y), id, e.dir, e));
      }
    },
    beltAccept(e, id, fromDir) {
      if (e.ugType !== 'in' || fromDir !== e.dir) return false;
      return insertBack(e, id);
    },
    status(e) { return (e.ugType === 'in' ? 'Indgang' : 'Udgang') + (e.pair ? ' (forbundet)' : ' (ikke forbundet)'); },
  };

  /* ========================== SPLITTER ========================= */
  /** tile of lane 0 (left) / 1 (right) relative to facing */
  B.laneTile = function (e, lane) {
    switch (e.dir) {
      case 0: return { x: e.x + lane, y: e.y };
      case 1: return { x: e.x, y: e.y + lane };
      case 2: return { x: e.x + 1 - lane, y: e.y };
      default: return { x: e.x, y: e.y + 1 - lane };
    }
  };
  GF.Kinds.splitter = {
    init(e, s) {
      e.buf = [];
      if (s && s.buf) s.buf.forEach((id) => { if (GF.ITEMS[id]) e.buf.push({ id }); });
      e.mode = (s && s.mode) || 'even';     // even | left | right
      e.filter = (s && s.filter) || null;  // item id → goes to filterSide
      e.filterSide = (s && s.fs) || 0;
      e.next = 0; e.cd = [0, 0];
      e.items = [];                          // (no visible items on splitter)
    },
    save(e) { return { buf: e.buf.map((b) => b.id), mode: e.mode, filter: e.filter, fs: e.filterSide }; },
    contents: beltContents,
    beltAccept(e, id, fromDir) {
      if (fromDir !== e.dir || e.buf.length >= 4) return false;
      e.buf.push({ id });
      return true;
    },
    update(e, dt) {
      e.cd[0] -= dt; e.cd[1] -= dt;
      if (!e.buf.length) return;
      const interval = GAP / e.def.speed;
      const v = U.DIRS[e.dir];
      for (let tries = 0; tries < 2 && e.buf.length; tries++) {
        const it = e.buf[0];
        let lanes;
        if (e.filter) lanes = it.id === e.filter ? [e.filterSide] : [1 - e.filterSide];
        else if (e.mode === 'left') lanes = [0, 1];
        else if (e.mode === 'right') lanes = [1, 0];
        else lanes = [e.next, 1 - e.next];
        let done = false;
        for (const lane of lanes) {
          if (e.cd[lane] > 0) continue;
          const t = B.laneTile(e, lane);
          const target = GF.Ent.at(t.x + v.x, t.y + v.y);
          if (target && target !== e && pushTo(target, it.id, e.dir, e)) {
            e.buf.shift(); e.cd[lane] = interval; e.next = 1 - lane; done = true; break;
          }
        }
        if (!done) break;
      }
    },
    status(e) {
      const m = e.filter ? 'Filter: ' + GF.itemName(e.filter) : e.mode === 'even' ? 'Jævn fordeling' : 'Prioritet ' + (e.mode === 'left' ? 'venstre' : 'højre');
      return m;
    },
  };

  /* =========================== MERGER ========================== */
  GF.Kinds.merger = {
    init(e, s) {
      e.buf = [];
      if (s && s.buf) s.buf.forEach((id) => { if (GF.ITEMS[id]) e.buf.push({ id }); });
      e.cd = 0; e.items = []; e.rr = 0; e.lastFrom = -1;
    },
    save(e) { return { buf: e.buf.map((b) => b.id) }; },
    contents: beltContents,
    beltAccept(e, id, fromDir) {
      if (fromDir === (e.dir + 2) % 4) return false;
      if (e.buf.length >= 2) return false;
      // round robin: refuse same source twice in a row when buffer busy
      if (e.buf.length && e.lastFrom === fromDir) return false;
      e.buf.push({ id }); e.lastFrom = fromDir;
      return true;
    },
    update(e, dt) {
      e.cd -= dt;
      if (!e.buf.length || e.cd > 0) return;
      const v = U.DIRS[e.dir];
      if (pushTo(GF.Ent.at(e.x + v.x, e.y + v.y), e.buf[0].id, e.dir, e)) { e.buf.shift(); e.cd = GAP / e.def.speed; if (!e.buf.length) e.lastFrom = -1; }
    },
    status(e) { return e.buf.length ? 'Fletter' : 'Tom'; },
  };

  GF.Belts = B;
})(window.GF);

<script>
/* =====================================================================
 * GREJS FACTORY — machines.js
 * Behaviour of production buildings: drills, furnaces/assemblers
 * (generic "crafter"), labs, generators, boilers, steam engines,
 * solar panels, reactors, lamps, oil pumps, radars and the Grejs Core.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const K = GF.Kinds;
  const R = () => GF.RECIPES;

  /* ------------------------------------------------------------------
   * Energy helper shared by all machines.
   * use(e, dt, want) → factor 0..1 of full speed that can run this tick.
   * Electric machines register their demand for the next power tick.
   * ------------------------------------------------------------------ */
  const Energy = {
    isFuel(id, cat) {
      const it = GF.ITEMS[id];
      return !!(it && it.fuel && (it.fuelCat || 'chem') === (cat || 'chem'));
    },
    refuel(e) {
      if (!e.fuel || e.fuel.n <= 0) return false;
      const it = GF.ITEMS[e.fuel.id];
      e.burn += it.fuel;
      e.burnMax = it.fuel;
      GF.Progress.record('consume', e.fuel.id, 1);
      e.fuel.n--;
      if (e.fuel.n <= 0) e.fuel = null;
      return true;
    },
    use(e, dt, want) {
      const d = e.def;
      if (d.energy === 'electric') {
        e.demand = want ? d.power : d.power * 0.03;
        return want ? GF.Power.sat(e) : 0;
      }
      if (d.energy === 'burner') {
        if (!want) return 0;
        const need = d.power * dt;
        if (e.burn < need) Energy.refuel(e);
        if (e.burn <= 0) return 0;
        const f = Math.min(1, e.burn / need);
        e.burn -= need * f;
        return f;
      }
      return want ? 1 : 0;
    },
    /** status text for lack of energy */
    lack(e) {
      if (e.def.energy === 'electric') return e.net ? 'Lav strøm' : 'Ingen strøm';
      return 'Intet brændsel';
    },
    lackWarn(e) { return e.def.energy === 'electric' ? 'nopower' : 'nofuel'; },
  };
  GF.Energy = Energy;

  function noise(e, dt, mult) {
    if (e.def.noise && GF.Enemies) GF.Enemies.addNoise(e.x + e.w / 2, e.y + e.h / 2, (e.def.noise * dt * (mult || 1)) / 20);
  }

  // fuel slot helpers ------------------------------------------------
  function fuelRoom(e, id, n, fromInserter, cat) {
    if (!Energy.isFuel(id, cat)) return 0;
    if (e.fuel && e.fuel.id !== id) return 0;
    const cur = e.fuel ? e.fuel.n : 0;
    const lim = fromInserter ? Math.min(GF.stackOf(id), cat === 'nuclear' ? 2 : 10) : GF.stackOf(id);
    return Math.max(0, Math.min(n, lim - cur));
  }
  function fuelAdd(e, id, n) {
    if (!e.fuel) e.fuel = { id, n: 0 };
    e.fuel.n += n;
  }
  function initFuel(e, s) {
    e.fuel = s && s.fu && GF.ITEMS[s.fu[0]] ? { id: s.fu[0], n: s.fu[1] } : null;
    e.burn = (s && s.bu) || 0;
    e.burnMax = e.burn || 1;
  }
  function saveFuel(e, o) { if (e.fuel) o.fu = [e.fuel.id, e.fuel.n]; if (e.burn > 0) o.bu = Math.round(e.burn); return o; }

  const sum = (o) => { let s = 0; for (const k in o) s += o[k]; return s; };
  const objList = (o) => Object.keys(o).filter((k) => o[k] > 0).map((k) => ({ id: k, n: o[k] }));

  /* =============================== DRILL ============================== */
  function drillTiles(e) {
    const a = e.def.area, out = [];
    for (let y = e.y - a; y < e.y + e.h + a; y++) for (let x = e.x - a; x < e.x + e.w + a; x++) {
      const o = GF.World.ore(x, y);
      if (o && o.type !== 'crude') out.push([x, y]);
    }
    return out;
  }
  K.drill = {
    init(e, s) {
      initFuel(e, s);
      e.prog = (s && s.p) || 0;
      e.hold = (s && s.h && GF.ITEMS[s.h]) ? s.h : null;
      e.holdN = (s && s.hn) || (e.hold ? 1 : 0);
      e.bonus = (s && s.b) || 0;
      e.tiles = null; e.ti = 0; e.st = ''; e.warn = null; e.eff = 0; e.retile = 0;
    },
    save(e) { return saveFuel(e, { p: +e.prog.toFixed(3), h: e.hold, hn: e.holdN, b: +e.bonus.toFixed(3) }); },
    contents(e) { const l = []; if (e.fuel) l.push({ id: e.fuel.id, n: e.fuel.n }); if (e.hold) l.push({ id: e.hold, n: e.holdN }); return l; },
    canInsert(e, id, n, fi) { return e.def.energy === 'burner' ? fuelRoom(e, id, n, fi) : 0; },
    insert(e, id, n, fi) { const a = this.canInsert(e, id, n, fi); if (a > 0) fuelAdd(e, id, a); return a; },
    update(e, dt) {
      e.working = false;
      if (e.hold) {
        const t = GF.Ent.frontTile(e);
        if (GF.Belts.outputTo(t.x, t.y, e.hold, e.dir, e)) {
          e.holdN--; if (e.holdN <= 0) { e.hold = null; e.holdN = 0; }
        } else {
          e.st = 'Output fuldt'; e.warn = 'outfull';
          Energy.use(e, dt, false); e.eff *= 0.99;
          return;
        }
      }
      if (!e.on) { e.st = 'Stoppet'; e.warn = null; Energy.use(e, dt, false); return; }
      e.retile -= dt;
      if (!e.tiles || e.retile <= 0) { e.tiles = drillTiles(e); e.retile = 5; }
      if (!e.tiles.length) { e.st = 'Udtømt – ingen malm'; e.warn = 'depleted'; Energy.use(e, dt, false); return; }
      const f = Energy.use(e, dt, true);
      if (f <= 0) { e.st = Energy.lack(e); e.warn = Energy.lackWarn(e); e.eff *= 0.99; return; }
      e.st = f < 0.99 ? 'Arbejder (lav energi)' : 'Arbejder'; e.warn = f < 0.5 && e.def.energy === 'electric' ? 'lowpower' : null;
      e.working = true;
      e.eff = e.eff * 0.98 + f * 0.02;
      noise(e, dt);
      e.prog += dt * e.def.speed * f;
      if (e.prog >= 1) {
        e.prog -= 1;
        // round-robin over ore tiles
        for (let k = 0; k < e.tiles.length; k++) {
          e.ti = (e.ti + 1) % e.tiles.length;
          const [x, y] = e.tiles[e.ti];
          const got = GF.World.takeOre(x, y, 1);
          if (got) {
            e.hold = got; e.holdN = 1;
            e.bonus += GF.Research.bonus.miningProd;
            if (e.bonus >= 1) { e.bonus -= 1; e.holdN++; }
            GF.Progress.record('produce', got, e.holdN, 'mine');
            GF.Progress.stat('itemsMined', e.holdN);
            if (Math.random() < 0.3) GF.Particles.emit('dust', e.x + e.w / 2, e.y + e.h / 2, 2, { color: GF.World.ORE_COLORS[GF.World.ORE_INDEX[got]] });
            break;
          } else { e.tiles.splice(e.ti, 1); k--; if (!e.tiles.length) break; e.ti = e.ti % e.tiles.length; }
        }
      }
    },
    status(e) { return e.st; },
  };

  /* ============================== CRAFTER ============================= */
  /** smelting recipe that uses item id */
  function smeltFor(id) {
    const RR = R();
    for (const rid in RR) {
      const r = RR[rid];
      if (r.cat === 'smelt' && r.in[id] && GF.Craft.isUnlocked(rid)) return rid;
    }
    return null;
  }
  GF.smeltFor = smeltFor;

  K.crafter = {
    init(e, s) {
      s = s || {};
      initFuel(e, s);
      e.recipe = s.r && R()[s.r] ? s.r : null;
      e.inp = s.i || {}; e.out = s.o || {};
      e.fin = s.fi || {}; e.fout = s.fo || {};
      e.prog = s.p || 0; e.crafting = !!s.c;
      e.eff = 0; e.st = ''; e.warn = null; e.made = s.m || 0; e.autoIn = !!s.ai;
      e.fnets = [];
    },
    save(e) {
      return saveFuel(e, { r: e.recipe, i: e.inp, o: e.out, fi: e.fin, fo: e.fout, p: +e.prog.toFixed(3), c: e.crafting ? 1 : 0, m: e.made, ai: e.autoIn ? 1 : 0 });
    },
    contents(e) {
      const l = objList(e.inp).concat(objList(e.out));
      if (e.fuel) l.push({ id: e.fuel.id, n: e.fuel.n });
      if (e.crafting && e.recipe) { const r = R()[e.recipe]; for (const id in r.in) l.push({ id, n: r.in[id] }); }
      return l;
    },
    setRecipe(e, rid) {
      if (e.recipe === rid) return [];
      const back = this.contents(e).filter((it) => !(e.fuel && it.id === e.fuel.id && it.n === e.fuel.n));
      e.inp = {}; e.out = {}; e.fin = {}; e.fout = {}; e.crafting = false; e.prog = 0;
      e.recipe = rid;
      return back;
    },
    canInsert(e, id, n, fi) {
      const d = e.def;
      if (d.energy === 'burner' && Energy.isFuel(id)) {
        const f = fuelRoom(e, id, n, fi);
        if (f > 0 || !(d.auto && smeltFor(id))) return f;
      }
      let rid = e.recipe;
      if (d.auto) {
        const sr = smeltFor(id);
        if (!sr) return 0;
        if (rid && rid !== sr) {
          if (sum(e.inp) > 0 || sum(e.out) > 0 || e.crafting) return 0;
        }
        rid = sr;
      }
      if (!rid) return 0;
      const need = R()[rid].in[id];
      if (!need) return 0;
      const cur = e.inp[id] || 0;
      const lim = fi ? Math.max(need * 3, need + 2) : GF.stackOf(id);
      return Math.max(0, Math.min(n, lim - cur));
    },
    insert(e, id, n, fi) {
      const d = e.def;
      if (d.energy === 'burner' && Energy.isFuel(id)) {
        const f = fuelRoom(e, id, n, fi);
        if (f > 0) { fuelAdd(e, id, f); return f; }
      }
      const a = this.canInsert(e, id, n, fi);
      if (a <= 0) return 0;
      if (d.auto) {
        const sr = smeltFor(id);
        if (e.recipe !== sr) { e.recipe = sr; e.inp = {}; e.out = e.out || {}; }
      }
      e.inp[id] = (e.inp[id] || 0) + a;
      if (fi) e.autoIn = true;
      return a;
    },
    takeable(e, filter) {
      for (const id in e.out) if (e.out[id] > 0 && (!filter || filter(id))) return id;
      return null;
    },
    take(e, id, n) {
      const have = e.out[id] || 0;
      const t = Math.min(have, n);
      e.out[id] = have - t;
      if (e.out[id] <= 0) delete e.out[id];
      return t;
    },
    update(e, dt) {
      const rec = e.recipe ? R()[e.recipe] : null;
      e.working = false;
      // push fluid outputs
      for (const f in e.fout) if (e.fout[f] > 0) e.fout[f] -= GF.Fluids.push(e, f, e.fout[f]);
      if (!e.on) { e.st = 'Stoppet'; e.warn = null; Energy.use(e, dt, false); return; }
      if (!rec) { e.st = e.def.auto ? 'Venter på malm' : 'Ingen opskrift valgt'; e.warn = null; Energy.use(e, dt, false); return; }
      // pull fluid inputs into buffer
      if (rec.fin) for (const f in rec.fin) {
        const have = e.fin[f] || 0, want = rec.fin[f] * 2 - have;
        if (want > 0) e.fin[f] = have + GF.Fluids.pull(e, f, want);
      }
      if (!e.crafting) {
        // output space?
        for (const id in rec.out) {
          if ((e.out[id] || 0) + rec.out[id] > Math.max(GF.stackOf(id), rec.out[id])) { e.st = 'Output fuldt'; e.warn = 'outfull'; Energy.use(e, dt, false); e.eff *= 0.99; return; }
        }
        if (rec.fout) for (const f in rec.fout) {
          if ((e.fout[f] || 0) > rec.fout[f] * 2) { e.st = 'Væske-output fuldt'; e.warn = 'outfull'; Energy.use(e, dt, false); e.eff *= 0.99; return; }
        }
        // inputs present?
        for (const id in rec.in) {
          if ((e.inp[id] || 0) < rec.in[id]) {
            e.st = 'Mangler ' + GF.itemName(id); e.warn = e.made > 0 ? 'starved' : null;
            Energy.use(e, dt, false); e.eff *= 0.99; return;
          }
        }
        if (rec.fin) for (const f in rec.fin) {
          if ((e.fin[f] || 0) < rec.fin[f] - 1e-6) {
            e.st = 'Mangler ' + GF.itemName(f); e.warn = e.made > 0 ? 'starved' : null;
            Energy.use(e, dt, false); e.eff *= 0.99; return;
          }
        }
        for (const id in rec.in) { e.inp[id] -= rec.in[id]; if (e.inp[id] <= 0) delete e.inp[id]; GF.Progress.record('consume', id, rec.in[id]); }
        if (rec.fin) for (const f in rec.fin) { e.fin[f] -= rec.fin[f]; GF.Progress.record('consume', f, rec.fin[f]); }
        e.crafting = true;
        e.prog = 0;
      }
      const f = Energy.use(e, dt, true);
      if (f <= 0) { e.st = Energy.lack(e); e.warn = Energy.lackWarn(e); e.eff *= 0.99; return; }
      e.working = true;
      e.eff = e.eff * 0.98 + f * 0.02;
      e.st = f < 0.99 ? 'Arbejder (lav energi ' + Math.round(f * 100) + '%)' : 'Arbejder';
      e.warn = f < 0.5 && e.def.energy === 'electric' ? 'lowpower' : null;
      noise(e, dt);
      e.prog += dt * e.def.speed * f;
      if (e.prog >= rec.time) {
        e.prog = 0;
        e.crafting = false;
        e.made++;
        for (const id in rec.out) {
          e.out[id] = (e.out[id] || 0) + rec.out[id];
          GF.Progress.record('produce', id, rec.out[id], e.autoIn ? 'auto' : 'machine', e);
        }
        if (rec.fout) for (const fl in rec.fout) { e.fout[fl] = (e.fout[fl] || 0) + rec.fout[fl]; GF.Progress.record('produce', fl, rec.fout[fl], 'machine', e); }
        if (e.def.cat === 'craft' && GF.Particles && Math.random() < 0.5) GF.Particles.emit('spark', e.x + e.w / 2, e.y + e.h / 2, 3);
      }
    },
    status(e) { return e.st; },
  };

  /* ================================ LAB =============================== */
  K.lab = {
    init(e, s) {
      s = s || {};
      e.packs = s.pk || {}; e.prog = s.p || 0; e.unit = !!s.u; e.st = ''; e.warn = null; e.eff = 0;
    },
    save(e) { return { pk: e.packs, p: +e.prog.toFixed(3), u: e.unit ? 1 : 0 }; },
    contents(e) { return objList(e.packs); },
    canInsert(e, id, n, fi) {
      if (!id.startsWith('sci_')) return 0;
      const cur = e.packs[id] || 0;
      const lim = fi ? 4 : GF.stackOf(id);
      return Math.max(0, Math.min(n, lim - cur));
    },
    insert(e, id, n, fi) { const a = this.canInsert(e, id, n, fi); if (a > 0) e.packs[id] = (e.packs[id] || 0) + a; return a; },
    // labs pass packs to neighbouring labs? (kept simple: no)
    update(e, dt) {
      e.working = false;
      const cur = GF.Research.current;
      if (!e.on) { e.st = 'Stoppet'; Energy.use(e, dt, false); return; }
      if (!cur) { e.st = 'Ingen forskning valgt'; e.warn = null; Energy.use(e, dt, false); return; }
      const t = GF.TECH[cur];
      if (!e.unit) {
        const miss = t.packs.filter((p) => !(e.packs[p] > 0));
        if (miss.length) { e.st = 'Mangler ' + miss.map(GF.itemName).join(', '); e.warn = null; Energy.use(e, dt, false); return; }
        t.packs.forEach((p) => { e.packs[p]--; if (e.packs[p] <= 0) delete e.packs[p]; GF.Progress.record('consume', p, 1); });
        e.unit = true; e.prog = 0;
      }
      const f = Energy.use(e, dt, true);
      if (f <= 0) { e.st = Energy.lack(e); e.warn = Energy.lackWarn(e); return; }
      e.working = true; e.warn = null;
      e.eff = e.eff * 0.98 + f * 0.02;
      e.st = 'Forsker: ' + t.name;
      const speed = e.def.speed * (1 + GF.Research.bonus.labSpeed) * (GF.cheat ? 20 : 1);
      const step = (dt * speed * f) / t.time;
      e.prog += step;
      GF.Research.addWork(step);
      if (e.prog >= 1) { e.prog = 0; e.unit = false; }
    },
    status(e) { return e.st; },
  };

  /* =========================== GENERATORS ============================ */
  K.burnergen = {
    init(e, s) { initFuel(e, s); e.output = 0; e.st = ''; },
    save(e) { return saveFuel(e, {}); },
    contents(e) { return e.fuel ? [{ id: e.fuel.id, n: e.fuel.n }] : []; },
    canInsert(e, id, n, fi) { return fuelRoom(e, id, n, fi); },
    insert(e, id, n, fi) { const a = fuelRoom(e, id, n, fi); if (a > 0) fuelAdd(e, id, a); return a; },
    powerCap(e) { return (e.burn > 0 || e.fuel) ? e.def.maxPower : 0; },
    powerSupply(e, w, dt) {
      let need = w * dt;
      while (need > 0) {
        if (e.burn <= 0 && !Energy.refuel(e)) break;
        const t = Math.min(e.burn, need); e.burn -= t; need -= t;
      }
      e.working = w > 1;
      if (e.working) noise(e, dt, w / e.def.maxPower);
    },
    update(e) {
      e.warn = (!e.fuel && e.burn <= 0) ? 'nofuel' : null;
      e.st = e.warn ? 'Intet brændsel' : (e.net ? 'Leverer ' + U.fmtW(e.output || 0) : 'Ikke forbundet til en mast');
    },
    status(e) { return e.st; },
  };

  K.boiler = {
    init(e, s) { initFuel(e, s); e.water = (s && s.w) || 0; e.st = ''; e.fnets = []; },
    save(e) { return saveFuel(e, { w: Math.round(e.water) }); },
    contents(e) { return e.fuel ? [{ id: e.fuel.id, n: e.fuel.n }] : []; },
    canInsert(e, id, n, fi) { return fuelRoom(e, id, n, fi); },
    insert(e, id, n, fi) { const a = fuelRoom(e, id, n, fi); if (a > 0) fuelAdd(e, id, a); return a; },
    update(e, dt) {
      e.working = false;
      if (e.water < 60) e.water += GF.Fluids.pull(e, 'water', 120 - e.water);
      if (!e.on) { e.st = 'Stoppet'; return; }
      if (e.water <= 0) { e.st = 'Mangler vand'; e.warn = null; return; }
      if (!e.fuel && e.burn <= 0) { e.st = 'Intet brændsel'; e.warn = 'nofuel'; return; }
      const room = GF.Fluids.room(e, 'steam');
      let amt = Math.min(60 * dt, e.water, room);
      if (amt <= 0) { e.st = 'Damp-output fuldt'; e.warn = null; return; }
      const J = 30e3;
      if (e.burn < amt * J) Energy.refuel(e);
      if (e.burn <= 0) { e.st = 'Intet brændsel'; e.warn = 'nofuel'; return; }
      amt = Math.min(amt, e.burn / J);
      e.burn -= amt * J;
      e.water -= amt;
      GF.Fluids.push(e, 'steam', amt);
      e.working = true; e.warn = null;
      e.st = 'Koger (' + Math.round((amt / dt)) + ' damp/s)';
      noise(e, dt, amt / (60 * dt));
    },
    status(e) { return e.st; },
  };

  K.steamengine = {
    init(e) { e.output = 0; e.fnets = []; },
    powerCap(e, dt) { return Math.min(e.def.maxPower, (GF.Fluids.avail(e, 'steam') * 30e3) / dt); },
    powerSupply(e, w, dt) { if (w > 0) GF.Fluids.pull(e, 'steam', (w * dt) / 30e3); e.working = w > 1; },
    status(e) {
      if (!e.net) return 'Ikke forbundet til en mast';
      return e.working ? 'Leverer ' + U.fmtW(e.output || 0) : (GF.Fluids.avail(e, 'steam') > 0 ? 'Venter på forbrug' : 'Mangler damp');
    },
  };

  K.solar = {
    powerCap(e) { return e.def.maxPower * GF.Game.daylight(); },
    powerSupply(e, w) { e.working = w > 1; },
    status(e) { return e.net ? 'Leverer ' + U.fmtW(e.output || 0) + ' (' + Math.round(GF.Game.daylight() * 100) + '% sol)' : 'Ikke forbundet'; },
  };

  K.reactor = {
    init(e, s) { initFuel(e, s); e.heat = 0; },
    save(e) { return saveFuel(e, {}); },
    contents(e) { return e.fuel ? [{ id: e.fuel.id, n: e.fuel.n }] : []; },
    canInsert(e, id, n, fi) { return fuelRoom(e, id, n, fi, 'nuclear'); },
    insert(e, id, n, fi) { const a = fuelRoom(e, id, n, fi, 'nuclear'); if (a > 0) fuelAdd(e, id, a); return a; },
    powerCap(e) { return (e.burn > 0 || e.fuel) && e.on ? e.def.maxPower : 0; },
    powerSupply(e, w, dt) {
      let need = w * dt;
      while (need > 0) {
        if (e.burn <= 0 && !Energy.refuel(e)) break;
        const t = Math.min(e.burn, need); e.burn -= t; need -= t;
      }
      e.working = w > 1;
      e.heat = U.lerp(e.heat, w / e.def.maxPower, 0.02);
    },
    update(e) { e.warn = (!e.fuel && e.burn <= 0) ? 'nofuel' : null; },
    status(e) { return e.warn ? 'Mangler grejsium-celler' : 'Leverer ' + U.fmtW(e.output || 0); },
  };

  K.lamp = {
    update(e, dt) {
      const dark = GF.Game.darkness() > 0.15;
      e.demand = dark ? e.def.power : e.def.power * 0.02;
      e.lit = dark && GF.Power.sat(e) > 0.3;
    },
    status(e) { return e.lit ? 'Tændt' : (e.net ? 'Slukket (dag)' : 'Ingen strøm'); },
  };

  K.oilpump = {
    init(e, s) { e.st = ''; e.fnets = []; e.yield = null; },
    update(e, dt) {
      if (e.yield == null) {
        e.yield = 0;
        for (let y = e.y; y < e.y + e.h; y++) for (let x = e.x; x < e.x + e.w; x++) {
          const o = GF.World.ore(x, y); if (o && o.type === 'crude') e.yield += o.amount;
        }
      }
      e.working = false;
      if (!e.on) { e.st = 'Stoppet'; Energy.use(e, dt, false); return; }
      const rate = 10 * (e.yield / 100); // crude per second
      if (GF.Fluids.room(e, 'crude') <= 0) { e.st = 'Output fuldt'; Energy.use(e, dt, false); return; }
      const f = Energy.use(e, dt, true);
      if (f <= 0) { e.st = Energy.lack(e); e.warn = Energy.lackWarn(e); return; }
      const put = GF.Fluids.push(e, 'crude', rate * dt * f);
      if (put > 0) GF.Progress.record('produce', 'crude', put, 'mine');
      e.working = put > 0; e.warn = null;
      e.st = 'Pumper ' + rate.toFixed(1) + ' råolie/s (' + Math.round(e.yield) + '% ydelse)';
      noise(e, dt);
    },
    status(e) { return e.st; },
  };

  K.radar = {
    init(e, s) { e.scan = (s && s.sc) || 0; e.st = ''; e.ang = 0; },
    save(e) { return { sc: +e.scan.toFixed(2) }; },
    update(e, dt) {
      const f = Energy.use(e, dt, e.on);
      e.working = f > 0;
      e.ang += dt * 1.5 * f;
      if (f <= 0) { e.st = Energy.lack(e); e.warn = e.on ? Energy.lackWarn(e) : null; return; }
      e.warn = null;
      e.scan += dt * f;
      if (e.scan >= 6) {
        e.scan = 0;
        const c = GF.Map.radarScan(e);
        e.st = c ? 'Scanner sektor ' + c : 'Alle sektorer i rækkevidde udforsket';
      } else if (!e.st) e.st = 'Scanner...';
    },
    status(e) { return e.st; },
  };

  /* ============================ GREJS CORE ============================ */
  GF.CORE_STAGES = [
    { name: 'Fundament', need: { steel: 400, brick: 400, frame: 100 } },
    { name: 'Energikerne', need: { motor: 200, battery: 300, solid_fuel: 300 } },
    { name: 'Styresystem', need: { adv_circuit: 400, processor: 150 } },
    { name: 'Fokuslinser', need: { lens: 300, plastic: 500 } },
    { name: 'Tænding', need: { core_segment: 60, grejsium_cell: 60 } },
  ];
  K.core = {
    init(e, s) { e.stage = (s && s.sg) || 0; e.got = (s && s.g) || {}; e.done = !!(s && s.d); e.spin = 0; },
    save(e) { return { sg: e.stage, g: e.got, d: e.done ? 1 : 0 }; },
    canInsert(e, id, n) {
      if (e.done) return 0;
      const st = GF.CORE_STAGES[e.stage];
      const need = st.need[id];
      if (!need) return 0;
      return Math.max(0, Math.min(n, need - (e.got[id] || 0)));
    },
    insert(e, id, n) {
      const a = this.canInsert(e, id, n);
      if (a <= 0) return 0;
      e.got[id] = (e.got[id] || 0) + a;
      GF.Progress.record('consume', id, a);
      const st = GF.CORE_STAGES[e.stage];
      if (Object.keys(st.need).every((k) => (e.got[k] || 0) >= st.need[k])) {
        GF.UI.toast('Grejs-kernen: etape "' + st.name + '" fuldført!', 'good', 'core_segment');
        GF.Audio.play('research');
        e.stage++; e.got = {};
        if (e.stage >= GF.CORE_STAGES.length) {
          e.done = true; e.stage = GF.CORE_STAGES.length - 1;
          GF.bus.emit('coreComplete', e);
        }
      }
      return a;
    },
    progress(e) {
      if (e.done) return 1;
      const st = GF.CORE_STAGES[e.stage];
      let tot = 0, got = 0;
      for (const k in st.need) { tot += st.need[k]; got += Math.min(st.need[k], e.got[k] || 0); }
      return (e.stage + got / tot) / GF.CORE_STAGES.length;
    },
    update(e, dt) { e.spin += dt * (e.done ? 2 : 0.3 + this.progress(e)); },
    status(e) { return e.done ? 'AKTIVERET — fabrikken er fuldendt!' : 'Etape ' + (e.stage + 1) + '/5: ' + GF.CORE_STAGES[e.stage].name; },
  };
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — logistics.js
 * Inserters, chests, roboports, flying drones (logistic + construction),
 * ghosts (planned buildings), blueprints and the deconstruction planner.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const K = GF.Kinds;

  /* =============================== CHESTS ============================= */
  K.chest = {
    init(e, s) {
      e.inv = GF.Inventory.from(s && s.inv, e.def.slots);
      e.requests = (s && s.rq) ? s.rq.filter((r) => GF.ITEMS[r.id]) : [];
      e.incoming = {};
    },
    save(e) { const o = { inv: e.inv.toJSON() }; if (e.requests.length) o.rq = e.requests; return o; },
    contents(e) { return e.inv.list(); },
    canInsert(e, id, n) { return Math.min(n, e.inv.room(id)); },
    insert(e, id, n) { return n - e.inv.add(id, n); },
    takeable(e, filter) { return e.inv.firstMatching(filter); },
    take(e, id, n) { return e.inv.remove(id, n); },
    status(e) {
      const used = e.inv.slots.filter(Boolean).length;
      return used + '/' + e.inv.size + ' pladser brugt';
    },
  };

  /* ============================== INSERTER =========================== */
  function beltLike(t) { return GF.Belts.isBeltFamily(t); }
  function targetAccepts(e, tgt, id) {
    if (!tgt || !id) return 0;
    if (beltLike(tgt)) return GF.Belts.canDrop(tgt) ? 1 : 0;
    const TK = K[tgt.kind];
    if (!TK || !TK.canInsert) return 0;
    let n = TK.canInsert(tgt, id, 999, true);
    if (e.limit > 0 && tgt.inv) n = Math.min(n, Math.max(0, e.limit - tgt.inv.count(id)));
    return n;
  }
  function sourceItems(src) {
    if (src.items && src.items.length) return src.items;
    if (src.buf && src.buf.length) return src.buf;
    return null;
  }
  K.inserter = {
    init(e, s) {
      s = s || {};
      e.phase = s.ph || 0; e.t = s.t || 0;
      e.hand = s.hd && GF.ITEMS[s.hd] ? s.hd : null; e.handN = e.hand ? (s.hn || 1) : 0;
      if (!e.hand && (e.phase === 1 || e.phase === 2)) e.phase = 0;
      e.filter = s.f || null; e.limit = s.l || 0;
      e.st = 'Venter'; e.cd = Math.random() * 0.1;
    },
    save(e) { return { ph: e.phase, t: +e.t.toFixed(2), hd: e.hand, hn: e.handN, f: e.filter, l: e.limit }; },
    contents(e) { return e.hand ? [{ id: e.hand, n: e.handN }] : []; },
    endpoints(e) {
      const v = U.DIRS[e.dir], r = e.def.reach;
      return { sx: e.x - v.x * r, sy: e.y - v.y * r, tx: e.x + v.x * r, ty: e.y + v.y * r };
    },
    update(e, dt) {
      const d = e.def;
      const p = this.endpoints(e);
      if (e.phase === 0) {
        e.demand = d.power * 0.04;
        e.cd -= dt;
        if (e.cd > 0) return;
        e.cd = 0.08;
        if (!e.on) { e.st = 'Stoppet'; return; }
        const sat = GF.Power.sat(e);
        if (sat < 0.05) { e.st = e.net ? 'Lav strøm' : 'Ingen strøm'; e.warn = 'nopower'; return; }
        e.warn = null;
        const src = GF.Ent.at(p.sx, p.sy), tgt = GF.Ent.at(p.tx, p.ty);
        if (!src || !tgt || src === tgt) { e.st = 'Venter'; return; }
        const filt = (id) => (!e.filter || e.filter === id) && targetAccepts(e, tgt, id) > 0;
        const stack = d.stack + GF.Research.bonus.stack;
        let id = null, n = 0;
        const items = sourceItems(src);
        if (items) {
          let maxN = stack;
          for (let i = 0; i < items.length; i++) {
            const it = items[i];
            if (!id) {
              if (!filt(it.id)) continue;
              id = it.id;
              if (!beltLike(tgt)) maxN = Math.max(1, Math.min(stack, targetAccepts(e, tgt, id)));
            } else if (it.id !== id) continue;
            items.splice(i, 1); i--; n++;
            if (n >= maxN) break;
          }
        } else {
          const SK = K[src.kind];
          if (SK && SK.takeable) {
            id = SK.takeable(src, filt);
            if (id) {
              const want = beltLike(tgt) ? stack : Math.min(stack, targetAccepts(e, tgt, id));
              n = SK.take(src, id, Math.max(1, want));
            }
          }
        }
        if (id && n > 0) {
          e.hand = id; e.handN = n; e.phase = 1; e.t = 0; e.st = 'Arbejder';
          e.srcKind = src.kind; e.srcAuto = !!src.autoIn;
        } else e.st = 'Venter på genstande';
        return;
      }
      const sat = GF.Power.sat(e);
      e.demand = d.power;
      if (e.phase === 1 || e.phase === 3) {
        e.t += dt * d.speed * 2 * sat;
        if (e.t >= 1) { e.t = 0; e.phase = e.phase === 1 ? 2 : 0; e.cd = 0; }
        return;
      }
      if (e.phase === 2) {
        e.demand = d.power * 0.04;
        const tgt = GF.Ent.at(p.tx, p.ty);
        if (!tgt) { e.st = 'Intet mål'; return; }
        let put = 0;
        if (beltLike(tgt)) { if (GF.Belts.drop(tgt, e.hand)) put = 1; }
        else {
          const TK = K[tgt.kind];
          if (TK && TK.insert) {
            let allow = e.handN;
            if (e.limit > 0 && tgt.inv) allow = Math.min(allow, Math.max(0, e.limit - tgt.inv.count(e.hand)));
            if (allow > 0) put = TK.insert(tgt, e.hand, allow, true);
          }
        }
        if (put > 0) {
          GF.Progress.inserterMoved(e, tgt, e.hand, put);
          e.handN -= put;
          if (e.handN <= 0) { e.hand = null; e.handN = 0; e.phase = 3; e.t = 0; e.st = 'Arbejder'; }
        } else e.st = 'Mål fuldt';
      }
    },
    /** arm angle 0 (source) .. PI (target) */
    armAngle(e) {
      if (e.phase === 0) return 0;
      if (e.phase === 2) return Math.PI;
      const t = U.smooth(e.t);
      return e.phase === 1 ? t * Math.PI : (1 - t) * Math.PI;
    },
    status(e) { return e.st + (e.filter ? ' · Filter: ' + GF.itemName(e.filter) : '') + (e.limit ? ' · Grænse: ' + e.limit : ''); },
  };

  /* ============================== ROBOPORT =========================== */
  K.roboport = {
    init(e, s) {
      s = s || {};
      e.logi = s.lb || 0; e.cons = s.cb || 0; e.repair = s.rp || 0; e.active = 0;
    },
    save(e) { return { lb: e.logi, cb: e.cons, rp: e.repair }; },
    contents(e) {
      const l = [];
      const flying = L.bots.filter((b) => b.home === e);
      const lb = e.logi + flying.filter((b) => b.type === 'logi').length;
      const cb = e.cons + flying.filter((b) => b.type === 'cons').length;
      if (lb) l.push({ id: 'logi_bot', n: lb });
      if (cb) l.push({ id: 'cons_bot', n: cb });
      if (e.repair) l.push({ id: 'repair_pack', n: e.repair });
      flying.forEach((b) => (b.cargo || []).forEach((c) => l.push({ id: c.id, n: c.n })));
      return l;
    },
    onRemove(e) { L.bots = L.bots.filter((b) => b.home !== e); },
    canInsert(e, id, n) {
      if (id === 'logi_bot') return Math.max(0, Math.min(n, 50 - e.logi));
      if (id === 'cons_bot') return Math.max(0, Math.min(n, 50 - e.cons));
      if (id === 'repair_pack') return Math.max(0, Math.min(n, 100 - e.repair));
      return 0;
    },
    insert(e, id, n) {
      const a = this.canInsert(e, id, n);
      if (id === 'logi_bot') e.logi += a; else if (id === 'cons_bot') e.cons += a; else if (id === 'repair_pack') e.repair += a;
      return a;
    },
    update(e) {
      e.active = 0;
      e.demand = e.def.power * (1 + Math.min(20, L.activeFor(e)) * 0.25);
    },
    status(e) {
      return 'Droner: ' + e.logi + ' logistik, ' + e.cons + ' bygge · ' + e.repair + ' rep.sæt' + (e.net ? '' : ' · INGEN STRØM');
    },
  };

  /* ====================================================================
   * LOGISTIC NETWORKS & DRONES
   * ==================================================================== */
  const L = {
    nets: [], bots: [], dirty: true, _t: 0, botId: 1,
    ghosts: new Map(), ghostTiles: new Map(),
    blueprints: [],
  };

  L.reset = function () {
    L.nets = []; L.bots = []; L.dirty = true; L._t = 0;
    L.ghosts = new Map(); L.ghostTiles = new Map();
    L.loadBlueprints();
  };
  L.activeFor = (port) => { let n = 0; for (const b of L.bots) if (b.home === port) n++; return n; };

  function portCenter(p) { return { x: p.x + p.w / 2, y: p.y + p.h / 2 }; }
  function inSquare(p, x, y, r) { const c = portCenter(p); return Math.abs(x - c.x) <= r && Math.abs(y - c.y) <= r; }

  L.rebuild = function () {
    L.dirty = false;
    const ports = [];
    for (const e of GF.Ent.list.values()) { if (e.kind === 'roboport') ports.push(e); if (e.def.logi) e.lnet = null; }
    const parent = new Map();
    const find = (a) => { while (parent.get(a) !== a) a = parent.get(a); return a; };
    ports.forEach((p) => parent.set(p.id, p.id));
    for (let i = 0; i < ports.length; i++) for (let j = i + 1; j < ports.length; j++) {
      const a = portCenter(ports[i]), b = portCenter(ports[j]);
      if (Math.abs(a.x - b.x) <= 50 && Math.abs(a.y - b.y) <= 50) parent.set(find(ports[i].id), find(ports[j].id));
    }
    const map = new Map();
    L.nets = [];
    ports.forEach((p) => {
      const r = find(p.id);
      let n = map.get(r);
      if (!n) { n = { id: L.nets.length + 1, ports: [], chests: [] }; map.set(r, n); L.nets.push(n); }
      n.ports.push(p); p.lnet = n;
    });
    for (const e of GF.Ent.list.values()) {
      if (!e.def.logi) continue;
      for (const n of L.nets) {
        if (n.ports.some((p) => inSquare(p, e.x + 0.5, e.y + 0.5, p.def.logRadius))) { e.lnet = n; n.chests.push(e); break; }
      }
    }
  };

  L.netAt = function (x, y, construction) {
    for (const n of L.nets) {
      for (const p of n.ports) if (inSquare(p, x, y, construction ? p.def.conRadius : p.def.logRadius)) return n;
    }
    return null;
  };

  function nearest(list, x, y) {
    let best = null, bd = Infinity;
    list.forEach((o) => { const d = U.dist2(x, y, o.x + o.w / 2, o.y + o.h / 2); if (d < bd) { bd = d; best = o; } });
    return best;
  }

  function spawnBot(port, type, task) {
    if (type === 'logi') port.logi--; else port.cons--;
    const c = portCenter(port);
    const b = Object.assign({ id: L.botId++, type, home: port, x: c.x, y: c.y, z: 0, cargo: [], phase: 'toSrc' }, task);
    L.bots.push(b);
    return b;
  }

  function botSpeed(b) {
    const powered = b.home && b.home.net && GF.Power.sat(b.home) > 0.3;
    return 3.2 * (1 + GF.Research.bonus.botSpeed) * (powered ? 1 : 0.35);
  }

  /** find storage for dropped items: storage chests first, then any logistic chest */
  function storageFor(net, id) {
    const cands = net.chests.filter((c) => c.def.logi === 'storage' && c.inv.room(id) > 0);
    if (cands.length) return cands;
    return net.chests.filter((c) => c.def.logi === 'provider' && c.inv.room(id) > 0);
  }

  function dispatch(net) {
    const player = GF.player;
    const pNetLog = player && !player.dead && L.netAt(player.x, player.y, false) === net;
    const pNetCon = player && !player.dead && L.netAt(player.x, player.y, true) === net;
    const suppliers = net.chests.filter((c) => c.def.logi === 'provider' || c.def.logi === 'storage');
    let budget = 12;
    const freeLogi = () => net.ports.filter((p) => p.logi > 0);
    const freeCons = () => net.ports.filter((p) => p.cons > 0);

    // ---------- 1) requests ----------
    const requesters = net.chests.filter((c) => c.def.logi === 'requester' && c.requests.length);
    const reqList = requesters.map((c) => ({ dst: c, reqs: c.requests, inv: c.inv, inc: c.incoming, x: c.x, y: c.y }));
    if (pNetLog && player.requests.length) reqList.push({ dst: 'player', reqs: player.requests, inv: player.inv, inc: player.incoming, x: player.x, y: player.y });
    for (const R of reqList) {
      for (const rq of R.reqs) {
        if (budget <= 0) return;
        const deficit = rq.n - R.inv.count(rq.id) - (R.inc[rq.id] || 0);
        if (deficit <= 0) continue;
        const srcs = suppliers.filter((c) => c !== R.dst && c.inv.count(rq.id) > 0);
        if (!srcs.length) continue;
        const src = nearest(srcs, R.x, R.y);
        const ports = freeLogi();
        if (!ports.length) return;
        const port = nearest(ports, src.x, src.y);
        const cap = 4 + GF.Research.bonus.stack;
        const n = src.inv.remove(rq.id, Math.min(deficit, cap));
        if (n <= 0) continue;
        R.inc[rq.id] = (R.inc[rq.id] || 0) + n;
        spawnBot(port, 'logi', { task: 'deliver', src, dst: R.dst, item: rq.id, n, cargo: [] });
        budget--;
      }
    }
    // ---------- 2) construction (ghosts) ----------
    if (L.ghosts.size) {
      for (const g of L.ghosts.values()) {
        if (budget <= 0) break;
        if (g.assigned || L.netAt(g.x + g.w / 2, g.y + g.h / 2, true) !== net) continue;
        let src = null;
        const cs = suppliers.filter((c) => c.inv.count(g.type) > 0);
        if (cs.length) src = nearest(cs, g.x, g.y);
        else if (pNetCon && player.inv.count(g.type) > 0) src = 'player';
        if (!src) { g.missing = true; continue; }
        g.missing = false;
        const ports = freeCons();
        if (!ports.length) break;
        const port = nearest(ports, g.x, g.y);
        if (src === 'player') player.inv.remove(g.type, 1); else src.inv.remove(g.type, 1);
        g.assigned = true;
        spawnBot(port, 'cons', { task: 'build', src, ghost: g, item: g.type, n: 1 });
        budget--;
      }
    }
    // ---------- 3) deconstruction & repair ----------
    if (budget > 0) {
      for (const p of net.ports) {
        const c = portCenter(p);
        const cands = GF.Ent.near(c.x, c.y, p.def.conRadius * 1.42, (e) => (e.decon && !e.deconAssigned) || (e.hp < e.maxHp && !e.repairAssigned && !e.def.enemy));
        for (const e of cands) {
          if (budget <= 0) break;
          if (!inSquare(p, e.x + e.w / 2, e.y + e.h / 2, p.def.conRadius)) continue;
          const ports = freeCons();
          if (!ports.length) break;
          if (e.decon) {
            e.deconAssigned = true;
            spawnBot(nearest(ports, e.x, e.y), 'cons', { task: 'decon', ent: e, phase: 'toDst' });
            budget--;
          } else {
            const rp = ports.filter((q) => q.repair > 0);
            if (!rp.length) continue;
            const port = nearest(rp, e.x, e.y);
            port.repair--;
            e.repairAssigned = true;
            spawnBot(port, 'cons', { task: 'repair', ent: e, phase: 'toDst' });
            budget--;
          }
        }
      }
    }
  }

  function targetPos(b) {
    let t = null;
    if (b.phase === 'toSrc') t = b.src === 'player' ? GF.player : b.src;
    else if (b.phase === 'toDst') {
      if (b.task === 'deliver') t = b.dst === 'player' ? GF.player : b.dst;
      else if (b.task === 'build') t = b.ghost;
      else t = b.ent;
    } else if (b.phase === 'toStore') t = b.store === 'player' ? GF.player : b.store;
    else t = b.home;
    if (!t) return null;
    if (t === GF.player) return { x: t.x, y: t.y };
    return { x: t.x + (t.w || 1) / 2, y: t.y + (t.h || 1) / 2 };
  }

  function giveBack(b, net) {
    // bot has cargo to store somewhere
    if (!b.cargo.length) { b.phase = 'home'; return; }
    const id = b.cargo[0].id;
    const st = net ? storageFor(net, id) : [];
    if (st.length) { b.store = nearest(st, b.x, b.y); b.phase = 'toStore'; return; }
    if (net && GF.player && L.netAt(GF.player.x, GF.player.y, true) === net) { b.store = 'player'; b.phase = 'toStore'; return; }
    // nowhere: drop at home port
    b.cargo.forEach((c) => GF.Game.dropItem(b.home.x + 1, b.home.y + b.home.h + 0.5, c.id, c.n));
    b.cargo = [];
    b.phase = 'home';
  }

  function arrive(b) {
    const net = b.home && b.home.lnet;
    switch (b.phase) {
      case 'toSrc':
        b.cargo = [{ id: b.item, n: b.n }];
        b.phase = 'toDst';
        break;
      case 'toDst':
        if (b.task === 'deliver') {
          const dst = b.dst;
          const c = b.cargo[0];
          if (dst === 'player') {
            GF.player.incoming[c.id] = Math.max(0, (GF.player.incoming[c.id] || 0) - c.n);
            const left = GF.player.inv.add(c.id, c.n);
            c.n = left;
          } else if (!dst.dead) {
            dst.incoming[c.id] = Math.max(0, (dst.incoming[c.id] || 0) - c.n);
            c.n = dst.inv.add(c.id, c.n);
          }
          b.cargo = b.cargo.filter((x) => x.n > 0);
          giveBack(b, net);
        } else if (b.task === 'build') {
          const g = b.ghost;
          if (L.ghosts.get(g.key) === g) {
            const chk = GF.Ent.canPlace(g.type, g.x, g.y, g.dir);
            if (chk.ok) {
              L.removeGhost(g);
              const e = L.buildFromGhost(g);
              if (e) { b.cargo = []; GF.Particles.emit('spark', g.x + g.w / 2, g.y + g.h / 2, 6, { color: '#7fd0ff' }); GF.Audio.play('build', { x: g.x, y: g.y, vol: 0.4 }); }
            } else { g.assigned = false; }
          }
          giveBack(b, net);
        } else if (b.task === 'decon') {
          const e = b.ent;
          if (e && !e.dead) {
            const inv = new GF.Inventory(64);
            GF.Ent.remove(e, { inv }).forEach((it) => GF.Game.dropItem(e.x + 0.5, e.y + 0.5, it.id, it.n));
            b.cargo = inv.list();
            GF.Particles.emit('dust', e.x + e.w / 2, e.y + e.h / 2, 6);
          }
          giveBack(b, net);
        } else if (b.task === 'repair') {
          const e = b.ent;
          if (e && !e.dead) { e.hp = Math.min(e.maxHp, e.hp + GF.ITEMS.repair_pack.repair); e.repairAssigned = false; GF.Particles.emit('spark', e.x + e.w / 2, e.y + e.h / 2, 5, { color: '#9f9' }); }
          b.phase = 'home';
        }
        break;
      case 'toStore': {
        const st = b.store;
        b.cargo.forEach((c) => {
          if (st === 'player') c.n = GF.player.inv.add(c.id, c.n);
          else if (!st.dead) c.n = st.inv.add(c.id, c.n);
        });
        b.cargo = b.cargo.filter((c) => c.n > 0);
        giveBack(b, net);
        break;
      }
      default: // home
        if (b.home && !b.home.dead) { if (b.type === 'logi') b.home.logi++; else b.home.cons++; }
        b.done = true;
    }
  }

  L.update = function (dt) {
    if (L.dirty) L.rebuild();
    L._t += dt;
    if (L._t >= 0.5) {
      L._t = 0;
      // release ghosts / entities whose drones vanished
      const refG = new Set(), refE = new Set();
      L.bots.forEach((b) => { if (b.ghost) refG.add(b.ghost); if (b.ent) refE.add(b.ent); });
      for (const g of L.ghosts.values()) if (g.assigned && !refG.has(g)) g.assigned = false;
      L.nets.forEach(dispatch);
      L._stale = (L._stale || 0) + 1;
      if (L._stale >= 10) {
        L._stale = 0;
        for (const e of GF.Ent.list.values()) {
          if (e.deconAssigned && !refE.has(e)) e.deconAssigned = false;
          if (e.repairAssigned && !refE.has(e)) e.repairAssigned = false;
        }
      }
    }
    for (const b of L.bots) {
      if (b.home && b.home.dead) { b.done = true; continue; }
      // invalid targets
      if (b.phase === 'toDst' && (b.task === 'decon' || b.task === 'repair') && (!b.ent || b.ent.dead)) { b.phase = 'home'; }
      if (b.phase === 'toSrc' && b.src !== 'player' && b.src.dead) {
        if (b.task === 'deliver' && b.dst) { const inc = b.dst === 'player' ? GF.player.incoming : b.dst.incoming; if (inc) inc[b.item] = Math.max(0, (inc[b.item] || 0) - b.n); }
        b.phase = 'home';
      }
      if (b.phase === 'toDst' && b.task === 'deliver' && b.dst !== 'player' && b.dst.dead) { giveBack(b, b.home.lnet); }
      if (b.phase === 'toStore' && b.store !== 'player' && b.store.dead) giveBack(b, b.home.lnet);
      const t = targetPos(b);
      if (!t) { b.done = true; continue; }
      const dx = t.x - b.x, dy = t.y - b.y, d = Math.hypot(dx, dy);
      const sp = botSpeed(b) * dt;
      b.z = Math.min(1, b.z + dt * 2);
      if (d <= sp + 0.05) { b.x = t.x; b.y = t.y; arrive(b); }
      else { b.x += (dx / d) * sp; b.y += (dy / d) * sp; b.ang = Math.atan2(dy, dx); }
    }
    if (L.bots.some((b) => b.done)) L.bots = L.bots.filter((b) => !b.done);
  };

  /* ============================== GHOSTS ============================== */
  L.ghostAt = (x, y) => L.ghostTiles.get(U.key(x, y)) || null;

  L.canGhost = function (type, x, y, dir) {
    const { w, h } = GF.Ent.size(type, dir);
    for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++) if (L.ghostTiles.has(U.key(tx, ty))) return false;
    const c = GF.Ent.canPlace(type, x, y, dir);
    return c.ok && !c.replace;
  };

  L.addGhost = function (type, x, y, dir, cfg) {
    if (!GF.DEFS[type] || !L.canGhost(type, x, y, dir)) return null;
    const d = GF.DEFS[type];
    dir = d.rot ? dir & 3 : 0;
    const { w, h } = GF.Ent.size(type, dir);
    const g = { type, x, y, dir, w, h, cfg: cfg || null, assigned: false, key: U.key(x, y) };
    L.ghosts.set(g.key, g);
    for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++) L.ghostTiles.set(U.key(tx, ty), g);
    return g;
  };
  L.removeGhost = function (g) {
    if (!g) return;
    L.ghosts.delete(g.key);
    for (let ty = g.y; ty < g.y + g.h; ty++) for (let tx = g.x; tx < g.x + g.w; tx++) {
      const k = U.key(tx, ty);
      if (L.ghostTiles.get(k) === g) L.ghostTiles.delete(k);
    }
  };
  /** remove ghosts overlapping a rectangle (when a real building is placed) */
  L.clearGhostsIn = function (x, y, w, h) {
    for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++) {
      const g = L.ghostTiles.get(U.key(tx, ty));
      if (g) L.removeGhost(g);
    }
  };

  /** capture configuration of an entity for blueprints/ghosts */
  L.configOf = function (e) {
    const c = {};
    if (e.kind === 'crafter' && !e.def.auto && e.recipe) c.recipe = e.recipe;
    if (e.kind === 'inserter') { if (e.filter) c.filter = e.filter; if (e.limit) c.limit = e.limit; }
    if (e.kind === 'splitter') { c.mode = e.mode; if (e.filter) { c.filter = e.filter; c.fs = e.filterSide; } }
    if (e.kind === 'chest' && e.requests && e.requests.length) c.requests = e.requests.map((r) => ({ id: r.id, n: r.n }));
    if (e.kind === 'ug') c.ug = e.ugType;
    return Object.keys(c).length ? c : null;
  };
  L.applyConfig = function (e, c) {
    if (!c) return;
    if (c.recipe && e.kind === 'crafter' && GF.RECIPES[c.recipe]) K.crafter.setRecipe(e, c.recipe);
    if (e.kind === 'inserter') { e.filter = c.filter || null; e.limit = c.limit || 0; }
    if (e.kind === 'splitter') { e.mode = c.mode || 'even'; e.filter = c.filter || null; e.filterSide = c.fs || 0; }
    if (e.kind === 'chest' && c.requests) e.requests = c.requests.map((r) => ({ id: r.id, n: r.n }));
  };

  L.buildFromGhost = function (g) {
    const state = g.cfg && g.cfg.ug ? { ug: g.cfg.ug } : null;
    const e = GF.Ent.place(g.type, g.x, g.y, g.dir, null);
    if (!e) return null;
    if (state && e.kind === 'ug') { e.ugType = state.ug; e.pair = null; K.ug.postLoad(e); }
    L.applyConfig(e, g.cfg);
    GF.Progress.stat('buildingsBuilt', 1);
    return e;
  };

  /* ============================ BLUEPRINTS ============================ */
  const BP_KEY = 'grejs_blueprints_v1';
  L.loadBlueprints = function () { L.blueprints = U.parse(U.ls.get(BP_KEY), []); if (!Array.isArray(L.blueprints)) L.blueprints = []; };
  L.saveBlueprints = function () { U.ls.set(BP_KEY, JSON.stringify(L.blueprints)); };

  L.capture = function (x0, y0, x1, y1, name) {
    const ents = GF.Ent.inRect(Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1)).filter((e) => !e.def.enemy && !e.def.noItem);
    if (!ents.length) return null;
    let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity;
    ents.forEach((e) => { mx = Math.min(mx, e.x); my = Math.min(my, e.y); Mx = Math.max(Mx, e.x + e.w); My = Math.max(My, e.y + e.h); });
    const bp = {
      name: name || 'Byggeplan ' + (L.blueprints.length + 1),
      w: Mx - mx, h: My - my, created: Date.now(),
      ents: ents.map((e) => ({ t: e.type, dx: e.x - mx, dy: e.y - my, d: e.dir, c: L.configOf(e) })),
    };
    L.blueprints.push(bp);
    L.saveBlueprints();
    return bp;
  };

  /** rotate blueprint 90° clockwise (returns a new object) */
  L.rotateBp = function (bp) {
    return Object.assign({}, bp, {
      w: bp.h, h: bp.w,
      ents: bp.ents.map((en) => {
        const s = GF.Ent.size(en.t, en.d);
        const d = GF.DEFS[en.t] && GF.DEFS[en.t].rot ? (en.d + 1) % 4 : en.d;
        return { t: en.t, dx: bp.h - en.dy - s.h, dy: en.dx, d, c: en.c };
      }),
    });
  };

  L.placeBlueprint = function (bp, x, y) {
    let n = 0;
    bp.ents.forEach((en) => {
      if (!GF.DEFS[en.t]) return;
      const ex = x + en.dx, ey = y + en.dy;
      const existing = GF.Ent.at(ex, ey);
      if (existing && existing.type === en.t && existing.x === ex && existing.y === ey) return;
      if (L.addGhost(en.t, ex, ey, en.d, en.c)) n++;
    });
    return n;
  };

  /* ============================ SAVE / LOAD =========================== */
  L.save = function () {
    // flying bots are returned home (their cargo goes back to their home port as ground items)
    const ret = [];
    L.bots.forEach((b) => ret.push({ home: [b.home.x, b.home.y], type: b.type, cargo: b.cargo, task: b.task, item: b.item, n: b.n, phase: b.phase }));
    return {
      ghosts: Array.from(L.ghosts.values()).map((g) => [g.type, g.x, g.y, g.dir, g.cfg]),
      bots: ret,
    };
  };
  L.load = function (d) {
    L.reset();
    if (!d) return;
    (d.ghosts || []).forEach((g) => L.addGhost(g[0], g[1], g[2], g[3], g[4]));
    (d.bots || []).forEach((b) => {
      const port = GF.Ent.at(b.home[0], b.home[1]);
      if (!port || port.kind !== 'roboport') return;
      if (b.type === 'logi') port.logi++; else port.cons++;
      let cargo = b.cargo || [];
      if (b.phase === 'toSrc' && b.item) cargo = [{ id: b.item, n: b.n }];
      cargo.forEach((c) => GF.Game.dropItem(port.x + 1, port.y + port.h + 0.5, c.id, c.n));
    });
  };

  L.reset();
  GF.Logistics = L;
})(window.GF);
