'use strict';
(function (GF) {
  const U = GF.U;

  const TUTORIAL = [
    { title: 'Saml 20 jernmalm', hint: 'Gå hen til den blågrå malm (jern) med <b>WASD</b> og hold <b>venstre museknap</b> nede på den for at mine.',
      check: (P) => GF.player.inv.count('iron_ore') >= 20 || P.tut.ironMined >= 20 },
    { title: 'Byg en ovn', hint: 'Mine mindst 5 sten (grå malm). Åbn crafting med <b>C</b> og lav en <b>Stenovn</b>. Vælg den og klik for at placere den.',
      check: () => countBuilt(['stone_furnace', 'steel_furnace', 'elec_furnace']) > 0 },
    { title: 'Producér 20 jernplader', hint: 'Klik på ovnen og læg <b>jernmalm</b> og <b>kul eller træ</b> i den (klik på genstande i dit inventar). Tag pladerne ud bagefter.',
      check: (P) => (P.totals.iron_plate || 0) - (P.tut.base || 0) >= 20 },
    { title: 'Byg et bor', hint: 'Lav et <b>Kulbor</b> (kræver tandhjul, jernplader og en stenovn) og placér det på malm. Giv det kul som brændsel.',
      check: () => countBuilt(['burner_drill', 'elec_drill', 'adv_drill']) > 0 },
    { title: 'Byg et transportbånd', hint: 'Lav <b>Transportbånd</b> og placér dem. <b>Træk</b> med musen for at bygge en linje. <b>R</b> roterer.',
      check: () => countBuilt(['belt', 'fast_belt', 'express_belt']) > 0 },
    { title: 'Automatisér jernproduktion', hint: 'Sæt et bor på jernmalm med outputtet (pilen) pegende ind i en ovn — eller brug bånd og grabbere. Lad maskinerne producere 10 plader selv.',
      check: (P) => P.tut.autoIron >= 10 },
    { title: 'Byg elektricitet', hint: 'Byg en <b>Kulgenerator</b>, fyld kul i den og forbind den med <b>Træmaster</b> til en maskine (fx en grabber eller et lab).',
      check: () => GF.Power.total.prod > 1 },
    { title: 'Forsk i Automatisering', hint: 'Byg et <b>Forskningslab</b> med strøm, lav <b>Tandhjulspakker</b> og læg dem i labbet. Tryk <b>T</b> og vælg <b>Automatisering</b>.',
      check: () => GF.Research.isDone('automation') },
    { title: 'Byg din første samlemaskine', hint: 'Lav en <b>Samlemaskine Mk1</b>, placér den med strøm og vælg en opskrift (fx tandhjul).',
      check: () => countBuilt(['assembler1', 'assembler2', 'assembler3']) > 0 },
    { title: 'Skab en automatisk produktionslinje', hint: 'Før materialer ind i samlemaskinen med <b>grabbere</b> og lad en grabber tage produkterne ud på et bånd eller i en kiste (10 stk).',
      check: (P) => P.tut.autoLine >= 10 },
  ];

  const MILESTONES = [
    ['first_miner', 'Første bor', () => countBuilt(['burner_drill', 'elec_drill', 'adv_drill']) > 0],
    ['first_power', 'Første kraftværk', () => GF.Power.total.prod > 1],
    ['first_machine', 'Første samlemaskine', () => countBuilt(['assembler1', 'assembler2', 'assembler3']) > 0],
    ['first_line', 'Første automatiske linje', (P) => P.tut.autoLine >= 10],
    ['first_research', 'Første forskning', (P) => P.stats.researchCompleted >= 1],
    ['first_factory', 'Første fabrik (50 bygninger)', () => factorySize() >= 50],
    ['items_1k', '1.000 genstande produceret', (P) => P.stats.itemsProduced >= 1000],
    ['items_10k', '10.000 genstande produceret', (P) => P.stats.itemsProduced >= 10000],
    ['items_100k', '100.000 genstande produceret', (P) => P.stats.itemsProduced >= 100000],
    ['first_attack', 'Første fjendeangreb', (P) => P.stats.attacksSeen >= 1],
    ['first_oil', 'Første olie', (P) => (P.totals.crude || 0) > 0],
    ['first_bot', 'Første drone i luften', () => GF.Logistics.bots.length > 0],
    ['first_hive', 'Første kryberede ødelagt', (P) => P.stats.hivesDestroyed >= 1],
    ['mega_factory', 'Første megafabrik (1000 bygninger)', () => factorySize() >= 1000],
    ['grejs_core', 'Grejs-kernen aktiveret!', (P) => P.coreDone],
  ];

  const WARN_TEXT = {
    nopower: '⚡ Ingen strøm', lowpower: '⚡ Lav strøm', nofuel: '🔥 Mangler brændsel', starved: '⚠ Maskine mangler input',
    outfull: '⛔ Output fuldt / bånd stoppet', noammo: '⚠ Tårn mangler ammunition', depleted: '✖ Bor udtømt',
  };

  function countBuilt(types) {
    let n = 0;
    for (const e of GF.Ent.list.values()) if (types.includes(e.type)) n++;
    return n;
  }
  function factorySize() {
    let n = 0;
    for (const e of GF.Ent.list.values()) if (!e.def.enemy) n++;
    return n;
  }
  GF.factorySize = factorySize;

  const P = {
    TUTORIAL, MILESTONES,
    stats: {}, totals: {}, tut: {}, miles: new Set(), warnings: [], attackMarks: [],
    cur: { p: {}, c: {} }, hist: [], histMin: [], _mAcc: { p: {}, c: {} }, _sT: 0, _mN: 0, _wT: 0, coreDone: false,
  };

  P.reset = function () {
    P.stats = {
      playtime: 0, itemsMined: 0, itemsProduced: 0, buildingsBuilt: 0, enemiesKilled: 0, distance: 0,
      powerGenerated: 0, powerConsumed: 0, researchCompleted: 0, largestFactory: 0, hivesDestroyed: 0,
      deaths: 0, buildingsLost: 0, attacksSeen: 0,
    };
    P.totals = {};
    P.tut = { step: 0, done: false, ironMined: 0, autoIron: 0, autoLine: 0, base: 0, enabled: true };
    P.miles = new Set();
    P.warnings = []; P.attackMarks = [];
    P.cur = { p: {}, c: {} }; P.hist = []; P.histMin = []; P._mAcc = { p: {}, c: {} }; P._sT = 0; P._mN = 0;
    P.coreDone = false;
  };

  P.stat = function (k, n) { P.stats[k] = (P.stats[k] || 0) + n; };

  /** record production/consumption of an item */
  P.record = function (type, id, n, src, e) {
    if (type === 'produce') {
      P.totals[id] = (P.totals[id] || 0) + n;
      P.cur.p[id] = (P.cur.p[id] || 0) + n;
      if (src !== 'mine' && src !== 'hand-mine') P.stats.itemsProduced += n;
      if (id === 'iron_ore' && src === 'hand-mine') P.tut.ironMined += n;
      if (id === 'iron_plate' && src === 'auto') P.tut.autoIron += n;
    } else {
      P.cur.c[id] = (P.cur.c[id] || 0) + n;
    }
  };

  P.inserterMoved = function (ins, tgt, id, n) {
    if (ins.srcKind === 'crafter' && ins.srcAuto) {
      P.tut.autoLine += n;
    }
  };

  function addTo(a, b) { for (const k in b) a[k] = (a[k] || 0) + b[k]; }

  /** rates (per minute) over window: 'm1' (last 60 s), 'm10', 'h1' */
  P.rates = function (win) {
    const p = {}, c = {};
    let secs = 60;
    if (win === 'm1') { P.hist.forEach((h) => { addTo(p, h.p); addTo(c, h.c); }); secs = Math.max(1, P.hist.length); }
    else {
      const n = win === 'm10' ? 10 : 60;
      const arr = P.histMin.slice(-n);
      arr.forEach((h) => { addTo(p, h.p); addTo(c, h.c); });
      // include partial minute from sec history
      addTo(p, P._mAcc.p); addTo(c, P._mAcc.c);
      secs = Math.max(1, arr.length * 60 + P._mN);
    }
    const f = 60 / secs;
    const out = {};
    new Set(Object.keys(p).concat(Object.keys(c))).forEach((id) => { out[id] = { p: (p[id] || 0) * f, c: (c[id] || 0) * f }; });
    return out;
  };

  P.update = function (dt) {
    P.stats.playtime += dt;
    P._sT += dt;
    if (P._sT >= 1) {
      P._sT -= 1;
      P.hist.push(P.cur); if (P.hist.length > 60) P.hist.shift();
      addTo(P._mAcc.p, P.cur.p); addTo(P._mAcc.c, P.cur.c); P._mN++;
      if (P._mN >= 60) { P.histMin.push(P._mAcc); if (P.histMin.length > 60) P.histMin.shift(); P._mAcc = { p: {}, c: {} }; P._mN = 0; }
      P.cur = { p: {}, c: {} };
      P.checkProgress();
      P.updateWarnings();
    }
  };

  P.checkProgress = function () {
    const fs = factorySize();
    if (fs > P.stats.largestFactory) P.stats.largestFactory = fs;
    // tutorial
    const T = P.tut;
    if (!T.done && GF.Settings.get('tutorials') && T.enabled) {
      const step = TUTORIAL[T.step];
      if (step && step.check(P)) {
        GF.UI.toast('Mission fuldført: ' + step.title, 'good');
        GF.Audio.play('research');
        T.step++;
        if (T.step === 2) T.base = P.totals.iron_plate || 0;
        if (T.step >= TUTORIAL.length) { T.done = true; GF.UI.toast('Tutorial fuldført! Nu er fabrikken din.', 'good'); }
        GF.bus.emit('tutorial');
      }
    }
    // milestones
    MILESTONES.forEach(([id, name, fn]) => {
      if (P.miles.has(id)) return;
      let ok = false;
      try { ok = fn(P); } catch (e) { ok = false; }
      if (ok) { P.miles.add(id); GF.UI.toast('🏆 Milepæl: ' + name, 'mile'); GF.Audio.play('research'); }
    });
  };

  P.updateWarnings = function () {
    const groups = {};
    for (const e of GF.Ent.list.values()) {
      if (!e.warn || e.def.enemy) continue;
      const g = groups[e.warn] || (groups[e.warn] = { key: e.warn, text: WARN_TEXT[e.warn] || e.warn, count: 0, ents: [] });
      g.count++;
      if (g.ents.length < 20) g.ents.push(e);
    }
    const list = Object.values(groups);
    if (GF.player && GF.player.inv.freeSlots() === 0) list.push({ key: 'invfull', text: '🎒 Inventaret er fuldt', count: 1, ents: [] });
    const now = GF.Game.time;
    P.attackMarks = P.attackMarks.filter((m) => now - m.t < 30);
    if (P.attackMarks.length) {
      const m = P.attackMarks[P.attackMarks.length - 1];
      list.unshift({ key: 'attack', text: '☠ Fabrikken er under angreb!', count: P.attackMarks.length, pos: m });
    }
    P.warnings = list;
  };

  // events
  GF.bus.on('removed', (e, opts) => {
    if (opts && opts.destroyed && !e.def.enemy && GF.Game.running) P.attackMarks.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, t: GF.Game.time });
  });
  GF.bus.on('enemyAttack', (a) => {
    P.stat('attacksSeen', 1);
    GF.Audio.play('attack');
  });
  GF.bus.on('coreComplete', () => { P.coreDone = true; GF.UI.victory(); });

  P.save = () => ({ stats: P.stats, totals: P.totals, tut: P.tut, miles: Array.from(P.miles), core: P.coreDone });
  P.load = function (d) {
    P.reset();
    if (!d) return;
    Object.assign(P.stats, d.stats || {});
    P.totals = d.totals || {};
    Object.assign(P.tut, d.tut || {});
    (d.miles || []).forEach((m) => P.miles.add(m));
    P.coreDone = !!d.core;
  };

  P.reset();
  GF.Progress = P;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — save.js
 * Save / load with IndexedDB (large saves) and a localStorage fallback.
 * Slot metadata is kept in localStorage for fast menu display.
 * Slots: 'auto', '1'..'4'. Export / import as .json files.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const META_KEY = 'grejs_meta_v1';
  const LS_PREFIX = 'grejs_save_v1_';
  const VERSION = 1;

  const S = { db: null, dbTried: false, SLOTS: ['auto', '1', '2', '3', '4'], busy: false };

  S.openDB = function () {
    if (S.db || S.dbTried) return Promise.resolve(S.db);
    S.dbTried = true;
    return new Promise((resolve) => {
      try {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open('grejs_factory', 1);
        req.onupgradeneeded = () => { req.result.createObjectStore('saves'); };
        req.onsuccess = () => { S.db = req.result; resolve(S.db); };
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
        setTimeout(() => resolve(S.db), 2500);
      } catch (e) { resolve(null); }
    });
  };

  function idb(mode, fn) {
    return S.openDB().then((db) => new Promise((resolve, reject) => {
      if (!db) return reject(new Error('no idb'));
      try {
        const tx = db.transaction('saves', mode);
        const st = tx.objectStore('saves');
        const r = fn(st);
        tx.oncomplete = () => resolve(r && r.result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      } catch (e) { reject(e); }
    }));
  }

  S.putData = function (slot, str) {
    return idb('readwrite', (st) => st.put(str, slot)).then(() => { U.ls.del(LS_PREFIX + slot); return true; })
      .catch(() => {
        if (!U.ls.set(LS_PREFIX + slot, str)) throw new Error('Lagerplads opbrugt – kunne ikke gemme');
        return true;
      });
  };
  S.getData = function (slot) {
    return idb('readonly', (st) => st.get(slot)).then((v) => v || U.ls.get(LS_PREFIX + slot))
      .catch(() => U.ls.get(LS_PREFIX + slot));
  };
  S.delData = function (slot) {
    U.ls.del(LS_PREFIX + slot);
    const meta = S.meta(); delete meta[slot]; U.ls.set(META_KEY, JSON.stringify(meta));
    return idb('readwrite', (st) => st.delete(slot)).catch(() => null);
  };

  S.meta = () => U.parse(U.ls.get(META_KEY), {}) || {};
  S.hasAny = () => Object.keys(S.meta()).length > 0;
  S.latest = function () {
    const m = S.meta();
    let best = null;
    for (const k in m) if (!best || m[k].date > m[best].date) best = k;
    return best;
  };

  /** collect the complete game state */
  S.serialize = function () {
    const G = GF.Game;
    return {
      v: VERSION,
      opts: G.opts,
      time: G.time,
      world: GF.World.save(),
      map: GF.Map.save(),
      enemies: GF.Enemies.save(),
      ents: GF.Ent.serialize(),
      player: GF.player.save(),
      vehicles: G.vehicles.map(GF.Player.saveVehicle),
      craft: GF.Craft.save(),
      research: GF.Research.save(),
      logistics: GF.Logistics.save(),
      progress: GF.Progress.save(),
      ground: G.groundItems.map((g) => [g.id, g.n, +g.x.toFixed(2), +g.y.toFixed(2)]),
      hotbar: GF.UI.hotbar,
      cam: { zoom: GF.Render.cam.tz },
    };
  };

  S.save = function (slot, quiet) {
    if (!GF.Game.running || S.busy) return Promise.resolve(false);
    S.busy = true;
    let data;
    try { data = S.serialize(); } catch (e) { S.busy = false; console.error(e); GF.UI.toast('Fejl under gemning: ' + e.message, 'bad'); return Promise.resolve(false); }
    const str = JSON.stringify(data);
    const G = GF.Game;
    const meta = S.meta();
    meta[slot] = {
      name: G.opts.name || 'Min fabrik', date: Date.now(), playtime: GF.Progress.stats.playtime,
      seed: G.opts.seedStr, size: GF.factorySize(), research: GF.Research.done.size, day: G.day(), kb: Math.round(str.length / 1024),
    };
    return S.putData(slot, str).then(() => {
      U.ls.set(META_KEY, JSON.stringify(meta));
      if (!quiet) GF.UI.toast('Spillet er gemt (' + (slot === 'auto' ? 'autosave' : 'plads ' + slot) + ')', 'good');
      G.dirtySince = G.time;
      return true;
    }).catch((e) => {
      GF.UI.toast('Kunne ikke gemme: ' + e.message, 'bad');
      return false;
    }).finally(() => { S.busy = false; });
  };

  S.load = function (slot) {
    return S.getData(slot).then((str) => {
      if (!str) throw new Error('Savegame findes ikke');
      const data = U.parse(str, null);
      if (!data || !data.v || !data.opts || !data.world) throw new Error('Savegame er korrupt');
      GF.Game.loadData(data);
      GF.UI.toast('Spil indlæst', 'good');
      return true;
    }).catch((e) => {
      console.error(e);
      GF.UI.toast('Kunne ikke indlæse: ' + e.message, 'bad');
      return false;
    });
  };

  S.exportFile = function (slot) {
    S.getData(slot).then((str) => {
      if (!str) return GF.UI.toast('Ingen data i den plads', 'warn');
      const blob = new Blob([str], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const m = S.meta()[slot] || {};
      a.download = 'grejs-factory-' + (m.name || 'save').replace(/[^a-z0-9æøå_-]+/gi, '_') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
  };

  S.importFile = function (file, slot) {
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => {
        const data = U.parse(r.result, null);
        if (!data || !data.v || !data.world) { GF.UI.toast('Filen er ikke et gyldigt Grejs Factory-savegame', 'bad'); return resolve(false); }
        S.putData(slot, r.result).then(() => {
          const meta = S.meta();
          meta[slot] = { name: (data.opts && data.opts.name) || 'Importeret', date: Date.now(), playtime: (data.progress && data.progress.stats && data.progress.stats.playtime) || 0,
            seed: data.opts && data.opts.seedStr, size: (data.ents || []).length, research: ((data.research && data.research.done) || []).length, kb: Math.round(r.result.length / 1024) };
          U.ls.set(META_KEY, JSON.stringify(meta));
          GF.UI.toast('Savegame importeret til plads ' + slot, 'good');
          resolve(true);
        }).catch((e) => { GF.UI.toast('Import fejlede: ' + e.message, 'bad'); resolve(false); });
      };
      r.onerror = () => resolve(false);
      r.readAsText(file);
    });
  };

  GF.Save = S;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — ui.js
 * HTML user interface core: HUD (top bar, player panel, tutorial,
 * minimap, selection info, warnings, hotbar, crafting queue, debug),
 * toasts, tooltips, window manager, prompts and confirm dialogs.
 * Window contents live in windows.js.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const $ = U.$;

  const UI = {
    hotbar: [], win: null, held: null, _hudT: 0, _winT: 0, _mmT: 0, debug: false,
    els: {}, modalOpen: false, lastSig: '',
  };
  GF.WIN = GF.WIN || {};

  UI.defaultHotbar = () => ['burner_drill', 'stone_furnace', 'belt', 'inserter', 'wood_chest', 'small_pole', 'assembler1', 'wall', 'turret_gun', 'repair_pack'];

  UI.typing = function () {
    const a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'));
  };

  /* ------------------------------ init ------------------------------ */
  UI.init = function () {
    const E = UI.els;
    ['game', 'menu', 'hud-top', 'hud-left', 'hud-tutorial', 'hud-select', 'hud-warnings', 'hud-hotbar', 'hud-craftq', 'windows', 'modal', 'toasts', 'tooltip', 'debug', 'held', 'minimap']
      .forEach((id) => { E[id] = document.getElementById(id); });
    // delegated clicks
    const onAct = (ev, button) => {
      const t = ev.target.closest('[data-a]');
      if (!t) return;
      const root = t.closest('[data-win]');
      const a = t.dataset.a;
      ev.preventDefault();
      GF.Audio.play('click', { vol: 0.5 });
      if (root && UI.win && root.dataset.win === UI.win.name) {
        const W = GF.WIN[UI.win.name];
        if (a === 'close') { UI.close(); return; }
        if (W.action) W.action(a, t.dataset, ev, UI.win.arg, button);
        UI.refresh();
      } else if (UI.hudAction) UI.hudAction(a, t.dataset, ev, button);
    };
    document.addEventListener('click', (ev) => { if (ev.target.closest('#windows,#hud,#modal')) onAct(ev, 0); });
    document.addEventListener('contextmenu', (ev) => {
      if (ev.target.closest('#windows,#hud,#modal')) { ev.preventDefault(); onAct(ev, 2); }
    });
    // tooltips
    document.addEventListener('mouseover', (ev) => {
      const t = ev.target.closest('[data-tip],[data-tipt],[data-tech]');
      if (!t) { UI.hideTip(); return; }
      UI.showTip(t);
    });
    document.addEventListener('mousemove', (ev) => {
      UI.mx = ev.clientX; UI.my = ev.clientY;
      const tt = E.tooltip;
      if (tt.style.display === 'block') UI.placeTip();
      if (UI.held) { E.held.style.left = (ev.clientX + 6) + 'px'; E.held.style.top = (ev.clientY + 6) + 'px'; }
    });
    E.minimap.addEventListener('mousedown', (ev) => { ev.preventDefault(); GF.Map.miniClick(ev); });
    // escape & global keys
    window.addEventListener('keydown', (ev) => {
      if (ev.code !== 'Escape' || !GF.Game.running) return;
      if (GF.Input.capture) return;
      ev.preventDefault();
      if (UI.modalOpen) { UI.closeModal(); return; }
      if (GF.Build.hand) { GF.Build.clear(); return; }
      if (UI.win) { UI.close(); return; }
      UI.open('pause');
    });
  };

  UI.showGame = function () {
    UI.els.menu.classList.add('hidden');
    UI.els.game.classList.remove('hidden');
    document.getElementById('bg-canvas').classList.add('hidden');
    UI.close();
    UI.buildHotbar();
    UI.lastSig = '';
  };
  UI.showMenu = function () {
    UI.close(); UI.closeModal();
    UI.els.game.classList.add('hidden');
    UI.els.menu.classList.remove('hidden');
    document.getElementById('bg-canvas').classList.remove('hidden');
    GF.Menu.show('main');
  };

  /* ------------------------------ toasts ------------------------------ */
  UI.toast = function (msg, type, icon) {
    const box = UI.els.toasts;
    if (!box) return;
    // merge duplicates
    const last = box.lastElementChild;
    if (last && last.dataset.msg === msg) { last.dataset.n = (+last.dataset.n || 1) + 1; last.querySelector('.tn').textContent = '×' + last.dataset.n; last.style.animation = 'none'; void last.offsetWidth; last.style.animation = ''; return; }
    const el = U.el('div', 'toast t-' + (type || 'info'), (icon ? GF.Icons.html(icon) : '') + '<span>' + U.esc(msg) + '</span><span class="tn"></span>');
    el.dataset.msg = msg;
    box.appendChild(el);
    while (box.children.length > 6) box.firstChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, type === 'mile' ? 6000 : 3800);
  };

  /* ----------------------------- tooltips ----------------------------- */
  UI.hideTip = function () { UI.els.tooltip.style.display = 'none'; UI.tipFor = null; };
  UI.placeTip = function () {
    const tt = UI.els.tooltip;
    const w = tt.offsetWidth, h = tt.offsetHeight;
    let x = UI.mx + 16, y = UI.my + 16;
    if (x + w > window.innerWidth - 8) x = UI.mx - w - 12;
    if (y + h > window.innerHeight - 8) y = Math.max(8, window.innerHeight - h - 8);
    tt.style.left = x + 'px'; tt.style.top = y + 'px';
  };
  UI.showTip = function (t) {
    let html = '';
    if (t.dataset.tip) html = UI.itemTip(t.dataset.tip, t.dataset.rid);
    else if (t.dataset.tech) html = UI.techTip(t.dataset.tech);
    else html = '<div class="tt-desc">' + t.dataset.tipt + '</div>';
    if (!html) return;
    const tt = UI.els.tooltip;
    if (UI.tipFor !== t) { tt.innerHTML = html; UI.tipFor = t; }
    tt.style.display = 'block';
    UI.placeTip();
  };

  function costHtml(map, mult) {
    return Object.keys(map).map((id) => '<span class="tt-ing">' + GF.Icons.html(id) + ' ' + U.fmt(map[id] * (mult || 1)) + ' ' + U.esc(GF.itemName(id)) + '</span>').join('');
  }
  UI.costHtml = costHtml;

  UI.itemTip = function (id, rid) {
    const it = GF.ITEMS[id], fl = GF.FLUIDS[id];
    if (!it && !fl) return '';
    if (fl) return '<div class="tt-title">' + GF.Icons.html(id) + U.esc(fl.name) + '</div><div class="tt-desc">Væske. Transporteres i rør.</div>';
    let h = '<div class="tt-title">' + GF.Icons.html(id) + U.esc(it.name) + '</div>';
    if (it.desc) h += '<div class="tt-desc">' + U.esc(it.desc) + '</div>';
    const facts = [];
    facts.push('Stakstørrelse: ' + it.stack);
    if (it.fuel) facts.push('Brændværdi: ' + U.fmtJ(it.fuel));
    if (it.ammo) facts.push('Skade: ' + it.ammo.dmg + (it.ammo.splash ? ' (område ' + it.ammo.splash + ')' : '') + ' · ' + it.ammo.rounds + ' skud');
    if (it.weapon) facts.push('Rækkevidde ' + it.weapon.range + ' · ' + it.weapon.rate + ' skud/s');
    const d = GF.DEFS[id];
    if (d) {
      facts.push('Størrelse: ' + d.w + '×' + d.h + ' · HP ' + d.hp);
      if (d.power) facts.push('Energi: ' + U.fmtW(d.power) + (d.energy === 'burner' ? ' (brændsel)' : ''));
      if (d.maxPower) facts.push('Ydelse: ' + U.fmtW(d.maxPower));
      if (d.speed && d.kind === 'crafter') facts.push('Hastighed: ' + d.speed + '×');
      if (d.speed && d.kind === 'drill') facts.push('Minerate: ' + d.speed + '/s');
      if (d.kind === 'belt') facts.push('Kapacitet: ' + (d.speed * 4).toFixed(1) + ' genstande/s');
      if (d.kind === 'turret') facts.push('Rækkevidde: ' + d.range);
    }
    h += '<div class="tt-facts">' + facts.join('<br>') + '</div>';
    const rec = rid ? GF.RECIPES[rid] : (GF.RECIPES[id] && (GF.RECIPES[id].out[id] || GF.RECIPES[id].fout) ? GF.RECIPES[id] : GF.Craft.producers(id)[0]);
    if (rec) {
      h += '<div class="tt-sec">Opskrift (' + rec.time + ' s' + (rec.cat === 'smelt' ? ', ovn' : rec.cat === 'chem' ? ', kemifabrik' : rec.cat === 'refine' ? ', raffinaderi' : '') + ')</div>';
      h += '<div class="tt-ings">' + costHtml(rec.in) + (rec.fin ? costHtml(rec.fin) : '') + '</div>';
      const outs = Object.assign({}, rec.out, rec.fout || {});
      if (Object.values(outs).some((n) => n > 1) || Object.keys(outs).length > 1) h += '<div class="tt-ings">→ ' + costHtml(outs) + '</div>';
      if (!GF.Craft.isUnlocked(rec.id)) {
        const tech = Object.values(GF.TECH).find((t) => t.unlocks.includes(rec.id));
        h += '<div class="tt-lock">🔒 Kræver forskning: ' + (tech ? U.esc(tech.name) : '?') + '</div>';
      }
    }
    const uses = GF.Craft.consumers(id).slice(0, 8);
    if (uses.length) h += '<div class="tt-sec">Bruges til</div><div class="tt-uses">' + uses.map((r) => GF.Icons.html(r.main)).join('') + '</div>';
    return h;
  };

  UI.techTip = function (tid) {
    const t = GF.TECH[tid];
    if (!t) return '';
    let h = '<div class="tt-title">' + U.esc(t.name) + '</div><div class="tt-desc">' + U.esc(t.desc) + '</div>';
    h += '<div class="tt-sec">Pris: ' + t.count + ' enheder × ' + t.time + ' s</div><div class="tt-ings">' + t.packs.map((p) => GF.Icons.html(p, t.count)).join('') + '</div>';
    if (t.pre.length) h += '<div class="tt-sec">Kræver</div><div class="tt-desc">' + t.pre.map((p) => (GF.Research.isDone(p) ? '✔ ' : '✖ ') + U.esc(GF.TECH[p].name)).join('<br>') + '</div>';
    return h;
  };

  /* ------------------------------ windows ------------------------------ */
  UI.isOpen = (name) => !!(UI.win && UI.win.name === name);
  UI.open = function (name, arg) {
    const W = GF.WIN[name];
    if (!W) return;
    UI.close();
    const el = U.el('div', 'win ' + (W.cls || ''));
    el.dataset.win = name;
    UI.els.windows.appendChild(el);
    UI.win = { name, arg, el, sig: null };
    if (W.pauses) GF.Game.paused = true;
    if (W.onOpen) W.onOpen(arg, el);
    UI.refresh(true);
    GF.Audio.play('click');
  };
  UI.close = function () {
    if (!UI.win) return;
    const W = GF.WIN[UI.win.name];
    if (W && W.onClose) W.onClose(UI.win.arg);
    UI.win.el.remove();
    if (W && W.pauses) GF.Game.paused = UI.modalOpen;
    UI.win = null;
    UI.dropHeld();
    UI.hideTip();
  };
  UI.toggle = function (name, arg) { if (UI.isOpen(name) && (arg === undefined || UI.win.arg === arg)) UI.close(); else UI.open(name, arg); };
  UI.openEntity = function (e) {
    if (e.def.enemy) return;
    const p = GF.player;
    if (U.dist(p.x, p.y, e.x + e.w / 2, e.y + e.h / 2) > 16 && GF.Render.cam.follow) { UI.toast('For langt væk til at åbne', 'warn'); return; }
    UI.open('entity', e);
  };
  UI.openVehicle = function (v) { UI.open('vehicle', v); };

  /** re-render window (full when signature changed) */
  UI.refresh = function (force) {
    const w = UI.win;
    if (!w) return;
    const W = GF.WIN[w.name];
    if (w.arg && w.arg.dead) { UI.close(); return; }
    const sig = W.sig ? W.sig(w.arg) : '';
    if (force || sig !== w.sig || !W.sig) {
      w.sig = sig;
      const scroll = Array.from(w.el.querySelectorAll('.scroll')).map((s) => s.scrollTop);
      const body = W.render(w.arg);
      w.el.innerHTML = '<div class="win-head"><h2>' + (typeof W.title === 'function' ? W.title(w.arg) : W.title) + '</h2>' +
        (W.noClose ? '' : '<button class="win-x" data-a="close" title="Luk (Esc)">✕</button>') + '</div><div class="win-body">' + body + '</div>';
      w.el.querySelectorAll('.scroll').forEach((s, i) => { if (scroll[i]) s.scrollTop = scroll[i]; });
      if (W.after) W.after(w.el, w.arg);
      if (UI.tipFor && !document.body.contains(UI.tipFor)) UI.hideTip();
    }
    if (W.tick) W.tick(w.el, w.arg);
  };

  /* --------------------------- held stack (inventory) --------------------------- */
  UI.setHeld = function (h) {
    UI.held = h && h.n > 0 ? h : null;
    const el = UI.els.held;
    if (!UI.held) { el.style.display = 'none'; return; }
    el.innerHTML = GF.Icons.html(UI.held.id, UI.held.n);
    el.style.display = 'block';
    el.style.left = ((UI.mx || 0) + 6) + 'px'; el.style.top = ((UI.my || 0) + 6) + 'px';
  };
  UI.dropHeld = function () {
    if (!UI.held || !GF.player) { UI.setHeld(null); return; }
    const left = GF.player.inv.add(UI.held.id, UI.held.n);
    if (left > 0) GF.Game.dropItem(GF.player.x, GF.player.y, UI.held.id, left);
    UI.setHeld(null);
  };

  /* --------------------------- modal dialogs --------------------------- */
  UI.modal = function (html, handlers, opts) {
    const m = UI.els.modal;
    m.innerHTML = '<div class="modal-box ' + ((opts && opts.cls) || '') + '">' + html + '</div>';
    m.classList.add('open');
    UI.modalOpen = true;
    UI.modalHandlers = handlers || {};
    UI.wasPaused = GF.Game.paused;
    if (GF.Game.running) GF.Game.paused = true;
    const inp = m.querySelector('input,textarea');
    if (inp) setTimeout(() => { inp.focus(); if (inp.select) inp.select(); }, 30);
    m.onclick = (ev) => {
      const t = ev.target.closest('[data-m]');
      if (!t) { if (ev.target === m && !(opts && opts.sticky)) UI.closeModal(); return; }
      const fn = UI.modalHandlers[t.dataset.m];
      GF.Audio.play('click');
      if (fn) { const keep = fn(t.dataset, m); if (keep !== true) UI.closeModal(); }
      else UI.closeModal();
    };
    m.onkeydown = (ev) => {
      if (ev.key === 'Enter' && UI.modalHandlers.ok && ev.target.tagName === 'INPUT') { ev.preventDefault(); const keep = UI.modalHandlers.ok({}, m); if (keep !== true) UI.closeModal(); }
    };
  };
  UI.closeModal = function () {
    const m = UI.els.modal;
    m.classList.remove('open');
    m.innerHTML = '';
    UI.modalOpen = false;
    if (GF.Game.running) GF.Game.paused = UI.win ? !!GF.WIN[UI.win.name].pauses : false;
  };
  UI.confirm = function (text, onYes, opts) {
    opts = opts || {};
    UI.modal('<h3>' + (opts.title || 'Bekræft') + '</h3><p>' + text + '</p><div class="btn-row">' +
      (opts.extra ? '<button class="btn" data-m="extra">' + opts.extra + '</button>' : '') +
      '<button class="btn btn-ghost" data-m="no">' + (opts.no || 'Annullér') + '</button><button class="btn btn-primary" data-m="yes">' + (opts.yes || 'Ja') + '</button></div>',
    { yes: () => { onYes && onYes(); }, extra: () => { opts.onExtra && opts.onExtra(); } });
  };
  UI.prompt = function (title, def, cb) {
    UI.modal('<h3>' + U.esc(title) + '</h3><input class="inp" id="prompt-inp" maxlength="40" value="' + U.esc(def || '') + '"><div class="btn-row"><button class="btn btn-ghost" data-m="no">Annullér</button><button class="btn btn-primary" data-m="ok">OK</button></div>',
      { ok: (ds, m) => { const v = m.querySelector('#prompt-inp').value.trim(); cb(v || def); } });
  };

  /** item picker modal (for filters / requests) */
  UI.pickItem = function (title, cb, filterFn) {
    const ids = Object.keys(GF.ITEMS).filter((id) => !filterFn || filterFn(id));
    const order = GF.GROUPS.map((g) => g[0]);
    ids.sort((a, b) => order.indexOf(GF.ITEMS[a].group) - order.indexOf(GF.ITEMS[b].group));
    UI.modal('<h3>' + U.esc(title) + '</h3><div class="pick-grid">' + ids.map((id) => '<div class="slot" data-m="pick" data-id="' + id + '" data-tip="' + id + '">' + GF.Icons.html(id) + '</div>').join('') +
      '</div><div class="btn-row"><button class="btn btn-ghost" data-m="clear">Intet</button><button class="btn" data-m="no">Luk</button></div>', {
      pick: (ds) => { cb(ds.id); },
      clear: () => { cb(null); },
    }, { cls: 'wide' });
  };

  UI.victory = function () {
    GF.Audio.play('victory');
    UI.modal('<div class="victory"><div class="vic-glow"></div><h2>GREJS-KERNEN ER AKTIVERET!</h2><p>Du har bygget det ultimative megaprojekt. Fabrikken summer af energi fra hele din produktion.</p>' +
      '<div class="vic-stats">Spilletid: ' + U.fmtTime(GF.Progress.stats.playtime) + '<br>Genstande produceret: ' + U.fmt(GF.Progress.stats.itemsProduced) + '<br>Forskning: ' + GF.Research.done.size + ' teknologier</div>' +
      '<p>Spillet fortsætter som sandbox — byg videre så stort du vil!</p><div class="btn-row"><button class="btn btn-primary" data-m="ok">Fortsæt i sandbox</button></div></div>', { ok: () => {} }, { sticky: true });
  };

  /* ------------------------------ HUD ------------------------------ */
  UI.buildHotbar = function () {
    const hb = UI.els['hud-hotbar'];
    let h = '';
    for (let i = 0; i < 10; i++) {
      const key = i === 9 ? 0 : i + 1;
      h += '<div class="hb-slot" data-a="hot" data-i="' + i + '"><em>' + key + '</em><span class="hb-ico"></span><b></b></div>';
    }
    hb.innerHTML = h;
    UI._hbSig = '';
  };
  function updateHotbar() {
    const p = GF.player;
    const hand = GF.Build.hand;
    const sig = UI.hotbar.map((id) => id + ':' + (id ? p.inv.count(id) : 0)).join('|') + (hand ? hand.item : '');
    if (sig === UI._hbSig) return;
    UI._hbSig = sig;
    const slots = UI.els['hud-hotbar'].children;
    UI.hotbar.forEach((id, i) => {
      const s = slots[i];
      if (!s) return;
      const n = id ? p.inv.count(id) : 0;
      s.querySelector('.hb-ico').className = 'hb-ico' + (id ? ' ico i-' + id : '');
      s.querySelector('b').textContent = id ? U.fmt(n) : '';
      s.dataset.tip = id || '';
      if (!id) delete s.dataset.tip;
      s.classList.toggle('empty', !!id && n === 0);
      s.classList.toggle('active', !!(hand && hand.item === id && id));
    });
  }

  UI.hotbarSelect = function (i) {
    const id = UI.hotbar[i];
    if (!id) return;
    const p = GF.player;
    const hand = GF.Build.hand;
    if (hand && hand.item === id) { GF.Build.clear(); return; }
    if (p.inv.count(id) <= 0) {
      const r = GF.Craft.recipeFor(id);
      if (r && GF.Craft.enqueue(r.id, 1, p.inv)) UI.toast('Crafter ' + GF.itemName(id) + '...', 'info');
      else if (!GF.DEFS[id]) { UI.toast('Du har ingen ' + GF.itemName(id), 'warn'); return; }
    }
    GF.Build.select(id);
  };

  UI.hudAction = function (a, ds, ev, button) {
    if (a === 'hot') {
      const i = +ds.i;
      if (button === 2) {
        const hand = GF.Build.hand;
        UI.hotbar[i] = hand && hand.item ? hand.item : null;
        UI._hbSig = '';
        UI.toast(hand && hand.item ? 'Hotbar ' + ((i + 1) % 10) + ': ' + GF.itemName(hand.item) : 'Hotbar-plads ryddet', 'info');
      } else UI.hotbarSelect(i);
    } else if (a === 'cq') GF.Craft.cancel(+ds.i, GF.player.inv);
    else if (a === 'warn') {
      const w = GF.Progress.warnings.find((x) => x.key === ds.k);
      if (!w) return;
      if (w.pos) GF.Map.focus(w.pos.x, w.pos.y);
      else if (w.ents && w.ents.length) {
        UI._warnIdx = ((UI._warnIdx || 0) + 1) % w.ents.length;
        const e = w.ents[UI._warnIdx];
        GF.Map.focus(e.x + e.w / 2, e.y + e.h / 2);
      }
    } else if (a === 'mm-in') GF.Map.miniZoom = Math.max(0.5, GF.Map.miniZoom / 2);
    else if (a === 'mm-out') GF.Map.miniZoom = Math.min(8, GF.Map.miniZoom * 2);
    else if (a === 'mm-map') UI.toggle('map');
    else if (a === 'menu') UI.open(ds.w);
    else if (a === 'tut-skip') { GF.Progress.tut.enabled = false; UI.toast('Tutorial skjult (kan slås til i indstillinger)', 'info'); }
    else if (a === 'follow') GF.Render.cam.follow = true;
  };

  function hudTop() {
    const G = GF.Game, Pw = GF.Power.total;
    const dl = G.daylight();
    const icon = dl > 0.5 ? '☀' : dl > 0 ? '🌅' : '🌙';
    const cur = GF.Research.current;
    let res = '<span class="dim">Ingen</span>';
    if (cur) {
      const t = GF.TECH[cur];
      res = U.esc(t.name) + ' <span class="bar sm"><i style="width:' + Math.round(GF.Research.progress(cur) * 100) + '%"></i></span>';
    }
    const bat = Pw.storeCap > 0 ? ' · 🔋 ' + Math.round((Pw.stored / Pw.storeCap) * 100) + '%' : '';
    const sat = Pw.demand > 0 ? Pw.cons / Pw.demand : 1;
    const pCls = Pw.demand > 0 && sat < 0.95 ? 'bad' : '';
    return '<div class="ht-cell"><b>Dag ' + G.day() + '</b> ' + U.fmtClock(G.dayFrac()) + ' ' + icon + '</div>' +
      '<div class="ht-cell ' + pCls + '" data-a="menu" data-w="power" title="Strøm (P)">⚡ ' + U.fmtW(Pw.prod) + ' / ' + U.fmtW(Pw.demand) + bat + '</div>' +
      '<div class="ht-cell" data-a="menu" data-w="tech" title="Teknologi (T)">🔬 ' + res + '</div>' +
      '<div class="ht-cell" title="Fjendernes udvikling">☣ ' + Math.round(GF.Enemies.evolution * 100) + '%</div>' +
      '<div class="ht-menu"><button data-a="menu" data-w="character" title="Inventar (I)">🎒</button><button data-a="menu" data-w="build" title="Byggemenu (B)">🏗</button><button data-a="menu" data-w="tech" title="Teknologi (T)">🔬</button><button data-a="menu" data-w="stats" title="Statistik (O)">📊</button><button data-a="menu" data-w="blueprints" title="Byggeplaner (K)">📐</button><button data-a="menu" data-w="pause" title="Menu (Esc)">☰</button></div>';
  }

  function hudLeft() {
    const p = GF.player;
    const wid = p.weapon;
    const ammo = wid ? GF.Combat.ammoCount(p.inv, wid) + (p.mag > 0 && !GF.ITEMS[wid].weapon.thrown ? 0 : 0) : 0;
    let h = '<div class="pl-row"><span class="pl-name">Ingeniør</span><span class="bar hp"><i style="width:' + Math.round((p.hp / p.maxHp) * 100) + '%"></i></span><span class="pl-hp">' + Math.ceil(p.hp) + '</span></div>';
    h += '<div class="pl-row">' + (wid ? GF.Icons.html(wid) + '<span>' + U.esc(GF.itemName(wid)) + '</span><span class="pl-ammo">' + (p.reload > 0 ? 'lader…' : (p.mag > 0 ? p.mag + ' | ' : '') + ammo) + '</span>' : '<span class="dim">Intet våben</span>') + '</div>';
    h += '<div class="pl-row dim">📍 ' + Math.floor(p.x) + ', ' + Math.floor(p.y) + (GF.Input.down('run') ? ' · løber' : '') + (p.dead ? ' · <b class="bad">GENOPSTÅR om ' + Math.ceil(p.respawnT) + 's</b>' : '') + '</div>';
    if (p.vehicle) h += '<div class="pl-row">🚙 ' + Math.round(Math.abs(p.vehicle.speed) * 3.6 * 3) + ' km/t · brændsel ' + (p.vehicle.fuel ? p.vehicle.fuel.n + ' ' + GF.itemName(p.vehicle.fuel.id) : '<b class="bad">tom</b>') + '</div>';
    if (!GF.Render.cam.follow) h += '<div class="pl-row"><button class="btn sm" data-a="follow">Kamera → spiller</button></div>';

  }

  function hudTutorial() {
    const T = GF.Progress.tut;
    if (!GF.Settings.get('tutorials') || !T.enabled || T.done) return '';
    const st = GF.Progress.TUTORIAL[T.step];
    if (!st) return '';
    return '<div class="tut-head">MISSION ' + (T.step + 1) + '/10 <button class="tut-x" data-a="tut-skip" title="Skjul tutorial">✕</button></div><div class="tut-title">' + st.title + '</div><div class="tut-hint">' + st.hint + '</div>';
  }

  function hudSelect() {
    const hv = GF.Build.hover;
    const e = hv.ent;
    if (!e || !GF.Input.mouse.inWorld) {
      const hand = GF.Build.hand;
      if (hand && hand.item) return '<div class="sel-title">' + GF.Icons.html(hand.item) + U.esc(GF.itemName(hand.item)) + '</div><div class="sel-row dim">I hånden: ' + GF.player.inv.count(hand.item) + ' · R roterer · højreklik annullerer</div>';
      return '';
    }
    const K = GF.Kinds[e.kind];
    let h = '<div class="sel-title">' + (e.def.enemy ? '☣ ' : GF.Icons.html(e.type)) + U.esc(e.def.name) + '</div>';
    h += '<div class="sel-row"><span class="bar hp sm"><i style="width:' + Math.round((e.hp / e.maxHp) * 100) + '%"></i></span> ' + Math.ceil(e.hp) + '/' + e.maxHp + '</div>';
    const st = K && K.status ? K.status(e) : '';

    }
    if (e.eff != null && (e.kind === 'crafter' || e.kind === 'drill' || e.kind === 'lab')) h += '<div class="sel-row dim">Effektivitet: ' + Math.round(e.eff * 100) + '%</div>';
    if (e.def.energy === 'electric') h += '<div class="sel-row dim">⚡ ' + U.fmtW(e.demand || 0) + (e.net ? ' · net #' + e.net.id : ' · ikke forbundet') + '</div>';
    if (!e.def.enemy) h += '<div class="sel-row dim">Klik: åbn · Højreklik (hold): fjern · R: rotér</div>';
    return h;
  }

  function hudWarnings() {
    return GF.Progress.warnings.slice(0, 6).map((w) => '<div class="warn-item" data-a="warn" data-k="' + w.key + '">' + w.text + (w.count > 1 ? ' <b>×' + w.count + '</b>' : '') + '</div>').join('');
  }

  function hudCraftQueue() {
    const q = GF.Craft.queue;
    if (!q.length) return '';
    return q.slice(0, 12).map((c, i) => {
      const r = GF.RECIPES[c.rid];
      const k = c.started ? c.t / r.time : 0;
      return '<div class="cq" data-a="cq" data-i="' + i + '" data-tip="' + r.main + '" title="Klik for at annullere">' + GF.Icons.html(r.main, c.n) + '<i class="cq-bar" style="height:' + Math.round(k * 100) + '%"></i></div>';
    }).join('');
  }

  function setHTML(el, html) { if (el && el._h !== html) { el.innerHTML = html; el._h = html; } }

  function debugText() {
    const R = GF.Render, p = GF.player;
    let belts = 0, machines = 0;
    for (const e of GF.Ent.list.values()) { if (e.kind === 'belt') belts++; else if (e.kind === 'crafter' || e.kind === 'drill') machines++; }
    const mem = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB' : 'n/a';
    return 'FPS ' + R.fps.toFixed(0) + ' · UPS ' + GF.Game.ups.toFixed(0) + '<br>Entiteter: ' + GF.Ent.count + ' (tegnet ' + R.drawn + ')<br>Bånd: ' + belts + ' · Maskiner: ' + machines +
      '<br>Strømnet: ' + GF.Power.nets.length + ' · Væskenet: ' + GF.Fluids.nets.length + '<br>Chunks: ' + GF.World.chunks.size + ' (cache ' + R.chunkCache.size + ')' +
      '<br>Fjender: ' + GF.Enemies.units.length + ' · Droner: ' + GF.Logistics.bots.length + ' · Partikler: ' + GF.Particles.list.length +
      '<br>Hukommelse: ' + mem + '<br>Position: ' + p.x.toFixed(1) + ', ' + p.y.toFixed(1) + ' · Zoom ' + R.cam.zoom.toFixed(2) + '<br>Seed: ' + GF.Game.opts.seedStr + ' · Tid ' + U.fmtTime(GF.Game.time);
  }

  /* --------------------------- per frame --------------------------- */
  UI.frame = function (dt) {
    const I = GF.Input;
    if (!UI.typing() && !I.capture && !UI.modalOpen) {
      const pausedMenu = UI.win && GF.WIN[UI.win.name].pauses;
      if (!pausedMenu) {
        const map = { inventory: 'character', crafting: 'character', tech: 'tech', map: 'map', build: 'build', power: 'power', stats: 'stats', blueprint: 'blueprints' };
        for (const a in map) if (I.hit(a)) { UI.toggle(map[a], a === 'crafting' ? 'craft' : undefined); break; }
        for (let i = 0; i < 10; i++) {
          if (I.hit('hot' + ((i + 1) % 10))) {
            // assign hovered build-menu item with digit
            if (UI.hoverAssign) { UI.hotbar[i] = UI.hoverAssign; UI._hbSig = ''; UI.toast('Hotbar ' + ((i + 1) % 10) + ': ' + GF.itemName(UI.hoverAssign), 'info'); }
            else UI.hotbarSelect(i);
          }
        }
      }
      if (I.hit('debug') && GF.Settings.get('debugAllowed')) { UI.debug = !UI.debug; UI.els.debug.classList.toggle('hidden', !UI.debug); }
    }
    UI._hudT -= dt;
    if (UI._hudT <= 0) {
      UI._hudT = 0.16;
      setHTML(UI.els['hud-top'], hudTop());
      setHTML(UI.els['hud-left'], hudLeft());
      setHTML(UI.els['hud-tutorial'], hudTutorial());
      UI.els['hud-tutorial'].style.display = UI.els['hud-tutorial']._h ? '' : 'none';
      setHTML(UI.els['hud-select'], hudSelect());
      UI.els['hud-select'].style.display = UI.els['hud-select']._h ? '' : 'none';
      setHTML(UI.els['hud-warnings'], hudWarnings());
      setHTML(UI.els['hud-craftq'], hudCraftQueue());
      updateHotbar();
      if (UI.debug) UI.els.debug.innerHTML = debugText();
    }
    UI._mmT -= dt;
    if (UI._mmT <= 0) { UI._mmT = 0.25; GF.Map.drawMinimap(); }
    UI._winT -= dt;
    if (UI._winT <= 0 && UI.win) { UI._winT = 0.15; UI.refresh(); }
    if (UI.win && GF.WIN[UI.win.name].frame) GF.WIN[UI.win.name].frame(UI.win.el, UI.win.arg, dt);
  };

  GF.UI = UI;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — windows.js
 * Contents of all in-game windows: character (inventory + crafting),
 * machine/entity GUIs, technology tree, power, map, build menu,
 * statistics, blueprints, pause menu, saves and settings.
 * Each window: {title, cls, pauses, sig(arg), render(arg), tick(el,arg),
 *               action(a, dataset, event, arg, button), after(el,arg)}
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const W = GF.WIN;
  const I = () => GF.Icons;
  const UI = () => GF.UI;
  const ico = (id, n) => GF.Icons.html(id, n);
  const esc = U.esc;

  function slot(id, n, a, attrs, cls) {
    return '<div class="slot' + (id ? '' : ' empty') + (cls ? ' ' + cls : '') + '" data-a="' + a + '" ' + (attrs || '') + '>' + (id ? ico(id, n) : '') + '</div>';
  }
  function invGrid(inv, a, cols) {
    let h = '<div class="grid g' + (cols || 10) + '">';
    inv.slots.forEach((s, i) => { h += slot(s && s.id, s && s.n, a, 'data-i="' + i + '"'); });
    return h + '</div>';
  }
  function bar(k, cls) { return '<span class="bar ' + (cls || '') + '"><i style="width:' + Math.round(U.clamp(k, 0, 1) * 100) + '%"></i></span>'; }
  function btn(a, label, extra, cls) { return '<button class="btn ' + (cls || '') + '" data-a="' + a + '" ' + (extra || '') + '>' + label + '</button>'; }

  /* ====================================================================
   * CHARACTER: inventory + hand crafting (+ logistic requests)
   * ==================================================================== */
  const CH = { tab: 'craft', group: 'basic' };
  function craftGroups() {
    return GF.GROUPS.filter(([g]) => Object.values(GF.RECIPES).some((r) => r.hand && r.group === g));
  }
  W.character = {
    title: 'Inventar & crafting',
    cls: 'w-char',
    onOpen(arg) { if (arg === 'craft') CH.tab = 'craft'; },
    sig() {
      const p = GF.player;
      return p.inv.ver + '|' + CH.tab + '|' + CH.group + '|' + GF.Craft.unlocked.size + '|' + GF.Craft.queue.length + '|' + (UI().held ? UI().held.id + UI().held.n : '') + '|' + p.requests.length;
    },
    render() {
      const p = GF.player;
      let h = '<div class="cols">';
      h += '<div class="col"><div class="sec-title">Inventar <span class="dim">(' + (p.inv.size - p.inv.freeSlots()) + '/' + p.inv.size + ')</span> ' + btn('sort', 'Sortér', '', 'sm') + '</div>';
      h += '<div class="scroll inv-scroll">' + invGrid(p.inv, 'inv') + '</div>';
      h += '<div class="hint">Klik: flyt stak · Højreklik: del stak · Shift+klik: vælg til byggeri · Z i verden: smid</div>';
      if (UI().held) h += '<div class="btn-row">' + btn('drophold', 'Smid holdt stak på jorden', '', 'sm') + '</div>';
      h += '</div>';
      const reqOn = GF.Research.isDone('logistic_robots');
      h += '<div class="col craft-col"><div class="tabs">' + '<button class="tab ' + (CH.tab === 'craft' ? 'on' : '') + '" data-a="tab" data-t="craft">Crafting</button>' +
        (reqOn ? '<button class="tab ' + (CH.tab === 'req' ? 'on' : '') + '" data-a="tab" data-t="req">Anmodninger</button>' : '') + '</div>';
      if (CH.tab === 'req' && reqOn) {
        h += '<div class="hint">Logistikdroner leverer disse varer til dig, når du er inden for et logistiknetværk.</div><div class="req-list">';
        p.requests.forEach((r, i) => { h += '<div class="req">' + ico(r.id) + '<span>' + esc(GF.itemName(r.id)) + '</span><input class="inp sm" type="number" min="0" value="' + r.n + '" data-req="' + i + '">' + btn('reqdel', '✕', 'data-i="' + i + '"', 'sm') + '</div>'; });
        h += '</div>' + btn('reqadd', '+ Tilføj anmodning');
      } else {
        const groups = craftGroups();
        if (!groups.find((g) => g[0] === CH.group)) CH.group = groups[0][0];
        h += '<div class="gtabs">' + groups.map(([g, n]) => '<button class="gtab ' + (CH.group === g ? 'on' : '') + '" data-a="grp" data-g="' + g + '">' + n + '</button>').join('') + '</div>';
        h += '<div class="scroll craft-scroll"><div class="grid g8">';
        Object.values(GF.RECIPES).filter((r) => r.hand && r.group === CH.group).forEach((r) => {
          const unlocked = GF.Craft.isUnlocked(r.id);
          const can = unlocked ? GF.Craft.maxCraftable(r.id, p.inv, 99) : 0;
          const direct = unlocked && Object.keys(r.in).every((k) => p.inv.count(k) >= r.in[k]);
          h += '<div class="slot recipe ' + (!unlocked ? 'locked' : can ? (direct ? '' : 'sub') : 'none') + '" data-a="craft" data-r="' + r.id + '" data-tip="' + r.main + '" data-rid="' + r.id + '">' + ico(r.main) + (can ? '<b>' + can + '</b>' : '') + (!unlocked ? '<i class="lock">🔒</i>' : '') + '</div>';
        });
        h += '</div></div><div class="hint">Klik: craft 1 · Højreklik: 5 · Shift+klik: maks. Mellemprodukter crafts automatisk.</div>';
      }
      return h + '</div></div>';
    },
    after(el) {
      el.querySelectorAll('[data-req]').forEach((inp) => {
        inp.addEventListener('change', () => { const r = GF.player.requests[+inp.dataset.req]; if (r) r.n = Math.max(0, +inp.value | 0); });
      });
    },
    action(a, ds, ev, arg, btnN) {
      const p = GF.player, inv = p.inv;
      if (a === 'tab') CH.tab = ds.t;
      else if (a === 'grp') CH.group = ds.g;
      else if (a === 'sort') { UI().dropHeld(); inv.sort(); }
      else if (a === 'drophold') { const h = UI().held; if (h) { GF.Game.dropItem(p.x, p.y, h.id, h.n); UI().setHeld(null); } }
      else if (a === 'craft') {
        const r = GF.RECIPES[ds.r];
        if (!GF.Craft.isUnlocked(r.id)) { UI().toast('Kræver forskning', 'warn'); return; }
        let n = btnN === 2 ? 5 : 1;
        if (ev.shiftKey) n = GF.Craft.maxCraftable(r.id, inv, 200);
        let done = 0;
        while (n > 0 && GF.Craft.enqueue(r.id, 1, inv)) { n--; done++; }
        if (!done) { UI().toast('Mangler materialer til ' + r.name, 'warn'); GF.Audio.play('error'); }
      } else if (a === 'inv') {
        const i = +ds.i, s = inv.slots[i];
        let held = UI().held;
        if (ev.shiftKey && s && !held) {
          if (GF.ITEMS[s.id].place || GF.ITEMS[s.id].vehicle) { GF.Build.select(s.id); UI().close(); }
          else if (GF.ITEMS[s.id].weapon) { p.weapon = s.id; UI().toast('Våben valgt: ' + GF.itemName(s.id), 'info'); }
          return;
        }
        if (!held) {
          if (!s) return;
          const take = btnN === 2 ? Math.ceil(s.n / 2) : s.n;
          UI().setHeld({ id: s.id, n: take });
          s.n -= take; if (s.n <= 0) inv.slots[i] = null;
        } else if (!s) {
          const put = btnN === 2 ? 1 : held.n;
          inv.slots[i] = { id: held.id, n: put };
          held.n -= put; UI().setHeld(held.n > 0 ? held : null);
        } else if (s.id === held.id) {
          const room = GF.stackOf(s.id) - s.n;
          const put = Math.min(room, btnN === 2 ? 1 : held.n);
          s.n += put; held.n -= put; UI().setHeld(held.n > 0 ? held : null);
        } else {
          inv.slots[i] = { id: held.id, n: held.n };
          UI().setHeld({ id: s.id, n: s.n });
        }
        inv.touch();
      } else if (a === 'reqadd') {
        UI().pickItem('Vælg genstand at anmode om', (id) => { if (id) { p.requests.push({ id, n: GF.stackOf(id) }); UI().refresh(true); } });
      } else if (a === 'reqdel') p.requests.splice(+ds.i, 1);
    },
  };

  /* ====================================================================
   * ENTITY window
   * ==================================================================== */
  const give = (id, n) => { if (n > 0) GF.player.giveOrDrop(id, n); };
  function objSlots(o, src, need) {
    const keys = Object.keys(need || o);
    if (!keys.length) return '<span class="dim">—</span>';
    return keys.map((id) => slot(id, o[id] || 0, 'take', 'data-src="' + src + '" data-id="' + id + '"', (o[id] || 0) ? '' : 'ghosted')).join('');
  }
  function fuelSlot(e) {
    return '<div class="lbl">Brændsel</div>' + slot(e.fuel && e.fuel.id, e.fuel && e.fuel.n, 'take', 'data-src="fuel"', 'fuel') +
      '<span class="bar sm fuelbar js-fuel"><i style="width:' + Math.round(U.clamp(e.burn / (e.burnMax || 1), 0, 1) * 100) + '%"></i></span>';
  }
  function powerLine(e) {
    const d = e.def;
    if (d.energy !== 'electric') return '';
    const sat = GF.Power.sat(e);
    return '<div class="row">⚡ Forbrug: <span class="js-pw">' + U.fmtW(e.demand || 0) + '</span> · ' + (e.net ? 'Net #' + e.net.id + ' · forsyning ' + Math.round(sat * 100) + '%' : '<b class="bad">Ikke forbundet til en mast</b>') + '</div>';
  }
  function statusRow(e) {
    const K = GF.Kinds[e.kind];
    return '<div class="row status ' + (e.warn ? 'bad' : '') + '">Status: <b class="js-st">' + esc((K && K.status && K.status(e)) || '—') + '</b></div>';
  }
  function commonButtons(e) {
    let h = '<div class="btn-row">';
    if (['crafter', 'drill', 'lab', 'inserter', 'pump', 'oilpump', 'radar', 'boiler', 'reactor'].includes(e.kind)) h += btn('toggle', e.on ? '⏸ Stop maskine' : '▶ Start maskine', '', 'sm');
    if (e.def.energy === 'electric') h += btn('prio', e.prio ? '★ Høj prioritet' : '☆ Normal prioritet', 'title="Maskiner med høj prioritet får strøm først ved strømmangel"', 'sm');
    h += btn('remove', '🗑 Fjern', '', 'sm btn-danger');
    return h + '</div>';
  }

  const EP = {}; // entity panel renderers by kind

  EP.crafter = {
    sig: (e) => [e.recipe, JSON.stringify(e.inp), JSON.stringify(e.out), e.fuel ? e.fuel.n : 0, e.on, e.prio, e.pick ? 1 : 0, Math.round((e.fin && Object.values(e.fin)[0]) || 0)].join('|'),
    html(e) {
      const d = e.def;
      const r = e.recipe && GF.RECIPES[e.recipe];
      let h = '';
      if (!d.auto && (e.pick || !r)) {
        const list = Object.values(GF.RECIPES).filter((x) => x.cat === d.cat && GF.Craft.isUnlocked(x.id));
        h += '<div class="sec-title">Vælg opskrift</div><div class="grid g8 scroll recipe-pick">' + list.map((x) => '<div class="slot' + (x.id === e.recipe ? ' sel' : '') + '" data-a="setrec" data-r="' + x.id + '" data-tip="' + x.main + '" data-rid="' + x.id + '">' + ico(x.main) + '</div>').join('') + '</div>';
        if (!list.length) h += '<div class="dim">Ingen opskrifter låst op endnu.</div>';
        if (r) h += btn('pickoff', 'Tilbage');
        return h;
      }
      h += '<div class="row">Opskrift: ' + (r ? ico(r.main) + ' <b>' + esc(r.name) + '</b> <span class="dim">(' + r.time + ' s / ' + d.speed + '× = ' + (r.time / d.speed).toFixed(1) + ' s)</span>' : '<span class="dim">Automatisk (efter malm)</span>') + '</div>';
      if (d.energy === 'burner') h += '<div class="row">' + fuelSlot(e) + '</div>';
      h += '<div class="machine-flow"><div><div class="lbl">Input</div><div class="slots">' + (r ? objSlots(e.inp, 'inp', r.in) : objSlots(e.inp, 'inp')) + '</div>';
      if (r && r.fin) h += Object.keys(r.fin).map((f) => '<div class="fluid-row">' + ico(f) + ' ' + bar((e.fin[f] || 0) / (r.fin[f] * 2), 'fluid') + ' ' + Math.round(e.fin[f] || 0) + '/' + r.fin[f] + '</div>').join('');
      h += '</div><div class="arrow-big">➜</div><div><div class="lbl">Output</div><div class="slots">' + (r ? objSlots(e.out, 'out', null) || '' : objSlots(e.out, 'out')) + '</div>';
      if (r && r.fout) h += Object.keys(r.fout).map((f) => '<div class="fluid-row">' + ico(f) + ' ' + bar((e.fout[f] || 0) / (r.fout[f] * 2), 'fluid') + '</div>').join('');
      h += '</div></div>';
      h += '<div class="row">Fremskridt: <span class="bar big js-prog"><i style="width:0%"></i></span> <span class="js-progt"></span></div>';
      h += '<div class="row">Effektivitet: <b class="js-eff">' + Math.round(e.eff * 100) + '%</b> · Produceret: ' + e.made + '</div>';
      h += powerLine(e) + statusRow(e);
      h += '<div class="btn-row">' + (!d.auto ? btn('pickon', '🔄 Skift opskrift', '', 'sm') : '') + '</div>' + commonButtons(e);
      return h;
    },
    tick(el, e) {
      const r = e.recipe && GF.RECIPES[e.recipe];
      const k = r && e.crafting ? e.prog / r.time : 0;
      const pb = el.querySelector('.js-prog i'); if (pb) pb.style.width = Math.round(k * 100) + '%';
      const pt = el.querySelector('.js-progt'); if (pt) pt.textContent = Math.round(k * 100) + '%';
    },
    act(a, ds, ev, e) {
      const K = GF.Kinds.crafter;
      if (a === 'pickon') e.pick = true;
      else if (a === 'pickoff') e.pick = false;
      else if (a === 'setrec') { K.setRecipe(e, ds.r).forEach((it) => give(it.id, it.n)); e.pick = false; }
    },
    take(e, src, id) {
      if (src === 'inp') { give(id, e.inp[id] || 0); delete e.inp[id]; }
      if (src === 'out') { give(id, e.out[id] || 0); delete e.out[id]; }
    },
  };

  EP.drill = {
    sig: (e) => [e.fuel ? e.fuel.n : 0, e.hold, e.on, e.prio].join('|'),
    html(e) {
      const d = e.def;
      let h = '';
      if (d.energy === 'burner') h += '<div class="row">' + fuelSlot(e) + '</div>';
      const tiles = e.tiles || [];
      let left = 0; const kinds = {};
      tiles.forEach(([x, y]) => { const o = GF.World.ore(x, y); if (o) { left += o.amount; kinds[o.type] = 1; } });
      h += '<div class="row">Miner: ' + Object.keys(kinds).map((k) => ico(k) + ' ' + esc(GF.itemName(k))).join(', ') + '</div>';
      h += '<div class="row">Malm tilbage i området: <b>' + U.fmt(left) + '</b> (' + tiles.length + ' felter)</div>';
      h += '<div class="row">Hastighed: ' + d.speed + '/s · Produktivitetsbonus: +' + Math.round(GF.Research.bonus.miningProd * 100) + '%</div>';
      h += '<div class="row">Fremskridt: <span class="bar big js-prog"><i></i></span></div>';
      h += '<div class="row">Effektivitet: <b class="js-eff">' + Math.round(e.eff * 100) + '%</b></div>';
      h += powerLine(e) + statusRow(e) + commonButtons(e);
      return h;
    },
    tick(el, e) { const pb = el.querySelector('.js-prog i'); if (pb) pb.style.width = Math.round(e.prog * 100) + '%'; },
  };

  EP.lab = {
    sig: (e) => JSON.stringify(e.packs) + GF.Research.current + e.on + e.prio,
    html(e) {
      const cur = GF.Research.current;
      let h = '<div class="row">Forskning: ' + (cur ? '<b>' + esc(GF.TECH[cur].name) + '</b> ' + bar(GF.Research.progress(cur), 'js-rp') : '<span class="dim">Ingen — tryk T for at vælge</span> ' + btn('openTech', 'Åbn teknologi', '', 'sm')) + '</div>';
      const packs = ['sci_red', 'sci_green', 'sci_mil', 'sci_blue', 'sci_purple', 'sci_gold'];
      h += '<div class="lbl">Forskningspakker</div><div class="slots">' + packs.map((p) => slot(p, e.packs[p] || 0, 'take', 'data-src="packs" data-id="' + p + '"', e.packs[p] ? '' : 'ghosted')).join('') + '</div>';
      h += '<div class="row">Enhed: <span class="bar big js-prog"><i></i></span></div>';
      h += powerLine(e) + statusRow(e) + commonButtons(e);
      return h;
    },
    tick(el, e) {
      const pb = el.querySelector('.js-prog i'); if (pb) pb.style.width = Math.round(e.prog * 100) + '%';
      const cur = GF.Research.current; const rp = el.querySelector('.js-rp i'); if (rp && cur) rp.style.width = Math.round(GF.Research.progress(cur) * 100) + '%';
    },
    act(a) { if (a === 'openTech') UI().open('tech'); },
    take(e, src, id) { give(id, e.packs[id] || 0); delete e.packs[id]; },
  };

  EP.chest = {
    sig: (e) => e.inv.ver + '|' + e.requests.length,
    html(e) {
      let h = '<div class="sec-title">Indhold</div><div class="scroll chest-scroll">' + invGrid(e.inv, 'cslot', 10) + '</div>';
      h += '<div class="btn-row">' + btn('takeall', 'Tag alt', '', 'sm') + btn('csort', 'Sortér', '', 'sm') + '</div>';
      if (e.def.logi === 'requester') {
        h += '<div class="sec-title">Anmodninger</div><div class="req-list">';
        e.requests.forEach((r, i) => { h += '<div class="req">' + ico(r.id) + '<span>' + esc(GF.itemName(r.id)) + '</span><input class="inp sm" type="number" min="0" value="' + r.n + '" data-creq="' + i + '">' + btn('creqdel', '✕', 'data-i="' + i + '"', 'sm') + '</div>'; });
        h += '</div>' + btn('creqadd', '+ Tilføj anmodning', '', 'sm');
      }
      if (e.def.logi) h += '<div class="row dim">' + (e.lnet ? 'Logistiknetværk #' + e.lnet.id : 'Ikke i et logistiknetværk (byg en robothavn i nærheden)') + '</div>';
      return h + commonButtons(e);
    },
    after(el, e) {
      el.querySelectorAll('[data-creq]').forEach((inp) => inp.addEventListener('change', () => { const r = e.requests[+inp.dataset.creq]; if (r) r.n = Math.max(0, +inp.value | 0); }));
    },
    act(a, ds, ev, e, b) {
      const inv = GF.player.inv;
      if (a === 'cslot') {
        const s = e.inv.slots[+ds.i]; if (!s) return;
        if (ev.shiftKey) e.inv.transferAll(s.id, inv);
        else e.inv.transferSlot(+ds.i, inv, b === 2 ? Math.ceil(s.n / 2) : s.n);
      } else if (a === 'takeall') e.inv.slots.forEach((s, i) => { if (s) e.inv.transferSlot(i, inv); });
      else if (a === 'csort') e.inv.sort();
      else if (a === 'creqadd') UI().pickItem('Anmod om genstand', (id) => { if (id) { e.requests.push({ id, n: GF.stackOf(id) }); UI().refresh(true); } });
      else if (a === 'creqdel') e.requests.splice(+ds.i, 1);
    },
    insertAll: true,
  };

  EP.inserter = {
    sig: (e) => [e.filter, e.limit, e.on, e.prio, e.hand].join('|'),
    html(e) {
      const d = e.def;
      let h = '<div class="row">Hastighed: ' + d.speed + ' greb/s · Rækkevidde: ' + d.reach + ' · Stak: ' + (d.stack + GF.Research.bonus.stack) + '</div>';

  const TT = { sel: null, layout: null };
  function techLayout() {
    if (TT.layout) return TT.layout;
    const depth = GF.techLayout();
    const NW = 168, NH = 74, GX = 12, GY = 34;
    const pos = {};
    let x = 20;
    const lanes = [];
    GF.BRANCHES.forEach(([b, name, col]) => {
      const byD = {};
      Object.values(GF.TECH).filter((t) => t.branch === b).forEach((t) => { (byD[depth[t.id]] = byD[depth[t.id]] || []).push(t.id); });
      const width = Math.max(1, ...Object.values(byD).map((a) => a.length));
      Object.keys(byD).forEach((d) => byD[d].forEach((id, i) => { pos[id] = { x: x + i * (NW + GX), y: 48 + (+d) * (NH + GY) }; }));
      lanes.push({ b, name, col, x, w: width * (NW + GX) - GX });
      x += width * (NW + GX) + 36;
    });
    const maxD = Math.max(...Object.values(depth));
    TT.layout = { pos, lanes, W: x, H: 48 + (maxD + 1) * (NH + GY) + 20, NW, NH };
    return TT.layout;
  }

      c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(0, 0, Wd, Hd);
      const hist = GF.Power.history;
      const max = Math.max(1000, ...hist.map((x) => Math.max(x.prod, x.dem))) * 1.15;

        if (!MP.drag) return;

    return '<div class="set-row"><span>' + label + '</span><input type="range" min="0" max="100" value="' + Math.round(v * 100) + '" data-slider="' + key + '"><b>' + Math.round(v * 100) + '%</b></div>';
  }
  const onoff = [['true', 'Til'], ['false', 'Fra']];
  SUI.html = function (tab) {
    SUI.tab = tab || SUI.tab;
    let h = '<div class="tabs">' + [['gfx', 'Grafik'], ['audio', 'Lyd'], ['play', 'Gameplay'], ['keys', 'Taster']].map(([k, n]) => '<button class="tab ' + (SUI.tab === k ? 'on' : '') + '" data-a="settab" data-t="' + k + '">' + n + '</button>').join('') + '</div><div class="set-body scroll">';
    if (SUI.tab === 'gfx') {
      h += opt('quality', 'Kvalitet', [['low', 'Lav'], ['medium', 'Mellem'], ['high', 'Høj']]);
      h += opt('particles', 'Partikeleffekter', onoff) + opt('shadows', 'Skygger', onoff) + opt('lighting', 'Lys-effekter (nat)', onoff);
      h += opt('maxZoomOut', 'Maks. udzoom', [['0.5', 'Tæt'], ['0.35', 'Normal'], ['0.25', 'Langt']]);
      h += opt('screenShake', 'Skærmrystelse', onoff);
    } else if (SUI.tab === 'audio') {
      h += slider('master', 'Samlet lydstyrke') + slider('music', 'Musik') + slider('sfx', 'Lydeffekter');
    } else if (SUI.tab === 'play') {
      h += opt('autosave', 'Autosave', [['0', 'Fra'], ['30', '30 s'], ['60', '1 min'], ['300', '5 min']]);
      h += opt('tutorials', 'Vis tutorial', onoff);
      h += opt('enemyFrequency', 'Fjendeangreb (hyppighed)', [['0.5', 'Sjældne'], ['1', 'Normal'], ['2', 'Hyppige']]);
      h += opt('debugAllowed', 'Tillad debug-visning (F3)', onoff);
    } else {
      const B = GF.Settings.get('binds'), L = GF.Settings.BIND_LABELS;
      h += '<div class="hint">Klik på en tast og tryk den nye tast. Esc er altid pause. Mus: venstre = interagér/byg/mine, højre = annullér/fjern, hjul = zoom.</div><div class="keys">';
      Object.keys(L).forEach((k) => { h += '<div class="key-row"><span>' + L[k] + '</span><button class="keybtn" data-a="rebind" data-k="' + k + '">' + GF.Settings.keyName(B[k]) + '</button></div>'; });
      h += '</div>' + btn('resetbinds', 'Nulstil taster', '', 'sm');
    }
    return h + '</div>';
  };
  SUI.after = function (el, refresh) {
    el.querySelectorAll('[data-slider]').forEach((s) => s.addEventListener('input', () => {
      GF.Settings.set(s.dataset.slider, +s.value / 100);
      s.nextElementSibling.textContent = s.value + '%';
    }));
  };
  SUI.action = function (a, ds, refresh) {
    if (a === 'settab') SUI.tab = ds.t;
    else if (a === 'set') {
      let v = ds.v;
      if (v === 'true') v = true; else if (v === 'false') v = false; else if (!isNaN(+v) && ds.k !== 'quality') v = +v;
      GF.Settings.set(ds.k, v);
      if (ds.k === 'maxZoomOut' && GF.Render) GF.Render.cam.tz = Math.max(GF.Render.cam.tz, v);
    } else if (a === 'rebind') {
      const b = document.querySelector('[data-a="rebind"][data-k="' + ds.k + '"]');
      if (b) b.textContent = 'Tryk en tast…';
      GF.Input.capture = (code) => {
        if (code !== 'Escape') {
          const binds = GF.Settings.get('binds');
          for (const k in binds) if (binds[k] === code && k !== ds.k) binds[k] = null;
          binds[ds.k] = code; GF.Settings.save();
        }
        refresh();
      };
    } else if (a === 'resetbinds') GF.Settings.resetBinds();
    refresh();
  };
  GF.SettingsUI = SUI;

  W.settings = {
    title: '⚙ Indstillinger', cls: 'w-settings', pauses: true,
    onOpen(tab) { SUI.tab = tab || 'gfx'; },
    render() { return SUI.html() + '<div class="btn-row">' + btn('back', 'Tilbage', '', 'sm') + '</div>'; },
    after(el) { SUI.after(el); },
    action(a, ds) { if (a === 'back') { UI().open('pause'); return; } SUI.action(a, ds, () => UI().refresh(true)); },
  };
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — menu.js
 * Main menu (new game / continue / load / settings / controls /
 * credits), world-generation setup with map preview, and the animated
 * industrial background scene.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const esc = U.esc;

  const M = { screen: 'main', bg: null, t: 0, smoke: [], drones: [], ng: null };

  const LOGO = '<div class="logo"><svg class="logo-gear" viewBox="0 0 100 100"><path d="M50 8l7 0 3 12 9 4 11-7 5 5-7 11 4 9 12 3 0 7-12 3-4 9 7 11-5 5-11-7-9 4-3 12-7 0-3-12-9-4-11 7-5-5 7-11-4-9-12-3 0-7 12-3 4-9-7-11 5-5 11 7 9-4z"/><circle cx="53.5" cy="50" r="15"/></svg>' +
    '<div class="logo-text"><span class="l1">GREJS</span><span class="l2">FACTORY</span></div></div>';

  const OPTS = {
    size: [['512', 'Lille'], ['1024', 'Mellem'], ['2048', 'Stor'], ['0', 'Uendelig']],
    resAmount: [['0.5', 'Lav'], ['1', 'Normal'], ['2', 'Høj']],
    resDensity: [['0.6', 'Lav'], ['1', 'Normal'], ['1.6', 'Høj']],
    enemyActivity: [['0', 'Fredelig'], ['0.5', 'Lav'], ['1', 'Normal'], ['2', 'Høj']],
    enemyStrength: [['0.7', 'Svag'], ['1', 'Normal'], ['1.5', 'Stærk']],
    start: [['none', 'Ingen'], ['normal', 'Normal'], ['rich', 'Rig']],
    dayNight: [['true', 'Til'], ['false', 'Fra']],
    dayLen: [['300', '5 min'], ['600', '10 min'], ['1200', '20 min']],
    difficulty: [['easy', 'Let'], ['normal', 'Normal'], ['hard', 'Svær']],
    tutorial: [['true', 'Til'], ['false', 'Fra']],
