  const LABELS = {
    size: 'Kortstørrelse', resAmount: 'Ressourcemængde', resDensity: 'Ressourcedensitet', enemyActivity: 'Fjendens aktivitet',
    enemyStrength: 'Fjendens styrke', start: 'Startressourcer', dayNight: 'Dag/nat', dayLen: 'Døgnlængde', difficulty: 'Sværhedsgrad', tutorial: 'Tutorial',
  };

  function randomSeed() {
    const w = ['GREJS', 'STAAL', 'KOBBER', 'DAMP', 'GNIST', 'TANDHJUL', 'OVN', 'KRYBER', 'LUMEN', 'FABRIK'];
    return w[Math.floor(Math.random() * w.length)] + Math.floor(1000 + Math.random() * 9000);
  }

  M.show = function (screen) {
    M.screen = screen || 'main';
    const root = document.getElementById('menu');
    let h = '';
    if (M.screen === 'main') {
      const has = GF.Save.hasAny();
      const latest = GF.Save.latest();
      const lm = latest ? GF.Save.meta()[latest] : null;
      h = LOGO + '<div class="menu-sub">Mine · Byg · Automatisér · Forsk · Forsvar</div><div class="menu-col">' +
        '<button class="btn big btn-primary" data-mm="new">Nyt spil</button>' +
        '<button class="btn big" data-mm="continue" ' + (has ? '' : 'disabled') + '>Fortsæt' + (lm ? '<small>' + esc(lm.name) + ' · ' + U.fmtTime(lm.playtime) + '</small>' : '') + '</button>' +
        '<button class="btn big" data-mm="load">Load game</button>' +
        '<button class="btn big" data-mm="settings">Indstillinger</button>' +
        '<button class="btn big" data-mm="controls">Controls</button>' +
        '<button class="btn big" data-mm="credits">Credits</button>' +
        '<a class="btn big alley-back" href="GREJSALLEY.html">← Grejs Alley</a></div>' +
        '<div class="menu-foot">Grejs Factory v1.0 · Et originalt browser-fabriksspil · Kører 100% i din browser</div>';
    } else if (M.screen === 'new') {
      const ng = M.ng || (M.ng = { name: 'Min fabrik', seedStr: 'GREJS2026', size: '1024', resAmount: '1', resDensity: '1', enemyActivity: '1', enemyStrength: '1', start: 'normal', dayNight: 'true', dayLen: '600', difficulty: 'normal', tutorial: 'true' });
      h = '<div class="panel ng-panel"><h2>Ny verden</h2><div class="ng-cols"><div class="ng-form">' +
        '<div class="set-row"><span>Verdensnavn</span><input class="inp" id="ng-name" maxlength="30" value="' + esc(ng.name) + '"></div>' +
        '<div class="set-row"><span>World seed</span><input class="inp" id="ng-seed" maxlength="30" value="' + esc(ng.seedStr) + '"><button class="btn sm" data-mm="rseed" title="Tilfældig seed">🎲</button></div>';
      Object.keys(OPTS).forEach((k) => {
        h += '<div class="set-row"><span>' + LABELS[k] + '</span><div class="seg">' + OPTS[k].map(([v, n]) => '<button class="' + (ng[k] === v ? 'on' : '') + '" data-mm="opt" data-k="' + k + '" data-v="' + v + '">' + n + '</button>').join('') + '</div></div>';
      });
      h += '</div><div class="ng-prev"><canvas id="ng-preview" width="240" height="240"></canvas><button class="btn sm" data-mm="preview">Forhåndsvis kort</button><div class="hint">Samme seed giver altid det samme kort.</div></div></div>' +
        '<div class="btn-row"><button class="btn" data-mm="main">Tilbage</button><button class="btn btn-primary big" data-mm="start">Generér verden ▶</button></div></div>';
    } else if (M.screen === 'load') {
      const meta = GF.Save.meta();
      h = '<div class="panel"><h2>Load game</h2><div class="save-list">';
      GF.Save.SLOTS.forEach((s) => {
        const m = meta[s];
        h += '<div class="save-row"><div class="save-slot">' + (s === 'auto' ? 'AUTO' : 'SAVE ' + s) + '</div>' + GF.slotMetaHtml(s, m) + '<div class="btn-col">' +
          (m ? '<button class="btn btn-primary sm" data-mm="doload" data-s="' + s + '">Indlæs</button><button class="btn sm" data-mm="exp" data-s="' + s + '">Eksportér</button><button class="btn sm btn-danger" data-mm="del" data-s="' + s + '">Slet</button>' : '') + '</div></div>';
      });
      h += '</div><div class="btn-row"><label class="btn">Importér fil…<input type="file" accept=".json,application/json" class="hidden-file" id="mm-imp"></label><button class="btn" data-mm="main">Tilbage</button></div></div>';
    } else if (M.screen === 'settings') {
      h = '<div class="panel set-panel"><h2>Indstillinger</h2><div id="mm-settings">' + GF.SettingsUI.html() + '</div><div class="btn-row"><button class="btn" data-mm="main">Tilbage</button></div></div>';
    } else if (M.screen === 'controls') {
      const B = GF.Settings.get('binds'), k = (a) => '<kbd>' + GF.Settings.keyName(B[a]) + '</kbd>';
      const rows = [
        [k('up') + k('left') + k('down') + k('right') + ' / piletaster', 'Bevæg dig'], [k('run'), 'Løb'],
        ['<kbd>Venstre klik</kbd>', 'Interagér · byg · mine (hold) · angrib fjender'], ['<kbd>Højre klik</kbd>', 'Annullér · fjern bygning (hold)'],
        [k('interact'), 'Åbn maskine · mine · stig ind i køretøj'], [k('pickup'), 'Saml genstande op'], [k('inventory') + ' / ' + k('crafting'), 'Inventar / crafting'],
        [k('build'), 'Byggemenu'], [k('rotate'), 'Rotér bygning (Shift = modsat)'], [k('pipette'), 'Pipette: vælg bygning under musen'],
        [k('tech'), 'Teknologi'], [k('power'), 'Strømnet'], [k('map'), 'Kort'], [k('stats'), 'Statistik & milepæle'],
        [k('blueprint'), 'Byggeplaner'], [k('decon'), 'Nedrivningsværktøj'], [k('drop'), 'Smid/indsæt genstand fra hånden'],
        [k('shoot'), 'Skyd mod musen'], [k('weapon'), 'Skift våben'], ['<kbd>1</kbd>–<kbd>0</kbd>', 'Hotbar'], ['<kbd>Musehjul</kbd>', 'Zoom'],
        ['<kbd>Shift</kbd> + klik', 'Placér spøgelse / hurtig overførsel'], ['<kbd>Esc</kbd>', 'Pause / luk vindue'], [k('debug'), 'Debug-visning'],
      ];
      h = '<div class="panel"><h2>Controls</h2><table class="tbl ctl">' + rows.map(([a, b]) => '<tr><td>' + a + '</td><td>' + b + '</td></tr>').join('') + '</table><div class="hint">Alle taster kan ændres under Indstillinger → Taster.</div><div class="btn-row"><button class="btn" data-mm="main">Tilbage</button><button class="btn btn-primary" data-mm="rebind">Skift taster</button></div></div>';
    } else if (M.screen === 'credits') {
      h = '<div class="panel credits"><h2>Credits</h2>' + LOGO +
        '<p><b>Grejs Factory</b> er et originalt fabriks- og automatiseringsspil til browseren.</p>' +
        '<p>Al grafik, alle ikoner, alle lyde og al musik genereres proceduremæssigt med HTML5 Canvas og Web Audio API — der bruges ingen eksterne assets.</p>' +
        '<p>Design & kode: Grejs Factory-holdet<br>Motor: Ren JavaScript · HTML5 Canvas · Web Audio · IndexedDB</p>' +
        '<p class="dim">Tak fordi du bygger! Fabrikken skal vokse.</p><div class="btn-row"><button class="btn" data-mm="main">Tilbage</button></div></div>';
    }
    root.innerHTML = '<div class="menu-inner">' + h + '</div>';
    M.bind(root);
  };

  M.bind = function (root) {
    root.onclick = (ev) => {
      const b = ev.target.closest('[data-mm]');
      if (!b || b.disabled) return;
      GF.Audio.unlock();
      GF.Audio.play('click');
      M.act(b.dataset.mm, b.dataset);
    };
    const set = root.querySelector('#mm-settings');
    if (set) {
      set.onclick = (ev) => {
        const t = ev.target.closest('[data-a]');
        if (!t) return;
        ev.stopPropagation();
        GF.Audio.play('click');
        GF.SettingsUI.action(t.dataset.a, t.dataset, () => { set.innerHTML = GF.SettingsUI.html(); GF.SettingsUI.after(set); });
      };
      GF.SettingsUI.after(set);
    }
    const imp = root.querySelector('#mm-imp');
    if (imp) imp.addEventListener('change', () => {
      if (!imp.files[0]) return;
      const meta = GF.Save.meta();
      const free = ['1', '2', '3', '4'].find((s) => !meta[s]) || '4';
      GF.Save.importFile(imp.files[0], free).then(() => M.show('load'));
    });
    const nameI = root.querySelector('#ng-name'), seedI = root.querySelector('#ng-seed');
    if (nameI) nameI.addEventListener('input', () => { M.ng.name = nameI.value; });
    if (seedI) seedI.addEventListener('input', () => { M.ng.seedStr = seedI.value; });
  };

  M.act = function (a, ds) {
    switch (a) {
      case 'new': M.show('new'); break;
      case 'main': M.show('main'); break;
      case 'continue': { const s = GF.Save.latest(); if (s) M.loading('Indlæser…', () => GF.Save.load(s)); break; }
      case 'load': M.show('load'); break;
      case 'settings': GF.SettingsUI.tab = 'gfx'; M.show('settings'); break;
      case 'rebind': GF.SettingsUI.tab = 'keys'; M.show('settings'); break;
      case 'controls': M.show('controls'); break;
      case 'credits': M.show('credits'); break;
      case 'rseed': M.ng.seedStr = randomSeed(); M.show('new'); M.preview(); break;
      case 'opt': M.ng[ds.k] = ds.v; M.show('new'); if (M._prev && ['size', 'resAmount', 'resDensity'].includes(ds.k)) M.preview(); break;
      case 'preview': M.preview(); break;
      case 'start': {
        const ng = M.ng;
        const opts = {
          name: (ng.name || 'Min fabrik').trim() || 'Min fabrik', seedStr: (ng.seedStr || '').trim() || randomSeed(),
          size: +ng.size, resAmount: +ng.resAmount, resDensity: +ng.resDensity, enemyActivity: +ng.enemyActivity, enemyStrength: +ng.enemyStrength,
          start: ng.start, dayNight: ng.dayNight === 'true', dayLen: +ng.dayLen, difficulty: ng.difficulty, tutorial: ng.tutorial === 'true',
        };
        M.loading('Genererer verden "' + esc(opts.name) + '"…', () => GF.Game.newGame(opts));
        break;
      }
      case 'doload': M.loading('Indlæser…', () => GF.Save.load(ds.s)); break;
      case 'exp': GF.Save.exportFile(ds.s); break;
      case 'del': GF.UI.confirm('Slet savegame i plads ' + ds.s + '?', () => GF.Save.delData(ds.s).then(() => M.show('load')), { yes: 'Slet' }); break;
      default: break;
    }
  };

  M.loading = function (text, fn) {
    const root = document.getElementById('menu');
    root.innerHTML = '<div class="menu-inner">' + LOGO + '<div class="loading"><div class="spinner"></div>' + text + '</div></div>';
    setTimeout(() => {
      Promise.resolve().then(fn).then((ok) => { if (ok === false) M.show('main'); }).catch((e) => { console.error(e); GF.UI.toast('Fejl: ' + e.message, 'bad'); M.show('main'); });
    }, 60);
  };

  /** render a small preview of the world for the current seed */
  M.preview = function () {
    const cv = document.getElementById('ng-preview');
    if (!cv || GF.Game.running) return;
    M._prev = true;
    const ng = M.ng;
    const c = cv.getContext('2d');
    GF.Game.opts = { enemyActivity: +ng.enemyActivity };
    GF.World.reset({ seed: U.hashString((ng.seedStr || '').trim() || 'x'), size: +ng.size, resAmount: +ng.resAmount, resDensity: +ng.resDensity });
    const R = 120, step = 2;
    const img = c.createImageData(cv.width, cv.height);
    const T = GF.World.TERRAIN, OC = GF.World.ORE_COLORS;
    const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    for (let py = 0; py < cv.height; py++) for (let px = 0; px < cv.width; px++) {
      const x = (px - cv.width / 2) * step, y = (py - cv.height / 2) * step;
      const t = GF.World.terrain(x, y), o = GF.World.oreIndex(x, y);
      const col = hex(o ? OC[o] : T[t].color);
      const i = (py * cv.width + px) * 4;
      img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = 255;
    }
    c.putImageData(img, 0, 0);
    c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(cv.width / 2, cv.height / 2, 5, 0, 6.28); c.stroke();
    GF.Enemies.reset();
    GF.World.chunks = new Map();
    void R;
  };

  /* ------------------------ animated background ------------------------ */
  M.initBg = function () {
    M.bg = document.getElementById('bg-canvas');
    const rs = () => { M.bg.width = window.innerWidth; M.bg.height = window.innerHeight; };
    rs(); window.addEventListener('resize', rs);
    for (let i = 0; i < 5; i++) M.drones.push({ x: Math.random(), y: 0.15 + Math.random() * 0.3, v: 0.02 + Math.random() * 0.03, ph: Math.random() * 6 });
  };

  function building(c, x, y, w, h, col) {
    c.fillStyle = col; c.fillRect(x, y - h, w, h);
  }

  M.frame = function (dt) {
    if (!M.bg || M.bg.classList.contains('hidden')) return;
    M.t += dt;
    const c = M.bg.getContext('2d');
    const W = M.bg.width, H = M.bg.height, t = M.t;
    // sky
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070b16'); g.addColorStop(0.55, '#16223a'); g.addColorStop(0.78, '#5a3a2a'); g.addColorStop(1, '#1a1210');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // glow
    const gl = c.createRadialGradient(W * 0.7, H * 0.8, 10, W * 0.7, H * 0.8, W * 0.6);
    gl.addColorStop(0, 'rgba(255,140,50,.35)'); gl.addColorStop(1, 'rgba(255,140,50,0)');
    c.fillStyle = gl; c.fillRect(0, 0, W, H);
    // stars
    c.fillStyle = 'rgba(255,255,255,.5)';
    for (let i = 0; i < 60; i++) { const sx = (U.hash2(i, 1, 7) * W), sy = U.hash2(i, 2, 7) * H * 0.45; if ((Math.sin(t * 2 + i) + 1) > 0.4) c.fillRect(sx, sy, 1.5, 1.5); }
    // far skyline (parallax)
    const base = H * 0.78;
    const off1 = (t * 6) % 200;
    for (let i = -1; i < W / 90 + 2; i++) {
      const x = i * 90 - off1 * 0.3;
      const h = 60 + U.hash2(i, 3, 3) * 120;
      building(c, x, base, 70, h, '#1a1f2c');
      if (U.hash2(i, 4, 3) > 0.5) { building(c, x + 20, base - h, 14, 50, '#1a1f2c'); }
    }
    // near factories
    const off2 = (t * 14) % 260;
    for (let i = -1; i < W / 130 + 2; i++) {
      const x = i * 130 - off2 * 0.5;
      const h = 90 + U.hash2(i, 5, 9) * 110;
      building(c, x, base + 30, 110, h, '#11141c');
      const ch = 60 + U.hash2(i, 6, 9) * 70;
      building(c, x + 70, base + 30 - h, 16, ch, '#11141c');
      // windows
      c.fillStyle = 'rgba(255,190,90,.55)';
      for (let k = 0; k < 6; k++) if (U.hash2(i, k, 11) > 0.4) c.fillRect(x + 10 + (k % 3) * 30, base + 30 - h + 20 + Math.floor(k / 3) * 30, 14, 8);
      // blinking light
      if (Math.sin(t * 3 + i) > 0.2) { c.fillStyle = '#ff3a3a'; c.beginPath(); c.arc(x + 78, base + 30 - h - ch, 3, 0, 6.28); c.fill(); }
      // smoke
      if (Math.random() < dt * 2.5) M.smoke.push({ x: x + 78 + off2 * 0.5, y: base + 30 - h - ch, vx: 8 + Math.random() * 6, vy: -18 - Math.random() * 10, r: 6, life: 0, off: off2 * 0.5 });
    }
    // smoke puffs
    c.fillStyle = 'rgba(160,160,170,.12)';
    M.smoke = M.smoke.filter((s) => s.life < 7);
    for (const s of M.smoke) {
      s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.r += dt * 6;
      c.globalAlpha = Math.max(0, 1 - s.life / 7);
      c.beginPath(); c.arc(s.x - ((t * 14) % 260) * 0.5 + s.off - s.off, s.y, s.r, 0, 6.28); c.fill();
    }
    c.globalAlpha = 1;
    // power line
    c.strokeStyle = 'rgba(0,0,0,.8)'; c.lineWidth = 2;
    const poleGap = 220, pOff = (t * 30) % poleGap;
    for (let i = -1; i < W / poleGap + 2; i++) {
      const x = i * poleGap - pOff;
      c.fillStyle = '#0a0c10'; c.fillRect(x - 3, base - 10, 6, 110); c.fillRect(x - 18, base - 8, 36, 4);
      c.beginPath(); c.moveTo(x - 16, base - 6); c.quadraticCurveTo(x + poleGap / 2, base + 30, x + poleGap - 16, base - 6); c.stroke();
      c.beginPath(); c.moveTo(x + 16, base - 6); c.quadraticCurveTo(x + poleGap / 2 + 32, base + 30, x + poleGap + 16, base - 6); c.stroke();
    }
    // ground
    c.fillStyle = '#0c0d10'; c.fillRect(0, base + 95, W, H);
    // conveyor belt with items
    const by = H - 70;
    c.fillStyle = '#2b2e33'; c.fillRect(0, by, W, 34);
    c.fillStyle = '#d8a82a'; c.fillRect(0, by, W, 4); c.fillRect(0, by + 30, W, 4);
    c.strokeStyle = '#4a4e55'; c.lineWidth = 3;
    const bo = (t * 60) % 30;
    for (let x = -30 + bo; x < W; x += 30) { c.beginPath(); c.moveTo(x, by + 8); c.lineTo(x + 8, by + 17); c.lineTo(x, by + 26); c.stroke(); }
    const items = ['iron_plate', 'copper_plate', 'gear', 'circuit', 'sci_red', 'steel', 'coal', 'iron_ore', 'sci_green', 'plastic'];
    const io = (t * 60) % 60;
    for (let i = -1; i < W / 60 + 1; i++) {
      const id = items[((i % items.length) + items.length + Math.floor(t)) % items.length];
      const cv = GF.Icons.cv[items[(i + 1000) % items.length]] || GF.Icons.cv[id];
      if (cv) c.drawImage(cv, i * 60 + io, by + 3, 28, 28);
    }
    // drones
    for (const d of M.drones) {
      d.x += d.v * dt; if (d.x > 1.1) d.x = -0.1;
      const X = d.x * W, Y = d.y * H + Math.sin(t * 2 + d.ph) * 8;
      c.fillStyle = '#3fb0ff'; c.beginPath(); c.arc(X, Y, 5, 0, 6.28); c.fill();
      c.fillStyle = 'rgba(63,176,255,.25)'; c.beginPath(); c.arc(X, Y, 14, 0, 6.28); c.fill();
      c.fillStyle = '#ff6'; c.fillRect(X - 1, Y + 6, 2, 2);
    }
    // gears at the corners
    c.save(); c.translate(W - 60, H - 160); c.rotate(t * 0.4); c.fillStyle = 'rgba(255,255,255,.05)'; GF.Icons.gearPath(c, 0, 0, 110, 86, 14); c.fill(); c.restore();
    c.save(); c.translate(60, 120); c.rotate(-t * 0.3); c.fillStyle = 'rgba(255,200,80,.04)'; GF.Icons.gearPath(c, 0, 0, 80, 62, 11); c.fill(); c.restore();
    // vignette
    const v = c.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
    c.fillStyle = v; c.fillRect(0, 0, W, H);
  };

  GF.Menu = M;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — game.js
 * Game state & main loop: new game, load, fixed-step simulation,
 * day/night cycle, dropped items and difficulty settings.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const STEP = 1 / 60;

  const G = {
    running: false, paused: false, time: 0, opts: {}, vehicles: [], groundItems: [],
    dayLen: 600, _acc: 0, _last: 0, _autoT: 0, raf: 0, ups: 60, _uT: 0, _uN: 0,
  };

  /* ------------------------- difficulty & time ------------------------- */
  const DIFF = {
    easy: { dmgTaken: 0.6, enemyDmg: 0.7, evo: 0.6, aggro: 0.6 },
    normal: { dmgTaken: 1, enemyDmg: 1, evo: 1, aggro: 1 },
    hard: { dmgTaken: 1.4, enemyDmg: 1.3, evo: 1.6, aggro: 1.5 },
  };
  G.diff = () => DIFF[G.opts.difficulty] || DIFF.normal;

  G.dayFrac = () => ((G.time + G.dayLen * 0.32) % G.dayLen) / G.dayLen;
  G.day = () => Math.floor((G.time + G.dayLen * 0.32) / G.dayLen) + 1;
  G.daylight = function () {
    if (G.opts.dayNight === false) return 1;
    const f = G.dayFrac();
    if (f < 0.2) return 0;
    if (f < 0.29) return U.smooth((f - 0.2) / 0.09);
    if (f < 0.76) return 1;
    if (f < 0.85) return 1 - U.smooth((f - 0.76) / 0.09);
    return 0;
  };
  G.darkness = () => (1 - G.daylight()) * 0.82;

  /* ----------------------------- items ----------------------------- */
  G.dropItem = function (x, y, id, n) {
    if (!id || n <= 0) return;
    for (const g of G.groundItems) if (g.id === id && Math.abs(g.x - x) < 0.6 && Math.abs(g.y - y) < 0.6) { g.n += n; return; }
    G.groundItems.push({ id, n, x: x + (Math.random() - 0.5) * 0.4, y: y + (Math.random() - 0.5) * 0.4 });
    if (G.groundItems.length > 3000) G.groundItems.shift();
  };

  /* -------------------------- reset / setup -------------------------- */
  function resetAll() {
    GF.Ent.reset(); GF.Power.reset(); GF.Fluids.reset(); GF.Logistics.reset(); GF.Enemies.reset();
    GF.Combat.reset(); GF.Particles.reset(); GF.Research.reset(); GF.Craft.reset(); GF.Map.reset();
    GF.Progress.reset(); GF.Render.reset(); GF.Build.reset();
    G.vehicles = []; G.groundItems = []; G.time = 0; G._acc = 0; G._autoT = 0;
  }

  const START_KITS = {
    none: { pistol: 1, ammo: 10 },
    normal: { pistol: 1, ammo: 10, iron_plate: 8, burner_drill: 1, stone_furnace: 1, wood: 10 },
    rich: {
      pistol: 1, ammo: 40, iron_plate: 150, copper_plate: 80, gear: 40, circuit: 30, burner_drill: 6, stone_furnace: 8, wood: 50, coal: 100,
      belt: 60, inserter: 20, small_pole: 20, coal_gen: 2, lab: 2, wood_chest: 10, stone: 50, turret_gun: 2,
    },
  };

  /**
   * opts: {name, seedStr, size, resAmount, resDensity, enemyActivity, enemyStrength, start, dayNight, dayLen, difficulty, tutorial}
   */
  G.newGame = function (opts) {
    resetAll();
    G.opts = Object.assign({ name: 'Min fabrik', seedStr: 'GREJS2026', size: 1024, resAmount: 1, resDensity: 1, enemyActivity: 1, enemyStrength: 1, start: 'normal', dayNight: true, dayLen: 600, difficulty: 'normal', tutorial: true }, opts);
    G.opts.seed = U.hashString(G.opts.seedStr);
    G.dayLen = G.opts.dayLen || 600;
    GF.World.reset({ seed: G.opts.seed, size: +G.opts.size, resAmount: +G.opts.resAmount, resDensity: +G.opts.resDensity });
    GF.Map.reveal(0, 0, 3);
    const pos = GF.World.findFree(0, 0, 30);
    GF.player = GF.Player.create({ x: pos.x, y: pos.y });
    const kit = START_KITS[G.opts.start] || START_KITS.normal;
    for (const id in kit) GF.player.inv.add(id, kit[id]);
    GF.player.weapon = 'pistol';
    GF.Progress.tut.enabled = G.opts.tutorial !== false;
    GF.UI.hotbar = GF.UI.defaultHotbar();
    GF.Render.cam.x = GF.Render.cam.fx = pos.x; GF.Render.cam.y = GF.Render.cam.fy = pos.y; GF.Render.cam.follow = true;
    GF.Render.cam.tz = GF.Render.cam.zoom = 1;
    // pre-generate the start area (hives etc.)
    for (let cy = -4; cy <= 3; cy++) for (let cx = -4; cx <= 3; cx++) GF.World.chunk(cx, cy);
    G.start();
    G.dirtySince = 0;
    GF.UI.toast('Velkommen til ' + G.opts.name + '! Seed: ' + G.opts.seedStr, 'info');
  };

  G.loadData = function (d) {
    resetAll();
    G.opts = d.opts;
    G.opts.seed = G.opts.seed != null ? G.opts.seed : U.hashString(G.opts.seedStr);
    G.dayLen = G.opts.dayLen || 600;
    G.time = d.time || 0;
    GF.World.load(d.world);
    GF.Enemies.load(d.enemies);        // before entities: prevents regenerating hives
    GF.Map.load(d.map);
    GF.Craft.load(d.craft);
    GF.Research.load(d.research);
    GF.Ent.deserialize(d.ents);
    GF.Logistics.load(d.logistics);
    GF.Progress.load(d.progress);
    GF.player = GF.Player.create(d.player || {});
    G.vehicles = (d.vehicles || []).map((v) => GF.Player.createVehicle(v.x, v.y, v));
    if (d.player && d.player.veh >= 0 && G.vehicles[d.player.veh]) { GF.player.vehicle = G.vehicles[d.player.veh]; G.vehicles[d.player.veh].driver = GF.player; }
    G.groundItems = (d.ground || []).filter((g) => GF.ITEMS[g[0]]).map((g) => ({ id: g[0], n: g[1], x: g[2], y: g[3] }));
    GF.UI.hotbar = Array.isArray(d.hotbar) && d.hotbar.length === 10 ? d.hotbar : GF.UI.defaultHotbar();
    const cam = GF.Render.cam;
    cam.x = cam.fx = GF.player.x; cam.y = cam.fy = GF.player.y; cam.follow = true;
    cam.tz = cam.zoom = (d.cam && d.cam.zoom) || 1;
    GF.Power.dirty = true; GF.Fluids.dirty = true; GF.Logistics.dirty = true;
    G.start();
    G.dirtySince = G.time;
  };

  G.start = function () {
    G.running = true; G.paused = false;
    GF.UI.showGame();
    G._last = performance.now();
    if (!G.raf) G.raf = requestAnimationFrame(G.loop);
  };

  G.stop = function () {
    G.running = false;
    GF.player = null;
  };

  /* ------------------------------ tick ------------------------------ */
  G.tick = function (dt) {
    G.time += dt;
    const p = GF.player;
    GF.Player.update(p, dt);
    GF.Craft.update(dt, p.inv);
    GF.Power.update(dt);
    GF.Fluids.update(dt);
    const ups = GF.Ent.getUpdaters();
    for (let i = 0; i < ups.length; i++) {
      const e = ups[i];
      if (e.dead) continue;
      GF.Kinds[e.kind].update(e, dt);
    }
    GF.Logistics.update(dt);
    GF.Enemies.update(dt);
    GF.Combat.update(dt);
    GF.Research.update(dt);
    GF.Map.update(dt);
    GF.Progress.update(dt);
    // autosave
    const as = GF.Settings.get('autosave');
    if (as > 0) {
      G._autoT += dt;
      if (G._autoT >= as) { G._autoT = 0; GF.Save.save('auto', true); }
    }
  };

  G.loop = function (ts) {
    G.raf = requestAnimationFrame(G.loop);
    let dt = (ts - G._last) / 1000;
    G._last = ts;
    if (!(dt > 0)) dt = STEP;
    dt = Math.min(dt, 0.1);
    try {
      if (G.running) {
        if (!G.paused) {
          G._acc += dt * (GF.fastForward || 1);
          let steps = 0;
          const maxSteps = GF.fastForward ? 40 : 5;
          while (G._acc >= STEP && steps < maxSteps) { G.tick(STEP); G._acc -= STEP; steps++; G._uN++; }
          if (steps >= maxSteps) G._acc = 0;
          GF.Build.update(dt);
          GF.Particles.update(dt);
        }
        G._uT += dt;
        if (G._uT >= 1) { G.ups = G._uN / G._uT; G._uN = 0; G._uT = 0; }
        GF.Render.frame(G.paused ? 0 : dt);
        GF.UI.frame(dt);
        GF.Audio.update(dt, true);
      } else {
        GF.Menu && GF.Menu.frame(dt);
        GF.Audio.update(dt, false);
      }
    } catch (err) {
      console.error('[loop]', err);
      if (!G._errShown) { G._errShown = true; GF.UI && GF.UI.toast('Intern fejl: ' + err.message + ' (se konsollen)', 'bad'); }
    }
    GF.Input.endFrame();
  };

  GF.Game = G;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — main.js
 * Boot sequence: icons, renderer, input, UI, menu, service worker,
 * mobile notice and the main animation loop.
 * ===================================================================== */
'use strict';
(function (GF) {
  function boot() {
    try {
      GF.Icons.init();
    } catch (e) { console.error('icon init failed', e); }
    const cv = document.getElementById('game-canvas');
    GF.Render.init(cv);
    GF.Input.init(cv);
    GF.UI.init();
    GF.Menu.initBg();
    GF.Menu.show('main');
    GF.Save.openDB();

    // unlock audio on first interaction
    const unlock = () => { GF.Audio.unlock(); window.removeEventListener('pointerdown', unlock); };
    window.addEventListener('pointerdown', unlock);

    // mobile / touch notice (the page still works)
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches && !window.matchMedia('(pointer: fine)').matches;
    if (coarse || window.innerWidth < 820) {
      const n = document.getElementById('mobile-note');
      n.innerHTML = '<div class="mn-box"><b>Grejs Factory is optimized for keyboard and mouse.</b><p>Spillet er lavet til PC med tastatur og mus. Du kan godt kigge rundt, men det spiller bedst på en computer.</p><button class="btn btn-primary" id="mn-ok">Fortsæt alligevel</button></div>';
      n.classList.add('open');
      document.getElementById('mn-ok').onclick = () => n.classList.remove('open');
    }

    // offline support (only works over http/https, not file://)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./service-worker.js').catch((e) => console.info('service worker not registered', e));
    }

    // warn before closing with unsaved progress
    window.addEventListener('beforeunload', (ev) => {
      if (GF.Game.running && GF.Game.time - (GF.Game.dirtySince || 0) > 30) {
        try { GF.Save.save('auto', true); } catch (e) { /* ignore */ }
        ev.preventDefault(); ev.returnValue = '';
      }
    });

    // development helpers (console): GF.debug.give('iron_plate', 100)
    GF.debug = {
      give(id, n) { if (GF.player && GF.ITEMS[id]) GF.player.inv.add(id, n || 1); },
      research(id) { if (id) { GF.Research.complete(id); return; } Object.keys(GF.TECH).forEach((t) => { if (!GF.Research.isDone(t)) { GF.Research.done.add(t); GF.Research.applyTech(t); } }); },
      fast(x) { GF.fastForward = x || 0; },
      cheat(on) { GF.cheat = on !== false; },
    };

    GF.Game.raf = requestAnimationFrame(GF.Game.loop);
    document.body.classList.add('ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.GF);

</script>
