          const cx2 = X + res / 2 + ox, cy2 = Y + res / 2 + oy;
          c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(cx2 + res * 0.12, cy2 + res * 0.18, res * 0.45, res * 0.3, 0, 0, 6.28); c.fill();
          const greens = [['#2f5a24', '#3f7a2e', '#5a9a3e'], ['#2a4f2a', '#386a36', '#4f8a48'], ['#3a5a1e', '#4d7a28', '#6a9a36']][d - 1];
          c.fillStyle = greens[0]; c.beginPath(); c.arc(cx2, cy2, res * 0.46, 0, 6.28); c.fill();
          c.fillStyle = greens[1]; c.beginPath(); c.arc(cx2 - res * 0.08, cy2 - res * 0.08, res * 0.34, 0, 6.28); c.fill();
          if (res >= 16) { c.fillStyle = greens[2]; c.beginPath(); c.arc(cx2 - res * 0.14, cy2 - res * 0.16, res * 0.18, 0, 6.28); c.fill(); }
        } else if (d === 4) {
          const cx2 = X + res / 2 + ox, cy2 = Y + res / 2 + oy;
          c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(cx2 + res * 0.08, cy2 + res * 0.12, res * 0.4, res * 0.3, 0, 0, 6.28); c.fill();
          c.fillStyle = '#7a766e'; c.beginPath(); c.ellipse(cx2, cy2, res * 0.4, res * 0.32, 0.3, 0, 6.28); c.fill();
          c.fillStyle = '#9a958b'; c.beginPath(); c.ellipse(cx2 - res * 0.08, cy2 - res * 0.08, res * 0.22, res * 0.16, 0.3, 0, 6.28); c.fill();
        } else if (d === 5) {
          c.strokeStyle = '#5a4630'; c.lineWidth = Math.max(1, res / 12);
          c.beginPath(); c.moveTo(X + res * 0.5, Y + res * 0.9); c.lineTo(X + res * 0.5, Y + res * 0.3); c.lineTo(X + res * 0.25, Y + res * 0.1);
          c.moveTo(X + res * 0.5, Y + res * 0.45); c.lineTo(X + res * 0.78, Y + res * 0.2); c.stroke();
        }
      }
    }
    return cv;
  }

  function chunkCanvas(cx, cy, res, allowPaint) {
    const k = cx + ',' + cy + ',' + res;
    let cv = R.chunkCache.get(k);
    if (cv) { R.chunkCache.delete(k); R.chunkCache.set(k, cv); return cv; } // LRU touch
    if (!allowPaint) return null;
    cv = paintChunk(cx, cy, res);
    R.chunkCache.set(k, cv);
    const limit = res === 32 ? 40 : res === 16 ? 110 : 260;
    let count = 0;
    for (const key of R.chunkCache.keys()) if (key.endsWith(',' + res)) count++;
    if (count > limit) {
      for (const key of R.chunkCache.keys()) { if (key.endsWith(',' + res)) { R.chunkCache.delete(key); break; } }
    }
    return cv;
  }

  /* ----------------------------- units ----------------------------- */
  function drawUnit(ctx, u, s, t) {
    const X = R.w2sx(u.x), Y = R.w2sy(u.y);
    const sz = u.t.size * s * 0.5;
    ctx.save();
    ctx.translate(X, Y); ctx.rotate(u.ang);
    if (GF.Settings.get('shadows')) { ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(sz * 0.2, sz * 0.3, sz * 1.1, sz * 0.8, 0, 0, 6.28); ctx.fill(); }
    // legs
    ctx.strokeStyle = '#2a1020'; ctx.lineWidth = Math.max(1, sz * 0.15);
    for (let i = 0; i < 3; i++) {
      const ph = Math.sin(u.anim + i * 2.1) * 0.35;
      const lx = -sz * 0.4 + i * sz * 0.45;
      ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx + sz * 0.3 * ph, -sz * 1.0); ctx.moveTo(lx, 0); ctx.lineTo(lx - sz * 0.3 * ph, sz * 1.0); ctx.stroke();
    }
    const col = u.hitT > 0 ? '#fff' : u.t.color;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(-sz * 0.35, 0, sz * 0.6, sz * 0.48, 0, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sz * 0.35, 0, sz * 0.45, sz * 0.4, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(-sz * 0.35, sz * 0.1, sz * 0.5, sz * 0.25, 0, 0, 6.28); ctx.fill();
    // mandibles + eyes
    const lunge = u.lunge ? 0.25 : 0;
    ctx.strokeStyle = '#e8d0a0'; ctx.lineWidth = Math.max(1, sz * 0.12);
    ctx.beginPath(); ctx.moveTo(sz * 0.7, -sz * 0.15); ctx.lineTo(sz * (1.05 + lunge), -sz * 0.3); ctx.moveTo(sz * 0.7, sz * 0.15); ctx.lineTo(sz * (1.05 + lunge), sz * 0.3); ctx.stroke();
    ctx.fillStyle = u.t.ranged ? '#cf6' : '#f6a';
    ctx.beginPath(); ctx.arc(sz * 0.55, -sz * 0.14, sz * 0.08, 0, 6.28); ctx.arc(sz * 0.55, sz * 0.14, sz * 0.08, 0, 6.28); ctx.fill();
    if (u.armor > 5) { ctx.strokeStyle = 'rgba(200,200,255,.35)'; ctx.lineWidth = sz * 0.12; ctx.beginPath(); ctx.ellipse(-sz * 0.35, 0, sz * 0.45, sz * 0.35, 0, 0, 6.28); ctx.stroke(); }
    ctx.restore();
    if (u.hp < u.maxHp) hpBar(ctx, X - sz, Y - sz * 1.4, sz * 2, u.hp / u.maxHp, '#e44');
  }

  function hpBar(ctx, x, y, w, k, col) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 1, y - 1, w + 2, 5);
    ctx.fillStyle = k > 0.5 ? (col || '#4d4') : k > 0.25 ? '#dd4' : '#e44';
    ctx.fillRect(x, y, w * U.clamp(k, 0, 1), 3);
  }
  R.hpBar = hpBar;

  function drawPlayer(ctx, p, s, t) {
    if (p.dead) return;
    const X = R.w2sx(p.x), Y = R.w2sy(p.y);
    if (p.vehicle) return; // drawn with vehicle
    const r = s * 0.4;
    ctx.save(); ctx.translate(X, Y);
    if (GF.Settings.get('shadows')) { ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(r * 0.3, r * 0.5, r * 1.0, r * 0.6, 0, 0, 6.28); ctx.fill(); }
    ctx.rotate(p.face + Math.PI / 2);
    // legs
    const step = p.moving ? Math.sin(p.walk * 10) * r * 0.5 : 0;
    ctx.fillStyle = '#2d3238';
    ctx.fillRect(-r * 0.55, -r * 0.1 + step, r * 0.4, r * 0.9); ctx.fillRect(r * 0.15, -r * 0.1 - step, r * 0.4, r * 0.9);
    // body
    ctx.fillStyle = p.hurtT > 0 ? '#fff' : '#e07a28';
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.95, r * 0.7, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#3d4650'; ctx.fillRect(-r * 0.6, r * 0.25, r * 1.2, r * 0.5); // backpack
    ctx.fillStyle = '#ffd35a'; ctx.fillRect(-r * 0.2, r * 0.35, r * 0.4, r * 0.15);
    // gun arm
    ctx.fillStyle = '#39424c'; ctx.fillRect(r * 0.35, -r * 1.25, r * 0.22, r * 0.9);
    // head/helmet
    ctx.fillStyle = '#f0c040'; ctx.beginPath(); ctx.arc(0, -r * 0.1, r * 0.48, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#29a8d8'; ctx.beginPath(); ctx.arc(0, -r * 0.32, r * 0.22, 0, 6.28); ctx.fill();
    ctx.restore();
    if (p.hp < p.maxHp) hpBar(ctx, X - r, Y - r * 1.8, r * 2, p.hp / p.maxHp);
  }

  function drawVehicle(ctx, v, s) {
    const X = R.w2sx(v.x), Y = R.w2sy(v.y);
    ctx.save(); ctx.translate(X, Y); ctx.rotate(v.ang + Math.PI / 2);
    const w = s * 0.9, h = s * 1.4;
    if (GF.Settings.get('shadows')) { ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(-w / 2 + 5, -h / 2 + 7, w, h); }
    ctx.fillStyle = '#1b1d20';
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => ctx.fillRect(a * w * 0.5 - w * 0.13, b * h * 0.32 - h * 0.1, w * 0.26, h * 0.2));
    ctx.fillStyle = '#e0a020'; GF.Icons.rr(ctx, -w * 0.42, -h * 0.5, w * 0.84, h, w * 0.2); ctx.fill();
    ctx.fillStyle = '#2b3a48'; GF.Icons.rr(ctx, -w * 0.3, -h * 0.25, w * 0.6, h * 0.3, 4); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(-w * 0.1, h * 0.05, w * 0.2, h * 0.35);
    ctx.fillStyle = '#ffe9a0'; ctx.fillRect(-w * 0.35, -h * 0.5, w * 0.18, 4); ctx.fillRect(w * 0.17, -h * 0.5, w * 0.18, 4);
    if (GF.player.vehicle === v) { ctx.fillStyle = '#f0c040'; ctx.beginPath(); ctx.arc(0, -h * 0.05, w * 0.14, 0, 6.28); ctx.fill(); }
    ctx.restore();
  }

  /* -------------------------- wire drawing -------------------------- */
  function poleTop(p) { return { x: p.x + p.w / 2, y: p.y + p.h / 2 - (p.w > 1 ? 0.9 : 0.55) }; }

  /* ------------------------------ frame ------------------------------ */
  R.frame = function (dt) {
    const ctx = R.ctx, G = GF.Game, pl = GF.player;
    R.t += dt;
    // fps
    R._fT += dt; R._fN++;
    if (R._fT >= 0.5) { R.fps = R._fN / R._fT; R._fT = 0; R._fN = 0; }
    // camera
    const cam = R.cam;
    cam.zoom += (cam.tz - cam.zoom) * Math.min(1, dt * 12);
    if (cam.follow && pl) { cam.fx = pl.x; cam.fy = pl.y; }
    cam.x += (cam.fx - cam.x) * Math.min(1, dt * 8);
    cam.y += (cam.fy - cam.y) * Math.min(1, dt * 8);
    R.s = TS * cam.zoom;
    const s = R.s;
    let shx = 0, shy = 0;
    if (R.shakeA > 0.05) { shx = (Math.random() - 0.5) * R.shakeA; shy = (Math.random() - 0.5) * R.shakeA; R.shakeA *= Math.pow(0.02, dt); } else R.shakeA = 0;

    ctx.setTransform(R.dpr, 0, 0, R.dpr, shx * R.dpr, shy * R.dpr);
    ctx.imageSmoothingEnabled = true;
    ctx.fillStyle = '#07080c';
    ctx.fillRect(-20, -20, R.W + 40, R.H + 40);

    const v = R.view;
    v.x0 = cam.x - R.W / 2 / s; v.x1 = cam.x + R.W / 2 / s;
    v.y0 = cam.y - R.H / 2 / s; v.y1 = cam.y + R.H / 2 / s;
    const cx0 = Math.floor(v.x0 / CH), cx1 = Math.floor(v.x1 / CH);
    const cy0 = Math.floor(v.y0 / CH), cy1 = Math.floor(v.y1 / CH);

    // ---- terrain ----
    const q = GF.Settings.get('quality');
    let res = cam.zoom >= 0.9 ? 32 : cam.zoom >= 0.45 ? 16 : 8;
    if (q === 'low') res = Math.min(res, 16);
    let paints = 0, paints8 = 0;
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const X = R.w2sx(cx * CH), Y = R.w2sy(cy * CH);
        if (!GF.Map.isExplored(cx, cy)) { ctx.fillStyle = '#050608'; ctx.fillRect(X, Y, CH * s + 1, CH * s + 1); continue; }
        let cv = R.chunkCache.has(cx + ',' + cy + ',' + res) ? chunkCanvas(cx, cy, res, false) : null;
        if (!cv && paints < 2) { cv = chunkCanvas(cx, cy, res, true); paints++; }
        if (!cv) cv = chunkCanvas(cx, cy, 16, false) || chunkCanvas(cx, cy, 8, false);
        if (!cv && paints8 < 8) { cv = chunkCanvas(cx, cy, 8, true); paints8++; }
        if (cv) ctx.drawImage(cv, X, Y, CH * s + 0.6, CH * s + 0.6);
        else {
          ctx.fillStyle = GF.World.TERRAIN[GF.World.terrain(cx * CH + 16, cy * CH + 16)].color;
          ctx.fillRect(X, Y, CH * s + 1, CH * s + 1);
        }
      }
    }
    // ---- gather entities ----
    const ground = [], builds = [], tops = [], poles = [];
    GF.Ent.forChunks(cx0 - 1, cy0 - 1, cx1, cy1, (e) => {
      if (e.x > v.x1 + 1 || e.y > v.y1 + 1 || e.x + e.w < v.x0 - 1 || e.y + e.h < v.y0 - 1) return;
      const L = e.def.layer;
      if (L === 0) ground.push(e);
      else if (L === 2) tops.push(e);
      else if (e.kind === 'pole') poles.push(e);
      else builds.push(e);
    });
    R.drawn = ground.length + builds.length + tops.length + poles.length;
    const t = R.t;
    // ---- ground layer ----
    for (const e of ground) {
      const X = R.w2sx(e.x), Y = R.w2sy(e.y);
      if (e.kind === 'belt') {
        const ph = ((G.time * e.def.speed) % 0.25) / 0.25;
        const fr = Math.floor(ph * GF.Sprites.BELT_FRAMES) % GF.Sprites.BELT_FRAMES;
        ctx.drawImage(GF.Sprites.beltFrame(e.def.tier, e.curve, e.dir, fr), X, Y, s + 0.5, s + 0.5);
      } else GF.Sprites.draw(ctx, e, X, Y, s, t);
    }
    // ---- belt items ----
    const isz = s * 0.44;
    for (const e of ground) {
      const items = e.items;
      if (!items || !items.length) continue;
      for (const it of items) {
        let pos;
        if (e.kind === 'ug') {
          if (e.ugType === 'in') { if (it.p > 0.5) continue; pos = { x: e.x + 0.5 - U.DIRS[e.dir].x * (0.5 - it.p), y: e.y + 0.5 - U.DIRS[e.dir].y * (0.5 - it.p) }; }
          else { if (it.p < 0.5) continue; pos = GF.Belts.itemPos(e, it.p); }
        } else pos = GF.Belts.itemPos(e, it.p);
        const cv = GF.Icons.cv[it.id];
        if (cv) ctx.drawImage(cv, R.w2sx(pos.x) - isz / 2, R.w2sy(pos.y) - isz / 2, isz, isz);
      }
    }
    // ---- ground items ----
    for (const gi of G.groundItems) {
      if (gi.x < v.x0 - 1 || gi.x > v.x1 + 1 || gi.y < v.y0 - 1 || gi.y > v.y1 + 1) continue;
      const cv = GF.Icons.cv[gi.id];
      if (cv) ctx.drawImage(cv, R.w2sx(gi.x) - isz / 2, R.w2sy(gi.y) - isz / 2, isz, isz);
    }
    // ---- buildings ----
    builds.sort((a, b) => (a.y + a.h) - (b.y + b.h));
    for (const e of builds) {
      const X = R.w2sx(e.x), Y = R.w2sy(e.y);
      GF.Sprites.draw(ctx, e, X, Y, s, t);
      if (e.working && e.def.energy === 'burner' && Math.random() < dt * 3) GF.Particles.emit('smoke', e.x + e.w * 0.7, e.y + 0.3, 1);
      if (e.working && (e.kind === 'burnergen' || e.kind === 'refinery') && Math.random() < dt * 4) GF.Particles.emit('smoke', e.x + e.w * 0.72, e.y + 0.2, 1, { size: 0.4 });
      if (e.working && e.kind === 'boiler' && Math.random() < dt * 3) GF.Particles.emit('steam', e.x + e.w / 2, e.y + 0.3, 1);
      if (e.hitT > 0) { e.hitT -= dt; ctx.fillStyle = 'rgba(255,60,60,.3)'; ctx.fillRect(X, Y, e.w * s, e.h * s); }
    }
    // ---- units & player & vehicles ----
    for (const u of GF.Enemies.units) {
      if (u.x < v.x0 - 2 || u.x > v.x1 + 2 || u.y < v.y0 - 2 || u.y > v.y1 + 2) continue;
      drawUnit(ctx, u, s, t);
    }
    for (const veh of G.vehicles) drawVehicle(ctx, veh, s);
    if (pl) drawPlayer(ctx, pl, s, t);
    // ---- inserters ----
    for (const e of tops) GF.Sprites.draw(ctx, e, R.w2sx(e.x), R.w2sy(e.y), s, t);
    // ---- poles & wires ----
    for (const e of poles) GF.Sprites.draw(ctx, e, R.w2sx(e.x), R.w2sy(e.y), s, t);
    ctx.lineWidth = Math.max(1, s * 0.04);
    ctx.strokeStyle = 'rgba(30,24,20,.85)';
    ctx.beginPath();
    for (const [a, b] of GF.Power.wires) {
      if ((a.x < v.x0 - 30 && b.x < v.x0 - 30) || (a.x > v.x1 + 30 && b.x > v.x1 + 30) || (a.y < v.y0 - 30 && b.y < v.y0 - 30) || (a.y > v.y1 + 30 && b.y > v.y1 + 30)) continue;
      const A = poleTop(a), B = poleTop(b);
      const ax = R.w2sx(A.x), ay = R.w2sy(A.y), bx = R.w2sx(B.x), by = R.w2sy(B.y);
      const sag = Math.hypot(bx - ax, by - ay) * 0.08;
      ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2, (ay + by) / 2 + sag, bx, by);
    }
    ctx.stroke();
    // ---- drones ----
    for (const b of GF.Logistics.bots) {
      if (b.x < v.x0 - 2 || b.x > v.x1 + 2 || b.y < v.y0 - 2 || b.y > v.y1 + 2) continue;
      const X = R.w2sx(b.x), Y = R.w2sy(b.y) - b.z * s * 0.6;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(R.w2sx(b.x), R.w2sy(b.y), s * 0.2, s * 0.08, 0, 0, 6.28); ctx.fill();
      const cv = GF.Icons.cv[b.type === 'logi' ? 'logi_bot' : 'cons_bot'];
      ctx.drawImage(cv, X - s * 0.3, Y - s * 0.3, s * 0.6, s * 0.6);
      if (b.cargo && b.cargo.length) { const ic = GF.Icons.cv[b.cargo[0].id]; if (ic) ctx.drawImage(ic, X - s * 0.14, Y + s * 0.12, s * 0.28, s * 0.28); }
    }
    // ---- projectiles & tracers ----
    for (const p of GF.Combat.proj) {
      const X = R.w2sx(p.x), Y = R.w2sy(p.y);
      if (p.type === 'grenade' || p.type === 'cannon') {
        const k = p.t / p.T, hgt = Math.sin(k * Math.PI) * s * (p.type === 'cannon' ? 2.5 : 1.2);
        ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(X, Y, s * 0.12, 0, 6.28); ctx.fill();
        ctx.fillStyle = p.type === 'cannon' ? '#555' : '#3d5a2c'; ctx.beginPath(); ctx.arc(X, Y - hgt, s * 0.14, 0, 6.28); ctx.fill();
      } else if (p.type === 'rocket') {
        ctx.save(); ctx.translate(X, Y); ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.fillStyle = '#ddd'; ctx.fillRect(-s * 0.25, -s * 0.06, s * 0.5, s * 0.12);
        ctx.fillStyle = '#ffb040'; ctx.fillRect(-s * 0.4, -s * 0.05, s * 0.15, s * 0.1);
        ctx.restore();
      } else if (p.type === 'acid') {
        ctx.fillStyle = '#9f4'; ctx.beginPath(); ctx.arc(X, Y - Math.sin((p.t / p.T) * Math.PI) * s * 0.8, s * 0.13, 0, 6.28); ctx.fill();
      }
    }
    for (const tr of GF.Combat.tracers) {
      const k = tr.life / tr.max;
      ctx.strokeStyle = tr.kind === 'laser' ? 'rgba(90,220,255,' + k + ')' : 'rgba(255,230,150,' + k + ')';
      ctx.lineWidth = tr.kind === 'laser' ? Math.max(2, s * 0.08) : Math.max(1, s * 0.04);
      ctx.beginPath(); ctx.moveTo(R.w2sx(tr.x0), R.w2sy(tr.y0)); ctx.lineTo(R.w2sx(tr.x1), R.w2sy(tr.y1)); ctx.stroke();
    }
    // ---- particles ----
    GF.Particles.draw(ctx, R.w2sx, R.w2sy, s, v);

    // ---- health bars & warning icons ----
    const blink = Math.floor(G.time * 2) % 2 === 0;
    for (const e of builds.concat(tops, poles)) {
      if (e.hp < e.maxHp && !e.def.enemy) hpBar(ctx, R.w2sx(e.x) + 2, R.w2sy(e.y + e.h) - 6, e.w * s - 4, e.hp / e.maxHp);
      else if (e.def.enemy && e.hp < e.maxHp) hpBar(ctx, R.w2sx(e.x) + 2, R.w2sy(e.y) - 6, e.w * s - 4, e.hp / e.maxHp, '#e44');
      if (e.warn && blink && e.warn !== 'lowpower' && s > 12) {
        const ic = { nopower: '⚡', nofuel: '🔥', outfull: '⛔', starved: '⚠', noammo: '⚠', depleted: '✖' }[e.warn] || '⚠';
        const X = R.w2sx(e.x + e.w / 2), Y = R.w2sy(e.y + e.h / 2);
        ctx.fillStyle = 'rgba(20,10,0,.75)'; ctx.beginPath(); ctx.arc(X, Y, s * 0.28, 0, 6.28); ctx.fill();
        ctx.fillStyle = e.warn === 'nopower' ? '#ffd23a' : '#ff6a3a';
        ctx.font = 'bold ' + Math.round(s * 0.36) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(ic, X, Y + 1);
      }
      if (e.decon) { ctx.strokeStyle = '#f33'; ctx.lineWidth = 2; const X = R.w2sx(e.x), Y = R.w2sy(e.y); ctx.beginPath(); ctx.moveTo(X + 4, Y + 4); ctx.lineTo(X + e.w * s - 4, Y + e.h * s - 4); ctx.moveTo(X + e.w * s - 4, Y + 4); ctx.lineTo(X + 4, Y + e.h * s - 4); ctx.stroke(); }
    }
    for (const e of ground) if (e.decon) { ctx.strokeStyle = '#f33'; ctx.lineWidth = 2; const X = R.w2sx(e.x), Y = R.w2sy(e.y); ctx.strokeRect(X + 3, Y + 3, e.w * s - 6, e.h * s - 6); }

    // ---- lighting ----
    drawLighting(ctx, builds.concat(tops, poles));

    // ---- overlays ----
    GF.UIWorld && GF.UIWorld.drawOverlays(ctx, s, v);
  };

  function drawLighting(ctx, ents) {
    const dark = GF.Game.darkness();
    if (dark < 0.02) return;
    if (!GF.Settings.get('lighting')) {
      ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
      ctx.fillStyle = 'rgba(8,12,30,' + (dark * 0.85).toFixed(3) + ')';
      ctx.fillRect(0, 0, R.W, R.H);
      return;
    }
    const lc = R.lightCtx, LW = R.lightCv.width, LH = R.lightCv.height;
    lc.globalCompositeOperation = 'source-over';
    lc.clearRect(0, 0, LW, LH);
    lc.fillStyle = 'rgba(6,10,28,' + dark.toFixed(3) + ')';
    lc.fillRect(0, 0, LW, LH);
    lc.globalCompositeOperation = 'destination-out';
    const s = R.s;
    const glows = [];
    const light = (x, y, r, str) => {
      const X = R.w2sx(x) / 2, Y = R.w2sy(y) / 2, rr = (r * s) / 2;
      if (X < -rr || Y < -rr || X > LW + rr || Y > LH + rr) return;
      const g = lc.createRadialGradient(X, Y, 0, X, Y, rr);
      g.addColorStop(0, 'rgba(0,0,0,' + str + ')'); g.addColorStop(0.5, 'rgba(0,0,0,' + (str * 0.6) + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
      lc.fillStyle = g; lc.beginPath(); lc.arc(X, Y, rr, 0, 6.28); lc.fill();
    };
    const pl = GF.player;
    if (pl && !pl.dead) { light(pl.x, pl.y, 7, 0.85); light(pl.x + Math.cos(pl.face) * 4, pl.y + Math.sin(pl.face) * 4, 5, 0.6); }
    for (const e of ents) {
      const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
      if (e.kind === 'lamp') { if (e.lit) { light(cx, cy, e.def.light, 1); glows.push([cx, cy, 2.5, '255,240,180']); } continue; }
      if (e.def.light && (e.working || e.kind === 'turret' || e.kind === 'core' || e.kind === 'roboport')) {
        light(cx, cy, e.def.light + e.w * 0.5, e.working ? 0.8 : 0.45);
        if (e.working && (e.def.cat === 'smelt' || e.kind === 'burnergen' || e.kind === 'boiler')) glows.push([cx, cy, e.w * 0.8, '255,140,50']);
        if (e.kind === 'core') glows.push([cx, cy, 5, '255,210,120']);
      } else if (e.working && e.def.energy === 'electric') light(cx, cy, 2 + e.w * 0.4, 0.4);
      if (e.def.enemy) glows.push([cx, cy, 2, '255,60,160']);
    }
    for (const b of GF.Logistics.bots) light(b.x, b.y - 0.6, 1.5, 0.5);
    for (const tr of GF.Combat.tracers) light(tr.x1, tr.y1, 1.5, 0.6);
    for (const p of GF.Combat.proj) if (p.type === 'rocket') light(p.x, p.y, 2, 0.7);
    for (const v of GF.Game.vehicles) light(v.x + Math.cos(v.ang) * 3, v.y + Math.sin(v.ang) * 3, 5, 0.7);
    GF.Particles.lights((x, y, r) => light(x, y, r, 0.9));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(R.lightCv, 0, 0, R.cv.width, R.cv.height);
    ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
    // additive colored glows
    ctx.globalCompositeOperation = 'lighter';
    for (const [x, y, r, rgb] of glows) {
      const X = R.w2sx(x), Y = R.w2sy(y), rr = r * s;
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, rr);
      g.addColorStop(0, 'rgba(' + rgb + ',' + (0.35 * dark).toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, rr, 0, 6.28); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  GF.Render = R;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — map.js
 * Exploration (fog of war per chunk), radar scanning, the corner
 * minimap and the fullscreen map. Both maps can move the camera.
 * States: unknown (black) · explored (seen before) · visible (now)
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const CH = U.CHUNK;

  const M = {
    explored: new Set(), visible: new Set(), mini: new Map(),
    _t: 0, _mT: 0, miniZoom: 2, radarQueue: new Map(),
  };

  M.reset = function () { M.explored = new Set(); M.visible = new Set(); M.mini = new Map(); M.radarQueue = new Map(); };
  M.isExplored = (cx, cy) => M.explored.has(U.key(cx, cy));
  M.isVisible = (cx, cy) => M.visible.has(U.key(cx, cy));
  M.invalidateChunk = (cx, cy) => { M.mini.delete(U.key(cx, cy)); };

  M.reveal = function (cx, cy, r) {
    for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
      const k = U.key(x, y);
      if (!M.explored.has(k)) { M.explored.add(k); }
    }
  };

  M.update = function (dt) {
    M._t += dt;
    if (M._t < 0.5) return;
    M._t = 0;
    M.visible.clear();
    const p = GF.player;
    if (p) {
      const cx = Math.floor(p.x / CH), cy = Math.floor(p.y / CH);
      M.reveal(cx, cy, 2);
      for (let y = cy - 2; y <= cy + 2; y++) for (let x = cx - 2; x <= cx + 2; x++) M.visible.add(U.key(x, y));
    }
    for (const e of GF.Ent.list.values()) {
      if (e.kind !== 'radar' || !e.working) continue;
      const cx = Math.floor((e.x + 1) / CH), cy = Math.floor((e.y + 1) / CH);
      M.reveal(cx, cy, 2);
      for (let y = cy - 3; y <= cy + 3; y++) for (let x = cx - 3; x <= cx + 3; x++) M.visible.add(U.key(x, y));
    }
  };

  /** radar: explore the nearest unexplored chunk within 7 chunks */
  M.radarScan = function (r) {
    const cx = Math.floor((r.x + 1) / CH), cy = Math.floor((r.y + 1) / CH);
    for (let d = 1; d <= 7; d++) {
      for (let y = cy - d; y <= cy + d; y++) for (let x = cx - d; x <= cx + d; x++) {
        if (Math.max(Math.abs(x - cx), Math.abs(y - cy)) !== d) continue;
        if (GF.World.half && (Math.abs(x * CH) > GF.World.half + CH || Math.abs(y * CH) > GF.World.half + CH)) continue;
        const k = U.key(x, y);
        if (!M.explored.has(k)) { M.explored.add(k); GF.World.chunk(x, y); return x + ',' + y; }
      }
    }
    return null;
  };

  /* ---------------------------- chunk images ---------------------------- */
  const GROUP_COL = {
    mining: '#e0a030', production: '#6fa0d0', logistics: '#d8c040', power: '#f5e27a', defense: '#b8b8b8',
    science: '#50c8f0', endgame: '#c080ff',
  };
  function entColor(e) {
    if (e.def.enemy) return '#d02050';
    if (e.kind === 'belt' || e.kind === 'ug' || e.kind === 'splitter' || e.kind === 'merger') return '#c8a030';
    if (e.kind === 'chest') return '#a07040';
    if (e.kind === 'pipe' || e.kind === 'ugpipe') return '#7a8a9a';
    if (e.kind === 'wall') return '#9a968c';
    return GROUP_COL[e.def.group] || '#aaa';
  }
  M.entColor = entColor;

  function chunkImage(cx, cy) {
    const k = U.key(cx, cy);
    let cv = M.mini.get(k);
    if (cv) return cv;
    const ch = GF.World.chunk(cx, cy);
    cv = document.createElement('canvas'); cv.width = cv.height = CH;
    const c = cv.getContext('2d');
    const img = c.createImageData(CH, CH);
    const T = GF.World.TERRAIN, OC = GF.World.ORE_COLORS;
    const tc = T.map((t) => { const n = parseInt(t.color.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; });
    const oc = OC.map((h) => { if (!h) return null; const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; });
    for (let i = 0; i < CH * CH; i++) {
      let col = tc[ch.t[i]];
      if (ch.o[i] && ch.a[i] > 0) col = oc[ch.o[i]] || col;
      let r = col[0], g = col[1], b = col[2];
      if (ch.d[i] && ch.d[i] <= 3) { r = r * 0.6; g = g * 0.72; b = b * 0.6; }
      img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255;
    }
    c.putImageData(img, 0, 0);
    M.mini.set(k, cv);
    if (M.mini.size > 1500) M.mini.delete(M.mini.keys().next().value);
    return cv;
  }

  /**
   * draw map into ctx: centre (wx,wy) in tiles, `tpp` tiles per pixel
   * opts.full → draw legends/grid
   */
  M.drawMap = function (ctx, W, H, wx, wy, tpp, opts) {
    opts = opts || {};
    ctx.fillStyle = '#050608'; ctx.fillRect(0, 0, W, H);
    const x0 = wx - (W / 2) * tpp, y0 = wy - (H / 2) * tpp;
    const cx0 = Math.floor(x0 / CH), cy0 = Math.floor(y0 / CH);
    const cx1 = Math.floor((wx + (W / 2) * tpp) / CH), cy1 = Math.floor((wy + (H / 2) * tpp) / CH);
    const px = (x) => (x - x0) / tpp, py = (y) => (y - y0) / tpp;
    ctx.imageSmoothingEnabled = false;
    let budget = opts.full ? 40 : 6;
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      if (!M.isExplored(cx, cy)) continue;
      const k = U.key(cx, cy);
      if (!M.mini.has(k)) { if (budget-- <= 0) continue; }
      const cv = chunkImage(cx, cy);
      const X = px(cx * CH), Y = py(cy * CH), S = CH / tpp;
      ctx.drawImage(cv, X, Y, S + 0.5, S + 0.5);
      if (!M.isVisible(cx, cy)) { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(X, Y, S + 0.5, S + 0.5); }
    }
    // entities
    const sz = Math.max(1, 1 / tpp);
    GF.Ent.forChunks(cx0 - 1, cy0 - 1, cx1, cy1, (e) => {
      if (e.def.enemy && !M.isExplored(Math.floor(e.x / CH), Math.floor(e.y / CH))) return;
      ctx.fillStyle = entColor(e);
      ctx.fillRect(px(e.x), py(e.y), Math.max(sz, e.w / tpp), Math.max(sz, e.h / tpp));
    });
    // enemies (visible only)
    ctx.fillStyle = '#ff3050';
    for (const u of GF.Enemies.units) {
      if (!M.isVisible(Math.floor(u.x / CH), Math.floor(u.y / CH))) continue;
      const X = px(u.x), Y = py(u.y);
      if (X < 0 || Y < 0 || X > W || Y > H) continue;
      ctx.fillRect(X - 1, Y - 1, Math.max(2, sz), Math.max(2, sz));
    }
    // camera rect
    const R = GF.Render;
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
    ctx.strokeRect(px(R.view.x0), py(R.view.y0), (R.view.x1 - R.view.x0) / tpp, (R.view.y1 - R.view.y0) / tpp);
    // player
    const p = GF.player;
    if (p) {
      const X = px(p.x), Y = py(p.y);
      ctx.save(); ctx.translate(X, Y); ctx.rotate(p.face + Math.PI / 2);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4.5, 5); ctx.lineTo(-4.5, 5); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.restore();
    }
    // warnings (attack markers)
    const now = GF.Game.time;
    (GF.Progress.attackMarks || []).forEach((m) => {
      if (now - m.t > 20) return;
      const X = px(m.x), Y = py(m.y);
      ctx.strokeStyle = (Math.floor(now * 3) % 2) ? '#f33' : '#ff0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X, Y, 7, 0, 6.28); ctx.stroke();
    });
    if (opts.full) {
      // spawn marker & map border
      ctx.strokeStyle = 'rgba(255,210,58,.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px(0), py(0), 5, 0, 6.28); ctx.stroke();
      if (GF.World.half) { ctx.strokeStyle = 'rgba(255,80,80,.5)'; ctx.strokeRect(px(-GF.World.half), py(-GF.World.half), (GF.World.half * 2) / tpp, (GF.World.half * 2) / tpp); }
    }
    return { x0, y0, tpp };
  };

  M.drawMinimap = function () {
    const cv = document.getElementById('minimap');
    if (!cv || !GF.player) return;
    const W = cv.width, H = cv.height;
    const c = cv.getContext('2d');
    const cam = GF.Render.cam;
    M.miniView = M.drawMap(c, W, H, cam.x, cam.y, M.miniZoom);
  };

  M.miniClick = function (ev) {
    const cv = document.getElementById('minimap');
    const r = cv.getBoundingClientRect();
    const sx = ((ev.clientX - r.left) / r.width) * cv.width, sy = ((ev.clientY - r.top) / r.height) * cv.height;
    const v = M.miniView;
    if (!v) return;
    M.focus(v.x0 + sx * v.tpp, v.y0 + sy * v.tpp);
  };

  /** move camera to a world position (detached from player) */
  M.focus = function (x, y) {
    const cam = GF.Render.cam;
    cam.follow = false; cam.fx = x; cam.fy = y;
    GF.UI && GF.UI.toast('Kameraet er flyttet — tryk en bevægelsestast for at vende tilbage', 'info');
  };

  M.save = () => ({ ex: Array.from(M.explored) });
  M.load = function (d) {
    M.reset();
    if (d && d.ex) d.ex.forEach((k) => M.explored.add(k));
  };

  GF.Map = M;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — player.js
 * The engineer: movement (walk/run), collisions, conveyor riding,
 * health/regeneration, death & respawn, item pickup, and vehicles.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const RADIUS = 0.3;

  function solidAt(x, y, ignoreBelts) {
    const tx = Math.floor(x), ty = Math.floor(y);
    if (!GF.World.inBounds(tx, ty)) return true;
    if (GF.World.isSolid(tx, ty)) return true;
    const e = GF.Ent.at(tx, ty);
    return !!(e && e.def.solid !== false);
  }
  /** does a circle at (x,y) with radius r overlap anything solid? */
  function blocked(x, y, r) {
    return solidAt(x - r, y - r) || solidAt(x + r, y - r) || solidAt(x - r, y + r) || solidAt(x + r, y + r);
  }
  GF.blockedCircle = blocked;

  const Player = {};

  Player.create = function (d) {
    d = d || {};
    const p = {
      x: d.x != null ? d.x : 0.5, y: d.y != null ? d.y : 0.5,
      hp: d.hp || 250, maxHp: 250,
      inv: GF.Inventory.from(d.inv, 80),
      face: 0, walk: 0, moving: false,
      weapon: d.weapon || null, mag: d.mag || 0, magType: d.magType || null,
      fireCd: 0, reload: 0, aim: 0,
      requests: d.requests || [], incoming: {},
      dead: false, respawnT: 0, regenCd: 0, hurtT: 0,
      vehicle: null, reach: 10, mineReach: 3.5,
    };
    p.giveOrDrop = function (id, n) {
      const left = p.inv.add(id, n);
      if (left > 0) {
        GF.Game.dropItem(p.x, p.y, id, left);
        GF.UI.toast('Inventaret er fuldt – ' + GF.itemName(id) + ' smidt på jorden', 'warn');
      }
      return left;
    };
    p.die = function () {
      if (p.dead) return;
      p.dead = true; p.hp = 0; p.respawnT = 6;
      if (p.vehicle) { p.vehicle.driver = null; p.vehicle = null; }
      GF.Particles.emit('gore', p.x, p.y, 12, { color: '#e07a28' });
      GF.UI.toast('Du blev overvældet! Genopstår ved startpunktet...', 'bad');
      GF.Audio.play('hurt');
      GF.Progress.stat('deaths', 1);
    };
    p.respawn = function () {
      const pos = GF.World.findFree(0, 0, 30);
      p.x = pos.x; p.y = pos.y; p.hp = p.maxHp; p.dead = false;
      GF.Render.cam.follow = true;
    };
    p.save = () => ({
      x: +p.x.toFixed(2), y: +p.y.toFixed(2), hp: Math.round(p.hp), inv: p.inv.toJSON(),
      weapon: p.weapon, mag: p.mag, magType: p.magType, requests: p.requests,
      veh: p.vehicle ? GF.Game.vehicles.indexOf(p.vehicle) : -1,
    });
    return p;
  };

  Player.update = function (p, dt) {
    if (p.dead) { p.respawnT -= dt; if (p.respawnT <= 0) p.respawn(); return; }
    const I = GF.Input;
    p.fireCd = Math.max(0, p.fireCd - dt);
    p.reload = Math.max(0, p.reload - dt);
    p.hurtT = Math.max(0, p.hurtT - dt);
    p.regenCd -= dt;
    if (p.regenCd <= 0 && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + 6 * dt);
    // keep a valid weapon selected
    if (!p.weapon || p.inv.count(p.weapon) <= 0) {
      const ws = GF.Combat.weaponsOf(p.inv);
      p.weapon = ws.find((w) => w !== 'grenade') || ws[0] || null;
    }
    let mx = 0, my = 0;
    if (!GF.UI.typing()) {
      if (I.down('left') || I.key('ArrowLeft')) mx -= 1;
      if (I.down('right') || I.key('ArrowRight')) mx += 1;
      if (I.down('up') || I.key('ArrowUp')) my -= 1;
      if (I.down('down') || I.key('ArrowDown')) my += 1;
    }
    if (p.vehicle) { Player.drive(p, p.vehicle, dt, mx, my); return; }
    const len = Math.hypot(mx, my);
    p.moving = len > 0;
    if (p.moving) {
      mx /= len; my /= len;
      const run = I.down('run');
      const sp = (run ? 8.2 : 5.4) * dt;
      p.face = Math.atan2(my, mx);
      p.walk += dt * (run ? 1.5 : 1);
      const ox = p.x, oy = p.y;
      const nx = p.x + mx * sp;
      if (!blocked(nx, p.y, RADIUS)) p.x = nx;
      const ny = p.y + my * sp;
      if (!blocked(p.x, ny, RADIUS)) p.y = ny;
      GF.Progress.stat('distance', Math.hypot(p.x - ox, p.y - oy));
      if (!GF.Render.cam.follow) GF.Render.cam.follow = true;
    } else if (GF.Input.mouse.inWorld) {
      // face the mouse while standing
      const w = GF.Input.mouse;
      p.face = Math.atan2(w.wy - p.y, w.wx - p.x);
    }
    // conveyor belts carry the player
    const e = GF.Ent.at(Math.floor(p.x), Math.floor(p.y));
    if (e && e.kind === 'belt') {
      const v = U.DIRS[e.dir];
      const sp = e.def.speed * dt;
      if (!blocked(p.x + v.x * sp, p.y + v.y * sp, RADIUS)) { p.x += v.x * sp; p.y += v.y * sp; }
    }
    // push out if stuck inside something (e.g. building placed on top)
    if (blocked(p.x, p.y, RADIUS * 0.8)) {
      const f = GF.World.findFree(p.x, p.y, 8);
      p.x = f.x; p.y = f.y;
    }
    // pick up ground items
    if (I.down('pickup') && !GF.UI.typing()) Player.pickup(p);
  };

  Player.pickup = function (p) {
    const G = GF.Game;
    let got = false;
    for (const gi of G.groundItems) {
      if (U.dist(gi.x, gi.y, p.x, p.y) > 1.6) continue;
      const left = p.inv.add(gi.id, gi.n);
      if (left < gi.n) got = true;
      gi.n = left;
    }
    // pick items from belts under/around the player
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const e = GF.Ent.at(Math.floor(p.x) + dx, Math.floor(p.y) + dy);
      if (e && e.items && e.items.length && p.inv.room(e.items[0].id) > 0) {
        const it = e.items.shift(); p.inv.add(it.id, 1); got = true;
      }
    }
    if (got) { G.groundItems = G.groundItems.filter((g) => g.n > 0); GF.Audio.play('pickup'); }
  };

  /* ------------------------------ vehicles ------------------------------ */
  Player.createVehicle = function (x, y, d) {
    d = d || {};
    return {
      x, y, ang: d.ang || -Math.PI / 2, speed: 0, hp: d.hp || 450, maxHp: 450,
      fuel: d.fuel || null, burn: d.burn || 0, inv: GF.Inventory.from(d.inv, 20), driver: null,
    };
  };
  Player.saveVehicle = (v) => ({ x: +v.x.toFixed(2), y: +v.y.toFixed(2), ang: +v.ang.toFixed(2), hp: v.hp, fuel: v.fuel, burn: Math.round(v.burn), inv: v.inv.toJSON() });

  Player.drive = function (p, v, dt, mx, my) {
    const throttle = -my; // W = forward
    const steer = mx;
    const power = 250e3;
    let has = v.burn > 0;
    if (!has && v.fuel && v.fuel.n > 0) {
      v.burn += GF.ITEMS[v.fuel.id].fuel; v.fuel.n--; if (v.fuel.n <= 0) v.fuel = null; has = true;
    }
    if (throttle !== 0 && has) {
      v.speed += throttle * 9 * dt;
      v.burn -= power * Math.abs(throttle) * dt;
    } else if (throttle !== 0 && !has) {
      if (!v._warned) { GF.UI.toast('Køretøjet mangler brændsel (åbn det med venstreklik)', 'warn'); v._warned = true; }
    }
    v.speed *= Math.pow(0.35, dt); // friction
    v.speed = U.clamp(v.speed, -4, 14);
    if (Math.abs(v.speed) > 0.2) v.ang += steer * dt * 2.4 * Math.sign(v.speed) * Math.min(1, Math.abs(v.speed) / 4);
    const nx = v.x + Math.cos(v.ang) * v.speed * dt, ny = v.y + Math.sin(v.ang) * v.speed * dt;
    if (blocked(nx, ny, 0.5)) {
      if (Math.abs(v.speed) > 6) { v.hp -= Math.abs(v.speed) * 3; GF.Render.shake(3); GF.Audio.play('build', { vol: 0.5 }); }
      v.speed = -v.speed * 0.3;
    } else { v.x = nx; v.y = ny; }
    // ram enemies
    if (Math.abs(v.speed) > 3) GF.Enemies.query(v.x, v.y, 1).forEach((u) => GF.Combat.damageUnit(u, Math.abs(v.speed) * 8 * dt * 10, 0));
    p.x = v.x; p.y = v.y; p.face = v.ang;
    p.moving = Math.abs(v.speed) > 0.3;
    GF.Render.cam.follow = true;
    if (v.hp <= 0) {
      GF.Combat.explode(v.x, v.y, 2.5, 40, 'player');
      GF.Game.vehicles.splice(GF.Game.vehicles.indexOf(v), 1);
      p.vehicle = null;
      GF.UI.toast('Køretøjet blev ødelagt', 'bad');
    }
  };

  Player.toggleVehicle = function (p) {
    if (p.vehicle) {
      const v = p.vehicle;
      v.driver = null; p.vehicle = null; v.speed = 0;
      const f = GF.World.findFree(v.x + Math.cos(v.ang + Math.PI / 2) * 1.2, v.y + Math.sin(v.ang + Math.PI / 2) * 1.2, 6);
      p.x = f.x; p.y = f.y;
      return true;
    }
    const v = GF.Game.vehicles.find((c) => U.dist(c.x, c.y, p.x, p.y) < 2.5);
    if (v) { p.vehicle = v; v.driver = p; GF.Audio.play('click'); return true; }
    return false;
  };

  GF.Player = Player;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — input.js
 * Keyboard / mouse state with rebindable actions (see settings.js).
 * ===================================================================== */
'use strict';
(function (GF) {
  const I = {
    keys: new Set(), pressed: new Set(),
    mouse: { sx: 0, sy: 0, wx: 0, wy: 0, left: false, right: false, inWorld: false, lp: false, rp: false, lr: false, rr: false, wheel: 0 },
    capture: null,
  };

  const typingTarget = (t) => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);

  I.init = function (canvas) {
    window.addEventListener('keydown', (ev) => {
      if (I.capture) { ev.preventDefault(); const fn = I.capture; I.capture = null; fn(ev.code); return; }
      if (typingTarget(ev.target) && ev.code !== 'Escape') return;
      if (['Tab', 'Space', 'F3', 'AltLeft', 'AltRight', 'ArrowUp', 'ArrowDown'].includes(ev.code) && GF.Game.running) ev.preventDefault();
      if (!I.keys.has(ev.code)) I.pressed.add(ev.code);
      I.keys.add(ev.code);
      GF.Audio.unlock();
    });
    window.addEventListener('keyup', (ev) => { I.keys.delete(ev.code); });
    window.addEventListener('blur', () => { I.keys.clear(); I.mouse.left = I.mouse.right = false; });

    canvas.addEventListener('mousemove', (ev) => { I.mouse.sx = ev.clientX; I.mouse.sy = ev.clientY; I.mouse.inWorld = true; });
    canvas.addEventListener('mouseenter', () => { I.mouse.inWorld = true; });
    canvas.addEventListener('mouseleave', () => { I.mouse.inWorld = false; });
    canvas.addEventListener('mousedown', (ev) => {
      GF.Audio.unlock();
      I.mouse.sx = ev.clientX; I.mouse.sy = ev.clientY; I.mouse.inWorld = true;
      if (ev.button === 0) { I.mouse.left = true; I.mouse.lp = true; }
      if (ev.button === 2) { I.mouse.right = true; I.mouse.rp = true; }
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    });
    window.addEventListener('mouseup', (ev) => {
      if (ev.button === 0) { if (I.mouse.left) I.mouse.lr = true; I.mouse.left = false; }
      if (ev.button === 2) { if (I.mouse.right) I.mouse.rr = true; I.mouse.right = false; }
    });
    canvas.addEventListener('contextmenu', (ev) => ev.preventDefault());
    canvas.addEventListener('wheel', (ev) => { ev.preventDefault(); I.mouse.wheel += Math.sign(ev.deltaY); }, { passive: false });
  };

  I.bind = (action) => GF.Settings.get('binds')[action];
  I.down = (action) => I.keys.has(I.bind(action));
  I.hit = (action) => I.pressed.has(I.bind(action));
  I.key = (code) => I.keys.has(code);
  I.keyHit = (code) => I.pressed.has(code);
  I.ctrl = () => I.keys.has('ControlLeft') || I.keys.has('ControlRight');
  I.shift = () => I.keys.has('ShiftLeft') || I.keys.has('ShiftRight');

  /** called once per rendered frame after all consumers ran */
  I.endFrame = function () {
    I.pressed.clear();
    I.mouse.lp = I.mouse.rp = I.mouse.lr = I.mouse.rr = false;
    I.mouse.wheel = 0;
  };
  I.updateWorld = function () {
    const w = GF.Render.s2w(I.mouse.sx, I.mouse.sy);
    I.mouse.wx = w.x; I.mouse.wy = w.y;
  };

  GF.Input = I;
})(window.GF);

</script>
<script>
/* =====================================================================
 * GREJS FACTORY — build.js
 * Everything the mouse does in the world: build mode with ghost
 * preview and drag-placement, rotation, pipette, manual mining,
 * removing buildings, repairing, shooting, blueprints and the
 * deconstruction planner — plus the world overlays for these tools.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const B = {
    hand: null,           // {mode:'build'|'blueprint'|'bpselect'|'decon'|'repair', item, bp, start}
    dir: 0,
    hover: { tx: 0, ty: 0, ent: null, ghost: null },
    mining: null,         // {tx,ty,t,T,kind:'tile'|'ent', ent}
    drag: null,           // {lx,ly, placed:e}
    _errT: 0, cursorMsg: '', cursorOk: true,
  };

  B.reset = function () { B.hand = null; B.mining = null; B.drag = null; B.dir = 0; };

  /** select an item for building (from hotbar / inventory / build menu) */
  B.select = function (item) {
    const it = GF.ITEMS[item];
    if (!it) return;
    if (it.place || it.vehicle) { B.hand = { mode: 'build', item }; GF.Audio.play('click'); return; }
    if (item === 'repair_pack') { B.hand = { mode: 'repair', item }; return; }
    if (it.weapon) { GF.player.weapon = item; GF.UI.toast('Våben valgt: ' + it.name, 'info'); }
  };
  B.clear = function () { B.hand = null; B.drag = null; };

  /** top-left tile for placing type centred at mouse */
  function placePos(type, dir, wx, wy) {
    const { w, h } = GF.Ent.size(type, dir);
    return { x: Math.floor(wx - w / 2 + 0.5), y: Math.floor(wy - h / 2 + 0.5), w, h };
  }
  B.placePos = placePos;

  function err(msg) {
    if (B._errT > 0) return;
    B._errT = 0.6;
    GF.UI.toast(msg, 'warn');
    GF.Audio.play('error');
  }

  function reachOk(x, y, w, h) {
    const p = GF.player;
    return U.dist(p.x, p.y, x + w / 2, y + h / 2) <= p.reach;
  }

  /** attempt to place building / ghost. Returns entity, ghost or null */
  B.tryPlace = function (type, x, y, dir, forceGhost) {
    const p = GF.player;
    const def = GF.DEFS[type];
    if (GF.ITEMS[type] && GF.ITEMS[type].vehicle) {
      if (p.inv.count(type) <= 0) return null;
      if (GF.blockedCircle(x + 0.5, y + 0.5, 0.5)) { err('Ikke plads til køretøjet'); return null; }
      p.inv.remove(type, 1);
      GF.Game.vehicles.push(GF.Player.createVehicle(x + 0.5, y + 0.5));
      GF.Audio.play('build');
      return true;
    }
    if (!def) return null;
    const { w, h } = GF.Ent.size(type, dir);
    if (forceGhost || p.inv.count(type) <= 0) {
      const g = GF.Logistics.addGhost(type, x, y, dir);
      if (g) GF.Audio.play('rotate');
      return g;
    }
    if (!reachOk(x, y, w, h)) { err('For langt væk'); return null; }
    const chk = GF.Ent.canPlace(type, x, y, dir);
    if (!chk.ok) { err(chk.reason); return null; }
    if (chk.replace) {
      const o = chk.replace;
      if (o.type === type) {
        if (o.dir === dir) return null;
        // rotate in place
        o.dir = dir;
        GF.Belts.reshapeAround(o);
        GF.Audio.play('rotate');
        return o;
      }
      const items = (o.items || []).slice();
      GF.Ent.remove(o, { inv: p.inv }).forEach((it) => GF.Game.dropItem(o.x + 0.5, o.y + 0.5, it.id, it.n));
    }
    p.inv.remove(type, 1);
    const e = GF.Ent.place(type, x, y, dir);
    if (!e) return null;
    GF.Logistics.clearGhostsIn(x, y, e.w, e.h);
    GF.Progress.stat('buildingsBuilt', 1);
    GF.Audio.play('build', { x: x + w / 2, y: y + h / 2 });
    GF.Particles.emit('dust', x + w / 2, y + h / 2, 4 + w * 2);
    return e;
  };

  /** rotate an existing entity under the cursor */
  function rotateEntity(e, rev) {
    if (!e.def.rot) return;
    if (e.w !== e.h) return; // non-square rotation would change footprint
    e.dir = (e.dir + (rev ? 3 : 1)) % 4;
    if (e.kind === 'ug') { e.pair && (e.pair.pair = null); e.pair = null; }
    if (GF.Belts.isBeltFamily(e)) GF.Belts.reshapeAround(e);
    if (e.def.fluidBox) GF.Fluids.dirty = true;
    if (e.kind === 'drill') e.tiles = null;
    GF.Audio.play('rotate');
  }

  /** start/continue removing a building (right mouse hold) */
  function removeTick(e, dt) {
    const m = B.mining;
    if (!m || m.kind !== 'ent' || m.ent !== e) {
      B.mining = { kind: 'ent', ent: e, t: 0, T: 0.25 + Math.min(1.5, e.maxHp / 1500), tx: e.x, ty: e.y };
      return;
    }
    m.t += dt;
    if (m.t >= m.T) {
      const p = GF.player;
      const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
      GF.Ent.remove(e, { inv: p.inv }).forEach((it) => GF.Game.dropItem(cx, cy, it.id, it.n));
      GF.Audio.play('remove', { x: cx, y: cy });
      GF.Particles.emit('dust', cx, cy, 6);
      B.mining = null;
    }
  }

  function mineTick(tx, ty, dt) {
    const info = GF.World.mineInfo(tx, ty);
    if (!info) { B.mining = null; return; }
    const m = B.mining;
    if (!m || m.kind !== 'tile' || m.tx !== tx || m.ty !== ty) {
      B.mining = { kind: 'tile', tx, ty, t: 0, T: info.time, info };
      return;
    }
    m.t += dt;
    if (Math.random() < dt * 10) GF.Particles.emit('dust', tx + 0.5, ty + 0.5, 1, { color: info.kind === 'deco' ? '#6a4a2a' : GF.World.ORE_COLORS[GF.World.ORE_INDEX[info.id]] });
    if (m.t >= m.T) {
      const p = GF.player;
      m.t = 0;
      if (info.kind === 'deco') {
        const drop = GF.World.removeDeco(tx, ty);
        if (drop) { p.giveOrDrop(drop.id, drop.n); GF.Progress.record('produce', drop.id, drop.n, 'hand-mine'); }
        GF.Audio.play('chop', { x: tx, y: ty });
        B.mining = null;
      } else {
        const id = GF.World.takeOre(tx, ty, 1);
        if (id) {
          p.giveOrDrop(id, 1);
          GF.Progress.record('produce', id, 1, 'hand-mine');
          GF.Progress.stat('itemsMined', 1);
          GF.Audio.play('mine', { x: tx, y: ty });
        }
      }
    }
  }

  /** line of tiles (4-connected) from a to b, excluding a */
  function lineTiles(ax, ay, bx, by) {
    const out = [];
    let x = ax, y = ay;
    let guard = 0;
    while ((x !== bx || y !== by) && guard++ < 200) {
      const dx = bx - x, dy = by - y;
      if (Math.abs(dx) >= Math.abs(dy)) x += Math.sign(dx); else y += Math.sign(dy);
      out.push([x, y]);
    }
    return out;
  }
  const dirOf = (dx, dy) => (dx > 0 ? 1 : dx < 0 ? 3 : dy > 0 ? 2 : 0);

  /* ------------------------------ update ------------------------------ */
  B.update = function (dt) {
    const I = GF.Input, p = GF.player, m = I.mouse;
    B._errT = Math.max(0, B._errT - dt);
    I.updateWorld();
    const tx = Math.floor(m.wx), ty = Math.floor(m.wy);
    const hv = B.hover;
    hv.tx = tx; hv.ty = ty;
    hv.ent = m.inWorld ? GF.Ent.at(tx, ty) : null;
    hv.ghost = m.inWorld ? GF.Logistics.ghostAt(tx, ty) : null;
    hv.veh = m.inWorld ? GF.Game.vehicles.find((v) => U.dist(v.x, v.y, m.wx, m.wy) < 0.8) : null;
    // zoom
    if (m.wheel && m.inWorld) {
      const cam = GF.Render.cam;
      cam.tz = U.clamp(cam.tz * Math.pow(0.87, m.wheel), GF.Settings.get('maxZoomOut'), 2.6);
    }
    if (p.dead || GF.UI.typing()) return;
    const hand = B.hand;
    // ----- keys -----
    if (I.hit('rotate')) {
      if (hand && hand.mode === 'build') { B.dir = (B.dir + (I.shift() ? 3 : 1)) % 4; GF.Audio.play('rotate'); }
      else if (hand && hand.mode === 'blueprint') { hand.bp = GF.Logistics.rotateBp(hand.bp); GF.Audio.play('rotate'); }
      else if (hv.ent && !hv.ent.def.enemy) rotateEntity(hv.ent, I.shift());
    }
    if (I.hit('pipette')) {
      if (hand) B.clear();
      else if (hv.ent && !hv.ent.def.enemy) { B.hand = { mode: 'build', item: hv.ent.type }; B.dir = hv.ent.dir; GF.Audio.play('click'); }
    }
    if (I.hit('decon')) { B.hand = hand && hand.mode === 'decon' ? null : { mode: 'decon' }; GF.UI.toast(B.hand ? 'Nedrivningsværktøj: træk et område for at markere (Shift = fjern markering)' : 'Nedrivningsværktøj slået fra', 'info'); }
    if (I.hit('drop') && hand && hand.mode === 'build' && p.inv.count(hand.item) > 0 && m.inWorld) {
      const t = GF.Ent.at(tx, ty);
      const TK = t && GF.Kinds[t.kind];
      if (t && GF.Belts.isBeltFamily(t)) { if (GF.Belts.drop(t, hand.item)) p.inv.remove(hand.item, 1); }
      else if (TK && TK.insert) { if (TK.insert(t, hand.item, 1, false) > 0) p.inv.remove(hand.item, 1); }
      else { p.inv.remove(hand.item, 1); GF.Game.dropItem(m.wx, m.wy, hand.item, 1); }
    }
    if (I.hit('weapon')) {
      const ws = GF.Combat.weaponsOf(p.inv);
      if (ws.length) { const i = ws.indexOf(p.weapon); p.weapon = ws[(i + 1) % ws.length]; p.mag = 0; GF.UI.toast('Våben: ' + GF.itemName(p.weapon), 'info'); }
    }
    if (I.hit('interact')) {
      if (p.vehicle || (!hv.ent && GF.Game.vehicles.some((v) => U.dist(v.x, v.y, p.x, p.y) < 2.5))) GF.Player.toggleVehicle(p);
      else if (hv.ent && !hv.ent.def.enemy) GF.UI.openEntity(hv.ent);
      else if (hv.veh) GF.UI.openVehicle(hv.veh);
    }
    // shooting (space / attack)
    let firing = false;
    if (I.down('shoot') && p.weapon) {
      let tgt = { x: m.wx, y: m.wy };
      if (!m.inWorld) { const us = GF.Enemies.query(p.x, p.y, 16); if (us.length) tgt = us[0]; }
      firing = GF.Combat.playerFire(p, tgt.x, tgt.y);
    }
    if (p.vehicle) return;

    // ----- mouse -----
    if (!m.inWorld) { if (!m.left && !m.right) B.mining = null; B.drag = null; return; }
    if (m.rp && hand && hand.mode !== 'decon' && hand.mode !== 'bpselect') { B.clear(); return; }
    if (hand && hand.mode === 'build') {
      const type = hand.item;
      const pp = placePos(type, B.dir, m.wx, m.wy);
      if (m.lp) {
        B.drag = { lx: pp.x, ly: pp.y };
        const r = B.tryPlace(type, pp.x, pp.y, B.dir, I.shift());
        B.drag.placed = r && r.id ? r : null;
      } else if (m.left && B.drag && (pp.x !== B.drag.lx || pp.y !== B.drag.ly)) {
        const def = GF.DEFS[type];
        const linear = def && def.w === 1 && def.h === 1;
        if (linear) {
          const tiles = lineTiles(B.drag.lx, B.drag.ly, pp.x, pp.y);
          for (const [x, y] of tiles) {
            const nd = dirOf(x - B.drag.lx, y - B.drag.ly);
            if (def.kind === 'belt') {
              B.dir = nd;
              const last = B.drag.placed;
              if (last && !last.dead && last.kind === 'belt' && last.dir !== nd) { last.dir = nd; GF.Belts.reshapeAround(last); }
            }
            const r = B.tryPlace(type, x, y, B.dir, I.shift());
            B.drag.placed = r && r.id ? r : null;
            B.drag.lx = x; B.drag.ly = y;
          }
        } else if (Math.abs(pp.x - B.drag.lx) >= pp.w || Math.abs(pp.y - B.drag.ly) >= pp.h) {
          B.tryPlace(type, pp.x, pp.y, B.dir, I.shift());
          B.drag.lx = pp.x; B.drag.ly = pp.y;
        }
      }
      if (!m.left) B.drag = null;
      if (p.inv.count(type) <= 0 && !GF.Craft.recipeFor(type) && !GF.Logistics.nets.length) {
        // nothing left: keep hand for ghosts only if roboports exist
      }
      return;
    }
    if (hand && hand.mode === 'blueprint') {
      if (m.lp) {
        const bp = hand.bp;
        const x = Math.floor(m.wx - bp.w / 2 + 0.5), y = Math.floor(m.wy - bp.h / 2 + 0.5);
        const n = GF.Logistics.placeBlueprint(bp, x, y);
        GF.UI.toast(n + ' spøgelser placeret' + (GF.Logistics.nets.length ? ' – byggedroner bygger dem' : ' – klik på dem for at bygge selv'), 'info');
        GF.Audio.play('build', { vol: 0.5 });
      }
      return;
    }
    if (hand && (hand.mode === 'bpselect' || hand.mode === 'decon')) {
      if (m.lp) hand.start = { x: tx, y: ty };
      if (m.rp) { B.clear(); return; }
      if (m.lr && hand.start) {
        const x0 = Math.min(hand.start.x, tx), y0 = Math.min(hand.start.y, ty), x1 = Math.max(hand.start.x, tx), y1 = Math.max(hand.start.y, ty);
        hand.start = null;
        if (hand.mode === 'bpselect') {
          const ents = GF.Ent.inRect(x0, y0, x1, y1).filter((e) => !e.def.enemy);
          if (!ents.length) { GF.UI.toast('Ingen bygninger i området', 'warn'); return; }
          GF.UI.prompt('Navn på byggeplan', 'Byggeplan ' + (GF.Logistics.blueprints.length + 1), (name) => {
            const bp = GF.Logistics.capture(x0, y0, x1, y1, name);
            if (bp) { GF.UI.toast('Byggeplan "' + bp.name + '" gemt (' + bp.ents.length + ' bygninger)', 'good'); B.hand = { mode: 'blueprint', bp }; }
          });
          B.hand = null;
        } else {
          let n = 0;
          GF.Ent.inRect(x0, y0, x1, y1).forEach((e) => { if (!e.def.enemy) { e.decon = !I.shift(); e.deconAssigned = false; n++; } });
          for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const g = GF.Logistics.ghostAt(x, y); if (g && !I.shift()) GF.Logistics.removeGhost(g); }
          GF.UI.toast(I.shift() ? 'Markering fjernet' : n + ' bygninger markeret til nedrivning', 'info');
        }
      }
      return;
    }
    if (hand && hand.mode === 'repair') {
      const e = hv.ent;
      if (m.left && e && !e.def.enemy && e.hp < e.maxHp && p.inv.count('repair_pack') > 0) {
        const heal = 70 * dt;
        e.hp = Math.min(e.maxHp, e.hp + heal);
        B.repairAcc = (B.repairAcc || 0) + heal;
        if (B.repairAcc >= GF.ITEMS.repair_pack.repair) { B.repairAcc = 0; p.inv.remove('repair_pack', 1); }
        if (Math.random() < dt * 8) GF.Particles.emit('spark', e.x + e.w / 2, e.y + e.h / 2, 1, { color: '#9f9' });
      }
      if (p.inv.count('repair_pack') <= 0) B.clear();
      return;
    }

    // ----- no tool in hand -----
    if (m.lp) {
      if (hv.ghost && !hv.ent) {
        const g = hv.ghost;
        if (p.inv.count(g.type) > 0 && reachOk(g.x, g.y, g.w, g.h) && GF.Ent.canPlace(g.type, g.x, g.y, g.dir).ok) {
          p.inv.remove(g.type, 1);
          GF.Logistics.removeGhost(g);
          GF.Logistics.buildFromGhost(g);
          GF.Audio.play('build');
        } else if (p.inv.count(g.type) <= 0) err('Du har ingen ' + GF.itemName(g.type));
        return;
      }
      const enemyNear = GF.Enemies.query(m.wx, m.wy, 1.5).length > 0 || (hv.ent && hv.ent.def.enemy);
      if (enemyNear && p.weapon) { B.attacking = true; }
      else if (hv.ent) { GF.UI.openEntity(hv.ent); return; }
      else if (hv.veh) { GF.UI.openVehicle(hv.veh); return; }
    }
    if (!m.left) B.attacking = false;
    if (B.attacking && m.left && !firing) GF.Combat.playerFire(p, m.wx, m.wy);
    // mining with left mouse (or E) on resources
    const wantMine = (m.left && !B.attacking && !hv.ent) || (I.down('interact') && !hv.ent);
    if (wantMine) {
      if (U.dist(p.x, p.y, tx + 0.5, ty + 0.5) > p.mineReach + 0.7) { if (GF.World.mineInfo(tx, ty) && m.lp) err('For langt væk – gå tættere på'); B.mining = null; }
      else mineTick(tx, ty, dt);
    } else if (m.right && hv.ent && !hv.ent.def.enemy) {
      if (!reachOk(hv.ent.x, hv.ent.y, hv.ent.w, hv.ent.h)) { err('For langt væk'); B.mining = null; }
      else removeTick(hv.ent, dt);
    } else if (m.rp && hv.ghost) {
      GF.Logistics.removeGhost(hv.ghost);
    } else if (m.rp && hv.veh && U.dist(p.x, p.y, hv.veh.x, hv.veh.y) < 6) {
      const v = hv.veh;
      p.giveOrDrop('buggy', 1);
      v.inv.list().forEach((it) => p.giveOrDrop(it.id, it.n));
      if (v.fuel) p.giveOrDrop(v.fuel.id, v.fuel.n);
      GF.Game.vehicles.splice(GF.Game.vehicles.indexOf(v), 1);
      GF.Audio.play('remove');
    } else B.mining = null;
  };

  /* ------------------------------ overlays ------------------------------ */
  function rectPx(ctx, x, y, w, h, s, fill, stroke) {
    const X = GF.Render.w2sx(x), Y = GF.Render.w2sy(y);
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(X, Y, w * s, h * s); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.strokeRect(X + 0.5, Y + 0.5, w * s - 1, h * s - 1); }
  }
  function ringPx(ctx, x, y, r, s, col, fill) {
    ctx.beginPath(); ctx.arc(GF.Render.w2sx(x), GF.Render.w2sy(y), r * s, 0, 6.283);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }

  }
  function progressRing(ctx, x, y, k, s) {
    const X = GF.Render.w2sx(x), Y = GF.Render.w2sy(y);

  }
  function corners(ctx, e, s, col) {
    const X = GF.Render.w2sx(e.x), Y = GF.Render.w2sy(e.y), W = e.w * s, H = e.h * s, L = Math.min(10, W / 3);
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();

    ctx.moveTo(X + W - L, Y); ctx.lineTo(X + W, Y); ctx.lineTo(X + W, Y + L);
    ctx.moveTo(X + W, Y + H - L); ctx.lineTo(X + W, Y + H); ctx.lineTo(X + W - L, Y + H);

    ctx.stroke();
  }

  function drawPowerAreas(ctx, s, v) {
    GF.Ent.forChunks(Math.floor((v.x0 - 10) / 32), Math.floor((v.y0 - 10) / 32), Math.floor(v.x1 / 32), Math.floor(v.y1 / 32), (e) => {
      if (e.kind !== 'pole') return;
      const r = GF.Power.supplyRect(e);
      rectPx(ctx, r.x0, r.y0, r.x1 - r.x0 + 1, r.y1 - r.y0 + 1, s, 'rgba(80,160,255,.10)', 'rgba(80,160,255,.35)');
    });
  }

  B.drawOverlays = function (ctx, s, v) {
    const R = GF.Render, m = GF.Input.mouse, hand = B.hand, hv = B.hover, p = GF.player;
    ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
    // ghosts
    for (const g of GF.Logistics.ghosts.values()) {
      if (g.x > v.x1 || g.y > v.y1 || g.x + g.w < v.x0 || g.y + g.h < v.y0) continue;
      GF.Sprites.drawGhost(ctx, g.type, g.x, g.y, g.dir, R.w2sx(g.x), R.w2sy(g.y), s, g.missing ? '#ff9a3c' : '#4aa8ff', 0.45);
    }
    const showPower = (hand && hand.mode === 'build' && GF.DEFS[hand.item] && GF.Power.isElectric(GF.DEFS[hand.item])) ||
      (hand && hand.mode === 'build' && GF.DEFS[hand.item] && GF.DEFS[hand.item].kind === 'pole') || GF.UI.isOpen('power');
    if (showPower) drawPowerAreas(ctx, s, v);
    // roboport areas
    if (hand && hand.mode === 'build' && GF.DEFS[hand.item] && (GF.DEFS[hand.item].kind === 'roboport' || GF.DEFS[hand.item].logi)) {
      for (const n of GF.Logistics.nets) for (const pt of n.ports) {
        const cx = pt.x + pt.w / 2, cy = pt.y + pt.h / 2;
        rectPx(ctx, cx - 50, cy - 50, 100, 100, s, 'rgba(80,255,160,.04)', 'rgba(80,255,160,.3)');
        rectPx(ctx, cx - 25, cy - 25, 50, 50, s, 'rgba(255,200,80,.06)', 'rgba(255,200,80,.4)');
      }
    }
    B.cursorMsg = '';
    if (m.inWorld && p && !p.dead) {
      if (hand && hand.mode === 'build') {
        const type = hand.item;
        if (GF.DEFS[type]) {
          const pp = placePos(type, B.dir, m.wx, m.wy);
          const d = GF.DEFS[type];
          const have = p.inv.count(type);
          const chk = GF.Ent.canPlace(type, pp.x, pp.y, B.dir);
          const inReach = reachOk(pp.x, pp.y, pp.w, pp.h);
          let ok = chk.ok && inReach;
          let tint = ok ? '#4dff7a' : '#ff4040';
          if (have <= 0) { tint = '#4aa8ff'; B.cursorMsg = 'Spøgelse (du har ingen)'; ok = GF.Logistics.canGhost(type, pp.x, pp.y, B.dir); }
          else if (!chk.ok) B.cursorMsg = chk.reason;
          else if (!inReach) B.cursorMsg = 'For langt væk';
          // extra previews
          if (d.kind === 'drill') rectPx(ctx, pp.x - d.area, pp.y - d.area, pp.w + d.area * 2, pp.h + d.area * 2, s, 'rgba(255,210,80,.10)', 'rgba(255,210,80,.5)');
          if (d.kind === 'pole') { const sp = d.supply; rectPx(ctx, pp.x - sp, pp.y - sp, pp.w + sp * 2, pp.h + sp * 2, s, 'rgba(80,160,255,.18)', 'rgba(120,190,255,.8)'); ringPx(ctx, pp.x + pp.w / 2, pp.y + pp.h / 2, d.wire, s, 'rgba(255,255,255,.25)'); }
          if (d.kind === 'turret') ringPx(ctx, pp.x + pp.w / 2, pp.y + pp.h / 2, d.range, s, 'rgba(255,90,90,.6)', 'rgba(255,60,60,.05)');
          if (d.kind === 'radar') rectPx(ctx, (Math.floor((pp.x + 1) / 32) - 3) * 32, (Math.floor((pp.y + 1) / 32) - 3) * 32, 224, 224, s, null, 'rgba(120,255,160,.4)');
          if (d.kind === 'inserter') {
            const vv = U.DIRS[B.dir], r = d.reach;
            rectPx(ctx, pp.x - vv.x * r, pp.y - vv.y * r, 1, 1, s, 'rgba(255,200,80,.2)', 'rgba(255,200,80,.7)');
            rectPx(ctx, pp.x + vv.x * r, pp.y + vv.y * r, 1, 1, s, 'rgba(80,255,120,.2)', 'rgba(80,255,120,.7)');
          }
          if (GF.Power.isElectric(d) && d.kind !== 'pole' && have > 0 && !GF.Power.polesCovering(pp.x, pp.y, pp.w, pp.h).length) B.cursorMsg = B.cursorMsg || 'Advarsel: ingen strøm her';
          GF.Sprites.drawGhost(ctx, type, pp.x, pp.y, B.dir, R.w2sx(pp.x), R.w2sy(pp.y), s, tint, 0.6);
        } else if (GF.ITEMS[type] && GF.ITEMS[type].vehicle) {
          ringPx(ctx, Math.floor(m.wx) + 0.5, Math.floor(m.wy) + 0.5, 0.7, s, '#4dff7a');
        }
      } else if (hand && hand.mode === 'blueprint') {
        const bp = hand.bp;
        const x = Math.floor(m.wx - bp.w / 2 + 0.5), y = Math.floor(m.wy - bp.h / 2 + 0.5);
        bp.ents.forEach((en) => {
          if (!GF.DEFS[en.t]) return;
          const ok = GF.Logistics.canGhost(en.t, x + en.dx, y + en.dy, en.d);
          GF.Sprites.drawGhost(ctx, en.t, x + en.dx, y + en.dy, en.d, R.w2sx(x + en.dx), R.w2sy(y + en.dy), s, ok ? '#4aa8ff' : '#ff4040', 0.5);
        });
        B.cursorMsg = 'Byggeplan: ' + bp.name + ' (R roterer)';
      } else if (hand && (hand.mode === 'bpselect' || hand.mode === 'decon')) {
        const col = hand.mode === 'decon' ? 'rgba(255,60,60,' : 'rgba(80,170,255,';
        if (hand.start && m.left) {
          const x0 = Math.min(hand.start.x, hv.tx), y0 = Math.min(hand.start.y, hv.ty);
          const x1 = Math.max(hand.start.x, hv.tx), y1 = Math.max(hand.start.y, hv.ty);
          rectPx(ctx, x0, y0, x1 - x0 + 1, y1 - y0 + 1, s, col + '.12)', col + '.9)');
          GF.Ent.inRect(x0, y0, x1, y1).forEach((e) => { if (!e.def.enemy) corners(ctx, e, s, col + '.9)'); });
        } else rectPx(ctx, hv.tx, hv.ty, 1, 1, s, null, col + '.8)');
        B.cursorMsg = hand.mode === 'decon' ? 'Nedrivning: træk et område' : 'Byggeplan: træk et område';
      } else if (hand && hand.mode === 'repair') {
        B.cursorMsg = 'Reparation: hold venstre knap på beskadigede bygninger';
        if (hv.ent) corners(ctx, hv.ent, s, '#9f9');
      } else {
        // hover highlight
        if (hv.ent) {
          const e = hv.ent;
          corners(ctx, e, s, e.def.enemy ? '#f55' : 'rgba(255,255,255,.9)');
          if (e.kind === 'turret') ringPx(ctx, e.x + e.w / 2, e.y + e.h / 2, e.def.range, s, 'rgba(255,90,90,.45)');
          if (e.kind === 'drill') rectPx(ctx, e.x - e.def.area, e.y - e.def.area, e.w + e.def.area * 2, e.h + e.def.area * 2, s, null, 'rgba(255,210,80,.4)');
          if (e.kind === 'inserter') {
            const pts = GF.Kinds.inserter.endpoints(e);
            rectPx(ctx, pts.sx, pts.sy, 1, 1, s, null, 'rgba(255,200,80,.7)');
            rectPx(ctx, pts.tx, pts.ty, 1, 1, s, null, 'rgba(80,255,120,.7)');
          }
          if (e.kind === 'pole') { const r = GF.Power.supplyRect(e); rectPx(ctx, r.x0, r.y0, r.x1 - r.x0 + 1, r.y1 - r.y0 + 1, s, 'rgba(80,160,255,.12)', 'rgba(120,190,255,.6)'); }
        } else if (hv.ghost) {
          corners(ctx, hv.ghost, s, '#4aa8ff');
          B.cursorMsg = 'Spøgelse: ' + GF.DEFS[hv.ghost.type].name + ' (klik = byg, højreklik = fjern)';
        } else {
          const info = GF.World.mineInfo(hv.tx, hv.ty);
          if (info) {
            const far = U.dist(p.x, p.y, hv.tx + 0.5, hv.ty + 0.5) > p.mineReach + 0.7;
            rectPx(ctx, hv.tx, hv.ty, 1, 1, s, null, far ? 'rgba(255,80,80,.7)' : 'rgba(255,255,255,.7)');
            const o = GF.World.ore(hv.tx, hv.ty);
            B.cursorMsg = GF.itemName(info.id) + (o && info.kind === 'ore' ? ' (' + U.fmt(o.amount) + ')' : '') + (far ? ' – for langt væk' : ' – hold venstre knap for at mine');
          } else {
            const o = GF.World.ore(hv.tx, hv.ty);
            if (o && o.type === 'crude') B.cursorMsg = 'Oliekilde (' + o.amount + '% ydelse)';
          }
        }
      }
      // progress rings
      const mm = B.mining;
      if (mm) {
        if (mm.kind === 'tile') progressRing(ctx, mm.tx + 0.5, mm.ty + 0.5, mm.t / mm.T, s);
        else if (mm.ent && !mm.ent.dead) progressRing(ctx, mm.ent.x + mm.ent.w / 2, mm.ent.y + mm.ent.h / 2, mm.t / mm.T, s);
      }
      if (B.cursorMsg) {
        ctx.font = '600 12px Rajdhani, "Segoe UI", sans-serif';
        const tw = ctx.measureText(B.cursorMsg).width;
        const X = m.sx + 18, Y = m.sy + 22;
        ctx.fillStyle = 'rgba(12,16,22,.85)'; ctx.fillRect(X - 6, Y - 13, tw + 12, 19);
        ctx.fillStyle = '#e8eef5'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(B.cursorMsg, X, Y);
      }
    }
  };

<script>
/* =====================================================================
 * GREJS FACTORY — audio.js
 * All sounds are synthesised live with the Web Audio API (no samples),
 * plus a small generative ambient music loop and factory ambience.
 * ===================================================================== */
'use strict';
(function (GF) {
  const U = GF.U;
  const A = { ctx: null, ready: false, master: null, sfx: null, music: null, noiseBuf: null, amb: null, _aT: 0, _mT: 0, bar: 0, last: {} };

  A.unlock = function () {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      A.ctx = new AC();
      A.master = A.ctx.createGain(); A.master.connect(A.ctx.destination);
      A.sfx = A.ctx.createGain(); A.sfx.connect(A.master);
      A.music = A.ctx.createGain(); A.music.connect(A.master);
      // shared white noise buffer
      const len = A.ctx.sampleRate * 2;
      A.noiseBuf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
      const d = A.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      A.setVolumes();
      A.startAmbience();
      A.ready = true;
    } catch (e) { console.warn('audio unavailable', e); }
  };

  A.setVolumes = function () {
    if (!A.ctx) return;
    const S = GF.Settings;
    A.master.gain.value = S.get('master');
    A.sfx.gain.value = S.get('sfx');
    A.music.gain.value = S.get('music') * 0.5;
  };
  GF.bus.on('settings', () => A.setVolumes());

  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function osc(type, f0, f1, dur, vol, out, delay) {
    const c = A.ctx, t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, 0.005, vol, dur);
    o.connect(g); g.connect(out || A.sfx);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, filterType, freq, q, out, delay, f1) {
    const c = A.ctx, t = c.currentTime + (delay || 0);
    const s = c.createBufferSource(); s.buffer = A.noiseBuf;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = c.createBiquadFilter(); f.type = filterType; f.frequency.setValueAtTime(freq, t); f.Q.value = q || 1;
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); env(g, t, 0.004, vol, dur);
    s.connect(f); f.connect(g); g.connect(out || A.sfx);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  const SFX = {
    click: (v) => osc('sine', 900, 700, 0.05, 0.12 * v),
    craft: (v) => { osc('triangle', 660, 660, 0.06, 0.1 * v); osc('triangle', 990, 990, 0.08, 0.08 * v, null, 0.05); },
    build: (v) => { noise(0.12, 0.35 * v, 'lowpass', 900); osc('sine', 140, 60, 0.18, 0.4 * v); },
    remove: (v) => { osc('square', 300, 120, 0.12, 0.08 * v); noise(0.08, 0.15 * v, 'bandpass', 1500); },
    mine: (v) => { noise(0.07, 0.28 * v, 'bandpass', 900 + Math.random() * 900, 3); },
    chop: (v) => { noise(0.06, 0.3 * v, 'bandpass', 500 + Math.random() * 300, 4); osc('sine', 220, 120, 0.06, 0.12 * v); },
    pickup: (v) => osc('sine', 520, 780, 0.07, 0.1 * v),
    shot: (v) => { noise(0.07, 0.3 * v, 'highpass', 1200); osc('sine', 160, 60, 0.07, 0.25 * v); },
    shotgun: (v) => { noise(0.18, 0.45 * v, 'lowpass', 2500, 1, null, 0, 400); osc('sine', 120, 40, 0.15, 0.4 * v); },
    laser: (v) => osc('sawtooth', 1800, 300, 0.12, 0.08 * v),
    rocket: (v) => noise(0.5, 0.25 * v, 'bandpass', 600, 1, null, 0, 2000),
    cannon: (v) => { noise(0.5, 0.5 * v, 'lowpass', 600, 1, null, 0, 80); osc('sine', 90, 30, 0.5, 0.5 * v); },
    explode: (v) => { noise(0.8, 0.55 * v, 'lowpass', 1400, 1, null, 0, 60); osc('sine', 80, 25, 0.6, 0.5 * v); },
    throw: (v) => noise(0.18, 0.12 * v, 'bandpass', 700, 2, null, 0, 1800),
    bite: (v) => { noise(0.08, 0.25 * v, 'bandpass', 380, 5); },
    squish: (v) => { noise(0.2, 0.3 * v, 'lowpass', 900, 3, null, 0, 150); osc('sine', 200, 80, 0.15, 0.15 * v); },
    research: (v) => { [523, 659, 784, 1047].forEach((f, i) => osc('triangle', f, f, 0.25, 0.14 * v, null, i * 0.09)); },
    warning: (v) => { osc('square', 440, 440, 0.12, 0.06 * v); osc('square', 330, 330, 0.12, 0.06 * v, null, 0.16); },
    attack: (v) => { osc('sawtooth', 110, 70, 0.6, 0.12 * v); osc('sawtooth', 147, 90, 0.6, 0.08 * v, null, 0.3); },
    error: (v) => osc('square', 140, 110, 0.15, 0.08 * v),
    hurt: (v) => { osc('square', 220, 110, 0.12, 0.1 * v); },
    rotate: (v) => osc('sine', 500, 600, 0.04, 0.08 * v),
    victory: (v) => { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => osc('triangle', f, f, 0.5, 0.15 * v, null, i * 0.14)); },
  };

  /** play a sound; opt {x,y} for distance attenuation, vol multiplier */
  A.play = function (name, opt) {
    if (!A.ready || !SFX[name]) return;
    let v = (opt && opt.vol) || 1;
    if (opt && opt.x != null && GF.Render) {
      const cam = GF.Render.cam;
      const d = U.dist(opt.x, opt.y, cam.x, cam.y);
      v *= U.clamp(1 - d / 45, 0, 1);
      if (v < 0.03) return;
    }
    // rate-limit identical sounds
    const now = A.ctx.currentTime;
    if (A.last[name] && now - A.last[name] < 0.035) return;
    A.last[name] = now;
    try { SFX[name](v); } catch (e) { /* ignore */ }
  };

  /* ---------------------------- ambience ---------------------------- */
  A.startAmbience = function () {
    const c = A.ctx;
    const hum = c.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 55;
    const hf = c.createBiquadFilter(); hf.type = 'lowpass'; hf.frequency.value = 180;
    const hg = c.createGain(); hg.gain.value = 0;
    hum.connect(hf); hf.connect(hg); hg.connect(A.sfx); hum.start();
    const bn = c.createBufferSource(); bn.buffer = A.noiseBuf; bn.loop = true;
    const bf = c.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 2400; bf.Q.value = 2;
    const bg = c.createGain(); bg.gain.value = 0;
    bn.connect(bf); bf.connect(bg); bg.connect(A.sfx); bn.start();
    A.amb = { hg, bg };
  };

  const CHORDS = [[146.8, 174.6, 220.0], [116.5, 146.8, 174.6], [130.8, 164.8, 196.0], [110.0, 130.8, 164.8], [98.0, 123.5, 146.8], [116.5, 146.8, 174.6]];
  const SCALE = [293.7, 349.2, 392.0, 440.0, 523.3, 587.3];
  function musicBar() {
    const c = A.ctx, t = c.currentTime + 0.05;
    const ch = CHORDS[A.bar % CHORDS.length];
    A.bar++;
    ch.forEach((f) => {
      [0, 4].forEach((det) => {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det - 2;
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.018, t + 1.6); g.gain.linearRampToValueAtTime(0.0001, t + 6.2);
        o.connect(lp); lp.connect(g); g.connect(A.music); o.start(t); o.stop(t + 6.4);
      });
    });
    const notes = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < notes; i++) {
      const f = SCALE[Math.floor(Math.random() * SCALE.length)] * (Math.random() < 0.3 ? 2 : 1);
      const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const g = c.createGain(); const st = t + 0.5 + i * (1 + Math.random());
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.05, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 1.4);
      const dl = c.createDelay(); dl.delayTime.value = 0.33; const fb = c.createGain(); fb.gain.value = 0.3;
      o.connect(g); g.connect(A.music); g.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(A.music);
      o.start(st); o.stop(st + 1.5);
    }
  }

  A.update = function (dt, inGame) {
    if (!A.ready) return;
    A._mT -= dt;
    if (A._mT <= 0 && GF.Settings.get('music') > 0) { A._mT = 5.5; musicBar(); }
    A._aT -= dt;
    if (A._aT > 0) return;
    A._aT = 0.5;
    let machines = 0, belts = 0;
    if (inGame && GF.Render) {
      const cam = GF.Render.cam;
      GF.Ent.near(cam.x, cam.y, 18).forEach((e) => { if (e.working) machines++; if (e.kind === 'belt' && e.items && e.items.length) belts++; });
    }
    const now = A.ctx.currentTime;
    A.amb.hg.gain.setTargetAtTime(Math.min(0.09, machines * 0.006), now, 0.4);
    A.amb.bg.gain.setTargetAtTime(Math.min(0.03, belts * 0.0015), now, 0.4);
  };

  GF.Audio = A;
})(window.GF);

</script>
