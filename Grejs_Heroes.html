  /* ------------------------------ SHOP ------------------------------ */
  shopItems() {
    return [
      { sect: 'CHESTS', list: [{ type: 'chest', id: 'wood', price: 250, cur: 'coins' }, { type: 'chest', id: 'silver', price: 900, cur: 'coins' }, { type: 'chest', id: 'gold', price: 60, cur: 'gems' }, { type: 'chest', id: 'legend', price: 180, cur: 'gems' }, { type: 'chest', id: 'mythic', price: 450, cur: 'gems' }] },
      { sect: 'ITEMS', list: [{ type: 'crate', id: 'weapon', price: 1500, cur: 'coins' }, { type: 'crate', id: 'armor', price: 1500, cur: 'coins' }, { type: 'crate', id: 'charm', price: 25, cur: 'gems' }] },
      { sect: 'HERO FRAGMENTS', list: [{ type: 'frags', id: 'random', n: 6, price: 30, cur: 'gems' }, { type: 'frags', id: 'random', n: 20, price: 90, cur: 'gems' }, { type: 'frags', id: 'random', n: 60, price: 240, cur: 'gems' }] },
      { sect: 'GEMS', list: [{ type: 'gems', n: 10, price: 2500, cur: 'coins' }, { type: 'gems', n: 50, price: 11000, cur: 'coins' }] },
      { sect: 'COINS', list: [{ type: 'coins', n: 1500, price: 12, cur: 'gems' }, { type: 'coins', n: 8000, price: 55, cur: 'gems' }] },
    ];
  },
  offerCard(o, key, sold) {
    let art = '', name = '', rar = 'common';
    switch (o.type) {
      case 'chest': art = `<canvas data-chest="${o.id}" width="192" height="164"></canvas>`; name = CHESTS[o.id].name; rar = CHESTS[o.id].rar; break;
      case 'item': art = `<div class="art">${ITEMS[o.id].ic}</div>`; name = ITEMS[o.id].name; rar = o.rar; break;
      case 'crate': art = `<div class="art">${SLOT_ICON[o.id]}</div>`; name = 'Random ' + o.id; rar = o.id === 'charm' ? 'epic' : 'rare'; break;
      case 'frags': art = `<div class="art">${o.id === 'random' ? '🧩' : ''}${o.id !== 'random' ? `<span data-portrait="${o.id}" style="width:80px;height:80px;display:block"></span>` : ''}</div>`; name = (o.id === 'random' ? 'Random' : HEROES[o.id].name.replace('Grejs ', '')) + ' ×' + o.n + ' fragments'; rar = o.n >= 20 ? 'epic' : 'rare'; break;
      case 'gems': art = `<div class="art">${IC.gem}</div>`; name = o.n + ' Gems'; rar = o.n >= 50 ? 'epic' : 'rare'; break;
      case 'coins': art = `<div class="art">${IC.coin}</div>`; name = fmt(o.n) + ' Coins'; rar = o.n >= 5000 ? 'epic' : 'uncommon'; break;
    }
    const price = o.cur === 'free' ? 'FREE' : curIcon(o.cur) + ' ' + fmt(o.price);
    return `<div class="shopcard r-${rar} ${sold ? 'sold' : ''}" data-act="buy" data-key="${key}">${o.tag ? `<div class="tag">${o.tag}</div>` : ''}${art}<div class="nm">${name}</div><div class="price">${sold ? 'SOLD' : price}</div></div>`;
  },
  shopHtml() {
    Prog.ensureDaily();
    const s = Save.data;
    const now = new Date(), mid = new Date(now); mid.setHours(24, 0, 0, 0);
    const left = Math.max(0, mid - now), hh = Math.floor(left / 3600000), mm = Math.floor(left / 60000) % 60;
    let html = `<div class="sect">DAILY OFFERS <span class="small">⏱ ${hh}h ${mm}m</span></div><div class="grid3">${s.shop.offers.map((o, i) => this.offerCard(o, 'd' + i, s.shop.bought.includes(i))).join('')}</div>`;
    this.shopItems().forEach((sec, si) => { html += `<div class="sect">${sec.sect}</div><div class="grid3">${sec.list.map((o, i) => this.offerCard(o, si + '-' + i, false)).join('')}</div>`; });
    return `${this.topbar('SHOP')}<div class="scroll body">${html}</div>`;
  },
  afterShop() {
    for (const c of document.querySelectorAll('#scr-shop canvas[data-chest]')) { const ctx = c.getContext('2d'); ctx.scale(2, 2); drawChest(ctx, c.dataset.chest, 48, 70, 0.8, 0, 0, 0); }
    for (const el of document.querySelectorAll('#scr-shop [data-portrait]')) el.appendChild(portraitCanvas(el.dataset.portrait, 80, {}));
  },
  buy(key) {
    const s = Save.data;
    let o, daily = key[0] === 'd';
    if (daily) { const i = +key.slice(1); if (s.shop.bought.includes(i)) return; o = s.shop.offers[i]; }
    else { const [si, i] = key.split('-').map(Number); o = this.shopItems()[si].list[i]; }
    if (!o) return;
    if (o.cur !== 'free' && s[o.cur] < o.price) { Sound.play('error'); this.toast('Not enough ' + (o.cur === 'gems' ? 'gems' : 'coins') + '!'); return; }
    const pay = () => { if (o.cur !== 'free') Prog.spend(o.cur, o.price); if (daily) s.shop.bought.push(+key.slice(1)); s.stats.shopBuys++; Save.save(); };
    switch (o.type) {
      case 'chest': pay(); Game.openChest(o.id, null, () => this.show('shop')); return;
      case 'item': { pay(); const it = Prog.newItem(o.id, o.rar); Save.save(); Sound.play('buy'); this.toast('Got ' + ITEMS[it.id].name + '!', 'gold'); break; }
      case 'crate': {
        pay();
        const pool = ITEM_IDS.filter(id => ITEMS[id].slot === o.id);
        const rar = Prog.rollRarity(o.id === 'charm' ? { rare: 40, epic: 45, legendary: 15 } : { uncommon: 30, rare: 50, epic: 18, legendary: 2 });
        const it = Prog.newItem(pick(pool), rar); Save.save(); Sound.play('buy');
        this.toast(`${ITEMS[it.id].ic} ${RARITY[rar].name} ${ITEMS[it.id].name}!`, 'gold'); break;
      }
      case 'frags': {
        pay();
        const cand = HERO_IDS.filter(id => !HEROES[id].starter);
        const locked = cand.filter(id => !s.heroes[id].unlocked);
        const id = o.id !== 'random' ? o.id : (locked.length ? pick(locked) : pick(cand));
        s.heroes[id].frags += o.n; Save.save(); Sound.play('gem');
        this.toast(`+${o.n} ${HEROES[id].name} fragments!`, 'gold'); break;
      }
      case 'gems': pay(); Prog.addGems(o.n); Save.save(); Sound.play('gem'); this.toast('+' + o.n + ' gems!', 'gold'); break;
      case 'coins': pay(); Prog.addCoins(o.n); Save.save(); Sound.play('coin'); this.toast('+' + fmt(o.n) + ' coins!', 'gold'); break;
    }
    Prog.checkAchievementsToast();
    this.refresh();
    this.bumpPills();
  },

  /* ------------------------------ QUESTS ---------------------------- */
  questsHtml() {
    Prog.ensureDaily();
    const s = Save.data;
    let body = '';
    if (this.questTab === 'daily') {
      const now = new Date(), mid = new Date(now); mid.setHours(24, 0, 0, 0);
      const left = Math.max(0, mid - now);
      body = `<div class="sect">DAILY QUESTS <span class="small">⏱ ${Math.floor(left / 3600000)}h ${Math.floor(left / 60000) % 60}m</span></div>`;
      s.quests.list.forEach((q, i) => {
        const def = QUEST_POOL.find(x => x.id === q.id);
        const done = q.prog >= q.goal;
        body += `<div class="lrow ${q.claimed ? 'done' : ''}"><div class="icon">${q.claimed ? '✅' : '📜'}</div><div class="info"><div class="nm" style="font-size:20px">${def.txt(q.goal)}</div>
          <div class="bar" style="margin:6px 0"><i style="width:${100 * q.prog / q.goal}%"></i><span>${fmt(q.prog)} / ${fmt(q.goal)}</span></div><div class="ds">Reward: ${rewardHtml(q.rew)}</div></div>
          <button class="btn small ${q.claimed ? 'grey off' : done ? 'green glow' : 'off'}" data-act="claimq" data-i="${i}">${q.claimed ? 'DONE' : 'CLAIM'}</button></div>`;
      });
      body += `<div class="sect">RECORDS</div><div class="card" style="font-weight:800;font-size:19px;line-height:1.7">
        ⚔️ Enemies defeated: <b>${fmt(s.stats.kills)}</b><br>👑 Bosses defeated: <b>${s.stats.bosses}</b><br>🎯 Critical hits: <b>${fmt(s.stats.crits)}</b><br>♾️ Endless best: <b>WAVE ${s.endless.best}</b><br>⚡ Boss attacks interrupted: <b>${s.stats.interrupts || 0}</b><br>💀 Elites defeated: <b>${fmt(s.stats.elites || 0)}</b><br>🗺️ Levels cleared: <b>${Prog.clearedCount()} / ${WORLDS.length * LV}</b><br>⭐ Stars: <b>${Prog.starCount()} / ${WORLDS.length * LV * 3}</b></div>`;
    } else {
      body = ACHIEVEMENTS.map(a => {
        const st = Prog.achState(a), v = Math.min(a.goal, Prog.statValue(a.stat));
        return `<div class="lrow ${st === 'claimed' ? 'done' : ''}"><div class="icon">${st === 'claimed' ? '🏆' : st === 'done' ? '🎉' : '🔒'}</div><div class="info"><div class="nm" style="font-size:20px">${a.name}</div><div class="ds">${a.desc}</div>
          <div class="bar" style="margin:6px 0;height:18px"><i style="width:${100 * v / a.goal}%"></i><span>${fmt(v)} / ${fmt(a.goal)}</span></div><div class="ds">${rewardHtml(a.rew)}</div></div>
          <button class="btn small ${st === 'claimed' ? 'grey off' : st === 'done' ? 'green glow' : 'off'}" data-act="claima" data-id="${a.id}">${st === 'claimed' ? '✓' : 'CLAIM'}</button></div>`;
      }).join('');
    }
    const nd = s.quests.list.filter(q => !q.claimed && q.prog >= q.goal).length;
    const na = ACHIEVEMENTS.filter(a => Prog.achState(a) === 'done').length;
    return `${this.topbar('QUESTS')}
      <div class="tabs"><div class="tab ${this.questTab === 'daily' ? 'on' : ''}" data-act="qtab" data-t="daily">DAILY${nd ? ' (' + nd + ')' : ''}</div><div class="tab ${this.questTab === 'ach' ? 'on' : ''}" data-act="qtab" data-t="ach">ACHIEVEMENTS${na ? ' (' + na + ')' : ''}</div></div>
      <div class="scroll body">${body}</div>`;
  },
  claim(rew) {
    const out = Prog.giveReward(rew);
    Sound.play('gem');
    for (const r of out) if (r.kind === 'chest') { Game.openChest(r.chest, null, () => this.show('quests')); return true; }
    this.toast('Claimed: ' + rewardHtml(rew), 'gold');
    return false;
  },

  /* ------------------------------ SETTINGS -------------------------- */
  settingsHtml() {
    const s = Save.data.settings;
    const row = (k, label, ic) => `<div class="lrow"><div class="icon">${ic}</div><div class="info"><div class="nm">${label}</div></div><div class="toggle ${s[k] ? 'on' : ''}" data-act="toggle" data-k="${k}"></div></div>`;
    return `${this.topbar('SETTINGS')}<div class="scroll body">
      ${row('music', 'Music', '🎵')}${row('sfx', 'Sound Effects', '🔊')}
      <div class="lrow"><div class="icon">🔇</div><div class="info"><div class="nm">Mute All</div></div><div class="toggle ${s.mute ? 'on' : ''}" data-act="toggle" data-k="mute"></div></div>
      ${row('shake', 'Screen Shake', '📳')}${row('numbers', 'Damage Numbers', '💯')}
      <div class="lrow"><div class="icon">✨</div><div class="info"><div class="nm">Effects Quality</div><div class="ds">${s.quality === 'high' ? 'High — maximum juice' : 'Low — faster on old phones'}</div></div><div class="toggle ${s.quality === 'high' ? 'on' : ''}" data-act="quality"></div></div>
      <div class="sect">DIFFICULTY</div>
      <div class="diff-row">${Object.keys(DIFF).map(k => `<div class="tab ${s.diff === k ? 'on' : ''}" data-act="diff" data-k="${k}">${DIFF[k].ic} ${DIFF[k].name}</div>`).join('')}</div>
      <div class="note">Enemy HP ×${Prog.diff().hp} · enemy damage ×${Prog.diff().dmg} · rewards ×${Prog.diff().rew}</div>
      <div class="sect">BATTLE</div>
      <div class="lrow"><div class="icon">🤖</div><div class="info"><div class="nm">Auto Specials</div><div class="ds">${s.autoSpec ? 'Heroes fire specials by themselves' : 'You choose when to use specials (tap / keys 1-4)'}</div></div><div class="toggle ${s.autoSpec ? 'on' : ''}" data-act="toggle" data-k="autoSpec"></div></div>
      <div class="lrow"><div class="icon">⏩</div><div class="info"><div class="nm">Battle Speed</div><div class="ds">${s.speed > 1 ? 'Fast (2×)' : 'Normal (1×)'}</div></div><div class="toggle ${s.speed > 1 ? 'on' : ''}" data-act="speed"></div></div>
      <div class="card note" style="text-align:left;line-height:1.6">💾 Progress is saved automatically ${Save.ok ? 'in this browser.' : '— <b style="color:#ff8a8a">browser storage is unavailable, progress will be lost on reload!</b>'}<br>
      ⌨️ <b>Keyboard:</b> 1-4 specials · Q auto-specials · F speed · Space/P/Esc pause · 1-3 pick upgrade · R reroll · Enter continue</div>
      <button class="btn blue" data-act="replayIntro">🎬 REPLAY INTRO</button>
      <button class="btn red" data-act="reset">🗑️ RESET SAVE</button>
      <div class="note">Grejs Heroes · v2.0</div>
    </div>`;
  },

  /* ------------------------------ ACTIONS --------------------------- */
  act(act, d, el) {
    const s = Save.data;
    switch (act) {
      case 'noop': break;
      case 'alley': Save.save(); setTimeout(() => { window.location.href = 'GREJSALLEY.html'; }, 120); break;
      case 'play': this.mapWorld = Math.min(Prog.currentLevel().w, WORLDS.length - 1); Game.setState('MAP'); break;
      case 'go':
        if (d.to === 'heroes') { this.heroSel = null; this.heroTab = 'heroes'; }
        if (d.to === 'settings') this.settingsFrom = Game.state === 'PAUSE' ? 'PAUSE' : 'MENU';
        Game.setState(d.to.toUpperCase(), this.screen === 'map' ? 'MAP' : 'MENU');
        break;
      case 'back':
        if (this.screen === 'settings' && this.settingsFrom === 'PAUSE') { Game.setState('PAUSE'); break; }
        if (this.screen === 'heroes' && this.heroSel && this.heroTab === 'heroes') { this.heroSel = null; this.refresh(); break; }
        Game.setState(Game.backTo || 'MENU'); Game.backTo = null;
        break;
      case 'endless':
        if (!s.endless.unlocked) { this.toast('🔒 Rescue Queen Langvad to unlock Endless Mode'); Sound.play('error'); break; }
        Game.startBattle({ mode: 'endless' });
        break;
      case 'world': {
        const nw = clamp(this.mapWorld + (+d.d), 0, WORLDS.length - 1);
        if (nw !== this.mapWorld) { this.mapWorld = nw; this.render('map'); setTimeout(() => this.scrollMap(), 20); }
        break;
      }
      case 'node': this.levelDialog(+d.l); break;
      case 'start': this.close('dialog'); Game.startBattle({ mode: 'story', w: this._lvl.w, l: this._lvl.l }); break;
      case 'dlgclose': this.close('dialog'); break;
      case 'dlg': { const b = this._dlg && this._dlg[+d.i]; this.close('dialog'); if (b && b.fn) b.fn(); break; }
      case 'htab': this.heroTab = d.t; this.heroSel = null; this.refresh(); break;
      case 'hero': this.heroSel = d.id || null; this.heroView = 'stats'; this.heroTab = 'heroes'; this.render('heroes'); $('scr-heroes').querySelector('.scroll').scrollTop = 0; break;
      case 'hview': this.heroView = d.v; this.refresh(); break;
      case 'equip': {
        const id = d.id, sq = s.squad, idx = sq.indexOf(id);
        if (idx >= 0 && idx < s.squadSlots) {
          if (Prog.squadList().length <= 1) { this.toast('You need at least one hero!'); Sound.play('error'); break; }
          sq[idx] = null;
          const rest = sq.filter(Boolean); s.squad = [rest[0] || null, rest[1] || null, rest[2] || null];
        } else {
          let slot = -1; for (let i = 0; i < s.squadSlots; i++) if (!sq[i]) { slot = i; break; }
          if (slot < 0) { slot = s.squadSlots - 1; this.toast(HEROES[sq[slot]].name + ' swapped out'); }
          sq[slot] = id; Sound.play('upgrade');
        }
        Save.save(); this.refresh(); break;
      }
      case 'lvlup': {
        const id = d.id, h = s.heroes[id];
        if (h.level >= CONFIG.HERO_MAX) break;
        const cost = Prog.heroLevelCost(h.level);
        if (!Prog.spend('coins', cost)) { Sound.play('error'); this.toast('Not enough coins!'); break; }
        const prev = Prog.heroStats(id);
        h.level++; s.stats.heroLevels++;
        Save.save(); Sound.play('levelup');
        this.refresh(); this.levelUpFx(prev); this.bumpPills(); Prog.checkAchievementsToast();
        break;
      }
      case 'skill': {
        const id = d.id, h = s.heroes[id], n = SKILL_NODES.find(x => x.id === d.n);
        const r = h.skill[n.id] || 0;
        if (n.req && !(h.skill[n.req] > 0)) { this.toast('Unlock ' + SKILL_NODES.find(x => x.id === n.req).name + ' first'); Sound.play('error'); break; }
        if (r >= n.max) { this.toast('Maxed out!'); break; }
        if (Prog.skillPoints(id) <= 0) { this.toast('No skill points — level up the hero!'); Sound.play('error'); break; }
        h.skill[n.id] = r + 1; Save.save(); Sound.play('upgrade'); this.refresh();
        break;
      }
      case 'skin': {
        const id = d.id, h = s.heroes[id], n = HEROES[id].skins.length;
        let next = ((h.skin || 0) + 1) % n;
        if (!Prog.skinUnlocked(id, next)) { const sk = HEROES[id].skins[next]; const a = ACHIEVEMENTS.find(x => x.id === sk.req); this.toast(`🔒 ${sk.name} skin: unlock "${a.name}"`); next = 0; if ((h.skin || 0) === 0) { Sound.play('error'); break; } }
        h.skin = next; Save.save(); this.refresh(); break;
      }
      case 'unlock': {
        if (Prog.unlockHero(d.id, d.how)) {
          Sound.play('chestOpen'); this.toast('🎉 ' + HEROES[d.id].name + ' unlocked!', 'gold');
          this.refresh(); this.bumpPills(); if (this.anim) { this.anim.set('VICTORY', 1.5); this.anim.flash = 1; }
          const top = $('hd-top'); if (top) { const r = document.createElement('div'); r.className = 'ring-fx'; top.querySelector('.hd-portrait').appendChild(r); }
          Prog.checkAchievementsToast();
        } else { Sound.play('error'); this.toast(d.how === 'frags' ? 'Not enough fragments!' : 'Not enough ' + d.how + '!'); }
        break;
      }
      case 'item': this.itemDialog(+d.uid); break;
      case 'equipitem': {
        const it = s.items.find(i => i.uid === this._item); if (!it) break;
        const slot = ITEMS[it.id].slot;
        s.equip[slot] = s.equip[slot] === it.uid ? null : it.uid;
        Save.save(); Sound.play('upgrade'); this.close('dialog'); this.refresh(); break;
      }
      case 'salvage': {
        const idx = s.items.findIndex(i => i.uid === this._item); if (idx < 0) break;
        const it = s.items[idx];
        for (const k in s.equip) if (s.equip[k] === it.uid) s.equip[k] = null;
        s.items.splice(idx, 1); Prog.addCoins(Prog.salvageValue(it)); Save.save(); Sound.play('coin');
        this.close('dialog'); this.refresh(); this.bumpPills(); break;
      }
      case 'perm': {
        const u = PERM_UPS.find(x => x.id === d.id), l = s.perm[u.id];
        if (l >= u.max) break;
        if (!Prog.spend('coins', Prog.permCost(u, l))) { Sound.play('error'); this.toast('Not enough coins!'); break; }
        s.perm[u.id]++; s.stats.permBuys++; Save.save(); Sound.play('levelup');
        this.refresh(); this.bumpPills();
        const row = $('pu-' + u.id); if (row) { row.style.animation = 'flashIn .6s'; }
        this.toast(u.ic + ' ' + u.name + ' → Lv. ' + s.perm[u.id], 'green');
        Prog.checkAchievementsToast();
        break;
      }
      case 'buy': this.buy(d.key); break;
      case 'qtab': this.questTab = d.t; this.refresh(); break;
      case 'claimq': {
        const q = s.quests.list[+d.i]; if (!q || q.claimed || q.prog < q.goal) break;
        q.claimed = true; Save.save();
        if (!this.claim(q.rew)) { this.refresh(); this.bumpPills(); }
        break;
      }
      case 'claima': {
        const a = ACHIEVEMENTS.find(x => x.id === d.id); if (Prog.achState(a) !== 'done') break;
        s.ach[a.id] = 'claimed'; Save.save();
        if (!this.claim(a.rew)) { this.refresh(); this.bumpPills(); }
        break;
      }
      case 'toggle': s.settings[d.k] = !s.settings[d.k]; Save.save(); Sound.init(); Sound.apply(); this.refresh(); break;
      case 'quality': s.settings.quality = s.settings.quality === 'high' ? 'low' : 'high'; Save.save(); this.refresh(); break;
      case 'diff': s.settings.diff = d.k; Save.save(); this.refresh(); this.toast(DIFF[d.k].ic + ' Difficulty: ' + DIFF[d.k].name); break;
      case 'speed': s.settings.speed = s.settings.speed > 1 ? 1 : 2; Save.save(); this.refresh(); break;
      case 'replayIntro': Game.startIntro(); break;
      case 'reset':
        this.dialog('RESET SAVE?', 'This deletes ALL progress: heroes, coins, gems and levels.<br><br><b style="color:#ff8a8a">This cannot be undone!</b>', [
          { label: 'YES, DELETE EVERYTHING', cls: 'red', fn: () => { Save.reset(); Sound.apply(); this.toast('Save deleted'); Game.startIntro(); } },
          { label: 'CANCEL', cls: 'grey' }]);
        break;
      // ----- in-battle overlays -----
      case 'pick': Game.pickUpgrade(+d.i); break;
      case 'reroll': Game.rerollUpgrade(); break;
      case 'resume': Game.resume(); break;
      case 'restart': this.dialog('RESTART?', 'Restart this level from the beginning?', [{ label: 'RESTART', cls: 'red', fn: () => Game.restart() }, { label: 'CANCEL', cls: 'grey' }]); break;
      case 'exit': this.dialog('EXIT?', 'Leave the battle? Coins you collected are kept.', [{ label: 'EXIT TO MENU', cls: 'red', fn: () => Game.exitBattle('MENU') }, { label: 'CANCEL', cls: 'grey' }]); break;
      case 'pset': this.settingsFrom = 'PAUSE'; Game.setState('SETTINGS'); break;
      case 'vcontinue': Game.afterVictory(false); break;
      case 'vnext': Game.afterVictory(true); break;
      case 'revive': Game.revive(); break;
      case 'retry': Game.retry(); break;
      case 'tomap': Game.exitBattle('MAP'); break;
      case 'ev': Game.eventAction(d.k, d.i); break;
      case 'chestcollect': Game.closeChest(); break;
      case 'chesttap': Game.chestTap(); break;
      case 'intro': Game.introNext(); break;
      case 'skipintro': Game.finishIntro(); break;
      case 'ending': Game.endingNext(); break;
    }
  },
};

/* ============================ GAME / LOOP =========================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let appW = 540, appH = 960;

function txt(c, s, x, y, size, color, align = 'center', lw = 0) {
  c.font = '900 ' + size + 'px ' + FONT; c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = lw || Math.max(3, size * 0.2); c.strokeStyle = OUT; c.strokeText(s, x, y);
  c.fillStyle = color; c.fillText(s, x, y);
}
function hudPanel(c, x, y, w, h, r = 18) {
  c.fillStyle = 'rgba(20,10,45,.78)'; rr(c, x, y, w, h, r); c.fill();
  c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.14)'; c.stroke();
}

const Game = {
  state: 'BOOT', scene: 'menu', battle: null, chest: null, backTo: null, t: 0,
  menu: null, intro: null, ending: null, upChoices: null, picking: false, keys: {},
  isPlaying() { return this.state === 'GAMEPLAY' || this.state === 'BOSS'; },

  setState(s, backTo) {
    this.state = s;
    if (backTo !== undefined) this.backTo = backTo;
    UI.closeAll();
    switch (s) {
      case 'INTRO': UI.show('intro'); this.scene = 'intro'; break;
      case 'MENU': this.battle = null; UI.show('menu'); this.scene = 'menu'; this.buildMenuScene(); Sound.setMusic('menu'); Prog.checkAchievementsToast(); break;
      case 'MAP': this.battle = null; UI.show('map'); this.scene = 'map'; Sound.setMusic('menu'); break;
      case 'HEROES': case 'UPGRADES': case 'SHOP': case 'QUESTS':
        UI.show(s.toLowerCase()); this.scene = 'dim'; break;
      case 'SETTINGS': UI.show('settings'); this.scene = this.battle ? 'battle' : 'dim'; break;
      case 'GAMEPLAY': case 'BOSS': UI.show(null); this.scene = 'battle'; break;
      case 'PAUSE': UI.show(null); this.scene = 'battle'; this.renderPause(); break;
      case 'UPGRADE': case 'EVENT': case 'VICTORY': case 'DEFEAT': case 'CHEST': case 'ENDING': UI.show(null); break;
    }
  },

  /* ------------------------------ BATTLE FLOW ----------------------- */
  startBattle(cfg) {
    Sound.init();
    this.lastCfg = cfg;
    try { this.battle = new Battle(cfg); }
    catch (e) { console.error(e); UI.toast('Could not start battle'); this.setState('MENU'); return; }
    this.setState('GAMEPLAY');
    Save.save();
  },
  pause() { if (this.isPlaying()) { this.pausedFrom = this.state; this.setState('PAUSE'); Sound.play('button'); } },
  resume() { if (this.battle) this.setState(this.pausedFrom || (this.battle.boss ? 'BOSS' : 'GAMEPLAY')); },
  renderPause() {
    const b = this.battle; if (!b) return;
    const own = Object.keys(b.mods.owned).map(id => { const u = UPG[id] || COMBOS.find(c => c.id === id); return u ? `<span title="${u.name}" style="font-size:30px">${u.ic}${b.mods.owned[id] > 1 ? `<sub style="font-size:14px">${b.mods.owned[id]}</sub>` : ''}</span>` : ''; }).join(' ');
    UI.overlay('pause', `<div class="panel"><div class="ribbon">PAUSED</div>
      <div class="card center" style="text-align:center"><div class="small" style="color:#ffd84d">YOUR BUILD</div><div style="min-height:40px;margin-top:6px">${own || '<span class="note">No upgrades yet</span>'}</div></div>
      <button class="btn green big" data-act="resume">▶ RESUME</button>
      <button class="btn blue" data-act="pset">⚙️ SETTINGS</button>
      <button class="btn" data-act="restart">↻ RESTART</button>
      <button class="btn red" data-act="exit">⌂ EXIT TO MENU</button></div>`);
  },
  bankRun(xpFrac = 1) {
    const b = this.battle; if (!b || b.banked) return;
    b.banked = true;
    Prog.addCoins(b.runCoins); Prog.addGems(b.runGems); Prog.addAccXp(b.runXp * xpFrac);
    Save.save();
  },
  exitBattle(to) { this.bankRun(0.5); this.battle = null; FX.slowT = 0; this.setState(to); },
  restart() { const cfg = this.lastCfg; this.bankRun(0.5); this.battle = null; this.startBattle(cfg); },
  retry() { this.restart(); },

  /* ------------------------------ UPGRADES -------------------------- */
  rollUpgrades() {
    const b = this.battle, m = b.mods;
    const cands = UPGRADES.filter(u => (m.owned[u.id] || 0) < u.max);
    const combos = COMBOS.filter(c => !m.owned[c.id] && c.need.every(n => m.owned[n]));
    const out = [];
    if (combos.length && chance(0.85)) out.push(Object.assign({ combo: true, rar: 'mythic' }, pick(combos)));
    while (out.length < 3 && cands.length) {
      const u = weightedPick(cands, u => ({ common: 10, rare: 5.5, epic: 2 }[u.rar]) * (u.id === 'hp' && b.hp / b.maxHp < 0.5 ? 3 : 1) * (m.owned[u.id] ? 1.3 : 1));
      out.push(u); cands.splice(cands.indexOf(u), 1);
    }
    return out;
  },
  showUpgrade(reason) {
    if (!this.battle) return;
    this.upReason = reason; this.upChoices = this.rollUpgrades(); this.rerolls = 0; this.picking = false;
    this.setState('UPGRADE');
    this.renderUpgrade();
    Sound.play('upgrade', 0.7);
  },
  renderUpgrade() {
    const b = this.battle, m = b.mods;
    const cards = this.upChoices.map((u, i) => {
      const lv = m.owned[u.id] || 0;
      return `<div class="upcard r-${u.rar} ${u.combo ? 'combo' : ''}" style="animation-delay:${i * 0.09}s" data-act="pick" data-i="${i}">
        <div class="ico">${u.ic}</div><div class="grow"><div class="nm">${u.combo ? '<span class="combo-tag">COMBO</span>' : ''}${u.name}</div><div class="ds">${u.desc}</div>
        <div class="lvl">${u.combo ? u.need.map(n => UPG[n].ic).join(' + ') + ' = ' + u.ic : (u.max > 1 ? 'Lv ' + lv + ' → ' + (lv + 1) : 'UNIQUE')}</div></div></div>`;
    }).join('');
    const cost = 5 + this.rerolls * 5;
    UI.overlay('upgrade', `<div class="choose">CHOOSE YOUR POWER</div>
      <div class="h3" style="color:#c9ffb8">${this.upReason === 'level' ? '⭐ LEVEL UP! Level ' + b.runLevel : '✔ Wave cleared!'}</div>
      <div class="upcards">${cards}</div>
      <button class="btn blue small" style="margin-top:22px" data-act="reroll">🎲 REROLL ${IC.gem} ${cost}</button>`);
  },
  rerollUpgrade() {
    const cost = 5 + this.rerolls * 5;
    if (!Prog.spend('gems', cost)) { Sound.play('error'); UI.toast('Not enough gems!'); return; }
    this.rerolls++; this.upChoices = this.rollUpgrades(); this.renderUpgrade();
  },
  pickUpgrade(i) {
    if (this.picking) return;
    const u = this.upChoices[i]; if (!u) return;
    this.picking = true;
    const cards = document.querySelectorAll('#ov-upgrade .upcard');
    cards.forEach((c, j) => c.classList.add(j === i ? 'picked' : 'gone'));
    Sound.play('upgrade');
    setTimeout(() => {
      this.applyUpgrade(u);
      this.setState(this.battle.boss ? 'BOSS' : 'GAMEPLAY');
      if (this.upReason === 'wave') this.battle.nextStep();
      this.picking = false;
    }, 380);
  },
  applyUpgrade(u) {
    const b = this.battle, m = b.mods;
    u.apply(m, b);
    m.owned[u.id] = (m.owned[u.id] || 0) + 1;
    Prog.track('upgrades');
    if (u.combo) { Save.data.stats.combos++; UI.toast('💥 COMBO UNLOCKED: ' + u.name + '!', 'gold'); screenFlash(0.5, '#ffe45c'); }
    // "I got stronger" feedback
    for (const h of b.heroes) {
      h.a.flash = 1; h.a.squash(1.3, 0.7); h.a.set('VICTORY', 0.5);
      b.effects.push({ type: 'ring', x: h.x, y: h.y - 40, r0: 10, r1: 100, t: 0, life: 0.5, color: u.combo ? '#ffe45c' : RARITY[u.rar].color, w: 10 });
      PS.emit(h.x, h.y - 40, { count: 24, speed: [80, 260], life: [0.5, 1], size: [3, 7], colors: [RARITY[u.rar].color, '#ffffff', '#ffe45c'], shape: 2, add: true, gravity: -60 });
    }
    TX.add(b.squadX, b.heroY - 120, u.ic + ' ' + u.name.toUpperCase(), '#ffe45c', 26, 2, 1.6);
    TX.add(b.squadX, b.heroY - 92, u.desc, '#c9ffb8', 17, 2, 1.6);
    Save.soon();
  },

  /* ------------------------------ EVENTS ---------------------------- */
  showEvent(kind) {
    const b = this.battle; if (!b) return;
    kind = kind || pick(['treasure', 'heal', 'shop', 'treasure', 'shop']);
    this.evKind = kind;
    const sc = Math.pow(1.07, b.gl);
    if (kind === 'treasure') {
      const coins = Math.floor(70 * sc * b.goldMul), gems = randi(1, 3);
      const up = this.rollUpgrades().filter(u => !u.combo)[0];
      b.runCoins += coins; b.runGems += gems;
      const rewards = [{ kind: 'coins', n: coins }, { kind: 'gems', n: gems }];
      if (up) rewards.push({ kind: 'upgrade', u: up });
      this.openChest(b.node === 'treasure' ? 'silver' : 'wood', rewards, () => { if (up) this.applyUpgrade(up); this.setState('GAMEPLAY'); b.nextStep(); });
      return;
    }
    this.setState('EVENT');
    if (kind === 'heal') {
      UI.overlay('event', `<div class="panel"><div class="ribbon" style="background:linear-gradient(#6cff8a,#1f9a4a)">HEALING SPRING</div>
        <div class="center col"><div style="font-size:110px;animation:bob 2s infinite">⛲</div><div class="h3">The heroes find a magical spring.</div><div class="small">Restore 45% HP (${fmt(b.hp)} / ${fmt(b.maxHp)})</div></div>
        <button class="btn green big glow" data-act="ev" data-k="heal">💧 DRINK</button></div>`);
    } else {
      const offers = [];
      const up = this.rollUpgrades().filter(u => !u.combo)[0];
      if (up) offers.push({ k: 'up', u: up, ic: up.ic, name: up.name, desc: up.desc, price: Math.floor(90 * sc) });
      offers.push({ k: 'potion', ic: '🧪', name: 'Health Potion', desc: 'Restore 50% HP', price: Math.floor(60 * sc) });
      const wpn = pick(ITEM_IDS.filter(id => ITEMS[id].slot === 'weapon')), arm = pick(ITEM_IDS.filter(id => ITEMS[id].slot === 'armor'));
      offers.push({ k: 'item', id: wpn, rar: chance(0.3) ? 'rare' : 'uncommon', ic: ITEMS[wpn].ic, name: ITEMS[wpn].name, desc: 'Weapon — keep it forever', price: Math.floor(200 * sc) });
      offers.push({ k: 'item', id: arm, rar: chance(0.3) ? 'rare' : 'uncommon', ic: ITEMS[arm].ic, name: ITEMS[arm].name, desc: 'Armor — keep it forever', price: Math.floor(200 * sc) });
      offers.push({ k: 'gems', ic: '💎', name: '5 Gems', desc: 'Shiny!', price: Math.floor(350 * sc) });
      this.shopOffers = offers;
      this.renderEventShop();
    }
  },
  renderEventShop() {
    const b = this.battle, have = Math.floor(Save.data.coins + b.runCoins);
    const rows = this.shopOffers.map((o, i) => `<div class="lrow ${o.sold ? 'done' : ''}"><div class="icon ${o.rar ? 'r-' + o.rar : ''}" style="border:3px solid transparent">${o.ic}</div><div class="info"><div class="nm" style="font-size:19px">${o.name}${o.rar ? ` <span class="rtag bg-${o.rar}" style="font-size:12px">${RARITY[o.rar].name.toUpperCase()}</span>` : ''}</div><div class="ds">${o.desc}</div></div>
      <button class="btn small ${o.sold ? 'grey off' : have >= o.price ? 'green' : 'off'}" data-act="ev" data-k="buy" data-i="${i}">${o.sold ? 'SOLD' : IC.coin + ' ' + fmt(o.price)}</button></div>`).join('');
    UI.overlay('event', `<div class="panel"><div class="ribbon" style="background:linear-gradient(#ffcf3f,#e07b00)">MERCHANT</div>
      <div class="row center"><span style="font-size:60px">🧙</span><div class="small">"Psst! Wanna buy some stuff?"<br>You have ${IC.coin} <b>${fmt(have)}</b></div></div>
      <div class="col scroll" style="gap:10px;max-height:560px">${rows}</div>
      <button class="btn blue" data-act="ev" data-k="leave">CONTINUE ▶</button></div>`);
  },
  eventAction(k, i) {
    const b = this.battle; if (!b) return;
    if (k === 'heal') { this.setState('GAMEPLAY'); b.heal(b.maxHp * 0.45); Sound.play('heal'); b.nextStep(); return; }
    if (k === 'leave') { this.setState('GAMEPLAY'); b.nextStep(); return; }
    if (k === 'buy') {
      const o = this.shopOffers[+i]; if (!o || o.sold) return;
      const have = Save.data.coins + b.runCoins;
      if (have < o.price) { Sound.play('error'); UI.toast('Not enough coins!'); return; }
      const fromRun = Math.min(b.runCoins, o.price); b.runCoins -= fromRun; b.shownCoins = b.runCoins; Save.data.coins -= (o.price - fromRun);
      o.sold = true; Sound.play('buy'); Save.data.stats.shopBuys++;
      if (o.k === 'up') this.applyUpgrade(o.u);
      else if (o.k === 'potion') b.heal(b.maxHp * 0.5);
      else if (o.k === 'item') { Prog.newItem(o.id, o.rar); UI.toast('Got ' + o.name + '! Equip it under Heroes → Gear', 'gold'); }
      else if (o.k === 'gems') b.runGems += 5;
      Save.save();
      this.renderEventShop();
    }
  },

  /* ------------------------------ CHEST SCENE ----------------------- */
  openChest(type, rewards, after) {
    const r = rewards || Prog.openChest(type, this.battle ? this.battle.world : Prog.maxWorldUnlocked());
    this.chest = { type, rewards: r, t: 0, phase: 'drop', open: 0, glow: 0, after, shakeT: 0 };
    this.chestPrevScene = this.scene;
    this.setState('CHEST');
    UI.overlay('chest', `<div style="position:absolute;inset:0" data-act="chesttap"></div><div class="chest-hint" style="pointer-events:none">TAP TO OPEN!</div>`);
    Sound.play('chest');
  },
  chestTap() {
    const c = this.chest; if (!c) return;
    if (c.phase === 'drop') { c.t = 0.8; return; }
    if (c.phase === 'wait') { c.phase = 'shake'; c.t = 0; Sound.play('chest'); const h = document.querySelector('.chest-hint'); if (h) h.style.opacity = 0; }
  },
  showChestRewards() {
    const c = this.chest;
    const cards = c.rewards.map((r, i) => {
      const d = `style="animation-delay:${i * 0.15}s"`;
      switch (r.kind) {
        case 'coins': return `<div class="rcard r-uncommon" ${d}><div class="big">${IC.coin}</div><div class="nm">COINS</div><div class="amt">+${fmt(r.n)}</div></div>`;
        case 'gems': return `<div class="rcard r-rare" ${d}><div class="big">${IC.gem}</div><div class="nm">GEMS</div><div class="amt">+${r.n}</div></div>`;
        case 'item': return `<div class="rcard r-${r.item.rar}" ${d}><div class="big">${ITEMS[r.item.id].ic}</div><div class="nm">${ITEMS[r.item.id].name}</div><span class="rtag bg-${r.item.rar}">${RARITY[r.item.rar].name.toUpperCase()}</span></div>`;
        case 'frags': return `<div class="rcard r-${HEROES[r.id].rarity}" ${d}><div class="big" data-portrait="${r.id}" style="width:80px;height:80px"></div><div class="nm">${HEROES[r.id].name.replace('Grejs ', '')}</div><div class="amt">${IC.frag} +${r.n}</div></div>`;
        case 'upgrade': return `<div class="rcard r-${r.u.rar}" ${d}><div class="big">${r.u.ic}</div><div class="nm">${r.u.name}</div><div class="small" style="font-size:14px">${r.u.desc}</div></div>`;
      }
      return '';
    }).join('');
    UI.overlay('chest', `<div class="h1" style="margin-bottom:10px;animation:titleIn .6s both;color:#ffe45c">${CHESTS[c.type].name.toUpperCase()}!</div><div class="chest-rewards">${cards}</div><button class="btn green big glow" style="width:320px" data-act="chestcollect">COLLECT</button>`);
    for (const el of document.querySelectorAll('#ov-chest [data-portrait]')) el.appendChild(portraitCanvas(el.dataset.portrait, 80, {}));
  },
  closeChest() {
    const c = this.chest; if (!c) return;
    this.chest = null;
    UI.close('chest');
    Prog.checkAchievementsToast();
    this.scene = this.chestPrevScene;
    if (c.after) c.after(); else this.setState('MENU');
  },
  updateChest(dt) {
    const c = this.chest; c.t += dt;
    if (c.phase === 'drop' && c.t >= 0.8) { c.phase = 'wait'; c.t = 0; }
    if (c.phase === 'shake') {
      c.glow = Math.min(1, c.t / 0.8);
      if (Math.random() < dt * 30) PS.emit(W / 2 + rand(-40, 40), H * 0.52 - rand(10, 60), { count: 1, speed: [60, 200], life: [0.3, 0.6], size: [2, 4], colors: ['#fff', RARITY[CHESTS[c.type].rar].color], shape: 3, add: true });
      if (c.t >= 0.85) {
        c.phase = 'open'; c.t = 0;
        Sound.play('chestOpen'); screenShake(10, 0.4); screenFlash(0.9);
        const col = RARITY[CHESTS[c.type].rar].color;
        PS.emit(W / 2, H * 0.5, { count: 90, speed: [150, 620], life: [0.6, 1.4], size: [3, 8], colors: ['#ffffff', '#ffe45c', col], shape: 2, add: true, drag: 1.5, gravity: 200 });
        PS.emit(W / 2, H * 0.5, { count: 30, speed: [80, 380], life: [0.8, 1.5], size: [5, 9], colors: ['#ffd23a'], shape: 6, gravity: 600 });
        PS.emit(W / 2, H * 0.5 - 20, { count: 1, speed: [0, 0], life: [0.6, 0.6], size: [260, 260], size1: 0.05, colors: [col], shape: 4, add: true });
        Save.data.stats.chests = Save.data.stats.chests; // (already counted when rolled)
      }
    }
    if (c.phase === 'show') c.showT = (c.showT || 0) + dt;
    if (c.phase === 'open') { c.open = Math.min(1, c.t / 0.25); if (c.t > 0.45 && !c.shown) { c.shown = true; c.phase = 'show'; this.showChestRewards(); } }
  },
  drawChest(c) {
    const cx = W / 2, cy = H * 0.52, t = this.t, ch = this.chest;
    c.fillStyle = 'rgba(12,6,28,.82)'; c.fillRect(0, 0, W, H);
    // light rays
    const col = RARITY[CHESTS[ch.type].rar].color;
    c.save(); c.translate(cx, cy - 40); c.rotate(t * 0.4); c.globalCompositeOperation = 'lighter';
    const ra = 0.1 + ch.glow * 0.2 + (ch.phase === 'show' || ch.phase === 'open' ? 0.25 : 0);
    for (let i = 0; i < 12; i++) { c.rotate(TAU / 12); c.fillStyle = hexA(col, ra); c.beginPath(); c.moveTo(0, 0); c.lineTo(-40, -600); c.lineTo(40, -600); c.closePath(); c.fill(); }
    c.restore();
    let y = cy, sx = 1, sy = 1, rot = 0;
    if (ch.phase === 'drop') { const k = Math.min(1, ch.t / 0.8); y = lerp(-120, cy, Ease.outBounce(k)); }
    else if (ch.phase === 'wait') { y = cy + Math.sin(t * 3) * 6; const p = Math.abs(Math.sin(t * 3)); sx = 1 + p * 0.03; sy = 1 - p * 0.03; }
    else if (ch.phase === 'shake') { rot = Math.sin(ch.t * 60) * 0.06 * (0.3 + ch.glow); sx = 1 + ch.glow * 0.1; sy = 1 - ch.glow * 0.08; }
    else if (ch.phase === 'open') { const k = Math.min(1, ch.t / 0.2); sx = 1 + Math.sin(k * Math.PI) * 0.2; sy = 1 - Math.sin(k * Math.PI) * 0.15; }
    else { y = lerp(cy, H * 0.27, Ease.outBack(Math.min(1, (ch.showT || 0) / 0.45))); const s2 = lerp(1, 0.75, Math.min(1, (ch.showT || 0) / 0.45)); sx = s2; sy = s2; }
    c.save(); c.translate(cx, y); c.rotate(rot); c.scale(sx, sy);
    drawChest(c, ch.type, 0, 0, 1.9, ch.open, Math.max(ch.glow, ch.open), t);
    c.restore();
  },

  /* ------------------------------ VICTORY / DEFEAT ------------------ */
  onBattleEnd(win) {
    const b = this.battle; if (!b) return;
    if (win) this.processVictory(); else this.showDefeat();
  },
  processVictory() {
    const b = this.battle, s = Save.data;
    const ratio = b.hp / b.maxHp;
    const st = ratio >= 0.7 ? 3 : ratio >= 0.35 ? 2 : 1;
    if (st === 3) Prog.track('perfect');
    const key = Prog.levelKey(b.world, b.lvl), first = !Prog.isCleared(b.world, b.lvl);
    const bonus = Math.floor(30 * Math.pow(1.07, b.gl) * (1 + st * 0.3) * b.goldMul * (b.node === 'boss' ? 3 : b.node === 'guardian' ? 2 : 1));
    b.runCoins += bonus;
    const gems = first ? { boss: 25, elite: 8, treasure: 5, fight: 4, ambush: 7, guardian: 12 }[b.node] : (st === 3 && chance(0.3 * b.luck) ? 1 : 0);
    b.runGems += gems;
    b.runXp += 40 * Math.pow(1.05, b.gl);
    const coins = Math.floor(b.runCoins), totalGems = b.runGems, xp = Math.floor(b.runXp);
    this.bankRun(1);
    Prog.track('levels');
    const prev = s.progress.stars[key] || 0;
    if (st === 3 && prev < 3) s.stats.threeStars++;
    s.progress.stars[key] = Math.max(prev, st); s.progress.cleared[key] = 1;
    let chest = null;
    if (b.node === 'boss') chest = first ? 'gold' : 'silver';
    else if (b.node === 'guardian') chest = first ? 'gold' : 'silver';
    else if (b.node === 'elite' || b.node === 'ambush') chest = first ? 'silver' : (chance(0.5 * b.luck) ? 'wood' : null);
    else if (b.node === 'treasure') chest = 'wood';
    else if (first && b.world === 0 && (b.lvl === 0 || b.lvl === 2)) chest = 'wood';
    let slot = null;
    if (b.world === 0 && b.lvl >= 1 && s.squadSlots < 2) { s.squadSlots = 2; slot = 2; if (!s.squad[1]) s.squad[1] = s.squad[0] === 'archer' ? 'knight' : 'archer'; }
    if (b.world === 0 && b.lvl >= 5 && s.squadSlots < 3) { s.squadSlots = 3; slot = 3; if (!s.squad[2]) { const c = HERO_IDS.find(id => s.heroes[id].unlocked && !s.squad.includes(id)); if (c) s.squad[2] = c; } }
    if (b.mode === 'story' && (b.world > 1 || (b.world === 1 && b.lvl === LV - 1)) && s.squadSlots < 4) { s.squadSlots = 4; slot = 4; if (!s.squad[3]) { const c = HERO_IDS.find(id => s.heroes[id].unlocked && !s.squad.includes(id)); if (c) s.squad[3] = c; } }
    const finale = b.node === 'boss' && b.world === WORLDS.length - 1 && first;
    if (finale) s.endless.unlocked = true;
    Save.save();
    this.vic = { st, coins, gems: totalGems, xp, chest, first, finale, slot, bossStory: b.node === 'boss' && first };
    this.setState('VICTORY');
    const hasNext = b.lvl < LV - 1 || b.world < WORLDS.length - 1;
    UI.overlay('victory', `<div class="panel"><div class="ribbon" style="background:linear-gradient(#ffd84d,#ff9b1a)">VICTORY!</div>
      <div class="stars3">${[0, 1, 2].map(i => `<span class="${i < st ? 'on' : ''}" style="animation-delay:${0.25 + i * 0.28}s">★</span>`).join('')}</div>
      <div class="rew" style="animation-delay:.9s">${IC.coin} COINS <span class="v" data-count="${coins}">+0</span></div>
      <div class="rew" style="animation-delay:1.05s">${IC.gem} GEMS <span class="v" data-count="${totalGems}">+0</span></div>
      <div class="rew" style="animation-delay:1.2s">${IC.xp} XP <span class="v" data-count="${xp}">+0</span></div>
      <div class="note" style="animation:rewardIn .5s 1.3s both">⚔️ ${b.kills} kills · 🎯 ${b.crits} crits${b.interrupts ? ' · ⚡ ' + b.interrupts + ' interrupts' : ''} · ⏱ ${Math.floor(b.t / 60)}:${String(Math.floor(b.t % 60)).padStart(2, '0')}</div>
      ${chest ? `<div class="rew" style="animation-delay:1.35s">🎁 ${CHESTS[chest].name.toUpperCase()}</div>` : ''}
      ${slot ? `<div class="rew" style="animation-delay:1.5s;color:#7dff6a">🛡️ SQUAD SLOT ${slot} UNLOCKED!</div>` : ''}
      <div class="row" style="margin-top:6px"><button class="btn blue grow" data-act="vcontinue">MAP</button>${hasNext && !finale ? '<button class="btn green grow glow" data-act="vnext">NEXT ▶</button>' : ''}</div></div>`);
    setTimeout(() => this.countUp(), 900);
    for (let i = 0; i < 3; i++) setTimeout(() => { if (i < st) { Sound.play('coin'); screenShake(3, 0.1); } }, 300 + i * 280);
  },
  countUp() {
    for (const el of document.querySelectorAll('#ov-victory [data-count]')) {
      const to = +el.dataset.count; let k = 0;
      const step = () => { k = Math.min(1, k + 0.035); el.textContent = '+' + fmt(Math.round(to * Ease.outCubic(k))); if (k < 1) requestAnimationFrame(step); };
      step();
    }
    Sound.play('coin');
  },
  afterVictory(next) {
    const v = this.vic, b = this.battle;
    const w = b.world, l = b.lvl;
    const go = () => {
      if (v.finale) { this.startEnding(); return; }
      if (v.bossStory && w < WORLDS.length - 1 && b.lvl === LV - 1) {
        this.battle = null;
        UI.mapWorld = w + 1;
        this.setState('MAP');
        UI.dialog('WORLD ' + (w + 2) + '!', `<div style="font-size:60px">🗺️</div><b>${WORLDS[w + 1].name}</b> is now open!<br><br><i>“${WORLDS[w + 1].story[0]}”</i>`, [{ label: 'ONWARDS!', cls: 'green' }]);
        return;
      }
      if (next) {
        let nw = w, nl = l + 1; if (nl > LV - 1) { nw++; nl = 0; }
        this.battle = null; this.startBattle({ mode: 'story', w: nw, l: nl });
      } else { this.battle = null; UI.mapWorld = w; this.setState('MAP'); }
    };
    if (v.chest) this.openChest(v.chest, null, go); else go();
  },
  showDefeat() {
    const b = this.battle, s = Save.data;
    const endless = b.mode === 'endless';
    if (endless) {
      const wave = Math.max(0, b.waveNo);
      if (wave > s.endless.best) { s.endless.best = wave; UI.toast('🏆 NEW BEST: WAVE ' + wave, 'gold'); }
      b.runGems += Math.floor(wave / 5) * 3;
      Save.save();
    }
    this.setState('DEFEAT');
    const cost = 15 * (b.revives + 1);
    const canRevive = b.revives < 2;
    UI.overlay('defeat', `<div class="panel"><div class="ribbon" style="background:linear-gradient(#9aa3c2,#4d5270)">DEFEATED</div>
      <div class="center col" style="gap:4px"><div style="font-size:70px">💀</div>
      <div class="h3">Enemies Defeated: <span style="color:#ffe45c">${b.kills}</span></div>
      <div class="small">${endless ? 'Reached WAVE ' + b.waveNo + ' · Best ' + s.endless.best : 'Wave ' + b.waveNo + ' / ' + b.totalWaves}</div>
      <div class="small">Collected ${IC.coin} ${fmt(b.runCoins)} ${IC.gem} ${b.runGems}</div></div>
      ${canRevive ? `<button class="btn purple big ${s.gems >= cost ? 'glow' : 'off'}" data-act="revive">❤️ REVIVE ${IC.gem} ${cost}</button>` : ''}
      <button class="btn green" data-act="retry">↻ TRY AGAIN</button>
      <button class="btn blue" data-act="tomap">🗺️ ${endless ? 'MENU' : 'MAP'}</button>
      <div class="note">Tip: ${pick(['level up heroes and buy permanent upgrades to get stronger!', 'unlock more heroes — a 4th squad slot opens after World 2.', 'burst bosses with specials while they telegraph to INTERRUPT them.', 'replay earlier levels for coins and 3 stars.', 'equip gear under Heroes → Gear. Chests are full of it!', 'try a lower difficulty in Settings if you are stuck.', 'skill points: every hero level gives one. Spend them in the skill tree!'])}</div></div>`);
  },
  revive() {
    const b = this.battle; if (!b) return;
    const cost = 15 * (b.revives + 1);
    if (!Prog.spend('gems', cost)) { Sound.play('error'); UI.toast('Not enough gems!'); return; }
    Save.save();
    this.setState(b.boss && b.boss.alive ? 'BOSS' : 'GAMEPLAY');
    b.revive();
  },

  /* ------------------------------ INTRO / ENDING -------------------- */
  startIntro() {
    this.battle = null;
    this.intro = { step: 0, t: 0, a: [new Anim(), new Anim(), new Anim()], king: new Anim() };

      if (bn.sub) txt(c, bn.sub, 0, size * 0.85, 22, '#ffffff', 'center', 6);
      c.restore();
    }
    // ---- tutorial hints ----
    const tut = Save.data.tut || (Save.data.tut = {});
    if (!tut.fight && b.mode === 'story' && b.world === 0 && b.lvl === 0 && b.phase === 'fight') {
      if (b.t > 12) { tut.fight = 1; Save.soon(); }
      c.globalAlpha = 0.7 + Math.sin(t * 4) * 0.3;
      txt(c, 'Your heroes hold the line and fight on their own!', W / 2, b.heroY + 68, 17, '#ffffff');
      txt(c, 'Pick upgrades between waves to make them stronger.', W / 2, b.heroY + 92, 15, '#c9ffb8');
      c.globalAlpha = 1;
    }
    if (!tut.special && !Save.data.settings.autoSpec && b.heroes.some(h => h.charge >= 100) && b.phase === 'fight') {
      txt(c, 'SPECIAL READY! ' + (this.desktop ? 'Press 1-4 or click' : 'Tap') + ' the glowing button ↓', W / 2, H - 150, 18, '#ffe45c');
      if (b.heroes.some(h => h.sp)) { tut.special = 1; Save.soon(); }
    }
    // auto / speed toggles (right edge)
    for (const btn of this.hudButtons()) {
      if (btn.kind !== 'auto' && btn.kind !== 'speed') continue;
      const on = btn.kind === 'auto' ? Save.data.settings.autoSpec : Save.data.settings.speed > 1;
      const hv = this.hover === btn.kind ? 1.08 : 1;
      c.save(); c.translate(btn.x, btn.y); c.scale(hv, hv);
      circ(c, 0, 0, btn.r); c.fillStyle = on ? 'rgba(47,191,63,.9)' : 'rgba(20,10,45,.8)'; c.fill(); c.lineWidth = 3; c.strokeStyle = on ? '#9cff6e' : 'rgba(255,255,255,.25)'; c.stroke();
      txt(c, btn.kind === 'auto' ? 'AUTO' : (on ? '2×' : '1×'), 0, 1, btn.kind === 'auto' ? 12 : 17, '#fff');
      if (this.desktop) txt(c, btn.kind === 'auto' ? 'Q' : 'F', 0, btn.r + 9, 11, '#c9b8ff');
      c.restore();
    }
    if (b.hymnT > 0) txt(c, '🎵 BATTLE HYMN ' + Math.ceil(b.hymnT) + 's', W / 2, H - 150, 16, '#ff9ad8');
    else if (b.webT > 0) txt(c, '🕸️ WEBBED — attacks slowed', W / 2, H - 150, 16, '#e8e8ff');
  },
  drawVignette(c, b) {
    if (b && b.hp / b.maxHp < 0.3 && b.hp > 0) {
      const a = 0.25 + Math.sin(this.t * 6) * 0.12;
      const g = c.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75); g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, 'rgba(255,0,40,' + a + ')');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    if (FX.vignette > 0) {
      const g = c.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.72); g.addColorStop(0, 'rgba(' + FX.vigColor + ',0)'); g.addColorStop(1, 'rgba(' + FX.vigColor + ',' + FX.vignette * 0.6 + ')');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
  },

  /* ------------------------------ UPDATE / RENDER ------------------- */
  update(dt) {
    this.t += dt;
    PS.update(dt); TX.update(dt);
    const b = this.battle;
    if (b) {
      if (this.isPlaying()) b.update(dt);
      else if (this.state === 'VICTORY' || this.state === 'DEFEAT' || (this.state === 'CHEST' && this.chestPrevScene === 'battle')) {
        // ambient animation behind overlays (celebration / defeat)
        b.t += dt;
        for (const h of b.heroes) { if (this.state === 'VICTORY' && h.a.state !== 'VICTORY') h.a.set('VICTORY'); h.a.update(dt); }
        for (let i = b.pickups.length - 1; i >= 0; i--) { b.updatePickup(b.pickups[i], dt); if (b.pickups[i].dead) b.pickups.splice(i, 1); }
        for (let i = b.enemies.length - 1; i >= 0; i--) { const e = b.enemies[i]; if (e.dying) { b.updateEnemy(e, dt); if (e.remove) b.enemies.splice(i, 1); } }
        if (this.state === 'VICTORY' && Math.random() < dt * 14) PS.emit(rand(0, W), -10, { count: 2, speed: [60, 160], angle: [1.2, 1.9], life: [2, 3], size: [4, 7], colors: ['#ff3b5c', '#ffd23a', '#5fd0ff', '#7dff6a', '#c77dff'], gravity: 120, shape: 1, vr: 10 });
      }
    }
    if (this.chest) this.updateChest(dt);
    if (this.intro) this.intro.t += dt;
    if (this.ending) this.ending.t += dt;
    UI.tickDetail(dt);
  },
  render(dt) {
    const s = appW / W * DPR;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const b = this.battle;
    switch (this.scene) {
      case 'battle':
        if (!b) { ctx.fillStyle = '#1a0f33'; ctx.fillRect(0, 0, W, H); break; }
        ctx.save(); ctx.translate(FX.ox, FX.oy);
        b.render(ctx);
        ctx.restore();
        this.drawVignette(ctx, b);
        if (this.state !== 'VICTORY' || !this.chest) this.drawHUD(ctx, b);
        break;
      case 'menu': ctx.save(); ctx.translate(FX.ox, FX.oy); this.drawMenu(ctx, dt); ctx.restore(); break;
      case 'map': case 'dim': {
        const wi = this.scene === 'map' ? UI.mapWorld : Math.min(Prog.currentLevel().w, WORLDS.length - 1);
        ctx.drawImage(BG.get(wi), 0, 0, W, H); drawWorldFX(ctx, wi, this.t, false);
        ctx.fillStyle = this.scene === 'map' ? 'rgba(15,8,35,.35)' : 'rgba(20,10,45,.78)'; ctx.fillRect(0, 0, W, H);
        drawWorldFX(ctx, wi, this.t, true);
        PS.draw(ctx);
        break;
      }
      case 'intro': ctx.save(); ctx.translate(FX.ox, FX.oy); this.drawIntro(ctx, dt); PS.draw(ctx); ctx.restore(); break;
      case 'ending': this.drawEnding(ctx, dt); PS.draw(ctx); break;
    }
    if (this.chest) { this.drawChest(ctx); PS.draw(ctx); }
    if (FX.flash > 0) { ctx.globalAlpha = Math.min(1, FX.flash); ctx.fillStyle = FX.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  },
};

/* ============================== INPUT =============================== */
const Input = {
  toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; },
  init() {
    canvas.addEventListener('pointerdown', e => {
      Sound.init();
      if (e.pointerType === 'mouse') Game.desktop = true;
      const p = this.toLogical(e);
      if (!Game.isPlaying()) return;
      for (const btn of Game.hudButtons()) {
        if (dist2(p.x, p.y, btn.x, btn.y) < (btn.r + 12) * (btn.r + 12)) { Game.hudClick(btn); return; }
      }
    });
    canvas.addEventListener('pointermove', e => {
      const p = this.toLogical(e);
      if (e.pointerType === 'mouse') {
        Game.hover = null;
        if (Game.isPlaying()) for (const btn of Game.hudButtons()) if (dist2(p.x, p.y, btn.x, btn.y) < btn.r * btn.r) { Game.hover = btn.kind === 'special' ? 'special' + btn.i : btn.kind; }
        canvas.style.cursor = Game.hover ? 'pointer' : 'default';
      }
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => {
      Sound.init(); Game.desktop = true;
      if (e.repeat) return;
      const k = e.key, kl = k.toLowerCase();
      const b = Game.battle, st = Game.state;
      const click = sel => { const el = document.querySelector(sel); if (el && el.offsetParent !== null) { el.click(); return true; } return false; };
      // dialogs first
      if ($('ov-dialog').classList.contains('on') && st !== 'ENDING') {
        if (k === 'Escape') { UI.close('dialog'); e.preventDefault(); return; }
        if (k === 'Enter') { if (click('#ov-dialog .btn.green') || click('#ov-dialog .btn.red') || click('#ov-dialog .btn')) e.preventDefault(); return; }
        return;
      }
      if (st === 'ENDING' && (k === 'Enter' || k === ' ')) { Game.endingNext(); e.preventDefault(); return; }
      if (st === 'INTRO') { if (k === ' ' || k === 'Enter') { Game.introNext(); e.preventDefault(); } if (k === 'Escape') Game.finishIntro(); return; }
      if (st === 'CHEST') { if (k === ' ' || k === 'Enter') { if (Game.chest && Game.chest.phase === 'show') Game.closeChest(); else Game.chestTap(); e.preventDefault(); } return; }
      if (st === 'UPGRADE') { if (k === '1' || k === '2' || k === '3') Game.pickUpgrade(+k - 1); if (kl === 'r') Game.rerollUpgrade(); return; }
      if (st === 'VICTORY') { if (k === 'Enter' || k === ' ') { if (!click('#ov-victory [data-act="vnext"]')) click('#ov-victory [data-act="vcontinue"]'); e.preventDefault(); } if (kl === 'm') click('#ov-victory [data-act="vcontinue"]'); return; }
      if (st === 'DEFEAT') { if (k === 'Enter' || kl === 'r') { Game.retry(); e.preventDefault(); } if (k === 'Escape' || kl === 'm') click('#ov-defeat [data-act="tomap"]'); return; }
      if (st === 'EVENT') { if (k === 'Enter' || k === 'Escape') { if (!click('#ov-event [data-act="ev"][data-k="heal"]')) click('#ov-event [data-act="ev"][data-k="leave"]'); e.preventDefault(); } return; }
      if (st === 'PAUSE') { if (k === 'Escape' || k === ' ' || kl === 'p') { Game.resume(); e.preventDefault(); } return; }
      if (Game.isPlaying() && b) {
        if (k === 'Escape' || k === ' ' || kl === 'p') { Game.pause(); e.preventDefault(); return; }
        if (k >= '1' && k <= '4') { b.useSpecial(+k - 1); return; }
        if (kl === 'q') { Game.hudClick({ kind: 'auto' }); return; }
        if (kl === 'f') { Game.hudClick({ kind: 'speed' }); return; }
        return;
      }
      // menus
      if (k === 'Escape' && UI.screen && UI.screen !== 'menu') { click('#scr-' + UI.screen + ' [data-act="back"]'); return; }
      if (st === 'MENU' && (k === 'Enter' || k === ' ')) { click('#scr-menu [data-act="play"]'); e.preventDefault(); return; }
      if (st === 'MAP') {
        if (k === 'Enter' || k === ' ') { click('#scr-map .map-bottom [data-act="node"]'); e.preventDefault(); }
        if (k === 'ArrowLeft') click('#scr-map [data-act="world"][data-d="-1"]');
        if (k === 'ArrowRight') click('#scr-map [data-act="world"][data-d="1"]');
      }
    });
  },
};

/* ============================== RESIZE ============================== */
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w, h;
  const desktop = vw >= 900 && vw > vh * 1.05;
  if (desktop) {
    h = vh; w = Math.round(vh * 0.5625); W = CONFIG.W; H = 960;
  } else {
    if (vw / vh <= 0.66) { w = vw; h = vh; } // phone portrait: fill the screen
    else { h = vh; w = Math.min(vw, Math.round(vh * 0.5625)); }
    let lh = CONFIG.W * h / w;
    if (lh > CONFIG.MAX_H) { h = Math.round(w * CONFIG.MAX_H / CONFIG.W); lh = CONFIG.MAX_H; }
    if (lh < CONFIG.MIN_H) { w = Math.round(h * CONFIG.W / CONFIG.MIN_H); lh = CONFIG.MIN_H; }
    W = CONFIG.W; H = Math.round(lh);
  }
  appW = w; appH = h;
  DPR = Math.min(CONFIG.MAX_DPR, window.devicePixelRatio || 1);
  const app = document.getElementById('app');
  app.style.width = w + 'px'; app.style.height = h + 'px';
  app.style.left = Math.round((vw - w) / 2) + 'px'; app.style.top = Math.round((vh - h) / 2) + 'px';
  canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
  const ui = document.getElementById('ui');
  ui.style.width = W + 'px'; ui.style.height = H + 'px'; ui.style.transform = 'scale(' + (w / W) + ')';
  if (Game.battle) { Game.battle.heroY = H - 196; Game.battle.floorY = H - 132; }
  Desk.layout(desktop, Math.round((vw - w) / 2), w, vh);
}

/* ============================== GAME LOOP =========================== */
let lastTime = 0, acc = 0;
function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  let rdt = lastTime ? (ts - lastTime) / 1000 : 0;
  lastTime = ts;
  if (!(rdt > 0)) rdt = 0;
  rdt = Math.min(rdt, 0.25); // protect against tab-switch spikes
  try {
    updateFX(rdt);
    acc += rdt * timeScale() * (Game.isPlaying() && Game.battle ? (Save.data.settings.speed || 1) : 1);
    let steps = 0;
    while (acc >= CONFIG.STEP && steps < CONFIG.MAX_STEPS * 2) { Game.update(CONFIG.STEP); acc -= CONFIG.STEP; steps++; }
    Desk.tick(rdt);
    if (steps >= CONFIG.MAX_STEPS * 2) acc = 0;
    Game.render(rdt * timeScale());
    Sound.tickMusic();
    Save.tick(rdt);
  } catch (e) {
    console.error(e);
    Game.errors = (Game.errors || 0) + 1;
    if (Game.errors > 30 && Game.battle) { Game.errors = 0; UI.toast('Oops — recovered from an error'); Game.exitBattle('MENU'); }
  }
}

/* ============================== BOOT ================================ */
function boot() {
  Save.load();
  Prog.ensureDaily();
  resize();
  UI.init(); Input.init();
  window.addEventListener('resize', () => { resize(); });
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Game.pause(); Save.save(); Sound.suspend(); }
    else { lastTime = 0; acc = 0; Sound.resume(); }
  });
  window.addEventListener('blur', () => { Game.pause(); Save.save(); });
  window.addEventListener('pagehide', () => Save.save());
  window.addEventListener('beforeunload', () => Save.save());
  if (!Save.ok) setTimeout(() => UI.toast('⚠️ Storage unavailable — progress will not be saved', ''), 800);
  if (Save.data.seenIntro) Game.setState('MENU'); else Game.startIntro();
  if (Save.data.migrated) { delete Save.data.migrated; Save.save(); setTimeout(() => UI.dialog('GREJS HEROES 2.0', '<div style="font-size:54px">🎉</div>A brand new <b>10-world campaign</b> with 150 levels!<br><br>Your heroes, gear, coins, gems and upgrades came with you — but the map starts over.<br><br><b>12 new heroes · 10 new enemies · 4 new bosses</b>', [{ label: "LET'S GO!", cls: 'green' }]), 600); }
  requestAnimationFrame(gameLoop);
}
try { boot(); }
catch (e) {
  console.error(e);
  const f = document.getElementById('fatal'); f.style.display = 'flex';
  f.textContent = 'Grejs Heroes could not start: ' + e.message;
}

</script>
