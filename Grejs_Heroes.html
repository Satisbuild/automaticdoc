<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Grejs Heroes</title>
<style>
:root{
  --font:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --ink:#1e1433;
  --panel:#2b1d52;
  --panel2:#3b2a6e;
  --gold:#ffcf3f;
  --out:0 3px 0 #1e1433, 2px 2px 0 #1e1433, -2px 2px 0 #1e1433, 2px -1px 0 #1e1433, -2px -1px 0 #1e1433;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#140c24;font-family:var(--font);color:#fff}
body{background:radial-gradient(ellipse at 50% 20%,#40247a 0%,#1a0f33 55%,#0c0718 100%);overscroll-behavior:none}
body:before{content:"";position:fixed;inset:0;opacity:.18;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:34px 34px;pointer-events:none}
#app{position:absolute;overflow:hidden;background:#0c0718;box-shadow:0 0 0 3px #0c0718,0 0 80px rgba(120,70,255,.35),0 30px 80px rgba(0,0,0,.7)}
@media (min-aspect-ratio: 5/8){#app{border-radius:22px}}
#game{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:absolute;left:0;top:0;width:540px;transform-origin:0 0;pointer-events:none}
.screen,.overlay{position:absolute;left:0;top:0;width:100%;height:100%;display:none;flex-direction:column;pointer-events:auto}
.screen.on,.overlay.on{display:flex}
.screen.on{animation:scrIn .32s cubic-bezier(.2,1.3,.4,1)}
.overlay{background:rgba(12,6,28,.72);align-items:center;justify-content:center;z-index:20}
.overlay.clear{background:transparent}
.overlay.on>.panel{animation:popIn .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 6px rgba(255,210,80,.6))}50%{filter:drop-shadow(0 0 18px rgba(255,210,80,1))}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes cardIn{0%{opacity:0;transform:translateY(80px) rotateY(90deg) scale(.6)}60%{opacity:1;transform:translateY(-10px) rotateY(-8deg) scale(1.05)}100%{transform:none}}
@keyframes rewardIn{0%{opacity:0;transform:scale(.2) rotate(-12deg)}70%{transform:scale(1.15) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes starIn{0%{opacity:0;transform:scale(3) rotate(-90deg)}70%{opacity:1;transform:scale(.85)}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.2)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes flashIn{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9),inset 0 0 60px #fff}100%{box-shadow:0 0 0 30px rgba(255,255,255,0)}}
@keyframes titleIn{0%{opacity:0;transform:scale(.3)}55%{opacity:1;transform:scale(1.18)}75%{transform:scale(.94)}100%{transform:scale(1)}}

/* ---------- text & icons ---------- */
.t-out{text-shadow:var(--out)}
.h1{font-weight:900;font-size:44px;letter-spacing:1px;text-shadow:var(--out)}
.h2{font-weight:900;font-size:32px;text-shadow:var(--out)}
.h3{font-weight:900;font-size:24px;text-shadow:var(--out)}
.small{font-size:18px;font-weight:700;opacity:.9}
.ic{display:inline-block;vertical-align:-0.12em;flex:none}
.ic-coin{width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbd0 0,#ffd83a 35%,#f0a000 75%);box-shadow:inset 0 -.12em 0 #b86b00,0 0 0 .1em #6b3a00}
.ic-gem{width:.8em;height:.8em;margin:0 .1em;transform:rotate(45deg);border-radius:.14em;background:linear-gradient(135deg,#e6fbff 0,#43d2ff 40%,#6a4bff 100%);box-shadow:0 0 0 .1em #221a5c,inset -.1em -.1em 0 rgba(0,0,0,.25)}
.ic-frag{width:.9em;height:.9em;clip-path:polygon(50% 0,100% 38%,80% 100%,20% 100%,0 38%);background:linear-gradient(#ffb3f2,#b04bff)}
.ic-xp{width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8ffd8,#6cff5a 45%,#1fa33a);box-shadow:0 0 0 .1em #0f4d20}

/* ---------- buttons ---------- */
.btn{pointer-events:auto;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:68px;padding:0 26px;border:none;border-radius:20px;font:900 27px/1.05 var(--font);color:#fff;text-shadow:var(--out);cursor:pointer;
  background:linear-gradient(180deg,#ffd84d 0%,#ff9b1a 100%);box-shadow:0 7px 0 #b04f00,0 12px 22px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.12);
  transition:transform .14s cubic-bezier(.3,1.8,.5,1),box-shadow .14s,filter .2s;outline:none}
.btn:hover{transform:scale(1.04);filter:brightness(1.08)}
.btn:active,.btn.press{transform:scale(.96) translateY(4px);box-shadow:0 3px 0 #b04f00,0 5px 10px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.green{background:linear-gradient(#8cf55a,#2fbf3f);box-shadow:0 7px 0 #17752a,0 12px 22px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.55)}
.btn.blue{background:linear-gradient(#63d4ff,#2d7dff);box-shadow:0 7px 0 #1a3fa8,0 12px 22px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.purple{background:linear-gradient(#d18cff,#8a3dff);box-shadow:0 7px 0 #4d1aa8,0 12px 22px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.red{background:linear-gradient(#ff7a7a,#e5243b);box-shadow:0 7px 0 #8a0f22,0 12px 22px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.grey{background:linear-gradient(#9aa3c2,#5d6488);box-shadow:0 7px 0 #353a57,0 12px 22px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.4)}
.btn.small{min-height:60px;font-size:22px;padding:0 18px;border-radius:16px}
.btn.icon{min-width:64px;min-height:64px;padding:0;border-radius:18px;font-size:30px}
.btn.big{min-height:84px;font-size:34px;border-radius:24px}
.btn[disabled],.btn.off{filter:grayscale(.85) brightness(.75);cursor:default}
.btn[disabled]:hover{transform:none}
.btn.glow{animation:glowPulse 1.4s infinite}
.btn .badge{position:absolute;top:-8px;right:-8px;min-width:30px;height:30px;border-radius:15px;background:#ff3b5c;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #1e1433;animation:pulse 1s infinite}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
.center{text-align:center;align-items:center;justify-content:center}

/* ---------- panels ---------- */
.panel{position:relative;background:linear-gradient(180deg,#4a3590 0%,#2b1d59 100%);border-radius:28px;padding:22px;box-shadow:0 0 0 4px #1e1433,0 0 0 8px #7c5cff,0 0 0 11px #1e1433,0 30px 60px rgba(0,0,0,.6),inset 0 3px 0 rgba(255,255,255,.2);width:470px;max-height:92%;display:flex;flex-direction:column;gap:14px}
.panel .title{font-size:40px;font-weight:900;text-align:center;text-shadow:var(--out);margin-top:-4px}
.ribbon{align-self:center;margin-top:-52px;padding:10px 40px;background:linear-gradient(#ff6b8b,#d8264f);border-radius:16px;box-shadow:0 0 0 4px #1e1433,0 6px 0 #1e1433;font:900 30px var(--font);text-shadow:var(--out);transform:rotate(-2deg)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border-radius:18px;padding:12px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}

/* ---------- top bar ---------- */
.topbar{align-self:stretch;display:flex;align-items:center;gap:8px;padding:14px 14px 8px;min-height:88px}
.pill{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 10px;background:rgba(20,10,45,.75);border-radius:26px;font-weight:900;font-size:24px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);text-shadow:var(--out)}
.pill .ic{font-size:30px}
.pill.bump{animation:pulse .25s}
.lvlpill{position:relative;overflow:hidden;padding:0 14px}
.lvlpill .bar{position:absolute;left:0;bottom:0;height:5px;background:#6cff5a}
.scr-title{flex:1;text-align:center;font-weight:900;font-size:34px;text-shadow:var(--out)}
.scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.body{flex:1;padding:6px 18px 26px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:10px;padding:0 18px 6px}
.tab{flex:1;min-height:60px;border-radius:16px;background:rgba(20,10,45,.6);font:900 22px var(--font);color:#c9b8ff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(255,255,255,.1);transition:transform .12s}
.tab.on{background:linear-gradient(#8e6bff,#5a37d8);color:#fff;text-shadow:var(--out);box-shadow:0 5px 0 #2d1a7a,inset 0 2px 0 rgba(255,255,255,.4)}
.tab:active{transform:scale(.96)}

/* ---------- menu ---------- */
#scr-menu{align-items:center}
.logo{margin-top:72px;text-align:center;line-height:.86;animation:titleIn 1s cubic-bezier(.2,1.4,.4,1) both}
.logo .l1,.logo .l2{display:block;font-weight:900;letter-spacing:2px}
.logo .l1{font-size:92px;background:linear-gradient(180deg,#fff7b0 0%,#ffd23a 40%,#ff8a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #7a2c00) drop-shadow(0 0 0 #1e1433) drop-shadow(3px 3px 0 #1e1433) drop-shadow(-3px -2px 0 #1e1433) drop-shadow(0 0 22px rgba(255,190,60,.7))}
.logo .l2{font-size:78px;background:linear-gradient(180deg,#e0f7ff 0%,#5fd0ff 45%,#6a4bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #20106b) drop-shadow(3px 3px 0 #1e1433) drop-shadow(-3px -2px 0 #1e1433) drop-shadow(0 0 22px rgba(90,160,255,.8))}
.logo .sub{display:inline-block;margin-top:14px;padding:6px 18px;border-radius:12px;background:rgba(20,10,45,.7);font:900 20px var(--font);letter-spacing:3px;color:#ffd84d}
.logo-wrap{animation:bob 3.2s ease-in-out infinite}
.menu-btns{margin-top:auto;margin-bottom:30px;width:400px;display:flex;flex-direction:column;gap:16px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.menu-grid .btn{font-size:23px;padding:0 8px;white-space:nowrap}

/* ---------- hero cards ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hcard{position:relative;border-radius:22px;padding:8px 8px 12px;text-align:center;cursor:pointer;transition:transform .14s cubic-bezier(.3,1.8,.5,1);border:5px solid #b8c4d6;background:linear-gradient(180deg,#56627a,#2e3550)}
.hcard:hover{transform:scale(1.04)} .hcard:active{transform:scale(.96)}
.hcard canvas{width:100%;height:auto;display:block;border-radius:14px;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.25),rgba(0,0,0,.15))}
.hcard .nm{font-weight:900;font-size:21px;text-shadow:var(--out);margin-top:6px}
.hcard .lv{position:absolute;top:12px;left:12px;background:#1e1433;border-radius:10px;padding:3px 9px;font-weight:900;font-size:17px}
.hcard .eq{position:absolute;top:10px;right:10px;background:linear-gradient(#8cf55a,#2fbf3f);border-radius:10px;padding:3px 8px;font-weight:900;font-size:15px;box-shadow:0 0 0 2px #1e1433}
.hcard .lock{position:absolute;inset:0;border-radius:17px;background:rgba(10,5,25,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px}
.hcard .lock .small{font-size:16px}
.rtag{display:inline-block;padding:3px 10px;border-radius:9px;font-weight:900;font-size:15px;letter-spacing:1px;text-shadow:var(--out)}
.r-common{border-color:#c3cde0;background:linear-gradient(180deg,#65718d,#353d5a)}
.r-uncommon{border-color:#5fdc6b;background:linear-gradient(180deg,#3e8a55,#1f4a33)}
.r-rare{border-color:#3fa4ff;background:linear-gradient(180deg,#2f6fd6,#1b2f7a);box-shadow:0 0 16px rgba(63,164,255,.55)}
.r-epic{border-color:#c06bff;background:linear-gradient(180deg,#8a3ddb,#3d1580);box-shadow:0 0 20px rgba(182,92,255,.7)}
.r-legendary{border-color:#ffc02e;background:linear-gradient(180deg,#e5911a,#7a3b06);box-shadow:0 0 26px rgba(255,182,39,.85);animation:glowPulse 2s infinite}
.r-mythic{border-color:#ff4d6d;background:linear-gradient(120deg,#ff4d6d,#ffb13d,#5dff9a,#4dc3ff,#b04dff,#ff4d6d);background-size:300% 100%;animation:shimmer 3s linear infinite;box-shadow:0 0 30px rgba(255,77,109,.9)}
.bg-common{background:#8993ab}.bg-uncommon{background:#3fb353}.bg-rare{background:#2f7ff0}.bg-epic{background:#9a45f0}.bg-legendary{background:#f0a01a}.bg-mythic{background:linear-gradient(90deg,#ff4d6d,#ffb13d,#4dc3ff,#b04dff)}
.bar{position:relative;height:22px;border-radius:11px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:11px;background:linear-gradient(#9cff6e,#2fbf3f);transition:width .5s cubic-bezier(.2,1.2,.4,1)}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;text-shadow:var(--out)}

/* hero detail */
.hd-top{display:flex;gap:14px;align-items:stretch}
.hd-portrait{width:200px;flex:none;border-radius:22px;border:5px solid;padding:6px;position:relative}
.hd-portrait canvas{width:100%;display:block;border-radius:14px;background:radial-gradient(circle at 50% 65%,rgba(255,255,255,.3),rgba(0,0,0,.2))}
.stat{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:21px;padding:6px 12px;border-radius:12px;background:rgba(0,0,0,.22)}
.stat b{color:#ffe28a}
.stat .up{color:#7dff6a;font-size:17px;margin-left:6px}
.stat.flash{animation:flashIn .6s}
.lvlup-fx{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font:900 40px var(--font);color:#ffe45c;text-shadow:var(--out);pointer-events:none;white-space:nowrap;animation:floatUp 1.2s forwards}
.ring-fx{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:6px solid #ffe45c;pointer-events:none;animation:ringOut .7s ease-out forwards}
@keyframes ringOut{from{transform:scale(.3);opacity:1}to{transform:scale(6);opacity:0}}

/* skill tree */
.tree{position:relative;height:580px;margin:6px 0}
.tree svg{position:absolute;inset:0;width:100%;height:100%}
.snode{position:absolute;width:118px;margin-left:-59px;text-align:center;cursor:pointer;transition:transform .14s}
.snode:active{transform:scale(.95)}
.snode .orb{width:78px;height:78px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:radial-gradient(circle at 40% 35%,#6d5aa8,#2b1d59);box-shadow:0 0 0 4px #1e1433,0 0 0 7px #6d5aa8}
.snode.has .orb{background:radial-gradient(circle at 40% 35%,#ffe785,#f09a0a);box-shadow:0 0 0 4px #1e1433,0 0 0 7px #ffd23a,0 0 22px #ffb627}
.snode.lock .orb{filter:grayscale(1) brightness(.5)}
.snode .nm{font-weight:900;font-size:16px;margin-top:6px;text-shadow:var(--out)}
.snode .pips{display:flex;gap:3px;justify-content:center;margin-top:3px}
.snode .pips i{width:14px;height:8px;border-radius:4px;background:rgba(0,0,0,.45)}
.snode .pips i.on{background:#ffd23a}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.lrow .icon{width:64px;height:64px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 3px rgba(255,255,255,.12)}
.lrow .info{flex:1;min-width:0}
.lrow .info .nm{font-weight:900;font-size:22px;text-shadow:var(--out)}
.lrow .info .ds{font-size:16px;font-weight:700;opacity:.85;margin-top:2px}
.lrow .btn{min-width:130px}
.lrow.done{opacity:.6}
.sect{font-weight:900;font-size:24px;text-shadow:var(--out);color:#ffd84d;margin:8px 4px -2px;display:flex;align-items:center;gap:8px}
.sect .small{color:#c9b8ff;font-size:16px;margin-left:auto}

/* shop */
.shopcard{position:relative;border-radius:20px;padding:10px 8px 10px;text-align:center;border:4px solid;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .14s cubic-bezier(.3,1.8,.5,1)}
.shopcard:hover{transform:scale(1.04)}.shopcard:active{transform:scale(.96)}
.shopcard .art{height:82px;display:flex;align-items:center;justify-content:center;font-size:52px}
.shopcard canvas{width:96px;height:82px}
.shopcard .nm{font-weight:900;font-size:17px;text-shadow:var(--out);min-height:40px;display:flex;align-items:center}
.shopcard .price{width:100%;min-height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:21px;background:linear-gradient(#8cf55a,#2fbf3f);box-shadow:0 4px 0 #17752a;text-shadow:var(--out)}
.shopcard.sold{filter:grayscale(1) brightness(.6)}
.shopcard .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#ff3b5c;padding:2px 10px;border-radius:8px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 0 0 2px #1e1433}

/* map */
#map-scroll{flex:1;position:relative}
.map-inner{position:relative;width:540px}
.map-inner svg{position:absolute;left:0;top:0}
.mnode{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer;transition:transform .14s cubic-bezier(.3,1.8,.5,1);background:radial-gradient(circle at 40% 35%,#8a78c9,#3b2a6e);box-shadow:0 0 0 5px #1e1433,0 8px 0 #1e1433,inset 0 4px 0 rgba(255,255,255,.3)}
.mnode:hover{transform:scale(1.07)} .mnode:active{transform:scale(.94)}
.mnode.done{background:radial-gradient(circle at 40% 35%,#9cff6e,#2a9c3a)}
.mnode.cur{background:radial-gradient(circle at 40% 35%,#ffe785,#f09a0a);animation:pulse 1.1s infinite;box-shadow:0 0 0 5px #1e1433,0 8px 0 #1e1433,0 0 30px #ffd23a}
.mnode.locked{filter:grayscale(1) brightness(.55)}
.mnode.boss{width:130px;height:130px;margin:-65px 0 0 -65px;font-size:62px}
.mnode.boss:not(.locked):not(.done){background:radial-gradient(circle at 40% 35%,#ff8a9a,#c01b3a)}
.mnode .num{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:#1e1433;border-radius:10px;padding:2px 10px;font:900 17px var(--font);white-space:nowrap}
.mnode .stars{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:20px;white-space:nowrap;color:#ffd23a;text-shadow:var(--out);letter-spacing:-2px}
.mnode .stars .e{color:#433a66}
.world-head{display:flex;align-items:center;gap:10px;padding:0 14px}
.world-name{flex:1;text-align:center}
.world-name .n{font-weight:900;font-size:30px;text-shadow:var(--out)}
.world-name .s{font-size:16px;font-weight:700;opacity:.85}
.map-bottom{padding:10px 16px 18px;background:linear-gradient(transparent,rgba(12,6,28,.9) 30%);display:flex;gap:10px;align-items:center}
.squad-mini{display:flex;gap:8px;flex:1}
.squad-mini .slot{width:62px;height:62px;border-radius:16px;border:4px solid;overflow:hidden;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.squad-mini .slot canvas{width:100%;height:100%}

<script>
'use strict';
/* =====================================================================
   GREJS HEROES — a complete browser action-RPG
   Vanilla JS + Canvas 2D + Web Audio. No external assets.
   ===================================================================== */

/* ============================== CONFIG ============================== */
const CONFIG = {
  W: 540,            // logical width (portrait)
  MIN_H: 820,
  MAX_H: 1200,
  STEP: 1 / 60,      // fixed simulation step
  MAX_STEPS: 5,
  G: 760,            // gravity px/s^2
  SAVE_KEY: 'grejsHeroesSave',
  SAVE_VERSION: 2,
  MAX_DPR: 2,
  LV: 15,            // levels per world
  SLOTS: 4,          // max squad size
  HERO_MAX: 60,      // max hero level
};
const LV = CONFIG.LV;
// Difficulty: multiplies enemy HP / damage, and rewards.
const DIFF = {
  easy: { name: 'Easy', hp: 0.7, dmg: 0.65, rew: 0.8, ic: '🌱' },
  normal: { name: 'Normal', hp: 1, dmg: 1, rew: 1, ic: '⚔️' },
  hard: { name: 'Hard', hp: 1.55, dmg: 1.4, rew: 1.35, ic: '🔥' },
  brutal: { name: 'Brutal', hp: 2.4, dmg: 1.9, rew: 1.8, ic: '💀' },
};
let W = CONFIG.W, H = 960, DPR = 1;
const TAU = Math.PI * 2;

/* ============================== UTILS =============================== */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const chance = p => Math.random() < p;
const Ease = {
  linear: t => t,
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inOutQuad: t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inBack: t => { const c1 = 1.70158, c3 = c1 + 1; return c3 * t * t * t - c1 * t * t; },
  outElastic: t => (t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1),
  outBounce: t => {
    const n1 = 7.5625, d1 = 2.75;
    if (t < 1 / d1) return n1 * t * t;
    if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + .75;
    if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + .9375;
    return n1 * (t -= 2.625 / d1) * t + .984375;
  },
};
function fmt(n) {
  n = Math.floor(n);
  if (n < 10000) return String(n);
  if (n < 1e6) return (n / 1000).toFixed(n < 1e5 ? 1 : 0).replace(/\.0$/, '') + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
}
function weightedPick(list, wf) {
  let tot = 0;
  for (const it of list) tot += wf(it);
  let r = Math.random() * tot;
  for (const it of list) { r -= wf(it); if (r <= 0) return it; }
  return list[list.length - 1];
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function deepMerge(base, src) {
  if (src === undefined || src === null) return base;
  if (typeof base !== 'object' || base === null || Array.isArray(base) || typeof src !== 'object' || Array.isArray(src)) return src;
  const out = Object.assign({}, base);
  for (const k in src) out[k] = (k in base) ? deepMerge(base[k], src[k]) : src[k];
  return out;
}

/* ============================ SAVE SYSTEM =========================== */
const Save = {
  data: null,
  ok: true,
  dirty: false,
  timer: 0,
  defaults() {
    const heroes = {};
    for (const id of Object.keys(HEROES)) heroes[id] = { unlocked: !!HEROES[id].starter, level: 1, frags: 0, skill: {}, skin: 0 };
    return {
      v: CONFIG.SAVE_VERSION,
      coins: 200, gems: 15, xp: 0, accLevel: 1,
      heroes,
      squad: ['knight', null, null, null],
      squadSlots: 1,
      perm: { atk: 0, hp: 0, def: 0, crit: 0, gold: 0, spec: 0, aspd: 0, xp: 0, regen: 0, luck: 0, start: 0 },
      items: [], equip: { weapon: null, armor: null, charm: null }, nextUid: 1,
      progress: { world: 0, stars: {}, cleared: {} },
      endless: { unlocked: false, best: 0 },
      quests: { day: '', list: [] },
      shop: { day: '', offers: [], bought: [] },
      stats: { kills: 0, bosses: 0, crits: 0, chests: 0, specials: 0, coinsEarned: 0, gemsEarned: 0, levels: 0, threeStars: 0, shopBuys: 0, permBuys: 0, combos: 0, heroLevels: 0, elites: 0, interrupts: 0, perfect: 0, guardians: 0 },
      ach: {},
      skins: {},
      settings: { music: true, sfx: true, mute: false, shake: true, numbers: true, quality: 'high', diff: 'normal', autoSpec: true, speed: 1 },
      seenIntro: false,
      revives: 0,
    };
  },
  load() {
    let raw = null;
    try { raw = window.localStorage.getItem(CONFIG.SAVE_KEY); } catch (e) { this.ok = false; }
    let d = this.defaults();
    if (raw) {
      try {
        const old = JSON.parse(raw);
        if ((old.v || 1) < 2) {
          // v1 → v2: new 10-world campaign. Keep heroes, gear, currency & upgrades; restart the map.
          delete old.progress; delete old.endless; delete old.quests; delete old.shop;
          old.v = CONFIG.SAVE_VERSION; old.migrated = true;
        }
        d = deepMerge(d, old);
      } catch (e) { /* corrupt save → defaults */ }
    }
    // sanity
    if (!Array.isArray(d.squad)) d.squad = ['knight', null, null, null];
    while (d.squad.length < CONFIG.SLOTS) d.squad.push(null);
    d.squad.length = CONFIG.SLOTS;
    for (let i = 0; i < d.squad.length; i++) if (d.squad[i] && (!d.heroes[d.squad[i]] || !d.heroes[d.squad[i]].unlocked)) d.squad[i] = null;
    if (!d.squad[0]) d.squad[0] = d.squad.find(Boolean) || 'knight';
    d.squadSlots = clamp(d.squadSlots || 1, 1, CONFIG.SLOTS);
    if (!DIFF[d.settings.diff]) d.settings.diff = 'normal';
    if (!Array.isArray(d.items)) d.items = [];
    d.items = d.items.filter(it => ITEMS[it.id]);
    this.data = d;
    return d;
  },
  save() {
    if (!this.data) return;
    this.dirty = false;
    try { window.localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(this.data)); this.ok = true; }
    catch (e) { this.ok = false; }
  },
  soon() { this.dirty = true; },
  tick(dt) { this.timer += dt; if (this.dirty && this.timer > 0.8) { this.timer = 0; this.save(); } },
  reset() {
    try { window.localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) { }
    this.data = this.defaults();
    this.save();
  },
};

/* ============================ AUDIO SYSTEM ========================== */
const MUSIC_THEMES = {
  menu: { bpm: 100, root: 57, scale: [0, 2, 4, 5, 7, 9, 11], prog: [0, 5, 3, 4], lead: 0.6, drum: 1 },
  w0: { bpm: 118, root: 60, scale: [0, 2, 4, 5, 7, 9, 11], prog: [0, 4, 5, 3], lead: 0.7, drum: 2 },
  w1: { bpm: 104, root: 57, scale: [0, 2, 3, 5, 7, 8, 10], prog: [0, 5, 6, 4], lead: 0.5, drum: 1 },
  w2: { bpm: 132, root: 52, scale: [0, 1, 4, 5, 7, 8, 10], prog: [0, 1, 0, 6], lead: 0.6, drum: 3 },
  w3: { bpm: 110, root: 62, scale: [0, 2, 3, 5, 7, 9, 10], prog: [0, 3, 4, 0], lead: 0.5, drum: 1 },
  w4: { bpm: 96, root: 50, scale: [0, 1, 3, 5, 6, 8, 10], prog: [0, 5, 1, 4], lead: 0.4, drum: 1 },
  w5: { bpm: 124, root: 55, scale: [0, 2, 4, 5, 7, 9, 11], prog: [0, 3, 4, 4], lead: 0.7, drum: 2 },
  desert: { bpm: 112, root: 52, scale: [0, 1, 4, 5, 7, 8, 11], prog: [0, 1, 0, 4], lead: 0.65, drum: 2 },
  crystal: { bpm: 100, root: 64, scale: [0, 2, 4, 6, 7, 9, 11], prog: [0, 4, 5, 1], lead: 0.55, drum: 1 },
  sky: { bpm: 128, root: 59, scale: [0, 2, 4, 5, 7, 9, 11], prog: [0, 3, 5, 4], lead: 0.7, drum: 2 },
  factory: { bpm: 140, root: 48, scale: [0, 2, 3, 5, 7, 8, 10], prog: [0, 0, 6, 5], lead: 0.5, drum: 3 },
  boss: { bpm: 146, root: 45, scale: [0, 2, 3, 5, 7, 8, 11], prog: [0, 0, 5, 4], lead: 0.8, drum: 3 },
  endless: { bpm: 138, root: 53, scale: [0, 2, 3, 5, 7, 8, 10], prog: [0, 6, 5, 4], lead: 0.7, drum: 3 },
};
const Sound = {
  ctx: null, master: null, sfx: null, mus: null, nbuf: null, last: {},
  m: { theme: null, step: 0, next: 0 },
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const c = this.ctx = new AC();
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 6;
      this.master = c.createGain(); this.master.connect(comp); comp.connect(c.destination);
      this.sfx = c.createGain(); this.sfx.connect(this.master);
      this.mus = c.createGain(); this.mus.connect(this.master);
      const len = c.sampleRate;
      this.nbuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.nbuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.apply();
      this.m.next = c.currentTime + 0.15;
    } catch (e) { this.ctx = null; }
  },
  apply() {
    if (!this.ctx) return;
    const s = Save.data.settings;
    this.master.gain.value = s.mute ? 0 : 0.85;
    this.sfx.gain.value = s.sfx ? 0.75 : 0;
    this.mus.gain.value = s.music ? 0.28 : 0;
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => { }); },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); if (this.ctx) this.m.next = Math.max(this.m.next, this.ctx.currentTime + 0.05); },
  ok() { return this.ctx && this.ctx.state === 'running' && !Save.data.settings.mute; },
  tone(type, f0, f1, dur, vol, delay = 0, bus) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();

    this.ox *= Math.max(0, 1 - dt * 12); this.oy *= Math.max(0, 1 - dt * 12);
  }
}

/* ============================== ART =================================
   Everything is drawn procedurally: chunky outlines, big heads, small
   bodies. Anim objects drive squash/stretch, swing, flash, state faces.
   ===================================================================== */
const OUT = '#1e1433';
let FL = false; // white hit-flash mode
const C = c => (FL ? '#ffffff' : c);
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circ(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); }
function ell(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function fs(ctx, fill, lw = 3) { ctx.fillStyle = C(fill); ctx.fill(); if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.stroke(); } }
function limb(ctx, x1, y1, x2, y2, w, color) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = w + 5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = C(color); ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function shade(ctx, x, y, w, h, r, a = 0.18) { ctx.fillStyle = FL ? 'rgba(255,255,255,0)' : 'rgba(0,0,0,' + a + ')'; rr(ctx, x, y, w, h, r); ctx.fill(); }
function shine(ctx, x, y, rx, ry, a = 0.45) { if (FL) return; ctx.fillStyle = 'rgba(255,255,255,' + a + ')'; ell(ctx, x, y, rx, ry, -0.4); ctx.fill(); }
function moodOf(a) {
  switch (a.state) {
    case 'HURT': return 'hurt';
    case 'DEATH': return 'dead';
    case 'VICTORY': return 'happy';
    case 'ATTACK': case 'HEAVY_ATTACK': case 'SKILL': return 'angry';
    default: return 'normal';
  }
}
function face(ctx, x, y, o) {
  const gap = o.gap || 8, r = o.r || 4.5, mood = o.mood || 'normal', t = o.t || 0;
  const blink = (mood === 'normal' || mood === 'focus') && (t % 4.3) < 0.11;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of [-1, 1]) {
    const ex = x + s * gap;
    ctx.strokeStyle = OUT; ctx.lineWidth = Math.max(2, r * 0.55);
    if (mood === 'dead') {
      ctx.beginPath(); ctx.moveTo(ex - r, y - r); ctx.lineTo(ex + r, y + r); ctx.moveTo(ex + r, y - r); ctx.lineTo(ex - r, y + r); ctx.stroke();
    } else if (mood === 'hurt') {
      ctx.beginPath(); ctx.moveTo(ex + s * r, y - r); ctx.lineTo(ex - s * r * 0.3, y); ctx.lineTo(ex + s * r, y + r); ctx.stroke();
    } else if (mood === 'happy') {
      ctx.beginPath(); ctx.arc(ex, y + r * 0.5, r, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else if (blink) {
      ctx.beginPath(); ctx.moveTo(ex - r, y); ctx.lineTo(ex + r, y); ctx.stroke();
    } else {
      if (o.glow && !FL) { ctx.shadowColor = o.glow; ctx.shadowBlur = 10; }
      ell(ctx, ex, y, r * 0.9, r * 1.15); ctx.fillStyle = C(o.eye || '#ffffff'); ctx.fill();
      ctx.lineWidth = 2; ctx.stroke();
      ctx.shadowBlur = 0;
      if (!o.noPupil) {
        circ(ctx, ex + (o.look || 0) * r * 0.3, y + r * 0.15, r * 0.55); ctx.fillStyle = C(o.pupil || OUT); ctx.fill();
        circ(ctx, ex + (o.look || 0) * r * 0.3 - r * 0.2, y - r * 0.2, r * 0.2); ctx.fillStyle = '#fff'; ctx.fill();
      }
    }
    if (o.brow || mood === 'angry') {
      const ang = mood === 'angry' ? 1 : 0.35;
      ctx.strokeStyle = C(o.browColor || OUT); ctx.lineWidth = Math.max(2.5, r * 0.6);
      ctx.beginPath(); ctx.moveTo(ex + s * r * 1.3, y - r * 1.9); ctx.lineTo(ex - s * r * 0.7, y - r * (1.9 - ang * 0.8)); ctx.stroke();

/* =========================== PROGRESSION ============================ */
const Prog = {
  itemBonus() {
    const s = Save.data, b = { dmg: 0, def: 0, hp: 0, crit: 0, gold: 0, spec: 0, dodge: 0, all: 0, fire: 0, freeze: 0, lightning: 0, poison: 0, thorns: 0, aspd: 0, xp: 0, charge: 0, critdmg: 0, lifesteal: 0, regen: 0 };
    for (const slot of ['weapon', 'armor', 'charm']) {
      const uid = s.equip[slot]; if (!uid) continue;
      const it = s.items.find(i => i.uid === uid); if (!it || !ITEMS[it.id]) { s.equip[slot] = null; continue; }
      const def = ITEMS[it.id], m = RARITY[it.rar].mult;
      for (const k in def.eff) b[k] += ELEM_KEYS[k] ? def.eff[k] : def.eff[k] * m;
    }
    return b;
  },
  heroStats(id, lvlOverride) {
    const d = HEROES[id], s = Save.data, h = s.heroes[id];
    const lvl = lvlOverride || h.level;
    const sk = h.skill || {}, pm = s.perm, ib = this.itemBonus();
    const power = 1 + 0.05 * (sk.power || 0);
    const guard = 1 + 0.08 * (sk.guard || 0);
    const hp = d.hp * Math.pow(1.07, lvl - 1) * power * guard * (1 + 0.1 * (sk.defense || 0)) * (1 + 0.06 * pm.hp) * (1 + ib.hp + ib.all);
    const dmg = d.dmg * Math.pow(1.075, lvl - 1) * power * (1 + 0.1 * (sk.damage || 0)) * (1 + 0.06 * pm.atk) * (1 + ib.dmg + ib.all);
    const def = d.def * Math.pow(1.06, lvl - 1) * power * guard * (1 + 0.12 * (sk.defense || 0)) * (1 + 0.08 * pm.def) * (1 + ib.def + ib.all);
    const aspd = d.aspd * (1 + 0.006 * (lvl - 1)) * (1 + 0.06 * (sk.haste || 0)) * (1 + 0.03 * (pm.aspd || 0)) * (1 + ib.aspd);
    const crit = Math.min(0.9, d.crit + 0.04 * (sk.crit || 0) + 0.01 * pm.crit + ib.crit);
    const critDmg = 2 + 0.15 * (sk.crit || 0) + ib.critdmg;
    const spec = 1 + 0.2 * (sk.special || 0) + ib.spec;
    const charge = (1 + 0.08 * (sk.special || 0) + 0.06 * pm.spec) * (1 + ib.charge);

  },
  power(id) { const st = this.heroStats(id); return Math.round(st.hp * 0.25 + st.dmg * st.aspd * 6 + st.def * 2); },

  skillPoints(id) { const h = Save.data.heroes[id]; let used = 0; for (const k in h.skill) used += h.skill[k]; return (h.level - 1) - used; },
  permCost(u, lvl) { return Math.floor(u.base * Math.pow(u.grow, lvl)); },

  levelKey(w, l) { return w + '-' + l; },

    ctx.fillStyle = g; ell(ctx, cx, cy, rx, ry); ctx.fill();
    ctx.strokeStyle = 'rgba(255,230,120,' + (0.6 + Math.sin(t * 8) * 0.2) * k + ')'; ctx.lineWidth = 4; ell(ctx, cx, cy, rx, ry); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,' + 0.5 * k + ')';
    ctx.beginPath(); ctx.ellipse(cx, cy, rx * 0.8, ry * 0.75, 0, Math.PI * 1.1 + Math.sin(t) * 0.2, Math.PI * 1.45 + Math.sin(t) * 0.2); ctx.stroke();
    ctx.restore();
    if (Math.random() < 0.3) PS.emit(cx + rand(-rx, rx), cy + rand(-ry, ry) * 0.8, { count: 1, speed: [10, 30], angle: [-2, -1.1], life: [0.4, 0.8], size: [2, 4], colors: ['#ffe45c', '#fff'], shape: 2, add: true });
  }
  drawTele(ctx, z) {
    const y = z.y || this.heroY, t = this.t;
    if (z.cancel) return;
    if (!z.done) {
      const k = z.t / z.tele, pulse = 0.35 + Math.abs(Math.sin(t * (6 + k * 12))) * 0.35;
      ctx.save();
      ctx.fillStyle = 'rgba(255,40,50,' + (0.18 + k * 0.2) + ')'; ctx.strokeStyle = 'rgba(255,60,60,' + (pulse + 0.3) + ')'; ctx.lineWidth = 4;
      if (z.shape === 'circle') {
        ell(ctx, z.x, y - 4, z.r, z.r * 0.36); ctx.fill(); ctx.stroke();
        ell(ctx, z.x, y - 4, z.r * k, z.r * 0.36 * k); ctx.fillStyle = 'rgba(255,60,60,.35)'; ctx.fill();
      } else {
        const top = z.kind === 'charge' ? (this.boss ? this.boss.y : y - 300) : y - 110;
        ctx.setLineDash([12, 8]); ctx.lineDashOffset = -t * 60;
        rr(ctx, z.x - z.w / 2, top, z.w, y + 20 - top, 10); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,60,60,.3)'; rr(ctx, z.x - z.w / 2, y + 20 - (y + 20 - top) * k, z.w, (y + 20 - top) * k, 10); ctx.fill();
      }
      ctx.font = '900 30px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.strokeText('!', z.x, y - 60); ctx.fillStyle = '#ffe45c'; ctx.fillText('!', z.x, y - 60);
      // falling object preview
      const fall = { acorn: 1, branch: 1, icicle: 1, rock: 1, fire: 1, lightning: 0 }[z.kind];
      if (fall && k > 0.55) {
        const fk = (k - 0.55) / 0.45, fy = lerp(-40, y - 14, Ease.inQuad(fk));
        ctx.save(); ctx.translate(z.x, fy);
        if (z.kind === 'acorn') { ell(ctx, 0, 0, 14, 17); ctx.fillStyle = '#b07a3a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke(); ctx.beginPath(); ctx.arc(0, -6, 16, Math.PI, 0); ctx.fillStyle = '#6b4a2a'; ctx.fill(); ctx.stroke(); }
        else if (z.kind === 'branch') { ctx.rotate(0.6 + fk * 3); rr(ctx, -30, -6, 60, 12, 6); ctx.fillStyle = '#6b4a2a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke(); circ(ctx, 26, -8, 10); ctx.fillStyle = '#4f9a3a'; ctx.fill(); ctx.stroke(); }
        else if (z.kind === 'icicle') { ctx.beginPath(); ctx.moveTo(-12, -30); ctx.lineTo(12, -30); ctx.lineTo(0, 20); ctx.closePath(); ctx.fillStyle = '#bff4ff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke(); }
        else if (z.kind === 'fire') { ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 26); g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ff8a2a'); g.addColorStop(1, 'rgba(255,60,0,0)'); ctx.fillStyle = g; circ(ctx, 0, 0, 26); ctx.fill(); }
        else { circ(ctx, 0, 0, 16); ctx.fillStyle = '#8a7a6a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke(); }
        ctx.restore();
      }
      ctx.restore();
    }
  }
  drawEffect(ctx, f) {
    const k = f.t / f.life;
    ctx.save();
    switch (f.type) {
      case 'ring':
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = f.color; ctx.globalAlpha = 1 - k; ctx.lineWidth = f.w * (1 - k) + 1;
        circ(ctx, f.x, f.y, lerp(f.r0, f.r1, Ease.outCubic(k))); ctx.stroke();
        break;
      case 'meteor': {
        const fk = Math.min(1, f.t / (f.ball ? 0.38 : 0.5));
        if (fk < 1) {
          const mx = f.x + (1 - fk) * (f.ball ? 0 : 140), my = lerp(f.ball ? f.y - 260 : -60, f.y, Ease.inQuad(fk));
          ctx.globalAlpha = 0.5; ctx.fillStyle = 'rgba(255,60,40,.4)'; ell(ctx, f.x, f.y, 30 * fk, 10 * fk); ctx.fill(); ctx.globalAlpha = 1;
          if (f.ball) { circ(ctx, mx, my, 11); ctx.fillStyle = '#2a2a3a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.4)'; circ(ctx, mx - 3, my - 3, 3); ctx.fill(); }
          else { ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(mx, my, 2, mx, my, 30); g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ff8a2a'); g.addColorStop(1, 'rgba(255,60,0,0)'); ctx.fillStyle = g; circ(ctx, mx, my, 30); ctx.fill(); }
        }
        break;
      }
      case 'smite': {
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - k;
        const g = ctx.createLinearGradient(0, 0, 0, f.y); g.addColorStop(0, 'rgba(255,240,160,0)'); g.addColorStop(1, 'rgba(255,240,160,.9)');
        ctx.fillStyle = g; ctx.fillRect(f.x - 14 * (1 - k), 0, 28 * (1 - k), f.y);
        break;
      }
      case 'soul': {
        const q = Ease.inQuad(k), x = lerp(f.x0, f.x1, q), y = lerp(f.y0, f.y1, q) - Math.sin(q * Math.PI) * 80;
        ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(125,255,106,.8)'; circ(ctx, x, y, 7); ctx.fill(); ctx.fillStyle = 'rgba(125,255,106,.3)'; circ(ctx, x, y, 15); ctx.fill();
        break;
      }
      case 'note': {
        ctx.globalAlpha = 1 - k; ctx.font = '22px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffd23a';
        ctx.fillText(['♪', '♫', '♬'][Math.floor(f.x) % 3], f.x + Math.sin(f.t * 6) * 8, f.y - k * 50);
        break;
      }
      case 'shock': {
        const R = f.R * Ease.outCubic(k);
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 16 * (1 - k) + 2;
        ell(ctx, f.x, f.y, R, R * 0.45); ctx.stroke();
        ctx.strokeStyle = '#9fc4ff'; ctx.lineWidth = 6 * (1 - k) + 1;
        ell(ctx, f.x, f.y, R * 0.8, R * 0.36); ctx.stroke();
        break;
      }
      case 'bolt': {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 1 - k;
        for (let pass = 0; pass < 2; pass++) {
          ctx.strokeStyle = pass ? '#ffffff' : '#7ae7ff'; ctx.lineWidth = pass ? 2 : 6; ctx.lineJoin = 'round';
          ctx.beginPath();
          for (let i = 0; i < f.pts.length - 1; i++) {
            const [x0, y0] = f.pts[i], [x1, y1] = f.pts[i + 1];
            if (i === 0) ctx.moveTo(x0, y0);
            for (let s = 1; s <= 5; s++) { const q = s / 5; ctx.lineTo(lerp(x0, x1, q) + (s < 5 ? rand(-10, 10) : 0), lerp(y0, y1, q) + (s < 5 ? rand(-10, 10) : 0)); }
          }
          ctx.stroke();
        }
        break;
      }
      case 'slash':
        ctx.globalCompositeOperation = 'lighter';
        ctx.translate(f.x, f.y); ctx.rotate(f.ang);
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8 * (1 - k) + 1; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-50 * Ease.outCubic(k) - 10, 0); ctx.lineTo(50 * Ease.outCubic(k) + 10, 0); ctx.stroke();
        ctx.strokeStyle = '#c77dff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-40, -8); ctx.lineTo(40, 8); ctx.stroke();
        break;
      case 'dash': {
        // afterimages along the dash path
        ctx.globalAlpha = 0.5 * (1 - k);
        const a = new Anim(); a.state = 'RUN'; a.t = f.t * 10;
        for (let i = 0; i < 4; i++) { const q = (i + 1) / 4; drawHero(ctx, 'ninja', lerp(f.x0, f.x1, q), lerp(f.y0, f.y1, q) + 40, 0.9, a, { skin: f.skin, shadow: false }); }
        ctx.globalAlpha = 1 - k; ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = '#c9b8ff'; ctx.lineWidth = 10 * (1 - k); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(f.x0, f.y0); ctx.lineTo(f.x1, f.y1); ctx.stroke();
        break;
      }
      case 'impact': {
        ctx.globalAlpha = 1 - k;
        const kind = f.kind;
        if (kind === 'lightning') {
          ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#fffbd0'; ctx.lineWidth = 8 * (1 - k) + 2;
          ctx.beginPath(); let x = f.x, y = 0; ctx.moveTo(x, y); while (y < f.y) { y += rand(30, 60); x += rand(-26, 26); ctx.lineTo(x, Math.min(y, f.y)); } ctx.stroke();
        } else if (kind === 'geyser' || kind === 'fire') {
          ctx.globalCompositeOperation = 'lighter';
          const g = ctx.createLinearGradient(0, f.y - 260, 0, f.y); g.addColorStop(0, 'rgba(255,90,20,0)'); g.addColorStop(1, 'rgba(255,170,40,.9)');
          ctx.fillStyle = g; rr(ctx, f.x - 26 * (1 - k * 0.5), f.y - 260 * Ease.outCubic(Math.min(1, k * 3)), 52 * (1 - k * 0.5), 260, 20); ctx.fill();
        } else if (kind === 'spikes' || kind === 'roots' || kind === 'ice' || kind === 'dark') {
          const col = { spikes: '#b8b8c8', roots: '#6b4a2a', ice: '#bff4ff', dark: '#8a3dc8' }[kind];
          const up = Ease.outBack(Math.min(1, k * 4)) * (1 - Math.max(0, k - 0.6) / 0.4);
          const n = Math.max(3, Math.round(f.w / 18));
          for (let i = 0; i < n; i++) { const x = f.x - f.w / 2 + (i + 0.5) * f.w / n, hgt = (50 + (i % 2) * 25) * up; ctx.beginPath(); ctx.moveTo(x - 10, f.y + 4); ctx.lineTo(x, f.y + 4 - hgt); ctx.lineTo(x + 10, f.y + 4); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke(); }
        } else {
          ctx.strokeStyle = 'rgba(60,40,30,.8)'; ctx.lineWidth = 3;
          for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x + Math.cos(a) * f.w * 0.5, f.y + Math.sin(a) * f.w * 0.16); ctx.stroke(); }
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8 * (1 - k); ell(ctx, f.x, f.y, f.w * 0.6 * Ease.outCubic(k), f.w * 0.2 * Ease.outCubic(k)); ctx.stroke();
        }
        break;
      }
    }
    ctx.restore();
  }
}

/* ================================ UI ================================
   DOM screens & overlays. Gameplay itself is rendered on the canvas.
   ===================================================================== */
const $ = id => document.getElementById(id);
const IC = { coin: '<i class="ic ic-coin"></i>', gem: '<i class="ic ic-gem"></i>', frag: '<i class="ic ic-frag"></i>', xp: '<i class="ic ic-xp"></i>' };
function curIcon(cur) { return cur === 'gems' ? IC.gem : IC.coin; }
function stars(n, max = 3) { let s = ''; for (let i = 0; i < max; i++) s += i < n ? '★' : '<span class="e">★</span>'; return s; }
function rewardHtml(r) {
  const p = [];
  if (r.coins) p.push(IC.coin + ' ' + fmt(r.coins));
  if (r.gems) p.push(IC.gem + ' ' + r.gems);
  if (r.chest) p.push('🎁 ' + CHESTS[r.chest].name);
  return p.join(' &nbsp;');
}

const UI = {
  screen: null, prev: null, heroSel: null, heroTab: 'heroes', heroView: 'stats', questTab: 'daily', mapWorld: 0,
  anim: null, detailCanvas: null, settingsFrom: 'MENU',
  init() {
    $('ui').addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      Sound.init();
      const act = el.dataset.act;
      if (act !== 'noop') Sound.play(act === 'back' ? 'back' : 'button');
      try { this.act(act, el.dataset, el); } catch (err) { console.error(err); }
    });
    document.addEventListener('touchstart', () => { }, { passive: true });
  },
  show(id) {
    for (const el of document.querySelectorAll('.screen')) el.classList.remove('on');
    this.screen = id;
    if (!id) return;
    const el = $('scr-' + id);
    this.render(id);
    el.classList.add('on');
  },
  render(id) {
    const el = $('scr-' + id);
    switch (id) {
      case 'menu': el.innerHTML = this.menuHtml(); break;
      case 'map': el.innerHTML = this.mapHtml(); setTimeout(() => this.scrollMap(), 30); break;
      case 'heroes': el.innerHTML = this.heroesHtml(); this.afterHeroes(); break;
      case 'upgrades': el.innerHTML = this.upgradesHtml(); break;
      case 'shop': el.innerHTML = this.shopHtml(); this.afterShop(); break;
      case 'quests': el.innerHTML = this.questsHtml(); break;
      case 'settings': el.innerHTML = this.settingsHtml(); break;
    }
  },
  refresh() { if (this.screen) { const sc = this.scrollPos(); this.render(this.screen); this.restoreScroll(sc); } },
  scrollPos() { const s = document.querySelector('#scr-' + this.screen + ' .scroll'); return s ? s.scrollTop : 0; },
  restoreScroll(v) { const s = document.querySelector('#scr-' + this.screen + ' .scroll'); if (s) s.scrollTop = v; },
  overlay(id, html) { const el = $('ov-' + id); el.innerHTML = html; el.classList.add('on'); return el; },
  close(id) { $('ov-' + id).classList.remove('on'); },
  closeAll() { for (const el of document.querySelectorAll('.overlay')) el.classList.remove('on'); },
  toast(msg, cls = '') {
    const t = document.createElement('div'); t.className = 'toast ' + cls; t.innerHTML = msg;
    const box = $('toasts'); box.appendChild(t);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 450); }, 2200);
  },
  dialog(title, body, buttons) {
    const btns = buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-act="dlg" data-i="${i}">${b.label}</button>`).join('');
    this._dlg = buttons;
    this.overlay('dialog', `<div class="panel"><div class="ribbon">${title}</div><div class="col center" style="font-weight:700;font-size:21px;text-align:center">${body}</div><div class="col">${btns}</div></div>`);
  },
  topbar(title, back = true, home = false) {
    const s = Save.data;
    const need = Prog.accXpNeed(s.accLevel);
    return `<div class="topbar">
      ${home ? '<button class="btn small grey" data-act="alley" title="Tilbage til Grejs Alley">◀ TILBAGE</button>' : ''}
      ${back ? '<button class="btn icon grey" data-act="back">◀</button>' : `<div class="pill lvlpill">${IC.xp} ${s.accLevel}<div class="bar" style="width:${Math.round(100 * s.xp / need)}%"></div></div>`}
      <div class="scr-title">${title || ''}</div>
      <div class="pill" id="pill-coins">${IC.coin}<span>${fmt(s.coins)}</span></div>
      <div class="pill" id="pill-gems">${IC.gem}<span>${fmt(s.gems)}</span></div>
    </div>`;
  },
  bumpPills() {
    const c = $('pill-coins'), g = $('pill-gems');
    if (c) { c.querySelector('span').textContent = fmt(Save.data.coins); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
    if (g) { g.querySelector('span').textContent = fmt(Save.data.gems); g.classList.remove('bump'); void g.offsetWidth; g.classList.add('bump'); }
  },

  /* ------------------------------ MENU ------------------------------ */
  menuHtml() {
    const s = Save.data, cur = Prog.currentLevel();
    const badge = Prog.unclaimedCount();
    const allDone = Prog.isCleared(WORLDS.length - 1, LV - 1);
    const dif = Prog.diff();
    return `${this.topbar('', false, true)}
    <div class="logo-wrap"><div class="logo"><span class="l1">GREJS</span><span class="l2">HEROES</span><span class="sub">★ SAVE QUEEN LANGVAD ★</span></div></div>
    <div class="row" style="margin-top:18px;gap:8px;justify-content:center"><div class="pill" style="font-size:18px">🗺️ ${Prog.clearedCount()}/${WORLDS.length * LV}</div><div class="pill" style="font-size:18px">⭐ ${Prog.starCount()}/${WORLDS.length * LV * 3}</div><div class="pill" style="font-size:18px;cursor:pointer" data-act="go" data-to="settings">${dif.ic} ${dif.name}</div></div>
    <div class="menu-btns">
      <button class="btn big green glow" data-act="play">▶ PLAY<span style="font-size:18px;opacity:.9;margin-left:6px">${allDone ? 'ALL CLEAR' : (cur.w + 1) + '-' + (cur.l + 1)}</span></button>
      <div class="menu-grid">
        <button class="btn blue" data-act="go" data-to="heroes">🛡️ HEROES</button>
        <button class="btn purple" data-act="go" data-to="upgrades">⬆️ UPGRADES</button>
        <button class="btn" data-act="go" data-to="shop">🛒 SHOP</button>
        <button class="btn red" data-act="go" data-to="quests">📜 QUESTS${badge ? `<span class="badge">${badge}</span>` : ''}</button>
      </div>
      <div class="menu-grid">
        <button class="btn grey" data-act="go" data-to="settings">⚙️ SETTINGS</button>
        <button class="btn ${s.endless.unlocked ? 'purple' : 'grey off'}" data-act="endless">♾️ ENDLESS</button>
      </div>
    </div>`;
  },

  /* ------------------------------ MAP ------------------------------- */
  mapPos(i) { // winding path from bottom (level 1) to top (boss)
    const x = 270 + Math.sin(i * 1.15 + 0.4) * 150;
    const y = 120 + (LV - 1 - i) * 128;
    return [x, y];
  },
  mapHtml() {
    const w = this.mapWorld, wd = WORLDS[w];
    const unlockedW = Prog.isUnlocked(w, 0);
    let path = '', nodes = '';
    const totalH = 120 + (LV - 1) * 128 + 130;
    let d = '';
    for (let i = 0; i < LV; i++) { const [x, y] = this.mapPos(i); d += (i ? ' L' : 'M') + x + ' ' + y; }
    path = `<svg width="540" height="${totalH}"><path d="${d}" stroke="#1e1433" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/><path d="${d}" stroke="#fff5d6" stroke-width="10" fill="none" stroke-dasharray="4 18" stroke-linecap="round" opacity=".9"/></svg>`;
    for (let i = 0; i < LV; i++) {
      const [x, y] = this.mapPos(i), type = NODE_TYPES[i];
      const done = Prog.isCleared(w, i), un = Prog.isUnlocked(w, i);
      const st = Save.data.progress.stars[Prog.levelKey(w, i)] || 0;
      const cls = ['mnode', type === 'boss' ? 'boss' : '', done ? 'done' : un ? 'cur' : 'locked'].join(' ');
      nodes += `<div class="${cls}" style="left:${x}px;top:${y}px" data-act="node" data-l="${i}">${un ? NODE_ICON[type] : '🔒'}
        ${done ? `<div class="stars">${stars(st)}</div>` : ''}
        <div class="num">${type === 'fight' ? 'LEVEL ' + (i + 1) : NODE_NAME[type].toUpperCase()}</div></div>`;
    }
    const squad = Save.data.squad;
    let slots = '';
    for (let i = 0; i < CONFIG.SLOTS; i++) {
      const id = squad[i];
      if (i >= Save.data.squadSlots) slots += `<div class="slot empty" data-act="go" data-to="heroes">🔒</div>`;
      else if (id) slots += `<div class="slot r-${HEROES[id].rarity}" data-act="go" data-to="heroes" data-portrait="${id}"></div>`;
      else slots += `<div class="slot empty" data-act="go" data-to="heroes">＋</div>`;
    }
    const cur = Prog.currentLevel();
    const canPlay = unlockedW;
    const lvlForBtn = cur.w === w ? cur.l : (Prog.isCleared(w, LV - 1) ? LV - 1 : 0);
    return `${this.topbar('MAP')}
      <div class="world-head">
        <button class="btn icon blue ${w > 0 ? '' : 'off'}" data-act="world" data-d="-1">◀</button>
        <div class="world-name"><div class="n">${w + 1}. ${wd.name}</div><div class="s">${unlockedW ? wd.sub : '🔒 Defeat the previous boss'}</div></div>
        <button class="btn icon blue ${w < WORLDS.length - 1 ? '' : 'off'}" data-act="world" data-d="1">▶</button>
      </div>
      <div id="map-scroll" class="scroll"><div class="map-inner" style="height:${totalH}px">${path}${nodes}</div></div>
      <div class="map-bottom"><div class="squad-mini">${slots}</div>
        <button class="btn green big ${canPlay ? 'glow' : 'off'}" data-act="node" data-l="${lvlForBtn}" style="min-width:170px">▶ ${canPlay ? (w + 1) + '-' + (lvlForBtn + 1) : '🔒'}</button></div>`;
  },
  scrollMap() {
    const sc = $('map-scroll'); if (!sc) return;
    const w = this.mapWorld; let i = 0;
    for (let k = 0; k < LV; k++) if (Prog.isUnlocked(w, k)) i = k;
    const [, y] = this.mapPos(i);
    sc.scrollTop = y - sc.clientHeight * 0.55;
    for (const el of document.querySelectorAll('#scr-map [data-portrait]')) { el.innerHTML = ''; el.appendChild(portraitCanvas(el.dataset.portrait, 62, { skin: Save.data.heroes[el.dataset.portrait].skin })); }
  },
  levelDialog(l) {
    const w = this.mapWorld, wd = WORLDS[w], type = NODE_TYPES[l];
    if (!Prog.isUnlocked(w, l)) { this.toast('🔒 Clear the previous level first'); Sound.play('error'); return; }
    const st = Save.data.progress.stars[Prog.levelKey(w, l)] || 0;
    const first = !Prog.isCleared(w, l);
    const story = l === 0 ? wd.story[0] : l === 7 ? wd.story[1] : l === LV - 1 ? wd.story[2] : '';
    const pool = wd.pool.slice(0, Math.min(wd.pool.length, 3 + Math.ceil(l / 3)));

  skillTreeHtml(id) {
    const h = Save.data.heroes[id], sp = Prog.skillPoints(id);
    const pos = n => [n.x * 5.04, n.y * 5.8];
    let lines = '';
    for (const n of SKILL_NODES) if (n.req) { const p = SKILL_NODES.find(x => x.id === n.req); const [x1, y1] = pos(p), [x2, y2] = pos(n); const on = (h.skill[n.req] || 0) > 0; lines += `<line x1="${x1}" y1="${y1 + 40}" x2="${x2}" y2="${y2 + 40}" stroke="${on ? '#ffd23a' : '#1e1433'}" stroke-width="10" stroke-linecap="round"/>`; }
    let nodes = '';
    for (const n of SKILL_NODES) {
      const r = h.skill[n.id] || 0, locked = n.req && !(h.skill[n.req] > 0);
      const [x, y] = pos(n);
      nodes += `<div class="snode ${r ? 'has' : ''} ${locked ? 'lock' : ''}" style="left:${x}px;top:${y}px" data-act="skill" data-id="${id}" data-n="${n.id}">
        <div class="orb">${n.icon}</div><div class="nm">${n.name.toUpperCase()}</div>

  itemDialog(uid) {

      <div class="card" style="font-weight:900;font-size:22px;text-align:center">${eff}</div>
      <div class="row"><button class="btn red grow" data-act="salvage">SALVAGE ${IC.coin}${fmt(Prog.salvageValue(it))}</button><button class="btn ${equipped ? 'grey' : 'green'} grow" data-act="equipitem">${equipped ? 'UNEQUIP' : 'EQUIP'}</button></div>
      <button class="btn grey" data-act="dlgclose">CLOSE</button></div>`);

  tickDetail(dt) {
    const c = this.detailCanvas;
    if (!c || !c.isConnected || this.screen !== 'heroes') return;
    const a = this.anim; a.update(dt);
    if (a.state === 'IDLE' && Math.random() < dt * 0.5) { a.attack(0.4); a.set('ATTACK', 0.35); a.squash(0.9, 1.1); }
    const ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height);
    const s = c.width / 100; ctx.scale(s, s);
    const id = c.dataset.id, h = Save.data.heroes[id];
    ctx.globalAlpha = h.unlocked ? 1 : 0.35;
    drawHero(ctx, id, 50, 90, 0.85, a, { skin: h.skin, rage: id === 'berserker' && a.state === 'ATTACK' });
    ctx.globalAlpha = 1;
  },
  levelUpFx(prev) {
    const top = $('hd-top'); if (!top) return;
    const fx = document.createElement('div'); fx.className = 'lvlup-fx'; fx.textContent = 'LEVEL UP!'; top.appendChild(fx);
    const ring = document.createElement('div'); ring.className = 'ring-fx'; top.querySelector('.hd-portrait').appendChild(ring);
    setTimeout(() => { fx.remove(); ring.remove(); }, 1300);
    if (this.anim) { this.anim.flash = 1; this.anim.squash(1.3, 0.7); this.anim.set('VICTORY', 1); }
    const now = Prog.heroStats(this.heroSel);
    const vals = [now.hp, now.dmg, now.def, now.aspd * 60, now.crit * 100], pv = [prev.hp, prev.dmg, prev.def, prev.aspd * 60, prev.crit * 100];
    vals.forEach((v, i) => {
      const el = $('st-' + i); if (!el) return;
      const diff = Math.round(v) - Math.round(pv[i]);
      el.classList.add('flash');
      const b = el.querySelector('b'); const from = Math.round(pv[i]), to = Math.round(v);
      let k = 0; const step = () => { k += 0.08; const cur = Math.round(lerp(from, to, Math.min(1, k))); b.innerHTML = cur + (i === 4 ? '%' : '') + (diff > 0 ? `<span class="up">+${diff}</span>` : ''); if (k < 1) requestAnimationFrame(step); };
      step();
    });
  },
