<title>Grejs Alley</title>
<meta name="description" content="A neon back-alley arcade cabinet with sixteen tiny games." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" />

<style>
  :root{
    --bg:#130e1f;
    --bg-2:#1a1430;
    --panel:#221a3a;
    --panel-2:#2a2049;
    --line:#3b2f5c;
    --ink:#f5efff;
    --muted:#a99cc7;
    --coral:#ff4d6d;
    --amber:#ffc24b;
    --cyan:#54d8ff;
    --green:#5ce6a0;
    --violet:#c07bff;
    --shadow:0 18px 40px -16px rgba(0,0,0,.7);
    --r:14px;
  }

  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -8%, #2a1c47 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 100%, #1c2b45 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Outfit", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
    z-index:9999;
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }

  .wrap{max-width:1120px;margin:0 auto;padding:32px 20px 64px}

  header.marquee{
    text-align:center;
    padding:28px 16px 34px;
    position:relative;
  }
  .sign{
    font-family:"Bungee", cursive;
    font-size:clamp(38px, 8vw, 76px);
    line-height:.98;
    letter-spacing:.5px;
    text-wrap:balance;
    margin:0;
    color:var(--ink);
    text-shadow:
      0 0 2px #fff,
      0 0 14px var(--coral),
      0 0 30px rgba(255,77,109,.5),
      4px 5px 0 rgba(0,0,0,.35);
  }
  .sign .b{color:var(--cyan);text-shadow:0 0 2px #fff,0 0 14px var(--cyan),0 0 30px rgba(84,216,255,.45),4px 5px 0 rgba(0,0,0,.35)}
  .tag{
    margin:14px auto 0;
    max-width:52ch;
    color:var(--muted);
    font-size:15px;
  }
  .bulbs{display:flex;gap:10px;justify-content:center;margin-top:18px}
  .bulbs i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);opacity:.5;animation:blink 1.4s infinite}
  .bulbs i:nth-child(2){animation-delay:.2s;background:var(--coral);box-shadow:0 0 10px var(--coral)}
  .bulbs i:nth-child(3){animation-delay:.4s;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .bulbs i:nth-child(4){animation-delay:.6s;background:var(--green);box-shadow:0 0 10px var(--green)}
  .bulbs i:nth-child(5){animation-delay:.8s;background:var(--violet);box-shadow:0 0 10px var(--violet)}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

  .filters{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    margin:26px 0 22px;
  }
  .chip{
    font:500 13px/1 "DM Mono", ui-monospace, monospace;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, color .12s ease, background .12s ease;
  }
  .chip:hover{color:var(--ink);border-color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#2a0713;font-weight:500}
  .chip:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(224px, 1fr));
    gap:16px;
  }
  .card{
    display:flex;flex-direction:column;
    text-align:left;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--r);
    overflow:hidden;
    cursor:pointer;
    color:inherit;
    font:inherit;
    transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--accent, var(--coral));box-shadow:0 16px 30px -14px rgba(0,0,0,.7), 0 0 0 1px var(--accent, var(--coral)) inset}
  .card:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  .card .thumb{
    aspect-ratio:16/10;
    display:grid;place-items:center;
    background:radial-gradient(120px 80px at 50% 30%, rgba(255,255,255,.06), transparent), var(--bg-2);
    border-bottom:1px solid var(--line);
  }
  .card .thumb canvas{width:100%;height:100%;image-rendering:pixelated}
  .card .meta{padding:13px 14px 15px;display:flex;flex-direction:column;gap:5px}
  .card .name{font-weight:600;font-size:16px;letter-spacing:.2px}
  .card .lbl{font:500 10px/1 "DM Mono", monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent, var(--coral))}
  .card .desc{color:var(--muted);font-size:12.5px;line-height:1.45}

  footer.legal{margin-top:44px;text-align:center;color:var(--muted);font-size:12px}

  /* ---- cabinet ---- */
  .cabinet{
    position:fixed;inset:0;z-index:200;
    display:none;
    place-items:center;
    padding:20px;
    background:rgba(9,6,15,.9);
    backdrop-filter:blur(6px);
  }
  .cabinet.open{display:grid}
  .console{
    width:min(560px, 100%);
    max-height:calc(100vh - 40px);
    display:flex;flex-direction:column;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .console .bar{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    background:var(--bg-2);
  }
  .console .bar h2{
    margin:0;flex:1;
    font-family:"Bungee", cursive;
    font-size:16px;letter-spacing:.5px;
    color:var(--cyan);
    text-shadow:0 0 12px rgba(84,216,255,.35);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pill{
    font:500 11px/1 "DM Mono", monospace;
    letter-spacing:.05em;
    padding:6px 9px;border-radius:999px;
    border:1px solid var(--line);
    color:var(--muted);
    white-space:nowrap;
  }
  .pill b{color:var(--amber);font-weight:500}
  .xclose{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);width:32px;height:32px;border-radius:9px;cursor:pointer;
    font-size:16px;line-height:1;
  }
  .xclose:hover{border-color:var(--coral);color:var(--coral)}
  .xclose:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  .stage-shell{
    padding:16px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    overflow:auto;
  }
  .hud{
    width:100%;
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    font:500 13px/1.3 "DM Mono", monospace;
  }
  .hud .sc{color:var(--green);font-size:15px;font-variant-numeric:tabular-nums}
  .hud .st{color:var(--muted);text-align:right;flex:1}
  canvas.play{
    background:#0c0917;
    border:1px solid var(--line);
    border-radius:10px;
    max-width:100%;
    height:auto;
    touch-action:none;
    image-rendering:pixelated;
  }

  .controls{
    width:100%;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding-top:2px;
  }
  .dpad{
    display:grid;
    grid-template-columns:repeat(3,42px);
    grid-template-rows:repeat(3,42px);
    gap:6px;
  }
  .dpad button{
    appearance:none;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);
    border-radius:10px;font-size:16px;cursor:pointer;
    display:grid;place-items:center;
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .dpad button:active{background:var(--coral);border-color:var(--coral);color:#2a0713}
  .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
  .dpad .a{grid-area:2/2;background:var(--panel);font:600 12px/1 "DM Mono",monospace}
  .dpad .a:active{background:var(--amber);color:#2a1a00}
  .restart{
    appearance:none;cursor:pointer;
    font:600 12px/1 "DM Mono", monospace;letter-spacing:.08em;text-transform:uppercase;
    padding:12px 16px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  }
  .restart:hover{border-color:var(--green);color:var(--green)}
  .restart:focus-visible,.dpad button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .hint{color:var(--muted);font:400 11.5px/1.45 "Outfit",sans-serif;max-width:20ch;text-align:right}
</style>

<div class="wrap">
  <header class="marquee">
    <h1 class="sign">GREJS <span class="b">ALLEY</span></h1>
    <p class="tag">A cramped neon arcade at the end of the block. A back room full of coin-op miniatures, one dusty cabinet. Keyboard, mouse, or the on-screen stick.</p>
    <div class="bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter games by cabinet row"></nav>
  <main class="grid" id="grid"></main>

  <footer class="legal">Grejs Alley · all games run locally in your browser · high scores saved to this device</footer>
</div>

<div class="cabinet" id="cabinet" role="dialog" aria-modal="true" aria-labelledby="cabName">
  <div class="console">
    <div class="bar">
      <h2 id="cabName">Game</h2>
      <span class="pill">SCORE <b id="cabScore">0</b></span>
      <span class="pill">HI <b id="cabHi">0</b></span>
      <button class="xclose" id="cabClose" aria-label="Leave cabinet">✕</button>
    </div>
    <div class="stage-shell">
      <div class="hud"><span class="sc" id="hudScore">Score 0</span><span class="st" id="hudStatus">Ready</span></div>
      <canvas class="play" id="play" width="480" height="480"></canvas>
      <div class="controls">
        <div class="dpad" aria-hidden="false">
          <button class="u" data-k="ArrowUp" aria-label="Up">▲</button>
          <button class="l" data-k="ArrowLeft" aria-label="Left">◀</button>
          <button class="a" data-k=" " aria-label="Action">A</button>
          <button class="r" data-k="ArrowRight" aria-label="Right">▶</button>
          <button class="d" data-k="ArrowDown" aria-label="Down">▼</button>
        </div>
        <button class="restart" id="cabRestart">Restart</button>
        <p class="hint" id="cabHint"></p>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const CS = getComputedStyle(document.documentElement);
  const COL = {};
  ["ink","muted","line","coral","amber","cyan","green","violet","bg","panel"].forEach(k=>{
    COL[k] = CS.getPropertyValue("--"+k).trim();
  });
  const rand = n => Math.floor(Math.random()*n);
  const rnd = (a,b) => a + Math.random()*(b-a);
  const clamp = (v,a,b) => v<a?a:v>b?b:v;
  const TAGCOL = {arcade:COL.coral, puzzle:COL.cyan, reflex:COL.amber, classic:COL.green};

  function pointer(e, canvas){
    const r = canvas.getBoundingClientRect();
    const t = e.touches && e.touches[0] ? e.touches[0] : e;
    return {
      x:(t.clientX - r.left) * canvas.width / r.width,
      y:(t.clientY - r.top) * canvas.height / r.height
    };
  }
  function roundRect(ctx,x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  class Loop{
    constructor(){ this.fn=null; this.raf=0; this.last=0; this._run=this._run.bind(this); }
    start(){ if(this.raf) return; this.last=performance.now(); this.raf=requestAnimationFrame(this._run); }
    _run(t){
      const dt = Math.min(0.05, (t-this.last)/1000);
      this.last = t;
      if(this.fn) this.fn(dt);
      this.raf = requestAnimationFrame(this._run);
    }
    stop(){ cancelAnimationFrame(this.raf); this.raf=0; }
  }

  /* ============================ GAMES ============================ */
  const GAMES = [];
  const G = def => GAMES.push(def);

  /* ---- Icons: draw into s x s ---- */
  function icon(id, ctx, s){
    ctx.clearRect(0,0,s,s);
    const g = id;
    const bg = TAGCOL[(GAMES.find(x=>x.id===id)||{}).tag] || COL.coral;
    ctx.fillStyle = COL.bg; ctx.fillRect(0,0,s,s);
    ctx.save();
    ctx.translate(s/2,s/2);
    ctx.strokeStyle = bg; ctx.fillStyle = bg; ctx.lineWidth = s*0.06; ctx.lineJoin="round";
    const u = s*0.13;
    const px = (x,y,w,h)=>ctx.fillRect(x*u,y*u,w*u,h*u);
    if(g==="snake"){ ctx.fillRect(-3*u,-1*u,u,u);ctx.fillRect(-2*u,-1*u,u,u);ctx.fillRect(-1*u,-1*u,u,u);ctx.fillRect(-1*u,0,u,u);ctx.fillRect(0,0,u,u);ctx.fillStyle=COL.green;ctx.fillRect(1.4*u,-2*u,u*0.8,u*0.8); }
    else if(g==="breakout"){ for(let i=-2;i<2;i++)for(let j=-2;j<-0;j++){ctx.fillRect(i*u+1,j*u+1,u-2,u*0.7);} ctx.fillRect(-1.2*u,2*u,2.4*u,u*0.5); ctx.beginPath();ctx.arc(0,u,u*0.35,0,7);ctx.fill(); }
    else if(g==="pong"){ ctx.fillRect(-3.2*u,-1.4*u,u*0.6,2.8*u); ctx.fillRect(2.6*u,-0.2*u,u*0.6,2.8*u); ctx.beginPath();ctx.arc(0,0,u*0.4,0,7);ctx.fill(); }
    else if(g==="blocks"){ ctx.fillRect(-2.5*u,-0.5*u,u,u);ctx.fillRect(-1.5*u,-0.5*u,u,u);ctx.fillRect(-0.5*u,-0.5*u,u,u);ctx.fillRect(-0.5*u,-1.5*u,u,u); ctx.fillStyle=COL.amber;ctx.fillRect(1*u,0.5*u,u,u);ctx.fillRect(2*u,0.5*u,u,u); }
    else if(g==="g2048"){ ctx.font=`bold ${s*0.34}px "DM Mono",monospace`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("2048",0,0); }
    else if(g==="flap"){ ctx.beginPath();ctx.arc(-u,0,u*0.9,0,7);ctx.fill(); ctx.fillStyle=COL.green;ctx.fillRect(1.4*u,-3*u,u*1.1,1.8*u);ctx.fillRect(1.4*u,1.2*u,u*1.1,2*u); }
    else if(g==="memory"){ ctx.fillRect(-2.6*u,-1.6*u,2.1*u,3.2*u); ctx.fillStyle=COL.violet;ctx.fillRect(0.5*u,-1.6*u,2.1*u,3.2*u); ctx.fillStyle=COL.bg;ctx.font=`bold ${s*0.22}px "DM Mono"`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("?",1.55*u,0); }
    else if(g==="mines"){ ctx.beginPath();ctx.arc(0,0.3*u,u*1.1,0,7);ctx.fill(); for(let a=0;a<8;a++){ctx.save();ctx.rotate(a*Math.PI/4);ctx.fillRect(-u*0.14,-2*u,u*0.28,1.4*u);ctx.restore();} ctx.fillStyle=COL.amber;ctx.beginPath();ctx.arc(-0.4*u,-0.1*u,u*0.2,0,7);ctx.fill(); }
    else if(g==="whack"){ ctx.beginPath();ctx.ellipse(0,1.6*u,2.4*u,u*0.7,0,0,7);ctx.fill(); ctx.fillStyle=COL.amber;ctx.beginPath();ctx.arc(0,0,u*1.1,0,7);ctx.fill(); ctx.fillStyle=COL.bg;ctx.beginPath();ctx.arc(-0.4*u,-0.2*u,u*0.16,0,7);ctx.arc(0.4*u,-0.2*u,u*0.16,0,7);ctx.fill(); }
    else if(g==="echo"){ const q=[[COL.coral,-1,-1],[COL.cyan,0,-1],[COL.amber,-1,0],[COL.green,0,0]]; q.forEach(([c,x,y])=>{ctx.fillStyle=c;ctx.fillRect(x*2.1*u,y*2.1*u,2*u,2*u);}); }
    else if(g==="react"){ ctx.fillStyle=COL.green;ctx.beginPath();ctx.arc(0,0,u*1.6,0,7);ctx.fill();ctx.fillStyle=COL.bg;ctx.font=`bold ${s*0.24}px "DM Mono"`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("GO",0,0); }
    else if(g==="slide"){ ctx.strokeRect(-2.4*u,-2.4*u,4.8*u,4.8*u); ctx.font=`bold ${s*0.16}px "DM Mono"`;ctx.textAlign="center";ctx.textBaseline="middle"; let n=1; for(let y=0;y<3;y++)for(let x=0;x<3;x++){ if(x===2&&y===2)break; ctx.strokeRect((-2.4+x*1.6)*u,(-2.4+y*1.6)*u,1.5*u,1.5*u); ctx.fillText(n++,(-1.65+x*1.6)*u,(-1.65+y*1.6)*u);} }
    else if(g==="ttt"){ ctx.lineWidth=s*0.04; ctx.beginPath();ctx.moveTo(-u,-2.4*u);ctx.lineTo(-u,2.4*u);ctx.moveTo(u,-2.4*u);ctx.lineTo(u,2.4*u);ctx.moveTo(-2.4*u,-u);ctx.lineTo(2.4*u,-u);ctx.moveTo(-2.4*u,u);ctx.lineTo(2.4*u,u);ctx.stroke(); ctx.strokeStyle=COL.coral;ctx.beginPath();ctx.moveTo(-2.1*u,-2.1*u);ctx.lineTo(-1.3*u,-1.3*u);ctx.moveTo(-1.3*u,-2.1*u);ctx.lineTo(-2.1*u,-1.3*u);ctx.stroke(); ctx.strokeStyle=COL.cyan;ctx.beginPath();ctx.arc(0,0,u*0.4,0,7);ctx.stroke(); }
    else if(g==="rocks"){ ctx.beginPath();ctx.moveTo(0,-1.6*u);ctx.lineTo(1.2*u,1.4*u);ctx.lineTo(0,0.7*u);ctx.lineTo(-1.2*u,1.4*u);ctx.closePath();ctx.fill(); ctx.strokeStyle=COL.muted;ctx.beginPath();ctx.arc(1.8*u,-1.6*u,u*0.8,0,7);ctx.stroke(); }
    else if(g==="dash"){ ctx.fillRect(-3*u,1.6*u,6*u,u*0.3); ctx.fillRect(-2*u,-0.4*u,1.2*u,2*u); ctx.fillStyle=COL.green;ctx.fillRect(1.4*u,0.2*u,u*0.5,1.4*u);ctx.fillRect(1*u,0.6*u,u*0.5,u*0.5);ctx.fillRect(1.9*u,0.6*u,u*0.5,u*0.5); }
    else if(g==="c4"){ ctx.fillStyle=COL.line; roundRect(ctx,-2.6*u,-2.4*u,5.2*u,4.8*u,u*0.4);ctx.fill(); for(let y=0;y<4;y++)for(let x=0;x<4;x++){ ctx.fillStyle = (y>=2&&x<2)?COL.coral : (y>=1&&x>=2)?COL.amber : COL.bg; ctx.beginPath();ctx.arc((-1.95+x*1.3)*u,(-1.75+y*1.3)*u,u*0.5,0,7);ctx.fill(); } }
    else if(g==="invaders"){ for(let r=0;r<2;r++)for(let c=-1;c<2;c++){ctx.fillRect(c*1.7*u-0.6*u,r*1.7*u-1.9*u,1.2*u,u);} ctx.fillStyle=COL.cyan;ctx.fillRect(-0.9*u,1.9*u,1.8*u,0.7*u);ctx.fillRect(-0.25*u,1.2*u,0.5*u,0.7*u); }
    else if(g==="tunnel"){ ctx.beginPath();ctx.moveTo(-3.2*u,-3*u);ctx.lineTo(3.2*u,-3*u);ctx.lineTo(3.2*u,-1*u);ctx.quadraticCurveTo(0,-0.2*u,-3.2*u,-1.5*u);ctx.closePath();ctx.fill(); ctx.beginPath();ctx.moveTo(-3.2*u,3*u);ctx.lineTo(3.2*u,3*u);ctx.lineTo(3.2*u,1*u);ctx.quadraticCurveTo(0,1.9*u,-3.2*u,0.9*u);ctx.closePath();ctx.fill(); ctx.fillStyle=COL.cyan;ctx.beginPath();ctx.arc(-1*u,0,u*0.5,0,7);ctx.fill(); }
    else if(g==="hopop"){ ctx.fillStyle=COL.green; ctx.fillRect(-3*u,2.2*u,2*u,0.6*u);ctx.fillRect(0.6*u,0.6*u,2*u,0.6*u);ctx.fillRect(-2.2*u,-1.1*u,2*u,0.6*u);ctx.fillRect(1*u,-2.7*u,2*u,0.6*u); ctx.fillStyle=COL.cyan;ctx.fillRect(-1.7*u,-2.1*u,u,u); }
    else if(g==="lysud"){ for(let y=0;y<3;y++)for(let x=0;x<3;x++){ ctx.fillStyle=((x+y)%2)?COL.amber:"#3a2f5c"; ctx.fillRect((x-1.5)*1.75*u+0.1*u,(y-1.5)*1.75*u+0.1*u,1.55*u,1.55*u); } }

        } else sel={x,y};
      });
      env.on(window,"keydown",e=>{ if(e.key===" "&&over){reset();e.preventDefault();} });
      env.loop.fn=(dt)=>{
        if(!over){ time-=dt; if(time<=0){ over=true; env.saveHi(score); env.status("Time! "+score+" — space / click to replay"); } }
        ctx.fillStyle="#0c0917"; ctx.fillRect(0,0,w,h);
        for(let y=0;y<N;y++)for(let x=0;x<N;x++){
          const v=g[y][x]; if(v==null)continue;
          if(sel&&sel.x===x&&sel.y===y){ ctx.strokeStyle=COL.ink; ctx.lineWidth=3; roundRect(ctx,x*C+3,y*C+3,C-6,C-6,8); ctx.stroke(); }
          ctx.fillStyle=GC[v]; ctx.beginPath(); ctx.arc(x*C+C/2,y*C+C/2,C*0.34,0,7); ctx.fill();
        }
        ctx.fillStyle=COL.muted; ctx.font='12px "DM Mono", monospace'; ctx.fillText("TIME "+Math.max(0,time).toFixed(1),10,h-8);
      };
      reset(); env.loop.start();
      return {};
    }});

  /* ---------------- TÅRN ---------------- */
  G({ id:"taarn", name:"Tårn", tag:"reflex", w:360, h:480,
    desc:"Drop each slab onto the one below. Overhang gets sliced away.",
    hint:"Space / ▲ / click to drop",
    mount(env){
      const {ctx,w,h,canvas}=env, BH=24;
      let stack,cur,dir,spd,score,over;
      function reset(){ const bw=150; stack=[{x:w/2-bw/2,wd:bw}]; spd=140; score=0; over=false; cur={x:0,wd:bw}; dir=1; env.score(0); env.status("Line up the slabs"); }
      env.reset=reset;
      function drop(){
        if(over){reset();return;}
        const top=stack[stack.length-1];
        const l=Math.max(cur.x,top.x), r=Math.min(cur.x+cur.wd,top.x+top.wd), ov=r-l;
        if(ov<=0){ over=true; env.saveHi(score); env.status("Missed at "+score+" high — click / space to restart"); return; }
        stack.push({x:l,wd:ov}); score++; env.score(score); env.saveHi(score);
        spd+=7; cur={x:0,wd:ov}; dir=1;
      }
      env.on(window,"keydown",e=>{ const k=e.key.toLowerCase(); if(k===" "||k==="arrowup"||k==="w"){drop();e.preventDefault();} });
      env.on(canvas,"pointerdown",drop);
      env.loop.fn=(dt)=>{
        if(!over){ cur.x+=dir*spd*dt; if(cur.x<0){cur.x=0;dir=1;} if(cur.x+cur.wd>w){cur.x=w-cur.wd;dir=-1;} }
        ctx.fillStyle="#0c0917"; ctx.fillRect(0,0,w,h);
        const shift=Math.max(0, stack.length*BH-(h-140));
        stack.forEach((s,i)=>{ ctx.fillStyle=`hsl(${(i*24)%360} 65% 58%)`; roundRect(ctx,s.x,h-30-i*BH+shift,s.wd,BH-2,4); ctx.fill(); });
        if(!over){ ctx.fillStyle=COL.cyan; roundRect(ctx,cur.x,h-30-stack.length*BH+shift,cur.wd,BH-2,4); ctx.fill(); }
        ctx.fillStyle=COL.muted; ctx.font='11px "DM Mono", monospace'; ctx.fillText("HEIGHT "+score,8,16);
      };
      reset(); env.loop.start();
      return {};
    }});

  /* ---------------- KRYDS VEJ ---------------- */
  G({ id:"krydsvej", name:"Kryds Vej", tag:"arcade", w:480, h:480,
    desc:"Hop across lane after lane of traffic. Three frogs to spare.",
    hint:"Arrows / WASD to hop",
    mount(env){
      const {ctx,w,h}=env, N=10, C=w/N;
      let fx,fy,lanes,lives,score,over,best;
      function reset(){
        fx=Math.floor(N/2); fy=N-1; lives=3; score=0; over=false; best=N-1;
        lanes=[];
        for(let r=1;r<N-1;r++){
          const cnt=2+rand(2), cars=[];
          for(let i=0;i<cnt;i++)cars.push(i*(w/cnt)+rnd(0,36));
          lanes[r]={spd:rnd(52,116)*(r%2?1:-1),cars,len:rnd(46,74)};
        }
        env.score(0); env.status("Reach the far green bank");
      }
      env.reset=reset;
      function hop(dx,dy){
        if(over){reset();return;}
        fx=clamp(fx+dx,0,N-1); fy=clamp(fy+dy,0,N-1);
        if(fy<best){ best=fy; score+=10; env.score(score); env.saveHi(score); }
        if(fy===0){ score+=50; env.score(score); env.saveHi(score); fy=N-1; best=N-1; env.status("Crossed! +50 — go again"); }
      }
      env.on(window,"keydown",e=>{
        const k=e.key.toLowerCase();
        if(k==="arrowup"||k==="w")hop(0,-1);
        else if(k==="arrowdown"||k==="s")hop(0,1);
        else if(k==="arrowleft"||k==="a")hop(-1,0);
        else if(k==="arrowright"||k==="d")hop(1,0);
        else if(k===" "&&over)reset();
        if(k.startsWith("arrow")||k===" ")e.preventDefault();
      });
      env.loop.fn=(dt)=>{
        if(!over){
          for(let r=1;r<N-1;r++){
            const L=lanes[r];
            for(let i=0;i<L.cars.length;i++){
              L.cars[i]+=L.spd*dt;
              if(L.cars[i]>w+L.len)L.cars[i]=-L.len;
              if(L.cars[i]<-L.len)L.cars[i]=w+L.len;
              if(r===fy){
                const cx=fx*C;
                if(cx+C*0.72>L.cars[i]&&cx+C*0.28<L.cars[i]+L.len){
                  lives--; fx=Math.floor(N/2); fy=N-1; best=N-1;
                  if(lives<=0){ over=true; env.saveHi(score); env.status("Squashed — A / space to retry"); }
                  else env.status("Frogs left "+lives);
                }
              }
            }
          }
        }
        ctx.fillStyle="#141024"; ctx.fillRect(0,0,w,h);
        ctx.fillStyle=COL.green; ctx.fillRect(0,0,w,C); ctx.fillRect(0,h-C,w,C);
        for(let r=1;r<N-1;r++){
          const L=lanes[r];
          ctx.fillStyle=L.spd>0?COL.coral:COL.amber;
          L.cars.forEach(cx=>{ roundRect(ctx,cx,r*C+6,L.len,C-12,5); ctx.fill(); });
        }
        ctx.fillStyle=over?COL.muted:COL.cyan;
        ctx.beginPath(); ctx.arc(fx*C+C/2,fy*C+C/2,C*0.32,0,7); ctx.fill();
        ctx.fillStyle=COL.muted; ctx.font='12px "DM Mono", monospace'; ctx.fillText("FROGS "+Math.max(0,lives),10,h-8);
      };
      reset(); env.loop.start();
      return {};
    }});

  /* ---------------- LABYRINT ---------------- */
  G({ id:"labyrint", name:"Labyrint", tag:"puzzle", w:465, h:465,
    desc:"A fresh maze every run. Trace a path to the green exit, against the clock.",
    hint:"Arrows / WASD to move",
    mount(env){
      const {ctx,w,h}=env, N=15, C=w/N;
      const D={n:[0,-1],s:[0,1],e:[1,0],w:[-1,0]}, OPP={n:"s",s:"n",e:"w",w:"e"};
      let cells,px,py,t,done;
      function gen(){
        cells=Array.from({length:N},()=>Array.from({length:N},()=>({v:false,n:true,e:true,s:true,w:true})));
        const st=[[0,0]]; cells[0][0].v=true;
        while(st.length){
          const [x,y]=st[st.length-1];
          const opts=Object.keys(D).filter(d=>{ const nx=x+D[d][0],ny=y+D[d][1]; return nx>=0&&nx<N&&ny>=0&&ny<N&&!cells[ny][nx].v; });
          if(!opts.length){ st.pop(); continue; }
          const d=opts[rand(opts.length)], nx=x+D[d][0], ny=y+D[d][1];
          cells[y][x][d]=false; cells[ny][nx][OPP[d]]=false; cells[ny][nx].v=true; st.push([nx,ny]);
        }
      }
      function reset(){ gen(); px=0; py=0; t=0; done=false; env.score(0); env.status("Reach the bottom-right"); }
      env.reset=reset;
      function move(d){
        if(done){reset();return;}
        if(cells[py][px][d])return;
        px+=D[d][0]; py+=D[d][1];
        if(px===N-1&&py===N-1){ done=true; env.saveHi(Math.max(50,1200-Math.floor(t*20))); env.status("Out in "+t.toFixed(1)+"s — A / new maze"); }
      }
      env.on(window,"keydown",e=>{
        const k=e.key.toLowerCase();
        if(k==="arrowup"||k==="w")move("n");
        else if(k==="arrowdown"||k==="s")move("s");
        else if(k==="arrowleft"||k==="a")move("w");
        else if(k==="arrowright"||k==="d")move("e");
        else if(k===" "&&done)reset();
        if(k.startsWith("arrow")||k===" ")e.preventDefault();
      });
      env.loop.fn=(dt)=>{
        if(!done){ t+=dt; env.score(t.toFixed(1)); }
        ctx.fillStyle="#0c0917"; ctx.fillRect(0,0,w,h);
        ctx.fillStyle=COL.green; ctx.fillRect((N-1)*C+3,(N-1)*C+3,C-6,C-6);
        ctx.strokeStyle=COL.violet; ctx.lineWidth=2; ctx.beginPath();
        for(let y=0;y<N;y++)for(let x=0;x<N;x++){
          const c=cells[y][x], X=x*C, Y=y*C;
          if(c.n){ctx.moveTo(X,Y);ctx.lineTo(X+C,Y);}
          if(c.w){ctx.moveTo(X,Y);ctx.lineTo(X,Y+C);}
          if(x===N-1&&c.e){ctx.moveTo(X+C,Y);ctx.lineTo(X+C,Y+C);}
          if(y===N-1&&c.s){ctx.moveTo(X,Y+C);ctx.lineTo(X+C,Y+C);}
        }
        ctx.stroke();
        ctx.fillStyle=done?COL.green:COL.cyan; ctx.beginPath(); ctx.arc(px*C+C/2,py*C+C/2,C*0.3,0,7); ctx.fill();
      };
      reset(); env.loop.start();
      return {};
    }});

  /* ---------------- HØJT / LAVT ---------------- */
  G({ id:"hojlav", name:"Højt / Lavt", tag:"classic", w:460, h:300,
    desc:"Will the next card land higher or lower? Build the longest run.",
    hint:"◀ lower · ▶ higher · or click a side",
    mount(env){
      const {ctx,w,h,canvas}=env;
      const SUIT=["♠","♥","♦","♣"];
      let deck,cur,next,streak,over,reveal,msg,lock;
      const fresh=()=>{ deck=[]; for(let s=0;s<4;s++)for(let r=2;r<=14;r++)deck.push({r,s}); deck.sort(()=>Math.random()-0.5); };
      function reset(){ fresh(); cur=deck.pop(); next=null; streak=0; over=false; reveal=false; lock=false; msg="Higher or lower?"; env.score(0); env.status("◀ lower · ▶ higher"); }
      env.reset=reset;
      function guess(hi){
        if(over){reset();return;}
        if(lock)return;
        if(!deck.length)fresh();
        next=deck.pop(); reveal=true; lock=true;
        const ok = hi ? next.r>=cur.r : next.r<=cur.r;
        setTimeout(()=>{
          if(ok){ streak++; env.score(streak); env.saveHi(streak); cur=next; next=null; reveal=false; lock=false; msg="Nice — keep the run going"; }
          else { over=true; msg="Wrong! run of "+streak; env.status("Busted — click / space to restart"); }
        },720);
      }
      env.on(window,"keydown",e=>{
        const k=e.key.toLowerCase();
        if(k==="arrowright"||k==="d"||k==="arrowup"||k==="w")guess(true);
        else if(k==="arrowleft"||k==="a"||k==="arrowdown"||k==="s")guess(false);
        else if(k===" "&&over)reset();
        if(k.startsWith("arrow")||k===" ")e.preventDefault();
      });
      env.on(canvas,"pointerdown",e=>{ if(over){reset();return;} const p=pointer(e,canvas); guess(p.x>w/2); });
      function drawCard(cd,x,faceUp){
        ctx.fillStyle=faceUp?"#f3ecff":"#2c2249";
        roundRect(ctx,x,h/2-72,92,132,10); ctx.fill();
        if(faceUp&&cd){
          ctx.fillStyle=(cd.s===1||cd.s===2)?COL.coral:"#1a1330";
          ctx.textAlign="center"; ctx.textBaseline="middle";
          ctx.font='700 30px "DM Mono", monospace';
          ctx.fillText(cd.r<=10?cd.r:["J","Q","K","A"][cd.r-11], x+46, h/2-24);
          ctx.font='30px "DM Mono", monospace'; ctx.fillText(SUIT[cd.s], x+46, h/2+18);
          ctx.textAlign="left"; ctx.textBaseline="alphabetic";
        }
      }
      env.loop.fn=()=>{
        ctx.fillStyle="#0c0917"; ctx.fillRect(0,0,w,h);
        drawCard(cur, w/2-150, true);
        drawCard(next, w/2+58, reveal);
        ctx.fillStyle=COL.muted; ctx.font='13px "DM Mono", monospace'; ctx.textAlign="center";
        ctx.fillText(msg, w/2, 32);
        ctx.fillText("◀ LOWER", w/2-104, h-22); ctx.fillText("HIGHER ▶", w/2+104, h-22);
        ctx.textAlign="left";
      };
      reset(); env.loop.start();
      return {};
    }});

  /* ============================ SHELL ============================ */
  const grid = $("#grid"), filters = $("#filters");
  const cabinet = $("#cabinet"), cabName = $("#cabName"), cabScore = $("#cabScore"), cabHi = $("#cabHi");
  const hudScore = $("#hudScore"), hudStatus = $("#hudStatus"), cabHint = $("#cabHint");
  const play = $("#play"), pctx = play.getContext("2d");
  const cabClose = $("#cabClose"), cabRestart = $("#cabRestart");

  const ROWS = [
    {key:"all", label:"All "+GAMES.length},
    {key:"arcade", label:"Arcade Row"},
    {key:"puzzle", label:"Puzzle Row"},
    {key:"reflex", label:"Reflex Row"},
    {key:"classic", label:"Classics"}
  ];
  let activeFilter = "all";

  ROWS.forEach(r=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=r.label;
    b.setAttribute("aria-pressed", r.key===activeFilter);
    b.onclick=()=>{ activeFilter=r.key; [...filters.children].forEach(c=>c.setAttribute("aria-pressed", c===b)); render(); };
    filters.appendChild(b);
  });

  function render(){
    grid.innerHTML="";
    GAMES.filter(g=>activeFilter==="all"||g.tag===activeFilter).forEach(g=>{
      const card=document.createElement("button");
      card.className="card";
      card.style.setProperty("--accent", TAGCOL[g.tag]);
      const thumb=document.createElement("div"); thumb.className="thumb";
      const ic=document.createElement("canvas"); ic.width=240; ic.height=150;
      icon(g.id, ic.getContext("2d"), 150);
      // center 150 sq inside 240 wide
      const ictx=ic.getContext("2d");
      ictx.clearRect(0,0,240,150); ictx.save(); ictx.translate(45,0); icon(g.id, ictx, 150); ictx.restore();
      thumb.appendChild(ic);
      const meta=document.createElement("div"); meta.className="meta";
      meta.innerHTML=`<span class="lbl">${g.tag}</span><span class="name">${g.name}</span><span class="desc">${g.desc}</span>`;
      card.append(thumb,meta);
      card.onclick=()=>openGame(g);
      grid.appendChild(card);
    });
  }

  let current=null;
  function openGame(def){
    closeGame();
    play.width = def.w||480; play.height = def.h||480;
    cabName.textContent = def.name;
    cabHint.textContent = def.hint||"";
    const key = "pa_"+def.id;
    const listeners=[];
    const loop = new Loop();
    const env = {
      canvas:play, ctx:pctx, w:play.width, h:play.height, loop,
      on:(t,ty,fn,o)=>{ t.addEventListener(ty,fn,o); listeners.push([t,ty,fn,o]); },
      score:v=>{ hudScore.textContent="Score "+v; cabScore.textContent=v; },
      status:v=>{ hudStatus.textContent=v; },
      hi:()=>+localStorage.getItem(key)||0,
      saveHi:v=>{ if(v>(+localStorage.getItem(key)||0)){ localStorage.setItem(key,Math.round(v)); } cabHi.textContent=(+localStorage.getItem(key)||0); },
      reset:()=>{}
    };
    cabHi.textContent = env.hi();
    cabScore.textContent = 0;
    const inst = def.mount(env) || {};
    current = { inst, loop, listeners, env };
    cabinet.classList.add("open");
    cabClose.focus();
  }
  function closeGame(){
    if(!current)return;
    try{ current.inst.destroy && current.inst.destroy(); }catch(e){}
    current.loop.stop();
    current.listeners.forEach(([t,ty,fn,o])=>t.removeEventListener(ty,fn,o));
    pctx.clearRect(0,0,play.width,play.height);
    current=null;
    cabinet.classList.remove("open");
  }
  cabClose.onclick=closeGame;
  cabRestart.onclick=()=>{ if(current&&current.env.reset)current.env.reset(); };
  cabinet.addEventListener("pointerdown",e=>{ if(e.target===cabinet)closeGame(); });
  window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&current)closeGame(); });

  // d-pad -> synthetic key events on window
  document.querySelectorAll(".dpad button").forEach(btn=>{
    const k=btn.dataset.k;
    const send=(type)=>window.dispatchEvent(new KeyboardEvent(type,{key:k,bubbles:true}));
    btn.addEventListener("pointerdown",e=>{ e.preventDefault(); send("keydown"); });
    btn.addEventListener("pointerup",e=>{ e.preventDefault(); send("keyup"); });
    btn.addEventListener("pointerleave",()=>send("keyup"));
    btn.addEventListener("pointercancel",()=>send("keyup"));
  });

  render();
})();
</script>
