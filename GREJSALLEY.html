<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#130e1f" />
<title>Grejs Alley</title>
<meta name="description" content="A neon back-alley arcade cabinet with sixteen tiny games." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" />

<style>
  :root{
    --bg:#130e1f;
    --bg-2:#1a1430;
    --panel:#221a3a;
    --panel-2:#2a2049;
    --line:#3b2f5c;
    --ink:#f5efff;
    --muted:#a99cc7;
    --coral:#ff4d6d;
    --amber:#ffc24b;
    --cyan:#54d8ff;
    --green:#5ce6a0;
    --violet:#c07bff;
    --shadow:0 18px 40px -16px rgba(0,0,0,.7);
    --r:14px;
  }

  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -8%, #2a1c47 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 100%, #1c2b45 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Outfit", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
    z-index:9999;
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }

  .wrap{max-width:1120px;margin:0 auto;padding:32px 20px 64px}

  header.marquee{
    text-align:center;
    padding:28px 16px 34px;
    position:relative;
  }
  .sign{
    font-family:"Bungee", cursive;
    font-size:clamp(38px, 8vw, 76px);
    line-height:.98;
    letter-spacing:.5px;
    text-wrap:balance;
    margin:0;
    color:var(--ink);
    text-shadow:
      0 0 2px #fff,
      0 0 14px var(--coral),
      0 0 30px rgba(255,77,109,.5),
      4px 5px 0 rgba(0,0,0,.35);
  }
  .sign .b{color:var(--cyan);text-shadow:0 0 2px #fff,0 0 14px var(--cyan),0 0 30px rgba(84,216,255,.45),4px 5px 0 rgba(0,0,0,.35)}
  .tag{
    margin:14px auto 0;
    max-width:52ch;
    color:var(--muted);
    font-size:15px;
  }
  .bulbs{display:flex;gap:10px;justify-content:center;margin-top:18px}
  .bulbs i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);opacity:.5;animation:blink 1.4s infinite}
  .bulbs i:nth-child(2){animation-delay:.2s;background:var(--coral);box-shadow:0 0 10px var(--coral)}
  .bulbs i:nth-child(3){animation-delay:.4s;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .bulbs i:nth-child(4){animation-delay:.6s;background:var(--green);box-shadow:0 0 10px var(--green)}
  .bulbs i:nth-child(5){animation-delay:.8s;background:var(--violet);box-shadow:0 0 10px var(--violet)}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

  .filters{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    margin:26px 0 22px;
  }
  .chip{
    font:500 13px/1 "DM Mono", ui-monospace, monospace;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, color .12s ease, background .12s ease;
  }
  .chip:hover{color:var(--ink);border-color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#2a0713;font-weight:500}
  .chip:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(224px, 1fr));
    gap:16px;
  }
  .card{
    display:flex;flex-direction:column;
    text-align:left;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--r);
    overflow:hidden;
    cursor:pointer;
    color:inherit;
    font:inherit;
    transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--accent, var(--coral));box-shadow:0 16px 30px -14px rgba(0,0,0,.7), 0 0 0 1px var(--accent, var(--coral)) inset}
  .card:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  .card .thumb{
    aspect-ratio:16/10;
    display:grid;place-items:center;
    background:radial-gradient(120px 80px at 50% 30%, rgba(255,255,255,.06), transparent), var(--bg-2);
    border-bottom:1px solid var(--line);
  }
  .card .thumb canvas{width:100%;height:100%;image-rendering:pixelated}
  .card .meta{padding:13px 14px 15px;display:flex;flex-direction:column;gap:5px}
  .card .name{font-weight:600;font-size:16px;letter-spacing:.2px}
  .card .lbl{font:500 10px/1 "DM Mono", monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent, var(--coral))}
  .card .desc{color:var(--muted);font-size:12.5px;line-height:1.45}

  footer.legal{margin-top:44px;text-align:center;color:var(--muted);font-size:12px}

  /* ---- cabinet ---- */
  .cabinet{
    position:fixed;inset:0;z-index:200;
    display:none;
    place-items:center;
    padding:20px;
    background:rgba(9,6,15,.9);
    backdrop-filter:blur(6px);
  }
  .cabinet.open{display:grid}
  .console{
    width:min(560px, 100%);
    max-height:calc(100vh - 40px);
    display:flex;flex-direction:column;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .console .bar{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    background:var(--bg-2);
  }
  .console .bar h2{
    margin:0;flex:1;
    font-family:"Bungee", cursive;
    font-size:16px;letter-spacing:.5px;
    color:var(--cyan);
    text-shadow:0 0 12px rgba(84,216,255,.35);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pill{
    font:500 11px/1 "DM Mono", monospace;
    letter-spacing:.05em;
    padding:6px 9px;border-radius:999px;
    border:1px solid var(--line);
    color:var(--muted);
    white-space:nowrap;
  }
  .pill b{color:var(--amber);font-weight:500}
  .xclose{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);width:32px;height:32px;border-radius:9px;cursor:pointer;
    font-size:16px;line-height:1;
  }
  .xclose:hover{border-color:var(--coral);color:var(--coral)}
  .xclose:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  .stage-shell{
    padding:16px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    overflow:auto;
  }
  .hud{
    width:100%;
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    font:500 13px/1.3 "DM Mono", monospace;
  }
  .hud .sc{color:var(--green);font-size:15px;font-variant-numeric:tabular-nums}
  .hud .st{color:var(--muted);text-align:right;flex:1}
  canvas.play{
    display:block;
    background:#0c0917;
    border:1px solid var(--line);
    border-radius:10px;
    max-width:100%;
    height:auto;
    touch-action:none;
  }
  .stage{position:relative;display:inline-flex;max-width:100%}
  .veil{
    position:absolute;inset:0;display:none;place-items:center;
    border-radius:10px;background:rgba(9,6,15,.74);
    font-family:"Bungee",cursive;font-size:22px;letter-spacing:2px;
    color:var(--amber);text-shadow:0 0 18px rgba(255,194,75,.45);
  }
  .veil.on{display:grid}

  .controls{
    width:100%;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding-top:2px;
  }
  .dpad{
    display:grid;
    grid-template-columns:repeat(3,42px);
    grid-template-rows:repeat(3,42px);
    gap:6px;
  }
  .dpad button{
    appearance:none;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);
    border-radius:10px;font-size:16px;cursor:pointer;
    display:grid;place-items:center;
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .dpad button:active{background:var(--coral);border-color:var(--coral);color:#2a0713}
  .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
  .dpad .a{grid-area:2/2;background:var(--panel);font:600 12px/1 "DM Mono",monospace}
  .dpad .a:active{background:var(--amber);color:#2a1a00}
  .restart{
    appearance:none;cursor:pointer;
    font:600 12px/1 "DM Mono", monospace;letter-spacing:.08em;text-transform:uppercase;
    padding:12px 16px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  }
  .restart:hover{border-color:var(--green);color:var(--green)}
  .restart:focus-visible,.dpad button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .hint{color:var(--muted);font:400 11.5px/1.45 "Outfit",sans-serif;max-width:20ch;text-align:right}

  /* ---- search ---- */
  .search{display:flex;justify-content:center;margin:0 0 20px}
  .search input{
    width:min(340px,100%);
    font:400 14px/1 "Outfit",sans-serif;
    padding:11px 16px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(84,216,255,.25)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:46px 0}

  /* ---- card badges ---- */
  .card .thumb{position:relative}
  .card .hi{
    position:absolute;top:8px;right:8px;
    font:500 10px/1 "DM Mono",monospace;letter-spacing:.1em;
    padding:5px 7px;border-radius:999px;
    background:rgba(9,6,15,.72);border:1px solid var(--line);color:var(--amber);
  }
  .card .new{
    position:absolute;top:8px;left:8px;
    font:600 9px/1 "DM Mono",monospace;letter-spacing:.16em;
    padding:5px 7px;border-radius:999px;
    background:var(--coral);color:#2a0713;
  }

  /* ---- cabinet chrome ---- */
  .iconbtn{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);width:32px;height:32px;border-radius:9px;cursor:pointer;
    font-size:13px;line-height:1;display:grid;place-items:center;
    transition:color .12s ease,border-color .12s ease;
  }
  .iconbtn:hover{color:var(--ink);border-color:var(--muted)}
  .iconbtn.on{color:var(--amber);border-color:var(--amber)}
  .iconbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .cabinet.open{display:grid;animation:fadein .16s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .console{animation:rise .22s cubic-bezier(.2,.85,.3,1)}
  @keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}

  @media (max-width:560px){
    .wrap{padding:20px 14px 48px}
    .stage-shell{padding:12px}
    .controls{flex-wrap:wrap;justify-content:center;gap:12px}
    .hint{display:none}
    .dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px)}
    .console .bar{padding:10px}
  }
  @media (hover:none){ .card:hover{transform:none} }
  .backlink{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font:500 13px/1 "DM Mono", ui-monospace, monospace;letter-spacing:.06em;text-transform:uppercase;transition:border-color .15s,color .15s}
  .backlink:hover{border-color:var(--cyan);color:var(--cyan)}
  .backlink:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <a class="backlink" href="index.html">← Tilbage</a>
  <header class="marquee">
    <h1 class="sign">GREJS <span class="b">ALLEY</span></h1>
    <p class="tag">A cramped neon arcade at the end of the block. A back room full of coin-op miniatures, one dusty cabinet. Keyboard, mouse, or the on-screen stick.</p>
    <div class="bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter games by cabinet row"></nav>
  <div class="search">
    <input id="q" type="search" placeholder="Search the cabinet…" aria-label="Search games" autocomplete="off" spellcheck="false" />
  </div>
  <main class="grid" id="grid"></main>

  <footer class="legal">Grejs Alley · all games run locally in your browser · high scores saved to this device</footer>
</div>

<div class="cabinet" id="cabinet" role="dialog" aria-modal="true" aria-labelledby="cabName">
  <div class="console">
    <div class="bar">
      <h2 id="cabName">Game</h2>
      <span class="pill">SCORE <b id="cabScore">0</b></span>
      <span class="pill">HI <b id="cabHi">0</b></span>
      <button class="iconbtn" id="cabSound" aria-label="Toggle sound" title="Sound">♪</button>
      <button class="iconbtn" id="cabPause" aria-label="Pause or resume" title="Pause (P)">❚❚</button>
      <button class="xclose" id="cabClose" aria-label="Leave cabinet">✕</button>
    </div>
    <div class="stage-shell">
      <div class="hud"><span class="sc" id="hudScore">Score 0</span><span class="st" id="hudStatus">Ready</span></div>
      <div class="stage">
        <canvas class="play" id="play" width="480" height="480"></canvas>
        <div class="veil" id="veil">PAUSED</div>
      </div>
      <div class="controls">
        <div class="dpad" aria-hidden="false">
          <button class="u" data-k="ArrowUp" aria-label="Up">▲</button>
          <button class="l" data-k="ArrowLeft" aria-label="Left">◀</button>
          <button class="a" data-k=" " aria-label="Action">A</button>
          <button class="r" data-k="ArrowRight" aria-label="Right">▶</button>
          <button class="d" data-k="ArrowDown" aria-label="Down">▼</button>
        </div>
        <button class="restart" id="cabRestart">Restart</button>
        <p class="hint" id="cabHint"></p>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const CS = getComputedStyle(document.documentElement);
  const COL = {};
  ["ink","muted","line","coral","amber","cyan","green","violet","bg","panel"].forEach(k=>{
    COL[k] = CS.getPropertyValue("--"+k).trim();
  });
  const rand = n => Math.floor(Math.random()*n);
  const rnd = (a,b) => a + Math.random()*(b-a);
  const clamp = (v,a,b) => v<a?a:v>b?b:v;
  const TAGCOL = {arcade:COL.coral, puzzle:COL.cyan, reflex:COL.amber, classic:COL.green};

  function pointer(e, canvas){
    const r = canvas.getBoundingClientRect();
    const t = e.touches && e.touches[0] ? e.touches[0] : e;
    return {
      x:(t.clientX - r.left) * (canvas._lw||canvas.width) / r.width,
      y:(t.clientY - r.top) * (canvas._lh||canvas.height) / r.height
    };
  }
  /* shared scene backdrop: gradient + faint grid, replaces the old flat fill */
  let _bgc = null;
  function paintBg(ctx,w,h){
    if(!_bgc || _bgc.w!==w || _bgc.h!==h){
      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,"#161029"); g.addColorStop(0.55,"#100b21"); g.addColorStop(1,"#090613");
      _bgc = {w,h,g};
    }
    ctx.fillStyle=_bgc.g; ctx.fillRect(0,0,w,h);
    ctx.save();
    ctx.strokeStyle="rgba(255,255,255,.022)"; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=40;x<w;x+=40){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,h); }
    for(let y=40;y<h;y+=40){ ctx.moveTo(0,y+.5); ctx.lineTo(w,y+.5); }
    ctx.stroke();
    ctx.restore();
  }

  /* tiny bleepy sound desk */
  const SFX = (function(){
    let ac=null, on = localStorage.getItem("pa_sound") !== "0";
    function ctxOf(){
      if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; } }
      if(ac && ac.state==="suspended") ac.resume();
      return ac;
    }
    function tone(f,dur,type,vol,to){
      if(!on) return;
      const c=ctxOf(); if(!c) return;
      const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
      o.type=type||"square"; o.frequency.setValueAtTime(f,t);
      if(to) o.frequency.exponentialRampToValueAtTime(Math.max(40,to), t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol==null?0.05:vol, t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t+dur+0.03);
    }
    return {
      enabled:()=>on,
      set(v){ on=!!v; localStorage.setItem("pa_sound", on?"1":"0"); if(on) ctxOf(); },
      wake(){ if(on) ctxOf(); },
      blip(){ tone(680,0.06,"square",0.035); },
      ui(){ tone(520,0.05,"sine",0.03); },
      hit(){ tone(190,0.16,"sawtooth",0.05,80); },
      over(){ tone(300,0.45,"sawtooth",0.05,70); },
      fanfare(){ [0,4,7,12].forEach((n,i)=>setTimeout(()=>tone(440*Math.pow(2,n/12),0.13,"triangle",0.045), i*85)); }
    };
  })();

  function roundRect(ctx,x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  class Loop{
    constructor(){ this.fn=null; this.pre=null; this.paused=false; this.raf=0; this.last=0; this._run=this._run.bind(this); }
    start(){ if(this.raf) return; this.last=performance.now(); this.raf=requestAnimationFrame(this._run); }
    _run(t){
      const dt = Math.min(0.05, (t-this.last)/1000);
      this.last = t;
      if(!this.paused && this.fn){ if(this.pre) this.pre(); this.fn(dt); }
      this.raf = requestAnimationFrame(this._run);
    }
    stop(){ cancelAnimationFrame(this.raf); this.raf=0; }
  }

  /* ============================ GAMES ============================ */
  const GAMES = [];
  const G = def => GAMES.push(def);

  /* ---- Icons: draw into s x s ---- */
  function icon(id, ctx, s){
    ctx.clearRect(0,0,s,s);
    const g = id;
    const bg = TAGCOL[(GAMES.find(x=>x.id===id)||{}).tag] || COL.coral;
    ctx.fillStyle = COL.bg; ctx.fillRect(0,0,s,s);
    ctx.save();
    ctx.translate(s/2,s/2);
    ctx.strokeStyle = bg; ctx.fillStyle = bg; ctx.lineWidth = s*0.06; ctx.lineJoin="round";
    const u = s*0.13;
    const px = (x,y,w,h)=>ctx.fillRect(x*u,y*u,w*u,h*u);
    if(g==="snake"){ ctx.fillRect(-3*u,-1*u,u,u);ctx.fillRect(-2*u,-1*u,u,u);ctx.fillRect(-1*u,-1*u,u,u);ctx.fillRect(-1*u,0,u,u);ctx.fillRect(0,0,u,u);ctx.fillStyle=COL.green;ctx.fillRect(1.4*u,-2*u,u*0.8,u*0.8); }
    else if(g==="breakout"){ for(let i=-2;i<2;i++)for(let j=-2;j<-0;j++){ctx.fillRect(i*u+1,j*u+1,u-2,u*0.7);} ctx.fillRect(-1.2*u,2*u,2.4*u,u*0.5); ctx.beginPath();ctx.arc(0,u,u*0.35,0,7);ctx.fill(); }

  G({ id:"g2048", name:"Slide 2048", tag:"puzzle", swipe:true, w:440, h:440,

    mount(env){

      const TCOL={2:"#3a2f5c",4:"#4a3a6e",8:COL.violet,16:"#a259ff",32:COL.coral,64:"#ff6b4a",128:COL.amber,256:"#ffd166",512:COL.cyan,1024:"#3ad1ff",2048:COL.green};

      function reset(){ b=Array.from({length:N},()=>Array(N).fill(0)); score=0; over=false; won=false; add(); add(); env.score(0); env.status("Merge to 2048"); }

          d.vy+=0.55; d.y+=d.vy;
          if(d.y>=LAND_Y) drops.splice(i,1);
        }
      }

      function burst(k){
        const cx=k.c*CELL+CELL/2, cy=TOP+k.r*CELL+CELL/2, hue=k.hue!=null?k.hue:brickHue(1);
        for(let i=0;i<16 && particles.length<500;i++){
          const a=Math.random()*Math.PI*2, s=1.5+Math.random()*3.5;
          particles.push({
            x:cx+(Math.random()-.5)*30, y:cy+(Math.random()-.5)*30,
            vx:Math.cos(a)*s, vy:Math.sin(a)*s-1.5,
            life:28+randInt(0,12), max:40, hue, size:4+Math.random()*4
          });
        }
      }

      /* ---- aiming ---- */
      function brickHits(x,y){
        for(const k of bricks){
          const rx=k.c*CELL+GAP, ry=TOP+k.r*CELL+GAP, rs=CELL-2*GAP;
          const cx=clamp(x,rx,rx+rs), cy=clamp(y,ry,ry+rs);
          if((x-cx)**2+(y-cy)**2<R*R) return true;
        }
        return false;
      }

      function aimPath(angle){
        const dx=Math.cos(angle), dy=Math.sin(angle);
        let x=launchX, y=LAND_Y, dist=0;
        while(dist<1100){
          const nx=x+dx*4, ny=y+dy*4;
          if(nx<R || nx>W-R || ny<R || brickHits(nx,ny)) break;
          x=nx; y=ny; dist+=4;
        }
        return {x,y,dist};
      }

      function updateAim(p){
        if(p.y>FLOOR_Y){ aimAngle=null; return; }   // drag below the line to cancel
        let a=Math.atan2(p.y-LAND_Y, p.x-launchX);
        if(a>-MIN_A && a<=Math.PI/2) a=-MIN_A;
        else if(a>Math.PI/2 || a<-Math.PI+MIN_A) a=-Math.PI+MIN_A;
        aimAngle=a;
      }

      const local=e=>{ const p=pointer(e,canvas); return {x:p.x/K, y:p.y/K}; };

      env.on(canvas,"pointerdown",e=>{
        const p=local(e);
        if(phase==="over"){ if(overT>27) reset(); return; }
        if(p.y>=PLAY_H){
          if(inRect(p,BTN_RECALL,8)) recall();
          else if(inRect(p,BTN_FAST,8)) toggleFast();
          return;
        }
        if(phase!=="aim") return;
        aiming=true; kbAim=false;
        try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
        updateAim(p);
        e.preventDefault();
      });
      env.on(canvas,"pointermove",e=>{ if(aiming) updateAim(local(e)); });
      env.on(canvas,"pointerup",e=>{
        if(!aiming) return;
        aiming=false;
        updateAim(local(e));
        if(phase==="aim" && aimAngle!==null) shoot(aimAngle);
        else aimAngle=null;
      });
      env.on(canvas,"pointercancel",()=>{ aiming=false; aimAngle=null; });

      env.on(window,"keydown",e=>{
        const k=e.key.toLowerCase();
        if(k==="arrowleft"||k==="a") keys.left=true;
        else if(k==="arrowright"||k==="d") keys.right=true;
        else if(k==="arrowdown"||k==="s") recall();
        else if((k==="arrowup"||k==="w") && !e.repeat) toggleFast();
        else if(k===" " && !e.repeat){
          if(phase==="over"){ if(overT>27) reset(); }
          else if(phase==="aim" && !aiming){
            if(kbAim && aimAngle!==null) shoot(aimAngle);
            else { kbAim=true; aimAngle=kbAngle; }
          }
        }
        if(k.startsWith("arrow")||k===" ") e.preventDefault();
      });
      env.on(window,"keyup",e=>{
        const k=e.key.toLowerCase();
        if(k==="arrowleft"||k==="a") keys.left=false;
        else if(k==="arrowright"||k==="d") keys.right=false;
      });
      env.on(window,"blur",()=>{ keys.left=false; keys.right=false; });

      /* ---- drawing ---- */
      function pill(b,label,on,enabled){
        ctx.globalAlpha=enabled?1:0.38;
        roundRect(ctx,b.x,b.y,b.w,b.h,b.h/2);
        ctx.fillStyle=on?COL.amber:"#2a2049"; ctx.fill();
        ctx.lineWidth=2; ctx.strokeStyle=on?COL.amber:COL.line; ctx.stroke();
        ctx.fillStyle=on?"#2a1a00":COL.ink;
        ctx.font=`500 16px ${MONO}`; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(label, b.x+b.w/2, b.y+b.h/2+1);
        ctx.globalAlpha=1;
      }

      function draw(){
        paintBg(ctx,w,env.h);
        ctx.save();
        ctx.scale(K,K);

        // board backdrop: soft vignette + faint grid
        const bgG=ctx.createLinearGradient(0,0,0,FLOOR_Y);
        bgG.addColorStop(0,"rgba(80,60,150,.18)"); bgG.addColorStop(1,"rgba(0,0,0,0)");
        ctx.fillStyle=bgG; ctx.fillRect(0,0,W,FLOOR_Y);
        ctx.strokeStyle="rgba(245,239,255,.035)"; ctx.lineWidth=1; ctx.beginPath();
        for(let c=1;c<COLS;c++){ ctx.moveTo(c*CELL,TOP); ctx.lineTo(c*CELL,FLOOR_Y); }
        for(let r=1;r<NROWS;r++){ ctx.moveTo(0,TOP+r*CELL); ctx.lineTo(W,TOP+r*CELL); }
        ctx.stroke();

        // floor + control strip
        ctx.fillStyle="rgba(0,0,0,.30)"; ctx.fillRect(0,FLOOR_Y,W,H-FLOOR_Y);
        const flG=ctx.createLinearGradient(0,0,W,0);
        flG.addColorStop(0,"rgba(79,209,255,0)"); flG.addColorStop(.5,"rgba(79,209,255,.75)"); flG.addColorStop(1,"rgba(79,209,255,0)");
        ctx.shadowColor="rgba(79,209,255,.8)"; ctx.shadowBlur=12;
        ctx.fillStyle=flG; ctx.fillRect(0,FLOOR_Y,W,2);
        ctx.shadowBlur=0;
        ctx.fillStyle="rgba(59,47,92,.9)"; ctx.fillRect(0,PLAY_H,W,1);

        const off=phase==="advance" ? -(1-easeOut(shiftT))*CELL : 0;
        ctx.save();
        ctx.beginPath(); ctx.rect(0,0,W,PLAY_H); ctx.clip();   // keep the board out of the control strip

        // warning when bricks sit in the last row
        if(phase==="aim" && bricks.some(k=>k.r===NROWS-1)){
          ctx.fillStyle=`rgba(255,77,109,${0.08+0.05*Math.sin(time*0.12)})`;
          ctx.fillRect(0,TOP+(NROWS-1)*CELL,W,CELL);
        }

        // pickups
        for(const it of items){
          const x=it.c*CELL+CELL/2, y=TOP+it.r*CELL+CELL/2+off;
          if(it.type==="ball"){
            const pulse=1+0.12*Math.sin(time*0.12+it.c);
            ctx.shadowColor="rgba(120,255,190,.9)"; ctx.shadowBlur=14;
            ctx.strokeStyle=COL.green; ctx.lineWidth=3;
            circle(x,y,14*pulse); ctx.stroke();
            ctx.fillStyle="#fff"; circle(x,y,6); ctx.fill();
            ctx.shadowBlur=0;
            ctx.font=`700 11px ${FONT}`; ctx.fillStyle=COL.green; ctx.textAlign="center"; ctx.textBaseline="middle";
            ctx.fillText("+1", x, y-24*pulse);
          } else {
            const sx=Math.abs(Math.cos(time*0.06+it.c));   // spinning coin
            ctx.save(); ctx.translate(x,y); ctx.scale(0.35+0.65*sx,1);
            ctx.shadowColor="rgba(255,194,75,.9)"; ctx.shadowBlur=12;
            const cg=ctx.createRadialGradient(-3,-3,1,0,0,11);
            cg.addColorStop(0,"#fff3c4"); cg.addColorStop(.5,COL.amber); cg.addColorStop(1,"#b7761a");
            ctx.fillStyle=cg; circle(0,0,11); ctx.fill();
            ctx.shadowBlur=0; ctx.strokeStyle="rgba(120,70,0,.6)"; ctx.lineWidth=1.5; circle(0,0,7); ctx.stroke();
            ctx.restore();
          }
        }

        // bricks
        ctx.textAlign="center"; ctx.textBaseline="middle";
        const denom=Math.max(2,round*1.4);
        for(const k of bricks){
          const x=k.c*CELL+GAP, y=TOP+k.r*CELL+GAP+off, s=CELL-2*GAP;
          const hue=brickHue(Math.min(1,k.hp/denom)); k.hue=hue;
          const L=54+k.flash*24;
          // glow + body gradient
          ctx.shadowColor=`hsla(${hue},90%,60%,.55)`; ctx.shadowBlur=10+k.flash*12;
          const bg=ctx.createLinearGradient(0,y,0,y+s);
          bg.addColorStop(0,`hsl(${hue},85%,${L+10}%)`); bg.addColorStop(1,`hsl(${(hue+18)%360},80%,${L-12}%)`);
          ctx.fillStyle=bg; roundRect(ctx,x,y,s,s,9); ctx.fill();
          ctx.shadowBlur=0;
          // bevel: bottom shade + top gloss
          ctx.fillStyle="rgba(0,0,0,.18)"; roundRect(ctx,x,y+s-7,s,7,4); ctx.fill();
          ctx.fillStyle="rgba(255,255,255,.28)"; roundRect(ctx,x+5,y+4,s-10,s*0.28,6); ctx.fill();
          ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=1.2; roundRect(ctx,x+.6,y+.6,s-1.2,s-1.2,9); ctx.stroke();
          // damage bar for bricks that have taken hits
          if(k.max && k.hp<k.max){
            ctx.fillStyle="rgba(0,0,0,.28)"; ctx.fillRect(x+8,y+s-9,s-16,3);
            ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillRect(x+8,y+s-9,(s-16)*k.hp/k.max,3);
          }
          const size=k.hp<100?24:k.hp<1000?20:16;
          ctx.font=`800 ${size}px ${FONT}`;
          ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillText(k.hp, x+s/2+1, y+s/2+3);
          ctx.fillStyle="#fff"; ctx.fillText(k.hp, x+s/2, y+s/2+1);
        }

        // particles
        for(const p of particles){
          ctx.globalAlpha=Math.max(0,p.life/p.max);
          ctx.fillStyle=`hsl(${p.hue},90%,66%)`;
          roundRect(ctx,p.x-p.size/2, p.y-p.size/2, p.size, p.size, 2); ctx.fill();
        }
        ctx.globalAlpha=1;
        for(const p of pops){
          ctx.strokeStyle=`rgba(${p.color},${1-p.t})`; ctx.lineWidth=3;
          circle(p.x,p.y,12+p.t*22); ctx.stroke();
        }

        // aim line
        if(phase==="aim" && (aiming||kbAim) && aimAngle!==null){
          const p=aimPath(aimAngle), cx=Math.cos(aimAngle), cy=Math.sin(aimAngle);
          ctx.fillStyle="#cfefff"; ctx.shadowColor="rgba(140,220,255,.9)"; ctx.shadowBlur=6;
          for(let d=24; d<p.dist-6; d+=17){
            ctx.globalAlpha=1-(d/1100)*0.75;
            circle(launchX+cx*d, LAND_Y+cy*d, 3.2); ctx.fill();
          }
          ctx.shadowBlur=0;
          ctx.globalAlpha=0.55; ctx.strokeStyle=COL.ink; ctx.lineWidth=2;
          circle(p.x,p.y,R); ctx.stroke();
          ctx.globalAlpha=1;
        }

        // falling bonus balls + live balls
        // trails
        for(const b of balls){
          if(b.state!=="fly" || !b.tr) continue;
          for(let i=0;i<b.tr.length;i+=2){
            const t=(i/2+1)/(b.tr.length/2);
            ctx.fillStyle=`rgba(140,220,255,${0.28*t})`; circle(b.tr[i],b.tr[i+1],R*(0.45+0.5*t)); ctx.fill();
          }
        }
        const drawBall=(x,y)=>{
          const g=ctx.createRadialGradient(x-2.5,y-2.5,1,x,y,R);
          g.addColorStop(0,"#ffffff"); g.addColorStop(1,"#bfe8ff");
          ctx.fillStyle=g; circle(x,y,R); ctx.fill();
        };
        ctx.shadowColor="rgba(140,220,255,.95)"; ctx.shadowBlur=balls.length>60?0:10;
        for(const d of drops) drawBall(d.x,d.y);
        for(const b of balls) drawBall(b.x,b.y);
        ctx.shadowBlur=0;

        const waiting=phase==="aim" || phase==="advance" || (phase==="shoot" && toLaunch>0);
        if(waiting){
          const shown=phase==="shoot"?toLaunch:ballCount, bx=launchX;
          ctx.shadowColor="rgba(140,220,255,.95)"; ctx.shadowBlur=14;
          drawBall(bx,LAND_Y); ctx.shadowBlur=0;
          ctx.font=`600 16px ${FONT}`; ctx.fillStyle="rgba(245,239,255,.85)"; ctx.textBaseline="middle";
          if(bx>W-60){ ctx.textAlign="right"; ctx.fillText("x"+shown, bx-16, LAND_Y+1); }
          else { ctx.textAlign="left"; ctx.fillText("x"+shown, bx+16, LAND_Y+1); }
        }

        if(phase==="shoot" && gained>0){
          const gx=nextLaunchX!==null?nextLaunchX:launchX;
          ctx.font=`700 16px ${FONT}`; ctx.fillStyle=COL.green; ctx.textAlign="center";
          ctx.fillText("+"+gained, gx, LAND_Y-22);
        }

        if(round===1 && phase==="aim" && !aiming && !kbAim){
          ctx.font=`500 18px ${FONT}`; ctx.fillStyle="rgba(245,239,255,.55)"; ctx.textAlign="center";
          ctx.fillText("Drag to aim, release to fire", W/2, PLAY_H*0.62);
        }

        ctx.restore();

        // control strip
        pill(BTN_RECALL, "▼ RECALL", false, phase==="shoot");
        pill(BTN_FAST, "▲ FAST", fast || currentSpeed()>1, true);
        ctx.font=`600 18px ${FONT}`; ctx.fillStyle=COL.muted; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(ballCount===1?"1 ball":ballCount+" balls", W/2+13, PLAY_H+BAR_H/2+1);

        // game over card
        if(phase==="over" && overT>27){
          ctx.globalAlpha=Math.min(1,(overT-27)/12);
          ctx.fillStyle="rgba(9,6,15,.8)"; ctx.fillRect(0,0,W,H);
          ctx.textAlign="center"; ctx.textBaseline="middle";
          ctx.fillStyle=COL.coral; ctx.font='34px "Bungee", cursive';
          ctx.fillText("GAME OVER", W/2, PLAY_H*0.34);
          ctx.fillStyle=COL.ink; ctx.font=`700 116px ${FONT}`;
          ctx.fillText(round, W/2, PLAY_H*0.5);
          ctx.fillStyle=COL.muted; ctx.font=`500 19px ${MONO}`;
          ctx.fillText("BEST "+bestShown, W/2, PLAY_H*0.63);
          ctx.fillStyle=COL.amber;
          ctx.fillText("A / tap to play again", W/2, PLAY_H*0.72);
          ctx.globalAlpha=1;
        }

        ctx.restore();
      }

      function updateStatus(){
        const s = phase==="over"
          ? "Game over — A / tap to play again"
          : (ballCount===1?"1 ball":ballCount+" balls")+" · "+coins+(coins===1?" coin":" coins")+(currentSpeed()>1?" · fast":"");
        if(s!==statusTxt){ statusTxt=s; env.status(s); }
      }

      env.loop.fn=(dt)=>{
        acc+=dt;
        while(acc>=STEP){
          const n=currentSpeed();
          for(let i=0;i<n;i++) tick();
          effects();
          acc-=STEP;
        }
        draw();
        updateStatus();
      };

      reset(); env.loop.start();
      return {
        destroy(){
          canvas.style.cursor="";
          if(phase!=="over" && round>1) env.saveHi(round);
        }
      };
    }});

  /* ============================ SHELL ============================ */
  const grid = $("#grid"), filters = $("#filters");
  const cabinet = $("#cabinet"), cabName = $("#cabName"), cabScore = $("#cabScore"), cabHi = $("#cabHi");
  const hudScore = $("#hudScore"), hudStatus = $("#hudStatus"), cabHint = $("#cabHint");
  const play = $("#play"), pctx = play.getContext("2d");
  const cabClose = $("#cabClose"), cabRestart = $("#cabRestart");
  const cabSound = $("#cabSound"), cabPause = $("#cabPause"), veil = $("#veil"), qInput = $("#q");

  const ROWS = [
    {key:"all", label:"All "+GAMES.length},
    {key:"arcade", label:"Arcade Row"},
    {key:"puzzle", label:"Puzzle Row"},
    {key:"reflex", label:"Reflex Row"},
    {key:"classic", label:"Classics"}
  ];
  let activeFilter = "all";
  let query = "";

  ROWS.forEach(r=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=r.label;
    b.setAttribute("aria-pressed", r.key===activeFilter);
    b.onclick=()=>{ activeFilter=r.key; [...filters.children].forEach(c=>c.setAttribute("aria-pressed", c===b)); SFX.ui(); render(); };
    filters.appendChild(b);
  });

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function render(){
    grid.innerHTML="";
    const list = GAMES.filter(g=>{
      if(activeFilter!=="all" && g.tag!==activeFilter) return false;
      if(!query) return true;
      return (g.name+" "+g.desc+" "+g.tag).toLowerCase().includes(query);
    });
    if(!list.length){
      const p=document.createElement("p"); p.className="empty";
      p.textContent="No cabinet by that name. Try another row.";
      grid.appendChild(p);
      return;
    }
    list.forEach(g=>{
      const card=document.createElement("button");
      card.className="card";
      card.style.setProperty("--accent", TAGCOL[g.tag]);

      const thumb=document.createElement("div"); thumb.className="thumb";
      const ic=document.createElement("canvas"); ic.width=240; ic.height=150;
      const ictx=ic.getContext("2d");
      ictx.fillStyle=COL.bg; ictx.fillRect(0,0,240,150);
      ictx.save(); ictx.translate(45,0); icon(g.id, ictx, 150); ictx.restore();
      thumb.appendChild(ic);

      const hi = +localStorage.getItem("pa_"+g.id) || 0;
      if(hi){
        const b=document.createElement("span"); b.className="hi"; b.textContent="HI "+hi;
        thumb.appendChild(b);
      }
      if(g.isNew){
        const b=document.createElement("span"); b.className="new"; b.textContent="NEW";
        thumb.appendChild(b);
      }

      const meta=document.createElement("div"); meta.className="meta";
      meta.innerHTML=`<span class="lbl">${esc(g.tag)}</span><span class="name">${esc(g.name)}</span><span class="desc">${esc(g.desc)}</span>`;
      card.append(thumb,meta);
      card.onclick=()=>{ if(g.href){ SFX.ui(); location.href=g.href; return; } lastCard=card; SFX.wake(); SFX.ui(); openGame(g); };
      grid.appendChild(card);
    });
  }

  qInput.addEventListener("input",()=>{ query=qInput.value.trim().toLowerCase(); render(); });

  let current=null, lastCard=null;

  function openGame(def){
    closeGame();
    const LW = def.w||480, LH = def.h||480;
    const S = Math.min(2, Math.max(1, window.devicePixelRatio||1));
    play.width = Math.round(LW*S); play.height = Math.round(LH*S);
    play.style.width = LW+"px";
    play._lw = LW; play._lh = LH;
    pctx.setTransform(S,0,0,S,0,0);

    cabName.textContent = def.name;
    cabHint.textContent = def.hint||"";
    const key = "pa_"+def.id;
    const listeners=[];
    const loop = new Loop();
    let shake=0, lastScore=0, lastBlip=0;

    loop.pre = ()=>{
      pctx.setTransform(S,0,0,S,0,0);
      if(shake>0.4){ shake*=0.86; pctx.translate(rnd(-shake,shake), rnd(-shake,shake)); }
      else shake=0;
    };

    const env = {
      canvas:play, ctx:pctx, w:LW, h:LH, loop, sfx:SFX,
      on:(t,ty,fn,o)=>{ t.addEventListener(ty,fn,o); listeners.push([t,ty,fn,o]); },
      shake:v=>{ shake=Math.max(shake,v); },
      score:v=>{
        hudScore.textContent="Score "+v; cabScore.textContent=v;
        if(typeof v==="number" && !def.quietScore){
          if(v>lastScore){
            const now=performance.now();
            if(now-lastBlip>110){ lastBlip=now; SFX.blip(); }
          }
          lastScore=v;
        }
      },
      status:v=>{ hudStatus.textContent=v; },
      hi:()=>+localStorage.getItem(key)||0,
      saveHi:v=>{
        const prev=+localStorage.getItem(key)||0;
        if(v>prev){ localStorage.setItem(key, Math.round(v)); if(prev>0) SFX.fanfare(); }
        cabHi.textContent=(+localStorage.getItem(key)||0);
      },
      reset:()=>{}
    };
    cabHi.textContent = env.hi();
    cabScore.textContent = 0;
    const inst = def.mount(env) || {};
    current = { inst, loop, listeners, env, def };
    setPaused(false);
    cabinet.classList.add("open");
    cabClose.focus();
  }

  function closeGame(){
    if(!current)return;
    try{ current.inst.destroy && current.inst.destroy(); }catch(e){}
    current.loop.stop();
    current.listeners.forEach(([t,ty,fn,o])=>t.removeEventListener(ty,fn,o));
    pctx.setTransform(1,0,0,1,0,0);
    pctx.clearRect(0,0,play.width,play.height);
    current=null;
    setPaused(false);
    cabinet.classList.remove("open");
    if(lastCard){ try{ lastCard.focus(); }catch(e){} }
  }

  function setPaused(p){
    if(!current){ veil.classList.remove("on"); cabPause.classList.remove("on"); return; }
    current.loop.paused = p;
    current.loop.last = performance.now();
    veil.classList.toggle("on", p);
    cabPause.classList.toggle("on", p);
    cabPause.title = p ? "Resume (P)" : "Pause (P)";
  }

  function paintSoundBtn(){
    cabSound.classList.toggle("on", SFX.enabled());
    cabSound.textContent = SFX.enabled() ? "♪" : "✕";
    cabSound.title = SFX.enabled() ? "Sound on" : "Sound off";
  }
  paintSoundBtn();
  cabSound.onclick=()=>{ SFX.set(!SFX.enabled()); paintSoundBtn(); SFX.ui(); };
  cabPause.onclick=()=>{ if(current) setPaused(!current.loop.paused); };

  document.addEventListener("visibilitychange",()=>{ if(document.hidden && current) setPaused(true); });

  cabClose.onclick=closeGame;
  cabRestart.onclick=()=>{ if(current&&current.env.reset){ SFX.ui(); setPaused(false); current.env.reset(); } };
  cabinet.addEventListener("pointerdown",e=>{ if(e.target===cabinet)closeGame(); });
  window.addEventListener("keydown",e=>{
    if(!current) return;
    if(e.key==="Escape"){ closeGame(); return; }
    if(e.key.toLowerCase()==="p" && !e.repeat){ setPaused(!current.loop.paused); return; }
    if(e.key===" "||e.key.startsWith("Arrow")) e.preventDefault();
  }, {passive:false});

  // d-pad -> synthetic key events on window
  document.querySelectorAll(".dpad button").forEach(btn=>{
    const k=btn.dataset.k;
    const send=(type)=>window.dispatchEvent(new KeyboardEvent(type,{key:k,bubbles:true}));
    btn.addEventListener("pointerdown",e=>{ e.preventDefault(); send("keydown"); });
    btn.addEventListener("pointerup",e=>{ e.preventDefault(); send("keyup"); });
    btn.addEventListener("pointerleave",()=>send("keyup"));
    btn.addEventListener("pointercancel",()=>send("keyup"));
  });

  // swipe on the canvas -> arrow keys, for the grid games
  (function(){
    let sx=0, sy=0, live=false;
    play.addEventListener("pointerdown",e=>{
      live = !!(current && current.def.swipe);
      sx=e.clientX; sy=e.clientY;
    });
    play.addEventListener("pointerup",e=>{
      if(!live) return;
      live=false;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.hypot(dx,dy) < 28) return;
      const k = Math.abs(dx)>Math.abs(dy) ? (dx>0?"ArrowRight":"ArrowLeft")
                                          : (dy>0?"ArrowDown":"ArrowUp");
      window.dispatchEvent(new KeyboardEvent("keydown",{key:k}));
      setTimeout(()=>window.dispatchEvent(new KeyboardEvent("keyup",{key:k})),90);
    });
    play.addEventListener("pointercancel",()=>{ live=false; });
  })();

  render();
})();
</script>

</body>
</html>
