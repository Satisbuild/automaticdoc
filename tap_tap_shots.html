<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap Shots</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Zilla+Slab:wght@700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Zilla Slab', serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 800px;
            background-color: #363636;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
            background-color: #363636;
        }

        .screen.active {
            display: flex;
        }

        /* START SCREEN UI */
        #start-best {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .title-container {
            margin-top: 15vh;
            text-align: center;
        }
        
        .title-tap {
            color: #FFFF99;
            font-family: 'Russo One', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: -10px;
            margin-left: 60px;
        }
        
        .title-shots {
            color: white;
            font-family: 'Russo One', sans-serif;
            font-size: 4.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .title-ball-img {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #FF8800;
            border-radius: 50%;
            border: 3px solid white;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.6);
        }

        .tap-to-dunk {
            margin-top: 25vh;
            text-align: center;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .hand-icon {
            font-size: 2.5rem;
            margin-top: 10px;
            display: inline-block;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.1) translateY(-5px); }
        }

        /* GAME UI */
        #game-ui {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #game-ui.active {
            display: block;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            width: 100%;
        }

        .icon-btn {
            pointer-events: auto;
            cursor: pointer;
            width: 30px;
            height: 30px;
            fill: white;
        }

        .timer-container {
            width: 180px;
            height: 20px;
            background-color: #555;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #222;
            position: relative;
        }

        #timer-bar {
            height: 100%;
            width: 100%;
            background-color: #FFA500;
            border-radius: 8px;
            transition: width 0.1s linear, background-color 0.3s;
        }

        #current-score {
            text-align: center;
            color: white;
            font-size: 5rem;
            margin-top: 20px;
            text-shadow: 2px 2px 0 #222;
        }

        .back-link {
            position: absolute;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.35);
            color: white;
            font-family: 'Russo One', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            z-index: 20;
        }
        .back-link:hover { background: rgba(255,255,255,0.22); }

        /* GAMEOVER UI */
        #gameover-screen {
            background-color: #1a1a1a;
            justify-content: center;
        }

        .go-text {
            color: white;
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .go-score {
            color: white;
            font-size: 5rem;
            margin-bottom: 40px;
        }

        #restart-btn {
            background-color: white;
            border: none;
            border-radius: 20px;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 0 #ccc;
            margin-top: 30px;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        #restart-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #ccc;
        }

        #restart-btn svg {
            width: 50px;
            height: 50px;
            fill: #FF5555;
            stroke: #FF5555;
            stroke-width: 2;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            
            <div id="start-screen" class="screen active">
                <div class="top-bar">
                    <svg class="icon-btn" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <div id="start-best">BEST: 0</div>
                </div>
                <div class="title-container">
                    <div class="title-tap">TAP-TAP</div>
                    <div class="title-shots">SH<span style="color:transparent">O</span>TS
                        <div class="title-ball-img"></div>
                    </div>
                </div>
                <div class="tap-to-dunk">
                    TAP TO DUNK!<br>
                    <span class="hand-icon">👆</span> x2
                </div>
                <a class="back-link" href="GREJSALLEY.html">← GREJS ALLEY</a>
            </div>

            <div id="game-ui">
                <div class="top-bar">
                    <svg class="icon-btn" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <div class="timer-container">
                        <div id="timer-bar"></div>
                    </div>
                    <svg class="icon-btn" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </div>
                <div id="current-score">0</div>
            </div>

            <div id="gameover-screen" class="screen">
                <div class="go-text">SCORE</div>
                <div class="go-score" id="go-final-score">0</div>
                
                <div class="go-text">BEST</div>
                <div class="go-score" id="go-best-score">0</div>

                <button id="restart-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                </button>
                <a class="back-link" href="GREJSALLEY.html">← GREJS ALLEY</a>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game Constants
        const WIDTH = 480;
        const HEIGHT = 800;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        // States
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let bestScore = localStorage.getItem('tts_best') || 0;
        let timer = 100;
        const MAX_TIMER = 100;
        let hoopSide = 'right'; 
        let hasScored = false;
        let particles = []; // For ball trail

        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameUI = document.getElementById('game-ui');
        const gameOverScreen = document.getElementById('gameover-screen');
        const scoreDisplay = document.getElementById('current-score');
        const timerBar = document.getElementById('timer-bar');
        const startBestDisplay = document.getElementById('start-best');
        const goFinalScore = document.getElementById('go-final-score');
        const goBestScore = document.getElementById('go-best-score');

        startBestDisplay.innerText = `BEST: ${bestScore}`;

        // Matter.js Setup
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Events = Matter.Events,
              Body = Matter.Body;

        let engine = Engine.create();
        engine.gravity.y = 1.4; // Slightly heavier for snappier fall
        
        let world = engine.world;
        let runner = Runner.create();
        
        let ball;
        let hoopParts = [];
        let scoreSensor;
        let walls = [];

        function setupGame() {
            Engine.clear(engine);
            Composite.clear(world);
            particles = [];
            
            // Invisible boundaries (Walls)
            walls = [
                Bodies.rectangle(-25, HEIGHT/2, 50, HEIGHT * 2, { isStatic: true, restitution: 0.5 }), 
                Bodies.rectangle(WIDTH + 25, HEIGHT/2, 50, HEIGHT * 2, { isStatic: true, restitution: 0.5 }), 
                Bodies.rectangle(WIDTH/2, -800, WIDTH*2, 50, { isStatic: true, restitution: 0.5 }) 
            ];
            Composite.add(world, walls);

            hoopSide = 'right'; 
            createHoop(false); // don't spawn ball yet if starting
        }

        function createBall() {
            if (ball) Composite.remove(world, ball);
            
            ball = Bodies.circle(WIDTH / 2, HEIGHT / 2 + 150, 20, {
                restitution: 0.8, // Bouncy
                friction: 0.05,
                density: 0.005,
                label: 'ball'
            });
            Composite.add(world, ball);
        }

        function createHoop(isNext = false) {
            if (hoopParts.length > 0) {
                Composite.remove(world, hoopParts);
                hoopParts = [];
            }
            if (scoreSensor) {
                Composite.remove(world, scoreSensor);
            }

            hasScored = false;
            
            // Random height between 35% and 55% down the screen
            let hoopY = HEIGHT * 0.35 + Math.random() * (HEIGHT * 0.2);
            
            const boardW = 12;
            const boardH = 100;
            const rimRadius = 5;
            const hoopWidth = 65;
            
            let boardX, backRimX, frontRimX, sensorX;

            if (hoopSide === 'right') {
                boardX = WIDTH - boardW / 2;
                backRimX = WIDTH - boardW - rimRadius;
                frontRimX = backRimX - hoopWidth;
                sensorX = backRimX - hoopWidth / 2;
            } else {
                boardX = boardW / 2;
                backRimX = boardW + rimRadius;
                frontRimX = backRimX + hoopWidth;
                sensorX = backRimX + hoopWidth / 2;
            }

            let backboard = Bodies.rectangle(boardX, hoopY, boardW, boardH, { isStatic: true, restitution: 0.3, label: 'backboard' });
            // Add a pole below backboard purely for visual reference, but we won't add physics for it to prevent getting stuck easily
            let backRim = Bodies.circle(backRimX, hoopY + 25, rimRadius, { isStatic: true, restitution: 0.2, label: 'backRim' });
            let frontRim = Bodies.circle(frontRimX, hoopY + 25, rimRadius, { isStatic: true, restitution: 0.2, label: 'frontRim' });
            
            scoreSensor = Bodies.rectangle(sensorX, hoopY + 35, hoopWidth - 15, 10, {
                isStatic: true,
                isSensor: true,
                label: 'sensor'
            });

            hoopParts = [backboard, backRim, frontRim];
            Composite.add(world, [...hoopParts, scoreSensor]);
        }

        Events.on(engine, 'collisionStart', function(event) {
            let pairs = event.pairs;
            for (let i = 0; i < pairs.length; i++) {
                let pair = pairs[i];
                if ((pair.bodyA.label === 'ball' && pair.bodyB.label === 'sensor') || 
                    (pair.bodyB.label === 'ball' && pair.bodyA.label === 'sensor')) {
                    if (ball.velocity.y > 0 && !hasScored) {
                        scoreBasket();
                    }
                }
            }
        });

        function scoreBasket() {
            hasScored = true;
            score++;
            scoreDisplay.innerText = score;
            
            timer = MAX_TIMER;
            
            hoopSide = (hoopSide === 'right') ? 'left' : 'right';
            setTimeout(() => createHoop(true), 150); 
        }

        function jump() {
            if (gameState === 'START') {
                startGame();
                // Apply first jump
                Body.setVelocity(ball, { x: (hoopSide === 'right' ? 3 : -3), y: -10 });
                return;
            }
            if (gameState !== 'PLAYING') return;

            // Direction based on hoop side
            let pushX = (hoopSide === 'right') ? 3 : -3;
            
            // Anti-wall sticking
            if (ball.position.x < 60) pushX = 4;
            if (ball.position.x > WIDTH - 60) pushX = -4;

            Body.setVelocity(ball, { x: pushX, y: -11 });
            Body.setAngularVelocity(ball, (Math.random() - 0.5) * 0.4); 
        }

        window.addEventListener('mousedown', (e) => {
            if(e.target.closest('#restart-btn') || e.target.closest('.back-link')) return;
            jump();
        });
        window.addEventListener('touchstart', (e) => {
            if(e.target.closest('#restart-btn') || e.target.closest('.icon-btn') || e.target.closest('.back-link')) return;
            e.preventDefault(); 
            jump(); 
        }, {passive: false});

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            timer = MAX_TIMER;
            scoreDisplay.innerText = score;
            
            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            gameUI.classList.add('active');
            
            setupGame();
            createBall();
            Runner.run(runner, engine);
        }

        function triggerGameOver() {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';
            Runner.stop(runner);
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('tts_best', bestScore);
            }
            
            goFinalScore.innerText = score;
            goBestScore.innerText = bestScore;
            
            gameUI.classList.remove('active');
            gameOverScreen.classList.add('active');
        }

        document.getElementById('restart-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
            // Start with an immediate jump
            Body.setVelocity(ball, { x: (hoopSide === 'right' ? 3 : -3), y: -10 });
        });

        function draw() {
            requestAnimationFrame(draw);
            
            // Clear
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            if (gameState === 'PLAYING') {
                // Update Timer
                timer -= 0.35; // depletion speed
                if (timer <= 0) triggerGameOver();
                if (ball.position.y > HEIGHT + 50) triggerGameOver();

                // UI Update
                let pct = (timer / MAX_TIMER) * 100;
                if(pct < 0) pct = 0;
                timerBar.style.width = `${pct}%`;
                if(pct < 25) {
                    timerBar.style.backgroundColor = '#FF3333';
                } else {
                    timerBar.style.backgroundColor = '#FFA500';
                }

                // Update Trail Particles
                if (ball && (Math.abs(ball.velocity.x) > 1 || Math.abs(ball.velocity.y) > 1)) {
                    // Only add particle occasionally to create dotted line
                    if(Math.random() > 0.5) {
                        particles.push({x: ball.position.x, y: ball.position.y, a: 1});
                    }
                }
            }

            drawHoop();
            if (gameState !== 'START') {
                drawTrail();
                drawBall();
            }
        }

        function drawTrail() {
            ctx.fillStyle = 'rgba(150, 150, 150, 1)';
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.a -= 0.04;
                if(p.a <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.a;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        function drawBall() {
            if (!ball) return;
            ctx.save();
            ctx.translate(ball.position.x, ball.position.y);
            ctx.rotate(ball.angle);

            let r = ball.circleRadius;

            // Orange base
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = '#FF7B00';
            ctx.fill();
            
            // Inner shadow for depth
            let gradient = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.1, 0, 0, r);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
            ctx.fillStyle = gradient;
            ctx.fill();

            // Black Lines
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1.5;
            
            // Horizontal line
            ctx.beginPath();
            ctx.moveTo(-r, 0);
            ctx.lineTo(r, 0);
            ctx.stroke();

            // Vertical line
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(0, r);
            ctx.stroke();

            // Curved lines (arcs)
            ctx.beginPath();
            ctx.arc(r*1.1, 0, r*0.9, Math.PI*0.6, Math.PI*1.4);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(-r*1.1, 0, r*0.9, -Math.PI*0.4, Math.PI*0.4);
            ctx.stroke();

            ctx.restore();
        }

        function drawHoop() {
            if (hoopParts.length === 0) return;
            
            const backboard = hoopParts[0];
            const backRim = hoopParts[1];
            const frontRim = hoopParts[2];
            
            let bw = backboard.bounds.max.x - backboard.bounds.min.x;
            let bh = backboard.bounds.max.y - backboard.bounds.min.y;
            let bx = backboard.position.x - bw/2;
            let by = backboard.position.y - bh/2;

            // Draw Pole
            ctx.fillStyle = '#C88141'; // Brown
            let poleWidth = 20;
            let poleHeight = 150;
            let poleX = hoopSide === 'right' ? bx + bw : bx - poleWidth;
            let poleY = by + 20;
            ctx.fillRect(poleX, poleY, poleWidth, poleHeight);
            
            // Shadow on pole
            ctx.fillStyle = '#965A28';
            ctx.fillRect(hoopSide === 'right' ? poleX : poleX + poleWidth - 5, poleY, 5, poleHeight);

            // Back Support
            ctx.fillStyle = '#C88141';
            ctx.fillRect(hoopSide === 'right' ? bx + bw : poleX, by + bh - 20, 15, 10);

            // Draw Net
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            let rx1 = backRim.position.x;
            let rx2 = frontRim.position.x;
            let ry = backRim.position.y;
            
            let netHeight = 45;
            let segments = 5;
            let taper = 10;
            
            let startX1 = rx1 < rx2 ? rx1 : rx2;
            let startX2 = rx1 > rx2 ? rx1 : rx2;

            for(let i = 0; i <= segments; i++) {
                let frac = i / segments;
                let topX = startX1 + (startX2 - startX1) * frac;
                let botX = startX1 + taper + ((startX2 - startX1) - taper*2) * frac;
                
                // Vertical zig zags
                ctx.moveTo(topX, ry);
                ctx.lineTo(botX, ry + netHeight);
                
                // Horizontal crosses
                if (i < 3) {
                    let yLevel = ry + (netHeight * 0.33 * (i+1));
                    ctx.moveTo(startX1 + (taper * 0.33 * (i+1)), yLevel);
                    ctx.lineTo(startX2 - (taper * 0.33 * (i+1)), yLevel);
                }
            }
            ctx.stroke();

            // Draw Backboard
            ctx.fillStyle = '#FFF';
            ctx.fillRect(bx, by, bw, bh);
            ctx.fillStyle = '#CCC'; // Bottom shadow
            ctx.fillRect(bx, by + bh - 10, bw, 10);
            
            // Backboard target square (if facing left or right)
            ctx.fillStyle = '#DDD';
            if(hoopSide === 'right') {
                ctx.fillRect(bx - 5, by + bh/2 - 15, 5, 30);
            } else {
                ctx.fillRect(bx + bw, by + bh/2 - 15, 5, 30);
            }

            // Draw Rims (Blue)
            ctx.fillStyle = '#00A2FF';
            ctx.beginPath();
            ctx.arc(backRim.position.x, backRim.position.y, backRim.circleRadius + 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(frontRim.position.x, frontRim.position.y, frontRim.circleRadius + 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Connector between rims
            ctx.strokeStyle = '#00A2FF';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(backRim.position.x, backRim.position.y);
            ctx.lineTo(frontRim.position.x, frontRim.position.y);
            ctx.stroke();
        }

        // Init
        setupGame();
        draw();

    </script>
</body>
</html>
