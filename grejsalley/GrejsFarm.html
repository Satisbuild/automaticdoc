<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5aa83a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Grejs Farm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M4 20L24 6l20 14v22H4z' fill='%23c8402a' stroke='%235a140a' stroke-width='2.4'/%3E%3Crect x='14' y='24' width='20' height='18' fill='%237a2a1a' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M14 24l20 18M34 24L14 42' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff6e2;--cream2:#f6e6c4;--wood:#8a5226;--wood2:#6a3a16;--wood3:#b8743a;--ink:#4a2a10;--green:#5cc23a;--green2:#3a9a22;--green3:#2a7a12;--yellow:#ffd23f;--yellow2:#f0a20e;--blue:#45b4f0;--blue2:#1f7ad0;--red:#ef5b4b;--red2:#c03224;--grey:#b8b0a4;--shadow:0 4px 0 rgba(60,30,10,.35),0 8px 18px rgba(40,20,0,.25);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3f6a2a;font-family:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#game{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;inset:0;display:block;touch-action:none;cursor:grab}
.ii{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.svgi{display:inline-block;width:1em;height:1em;line-height:0}.svgi svg{width:100%;height:100%}
/* ---------- HUD ---------- */
#hud-top{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:10}
#hud-top>*{pointer-events:auto}
.lvlbox{display:flex;align-items:center;flex:1 1 auto;min-width:0;max-width:280px;position:relative;cursor:pointer}
.lvlstar{position:relative;z-index:2;width:54px;height:54px;flex:none;filter:drop-shadow(0 3px 0 rgba(80,40,0,.45)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.lvlstar svg{position:absolute;inset:0;width:100%;height:100%}
.lvlstar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#fff;-webkit-text-stroke:4px #8a4a06;paint-order:stroke fill;padding-top:3px}
.xpbar{flex:1;margin-left:-14px;height:26px;border-radius:0 14px 14px 0;background:linear-gradient(#3a2210,#5a3418);border:3px solid #fff3d8;box-shadow:0 3px 0 rgba(60,30,10,.4),inset 0 2px 4px rgba(0,0,0,.5);position:relative;overflow:hidden;min-width:70px}
.xpbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#a8f070,#5cc23a 55%,#3a9a22);border-radius:0 10px 10px 0;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.xpbar i:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px);animation:stripe 1.2s linear infinite}
.xpbar i:before{content:'';position:absolute;left:4px;right:4px;top:2px;height:5px;border-radius:4px;background:rgba(255,255,255,.45)}
@keyframes stripe{to{background-position:24px 0}}
.xpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000,0 0 3px rgba(0,0,0,.6);padding-left:12px;white-space:nowrap}
.cur{display:flex;align-items:center;height:34px;border-radius:17px;background:linear-gradient(#5a3418,#3a2210);border:3px solid #fff3d8;box-shadow:0 3px 0 rgba(60,30,10,.4);padding:0 10px 0 4px;margin-top:10px;position:relative;cursor:pointer;min-width:84px}
.cur .svgi{font-size:34px;margin:-6px 4px 0 -16px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.cur span{font-weight:700;font-size:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.cur .plus{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;background:linear-gradient(#8ae860,#3a9a22);border:2px solid #fff;color:#fff;font-size:15px;line-height:15px;text-align:center;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pulse{animation:pulse .35s ease}
@keyframes pulse{40%{transform:scale(1.18)}}
/* side buttons */
#side{position:absolute;right:8px;top:calc(var(--sat) + 70px);display:flex;flex-direction:column;gap:10px;z-index:9}
#sideL{position:absolute;left:8px;top:calc(var(--sat) + 74px);display:flex;flex-direction:column;gap:10px;z-index:9}
.rbtn{width:52px;height:52px;border-radius:50%;border:3px solid #fff3d8;background:radial-gradient(circle at 35% 30%,#fff8e8,#f2d8a8 60%,#d8a868);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:0}
.rbtn .svgi{font-size:32px}
.rbtn:active{transform:translateY(2px) scale(.96)}
.badge{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:linear-gradient(#ff7a6a,#d8301e);border:2px solid #fff;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.3);animation:bob 1.6s ease-in-out infinite}
.badge:empty,.badge[data-n="0"]{display:none}
@keyframes bob{50%{transform:translateY(-3px)}}
/* bottom nav */
#nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 8px);display:flex;gap:4px;padding:6px 8px 8px;border-radius:24px;background:linear-gradient(#b8743a,#8a5226 40%,#6a3a16);border:3px solid #ffe8b8;box-shadow:0 5px 0 #4a2408,0 10px 22px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.3);z-index:10;max-width:calc(100% - 12px)}
#nav:before{content:'';position:absolute;inset:4px;border-radius:18px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 22px);pointer-events:none}
.nb{position:relative;width:58px;height:62px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;padding:0 0 2px;border-radius:14px}
.nb .ic{width:46px;height:44px;border-radius:14px;background:radial-gradient(circle at 40% 30%,#fffaf0,#f8e2b8 65%,#e8c088);border:2px solid #fff2d0;box-shadow:0 3px 0 rgba(60,25,0,.5),inset 0 -3px 0 rgba(160,100,40,.25);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.nb .ic .svgi{font-size:34px}
.nb em{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);margin-top:2px;letter-spacing:.2px}
.nb:active .ic{transform:translateY(2px) scale(.94)}
.nb .badge{top:-4px;right:2px}
@media (max-width:380px){.nb{width:52px}.nb .ic{width:42px;height:40px}.nb .ic .svgi{font-size:30px}}
/* placement bar */
#placebar{position:absolute;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);display:none;gap:16px;z-index:12;align-items:center}
#placebar.on{display:flex}
#placebar .lab{background:rgba(40,25,10,.8);color:#fff;padding:6px 12px;border-radius:14px;font-weight:600;font-size:14px;white-space:nowrap}
/* mode banner */
#banner{position:absolute;left:50%;top:calc(var(--sat) + 74px);transform:translateX(-50%);z-index:11;display:none;align-items:center;gap:8px;background:linear-gradient(#fff8e8,#f6e2b8);border:3px solid #fff;border-radius:22px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);font-weight:600;font-size:14px;max-width:calc(100% - 140px)}
#banner.on{display:flex}#banner img{width:30px;height:30px}
/* buttons */
.btn{border:none;cursor:pointer;font-weight:700;font-size:16px;color:#fff;padding:10px 18px;border-radius:14px;position:relative;text-shadow:0 1.5px 0 rgba(0,0,0,.35);background:linear-gradient(#8ae860,var(--green) 45%,var(--green2));box-shadow:0 4px 0 var(--green3),0 6px 10px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.45);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;white-space:nowrap;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green3),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.y{background:linear-gradient(#ffe88a,var(--yellow) 45%,var(--yellow2));box-shadow:0 4px 0 #b86a00,0 6px 10px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.5);color:#6a3a00;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.b{background:linear-gradient(#9ad8ff,var(--blue) 45%,var(--blue2));box-shadow:0 4px 0 #0f4a90,0 6px 10px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.r{background:linear-gradient(#ffa090,var(--red) 45%,var(--red2));box-shadow:0 4px 0 #8a1a0a,0 6px 10px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.g{background:linear-gradient(#e8e0d4,#c8bcac 45%,#a89a88);box-shadow:0 4px 0 #6a5e50,0 6px 10px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.45);color:#fff}
.btn[disabled]{filter:grayscale(.8) brightness(.95);opacity:.7;pointer-events:none}
.btn.sm{font-size:13.5px;padding:6px 10px;min-height:34px;border-radius:11px}
.btn.round{width:58px;height:58px;border-radius:50%;padding:0}
.btn .svgi{font-size:1.3em}
.btn.round .svgi{font-size:28px}
.xbtn{position:absolute;right:-6px;top:-6px;width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:linear-gradient(#ff8a7a,#e8432f 50%,#b02a1a);box-shadow:0 3px 0 #7a1a0a,0 5px 10px rgba(0,0,0,.3);cursor:pointer;padding:9px;z-index:3}
.xbtn:active{transform:translateY(2px)}
/* sheets */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.sheet{pointer-events:auto;width:100%;max-width:640px;max-height:min(78vh,720px);display:flex;flex-direction:column;background:linear-gradient(var(--cream),var(--cream2));border:4px solid #fff3d8;border-bottom:none;border-radius:28px 28px 0 0;box-shadow:0 -6px 0 rgba(120,70,20,.25),0 -10px 30px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);position:relative;padding-bottom:var(--sab)}
.sheet.open{transform:translateY(0)}
.sheet:before{content:'';position:absolute;inset:6px 6px 0;border-radius:22px 22px 0 0;border:2px dashed rgba(184,116,58,.35);border-bottom:none;pointer-events:none}
.shead{position:relative;display:flex;align-items:center;justify-content:center;padding:10px 54px 4px;min-height:58px}
.ribbon{position:relative;background:linear-gradient(#ff8a5a,#e8532f 55%,#c03a1e);color:#fff;font-weight:700;font-size:20px;padding:8px 26px;border-radius:10px;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 4px 0 #8a2a10,0 6px 12px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35);margin-top:-30px;letter-spacing:.5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ribbon:before,.ribbon:after{content:'';position:absolute;top:10px;width:18px;height:100%;background:#a83218;z-index:-1}
.ribbon:before{left:-12px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.ribbon:after{right:-12px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.shead .xbtn{right:10px;top:8px}
.tabs{display:flex;gap:6px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;cursor:pointer;padding:8px 14px;border-radius:14px;font-weight:700;font-size:14px;color:#8a5226;background:linear-gradient(#fff,#f2e0bc);box-shadow:0 3px 0 #d8b47a;display:flex;align-items:center;gap:6px}
.tab.on{background:linear-gradient(#ffd26a,#f7a21e);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:0 3px 0 #b86a00}
.tab img{width:22px;height:22px}
.sbody{overflow-y:auto;overflow-x:hidden;padding:4px 12px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1}
.sbody::-webkit-scrollbar{width:6px}.sbody::-webkit-scrollbar-thumb{background:#d8b47a;border-radius:3px}
.sfoot{padding:8px 12px 12px;display:flex;gap:8px;justify-content:center;flex:none;border-top:2px dashed rgba(184,116,58,.3)}
.sec{font-weight:700;color:#8a5226;font-size:14px;margin:10px 4px 6px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.6px}
.sec:after{content:'';flex:1;height:2px;background:linear-gradient(90deg,#e8c890,transparent)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g2{grid-template-columns:repeat(2,1fr)}
.card{position:relative;background:linear-gradient(#fffdf6,#fbeed4);border:2px solid #fff;border-radius:16px;box-shadow:0 3px 0 #e2c48e,0 4px 10px rgba(120,70,20,.15);padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.97)}
.card.locked{filter:grayscale(.85);opacity:.72}
.card.dim{opacity:.6}
.card .pic{width:72px;height:72px;display:flex;align-items:center;justify-content:center}
.card .pic.big{width:96px;height:96px}
.card .nm{font-weight:700;font-size:13.5px;line-height:1.1}
.card .meta{font-size:12px;color:#8a6a4a;display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap}
.card .lock{position:absolute;top:6px;right:6px;background:#6a4a2a;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px;display:flex;align-items:center;gap:3px}
.card .lock .svgi{font-size:15px}
.price{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13.5px}
.price .svgi{font-size:17px}
.ing{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.ing .i{display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:700;width:32px}
.ing .i img{width:26px;height:26px}
.ing .i.no{color:#d8301e}.ing .i.ok{color:#3a8a1e}
.cnt{position:absolute;right:4px;bottom:2px;font-weight:700;font-size:13px;color:#fff;-webkit-text-stroke:3px #5a3418;paint-order:stroke fill}
.tile{position:relative;width:64px;height:64px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#fffdf6,#f4e2bc);border:2px solid #fff;box-shadow:0 2px 0 #e0c088;padding:6px;cursor:pointer}
.tile.sel{box-shadow:0 0 0 3px #5cc23a,0 2px 0 #e0c088}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
/* bars */
.bar{height:16px;border-radius:9px;background:#5a3418;border:2px solid #fff;box-shadow:inset 0 2px 3px rgba(0,0,0,.4);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#a8f070,#5cc23a 55%,#3a9a22);border-radius:7px}
.bar.full i{background:linear-gradient(#ffb0a0,#ef5b4b 55%,#c03224)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 1px #000}
/* production queue */
.queue{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.qs{flex:none;width:76px;height:92px;border-radius:16px;background:linear-gradient(#fffaf0,#f2deb8);border:2px solid #fff;box-shadow:0 3px 0 #dcbc84;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;cursor:pointer;font-size:11.5px;font-weight:700}
.qs img{width:48px;height:48px}
.qs.empty{background:rgba(255,255,255,.35);border:2px dashed #d8b47a;box-shadow:none}
.qs.ready{background:linear-gradient(#e8ffd8,#b8f098);animation:bob 1.2s ease-in-out infinite}
.qs.ready:after{content:'✓';position:absolute;top:2px;right:6px;color:#2a8a12;font-size:16px}
.qs.wait img{opacity:.55}
.qs.lockd{background:rgba(255,255,255,.25);border:2px dashed #c8a878;box-shadow:none;color:#8a6a4a}
.qs .t{margin-top:2px;color:#6a4a2a}
.qs .pb{position:absolute;left:6px;right:6px;bottom:5px;height:7px;border-radius:4px;background:#d8c098;overflow:hidden}
.qs .pb i{position:absolute;left:0;top:0;bottom:0;background:#5cc23a}
.qs .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#e8432f;color:#fff;border:2px solid #fff;font-size:13px;line-height:17px;text-align:center}
/* list rows */
.row{display:flex;align-items:center;gap:10px;background:linear-gradient(#fffdf6,#fbeed4);border:2px solid #fff;border-radius:16px;box-shadow:0 3px 0 #e2c48e;padding:10px;margin-bottom:10px}
.row .pic{width:52px;height:52px;flex:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:14.5px}
.row .txt small{color:#8a6a4a;font-size:12.5px}
.row.done{background:linear-gradient(#f0ffe4,#d8f4c0)}
/* orders */
.ocard{position:relative;background:linear-gradient(#fffdf6,#fbeed4);border:2px solid #fff;border-radius:16px;box-shadow:0 3px 0 #e2c48e;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px}
.ocard.can{background:linear-gradient(#f2ffe8,#d4f4b8);box-shadow:0 3px 0 #9ad070}
.ocard .its{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.ocard .its .i{width:40px;text-align:center;font-size:12px;font-weight:700}
.ocard .its .i img{width:34px;height:34px}
.ocard .rw{display:flex;gap:8px;font-weight:700;font-size:13px}
.ocard .tr{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:none;background:#e8d8b8;cursor:pointer;padding:4px;color:#8a5226;font-size:14px;line-height:1}
.ocard .pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a8a,#d8301e);box-shadow:0 2px 2px rgba(0,0,0,.3)}
/* modal */
#modals{position:absolute;inset:0;z-index:40;pointer-events:none}
.mwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,20,8,.45);pointer-events:auto;animation:fadein .2s;padding:16px}
@keyframes fadein{from{opacity:0}}
.modal{position:relative;width:100%;max-width:400px;max-height:calc(100% - 40px);overflow-y:auto;background:linear-gradient(var(--cream),var(--cream2));border:4px solid #fff3d8;border-radius:26px;box-shadow:0 8px 0 rgba(120,70,20,.35),0 14px 36px rgba(0,0,0,.4);padding:62px 16px 16px;text-align:center;animation:popin .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.modal .ribbon{position:absolute;left:50%;top:10px;transform:translateX(-50%);margin:0;font-size:18px;padding:7px 22px}
.modal p{margin:8px 0;font-size:15px;line-height:1.35}
.modal .btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.modal .xbtn{right:-4px;top:-4px}
.mpic{width:110px;height:110px;margin:0 auto}
/* level up */
.lvlup .burst{position:relative;width:170px;height:170px;margin:-6px auto 0}
.lvlup .burst .rays{position:absolute;inset:-40px;background:repeating-conic-gradient(rgba(255,210,60,.55) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.lvlup .burst .star{position:absolute;inset:14px;animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
.lvlup .burst .star svg{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(140,70,0,.4))}
.lvlup .burst b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:#fff;-webkit-text-stroke:7px #a85a06;paint-order:stroke fill;padding-top:10px}

/* ---------- VALUE / XP RESOLUTION ---------- */
(function resolveValues() {
  const memo = {};
  function val(id, depth = 0) {
    if (memo[id] != null) return memo[id];
    const it = ITEMS[id];
    if (!it) { console.warn('Missing item', id); return 10; }
    if (it.cat === 'crop' || it.cat === 'fruit' || it.cat === 'material') return memo[id] = it.value;
    const an = ANIMALS.find(a => a.product === id);
    if (an) { const fv = val(an.feed, depth + 1); const v = Math.round(fv + an.time / 60 * .3 + 5); it.xp = Math.max(1, Math.round(v * .14 + an.time / 60 * .12)); return memo[id] = it.value = v; }
    const r = RECIPES[id];
    if (r) {
      let s = 0; for (const k in r.ing) s += val(k, depth + 1) * r.ing[k];
      const m = r.time / 60;
      const v = Math.max(2, Math.round((s + m * .6 + 3) * 1.12 / r.out));
      it.value = v;
      it.xp = it.cat === 'feed' ? Math.max(1, Math.round(m / 10)) : Math.max(1, Math.round(v * .15 + m * .2));
      return memo[id] = v;
    }
    return memo[id] = it.value || 10;
  }
  Object.keys(ITEMS).forEach(id => val(id));
})();

function maxFields(L) { return Math.min(160, 6 + Math.floor(L * 1.6)); }
function fieldPrice(owned) { return niceRound(5 + 1.6 * Math.pow(Math.max(0, owned - 5), 1.55) + owned * 4); }
function maxTrees(L) { return L < 8 ? 0 : Math.min(60, 2 + Math.floor((L - 8) * .7)); }
function maxPens(a, L) { return L < a.level ? 0 : 1 + (L >= a.level + 18 ? 1 : 0) + (L >= a.level + 40 ? 1 : 0); }

function orderSlots(L) { return L >= 18 ? 9 : L >= 14 ? 8 : L >= 10 ? 7 : L >= 7 ? 6 : L >= 5 ? 5 : L >= 3 ? 4 : 3; }
function shopSlotsFree(L) { return L >= 20 ? 7 : L >= 12 ? 6 : L >= 6 ? 5 : 4; }

/* ---------- LEVEL CURVE ---------- */
const XP_ANCHORS = [[1, 100], [2, 150], [3, 220], [4, 320], [5, 450], [6, 600], [7, 800], [8, 1050], [9, 1350], [10, 1700], [12, 2700], [15, 4800], [20, 10500], [25, 19000], [30, 31000], [35, 50000], [40, 80000], [45, 112000], [50, 152000], [60, 245000], [70, 355000], [80, 485000], [90, 645000], [100, 860000]];
const XP_TABLE = [];
(function () {
  for (let L = 1; L <= MAX_LEVEL; L++) {
    let v;
    if (L >= 100) v = 860000 * Math.pow(1.045, L - 100);
    else {
      let a = XP_ANCHORS[0], b = XP_ANCHORS[XP_ANCHORS.length - 1];
      for (let i = 0; i < XP_ANCHORS.length - 1; i++) if (L >= XP_ANCHORS[i][0] && L <= XP_ANCHORS[i + 1][0]) { a = XP_ANCHORS[i]; b = XP_ANCHORS[i + 1]; break; }
      const t = (L - a[0]) / Math.max(1, (b[0] - a[0]));
      v = Math.exp(lerp(Math.log(a[1]), Math.log(b[1]), t));
    }
    XP_TABLE[L] = niceRound(v);
  }
})();
function xpForLevel(L) { return XP_TABLE[Math.min(L, MAX_LEVEL)] || 1e9; }
function levelReward(L) { return { coins: niceRound(30 + L * L * 6 + L * 20), gems: L % 10 === 0 ? 10 : L % 5 === 0 ? 5 : 2 }; }

const PLOTS = [];
(function () {
  const sx = 3.5, sy = 4;
  const list = [];
  for (let r = 0; r < PLOT_ROWS; r++) for (let c = 0; c < PLOT_COLS; c++) {
    const key = c + ',' + r;
    if (START_PLOTS.includes(key)) continue;
    list.push({ key, c, r, d: Math.hypot(c - sx, (r - sy) * 1.1) + (key === '5,2' ? -1.2 : 0) });
  }
  list.sort((a, b) => a.d - b.d);
  list.forEach((p, i) => {
    p.idx = i;
    p.price = niceRound(500 * Math.pow(i + 1, 1.85));
    p.level = Math.min(95, 3 + Math.round(i * 2.15));
    p.mats = i < 3 ? 0 : 1 + Math.floor((i - 3) / 3);
    p.xp = niceRound(20 + p.price / 40);
    PLOTS.push(p);
  });
})();

/* ============ GAME STATE + LOGIC ============ */
const G = {
  S: null, grid: null, wild: [], tutSpeed: false,
  /* ---------- state ---------- */
  newState() {
    const t = now();
    const S = {
      saveVersion: SAVE_VERSION, created: t, lastSeen: t, level: 1, xp: 0, coins: 150, gems: 15,
      inv: { wheat: 8, corn: 4, feed_chicken: 6 }, siloCap: 50, barnCap: 50, siloLvl: 0, barnLvl: 0,
      objs: [], nextId: 1, plots: {}, orders: [], shop: { slots: [], bought: 0 }, quests: [],
      ach: {}, stats: {}, daily: { last: 0, day: 0, streak: 0 }, visitors: [], nextVisitorAt: t + 240000,
      settings: { music: true, sound: true, vib: true, gfx: 'high' }, tut: { step: 0, done: false }, truckBack: 0,
      cam: null, nextQuestAt: 0, newAch: 0, dayOff: t - DAY_LEN * .26,
    };

    this.S = S;

    add('bld', 'house', 19, 23); add('bld', 'barn', 26, 23); add('bld', 'silo', 24, 24);
    add('bld', 'bakery', 19, 28, { queue: [], slots: QUEUE_START });
    add('pen', 'coop', 25, 28, { animals: [{ readyAt: null }, { readyAt: null }, { readyAt: null }] });
    for (let i = 0; i < 6; i++) add('field', 'field', 19 + (i % 3) * 2, 33 + Math.floor(i / 3) * 2, { crop: null });
    add('bld', 'shop', 19, 38); add('bld', 'board', 27, 38);
    add('deco', 'flowers_red', 23, 23); add('deco', 'bush_round', 18, 22); add('deco', 'bush_round', 29, 27); add('deco', 'mailbox', 23, 27);
    add('deco', 'fence_wood', 29, 32); add('deco', 'fence_wood', 29, 33); add('deco', 'fence_wood', 29, 34);
    for (let i = 0; i < 4; i++) S.shop.slots.push(null);
    for (let i = 0; i < orderSlots(1); i++) S.orders.push(null);
    return S;
  },
  load() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { }
    if (raw) { try { const S = JSON.parse(raw); this.S = this.migrate(S); return true; } catch (e) { console.warn('save corrupt', e); } }
    this.newState(); return false;
  },
  migrate(S) {
    if (!S.saveVersion) S.saveVersion = 1;
    // future migrations go here: if (S.saveVersion < 2) {...; S.saveVersion = 2;}
    const d = this.newStateDefaults();
    for (const k in d) if (S[k] === undefined) S[k] = d[k];
    S.settings = Object.assign({ music: true, sound: true, vib: true, gfx: 'high' }, S.settings);
    S.objs.forEach(o => { if (o.t === 'bld' && BUILDINGS[o.k] && BUILDINGS[o.k].recipes && !o.queue) { o.queue = []; o.slots = QUEUE_START; } });
    return S;
  },
  newStateDefaults() { return { stats: {}, ach: {}, quests: [], visitors: [], daily: { last: 0, day: 0, streak: 0 }, nextVisitorAt: now() + 300000, truckBack: 0, newAch: 0, nextQuestAt: 0 }; },
  save() {
    if (!this.S || this._noSave) return;
    this.S.lastSeen = now();
    if (typeof W !== 'undefined' && W.cam) this.S.cam = { x: W.cam.x, y: W.cam.y, z: W.cam.z };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.S)); } catch (e) { console.warn('save failed', e); }
  },
  _saveT: 0,
  saveSoon() { clearTimeout(this._saveT); this._saveT = setTimeout(() => this.save(), 800); },
  exportSave() { this.save(); return JSON.stringify(this.S, null, 1); },
  importSave(txt) {
    const S = JSON.parse(txt);
    if (!S || typeof S !== 'object' || !Array.isArray(S.objs) || typeof S.level !== 'number') throw new Error('Ugyldig gemt fil');
    localStorage.setItem(SAVE_KEY, JSON.stringify(this.migrate(S)));
  },
  reset() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } },

  /* ---------- grid / placement ---------- */
  rebuildGrid() {
    const g = this.grid = new Int32Array(MAP_W * MAP_H);
    for (const o of this.S.objs) { const [w, h] = this.sizeOf(o); for (let y = o.y; y < o.y + h; y++) for (let x = o.x; x < o.x + w; x++) if (x >= 0 && y >= 0 && x < MAP_W && y < MAP_H) g[y * MAP_W + x] = o.id; }
    this._objMap = new Map(this.S.objs.map(o => [o.id, o]));
  },
  obj(id) { return this._objMap && this._objMap.get(id); },
  sizeOf(o) { if (o.t === 'field') return [2, 2]; if (o.t === 'tree') return [1, 1]; if (o.t === 'deco') { const s = DECO[o.k].size; return [s, s]; } return BUILDINGS[o.k].size; },
  sizeOfDef(t, k) { if (t === 'field') return [2, 2]; if (t === 'tree') return [1, 1]; if (t === 'deco') { const s = DECO[k].size; return [s, s]; } return BUILDINGS[k].size; },
  plotOf(x, y) { if (y < PLOT_Y0 || y >= PLOT_Y0 + PLOT_ROWS * PLOT) return null; return Math.floor(x / PLOT) + ',' + Math.floor((y - PLOT_Y0) / PLOT); },
  tileFree(x, y, ignore) {
    if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return false;
    const p = this.plotOf(x, y); if (!p || !this.S.plots[p]) return false;
    if (isWaterTile(x, y)) return false;
    const id = this.grid[y * MAP_W + x]; return !id || id === ignore;
  },
  canPlace(t, k, x, y, ignore) {
    const [w, h] = this.sizeOfDef(t, k);
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (!this.tileFree(xx, yy, ignore)) return false;
    if (t === 'bld' && BUILDINGS[k].nearWater) { let ok = false; for (let yy = y - 1; yy <= y + h && !ok; yy++) for (let xx = x - 1; xx <= x + w; xx++) if (isWaterTile(xx, yy)) { ok = true; break; } if (!ok) return 'water'; }
    return true;
  },
  findSpot(t, k, nearX, nearY) {
    const [w, h] = this.sizeOfDef(t, k); let best = null, bd = 1e9;
    for (let y = PLOT_Y0; y < PLOT_Y0 + PLOT_ROWS * PLOT; y++) for (let x = 0; x < MAP_W; x++) { const d = Math.hypot(x + w / 2 - nearX, y + h / 2 - nearY); if (d < bd && this.canPlace(t, k, x, y) === true) { bd = d; best = { x, y }; } }
    return best;
  },

  /* ---------- inventory ---------- */
  count(id) { return this.S.inv[id] || 0; },
  storeOf(id) { return ITEMS[id] && ITEMS[id].store === 'silo' ? 'silo' : 'barn'; },
  used(store) { let n = 0; for (const k in this.S.inv) if (this.storeOf(k) === store) n += this.S.inv[k]; return n; },
  cap(store) { return store === 'silo' ? this.S.siloCap : this.S.barnCap; },
  canStore(id, n) { const s = this.storeOf(id); return this.used(s) + n <= this.cap(s); },
  free(store) { return this.cap(store) - this.used(store); },
  addItem(id, n) { this.S.inv[id] = (this.S.inv[id] || 0) + n; if (this.S.inv[id] <= 0) delete this.S.inv[id]; Bus.emit('inv'); },
  has(ing, mult = 1) { for (const k in ing) if (this.count(k) < ing[k] * mult) return false; return true; },
  missing(ing) { const m = {}; for (const k in ing) { const d = ing[k] - this.count(k); if (d > 0) m[k] = d; } return m; },
  gemCostFor(items) { let g = 0; for (const k in items) g += Math.max(1, Math.ceil(ITEMS[k].value * items[k] / 22)); return g; },
  speedCost(ms) { const m = ms / 60000; return m <= 0 ? 0 : Math.max(1, Math.ceil(Math.sqrt(m) * .95)); },
  fullMsg(store) { UI.storageFull(store); },

  /* ---------- currency / xp ---------- */
  addCoins(n, sx, sy) { if (!n) return; this.S.coins += n; if (n > 0) { this.stat('coinsEarned', n); } if (sx != null) UI.fly('coin', sx, sy, n); else UI.hud(); this.saveSoon(); },
  addGems(n, sx, sy) { if (!n) return; this.S.gems += n; if (sx != null) UI.fly('gem', sx, sy, n); else UI.hud(); this.saveSoon(); },
  addXP(n, sx, sy) {
    if (!n) return; if (this.S.level < 8) n = Math.round(n * (1 + (8 - this.S.level) * .12)); this.S.xp += n; if (sx != null) UI.fly('xp', sx, sy, n);
    let leveled = false;
    while (this.S.level < MAX_LEVEL && this.S.xp >= xpForLevel(this.S.level)) { this.S.xp -= xpForLevel(this.S.level); this.S.level++; leveled = true; this.onLevelUp(this.S.level); }
    UI.hud(); if (leveled) this.save();
  },
  spend(coins, gems = 0) { if (this.S.coins < coins || this.S.gems < gems) { if (this.S.gems < gems) UI.toast('Ikke nok diamanter', 'bad'); else UI.toast('Ikke nok mønter', 'bad'); SND.play('error'); return false; } this.S.coins -= coins; this.S.gems -= gems; UI.hud(); return true; },
  onLevelUp(L) {
    const r = levelReward(L);
    this.S.coins += r.coins; this.S.gems += r.gems;
    // expand order board
    while (this.S.orders.length < orderSlots(L)) this.S.orders.push(null);
    const free = shopSlotsFree(L); while (this.S.shop.slots.length < free + (this.S.shop.bought || 0)) this.S.shop.slots.push(null);
    this.stat('level', 0, L);
    UI.queueLevelUp(L, r, this.unlocksAt(L));
    Bus.emit('levelup', L);
  },
  unlocksAt(L) {
    const u = [];
    CROPS.forEach(c => c.level === L && L > 1 && u.push({ icon: c.id, name: c.name, kind: 'Afgrøde' }));
    ANIMALS.forEach(a => a.level === L && L > 1 && u.push({ icon: a.product, name: a.penName + ' (' + a.name + ')', kind: 'Dyr' }));
    PROD.forEach(b => b.level === L && L > 1 && u.push({ icon: b.recipes[0][0], name: b.name, kind: 'Bygning' }));
    Object.values(RECIPES).forEach(r => r.level === L && L > 1 && BUILDINGS[r.building].level !== L && u.push({ icon: r.id, name: ITEMS[r.id].name, kind: 'Opskrift' }));
    TREES.forEach(t => t.level === L && u.push({ icon: t.fruit, name: t.name, kind: 'Frugttræ' }));
    DECOS.forEach(d => d.level === L && L > 1 && u.push({ deco: d.id, name: d.name, kind: 'Dekoration' }));
    if (maxFields(L) > maxFields(L - 1)) u.push({ icon: 'wheat', name: '+' + (maxFields(L) - maxFields(L - 1)) + ' marker', kind: 'Plads' });
    if (orderSlots(L) > orderSlots(L - 1)) u.push({ svg: 'orders', name: 'Ny ordreplads', kind: 'Funktion' });
    if (shopSlotsFree(L) > shopSlotsFree(L - 1)) u.push({ svg: 'shop', name: 'Ny plads i vejboden', kind: 'Funktion' });
    if (L === 4) u.push({ svg: 'visitor', name: 'Besøgende kunder', kind: 'Funktion' });
    PLOTS.forEach(p => p.level === L && u.push({ svg: 'map', name: 'Nyt jordstykke', kind: 'Udvidelse' }));
    return u;
  },

  /* ---------- stats / achievements ---------- */
  stat(k, n = 1, set) {
    const st = this.S.stats; if (set != null) st[k] = Math.max(st[k] || 0, set); else st[k] = (st[k] || 0) + n;
    this.checkAch(k);
    if (n > 0) Quests.progress(k, n);
  },
  statVal(k) { if (k === 'animals') return this.S.objs.filter(o => o.t === 'pen').reduce((s, o) => s + o.animals.length, 0); return this.S.stats[k] || 0; },
  checkAch(k) {
    ACHS.forEach(a => { if (a.stat === k && !this.S.ach[a.id] && this.statVal(k) >= a.target) { this.S.ach[a.id] = 'done'; this.S.newAch = (this.S.newAch || 0) + 1; UI.toast('Præstation låst op: ' + a.name, 'ach'); SND.play('reward'); UI.badges(); } });
  },
  checkAllAch() { new Set(ACHS.map(a => a.stat)).forEach(k => this.checkAch(k)); },
  claimAch(id, sx, sy) {
    const a = ACHS.find(x => x.id === id); if (!a || this.S.ach[id] !== 'done') return;
    this.S.ach[id] = 'claimed'; this.S.newAch = Math.max(0, (this.S.newAch || 1) - 1);
    this.addGems(a.reward.gems, sx, sy); this.addCoins(a.reward.coins, sx, sy); this.addXP(a.reward.xp, sx, sy); SND.play('reward'); UI.badges(); this.save();
  },

  /* ---------- drops ---------- */
  rollDrop(chance, wx, wy) {
    if (Math.random() < .0035) { this.addGems(1); const p = W.toScreen(wx, wy); UI.fly('gem', p.x, p.y, 1); UI.floatText(wx, wy - 30, '+1 diamant', '#7fd8ff'); }
    if (Math.random() > chance || this.S.level < 3) return;
    let pool = Math.random() < .5 ? MAT_SILO : MAT_BARN; if (this.S.level >= 5 && Math.random() < .22) pool = MAT_LAND;
    const id = pick(pool);
    if (!this.canStore(id, 1)) return;
    this.addItem(id, 1); const p = W.toScreen(wx, wy); UI.fly(id, p.x, p.y - 20, 1); UI.floatText(wx, wy - 40, '+1 ' + ITEMS[id].name, '#ffe08a');
  },

  /* ---------- crops ---------- */
  plant(o, cid) {

    else { if (this.S.coins < C.seedPrice) { UI.toast('Ikke nok ' + C.name.toLowerCase() + ' eller mønter', 'bad'); SND.play('error'); return false; } this.S.coins -= C.seedPrice; UI.hud(); }

  },

  /* ---------- animals ---------- */
  penInfo(o) { const a = ANIMAL_BY_PEN[o.k]; const t = now(); let hungry = 0, ready = 0, busy = 0; o.animals.forEach(x => { if (x.readyAt == null) hungry++; else if (t >= x.readyAt) ready++; else busy++; }); return { a, hungry, ready, busy }; },

    if (!got) return 0;

    UI.floatText(wx, wy - 30, `+${got} ${ITEMS[a.product].name}`, '#fff'); W.burst(wx, wy, 'sparkle', 10);
    this.stat('collectAnimal', got); Quests.progress('animal:' + a.product, got); for (let i = 0; i < got; i++) this.rollDrop(.04, wx, wy);
    SND.play('collect'); SND.play('animal_' + a.id); vibrate(10); W.penReact(o, 'hop'); this.saveSoon(); Bus.emit('collectAnimal', a.id); return got;
  },
  buyAnimal(o) {
    const a = ANIMAL_BY_PEN[o.k]; if (o.animals.length >= PEN_CAP) return;
    const owned = this.S.objs.filter(x => x.t === 'pen' && x.k === o.k).reduce((s, x) => s + x.animals.length, 0);
    const price = animalPrice(a, owned); if (!this.spend(price)) return;
    o.animals.push({ readyAt: null }); W.spawnAnimals(o); this.addXP(Math.max(2, Math.round(price / 25))); this.stat('animals', 0); this.checkAch('animals');
    SND.play('animal_' + a.id); SND.play('buy'); this.save(); return true;
  },

  /* ---------- production ---------- */
  qState(q, t = now()) { return t >= q.end ? 'ready' : t >= q.start ? 'active' : 'wait'; },
  enqueue(o, rid) {
    const R = RECIPES[rid]; if (!R) return false;
    if (o.queue.length >= o.slots) { UI.toast('Køen er fuld', 'bad'); SND.play('error'); return false; }
    if (!this.has(R.ing)) return 'missing';
    for (const k in R.ing) this.addItem(k, -R.ing[k]);
    const t = now(); const last = o.queue.length ? o.queue[o.queue.length - 1].end : t;
    const dur = this.tutSpeed ? 10000 : R.time * 1000;
    const start = Math.max(t, last); o.queue.push({ r: rid, start, end: start + dur });
    SND.play('produce'); Bus.emit('enqueue', rid); this.saveSoon(); return true;
  },
  buyMissingAndEnqueue(o, rid) {
    const R = RECIPES[rid]; const miss = this.missing(R.ing); const g = this.gemCostFor(miss);
    if (!this.spend(0, g)) return false;

  },
  cancelQ(o, idx) {
    const q = o.queue[idx]; if (!q || this.qState(q) !== 'wait') return;

    this.saveSoon();
  },
  speedQ(o) {
    const t = now(); const i = o.queue.findIndex(q => this.qState(q, t) === 'active'); if (i < 0) return;
    const q = o.queue[i]; const cost = this.speedCost(q.end - t); if (!this.spend(0, cost)) return;
    const diff = q.end - t; q.end = t; for (let k = i + 1; k < o.queue.length; k++) { o.queue[k].start -= diff; o.queue[k].end -= diff; }
    SND.play('magic'); this.saveSoon();
  },
  collectBld(o) {
    const t = now(); let got = 0; const [w, h] = this.sizeOf(o);
    const wx = (o.x + w / 2) * T, wy = (o.y + h / 2) * T; const p = W.toScreen(wx, wy - 40);
    for (let i = 0; i < o.queue.length; i++) {
      const q = o.queue[i]; if (this.qState(q, t) !== 'ready') break;
      const R = RECIPES[q.r]; if (!this.canStore(q.r, R.out)) { this.fullMsg('barn'); break; }
      this.addItem(q.r, R.out); o.queue.splice(i, 1); i--; got++;
      UI.fly(q.r, p.x + got * 8, p.y, R.out); this.addXP(ITEMS[q.r].xp * R.out, p.x, p.y);
      UI.floatText(wx, wy - 70 - got * 22, `+${R.out} ${ITEMS[q.r].name}`, '#fff');
      this.stat('produce', R.out); Quests.progress('produce:' + q.r, R.out); if (o.k === 'bakery') this.stat('bakery', R.out); if (o.k === 'fishhut' && q.r !== 'bait') this.stat('fish', R.out);
      this.rollDrop(.05, wx, wy);
    }
    if (got) { SND.play('collect'); W.burst(wx, wy - 40, 'sparkle', 12); vibrate(10); this.saveSoon(); Bus.emit('collectBld', o.k); }
    return got;
  },
  buyQueueSlot(o) { if (o.slots >= QUEUE_MAX) return; const c = QUEUE_COST[o.slots]; if (!this.spend(0, c)) return; o.slots++; SND.play('buy'); this.save(); },

  /* ---------- trees ---------- */
  treeState(o) { if (o.dead) return 'dead'; if (now() >= o.readyAt) return 'ready'; return o.harvests === 0 && now() < o.readyAt ? 'young' : 'grow'; },
  harvestTree(o) {
    if (o.dead || now() < o.readyAt) return false;
    const D = TREE[o.k]; if (!this.canStore(D.fruit, 3)) { this.fullMsg('barn'); return false; }
    const wx = o.x * T + T / 2, wy = o.y * T - 20; const p = W.toScreen(wx, wy);
    this.addItem(D.fruit, 3); UI.fly(D.fruit, p.x, p.y, 3); this.addXP(D.xp * 2, p.x, p.y); UI.floatText(wx, wy - 30, `+3 ${D.fruitName}`, '#fff');
    W.burst(wx, wy, 'harvest', 12, D.fruitColor); this.stat('trees', 1); Quests.progress('tree:' + D.fruit, 3); this.rollDrop(.06, wx, wy);
    o.harvests++; if (o.harvests >= (o.maxH || D.harvests)) { o.dead = true; UI.toast(D.name + ' er udtjent og har brug for pleje', 'info'); } else o.readyAt = now() + D.time * 1000;
    SND.play('harvest'); vibrate(10); this.saveSoon(); return true;
  },
  reviveTree(o) { if (!this.spend(0, 4)) return; o.dead = false; o.harvests = 0; o.maxH = 4 + randi(0, 2); o.readyAt = now() + TREE[o.k].time * 1000; SND.play('magic'); W.burst(o.x * T + T / 2, o.y * T, 'sparkle', 16); this.save(); },
  replantTree(o) { const D = TREE[o.k]; const c = Math.round(D.price * .5); if (!this.spend(c)) return; o.dead = false; o.harvests = 0; o.maxH = 4 + randi(0, 2); o.readyAt = now() + D.time * 1000; W.burst(o.x * T + T / 2, o.y * T, 'dirt', 14); SND.play('plant'); this.save(); },
  removeObj(o) { this.S.objs = this.S.objs.filter(x => x !== o); this.rebuildGrid(); W.objectsChanged(); this.save(); },

  /* ---------- shop (buying things) ---------- */
  ownedCount(t, k) { return this.S.objs.filter(o => o.t === t && (k == null || o.k === k)).length; },
  shopPrice(t, k) {
    if (t === 'field') return fieldPrice(this.ownedCount('field'));
    if (t === 'tree') return TREE[k].price;
    if (t === 'deco') return DECO[k].price;
    return BUILDINGS[k].price;
  },
  canBuy(t, k) {
    const L = this.S.level;
    if (t === 'field') return this.ownedCount('field') < maxFields(L) ? true : 'Maks antal marker for dit niveau';
    if (t === 'tree') { if (TREE[k].level > L) return 'lvl'; return this.ownedCount('tree') < maxTrees(L) ? true : 'Maks antal træer for dit niveau'; }
    if (t === 'deco') return DECO[k].level > L ? 'lvl' : true;
    const B = BUILDINGS[k]; if (B.level > L) return 'lvl';
    if (t === 'pen') { const a = ANIMAL_BY_PEN[k]; return this.ownedCount('pen', k) < maxPens(a, L) ? true : 'Du har allerede maks antal'; }
    return this.ownedCount('bld', k) < 1 ? true : 'Allerede bygget';
  },
  placeNew(t, k, x, y) {
    const price = this.shopPrice(t, k); if (!this.spend(price)) return false;
    const o = { id: this.S.nextId++, t, k, x, y };
    if (t === 'field') o.crop = null;
    if (t === 'tree') { o.harvests = 0; o.maxH = 4 + randi(0, 2); o.readyAt = now() + TREE[k].time * 1000; o.dead = false; }
    if (t === 'bld' || t === 'pen') { const B = BUILDINGS[k]; const bt = this.tutSpeed ? 5 : B.buildTime; o.buildEnd = now() + bt * 1000; if (t === 'bld') { o.queue = []; o.slots = QUEUE_START; } else o.animals = [{ readyAt: null }]; }
    this.S.objs.push(o); this.rebuildGrid(); W.objectsChanged(); if (t === 'pen') W.spawnAnimals(o);
    const wx = (x + this.sizeOf(o)[0] / 2) * T, wy = (y + this.sizeOf(o)[1] / 2) * T; const p = W.toScreen(wx, wy);
    if (t === 'deco') { this.addXP(DECO[k].xp, p.x, p.y); this.stat('decos', 1); }
    if (t === 'tree') this.addXP(Math.max(3, Math.round(price / 30)), p.x, p.y);
    if (t === 'field') this.addXP(1, p.x, p.y);
    W.burst(wx, wy, 'dust', 18); SND.play('place'); Bus.emit('placed', t, k); this.save(); return o;
  },
  finishConstruction(o) {
    if (!o.buildEnd || now() < o.buildEnd) return false;
    delete o.buildEnd; const B = BUILDINGS[o.k]; const [w, h] = B.size; const wx = (o.x + w / 2) * T, wy = (o.y + h / 2) * T; const p = W.toScreen(wx, wy - 40);
    this.addXP(Math.max(10, Math.round(B.price / 15)), p.x, p.y); W.burst(wx, wy - 40, 'confetti', 40); W.burst(wx, wy, 'dust', 20);
    UI.floatText(wx, wy - 120, B.name + ' er færdig!', '#ffe36a'); this.stat('buildings', 1); SND.play('build'); vibrate([20, 40, 20]); Bus.emit('built', o.k); this.save(); return true;
  },
  speedConstruction(o) { const c = this.speedCost(o.buildEnd - now()); if (!this.spend(0, c)) return; o.buildEnd = now(); this.finishConstruction(o); },
  moveObj(o, x, y) { o.x = x; o.y = y; this.rebuildGrid(); W.objectsChanged(); if (o.t === 'pen') W.spawnAnimals(o); this.save(); },
  sellDeco(o) { const D = DECO[o.k]; const back = Math.floor(D.price * .25); this.removeObj(o); if (back) this.addCoins(back); SND.play('coin'); },

  /* ---------- expansions ---------- */
  plotBuyable(key) {
    const p = PLOT_BY_KEY[key]; if (!p || this.S.plots[key]) return false;
    const [c, r] = key.split(',').map(Number);
    return [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => this.S.plots[(c + dx) + ',' + (r + dy)]);
  },
  expand(key) {
    const p = PLOT_BY_KEY[key]; if (!this.plotBuyable(key)) return;
    if (this.S.level < p.level) { UI.toast('Kræver niveau ' + p.level, 'bad'); return; }
    for (const m of MAT_LAND) if (this.count(m) < p.mats) { UI.toast('Mangler ' + ITEMS[m].name.toLowerCase(), 'bad'); SND.play('error'); return; }
    if (!this.spend(p.price)) return;
    for (const m of MAT_LAND) if (p.mats) this.addItem(m, -p.mats);
    this.S.plots[key] = true; this.stat('expansions', 1);
    const cx = (p.c * PLOT + PLOT / 2) * T, cy = (PLOT_Y0 + p.r * PLOT + PLOT / 2) * T; const sp = W.toScreen(cx, cy);
    this.addXP(p.xp, sp.x, sp.y); W.unlockPlot(key); SND.play('levelup'); vibrate([30, 30, 60]); Bus.emit('expand', key); this.save();
  },

  /* ---------- storage upgrades ---------- */
  upgradeNeed(store) { const lvl = store === 'silo' ? this.S.siloLvl : this.S.barnLvl; const n = 1 + lvl; const mats = store === 'silo' ? MAT_SILO : MAT_BARN; return Object.fromEntries(mats.map(m => [m, n])); },
  upgradeAmount(store) { const lvl = store === 'silo' ? this.S.siloLvl : this.S.barnLvl; return lvl < 8 ? 25 : lvl < 20 ? 50 : 75; },
  upgrade(store, useGems) {
    const need = this.upgradeNeed(store), miss = this.missing(need);
    if (Object.keys(miss).length) { if (!useGems) return 'missing'; if (!this.spend(0, Object.values(miss).reduce((s, v) => s + v, 0) * 6)) return false; for (const k in miss) this.addItem(k, miss[k]); }
    for (const k in need) this.addItem(k, -need[k]);
    const amt = this.upgradeAmount(store);
    if (store === 'silo') { this.S.siloCap += amt; this.S.siloLvl++; } else { this.S.barnCap += amt; this.S.barnLvl++; }
    this.addXP(10 + (store === 'silo' ? this.S.siloLvl : this.S.barnLvl) * 8); this.stat('upgrades', 1);
    SND.play('levelup'); UI.toast((store === 'silo' ? 'Siloen' : 'Laden') + ' er udvidet med ' + amt + ' pladser!', 'good'); this.save(); return true;
  },
  sellDirect(id, n) { n = Math.min(n, this.count(id)); if (n <= 0) return; const v = Math.max(1, Math.floor(ITEMS[id].value * .5)) * n; this.addItem(id, -n); this.addCoins(v); SND.play('coin'); this.saveSoon(); },

  /* ---------- producibles ---------- */
  producible() {
    const L = this.S.level, set = new Set();
    CROPS.forEach(c => c.level <= L && set.add(c.id));
    for (const o of this.S.objs) {
      if (o.buildEnd) continue;
      if (o.t === 'pen' && o.animals.length) set.add(ANIMAL_BY_PEN[o.k].product);
      if (o.t === 'tree') set.add(TREE[o.k].fruit);
      if (o.t === 'bld' && BUILDINGS[o.k].recipes) BUILDINGS[o.k].recipes.forEach(r => { if (RECIPES[r].level <= L && !r.startsWith('feed_') && r !== 'bait') { const ing = RECIPES[r].ing; set.add(r); } });
    }
    // only keep recipe products whose ingredients are producible
    let changed = true; const arr = () => [...set];
    while (changed) { changed = false; for (const id of arr()) { const R = RECIPES[id]; if (R && Object.keys(R.ing).some(k => !set.has(k) && !k.startsWith('feed_') && k !== 'bait')) { set.delete(id); changed = true; } } }
    return [...set];
  },

  /* ---------- orders ---------- */
  genOrder() {
    const L = this.S.level; let pool = this.producible().filter(id => ITEMS[id].cat !== 'material');
    if (!pool.length) pool = ['wheat'];
    const V = 30 + L * 22 + L * L * 1.3;
    const maxTypes = L < 3 ? 2 : L < 8 ? 3 : 4;
    const n = Math.min(pool.length, randi(1, maxTypes));
    const w = id => { const it = ITEMS[id]; const rec = 1 + Math.max(0, 6 - (L - it.level)) * .35; const time = RECIPES[id] ? RECIPES[id].time / 60 : 10; return rec * (time > L * 8 + 20 ? .25 : 1); };
    const chosen = [];
    for (let i = 0; i < n; i++) { const cand = pool.filter(x => !chosen.includes(x)); let tot = cand.reduce((s, x) => s + w(x), 0), r = Math.random() * tot; let pickd = cand[0]; for (const x of cand) { r -= w(x); if (r <= 0) { pickd = x; break; } } chosen.push(pickd); }
    const items = {}; let val = 0, xpv = 0;
    chosen.forEach(id => { const it = ITEMS[id]; const share = V / n * rand(.7, 1.3); const cap = it.cat === 'crop' ? 8 + Math.floor(L / 3) : it.value < 30 ? 6 + Math.floor(L / 8) : 4 + Math.floor(L / 15); const q = clamp(Math.round(share / it.value), 1, cap); items[id] = q; val += it.value * q; xpv += it.xp * q; });
    const o = { items, coins: Math.round(val * 1.3 + 5), xp: Math.round(val * .42 + xpv * .4 + 4) };
    const r = Math.random(); if (L >= 4 && r < .12) o.bonus = { [pick(Math.random() < .3 && L >= 6 ? MAT_LAND : MAT_SILO.concat(MAT_BARN))]: 1 }; else if (r < .16) o.gems = 1;
    return o;
  },
  fillOrders() { const t = now(); this.S.orders.forEach((o, i) => { if (!o || (o.cooldown && t >= o.cooldown)) this.S.orders[i] = this.genOrder(); }); },
  canDeliver(o) { return o && !o.cooldown && this.has(o.items); },
  deliverOrder(i, sx, sy) {
    const o = this.S.orders[i]; if (!this.canDeliver(o)) return false;
    if (now() < this.S.truckBack) { UI.toast('Lastbilen er ude at køre – vent et øjeblik', 'info'); return false; }
    for (const k in o.items) this.addItem(k, -o.items[k]);
    this.addCoins(o.coins, sx, sy); this.addXP(o.xp, sx, sy);
    if (o.bonus) for (const k in o.bonus) { this.addItem(k, o.bonus[k]); UI.fly(k, sx, sy, o.bonus[k]); }
    if (o.gems) this.addGems(o.gems, sx, sy);
    this.S.orders[i] = { cooldown: now() + 8000 }; this.S.truckBack = now() + 22000;
    this.stat('orders', 1); W.truckGo(Object.values(o.items).reduce((a, b) => a + b, 0)); SND.play('truck'); SND.play('coin'); Bus.emit('order'); this.save(); return true;
  },
  deleteOrder(i) { this.S.orders[i] = { cooldown: now() + 6 * 60000 }; SND.play('trash'); this.save(); },
  speedOrder(i) { const o = this.S.orders[i]; if (!o || !o.cooldown) return; const c = this.speedCost(o.cooldown - now()); if (!this.spend(0, c)) return; this.S.orders[i] = this.genOrder(); SND.play('magic'); this.save(); },

  /* ---------- roadside shop ---------- */
  shopFair(s) { return Math.max(1, Math.round(ITEMS[s.item].value * s.qty * 1.15)); },
  shopMax(item, qty) { return Math.max(2, Math.round(ITEMS[item].value * qty * 2)); },
  listItem(slot, item, qty, price) {
    if (this.count(item) < qty) return false; this.addItem(item, -qty);
    this.S.shop.slots[slot] = { item, qty, price, sold: false, at: now() }; SND.play('place'); Bus.emit('list'); this.save(); return true;
  },
  unlist(slot) { const s = this.S.shop.slots[slot]; if (!s || s.sold) return; if (!this.canStore(s.item, s.qty)) { this.fullMsg(this.storeOf(s.item)); return; } this.addItem(s.item, s.qty); this.S.shop.slots[slot] = null; this.save(); },
  collectSale(slot, sx, sy) { const s = this.S.shop.slots[slot]; if (!s || !s.sold) return; Bus.emit('saleCollected'); this.addCoins(s.price, sx, sy); this.addXP(Math.max(1, Math.round(ITEMS[s.item].xp * s.qty * .3)), sx, sy); this.S.shop.slots[slot] = null; SND.play('coin'); this.save(); },
  buyShopSlot() { const idx = this.S.shop.bought || 0; if (idx >= SHOP_SLOT_GEMS.length || this.S.shop.slots.length >= SHOP_MAX) return; if (!this.spend(0, SHOP_SLOT_GEMS[idx])) return; this.S.shop.bought = idx + 1; this.S.shop.slots.push(null); SND.play('buy'); this.save(); },
  shopRate(s) { const p = s.price / (ITEMS[s.item].value * s.qty); const f = p <= .8 ? 2.2 : p <= 1.25 ? 1 : p <= 1.6 ? .45 : .15; return f / 140; },
  markSold(slot) { const s = this.S.shop.slots[slot]; if (!s || s.sold) return; s.sold = true; s.reserved = false; this.stat('shopSales', 1); Bus.emit('sold', slot); SND.play('coin'); this.saveSoon(); },

  /* ---------- visitors ---------- */

      if (ty === 'animal') { const ap = pool.filter(id => ITEMS[id].cat === 'animal'); const id = pick(ap); const it = ITEMS[id]; const n = clamp(Math.round((40 + L * 10) / it.value), 3, 30); q = { key: 'animal:' + id, icon: id, text: `Saml ${n} × ${it.name}`, need: n, val: it.value * n }; }
      if (ty === 'feed') { const n = clamp(Math.round(6 + L * .8), 6, 60); q = { key: 'feed', icon: 'feed_chicken', text: `Fodr dine dyr ${n} gange`, need: n, val: n * 12 }; }
      if (ty === 'orders') { const n = clamp(Math.round(2 + L / 6), 2, 15); q = { key: 'orders', svg: 'orders', text: `Lever ${n} lastbilordrer`, need: n, val: n * (40 + L * 25) }; }
      if (ty === 'shopSales') { const n = clamp(Math.round(2 + L / 5), 2, 20); q = { key: 'shopSales', svg: 'shop', text: `Sælg ${n} varer i vejboden`, need: n, val: n * (15 + L * 10) }; }
      if (ty === 'visitors') { const n = clamp(Math.round(1 + L / 12), 1, 8); q = { key: 'visitors', svg: 'visitor', text: `Hjælp ${n} besøgende`, need: n, val: n * (40 + L * 20) }; }

    sh.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { SND.play('click'); p.tab = b.dataset.tab; sh.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b)); sh.querySelector('.sbody').scrollTop = 0; this.renderPanel(); });
    sh.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a && p.act) { p.act(a.dataset.act, a, e); } });

  },
  renderPanel(keepScroll) {

  },
  closeSheet() { const sh = this.sheetEl; this.panel = null; if (!sh) return; sh.classList.remove('open'); this.sheetEl = null; setTimeout(() => { if (sh.parentNode && !sh.classList.contains('open')) sh.remove(); }, 300); Bus.emit('panelclose'); },
  /* ---------- modals ---------- */
  modal(html, opts = {}) {
    const wrap = document.createElement('div'); wrap.className = 'mwrap';
    wrap.innerHTML = `<div class="modal ${opts.cls || ''}">${opts.title ? `<div class="ribbon">${esc(opts.title)}</div>` : ''}${opts.noX ? '' : `<button class="xbtn" data-x>${SVG.close}</button>`}${html}</div>`;
    $('#modals').appendChild(wrap); this.modalOpen++;
    const close = () => { if (!wrap.parentNode) return; wrap.remove(); this.modalOpen--; SND.play('close'); if (opts.onClose) opts.onClose(); this.nextModal(); };
    wrap.addEventListener('pointerdown', e => { e.stopPropagation(); if (e.target === wrap && !opts.noX) close(); });
    wrap.querySelectorAll('[data-x]').forEach(b => b.onclick = close);
    wrap.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a && opts.act) opts.act(a.dataset.act, a, close, e); });
    SND.play('open'); return { el: wrap, close };
  },
  confirm(title, text, okLabel, onOk, cls = '') { const m = this.modal(`<p>${text}</p><div class="btns"><button class="btn g" data-x>Annullér</button><button class="btn ${cls}" data-act="ok">${okLabel}</button></div>`, { title, act: (a, el, close) => { if (a === 'ok') { close(); onOk(); } } }); return m; },
  later(fn) { if (this.modalOpen) this.modalQ.push(fn); else fn(); },
  queueLevelUp(L, r, unlocks) { this.modalQ.push(() => this.levelUp(L, r, unlocks)); setTimeout(() => this.nextModal(), 300); },
  nextModal() { if (this.modalOpen || !this.modalQ.length) return; const f = this.modalQ.shift(); f(); },
  levelUp(L, r, unlocks) {
    SND.play('levelup'); this.confetti(110); vibrate([40, 60, 40, 60, 120]);
    const html = `<div class="burst"><div class="rays"></div><div class="star">${SVG.star}</div><b>${L}</b></div>
      <p style="font-size:22px;font-weight:700;margin:2px 0 4px">Du er nu niveau ${L}!</p>
      <div class="rwd"><span>${svgIcon('coin')}+${fmt(r.coins)}</span><span>${svgIcon('gem')}+${r.gems}</span></div>
      ${unlocks.length ? `<div class="sec">Nyt indhold låst op</div><div class="unl">${unlocks.slice(0, 12).map(u => `<div class="u">${u.icon ? iconImg(u.icon) : u.deco ? `<img src="${thumb('deco', u.deco)}">` : svgIcon(u.svg)}${esc(u.name)}<small>${u.kind}</small></div>`).join('')}</div>` : ''}
      <div class="btns"><button class="btn y" data-x>Fantastisk!</button></div>`;
    this.modal(html, { cls: 'lvlup', title: 'NIVEAU OP!', noX: true });
  },
  storageFull(store) {
    if (this._fullAt && now() - this._fullAt < 1500) return; this._fullAt = now(); SND.play('error');
    const nm = store === 'silo' ? 'Siloen' : 'Laden';
    this.modal(`<div class="mpic">${iconImg(store === 'silo' ? 'wheat' : 'bread')}</div><p><b>${nm} er fuld!</b></p><p class="desc">Sælg nogle varer, lever ordrer eller opgradér ${nm.toLowerCase()} med byggematerialer.</p><div class="btns"><button class="btn y" data-act="sell">Sælg varer</button><button class="btn" data-act="up">Opgradér</button></div>`, { title: nm + ' er fuld', act: (a, el, close) => { close(); this.open('storage', store); } });
  },
  needFeed(o, a) {
    const mill = G.S.objs.find(x => x.k === 'feedmill');
    this.modal(`<div class="mpic">${iconImg(a.feed)}</div><p>Du mangler <b>${ITEMS[a.feed].name.toLowerCase()}</b> til dine ${a.name.toLowerCase()}r.</p><p class="desc">${mill ? 'Lav mere foder i Foderfabrikken.' : 'Byg en Foderfabrik i butikken for at lave foder.'}</p><div class="btns">${mill ? `<button class="btn" data-act="go">Gå til Foderfabrikken</button>` : `<button class="btn y" data-act="shop">Åbn butikken</button>`}</div>`, { title: 'Mangler foder', act: (act, el, close) => { close(); if (act === 'go') { const [w, h] = G.sizeOf(mill); W.focus((mill.x + w / 2) * T, (mill.y + h / 2) * T); this.production(mill); } else this.open('shop', 'bld'); } });
  },

  /* ---------- object taps ---------- */
  tapObj(o, sx, sy) {
    const t = now();
    if (o.t === 'field') {
      if (!o.crop) { this.seedMenu(o); return; }
      if (t >= o.finishAt) { G.harvest(o); return; }
      this.cropInfo(o); return;
    }
    if (o.t === 'tree') { if (o.dead) { this.treePanel(o); return; } if (t >= o.readyAt) { G.harvestTree(o); return; } this.treeInfo(o); return; }
    if (o.t === 'deco') { this.decoPanel(o); return; }
    if (o.t === 'pen') {
      if (o.buildEnd) { if (t >= o.buildEnd) G.finishConstruction(o); else this.construction(o); return; }
      const info = G.penInfo(o);
      if (info.ready) { G.collectPen(o); return; }
      if (info.hungry && G.count(info.a.feed) > 0) { G.feedPen(o); return; }
      SND.play('animal_' + info.a.id); W.penReact(o, 'hop'); this.penPanel(o); return;
    }
    // buildings
    if (o.buildEnd) { if (t >= o.buildEnd) G.finishConstruction(o); else this.construction(o); return; }
    if (o.k === 'house') { this.open('menu', 'stats'); return; }
    if (o.k === 'barn') { this.open('storage', 'barn'); return; }
    if (o.k === 'silo') { this.open('storage', 'silo'); return; }
    if (o.k === 'shop') { this.roadside(); return; }
    if (o.k === 'board') { this.open('orders'); return; }
    if (o.queue && o.queue.some(q => G.qState(q, t) === 'ready')) { if (G.collectBld(o)) return; }
    this.production(o);
  },
  closeFloating() { if (this.pop) { this.pop.remove(); this.pop = null; this.popRefresh = null; } },
  popAt(o, html, extraY = 0) {
    this.closeFloating(); const [w, h] = G.sizeOf(o); const p = W.toScreen((o.x + w / 2) * T, o.y * T - (o.t === 'tree' ? 90 : 0) + extraY);
    const el = document.createElement('div'); el.className = 'pop'; el.innerHTML = html; $('#game').appendChild(el);
    const r = el.getBoundingClientRect(); let x = p.x - r.width / 2, y = p.y - r.height - 14; x = clamp(x, 6, innerWidth - r.width - 6); if (y < 70) y = 70;
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.addEventListener('pointerdown', e => e.stopPropagation()); this.pop = el; return el;
  },
  seedMenu(o) {
    const L = G.S.level; const crops = CROPS.filter(c => c.level <= L + 3);
    const el = this.popAt(o, `<div class="seeds">${crops.map(c => { const lk = c.level > L; return `<div class="seed ${lk ? 'lk' : ''} ${W.brush === c.id ? 'sel' : ''}" data-c="${c.id}">${iconImg(c.id)}<span>${lk ? 'Niv. ' + c.level : fmtTime(c.growTime * 1000)}</span>${lk ? '' : `<span class="c">${G.count(c.id) || '<span style=\'color:#ffe36a\'>' + c.seedPrice + '¢</span>'}</span>`}</div>`; }).join('')}<div class="seed" data-mv="1" style="background:radial-gradient(circle at 50% 35%,#e8f4ff,#b8d8f0)">${SVG.move.replace('fill="#fff"', 'fill="#4a8ad8"')}<span>Flyt</span></div></div>`);
    el.querySelector('[data-mv]').onclick = () => { this.closeFloating(); this.endBrush(); W.startPlace('field', 'field', o); };
    el.querySelectorAll('[data-c]').forEach(s => s.onclick = () => { const C = CROP[s.dataset.c]; if (C.level > L) { this.toast(C.name + ' låses op på niveau ' + C.level, 'info'); return; } if (G.plant(o, C.id)) { this.startBrush(C.id); this.closeFloating(); } });
    Bus.emit('seedmenu');
  },
  startBrush(cid) { W.brush = cid; const b = $('#banner'); b.innerHTML = `${iconImg(cid)}<span>Træk over tomme marker for at så ${CROP[cid].name.toLowerCase()}</span><button class="btn sm r" id="endbrush">${svgIcon('check')}</button>`; b.classList.add('on'); $('#endbrush').onclick = () => this.endBrush(); },
  endBrush() { W.brush = null; $('#banner').classList.remove('on'); },
  cropInfo(o) {
    const C = CROP[o.crop];
    const html = () => { const rem = o.finishAt - now(); return `<div class="info">${iconImg(C.id)}<div><div>${C.name}</div><div style="font-size:13px;color:#8a6a4a">${svgIcon('clock')} <span data-end="${o.finishAt}">${fmtTime(rem)}</span></div></div><button class="btn b sm" data-a="speed">${svgIcon('gem')} ${G.speedCost(rem)}</button>${G.count('fertilizer') ? `<button class="btn sm" data-a="fert">${iconImg('fertilizer')}×${G.count('fertilizer')}</button>` : ''}</div>`; };
    const el = this.popAt(o, html());
    el.onclick = e => { const a = e.target.closest('[data-a]'); if (!a) return; if (a.dataset.a === 'speed') { const c = G.speedCost(o.finishAt - now()); if (G.spend(0, c)) { o.finishAt = now(); W.burst(o.x * T + T, o.y * T + T, 'sparkle', 14); SND.play('magic'); G.saveSoon(); } } if (a.dataset.a === 'fert') G.fertilize(o); this.closeFloating(); };
    this.popRefresh = () => { if (now() >= o.finishAt) this.closeFloating(); };
  },
  treeInfo(o) {
    const D = TREE[o.k];
    const el = this.popAt(o, `<div class="info">${iconImg(D.fruit)}<div><div>${D.name}</div><div style="font-size:13px;color:#8a6a4a">${svgIcon('clock')} <span data-end="${o.readyAt}">${fmtTime(o.readyAt - now())}</span> · høst ${o.harvests}/${o.maxH || D.harvests}</div></div><button class="btn b sm" data-a="speed">${svgIcon('gem')} ${G.speedCost(o.readyAt - now())}</button><button class="btn g sm" data-a="move">${svgIcon('move')}</button></div>`);
    el.onclick = e => { const a = e.target.closest('[data-a]'); if (!a) return; if (a.dataset.a === 'speed') { if (G.spend(0, G.speedCost(o.readyAt - now()))) { o.readyAt = now(); SND.play('magic'); G.saveSoon(); } } else { W.startPlace('tree', o.k, o); } this.closeFloating(); };
  },
  treePanel(o) {
    const D = TREE[o.k];
    this.modal(`<div class="mpic"><img class="ii" src="${thumb('tree', o.k, 'dead')}"></div><p><b>${D.name}</b> er udtjent efter ${o.harvests} høster.</p><p class="desc">Du kan pleje det tilbage til livet, plante et nyt træ på samme sted eller fjerne det helt.</p>
      <div class="btns" style="flex-direction:column;align-items:stretch"><button class="btn b" data-act="revive">${svgIcon('gem')} 4 · Genopliv</button><button class="btn y" data-act="replant">${svgIcon('coin')} ${fmt(Math.round(D.price * .5))} · Genplant</button><button class="btn r" data-act="remove">Fjern træet</button></div>`, { title: 'Dødt træ', act: (a, el, close) => { close(); if (a === 'revive') G.reviveTree(o); if (a === 'replant') G.replantTree(o); if (a === 'remove') { W.burst(o.x * T + T / 2, o.y * T, 'dust', 20); G.removeObj(o); G.addXP(5); G.rollDrop(.5, o.x * T, o.y * T); SND.play('trash'); } } });
  },
  decoPanel(o) {
    const D = DECO[o.k];
    this.popAt(o, `<div class="info"><img src="${thumb('deco', o.k)}"><div>${D.name}</div><button class="btn sm b" data-a="move">${svgIcon('move')} Flyt</button><button class="btn sm r" data-a="sell">Sælg ${svgIcon('coin')}${fmt(Math.floor(D.price * .25))}</button></div>`).onclick = e => { const a = e.target.closest('[data-a]'); if (!a) return; this.closeFloating(); if (a.dataset.a === 'move') W.startPlace('deco', o.k, o); else this.confirm('Sælg', `Vil du sælge ${D.name.toLowerCase()}?`, 'Sælg', () => G.sellDeco(o), 'r'); };
  },
  construction(o) {
    const B = BUILDINGS[o.k];
    const m = this.modal(`<div class="mpic"><img class="ii" src="${thumb(o.t, o.k)}"></div><p><b>${B.name}</b> er under opførelse</p><p style="font-size:22px;font-weight:700">${svgIcon('clock')} <span data-end="${o.buildEnd}" data-done="Færdig!">${fmtTime(o.buildEnd - now())}</span></p><div class="btns"><button class="btn b" data-act="speed">${svgIcon('gem')} ${G.speedCost(o.buildEnd - now())} · Byg nu</button></div>`, { title: 'Byggeri', act: (a, el, close) => { close(); G.speedConstruction(o); } });
  },

  /* ---------- production ---------- */
  production(o) {
    const B = BUILDINGS[o.k];
    const p = {
      id: 'prod', title: B.name, foot: () => `<button class="btn g sm" data-act="move">${svgIcon('move')} Flyt</button>`,
      sig: () => { const t = now(); return o.queue.map(q => q.r + G.qState(q, t)).join(',') + '|' + o.slots + '|' + B.recipes.map(r => G.has(RECIPES[r].ing) ? 1 : 0).join('') + G.S.level; },
      render: () => {
        const t = now(); let q = '';
        for (let i = 0; i < Math.max(o.slots, 1); i++) {
          const it = o.queue[i];
          if (!it) { q += `<div class="qs empty"></div>`; continue; }
          const st = G.qState(it, t);
          if (st === 'ready') q += `<div class="qs ready" data-act="collect">${iconImg(it.r)}<div class="t">Klar!</div></div>`;
          else if (st === 'active') q += `<div class="qs" data-act="speed">${iconImg(it.r)}<div class="t" data-end="${it.end}">${fmtTime(it.end - t)}</div><div class="pb"><i data-pstart="${it.start}" data-pend="${it.end}"></i></div></div>`;
          else q += `<div class="qs wait" data-act="cancel" data-i="${i}">${iconImg(it.r)}<div class="t">${fmtTime(it.end - it.start)}</div><span class="rm">×</span></div>`;
        }
        if (o.slots < QUEUE_MAX) q += `<div class="qs lockd" data-act="slot">${svgIcon('lock')}<div class="t">+1 plads</div><div class="t">${svgIcon('gem')} ${QUEUE_COST[o.slots]}</div></div>`;
        const active = o.queue.find(x => G.qState(x, t) === 'active');
        const speedBtn = active ? `<button class="btn b sm" data-act="speed">${svgIcon('speed')} Fremskynd · ${svgIcon('gem')}${G.speedCost(active.end - t)}</button>` : '';
        const cards = B.recipes.map(rid => {
          const R = RECIPES[rid], it = ITEMS[rid], lk = R.level > G.S.level;
          if (lk) return `<div class="card locked" data-act="lk" data-l="${R.level}"><span class="lock">${svgIcon('lock')} ${R.level}</span><div class="pic">${iconImg(rid)}</div><div class="nm">${it.name}</div></div>`;
          const ing = Object.keys(R.ing).map(k => { const h = G.count(k), n = R.ing[k]; return `<div class="i ${h >= n ? 'ok' : 'no'}">${iconImg(k)}${h}/${n}</div>`; }).join('');
          return `<div class="card ${G.has(R.ing) ? '' : 'dim'}" data-act="make" data-r="${rid}"><div class="pic">${iconImg(rid)}${R.out > 1 ? `<span class="cnt">×${R.out}</span>` : ''}</div><div class="nm">${it.name}</div><div class="meta">${svgIcon('clock')} ${fmtTime(R.time * 1000)} · ${svgIcon('star')}${it.xp * R.out}</div><div class="ing">${ing}</div><div class="meta">Har: ${G.count(rid)} · ${svgIcon('coin')}${it.value}</div></div>`;
        }).join('');
        return `<div class="sec">Produktionskø (${o.queue.length}/${o.slots})</div><div class="queue">${q}</div><div class="flex center">${speedBtn}</div><div class="sec">Opskrifter</div><div class="grid">${cards}</div>`;
      },
      act: (a, el) => {
        if (a === 'make') { const rid = el.dataset.r; const r = G.enqueue(o, rid); if (r === 'missing') { const miss = G.missing(RECIPES[rid].ing); const g = G.gemCostFor(miss); this.confirm('Mangler varer', `Du mangler: ${Object.keys(miss).map(k => miss[k] + ' × ' + ITEMS[k].name).join(', ')}.<br>Køb det manglende for <b>${g}</b> ${svgIcon('gem')}?`, `${svgIcon('gem')} ${g} · Køb`, () => { G.buyMissingAndEnqueue(o, rid); this.renderPanel(true); }, 'b'); } else if (r) { el.classList.add('pulse'); this.renderPanel(true); } }
        if (a === 'collect') { G.collectBld(o); this.renderPanel(true); }
        if (a === 'speed') { const act = o.queue.find(x => G.qState(x) === 'active'); if (act) this.confirm('Fremskynd', `Gør ${ITEMS[act.r].name.toLowerCase()} færdig nu?`, `${svgIcon('gem')} ${G.speedCost(act.end - now())}`, () => { G.speedQ(o); this.renderPanel(true); }, 'b'); }
        if (a === 'cancel') { const i = +el.dataset.i; this.confirm('Fjern fra kø', 'Vil du fjerne varen fra køen? Du får ingredienserne tilbage.', 'Fjern', () => { G.cancelQ(o, i); this.renderPanel(true); }, 'r'); }
        if (a === 'slot') this.confirm('Ekstra plads', `Køb en ekstra produktionsplads for ${QUEUE_COST[o.slots]} diamanter?`, `${svgIcon('gem')} ${QUEUE_COST[o.slots]}`, () => { G.buyQueueSlot(o); this.renderPanel(true); }, 'b');
        if (a === 'lk') this.toast('Låses op på niveau ' + el.dataset.l, 'info');
        if (a === 'move') { this.closeSheet(); W.startPlace('bld', o.k, o); }
      }
    };
    this.showSheet(p);
  },
  penPanel(o) {
    const a = ANIMAL_BY_PEN[o.k];
    const p = {
      id: 'pen', title: a.penName, foot: () => `<button class="btn g sm" data-act="move">${svgIcon('move')} Flyt</button>`,
      sig: () => { const t = now(); return o.animals.map(x => x.readyAt == null ? 'h' : t >= x.readyAt ? 'r' : 'b').join('') + G.count(a.feed); },
      render: () => {
        const t = now(), info = G.penInfo(o);
        const list = o.animals.map((an, i) => { const st = an.readyAt == null ? 'Sulten' : t >= an.readyAt ? 'Klar!' : null; return `<div class="card" style="cursor:default"><div class="pic"><img class="ii" src="${animalThumb(a.id, i)}"></div><div class="nm">${a.name} ${i + 1}</div><div class="meta">${st || `${svgIcon('clock')} <span data-end="${an.readyAt}">${fmtTime(an.readyAt - t)}</span>`}</div>${st == null ? `<div class="bar" style="width:100%"><i data-pstart="${an.fedAt || an.readyAt - a.time * 1000}" data-pend="${an.readyAt}"></i></div>` : ''}</div>`; }).join('');
        const owned = G.S.objs.filter(x => x.t === 'pen' && x.k === o.k).reduce((s, x) => s + x.animals.length, 0);
        const busy = o.animals.filter(an => an.readyAt && t < an.readyAt); const maxRem = busy.reduce((m, an) => Math.max(m, an.readyAt - t), 0);
        return `<div class="row"><div class="pic">${iconImg(a.feed)}</div><div class="txt"><b>${ITEMS[a.feed].name}: ${G.count(a.feed)}</b><small>1 foder pr. dyr · giver ${ITEMS[a.product].name.toLowerCase()} efter ${fmtTime(a.time * 1000)}</small></div>${info.ready ? `<button class="btn" data-act="collect">Saml ${info.ready}</button>` : info.hungry ? `<button class="btn y" data-act="feed" ${G.count(a.feed) ? '' : 'disabled'}>Fodr</button>` : ''}</div>
          ${busy.length ? `<div class="flex center"><button class="btn b sm" data-act="speedall">${svgIcon('speed')} Gør alle færdige · ${svgIcon('gem')}${G.speedCost(maxRem) + busy.length - 1}</button></div>` : ''}
          <div class="sec">Dyr (${o.animals.length}/${PEN_CAP})</div><div class="grid">${list}${o.animals.length < PEN_CAP ? `<div class="card" data-act="buy"><div class="pic" style="opacity:.6"><img class="ii" src="${animalThumb(a.id, 0)}"></div><div class="nm">Køb ${a.name.toLowerCase()}</div><button class="btn y sm">${svgIcon('coin')} ${fmt(animalPrice(a, owned))}</button></div>` : ''}</div>`;
      },
      act: (act) => {
        if (act === 'feed') { G.feedPen(o); this.renderPanel(true); }
        if (act === 'collect') { G.collectPen(o); this.renderPanel(true); }
        if (act === 'buy') { G.buyAnimal(o); this.renderPanel(true); }
        if (act === 'speedall') { const t = now(); const busy = o.animals.filter(an => an.readyAt && t < an.readyAt); const cost = G.speedCost(busy.reduce((m, an) => Math.max(m, an.readyAt - t), 0)) + busy.length - 1; if (G.spend(0, cost)) { busy.forEach(an => an.readyAt = t); SND.play('magic'); G.saveSoon(); this.renderPanel(true); } }
        if (act === 'move') { this.closeSheet(); W.startPlace('pen', o.k, o); }
      }
    };
    this.showSheet(p);
  },

  /* ---------- storage ---------- */
  storagePanel(tab = 'barn') {
    const p = {
      id: 'storage', title: 'Lager', tab, tabs: [['barn', 'Lade', iconImg('plank')], ['silo', 'Silo', iconImg('wheat')]],
      sel: null, sellN: 1,
      sig: () => JSON.stringify(G.S.inv).length + p.tab + G.S.siloCap + G.S.barnCap,
      render: () => {
        const st = p.tab, used = G.used(st), cap = G.cap(st);
        const items = Object.keys(G.S.inv).filter(k => G.storeOf(k) === st && G.S.inv[k] > 0).sort((a, b) => (ITEMS[a].cat === 'material') - (ITEMS[b].cat === 'material') || ITEMS[a].level - ITEMS[b].level);
        const need = G.upgradeNeed(st), miss = G.missing(need);
        const sel = p.sel && G.count(p.sel) ? p.sel : null;
        return `<div class="row"><div class="pic">${iconImg(st === 'silo' ? 'wheat' : 'bread')}</div><div class="txt"><b>${st === 'silo' ? 'Silo' : 'Lade'}: ${used} / ${cap}</b><div class="bar ${used >= cap ? 'full' : ''}"><i style="width:${Math.min(100, used / cap * 100)}%"></i></div></div></div>
          ${sel ? `<div class="row"><div class="pic">${iconImg(sel)}</div><div class="txt"><b>${ITEMS[sel].name} (${G.count(sel)})</b><small>Værdi ${ITEMS[sel].value} ${svgIcon('coin')} · hurtigsalg giver ${Math.max(1, Math.floor(ITEMS[sel].value * .5))} pr. stk</small><div class="stepper" style="justify-content:flex-start;margin-top:4px"><button data-act="n-">−</button><b>${p.sellN}</b><button data-act="n+">+</button></div></div><button class="btn y sm" data-act="sell">Sælg<br>${svgIcon('coin')}${fmt(Math.max(1, Math.floor(ITEMS[sel].value * .5)) * p.sellN)}</button></div>` : '<p class="hint">Tryk på en vare for at sælge den direkte. Du får bedre priser i vejboden!</p>'}
          <div class="tiles">${items.map(k => `<div class="tile ${k === sel ? 'sel' : ''}" data-act="sel" data-k="${k}">${iconImg(k)}<span class="cnt">${G.S.inv[k]}</span></div>`).join('') || '<p class="hint">Tomt</p>'}</div>
          <div class="sec">Opgradér ${st === 'silo' ? 'silo' : 'lade'} (+${G.upgradeAmount(st)} pladser)</div>
          <div class="row"><div class="ing" style="flex:1;justify-content:space-around">${Object.keys(need).map(k => `<div class="i ${G.count(k) >= need[k] ? 'ok' : 'no'}" style="width:60px"><img src="${iconURL(k)}" style="width:42px;height:42px">${ITEMS[k].name}<br>${G.count(k)}/${need[k]}</div>`).join('')}</div>
          ${Object.keys(miss).length ? `<button class="btn b sm" data-act="upg">${svgIcon('gem')} ${Object.values(miss).reduce((s, v) => s + v, 0) * 6}<br>Køb rest</button>` : `<button class="btn" data-act="upg">Opgradér</button>`}</div>
          <p class="hint">Byggematerialer findes tilfældigt når du høster, samler og leverer ordrer.</p>`;
      },
      act: (a, el) => {
        if (a === 'sel') { p.sel = el.dataset.k; p.sellN = 1; SND.play('tick'); this.renderPanel(true); }
        if (a === 'n-') { p.sellN = Math.max(1, p.sellN - 1); this.renderPanel(true); }
        if (a === 'n+') { p.sellN = Math.min(G.count(p.sel), p.sellN + 1); this.renderPanel(true); }
        if (a === 'sell') { G.sellDirect(p.sel, p.sellN); p.sellN = 1; this.renderPanel(true); }
        if (a === 'upg') { const miss = G.missing(G.upgradeNeed(p.tab)); if (Object.keys(miss).length) this.confirm('Køb materialer', `Køb de manglende materialer og opgradér for ${Object.values(miss).reduce((s, v) => s + v, 0) * 6} diamanter?`, 'Opgradér', () => { G.upgrade(p.tab, true); this.renderPanel(true); }, 'b'); else { G.upgrade(p.tab); this.renderPanel(true); } }
      }
    };
    this.showSheet(p);
  },

  /* ---------- orders ---------- */
  ordersPanel() {
    const p = {
      id: 'orders', title: 'Lastbilordrer',
      sig: () => G.S.orders.map(o => o ? (o.cooldown ? 'c' : G.canDeliver(o) ? 'y' : 'n') : '-').join('') + (now() < G.S.truckBack ? 'T' : ''),
      render: () => {
        const t = now(), away = t < G.S.truckBack;
        return `${away ? `<div class="row"><div class="pic">${svgIcon('orders')}</div><div class="txt"><b>Lastbilen er ude at levere</b><small>Tilbage om <span data-end="${G.S.truckBack}">${fmtTime(G.S.truckBack - t)}</span></small></div></div>` : ''}<div class="grid g3">${G.S.orders.map((o, i) => {
          if (!o) return '';
          if (o.cooldown) return `<div class="ocard"><div class="pin"></div><div style="margin-top:20px;font-weight:700;color:#8a6a4a">Ny ordre om</div><div style="font-size:18px;font-weight:700" data-end="${o.cooldown}">${fmtTime(o.cooldown - t)}</div><button class="btn b sm" data-act="spd" data-i="${i}">${svgIcon('gem')} ${G.speedCost(o.cooldown - t)}</button></div>`;
          const can = G.canDeliver(o);
          return `<div class="ocard ${can ? 'can' : ''}"><div class="pin"></div><button class="tr" data-act="del" data-i="${i}">✕</button><div class="its" style="margin-top:10px">${Object.keys(o.items).map(k => `<div class="i" style="color:${G.count(k) >= o.items[k] ? '#2a8a12' : '#c03224'}">${iconImg(k)}${G.count(k)}/${o.items[k]}</div>`).join('')}</div>
            <div class="rw"><span class="price">${svgIcon('coin')}${fmtK(o.coins)}</span><span class="price">${svgIcon('star')}${fmtK(o.xp)}</span></div>${o.bonus || o.gems ? `<div class="rw">${o.gems ? `<span class="price">${svgIcon('gem')}+${o.gems}</span>` : ''}${o.bonus ? Object.keys(o.bonus).map(k => `<span class="price"><img src="${iconURL(k)}" style="width:20px">+1</span>`).join('') : ''}</div>` : ''}
            <button class="btn sm ${can ? '' : 'g'}" data-act="go" data-i="${i}" ${can && !away ? '' : 'disabled'}>Lever</button></div>`;
        }).join('')}</div>`;
      },
      act: (a, el, e) => {
        const i = +el.dataset.i;
        if (a === 'go') { const r = el.getBoundingClientRect(); if (G.deliverOrder(i, r.left + r.width / 2, r.top)) { this.renderPanel(true); } }
        if (a === 'del') this.confirm('Slet ordre', 'Vil du kassere ordren? Der kommer en ny om 6 minutter.', 'Slet', () => { G.deleteOrder(i); this.renderPanel(true); }, 'r');
