  /* ---------- roadside ---------- */
  roadside() {
    const p = {
      id: 'roadside', title: 'Vejbod', mode: 'slots', slot: -1, item: null, qty: 1, price: 1,
      sig: () => p.mode + G.S.shop.slots.map(s => s ? (s.sold ? 'S' : 'L') : '-').join('') + G.S.shop.slots.length,
      render: () => {
        if (p.mode === 'pick') {
          const items = Object.keys(G.S.inv).filter(k => G.S.inv[k] > 0 && ITEMS[k].cat !== 'material' || (ITEMS[k].cat === 'material' && G.S.inv[k] > 0));
          const it = p.item ? ITEMS[p.item] : null;
          return `<div class="flex"><button class="btn g sm" data-act="back">← Tilbage</button><b>Vælg en vare at sælge</b></div>
            ${it ? `<div class="row" style="margin-top:8px"><div class="pic">${iconImg(p.item)}</div><div class="txt"><b>${it.name}</b><div class="flex" style="margin-top:6px;flex-wrap:wrap"><span class="desc">Antal</span><div class="stepper"><button data-act="q-">−</button><b>${p.qty}</b><button data-act="q+">+</button></div></div><div class="flex" style="margin-top:6px;flex-wrap:wrap"><span class="desc">Pris</span><div class="stepper"><button data-act="p-">−</button><b>${svgIcon('coin')}${fmt(p.price)}</b><button data-act="p+">+</button></div></div><small>${p.price > G.shopFair({ item: p.item, qty: p.qty }) * 1.3 ? 'Høj pris – sælges langsommere' : p.price < G.shopFair({ item: p.item, qty: p.qty }) * .85 ? 'Billig – sælges hurtigt' : 'Rimelig pris'}</small></div></div><div class="flex center"><button class="btn" data-act="list">Sæt til salg</button></div>` : ''}
            <div class="tiles" style="margin-top:8px">${items.map(k => `<div class="tile ${k === p.item ? 'sel' : ''}" data-act="pick" data-k="${k}">${iconImg(k)}<span class="cnt">${G.S.inv[k]}</span></div>`).join('') || '<p class="hint">Dit lager er tomt</p>'}</div>`;
        }
        const S = G.S.shop; const nextGem = (S.bought || 0) < SHOP_SLOT_GEMS.length && S.slots.length < SHOP_MAX;
        return `<p class="hint">Sæt varer til salg – kunder fra byen kommer forbi og køber dem.</p><div class="grid g3">${S.slots.map((s, i) => {
          if (!s) return `<div class="card" data-act="new" data-i="${i}" style="min-height:130px;justify-content:center;border-style:dashed"><div style="font-size:34px;color:#c8a070">+</div><div class="nm">Tom plads</div></div>`;
          if (s.sold) return `<div class="card" data-act="coll" data-i="${i}" style="min-height:130px;background:linear-gradient(#fffbe0,#ffe68a)"><div class="pic">${svgIcon('coin')}</div><div class="nm">Solgt!</div><div class="price">${svgIcon('coin')}${fmt(s.price)}</div></div>`;
          return `<div class="card" data-act="un" data-i="${i}" style="min-height:130px"><div class="pic">${iconImg(s.item)}<span class="cnt">×${s.qty}</span></div><div class="nm">${ITEMS[s.item].name}</div><div class="price">${svgIcon('coin')}${fmt(s.price)}</div><div class="meta">Til salg…</div></div>`;
        }).join('')}${nextGem ? `<div class="card locked" data-act="buyslot" style="min-height:130px;justify-content:center;filter:none;opacity:.85"><div class="pic">${svgIcon('lock')}</div><div class="nm">Ny plads</div><div class="price">${svgIcon('gem')} ${SHOP_SLOT_GEMS[S.bought || 0]}</div></div>` : ''}</div>`;
      },
      act: (a, el) => {
        const i = +el.dataset.i;
        if (a === 'new') { p.mode = 'pick'; p.slot = i; p.item = null; this.renderPanel(); }
        if (a === 'back') { p.mode = 'slots'; this.renderPanel(); }
        if (a === 'pick') { p.item = el.dataset.k; p.qty = Math.min(G.count(p.item), ITEMS[p.item].cat === 'crop' ? 10 : 1); p.price = G.shopFair({ item: p.item, qty: p.qty }); SND.play('tick'); this.renderPanel(true); }
        if (a === 'q-' || a === 'q+') { p.qty = clamp(p.qty + (a === 'q+' ? 1 : -1), 1, Math.min(10, G.count(p.item))); p.price = G.shopFair({ item: p.item, qty: p.qty }); this.renderPanel(true); }
        if (a === 'p-' || a === 'p+') { const step = Math.max(1, Math.round(ITEMS[p.item].value * p.qty * .05)); p.price = clamp(p.price + (a === 'p+' ? step : -step), 1, G.shopMax(p.item, p.qty)); this.renderPanel(true); }
        if (a === 'list') { if (G.listItem(p.slot, p.item, p.qty, p.price)) { p.mode = 'slots'; this.renderPanel(); } }
        if (a === 'coll') { const r = el.getBoundingClientRect(); G.collectSale(i, r.left + r.width / 2, r.top + 20); this.renderPanel(true); }
        if (a === 'un') { const s = G.S.shop.slots[i]; this.confirm('Fjern vare', `Tag ${ITEMS[s.item].name.toLowerCase()} af hylden igen?`, 'Fjern', () => { G.unlist(i); this.renderPanel(true); }, 'r'); }
        if (a === 'buyslot') this.confirm('Ny plads', `Køb en ekstra plads i vejboden for ${SHOP_SLOT_GEMS[G.S.shop.bought || 0]} diamanter?`, 'Køb', () => { G.buyShopSlot(); this.renderPanel(true); }, 'b');
      }
    };
    this.showSheet(p);
  },

  /* ---------- buy shop ---------- */
  shopPanel(tab = 'bld') {
    const tabs = [['bld', 'Bygninger', svgIcon('shop')], ['pen', 'Dyr', iconImg('egg')], ['crop', 'Marker', iconImg('wheat')], ['tree', 'Træer', iconImg('apple')], ['deco', 'Pynt', iconImg('bouquet')], ['exp', 'Udvidelser', svgIcon('map')]];
    const L = () => G.S.level;
    const p = {
      id: 'shop', title: 'Butik', tab, tabs,
      sig: () => p.tab + G.S.level + G.S.coins + G.S.objs.length,
      render: () => {
        const card = (t, k, name, price, lvl, extra = '', img) => { const lk = lvl > L(); const cb = lk ? 'lvl' : G.canBuy(t, k); const afford = G.S.coins >= price; return `<div class="card ${lk ? 'locked' : cb !== true ? 'dim' : ''}" data-act="buy" data-t="${t}" data-k="${k}">${lk ? `<span class="lock">${svgIcon('lock')} ${lvl}</span>` : ''}<div class="pic big"><img class="ii" src="${img || thumb(t, k)}"></div><div class="nm">${esc(name)}</div>${extra}<div class="price" style="color:${afford || lk ? '' : '#c03224'}">${svgIcon('coin')} ${fmtK(price)}</div>${!lk && cb !== true ? `<div class="meta" style="color:#a05a2a">${cb}</div>` : ''}</div>`; };
        if (p.tab === 'bld') return `<div class="grid">${PROD.map(b => { const B = BUILDINGS[b.id]; return card('bld', b.id, B.name, B.price, B.level, `<div class="meta">${svgIcon('clock')} ${fmtTime(B.buildTime * 1000)}</div>`); }).join('')}</div>`;
        if (p.tab === 'pen') return `<div class="grid">${ANIMALS.map(a => { const B = BUILDINGS[a.pen]; return card('pen', a.pen, a.penName, B.price, B.level, `<div class="meta">${iconImg(a.product, '').replace('class="ii', 'style="width:20px;height:20px" class="ii')} ${a.productName}</div>`); }).join('')}</div>`;
        if (p.tab === 'crop') { const owned = G.ownedCount('field'); return `<div class="grid">${card('field', 'field', 'Ny mark', fieldPrice(owned), 1, `<div class="meta">${owned}/${maxFields(L())} marker</div>`)}</div><div class="sec">Afgrøder</div><div class="grid">${CROPS.map(c => `<div class="card ${c.level > L() ? 'locked' : ''}" style="cursor:default">${c.level > L() ? `<span class="lock">${svgIcon('lock')} ${c.level}</span>` : ''}<div class="pic">${iconImg(c.id)}</div><div class="nm">${c.name}</div><div class="meta">${svgIcon('clock')} ${fmtTime(c.growTime * 1000)}</div><div class="meta">${svgIcon('coin')}${c.value} · ${svgIcon('star')}${c.xp}</div></div>`).join('')}</div><p class="hint">Afgrøder plantes ved at trykke på en tom mark.</p>`; }
        if (p.tab === 'tree') return `<p class="hint">Træer: ${G.ownedCount('tree')}/${maxTrees(L())}</p><div class="grid">${TREES.map(t => card('tree', t.id, t.name, t.price, t.level, `<div class="meta">${iconImg(t.fruit).replace('class="ii', 'style="width:20px;height:20px" class="ii')} ${fmtTime(t.time * 1000)}</div>`)).join('')}</div>`;
        if (p.tab === 'deco') return `<div class="grid">${DECOS.map(d => card('deco', d.id, d.name, d.price, d.level, `<div class="meta">${svgIcon('star')} ${d.xp}</div>`)).join('')}</div>`;
        if (p.tab === 'exp') { const list = PLOTS.filter(pl => !G.S.plots[pl.key]).sort((a, b) => a.idx - b.idx); return `<p class="hint">Udvid gården ved at købe jordstykker, der grænser op til din gård. Tryk på et skilt på kortet.</p><div class="grid">${list.slice(0, 18).map(pl => { const b = G.plotBuyable(pl.key); return `<div class="card ${!b || pl.level > L() ? 'locked' : ''}" data-act="plot" data-k="${pl.key}"><div class="pic big">${svgIcon('map').replace('class="svgi', 'style="font-size:72px" class="svgi')}</div><div class="nm">Jordstykke ${pl.idx + 1}</div><div class="meta">Niveau ${pl.level}</div><div class="price">${svgIcon('coin')} ${fmtK(pl.price)}</div>${pl.mats ? `<div class="meta">${MAT_LAND.map(m => `<img src="${iconURL(m)}" style="width:18px">${pl.mats}`).join(' ')}</div>` : ''}${b ? '' : '<div class="meta">Ikke tilstødende</div>'}</div>`; }).join('')}</div>`; }
        return '';
      },
      act: (a, el) => {
        if (a === 'plot') { const k = el.dataset.k, pl = PLOT_BY_KEY[k]; this.closeSheet(); W.focus((pl.c * PLOT + PLOT / 2) * T, (PLOT_Y0 + pl.r * PLOT + PLOT / 2) * T, Math.max(W.zMin(), W.defaultZoom() * .8)); setTimeout(() => this.expansion(k), 450); return; }
        if (a !== 'buy') return;
        const t = el.dataset.t, k = el.dataset.k; const cb = G.canBuy(t, k);
        if (cb === 'lvl') { const lvl = t === 'deco' ? DECO[k].level : t === 'tree' ? TREE[k].level : BUILDINGS[k].level; this.toast('Låses op på niveau ' + lvl, 'info'); SND.play('error'); return; }
        if (cb !== true) { this.toast(cb, 'info'); SND.play('error'); return; }
        if (G.S.coins < G.shopPrice(t, k)) { this.toast('Ikke nok mønter', 'bad'); SND.play('error'); return; }
        this.closeSheet(); W.startPlace(t, k);
      }
    };
    this.showSheet(p);
  },
  placeBar() {
    const P = W.place, bar = $('#placebar');
    if (!P) { bar.classList.remove('on'); return; }
    const ok = G.canPlace(P.t, P.k, P.x, P.y, P.moveId);
    const name = P.t === 'field' ? 'Mark' : P.t === 'tree' ? TREE[P.k].name : P.t === 'deco' ? DECO[P.k].name : BUILDINGS[P.k].name;
    const price = P.moveId ? 0 : G.shopPrice(P.t, P.k);
    bar.innerHTML = `<button class="btn r round" id="pl-x">${SVG.close}</button><div class="lab">${esc(name)}${price ? ` · ${svgIcon('coin')} ${fmt(price)}` : ''}${ok === 'water' ? '<br><small>Skal ligge ved vandet</small>' : ''}</div><button class="btn round" id="pl-ok" ${ok === true ? '' : 'disabled'}>${SVG.check}</button>`;
    bar.classList.add('on');
    $('#pl-x').onclick = () => { W.place = null; this.placeBar(); SND.play('close'); };
    $('#pl-ok').onclick = () => {
      const P2 = W.place; if (!P2 || G.canPlace(P2.t, P2.k, P2.x, P2.y, P2.moveId) !== true) return;
      if (P2.moveId) { G.moveObj(G.obj(P2.moveId), P2.x, P2.y); W.place = null; SND.play('place'); W.burst((P2.x + 1) * T, (P2.y + 1) * T, 'dust', 12); this.placeBar(); return; }
      const o = G.placeNew(P2.t, P2.k, P2.x, P2.y); if (!o) return;
      const repeat = (P2.t === 'field' || (P2.t === 'deco' && ['fence', 'path', 'hedge', 'flowerbed'].includes(DECO[P2.k].kind))) && G.canBuy(P2.t, P2.k) === true && G.S.coins >= G.shopPrice(P2.t, P2.k);
      if (repeat) { const [w, h] = G.sizeOfDef(P2.t, P2.k); const cands = [[w, 0], [0, h], [-w, 0], [0, -h]]; let nx = null; for (const [dx, dy] of cands) if (G.canPlace(P2.t, P2.k, P2.x + dx, P2.y + dy) === true) { nx = { x: P2.x + dx, y: P2.y + dy }; break; } if (nx) { W.place = { t: P2.t, k: P2.k, x: nx.x, y: nx.y, moveId: 0 }; this.placeBar(); return; } }
      W.place = null; this.placeBar();
    };
  },
  expansion(key) {
    const p = PLOT_BY_KEY[key]; const b = G.plotBuyable(key);
    const mats = p.mats ? `<div class="ing" style="margin:8px 0">${MAT_LAND.map(m => `<div class="i ${G.count(m) >= p.mats ? 'ok' : 'no'}" style="width:70px"><img src="${iconURL(m)}" style="width:44px;height:44px">${ITEMS[m].name}<br>${G.count(m)}/${p.mats}</div>`).join('')}</div>` : '';
    const lvlOk = G.S.level >= p.level;
    this.modal(`<div class="mpic">${svgIcon('map').replace('class="svgi', 'style="font-size:100px" class="svgi')}</div><p><b>Jordstykke ${p.idx + 1}</b></p>${b ? '' : '<p class="desc">Dette jordstykke grænser ikke op til din gård endnu.</p>'}<div class="kv"><span>Kræver niveau</span><b style="color:${lvlOk ? '#2a8a12' : '#c03224'}">${p.level}</b></div><div class="kv"><span>Pris</span><b>${svgIcon('coin')} ${fmt(p.price)}</b></div><div class="kv"><span>Belønning</span><b>${svgIcon('star')} ${fmt(p.xp)}</b></div>${mats}${p.mats ? '<p class="hint">Skøder, mukkerter og landpæle findes ved høst, ordrer og daglige gaver.</p>' : ''}<div class="btns"><button class="btn y" data-act="buy" ${b && lvlOk ? '' : 'disabled'}>Køb jorden</button></div>`, { title: 'Udvid gården', act: (a, el, close) => { close(); G.expand(key); } });
  },
  visitor(v) {
    const i = G.S.visitors.indexOf(v); if (i < 0) return; const P = NPCS[v.npc];
    const can = G.has(v.items);
    this.modal(`<img class="npcpic" src="${npcThumb(v.npc)}"><p><b>${P.name}</b>: ${pick(['Hej! Har du mon ikke lidt til mig?', 'Goddag! Jeg skal bruge et par ting.', 'Hejsa! Kan jeg købe noget af dig?', 'Dav! Jeg har hørt du har de bedste varer.'])}</p><div class="ocard ${can ? 'can' : ''}" style="min-height:0"><div class="its">${Object.keys(v.items).map(k => `<div class="i" style="width:56px;color:${G.count(k) >= v.items[k] ? '#2a8a12' : '#c03224'}">${iconImg(k)}${G.count(k)}/${v.items[k]}</div>`).join('')}</div><div class="rw"><span class="price">${svgIcon('coin')}${fmt(v.coins)}</span><span class="price">${svgIcon('star')}${fmt(v.xp)}</span></div></div><div class="btns"><button class="btn r" data-act="no">Nej tak</button><button class="btn" data-act="yes" ${can ? '' : 'disabled'}>Sælg</button></div>`, { title: 'Besøgende', act: (a, el, close) => { const r = el.getBoundingClientRect(); close(); if (a === 'yes') G.serveVisitor(G.S.visitors.indexOf(v), r.left + 40, r.top); else G.dismissVisitor(G.S.visitors.indexOf(v)); } });
  },

  /* ---------- quests & achievements ---------- */
  questsPanel(tab = 'q') {
    const p = {
      id: 'quests', title: 'Opgaver', tab, tabs: [['q', 'Opgaver', svgIcon('quests')], ['ach', 'Præstationer', svgIcon('trophy')]],

    if (!tg) return null;
    if (tg.o) { const o = tg.o, [w, h] = G.sizeOf(o); const extra = o.t === 'bld' ? 1.4 * T : o.t === 'pen' ? .4 * T : 0; const a = W.toScreen(o.x * T, o.y * T - extra), b = W.toScreen((o.x + w) * T, (o.y + h) * T); return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y, world: true, o }; }
    if (tg.getBoundingClientRect) { const r = tg.getBoundingClientRect(); if (!r.width) return null; return { x: r.left, y: r.top, w: r.width, h: r.height }; }
    return null;
  },
  show() {
    const s = this.steps[this.i]; if (!s) return this.finish();
    G.S.tut.step = this.i; G.tutSpeed = s.speed !== false;
    if (s.onEnter) s.onEnter();
    const pic = makeCanvas(172, 220); const x = pic.getContext('2d'); x.translate(86, 214); x.scale(4.2, 4.2); drawPerson(x, GUIDE, { face: 1, t: 0, wave: true });
    this.el.innerHTML = `<div class="hole" style="display:none"></div><div class="hand" style="display:none">${HAND}</div><div class="say ${s.top ? 'top' : ''}"></div>`;
    const say = this.el.querySelector('.say'); say.appendChild(pic); pic.style.width = '86px'; pic.style.height = '110px';
    const b = document.createElement('div'); b.className = 'b'; b.innerHTML = `<h4>${GUIDE.name}</h4>${s.text}<div class="btns">${s.final ? '' : '<button class="btn sm g" id="tutskip">Spring over</button>'}${s.btn ? `<button class="btn sm y" id="tutnext">${s.btn}</button>` : ''}</div>`; say.appendChild(b);
    if (s.btn) $('#tutnext').onclick = () => { SND.play('click'); this.next(); };
    const sk = $('#tutskip'); if (sk) sk.onclick = () => UI.confirm('Spring over', 'Vil du springe introduktionen over?', 'Spring over', () => this.finish(true));
    this.focused = false; G.save();
  },
  update() {
    const s = this.steps[this.i]; if (!s) return;
    if (s.check && s.check()) { this.next(); return; }
    const tg = s.target ? s.target() : null; let r = this.rectOf(tg);
    const hole = this.el.querySelector('.hole'), hand = this.el.querySelector('.hand'), say = this.el.querySelector('.say');
    if (r && r.world && ($('.sheet.open') || W.place)) r = null;
    if (!r || UI.modalOpen) { hole.style.display = 'none'; hand.style.display = 'none'; if (say) say.style.display = UI.modalOpen ? 'none' : ''; return; }
    if (say) { say.style.display = ''; say.classList.toggle('mini', !!$('.sheet.open')); }
    if (r.world && !this.focused && (r.x < 20 || r.x + r.w > innerWidth - 20 || r.y < 90 || r.y + r.h > innerHeight - 220)) { const o = r.o, [w, h] = G.sizeOf(o); W.focus((o.x + w / 2) * T, (o.y + h / 2) * T + 40); this.focused = true; }
    const pad = 8; hole.style.display = 'block'; Object.assign(hole.style, { left: r.x - pad + 'px', top: r.y - pad + 'px', width: r.w + pad * 2 + 'px', height: r.h + pad * 2 + 'px' });
    hand.style.display = 'block'; hand.style.left = (r.x + r.w / 2) + 'px'; hand.style.top = (r.y + r.h / 2) + 'px';
    const inSheet = !!$('.sheet.open'); if (say) { const low = r.y + r.h / 2 > innerHeight * .55; say.classList.toggle('top', low || inSheet || !!s.top || !!W.place); say.classList.toggle('mini', inSheet); }
    hole.style.boxShadow = inSheet || W.place ? '0 0 0 9999px rgba(20,12,4,0)' : '';
  },
  next() { SND.play('reward'); this.i++; if (this.i >= this.steps.length) return this.finish(); this.show(); },
  finish(skipped) {
    clearInterval(this.timer); G.tutSpeed = false; document.body.classList.remove('tutor'); G.S.tut = { step: this.steps.length, done: true }; if (this.el) this.el.innerHTML = '';
    if (!skipped) { G.addGems(10); G.addCoins(200); G.addXP(40); UI.confetti(90); UI.toast('Introduktion fuldført! +10 diamanter', 'good'); }
    G.save(); setTimeout(() => { if (G.dailyAvailable()) UI.later(() => UI.daily()); }, 1200);
  },
};

/* ============ BOOT ============ */
(function boot() {
  const bar = $('#loadbar');
  const setP = p => { if (bar) bar.style.width = (p * 100) + '%'; };
  // splash art
  const sp = $('#splashart');
  if (sp) { const c = sp.getContext('2d'); c.scale(sp.width / 180, sp.height / 140); c.translate(90, 128); c.save(); c.scale(.55, .55); c.translate(-96, -170); drawBarn(c, 192, 192, { lights: [], smoke: [] }); c.restore(); c.save(); c.translate(-62, 0); c.scale(1.8, 1.8); drawAnimalBody(c, 'chicken', { t: 0, state: 'idle', face: 1 }); c.restore(); c.save(); c.translate(64, 2); c.scale(1.3, 1.3); drawAnimalBody(c, 'cow', { t: 0, state: 'idle', face: -1 }); c.restore(); }
  setP(.1);
  const go = () => {
    try {
      const loaded = G.load(); setP(.3);
      G.rebuildGrid(); G.fillOrders(); Quests.ensure();
      while (G.S.shop.slots.length < shopSlotsFree(G.S.level) + (G.S.shop.bought || 0)) G.S.shop.slots.push(null);
      while (G.S.orders.length < orderSlots(G.S.level)) G.S.orders.push(null);
      const off = loaded ? G.offlineSummary() : null; setP(.5);
      // pre-warm common sprites
      ['house', 'barn', 'silo', 'shop', 'board', 'bakery'].forEach(k => buildingSprite(k)); fieldSprite(); setP(.7);
      W.init(); UI.init(); setP(.9);
      G.checkAllAch(); G.save();
      let lastT = performance.now();
      const loop = ts => { try { W.frame(ts); } catch (e) { console.error(e); } requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
      setInterval(() => { try { G.tick(); } catch (e) { console.error(e); } }, 1000);
      setP(1);
      setTimeout(() => { $('#loading').classList.add('hide'); setTimeout(() => $('#loading').remove(), 700); }, 250);
      setTimeout(() => {
        Tut.init();
        if (off) UI.later(() => UI.welcomeBack(off));
        if (G.S.tut.done && G.dailyAvailable()) setTimeout(() => UI.later(() => UI.daily()), 600);
      }, 500);
      let hiddenAt = 0;
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { hiddenAt = now(); G.save(); if (SND.ctx) SND.ctx.suspend(); }
        else { if (SND.ctx) SND.ctx.resume(); if (hiddenAt && now() - hiddenAt > 90000) { G.S.lastSeen = hiddenAt; const r = G.offlineSummary(); if (r) UI.later(() => UI.welcomeBack(r)); } hiddenAt = 0; }
      });
      addEventListener('pagehide', () => G.save());
      addEventListener('beforeunload', () => G.save());
      document.addEventListener('gesturestart', e => e.preventDefault());
    } catch (e) { console.error(e); $('#loading .sub').textContent = 'Fejl ved opstart: ' + e.message; }
  };
  const fontWait = document.fonts && document.fonts.load ? Promise.race([Promise.all([document.fonts.load('700 16px Fredoka'), document.fonts.load('500 16px Fredoka')]), new Promise(r => setTimeout(r, 1800))]) : Promise.resolve();
  fontWait.then(() => setTimeout(go, 60), () => setTimeout(go, 60));
})();

</script>
