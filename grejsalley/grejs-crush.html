  <script>
/* js/levels.js */
/* ==========================================================================
   GREJS CRUSH – levels.js
   Al level-data. Adskilt fra spil-logikken (spec §61).

   Hvordan baner laves:
     1) LEVEL_OVERRIDES  – håndlavede baner (tutorial m.m.). Et override kan
        angive ethvert felt og erstatter det genererede.
     2) generateLevel(id) – deterministisk designer: vælger board-form,
        mål, forhindringer og farver ud fra verden og sværhedsgrad. Samme id
        giver altid samme bane.
     3) BALANCE – tabel produceret af tools/balance.js (bot-simulering), der
        sætter antal træk/tid og stjernegrænser for hver bane.

   Tilføj nye baner:  hæv GC.Levels.COUNT (fx til 300). Generatoren fortsætter
   automatisk med nye verdener. Kør evt. `node tools/balance.js 201 300` for at
   finjustere træk og stjerner – ellers bruges en sikker formel.

   Layout-tegn:  .  normal celle     _  hul (ingen celle)
                 1 2 3  kasse med 1-3 lag     B / b  lakrids (2 / 1 hits)
                 C  chokolade        I / K  brik i is (1 / 2 lag)     L  låst brik
   Jelly-lag:    0 ingen, 1 enkelt, 2 dobbelt
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};

  // --------------------------------------------------------------------------
  //  Verdener (spec §5, §56, §58)
  // --------------------------------------------------------------------------
  const WORLDS = [
    { id: 1, name: 'Grejs Eng', char: 'grejs', theme: 'meadow', mech: 'Grundspillet', bg: ['#8fe388', '#4fb86a'], music: 0 },
    { id: 2, name: 'Sukkerdalen', char: 'mox', theme: 'sugar', mech: 'Jelly', bg: ['#ffc2e2', '#f07ab8'], music: 1 },
    { id: 3, name: 'Chokoladebjergene', char: 'choko', theme: 'choco', mech: 'Is', bg: ['#c99a78', '#7a4a2e'], music: 2 },
    { id: 4, name: 'Jelly Jungle', char: 'brix', theme: 'jungle', mech: 'Chokolade', bg: ['#9be15d', '#2f9e61'], music: 3 },
    { id: 5, name: 'Karamel Kysten', char: 'guffe', theme: 'caramel', mech: 'Låste brikker', bg: ['#ffd98a', '#f0a13b'], music: 4 },
    { id: 6, name: 'Frostland', char: 'frosty', theme: 'frost', mech: 'Kasser med flere lag', bg: ['#d6f1ff', '#7cc4f0'], music: 5 },
    { id: 7, name: 'Krystalgrotterne', char: 'kalle', theme: 'crystal', mech: 'Combo-baner', bg: ['#c7a8ff', '#6b47c9'], music: 6 },
    { id: 8, name: 'Magisk By', char: 'tut', theme: 'magic', mech: 'Blandede mål', bg: ['#a8b8ff', '#4a5bd1'], music: 7 },
    { id: 9, name: 'Lavaøen', char: 'lars', theme: 'lava', mech: 'Chokolade-lava', bg: ['#ffab7a', '#d8432e'], music: 8 },
    { id: 10, name: 'Grejs Slottet', char: 'grejsking', theme: 'castle', mech: 'Alt på én gang', bg: ['#e8c7ff', '#8a4fc9'], music: 9 }
  ];
  // Ekstra verdener til fremtidige baner (201+) genbruger temaer med nye navne.
  const EXTRA_WORLD_NAMES = ['Boble Bugten', 'Skyggeskoven', 'Stjernestien', 'Honningheden', 'Tordentoppen'];

  function worldOf(id) {
    const idx = Math.floor((id - 1) / 20);
    if (idx < WORLDS.length) return WORLDS[idx];
    const base = WORLDS[idx % WORLDS.length];
    return Object.assign({}, base, { id: idx + 1, name: EXTRA_WORLD_NAMES[(idx - WORLDS.length) % EXTRA_WORLD_NAMES.length] + ' ' + (Math.floor((idx - WORLDS.length) / EXTRA_WORLD_NAMES.length) + 1) });
  }

  // Ingredienser (spec §22)
  const INGREDIENTS = [
    { id: 0, name: 'Æble', emoji: '🍎' },
    { id: 1, name: 'Hasselnød', emoji: '🌰' },
    { id: 2, name: 'Kirsebær', emoji: '🍒' },
    { id: 3, name: 'Cupcake', emoji: '🧁' },
    { id: 4, name: 'Eliksir', emoji: '🧪' }
  ];

  // --------------------------------------------------------------------------
  //  Board-former
  // --------------------------------------------------------------------------
  const SHAPES = {
    rect: (w, h) => grid(w, h, () => true),
    cutCorners: (w, h) => grid(w, h, (x, y) => !((x === 0 || x === w - 1) && (y === 0 || y === h - 1))),
    bigCorners: (w, h) => grid(w, h, (x, y) => {
      const cx = Math.min(x, w - 1 - x), cy = Math.min(y, h - 1 - y);
      return cx + cy >= 2;
    }),
    diamond: (w, h) => grid(w, h, (x, y) => {
      const cx = (w - 1) / 2, cy = (h - 1) / 2;
      return Math.abs(x - cx) / (w / 2) + Math.abs(y - cy) / (h / 2) <= 1.25;
    }),
    cross: (w, h) => grid(w, h, (x, y) => {
      const bx = Math.floor(w / 4), by = Math.floor(h / 4);
      return !((x < bx || x >= w - bx) && (y < by || y >= h - by));
    }),
    hourglass: (w, h) => grid(w, h, (x, y) => {
      const cy = (h - 1) / 2, cx = (w - 1) / 2;
      const allowed = 1 + Math.abs(y - cy) / cy * (cx) + 0.6;
      return Math.abs(x - cx) <= allowed;
    }),
    ring: (w, h) => grid(w, h, (x, y) => {
      const cx = (w - 1) / 2, cy = (h - 1) / 2;
      return !(Math.abs(x - cx) < 1 && Math.abs(y - cy) < 1.6);
    }),
    pillars: (w, h) => grid(w, h, (x, y) => !(y < 2 && (x === Math.floor(w / 2) || x === Math.ceil(w / 2) - 1) && w % 2 === 0) || y >= 2),
    heart: (w, h) => grid(w, h, (x, y) => {
      const cx = (w - 1) / 2;
      if (y === 0 && (x === 0 || x === w - 1 || Math.abs(x - cx) < 1)) return false;
      const rowsFromBottom = h - 1 - y;
      if (rowsFromBottom < Math.floor(w / 2) - 1) return Math.abs(x - cx) <= rowsFromBottom + 0.6;
      return true;
    }),
    stairs: (w, h) => grid(w, h, (x, y) => !(y < 2 && x < 2) && !(y < 2 && x > w - 3) && !(y > h - 3 && (x === 0 || x === w - 1))),
    arch: (w, h) => grid(w, h, (x, y) => {
      const cx = (w - 1) / 2;
      return !(y > h - 3 && Math.abs(x - cx) < 1.1);
    }),
    twinTowers: (w, h) => grid(w, h, (x, y) => {
      const cx = (w - 1) / 2;
      return !(y < Math.floor(h / 3) && Math.abs(x - cx) < 1.1);
    }),
    zigzag: (w, h) => grid(w, h, (x, y) => !((y % 3 === 1) && (x === 0 || x === w - 1))),
    frame: (w, h) => grid(w, h, (x, y) => !(x >= 2 && x <= w - 3 && y >= 2 && y <= h - 3 && (x === 2 || x === w - 3) && (y === 2 || y === h - 3)))
  };
  const SHAPE_NAMES = Object.keys(SHAPES);

  function grid(w, h, fn) {
    const rows = [];
    for (let y = 0; y < h; y++) {
      let s = '';
      for (let x = 0; x < w; x++) s += fn(x, y) ? '.' : '_';
      rows.push(s);
    }
    return rows;
  }

  // --------------------------------------------------------------------------
  //  Mønstre til placering af forhindringer og jelly (spejlet symmetrisk)
  // --------------------------------------------------------------------------
  const PATTERNS = {
    center: (w, h, x, y) => x >= Math.floor(w / 2) - 1 && x <= Math.ceil(w / 2) && y >= Math.floor(h / 2) - 1 && y <= Math.ceil(h / 2),
    bigCenter: (w, h, x, y) => x >= 2 && x <= w - 3 && y >= 2 && y <= h - 3,
    border: (w, h, x, y) => x === 0 || y === h - 1 || x === w - 1,
    bottom: (w, h, x, y) => y >= h - 2,
    bottomHalf: (w, h, x, y) => y >= Math.floor(h / 2),
    middleRow: (w, h, x, y) => y === Math.floor(h / 2) || y === Math.floor(h / 2) - 1,
    oneRow: (w, h, x, y) => y === Math.floor(h * 0.6),
    checker: (w, h, x, y) => (x + y) % 2 === 0 && y >= 2,
    columns: (w, h, x, y) => (x === 1 || x === w - 2) && y >= 1,
    corners: (w, h, x, y) => Math.min(x, w - 1 - x) + Math.min(y, h - 1 - y) <= 1,
    diagonal: (w, h, x, y) => x === y || x === w - 1 - y,
    xcross: (w, h, x, y) => Math.abs(x - (w - 1) / 2) < 1 || Math.abs(y - (h - 1) / 2) < 1,
    lowerBand: (w, h, x, y) => y >= h - 3 && y <= h - 2,
    all: () => true
  };

  // --------------------------------------------------------------------------
  //  Håndlavede tutorial-baner (spec §6, §82)
  // --------------------------------------------------------------------------
  const R8 = ['........', '........', '........', '........', '........', '........', '........', '........'];
  const LEVEL_OVERRIDES = {
    1: { w: 7, h: 7, layout: grid(7, 7, () => true), colors: 4, goals: [{ type: 'score', target: 1500 }], moves: 20, stars: [1500, 8000, 15000],
      tip: 'Byt to brikker, så tre ens står på række. Det er et match!', teach: 'match3' },
    2: { w: 7, h: 7, layout: SHAPES.cutCorners(7, 7), colors: 4, goals: [{ type: 'color', color: 0, count: 18 }], moves: 20,
      tip: 'Match 4 ens på række for at lave en STRIBE-BRIK. Den rydder en hel række!', teach: 'match4' },
    3: { w: 8, h: 8, layout: R8, colors: 4, goals: [{ type: 'specials', count: 3 }], moves: 22,
      tip: 'Lav L- eller T-former for en BOMBE, og 5 på række for en FARVEBOMBE!', teach: 'specials' },
    4: { w: 8, h: 8, layout: SHAPES.cutCorners(8, 8), colors: 4, goals: [{ type: 'matches', count: 18 }], moves: 20,
      tip: 'Når brikker falder og matcher af sig selv, får du COMBO-bonus!', teach: 'combos' },
    5: { w: 7, h: 8, layout: grid(7, 8, () => true), jelly: grid(7, 8, (x, y) => y >= 3 && x >= 1 && x <= 5).map((r) => r.replace(/\./g, '1').replace(/_/g, '0')),
      colors: 4, goals: [{ type: 'jelly' }], moves: 22,
      tip: 'Jelly ligger under brikkerne. Lav matches oven på det for at fjerne det!', teach: 'jelly' },
    8: { tip: 'Få ingredienserne ned til bunden af boardet. Pilene viser udgangen!' },
    14: { w: 8, h: 8, layout: SHAPES.heart(8, 8) },
    12: { tip: 'Kasser går i stykker, når du matcher ved siden af dem.' },
    15: { tip: 'Tidsbane! Lav så mange point som muligt, før uret løber ud.' },
    21: { tip: 'Dobbelt jelly skal rammes to gange. Mox tror på dig!' },
    41: { tip: 'Brikker i is kan ikke flyttes. Match dem to gange for at smelte isen.' },
    61: { tip: 'Pas på chokoladen! Den vokser, hvis du ikke fjerner et stykke hver tur.' },
    81: { tip: 'Låste brikker låses op, når du matcher ved siden af dem.' },
    101: { tip: 'Frostkasser har flere lag. Tallet viser, hvor mange hits der mangler.' },
    121: { tip: 'Krystalgrotterne elsker specialbrikker. Kombinér dem for enorme effekter!' },
    141: { tip: 'I Magisk By skal du klare flere mål på én gang.' },
    161: { tip: 'Lavaøen: chokoladen vokser hurtigt. Hold den nede!' },
    181: { tip: 'Velkommen til Grejs Slottet – den sidste udfordring!' }
  };

  // --------------------------------------------------------------------------
  //  Mekanik-introduktion (spec §58)
  // --------------------------------------------------------------------------
  function mechanics(id) {
    return {
      jelly: id >= 5, ingredients: id >= 8, crate: id >= 12, timed: id >= 15,
      jelly2: id >= 21, ice: id >= 41, choc: id >= 61, lock: id >= 81, crateMulti: id >= 101,
      licorice: id >= 101, comboHeavy: id >= 121, hybrid: id >= 141
    };
  }

  // Mål-vægte per verden (nye mekanikker fylder mest i "deres" verden).
  const GOAL_WEIGHTS = {
    1: { score: 4, color: 4, matches: 2, specials: 2, jelly: 2, ingredients: 3, blockers: 2, timed: 2 },
    2: { jelly: 8, score: 2, color: 2, ingredients: 2, timed: 1, specials: 1, blockers: 1 },
    3: { blockers: 6, jelly: 3, color: 2, ingredients: 2, score: 1, timed: 1, hybrid: 0 },
    4: { blockers: 5, jelly: 3, ingredients: 3, color: 2, timed: 1, score: 1 },
    5: { blockers: 5, jelly: 3, ingredients: 2, color: 2, specials: 1, timed: 1 },
    6: { blockers: 6, jelly: 3, ingredients: 2, color: 2, timed: 1 },
    7: { specials: 5, color: 2, jelly: 3, ingredients: 2, blockers: 2, timed: 1, hybrid: 1 },
    8: { hybrid: 7, jelly: 2, blockers: 2, ingredients: 2, color: 1, timed: 1 },
    9: { blockers: 4, hybrid: 4, jelly: 3, ingredients: 2, timed: 2 },
    10: { hybrid: 6, jelly: 3, blockers: 3, ingredients: 2, specials: 1, timed: 1 }
  };

  function weightedPick(rng, weights, avoid) {
    const entries = Object.entries(weights).filter(([k, v]) => v > 0 && k !== avoid);
    const total = entries.reduce((a, [, v]) => a + v, 0);
    let r = rng() * total;
    for (const [k, v] of entries) { r -= v; if (r <= 0) return k; }
    return entries[entries.length - 1][0];
  }

  // --------------------------------------------------------------------------
  //  Selve generatoren
  // --------------------------------------------------------------------------
  const genCache = new Map();

  function generateLevel(id, easeOverride) {
    // ease (0-3) gør en bane lettere: færre forhindringer, mindre dobbelt-jelly, færre farver.
    const ease = easeOverride != null ? easeOverride : (EASE[id] || 0);
    const rng = GC.makeRng(id * 7919 + 1301);
    const world = worldOf(id);
    const idx = (id - 1) % 20;             // 0..19 i verden
    const tier = Math.floor((id - 1) / 20); // 0..9
    const mech = mechanics(id);
    // Sværhedsgrad 1-10: stiger over hele spillet + lille savtak inde i hver verden.
    let difficulty = 1 + tier * 0.9 + idx * 0.04;
    if (idx === 9 || idx === 19) difficulty += 0.6;      // "boss"-baner
    if (idx < 2) difficulty -= 0.4;                      // blød start i ny verden
    difficulty = Math.round(GC.clamp(difficulty, 1, 10) * 10) / 10;

    // Størrelse
    const sizePool = tier === 0 ? (id < 10 ? [7, 7, 8] : [7, 8, 8]) : tier < 3 ? [7, 8, 8, 9] : [8, 8, 9, 9];
    let w = rng.pick(sizePool), h = rng.pick(sizePool);
    if (rng() < 0.35) h = w;
    if (h < w - 1) h = w - 1;

    // Form (tidlige baner er simple)
    let shapeName = 'rect';
    if (id > 6) {
      const pool = tier === 0 ? ['rect', 'cutCorners', 'cross', 'arch', 'rect'] : SHAPE_NAMES;
      shapeName = pool[(rng.int(pool.length) + id) % pool.length];
    }
    const layout = SHAPES[shapeName](w, h).map((r) => r.split(''));
    const isCell = (x, y) => layout[y] && layout[y][x] && layout[y][x] !== '_';

    // Mål
    let goalType;
    const prev = id > 1 ? (genCache.get(id - 1) || null) : null;
    const prevType = prev ? prev._goalType : null;
    const weights = Object.assign({}, GOAL_WEIGHTS[Math.min(world.id, 10)] || GOAL_WEIGHTS[10]);
    if (!mech.jelly) delete weights.jelly;
    if (!mech.ingredients) delete weights.ingredients;
    if (!mech.crate) delete weights.blockers;
    if (!mech.timed) delete weights.timed;
    if (!mech.hybrid) delete weights.hybrid;
    // Første bane i hver verden viser verdens mekanik frem.
    if (idx === 0 && tier === 1) goalType = 'jelly';
    else if (idx === 0 && tier >= 2 && tier <= 5) goalType = 'blockers';
    else if (idx === 0 && tier === 6) goalType = 'specials';
    else if (idx === 0 && tier >= 7) goalType = 'hybrid';
    else if (id === 8) goalType = 'ingredients';
    else if (id === 12) goalType = 'blockers';
    else if (id === 15) goalType = 'timed';
    else goalType = weightedPick(rng, weights, prevType);
    // Sidste bane i hver verden er en "boss" – aldrig en ren tidsbane.
    if (idx === 19 && goalType === 'timed') goalType = mech.hybrid ? 'hybrid' : mech.jelly ? 'jelly' : 'color';

    let colors = id <= 10 ? 4 : 5;
    if (tier >= 4 && rng() < 0.3) colors = 6;
    if (tier >= 7 && rng() < 0.45) colors = 6;
    if (tier >= 1 && rng() < 0.15) colors = 4; // lejlighedsvis en "combo-fest"
    if (mech.comboHeavy && world.id === 7) colors = rng() < 0.6 ? 4 : 5;
    if (ease >= 2) colors = Math.max(4, colors - 1);

    // Forhindringer
    const obstacleKinds = [];
    if (mech.crate) obstacleKinds.push('crate');
    if (mech.ice) obstacleKinds.push('ice');
    if (mech.choc) obstacleKinds.push('choc');
    if (mech.lock) obstacleKinds.push('lock');
    if (mech.licorice) obstacleKinds.push('licorice');
    // Verdens egen mekanik prioriteres
    const worldObstacle = { 3: 'ice', 4: 'choc', 5: 'lock', 6: 'crate', 9: 'choc' }[world.id];

    const pickPattern = (list) => list[rng.int(list.length)];
    const placeObstacle = (kind, pattern, density) => {
      let placed = 0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < Math.ceil(w / 2); x++) {
          if (!PATTERNS[pattern](w, h, x, y)) continue;
          if (rng() > density) continue;
          for (const xx of new Set([x, w - 1 - x])) {
            if (!isCell(xx, y) || layout[y][xx] !== '.') continue;
            if (y === 0 && kind !== 'ice' && kind !== 'lock') continue; // hold spawn-rækken fri
            let ch = '.';
            if (kind === 'crate') ch = String(mech.crateMulti ? GC.clamp(1 + rng.int(Math.min(3, tier - 3)), 1, 3) : 1);
            else if (kind === 'ice') ch = (tier >= 3 && rng() < 0.45) ? 'K' : 'I';
            else if (kind === 'choc') ch = 'C';
            else if (kind === 'lock') ch = 'L';
            else if (kind === 'licorice') ch = rng() < 0.5 ? 'B' : 'b';
            layout[y][xx] = ch;
            placed++;
          }
        }
      }
      return placed;
    };

    const obstaclePatterns = ['middleRow', 'center', 'bottom', 'checker', 'columns', 'corners', 'lowerBand', 'diagonal', 'xcross', 'oneRow'];
    let numObstacleTypes = 0;
    if (obstacleKinds.length) {
      const wantBlockers = goalType === 'blockers';
      let count = wantBlockers ? 1 + (tier >= 5 ? 1 : 0) + (tier >= 8 ? 1 : 0) : (rng() < 0.35 + tier * 0.06 ? 1 : 0) + (tier >= 6 && rng() < 0.4 ? 1 : 0);
      if (goalType === 'timed') count = Math.min(count, 1);
      const kinds = [];
      if (worldObstacle && obstacleKinds.includes(worldObstacle) && (wantBlockers || rng() < 0.6)) kinds.push(worldObstacle);
      while (kinds.length < count) {
        const k = rng.pick(obstacleKinds);
        if (!kinds.includes(k)) kinds.push(k); else if (kinds.length >= obstacleKinds.length) break; else if (rng() < 0.3) break;
      }
      for (const k of kinds) {
        const pat = pickPattern(obstaclePatterns);
        let dens = k === 'choc' ? 0.35 : 0.55 + Math.min(0.35, tier * 0.04);
        if (k === 'choc' && world.id === 9) dens = 0.5;
        dens *= 1 - ease * 0.22;
        if (placeObstacle(k, pat, dens) > 0) numObstacleTypes++;
      }
      // Sørg for at blocker-mål faktisk har forhindringer.
      if (wantBlockers && countObstacles(layout) < 4) placeObstacle(obstacleKinds.includes(worldObstacle) ? worldObstacle : obstacleKinds[0], 'middleRow', 1);
      // Begræns tæthed (max ~30 %) og sørg for at hver række har huller, så brikker kan falde igennem.
      limitObstacles(layout, rng, 0.3 - ease * 0.06);
      ensureFlow(layout, rng);
    }

    // Jelly
    let jelly = null;
    const hybridParts = [];
    if (goalType === 'hybrid') {
      const opts = ['jelly', 'ingredients', 'color', 'blockers', 'specials'].filter((o) => o !== 'blockers' || countObstacles(layout) >= 3);
      rng.shuffle(opts);
      hybridParts.push(opts[0], opts[1]);
    }
    const needJelly = goalType === 'jelly' || hybridParts.includes('jelly');
    if (needJelly) {
      const jp = id < 25 ? pickPattern(['center', 'bigCenter', 'bottomHalf', 'middleRow', 'lowerBand']) : pickPattern(['all', 'bigCenter', 'border', 'bottomHalf', 'checker', 'xcross', 'diagonal', 'corners']);
      const two = mech.jelly2 && ease < 1 && rng() < 0.25 + tier * 0.05;
      jelly = [];
      for (let y = 0; y < h; y++) {
        let s = '';
        for (let x = 0; x < w; x++) {
          const mx = Math.min(x, w - 1 - x);
          let v = 0;
          if (isCell(x, y) && PATTERNS[jp](w, h, mx, y)) v = two && PATTERNS.center(w, h, mx, y) ? 2 : 1;
          if (two && v === 1 && rng() < 0.2) v = 2;
          s += v;
        }
        jelly.push(s);
      }
      if (jelly.join('').replace(/0/g, '').length < 6) jelly = jelly.map((r, y) => r.split('').map((c, x) => (isCell(x, y) && y >= h - 3 ? '1' : c)).join(''));
    }

    // Ingredienser: hold exit-cellerne (nederste celle i hver kolonne) fri for forhindringer
    const needIng = goalType === 'ingredients' || hybridParts.includes('ingredients');
    let ingredients = null;
    if (needIng) {
      for (let x = 0; x < w; x++) {
        for (let y = h - 1; y >= 0; y--) if (isCell(x, y)) { if ('123BbC'.includes(layout[y][x])) layout[y][x] = '.'; break; }
      }
      let count = GC.clamp(2 + Math.floor(tier / 2) + rng.int(2), 2, 6);
      if (goalType === 'hybrid') count = Math.min(count, 3);
      if (ease) count = Math.max(2, count - ease);
      ingredients = { count, onBoard: 1, maxOnBoard: tier >= 4 ? 2 : 1, kinds: [id % 5] };
    }

    // Byg målene
    const goals = [];
    const colorGoal = () => {
      const n = tier < 2 ? rng.range(1, 2) : rng.range(1, 3);
      const cols = rng.shuffle([...Array(colors).keys()]).slice(0, n);
      let per = Math.round((n === 1 ? 30 + tier * 6 : n === 2 ? 20 + tier * 4 : 15 + tier * 3) / 5) * 5;
      if (goalType === 'hybrid') per = Math.max(10, Math.round(per * 0.6 / 5) * 5);
      for (const c of cols) goals.push({ type: 'color', color: c, count: per });
    };
    const addGoal = (t) => {
      if (t === 'score' || t === 'timed') goals.push({ type: 'score', target: 0 });
      else if (t === 'color') colorGoal();
      else if (t === 'jelly') goals.push({ type: 'jelly' });
      else if (t === 'ingredients') goals.push({ type: 'ingredients', count: ingredients.count });
      else if (t === 'blockers') goals.push({ type: 'blockers' });
      else if (t === 'specials') goals.push({ type: 'specials', count: Math.round((4 + Math.min(12, tier * 2) + rng.int(3)) * (goalType === 'hybrid' ? 0.6 : 1)) });
      else if (t === 'matches') goals.push({ type: 'matches', count: Math.round((22 + tier * 4 + rng.int(8)) / 2) * 2 });
    };
    if (goalType === 'hybrid') hybridParts.forEach(addGoal);
    else if (goalType === 'blockers' && countObstacles(layout) < 3) { goalType = 'color'; addGoal('color'); }
    else addGoal(goalType);

    const def = {
      id, world: world.id, worldName: world.name, w, h,
      layout: layout.map((r) => r.join('')), jelly, colors, goals, ingredients,
      timed: goalType === 'timed', difficulty, shape: shapeName, _goalType: goalType
    };
    // Chokolade-baner bruger højst 5 farver (ellers bliver de urimelige)
    if (/C/.test(def.layout.join('')) && def.colors > 5) def.colors = 5;
    def.ease = ease;
    if (easeOverride == null) genCache.set(id, def);
    return def;
  }

  function countObstacles(layout) {
    let n = 0;
    for (const row of layout) for (const ch of row) if ('123BbCIKL'.includes(ch)) n++;
    return n;
  }
  /** Hver række skal have mindst ~35 % "gennemtrængelige" celler, så brikker kan falde forbi. */
  function ensureFlow(layout, rng) {
    const w = layout[0].length;
    for (let y = 0; y < layout.length; y++) {
      const row = layout[y];
      const cells = [], stat = [];
      row.forEach((ch, x) => { if (ch !== '_') { cells.push(x); if ('123BbCIKL'.includes(ch)) stat.push(x); } });
      const need = Math.max(2, Math.ceil(cells.length * 0.35));
      rng.shuffle(stat);
      while (cells.length - stat.length < need && stat.length) {
        const x = stat.pop();
        row[x] = '.';
        const mx = w - 1 - x;
        const j = stat.indexOf(mx);
        if (j >= 0) { stat.splice(j, 1); row[mx] = '.'; }
      }
    }
  }
  function limitObstacles(layout, rng, maxFrac) {
    const cells = [], obs = [];
    layout.forEach((row, y) => row.forEach((ch, x) => { if (ch !== '_') { cells.push([x, y]); if ('123BbCIKL'.includes(ch)) obs.push([x, y]); } }));
    const max = Math.floor(cells.length * maxFrac);
    rng.shuffle(obs);
    while (obs.length > max) { const [x, y] = obs.pop(); layout[y][x] = '.'; }
  }

  // --------------------------------------------------------------------------
  //  Balance-tabel (auto-genereret af tools/balance.js)
  //  Format: id: [trækEllerTid, stjerne1, stjerne2, stjerne3]
  // --------------------------------------------------------------------------
  const BALANCE = {/*BALANCE_START*/
    1: [20,11000,22900,47800], 2: [20,12000,20400,32900], 3: [22,27800,41700,62700], 4: [20,12200,20700,45500],

  function defaults() {

      player: { name: 'Grejs-spiller', avatar: 'grejs', xp: 0, level: 1 },
      coins: 500,
      lives: 5,
      lifeTimestamp: 0,          // tidspunkt hvor næste liv begyndte at lade op

      levels: {},                // id -> { stars, best, plays, wins }
      boosters: { hammer: 3, shuffle: 2, extraMoves: 2, colorBlast: 1, lineBlast: 2, bomb: 1, freeSwitch: 2 },
      achievements: {},          // id -> timestamp

      chests: { claimed: [] },
      cosmetics: {

        avatar: 'grejs', board: 'classic', background: 'auto', tiles: 'classic'
      },

        performance: false, animations: 'high', reduceMotion: false, largeUI: false,
        tutorialSeen: false, playerName: ''

      case 'drop': {
        ctx.moveTo(0, -r * 1.0);
        ctx.bezierCurveTo(r * 0.35, -r * 0.55, r * 0.9, -r * 0.05, r * 0.82, r * 0.35);
        ctx.arc(0, r * 0.3, r * 0.82, 0.06, Math.PI - 0.06);
        ctx.bezierCurveTo(-r * 0.9, -r * 0.05, -r * 0.35, -r * 0.55, 0, -r * 1.0);
        break;
      }
      case 'leaf': {
        ctx.moveTo(-r * 0.85, r * 0.85);
        ctx.bezierCurveTo(-r * 1.0, -r * 0.2, -r * 0.2, -r * 1.0, r * 0.9, -r * 0.9);
        ctx.bezierCurveTo(r * 1.0, r * 0.2, r * 0.2, r * 1.0, -r * 0.85, r * 0.85);
        break;
      }
      case 'star': {
        const spikes = 5, outer = r * 1.02, inner = r * 0.5;
        for (let i = 0; i < spikes * 2; i++) {
          const rad = i % 2 === 0 ? outer : inner;
          const a = -Math.PI / 2 + i * Math.PI / spikes;
          const px = Math.cos(a) * rad, py = Math.sin(a) * rad + r * 0.06;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        break;
      }
      case 'gem': {
        ctx.moveTo(0, -r * 0.95);
        ctx.lineTo(r * 0.9, -r * 0.2);
        ctx.lineTo(0, r * 0.98);
        ctx.lineTo(-r * 0.9, -r * 0.2);
        break;
      }
      case 'swirl':
      default: {
        ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
      }
    }
    ctx.closePath();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  Art.roundRect = roundRect;

  /** Tegn en grundbrik centreret i (0,0) med radius r. */
  // Brik-temaer (cosmetics) ændrer kun udseendet, aldrig former/farvekoder.
  function themed(T) {
    if (Art.theme === 'pastel') return Object.assign({}, T, { c1: '#ffffff', c2: mix(T.c2, '#ffffff', 0.35), c3: mix(T.c3, '#ffffff', 0.25) });
    if (Art.theme === 'neon') return Object.assign({}, T, { c1: mix(T.c1, '#ffffff', 0.3), c2: mix(T.c2, '#000000', 0.15), c3: '#ffffff' });
    return T;
  }
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
    const g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
    const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
  }
  Art.theme = 'classic';

  function drawBase(ctx, type, r, opts) {
    opts = opts || {};
    const T = themed(TILE_TYPES[type]);
    if (Art.theme === 'neon') { ctx.save(); ctx.shadowColor = TILE_TYPES[type].glow; ctx.shadowBlur = r * 0.6; shapePath(ctx, T.shape, r); ctx.fillStyle = TILE_TYPES[type].glow; ctx.fill(); ctx.restore(); }
    // Skygge
    ctx.save();
    ctx.translate(r * 0.06, r * 0.12);
    shapePath(ctx, T.shape, r);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fill();
    ctx.restore();
    // Krop med gradient
    shapePath(ctx, T.shape, r);
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.1, 0, 0, r * 1.25);
    g.addColorStop(0, T.c1); g.addColorStop(0.55, T.c2); g.addColorStop(1, T.c3);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = Math.max(1.2, r * 0.07);
    ctx.strokeStyle = T.c3;
    ctx.stroke();
    // Detaljer per form
    ctx.save();
    shapePath(ctx, T.shape, r);
    ctx.clip();
    if (T.shape === 'leaf') {
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = r * 0.08;
      ctx.beginPath(); ctx.moveTo(-r * 0.6, r * 0.6); ctx.quadraticCurveTo(0, 0, r * 0.7, -r * 0.7); ctx.stroke();
      ctx.lineWidth = r * 0.05;
      for (const t of [-0.25, 0.15]) {
        ctx.beginPath(); ctx.moveTo(r * t, -r * t); ctx.lineTo(r * (t - 0.3), -r * (t + 0.3) + r * 0.05); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r * t, -r * t); ctx.lineTo(r * (t + 0.3), -r * (t - 0.3) - r * 0.05); ctx.stroke();
      }
    } else if (T.shape === 'swirl') {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = r * 0.13; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 4.2; a += 0.15) {
        const rr = r * 0.08 + a * r * 0.055;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    } else if (T.shape === 'gem') {
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.moveTo(0, -r * 0.95); ctx.lineTo(r * 0.9, -r * 0.2); ctx.lineTo(0, -r * 0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath(); ctx.moveTo(0, r * 0.98); ctx.lineTo(r * 0.9, -r * 0.2); ctx.lineTo(0, -r * 0.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = r * 0.04;
      ctx.beginPath(); ctx.moveTo(-r * 0.9, -r * 0.2); ctx.lineTo(r * 0.9, -r * 0.2); ctx.stroke();
    } else if (T.shape === 'star') {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(0, r * 0.08, r * 0.28, 0, Math.PI * 2); ctx.fill();
    } else if (T.shape === 'drop') {
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.arc(r * 0.15, r * 0.35, r * 0.45, 0, Math.PI * 2); ctx.fill();
    } else if (T.shape === 'heart') {
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.05, r * 0.35, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    // Glans / highlight
    if (!opts.noGloss) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      const hg = ctx.createLinearGradient(0, -r, 0, 0);
      hg.addColorStop(0, 'rgba(255,255,255,0.95)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.ellipse(-r * 0.22, -r * 0.42, r * 0.36, r * 0.2, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(r * 0.08, -r * 0.55, r * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawStripes(ctx, type, r, dir) {
    const T = themed(TILE_TYPES[type]);
    ctx.save();
    shapePath(ctx, T.shape, r);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    const bw = r * 0.2;
    for (let i = -2; i <= 2; i++) {
      if (dir === 'h') ctx.fillRect(-r * 1.2, i * r * 0.48 - bw / 2, r * 2.4, bw);
      else ctx.fillRect(i * r * 0.48 - bw / 2, -r * 1.2, bw, r * 2.4);
    }
    ctx.restore();
    // pile-markører
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = T.c3; ctx.lineWidth = r * 0.05;
    const arrow = (ax, ay, rot) => {
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(rot);
      ctx.beginPath(); ctx.moveTo(r * 0.16, 0); ctx.lineTo(-r * 0.1, -r * 0.14); ctx.lineTo(-r * 0.1, r * 0.14); ctx.closePath();
      ctx.fill(); ctx.stroke(); ctx.restore();
    };
    if (dir === 'h') { arrow(r * 1.0, 0, 0); arrow(-r * 1.0, 0, Math.PI); }
    else { arrow(0, -r * 1.0, -Math.PI / 2); arrow(0, r * 1.0, Math.PI / 2); }
    ctx.restore();
  }

  function drawBomb(ctx, type, r) {
    const T = TILE_TYPES[type];
    // Glødende indpakning: afrundet "gavepakke"-ramme i brikkens farve
    ctx.save();
    ctx.shadowColor = T.glow; ctx.shadowBlur = r * 0.5;
    roundRect(ctx, -r * 0.98, -r * 0.98, r * 1.96, r * 1.96, r * 0.45);
    const g = ctx.createLinearGradient(-r, -r, r, r);
    g.addColorStop(0, T.c1); g.addColorStop(0.5, T.c2); g.addColorStop(1, T.c3);
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
    ctx.lineWidth = r * 0.08; ctx.strokeStyle = '#fff8';
    roundRect(ctx, -r * 0.98, -r * 0.98, r * 1.96, r * 1.96, r * 0.45); ctx.stroke();
    // Bånd
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(-r * 0.12, -r * 0.98, r * 0.24, r * 1.96);
    ctx.fillRect(-r * 0.98, -r * 0.12, r * 1.96, r * 0.24);
    // Lille version af formen i midten
    ctx.save(); ctx.scale(0.55, 0.55); drawBase(ctx, type, r); ctx.restore();
    // Gnister i hjørnerne
    ctx.fillStyle = '#fff';
    for (const [sx, sy] of [[-0.62, -0.62], [0.62, 0.62], [0.62, -0.62], [-0.62, 0.62]]) sparkle(ctx, sx * r, sy * r, r * 0.13);
  }

  function sparkle(ctx, x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y); ctx.quadraticCurveTo(x, y, x, y + s);
    ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s);
    ctx.fill();
  }
  Art.sparkle = sparkle;

  function drawColorBomb(ctx, r) {
    ctx.save();
    ctx.shadowColor = '#fff'; ctx.shadowBlur = r * 0.4;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#5b4aa8'); g.addColorStop(0.7, '#241a52'); g.addColorStop(1, '#0d0826');
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
    // Regnbuespiral af prikker
    const cols = TILE_TYPES.map((t) => t.c2);
    for (let i = 0; i < 26; i++) {
      const a = i * 0.9, rr = r * (0.18 + (i / 26) * 0.62);
      ctx.fillStyle = cols[i % cols.length];
      ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, r * (0.07 + i * 0.002), 0, Math.PI * 2); ctx.fill();
    }
    ctx.lineWidth = r * 0.07; ctx.strokeStyle = '#ffffffaa';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.45, r * 0.3, r * 0.14, -0.6, 0, Math.PI * 2); ctx.fill();
  }

  function drawIngredient(ctx, ing, r) {
    const I = GC.Levels ? GC.Levels.INGREDIENTS[ing] : null;
    ctx.save();
    // Gylden "medalje" bag ingrediensen, så den skiller sig tydeligt ud
    ctx.beginPath(); ctx.arc(0, r * 0.05, r * 0.98, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#fffbe0'); g.addColorStop(0.7, '#ffd23f'); g.addColorStop(1, '#c98a00');
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = r * 0.08; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.font = Math.round(r * 1.25) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = r * 0.2; ctx.shadowOffsetY = r * 0.08;
    ctx.fillText(I ? I.emoji : '⭐', 0, r * 0.12);
    ctx.restore();
  }

  /**
   * Hent (cachet) sprite for en brik. key = color|special|ing.
   * Sprites tegnes i fuld opløsning (size * dpr) én gang og genbruges.
   */
  Art.tileSprite = function (tile, size) {
    const dpr = Art.dpr;
    const key = Art.theme + ':' + size + ':' + tile.color + ':' + (tile.special || '') + ':' + tile.ing;
    let c = Art.cache.get(key);
    if (c) return c;
    c = document.createElement('canvas');
    const px = Math.ceil(size * dpr * 1.3);
    c.width = c.height = px;
    const ctx = c.getContext('2d');
    ctx.translate(px / 2, px / 2);
    ctx.scale(dpr, dpr);
    const r = size * 0.4;
    if (tile.ing >= 0) drawIngredient(ctx, tile.ing, r);
    else if (tile.special === 'cbomb') drawColorBomb(ctx, r);
    else if (tile.special === 'bomb') drawBomb(ctx, tile.color, r * 0.92);
    else {
      drawBase(ctx, tile.color, r);
      if (tile.special === 'h' || tile.special === 'v') drawStripes(ctx, tile.color, r, tile.special);
    }
    Art.cache.set(key, c);
    return c;
  };

  /** Lille billede (data-URL) til mål-ikoner i HUD'en. */
  Art.iconURL = function (tile, size) {
    size = size || 40;
    const key = 'icon:' + Art.theme + ':' + size + ':' + tile.color + ':' + (tile.special || '') + ':' + tile.ing;
    if (Art.cache.has(key)) return Art.cache.get(key);
    const c = document.createElement('canvas');
    c.width = c.height = size * 2;
    const ctx = c.getContext('2d');
    ctx.translate(size, size);
    ctx.scale(2, 2);
    const r = size * 0.42;
    if (tile.ing >= 0) drawIngredient(ctx, tile.ing, r);
    else if (tile.special === 'cbomb') drawColorBomb(ctx, r);
    else if (tile.special === 'bomb') drawBomb(ctx, tile.color, r * 0.92);
    else { drawBase(ctx, tile.color, r); if (tile.special) drawStripes(ctx, tile.color, r, tile.special); }
    const url = c.toDataURL();
    Art.cache.set(key, url);
    return url;
  };

  Art.setScale = function (dpr) {
    if (dpr !== Art.dpr) { Art.cache.clear(); Art.dpr = dpr; }
  };

  // ------------------------------------------------------------------------
  //  Forhindringer (tegnes direkte på board-canvas)
  // ------------------------------------------------------------------------
  Art.drawJelly = function (ctx, x, y, s, layers, t) {
    const pad = s * 0.04;
    ctx.save();
    roundRect(ctx, x + pad, y + pad, s - pad * 2, s - pad * 2, s * 0.18);
    const wob = Math.sin(t * 0.003 + x * 0.05 + y * 0.03) * 0.04;
    ctx.fillStyle = layers >= 2 ? 'rgba(240,70,190,' + (0.62 + wob) + ')' : 'rgba(255,140,220,' + (0.42 + wob) + ')';
    ctx.fill();
    ctx.lineWidth = s * 0.04;
    ctx.strokeStyle = layers >= 2 ? 'rgba(160,20,120,0.8)' : 'rgba(220,80,170,0.6)';
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(x + s * 0.3, y + s * 0.22, s * 0.16, s * 0.06, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };

  Art.drawCrate = function (ctx, x, y, s, hp) {
    const pad = s * 0.05;
    const cols = hp >= 3 ? ['#9fb7d6', '#5b7ba6', '#2c4466'] : hp === 2 ? ['#d6b07a', '#a8783c', '#5e3d14'] : ['#f0cf98', '#c9964f', '#7a5220'];
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(ctx, x + pad + s * 0.03, y + pad + s * 0.06, s - pad * 2, s - pad * 2, s * 0.14); ctx.fill();
    const g = ctx.createLinearGradient(x, y, x + s, y + s);
    g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
    roundRect(ctx, x + pad, y + pad, s - pad * 2, s - pad * 2, s * 0.14);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = s * 0.05; ctx.strokeStyle = cols[2]; ctx.stroke();
    // planker / frost
    ctx.strokeStyle = cols[2]; ctx.lineWidth = s * 0.035; ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(x + s * 0.2, y + s * 0.2); ctx.lineTo(x + s * 0.8, y + s * 0.8);
    ctx.moveTo(x + s * 0.8, y + s * 0.2); ctx.lineTo(x + s * 0.2, y + s * 0.8);
    ctx.stroke();
    ctx.globalAlpha = 1;
    if (hp >= 2) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.round(s * 0.34) + 'px Fredoka, "Baloo 2", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = s * 0.06; ctx.strokeStyle = cols[2];
      ctx.strokeText(hp, x + s / 2, y + s / 2 + 1); ctx.fillText(hp, x + s / 2, y + s / 2 + 1);
    }
    ctx.restore();
  };

  Art.drawLicorice = function (ctx, x, y, s, hp) {
    ctx.save();
    const pad = s * 0.06;
    roundRect(ctx, x + pad, y + pad, s - pad * 2, s - pad * 2, s * 0.3);
    const g = ctx.createRadialGradient(x + s * 0.35, y + s * 0.3, 1, x + s / 2, y + s / 2, s * 0.6);
    g.addColorStop(0, '#5a5566'); g.addColorStop(1, '#141019');
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = s * 0.05; ctx.strokeStyle = '#000'; ctx.stroke();
    // snoede striber
    ctx.strokeStyle = hp >= 2 ? '#e84a8a' : '#8a8a9a'; ctx.lineWidth = s * 0.07; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s * (0.12 + i * 0.1), 0.3 + i, 2.2 + i); ctx.stroke();
    }
    ctx.restore();
  };

  Art.drawChocolate = function (ctx, x, y, s) {
    ctx.save();
    const pad = s * 0.03;
    roundRect(ctx, x + pad, y + pad, s - pad * 2, s - pad * 2, s * 0.12);
    const g = ctx.createLinearGradient(x, y, x, y + s);
    g.addColorStop(0, '#8a5234'); g.addColorStop(1, '#4b2612');
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = s * 0.04; ctx.strokeStyle = '#2d1408'; ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = s * 0.04;
    ctx.beginPath();
    ctx.moveTo(x + s / 2, y + s * 0.1); ctx.lineTo(x + s / 2, y + s * 0.9);
    ctx.moveTo(x + s * 0.1, y + s / 2); ctx.lineTo(x + s * 0.9, y + s / 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,220,190,0.25)';
    for (const [a, b] of [[0.28, 0.28], [0.72, 0.28], [0.28, 0.72], [0.72, 0.72]]) {
      ctx.beginPath(); ctx.ellipse(x + s * a - s * 0.06, y + s * b - s * 0.08, s * 0.08, s * 0.04, -0.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  };

  Art.drawIce = function (ctx, x, y, s, layers) {
    ctx.save();
    const pad = s * 0.04;
    roundRect(ctx, x + pad, y + pad, s - pad * 2, s - pad * 2, s * 0.14);
    ctx.fillStyle = layers >= 2 ? 'rgba(190,235,255,0.62)' : 'rgba(210,242,255,0.45)';
    ctx.fill();
    ctx.lineWidth = s * 0.05; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = s * 0.03;
    ctx.beginPath();
    ctx.moveTo(x + s * 0.18, y + s * 0.4); ctx.lineTo(x + s * 0.38, y + s * 0.18);
    ctx.moveTo(x + s * 0.2, y + s * 0.6); ctx.lineTo(x + s * 0.55, y + s * 0.22);
    if (layers >= 2) { ctx.moveTo(x + s * 0.6, y + s * 0.8); ctx.lineTo(x + s * 0.82, y + s * 0.55); }
    ctx.stroke();
    ctx.restore();
  };

  Art.drawLock = function (ctx, x, y, s) {
    ctx.save();
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = s * 0.07; ctx.lineCap = 'round';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(x + s * 0.08, y + s * 0.08); ctx.lineTo(x + s * 0.92, y + s * 0.92);
    ctx.moveTo(x + s * 0.92, y + s * 0.08); ctx.lineTo(x + s * 0.08, y + s * 0.92);
    ctx.stroke();
    ctx.strokeStyle = '#e0b060'; ctx.lineWidth = s * 0.035;
    ctx.stroke();
    // hængelås
    const cx = x + s / 2, cy = y + s / 2;
    ctx.fillStyle = '#f2c94c'; ctx.strokeStyle = '#7a5410'; ctx.lineWidth = s * 0.03;
    ctx.beginPath(); ctx.arc(cx, cy - s * 0.06, s * 0.1, Math.PI, 0); ctx.stroke();
    roundRect(ctx, cx - s * 0.14, cy - s * 0.06, s * 0.28, s * 0.22, s * 0.04); ctx.fill(); ctx.stroke();
    ctx.restore();
  };

  // ------------------------------------------------------------------------
  //  Figurer (SVG) – originale Grejs-karakterer (spec §55-56)
  // ------------------------------------------------------------------------
  const CHARACTERS = {

  <script>
/* js/audio.js */
/* ==========================================================================
   GREJS CRUSH – audio.js
   Alle lyde og al musik syntetiseres live med Web Audio API. Det giver
   originale lyde, nul downloads og fungerer offline. Hvis browseren ikke
   understøtter Web Audio, kører spillet videre uden lyd (spec §94).
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};

  const Audio = {
    ctx: null, master: null, sfxGain: null, musicGain: null,
    enabled: true, musicOn: true, sfxOn: true, musicVol: 0.5, sfxVol: 0.7,
    track: -1, tempoMul: 1, _timer: null, _nextNote: 0, _step: 0, _noiseBuf: null, unlocked: false
  };

  Audio.init = function () {
    if (Audio.ctx) return true;
    try {
      const AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) { Audio.enabled = false; return false; }

      Audio.master = Audio.ctx.createGain();
      Audio.master.connect(Audio.ctx.destination);
      // Let kompressor så store combos ikke klipper.
      const comp = Audio.ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      comp.connect(Audio.master);

      Audio.musicGain.connect(comp);

      const len = Audio.ctx.sampleRate * 1.0;
      const buf = Audio.ctx.createBuffer(1, len, Audio.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      Audio._noiseBuf = buf;
      return true;
    } catch (e) {
      Audio.enabled = false;
      return false;
    }
  };

  /** Browsere kræver en brugerhandling før lyd – kaldes på første klik/touch. */
  Audio.unlock = function () {
    if (!Audio.init()) return;
    if (Audio.ctx.state === 'suspended') Audio.ctx.resume().catch(() => {});
    Audio.unlocked = true;
  };

  Audio.applySettings = function (s) {
    Audio.musicOn = s.music !== false;
    Audio.sfxOn = s.sound !== false;
    Audio.musicVol = s.musicVolume != null ? s.musicVolume : 0.5;
    Audio.sfxVol = s.sfxVolume != null ? s.sfxVolume : 0.7;

  };
  Audio.applyVolumes = function () {

  // --------------------------------------------------------------------------
  //  Byggeklodser
  // --------------------------------------------------------------------------
  function tone(freq, dur, opts) {
    const a = Audio; if (!a.ctx || !a.sfxOn) return;

    const g = a.ctx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.slide), t0 + dur);
    const vol = (opts.vol || 0.3);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (opts.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(opts.dest || a.sfxGain);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function noise(dur, opts) {
    const a = Audio; if (!a.ctx || !a.sfxOn) return;

    src.buffer = a._noiseBuf;
    const f = a.ctx.createBiquadFilter();

    f.frequency.setValueAtTime(opts.freq || 1200, t0);
    if (opts.freqEnd) f.frequency.exponentialRampToValueAtTime(opts.freqEnd, t0 + dur);

    const g = a.ctx.createGain();
    g.gain.setValueAtTime(opts.vol || 0.3, t0);

    src.start(t0); src.stop(t0 + dur + 0.05);

  // Pentatonisk skala – matches stiger i tone jo længere combo.
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31];
  const note = (base, semis) => base * Math.pow(2, semis / 12);

  // --------------------------------------------------------------------------
  //  Lydeffekter (spec §39)
  // --------------------------------------------------------------------------
  const SFX = {
    select: () => tone(880, 0.08, { type: 'triangle', vol: 0.18 }),
    swap: () => { noise(0.14, { filter: 'bandpass', freq: 600, freqEnd: 2400, q: 2, vol: 0.18 }); tone(520, 0.1, { type: 'sine', vol: 0.08, slide: 780 }); },
    invalid: () => { tone(220, 0.12, { type: 'square', vol: 0.08 }); tone(180, 0.16, { type: 'square', vol: 0.08, delay: 0.1 }); },
    match: (combo) => {
      const i = Math.min(PENTA.length - 1, (combo || 1) - 1);
      const f = note(523.25, PENTA[i]);
      tone(f, 0.22, { type: 'triangle', vol: 0.22 });
      tone(f * 2, 0.12, { type: 'sine', vol: 0.08, delay: 0.02 });
    },
    match4: () => { [0, 4, 7].forEach((s, i) => tone(note(659, s), 0.2, { type: 'triangle', vol: 0.18, delay: i * 0.05 })); },
    match5: () => { [0, 4, 7, 12, 16].forEach((s, i) => tone(note(659, s), 0.25, { type: 'triangle', vol: 0.18, delay: i * 0.05 })); },
    stripe: () => { tone(300, 0.3, { type: 'sawtooth', vol: 0.1, slide: 2400 }); noise(0.25, { filter: 'highpass', freq: 1500, vol: 0.12 }); },
    bomb: () => { noise(0.5, { filter: 'lowpass', freq: 1800, freqEnd: 80, vol: 0.5 }); tone(140, 0.45, { type: 'sine', vol: 0.45, slide: 40 }); },
    cbomb: () => { for (let i = 0; i < 10; i++) tone(note(440, PENTA[i]), 0.12, { type: 'square', vol: 0.06, delay: i * 0.035 }); noise(0.7, { filter: 'bandpass', freq: 3000, freqEnd: 300, q: 1, vol: 0.2 }); },
    combo: (n) => { [0, 4, 7, 12].forEach((s, i) => tone(note(523 * Math.pow(2, Math.min(n, 8) / 24), s), 0.18, { type: 'triangle', vol: 0.15, delay: i * 0.06 })); },
    win: () => { [0, 4, 7, 12, 7, 12, 16, 19].forEach((s, i) => tone(note(523, s), 0.3, { type: 'triangle', vol: 0.22, delay: i * 0.11 })); },
    lose: () => { [7, 4, 0, -5].forEach((s, i) => tone(note(392, s), 0.35, { type: 'triangle', vol: 0.18, delay: i * 0.18 })); },
    booster: () => { for (let i = 0; i < 6; i++) tone(note(880, PENTA[i * 2 % PENTA.length]), 0.12, { type: 'sine', vol: 0.12, delay: i * 0.04 }); },
    button: () => tone(660, 0.06, { type: 'triangle', vol: 0.14 }),
    reward: () => { [0, 7, 12, 16, 19, 24].forEach((s, i) => tone(note(587, s), 0.25, { type: 'sine', vol: 0.18, delay: i * 0.07 })); },
    coin: () => { tone(1318, 0.08, { type: 'square', vol: 0.06 }); tone(1760, 0.18, { type: 'square', vol: 0.06, delay: 0.07 }); },
    star: (i) => { tone(note(784, [0, 4, 7][i || 0]), 0.35, { type: 'triangle', vol: 0.22 }); tone(note(1568, [0, 4, 7][i || 0]), 0.3, { type: 'sine', vol: 0.08 }); },
    unlock: () => { [0, 7, 12].forEach((s, i) => tone(note(698, s), 0.25, { type: 'triangle', vol: 0.18, delay: i * 0.09 })); },
    ice: () => { tone(2400, 0.08, { type: 'square', vol: 0.05 }); noise(0.12, { filter: 'highpass', freq: 4000, vol: 0.15 }); },
    crate: () => { noise(0.12, { filter: 'lowpass', freq: 900, vol: 0.3 }); tone(160, 0.1, { type: 'square', vol: 0.08 }); },
    choc: () => { tone(120, 0.25, { type: 'sine', vol: 0.2, slide: 70 }); },
    ingredient: () => { [12, 7, 0].forEach((s, i) => tone(note(523, s), 0.2, { type: 'triangle', vol: 0.18, delay: i * 0.07 })); },
    tick: () => tone(1200, 0.05, { type: 'square', vol: 0.06 }),
    shuffle: () => { for (let i = 0; i < 8; i++) noise(0.06, { filter: 'bandpass', freq: 1000 + i * 300, q: 3, vol: 0.12, delay: i * 0.05 }); }
  };

  Audio.play = function (name, arg) {
    if (!Audio.enabled || !Audio.ctx || !Audio.sfxOn) return;
    const fn = SFX[name];
    if (!fn) return;
    try { fn(arg); } catch (e) { /* lyd må aldrig crashe spillet */ }
  };

  // --------------------------------------------------------------------------
  //  Musik – simpel sequencer med forskellige stemninger per verden (spec §40)
  // --------------------------------------------------------------------------
  // Hver sang: grundtone, tempo, skala og akkordforløb (i skalatrin).
  const SONGS = [
    { root: 60, bpm: 112, scale: [0, 2, 4, 5, 7, 9, 11], prog: [0, 4, 5, 3], lead: 'triangle', bass: 'sine' },        // menu / Grejs Eng
    { root: 62, bpm: 118, scale: [0, 2, 4, 5, 7, 9, 11], prog: [0, 5, 3, 4], lead: 'square', bass: 'triangle' },       // Sukkerdalen
    { root: 57, bpm: 100, scale: [0, 2, 3, 5, 7, 8, 10], prog: [0, 5, 2, 6], lead: 'triangle', bass: 'sine' },         // Chokoladebjergene
    { root: 64, bpm: 124, scale: [0, 2, 4, 7, 9, 12, 14], prog: [0, 3, 4, 3], lead: 'triangle', bass: 'triangle' },    // Jelly Jungle
    { root: 65, bpm: 108, scale: [0, 2, 4, 5, 7, 9, 11], prog: [0, 3, 1, 4], lead: 'sine', bass: 'triangle' },         // Karamel Kysten
    { root: 67, bpm: 96, scale: [0, 2, 4, 7, 9, 12, 14], prog: [0, 5, 3, 4], lead: 'sine', bass: 'sine' },             // Frostland
    { root: 59, bpm: 110, scale: [0, 2, 3, 5, 7, 9, 10], prog: [0, 3, 6, 4], lead: 'triangle', bass: 'sine' },         // Krystalgrotterne
    { root: 63, bpm: 120, scale: [0, 2, 4, 6, 7, 9, 11], prog: [0, 1, 4, 5], lead: 'square', bass: 'triangle' },       // Magisk By
    { root: 55, bpm: 128, scale: [0, 1, 4, 5, 7, 8, 10], prog: [0, 3, 5, 4], lead: 'sawtooth', bass: 'triangle' },     // Lavaøen
    { root: 60, bpm: 116, scale: [0, 2, 4, 5, 7, 9, 11], prog: [0, 5, 3, 4, 0, 5, 1, 4], lead: 'square', bass: 'triangle' } // Grejs Slottet
  ];
  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function mTone(freq, t, dur, type, vol) {
    const a = Audio;
    const osc = a.ctx.createOscillator(), g = a.ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(a.musicGain);
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  Audio.playMusic = function (trackIdx) {

    if (!Audio.ctx || !Audio.musicOn) return;

    Audio.stopMusic();
    Audio.track = trackIdx;
    Audio._step = 0;
    Audio._nextNote = Audio.ctx.currentTime + 0.1;
    const song = SONGS[trackIdx % SONGS.length];
    const rng = GC.makeRng(1000 + trackIdx);

    const melody = [];
    for (let i = 0; i < 64; i++) melody.push(rng() < 0.55 ? rng.int(song.scale.length) + (rng() < 0.3 ? 7 : 0) : -1);
    const schedule = () => {
      if (!Audio.ctx) return;
      const spb = 60 / (song.bpm * Audio.tempoMul) / 2; // ottendedele
      while (Audio._nextNote < Audio.ctx.currentTime + 0.25) {
        const step = Audio._step;
        const bar = Math.floor(step / 8) % song.prog.length;
        const chordRoot = song.prog[bar];
        const deg = (d) => { const oct = Math.floor(d / song.scale.length); return song.scale[((d % song.scale.length) + song.scale.length) % song.scale.length] + oct * 12; };
        const t = Audio._nextNote;

        if (step % 8 === 0) [0, 2, 4].forEach((o) => mTone(midi(song.root - 12 + deg(chordRoot + o)), t, spb * 7.5, 'sine', 0.07));

        if (step % 2 === 1) mTone(midi(song.root + deg(chordRoot + [0, 2, 4, 2][(step >> 1) % 4])), t, spb * 0.8, 'triangle', 0.05);

        const m = melody[step % melody.length];
        if (m >= 0 && step % 1 === 0) mTone(midi(song.root + 12 + deg(chordRoot + m)), t, spb * 1.4, song.lead, song.lead === 'sawtooth' || song.lead === 'square' ? 0.035 : 0.08);

          const f = Audio.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = step % 4 === 2 ? 3000 : 7000;

          src.connect(f); f.connect(g); g.connect(Audio.musicGain); src.start(t); src.stop(t + 0.06);
        }
        Audio._nextNote += spb;
        Audio._step++;
      }

/* js/effects.js */
/* ==========================================================================
   GREJS CRUSH – effects.js

   Partikler ligger i et fast, genbrugt pool (ingen garbage per frame), og

(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};

  // ------------------------------------------------------------------------
  //  Fælles loop
  // ------------------------------------------------------------------------
  const Loop = { subs: new Set(), running: false, last: 0, fps: 60, _frames: 0, _fpsT: 0 };
  Loop.add = function (fn) { Loop.subs.add(fn); Loop.start(); };
  Loop.remove = function (fn) { Loop.subs.delete(fn); };
  Loop.start = function () {
    if (Loop.running) return;
    Loop.running = true;
    Loop.last = performance.now();
    requestAnimationFrame(Loop.tick);
  };
  Loop.tick = function (now) {
    const dt = Math.min(50, now - Loop.last);
    Loop.last = now;
    Loop._frames++;
    if (now - Loop._fpsT > 500) { Loop.fps = Math.round(Loop._frames * 1000 / (now - Loop._fpsT)); Loop._frames = 0; Loop._fpsT = now; }

    requestAnimationFrame(Loop.tick);
  };
  GC.Loop = Loop;

  // ------------------------------------------------------------------------
  //  Kvalitetsniveau
  // ------------------------------------------------------------------------
  const Quality = {
    level: 'high', reduceMotion: false,
    /** Faktor for antal partikler. */
    particles() { if (this.reduceMotion) return 0.25; return this.level === 'low' ? 0.3 : this.level === 'medium' ? 0.6 : 1; },
    /** Faktor for animationshastighed (højere = hurtigere). */
    speed() { return this.reduceMotion ? 1.6 : this.level === 'low' ? 1.35 : 1; },
    shake() { return this.reduceMotion || this.level === 'low' ? 0 : this.level === 'medium' ? 0.6 : 1; }
  };
  Quality.apply = function (settings) {
    Quality.level = settings.performance ? 'low' : (settings.animations || 'high');
    Quality.reduceMotion = !!settings.reduceMotion;
    Particles.max = Math.round(900 * Quality.particles()) + 60;
  };
  GC.Quality = Quality;

  // ------------------------------------------------------------------------
  //  Partikler (struct-of-arrays pool)
  // ------------------------------------------------------------------------
  const CAP = 1000;
  const P = {
    x: new Float32Array(CAP), y: new Float32Array(CAP), vx: new Float32Array(CAP), vy: new Float32Array(CAP),
    life: new Float32Array(CAP), max: new Float32Array(CAP), size: new Float32Array(CAP), rot: new Float32Array(CAP),
    vr: new Float32Array(CAP), grav: new Float32Array(CAP), kind: new Uint8Array(CAP), color: new Array(CAP), drag: new Float32Array(CAP)
  };

  const Particles = { canvas: null, ctx: null, max: 900, dpr: 1, w: 0, h: 0 };

  Particles.init = function (canvas) {
    Particles.canvas = canvas;
    Particles.ctx = canvas.getContext('2d');

  };
  Particles.resize = function () {

    Particles.dpr = Math.min(2, root.devicePixelRatio || 1);
    Particles.w = root.innerWidth; Particles.h = root.innerHeight;
    c.width = Math.round(Particles.w * Particles.dpr);
    c.height = Math.round(Particles.h * Particles.dpr);
    c.style.width = Particles.w + 'px'; c.style.height = Particles.h + 'px';
  };

  function spawn(kind, x, y, vx, vy, life, size, color, grav, drag) {
    if (count >= Particles.max) return -1;

    P.x[i] = x; P.y[i] = y; P.vx[i] = vx; P.vy[i] = vy; P.life[i] = life; P.max[i] = life;
    P.size[i] = size; P.color[i] = color; P.grav[i] = grav || 0; P.kind[i] = kind; P.drag[i] = drag == null ? 0.98 : drag;

    P.size[i] = P.size[j]; P.color[i] = P.color[j]; P.grav[i] = P.grav[j]; P.kind[i] = P.kind[j]; P.drag[i] = P.drag[j];

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      P.life[i] -= dt;
      if (P.life[i] <= 0) { kill(i); continue; }

      P.vy[i] += P.grav[i] * f;
      const dr = Math.pow(P.drag[i], f);
      P.vx[i] *= dr; P.vy[i] *= dr;
      P.x[i] += P.vx[i] * f; P.y[i] += P.vy[i] * f;
      P.rot[i] += P.vr[i] * f;

      ctx.globalAlpha = k === KIND.text ? Math.min(1, t * 2.5) : Math.min(1, t * 1.6);

      } else if (k === KIND.spark) {

        ctx.save(); ctx.translate(P.x[i], P.y[i]); ctx.rotate(P.rot[i]);

        ctx.fillStyle = col;
        ctx.save(); ctx.translate(P.x[i], P.y[i]); ctx.rotate(P.rot[i]);
        ctx.fillRect(-s / 2, -s / 4, s, s / 2 * Math.abs(Math.cos(P.rot[i] * 2)) + 1);
        ctx.restore();
      } else if (k === KIND.ring) {
        ctx.strokeStyle = col; ctx.lineWidth = 4 * t + 1;
        ctx.beginPath(); ctx.arc(P.x[i], P.y[i], s * (1 - t) + 4, 0, 6.283); ctx.stroke();
      } else if (k === KIND.coin) {
        ctx.save(); ctx.translate(P.x[i], P.y[i]); ctx.scale(Math.abs(Math.cos(P.rot[i])) * 0.8 + 0.2, 1);
        ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b07a00'; ctx.lineWidth = 2;

        const sc = 1 + Math.max(0, (t - 0.8)) * 2.5;
        ctx.save(); ctx.translate(P.x[i], P.y[i]); ctx.scale(sc, sc);

        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      }
    }

  };

    }

    spawn(KIND.ring, x, y, 0, 0, life || 450, radius, color, 0, 1);
  };
  Particles.glow = function (x, y, color, size, life) {
    spawn(KIND.glow, x, y, 0, 0, life || 300, size, color, 0, 1);
  };
  Particles.confetti = function (x, y, n, spread) {
    const cols = ['#ff4d6d', '#46a6ff', '#5fe05a', '#ffd84a', '#b76bff', '#ffa149', '#ffffff'];

      const a = -Math.PI / 2 + rnd(-spread || -1.2, spread || 1.2);
      const v = rnd(6, 16);
      spawn(KIND.confetti, x, y, Math.cos(a) * v, Math.sin(a) * v, rnd(1400, 2600), rnd(8, 14), cols[i % cols.length], 0.28, 0.97);
    }
  };
  Particles.rain = function (n) {
    const cols = ['#ff4d6d', '#46a6ff', '#5fe05a', '#ffd84a', '#b76bff', '#ffa149'];
    n = Math.round(n * Quality.particles());
    for (let i = 0; i < n; i++) spawn(KIND.confetti, rnd(0, Particles.w), rnd(-200, -10), rnd(-1, 1), rnd(2, 5), rnd(2500, 4000), rnd(8, 13), cols[i % cols.length], 0.05, 0.995);
  };
  Particles.text = function (x, y, txt, color, size, life) {
    const i = spawn(KIND.text, x, y, 0, -1.1, life || 900, size || 22, color || '#fff', -0.004, 0.97);
    if (i >= 0) texts[i] = txt;
  };
  Particles.coins = function (x, y, n) {
    n = Math.round(n * Math.max(0.5, Quality.particles()));
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + rnd(-1, 1);
      spawn(KIND.coin, x, y, Math.cos(a) * rnd(3, 9), Math.sin(a) * rnd(4, 11), rnd(900, 1500), rnd(7, 10), '#ffd23f', 0.35, 0.98);
    }
  };
  Particles.stars = function (x, y, n, color) {
    n = Math.round(n * Quality.particles());
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = rnd(2, 9);
      spawn(KIND.star, x, y, Math.cos(a) * v, Math.sin(a) * v, rnd(600, 1200), rnd(6, 13), color || '#ffe36b', 0.08, 0.95);
    }
  };
  Particles.clear = function () { count = 0; Particles._dirty = true; };
  Particles.count = () => count;
  Particles.KIND = KIND;
  GC.Particles = Particles;

  // ------------------------------------------------------------------------
  //  Screen shake (spec §38) – kort, dæmpet, professionelt.
  // ------------------------------------------------------------------------
  const Shake = { el: null, mag: 0, t: 0 };
  Shake.init = function (el) {
    Shake.el = el;
    Loop.add((dt) => {
      if (Shake.mag <= 0.2) { if (Shake.t) { Shake.el.style.transform = ''; Shake.t = 0; } return; }
      Shake.t += dt;

  };

  // ------------------------------------------------------------------------
  //  Stor tekst midt på skærmen (COMBO!, AMAZING! ...)
  // ------------------------------------------------------------------------

    const layer = document.getElementById('bigtext-layer');
    if (!layer) return;
    const el = document.createElement('div');
    el.className = 'bigtext ' + (cls || '');
    el.innerHTML = '<span class="bt-main">' + GC.escapeHtml(text) + '</span>' + (sub ? '<span class="bt-sub">' + GC.escapeHtml(sub) + '</span>' : '');

  };

  <script>
/* js/player.js */
/* ==========================================================================
   GREJS CRUSH – player.js
   Meta-progression: coins, liv, XP/level, achievements, daily reward,
   daily challenge, kister, cosmetics, sæson-events og lokalt leaderboard.
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};
  const D = () => GC.Save.data;

  const Player = {
    MAX_LIVES: 5,
    LIFE_MINUTES: 20,
    listeners: [],
    toastQueue: []
  };

  Player.on = function (fn) { Player.listeners.push(fn); };
  function emit(type, payload) { Player.listeners.forEach((fn) => { try { fn(type, payload); } catch (e) { console.error(e); } }); }
  Player.emit = emit;

  // ------------------------------------------------------------------------
  //  Coins
  // ------------------------------------------------------------------------
  Player.addCoins = function (n, reason) {
    n = Math.floor(n);
    if (!n) return;
    const ev = GC.Events && GC.Events.active();
    if (n > 0 && ev && reason !== 'purchase' && reason !== 'refund' && reason !== 'debug') n = Math.round(n * (ev.coinBonus || 1));
    D().coins = Math.max(0, D().coins + n);
    if (n > 0) { D().stats.coinsEarned += n; Player.checkAchievements(); }
    GC.Save.save();
    emit('coins', { amount: n, total: D().coins });
    return n;
  };
  Player.spend = function (n) {
    if (D().coins < n) return false;
    D().coins -= n;
    GC.Save.save();
    emit('coins', { amount: -n, total: D().coins });
    return true;
  };

  // ------------------------------------------------------------------------
  //  Liv med automatisk genopladning (spec §25)
  // ------------------------------------------------------------------------
  Player.updateLives = function () {
    const d = D();
    if (d.lives >= Player.MAX_LIVES) { d.lifeTimestamp = 0; return; }
    const period = Player.LIFE_MINUTES * 60000;
    if (!d.lifeTimestamp) d.lifeTimestamp = Date.now();
    const elapsed = Date.now() - d.lifeTimestamp;
    if (elapsed >= period) {
      const gained = Math.floor(elapsed / period);
      d.lives = Math.min(Player.MAX_LIVES, d.lives + gained);
      d.lifeTimestamp = d.lives >= Player.MAX_LIVES ? 0 : d.lifeTimestamp + gained * period;
      GC.Save.soon();
      emit('lives', d.lives);
    }
  };
  Player.unlimited = function () { return D().unlimitedLivesUntil > Date.now(); };
  Player.hasLife = function () { Player.updateLives(); return Player.unlimited() || D().lives > 0; };
  Player.loseLife = function () {
    if (Player.unlimited()) return;
    const d = D();
    if (d.lives >= Player.MAX_LIVES) d.lifeTimestamp = Date.now();
    d.lives = Math.max(0, d.lives - 1);
    GC.Save.save();
    emit('lives', d.lives);
  };
  Player.addLives = function (n) {
    const d = D();
    d.lives = Math.min(Player.MAX_LIVES + 5, d.lives + n);
    if (d.lives >= Player.MAX_LIVES) d.lifeTimestamp = 0;
    GC.Save.save();
    emit('lives', d.lives);
  };
  /** Sekunder til næste liv (0 hvis fuld). */
  Player.nextLifeIn = function () {
    const d = D();
    if (d.lives >= Player.MAX_LIVES || !d.lifeTimestamp) return 0;
    return Math.max(0, Math.ceil((d.lifeTimestamp + Player.LIFE_MINUTES * 60000 - Date.now()) / 1000));
  };

  // ------------------------------------------------------------------------
  //  XP og spiller-level (spec §31)
  // ------------------------------------------------------------------------
  /** Samlet XP der kræves for at nå `level`. L1=0, L2=100, L3=250, L4=500 ... */
  Player.xpFor = function (level) {
    if (level <= 1) return 0;
    let total = 0;
    for (let n = 1; n < level; n++) total += n === 1 ? 100 : n === 2 ? 150 : 250 + (n - 3) * 100;
    return total;
  };
  Player.addXP = function (n) {
    const p = D().player;
    p.xp += Math.floor(n);
    let leveled = false;
    while (p.xp >= Player.xpFor(p.level + 1)) {
      p.level++;
      leveled = true;
      const reward = { coins: 100 + p.level * 20, booster: ['hammer', 'shuffle', 'lineBlast', 'bomb', 'colorBlast', 'freeSwitch', 'extraMoves'][p.level % 7] };
      D().coins += reward.coins;
      D().boosters[reward.booster] = (D().boosters[reward.booster] || 0) + 1;
      emit('levelup', { level: p.level, reward });
    }
    if (leveled) Player.checkAchievements();
    GC.Save.soon();
    emit('xp', p);
  };

  // ------------------------------------------------------------------------
  //  Boosters (spec §23-24)
  // ------------------------------------------------------------------------
  const BOOSTERS = {
    hammer: { name: 'Hammer', icon: '🔨', desc: 'Fjern én valgfri brik eller forhindring.', price: 500, target: 'cell' },
    shuffle: { name: 'Shuffle', icon: '🔀', desc: 'Bland hele boardet.', price: 750, target: 'none' },
    extraMoves: { name: 'Extra Move', icon: '➕', desc: '+5 træk (eller +15 sekunder).', price: 1000, target: 'none' },
    colorBlast: { name: 'Color Blast', icon: '🌈', desc: 'Fjern alle brikker af én farve.', price: 1200, target: 'cell' },
    lineBlast: { name: 'Line Blast', icon: '⚡', desc: 'Ryd en hel række.', price: 800, target: 'row' },
    bomb: { name: 'Bomb', icon: '💣', desc: 'Stor 5×5-eksplosion.', price: 1000, target: 'cell' },
    freeSwitch: { name: 'Free Switch', icon: '🔄', desc: 'Byt to brikker, selv uden match.', price: 600, target: 'swap' }
  };
  Player.BOOSTERS = BOOSTERS;
  Player.boosterCount = (k) => D().boosters[k] || 0;
  Player.useBooster = function (k) {
    if (Player.boosterCount(k) <= 0) return false;
    D().boosters[k]--;
    D().stats.boostersUsed++;
    Player.track('boosters', 1);
    Player.checkAchievements();
    GC.Save.save();
    emit('boosters', D().boosters);
    return true;
  };
  Player.giveBooster = function (k, n) {
    if (!BOOSTERS[k]) return;
    D().boosters[k] = (D().boosters[k] || 0) + (n || 1);
    GC.Save.save();
    emit('boosters', D().boosters);
  };

  // ------------------------------------------------------------------------
  //  Level-progression
  // ------------------------------------------------------------------------
  Player.levelInfo = (id) => D().levels[id] || null;
  Player.totalStars = function () {
    let s = 0;
    for (const id in D().levels) s += D().levels[id].stars || 0;
    return s;
  };
  Player.completedCount = function () {
    let n = 0;
    for (const id in D().levels) if ((D().levels[id].stars || 0) > 0 && +id < 9000) n++;
    return n;
  };
  Player.totalBestScore = function () {
    let s = 0;
    for (const id in D().levels) s += D().levels[id].best || 0;
    return s;
  };

  /**
   * Registrér resultat af en bane. Returnerer belønninger.
   * @param {object} r { id, won, score, stars, stats, movesLeft, event }
   */
  Player.recordResult = function (r) {
    const d = D();
    const st = d.stats;
    st.games++;
    const info = d.levels[r.id] || (d.levels[r.id] = { stars: 0, best: 0, plays: 0, wins: 0 });
    info.plays++;
    const rewards = { coins: 0, xp: 0, newBest: false, firstWin: false, unlocked: 0, newStars: 0 };
    // Statistik fra selve spillet
    const bs = r.stats || {};
    st.matches += bs.matches || 0;
    st.specials += bs.specials || 0;
    st.bombs += bs.bombs || 0;
    st.stripes += bs.stripes || 0;
    st.cbombs += bs.cbombs || 0;
    st.jelly += bs.jellyCleared || 0;
    st.blockers += (bs.blockersCleared || 0) + (bs.iceCleared || 0) + (bs.unlocked || 0);
    st.ingredients += bs.ingredients || 0;
    st.tiles += bs.tilesCleared || 0;
    st.bestCombo = Math.max(st.bestCombo, bs.bestCombo || 0);
    st.bestChain = Math.max(st.bestChain, r.bestChain || 0);
    st.totalScore += r.score;
    st.highestScore = Math.max(st.highestScore, r.score);

    if (r.won) {
      st.wins++;
      info.wins++;
      if (r.timed) st.timedWins++;
      if (r.event) st.eventWins++;
      rewards.firstWin = !info.stars;
      rewards.newStars = Math.max(0, r.stars - (info.stars || 0));
      if (r.stars === 3 && info.stars < 3) st.threeStar++;
      info.stars = Math.max(info.stars || 0, r.stars);
      if (r.score > (info.best || 0)) { rewards.newBest = !rewards.firstWin; info.best = r.score; }
      // Coins: første sejr giver mest, genspil giver lidt (no pay-to-win, spec §71)

      rewards.xp = (rewards.firstWin ? 50 : 15) + r.stars * 15 + (r.stars === 3 && rewards.newStars ? 50 : 0);
      if (!r.event && r.id >= d.unlockedLevel && r.id < GC.Levels.COUNT) {
        d.unlockedLevel = r.id + 1;
        d.newUnlock = r.id + 1;
        rewards.unlocked = r.id + 1;
      }
      Player.track('wins', 1);
      Player.track('stars', r.stars);
    } else {
      st.losses++;
      rewards.xp = 5;
    }
    Player.track('score', r.score);
    if (rewards.coins) rewards.coins = Player.addCoins(rewards.coins, 'level');
    Player.addXP(rewards.xp + Math.min(40, Math.max(0, (bs.bestCombo || 0) - 3) * 5));
    d.lastLevel = r.event ? d.lastLevel : r.id;
    Player.checkAchievements();
    GC.Save.save();
    return rewards;
  };

    const d = D();

    if (d.challenge.day !== today) {

      // Undgå mål der ikke kan lade sig gøre endnu
      const pool = CHALLENGES.filter((c) => !(c.id === 'jelly' && d.unlockedLevel < 6) && !(c.id === 'ingredients' && d.unlockedLevel < 9) && !(c.id === 'blockers' && d.unlockedLevel < 13));

      d.challenge = { day: today, id: c.id, target: rng.pick(c.n), progress: 0, done: false, claimed: false };
      GC.Save.soon();
    }
    const c = CHALLENGES.find((x) => x.id === d.challenge.id) || CHALLENGES[0];

    const def = CHALLENGES.find((x) => x.id === c.id);

    const ch = D().challenge;
    if (def.max) ch.progress = Math.max(ch.progress, amount);
    else ch.progress += amount;
    if (ch.progress >= ch.target) { ch.progress = ch.target; ch.done = true; emit('challengeDone', c); }

  };

  const Events = { EVENTS, forced: null };
  Events.active = function (date) {
    if (Events.forced) return EVENTS.find((e) => e.id === Events.forced) || null;

    const md = (date.getMonth() + 1) * 100 + date.getDate();
    for (const e of EVENTS) {
      const [fm, fd] = e.from.split('-').map(Number), [tm, td] = e.to.split('-').map(Number);

    def.worldName = e.name;

  <script>
/* js/renderer.js */
/* ==========================================================================
   GREJS CRUSH – renderer.js
   Tegner boardet på et <canvas> og afspiller motorens steps som
   animationer: swap, pop, specialeffekter, fald, chokolade, shuffle.
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};
  const E = () => GC.ease;

  const BLOCKER_KIND = { 1: 'licorice', 2: 'crate', 3: 'choc' };

  class Renderer {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.sprites = new Map();
      this.fx = [];          // aktive board-effekter (stråler, chokbølger, lyn)
      this.selected = null;
      this.hint = null;
      this.cursor = null;
      this.showCursor = false;
      this.targetMode = null; // booster-sigte
      this.hover = null;
      this.cell = 50;
      this.pad = 8;
      this.debugGrid = false;
      this.debugMoves = null;
      this.callbacks = {};
      this._settleResolvers = [];
      this.time = 0;
      this._tick = this._tick.bind(this);
    }

    // ------------------------------------------------------------------------
    //  Opsætning
    // ------------------------------------------------------------------------
    setup(board) {
      this.board = board;
      this.w = board.w; this.h = board.h;
      this.voids = [];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) this.voids.push(board.cells[y][x].void);
      this.exits = board.ingTotal > 0 ? board.exitY.slice() : null;
      this.layers = board.snapshot();
      this.sprites.clear();
      this.fx = [];
      for (const t of board.exportTiles()) this.sprites.set(t.id, this._makeSprite(t, t.x, t.y));
      this.selected = null; this.hint = null;
      this.resize();
      GC.Loop.add(this._tick);
    }
    destroy() { GC.Loop.remove(this._tick); this.sprites.clear(); }

    _makeSprite(t, x, y) {
      return { id: t.id, color: t.color, special: t.special, ing: t.ing, x, y, scale: 1, alpha: 1, rot: 0,
        path: null, v: 0, tween: null, state: 'idle', squash: 0, flash: 0, delay: 0 };
    }

    resize() {
      const wrap = this.canvas.parentElement;
      if (!wrap || !this.w) return;
      const availW = wrap.clientWidth, availH = wrap.clientHeight;
      const cell = Math.floor(Math.min((availW - 12) / this.w, (availH - 12) / this.h, 86));
      this.cell = Math.max(24, cell);
      this.pad = Math.round(this.cell * 0.16);
      const dpr = Math.min(2, root.devicePixelRatio || 1);
      this.dpr = dpr;
      GC.Art.setScale(dpr);
      const W = this.w * this.cell + this.pad * 2, H = this.h * this.cell + this.pad * 2;
      this.cssW = W; this.cssH = H;
      this.canvas.width = Math.round(W * dpr);
      this.canvas.height = Math.round(H * dpr);
      this.canvas.style.width = W + 'px';
      this.canvas.style.height = H + 'px';

    }

    _buildClip() {
      this._outline = null;
      const p = new Path2D();
      const s = this.cell;
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        if (!this.voids[y * this.w + x]) p.rect(this.pad + x * s - 0.5, this.pad + y * s - 0.5, s + 1, s + 1);
      }
      this.clip = p;
    }

    /** Skærm-koordinater -> celle. */
    cellAt(clientX, clientY) {
      const r = this.canvas.getBoundingClientRect();
      const x = Math.floor((clientX - r.left - this.pad) / this.cell);
      const y = Math.floor((clientY - r.top - this.pad) / this.cell);
      if (x < 0 || y < 0 || x >= this.w || y >= this.h || this.voids[y * this.w + x]) return null;
      return [x, y];
    }
    /** Celle-centrum i side-koordinater (til partikler). */
    pageXY(x, y) {
      const r = this.canvas.getBoundingClientRect();
      return [r.left + this.pad + (x + 0.5) * this.cell, r.top + this.pad + (y + 0.5) * this.cell];
    }
    _cx(x) { return this.pad + (x + 0.5) * this.cell; }
    _cy(y) { return this.pad + (y + 0.5) * this.cell; }

    // ------------------------------------------------------------------------
    //  Animationsløkke
    // ------------------------------------------------------------------------
    _tick(dt, now) {
      if (!this.board) return;
      this.time = now;
      const sp = GC.Quality.speed();
      let moving = false;
      for (const s of this.sprites.values()) {
        if (s.delay > 0) { s.delay -= dt; moving = true; continue; }
        if (s.tween) {
          const tw = s.tween;
          tw.t += dt * sp;
          const k = Math.min(1, tw.t / tw.dur);
          const e = tw.ease(k);
          s.x = tw.fx + (tw.tx - tw.fx) * e;
          s.y = tw.fy + (tw.ty - tw.fy) * e;
          if (tw.arc) { s.y -= Math.sin(k * Math.PI) * tw.arc; }
          if (k >= 1) { s.tween = null; if (tw.done) tw.done(); } else moving = true;
        }
        if (s.path && s.path.length) {
          moving = true;
          s.v = Math.min(0.05, s.v + 0.00011 * dt * sp);
          let dist = s.v * dt * sp;
          while (dist > 0 && s.path.length) {
            const [tx, ty] = s.path[0];
            const dx = tx - s.x, dy = ty - s.y;
            const d = Math.hypot(dx, dy);
            if (d <= dist) { s.x = tx; s.y = ty; dist -= d; s.path.shift(); }
            else { s.x += dx / d * dist; s.y += dy / d * dist; dist = 0; }
          }
          if (!s.path.length) {
            s.path = null;
            s.squash = 1; s.v = 0;
            if (s.onLand) { const f = s.onLand; s.onLand = null; f(s); }
          }
        }
        if (s.squash > 0) { s.squash = Math.max(0, s.squash - dt / 180 * sp); }
        if (s.flash > 0) s.flash = Math.max(0, s.flash - dt / 300);
        if (s.state === 'pop') {
          s.popT += dt * sp;
          const k = Math.min(1, s.popT / 230);
          s.scale = k < 0.35 ? 1 + k * 0.9 : Math.max(0, 1.32 * (1 - (k - 0.35) / 0.65));
          s.alpha = 1 - Math.max(0, (k - 0.5) * 2);
          if (k >= 1) this.sprites.delete(s.id); else moving = true;
        } else if (s.state === 'appear') {
          s.popT += dt * sp;
          const k = Math.min(1, s.popT / 320);
          s.scale = E().outBack(k);
          if (k >= 1) { s.state = 'idle'; s.scale = 1; } else moving = true;
        } else if (s.state === 'exit') {
          s.popT += dt * sp;
          const k = Math.min(1, s.popT / 500);
          s.y += dt * 0.004; s.alpha = 1 - k; s.scale = 1 + k * 0.4;
          if (k >= 1) this.sprites.delete(s.id); else moving = true;
        }
      }
      for (let i = this.fx.length - 1; i >= 0; i--) {
        const f = this.fx[i];
        f.t += dt;
        if (f.t >= f.life) this.fx.splice(i, 1);
      }
      this.draw();
      if (!moving && this._settleResolvers.length) {
        const rs = this._settleResolvers; this._settleResolvers = [];

    }

    /** Promise der opfyldes når alle brikker står stille. */
    settled() {
      return new Promise((res) => this._settleResolvers.push(res));
    }
    wait(ms) { return GC.wait(ms / GC.Quality.speed()); }

    // ------------------------------------------------------------------------
    //  Tegning
    // ------------------------------------------------------------------------
    draw() {
      const ctx = this.ctx, s = this.cell, pad = this.pad, dpr = this.dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, this.cssW, this.cssH);
      const theme = GC.Player ? GC.Player.boardTheme() : { a: 'rgba(40,20,90,0.55)', b: 'rgba(255,255,255,0.1)', c: 'rgba(255,255,255,0.18)' };
      const t = this.time;

      // Baggrundsfelter
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        if (this.voids[y * this.w + x]) continue;
        const px = pad + x * s, py = pad + y * s;
        ctx.fillStyle = theme.a;
        ctx.fillRect(px - 0.5, py - 0.5, s + 1, s + 1);
        ctx.fillStyle = (x + y) % 2 ? theme.b : theme.c;
        GC.Art.roundRect(ctx, px + 2, py + 2, s - 4, s - 4, s * 0.16); ctx.fill();
      }
      // Ramme omkring felterne
      ctx.save();
