      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2.5;
      ctx.stroke(this._outline || (this._outline = this._buildOutline()));
      ctx.restore();

      // Jelly og blockers fra lag-snapshot
      const L = this.layers;
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const l = L[y * this.w + x];
        if (!l) continue;
        const px = pad + x * s, py = pad + y * s;
        if (l[0] > 0) GC.Art.drawJelly(ctx, px, py, s, l[0], t);
      }
      // Exit-pile for ingredienser
      if (this.exits) {
        ctx.save();
        for (let x = 0; x < this.w; x++) {
          const y = this.exits[x]; if (y < 0) continue;
          const px = this._cx(x), py = pad + (y + 1) * s - 2 + Math.sin(t * 0.006 + x) * 2;
          ctx.fillStyle = '#7dff8a'; ctx.strokeStyle = '#0d5a1a'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(px - s * 0.16, py - s * 0.08); ctx.lineTo(px + s * 0.16, py - s * 0.08); ctx.lineTo(px, py + s * 0.12); ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      }
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const l = L[y * this.w + x];
        if (!l || !l[1]) continue;
        const px = pad + x * s, py = pad + y * s;
        const kind = BLOCKER_KIND[l[1]];
        if (kind === 'crate') GC.Art.drawCrate(ctx, px, py, s, l[2]);
        else if (kind === 'licorice') GC.Art.drawLicorice(ctx, px, py, s, l[2]);
        else if (kind === 'choc') GC.Art.drawChocolate(ctx, px, py, s);
      }

      // Hint-glød under brikker
      if (this.hint) {
        const k = (Math.sin(t * 0.008) + 1) / 2;
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,200,' + (0.18 + k * 0.25) + ')';
        for (const [hx, hy] of this.hint) { GC.Art.roundRect(ctx, pad + hx * s + 2, pad + hy * s + 2, s - 4, s - 4, s * 0.2); ctx.fill(); }
        ctx.restore();
      }

      // Brikker (klippet til boardets felter)
      ctx.save();
      ctx.clip(this.clip);
      const size = s;
      for (const sp of this.sprites.values()) {
        if (sp.delay > 0) continue;
        let sc = sp.scale;
        let sx = sc, sy = sc;
        if (sp.squash > 0) { const q = Math.sin(sp.squash * Math.PI) * 0.14; sx *= 1 + q; sy *= 1 - q; }
        let ox = 0, oy = 0;
        if (this.selected && this.selected[2] === sp.id) { const k = 1 + Math.sin(t * 0.012) * 0.06 + 0.06; sx *= k; sy *= k; }
        if (this.hint && sp.state === 'idle' && !sp.tween && !sp.path && this.hint.some(([hx, hy]) => hx === Math.round(sp.x) && hy === Math.round(sp.y))) {
          ox = Math.sin(t * 0.02) * s * 0.04;
        }
        const img = GC.Art.tileSprite(sp, size);
        const dw = img.width / this.dpr * sx, dh = img.height / this.dpr * sy;
        const cx = this._cx(sp.x) + ox, cy = this._cy(sp.y) + oy + (1 - sy) * s * 0.3;
        ctx.globalAlpha = sp.alpha;
        if (sp.special === 'cbomb') {
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.002); ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh); ctx.restore();
        } else if (sp.special && sp.state === 'idle') {
          const pulse = 1 + Math.sin(t * 0.006 + sp.id) * 0.035;
          ctx.drawImage(img, cx - dw * pulse / 2, cy - dh * pulse / 2, dw * pulse, dh * pulse);
        } else {
          ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
        }
        if (sp.flash > 0) {
          ctx.globalAlpha = sp.flash;
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(cx, cy, s * 0.42 * sc, 0, 6.283); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      // Is og låse ovenpå brikkerne
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const l = L[y * this.w + x];
        if (!l) continue;
        const px = pad + x * s, py = pad + y * s;
        if (l[3] > 0) GC.Art.drawIce(ctx, px, py, s, l[3]);
        if (l[4]) GC.Art.drawLock(ctx, px, py, s);
      }

      // Markering af valgt brik / tastatur-cursor / booster-sigte
      if (this.selected) this._ring(this.selected[0], this.selected[1], '#fff', 3.5);
      if (this.showCursor && this.cursor) this._ring(this.cursor[0], this.cursor[1], '#ffe36b', 3, true);
      if (this.targetMode && this.hover) {
        const [hx, hy] = this.hover;
        ctx.save();
        ctx.fillStyle = 'rgba(255,80,80,0.28)';
        if (this.targetMode === 'row') ctx.fillRect(pad, pad + hy * s, this.w * s, s);
        else if (this.targetMode === 'bomb') ctx.fillRect(pad + (hx - 2) * s, pad + (hy - 2) * s, s * 5, s * 5);
        else ctx.fillRect(pad + hx * s, pad + hy * s, s, s);
        ctx.restore();
      }

      // Effekter
      for (const f of this.fx) this._drawFx(f);

      // Debug
      if (this.debugGrid) {
        ctx.save(); ctx.strokeStyle = 'rgba(0,255,255,0.5)'; ctx.lineWidth = 1;
        ctx.font = '10px monospace'; ctx.fillStyle = '#0ff';
        for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
          ctx.strokeRect(pad + x * s, pad + y * s, s, s);
          ctx.fillText(x + ',' + y, pad + x * s + 2, pad + y * s + 10);
        }
        ctx.restore();
      }
      if (this.debugMoves) {
        ctx.save(); ctx.strokeStyle = '#0f0'; ctx.lineWidth = 3;
        for (const m of this.debugMoves) {
          ctx.beginPath(); ctx.moveTo(this._cx(m.a[0]), this._cy(m.a[1])); ctx.lineTo(this._cx(m.b[0]), this._cy(m.b[1])); ctx.stroke();
        }
        ctx.restore();
      }
    }

    _buildOutline() {
      // Kontur rundt om alle ikke-void celler (kanter mod void/udenfor)
      const p = new Path2D(), s = this.cell, pad = this.pad;
      const isC = (x, y) => x >= 0 && y >= 0 && x < this.w && y < this.h && !this.voids[y * this.w + x];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        if (!isC(x, y)) continue;
        const px = pad + x * s, py = pad + y * s;
        if (!isC(x, y - 1)) { p.moveTo(px, py); p.lineTo(px + s, py); }
        if (!isC(x, y + 1)) { p.moveTo(px, py + s); p.lineTo(px + s, py + s); }
        if (!isC(x - 1, y)) { p.moveTo(px, py); p.lineTo(px, py + s); }
        if (!isC(x + 1, y)) { p.moveTo(px + s, py); p.lineTo(px + s, py + s); }
      }
      return p;
    }

    _ring(x, y, color, lw, dashed) {
      const ctx = this.ctx, s = this.cell;
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = lw;
      ctx.shadowColor = color; ctx.shadowBlur = 10;
      if (dashed) ctx.setLineDash([6, 4]);
      GC.Art.roundRect(ctx, this.pad + x * s + 3, this.pad + y * s + 3, s - 6, s - 6, s * 0.2);
      ctx.stroke();
      ctx.restore();
    }

    _drawFx(f) {
      const ctx = this.ctx, s = this.cell;
      const k = f.t / f.life;
      ctx.save();
      if (f.kind === 'line') {
        const a = 1 - k;
        const col = f.color >= 0 ? GC.Art.TILE_TYPES[f.color].glow : '#ffffff';
        const thick = s * (f.wide ? 0.7 : 0.45) * (1 - k * 0.5);
        ctx.globalCompositeOperation = 'lighter';
        const grad = f.dir === 'h'
          ? ctx.createLinearGradient(0, this._cy(f.y) - thick, 0, this._cy(f.y) + thick)
          : ctx.createLinearGradient(this._cx(f.x) - thick, 0, this._cx(f.x) + thick, 0);
        grad.addColorStop(0, 'rgba(255,255,255,0)'); grad.addColorStop(0.5, col); grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.globalAlpha = a;
        ctx.fillStyle = grad;
        const reach = Math.min(1, k * 4) ;
        if (f.dir === 'h') {
          const cx = this._cx(f.x), L = this.w * s * reach;
          ctx.fillRect(cx - L, this._cy(f.y) - thick, L * 2, thick * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
          ctx.fillRect(cx - L, this._cy(f.y) - thick * 0.18, L * 2, thick * 0.36);
        } else {
          const cy = this._cy(f.y), L = this.h * s * reach;
          ctx.fillRect(this._cx(f.x) - thick, cy - L, thick * 2, L * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
          ctx.fillRect(this._cx(f.x) - thick * 0.18, cy - L, thick * 0.36, L * 2);
        }
      } else if (f.kind === 'bomb') {
        const cx = this._cx(f.x), cy = this._cy(f.y);
        const R = (f.r + 0.5) * s * E().outCubic(k);
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, R));
        const col = f.color >= 0 ? GC.Art.TILE_TYPES[f.color].glow : '#ffb040';
        g.addColorStop(0, 'rgba(255,255,255,' + (1 - k) + ')'); g.addColorStop(0.4, col); g.addColorStop(1, 'rgba(255,120,0,0)');
        ctx.globalAlpha = 1 - k;
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,' + (1 - k) + ')'; ctx.lineWidth = 4 * (1 - k) + 1;
        ctx.beginPath(); ctx.arc(cx, cy, R * 1.05, 0, 6.283); ctx.stroke();
      } else if (f.kind === 'lightning') {
        const cx = this._cx(f.x), cy = this._cy(f.y);
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = f.col; ctx.lineWidth = 3; ctx.shadowColor = f.col; ctx.shadowBlur = 12;
        ctx.globalAlpha = k < 0.7 ? 1 : (1 - k) / 0.3;
        const shown = Math.ceil(f.targets.length * Math.min(1, k * 2.5));
        for (let i = 0; i < shown; i++) {
          const [tx, ty] = f.targets[i];
          const ex = this._cx(tx), ey = this._cy(ty);
          ctx.beginPath(); ctx.moveTo(cx, cy);
          const segs = 5;
          for (let j = 1; j < segs; j++) {
            const q = j / segs;
            ctx.lineTo(cx + (ex - cx) * q + (Math.random() - 0.5) * s * 0.4, cy + (ey - cy) * q + (Math.random() - 0.5) * s * 0.4);
          }
          ctx.lineTo(ex, ey); ctx.stroke();
        }
      } else if (f.kind === 'flash') {
        ctx.globalAlpha = (1 - k) * 0.85;
        ctx.fillStyle = f.col || '#fff';
        ctx.fillRect(0, 0, this.cssW, this.cssH);
      } else if (f.kind === 'hammer') {
        const cx = this._cx(f.x), cy = this._cy(f.y);
        ctx.translate(cx, cy - s * 0.6 * (1 - E().outQuad(Math.min(1, k * 2))));
        ctx.rotate(-0.8 + Math.min(1, k * 2) * 0.9);
        ctx.font = Math.round(s * 0.9) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.globalAlpha = 1 - Math.max(0, k - 0.6) / 0.4;
        ctx.fillText('🔨', 0, 0);
      }
      ctx.restore();
    }

    // ------------------------------------------------------------------------
    //  Afspilning af steps
    // ------------------------------------------------------------------------
    async play(steps) {
      for (const st of steps) {
        try { await this.playStep(st); }
        catch (e) { console.error('Animationsfejl', e); this.syncFromBoard(); }
      }
    }

    /** Nødbremse: sæt sprites direkte fra motorens tilstand. */
    syncFromBoard() {
      this.sprites.clear();
      for (const t of this.board.exportTiles()) this.sprites.set(t.id, this._makeSprite(t, t.x, t.y));
      this.layers = this.board.snapshot();
    }

    async playStep(st) {
      const cb = this.callbacks;
      switch (st.type) {
        case 'swap': case 'swapBack': {
          const a = this.sprites.get(st.ida), b = this.sprites.get(st.idb);
          const [ax, ay] = st.a, [bx, by] = st.b;
          const back = st.type === 'swapBack';
          if (!back) GC.Audio.play('swap');
          else { GC.Audio.play('invalid'); GC.Audio.vibrate(20); }
          const dur = 170;
          if (a) a.tween = { fx: a.x, fy: a.y, tx: back ? ax : bx, ty: back ? ay : by, t: 0, dur, ease: E().inOutQuad };
          if (b) b.tween = { fx: b.x, fy: b.y, tx: back ? bx : ax, ty: back ? by : ay, t: 0, dur, ease: E().inOutQuad };
          await this.settled();
          if (back) { if (a) a.squash = 1; if (b) b.squash = 1; }
          break;
        }
        case 'wave': await this._playWave(st); break;
        case 'fall': await this._playFall(st); break;
        case 'choc': {
          const sp = this.sprites.get(st.id);
          if (sp) { sp.state = 'pop'; sp.popT = 0; }
          GC.Audio.play('choc');
          const [px, py] = this.pageXY(st.to[0], st.to[1]);
          GC.Particles.burst(px, py, '#6b3a1e', 12, { speed: 3 });
          await this.wait(160);
          this.layers = st.layers;
          await this.wait(120);
          break;
        }
        case 'shuffle': {
          GC.Audio.play('shuffle');
          const cxm = (this.w - 1) / 2, cym = (this.h - 1) / 2;
          const ms = st.moves;
          // Saml mod midten og spred ud igen
          for (const m of ms) {
            const sp = this.sprites.get(m.id); if (!sp) continue;
            sp.tween = { fx: sp.x, fy: sp.y, tx: cxm + (sp.x - cxm) * 0.15, ty: cym + (sp.y - cym) * 0.15, t: 0, dur: 280, ease: E().inQuad };
          }
          await this.settled();
          for (const m of ms) {
            const sp = this.sprites.get(m.id); if (!sp) continue;
            sp.color = m.color;
            sp.tween = { fx: sp.x, fy: sp.y, tx: m.x, ty: m.y, t: 0, dur: 420, ease: E().outBack };
          }
          await this.settled();
          this.layers = st.layers;
          break;
        }
        case 'transform': {
          for (const it of st.items) {
            const sp = this.sprites.get(it.id);
            if (sp) { sp.special = it.special; sp.flash = 1; sp.squash = 1; }
            const [px, py] = this.pageXY(it.x, it.y);
            GC.Particles.stars(px, py, 5);
            GC.Audio.play('select');
            await this.wait(45);
          }
          await this.wait(200);
          break;
        }
      }
      if (st.stats && cb.onStats) cb.onStats(st.stats);
    }

    async _playWave(st) {
      const cb = this.callbacks;
      const q = GC.Quality.particles();
      let extraWait = 0;
      // 1) Effekter fra aktiverede specialbrikker
      for (const f of st.effects || []) {
        if (f.kind === 'line') {
          this.fx.push({ kind: 'line', dir: f.dir, x: f.x, y: f.y, color: f.color, wide: f.wide, t: 0, life: 420 });
          GC.Audio.play('stripe'); GC.Shake.add(4); GC.Audio.vibrate(30);
          const [px, py] = this.pageXY(f.x, f.y);
          GC.Particles.burst(px, py, '#ffffff', 10, { speed: 7 });
        } else if (f.kind === 'bomb') {
          this.fx.push({ kind: 'bomb', x: f.x, y: f.y, r: f.r, color: f.color, t: 0, life: 480 });
          GC.Audio.play('bomb'); GC.Shake.add(f.big ? 14 : 8); GC.Audio.vibrate(f.big ? [40, 30, 60] : 50);
          const [px, py] = this.pageXY(f.x, f.y);
          GC.Particles.ring(px, py, '#fff', this.cell * (f.r + 1), 500);
          GC.Particles.burst(px, py, f.color >= 0 ? GC.Art.TILE_TYPES[f.color].glow : '#ffb040', 30, { speed: 10 });
          extraWait = Math.max(extraWait, 60);
        } else if (f.kind === 'cbomb') {
          const col = f.color >= 0 ? GC.Art.TILE_TYPES[f.color].glow : '#fff';
          this.fx.push({ kind: 'lightning', x: f.x, y: f.y, targets: f.targets || [], col, t: 0, life: 600 });
          GC.Audio.play('cbomb'); GC.Shake.add(9); GC.Audio.vibrate([30, 20, 30, 20, 60]);
          const [px, py] = this.pageXY(f.x, f.y);
          GC.Particles.stars(px, py, 20, '#ffffff');
          if (f.transform) extraWait = Math.max(extraWait, 250);
          await this.wait(330);
        } else if (f.kind === 'cbomb2') {
          this.fx.push({ kind: 'flash', t: 0, life: 700, col: '#fff' });
          GC.Audio.play('cbomb'); GC.Audio.play('bomb'); GC.Shake.add(20); GC.Audio.vibrate([80, 40, 120]);
          const [px, py] = this.pageXY(f.x, f.y);
          GC.Particles.stars(px, py, 60, '#ffffff');
          GC.Particles.ring(px, py, '#fff', this.cell * 8, 800);
          await this.wait(250);
        } else if (f.kind === 'hammer') {
          this.fx.push({ kind: 'hammer', x: f.x, y: f.y, t: 0, life: 420 });
          GC.Audio.play('booster');
          await this.wait(200);
          GC.Shake.add(6);
        }
      }
      if (st.comboSwap) { GC.Shake.add(10); GC.Audio.vibrate(60); }
      // 2) Transformationer (farvebombe + stribe/bombe)
      if (st.transformed && st.transformed.length) {
        for (const tr of st.transformed) {
          const sp = this.sprites.get(tr.id);
          if (sp) { sp.special = tr.special; sp.flash = 1; }
        }
        GC.Audio.play('booster');
      }
      // 3) Fjern brikker
      let specialsHit = 0;
      for (const c of st.cleared) {
        const sp = this.sprites.get(c.id);
        if (sp) { sp.state = 'pop'; sp.popT = 0; sp.flash = 0.8; sp.tween = null; sp.path = null; }
        const [px, py] = this.pageXY(c.x, c.y);
        const col = c.color >= 0 ? GC.Art.TILE_TYPES[c.color].glow : '#ffffff';
        if (q > 0.2 || Math.random() < 0.4) GC.Particles.burst(px, py, col, c.kind === 'match' ? 9 : 5, { speed: c.kind === 'match' ? 4.5 : 6 });
        if (c.special) specialsHit++;
      }
      if (st.cleared.length && !st.effects.length && st.score.length) {
        const matchSize = st.cleared.length;
        if (st.created.some((c) => c.special === 'cbomb')) GC.Audio.play('match5');
        else if (st.created.length) GC.Audio.play('match4');
        else GC.Audio.play('match', st.combo);
        GC.Audio.vibrate(matchSize > 4 ? 25 : 12);
      }
      // 4) Skade på forhindringer
      for (const d of st.damaged) {
        const [px, py] = this.pageXY(d.x, d.y);
        if (d.what === 'jelly') GC.Particles.burst(px, py, '#ff7ad0', 7, { speed: 3, kind: 0 });
        else if (d.what === 'ice') { GC.Particles.burst(px, py, '#e6f8ff', 12, { speed: 5 }); GC.Audio.play('ice'); }
        else if (d.what === 'crate' || d.what === 'licorice') { GC.Particles.burst(px, py, d.what === 'crate' ? '#c9964f' : '#3a3344', 12, { speed: 5, grav: 0.3 }); GC.Audio.play('crate'); }
        else if (d.what === 'choc') { GC.Particles.burst(px, py, '#6b3a1e', 12, { speed: 5, grav: 0.3 }); GC.Audio.play('crate'); }
        else if (d.what === 'lock') { GC.Particles.burst(px, py, '#e0b060', 10, { speed: 5 }); GC.Audio.play('unlock'); }
      }
      // 5) Point-popups
      for (const sc of st.score) {
        const [px, py] = this.pageXY(sc.x, sc.y);
        const col = sc.color >= 0 ? GC.Art.TILE_TYPES[sc.color].c1 : '#fff6a8';
        GC.Particles.text(px, py, '+' + GC.fmt(sc.pts), col, Math.round(Math.min(34, 18 + Math.log10(sc.pts + 1) * 3)));
      }
      if (cb.onWave) cb.onWave(st);
      await this.wait(110);
      this.layers = st.layers;
      // 6) Nye specialbrikker popper frem
      for (const c of st.created) {
        const sp = this._makeSprite(c, c.x, c.y);
        sp.state = 'appear'; sp.popT = 0; sp.scale = 0; sp.flash = 1;
        this.sprites.set(c.id, sp);
        const [px, py] = this.pageXY(c.x, c.y);
        GC.Particles.stars(px, py, 10);
      }
      if (st.created.length && cb.onSpecialCreated) cb.onSpecialCreated(st.created);
      await this.wait(130 + extraWait + (specialsHit ? 60 : 0));
    }

    async _playFall(st) {
      let landed = 0;
      for (const p of st.paths) {
        let sp = this.sprites.get(p.id);
        if (!sp && p.spawn) {
          sp = this._makeSprite(p.spawn, p.pts[0][0], p.pts[0][1]);
          this.sprites.set(p.id, sp);
        }
        if (!sp) continue;
        sp.tween = null;
        if (sp.state === 'appear') { sp.state = 'idle'; sp.scale = 1; }
        const pts = p.pts.slice(1);
        sp.path = pts.length ? pts : null;
        sp.v = 0.004;
        sp.onLand = () => { landed++; };
      }
      for (const c of st.collected) {
        const sp = this.sprites.get(c.id);
        const done = () => {
          const s2 = this.sprites.get(c.id);
          if (s2) { s2.state = 'exit'; s2.popT = 0; }
          const [px, py] = this.pageXY(c.x, c.y);
          GC.Particles.stars(px, py, 16, '#7dff8a');
          GC.Particles.text(px, py - 20, '+' + GC.fmt(GC.SCORE.ingredient), '#7dff8a', 26);
          GC.Audio.play('ingredient');
          if (this.callbacks.onIngredient) this.callbacks.onIngredient(c);
        };
        if (sp && sp.path) sp.onLand = done; else done();
      }
      await this.settled();
      this.layers = st.layers;
      if (landed > 0 && GC.Quality.speed() < 1.5) await this.wait(40);
    }

    /** Intro: brikkerne falder ind ovenfra ved levelstart (spec §74). */
    async intro() {
      const list = [...this.sprites.values()];
      for (const sp of list) {
        const ty = sp.y, tx = sp.x;
        sp.y = ty - this.h - 1 - (this.w - sp.x) * 0.15;
        sp.path = [[tx, ty]];
        sp.v = 0.004;
        sp.delay = (this.h - ty) * 25 + tx * 12;
      }
      await this.settled();
    }

    /** Lille rystelse af en brik (fx ved ulovligt træk på forhindring). */
    nudge(x, y) {
      for (const sp of this.sprites.values()) if (Math.round(sp.x) === x && Math.round(sp.y) === y) sp.squash = 1;
    }
  }

  GC.Renderer = Renderer;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/ui.js */
/* ==========================================================================
   GREJS CRUSH – ui.js
   Skærmskift, modaler, toasts, karakter-dialoger, sejr/nederlag-skærme,
   level-preview og topbar.
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};
  const $ = (s) => document.querySelector(s);
  const esc = (s) => GC.escapeHtml(s);

  const UI = { current: null };

  // ------------------------------------------------------------------------
  //  Skærme
  // ------------------------------------------------------------------------
  UI.show = function (name) {
    document.querySelectorAll('.screen').forEach((s) => {
      const on = s.id === 'screen-' + name;
      s.classList.toggle('active', on);
      s.setAttribute('aria-hidden', on ? 'false' : 'true');
    });
    document.body.dataset.screen = name;
    UI.current = name;
    UI.updateTopbar();
    const scr = $('#screen-' + name);
    if (scr) scr.scrollTop = 0;
  };

  UI.applyBackground = function (world) {
    const bgSet = GC.Save.data.cosmetics.background;
    const themes = { meadow: 1, sugar: 2, frost: 6, lava: 9, night: 'night' };
    let w = bgSet !== 'auto' && themes[bgSet] ? themes[bgSet] : world;
    document.body.dataset.bg = String(w || 1);
  };

  // ------------------------------------------------------------------------
  //  Topbar (liv, coins, stjerner)
  // ------------------------------------------------------------------------
  UI.updateTopbar = function () {
    const d = GC.Save.data;
    if (!d) return;
    GC.Player.updateLives();
    const lives = GC.Player.unlimited() ? '∞' : d.lives;
    const t = GC.Player.nextLifeIn();
    document.querySelectorAll('[data-bind="lives"]').forEach((e) => { e.textContent = lives; });
    document.querySelectorAll('[data-bind="lifetimer"]').forEach((e) => {
      e.textContent = GC.Player.unlimited() ? 'Uendelig' : d.lives >= GC.Player.MAX_LIVES ? 'Fuld' : GC.fmtTime(t);
    });
    document.querySelectorAll('[data-bind="coins"]').forEach((e) => { e.textContent = GC.fmt(d.coins); });
    document.querySelectorAll('[data-bind="stars"]').forEach((e) => { e.textContent = GC.Player.totalStars(); });
    document.querySelectorAll('[data-bind="plevel"]').forEach((e) => { e.textContent = d.player.level; });
    const xpA = GC.Player.xpFor(d.player.level), xpB = GC.Player.xpFor(d.player.level + 1);
    document.querySelectorAll('[data-bind="xpbar"]').forEach((e) => { e.style.width = Math.min(100, (d.player.xp - xpA) / (xpB - xpA) * 100) + '%'; });
  };

  /** Coins flyver mod tælleren (spec §78) */
  UI.flyCoins = function (fromEl, n) {
    const target = document.querySelector('.topbar [data-bind="coins"]') || document.querySelector('[data-bind="coins"]');
    const r1 = fromEl ? fromEl.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
    const r2 = target ? target.getBoundingClientRect() : { left: innerWidth - 60, top: 20, width: 0, height: 0 };
    const count = Math.min(12, Math.max(3, Math.round(n / 50)));
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'fly-coin';
      c.textContent = '🪙';
      c.style.left = (r1.left + r1.width / 2) + 'px';
      c.style.top = (r1.top + r1.height / 2) + 'px';
      document.body.appendChild(c);
      const dx = r2.left + r2.width / 2 - (r1.left + r1.width / 2), dy = r2.top + r2.height / 2 - (r1.top + r1.height / 2);
      const midX = (Math.random() - 0.5) * 160;
      setTimeout(() => {
        c.animate([
          { transform: 'translate(0,0) scale(1)' },
          { transform: 'translate(' + (dx / 2 + midX) + 'px,' + (dy / 2 - 80) + 'px) scale(1.3)', offset: 0.45 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(0.6)' }
        ], { duration: 750, easing: 'ease-in-out' }).onfinish = () => { c.remove(); GC.Audio.play('coin'); };
      }, i * 70);
    }
    setTimeout(() => { document.querySelectorAll('.topbar .pill-coins').forEach((p) => { p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }); UI.updateTopbar(); }, 800 + count * 70);
  };

  // ------------------------------------------------------------------------
  //  Modaler
  // ------------------------------------------------------------------------
  let modalStack = [];
  /**
   * @param {{title, html, buttons:[{text, cls, action, keepOpen}], cls, closable, onClose}} o
   */
  UI.modal = function (o) {
    const rootEl = $('#modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal ' + (o.cls || '');
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.setAttribute('aria-label', o.title ? o.title.replace(/<[^>]+>/g, '') : 'Dialog');
    wrap.innerHTML = '<div class="modal-backdrop"></div><div class="modal-card">' +
      (o.closable !== false ? '<button class="modal-x" aria-label="Luk">✕</button>' : '') +
      (o.title ? '<h2 class="modal-title">' + o.title + '</h2>' : '') +
      '<div class="modal-body">' + (o.html || '') + '</div>' +
      (o.buttons && o.buttons.length ? '<div class="modal-buttons">' + o.buttons.map((b, i) => '<button class="btn ' + (b.cls || 'btn-blue') + '" data-i="' + i + '">' + b.text + '</button>').join('') + '</div>' : '') +
      '</div>';
    rootEl.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('open'));
    const api = {
      el: wrap,
      close: () => {
        if (!wrap.isConnected || api.closed) return;
        api.closed = true;
        wrap.classList.remove('open');
        wrap.classList.add('closing');
        modalStack = modalStack.filter((m) => m !== api);
        setTimeout(() => wrap.remove(), 220);
        if (o.onClose) o.onClose();
      }
    };
    modalStack.push(api);
    if (o.closable !== false) {
      wrap.querySelector('.modal-x').addEventListener('click', () => { GC.Audio.play('button'); api.close(); });
      wrap.querySelector('.modal-backdrop').addEventListener('click', () => api.close());
    }
    (o.buttons || []).forEach((b, i) => {
      wrap.querySelector('.modal-buttons [data-i="' + i + '"]').addEventListener('click', () => {
        GC.Audio.play('button');
        if (b.action) b.action(api);
        if (!b.keepOpen) api.close();
      });
    });
    const first = wrap.querySelector('.modal-buttons .btn') || wrap.querySelector('.modal-x');
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 50);
    return api;
  };
  UI.closeTopModal = function () { const m = modalStack[modalStack.length - 1]; if (m) m.close(); return !!m; };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalStack.length) {
      const top = modalStack[modalStack.length - 1];
      if (top.el.querySelector('.modal-x')) { e.stopPropagation(); top.close(); }
    }
  }, true);

  UI.confirm = function (o) {
    return new Promise((res) => {
      let answered = false;
      UI.modal({
        title: o.title, html: '<p class="center">' + o.text + '</p>', cls: 'confirm-modal ' + (o.cls || ''),
        onClose: () => { if (!answered) res(false); },
        buttons: [
          { text: o.no || 'Nej', cls: 'btn-gray', action: () => { answered = true; res(false); } },
          { text: o.yes || 'Ja', cls: o.danger ? 'btn-red' : 'btn-green', action: () => { answered = true; res(true); } }
        ]
      });
    });
  };

  // ------------------------------------------------------------------------
  //  Toasts
  // ------------------------------------------------------------------------
  UI.toast = function (text, icon, cls) {
    const rootEl = $('#toast-root');
    const t = document.createElement('div');
    t.className = 'toast ' + (cls || '');
    t.setAttribute('role', 'status');
    t.innerHTML = (icon ? '<span class="toast-icon">' + icon + '</span>' : '') + '<span>' + text + '</span>';
    rootEl.appendChild(t);
    while (rootEl.children.length > 3) rootEl.firstChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 2600);
  };

  // ------------------------------------------------------------------------
  //  Karakter-dialog (spec §57)
  // ------------------------------------------------------------------------
  UI.dialog = function (charKey, text) {
    return new Promise((res) => {
      const C = GC.Art.CHARACTERS[charKey] || GC.Art.CHARACTERS.grejs;
      const el = document.createElement('div');
      el.className = 'char-dialog';
      el.setAttribute('role', 'dialog');
      el.innerHTML = '<div class="cd-char">' + GC.Art.character(charKey, { size: 110 }) + '</div>' +
        '<div class="cd-bubble"><div class="cd-name">' + esc(C.name) + '</div><div class="cd-text">' + esc(text) + '</div><button class="btn btn-green small cd-ok">OK!</button></div>';
      document.body.appendChild(el);
      requestAnimationFrame(() => el.classList.add('open'));
      const close = () => { el.classList.remove('open'); setTimeout(() => el.remove(), 300); document.removeEventListener('keydown', key); res(); };
      const key = (e) => { if (e.key === 'Enter' || e.key === 'Escape' || e.key === ' ') { e.preventDefault(); close(); } };
      el.querySelector('.cd-ok').addEventListener('click', () => { GC.Audio.play('button'); close(); });
      document.addEventListener('keydown', key);
      setTimeout(() => el.querySelector('.cd-ok').focus({ preventScroll: true }), 60);
    });
  };

  // ------------------------------------------------------------------------
  //  Level-preview (før spil)
  // ------------------------------------------------------------------------
  UI.levelPreview = function (def) {
    const info = GC.Player.levelInfo(def.id) || {};
    const goals = GC.Game.describeGoals(def);
    const stars = [0, 1, 2].map((i) => '<span class="pv-star ' + (i < (info.stars || 0) ? 'on' : '') + '">★</span>').join('');
    const mech = [];
    const L = def.layout.join('');
    if (def.jelly) mech.push('Jelly');
    if (/[123]/.test(L)) mech.push('Kasser');
    if (/[Bb]/.test(L)) mech.push('Lakrids');
    if (/C/.test(L)) mech.push('Chokolade');
    if (/[IK]/.test(L)) mech.push('Is');
    if (/L/.test(L)) mech.push('Låse');
    if (def.ingredients) mech.push('Ingredienser');
    const html = '<div class="pv">' +
      '<div class="pv-stars">' + stars + '</div>' +
      (info.best ? '<div class="pv-best">Bedste score: <b>' + GC.fmt(info.best) + '</b></div>' : '') +
      '<div class="pv-goals">' + goals.map((g) => '<div class="pv-goal"><span class="pv-gicon">' + g.icon + '</span><span>' + esc(g.desc) + '</span></div>').join('') + '</div>' +
      '<div class="pv-meta"><span>' + (def.time ? '⏱️ ' + def.time + ' sek.' : '👣 ' + def.moves + ' træk') + '</span><span>🎨 ' + def.colors + ' farver</span><span>📐 ' + def.w + '×' + def.h + '</span></div>' +
      (mech.length ? '<div class="pv-mech">' + mech.map((m) => '<span class="chip">' + m + '</span>').join('') + '</div>' : '') +
      '<div class="pv-diff">Sværhedsgrad <span class="diff-bar"><span style="width:' + (def.difficulty * 10) + '%"></span></span></div>' +
      '<div class="pv-thresholds">★ ' + GC.fmt(def.stars[0]) + ' · ★★ ' + GC.fmt(def.stars[1]) + ' · ★★★ ' + GC.fmt(def.stars[2]) + '</div>' +
      '</div>';
    UI.modal({
      title: def.event ? esc(def.eventName) : 'BANE ' + def.id, cls: 'preview-modal',
      html,
      buttons: [{ text: '▶ SPIL', cls: 'btn-green big', action: () => GC.App.playLevel(def) }]
    });
  };

  // ------------------------------------------------------------------------
  //  Ingen liv
  // ------------------------------------------------------------------------
  UI.noLives = function () {
    const m = UI.modal({
      title: 'Ingen liv tilbage 💔', cls: 'nolives-modal',
      html: '<div class="center"><div class="big-heart">❤️</div><p>Næste liv om <b data-bind="lifetimer">' + GC.fmtTime(GC.Player.nextLifeIn()) + '</b></p><p class="muted">Liv lades automatisk op – ét hvert ' + GC.Player.LIFE_MINUTES + '. minut.</p></div>',
      buttons: [
        { text: 'Fyld op: 900 🪙', cls: 'btn-green', action: () => {
          if (GC.Player.spend(900)) { GC.Player.addLives(GC.Player.MAX_LIVES - GC.Save.data.lives); GC.Audio.play('reward'); UI.toast('Liv fyldt op!', '❤️'); UI.updateTopbar(); }
          else UI.toast('Ikke nok coins', '🪙');
        } },
        { text: 'Vent', cls: 'btn-gray' }
      ]
    });
    return m;
  };

  // ------------------------------------------------------------------------
  //  Sejr (spec §41, §85)
  // ------------------------------------------------------------------------
  UI.showWin = function (o) {
    const { def, score, stars, rewards, bonus } = o;
    const nextId = def.id + 1;
    const hasNext = !def.event && nextId <= GC.Levels.COUNT;
    const html = '<div class="win">' +
      '<div class="win-stars">' + [0, 1, 2].map((i) => '<div class="win-star" data-i="' + i + '">★</div>').join('') + '</div>' +
      '<div class="win-score"><span class="ws-label">SCORE</span><span class="ws-val" id="win-score-val">0</span></div>' +
      (rewards.newBest || rewards.firstWin && score > 0 ? '<div class="win-best">' + (rewards.newBest ? 'NY REKORD!' : 'Første sejr!') + '</div>' : '') +
      (bonus ? '<div class="win-row"><span>Finale-bonus</span><b>+' + GC.fmt(bonus) + '</b></div>' : '') +
      '<div class="win-rewards">' +
      (rewards.coins ? '<div class="wr" id="win-coins"><span>🪙</span><b>+' + GC.fmt(rewards.coins) + '</b></div>' : '') +
      (rewards.xp ? '<div class="wr"><span>⚡</span><b>+' + rewards.xp + ' XP</b></div>' : '') +
      '</div>' +
      '<div class="win-char">' + GC.Art.character(def.character || 'grejs', { size: 84 }) + '<div class="win-quote">' + esc(winQuote(stars)) + '</div></div>' +
      '</div>';
    const m = UI.modal({
      title: '<span class="title-win">LEVEL COMPLETE!</span>', cls: 'win-modal', closable: false, html,
      buttons: [
        { text: '🗺 MAP', cls: 'btn-purple', action: () => def.event ? GC.App.openEvent() : GC.App.openMap() },
        { text: '↻ REPLAY', cls: 'btn-blue', action: () => GC.App.playLevel(def, true) },
        hasNext ? { text: 'NEXT LEVEL ▶', cls: 'btn-green big', action: () => GC.App.playLevel(GC.Levels.get(nextId)) } : null
      ].filter(Boolean)
    });
    // Konfetti og stjerne-animation
    GC.Particles.confetti(innerWidth / 2, innerHeight * 0.55, 80, 1.3);
    const starsEls = m.el.querySelectorAll('.win-star');
    starsEls.forEach((el, i) => {
      if (i >= stars) return;
      setTimeout(() => {
        el.classList.add('on');
        GC.Audio.play('star', i);
        const r = el.getBoundingClientRect();
        GC.Particles.stars(r.left + r.width / 2, r.top + r.height / 2, i === 2 ? 36 : 18);
        if (i === 2) { // ekstra stor animation ved 3 stjerner
          GC.Particles.ring(r.left + r.width / 2, r.top + r.height / 2, '#ffe36b', 220, 700);
          GC.Particles.confetti(innerWidth / 2, innerHeight, 120, 0.9);
          GC.Shake.add(6);
          m.el.classList.add('three-stars');
        }
      }, 450 + i * 420);
    });
    // Score tæller op
    const val = m.el.querySelector('#win-score-val');
    const t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / 1200);
      val.textContent = GC.fmt(score * GC.ease.outCubic(k));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    if (rewards.coins) setTimeout(() => UI.flyCoins(m.el.querySelector('#win-coins'), rewards.coins), 1500);
    UI.updateTopbar();
    // Kister og karakter-kommentar
    setTimeout(() => { GC.App.checkPendingRewards(); }, 2200);
    const W = GC.Levels.WORLDS;
    if (!def.event && def.id % 20 === 0 && rewards.firstWin && W[def.id / 20]) {
      setTimeout(() => UI.dialog(W[def.id / 20].char, 'Du klarede ' + W[def.id / 20 - 1].name + '! Velkommen til ' + W[def.id / 20].name + ' – ' + W[def.id / 20].mech.toLowerCase() + ' venter!'), 2600);
    } else if (!def.event && rewards.firstWin && def.id % 20 === 17) {
      setTimeout(() => UI.dialog(def.character, 'Du er næsten fremme! Kun få baner tilbage i ' + def.worldName + '.'), 2600);
    }
  };
  function winQuote(stars) {
    const q = stars === 3 ? ['Perfekt! Tre stjerner!', 'Wow – ren magi!', 'Det var jo helt vildt!'] : stars === 2 ? ['Godt klaret!', 'Flot spillet!', 'Sådan!'] : ['Du klarede den!', 'Hurra! Videre!', 'Klaret – prøv for flere stjerner!'];
    return q[Math.floor(Math.random() * q.length)];
  }

  // ------------------------------------------------------------------------
  //  Fortsæt-tilbud før nederlag
  // ------------------------------------------------------------------------
  UI.offerContinue = function (o) {
    return new Promise((res) => {
      let done = false;
      const goals = o.goals.map((g) => '<div class="lg ' + (g.done ? 'done' : '') + '"><span class="pv-gicon">' + g.icon + '</span><span>' + (g.done ? '✔' : g.label) + '</span></div>').join('');
      const btns = [];
      if (o.hasBooster) btns.push({ text: '➕ Brug Extra Move', cls: 'btn-green big', action: () => { done = true; res('booster'); } });
      btns.push({ text: (o.timed ? '+15 sek' : '+5 træk') + ' for ' + GC.fmt(o.cost) + ' 🪙', cls: o.hasBooster ? 'btn-blue' : 'btn-green big', action: () => { done = true; res('coins'); } });
      btns.push({ text: 'Giv op', cls: 'btn-gray', action: () => { done = true; res('giveup'); } });
      UI.modal({
        title: o.timed ? 'Tiden er gået!' : 'Ikke flere træk!', cls: 'continue-modal', closable: false,
        html: '<div class="center"><p>Så tæt på! Du mangler:</p><div class="lose-goals">' + goals + '</div><p class="muted">Du har ' + GC.fmt(GC.Save.data.coins) + ' 🪙</p></div>',
        buttons: btns, onClose: () => { if (!done) res('giveup'); }
      });
    });
  };

  // ------------------------------------------------------------------------
  //  Nederlag (spec §42)
  // ------------------------------------------------------------------------
  UI.showLose = function (o) {
    const { def, score, goals } = o;
    const html = '<div class="lose">' +
      '<div class="lose-char">' + GC.Art.character(def.character || 'grejs', { size: 90 }) + '</div>' +
      '<div class="win-score"><span class="ws-label">SCORE</span><span class="ws-val">' + GC.fmt(score) + '</span></div>' +
      '<p class="lose-sub">Målet var:</p>' +
      '<div class="lose-goals">' + goals.map((g) => '<div class="lg ' + (g.done ? 'done' : '') + '"><span class="pv-gicon">' + g.icon + '</span><span>' + esc(g.desc) + '</span><b>' + (g.done ? '✔' : 'mangler ' + g.label) + '</b></div>').join('') + '</div>' +
      '<p class="muted">' + (GC.Player.unlimited() ? 'Du har uendelige liv lige nu!' : 'Du mistede 1 liv ❤️ (' + GC.Save.data.lives + ' tilbage)') + '</p>' +
      '</div>';
    UI.modal({
      title: '<span class="title-lose">LEVEL FAILED</span>', cls: 'lose-modal', closable: false, html,
      buttons: [
        { text: '🗺 MAP', cls: 'btn-purple', action: () => def.event ? GC.App.openEvent() : GC.App.openMap() },
        { text: '↻ TRY AGAIN', cls: 'btn-green big', action: () => GC.App.playLevel(def, true) }
      ]
    });
    UI.updateTopbar();
  };

  // ------------------------------------------------------------------------
  //  Settings-modal (fra pause)
  // ------------------------------------------------------------------------
  UI.openSettingsModal = function () {
    const m = UI.modal({ title: 'INDSTILLINGER', cls: 'settings-modal', html: '<div id="settings-modal-body"></div>', buttons: [{ text: 'OK', cls: 'btn-green' }] });
    GC.App.renderSettings(m.el.querySelector('#settings-modal-body'), true);
  };

  GC.UI = UI;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/map.js */
/* ==========================================================================
   GREJS CRUSH – map.js
   Det store verdenskort (spec §5, §35, §83, §84). Bane 1 ligger nederst,
   og stien snor sig op gennem de 10 verdener.
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};
  const esc = (s) => GC.escapeHtml(s);

  const GAP = 92;          // lodret afstand mellem baner (px)
  const PAD_BOTTOM = 150;  // plads til verdens-banner
  const DECOR = {
    meadow: ['🌼', '🌳', '🍄', '🦋', '🌷', '🐝'], sugar: ['🍭', '🍬', '🧁', '🍩', '🍡', '🎀'], choco: ['🍫', '⛰️', '🍪', '☕', '🏔️', '🥐'],
    jungle: ['🌴', '🦜', '🍌', '🐸', '🌿', '🦎'], caramel: ['🏖️', '🐚', '🌊', '⛵', '🦀', '🍯'], frost: ['❄️', '⛄', '🌨️', '🐧', '🧊', '🎿'],
    crystal: ['💎', '🔮', '✨', '🦇', '🪨', '🕯️'], magic: ['🎩', '🪄', '🌙', '🦉', '🏮', '⭐'], lava: ['🌋', '🔥', '🦎', '☄️', '🌶️', '🪨'],
    castle: ['🏰', '👑', '🚩', '🐉', '🛡️', '🗝️']
  };

  const Map = { built: false, el: null };

  function nodeX(i) { return 50 + Math.sin(i * 0.62) * 30 + Math.sin(i * 0.23) * 6; }

  Map.build = function () {
    const scroll = document.getElementById('map-scroll');
    const d = GC.Save.data;
    const worlds = GC.Levels.worldCount();
    const secH = 20 * GAP + PAD_BOTTOM;
    let html = '<div class="map-inner" style="height:' + (worlds * secH + 120) + 'px">';
    html += '<div class="map-top-cap"><div class="mtc-cloud">☁️</div><div class="mtc-text">Flere verdener kommer snart!</div></div>';
    for (let w = worlds - 1; w >= 0; w--) {
      const W = GC.Levels.worldOf(w * 20 + 1);
      const top = 120 + (worlds - 1 - w) * secH;
      const first = w * 20 + 1;
      const locked = first > d.unlockedLevel;
      let starsGot = 0;
      for (let i = first; i < first + 20; i++) starsGot += (d.levels[i] || {}).stars || 0;
      html += '<section class="world-sec theme-' + W.theme + (locked ? ' locked' : '') + '" style="top:' + top + 'px;height:' + secH + 'px;--w1:' + W.bg[0] + ';--w2:' + W.bg[1] + '" aria-label="Verden ' + (w + 1) + ': ' + esc(W.name) + '">';
      // Sti (SVG)
      let pts = '';
      for (let i = 0; i < 20; i++) {
        const gi = w * 20 + i;
        const y = secH - PAD_BOTTOM - i * GAP + 20;
        pts += (i ? ' L' : 'M') + nodeX(gi).toFixed(2) + ' ' + y;
      }
      // Forbind til næste verden
      pts += ' L' + nodeX(w * 20 + 20).toFixed(2) + ' ' + (secH - PAD_BOTTOM - 20 * GAP + 20);
      html += '<svg class="map-path" viewBox="0 0 100 ' + secH + '" preserveAspectRatio="none" aria-hidden="true"><path d="' + pts + '" class="mp-shadow"/><path d="' + pts + '" class="mp-road"/><path d="' + pts + '" class="mp-dash"/></svg>';
      // Dekorationer
      const rng = GC.makeRng(777 + w);
      const decor = DECOR[W.theme] || DECOR.meadow;
      for (let k = 0; k < 14; k++) {
        const y = 40 + rng() * (secH - 120);
        const side = rng() < 0.5;
        const x = side ? 3 + rng() * 16 : 81 + rng() * 15;
        html += '<span class="decor" aria-hidden="true" style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(0) + 'px;font-size:' + (22 + rng() * 22).toFixed(0) + 'px;animation-delay:-' + (rng() * 6).toFixed(1) + 's">' + decor[k % decor.length] + '</span>';
      }
      // Hjælper-figur
      html += '<div class="map-char" style="top:' + (secH * 0.42) + 'px;' + (w % 2 ? 'left:4%' : 'right:4%') + '" aria-hidden="true">' + GC.Art.character(W.char, { size: 78 }) + '</div>';
      // Verdens-banner nederst i sektionen
      html += '<div class="world-banner" style="top:' + (secH - PAD_BOTTOM + 60) + 'px"><div class="wb-num">VERDEN ' + (w + 1) + '</div><div class="wb-name">' + esc(W.name) + '</div><div class="wb-stars">★ ' + starsGot + '/60 · ' + esc(W.mech) + '</div></div>';
      if (locked) html += '<div class="world-lock" style="top:' + (secH / 2 - 40) + 'px">🔒<br><span>Gennemfør bane ' + (first - 1) + '</span></div>';
      // Level-noder
      for (let i = 0; i < 20; i++) {
        const id = first + i;
        if (id > GC.Levels.COUNT) break;
        const info = d.levels[id] || {};
        const st = info.stars || 0;
        const isLocked = id > d.unlockedLevel;
        const isCurrent = id === d.unlockedLevel;
        const y = secH - PAD_BOTTOM - i * GAP + 20;
        const cls = isLocked ? 'locked' : st ? 'done' : 'open';
        const boss = (i === 9 || i === 19) ? ' boss' : '';
        const def = GC.Levels.get(id);
        const timedCls = def.time ? ' timed' : '';
        const label = 'Bane ' + id + (isLocked ? ', låst' : st ? ', ' + st + ' stjerner, bedste score ' + GC.fmt(info.best || 0) : ', tilgængelig');
        html += '<button class="lvl-node ' + cls + boss + timedCls + (isCurrent ? ' current' : '') + '" data-id="' + id + '" style="left:' + nodeX(w * 20 + i).toFixed(2) + '%;top:' + y + 'px" aria-label="' + label + '">' +
          '<span class="ln-num">' + (isLocked ? '🔒' : id) + '</span>' +
          (st || !isLocked ? '<span class="ln-stars">' + [0, 1, 2].map((s) => '<i class="' + (s < st ? 'on' : '') + '">★</i>').join('') + '</span>' : '') +
          (def.time ? '<span class="ln-badge">⏱</span>' : '') +
          '</button>';
        const chest = GC.Player.CHESTS.find((c) => c.at === id);
        if (chest) {
          const claimed = d.chests.claimed.includes(chest.at);
          html += '<button class="map-chest ' + (claimed ? 'claimed' : GC.Player.completedCount() >= chest.at ? 'ready' : '') + '" data-chest="' + chest.at + '" style="left:calc(' + nodeX(w * 20 + i).toFixed(2) + '% + 46px);top:' + (y - 12) + 'px" aria-label="Bonuskiste ved ' + chest.at + ' baner">' + (claimed ? '📭' : '🧰') + '</button>';
        }
      }
      html += '</section>';
    }
    html += '</div>';
    scroll.innerHTML = html;
    scroll.querySelectorAll('.lvl-node').forEach((b) => b.addEventListener('click', () => onNode(+b.dataset.id, b)));
    scroll.querySelectorAll('.map-chest').forEach((b) => b.addEventListener('click', () => onChest(+b.dataset.chest, b)));
    Map.built = true;
    Map.placeAvatar();
  };

  Map.placeAvatar = function () {
    const scroll = document.getElementById('map-scroll');
    const cur = scroll.querySelector('.lvl-node.current') || scroll.querySelector('.lvl-node[data-id="' + Math.min(GC.Save.data.unlockedLevel, GC.Levels.COUNT) + '"]');
    let av = scroll.querySelector('.map-avatar');
    if (!av) { av = document.createElement('div'); av.className = 'map-avatar'; av.setAttribute('aria-hidden', 'true'); }
    av.innerHTML = GC.Art.character(GC.Save.data.player.avatar || 'grejs', { size: 58 });
    if (cur) { cur.parentElement.appendChild(av); av.style.left = cur.style.left; av.style.top = (parseFloat(cur.style.top) - 100) + 'px'; }
  };

  function onNode(id, btn) {
    GC.Audio.unlock();
    GC.Audio.play('button');
    if (id > GC.Save.data.unlockedLevel) {
      btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
      GC.UI.toast('Bane ' + id + ' er låst. Gennemfør bane ' + (id - 1) + ' først.', '🔒');
      return;
    }
    GC.UI.levelPreview(GC.Levels.get(id));
  }

  function onChest(at, btn) {
    const d = GC.Save.data;
    if (d.chests.claimed.includes(at)) { GC.UI.toast('Kisten er allerede åbnet.', '📭'); return; }
    if (GC.Player.completedCount() < at) { GC.UI.toast('Gennemfør ' + at + ' baner for at åbne denne kiste.', '🧰'); return; }
    GC.App.openChest(at, btn);
  }

  /** Vis kortet og scroll til nuværende bane. Spiller unlock-animation. */
  Map.show = function (opts) {
    opts = opts || {};
    Map.build();
    const scroll = document.getElementById('map-scroll');
    const d = GC.Save.data;
    const targetId = opts.focus || Math.min(d.unlockedLevel, GC.Levels.COUNT);
    const node = scroll.querySelector('.lvl-node[data-id="' + targetId + '"]');
    requestAnimationFrame(() => {
      if (node) {
        const sec = node.parentElement;
        const y = sec.offsetTop + parseFloat(node.style.top) - scroll.clientHeight * 0.55;
        if (opts.smoothFrom != null) {
          scroll.scrollTop = y + 260;
          setTimeout(() => scroll.scrollTo({ top: y, behavior: GC.Quality.reduceMotion ? 'auto' : 'smooth' }), 50);
        } else scroll.scrollTop = y;
      }
      if (d.newUnlock && node && +node.dataset.id === d.newUnlock) {
        const id = d.newUnlock;
        d.newUnlock = 0; GC.Save.soon();
        setTimeout(() => Map.unlockAnim(id), 500);
      }
    });
  };

  Map.unlockAnim = function (id) {
    const node = document.querySelector('#map-scroll .lvl-node[data-id="' + id + '"]');
    if (!node) return;
    node.classList.add('unlocking');
    GC.Audio.play('unlock');
    const r = node.getBoundingClientRect();
    GC.Particles.stars(r.left + r.width / 2, r.top + r.height / 2, 24);
    GC.Particles.ring(r.left + r.width / 2, r.top + r.height / 2, '#fff6a8', 90, 700);
    const tag = document.createElement('div');
    tag.className = 'new-level-tag';
    tag.textContent = 'NEW LEVEL!';
    tag.style.left = node.style.left; tag.style.top = (parseFloat(node.style.top) + 34) + 'px';
    node.parentElement.appendChild(tag);
    setTimeout(() => { tag.remove(); node.classList.remove('unlocking'); }, 2600);
  };

  Map.scrollToCurrent = function () { Map.show({ smoothFrom: true }); };

  GC.Map = Map;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/shop.js */
/* ==========================================================================
   GREJS CRUSH – shop.js
   Butik med sektionerne BOOSTERS, COINS, REWARDS og COSMETICS (spec §29).
   Alt købes med coins optjent i spillet – ingen rigtige penge (spec §71).
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};
  const esc = (s) => GC.escapeHtml(s);

  const Shop = { tab: 'boosters' };
  const GIFT_HOURS = 4;

  const BUNDLES = [
    { id: 'starter', name: 'Starter-pakke', icon: '🎒', price: 2000, items: { hammer: 1, shuffle: 1, lineBlast: 1, bomb: 1 } },
    { id: 'blaster', name: 'Sprænge-pakke', icon: '💥', price: 3500, items: { bomb: 2, colorBlast: 1, lineBlast: 2 } },
    { id: 'moves', name: 'Ekstra træk ×3', icon: '👣', price: 2600, items: { extraMoves: 3 } }
  ];

  Shop.render = function () {
    const el = document.getElementById('shop-content');
    const tabs = [['boosters', '🔨 BOOSTERS'], ['coins', '🪙 COINS'], ['rewards', '🎁 REWARDS'], ['cosmetics', '🎨 COSMETICS']];
    document.getElementById('shop-tabs').innerHTML = tabs.map(([k, t]) => '<button class="tab ' + (Shop.tab === k ? 'active' : '') + '" data-tab="' + k + '" role="tab" aria-selected="' + (Shop.tab === k) + '">' + t + '</button>').join('');
    document.querySelectorAll('#shop-tabs .tab').forEach((b) => b.addEventListener('click', () => { GC.Audio.play('button'); Shop.tab = b.dataset.tab; Shop.render(); }));
    el.innerHTML = Shop['tab_' + Shop.tab]();
    el.querySelectorAll('[data-buy]').forEach((b) => b.addEventListener('click', () => Shop.buy(b.dataset.buy, b)));
    el.querySelectorAll('[data-equip]').forEach((b) => b.addEventListener('click', () => {
      const [cat, id] = b.dataset.equip.split(':');
      if (GC.Player.equip(cat, id)) { GC.Audio.play('button'); applyCosmetics(); Shop.render(); GC.UI.toast('Udstyret!', '✨'); }
    }));
    el.querySelectorAll('[data-action]').forEach((b) => b.addEventListener('click', () => Shop.action(b.dataset.action, b)));
    GC.UI.updateTopbar();
  };

  Shop.tab_boosters = function () {
    const B = GC.Player.BOOSTERS;
    let h = '<div class="shop-grid">';
    for (const k in B) {
      h += '<div class="shop-card"><div class="sc-icon">' + B[k].icon + '</div><div class="sc-name">' + B[k].name + '</div><div class="sc-desc">' + esc(B[k].desc) + '</div>' +
        '<div class="sc-own">Du har: <b>' + GC.Player.boosterCount(k) + '</b></div>' +
        '<button class="btn btn-green small" data-buy="booster:' + k + '">' + GC.fmt(B[k].price) + ' 🪙</button></div>';
    }
    h += '</div><h3 class="shop-h">Pakker</h3><div class="shop-grid">';
    for (const b of BUNDLES) {
      const worth = Object.entries(b.items).reduce((a, [k, n]) => a + B[k].price * n, 0);
      h += '<div class="shop-card bundle"><div class="sc-icon">' + b.icon + '</div><div class="sc-name">' + b.name + '</div><div class="sc-desc">' +
        Object.entries(b.items).map(([k, n]) => n + '× ' + B[k].icon).join('  ') + '</div><div class="sc-save">Spar ' + Math.round((1 - b.price / worth) * 100) + '%</div>' +
        '<button class="btn btn-green small" data-buy="bundle:' + b.id + '">' + GC.fmt(b.price) + ' 🪙</button></div>';
    }
    h += '</div>';
    return h;
  };

  Shop.tab_coins = function () {
    const d = GC.Save.data;
    const giftAt = (d.shopGiftAt || 0) + GIFT_HOURS * 3600000;
    const giftReady = Date.now() >= giftAt;
    const spinReady = d.shopSpinDay !== GC.dayKey();
    return '<p class="shop-note">Coins optjenes ved at spille – ingen rigtige penge, ingen reklamer. 💚</p><div class="shop-grid">' +
      '<div class="shop-card"><div class="sc-icon">🎁</div><div class="sc-name">Gratis gave</div><div class="sc-desc">50–250 coins hver ' + GIFT_HOURS + '. time.</div>' +
      (giftReady ? '<button class="btn btn-green small" data-action="gift">ÅBN</button>' : '<button class="btn btn-gray small" disabled>Klar om ' + GC.fmtTime((giftAt - Date.now()) / 1000) + '</button>') + '</div>' +
      '<div class="shop-card"><div class="sc-icon">🎡</div><div class="sc-name">Lykkehjulet</div><div class="sc-desc">Ét gratis spin om dagen. Vind coins, boosters eller liv!</div>' +
      (spinReady ? '<button class="btn btn-green small" data-action="spin">SPIN</button>' : '<button class="btn btn-gray small" disabled>I morgen igen</button>') + '</div>' +
      '<div class="shop-card"><div class="sc-icon">❤️</div><div class="sc-name">Fyld liv op</div><div class="sc-desc">Få alle ' + GC.Player.MAX_LIVES + ' liv med det samme.</div>' +
      '<button class="btn btn-green small" data-buy="lives">900 🪙</button></div>' +
      '<div class="shop-card"><div class="sc-icon">♾️</div><div class="sc-name">Uendelige liv</div><div class="sc-desc">1 time uden at miste liv.</div>' +
      '<button class="btn btn-green small" data-buy="unlimited">2.500 🪙</button></div>' +
      '</div><div class="shop-tips"><h3>Sådan tjener du coins</h3><ul><li>Vind baner (første sejr giver mest)</li><li>Nye stjerner giver bonus</li><li>Daily reward og daily challenge</li><li>Achievements og bonuskister</li><li>Spiller-level op</li></ul></div>';
  };

  Shop.tab_rewards = function () {
    const d = GC.Save.data;
    const ds = GC.Player.dailyStatus();
    let h = '<h3 class="shop-h">Daily reward</h3><div class="daily-row">';
    GC.Player.DAILY.forEach((r, i) => {
      const claimed = i < ds.dayIndex || (!ds.canClaim && i === ds.dayIndex);
      const today = ds.canClaim && i === ds.dayIndex;
      h += '<div class="daily-day ' + (claimed ? 'claimed' : '') + (today ? ' today' : '') + (i === 6 ? ' big' : '') + '"><div class="dd-n">Dag ' + (i + 1) + '</div><div class="dd-icon">' + (r.coins && !r.boosters ? '🪙' : i === 6 ? '👑' : i === 5 ? '♾️' : '🎁') + '</div><div class="dd-t">' + esc(r.text) + '</div>' + (claimed ? '<div class="dd-check">✔</div>' : '') + '</div>';
    });
    h += '</div>' + (ds.canClaim ? '<button class="btn btn-green" data-action="daily">HENT DAGENS BELØNNING</button>' : '<p class="muted center">Kom tilbage i morgen for dag ' + ((ds.dayIndex + 1) % 7 + 1) + '! Streak: ' + ds.streak + '</p>');
    const c = GC.Player.challenge();
    h += '<h3 class="shop-h">Daily challenge</h3><div class="challenge-card"><div class="ch-text">' + esc(c.text) + '</div>' +
      '<div class="progress"><span style="width:' + Math.min(100, c.progress / c.target * 100) + '%"></span><em>' + GC.fmt(c.progress) + ' / ' + GC.fmt(c.target) + '</em></div>' +
      (c.done && !c.claimed ? '<button class="btn btn-green small" data-action="challenge">HENT 250 🪙 + 🔨</button>' : c.claimed ? '<div class="muted">✔ Klaret i dag</div>' : '<div class="muted">Belønning: 250 🪙 + 150 XP + 🔨</div>') + '</div>';
    h += '<h3 class="shop-h">Bonuskister</h3><div class="chest-row">';
    GC.Player.CHESTS.forEach((ch) => {
      const claimed = d.chests.claimed.includes(ch.at);
      const ready = !claimed && GC.Player.completedCount() >= ch.at;
      h += '<div class="chest ' + (claimed ? 'claimed' : ready ? 'ready' : '') + '"><div class="chest-icon">' + (claimed ? '📭' : '🧰') + '</div><div>' + ch.at + ' baner</div>' +
        (ready ? '<button class="btn btn-green small" data-action="chest:' + ch.at + '">ÅBN</button>' : '<div class="muted small">' + (claimed ? 'Åbnet' : GC.Player.completedCount() + '/' + ch.at) + '</div>') + '</div>';
    });
    h += '</div>';
    return h;
  };

  Shop.tab_cosmetics = function () {
    const C = GC.Player.COSMETICS;
    const cur = GC.Save.data.cosmetics;
    const section = (cat, title, curId, preview) => {
      let h = '<h3 class="shop-h">' + title + '</h3><div class="shop-grid cosm">';
      for (const it of C[cat]) {
        const key = cat + ':' + it.id;
        const owned = GC.Player.owns(key);
        const equipped = curId === it.id;
        if (it.price < 0 && !owned) { h += '<div class="shop-card locked"><div class="sc-prev">' + preview(it) + '</div><div class="sc-name">' + esc(it.name) + '</div><div class="muted small">Event-belønning</div></div>'; continue; }
        h += '<div class="shop-card ' + (equipped ? 'equipped' : '') + '"><div class="sc-prev">' + preview(it) + '</div><div class="sc-name">' + esc(it.name) + '</div>' +
          (equipped ? '<div class="sc-eq">✔ I brug</div>' : owned ? '<button class="btn btn-blue small" data-equip="' + key + '">BRUG</button>' : '<button class="btn btn-green small" data-buy="cosm:' + key + '">' + GC.fmt(it.price) + ' 🪙</button>') + '</div>';
      }
      return h + '</div>';
    };
    return '<p class="shop-note">Cosmetics ændrer kun udseendet – aldrig gameplay.</p>' +
      section('avatar', 'Avatarer', cur.avatar, (it) => GC.Art.character(it.id, { size: 64 })) +
      section('board', 'Board-temaer', cur.board, (it) => '<div class="board-swatch" style="background:' + it.a + '"><i style="background:' + it.b + '"></i><i style="background:' + it.c + '"></i><i style="background:' + it.c + '"></i><i style="background:' + it.b + '"></i></div>') +
      section('bg', 'Baggrunde', cur.background, (it) => '<div class="bg-swatch bg-' + it.id + '"></div>') +
      section('tiles', 'Brik-temaer', cur.tiles, (it) => '<div class="tile-swatch tiles-' + it.id + '">❤💧🍃⭐</div>');
  };

  Shop.buy = function (what, btn) {
    const [kind, a, b] = what.split(':');
    const B = GC.Player.BOOSTERS;
    let price = 0, give = null, label = '';
    if (kind === 'booster') { price = B[a].price; give = () => GC.Player.giveBooster(a, 1); label = B[a].name; }
    else if (kind === 'bundle') { const bd = BUNDLES.find((x) => x.id === a); price = bd.price; give = () => { for (const k in bd.items) GC.Player.giveBooster(k, bd.items[k]); }; label = bd.name; }
    else if (kind === 'lives') {
      if (GC.Save.data.lives >= GC.Player.MAX_LIVES) { GC.UI.toast('Du har allerede fulde liv!', '❤️'); return; }
      price = 900; give = () => GC.Player.addLives(GC.Player.MAX_LIVES - GC.Save.data.lives); label = 'Liv';
    } else if (kind === 'unlimited') { price = 2500; give = () => { GC.Save.data.unlimitedLivesUntil = Math.max(Date.now(), GC.Save.data.unlimitedLivesUntil) + 3600000; }; label = 'Uendelige liv'; }
    else if (kind === 'cosm') {
      const it = GC.Player.COSMETICS[a].find((x) => x.id === b);
      price = it.price; give = () => { GC.Player.grantCosmetic(a + ':' + b); GC.Player.equip(a, b); applyCosmetics(); }; label = it.name;
    }
    if (!GC.Player.spend(price)) { GC.Audio.play('invalid'); GC.UI.toast('Ikke nok coins – spil flere baner!', '🪙'); btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); return; }
    give();
    GC.Save.data.stats.purchases++;
    GC.Player.checkAchievements();
    GC.Save.save();
    GC.Audio.play('coin');
    const r = btn.getBoundingClientRect();
    GC.Particles.stars(r.left + r.width / 2, r.top, 14);
    GC.UI.toast('Købt: ' + esc(label), '✅');
    Shop.render();
  };

  Shop.action = function (act, btn) {
    const d = GC.Save.data;
    if (act === 'gift') {
      const n = 50 + Math.floor(Math.random() * 5) * 50;
      d.shopGiftAt = Date.now();
      GC.Player.addCoins(n, 'reward');
      GC.Audio.play('reward');
      GC.UI.flyCoins(btn, n);
      GC.UI.toast('+' + n + ' coins!', '🎁');
    } else if (act === 'spin') {
      Shop.spin();
      return;
    } else if (act === 'daily') {
      GC.App.claimDaily(btn);
    } else if (act === 'challenge') {
      const r = GC.Player.claimChallenge();
      if (r) { GC.Audio.play('reward'); GC.UI.flyCoins(btn, r.coins); GC.UI.toast('Challenge klaret! +' + r.coins + ' coins', '🏅'); }
    } else if (act.startsWith('chest:')) {
      GC.App.openChest(+act.split(':')[1], btn);
    }
    Shop.render();
  };

  // Lykkehjul
  const WHEEL = [
    { t: '100 🪙', coins: 100 }, { t: '🔨', boosters: { hammer: 1 } }, { t: '250 🪙', coins: 250 }, { t: '🔀', boosters: { shuffle: 1 } },
    { t: '❤️ +2', lives: 2 }, { t: '500 🪙', coins: 500 }, { t: '💣', boosters: { bomb: 1 } }, { t: '1000 🪙', coins: 1000 }
  ];
  Shop.spin = function () {
    const d = GC.Save.data;
    if (d.shopSpinDay === GC.dayKey()) return;
    const weights = [22, 16, 18, 14, 10, 10, 6, 4];
    let r = Math.random() * weights.reduce((a, b) => a + b, 0), idx = 0;
    for (; idx < weights.length; idx++) { r -= weights[idx]; if (r <= 0) break; }
    idx = Math.min(idx, WHEEL.length - 1);
    d.shopSpinDay = GC.dayKey();
    GC.Save.save();
    const seg = 360 / WHEEL.length;
    const html = '<div class="wheel-wrap"><div class="wheel-pointer">▼</div><div class="wheel" id="wheel">' +
      WHEEL.map((w, i) => '<div class="wheel-seg" style="transform:rotate(' + (i * seg + seg / 2) + 'deg)"><span>' + w.t + '</span></div>').join('') + '</div></div><div class="center" id="wheel-result">&nbsp;</div>';
    const m = GC.UI.modal({ title: 'LYKKEHJULET', html, cls: 'wheel-modal', closable: false, buttons: [] });
    const wheel = m.el.querySelector('#wheel');
    const final = 360 * 5 + (360 - idx * seg - seg / 2);
    wheel.style.setProperty('--seg-count', WHEEL.length);
    requestAnimationFrame(() => { wheel.style.transform = 'rotate(' + final + 'deg)'; });
    let ticks = 0;
    const tick = setInterval(() => { if (++ticks < 22) GC.Audio.play('tick'); else clearInterval(tick); }, 150);
    setTimeout(() => {
      const w = WHEEL[idx];
      GC.Player.applyReward({ coins: w.coins, boosters: w.boosters, lives: w.lives });
      GC.Audio.play('reward');
      const rr = wheel.getBoundingClientRect();
      GC.Particles.confetti(rr.left + rr.width / 2, rr.top + rr.height / 2, 60, 3);
      m.el.querySelector('#wheel-result').innerHTML = '<b class="big">Du vandt ' + w.t + '!</b>';
      const btns = document.createElement('div');
      btns.className = 'modal-buttons';
      btns.innerHTML = '<button class="btn btn-green">SUPER!</button>';
      m.el.querySelector('.modal-card').appendChild(btns);
      btns.querySelector('button').addEventListener('click', () => { m.close(); Shop.render(); });
      btns.querySelector('button').focus();
    }, GC.Quality.reduceMotion ? 800 : 3600);
  };

  function applyCosmetics() {
    const c = GC.Save.data.cosmetics;
    GC.Art.theme = c.tiles || 'classic';
    GC.Art.cache.clear();
    GC.UI.applyBackground(document.body.dataset.world ? +document.body.dataset.world || 1 : 1);
    if (GC.Map.built) GC.Map.placeAvatar();
  }
  Shop.applyCosmetics = applyCosmetics;

  GC.Shop = Shop;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/boosters.js */
/* ==========================================================================
   GREJS CRUSH – boosters.js
   Booster-skærmen: inventar, forklaring og strategi-tips (spec §23-24, §70).
   Selve booster-effekterne ligger i motoren (board.js) og aktiveres fra game.js.
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};

  const TIPS = {
    hammer: 'Perfekt til den sidste jelly-celle eller en genstridig kasse.',
    shuffle: 'Brug den, når boardet ser håbløst ud – den skaber altid et gyldigt træk.',
    extraMoves: 'Gem den til slutningen: de ekstra træk bliver til bonus, hvis du vinder.',
    colorBlast: 'Vælg farven fra et farve-mål og ryd dem alle på én gang.',
    lineBlast: 'Ryd en række med ingredienser eller en hel stribe forhindringer.',
    bomb: 'Den største eksplosion – sigt efter klynger af forhindringer.',
    freeSwitch: 'Flyt en ingrediens ned eller sæt to specialbrikker sammen til en combo.'
  };

  const Boosters = {};
  Boosters.render = function () {
    const el = document.getElementById('boosters-content');
    const B = GC.Player.BOOSTERS;
    let h = '<div class="booster-list">';
    for (const k in B) {
      const n = GC.Player.boosterCount(k);
      h += '<div class="booster-row"><div class="br-icon">' + B[k].icon + '<span class="br-count">×' + n + '</span></div>' +
        '<div class="br-text"><div class="br-name">' + B[k].name + '</div><div class="br-desc">' + GC.escapeHtml(B[k].desc) + '</div><div class="br-tip">💡 ' + GC.escapeHtml(TIPS[k]) + '</div></div>' +
        '<button class="btn btn-green small" data-buy="' + k + '">' + GC.fmt(B[k].price) + ' 🪙</button></div>';
    }
    h += '</div><p class="shop-note">Boosters bruger ikke et træk. Alle baner kan klares uden boosters – de er hjælp og strategi, ikke et krav.</p>';
    el.innerHTML = h;
    el.querySelectorAll('[data-buy]').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.buy;
      if (!GC.Player.spend(B[k].price)) { GC.Audio.play('invalid'); GC.UI.toast('Ikke nok coins', '🪙'); return; }
      GC.Player.giveBooster(k, 1);
      GC.Save.data.stats.purchases++;
      GC.Player.checkAchievements();
      GC.Audio.play('coin');
      GC.UI.toast('Købt: ' + B[k].name, B[k].icon);
      Boosters.render();
      GC.UI.updateTopbar();
    }));
  };
  GC.Boosters = Boosters;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/game.js */
/* ==========================================================================
   GREJS CRUSH – game.js
   Styrer én spilsession på en bane: HUD, input (touch/mus/tastatur),
   træk, boosters, timer, pause, sejr og nederlag.

   Turn-flow (spec §75):
     input -> swap -> match? -> (nej: swap tilbage) -> opløs matches ->
     specialeffekter -> fjern -> tyngdekraft -> spawn -> kaskader ->
     mål -> sejr/nederlag -> mulige træk -> lås input op
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};

  const Game = {
    def: null, board: null, renderer: null,
    movesLeft: 0, timeLeft: 0, score: 0, stats: null,
    boardInputLocked: true, ended: false, paused: false,
    boosterMode: null, freeSwitch: false,
    usedBoosters: 0, movesMade: 0, idleT: 0, lastCombo: 0, timeWarned: false,
    extraMovesBought: 0
  };

  const $ = (sel) => document.querySelector(sel);

  // ------------------------------------------------------------------------
  //  Mål (spec §18)
  // ------------------------------------------------------------------------
  function goalView(g, st, def) {
    const T = GC.Art.TILE_TYPES;
    switch (g.type) {
      case 'score': return { icon: '<span class="gi-emoji">🏆</span>', cur: st.score, target: g.target, done: st.score >= g.target, label: GC.fmt(Math.max(0, g.target - st.score)), desc: 'Få ' + GC.fmt(g.target) + ' point' };
      case 'color': {
        const left = Math.max(0, g.count - st.colors[g.color]);
        return { icon: '<img alt="' + T[g.color].name + '" src="' + GC.Art.iconURL({ color: g.color, special: null, ing: -1 }, 36) + '">', done: left === 0, label: left, desc: 'Fjern ' + g.count + ' ' + T[g.color].name.toLowerCase() + 'e brikker' };
      }
      case 'jelly': return { icon: '<span class="gi-jelly"></span>', done: st.jelly === 0, label: st.jelly, desc: 'Fjern al jelly' };
      case 'blockers': return { icon: '<span class="gi-emoji">📦</span>', done: st.blockers === 0, label: st.blockers, desc: 'Fjern alle forhindringer' };
      case 'ingredients': {
        const left = Math.max(0, g.count - st.ingredients);
        const ing = def.ingredients && def.ingredients.kinds ? def.ingredients.kinds[0] : 0;
        return { icon: '<span class="gi-emoji">' + GC.Levels.INGREDIENTS[ing].emoji + '</span>', done: left === 0, label: left, desc: 'Få ' + g.count + ' ingredienser ned' };
      }
      case 'specials': { const left = Math.max(0, g.count - st.specials); return { icon: '<img alt="Specialbrik" src="' + GC.Art.iconURL({ color: 1, special: 'h', ing: -1 }, 36) + '">', done: left === 0, label: left, desc: 'Aktivér ' + g.count + ' specialbrikker' }; }
      case 'matches': { const left = Math.max(0, g.count - st.matches); return { icon: '<span class="gi-emoji">✨</span>', done: left === 0, label: left, desc: 'Lav ' + g.count + ' matches' }; }
    }
    return { icon: '?', done: true, label: '', desc: '' };
  }
  Game.goalView = goalView;
  Game.describeGoals = function (def) {
    const st = { score: 0, colors: [0, 0, 0, 0, 0, 0], jelly: countJelly(def), blockers: countBlockers(def), ingredients: 0, specials: 0, matches: 0 };
    return def.goals.map((g) => goalView(g, st, def));
  };
  function countJelly(def) { return def.jelly ? def.jelly.join('').replace(/0/g, '').length : 0; }
  function countBlockers(def) { let n = 0; for (const r of def.layout) for (const ch of r) if ('123BbCIKL'.includes(ch)) n++; return n; }

  function scoreOnly(def) { return def.goals.every((g) => g.type === 'score'); }

  // ------------------------------------------------------------------------
  //  Start af bane (spec §74)
  // ------------------------------------------------------------------------
  Game.start = async function (def) {
    GC.App.setState('LEVEL_LOADING');
    Game.cleanup();
    Game.def = def;
    Game.ended = false; Game.paused = false;
    Game.boosterMode = null; Game.freeSwitch = false;
    Game.usedBoosters = 0; Game.movesMade = 0; Game.idleT = 0; Game.lastCombo = 0; Game.timeWarned = false;
    Game.extraMovesBought = 0; Game.bestChain = 0; Game.playStart = Date.now();
    Game.movesLeft = def.moves || 0;
    Game.timeLeft = def.time || 0;
    Game.timed = !!def.time;
    Game.boardInputLocked = true;
    Game.board = new GC.Board(def, (Date.now() & 0xffffff) ^ (def.id * 131));
    Game.stats = Game.board.statsCopy();
    Game.initial = { jelly: Game.stats.jelly, blockers: Game.stats.blockers };

    GC.UI.show('game');
    document.body.dataset.world = def.event ? 'event' : String(def.world);
    GC.UI.applyBackground(def.world);
    buildHUD();
    const canvas = $('#board');
    if (!Game.renderer) {
      Game.renderer = new GC.Renderer(canvas);
      bindInput(canvas);
    }
    const r = Game.renderer;
    r.callbacks = {
      onStats: (st) => { Game.stats = st; updateHUD(); },
      onWave: onWave,
      onSpecialCreated: () => {},
      onIngredient: () => { GC.Audio.vibrate(30); }
    };
    r.setup(Game.board);
    r.debugGrid = !!GC.debugFlags.grid;
    GC.Audio.playMusic(def.event ? 4 : (def.world - 1) % 10);
    GC.Audio.setTempo(1);
    updateHUD();
    await r.intro();
    if (Game.def !== def) return;
    // Karakter-dialog / tip ved nye mekanikker (spec §57)
    if (def.tip && !GC.Save.data.seenDialogs['tip' + def.id]) {
      GC.Save.data.seenDialogs['tip' + def.id] = 1; GC.Save.soon();
      await GC.UI.dialog(def.character || 'grejs', def.tip);
    }
    GC.App.setState('PLAYING');
    Game.boardInputLocked = false;
    if (def.id === 1) setTimeout(() => showHint(), 1200);
  };

  Game.cleanup = function () {
    if (Game.renderer) { Game.renderer.destroy(); }
    Game.board = null;
    GC.Loop.remove(timerTick);
    GC.Loop.add(timerTick);
    const layer = $('#bigtext-layer'); if (layer) layer.innerHTML = '';
  };

  // ------------------------------------------------------------------------
  //  HUD
  // ------------------------------------------------------------------------
  function buildHUD() {
    const def = Game.def;
    $('#hud-level').textContent = def.event ? def.eventName : 'Bane ' + def.id;
    $('#hud-moves-label').textContent = Game.timed ? 'TID' : 'TRÆK';
    const goals = $('#hud-goals');
    goals.innerHTML = def.goals.map((g, i) => '<div class="goal" data-i="' + i + '"><div class="goal-icon"></div><div class="goal-count"></div><div class="goal-check">✔</div></div>').join('');
    // Stjernemarkører på score-bar
    const max = def.stars[2] * 1.05;
    const bar = $('#hud-starbar');
    bar.querySelectorAll('.sb-star').forEach((e) => e.remove());
    def.stars.forEach((s, i) => {
      const m = document.createElement('div');
      m.className = 'sb-star'; m.dataset.i = i;
      m.style.left = Math.min(96, (s / max) * 100) + '%';
      m.textContent = '★';
      bar.appendChild(m);
    });
    buildBoosterBar();
  }

  function buildBoosterBar() {
    const bar = $('#booster-bar');
    const B = GC.Player.BOOSTERS;
    bar.innerHTML = Object.keys(B).map((k) =>
      '<button class="booster-btn" data-b="' + k + '" aria-label="' + B[k].name + ': ' + B[k].desc + '" title="' + B[k].name + ' – ' + B[k].desc + '">' +
      '<span class="bb-icon">' + B[k].icon + '</span><span class="bb-count">' + GC.Player.boosterCount(k) + '</span></button>').join('');
    bar.querySelectorAll('.booster-btn').forEach((btn) => btn.addEventListener('click', () => onBooster(btn.dataset.b)));
  }
  function refreshBoosterBar() {
    document.querySelectorAll('.booster-btn').forEach((btn) => {
      const k = btn.dataset.b;
      btn.querySelector('.bb-count').textContent = GC.Player.boosterCount(k) || '+';
      btn.classList.toggle('empty', GC.Player.boosterCount(k) <= 0);
      btn.classList.toggle('active', Game.boosterMode === k || (k === 'freeSwitch' && Game.freeSwitch));
    });
  }

  let shownScore = 0;
  function updateHUD() {
    if (!Game.def) return;
    const st = Game.stats;
    const def = Game.def;
    const mv = $('#hud-moves');
    mv.classList.toggle('time', Game.timed);
    if (Game.timed) {
      mv.textContent = GC.fmtTime(Math.ceil(Game.timeLeft));
      mv.classList.toggle('warn', Game.timeLeft <= 10);
    } else {
      mv.textContent = Game.movesLeft;
      mv.classList.toggle('warn', Game.movesLeft <= 5);
    }
    // Score tæller op
    Game.score = st.score;
    const max = def.stars[2] * 1.05;
    $('#hud-starfill').style.width = Math.min(100, st.score / max * 100) + '%';
    document.querySelectorAll('#hud-starbar .sb-star').forEach((e) => {
      const on = st.score >= def.stars[+e.dataset.i];
      if (on && !e.classList.contains('on')) { e.classList.add('on'); GC.Audio.play('star', +e.dataset.i); }
    });
    def.goals.forEach((g, i) => {
      const v = goalView(g, st, def);
      const el = document.querySelector('.goal[data-i="' + i + '"]');
      if (!el) return;
      const ic = el.querySelector('.goal-icon');
      if (!ic.innerHTML) ic.innerHTML = v.icon;
      const cnt = el.querySelector('.goal-count');
      const txt = String(v.label);
      if (cnt.textContent !== txt) { cnt.textContent = txt; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
      el.classList.toggle('done', v.done);
      el.setAttribute('aria-label', v.desc + (v.done ? ' – klaret' : ' – mangler ' + v.label));
    });
    refreshBoosterBar();
  }
  Game.updateHUD = updateHUD;

  function animateScore(dt) {
    const target = Game.score || 0;
    if (shownScore !== target) {
      const diff = target - shownScore;
      shownScore += Math.sign(diff) * Math.max(1, Math.ceil(Math.abs(diff) * Math.min(1, dt / 120)));
      if (Math.abs(target - shownScore) < 2) shownScore = target;
      const el = $('#hud-score');
      if (el) el.textContent = GC.fmt(shownScore);
    }
  }

  // ------------------------------------------------------------------------
  //  Combo-tekster (spec §52)
  // ------------------------------------------------------------------------
  function onWave(st) {
    if (st.combo >= 2 && st.combo > Game.lastCombo && st.score.length) {
      Game.lastCombo = st.combo;
      const c = st.combo;
      let txt = 'COMBO!', cls = 'c1';
      if (c >= 12) { txt = 'ULTIMATE CRUSH!'; cls = 'c5'; }
      else if (c >= 10) { txt = 'MEGA CRUSH!'; cls = 'c4'; }
      else if (c >= 5) { txt = 'INCREDIBLE!'; cls = 'c3'; }
      else if (c >= 3) { txt = 'AMAZING!'; cls = 'c2'; }
      GC.bigText(txt, 'x' + c, 'combo ' + cls);
      GC.Audio.play('combo', c);
      if (c >= 5) { GC.Shake.add(4 + c); GC.Audio.vibrate([40, 30, 80]); }
      if (c >= 5) GC.Particles.rain(20 + c * 4);
    }
  }

  // ------------------------------------------------------------------------
  //  Input (spec §47, §48, §67)
  // ------------------------------------------------------------------------
  let drag = null;
  function bindInput(canvas) {
    canvas.addEventListener('pointerdown', (e) => {
      GC.Audio.unlock();
      if (!canInput()) return;
      const cell = Game.renderer.cellAt(e.clientX, e.clientY);
      if (!cell) return;
      Game.idleT = 0; Game.renderer.hint = null;
      Game.renderer.showCursor = false;
      if (Game.boosterMode) { applyTargetBooster(cell); return; }
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* */ }
      drag = { x: e.clientX, y: e.clientY, cell, moved: false };
    });
    canvas.addEventListener('pointermove', (e) => {
      const r = Game.renderer;
      if (Game.boosterMode) { r.hover = r.cellAt(e.clientX, e.clientY); return; }
      if (!drag || !canInput()) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      const th = r.cell * 0.32;
      if (Math.abs(dx) < th && Math.abs(dy) < th) return;
      const [cx, cy] = drag.cell;
      const dir = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
      drag.moved = true;
      const from = drag.cell;
      drag = null;
      r.selected = null;
      trySwap(from, [cx + dir[0], cy + dir[1]]);
    });
    const up = (e) => {
      if (!drag) return;
      const d = drag; drag = null;
      if (d.moved || !canInput()) return;
      // Tryk-tryk: vælg og byt med nabo
      tapCell(d.cell);
      void e;
    };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', () => { drag = null; });
    canvas.addEventListener('pointerleave', () => { if (Game.renderer) Game.renderer.hover = null; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    document.addEventListener('keydown', (e) => {
      if (GC.App.state !== 'PLAYING' && GC.App.state !== 'PAUSED') return;
