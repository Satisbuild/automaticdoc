/* css/style.css */
/* ==========================================================================
   GREJS CRUSH – style.css
   Globalt design: farver, baggrunde, knapper, topbar, forside, modaler,
   toasts, dialoger og store tekst-effekter.
   ========================================================================== */
:root {
  --font: 'Fredoka', 'Baloo 2', 'Nunito', 'Trebuchet MS', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ink: #2b1646;
  --white: #fff;
  --purple: #7b3fe4;
  --purple-d: #4d1fa3;
  --green: #3ccf4e;
  --green-d: #1f8f30;
  --blue: #2e9bff;
  --blue-d: #1463c2;
  --orange: #ff9a1f;
  --orange-d: #c65f00;
  --pink: #ff5ea8;
  --pink-d: #c42a72;
  --red: #ff4d5e;
  --red-d: #b8192c;
  --gray: #8a86a8;
  --gray-d: #5a5578;
  --gold: #ffd23f;
  --panel: rgba(255, 255, 255, 0.94);
  --panel-ink: #3a1f63;
  --topbar-h: 56px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius: 22px;
  --ui-scale: 1;
  color-scheme: light;
}
body.large-ui { --ui-scale: 1.15; font-size: 18px; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  color: var(--white);
  background: #5b2a9e;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
:focus-visible { outline: 3px solid #ffe36b; outline-offset: 2px; }

/* --------------------------------------------------------------------------
   Baggrunde per verden (animeret)
   -------------------------------------------------------------------------- */
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: linear-gradient(160deg, var(--bg1), var(--bg2)); transition: background 0.6s; }
body { --bg1: #8a4fe8; --bg2: #3b1a86; }
body[data-bg="1"] { --bg1: #7fdc7a; --bg2: #248a5a; }
body[data-bg="2"] { --bg1: #ff9fd0; --bg2: #b43a8a; }
body[data-bg="3"] { --bg1: #b98563; --bg2: #4f2a17; }
body[data-bg="4"] { --bg1: #7fd66a; --bg2: #1e6b48; }
body[data-bg="5"] { --bg1: #ffcf73; --bg2: #d0701b; }
body[data-bg="6"] { --bg1: #a9dfff; --bg2: #3a7fc4; }
body[data-bg="7"] { --bg1: #a47bff; --bg2: #3a1f8a; }
body[data-bg="8"] { --bg1: #7d8cff; --bg2: #2a2f8f; }
body[data-bg="9"] { --bg1: #ff8a5c; --bg2: #8a1a1a; }
body[data-bg="10"] { --bg1: #d9a8ff; --bg2: #5a2a9e; }
body[data-bg="night"] { --bg1: #2a2f6b; --bg2: #0b0b24; }
.bg-blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.45; animation: blob 18s ease-in-out infinite alternate; }
.bg-blob.b1 { width: 55vmax; height: 55vmax; left: -15vmax; top: -15vmax; background: rgba(255, 255, 255, 0.35); }
.bg-blob.b2 { width: 45vmax; height: 45vmax; right: -12vmax; bottom: -10vmax; background: rgba(255, 230, 120, 0.3); animation-duration: 23s; }
.bg-blob.b3 { width: 30vmax; height: 30vmax; left: 40%; top: 45%; background: rgba(255, 120, 200, 0.25); animation-duration: 29s; }
.bg-dots { position: absolute; inset: -50%; background-image: radial-gradient(rgba(255, 255, 255, 0.18) 2px, transparent 2.5px); background-size: 38px 38px; animation: dots 60s linear infinite; }
@keyframes blob { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
@keyframes dots { to { transform: translate(38px, 38px) rotate(0.001deg); } }
body.reduce-motion .bg-blob, body.reduce-motion .bg-dots, body.perf .bg-dots { animation: none; }

/* --------------------------------------------------------------------------
   Loading
   -------------------------------------------------------------------------- */
#loading { position: fixed; inset: 0; z-index: 9999; background: linear-gradient(160deg, #8a4fe8, #3b1a86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; transition: opacity 0.5s; }
#loading.done { opacity: 0; pointer-events: none; }
.ld-logo { font-size: 54px; font-weight: 700; text-align: center; line-height: 0.95; color: #ffe36b; text-shadow: 0 4px 0 #b0470a, 0 8px 18px rgba(0, 0, 0, 0.3); }
.ld-bar { width: 200px; height: 14px; border-radius: 10px; background: rgba(0, 0, 0, 0.25); overflow: hidden; }
.ld-bar span { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #ffe36b, #ff9a1f); border-radius: 10px; animation: ld 1s ease-in-out infinite alternate; }
@keyframes ld { to { transform: translateX(150%); } }

/* --------------------------------------------------------------------------
   Knapper
   -------------------------------------------------------------------------- */
.btn {
  --c: var(--blue); --cd: var(--blue-d);
  position: relative; border: 0; border-radius: 18px; padding: 12px 20px; min-height: 48px;
  font-size: calc(18px * var(--ui-scale)); font-weight: 700; letter-spacing: 0.5px; color: #fff;
  background: linear-gradient(180deg, var(--c) 0%, var(--cd) 100%);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, white) 0%, var(--c) 45%, var(--cd) 100%);
  box-shadow: 0 5px 0 var(--cd), 0 8px 16px rgba(0, 0, 0, 0.25), inset 0 2px 0 rgba(255, 255, 255, 0.45);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
  transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
}
.btn::after { content: ''; position: absolute; left: 10%; right: 10%; top: 4px; height: 36%; border-radius: 12px; background: linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0)); pointer-events: none; }
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--cd), 0 3px 8px rgba(0, 0, 0, 0.25), inset 0 2px 0 rgba(255, 255, 255, 0.45); }
.btn:disabled { filter: grayscale(0.6) brightness(0.9); cursor: default; }
.btn-green { --c: var(--green); --cd: var(--green-d); }
.btn-blue { --c: var(--blue); --cd: var(--blue-d); }
.btn-purple { --c: var(--purple); --cd: var(--purple-d); }
.btn-orange { --c: var(--orange); --cd: var(--orange-d); }
.btn-pink { --c: var(--pink); --cd: var(--pink-d); }
.btn-red { --c: var(--red); --cd: var(--red-d); }
.btn-gray { --c: var(--gray); --cd: var(--gray-d); }
.btn.small { min-height: 38px; padding: 7px 14px; font-size: calc(15px * var(--ui-scale)); border-radius: 14px; box-shadow: 0 4px 0 var(--cd), 0 6px 12px rgba(0, 0, 0, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.45); }
.btn.big { font-size: calc(21px * var(--ui-scale)); padding: 14px 26px; }
.btn.huge { font-size: calc(30px * var(--ui-scale)); padding: 16px 30px; min-height: 70px; border-radius: 26px; width: 100%; animation: pulse-btn 1.8s ease-in-out infinite; }
@keyframes pulse-btn { 50% { transform: scale(1.04); } }
body.reduce-motion .btn.huge { animation: none; }
.btn .badge, .badge { position: absolute; top: -8px; right: -6px; background: var(--red); color: #fff; font-size: 14px; min-width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 var(--red-d); animation: bob 1s ease-in-out infinite; }
.btn-back, .btn-round {
  width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.8); background: rgba(40, 10, 80, 0.45);
  color: #fff; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
}
.btn-back:active, .btn-round:active { transform: scale(0.92); }
.shake { animation: shake 0.4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* --------------------------------------------------------------------------
   Topbar
   -------------------------------------------------------------------------- */
.topbar {
  position: fixed; z-index: 50; top: 0; left: 0; right: 0; height: calc(var(--topbar-h) + var(--safe-top)); padding: calc(8px + var(--safe-top)) 10px 6px;
  display: flex; justify-content: center; gap: 8px; pointer-events: none;
}
body[data-screen="game"] .topbar { display: none; }
.pill {
  pointer-events: auto; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 6px; border-radius: 22px; border: 0;
  background: rgba(35, 10, 70, 0.55); color: #fff; font-size: 18px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35), 0 4px 10px rgba(0, 0, 0, 0.2);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.pill .pi { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; }
.pill b { font-weight: 700; min-width: 18px; }
.pill small { font-size: 12px; opacity: 0.85; }
.pill-plus { background: var(--green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; margin-left: 2px; }
.pill.bump { animation: bump 0.35s; }
@keyframes bump { 40% { transform: scale(1.18); } }

/* --------------------------------------------------------------------------
   Skærme
   -------------------------------------------------------------------------- */
#app { position: fixed; inset: 0; z-index: 1; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; animation: screen-in 0.35s ease-out; }
@keyframes screen-in { from { opacity: 0; transform: scale(0.98); } }
body.reduce-motion .screen.active { animation: none; }
.screen-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(var(--topbar-h) + var(--safe-top) + 4px) 14px 8px; }
.screen-head h1 { margin: 0; font-size: calc(28px * var(--ui-scale)); letter-spacing: 1px; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); flex: 1; text-align: center; }
.screen-head > span { width: 48px; }
.screen-body { flex: 1; overflow-y: auto; padding: 8px 14px calc(24px + var(--safe-bottom)); -webkit-overflow-scrolling: touch; }
.screen-body > * { max-width: 760px; margin-left: auto; margin-right: auto; }

/* --------------------------------------------------------------------------
   Forside
   -------------------------------------------------------------------------- */
#screen-menu { overflow-y: auto; }
.menu-wrap { max-width: 520px; width: 100%; margin: 0 auto; padding: calc(var(--topbar-h) + var(--safe-top) + 6px) 16px calc(24px + var(--safe-bottom)); display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 100%; }
.logo { text-align: center; line-height: 0.9; margin-top: 4px; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.25)); }
.logo-line { display: flex; justify-content: center; gap: 2px; }
.logo-line span {
  display: inline-block; font-size: clamp(54px, 15vw, 88px); font-weight: 700;
  color: #ffe36b; -webkit-text-stroke: 3px #7a2a00; paint-order: stroke fill;
  text-shadow: 0 6px 0 #b0470a, 0 10px 0 rgba(0, 0, 0, 0.2);
  animation: letter 2.4s ease-in-out infinite;
}
.logo-line.l2 span { color: #ff6fb5; -webkit-text-stroke-color: #6b0f3e; text-shadow: 0 6px 0 #a81d5f, 0 10px 0 rgba(0, 0, 0, 0.2); }
.logo-line span:nth-child(2) { animation-delay: 0.1s; } .logo-line span:nth-child(3) { animation-delay: 0.2s; }
.logo-line span:nth-child(4) { animation-delay: 0.3s; } .logo-line span:nth-child(5) { animation-delay: 0.4s; }
.logo-line.l2 span { animation-delay: calc(0.5s + var(--d, 0s)); }
@keyframes letter { 0%, 70%, 100% { transform: translateY(0) rotate(0); } 80% { transform: translateY(-12px) rotate(-4deg); } 90% { transform: translateY(2px) rotate(2deg); } }
body.reduce-motion .logo-line span { animation: none; }
.alley-back { align-self: flex-start; flex-shrink: 0; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 18px 0 14px; border-radius: 20px; background: rgba(35, 10, 70, 0.55); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35), 0 4px 10px rgba(0, 0, 0, 0.2); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform 0.12s; }
.alley-back:hover { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.8), 0 4px 10px rgba(0, 0, 0, 0.2); }
.alley-back:active { transform: scale(0.94); }
.alley-back:focus-visible { outline: 3px solid #ffe36b; outline-offset: 2px; }
.menu-char { height: 150px; margin-top: -6px; animation: float 3s ease-in-out infinite; }
.menu-char svg { filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.2)); }
@keyframes float { 50% { transform: translateY(-10px); } }
body.reduce-motion .menu-char { animation: none; }
.menu-buttons { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.menu-widgets { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.widget {
  border: 0; border-radius: 18px; padding: 10px 8px; color: var(--panel-ink); background: var(--panel); display: flex; flex-direction: column; align-items: center; gap: 2px;
  box-shadow: 0 4px 0 rgba(60, 20, 110, 0.35), 0 8px 16px rgba(0, 0, 0, 0.18); min-height: 96px; text-align: center; position: relative;
}
.widget .wi { font-size: 26px; }
.widget .wt { font-size: 13px; font-weight: 700; color: var(--purple-d); }
.widget .wv { font-size: 12px; line-height: 1.15; }
.widget .ws { font-size: 12px; opacity: 0.8; }
.widget.ready { animation: glow 1.4s ease-in-out infinite; }
.widget.ready::after { content: '!'; position: absolute; top: -6px; right: -4px; background: var(--red); color: #fff; width: 22px; height: 22px; border-radius: 50%; font-weight: 700; display: flex; align-items: center; justify-content: center; }
@keyframes glow { 50% { box-shadow: 0 4px 0 rgba(60, 20, 110, 0.35), 0 0 22px 4px rgba(255, 230, 100, 0.9); } }
.player-strip { display: flex; align-items: center; gap: 10px; font-size: 15px; background: rgba(0, 0, 0, 0.18); padding: 6px 14px; border-radius: 16px; }
.xpbar { position: relative; height: 16px; background: rgba(0, 0, 0, 0.25); border-radius: 10px; overflow: hidden; flex: 1; min-width: 120px; }
.xpbar > span { display: block; height: 100%; background: linear-gradient(90deg, #7dff8a, #2ecf5c); border-radius: 10px; transition: width 0.6s; }
.xpbar em { position: absolute; inset: 0; font-style: normal; font-size: 12px; display: flex; align-items: center; justify-content: center; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
.xpbar.mini { height: 10px; min-width: 110px; }
.event-banner {
  width: 100%; border: 0; border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; color: #fff; text-align: left;
  background: var(--ev, #e8862a);
  background: linear-gradient(90deg, var(--ev, #e8862a), color-mix(in srgb, var(--ev, #e8862a) 60%, #5a1a00)); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25), 0 0 0 3px rgba(255, 255, 255, 0.5) inset;
  animation: glow 2s ease-in-out infinite;
}
.event-banner[hidden] { display: none; }
.eb-emoji { font-size: 32px; }
.eb-text { flex: 1; display: flex; flex-direction: column; }
.eb-text b { font-size: 18px; }
.eb-text small { font-size: 12px; opacity: 0.9; }
.eb-go { font-weight: 700; background: rgba(0, 0, 0, 0.2); padding: 6px 10px; border-radius: 12px; }

/* --------------------------------------------------------------------------
   Modaler
   -------------------------------------------------------------------------- */
#modal-root { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
.modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; pointer-events: auto; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(20, 5, 40, 0.55); opacity: 0; transition: opacity 0.2s; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal.open .modal-backdrop { opacity: 1; }
.modal-card {
  position: relative; width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--panel); color: var(--panel-ink); border-radius: 28px; padding: 18px 18px 20px;
  box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.55), 0 10px 0 rgba(60, 20, 110, 0.4), 0 20px 50px rgba(0, 0, 0, 0.45);
  transform: scale(0.7); opacity: 0; transition: transform 0.28s cubic-bezier(0.2, 1.4, 0.4, 1), opacity 0.2s;
}
.modal.open .modal-card { transform: scale(1); opacity: 1; }
.modal.closing .modal-card { transform: scale(0.85); opacity: 0; transition-duration: 0.18s; }
.modal-title { margin: -4px 0 10px; text-align: center; font-size: calc(26px * var(--ui-scale)); color: var(--purple-d); letter-spacing: 0.5px; }
.modal-x { position: absolute; right: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(90, 40, 150, 0.12); color: var(--purple-d); font-size: 20px; font-weight: 700; z-index: 2; }
.modal-body { font-size: calc(17px * var(--ui-scale)); }
.modal-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
.modal-buttons .btn { flex: 1 1 auto; min-width: 120px; }
.center { text-align: center; }
.muted { opacity: 0.7; font-size: 0.9em; }
.small { font-size: 13px; }
.big { font-size: 1.3em; }
.chip { display: inline-block; background: rgba(123, 63, 228, 0.14); color: var(--purple-d); padding: 3px 10px; border-radius: 12px; font-size: 14px; margin: 2px; }

/* Level-preview */
.pv { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pv-stars { display: flex; gap: 6px; }
.pv-star { font-size: 42px; color: rgba(90, 40, 150, 0.2); }
.pv-star.on { color: var(--gold); text-shadow: 0 3px 0 #c98a00; }
.pv-star:nth-child(2) { transform: translateY(-8px); }
.pv-goals { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.pv-goal { display: flex; align-items: center; gap: 10px; background: rgba(123, 63, 228, 0.08); border-radius: 14px; padding: 6px 10px; font-weight: 600; }
.pv-gicon { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.pv-gicon img { width: 36px; height: 36px; }
.pv-meta { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 15px; }
.pv-diff { font-size: 14px; display: flex; align-items: center; gap: 8px; }
.diff-bar { width: 120px; height: 10px; background: rgba(0, 0, 0, 0.1); border-radius: 6px; overflow: hidden; display: inline-block; }
.diff-bar span { display: block; height: 100%; background: linear-gradient(90deg, #3ccf4e, #ffc61a, #ff4d5e); }
.pv-thresholds { font-size: 13px; opacity: 0.75; }
.gi-emoji { font-size: 28px; line-height: 1; }
.gi-jelly { display: inline-block; width: 30px; height: 30px; border-radius: 9px; background: rgba(255, 120, 215, 0.8); box-shadow: inset 0 0 0 3px rgba(200, 50, 150, 0.7); }

/* Sejr / nederlag */
.title-win { background: linear-gradient(180deg, #ffe36b, #ff9a1f); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1.5px #9a4a00; font-size: 1.25em; }
.title-lose { color: var(--red); }
.win { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.win-stars { display: flex; gap: 6px; height: 86px; align-items: flex-end; }
.win-star { font-size: 64px; color: rgba(90, 40, 150, 0.18); transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.2, 1.8, 0.4, 1), color 0.2s; line-height: 1; }
.win-star[data-i="1"] { font-size: 80px; transform: translateY(-10px) scale(0.8); }
.win-star.on { color: var(--gold); text-shadow: 0 4px 0 #c98a00, 0 0 22px rgba(255, 220, 80, 0.9); transform: scale(1.1); }
.win-star[data-i="1"].on { transform: translateY(-10px) scale(1.15); }
.three-stars .modal-card { box-shadow: 0 0 0 5px #ffe36b, 0 0 60px 10px rgba(255, 220, 80, 0.7), 0 20px 50px rgba(0, 0, 0, 0.45); }
.win-score { display: flex; flex-direction: column; align-items: center; }
.ws-label { font-size: 14px; opacity: 0.7; letter-spacing: 2px; }
.ws-val { font-size: 38px; font-weight: 700; color: var(--purple-d); }
.win-best { background: var(--red); color: #fff; padding: 4px 14px; border-radius: 12px; font-weight: 700; animation: bump 0.6s 1.4s both; }
.win-row { display: flex; gap: 12px; font-size: 15px; }
.win-rewards { display: flex; gap: 10px; }
.wr { display: flex; align-items: center; gap: 6px; background: rgba(255, 210, 63, 0.25); padding: 6px 12px; border-radius: 14px; font-size: 18px; }
.win-char, .lose-char { display: flex; align-items: center; gap: 10px; }
.win-quote { background: #fff; border-radius: 16px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); font-weight: 600; position: relative; }
.lose { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.lose-char svg { filter: grayscale(0.3); animation: sad 2s ease-in-out infinite; }
@keyframes sad { 50% { transform: rotate(-4deg) translateY(3px); } }
.lose-goals { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.lg { display: flex; align-items: center; gap: 8px; background: rgba(255, 77, 94, 0.1); border-radius: 14px; padding: 6px 10px; }
.lg.done { background: rgba(60, 207, 78, 0.14); }
.lg b { margin-left: auto; white-space: nowrap; }
.continue-modal .lose-goals { flex-direction: row; justify-content: center; flex-wrap: wrap; }
.continue-modal .lg { width: auto; font-weight: 700; font-size: 20px; }

/* Level up, kister, daily */
.lu-badge { width: 110px; height: 110px; margin: 0 auto 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6b0, #ffc61a 55%, #c98a00); color: #7a3a00; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 700; box-shadow: 0 6px 0 #8a5a00, 0 0 30px rgba(255, 210, 60, 0.8); animation: bump 0.8s; }
.chest-open { font-size: 90px; text-align: center; animation: chest 0.9s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes chest { from { transform: scale(0.2) rotate(-20deg); } }
.chest-items { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.ci { background: rgba(123, 63, 228, 0.1); border-radius: 14px; padding: 8px 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; font-size: 18px; }
.daily-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.daily-day { position: relative; color: var(--panel-ink); background: rgba(255, 255, 255, 0.92); box-shadow: inset 0 0 0 2px rgba(123, 63, 228, 0.15); border-radius: 14px; padding: 8px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.daily-day.big { grid-column: span 2; background: linear-gradient(135deg, #fff1b8, #ffd6ee); }
.daily-day.today { background: #d9ffdd; box-shadow: 0 0 0 3px var(--green); animation: glow 1.4s infinite; }
.daily-day.claimed { opacity: 0.55; }
.dd-n { font-size: 12px; font-weight: 700; color: var(--purple-d); }
.dd-icon { font-size: 26px; }
.dd-t { font-size: 11px; line-height: 1.1; }
.dd-check { position: absolute; top: 4px; right: 6px; color: var(--green-d); font-weight: 700; }

/* Tutorial */
.tutorial-modal .modal-card { padding-top: 26px; }
.tut-slide { text-align: center; }
.tut-slide h2 { margin: 8px 0 4px; color: var(--purple-d); font-size: 30px; }
.tut-visual { height: 130px; display: flex; align-items: center; justify-content: center; }
.tut-row { display: flex; align-items: center; gap: 8px; }
.tut-row img { width: 60px; height: 60px; }
.tut-row.swap img:first-child { animation: tswapA 1.6s ease-in-out infinite; }
.tut-row.swap img:last-child { animation: tswapB 1.6s ease-in-out infinite; }

@keyframes tswapB { 40%, 60% { transform: translateX(-120px); } }

  <script>
/* js/util.js */
/* ==========================================================================
   GREJS CRUSH – util.js
   Små hjælpefunktioner der deles af alle moduler.
   Alle moduler hænger på det globale navnerum `GC`, så spillet kan køre
   direkte fra index.html (også via file://) uden ES-moduler eller build.
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};

  /** Deterministisk PRNG (mulberry32). Samme seed => samme sekvens. */
  GC.makeRng = function (seed) {
    let a = (seed >>> 0) || 1;
    const rng = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    rng.int = (n) => Math.floor(rng() * n);
    rng.range = (a2, b2) => a2 + Math.floor(rng() * (b2 - a2 + 1));
    rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
    rng.chance = (p) => rng() < p;
    rng.shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    };
    return rng;
  };

  /** Simpel streng-hash (til seeds fra datoer osv.). */
  GC.hash = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };

  GC.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  GC.lerp = (a, b, t) => a + (b - a) * t;
  GC.wait = (ms) => new Promise((r) => setTimeout(r, ms));

  /** Easing-funktioner til animationer. */
  GC.ease = {
    linear: (t) => t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inQuad: (t) => t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutQuad: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: (t) => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1)
  };

  /** Formatér tal med dansk tusindtalsseparator: 12450 -> "12.450". */
  GC.fmt = function (n) {
    n = Math.floor(n || 0);
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  };

  /** Dato-nøgle (lokal tid) – bruges af daily reward/challenge. */
  GC.dayKey = function (d) {
    d = d || new Date();
    const m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  };
  GC.daysBetween = function (keyA, keyB) {
    const pa = keyA.split('-').map(Number), pb = keyB.split('-').map(Number);
    const a = Date.UTC(pa[0], pa[1] - 1, pa[2]), b = Date.UTC(pb[0], pb[1] - 1, pb[2]);
    return Math.round((b - a) / 86400000);
  };

  GC.fmtTime = function (sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + 't ' + m + 'm';
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  GC.escapeHtml = function (s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = GC;

  <script>
/* js/board.js */
/* ==========================================================================
   GREJS CRUSH – board.js
   Den rene match-3-motor. Ingen DOM, ingen grafik.

   Motoren muterer sin egen tilstand øjeblikkeligt og returnerer en liste af
   "steps" (swap, wave, fall, choc, shuffle, transform ...). Rendereren
   afspiller disse steps som animationer bagefter. Det gør det muligt at
   køre motoren headless (fx i balance-botten i /tools) og garanterer at
   logik og grafik aldrig kommer ud af sync.

   Celle-model:
     cell = { void, jelly (0-2), blocker: {kind:'licorice'|'crate'|'choc', hp} | null,
              tile: Tile | null, exit: bool }
     Tile = { id, color (-1 = ingen), special: null|'h'|'v'|'bomb'|'cbomb',
              ing (-1 = ikke ingrediens, ellers type 0-4), ice (0-2), lock (bool) }
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};

  // ---- Point-konstanter (spec §16) ---------------------------------------
  const SCORE = {
    match3: 60, match4: 120, match5: 250, cross: 200, extraPerTile: 50,
    blastTile: 30, special: 500, jelly: 100, blocker: 150, ingredient: 1000,
    bonusMove: 300, maxMult: 10
  };

  const BLOCKER_CODES = { licorice: 1, crate: 2, choc: 3 };
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  class Board {
    /**
     * @param {object} def  normaliseret level-definition (se levels.js)
     * @param {number} seed seed til brikgenerering
     */
    constructor(def, seed) {
      this.def = def;
      this.w = def.w; this.h = def.h;
      this.numColors = GC.clamp(def.colors || 5, 3, 6);
      this.rng = GC.makeRng(seed || 1);
      this.nextId = 1;
      this.ingTotal = def.ingredients ? def.ingredients.count : 0;
      this.ingMax = def.ingredients ? (def.ingredients.maxOnBoard || 2) : 0;
      this.ingSpawned = 0;
      this.ingOnBoard = 0;
      this.chocKilled = false;
      this.stats = {
        score: 0, colors: [0, 0, 0, 0, 0, 0], matches: 0, specials: 0, created: 0,
        stripes: 0, bombs: 0, cbombs: 0, combos: 0, bestCombo: 0,
        jellyCleared: 0, blockersCleared: 0, iceCleared: 0, unlocked: 0,
        ingredients: 0, tilesCleared: 0
      };
      this._buildCells();
      this._populate();
      let cells = 0;
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (!this.cells[y][x].void) cells++;
      this.chocMax = Math.max(this.countBlocker('choc') + 4, Math.round(cells * 0.22));
    }

    // ======================================================================
    //  Opbygning
    // ======================================================================
    _buildCells() {
      const def = this.def;
      this.cells = [];
      for (let y = 0; y < this.h; y++) {
        const row = [];
        const line = def.layout[y] || '';
        const jline = def.jelly ? (def.jelly[y] || '') : '';
        for (let x = 0; x < this.w; x++) {
          const ch = line[x] || '.';
          const cell = { x, y, void: false, jelly: 0, blocker: null, tile: null, exit: false, preset: null };
          if (ch === '_' || ch === ' ') cell.void = true;
          else if (ch === 'B') cell.blocker = { kind: 'licorice', hp: 2 };
          else if (ch === 'b') cell.blocker = { kind: 'licorice', hp: 1 };
          else if (ch === 'C') cell.blocker = { kind: 'choc', hp: 1 };
          else if (ch === '1' || ch === '2' || ch === '3') cell.blocker = { kind: 'crate', hp: +ch };
          else if (ch === 'I') cell.preset = { ice: 1 };
          else if (ch === 'K') cell.preset = { ice: 2 };
          else if (ch === 'L') cell.preset = { lock: true };
          if (!cell.void) {
            const jc = jline[x];
            if (jc === '1' || jc === 'J') cell.jelly = 1;
            else if (jc === '2' || jc === 'D') cell.jelly = 2;
          }
          row.push(cell);
        }
        this.cells.push(row);
      }
      // Spawnere = øverste ikke-void celle i hver kolonne. Exits = nederste.
      this.spawnY = []; this.exitY = [];
      for (let x = 0; x < this.w; x++) {
        let top = -1, bottom = -1;
        for (let y = 0; y < this.h; y++) if (!this.cells[y][x].void) { if (top < 0) top = y; bottom = y; }
        this.spawnY.push(top); this.exitY.push(bottom);
        if (bottom >= 0 && this.ingTotal > 0) this.cells[bottom][x].exit = true;
      }
    }

    _newTile(color, special) {
      return { id: this.nextId++, color: color, special: special || null, ing: -1, ice: 0, lock: false };
    }
    _newIngredient() {
      const kinds = (this.def.ingredients && this.def.ingredients.kinds) || [0, 1];
      return { id: this.nextId++, color: -1, special: null, ing: this.rng.pick(kinds), ice: 0, lock: false };
    }
    _randColor() { return this.rng.int(this.numColors); }

    /** Fyld boardet uden startmatches og med mindst ét gyldigt træk. */
    _populate() {
      for (let attempt = 0; attempt < 80; attempt++) {
        for (let y = 0; y < this.h; y++) {
          for (let x = 0; x < this.w; x++) {
            const c = this.cells[y][x];
            c.tile = null;
            if (c.void || c.blocker) continue;
            let color, tries = 0;
            do { color = this._randColor(); tries++; } while (tries < 30 && this._wouldMatchAt(x, y, color));
            const t = this._newTile(color);
            if (c.preset) { if (c.preset.ice) t.ice = c.preset.ice; if (c.preset.lock) t.lock = true; }
            c.tile = t;
          }
        }
        if (this.findRuns().length === 0 && this.hasValidMove()) break;
      }
      // Placér start-ingredienser i de øverste rækker.
      if (this.ingTotal > 0) {
        const want = Math.min(this.def.ingredients.onBoard || 1, this.ingTotal, this.ingMax);
        const cols = this.rng.shuffle([...Array(this.w).keys()]);
        let placed = 0;
        for (const x of cols) {
          if (placed >= want) break;
          const y = this.spawnY[x];
          if (y < 0) continue;
          const c = this.cells[y][x];
          if (!c.tile || c.tile.ice || c.tile.lock || c.exit) continue;
          c.tile = this._newIngredient();
          this.ingSpawned++; this.ingOnBoard++; placed++;
        }
      }
    }

    _wouldMatchAt(x, y, color) {
      const g = (xx, yy) => {
        if (xx < 0 || yy < 0 || xx >= this.w || yy >= this.h) return -2;
        const t = this.cells[yy][xx].tile; return t ? t.color : -2;
      };
      if (g(x - 1, y) === color && g(x - 2, y) === color) return true;
      if (g(x, y - 1) === color && g(x, y - 2) === color) return true;
      return false;
    }

    // ======================================================================
    //  Hjælpere
    // ======================================================================
    inBounds(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
    cell(x, y) { return this.inBounds(x, y) ? this.cells[y][x] : null; }
    isMovable(t) { return !!t && !t.ice && !t.lock; }
    /** Farve til match-detektion, -1 hvis cellen ikke kan matche. */
    matchColor(x, y) {
      const c = this.cells[y][x];
      if (c.void || c.blocker) return -1;
      const t = c.tile;
      if (!t || t.lock || t.color < 0) return -1;
      return t.color;
    }
    static tileCopy(t) { return { id: t.id, color: t.color, special: t.special, ing: t.ing }; }

    /** Kompakt snapshot af celle-lagene (jelly/blockers/ice/lock) til rendereren. */
    snapshot() {
      const out = new Array(this.w * this.h);
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const c = this.cells[y][x];
        if (c.void) { out[y * this.w + x] = null; continue; }
        const t = c.tile;
        out[y * this.w + x] = [c.jelly, c.blocker ? BLOCKER_CODES[c.blocker.kind] : 0, c.blocker ? c.blocker.hp : 0,
          t ? t.ice : 0, t && t.lock ? 1 : 0];
      }
      return out;
    }
    exportTiles() {
      const list = [];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const t = this.cells[y][x].tile;
        if (t) list.push(Object.assign(Board.tileCopy(t), { x, y }));
      }
      return list;
    }

    jellyLeft() {
      let n = 0;
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (this.cells[y][x].jelly > 0) n++;
      return n;
    }
    blockersLeft() {
      let n = 0;
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const c = this.cells[y][x];
        if (c.blocker) n++;
        else if (c.tile && (c.tile.ice || c.tile.lock)) n++;
      }
      return n;
    }
    countBlocker(kind) {
      let n = 0;
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const c = this.cells[y][x];
        if (c.blocker && c.blocker.kind === kind) n++;
      }
      return n;
    }
    statsCopy() {
      const s = this.stats;
      return {
        score: s.score, colors: s.colors.slice(), matches: s.matches, specials: s.specials,
        created: s.created, ingredients: s.ingredients, jelly: this.jellyLeft(), blockers: this.blockersLeft()
      };
    }

    // ======================================================================
    //  Match-detektion
    // ======================================================================
    findRuns() {
      const runs = [];
      const W = this.w, H = this.h;
      for (let y = 0; y < H; y++) {
        let x = 0;
        while (x < W) {
          const c = this.matchColor(x, y);
          if (c < 0) { x++; continue; }
          let e = x + 1;
          while (e < W && this.matchColor(e, y) === c) e++;
          if (e - x >= 3) {
            const cells = [];
            for (let i = x; i < e; i++) cells.push([i, y]);
            runs.push({ dir: 'h', color: c, cells });
          }
          x = e;
        }
      }
      for (let x = 0; x < W; x++) {
        let y = 0;
        while (y < H) {
          const c = this.matchColor(x, y);
          if (c < 0) { y++; continue; }
          let e = y + 1;
          while (e < H && this.matchColor(x, e) === c) e++;
          if (e - y >= 3) {
            const cells = [];
            for (let i = y; i < e; i++) cells.push([x, i]);
            runs.push({ dir: 'v', color: c, cells });
          }
          y = e;
        }
      }
      return runs;
    }

    /** Længste vandrette/lodrette linje gennem (x,y) – bruges til træk-søgning. */
    _lineAt(x, y) {
      const c = this.matchColor(x, y);
      if (c < 0) return { h: 0, v: 0 };
      let l = x, r = x, u = y, d = y;
      while (l - 1 >= 0 && this.matchColor(l - 1, y) === c) l--;
      while (r + 1 < this.w && this.matchColor(r + 1, y) === c) r++;
      while (u - 1 >= 0 && this.matchColor(x, u - 1) === c) u--;
      while (d + 1 < this.h && this.matchColor(x, d + 1) === c) d++;
      return { h: r - l + 1, v: d - u + 1 };
    }

    _swapTiles(ax, ay, bx, by) {
      const a = this.cells[ay][ax], b = this.cells[by][bx];
      const t = a.tile; a.tile = b.tile; b.tile = t;
    }

    _canSwapCells(ax, ay, bx, by) {
      if (!this.inBounds(ax, ay) || !this.inBounds(bx, by)) return false;
      if (Math.abs(ax - bx) + Math.abs(ay - by) !== 1) return false;
      const a = this.cells[ay][ax], b = this.cells[by][bx];
      if (a.void || b.void || a.blocker || b.blocker) return false;
      return this.isMovable(a.tile) && this.isMovable(b.tile);
    }

    _isComboPair(ta, tb) {
      if (!ta || !tb) return false;
      if (ta.ing >= 0 || tb.ing >= 0) return false;
      if (ta.special === 'cbomb' || tb.special === 'cbomb') return true;
      return !!(ta.special && tb.special);
    }

    /** Alle gyldige træk. Hvert træk får en simpel værdi (bruges til hints og bot). */
    findValidMoves(limit) {
      const moves = [];
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          for (const [dx, dy] of [[1, 0], [0, 1]]) {
            const bx = x + dx, by = y + dy;
            if (!this._canSwapCells(x, y, bx, by)) continue;
            const ta = this.cells[y][x].tile, tb = this.cells[by][bx].tile;
            if (this._isComboPair(ta, tb)) {
              moves.push({ a: [x, y], b: [bx, by], value: 50 + (ta.special ? 10 : 0) + (tb.special ? 10 : 0), combo: true });
            } else {
              this._swapTiles(x, y, bx, by);
              const la = this._lineAt(bx, by), lb = this._lineAt(x, y);
              this._swapTiles(x, y, bx, by);
              const best = (l) => (l.h >= 3 || l.v >= 3) ? (Math.max(l.h, l.v) + (l.h >= 3 && l.v >= 3 ? 2 : 0)) : 0;
              const va = best(la), vb = best(lb);
              if (va || vb) moves.push({ a: [x, y], b: [bx, by], value: va + vb, combo: false });
            }
            if (limit && moves.length >= limit) return moves;
          }
        }
      }
      return moves;
    }
    hasValidMove() { return this.findValidMoves(1).length > 0; }

    // ======================================================================
    //  Spillerens træk
    // ======================================================================
    /**
     * Forsøg at bytte to brikker.
     * @returns {{ok:boolean, valid:boolean, steps:Array}}
     *   ok=false: træk umuligt (ikke nabo, blokeret). valid=false: intet match (swap tilbage).
     */
    trySwap(ax, ay, bx, by, opts) {
      opts = opts || {};
      if (!this._canSwapCells(ax, ay, bx, by)) return { ok: false, valid: false, steps: [] };
      const ta = this.cells[ay][ax].tile, tb = this.cells[by][bx].tile;
      const steps = [];
      const swapStep = { type: 'swap', a: [ax, ay], b: [bx, by], ida: ta.id, idb: tb.id };
      this.chocKilled = false;

      this._swapTiles(ax, ay, bx, by);

      if (this._isComboPair(ta, tb)) {
        steps.push(swapStep);
        // ta ligger nu på b, tb på a. Effekten centreres der hvor spilleren trak hen (b).
        this._comboSwap(bx, by, ta, ax, ay, tb, steps);
        const combo = this._settle(steps, 1);
        this._endTurn(steps, true, combo);
        return { ok: true, valid: true, steps };
      }

      const runs = this.findRuns();
      if (runs.length === 0) {
        if (opts.free) {
          steps.push(swapStep);
          this._endTurn(steps, true, 0);
          return { ok: true, valid: true, steps };
        }
        this._swapTiles(ax, ay, bx, by);
        steps.push(swapStep, { type: 'swapBack', a: [ax, ay], b: [bx, by], ida: ta.id, idb: tb.id });
        return { ok: true, valid: false, steps };
      }
      steps.push(swapStep);
      this._resolveRuns(runs, [[ax, ay], [bx, by]], 1, steps, ay === by ? 'h' : 'v');
      const combo = this._settle(steps, 1);
      this._endTurn(steps, true, combo);
      return { ok: true, valid: true, steps };
    }

    // ======================================================================
    //  Match-opløsning og bølger af specialeffekter
    // ======================================================================
    _mult(combo) { return Math.min(Math.max(combo, 1), SCORE.maxMult); }

    _addScore(step, x, y, pts, color) {
      pts = Math.round(pts);
      this.stats.score += pts;
      if (step) step.score.push({ x, y, pts, color: color == null ? -1 : color });
    }

    _resolveRuns(runs, swapCells, combo, steps, swapDir) {
      // Union-find: runs der deler celler bliver én gruppe (L/T-former).
      const parent = runs.map((_, i) => i);
      const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
      const owner = new Map();
      runs.forEach((r, i) => {
        for (const [x, y] of r.cells) {
          const k = y * this.w + x;
          if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i);
        }
      });
      const groups = new Map();
      runs.forEach((r, i) => {
        const g = find(i);
        if (!groups.has(g)) groups.set(g, []);
        groups.get(g).push(r);
      });

      const mult = this._mult(combo);
      const targets = [];
      const created = [];
      const scores = [];
      const swapKeys = swapCells ? swapCells.map(([x, y]) => y * this.w + x) : [];

      for (const gruns of groups.values()) {
        const cellMap = new Map();
        let maxLen = 0, hasH = false, hasV = false;
        for (const r of gruns) {
          maxLen = Math.max(maxLen, r.cells.length);
          if (r.dir === 'h') hasH = true; else hasV = true;
          for (const [x, y] of r.cells) cellMap.set(y * this.w + x, [x, y]);
        }
        const color = gruns[0].color;
        const cells = [...cellMap.values()];
        let special = null;
        if (maxLen >= 5) special = 'cbomb';
        else if (hasH && hasV) special = 'bomb';
        else if (maxLen === 4) special = 'stripe';

        // Point
        let pts = maxLen >= 5 ? SCORE.match5 : maxLen === 4 ? SCORE.match4 : SCORE.match3;
        if (hasH && hasV) pts = Math.max(pts, SCORE.cross);
        pts += Math.max(0, cells.length - Math.max(maxLen, 3)) * SCORE.extraPerTile;
        const mid = cells[Math.floor(cells.length / 2)];
        scores.push({ x: mid[0], y: mid[1], pts: pts * mult, color });
        this.stats.matches++;

        if (special) {
          // Placering: den byttede celle hvis muligt, ellers kryds/midte.
          const destroyable = cells.filter(([x, y]) => { const t = this.cells[y][x].tile; return t && !t.ice && !t.lock; });
          let pos = null;
          for (const k of swapKeys) if (cellMap.has(k) && destroyable.some(([x, y]) => y * this.w + x === k)) { pos = cellMap.get(k); break; }
          if (!pos && hasH && hasV) {
            const hc = new Set(), res = [];
            for (const r of gruns) if (r.dir === 'h') for (const [x, y] of r.cells) hc.add(y * this.w + x);
            for (const r of gruns) if (r.dir === 'v') for (const [x, y] of r.cells) if (hc.has(y * this.w + x)) res.push([x, y]);
            pos = res.find(([x, y]) => destroyable.some(([a, b]) => a === x && b === y)) || null;
          }
          if (!pos && destroyable.length) pos = destroyable[Math.floor(destroyable.length / 2)];
          if (pos) {
            let sp = special;
            if (special === 'stripe') {
              const fromSwap = swapKeys.includes(pos[1] * this.w + pos[0]);
              const runDir = gruns.find((r) => r.cells.length >= 4).dir;
              // Vandret swipe/linje => lodret stribe (rydder kolonne) og omvendt.
              const dir = fromSwap && swapDir ? swapDir : runDir;
              sp = dir === 'h' ? 'v' : 'h';
            }
            created.push({ x: pos[0], y: pos[1], special: sp, color: sp === 'cbomb' ? -1 : color });
          }
        }
        for (const [x, y] of cells) targets.push({ x, y, kind: 'match' });
      }
      this._runWaves(targets, [], created, combo, steps, scores);
    }

    /**
     * Kør bølger: bølge 1 = de direkte mål. Specialbrikker der ødelægges
     * aktiveres i næste bølge, osv. Hver bølge bliver ét 'wave' step.
     */
    _runWaves(targets, effects, created, combo, steps, scores) {
      let pending = targets;
      let pendingEffects = effects || [];
      let first = true;
      let guard = 0;
      const mult = this._mult(combo);
      while ((pending.length || (first && created.length)) && guard++ < 50) {
        const step = {
          type: 'wave', cleared: [], effects: pendingEffects, created: [], damaged: [],
          score: first && scores ? scores : [], combo
        };
        if (first && scores) for (const s of scores) this.stats.score += s.pts;
        const activations = [];
        const seen = new Set();
        for (const t of pending) {
          const k = t.y * this.w + t.x;
          if (seen.has(k)) continue;
          seen.add(k);
          this._hitCell(t.x, t.y, t.kind, step, activations, mult);
        }
        // Naboskade fra almindelige matches (blockers, låse, chokolade).
        const adj = new Set();
        for (const t of pending) {
          if (t.kind !== 'match') continue;
          for (const [dx, dy] of DIRS) {
            const nx = t.x + dx, ny = t.y + dy;
            if (!this.inBounds(nx, ny)) continue;
            const k = ny * this.w + nx;
            if (seen.has(k) || adj.has(k)) continue;
            const c = this.cells[ny][nx];
            if (c.void) continue;
            if (c.blocker) { adj.add(k); this._damageBlocker(nx, ny, step, mult); }
            else if (c.tile && c.tile.lock) { adj.add(k); c.tile.lock = false; this.stats.unlocked++; step.damaged.push({ x: nx, y: ny, what: 'lock', left: 0 }); }
          }
        }
        // Nye specialbrikker placeres efter første bølge.
        if (first) {
          for (const cr of created) {
            const c = this.cells[cr.y][cr.x];
            if (c.tile || c.blocker) continue;
            const t = this._newTile(cr.color, cr.special);
            t.fresh = true;
            c.tile = t;
            this.stats.created++;
            step.created.push(Object.assign(Board.tileCopy(t), { x: cr.x, y: cr.y }));
          }
        }
        // Aktiveringer -> næste bølge
        const next = [], nextFx = [];
        for (const a of activations) {
          const r = this._specialTargets(a);
          nextFx.push(r.effect);
          for (const tt of r.targets) next.push(tt);
          this._addScore(step, a.x, a.y, SCORE.special, a.color);
        }
        step.layers = this.snapshot();
        step.stats = this.statsCopy();
        steps.push(step);
        pending = next;
        pendingEffects = nextFx;
        first = false;
      }
      // Frisk-beskyttelse gælder kun inden for den samme opløsning.
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const t = this.cells[y][x].tile; if (t && t.fresh) delete t.fresh;
      }
    }

    _hitCell(x, y, kind, step, activations, mult) {
      const c = this.cells[y][x];
      if (!c || c.void) return;
      if (c.blocker) { if (kind !== 'match') this._damageBlocker(x, y, step, mult); return; }
      const t = c.tile;
      if (!t || t.fresh) return;
      if (t.lock) { t.lock = false; this.stats.unlocked++; step.damaged.push({ x, y, what: 'lock', left: 0 }); return; }
      if (t.ice > 0) {
        t.ice--; step.damaged.push({ x, y, what: 'ice', left: t.ice });
        if (!t.ice) { this.stats.iceCleared++; this._addScore(step, x, y, SCORE.blocker, -1); }
        return;
      }
      if (t.ing >= 0) return;
      c.tile = null;
      this.stats.tilesCleared++;
      step.cleared.push({ id: t.id, x, y, color: t.color, special: t.special, kind });
      if (t.color >= 0) this.stats.colors[t.color]++;
      if (kind !== 'match') this.stats.score += SCORE.blastTile * mult;
      if (c.jelly > 0) {
        c.jelly--; step.damaged.push({ x, y, what: 'jelly', left: c.jelly });
        if (!c.jelly) this.stats.jellyCleared++;
        this.stats.score += SCORE.jelly;
      }
      if (t.special) {
        this.stats.specials++;
        if (t.special === 'h' || t.special === 'v') this.stats.stripes++;
        else if (t.special === 'bomb') this.stats.bombs++;
        else if (t.special === 'cbomb') this.stats.cbombs++;
        activations.push({ x, y, special: t.special, color: t.color });
      }
    }

    _damageBlocker(x, y, step, mult) {
      const c = this.cells[y][x];
      const b = c.blocker;
      if (!b) return;
      b.hp--;
      step.damaged.push({ x, y, what: b.kind, left: Math.max(0, b.hp) });
      if (b.hp <= 0) {
        c.blocker = null;
        this.stats.blockersCleared++;
        if (b.kind === 'choc') this.chocKilled = true;
        this._addScore(step, x, y, SCORE.blocker, -1);
        if (c.jelly > 0) {
          c.jelly--; step.damaged.push({ x, y, what: 'jelly', left: c.jelly });
          if (!c.jelly) this.stats.jellyCleared++;
          this.stats.score += SCORE.jelly;
        }
      }
    }

    _mostCommonColor() {
      const cnt = new Array(this.numColors).fill(0);
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const t = this.cells[y][x].tile;
        if (t && t.color >= 0 && !t.fresh) cnt[t.color]++;
      }
      let best = 0;
      for (let i = 1; i < cnt.length; i++) if (cnt[i] > cnt[best]) best = i;
      return best;
    }

    _cellsOfColor(color) {
      const out = [];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const c = this.cells[y][x];
        if (!c.blocker && c.tile && c.tile.color === color && !c.tile.fresh) out.push([x, y]);
      }
      return out;
    }

    /** Mål for en aktiveret specialbrik. */
    _specialTargets(a) {
      const targets = [];
      const push = (x, y) => { if (this.inBounds(x, y) && !this.cells[y][x].void) targets.push({ x, y, kind: 'blast' }); };
      let effect;
      if (a.special === 'h') {
        for (let x = 0; x < this.w; x++) if (x !== a.x) push(x, a.y);
        effect = { kind: 'line', dir: 'h', x: a.x, y: a.y, color: a.color };
      } else if (a.special === 'v') {
        for (let y = 0; y < this.h; y++) if (y !== a.y) push(a.x, y);
        effect = { kind: 'line', dir: 'v', x: a.x, y: a.y, color: a.color };
      } else if (a.special === 'bomb') {
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          if (Math.abs(dx) + Math.abs(dy) <= 2 && (dx || dy)) push(a.x + dx, a.y + dy);
        }
        effect = { kind: 'bomb', x: a.x, y: a.y, r: 2, color: a.color };
      } else if (a.special === 'cbomb') {
        const col = this._mostCommonColor();
        const cells = this._cellsOfColor(col);
        for (const [x, y] of cells) push(x, y);
        effect = { kind: 'cbomb', x: a.x, y: a.y, color: col, targets: cells };
      }
      return { targets, effect };
    }

    /** Kombination af to specialbrikker (eller farvebombe + almindelig brik). */
    _comboSwap(bx, by, tAtB, ax, ay, tAtA, steps) {
      const s1 = tAtB.special, s2 = tAtA.special;
      const mult = 1;
      const kinds = [s1, s2].map((s) => (s === 'h' || s === 'v') ? 'stripe' : s);
      const has = (k) => kinds.includes(k);
      const partner = s1 === 'cbomb' ? { t: tAtA, x: ax, y: ay } : { t: tAtB, x: bx, y: by };

      // Første bølge: fjern de to kombinerede brikker uden at de aktiveres.
      const step = { type: 'wave', cleared: [], effects: [], created: [], damaged: [], score: [], combo: 1, transformed: [] };
      const consume = (x, y) => {
        const c = this.cells[y][x]; const t = c.tile;
        if (!t) return;
        c.tile = null;
        step.cleared.push({ id: t.id, x, y, color: t.color, special: t.special, kind: 'combo' });
        if (t.special) { this.stats.specials++; if (t.special === 'cbomb') this.stats.cbombs++; else if (t.special === 'bomb') this.stats.bombs++; else this.stats.stripes++; }
        if (c.jelly > 0) { c.jelly--; step.damaged.push({ x, y, what: 'jelly', left: c.jelly }); if (!c.jelly) this.stats.jellyCleared++; }
      };

      const targets = [];
      const push = (x, y) => { if (this.inBounds(x, y) && !this.cells[y][x].void) targets.push({ x, y, kind: 'blast' }); };
      let effects = [];
      let extraScore = 0;

      if (s1 === 'cbomb' && s2 === 'cbomb') {
        consume(bx, by); consume(ax, ay);
        for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) push(x, y);
        effects.push({ kind: 'cbomb2', x: bx, y: by });
        extraScore = 5000;
      } else if (has('cbomb')) {
        const cb = s1 === 'cbomb' ? { x: bx, y: by } : { x: ax, y: ay };
        const other = partner.t;
        consume(cb.x, cb.y);
        const color = other.color;
        if (!other.special) {
          const cells = this._cellsOfColor(color);
          for (const [x, y] of cells) push(x, y);
          effects.push({ kind: 'cbomb', x: cb.x, y: cb.y, color, targets: cells });
          extraScore = 1000;
        } else {
          // Alle brikker i partnerens farve bliver til samme type specialbrik.
          const cells = this._cellsOfColor(color);
          for (const [x, y] of cells) {
            const t = this.cells[y][x].tile;
            if (!t || t.ice || t.lock) continue;
            if (!t.special) {
              t.special = other.special === 'bomb' ? 'bomb' : (this.rng() < 0.5 ? 'h' : 'v');
              step.transformed.push({ id: t.id, x, y, special: t.special });
            }
          }
          for (const [x, y] of cells) push(x, y);
          effects.push({ kind: 'cbomb', x: cb.x, y: cb.y, color, targets: cells, transform: true });
          extraScore = 2500;
        }
      } else if (kinds[0] === 'stripe' && kinds[1] === 'stripe') {
        consume(bx, by); consume(ax, ay);
        for (let x = 0; x < this.w; x++) push(x, by);
        for (let y = 0; y < this.h; y++) push(bx, y);
        effects.push({ kind: 'line', dir: 'h', x: bx, y: by, color: tAtB.color }, { kind: 'line', dir: 'v', x: bx, y: by, color: tAtA.color });
        extraScore = 1000;
      } else if (has('stripe') && has('bomb')) {
        consume(bx, by); consume(ax, ay);
        for (let d = -1; d <= 1; d++) {
          for (let x = 0; x < this.w; x++) push(x, by + d);
          for (let y = 0; y < this.h; y++) push(bx + d, y);
          if (by + d >= 0 && by + d < this.h) effects.push({ kind: 'line', dir: 'h', x: bx, y: by + d, color: tAtB.color, wide: true });
          if (bx + d >= 0 && bx + d < this.w) effects.push({ kind: 'line', dir: 'v', x: bx + d, y: by, color: tAtA.color, wide: true });
        }
        extraScore = 2000;
      } else if (kinds[0] === 'bomb' && kinds[1] === 'bomb') {
        consume(bx, by); consume(ax, ay);
        for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
          if (Math.abs(dx) <= 2 && Math.abs(dy) <= 2 || Math.abs(dx) + Math.abs(dy) <= 3) push(bx + dx, by + dy);
        }
        effects.push({ kind: 'bomb', x: bx, y: by, r: 3, big: true, color: tAtB.color });
        extraScore = 2000;
      }
      this._addScore(step, bx, by, SCORE.special * 2 + extraScore, -1);
      step.layers = this.snapshot();
      step.stats = this.statsCopy();
      step.comboSwap = true;
      steps.push(step);
      this._runWaves(targets, effects, [], 1, steps, null);
      void mult;
    }

    // ======================================================================
    //  Tyngdekraft, spawn og ingredienser
    // ======================================================================
    _spawnFor(x) {
      if (this.ingTotal > 0 && this.ingSpawned < this.ingTotal && this.ingOnBoard < this.ingMax) {
        const p = this.ingOnBoard === 0 ? 0.35 : 0.05;
        if (this.rng() < p) { this.ingSpawned++; this.ingOnBoard++; return this._newIngredient(); }
      }
      return this._newTile(this._randColor());
      // (x bruges ikke endnu – plads til kolonne-specifikke spawnregler)
    }

    _nextBelow(x, y) {
      for (let yy = y + 1; yy < this.h; yy++) if (!this.cells[yy][x].void) return yy;
      return -1;
    }

    /** Lad brikker falde (lodret gennem huller, diagonalt forbi forhindringer) og fyld op. */
    _gravity(steps) {
      const paths = new Map();
      const spawnCount = new Array(this.w).fill(0);
      const collected = [];
      const move = (t, fx, fy, tx, ty) => {
        let p = paths.get(t.id);
        if (!p) { p = { id: t.id, pts: [[fx, fy]] }; paths.set(t.id, p); }
        p.pts.push([tx, ty]);
      };
      let changed = true, anything = false, guard = 0;
      while (changed && guard++ < 2000) {
        changed = false;
        // 1) Lodret fald (nedefra og op)
        for (let y = this.h - 2; y >= 0; y--) {
          for (let x = 0; x < this.w; x++) {
            const c = this.cells[y][x];
            if (c.void || c.blocker || !this.isMovable(c.tile)) continue;
            const y2 = this._nextBelow(x, y);
            if (y2 < 0) continue;
            const c2 = this.cells[y2][x];
            if (c2.blocker || c2.tile) continue;
            c2.tile = c.tile; c.tile = null;
            move(c2.tile, x, y, x, y2);
            changed = true;
          }
        }
        // 2) Spawn i toppen
        for (let x = 0; x < this.w; x++) {
          const y = this.spawnY[x];
          if (y < 0) continue;
          const c = this.cells[y][x];
          if (c.blocker || c.tile) continue;
          const t = this._spawnFor(x);
          c.tile = t;
          spawnCount[x]++;
          const p = { id: t.id, pts: [[x, y - spawnCount[x]], [x, y]], spawn: Board.tileCopy(t) };
          paths.set(t.id, p);
          changed = true;
        }
        if (changed) { anything = true; continue; }
        // 3) Diagonalt fald ind i celler der ikke kan fodres oppefra
        outer:
        for (let y = this.h - 1; y >= 1; y--) {
          for (let x = 0; x < this.w; x++) {
            const c = this.cells[y][x];
            if (c.void || c.blocker || c.tile) continue;
            const order = this.rng() < 0.5 ? [-1, 1] : [1, -1];
            for (const dx of order) {
              const sx = x + dx, sy = y - 1;
              if (!this.inBounds(sx, sy)) continue;
              const s = this.cells[sy][sx];
              if (s.void || s.blocker || !this.isMovable(s.tile)) continue;
              c.tile = s.tile; s.tile = null;
              move(c.tile, sx, sy, x, y);
              changed = true; anything = true;
              break outer;
            }
          }
        }
        if (changed) continue;
        // 4) Ingredienser ved exit samles op
        if (this.ingTotal > 0) {
          for (let x = 0; x < this.w; x++) {
            const y = this.exitY[x];
            if (y < 0) continue;
            const c = this.cells[y][x];
            if (c.tile && c.tile.ing >= 0) {
              collected.push({ id: c.tile.id, x, y, ing: c.tile.ing });
              if (!paths.has(c.tile.id)) paths.set(c.tile.id, { id: c.tile.id, pts: [[x, y]] });
              c.tile = null;
              this.ingOnBoard--;
              this.stats.ingredients++;
              this.stats.score += SCORE.ingredient;
              changed = true; anything = true;
            }
          }
        }
      }
      if (anything) {
        steps.push({ type: 'fall', paths: [...paths.values()], collected, layers: this.snapshot(), stats: this.statsCopy() });
      }
      return anything;
    }

    /** Tyngdekraft + kaskader indtil boardet er stabilt. */
    _settle(steps, combo) {
      let guard = 0;
      while (guard++ < 80) {
        this._gravity(steps);
        const runs = this.findRuns();
        if (!runs.length) break;
        combo++;
        this._resolveRuns(runs, null, combo, steps, null);
      }
      this.stats.combos = Math.max(this.stats.combos, combo);
      this.stats.bestCombo = Math.max(this.stats.bestCombo, combo);
      return combo;
    }

    /** Efter et træk: chokolade vokser, og tjek for mulige træk. */
    _endTurn(steps, isMove, combo) {
      if (isMove && !this.chocKilled) this._spreadChocolate(steps);
      this.chocKilled = false;
      if (steps.length) steps[steps.length - 1].comboTotal = combo;
      steps.comboTotal = combo;
      if (!this.hasValidMove()) {
        const ok = this.shuffle(steps);
        // Kan boardet slet ikke blandes (fx fyldt med chokolade), er banen tabt.
        if (!ok) steps.noMoves = true;
      }
    }

    _spreadChocolate(steps) {
      // Chokolade kan højst dække en vis del af boardet, så banen aldrig bliver umulig.
      if (this.chocMax == null) {
        let cells = 0;
        for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (!this.cells[y][x].void) cells++;
        this.chocMax = Math.max(this.countBlocker('choc') + 4, Math.round(cells * 0.22));
      }
      if (this.countBlocker('choc') >= this.chocMax) return;
      const cand = [];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const c = this.cells[y][x];
        if (!c.blocker || c.blocker.kind !== 'choc') continue;
        for (const [dx, dy] of DIRS) {
          const n = this.cell(x + dx, y + dy);
          if (!n || n.void || n.blocker || !n.tile) continue;
          const t = n.tile;
          if (t.ing >= 0 || t.special === 'cbomb' || t.ice || t.lock) continue;
          cand.push([x, y, n.x, n.y]);
        }
      }
      if (!cand.length) return;
      const [fx, fy, tx, ty] = this.rng.pick(cand);
      const n = this.cells[ty][tx];
      const id = n.tile.id;
      n.tile = null;
      n.blocker = { kind: 'choc', hp: 1 };
      steps.push({ type: 'choc', from: [fx, fy], to: [tx, ty], id, layers: this.snapshot(), stats: this.statsCopy() });
    }

    /** Bland boardet (animeret af rendereren). Garanterer ingen matches + mindst ét træk. */
    shuffle(steps) {
      const pos = [];
      const tiles = [];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const c = this.cells[y][x];
        if (c.void || c.blocker) continue;
        const t = c.tile;
        if (!this.isMovable(t) || t.ing >= 0) continue;
        pos.push([x, y]); tiles.push(t);
      }
      if (pos.length < 3) return false;
      let ok = false;
      for (let attempt = 0; attempt < 120 && !ok; attempt++) {
        if (attempt > 60) for (const t of tiles) if (!t.special) t.color = this._randColor();
        // Konstruktiv blanding: placér brikker én ad gangen og undgå at skabe matches.
        const pool = this.rng.shuffle(tiles.slice());
        for (const [x, y] of pos) this.cells[y][x].tile = null;
        for (const [x, y] of pos) {
          let idx = pool.findIndex((t) => t.color < 0 || !this._wouldMatchAt(x, y, t.color));
          if (idx < 0) idx = 0;
          this.cells[y][x].tile = pool.splice(idx, 1)[0];
        }
        ok = this.findRuns().length === 0 && this.hasValidMove();
      }
      const moves = pos.map(([x, y]) => { const t = this.cells[y][x].tile; return { id: t.id, x, y, color: t.color }; });
      steps.push({ type: 'shuffle', moves, layers: this.snapshot(), stats: this.statsCopy() });
      return ok;
    }

    /** Dyb kopi af boardet (bruges af hint-/balance-bot til at simulere træk). */
    clone(seed) {
      const b = Object.create(Board.prototype);
      Object.assign(b, this);
      b.rng = GC.makeRng(seed || 7);
      b.stats = JSON.parse(JSON.stringify(this.stats));
      b.cells = this.cells.map((row) => row.map((c) => ({
        x: c.x, y: c.y, void: c.void, jelly: c.jelly, exit: c.exit, preset: null,
        blocker: c.blocker ? { kind: c.blocker.kind, hp: c.blocker.hp } : null,
        tile: c.tile ? Object.assign({}, c.tile) : null
      })));
      return b;
    }

    // ======================================================================
    //  Boosters (bruger ikke træk)
    // ======================================================================
    _boosterBlast(targets, effect) {
      const steps = [];
      this.chocKilled = false;
      const step0 = { type: 'wave', cleared: [], effects: [effect], created: [], damaged: [], score: [], combo: 1 };
      steps.push(Object.assign(step0, { layers: this.snapshot(), stats: this.statsCopy(), booster: true }));
      this._runWaves(targets, [], [], 1, steps, null);
      const combo = this._settle(steps, 1);
      this._endTurn(steps, false, combo);
      return steps;
    }
    _t(x, y) { return { x, y, kind: 'blast' }; }

    boosterHammer(x, y) {
      const c = this.cell(x, y);
      if (!c || c.void || (!c.tile && !c.blocker)) return null;
      return this._boosterBlast([this._t(x, y)], { kind: 'hammer', x, y });
    }
    boosterLine(x, y) {
      if (!this.cell(x, y) || this.cells[y][x].void) return null;
      const t = [];
      for (let xx = 0; xx < this.w; xx++) if (!this.cells[y][xx].void) t.push(this._t(xx, y));
      return this._boosterBlast(t, { kind: 'line', dir: 'h', x, y, color: -1, wide: true });
    }
    boosterBomb(x, y) {
      if (!this.cell(x, y) || this.cells[y][x].void) return null;
      const t = [];
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const c = this.cell(x + dx, y + dy);
        if (c && !c.void) t.push(this._t(x + dx, y + dy));
      }
      return this._boosterBlast(t, { kind: 'bomb', x, y, r: 3, big: true, color: -1 });
    }
    boosterColor(x, y) {
      const c = this.cell(x, y);
      if (!c || !c.tile || c.tile.color < 0) return null;
      const color = c.tile.color;
      const cells = this._cellsOfColor(color);
      return this._boosterBlast(cells.map(([a, b]) => this._t(a, b)), { kind: 'cbomb', x, y, color, targets: cells });
    }
    boosterShuffle() {
      const steps = [];
      this.shuffle(steps);
      return steps;
    }

    // ======================================================================
    //  Bonus-runde når målet er nået med træk tilbage ("Grejs Finale")
    // ======================================================================
    bonusRound(movesLeft) {
      const steps = [];
      const n = Math.min(movesLeft, 15);
      this.stats.score += movesLeft * SCORE.bonusMove;
      const cand = [];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const c = this.cells[y][x];
        const t = c.tile;
        if (!c.blocker && t && !t.special && t.color >= 0 && !t.ice && !t.lock) cand.push([x, y]);
      }
      this.rng.shuffle(cand);
      const chosen = cand.slice(0, n);
      if (chosen.length) {
        const tr = { type: 'transform', items: [], layers: null, stats: null };
        for (const [x, y] of chosen) {
          const t = this.cells[y][x].tile;
          t.special = this.rng() < 0.5 ? 'h' : 'v';
          tr.items.push({ id: t.id, x, y, special: t.special });
        }
        tr.layers = this.snapshot(); tr.stats = this.statsCopy();
        steps.push(tr);
      }
      // Aktivér alle specialbrikker på boardet, gentaget til der ikke er flere.
      for (let round = 0; round < 8; round++) {
        const targets = [];
        for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
          const t = this.cells[y][x].tile;
          if (t && t.special && !this.cells[y][x].blocker) targets.push(this._t(x, y));
        }
        if (!targets.length) break;
        this._runWaves(targets, [], [], 1, steps, null);
        this._settle(steps, 1);
      }
      return steps;
    }
  }

  GC.Board = Board;
  if (typeof module !== 'undefined' && module.exports) module.exports = GC;
})(typeof window !== 'undefined' ? window : globalThis);
