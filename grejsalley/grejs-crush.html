      if (document.querySelector('.modal.open')) return;
      const k = e.key;
      if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); Game.togglePause(); return; }
      if (!canInput()) return;
      const r = Game.renderer;
      const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1], A: [-1, 0], D: [1, 0], W: [0, -1], S: [0, 1] };
      if (dirs[k]) {
        e.preventDefault();
        r.showCursor = true;
        if (!r.cursor) r.cursor = [Math.floor(Game.board.w / 2), Math.floor(Game.board.h / 2)];
        const [dx, dy] = dirs[k];
        if (r.selected) {
          const from = [r.selected[0], r.selected[1]];
          r.selected = null;
          trySwap(from, [from[0] + dx, from[1] + dy]);
          r.cursor = [GC.clamp(from[0] + dx, 0, Game.board.w - 1), GC.clamp(from[1] + dy, 0, Game.board.h - 1)];
        } else {
          r.cursor = [GC.clamp(r.cursor[0] + dx, 0, Game.board.w - 1), GC.clamp(r.cursor[1] + dy, 0, Game.board.h - 1)];
          if (Game.boosterMode) r.hover = r.cursor;
        }
        Game.idleT = 0;
      } else if (k === 'Enter' || k === ' ') {
        e.preventDefault();
        if (!r.cursor) { r.cursor = [Math.floor(Game.board.w / 2), Math.floor(Game.board.h / 2)]; r.showCursor = true; return; }
        if (Game.boosterMode) { applyTargetBooster(r.cursor); return; }
        tapCell(r.cursor);
      } else if (k === 'h' || k === 'H') {
        showHint();
      }
    });
  }

  function canInput() {
    return GC.App.state === 'PLAYING' && !Game.boardInputLocked && !Game.ended && !Game.paused && Game.board;
  }

  function tapCell(cell) {
    const r = Game.renderer;
    const c = Game.board.cells[cell[1]][cell[0]];
    if (!c.tile || c.blocker) { r.selected = null; return; }
    if (r.selected) {
      const [sx, sy] = r.selected;
      if (sx === cell[0] && sy === cell[1]) { r.selected = null; return; }
      if (Math.abs(sx - cell[0]) + Math.abs(sy - cell[1]) === 1) {
        r.selected = null;
        trySwap([sx, sy], cell);
        return;
      }
    }
    if (!Game.board.isMovable(c.tile)) { r.nudge(cell[0], cell[1]); GC.Audio.play('invalid'); return; }
    r.selected = [cell[0], cell[1], c.tile.id];
    GC.Audio.play('select');
  }

  // ------------------------------------------------------------------------
  //  Træk
  // ------------------------------------------------------------------------
  async function trySwap(a, b) {
    if (!canInput()) return;
    const board = Game.board;
    if (!board.inBounds(b[0], b[1])) return;
    const res = board.trySwap(a[0], a[1], b[0], b[1], { free: Game.freeSwitch });
    if (!res.ok) { Game.renderer.nudge(a[0], a[1]); GC.Audio.play('invalid'); return; }
    Game.boardInputLocked = true;
    Game.renderer.hint = null;
    if (!res.valid) {
      await Game.renderer.play(res.steps);
      Game.boardInputLocked = false;
      return;
    }
    if (Game.freeSwitch) { Game.freeSwitch = false; refreshBoosterBar(); }
    if (!Game.timed) Game.movesLeft--;
    Game.movesMade++;
    Game.lastCombo = 1;
    const matchesBefore = Game.stats.matches;
    updateHUD();
    await playAndResolve(res.steps);
    const chain = board.stats.matches - matchesBefore;
    Game.bestChain = Math.max(Game.bestChain, chain);
    GC.Player.track('combo', res.steps.comboTotal || 1);
    await afterAction(res.steps);
  }

  async function playAndResolve(steps) {
    // Vis "NO MORE MOVES! / SHUFFLING..." før en automatisk shuffle (spec §51)
    const idx = steps.findIndex((s) => s.type === 'shuffle');
    if (idx >= 0) {
      await Game.renderer.play(steps.slice(0, idx));
      GC.bigText('NO MORE MOVES!', 'SHUFFLING...', 'nomoves');
      await GC.wait(900);
      await Game.renderer.play(steps.slice(idx));
    } else {
      await Game.renderer.play(steps);
    }
  }

  /** Efter hvert træk/booster: tjek mål, sejr, nederlag. */
  async function afterAction(steps) {
    if (Game.ended) return;
    Game.stats = Game.board.statsCopy();
    updateHUD();
    const def = Game.def;
    const allDone = goalsMet();
    if (allDone && !scoreOnly(def)) { await win(); return; }
    if (steps && steps.noMoves && !Game.board.hasValidMove()) {
      GC.bigText('INGEN TRÆK!', 'Boardet er låst', 'nomoves');
      await GC.wait(900);
      await lose('noMoves');
      return;
    }
    if (!Game.timed && Game.movesLeft <= 0) {
      if (scoreOnly(def) && allDone) { await win(); return; }
      await lose('moves');
      return;
    }
    if (Game.timed && Game.timeLeft <= 0) { await timeUp(); return; }
    Game.boardInputLocked = false;
    Game.idleT = 0;
  }

  function goalsMet() {
    const st = Game.stats;
    return Game.def.goals.every((g) => goalView(g, st, Game.def).done);
  }

  // ------------------------------------------------------------------------
  //  Timer (spec §20) + hints
  // ------------------------------------------------------------------------
  function timerTick(dt) {
    animateScore(dt);
    if (!Game.board || GC.App.state !== 'PLAYING' || Game.paused || Game.ended) return;
    // Hint efter lidt tid uden input
    if (!Game.boardInputLocked && !Game.boosterMode) {
      Game.idleT += dt;
      if (Game.idleT > 6500 && !Game.renderer.hint) showHint();
    }
    GC.Save.data.stats.playTime += dt / 1000;
    if (!Game.timed) return;
    // Tiden står stille under intro-dialog, men løber under animationer.
    const before = Game.timeLeft;
    Game.timeLeft = Math.max(0, Game.timeLeft - dt / 1000);
    if (Math.ceil(before) !== Math.ceil(Game.timeLeft)) {
      updateHUD();
      if (Game.timeLeft <= 10 && Game.timeLeft > 0) GC.Audio.play('tick');
    }
    if (Game.timeLeft <= 10 && !Game.timeWarned) {
      Game.timeWarned = true;
      GC.Audio.setTempo(1.3);
      GC.bigText('10 SEKUNDER!', '', 'warn');
      document.body.classList.add('time-warning');
    }
    if (Game.timeLeft <= 0 && !Game.boardInputLocked) {
      Game.boardInputLocked = true;
      timeUp();
    }
  }

  async function timeUp() {
    if (Game.ended) return;
    document.body.classList.remove('time-warning');
    GC.bigText("TIME'S UP!", '', 'timeout');
    GC.Shake.add(8);
    GC.Audio.setTempo(1);
    await GC.wait(1000);
    if (goalsMet()) await win(); else await lose('time');
  }

  function showHint() {
    if (!Game.board || Game.boardInputLocked) return;
    const moves = Game.board.findValidMoves();
    if (!moves.length) return;
    moves.sort((a, b) => b.value - a.value);
    const m = moves[Math.min(moves.length - 1, Game.def.id <= 3 ? 0 : Math.floor(Math.random() * Math.min(3, moves.length)))];
    Game.renderer.hint = [m.a, m.b];
  }
  Game.showHint = showHint;

  // ------------------------------------------------------------------------
  //  Boosters (spec §23)
  // ------------------------------------------------------------------------
  function onBooster(k) {
    GC.Audio.unlock();
    if (!canInput()) return;
    const B = GC.Player.BOOSTERS[k];
    if (GC.Player.boosterCount(k) <= 0) {
      // Tilbyd køb direkte
      GC.UI.confirm({
        title: B.icon + ' ' + B.name,
        text: B.desc + '<br><br>Du har ingen tilbage. Køb 1 for <b>' + GC.fmt(B.price) + ' 🪙</b>?',
        yes: 'KØB', no: 'Nej tak'
      }).then((ok) => {
        if (!ok) return;
        if (GC.Player.spend(B.price)) { GC.Player.giveBooster(k, 1); GC.Save.data.stats.purchases++; GC.Audio.play('coin'); refreshBoosterBar(); }
        else GC.UI.toast('Ikke nok coins', '🪙');
      });
      return;
    }
    if (Game.boosterMode === k) { cancelBoosterMode(); return; }
    if (k === 'extraMoves') {
      GC.Player.useBooster(k); Game.usedBoosters++;
      if (Game.timed) Game.timeLeft += 15; else Game.movesLeft += 5;
      GC.Audio.play('booster');
      GC.bigText(Game.timed ? '+15 SEK' : '+5 TRÆK', '', 'booster');
      updateHUD();
      return;
    }
    if (k === 'shuffle') {
      GC.Player.useBooster(k); Game.usedBoosters++;
      runBooster(() => Game.board.boosterShuffle());
      return;
    }
    if (k === 'freeSwitch') {
      Game.freeSwitch = !Game.freeSwitch;
      if (Game.freeSwitch) {
        GC.Player.useBooster(k); Game.usedBoosters++;
        GC.UI.toast('Free Switch: byt to brikker – også uden match!', '🔄');
      } else { GC.Player.giveBooster(k, 1); Game.usedBoosters--; GC.Save.data.stats.boostersUsed--; }
      refreshBoosterBar();
      return;
    }
    Game.boosterMode = k;
    Game.renderer.targetMode = B.target === 'row' ? 'row' : k === 'bomb' ? 'bomb' : 'cell';
    document.body.classList.add('targeting');
    GC.UI.toast(B.name + ': vælg ' + (B.target === 'row' ? 'en række' : 'en brik') + ' (tryk igen for at annullere)', B.icon);
    refreshBoosterBar();
  }

  function cancelBoosterMode() {
    Game.boosterMode = null;
    if (Game.renderer) { Game.renderer.targetMode = null; Game.renderer.hover = null; }
    document.body.classList.remove('targeting');
    refreshBoosterBar();
  }

  function applyTargetBooster(cell) {
    const k = Game.boosterMode;
    const [x, y] = cell;
    let fn = null;
    if (k === 'hammer') fn = () => Game.board.boosterHammer(x, y);
    else if (k === 'lineBlast') fn = () => Game.board.boosterLine(x, y);
    else if (k === 'bomb') fn = () => Game.board.boosterBomb(x, y);
    else if (k === 'colorBlast') fn = () => Game.board.boosterColor(x, y);
    if (!fn) return;
    // Tjek om målet er gyldigt før boosteren bruges
    const probe = Game.board.clone(1);
    const test = { hammer: () => probe.boosterHammer(x, y), lineBlast: () => probe.boosterLine(x, y), bomb: () => probe.boosterBomb(x, y), colorBlast: () => probe.boosterColor(x, y) }[k]();
    if (!test) { GC.Audio.play('invalid'); GC.UI.toast('Vælg en brik', '⚠️'); return; }
    GC.Player.useBooster(k); Game.usedBoosters++;
    cancelBoosterMode();
    GC.Audio.play('booster');
    runBooster(fn);
  }

  async function runBooster(fn) {
    Game.boardInputLocked = true;
    Game.renderer.hint = null;
    const steps = fn();
    if (!steps) { Game.boardInputLocked = false; return; }
    Game.lastCombo = 1;
    await playAndResolve(steps);
    await afterAction(steps);
  }

  // ------------------------------------------------------------------------
  //  Pause (spec §63)
  // ------------------------------------------------------------------------
  Game.togglePause = function () {
    if (Game.ended || !Game.board) return;
    if (Game.paused) Game.resume(); else Game.pause();
  };
  Game.pause = function (auto) {
    if (Game.paused || Game.ended || !Game.board || GC.App.state !== 'PLAYING') return;
    Game.paused = true;
    GC.App.setState('PAUSED');
    GC.Audio.suspend();
    const m = GC.UI.modal({
      title: 'PAUSE', cls: 'pause-modal', closable: false,
      html: '<div class="pause-info">' + GC.escapeHtml(Game.def.event ? Game.def.eventName : 'Bane ' + Game.def.id) + (auto ? '<br><small>Spillet blev sat på pause, fordi fanen mistede fokus.</small>' : '') + '</div>',
      buttons: [
        { text: '▶ RESUME', cls: 'btn-green big', action: () => Game.resume() },
        { text: '↻ RESTART', cls: 'btn-blue', action: () => Game.restart() },
        { text: '⚙ SETTINGS', cls: 'btn-purple', keepOpen: true, action: () => GC.UI.openSettingsModal() },
        { text: '✖ QUIT LEVEL', cls: 'btn-red', keepOpen: true, action: () => Game.quit() }
      ]
    });
    Game._pauseModal = m;
  };
  Game.resume = function () {
    if (!Game.paused) return;
    Game.paused = false;
    if (Game._pauseModal) { Game._pauseModal.close(); Game._pauseModal = null; }
    GC.Audio.resume();
    GC.App.setState('PLAYING');
  };
  Game.restart = async function () {
    if (Game.movesMade > 0 && !Game.ended) {
      GC.Player.loseLife();
      recordLoss();
    }
    Game.paused = false;
    GC.Audio.resume();
    if (!GC.Player.hasLife()) { GC.UI.noLives(); GC.App.openMap(); return; }
    Game.start(Game.def);
  };
  Game.quit = async function () {
    const doQuit = () => {
      if (Game._pauseModal) { Game._pauseModal.close(); Game._pauseModal = null; }
      if (Game.movesMade > 0 && !Game.ended) { GC.Player.loseLife(); recordLoss(); }
      Game.ended = true;
      Game.paused = false;
      GC.Audio.resume();
      document.body.classList.remove('time-warning', 'targeting');
      Game.cleanup();
      if (Game.def && Game.def.event) GC.App.openEvent(); else GC.App.openMap();
    };
    if (Game.movesMade > 0 && !Game.ended && !GC.Player.unlimited()) {
      const ok = await GC.UI.confirm({ title: 'Forlad banen?', text: 'Du mister 1 liv ❤️, hvis du forlader banen nu.', yes: 'FORLAD', no: 'BLIV' });
      if (!ok) return;
    }
    doQuit();
  };
  function recordLoss() {
    GC.Player.recordResult({ id: Game.def.id, won: false, score: Game.stats.score, stars: 0, stats: Game.board ? Game.board.stats : {}, event: !!Game.def.event, bestChain: Game.bestChain });
  }

  // Automatisk pause når fanen skjules (spec §63)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (GC.App && GC.App.state === 'PLAYING' && !Game.ended) Game.pause(true);
      GC.Audio.suspend();
      GC.Save.save();
    } else if (!Game.paused) {
      GC.Audio.resume();
    }
  });

  // ------------------------------------------------------------------------
  //  Sejr (spec §41, §76)
  // ------------------------------------------------------------------------
  async function win() {
    if (Game.ended) return;
    Game.ended = true;
    Game.boardInputLocked = true;
    document.body.classList.remove('time-warning');
    GC.Audio.setTempo(1);
    cancelBoosterMode();
    const def = Game.def;
    // Bonusrunde: resterende træk bliver til stribe-brikker (Grejs Finale)
    const left = Game.timed ? 0 : Game.movesLeft;
    if (left > 0) {
      GC.bigText('GREJS FINALE!', left + ' træk tilbage = bonus!', 'finale');
      GC.Audio.play('reward');
      await GC.wait(1100);
      const steps = Game.board.bonusRound(left);
      Game.movesLeft = 0;
      const prevQ = GC.Quality.level;
      await Game.renderer.play(steps);
      void prevQ;
    }
    Game.stats = Game.board.statsCopy();
    updateHUD();
    await GC.wait(400);
    const score = Game.board.stats.score;
    let stars = 1;
    if (score >= def.stars[1]) stars = 2;
    if (score >= def.stars[2]) stars = 3;
    if (stars === 3 && Game.usedBoosters === 0 && def.world >= 3) GC.Save.data.stats.perfectRuns++;
    GC.App.setState('WIN');
    GC.Audio.play('win');
    const prevBest = (GC.Player.levelInfo(def.id) || {}).best || 0;
    const rewards = GC.Player.recordResult({ id: def.id, won: true, score, stars, stats: Game.board.stats, timed: Game.timed, event: !!def.event, bestChain: Game.bestChain });
    Game.cleanupTimerState();
    GC.UI.showWin({ def, score, stars, rewards, bonus: left * GC.SCORE.bonusMove, prevBest });
  }

  // ------------------------------------------------------------------------
  //  Nederlag (spec §42, §77)
  // ------------------------------------------------------------------------
  async function lose(reason) {
    if (Game.ended) return;
    Game.boardInputLocked = true;
    document.body.classList.remove('time-warning');
    GC.Audio.setTempo(1);
    cancelBoosterMode();
    // Tilbyd +5 træk (booster eller coins) før banen er endeligt tabt
    if (reason !== 'noMoves' && Game.extraMovesBought < 2) {
      const cost = 900 + Game.extraMovesBought * 600;
      const has = GC.Player.boosterCount('extraMoves') > 0;
      const choice = await GC.UI.offerContinue({
        timed: Game.timed, cost, hasBooster: has,
        goals: Game.def.goals.map((g) => goalView(g, Game.stats, Game.def))
      });
      if (choice === 'booster' || choice === 'coins') {
        if (choice === 'booster') GC.Player.useBooster('extraMoves');
        else if (!GC.Player.spend(cost)) { GC.UI.toast('Ikke nok coins', '🪙'); return lose(reason); }
        Game.extraMovesBought++;
        Game.usedBoosters++;
        if (Game.timed) { Game.timeLeft += 15; Game.timeWarned = false; } else Game.movesLeft += 5;
        GC.Audio.play('booster');
        updateHUD();
        Game.boardInputLocked = false;
        GC.App.setState('PLAYING');
        return;
      }
    }
    Game.ended = true;
    GC.App.setState('LOSE');
    GC.Audio.play('lose');
    GC.Player.loseLife();
    recordLoss();
    Game.cleanupTimerState();
    GC.UI.showLose({ def: Game.def, score: Game.stats.score, goals: Game.def.goals.map((g) => goalView(g, Game.stats, Game.def)), reason });
  }

  Game.cleanupTimerState = function () {
    document.body.classList.remove('time-warning', 'targeting');
  };

  // Debug-hjælpere
  Game.forceWin = async function () {
    if (!Game.board || Game.ended) return;
    Game.board.stats.score = Math.max(Game.board.stats.score, Game.def.stars[2]);
    Game.stats = Game.board.statsCopy();
    await win();
  };
  Game.forceLose = () => { Game.movesLeft = 0; Game.extraMovesBought = 9; lose('moves'); };

  GC.Game = Game;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/main.js */
/* ==========================================================================
   GREJS CRUSH – main.js
   Opstart, game states, menuer, profil, indstillinger, tutorial,
   daily reward, events og debug-værktøjer.
   ========================================================================== */
(function (root) {
  'use strict';
  const GC = root.GC = root.GC || {};
  const $ = (s) => document.querySelector(s);
  const esc = (s) => GC.escapeHtml(s);

  // --------------------------------------------------------------------------
  //  DEBUG (spec §91) – sæt til false før release. Kan også slås til med ?debug=1
  // --------------------------------------------------------------------------
  const DEBUG = false;
  GC.DEBUG = DEBUG || /[?&]debug=1/.test(root.location.search);
  GC.debugFlags = { grid: false, moves: false, fps: false };

  // --------------------------------------------------------------------------
  //  Game states (spec §73)
  // --------------------------------------------------------------------------
  const STATES = ['MENU', 'MAP', 'LEVEL_LOADING', 'PLAYING', 'PAUSED', 'WIN', 'LOSE', 'SHOP', 'SETTINGS', 'PROFILE', 'BOOSTERS'];
  const App = { state: 'MENU' };
  App.setState = function (s) {
    if (!STATES.includes(s)) { console.warn('Ukendt state', s); return; }
    App.state = s;
    document.body.dataset.state = s;
    if (GC.DEBUG) { const el = $('#dbg-state'); if (el) el.textContent = s; }
  };

  // --------------------------------------------------------------------------
  //  Opstart
  // --------------------------------------------------------------------------
  App.init = function () {
    GC.Save.load();
    const d = GC.Save.data;
    GC.Quality.apply(d.settings);
    GC.Particles.init($('#fx'));
    GC.Shake.init($('#board-shake'));
    GC.Audio.applySettings(d.settings);
    applyUISettings();
    GC.Shop.applyCosmetics();
    GC.Player.updateLives();

    // Lyd kræver brugerhandling
    const unlock = () => { GC.Audio.unlock(); GC.Audio.applySettings(GC.Save.data.settings); if (GC.Audio.wantTrack == null) GC.Audio.playMusic(0); else GC.Audio.playMusic(GC.Audio.wantTrack); };
    document.addEventListener('pointerdown', unlock, { once: true });
    document.addEventListener('keydown', unlock, { once: true });

    // Navigation
    document.querySelectorAll('[data-nav]').forEach((b) => b.addEventListener('click', () => {
      GC.Audio.unlock(); GC.Audio.play('button');
      App.navigate(b.dataset.nav);
    }));
    $('#menu-play').addEventListener('click', () => { GC.Audio.unlock(); GC.Audio.play('button'); App.playCurrent(); });
    $('#btn-pause').addEventListener('click', () => { GC.Audio.play('button'); GC.Game.togglePause(); });
    $('#w-daily').addEventListener('click', () => { GC.Audio.play('button'); App.showDailyModal(); });
    $('#w-challenge').addEventListener('click', () => { GC.Audio.play('button'); GC.Shop.tab = 'rewards'; App.navigate('shop'); });
    $('#w-last').addEventListener('click', () => { GC.Audio.play('button'); App.playCurrent(); });
    document.querySelectorAll('.pill-lives').forEach((p) => p.addEventListener('click', () => { if (GC.Save.data.lives < GC.Player.MAX_LIVES && !GC.Player.unlimited()) GC.UI.noLives(); else GC.UI.toast('Du har fulde liv! Næste liv lades op, når du mister et.', '❤️'); }));
    document.querySelectorAll('.pill-coins').forEach((p) => p.addEventListener('click', () => { GC.Shop.tab = 'coins'; App.navigate('shop'); }));
    $('#map-current').addEventListener('click', () => { GC.Audio.play('button'); GC.Map.scrollToCurrent(); });

    // Player-events -> feedback
    GC.Player.on((type, p) => {
      if (type === 'achievement') { GC.UI.toast('<b>Achievement:</b> ' + esc(p.name) + ' (+' + p.reward.coins + ' 🪙)', p.icon, 'ach'); GC.Audio.play('reward'); }
      else if (type === 'levelup') {
        // Ikke-blokerende fejring (må ikke dække sejrs-skærmen)
        GC.Audio.play('reward');
        GC.UI.toast('<b>LEVEL UP! Spiller-level ' + p.level + '</b><br>+' + p.reward.coins + ' 🪙 + ' + GC.Player.BOOSTERS[p.reward.booster].icon + ' ' + GC.Player.BOOSTERS[p.reward.booster].name, '🎖️', 'levelup');
        GC.Particles.stars(innerWidth / 2, innerHeight - 60, 24);
        GC.UI.updateTopbar();
      }
      else if (type === 'challengeDone') { GC.UI.toast('Daily challenge klaret! Hent din belønning i butikken.', '🏅'); }
      else if (type === 'coins' || type === 'lives' || type === 'xp') GC.UI.updateTopbar();
    });

    // Tid og liv tikker
    setInterval(() => { GC.Player.updateLives(); GC.UI.updateTopbar(); }, 1000);
    root.addEventListener('resize', () => { if (GC.Game.renderer && GC.Game.board) GC.Game.renderer.resize(); });
    root.addEventListener('orientationchange', () => setTimeout(() => { if (GC.Game.renderer && GC.Game.board) GC.Game.renderer.resize(); }, 300));
    root.addEventListener('hashchange', () => App.fromHash());

    if (GC.DEBUG) setupDebug();
    App.fromHash(true);
    App.renderMenu();

    // Service worker (offline på GitHub Pages)
    if (false) {
      navigator.serviceWorker.register('./sw.js').catch(() => { /* offline-cache er valgfri */ });
    }
    // Loading-skærm væk
    setTimeout(() => { const l = $('#loading'); if (l) { l.classList.add('done'); setTimeout(() => l.remove(), 600); } }, 250);
    if (!GC.Save.persistent) setTimeout(() => GC.UI.toast('Din browser tillader ikke lokal lagring – fremskridt gemmes kun i denne session.', '⚠️'), 1500);
    // Daily reward-popup ved første besøg i dag
    setTimeout(() => { if (App.state === 'MENU' && GC.Player.dailyStatus().canClaim && GC.Save.data.settings.tutorialSeen) App.showDailyModal(); }, 900);
  };

  function applyUISettings() {
    const s = GC.Save.data.settings;
    document.body.classList.toggle('large-ui', !!s.largeUI);
    document.body.classList.toggle('reduce-motion', !!s.reduceMotion);
    document.body.classList.toggle('perf', !!s.performance || s.animations === 'low');
  }

  // --------------------------------------------------------------------------
  //  Navigation
  // --------------------------------------------------------------------------
  App.navigate = function (where) {
    if (App.state === 'PLAYING' || App.state === 'PAUSED') return;
    if (history.replaceState) history.replaceState(null, '', where === 'menu' ? location.pathname + location.search : '#' + where);
    switch (where) {
      case 'map': return App.openMap();
      case 'shop': App.setState('SHOP'); GC.UI.show('shop'); GC.Shop.render(); return;
      case 'settings': App.setState('SETTINGS'); GC.UI.show('settings'); App.renderSettings($('#settings-content')); return;
      case 'profile': App.setState('PROFILE'); GC.UI.show('profile'); App.renderProfile(); return;
      case 'boosters': App.setState('BOOSTERS'); GC.UI.show('boosters'); GC.Boosters.render(); return;
      case 'event': return App.openEvent();
      default: return App.openMenu();
    }
  };
  App.fromHash = function (initial) {
    const h = (location.hash || '').replace('#', '');
    if (['map', 'shop', 'settings', 'profile', 'boosters', 'event'].includes(h)) App.navigate(h);
    else if (h === 'game') App.playCurrent();
    else if (initial) App.openMenu();
  };

  App.openMenu = function () {
    GC.Game.cleanup && GC.Game.board && GC.Game.cleanup();
    App.setState('MENU');
    GC.UI.show('menu');
    GC.UI.applyBackground(Math.max(1, Math.ceil(Math.min(GC.Save.data.unlockedLevel, GC.Levels.COUNT) / 20)));
    document.body.dataset.world = '';
    App.renderMenu();
    GC.Audio.playMusic(0);
  };

  App.openMap = function (opts) {
    if (GC.Game.board) GC.Game.cleanup();
    App.setState('MAP');
    GC.UI.show('map');
    const w = Math.max(1, Math.ceil(Math.min(GC.Save.data.unlockedLevel, GC.Levels.COUNT) / 20));
    GC.UI.applyBackground(w);
    if (location.hash !== '#map' && history.replaceState) history.replaceState(null, '', '#map');
    GC.Map.show(opts);
    GC.Audio.playMusic((w - 1) % 10);
    setTimeout(App.checkPendingRewards, 700);
  };

  App.playCurrent = function () {
    const id = Math.min(GC.Save.data.unlockedLevel, GC.Levels.COUNT);
    const def = GC.Levels.get(id);
    if (id === 1 && !GC.Save.data.levels[1]) App.playLevel(def);
    else { if (App.state !== 'MAP') App.openMap(); GC.UI.levelPreview(def); }
  };

  /** Start en bane (tjekker liv og viser tutorial første gang). */
  App.playLevel = async function (def, replay) {
    void replay;
    GC.Player.updateLives();
    if (!GC.Player.hasLife()) { if (App.state !== 'MAP' && !def.event) App.openMap(); GC.UI.noLives(); return; }
    if (!GC.Save.data.settings.tutorialSeen) {
      await App.tutorial();
    }
    GC.Save.data.lastLevel = def.event ? GC.Save.data.lastLevel : def.id;
    if (location.hash !== '#game' && history.replaceState) history.replaceState(null, '', '#game');
    GC.Game.start(def);
  };

  // --------------------------------------------------------------------------
  //  Menu (spec §4)
  // --------------------------------------------------------------------------
  App.renderMenu = function () {
    const d = GC.Save.data;
    $('#menu-char').innerHTML = GC.Art.character(d.player.avatar === 'grejs' ? 'grejs' : d.player.avatar, { size: 150 });
    const cur = Math.min(d.unlockedLevel, GC.Levels.COUNT);
    const W = GC.Levels.worldOf(cur);
    $('#w-last .wv').textContent = 'Bane ' + cur;
    $('#w-last .ws').textContent = W.name;
    const ds = GC.Player.dailyStatus();
    $('#w-daily').classList.toggle('ready', ds.canClaim);
    $('#w-daily .ws').textContent = ds.canClaim ? 'Klar! Dag ' + (ds.dayIndex + 1) : 'Streak: ' + ds.streak + ' dage';
    const c = GC.Player.challenge();
    $('#w-challenge .ws').textContent = c.claimed ? '✔ Klaret' : GC.fmt(c.progress) + ' / ' + GC.fmt(c.target);
    $('#w-challenge .wv').textContent = c.text;
    $('#w-challenge').classList.toggle('ready', c.done && !c.claimed);
    // Event-banner
    const ev = GC.Events.active();
    const eb = $('#event-banner');
    if (ev) {
      eb.hidden = false;
      eb.style.setProperty('--ev', ev.color);
      eb.innerHTML = '<span class="eb-emoji">' + ev.emoji + '</span><span class="eb-text"><b>' + esc(ev.name) + '</b><small>' + esc(ev.text) + '</small></span><span class="eb-go">' + GC.Events.progress(ev) + '/' + ev.levels + ' ▶</span>';
      eb.onclick = () => { GC.Audio.play('button'); App.openEvent(); };
    } else eb.hidden = true;
    const chest = GC.Player.availableChests().length;
    $('#menu-badge-shop').hidden = !(ds.canClaim || (c.done && !c.claimed) || chest);
    GC.UI.updateTopbar();
  };

  App.showDailyModal = function () {
    const ds = GC.Player.dailyStatus();
    const html = '<div class="daily-row">' + GC.Player.DAILY.map((r, i) => {
      const claimed = i < ds.dayIndex || (!ds.canClaim && i === ds.dayIndex);
      const today = ds.canClaim && i === ds.dayIndex;
      return '<div class="daily-day ' + (claimed ? 'claimed' : '') + (today ? ' today' : '') + (i === 6 ? ' big' : '') + '"><div class="dd-n">Dag ' + (i + 1) + '</div><div class="dd-icon">' + (r.coins && !r.boosters ? '🪙' : i === 6 ? '👑' : i === 5 ? '♾️' : '🎁') + '</div><div class="dd-t">' + esc(r.text) + '</div>' + (claimed ? '<div class="dd-check">✔</div>' : '') + '</div>';
    }).join('') + '</div><p class="center muted">' + (ds.canClaim ? 'Kom tilbage hver dag for at holde din streak i live!' : 'Du har hentet dagens belønning. Kom igen i morgen!') + '</p>';
    GC.UI.modal({
      title: 'DAILY REWARD 🎁', cls: 'daily-modal', html,
      buttons: ds.canClaim ? [{ text: 'HENT!', cls: 'btn-green big', action: (m) => App.claimDaily(m.el.querySelector('.daily-day.today')) }] : [{ text: 'OK', cls: 'btn-blue' }]
    });
  };

  App.claimDaily = function (fromEl) {
    const r = GC.Player.claimDaily();
    if (!r) return;
    GC.Audio.play('reward');
    const el = fromEl || document.body;
    const rr = el.getBoundingClientRect ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
    GC.Particles.confetti(rr.left + rr.width / 2, rr.top + rr.height / 2, 50, 2);
    if (r.coins) GC.UI.flyCoins(fromEl, r.coins);
    GC.UI.toast('Dag ' + r.day + ': ' + esc(r.text), '🎁');
    App.renderMenu();
  };

  App.openChest = function (at, fromEl) {
    const r = GC.Player.openChest(at);
    if (!r) return;
    GC.Audio.play('reward');
    const B = GC.Player.BOOSTERS;
    const items = [];
    if (r.coins) items.push('<div class="ci"><span>🪙</span>' + GC.fmt(r.coins) + '</div>');
    if (r.xp) items.push('<div class="ci"><span>⚡</span>' + r.xp + ' XP</div>');
    for (const k in (r.boosters || {})) items.push('<div class="ci"><span>' + B[k].icon + '</span>×' + r.boosters[k] + '</div>');
    if (r.cosmetic) items.push('<div class="ci"><span>🎨</span>' + esc(r.cosmetic.split(':')[1]) + '</div>');
    GC.UI.modal({ title: 'BONUSKISTE!', cls: 'chest-modal', html: '<div class="chest-open">🧰</div><p class="center">Du har gennemført ' + at + ' baner!</p><div class="chest-items">' + items.join('') + '</div>', buttons: [{ text: 'FEDT!', cls: 'btn-green' }] });
    GC.Particles.confetti(innerWidth / 2, innerHeight / 2, 90, 3);
    if (fromEl) GC.UI.flyCoins(fromEl, r.coins);
    if (GC.Map.built && App.state === 'MAP') GC.Map.build(), GC.Map.show();
  };

  /** Efter en sejr/ved kortet: påmind om kister og challenges. */
  App.checkPendingRewards = function () {
    const chests = GC.Player.availableChests();
    if (chests.length && App.state === 'MAP') GC.UI.toast('Du har en bonuskiste klar! Tryk på 🧰 på kortet.', '🧰');
  };

  // --------------------------------------------------------------------------
  //  Events (spec §87-88)
  // --------------------------------------------------------------------------
  App.openEvent = function () {
    if (App.state !== 'MENU') App.openMenu();
    const ev = GC.Events.active();
    if (!ev) { GC.UI.toast('Der er ingen event lige nu.', '📅'); return; }
    let h = '<div class="event-head" style="--ev:' + ev.color + '"><div class="eh-char">' + GC.Art.character(ev.char, { size: 80 }) + '</div><p>' + esc(ev.text) + '</p></div><div class="event-levels">';
    for (let i = 1; i <= ev.levels; i++) {
      const id = GC.Events.levelId(ev, i);
      const info = GC.Save.data.levels[id] || {};
      const open = i === 1 || (GC.Save.data.levels[GC.Events.levelId(ev, i - 1)] || {}).stars;
      h += '<button class="event-lvl ' + (info.stars ? 'done' : open ? 'open' : 'locked') + '" data-n="' + i + '" ' + (open ? '' : 'disabled') + '><span>' + ev.emoji + ' ' + i + '</span><i>' + '★'.repeat(info.stars || 0) + '☆'.repeat(3 - (info.stars || 0)) + '</i></button>';
    }
    h += '</div>';
    const done = GC.Events.progress(ev) >= ev.levels;
    const claimed = GC.Events.rewardClaimed(ev);
    h += '<p class="center">Gennemfør alle ' + ev.levels + ' baner og vind <b>1.000 🪙</b> + et eksklusivt cosmetic!</p>';
    const m = GC.UI.modal({
      title: ev.emoji + ' ' + esc(ev.name).toUpperCase(), cls: 'event-modal', html: h,
      buttons: done && !claimed ? [{ text: 'HENT EVENT-BELØNNING', cls: 'btn-green', action: () => { if (GC.Events.claimReward(ev)) { GC.Audio.play('reward'); GC.Particles.confetti(innerWidth / 2, innerHeight / 2, 100, 3); GC.UI.toast('Event-belønning hentet!', '🎊'); App.renderMenu(); } } }] : [{ text: 'LUK', cls: 'btn-gray' }]
    });
    m.el.querySelectorAll('.event-lvl').forEach((b) => b.addEventListener('click', () => {
      m.close();
      GC.UI.levelPreview(GC.Events.getLevel(ev, +b.dataset.n));
    }));
  };

  // --------------------------------------------------------------------------
  //  Profil, achievements, statistik, leaderboard (spec §30, §32, §34, §68)
  // --------------------------------------------------------------------------
  App.profileTab = 'profil';
  App.renderProfile = function () {
    const d = GC.Save.data;
    const tabs = [['profil', '👤 Profil'], ['achievements', '🏆 Achievements'], ['stats', '📊 Statistik'], ['leaderboard', '🥇 Leaderboard']];
    $('#profile-tabs').innerHTML = tabs.map(([k, t]) => '<button class="tab ' + (App.profileTab === k ? 'active' : '') + '" data-tab="' + k + '" role="tab">' + t + '</button>').join('');
    $('#profile-tabs').querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => { GC.Audio.play('button'); App.profileTab = b.dataset.tab; App.renderProfile(); }));
    const el = $('#profile-content');
    const st = d.stats;
    const p = d.player;
    const xpA = GC.Player.xpFor(p.level), xpB = GC.Player.xpFor(p.level + 1);
    if (App.profileTab === 'profil') {
      const achCount = Object.keys(d.achievements).length;
      el.innerHTML = '<div class="profile-card"><div class="pc-avatar">' + GC.Art.character(p.avatar, { size: 120 }) + '</div>' +
        '<div class="pc-info"><input class="pc-name" id="pc-name" maxlength="18" aria-label="Spillernavn" value="' + esc(d.settings.playerName || p.name) + '">' +
        '<div class="pc-level">Level <b>' + p.level + '</b></div><div class="xpbar"><span style="width:' + Math.min(100, (p.xp - xpA) / (xpB - xpA) * 100) + '%"></span><em>XP ' + GC.fmt(p.xp) + ' / ' + GC.fmt(xpB) + '</em></div></div></div>' +
        '<div class="stat-grid">' +
        statBox('⭐', 'Stjerner i alt', GC.Player.totalStars() + ' / ' + GC.Levels.COUNT * 3) +
        statBox('🏁', 'Gennemførte baner', GC.Player.completedCount() + ' / ' + GC.Levels.COUNT) +
        statBox('📈', 'Højeste score', GC.fmt(st.highestScore)) +
        statBox('🍬', 'Matches i alt', GC.fmt(st.matches)) +
        statBox('✨', 'Specialbrikker', GC.fmt(st.specials)) +
        statBox('🔨', 'Boosters brugt', GC.fmt(st.boostersUsed)) +
        statBox('🔥', 'Nuværende streak', d.daily.streak + ' dage') +
        statBox('⏳', 'Spilletid', GC.fmtTime(st.playTime)) +
        statBox('🏆', 'Achievements', achCount + ' / ' + GC.Player.ACHIEVEMENTS.length) +
        '</div><p class="center"><button class="btn btn-purple" id="pc-avatar-btn">🎨 Skift avatar i butikken</button></p>';
      $('#pc-name').addEventListener('change', (e) => { d.settings.playerName = e.target.value.trim().slice(0, 18) || 'Grejs-spiller'; GC.Save.save(); GC.UI.toast('Navn gemt', '✏️'); });
      $('#pc-avatar-btn').addEventListener('click', () => { GC.Shop.tab = 'cosmetics'; App.navigate('shop'); });
    } else if (App.profileTab === 'achievements') {
      const A = GC.Player.ACHIEVEMENTS;
      el.innerHTML = '<p class="center muted">' + Object.keys(d.achievements).length + ' af ' + A.length + ' låst op</p><div class="ach-grid">' + A.map((a) => {
        const got = d.achievements[a.id];
        return '<div class="ach ' + (got ? 'got' : '') + '"><div class="ach-icon">' + a.icon + '</div><div class="ach-name">' + esc(a.name) + '</div><div class="ach-desc">' + esc(a.desc) + '</div><div class="ach-rew">' + (got ? '✔ ' + new Date(got).toLocaleDateString('da-DK') : '+' + a.reward.coins + ' 🪙') + '</div></div>';
      }).join('') + '</div>';
    } else if (App.profileTab === 'stats') {
      const rows = [
        ['Spil i alt', st.games], ['Sejre', st.wins], ['Nederlag', st.losses], ['Matches', st.matches], ['Bedste combo', 'x' + st.bestCombo],
        ['Største kædereaktion', st.bestChain + ' matches'], ['Samlet score', st.totalScore], ['Højeste level nået', Math.min(d.unlockedLevel, GC.Levels.COUNT)],
        ['3-stjernede baner', st.threeStar], ['Boosters brugt', st.boostersUsed], ['Coins optjent', st.coinsEarned], ['Spilletid', GC.fmtTime(st.playTime)],
        ['Bomber aktiveret', st.bombs], ['Striber aktiveret', st.stripes], ['Farvebomber', st.cbombs], ['Jelly fjernet', st.jelly],
        ['Forhindringer fjernet', st.blockers], ['Ingredienser', st.ingredients], ['Brikker knust', st.tiles], ['Daily challenges', st.dailyDone]
      ];
      el.innerHTML = '<table class="stats-table"><tbody>' + rows.map(([k, v]) => '<tr><th>' + k + '</th><td>' + (typeof v === 'number' ? GC.fmt(v) : esc(v)) + '</td></tr>').join('') + '</tbody></table>';
    } else {
      const list = GC.Player.leaderboard();
      el.innerHTML = '<p class="center muted">Lokalt leaderboard – din samlede bedste score på alle baner.</p><ol class="leaderboard">' + list.map((r, i) =>
        '<li class="' + (r.me ? 'me' : '') + '"><span class="lb-rank">' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</span><span class="lb-name">' + esc(r.name) + (r.me ? ' (dig)' : '') + '</span><span class="lb-score">' + GC.fmt(r.score) + '</span></li>').join('') + '</ol>';
    }
  };
  function statBox(icon, label, val) { return '<div class="stat-box"><div class="sb-icon">' + icon + '</div><div class="sb-val">' + val + '</div><div class="sb-label">' + label + '</div></div>'; }

  // --------------------------------------------------------------------------
  //  Indstillinger (spec §64, §45)
  // --------------------------------------------------------------------------
  App.renderSettings = function (el, compact) {
    const s = GC.Save.data.settings;
    const toggle = (key, label, icon) => '<label class="set-row"><span>' + icon + ' ' + label + '</span><input type="checkbox" class="switch" data-set="' + key + '" ' + (s[key] ? 'checked' : '') + '></label>';
    el.innerHTML =
      '<div class="set-group"><h3>Lyd</h3>' +
      toggle('music', 'Musik', '🎵') +
      '<label class="set-row"><span>Musik-volumen</span><input type="range" min="0" max="1" step="0.05" data-set="musicVolume" value="' + s.musicVolume + '" aria-label="Musik-volumen"></label>' +
      toggle('sound', 'Lydeffekter', '🔊') +
      '<label class="set-row"><span>SFX-volumen</span><input type="range" min="0" max="1" step="0.05" data-set="sfxVolume" value="' + s.sfxVolume + '" aria-label="Lydeffekt-volumen"></label>' +
      toggle('vibration', 'Vibration', '📳') + '</div>' +
      '<div class="set-group"><h3>Grafik</h3>' +
      '<label class="set-row"><span>✨ Animationer</span><select data-set="animations" aria-label="Animationsniveau"><option value="high"' + (s.animations === 'high' ? ' selected' : '') + '>High</option><option value="medium"' + (s.animations === 'medium' ? ' selected' : '') + '>Medium</option><option value="low"' + (s.animations === 'low' ? ' selected' : '') + '>Low</option></select></label>' +
      toggle('performance', 'Performance Mode', '⚡') +
      toggle('reduceMotion', 'Reduce Motion', '🧘') +
      toggle('largeUI', 'Større UI', '🔎') + '</div>' +
      (compact ? '' :
        '<div class="set-group"><h3>Hjælp</h3><button class="btn btn-blue small" id="set-tutorial">Vis tutorial igen</button> <button class="btn btn-blue small" id="set-keys">Tastatur-genveje</button></div>' +
        '<div class="set-group danger"><h3>Data</h3><button class="btn btn-red" id="set-reset">RESET PROGRESS</button></div>' +
        '<p class="version" id="set-version">Grejs Crush v1.0 · save v' + GC.Save.VERSION + ' · ' + GC.Levels.COUNT + ' baner</p>');
    el.querySelectorAll('[data-set]').forEach((inp) => {
      inp.addEventListener(inp.type === 'range' ? 'input' : 'change', () => {
        const k = inp.dataset.set;
        s[k] = inp.type === 'checkbox' ? inp.checked : inp.type === 'range' ? +inp.value : inp.value;
        GC.Audio.applySettings(s);
        GC.Quality.apply(s);
        applyUISettings();
        if (k === 'music' && s.music) GC.Audio.playMusic(GC.Audio.wantTrack || 0);
        if (inp.type !== 'range') GC.Audio.play('button');
        GC.Save.soon();
      });
    });
    if (compact) return;
    el.querySelector('#set-tutorial').addEventListener('click', () => App.tutorial());
    el.querySelector('#set-keys').addEventListener('click', () => GC.UI.modal({ title: 'Tastatur', html: '<ul class="keys"><li><kbd>←↑→↓</kbd> / <kbd>WASD</kbd> flyt markør</li><li><kbd>Enter</kbd> / <kbd>Space</kbd> vælg brik</li><li>Valgt brik + pil = byt</li><li><kbd>H</kbd> vis hint</li><li><kbd>Esc</kbd> / <kbd>P</kbd> pause</li></ul>', buttons: [{ text: 'OK', cls: 'btn-green' }] }));
    el.querySelector('#set-reset').addEventListener('click', async () => {
      const a = await GC.UI.confirm({ title: 'Are you sure?', text: 'Vil du nulstille dit spil?', yes: 'Ja', no: 'Nej', danger: true });
      if (!a) return;
      const b = await GC.UI.confirm({ title: '⚠️ ADVARSEL', text: '<b>ALL progress will be deleted.</b><br>Alle baner, stjerner, coins og boosters slettes permanent.', yes: 'SLET ALT', no: 'Fortryd', danger: true });
      if (!b) return;
      GC.Save.reset();
      GC.UI.toast('Alt fremskridt er slettet.', '🗑️');
      GC.Quality.apply(GC.Save.data.settings); applyUISettings(); GC.Shop.applyCosmetics();
      GC.Map.built = false;
      App.openMenu();
    });
    // Skjult debug: tryk 7 gange på versionsteksten
    let taps = 0;
    el.querySelector('#set-version').addEventListener('click', () => { if (++taps >= 7 && !GC.DEBUG) { GC.DEBUG = true; setupDebug(); GC.UI.toast('Debug mode aktiveret', '🐞'); } });
  };

  // --------------------------------------------------------------------------
  //  Tutorial (spec §81)
  // --------------------------------------------------------------------------
  App.tutorial = function () {
    return new Promise((res) => {
      const T = GC.Art.TILE_TYPES;
      const tile = (c, sp) => '<img alt="" src="' + GC.Art.iconURL({ color: c, special: sp || null, ing: -1 }, 44) + '">';
      const slides = [
        { t: 'SWAP', d: 'Stryg eller træk en brik mod en nabo for at bytte plads.', v: '<div class="tut-row swap">' + tile(0) + '<span class="tut-arrow">⇄</span>' + tile(1) + '</div>' },
        { t: 'Match 3', d: 'Tre ens på række eller i kolonne forsvinder – og nye falder ned.', v: '<div class="tut-row pop">' + tile(3) + tile(3) + tile(3) + '</div>' },
        { t: 'Create Special Bricks', d: '4 på række = stribe-brik. L/T-form = bombe. 5 på række = farvebombe!', v: '<div class="tut-row">' + tile(1, 'h') + tile(4, 'bomb') + tile(-1, 'cbomb') + '</div>' },
        { t: 'Make Combos', d: 'Byt to specialbrikker sammen for kæmpe effekter – og lav kædereaktioner for combo-bonus!', v: '<div class="tut-row combo">' + tile(2, 'v') + '<span class="tut-arrow">+</span>' + tile(5, 'bomb') + '<span class="tut-arrow">=</span><span class="tut-boom">💥</span></div>' },
        { t: 'Good luck!', d: 'Grejs følger dig gennem 10 verdener og ' + GC.Levels.COUNT + ' baner. God fornøjelse!', v: '<div class="tut-char">' + GC.Art.character('grejs', { size: 120 }) + '</div>' }
      ];
      void T;
      let i = 0;
      const m = GC.UI.modal({ title: '', cls: 'tutorial-modal', closable: false, html: '<div id="tut"></div>', buttons: [] });
      const body = m.el.querySelector('#tut');
      const finish = () => { GC.Save.data.settings.tutorialSeen = true; GC.Save.save(); m.close(); res(); };
      const render = () => {
        const s = slides[i];
        body.innerHTML = '<div class="tut-slide"><div class="tut-visual">' + s.v + '</div><h2>' + s.t + '</h2><p>' + s.d + '</p><div class="tut-dots">' + slides.map((_, k) => '<i class="' + (k === i ? 'on' : '') + '"></i>').join('') + '</div>' +
          '<div class="modal-buttons"><button class="btn btn-gray small" id="tut-skip">Spring over</button><button class="btn btn-green" id="tut-next">' + (i === slides.length - 1 ? 'SPIL!' : 'Næste ▶') + '</button></div></div>';
        body.querySelector('#tut-skip').addEventListener('click', () => { GC.Audio.play('button'); finish(); });
        body.querySelector('#tut-next').addEventListener('click', () => { GC.Audio.play('button'); i++; if (i >= slides.length) finish(); else render(); });
        body.querySelector('#tut-next').focus();
      };
      render();
    });
  };

  // --------------------------------------------------------------------------
  //  Debug og cheats (spec §91-92)
  // --------------------------------------------------------------------------
  function setupDebug() {
    if ($('#debug-panel')) return;
    const p = document.createElement('div');
    p.id = 'debug-panel';
    p.innerHTML = '<button id="dbg-toggle" aria-label="Debug">🐞</button><div class="dbg-body"><div>State: <b id="dbg-state">' + App.state + '</b> · FPS <b id="dbg-fps">-</b></div>' +
      '<button data-d="unlock">Unlock all levels</button><button data-d="coins">+10.000 coins</button><button data-d="boosters">+5 alle boosters</button>' +
      '<button data-d="win">Skip level (vind)</button><button data-d="lose">Tab level</button><button data-d="reload">Reload level</button>' +
      '<button data-d="fps">Show FPS</button><button data-d="grid">Show grid</button><button data-d="moves">Show valid moves</button>' +
      '<button data-d="lives">Fyld liv</button><button data-d="event">Tving event</button><button data-d="daily">Nulstil daily</button></div>';
    document.body.appendChild(p);
    $('#dbg-toggle').addEventListener('click', () => p.classList.toggle('open'));
    p.querySelectorAll('[data-d]').forEach((b) => b.addEventListener('click', () => {
      const a = b.dataset.d;
      if (a === 'unlock') root.unlockAll();
      else if (a === 'coins') root.addCoins(10000);
      else if (a === 'boosters') Object.keys(GC.Player.BOOSTERS).forEach((k) => root.giveBooster(k, 5));
      else if (a === 'win') GC.Game.forceWin();
      else if (a === 'lose') GC.Game.forceLose();
      else if (a === 'reload') { if (GC.Game.def) GC.Game.start(GC.Game.def); }
      else if (a === 'fps') GC.debugFlags.fps = !GC.debugFlags.fps;
      else if (a === 'grid') { GC.debugFlags.grid = !GC.debugFlags.grid; if (GC.Game.renderer) GC.Game.renderer.debugGrid = GC.debugFlags.grid; }
      else if (a === 'moves') { GC.debugFlags.moves = !GC.debugFlags.moves; }
      else if (a === 'lives') GC.Player.addLives(5);
      else if (a === 'event') { const ids = GC.Events.EVENTS.map((e) => e.id); GC.Events.forced = ids[(ids.indexOf(GC.Events.forced) + 1) % (ids.length + 1)] || null; GC.UI.toast('Event: ' + (GC.Events.forced || 'auto'), '📅'); App.renderMenu(); }
      else if (a === 'daily') { GC.Save.data.daily.lastClaim = ''; GC.Save.data.challenge.day = ''; GC.Save.save(); App.renderMenu(); }
    }));
    GC.Loop.add(() => {
      const f = $('#dbg-fps'); if (f) f.textContent = GC.Loop.fps;
      const o = $('#fps-overlay');
      if (GC.debugFlags.fps) { if (o) { o.hidden = false; o.textContent = GC.Loop.fps + ' FPS · ' + GC.Particles.count() + ' partikler'; } }
      else if (o) o.hidden = true;
      if (GC.Game.renderer && GC.Game.board) GC.Game.renderer.debugMoves = GC.debugFlags.moves && !GC.Game.boardInputLocked ? GC.Game.board.findValidMoves() : null;
    });
    // Konsol-kommandoer (kun til udvikling)
    root.unlockAll = () => { GC.Save.data.unlockedLevel = GC.Levels.COUNT; GC.Save.save(); GC.Map.built = false; if (App.state === 'MAP') GC.Map.show(); return 'Alle baner låst op'; };
    root.addCoins = (n) => { GC.Player.addCoins(n || 1000, 'debug'); GC.UI.updateTopbar(); return GC.Save.data.coins; };
    root.giveBooster = (k, n) => { GC.Player.giveBooster(k, n || 1); if (GC.Game.board) GC.Game.updateHUD(); return GC.Save.data.boosters; };
    root.completeLevel = (id, stars) => {
      const d = GC.Save.data;
      for (let i = 1; i <= id; i++) { const info = d.levels[i] || (d.levels[i] = { stars: 0, best: 0, plays: 1, wins: 1 }); info.stars = Math.max(info.stars, stars || 3); info.best = Math.max(info.best, GC.Levels.get(i).stars[(stars || 3) - 1]); }
      d.unlockedLevel = Math.max(d.unlockedLevel, Math.min(GC.Levels.COUNT, id + 1));
      GC.Save.save(); GC.Map.built = false;
      if (App.state === 'MAP') GC.Map.show();
      return 'Bane 1-' + id + ' gennemført';
    };
    root.GC = GC;
  }

  GC.App = App;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.init);
  else App.init();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
