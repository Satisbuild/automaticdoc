<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root {
  --bg: #070a14;
  --bg2: #0c1122;
  --panel: rgba(13, 18, 36, 0.88);
  --panel-solid: #0f1530;
  --panel-2: rgba(22, 30, 58, 0.9);
  --line: rgba(120, 160, 255, 0.16);
  --line-2: rgba(120, 160, 255, 0.3);
  --text: #e8eeff;
  --muted: #8d98bd;
  --dim: #5d6789;
  --cyan: #36e2ff;
  --magenta: #ff4fd8;
  --gold: #ffd23f;
  --green: #3ddc84;
  --red: #ff4d6d;
  --orange: #ff9a3d;
  --violet: #9b7bff;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  --glow-c: 0 0 18px rgba(54, 226, 255, 0.45);
  --glow-m: 0 0 18px rgba(255, 79, 216, 0.45);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --top-h: 64px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.hidden { display: none !important; }
b, strong { font-weight: 800; }

/* =========================================================
   CANVAS
   ========================================================= */
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#game.pan { cursor: grabbing; }

/* =========================================================
   GENERIC UI
   ========================================================= */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 12px; font-weight: 800; letter-spacing: .04em; background: linear-gradient(180deg, rgba(60, 80, 140, .55), rgba(30, 40, 80, .55)); border: 1px solid var(--line-2); transition: transform .15s var(--ease), box-shadow .2s, background .2s, border-color .2s, opacity .2s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--cyan); box-shadow: var(--glow-c); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, #1fb8ff, #7b5cff 55%, #ff4fd8); border-color: transparent; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
.btn.primary:hover:not(:disabled) { box-shadow: 0 0 26px rgba(123, 92, 255, .6); }
.btn.gold { background: linear-gradient(135deg, #ffd23f, #ff9a3d); color: #2a1600; border-color: transparent; }
.btn.gold:hover:not(:disabled) { box-shadow: 0 0 22px rgba(255, 210, 63, .55); }
.btn.danger { background: linear-gradient(180deg, rgba(255, 77, 109, .35), rgba(140, 20, 50, .45)); border-color: rgba(255, 77, 109, .5); }
.btn.danger:hover:not(:disabled) { border-color: var(--red); box-shadow: 0 0 18px rgba(255, 77, 109, .5); }
.btn.sm { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--muted); }
.chip.c { color: var(--cyan); border-color: rgba(54,226,255,.35); }
.chip.g { color: var(--gold); border-color: rgba(255,210,63,.35); }
.chip.m { color: var(--magenta); border-color: rgba(255,79,216,.35); }
.coin { color: var(--gold); }
kbd { font-family: var(--mono); font-size: .82em; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--text); }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(120,160,255,.3) transparent; }
.scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(120,160,255,.25); border-radius: 8px; }

/* =========================================================
   START MENU
   ========================================================= */
#menu { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow: hidden; background: radial-gradient(1200px 700px at 50% 30%, #131a3a 0%, #070a14 65%); transition: opacity .5s var(--ease), visibility .5s; }
#menu.out { opacity: 0; visibility: hidden; pointer-events: none; }
#menu-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.menu-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px; max-width: 560px; width: 100%; }
.logo { display: flex; align-items: center; gap: clamp(12px, 3vw, 22px); animation: logoIn 1s var(--ease) both; }
.logo svg { width: clamp(64px, 14vw, 112px); height: auto; filter: drop-shadow(0 0 22px rgba(54,226,255,.45)); animation: spinSlow 30s linear infinite; }
.logo h1 { font-size: clamp(40px, 10.5vw, 86px); line-height: .9; font-weight: 900; letter-spacing: .06em; background: linear-gradient(100deg, #ffffff 0%, #9fefff 30%, #36e2ff 50%, #b48cff 72%, #ff4fd8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 24px rgba(54, 226, 255, .25)); }
.tagline { margin-top: 14px; font-size: clamp(12px, 2.6vw, 15px); font-weight: 800; letter-spacing: .5em; color: var(--muted); animation: fadeUp 1s .2s var(--ease) both; }
.tagline i { font-style: normal; color: var(--cyan); }
.menu-btns { margin-top: 36px; display: grid; gap: 12px; width: min(340px, 100%); animation: fadeUp 1s .35s var(--ease) both; }
.menu-btns .btn { padding: 15px 20px; font-size: 15px; letter-spacing: .12em; }
.menu-btns .btn.primary { font-size: 17px; padding: 18px 20px; }
.menu-save { margin-top: 18px; font-size: 13px; color: var(--muted); min-height: 1.2em; animation: fadeUp 1s .5s var(--ease) both; }
.menu-foot { margin-top: 24px; display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--dim); animation: fadeUp 1s .6s var(--ease) both; }
.menu-foot a { color: var(--muted); text-decoration: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.03); transition: border-color .2s, color .2s; }
.menu-foot a:hover { color: var(--cyan); border-color: var(--cyan); }
@keyframes logoIn { from { opacity: 0; transform: translateY(-20px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes spinSlow { to { transform: rotate(360deg); } }

/* =========================================================
   HUD – TOPBAR
   ========================================================= */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: 10px; left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); height: var(--top-h); display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
.tb-brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 0 4px; font-weight: 900; letter-spacing: .14em; font-size: 15px; }
.tb-brand svg { width: 34px; height: 34px; filter: drop-shadow(0 0 8px rgba(54,226,255,.5)); }
.tb-brand span { background: linear-gradient(100deg, #fff, #36e2ff 60%, #ff4fd8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tb-sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }
.tb-level { display: flex; flex-direction: column; gap: 5px; min-width: 150px; }
.tb-level .lvl { display: flex; align-items: baseline; gap: 8px; font-size: 11px; font-weight: 900; letter-spacing: .16em; color: var(--muted); }
.tb-level .lvl b { font-size: 19px; color: var(--text); letter-spacing: .02em; }
.tb-level .lvl em { font-style: normal; margin-left: auto; color: var(--violet); font-size: 10.5px; }
.xpbar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #7b5cff, #ff4fd8); box-shadow: 0 0 12px rgba(255,79,216,.6); transition: width .5s var(--ease); }
.tb-coins { display: flex; flex-direction: column; align-items: flex-start; padding: 0 10px; min-width: 120px; }
.tb-coins .c { display: flex; align-items: center; gap: 7px; font-size: 20px; font-weight: 900; color: var(--gold); text-shadow: 0 0 14px rgba(255,210,63,.35); }
.tb-coins .c .gc { width: 20px; height: 20px; }
.tb-coins small { font-size: 11px; font-weight: 800; color: var(--green); letter-spacing: .04em; }
.tb-mission { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 12px; background: linear-gradient(90deg, rgba(54,226,255,.10), rgba(255,79,216,.06)); border: 1px solid rgba(54,226,255,.22); text-align: left; transition: border-color .2s, box-shadow .2s; max-width: 460px; }
.tb-mission:hover { border-color: var(--cyan); box-shadow: var(--glow-c); }
.tb-mission canvas { width: 44px; height: 44px; flex: none; border-radius: 10px; background: rgba(0,0,0,.35); }
.tb-mission .mi { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tb-mission small { font-size: 10px; font-weight: 900; letter-spacing: .16em; color: var(--cyan); }
.tb-mission .mt { font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.mbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--green)); box-shadow: 0 0 10px rgba(54,226,255,.6); transition: width .3s; }
.tb-mission .mc { font-size: 11px; font-weight: 800; color: var(--muted); font-family: var(--mono); }
.tb-btns { display: flex; gap: 6px; margin-left: auto; }
.ibtn { position: relative; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; background: rgba(255,255,255,.04); border: 1px solid var(--line); transition: border-color .2s, background .2s, transform .15s, box-shadow .2s; }
.ibtn:hover { border-color: var(--cyan); background: rgba(54,226,255,.08); box-shadow: var(--glow-c); }
.ibtn:active { transform: scale(.95); }
.ibtn.on { border-color: var(--cyan); background: rgba(54,226,255,.16); box-shadow: var(--glow-c); }
.ibtn .dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--magenta); box-shadow: 0 0 8px var(--magenta); }

/* =========================================================
   HUD – BUILD MENU (left)
   ========================================================= */
#buildbar { position: absolute; left: calc(10px + var(--safe-l)); top: calc(var(--top-h) + 22px); bottom: 74px; width: 206px; display: flex; flex-direction: column; padding: 10px; }
.bb-title { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; font-size: 11px; font-weight: 900; letter-spacing: .22em; color: var(--muted); }
#build-list { display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; }
.bitem { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border-radius: 12px; border: 1px solid transparent; text-align: left; transition: background .15s, border-color .15s, transform .15s; }
.bitem:hover:not(.locked) { background: rgba(255,255,255,.05); border-color: var(--line); transform: translateX(2px); }
.bitem.sel { background: linear-gradient(90deg, rgba(54,226,255,.18), rgba(54,226,255,.04)); border-color: rgba(54,226,255,.55); box-shadow: inset 3px 0 0 var(--cyan); }
.bitem canvas { width: 36px; height: 36px; flex: none; }
.bitem .bn { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bitem .bn b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bitem .bn small { font-size: 11px; color: var(--gold); font-weight: 800; }
.bitem .key { font-family: var(--mono); font-size: 10.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; }
.bitem.locked { opacity: .38; cursor: default; }
.bitem.locked .bn small { color: var(--muted); }
.bitem.new::after { content: "NY"; position: absolute; top: 4px; right: 6px; font-size: 9px; font-weight: 900; letter-spacing: .1em; color: #fff; background: var(--magenta); padding: 1px 6px; border-radius: 99px; box-shadow: 0 0 10px var(--magenta); }

/* =========================================================
   HUD – TOOLBAR (bottom)
   ========================================================= */
#toolbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--safe-b)); display: flex; align-items: center; gap: 6px; padding: 7px; }
#toolbar .ibtn { width: 46px; height: 46px; font-size: 18px; }
#toolbar .tsep { width: 1px; height: 30px; background: var(--line); margin: 0 3px; }
#toolbar .rot-ind { font-size: 11px; font-weight: 900; color: var(--muted); width: 34px; text-align: center; font-family: var(--mono); }
#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(76px + var(--safe-b)); padding: 7px 14px; font-size: 12.5px; color: var(--muted); border-radius: 999px; background: rgba(7,10,20,.72); border: 1px solid var(--line); white-space: nowrap; pointer-events: none; transition: opacity .3s; }
#hint b { color: var(--text); }

/* =========================================================
   HUD – INFO PANEL (right)
   ========================================================= */
#infopanel { position: absolute; right: calc(10px + var(--safe-r)); top: calc(var(--top-h) + 22px); width: 280px; max-height: calc(100% - var(--top-h) - 110px); padding: 14px; display: flex; flex-direction: column; gap: 12px; animation: slideIn .3s var(--ease); }
@keyframes slideIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
.ip-head { display: flex; align-items: center; gap: 12px; }
.ip-head canvas { width: 52px; height: 52px; flex: none; border-radius: 12px; background: rgba(0,0,0,.3); }
.ip-head h3 { font-size: 17px; letter-spacing: .1em; }
.ip-head small { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.ip-head .x { margin-left: auto; width: 32px; height: 32px; border-radius: 10px; font-size: 16px; color: var(--muted); border: 1px solid var(--line); }
.ip-head .x:hover { color: var(--text); border-color: var(--cyan); }
.ip-status { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 900; letter-spacing: .14em; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.ip-status i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.st-working { color: var(--green); } .st-waiting { color: var(--gold); } .st-noinput { color: var(--red); } .st-off { color: #6b7391; } .st-idle { color: var(--cyan); }
.ip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ip-grid div { padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
.ip-grid small { display: block; font-size: 10px; font-weight: 900; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.ip-grid b { font-size: 15px; font-family: var(--mono); }
.ip-desc { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.ip-sec h4 { font-size: 10.5px; font-weight: 900; letter-spacing: .18em; color: var(--muted); margin-bottom: 7px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { display: grid; place-items: center; min-width: 40px; height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.04); font-size: 12px; font-weight: 800; transition: border-color .15s, background .15s, transform .15s; }
.opt canvas { width: 30px; height: 30px; }
.opt:hover { border-color: var(--line-2); transform: translateY(-1px); }
.opt.sel { border-color: var(--cyan); background: rgba(54,226,255,.15); box-shadow: var(--glow-c); }
.opt.sw { width: 34px; min-width: 34px; height: 34px; border-radius: 50%; padding: 0; }
.opt.sw.sel { box-shadow: 0 0 0 2px #fff inset, var(--glow-c); }
.ip-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ip-actions .wide { grid-column: 1 / -1; }
.ip-held { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.ip-held canvas { width: 34px; height: 34px; border-radius: 8px; background: rgba(0,0,0,.3); }

/* =========================================================
   TUTORIAL / TOASTS
   ========================================================= */
#tutorial { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(126px + var(--safe-b)); width: min(440px, calc(100% - 24px)); padding: 16px 18px; border-color: rgba(54,226,255,.35); box-shadow: var(--shadow), 0 0 30px rgba(54,226,255,.15); animation: fadeUp .4s var(--ease); }
#tutorial h4 { font-size: 11px; letter-spacing: .2em; color: var(--cyan); margin-bottom: 6px; }
#tutorial h3 { font-size: 17px; margin-bottom: 6px; }
#tutorial p { font-size: 13.5px; line-height: 1.5; color: var(--muted); }
#tutorial p b { color: var(--text); }
#tutorial .steps { display: flex; gap: 5px; margin-top: 12px; }
#tutorial .steps i { flex: 1; height: 4px; border-radius: 99px; background: rgba(255,255,255,.1); }
#tutorial .steps i.on { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
#tutorial .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
#toasts { position: absolute; top: calc(var(--top-h) + 22px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 30; }
.toast { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 12px; min-width: 240px; max-width: min(420px, 92vw); border-radius: 14px; background: rgba(13, 18, 36, .95); border: 1px solid var(--line-2); box-shadow: var(--shadow); animation: toastIn .4s var(--ease), toastOut .4s var(--ease) forwards; animation-delay: 0s, var(--life, 3.2s); }
.toast .ti { font-size: 24px; width: 34px; text-align: center; }
.toast b { display: block; font-size: 13.5px; }
.toast small { font-size: 12px; color: var(--muted); }
.toast.gold { border-color: rgba(255,210,63,.5); box-shadow: var(--shadow), 0 0 22px rgba(255,210,63,.2); }
.toast.cyan { border-color: rgba(54,226,255,.5); }
.toast.bad { border-color: rgba(255,77,109,.55); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

/* =========================================================
   MODALS
   ========================================================= */
#modal-back { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(3, 5, 12, .6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
#modal { width: min(720px, 100%); max-height: min(86vh, 860px); display: flex; flex-direction: column; overflow: hidden; animation: pop .35s var(--ease); }
#modal.wide { width: min(940px, 100%); }
#modal.narrow { width: min(460px, 100%); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
.m-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.m-head h2 { font-size: 16px; letter-spacing: .18em; }
.m-head .x { margin-left: auto; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); font-size: 18px; }
.m-head .x:hover { color: var(--text); border-color: var(--cyan); }
.m-body { padding: 18px; overflow-y: auto; }
.m-body p { color: var(--muted); line-height: 1.55; font-size: 14px; }
.m-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--line); }
.m-sec { margin-top: 18px; }
.m-sec:first-child { margin-top: 0; }
.m-sec > h3 { font-size: 11px; font-weight: 900; letter-spacing: .2em; color: var(--muted); margin-bottom: 10px; }

/* upgrades */
.upg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.upg { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: linear-gradient(160deg, rgba(54,226,255,.07), rgba(255,255,255,.02)); border: 1px solid var(--line); }

/* achievements */

.ach .ai { width: 44px; height: 44px; flex: none; display: grid; place-items: center; font-size: 22px; border-radius: 12px; background: rgba(255,255,255,.05); filter: grayscale(1) opacity(.45); }
.ach.done { border-color: rgba(255,210,63,.4); background: linear-gradient(160deg, rgba(255,210,63,.09), rgba(255,255,255,.02)); }

.mission-card canvas { width: 96px; height: 96px; flex: none; border-radius: 14px; background: rgba(0,0,0,.35); }
.mission-card .mb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.mission-card .mbar { height: 9px; }
.mission-card .rw { display: flex; flex-wrap: wrap; gap: 6px; }
.orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.order { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
.order .oh { display: flex; gap: 10px; align-items: center; }
.order canvas { width: 54px; height: 54px; border-radius: 10px; background: rgba(0,0,0,.3); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

<script>
'use strict';
/* =====================================================================
   GREJSFIGUR
   Sektioner:  UTIL · SHAPES · MACHINES · FACTORY · PROGRESSION (missions,
   upgrades, achievements) · SAVE SYSTEM · AUDIO · CAMERA · RENDERING ·
   INPUT · UI · GAME
   ===================================================================== */

// =========================
// UTIL
// =========================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];
const opp = (d) => (d + 2) & 3;
const DIR_ARROW = ['▲', '▶', '▼', '◀'];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => performance.now() / 1000;

/** Danish number formatting: 12.450 · 1,25 mio. */
function fmt(n) {
  n = Math.floor(n || 0);
  const a = Math.abs(n);
  if (a >= 1e12) return (n / 1e12).toFixed(2).replace('.', ',') + ' bio.';
  if (a >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' mia.';
  if (a >= 1e6) return (n / 1e6).toFixed(2).replace('.', ',') + ' mio.';
  return n.toLocaleString('da-DK');
}
function fmtDec(n, d = 1) {
  return (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('da-DK', { maximumFractionDigits: d });
}
function fmtDuration(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h) return `${h} t ${m} min`;
  if (m) return `${m} min ${s ? s + ' sek' : ''}`.trim();
  return `${s} sek`;
}
function fmtClock(t) {
  const d = new Date(t);
  return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}
/** small deterministic RNG (mulberry32) */
function makeRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];

// =========================
// SHAPES
// =========================
/*
  En figur ("Shape") består af 1–3 lag. Hvert lag har 4 kvadranter i
  rækkefølgen: 0 = øverst-højre, 1 = nederst-højre, 2 = nederst-venstre,
  3 = øverst-venstre. En del skrives som to tegn: form + farve, fx "Cr"
  (rød cirkel). Tom kvadrant = "--". Lag adskilles med ":".
  Eksempel:  "CrCr----:SbSbSbSb"  = højre halvdel rød cirkel, med en blå
  firkant ovenpå.
  Nye former tilføjes ved at lave en ny post i SHAPE_TYPES med en path().
*/
const SHAPE_TYPES = {
  C: {
    name: 'Cirkel', plural: 'cirkler', bonus: 0,
    path(ctx, R) { ctx.moveTo(0, 0); ctx.arc(0, 0, R, -Math.PI / 2, 0); ctx.closePath(); }
  },
  S: {
    name: 'Firkant', plural: 'firkanter', bonus: 0,
    path(ctx, R) { const a = R * 0.86; ctx.moveTo(0, 0); ctx.lineTo(0, -a); ctx.lineTo(a, -a); ctx.lineTo(a, 0); ctx.closePath(); }
  },
  T: {
    name: 'Trekant', plural: 'trekanter', bonus: 0.1,
    path(ctx, R) { const a = R * 0.94; ctx.moveTo(0, 0); ctx.lineTo(0, -a); ctx.lineTo(a, -a * 0.12); ctx.closePath(); }
  },
  D: {
    name: 'Diamant', plural: 'diamanter', bonus: 0.2,
    path(ctx, R) { ctx.moveTo(0, 0); ctx.lineTo(0, -R); ctx.lineTo(R * 0.72, -R * 0.28); ctx.lineTo(R * 0.72, 0); ctx.closePath(); }
  },
  H: {
    name: 'Hexagon', plural: 'hexagoner', bonus: 0.3,
    path(ctx, R) { ctx.moveTo(0, 0); ctx.lineTo(0, -R * 0.9); ctx.lineTo(R * 0.52, -R * 0.9); ctx.lineTo(R * 0.98, -R * 0.12); ctx.lineTo(R * 0.98, 0); ctx.closePath(); }
  }
};
const SHAPE_ORDER = ['C', 'S', 'T', 'D', 'H'];
const COLORS = {
  u: { name: 'Grå', adj: 'Grå', hex: '#a3acc4' },
  r: { name: 'Rød', adj: 'Rød', hex: '#ff4d6d' },
  g: { name: 'Grøn', adj: 'Grøn', hex: '#3ddc84' },
  b: { name: 'Blå', adj: 'Blå', hex: '#3d8bff' },
  y: { name: 'Gul', adj: 'Gul', hex: '#ffd23f' },
  p: { name: 'Lilla', adj: 'Lilla', hex: '#b26bff' },
  c: { name: 'Cyan', adj: 'Cyan', hex: '#2ee6e6' },
  w: { name: 'Hvid', adj: 'Hvid', hex: '#f4f6ff' }
};
const COLOR_ORDER = ['r', 'g', 'b', 'y', 'p', 'c', 'w'];
const MAX_LAYERS = 3;
const SHAPE_CACHE = new Map();

class Shape {
  constructor(key) {
    this.key = key;
    this.layers = key.split(':').map((l) => [0, 1, 2, 3].map((i) => {
      const p = l.substr(i * 2, 2);
      return p === '--' ? null : p;
    }));
    this._value = null;
  }
  /** interned figure (same key → same object) */
  static get(key) {
    let s = SHAPE_CACHE.get(key);
    if (!s) {
      s = new Shape(key);
      SHAPE_CACHE.set(key, s);
    }
    return s;
  }
  static fromLayers(layers) {
    const ls = layers.filter((l) => l.some(Boolean));
    if (!ls.length) return null;
    return Shape.get(ls.map((l) => l.map((p) => p || '--').join('')).join(':'));
  }
  static full(shape, color = 'u') {
    const p = shape + color;
    return Shape.get(p + p + p + p);
  }
  static valid(key) {
    return /^((?:[CSTDH][urgbypcw]|--){4})(:(?:[CSTDH][urgbypcw]|--){4}){0,2}$/.test(key);
  }
  map(fn) { return Shape.fromLayers(this.layers.map((l) => l.map((p) => (p ? fn(p) : null)))); }
  /** 90° med uret (eller mod uret) */
  rotate(ccw) {
    return Shape.fromLayers(this.layers.map((l) => (ccw ? [l[1], l[2], l[3], l[0]] : [l[3], l[0], l[1], l[2]])));
  }
  /** [venstre halvdel, højre halvdel] */
  cut() {
    return [
      Shape.fromLayers(this.layers.map((l) => [null, null, l[2], l[3]])),
      Shape.fromLayers(this.layers.map((l) => [l[0], l[1], null, null]))
    ];
  }
  paint(c) { return this.map((p) => p[0] + c); }
  morph(s) { return this.map((p) => s + p[1]); }
  mirror() { return Shape.fromLayers(this.layers.map((l) => [l[3], l[2], l[1], l[0]])); }
  /** kombinér: passer delene sammen (1 lag hver, ingen overlap) smeltes de, ellers lægges top ovenpå */
  merge(top) {
    if (this.layers.length === 1 && top.layers.length === 1) {
      const a = this.layers[0], b = top.layers[0];
      if (a.every((p, i) => !(p && b[i]))) return Shape.fromLayers([a.map((p, i) => p || b[i])]);
    }
    return Shape.fromLayers(this.layers.concat(top.layers).slice(0, MAX_LAYERS));
  }
  /** [figur uden øverste lag, øverste lag] */
  unstack() {
    if (this.layers.length < 2) return [this, null];
    return [Shape.fromLayers(this.layers.slice(0, -1)), Shape.fromLayers([this.layers[this.layers.length - 1]])];
  }
  get parts() { return this.layers.reduce((n, l) => n + l.filter(Boolean).length, 0); }
  /** værdi i GrejsCoins (før upgrades) */
  get value() {
    if (this._value !== null) return this._value;
    let v = 0;
    for (const l of this.layers) for (const p of l) if (p) v += 0.25 + (p[1] !== 'u' ? 0.25 : 0) + SHAPE_TYPES[p[0]].bonus;
    const lm = [1, 1.7, 2.6][this.layers.length - 1];
    this._value = Math.max(1, Math.round(v * lm * 10) / 10);
    return this._value;
  }
  allMatch(fn) { return this.layers.every((l) => l.every((p) => !p || fn(p))); }
  hasColor() { return this.layers.some((l) => l.some((p) => p && p[1] !== 'u')); }
  colorSet() { const s = new Set(); for (const l of this.layers) for (const p of l) if (p && p[1] !== 'u') s.add(p[1]); return s; }
  hasShape(t) { return this.layers.some((l) => l.some((p) => p && p[0] === t)); }
  /** dansk beskrivelse, fx "Rød cirkel" eller "Blå firkant (højre halvdel)" */
  describe() {
    if (this.layers.length > 1) return `${this.layers.length}-lags figur`;
    const l = this.layers[0];
    const ps = l.filter(Boolean);
    const occ = l.map(Boolean).join('');
    const half = { 'truetruefalsefalse': 'højre halvdel', 'falsefalsetruetrue': 'venstre halvdel', 'truefalsefalsetrue': 'øverste halvdel', 'falsetruetruefalse': 'nederste halvdel' }[occ];
    const same = ps.every((p) => p === ps[0]);
    if (same) {
      const st = SHAPE_TYPES[ps[0][0]], c = COLORS[ps[0][1]];
      const base = (c.adj + ' ' + st.name.toLowerCase());
      if (ps.length === 4) return base;
      if (half) return `${base} (${half})`;
      return `${base}stykke`;
    }
    const sameShape = ps.every((p) => p[0] === ps[0][0]);
    if (sameShape && ps.length === 4) return 'Tofarvet ' + SHAPE_TYPES[ps[0][0]].name.toLowerCase();
    return 'Sammensat figur';
  }
}

/* ---- figur-tegning (cachet til offscreen canvas pr. nøgle & størrelse) ---- */
const FIG_SPRITES = new Map();
function drawShapeRaw(ctx, shape, cx, cy, R, glow) {
  const n = shape.layers.length;
  for (let li = 0; li < n; li++) {
    const layer = shape.layers[li];
    const r = R * (1 - li * 0.25);
    for (let q = 0; q < 4; q++) {
      const p = layer[q];
      if (!p) continue;
      const col = COLORS[p[1]].hex;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((q * Math.PI) / 2);
      ctx.beginPath();
      SHAPE_TYPES[p[0]].path(ctx, r);
      const g = ctx.createLinearGradient(0, -r, r, 0);
      g.addColorStop(0, shade(col, 0.28));
      g.addColorStop(1, shade(col, -0.18));
      ctx.fillStyle = g;
      if (glow) { ctx.shadowColor = col; ctx.shadowBlur = R * 0.35; }
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = Math.max(1, R * 0.075);
      ctx.strokeStyle = 'rgba(6,9,20,0.9)';
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.restore();
    }
  }
}
function figureSprite(shape, px) {
  const k = shape.key + '|' + px;
  let c = FIG_SPRITES.get(k);
  if (c) return c;
  if (FIG_SPRITES.size > 1500) FIG_SPRITES.clear();
  c = document.createElement('canvas');
  c.width = c.height = px;
  const ctx = c.getContext('2d');
  drawShapeRaw(ctx, shape, px / 2, px / 2, px * 0.4, true);
  FIG_SPRITES.set(k, c);
  return c;
}
/** tegn figur centreret i (x,y) med diameter size (skærm-px) */
function drawShape(ctx, shape, x, y, size) {
  const px = size <= 22 ? 32 : size <= 46 ? 64 : size <= 96 ? 128 : 256;
  ctx.drawImage(figureSprite(shape, px), x - size / 2, y - size / 2, size, size);
}
/** tegn figur i et lille DOM-canvas (ikoner i UI) */
function paintShapeCanvas(cv, shape) {
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (shape) drawShapeRaw(ctx, shape, cv.width / 2, cv.height / 2, cv.width * 0.38, true);
}
/** lysere (+) / mørkere (−) hex-farve */
const SHADE_CACHE = new Map();
function shade(hex, amt) {
  const k = hex + amt;
  if (SHADE_CACHE.has(k)) return SHADE_CACHE.get(k);
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  const out = `rgb(${r | 0},${g | 0},${b | 0})`;
  SHADE_CACHE.set(k, out);
  return out;
}

const BUILD_ORDER = ['conveyor', 'generator', 'output', 'trash', 'splitter', 'crossing', 'cutter', 'merger', 'painter', 'sorter', 'rotator', 'storage', 'mirror', 'unstacker', 'morpher'];
const MAX_MACHINE_LVL = 3;
const SPACING = 0.5; // min afstand mellem figurer på et bånd (i felter)

class Building {
  constructor(factory, type, x, y, r, cfg) {
    this.f = factory;
    this.type = type;
    this.def = MACHINES[type];
    this.x = x;
    this.y = y;
    this.r = r || 0;
    this.cfg = Object.assign({}, this.def.cfg || {}, cfg || {});
    this.lvl = 1;
    this.inv = this.def.cost; // samlet investeret (refunderes ved fjernelse)
    this.off = false;
    this.status = 'idle';
    this.util = 0;
    this.anim = 0;
  }
  serialize() {
    const o = { t: this.type, x: this.x, y: this.y, r: this.r };
    if (this.def.cfg) o.c = this.cfg;
    if (this.lvl > 1) o.l = this.lvl;
    if (this.off) o.o = 1;
    if (this.inv !== this.def.cost) o.i = this.inv;
    return o;
  }
  /** verdensretning for en relativ side */
  dirOf(side) {
    return side === 'front' ? this.r : side === 'back' ? opp(this.r) : side === 'left' ? (this.r + 3) & 3 : side === 'right' ? (this.r + 1) & 3 : -1;
  }
  /** relativ side for en verdensretning */
  sideOf(dir) {
    return ['front', 'right', 'back', 'left'][(dir - this.r + 4) & 3];
  }
  neighbor(dir) { return this.f.get(this.x + DX[dir], this.y + DY[dir]); }
  /** send figur ud i retning dir – true hvis modtageren tog den */
  push(shape, dir) {
    const n = this.neighbor(dir);
    return n ? n.accept(shape, opp(dir)) : false;
  }
  /** kan bygningen sende noget ud i verdensretning dir? (bruges til at tegne båndkurver) */
  outputsTo(dir) {
    const outs = this.def.outputs;
    return !!outs && outs.some((s) => this.dirOf(s) === dir);
  }
  accept() { return false; }
  update() {}
  speedMult() { return (1 + 0.5 * (this.lvl - 1)) * this.f.game.upg.machineMult(); }
  get statusLabel() { return STATUS_LABEL[this.status] || 'KLAR'; }
  heldShapes() { return []; }
}
const STATUS_LABEL = { working: 'ARBEJDER', waiting: 'VENTER – OUTPUT BLOKERET', noinput: 'MANGLER INPUT', off: 'SLUKKET', idle: 'KLAR' };

/* ---------- Transportbånd ---------- */
class Conveyor extends Building {
  constructor(...a) {
    super(...a);
    this.items = []; // [{s: Shape, p: 0..1, from: dir}] sorteret med laveste p først
    this.vis = -1; // indgangsside til tegning (-1 = lige)
    this.moving = false;
  }
  accept(shape, fromDir) {
    if (this.off) return false;
    if (fromDir === this.r) return false; // kan ikke komme ind fra fronten
    const it = this.items;
    if (it.length && it[0].p < SPACING) return false;
    if (it.length >= 3) return false;
    it.unshift({ s: shape, p: 0, from: fromDir });
    return true;
  }
  outputsTo(dir) { return dir === this.r; }
  update(dt, speed) {
    const it = this.items;
    this.moving = false;
    if (!it.length) { this.status = 'idle'; return; }
    if (this.off) { this.status = 'off'; return; }
    const sp = speed * dt;
    for (let i = it.length - 1; i >= 0; i--) {
      const item = it[i];
      const limit = i === it.length - 1 ? 1 : it[i + 1].p - SPACING;
      const np = Math.min(item.p + sp, limit);
      if (np > item.p) { item.p = np; this.moving = true; }
      if (i === it.length - 1 && item.p >= 1) {
        if (this.push(item.s, this.r)) { it.pop(); this.moving = true; }
        else item.p = 1;
      }
    }
    this.status = this.moving ? 'working' : 'waiting';
  }
  heldShapes() { return this.items.map((i) => i.s); }
}

/* ---------- Generisk maskine med input-/output-buffere ---------- */
class Machine extends Building {
  constructor(...a) {
    super(...a);
    const d = this.def;
    this.inBuf = (d.inputs || []).map(() => null);
    this.outBuf = (d.outputs || []).map(() => null);
    this.job = null; // resultater der er ved at blive lavet
    this.timer = 0;
    this.jobDur = 1;
  }
  accept(shape, fromDir) {
    if (this.off) return false;
    const idx = (this.def.inputs || []).indexOf(this.sideOf(fromDir));
    if (idx < 0 || this.inBuf[idx]) return false;
    this.inBuf[idx] = shape;
    return true;
  }
  duration() { return this.def.duration / this.speedMult(); }
  ready() { return this.inBuf.every(Boolean); }
  /** returnerer array med et resultat pr. output (null = intet) */
  process() { return [this.inBuf[0]]; }
  flush() {
    let pending = false;
    for (let k = 0; k < this.outBuf.length; k++) {
      const s = this.outBuf[k];
      if (!s) continue;
      if (this.push(s, this.dirOf(this.def.outputs[k]))) this.outBuf[k] = null;
      else pending = true;
    }
    return pending;
  }
  update(dt) {
    if (this.off) { this.status = 'off'; this.util += (0 - this.util) * Math.min(1, dt * 0.4); return; }
    this.flush();
    if (this.job) {
      if (this.timer > 0) this.timer -= dt;
      if (this.timer <= 0) {
        const res = this.job;
        if (res.every((s, k) => !s || !this.outBuf[k])) {
          res.forEach((s, k) => { if (s) this.outBuf[k] = s; });
          this.job = null;
          this.onDone(res);
          this.flush();
        }
      }
    }
    if (!this.job && this.ready() && this.outBuf.every((s) => !s)) {
      this.job = this.process();
      this.inBuf.fill(null);
      this.jobDur = this.duration();
      this.timer = this.jobDur;
    }
    if (this.job) this.status = this.timer > 0 ? 'working' : 'waiting';
    else this.status = this.outBuf.some(Boolean) ? 'waiting' : 'noinput';
    this.util += ((this.status === 'working' ? 1 : 0) - this.util) * Math.min(1, dt * 0.4);
    if (this.status === 'working') this.anim += dt * this.speedMult();
  }
  onDone() {}
  get progress() { return this.job ? clamp(1 - this.timer / this.jobDur, 0, 1) : 0; }
  heldShapes() { return [...this.inBuf, ...(this.job || []), ...this.outBuf].filter(Boolean); }
}

class Generator extends Machine {
  ready() { return true; }
  duration() { return this.def.duration / (this.speedMult() * this.f.game.upg.genMult()); }
  speedMult() { return 1 + 0.5 * (this.lvl - 1); }
  process() { return [Shape.full(this.cfg.shape || 'C')]; }
  onDone() { this.f.game.stats.generated++; this.f.game.rate.gen++; }
}
class Cutter extends Machine {
  process() { return this.inBuf[0].cut(); }
}
class Rotator extends Machine {
  process() { return [this.inBuf[0].rotate(this.cfg.ccw)]; }
}
class Painter extends Machine {
  process() { return [this.inBuf[0].paint(this.cfg.color || 'r')]; }
}
class Mirror extends Machine {
  process() { return [this.inBuf[0].mirror()]; }
}
class Morpher extends Machine {
  process() { return [this.inBuf[0].morph(this.cfg.shape || 'H')]; }
}
class Unstacker extends Machine {
  process() { return this.inBuf[0].unstack(); }
}
class Merger extends Machine {
  process() { return [this.inBuf[0].merge(this.inBuf[1])]; }
}
class Sorter extends Machine {
  matches(s) {
    const c = this.cfg;
    return c.mode === 'color' ? s.allMatch((p) => p[1] === c.v) : s.allMatch((p) => p[0] === c.v);
  }
  process() {
    const s = this.inBuf[0];
    return this.matches(s) ? [s, null] : [null, s];
  }
}
class Splitter extends Machine {
  constructor(...a) { super(...a); this.rr = 0; }
  process() { return [this.inBuf[0], null, null]; }
  /** én figur – prøv udgangene på skift (round-robin) */
  flush() {
    const s = this.outBuf[0];
    if (!s) return false;
    const outs = this.def.outputs;
    for (let k = 0; k < 3; k++) {
      const i = (this.rr + k) % 3;
      if (this.push(s, this.dirOf(outs[i]))) {
        this.outBuf[0] = null;
        this.rr = (i + 1) % 3;
        return false;
      }
    }
    return true;
  }
}
class Storage extends Machine {
  constructor(...a) { super(...a); this.store = []; }
  capacity() { return this.f.game.upg.storageCap() * (1 + (this.lvl - 1)); }
  update(dt) {
    if (this.off) { this.status = 'off'; return; }
    if (this.inBuf[0] && this.store.length < this.capacity()) { this.store.push(this.inBuf[0]); this.inBuf[0] = null; }
    if (!this.outBuf[0] && this.store.length) this.outBuf[0] = this.store.shift();
    const pending = this.flush();
    this.status = pending ? 'waiting' : this.store.length || this.outBuf[0] ? 'working' : 'noinput';
    this.util += ((this.store.length / this.capacity()) - this.util) * Math.min(1, dt);
  }
  heldShapes() { return this.store.slice(0, 6); }
}
/* Krydsning: to uafhængige baner (vandret + lodret), figurer fortsætter lige ud */
class Crossing extends Building {
  constructor(...a) { super(...a); this.slots = [null, null]; this.dirs = [0, 0]; }
  accept(shape, fromDir) {
    if (this.off) return false;
    const axis = fromDir & 1; // 0 = lodret, 1 = vandret
    if (this.slots[axis]) return false;
    this.slots[axis] = shape;
    this.dirs[axis] = opp(fromDir);
    return true;
  }
  outputsTo() { return true; }
  update() {
    let any = false, blocked = false;
    for (let a = 0; a < 2; a++) {
      if (!this.slots[a]) continue;
      any = true;
      if (this.push(this.slots[a], this.dirs[a])) this.slots[a] = null;
      else blocked = true;
    }
    this.status = this.off ? 'off' : blocked ? 'waiting' : any ? 'working' : 'idle';
  }
  heldShapes() { return this.slots.filter(Boolean); }
}
/* Levering: sælger figurer */
class Output extends Building {
  constructor(...a) { super(...a); this.flash = 0; this.pop = 0; this.popCoins = 0; this.last = null; }
  accept(shape) {
    if (this.off) return false;
    this.f.game.deliver(shape, this);
    this.flash = 1;
    this.last = shape;
    return true;
  }
  update(dt) {
    this.flash = Math.max(0, this.flash - dt * 2);
    this.status = this.off ? 'off' : this.flash > 0 ? 'working' : 'idle';
    this.pop -= dt;
    if (this.pop <= 0 && this.popCoins > 0) {
      this.f.game.renderer.popup(this.x, this.y, '+' + fmt(this.popCoins), '#ffd23f');
      this.popCoins = 0;
      this.pop = 0.9;
    }
  }
}
class Trash extends Building {
  constructor(...a) { super(...a); this.flash = 0; }
  accept() {
    if (this.off) return false;
    this.flash = 1;
    this.f.game.stats.trashed++;
    return true;
  }
  update(dt) {
    this.flash = Math.max(0, this.flash - dt * 2.5);
    this.status = this.off ? 'off' : this.flash > 0 ? 'working' : 'idle';
  }
}
const MACHINE_CLASS = {
  conveyor: Conveyor, generator: Generator, output: Output, trash: Trash, splitter: Splitter, crossing: Crossing,
  cutter: Cutter, merger: Merger, painter: Painter, sorter: Sorter, rotator: Rotator, storage: Storage,
  mirror: Mirror, unstacker: Unstacker, morpher: Morpher
};

// =========================
// FACTORY
// =========================
const WORLD = 200; // byggepladsen går fra -WORLD til +WORLD i begge retninger
class Factory {
  constructor(game) {
    this.game = game;
    this.map = new Map();
    this.belts = [];
    this.machines = [];
    this.dirty = true;
  }
  static key(x, y) { return (x + 512) * 1024 + (y + 512); }
  get(x, y) { return this.map.get(Factory.key(x, y)); }
  inBounds(x, y) { return x >= -WORLD && x <= WORLD && y >= -WORLD && y <= WORLD; }
  get count() { return this.map.size; }
  clear() {
    this.map.clear();
    this.belts = [];
    this.machines = [];
    this.dirty = true;
  }
  /** opret bygning fra gemte data (uden at trække coins) */
  create(data) {
    const C = MACHINE_CLASS[data.t];
    if (!C || !this.inBounds(data.x, data.y)) return null;
    const b = new C(this, data.t, data.x, data.y, data.r || 0, data.c);
    if (data.l) b.lvl = clamp(data.l | 0, 1, MAX_MACHINE_LVL);
    if (data.o) b.off = true;
    if (typeof data.i === 'number') b.inv = data.i;
    this.add(b);
    return b;
  }
  add(b) {
    const k = Factory.key(b.x, b.y);
    const old = this.map.get(k);
    if (old) this.remove(old.x, old.y);
    this.map.set(k, b);
    (b instanceof Conveyor ? this.belts : this.machines).push(b);
    this.markDirty(b.x, b.y);
  }
  remove(x, y) {
    const k = Factory.key(x, y);
    const b = this.map.get(k);
    if (!b) return null;
    this.map.delete(k);
    const arr = b instanceof Conveyor ? this.belts : this.machines;
    const i = arr.indexOf(b);
    if (i >= 0) arr.splice(i, 1);
    this.markDirty(x, y);
    return b;
  }
  markDirty() { this.dirty = true; }
  /** beregn båndkurver: hvilken side bliver båndet fodret fra? */
  refreshVis() {
    if (!this.dirty) return;
    this.dirty = false;
    for (const b of this.belts) {
      const back = opp(b.r);
      const feeds = (d) => {
        const n = b.neighbor(d);
        return n && n.outputsTo(opp(d)) && !(n instanceof Crossing);
      };
      const nb = b.neighbor(back);
      if (nb && feeds(back)) { b.vis = -1; continue; }
      const l = (b.r + 3) & 3, r = (b.r + 1) & 3;
      const fl = feeds(l), fr = feeds(r);
      b.vis = fl && !fr ? l : fr && !fl ? r : -1;
    }
  }
  update(dt) {
    const speed = this.game.upg.beltSpeed();
    const ms = this.machines;
    for (let i = 0; i < ms.length; i++) ms[i].update(dt);
    const bs = this.belts;
    for (let i = 0; i < bs.length; i++) bs[i].update(dt, speed);
  }
  serialize() {
    const out = [];
    for (const b of this.map.values()) {
      const o = b.serialize();
      if (b instanceof Conveyor && b.items.length) o.it = b.items.map((i) => [i.s.key, Math.round(i.p * 100) / 100, i.from]);
      out.push(o);
    }
    return out;
  }
  load(list) {
    this.clear();
    for (const d of list || []) {
      const b = this.create(d);
      if (b instanceof Conveyor && Array.isArray(d.it)) {
        for (const [k, p, from] of d.it) if (Shape.valid(k)) b.items.push({ s: Shape.get(k), p: clamp(+p || 0, 0, 1), from: from | 0 });
        b.items.sort((a, c) => a.p - c.p);
      }
    }
  }
}

<script>
'use strict';
// =========================
// MISSIONS (levels + ordrer)
// =========================
const START_UNLOCKS = ['conveyor', 'generator', 'output', 'shape:C', 'shape:S'];
/* Håndlavede levels. "unlock" gives når levelet er fuldført (dvs. bruges i næste level). */
const LEVELS = [
  { goal: 'CuCuCuCu', n: 20, unlock: ['trash', 'shape:T'], coins: 150,
    tip: 'Byg en Generator, før et transportbånd hen til en Levering, og lever 20 grå cirkler.' },

  { goal: '----CuCu', n: 80, unlock: ['merger'], coins: 500,
    tip: 'Cutteren deler figuren. Venstre halvdel kommer ud foran. Send højre halvdel til en Destruktor.' },

    tip: 'Mal halvdelene hver for sig, og kombinér dem bagefter i en Merger.' },
  { goal: 'Cb----Cb', n: 150, unlock: ['storage', 'shape:D', 'color:y', 'color:p'], coins: 1500,
    tip: 'Skær en cirkel, drej venstre halvdel 90° med uret, så den bliver til øverste halvdel – og mal den blå.' },
  { goal: 'DyDyDpDp', n: 200, unlock: ['mirror'], coins: 2000,
    tip: 'Diamanter er nu låst op i generatoren. To halvdele i hver sin farve.' },

    tip: 'Når to hele figurer kombineres, lægges toppen ovenpå som et nyt lag.' },

    tip: 'Bunden er en halv lilla trekant, toppen en hel blå firkant.' },
  { goal: 'HcHcHcHc:DwDw----', n: 250, unlock: [], coins: 4000,
    tip: 'Hexagoner laves med Morpheren. Byg dem ud fra en hvilken som helst form.' }
];
const ORDERS_FROM_LEVEL = 3;

/** procedurelt level efter de håndlavede (uendelig progression) */
function generatedLevel(n, unlocked) {
  const rng = makeRng(n * 7919 + 13);
  const shapes = SHAPE_ORDER.filter((s) => unlocked.has('shape:' + s));
  const colors = COLOR_ORDER.filter((c) => unlocked.has('color:' + c));
  const pc = () => (rng() < 0.85 ? pick(rng, colors) : 'u');
  const maxL = n < 16 ? 2 : 3;
  const nl = 1 + Math.floor(rng() * maxL);
  const layer = (full) => {
    const halves = rng() < 0.5 ? [[0, 1], [2, 3]] : [[0, 3], [1, 2]];
    const l = [null, null, null, null];
    const uniform = rng() < 0.35;
    const s0 = pick(rng, shapes), c0 = pc();
    halves.forEach((h, hi) => {
      if (!full && hi === 1 && rng() < 0.5) return;
      const s = uniform ? s0 : pick(rng, shapes), c = uniform ? c0 : pc();
      for (const q of h) l[q] = s + c;
    });
    return l;
  };
  const layers = [layer(true)];
  for (let i = 1; i < nl; i++) layers.push(layer(false));
  const goal = Shape.fromLayers(layers);
  const amount = Math.min(20000, Math.round((260 * Math.pow(1.12, n - 12)) / 10) * 10);
  return { goal: goal.key, n: amount, unlock: [], coins: Math.round((amount * goal.value * 3) / 10) * 10, tip: 'Brug alt, hvad du har lært. Del opgaven op i halvdele og lag.' };
}

/** tilfældig ordre-figur ud fra hvad der er låst op */
function randomOrderShape(game) {
  const u = game.unlocked;
  const shapes = SHAPE_ORDER.filter((s) => u.has('shape:' + s));
  const colors = ['u'].concat(COLOR_ORDER.filter((c) => u.has('color:' + c)));
  const canPaint = u.has('painter');
  const canHalf = u.has('cutter') && u.has('merger');
  const c = () => (canPaint ? colors[1 + Math.floor(Math.random() * (colors.length - 1))] || 'u' : 'u');
  const s = () => shapes[Math.floor(Math.random() * shapes.length)];
  if (!canHalf || Math.random() < 0.35) return Shape.full(s(), c());
  const a = s() + c(), b = s() + c();
  if (Math.random() < 0.5) return Shape.get(a + a + b + b);
  return Shape.get(a + b + b + a);
}

class MissionSystem {
  constructor(game) { this.g = game; }
  get st() { return this.g.state; }
  levelDef(n = this.st.level) {
    if (n <= LEVELS.length) return LEVELS[n - 1];
    return generatedLevel(n, this.g.unlocked);
  }
  get goal() { return Shape.get(this.levelDef().goal); }
  get required() { return this.levelDef().n; }
  get progress() { return this.st.progress; }
  /** kaldes for hver leveret figur */
  onDeliver(shape, count = 1) {
    const st = this.st;
    let changed = false;
    if (!st.levelDone && shape.key === this.levelDef().goal) {
      st.progress = Math.min(this.required, st.progress + count);
      changed = true;
      if (st.progress >= this.required) {
        st.levelDone = true;
        setTimeout(() => this.g.completeLevel(), 250);
      }
    }
    for (const o of st.orders) {
      if (o.done || o.key !== shape.key) continue;
      o.got = Math.min(o.n, o.got + count);
      changed = true;
      if (o.got >= o.n) {
        o.done = true;
        this.g.completeOrder(o);
      }
    }
    return changed;
  }
  /** fyld ordre-slots op */
  refillOrders() {
    const st = this.st;
    if (st.level < ORDERS_FROM_LEVEL) { st.orders = []; return; }
    st.orders = st.orders.filter((o) => !o.done);
    while (st.orders.length < 3) st.orders.push(this.newOrder());
  }
  newOrder() {
    let s, tries = 0;
    do { s = randomOrderShape(this.g); tries++; } while (tries < 20 && this.st.orders.some((o) => o.key === s.key));
    const lv = this.st.level;
    const n = Math.round((25 + lv * 9 + Math.random() * (20 + lv * 6)) / 5) * 5;
    return { key: s.key, n, got: 0, coins: Math.round(n * s.value * 2.5 + 40 + lv * 10), xp: Math.round(n * s.value * 0.6 + 10), done: false };
  }
  rerollOrder(i) {
    this.st.orders[i] = this.newOrder();
  }
}

// =========================
// SAVE SYSTEM
// =========================
const SAVE_KEY = 'grejsfigur_save_v1';
const SAVE_VERSION = 1;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

function defaultStats() {
  return {
    delivered: 0, generated: 0, trashed: 0, built: 0, beltsBuilt: 0, removed: 0, coinsEarned: 0,
    painted: 0, maxLayers: 0, hex: 0, ordersDone: 0, upgradesBought: 0, undoUsed: 0, pasted: 0, mk3: 0,
    automation: 0, afk: 0, bestMinute: 0, playTime: 0, keys: {}, colors: []
  };
}
function defaultState() {
  return {
    v: SAVE_VERSION, created: Date.now(), t: Date.now(),
    coins: 300, xp: 0, rank: 1, level: 1, progress: 0, levelDone: false,
    orders: [], unlocked: START_UNLOCKS.slice(), seenNew: [],
    upg: {}, ach: {}, ms: {}, tut: 0,
    settings: { sound: true, grid: true, fx: true, hints: true },
    cam: { x: 0, y: 0, z: 1 },
    rates: { coins: 0, shapes: 0, keys: {} },
    lastCfg: {},
    buildings: []
  };
}

class SaveSystem {
  constructor(game) { this.g = game; }
  exists() { return !!lsGet(SAVE_KEY); }
  peek() {
    try { return JSON.parse(lsGet(SAVE_KEY)); } catch (e) { return null; }
  }
  serialize() {
    const g = this.g;
    const st = g.state;
    st.t = Date.now();
    st.cam = { x: Math.round(g.camera.x), y: Math.round(g.camera.y), z: Math.round(g.camera.z * 100) / 100 };
    st.stats = g.stats;
    st.unlocked = Array.from(g.unlocked);
    st.buildings = g.factory.serialize();
    return JSON.stringify(st);
  }
  save() {
    return lsSet(SAVE_KEY, this.serialize());
  }
  /** indlæs gemt tilstand (eller ny) – kaldes ved opstart */
  load() {
    const raw = this.peek();
    return this.normalize(raw);
  }
  normalize(raw) {
    const d = defaultState();
    if (!raw || typeof raw !== 'object') return { state: d, stats: defaultStats(), fresh: true };
    for (const k in d) {
      if (!(k in raw)) continue;
      const dv = d[k], sv = raw[k];
      if (Array.isArray(dv)) { if (Array.isArray(sv)) d[k] = sv; }
      else if (dv && typeof dv === 'object') { if (sv && typeof sv === 'object' && !Array.isArray(sv)) d[k] = Object.assign(dv, sv); }
      else if (typeof dv === typeof sv && !(typeof sv === 'number' && !isFinite(sv))) d[k] = sv;
    }
    const stats = Object.assign(defaultStats(), raw.stats && typeof raw.stats === 'object' ? raw.stats : {});
    if (!stats.keys || typeof stats.keys !== 'object') stats.keys = {};
    if (!Array.isArray(stats.colors)) stats.colors = [];
    d.level = Math.max(1, d.level | 0);
    d.orders = d.orders.filter((o) => o && Shape.valid(o.key));
    for (const s of START_UNLOCKS) if (!d.unlocked.includes(s)) d.unlocked.push(s);
    return { state: d, stats, fresh: false };
  }
  reset() { lsDel(SAVE_KEY); }
  exportText() { return this.serialize(); }
  importText(text) {
    const raw = JSON.parse(text);
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.buildings)) throw new Error('Ugyldig gemt fil');
    lsSet(SAVE_KEY, JSON.stringify(raw));
  }
}

class AudioFX {
  constructor(game) { this.g = game; this.ctx = null; this.last = {}; }
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  }
  tone(freq, dur, type = 'sine', vol = 0.2, delay = 0, slide = 0) {
    const c = this.ctx;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  play(name) {
    if (!this.g.state.settings.sound) return;
    this.init();
    if (!this.ctx) return;
    const tn = this.ctx.currentTime;
    const gap = { deliver: 0.09, build: 0.04, coin: 0.12 }[name] || 0.02;
    if (this.last[name] && tn - this.last[name] < gap) return;
    this.last[name] = tn;
    switch (name) {
      case 'click': this.tone(720, 0.05, 'square', 0.05); break;
      case 'select': this.tone(520, 0.06, 'triangle', 0.12); this.tone(780, 0.06, 'triangle', 0.08, 0.04); break;
      case 'build': this.tone(380, 0.09, 'triangle', 0.16, 0, 2); break;
      case 'remove': this.tone(520, 0.12, 'triangle', 0.14, 0, 0.4); break;
      case 'rotate': this.tone(900, 0.04, 'sine', 0.08); break;
      case 'deliver': this.tone(1320 + Math.random() * 200, 0.05, 'sine', 0.035); break;
      case 'coin': this.tone(1500, 0.06, 'square', 0.04); this.tone(2000, 0.08, 'square', 0.035, 0.05); break;
      case 'error': this.tone(170, 0.16, 'sawtooth', 0.08, 0, 0.7); break;
      case 'upgrade': [523, 659, 784].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.16, i * 0.07)); break;
      case 'mission': [659, 784, 988, 1319].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.15, i * 0.08)); break;
      case 'levelup':
        [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.17, i * 0.1));
        [1046, 1318, 1568].forEach((f) => this.tone(f, 0.6, 'sine', 0.07, 0.45));
        break;
      case 'ach': [880, 1175, 1568].forEach((f, i) => this.tone(f, 0.16, 'sine', 0.13, i * 0.06)); break;
      case 'machine': this.tone(220, 0.05, 'square', 0.025); break;
    }
  }
}
