<script>
'use strict';
// =========================
// CAMERA
// =========================
const TILE = 48; // verdens-pixels pr. felt (ved zoom 1)
class Camera {
  constructor() { this.x = 0; this.y = 0; this.z = 1; this.w = 800; this.h = 600; }
  get s() { return TILE * this.z; }
  /** verden (px) → skærm */
  sx(wx) { return (wx - this.x) * this.z + this.w / 2; }
  sy(wy) { return (wy - this.y) * this.z + this.h / 2; }
  /** skærm → verden (px) */
  wx(sx) { return (sx - this.w / 2) / this.z + this.x; }
  wy(sy) { return (sy - this.h / 2) / this.z + this.y; }
  tileAt(sx, sy) { return { x: Math.floor(this.wx(sx) / TILE), y: Math.floor(this.wy(sy) / TILE) }; }
  zoomAt(f, sx, sy) {
    const bx = this.wx(sx), by = this.wy(sy);
    this.z = clamp(this.z * f, 0.22, 3);
    this.x += bx - this.wx(sx);
    this.y += by - this.wy(sy);
    this.clampPos();
  }
  pan(dx, dy) { this.x -= dx / this.z; this.y -= dy / this.z; this.clampPos(); }
  clampPos() {
    const lim = (WORLD + 4) * TILE;
    this.x = clamp(this.x, -lim, lim);
    this.y = clamp(this.y, -lim, lim);
  }
}

// =========================
// RENDERING
// =========================
const STATUS_COL = { working: '#3ddc84', waiting: '#ffd23f', noinput: '#ff4d6d', off: '#596180', idle: '#36e2ff' };

/** punkt + vinkel langs et bånd. e = indgangsside (retning), r = udgang, p = 0..1 */
function beltPos(cx, cy, s, e, r, p, out) {
  if (e === opp(r) || e === r || e < 0) {
    const ex = cx - DX[r] * s / 2, ey = cy - DY[r] * s / 2;
    out.x = ex + DX[r] * s * p;
    out.y = ey + DY[r] * s * p;
    out.a = Math.atan2(DY[r], DX[r]);
    return out;
  }
  const kx = cx + (DX[e] + DX[r]) * s / 2, ky = cy + (DY[e] + DY[r]) * s / 2;
  const a0 = Math.atan2(DY[e] * s / 2 - (DY[e] + DY[r]) * s / 2, DX[e] * s / 2 - (DX[e] + DX[r]) * s / 2);
  const a1 = Math.atan2(DY[r] * s / 2 - (DY[e] + DY[r]) * s / 2, DX[r] * s / 2 - (DX[e] + DX[r]) * s / 2);
  let d = a1 - a0;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  const a = a0 + d * p;
  out.x = kx + Math.cos(a) * s / 2;
  out.y = ky + Math.sin(a) * s / 2;
  out.a = a + (d > 0 ? Math.PI / 2 : -Math.PI / 2);
  return out;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- transportbånd ---------- */
const _bp = { x: 0, y: 0, a: 0 };
function drawBeltBase(ctx, b, sx, sy, s, t, speed, detail) {
  const cx = sx + s / 2, cy = sy + s / 2, r = b.r;
  const e = b.vis < 0 ? opp(r) : b.vis;
  const tw = s * 0.66;
  ctx.fillStyle = '#0e1730';
  ctx.strokeStyle = b.off ? 'rgba(120,130,160,.35)' : 'rgba(54,226,255,.42)';
  ctx.lineWidth = Math.max(1, s * 0.035);
  if (e === opp(r)) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(r * Math.PI / 2);
    ctx.fillRect(-tw / 2, -s / 2, tw, s);
    ctx.beginPath();
    ctx.moveTo(-tw / 2, -s / 2); ctx.lineTo(-tw / 2, s / 2);
    ctx.moveTo(tw / 2, -s / 2); ctx.lineTo(tw / 2, s / 2);
    ctx.stroke();
    ctx.restore();
  } else {
    const kx = cx + (DX[e] + DX[r]) * s / 2, ky = cy + (DY[e] + DY[r]) * s / 2;
    beltPos(cx, cy, s, e, r, 0, _bp);
    const a0 = Math.atan2(_bp.y - ky, _bp.x - kx);
    beltPos(cx, cy, s, e, r, 1, _bp);
    const a1 = Math.atan2(_bp.y - ky, _bp.x - kx);
    let d = a1 - a0;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const ccw = d < 0;
    const R = s / 2;
    ctx.beginPath();
    ctx.arc(kx, ky, R + tw / 2, a0, a1, ccw);
    ctx.arc(kx, ky, Math.max(0.1, R - tw / 2), a1, a0, !ccw);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(kx, ky, R + tw / 2, a0, a1, ccw);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(kx, ky, Math.max(0.1, R - tw / 2), a0, a1, ccw);
    ctx.stroke();
  }
  if (!detail) return;
  // chevrons der bevæger sig
  const off = b.off ? 0 : (t * speed) % 0.5;
  ctx.strokeStyle = b.off ? 'rgba(120,130,160,.4)' : b.moving || !b.items.length ? 'rgba(54,226,255,.7)' : 'rgba(255,210,63,.75)';
  ctx.lineWidth = Math.max(1, s * 0.05);
  ctx.lineCap = 'round';
  ctx.beginPath();
  const cw = s * 0.12;
  for (let k = 0; k < 2; k++) {
    const p = off + k * 0.5;
    beltPos(cx, cy, s, e, r, p, _bp);
    const ca = Math.cos(_bp.a), sa = Math.sin(_bp.a);
    // chevron: spids i bevægelsesretningen
    ctx.moveTo(_bp.x - ca * cw - sa * cw, _bp.y - sa * cw + ca * cw);
    ctx.lineTo(_bp.x, _bp.y);
    ctx.lineTo(_bp.x - ca * cw + sa * cw, _bp.y - sa * cw - ca * cw);
  }
  ctx.stroke();
  ctx.lineCap = 'butt';
}
function drawBeltItems(ctx, b, sx, sy, s, lod) {
  const cx = sx + s / 2, cy = sy + s / 2;
  const size = s * 0.44;
  for (const it of b.items) {
    beltPos(cx, cy, s, it.from, b.r, it.p, _bp);
    if (lod) {
      ctx.fillStyle = COLORS[(it.s.layers[0].find(Boolean) || 'Cu')[1]].hex;
      ctx.fillRect(_bp.x - size / 3, _bp.y - size / 3, size / 1.5, size / 1.5);
    } else drawShape(ctx, it.s, _bp.x, _bp.y, size);
  }
}

/* ---------- maskiner ---------- */
function drawPorts(ctx, b, x, y, s) {
  const d = b.def;
  const cx = x + s / 2, cy = y + s / 2;
  if (d.inputs) {
    ctx.fillStyle = 'rgba(54,226,255,.85)';
    for (const side of d.inputs) {
      const dir = b.dirOf(side);
      const px = cx + DX[dir] * s * 0.43, py = cy + DY[dir] * s * 0.43;
      const w = DX[dir] ? s * 0.06 : s * 0.3, h = DX[dir] ? s * 0.3 : s * 0.06;
      ctx.fillRect(px - w / 2, py - h / 2, w, h);
    }
  }
  if (d.outputs) {
    ctx.fillStyle = d.color;
    for (const side of d.outputs) {
      const dir = b.dirOf(side);
      const px = cx + DX[dir] * s * 0.4, py = cy + DY[dir] * s * 0.4;
      const a = s * 0.12;
      ctx.beginPath();
      ctx.moveTo(px + DX[dir] * a, py + DY[dir] * a);
      ctx.lineTo(px - DY[dir] * a - DX[dir] * a * 0.2, py + DX[dir] * a - DY[dir] * a * 0.2);
      ctx.lineTo(px + DY[dir] * a - DX[dir] * a * 0.2, py - DX[dir] * a - DY[dir] * a * 0.2);
      ctx.closePath();
      ctx.fill();
    }
  }
}

/** ikon for en maskinetype, centreret, størrelse k */
function drawIcon(ctx, type, cx, cy, k, b, t) {
  const d = MACHINES[type];
  const col = d.color;
  const r = b ? b.r : 0;
  const lw = Math.max(1.2, k * 0.08);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  const working = b && b.status === 'working';
  const spin = b ? b.anim : 0;
  switch (type) {
    case 'conveyor': {
      ctx.rotate(r * Math.PI / 2);
      ctx.beginPath();
      for (let i = 0; i < 2; i++) {
        const y = k * 0.25 - i * k * 0.4;
        ctx.moveTo(-k * 0.3, y + k * 0.18); ctx.lineTo(0, y - k * 0.1); ctx.lineTo(k * 0.3, y + k * 0.18);
      }
      ctx.stroke();
      break;
    }
    case 'generator': {
      ctx.save();
      ctx.rotate(spin * 1.2);
      ctx.beginPath();
      const n = 8;
      for (let i = 0; i < n * 2; i++) {
        const a = (i / (n * 2)) * Math.PI * 2;
        const rr = i % 2 ? k * 0.4 : k * 0.48;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
      drawShape(ctx, Shape.full((b && b.cfg.shape) || 'C'), 0, 0, k * 0.5);
      break;
    }
    case 'output': {
      const fl = b ? b.flash : 0;
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 0.35 + 0.22 * i + fl * 0.2;
        ctx.beginPath();
        ctx.arc(0, 0, k * (0.48 - i * 0.14) + fl * k * 0.04, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(0, 0, k * 0.08 + fl * k * 0.06, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
    case 'trash': {
      const fl = b ? b.flash : 0;
      ctx.beginPath();
      ctx.arc(0, 0, k * 0.4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.rotate(fl * 0.8);
      ctx.beginPath();
      ctx.moveTo(-k * 0.18, -k * 0.18); ctx.lineTo(k * 0.18, k * 0.18);
      ctx.moveTo(k * 0.18, -k * 0.18); ctx.lineTo(-k * 0.18, k * 0.18);
      ctx.stroke();
      break;
    }
    case 'splitter': {
      ctx.rotate(r * Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, k * 0.4); ctx.lineTo(0, -k * 0.05);
      ctx.moveTo(0, -k * 0.05); ctx.lineTo(0, -k * 0.42);
      ctx.moveTo(0, -k * 0.05); ctx.lineTo(-k * 0.42, -k * 0.05);
      ctx.moveTo(0, -k * 0.05); ctx.lineTo(k * 0.42, -k * 0.05);
      ctx.stroke();
      arrowHead(ctx, 0, -k * 0.45, 0, k * 0.13);
      arrowHead(ctx, -k * 0.45, -k * 0.05, 3, k * 0.13);
      arrowHead(ctx, k * 0.45, -k * 0.05, 1, k * 0.13);
      break;
    }
    case 'crossing': {
      ctx.beginPath();
      ctx.moveTo(-k * 0.42, 0); ctx.lineTo(k * 0.42, 0);
      ctx.moveTo(0, -k * 0.42); ctx.lineTo(0, k * 0.42);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, k * 0.14, 0, Math.PI * 2);
      ctx.fillStyle = '#0b1024';
      ctx.fill();
      ctx.stroke();
      break;
    }
    case 'cutter': {
      ctx.beginPath();
      ctx.arc(0, 0, k * 0.36, 0, Math.PI * 2);
      ctx.globalAlpha = 0.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
      // klingen er altid lodret i verden (figuren deles i venstre/højre)
      const g = working ? 0.6 + 0.4 * Math.sin(spin * 12) : 0.7;
      ctx.strokeStyle = '#fff';
      ctx.globalAlpha = g;
      ctx.beginPath();
      ctx.moveTo(0, -k * 0.5); ctx.lineTo(0, k * 0.5);
      ctx.stroke();
      ctx.globalAlpha = 1;
      break;
    }
    case 'merger': {
      ctx.rotate(r * Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, k * 0.44); ctx.lineTo(0, -k * 0.3);
      ctx.moveTo(-k * 0.44, 0); ctx.quadraticCurveTo(0, 0, 0, -k * 0.3);
      ctx.stroke();
      arrowHead(ctx, 0, -k * 0.44, 0, k * 0.15);
      ctx.beginPath();
      ctx.arc(0, -k * 0.05, k * 0.09, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
    case 'painter': {
      const c = COLORS[(b && b.cfg.color) || 'r'].hex;
      ctx.fillStyle = c;
      ctx.strokeStyle = shade(c, 0.3);
      ctx.beginPath();
      ctx.moveTo(0, -k * 0.46);
      ctx.bezierCurveTo(k * 0.12, -k * 0.26, k * 0.34, -k * 0.06, k * 0.34, k * 0.14);
      ctx.arc(0, k * 0.14, k * 0.34, 0, Math.PI);
      ctx.bezierCurveTo(-k * 0.34, -k * 0.06, -k * 0.12, -k * 0.26, 0, -k * 0.46);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath();
      ctx.arc(-k * 0.12, k * 0.12, k * 0.07, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
    case 'sorter': {
      ctx.rotate(r * Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(-k * 0.4, k * 0.4); ctx.lineTo(k * 0.4, k * 0.4); ctx.lineTo(k * 0.1, 0); ctx.lineTo(k * 0.1, -k * 0.4);
      ctx.lineTo(-k * 0.1, -k * 0.4); ctx.lineTo(-k * 0.1, 0); ctx.closePath();
      ctx.stroke();
      ctx.rotate(-r * Math.PI / 2);
      if (b) {
        if (b.cfg.mode === 'color') {
          ctx.fillStyle = COLORS[b.cfg.v] ? COLORS[b.cfg.v].hex : '#fff';
          ctx.beginPath(); ctx.arc(0, k * 0.08, k * 0.16, 0, Math.PI * 2); ctx.fill();
        } else drawShape(ctx, Shape.full(b.cfg.v || 'C', 'w'), 0, k * 0.08, k * 0.42);
      }
      break;
    }
    case 'rotator': {
      if (b && b.cfg.ccw) ctx.scale(-1, 1);
      ctx.rotate(spin * 2.5);
      ctx.beginPath();
      ctx.arc(0, 0, k * 0.34, -Math.PI / 2 + 0.5, Math.PI * 1.5 - 0.3);
      ctx.stroke();
      const a = Math.PI * 1.5 - 0.3;
      arrowHead(ctx, Math.cos(a) * k * 0.34, Math.sin(a) * k * 0.34, 0, k * 0.17, a + Math.PI / 2);
      break;
    }
    case 'storage': {
      roundRect(ctx, -k * 0.4, -k * 0.36, k * 0.8, k * 0.72, k * 0.08);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-k * 0.4, -k * 0.12); ctx.lineTo(k * 0.4, -k * 0.12);
      ctx.stroke();
      if (b) {
        const f = Math.min(1, b.store.length / b.capacity());
        ctx.globalAlpha = 0.65;
        ctx.fillRect(-k * 0.32, k * 0.28 - k * 0.36 * f, k * 0.64, k * 0.36 * f);
        ctx.globalAlpha = 1;
      }
      break;
    }
    case 'mirror': {
      ctx.setLineDash([k * 0.08, k * 0.07]);
      ctx.beginPath(); ctx.moveTo(0, -k * 0.46); ctx.lineTo(0, k * 0.46); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(-k * 0.08, -k * 0.3); ctx.lineTo(-k * 0.42, k * 0.3); ctx.lineTo(-k * 0.08, k * 0.3); ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(k * 0.08, -k * 0.3); ctx.lineTo(k * 0.42, k * 0.3); ctx.lineTo(k * 0.08, k * 0.3); ctx.closePath();
      ctx.stroke();
      break;
    }
    case 'unstacker': {
      ctx.rotate(r * Math.PI / 2);
      const lift = working ? Math.sin(spin * 6) * k * 0.05 : 0;
      roundRect(ctx, -k * 0.36, k * 0.16, k * 0.72, k * 0.18, k * 0.05); ctx.stroke();
      roundRect(ctx, -k * 0.28, -k * 0.08, k * 0.56, k * 0.16, k * 0.05); ctx.stroke();
      roundRect(ctx, -k * 0.12 + k * 0.14, -k * 0.36 - lift, k * 0.4, k * 0.14, k * 0.05); ctx.fill();
      break;
    }
    case 'morpher': {
      ctx.save();
      ctx.rotate(spin * 0.8);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        ctx.lineTo(Math.cos(a) * k * 0.46, Math.sin(a) * k * 0.46);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
      drawShape(ctx, Shape.full((b && b.cfg.shape) || 'H', 'p'), 0, 0, k * 0.46);
      break;
    }
  }
  ctx.restore();
}
/** pilespids i (x,y); dir 0..3 eller eksplicit vinkel */
function arrowHead(ctx, x, y, dir, a, ang) {
  const angle = ang !== undefined ? ang : [-Math.PI / 2, 0, Math.PI / 2, Math.PI][dir];
  ctx.beginPath();
  ctx.moveTo(x + Math.cos(angle) * a, y + Math.sin(angle) * a);
  ctx.lineTo(x + Math.cos(angle + 2.4) * a, y + Math.sin(angle + 2.4) * a);
  ctx.lineTo(x + Math.cos(angle - 2.4) * a, y + Math.sin(angle - 2.4) * a);
  ctx.closePath();
  ctx.fill();
}

function drawMachine(ctx, b, x, y, s, t, detail) {
  const d = b.def;
  const pad = s * 0.07;
  const st = b.status;
  // bund
  const g = ctx.createLinearGradient(x, y, x, y + s);
  g.addColorStop(0, '#1a2448');
  g.addColorStop(1, '#0b1024');
  ctx.fillStyle = g;
  roundRect(ctx, x + pad, y + pad, s - pad * 2, s - pad * 2, s * 0.16);
  ctx.fill();
  ctx.lineWidth = Math.max(1, s * 0.035);
  ctx.strokeStyle = st === 'working' ? d.color : shade(d.color, -0.45);
  ctx.stroke();
  if (!detail) {
    ctx.fillStyle = d.color;
    ctx.globalAlpha = 0.7;
    ctx.fillRect(x + s * 0.32, y + s * 0.32, s * 0.36, s * 0.36);
    ctx.globalAlpha = 1;
    return;
  }
  if (st === 'working') {
    ctx.fillStyle = d.color;
    ctx.globalAlpha = 0.08;
    roundRect(ctx, x + pad, y + pad, s - pad * 2, s - pad * 2, s * 0.16);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  drawPorts(ctx, b, x, y, s);
  const cx = x + s / 2, cy = y + s / 2;
  drawIcon(ctx, b.type, cx, cy, s * 0.56, b, t);
  // fremdrift-ring
  if (b.job && b.progress > 0 && b.type !== 'splitter' && b.type !== 'storage') {
    ctx.strokeStyle = d.color;
    ctx.lineWidth = Math.max(1.5, s * 0.045);
    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * b.progress);
    ctx.stroke();
    // resultatet "dukker op" på vej mod udgangen
    if (s >= 30 && b.type !== 'generator') {
      const res = b.job.find(Boolean);
      if (res) {
        const dir = b.r;
        ctx.globalAlpha = 0.35 + 0.65 * b.progress;
        drawShape(ctx, res, cx + DX[dir] * s * 0.22 * b.progress, cy + DY[dir] * s * 0.22 * b.progress, s * 0.3);
        ctx.globalAlpha = 1;
      }
    }
  }
  // statuslys
  const lx = x + s - pad * 2.6, ly = y + pad * 2.6, lr = Math.max(1.6, s * 0.05);
  const sc = STATUS_COL[st] || STATUS_COL.idle;
  ctx.fillStyle = sc;
  ctx.globalAlpha = 0.25 + (st === 'working' ? 0.15 * Math.sin(t * 6) + 0.15 : 0);
  ctx.beginPath(); ctx.arc(lx, ly, lr * 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.fill();
  // Mk-niveau
  if (b.lvl > 1) {
    ctx.fillStyle = '#ffd23f';
    for (let i = 0; i < b.lvl - 1; i++) {
      ctx.beginPath();
      ctx.arc(x + pad * 2.6 + i * s * 0.1, y + s - pad * 2.6, Math.max(1.4, s * 0.035), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (b.off) {
    ctx.fillStyle = 'rgba(5,7,15,.55)';
    roundRect(ctx, x + pad, y + pad, s - pad * 2, s - pad * 2, s * 0.16);
    ctx.fill();
    ctx.strokeStyle = '#8d98bd';
    ctx.lineWidth = Math.max(1.2, s * 0.05);
    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.16, -Math.PI / 2 + 0.6, -Math.PI / 2 - 0.6 + Math.PI * 2);
    ctx.moveTo(cx, cy - s * 0.22); ctx.lineTo(cx, cy - s * 0.06);
    ctx.stroke();
  }
}

/** lille forhåndsvisning af en maskine i et DOM-canvas */
function paintMachineCanvas(cv, type, cfg) {
  const ctx = cv.getContext('2d');
  const s = cv.width;
  ctx.clearRect(0, 0, s, s);
  const fake = { type, def: MACHINES[type], r: 0, cfg: Object.assign({}, MACHINES[type].cfg || {}, cfg || {}), status: 'idle', lvl: 1, anim: 0, flash: 0, items: [], vis: -1, moving: true, store: [], capacity: () => 1, job: null, progress: 0, dirOf: Building.prototype.dirOf };
  if (type === 'conveyor') drawBeltBase(ctx, fake, 0, 0, s, 0, 0, true);
  else drawMachine(ctx, fake, 0, 0, s, 0, true);
}

class Renderer {
  constructor(game, canvas) {
    this.g = game;
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = 1;
    this.popups = [];
    this.sparks = [];
  }
  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = Math.round(w * this.dpr);
    this.cv.height = Math.round(h * this.dpr);
    this.g.camera.w = w;
    this.g.camera.h = h;
    this.bgGrad = null;
  }
  popup(tx, ty, text, color) {
    if (!this.g.state.settings.fx || this.popups.length > 60) return;
    this.popups.push({ x: (tx + 0.5) * TILE, y: ty * TILE + TILE * 0.2, text, color, t: 0 });
  }
  spark(tx, ty, color, n = 8) {
    if (!this.g.state.settings.fx || this.sparks.length > 400) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 90;
      this.sparks.push({ x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.4 + Math.random() * 0.4, color });
    }
  }
  render(dt, t) {
    const g = this.g, ctx = this.ctx, cam = g.camera, f = g.factory;
    const W = cam.w, H = cam.h, s = cam.s;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    // baggrund
    if (!this.bgGrad) {
      this.bgGrad = ctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H / 2, Math.max(W, H) * 0.8);
      this.bgGrad.addColorStop(0, '#0d1430');
      this.bgGrad.addColorStop(1, '#05070f');
    }
    ctx.fillStyle = this.bgGrad;
    ctx.fillRect(0, 0, W, H);

    const x0 = Math.floor(cam.wx(0) / TILE) - 1, y0 = Math.floor(cam.wy(0) / TILE) - 1;
    const x1 = Math.ceil(cam.wx(W) / TILE) + 1, y1 = Math.ceil(cam.wy(H) / TILE) + 1;
    const gx0 = Math.max(x0, -WORLD), gx1 = Math.min(x1, WORLD + 1), gy0 = Math.max(y0, -WORLD), gy1 = Math.min(y1, WORLD + 1);

    // byggeplads + grid
    const bx = cam.sx(-WORLD * TILE), by = cam.sy(-WORLD * TILE), bw = (WORLD * 2 + 1) * s;
    ctx.fillStyle = 'rgba(16,24,52,0.55)';
    ctx.fillRect(bx, by, bw, bw);
    if (g.state.settings.grid && s >= 10) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = s >= 20 ? 'rgba(120,160,255,0.07)' : 'rgba(120,160,255,0.045)';
      ctx.beginPath();
      for (let x = gx0; x <= gx1; x++) {
        if (x % 8 === 0) continue;
        const px = Math.round(cam.sx(x * TILE)) + 0.5;
        ctx.moveTo(px, cam.sy(gy0 * TILE)); ctx.lineTo(px, cam.sy(gy1 * TILE));
      }
      for (let y = gy0; y <= gy1; y++) {
        if (y % 8 === 0) continue;
        const py = Math.round(cam.sy(y * TILE)) + 0.5;
        ctx.moveTo(cam.sx(gx0 * TILE), py); ctx.lineTo(cam.sx(gx1 * TILE), py);
      }
      ctx.stroke();
    }
    // chunk-linjer hver 8. felt
    ctx.strokeStyle = 'rgba(54,226,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = Math.ceil(gx0 / 8) * 8; x <= gx1; x += 8) {
      const px = Math.round(cam.sx(x * TILE)) + 0.5;
      ctx.moveTo(px, cam.sy(gy0 * TILE)); ctx.lineTo(px, cam.sy(gy1 * TILE));
    }
    for (let y = Math.ceil(gy0 / 8) * 8; y <= gy1; y += 8) {
      const py = Math.round(cam.sy(y * TILE)) + 0.5;
      ctx.moveTo(cam.sx(gx0 * TILE), py); ctx.lineTo(cam.sx(gx1 * TILE), py);
    }
    ctx.stroke();
    // kant på byggepladsen
    ctx.strokeStyle = 'rgba(255,79,216,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bw);
    // midtpunkt
    const ox = cam.sx(0), oy = cam.sy(0);
    ctx.strokeStyle = 'rgba(54,226,255,0.22)';
    ctx.beginPath();
    ctx.arc(ox, oy, s * 0.18, 0, Math.PI * 2);
    ctx.stroke();

    // synlige bygninger
    f.refreshVis();
    const vis = [];
    const area = (x1 - x0) * (y1 - y0);
    if (area < f.count) {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const b = f.get(x, y); if (b) vis.push(b); }
    } else {
      for (const b of f.map.values()) if (b.x >= x0 && b.x <= x1 && b.y >= y0 && b.y <= y1) vis.push(b);
    }
    const detail = s >= 18;
    const speed = g.upg.beltSpeed();
    // 1) bånd
    for (const b of vis) if (b.type === 'conveyor') drawBeltBase(ctx, b, cam.sx(b.x * TILE), cam.sy(b.y * TILE), s, t, speed, detail);
    // 2) figurer på bånd
    for (const b of vis) if (b.type === 'conveyor' && b.items.length) drawBeltItems(ctx, b, cam.sx(b.x * TILE), cam.sy(b.y * TILE), s, s < 14);
    // 3) maskiner
    for (const b of vis) if (b.type !== 'conveyor') drawMachine(ctx, b, cam.sx(b.x * TILE), cam.sy(b.y * TILE), s, t, detail);
    // 4) figurer i krydsninger
    for (const b of vis) if (b.type === 'crossing' && detail) for (const sh of b.slots) if (sh) drawShape(ctx, sh, cam.sx((b.x + 0.5) * TILE), cam.sy((b.y + 0.5) * TILE), s * 0.38);

    // valgt bygning
    const sel = g.ui.selected;
    if (sel && f.get(sel.x, sel.y) === sel) {
      const px = cam.sx(sel.x * TILE), py = cam.sy(sel.y * TILE);
      ctx.strokeStyle = '#36e2ff';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.lineDashOffset = -t * 20;
      roundRect(ctx, px + 1, py + 1, s - 2, s - 2, s * 0.18);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    g.input.drawOverlay(ctx, t);

    // partikler
    for (let i = this.sparks.length - 1; i >= 0; i--) {
      const p = this.sparks[i];
      p.t += dt;
      if (p.t >= p.life) { this.sparks.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      const sz = Math.max(1.5, s * 0.06);
      ctx.fillRect(cam.sx(p.x) - sz / 2, cam.sy(p.y) - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    // popup-tekster
    ctx.textAlign = 'center';
    ctx.font = `800 ${Math.round(clamp(s * 0.3, 11, 18))}px "Segoe UI", system-ui, sans-serif`;
    for (let i = this.popups.length - 1; i >= 0; i--) {
      const p = this.popups[i];
      p.t += dt;
      if (p.t > 1.2) { this.popups.splice(i, 1); continue; }
      ctx.globalAlpha = p.t < 0.9 ? 1 : 1 - (p.t - 0.9) / 0.3;
      const px = cam.sx(p.x), py = cam.sy(p.y) - p.t * 30;
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(5,7,15,.85)';
      ctx.strokeText(p.text, px, py);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, px, py);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'start';
  }
}
</script>

<script>
'use strict';
// =========================
// HISTORY (undo / redo)
// =========================
const invOf = (d) => (d ? (typeof d.i === 'number' ? d.i : MACHINES[d.t].cost) : 0);
class History {
  constructor(game) { this.g = game; this.undoStack = []; this.redoStack = []; this.cur = null; }
  clear() { this.undoStack = []; this.redoStack = []; this.cur = null; }
  begin() { if (!this.cur) this.cur = []; }
  /** sæt et felt (data eller null) og husk ændringen */
  set(x, y, data) {
    const old = this.g.factory.get(x, y);
    const before = old ? old.serialize() : null;
    if (!this.g.setTile(x, y, data)) return false;
    const own = !this.cur;
    if (own) this.begin();
    this.cur.push({ x, y, b: before, a: data ? Object.assign({ x, y }, data) : null });
    if (own) this.commit();
    return true;
  }
  commit() {
    if (this.cur && this.cur.length) {
      this.undoStack.push(this.cur);
      if (this.undoStack.length > 200) this.undoStack.shift();
      this.redoStack = [];
    }
    this.cur = null;
  }
  apply(op, reverse) {
    const list = reverse ? op.slice().reverse() : op;
    const need = list.reduce((n, ch) => n + invOf(reverse ? ch.b : ch.a) - invOf(reverse ? ch.a : ch.b), 0);
    if (need > this.g.state.coins) {
      this.g.ui.toast('💰', 'Ikke nok GrejsCoins', `Kræver ${fmt(need)}`, 'bad');
      this.g.audio.play('error');
      return false;
    }
    for (const ch of list) this.g.setTile(ch.x, ch.y, reverse ? ch.b : ch.a);
    return true;
  }
  undo() {
    this.commit();
    const op = this.undoStack.pop();
    if (!op) return;
    if (!this.apply(op, true)) { this.undoStack.push(op); return; }
    this.redoStack.push(op);
    this.g.stats.undoUsed++;
    this.g.audio.play('remove');
  }
  redo() {
    const op = this.redoStack.pop();
    if (!op) return;
    if (!this.apply(op, false)) { this.redoStack.push(op); return; }
    this.undoStack.push(op);
    this.g.audio.play('build');
  }
}

// =========================
// INPUT
// =========================
class Input {
  constructor(game) {
    this.g = game;
    this.tool = null; // null | maskintype | 'delete' | 'select' | 'paste'
    this.rot = 1;
    this.hover = null;
    this.pointers = new Map();
    this.mode = null;
    this.keys = {};
    this.sel = null; // {x0,y0,x1,y1}
    this.clip = null; // [{dx,dy,t,r,c}]
    this.pasteRot = 0;
    this.touchMode = false;
    this.lastErr = 0;
    this.bind();
  }
  local(e) { return { x: e.clientX, y: e.clientY }; }
  bind() {
    const cv = this.g.renderer.cv;
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('pointerdown', (e) => this.down(e));
    cv.addEventListener('pointermove', (e) => this.move(e));
    cv.addEventListener('pointerup', (e) => this.up(e));
    cv.addEventListener('pointercancel', (e) => this.up(e, true));
    cv.addEventListener('pointerleave', () => { if (!this.pointers.size) this.hover = null; });
    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.g.camera.zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
    }, { passive: false });
    window.addEventListener('keydown', (e) => this.keydown(e));
    window.addEventListener('keyup', (e) => { this.keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
  }
  interact() { this.g.lastInteract = now(); this.g.delSinceInteract = 0; }

  /* ---------- værktøjer ---------- */
  setTool(t) {
    if (t && MACHINES[t] && !this.g.unlocked.has(t)) return;
    this.tool = t === this.tool && t !== 'paste' ? null : t;
    if (this.tool !== 'select') this.sel = null;
    if (this.tool && MACHINES[this.tool]) {
      const i = this.g.state.seenNew.indexOf(this.tool);
      if (i >= 0) this.g.state.seenNew.splice(i, 1);
      this.g.ui.select(null);
    }
    this.g.audio.play('click');
    this.g.ui.refreshTools();
  }
  rotate(ccw) {
    const d = ccw ? 3 : 1;
    if (this.tool === 'paste') this.pasteRot = (this.pasteRot + d) & 3;
    else if (!this.tool && this.g.ui.selected) {
      const b = this.g.ui.selected;
      const data = b.serialize();
      data.r = (b.r + d) & 3;
      this.g.history.set(b.x, b.y, data);
    } else this.rot = (this.rot + d) & 3;
    this.g.audio.play('rotate');
    this.g.ui.refreshTools();
  }
  pipette() {
    const h = this.hover;
    const b = h && this.g.factory.get(h.x, h.y);
    if (!b) return;
    if (b.def.cfg) this.g.state.lastCfg[b.type] = Object.assign({}, b.cfg);
    this.tool = null;
    this.setTool(b.type);
    this.rot = b.r;
    this.g.ui.refreshTools();
  }
  cfgFor(type) {
    const c = this.g.state.lastCfg[type];
    return c ? Object.assign({}, c) : MACHINES[type].cfg ? Object.assign({}, MACHINES[type].cfg) : undefined;
  }
  error(title, sub) {
    const t = now();
    this.g.audio.play('error');
    if (t - this.lastErr < 1.2) return;
    this.lastErr = t;
    this.g.ui.toast('⚠️', title, sub || '', 'bad', 2);
  }
  /** er (x,y) en gyldig placering for type? */
  check(type, x, y) {
    const f = this.g.factory;
    if (!f.inBounds(x, y)) return 'Uden for byggepladsen';
    const b = f.get(x, y);
    if (b && b.type !== type) return 'Feltet er optaget';
    if (!b && this.g.state.coins < MACHINES[type].cost) return 'Ikke nok GrejsCoins';
    return null;
  }
  place(x, y) {
    const type = this.tool;
    const err = this.check(type, x, y);
    if (err) return this.error(err, err === 'Ikke nok GrejsCoins' ? `${MACHINES[type].name} koster ${MACHINES[type].cost}` : '');
    const existed = !!this.g.factory.get(x, y);
    this.g.history.set(x, y, { t: type, r: this.rot, c: this.cfgFor(type) });
    if (!existed) this.g.onBuilt(type, x, y);
    this.g.audio.play(existed ? 'rotate' : 'build');
  }
  placeBelt(x, y, dir) {
    const f = this.g.factory;
    const b = f.get(x, y);
    if (b) {
      if (b.type === 'conveyor' && b.r !== dir) {
        const d = b.serialize();
        d.r = dir;
        this.g.history.set(x, y, d);
      }
      return;
    }
    const err = this.check('conveyor', x, y);
    if (err) return this.error(err);
    this.g.history.set(x, y, { t: 'conveyor', r: dir });
    this.g.onBuilt('conveyor', x, y);
    this.g.audio.play('build');
  }
  beltStep(tile) {
    if (!this.beltLast) {
      this.placeBelt(tile.x, tile.y, this.rot);
      this.beltLast = { x: tile.x, y: tile.y };
      return;
    }
    let guard = 0;
    while ((this.beltLast.x !== tile.x || this.beltLast.y !== tile.y) && guard++ < 400) {
      const l = this.beltLast;
      let dir;
      if (l.x !== tile.x) dir = tile.x > l.x ? 1 : 3;
      else dir = tile.y > l.y ? 2 : 0;
      const prev = this.g.factory.get(l.x, l.y);
      if (prev && prev.type === 'conveyor' && prev.r !== dir) {
        const d = prev.serialize();
        d.r = dir;
        this.g.history.set(l.x, l.y, d);
      }
      const nx = l.x + DX[dir], ny = l.y + DY[dir];
      this.placeBelt(nx, ny, dir);
      this.rot = dir;
      this.beltLast = { x: nx, y: ny };
    }
    this.g.ui.refreshTools();
  }
  eraseAt(x, y) {
    const b = this.g.factory.get(x, y);
    if (!b) return;
    this.g.history.set(x, y, null);
    this.g.stats.removed++;
    this.g.audio.play('remove');
    this.g.renderer.spark(x, y, '#ff4d6d', 6);
    if (this.g.ui.selected === b) this.g.ui.select(null);
  }

  /* ---------- markering / kopiér / indsæt ---------- */
  selBuildings() {
    const s = this.sel;
    if (!s) return [];
    const x0 = Math.min(s.x0, s.x1), x1 = Math.max(s.x0, s.x1), y0 = Math.min(s.y0, s.y1), y1 = Math.max(s.y0, s.y1);
    const out = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const b = this.g.factory.get(x, y); if (b) out.push(b); }
    return out;
  }
  copySel(cut) {
    const bs = this.selBuildings();
    if (!bs.length) return;
    const mx = Math.min(...bs.map((b) => b.x)), my = Math.min(...bs.map((b) => b.y));
    this.clip = bs.map((b) => ({ dx: b.x - mx, dy: b.y - my, t: b.type, r: b.r, c: b.def.cfg ? Object.assign({}, b.cfg) : undefined }));
    if (cut) this.deleteSel();
    this.sel = null;
    this.pasteRot = 0;
    this.tool = null;
    this.setTool('paste');
    this.g.ui.toast('📐', cut ? 'Klippet ud' : 'Kopieret', `${bs.length} bygninger – klik for at indsætte, R roterer`, 'cyan', 2.6);
  }
  deleteSel() {
    const bs = this.selBuildings();
    if (!bs.length) return;
    this.g.history.begin();
    for (const b of bs) this.g.history.set(b.x, b.y, null);
    this.g.history.commit();
    this.g.ui.select(null);
    this.sel = null;
    this.g.audio.play('remove');
    this.g.ui.refreshTools();
  }
  clipPlaced(tx, ty) {
    const k = this.pasteRot;
    return (this.clip || []).map((c) => {
      let dx = c.dx, dy = c.dy;
      for (let i = 0; i < k; i++) { const t = dx; dx = -dy; dy = t; }
      return { x: tx + dx, y: ty + dy, t: c.t, r: (c.r + k) & 3, c: c.c };
    });
  }
  pasteAt(tx, ty) {
    const items = this.clipPlaced(tx, ty).filter((c) => this.g.unlocked.has(c.t) && this.g.factory.inBounds(c.x, c.y) && !this.g.factory.get(c.x, c.y));
    if (!items.length) return this.error('Intet at indsætte her', 'Felterne er optaget');
    const cost = items.reduce((n, c) => n + MACHINES[c.t].cost, 0);
    if (cost > this.g.state.coins) return this.error('Ikke nok GrejsCoins', `Kræver ${fmt(cost)}`);
    this.g.history.begin();
    for (const c of items) { this.g.history.set(c.x, c.y, { t: c.t, r: c.r, c: c.c }); this.g.onBuilt(c.t, c.x, c.y, true); }
    this.g.history.commit();
    this.g.stats.pasted++;
    this.g.audio.play('build');
  }

  /* ---------- pointer ---------- */
  down(e) {
    this.g.audio.init();
    this.interact();
    this.touchMode = e.pointerType === 'touch';
    try { this.g.renderer.cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const p = this.local(e);
    this.pointers.set(e.pointerId, p);
    if (this.pointers.size === 2) {
      // pinch-zoom / to-finger pan
      this.finishDrag();
      const [a, b] = Array.from(this.pointers.values());
      this.mode = 'pinch';
      this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
      return;
    }
    if (this.pointers.size > 2) return;
    const tile = this.g.camera.tileAt(p.x, p.y);
    this.hover = tile;
    this.downPos = p;
    this.last = p;
    if (e.button === 1) { this.mode = 'pan'; return; }
    if (e.button === 2) {
      if (this.tool && this.tool !== 'delete') { this.setTool(null); this.mode = null; return; }
      this.mode = 'erase';
      this.g.history.begin();
      this.eraseAt(tile.x, tile.y);
      return;
    }
    const t = this.tool;
    if (t === 'conveyor') {
      this.mode = 'belt';
      this.beltLast = null;
      this.g.history.begin();
      this.beltStep(tile);
    } else if (t === 'delete') {
      this.mode = 'erase';
      this.g.history.begin();
      this.eraseAt(tile.x, tile.y);
    } else if (t === 'select') {
      this.mode = 'select';
      this.sel = { x0: tile.x, y0: tile.y, x1: tile.x, y1: tile.y };
    } else this.mode = 'tap';
  }
  move(e) {
    const p = this.local(e);
    if (this.pointers.has(e.pointerId)) this.pointers.set(e.pointerId, p);
    if (this.mode === 'pinch' && this.pointers.size >= 2) {
      const [a, b] = Array.from(this.pointers.values());
      const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const cam = this.g.camera;
      cam.pan(cx - this.pinch.cx, cy - this.pinch.cy);
      if (this.pinch.d > 10) cam.zoomAt(d / this.pinch.d, cx, cy);
      this.pinch = { d, cx, cy };
      return;
    }
    const tile = this.g.camera.tileAt(p.x, p.y);
    if (!this.touchMode || this.pointers.size) this.hover = tile;
    if (!this.pointers.size) return;
    if (this.mode === 'tap' && Math.hypot(p.x - this.downPos.x, p.y - this.downPos.y) > 8) this.mode = 'pan';
    if (this.mode === 'pan') {
      this.g.camera.pan(p.x - this.last.x, p.y - this.last.y);
      this.g.renderer.cv.classList.add('pan');
    } else if (this.mode === 'belt') this.beltStep(tile);
    else if (this.mode === 'erase') this.eraseAt(tile.x, tile.y);
    else if (this.mode === 'select' && this.sel) { this.sel.x1 = tile.x; this.sel.y1 = tile.y; }
    this.last = p;
  }
  finishDrag() {
    if (this.mode === 'belt' || this.mode === 'erase') this.g.history.commit();
    this.beltLast = null;
  }
  up(e, cancel) {
    this.pointers.delete(e.pointerId);
    this.g.renderer.cv.classList.remove('pan');
    if (this.mode === 'pinch') {
      if (!this.pointers.size) this.mode = null;
      return;
    }
    if (this.mode === 'tap' && !cancel) {
      const h = this.g.camera.tileAt(this.downPos.x, this.downPos.y);
      const t = this.tool;
      if (t === 'paste') this.pasteAt(h.x, h.y);
      else if (t && MACHINES[t]) this.place(h.x, h.y);
      else if (!t) {
        const b = this.g.factory.get(h.x, h.y);
        this.g.ui.select(b && b !== this.g.ui.selected ? b : null);
        if (b) this.g.audio.play('select');
      }
    }
    if (this.mode === 'select') {
      if (!this.selBuildings().length) this.sel = null;
      this.g.ui.refreshTools();
    }
    this.finishDrag();
    this.mode = null;
    if (this.touchMode) this.hover = null;
  }

  /* ---------- tastatur ---------- */
  keydown(e) {
    const g = this.g;
    if (!g.started) return;
    const k = e.key.toLowerCase();
    if (g.ui.modalOpen) {
      if (k === 'escape') g.ui.closeModal();
      return;
    }
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    this.interact();
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl) {
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); g.history.undo(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); g.history.redo(); }
      else if (k === 'c') { e.preventDefault(); this.copySel(false); }
      else if (k === 'x') { e.preventDefault(); this.copySel(true); }
      else if (k === 'v') { e.preventDefault(); if (this.clip) { this.tool = null; this.setTool('paste'); } }
      else if (k === 's') { e.preventDefault(); g.saveNow(true); }
      return;
    }
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    this.keys[k] = true;
    if (k === 'r') this.rotate(e.shiftKey);
    else if (k === 'q') this.pipette();
    else if (k === 'e') this.setTool('select');
    else if (k === 'x' || k === 'delete' || k === 'backspace') {
      if (this.sel) this.deleteSel();
      else if (g.ui.selected && k !== 'x') { const b = g.ui.selected; this.eraseAt(b.x, b.y); }
      else this.setTool('delete');
    } else if (k === 'escape') {
      if (this.tool) this.setTool(null);
      else if (this.sel) { this.sel = null; g.ui.refreshTools(); }
      else if (g.ui.selected) g.ui.select(null);
      else g.ui.openMenuModal();
    } else if (k === 'home') this.g.centerCamera();
    else if (/^[0-9]$/.test(k)) {
      const list = BUILD_ORDER.filter((t) => g.unlocked.has(t));
      const i = k === '0' ? 9 : +k - 1;
      if (list[i]) this.setTool(list[i]);
    }
  }
  update(dt) {
    const k = this.keys;
    let vx = 0, vy = 0;
    if (k.w || k.arrowup) vy -= 1;
    if (k.s || k.arrowdown) vy += 1;
    if (k.a || k.arrowleft) vx -= 1;
    if (k.d || k.arrowright) vx += 1;
    if (vx || vy) {
      const sp = 760 * dt * (k.shift ? 2 : 1);
      this.g.camera.pan(-vx * sp, -vy * sp);
      this.interact();
    }
  }

  /* ---------- overlay (ghost, markering) ---------- */
  ghost(type, r, cfg) {
    const def = MACHINES[type];
    return { type, def, r, cfg: Object.assign({}, def.cfg || {}, cfg || {}), status: 'idle', lvl: 1, anim: 0, flash: 0, items: [], vis: -1, moving: true, store: [], capacity: () => 1, job: null, progress: 0, dirOf: Building.prototype.dirOf };
  }
  drawGhost(ctx, type, r, cfg, x, y, ok, t) {
    const cam = this.g.camera, s = cam.s;
    const px = cam.sx(x * TILE), py = cam.sy(y * TILE);
    ctx.globalAlpha = 0.62;
    const gb = this.ghost(type, r, cfg);
    if (type === 'conveyor') drawBeltBase(ctx, gb, px, py, s, t, 2, true);
    else drawMachine(ctx, gb, px, py, s, t, s >= 18);
    ctx.globalAlpha = 1;
    ctx.fillStyle = ok ? 'rgba(61,220,132,.18)' : 'rgba(255,77,109,.28)';
    ctx.strokeStyle = ok ? 'rgba(61,220,132,.9)' : 'rgba(255,77,109,.95)';
    ctx.lineWidth = 2;
    roundRect(ctx, px + 1, py + 1, s - 2, s - 2, s * 0.16);
    ctx.fill();
    ctx.stroke();
  }
  drawOverlay(ctx, t) {
    const g = this.g, cam = g.camera, s = cam.s, h = this.hover;
    const tool = this.tool;
    if (h && tool && MACHINES[tool] && this.mode !== 'pan') {
      const ok = !this.check(tool, h.x, h.y);
      const cfg = this.cfgFor(tool);
      this.drawGhost(ctx, tool, this.rot, cfg, h.x, h.y, ok, t);
      // pris
      if (s >= 24) {
        ctx.font = '800 12px "Segoe UI", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = ok ? '#ffd23f' : '#ff4d6d';
        ctx.fillText(`${MACHINES[tool].cost} ◉`, cam.sx((h.x + 0.5) * TILE), cam.sy(h.y * TILE) - 6);
        ctx.textAlign = 'start';
      }
    } else if (h && tool === 'delete') {
      const b = g.factory.get(h.x, h.y);
      ctx.fillStyle = b ? 'rgba(255,77,109,.3)' : 'rgba(255,77,109,.1)';
      ctx.strokeStyle = 'rgba(255,77,109,.9)';
      ctx.lineWidth = 2;
      roundRect(ctx, cam.sx(h.x * TILE) + 1, cam.sy(h.y * TILE) + 1, s - 2, s - 2, s * 0.16);
      ctx.fill();
      ctx.stroke();
    } else if (h && tool === 'paste' && this.clip) {
      for (const c of this.clipPlaced(h.x, h.y)) {
        const ok = g.factory.inBounds(c.x, c.y) && !g.factory.get(c.x, c.y);
        this.drawGhost(ctx, c.t, c.r, c.c, c.x, c.y, ok, t);
      }
    } else if (h && !tool && !this.touchMode && this.mode !== 'pan') {
      ctx.strokeStyle = 'rgba(255,255,255,.18)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, cam.sx(h.x * TILE) + 1, cam.sy(h.y * TILE) + 1, s - 2, s - 2, s * 0.16);
      ctx.stroke();
    }
    if (this.sel) {
      const sl = this.sel;
      const x0 = Math.min(sl.x0, sl.x1), x1 = Math.max(sl.x0, sl.x1) + 1, y0 = Math.min(sl.y0, sl.y1), y1 = Math.max(sl.y0, sl.y1) + 1;
      const px = cam.sx(x0 * TILE), py = cam.sy(y0 * TILE);
      ctx.fillStyle = 'rgba(54,226,255,.08)';
      ctx.fillRect(px, py, (x1 - x0) * s, (y1 - y0) * s);
      ctx.strokeStyle = '#36e2ff';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.lineDashOffset = -t * 24;
      ctx.strokeRect(px, py, (x1 - x0) * s, (y1 - y0) * s);
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(54,226,255,.18)';
      for (const b of this.selBuildings()) ctx.fillRect(cam.sx(b.x * TILE) + 2, cam.sy(b.y * TILE) + 2, s - 4, s - 4);
    }
  }
}
</script>

<script>
'use strict';
// =========================
// UI
// =========================
const LOGO_SVG = `<defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36e2ff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient></defs>
<path d="M32 4 56.2 18v28L32 60 7.8 46V18z" fill="rgba(13,18,36,.9)" stroke="url(#lg1)" stroke-width="3.2" stroke-linejoin="round"/>
<path d="M32 15v17h17A17 17 0 0 0 32 15z" fill="#36e2ff"/>
<path d="M32 32h17L32 49z" fill="#ff4fd8"/>
<path d="M32 49V32H15z" fill="#ffd23f"/>
<path d="M15 32h17V15H15z" fill="#3ddc84" transform="rotate(0)"/>
<path d="M32 15v34M15 32h34" stroke="#070a14" stroke-width="2.2"/>`;
const COIN_SVG = `<circle cx="12" cy="12" r="10" fill="#ffd23f"/><circle cx="12" cy="12" r="7.2" fill="none" stroke="#b8860b" stroke-width="1.6"/><path d="M12 6.8 16.5 12 12 17.2 7.5 12z" fill="#b8860b"/>`;

/** level hvor en ting låses op (1 = fra start) */
function unlockLevelOf(id) {
  if (START_UNLOCKS.includes(id)) return 1;
  const i = LEVELS.findIndex((l) => l.unlock.includes(id));
  return i < 0 ? 99 : i + 2;
}
function unlockLabel(id) {
  if (id.startsWith('shape:')) return { icon: 'shape', name: 'Ny form: ' + SHAPE_TYPES[id.slice(6)].name, desc: 'Kan nu vælges i Generatoren.' };
  if (id.startsWith('color:')) return { icon: 'color', name: 'Ny farve: ' + COLORS[id.slice(6)].name, desc: 'Kan nu bruges i Painteren og Sorteren.' };
  return { icon: 'machine', name: MACHINES[id].name, desc: MACHINES[id].desc };
}

class UI {
  constructor(game) {
    this.g = game;
    this.selected = null;
    this.modalOpen = false;
    this.t = 0;
    this.tutT = 0;
    $$('[data-logo]').forEach((s) => (s.innerHTML = LOGO_SVG));
    $$('[data-coin]').forEach((s) => (s.innerHTML = COIN_SVG));
    this.bind();
  }
  bind() {
    const g = this.g;
    const on = (id, fn) => $(id).addEventListener('click', (e) => { g.audio.init(); fn(e); });
    on('#btn-orders', () => this.openMissions());
    on('#tb-mission', () => this.openMissions());
    on('#btn-stats', () => this.openStats());
    on('#btn-upgrades', () => this.openUpgrades());
    on('#btn-ach', () => this.openAchievements());
    on('#btn-menu', () => this.openMenuModal());
    on('#tool-rotate', () => g.input.rotate(false));
    on('#tool-select', () => g.input.setTool('select'));
    on('#tool-delete', () => g.input.setTool('delete'));
    on('#tool-pipette', () => g.ui.toast('💧', 'Pipette', 'Hold musen over en maskine og tryk Q', 'cyan', 2));
    on('#tool-undo', () => g.history.undo());
    on('#tool-redo', () => g.history.redo());
    on('#tool-center', () => g.centerCamera());
    on('#tool-cancel', () => {
      const i = g.input;
      if (i.tool) i.setTool(null);
      else if (i.sel) { i.sel = null; this.refreshTools(); }
      else this.select(null);
    });
    on('#modal-x', () => this.closeModal());
    $('#modal-back').addEventListener('pointerdown', (e) => { if (e.target.id === 'modal-back' && !this.modalLocked) this.closeModal(); });
    // menu
    on('#m-continue', () => g.enterGame());
    on('#m-new', () => this.confirm('Start nyt spil?', 'Din nuværende fabrik, dine coins og din progression bliver slettet. Det kan ikke fortrydes.', 'Start forfra', () => g.newGame(), true));
    on('#m-upgrades', () => this.openUpgrades());
    on('#m-ach', () => this.openAchievements());
    on('#m-settings', () => this.openSettings());
  }

  /* ---------- toasts ---------- */
  toast(icon, title, sub, cls = '', life = 3.2) {
    const el = document.createElement('div');
    el.className = 'toast ' + cls;
    el.style.setProperty('--life', life + 's');
    el.innerHTML = `<div class="ti">${icon}</div><div><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
    const box = $('#toasts');
    box.appendChild(el);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => el.remove(), (life + 0.5) * 1000);
  }

  /* ---------- byggemenu ---------- */
  buildList() {
    const g = this.g;
    const list = $('#build-list');
    list.innerHTML = '';
    let key = 0;
    for (const type of BUILD_ORDER) {
      const d = MACHINES[type];
      const unlocked = g.unlocked.has(type);
      const btn = document.createElement('button');
      btn.className = 'bitem' + (unlocked ? '' : ' locked') + (g.state.seenNew.includes(type) ? ' new' : '');
      btn.dataset.type = type;
      const k = unlocked && key < 10 ? (key + 1) % 10 : null;
      if (unlocked) key++;
      btn.innerHTML = `<canvas width="72" height="72"></canvas><div class="bn"><b>${esc(d.short)}</b><small>${unlocked ? '◉ ' + d.cost : '🔒 Level ' + unlockLevelOf(type)}</small></div>${k !== null ? `<span class="key">${k}</span>` : ''}`;
      btn.title = unlocked ? `${d.name} – ${d.desc}` : `${d.name} låses op i level ${unlockLevelOf(type)}`;
      if (unlocked) btn.addEventListener('click', () => { g.audio.init(); g.input.setTool(type); });
      list.appendChild(btn);
      paintMachineCanvas(btn.querySelector('canvas'), type, g.input.cfgFor(type));
    }
    this.refreshTools();
  }
  refreshTools() {
    const i = this.g.input;
    $$('.bitem').forEach((b) => {
      b.classList.toggle('sel', b.dataset.type === i.tool);
      if (b.dataset.type === i.tool) b.classList.remove('new');
    });
    $('#tool-select').classList.toggle('on', i.tool === 'select');
    $('#tool-delete').classList.toggle('on', i.tool === 'delete');
    $('#rot-ind').textContent = DIR_ARROW[i.tool === 'paste' ? i.pasteRot : i.rot];
    $('#tool-undo').disabled = false;
    // hint
    const t = i.tool;
    let h;
    if (!t) h = 'Klik på en maskine for info · <b>Træk</b> for at flytte kameraet · <b>1–0</b> vælg maskine';
    else if (t === 'conveyor') h = '<b>Træk</b> for at bygge bånd · <b>R</b> rotér · højreklik annullerer';
    else if (t === 'delete') h = '<b>Klik/træk</b> for at slette · <b>Esc</b> stop';
    else if (t === 'select') h = '<b>Træk</b> for at markere · <b>Ctrl+C</b> kopiér · <b>Ctrl+X</b> flyt · <b>Delete</b> slet';
    else if (t === 'paste') h = '<b>Klik</b> for at indsætte · <b>R</b> rotér · <b>Esc</b> annullér';
    else h = `<b>Klik</b> for at placere ${esc(MACHINES[t].name)} (◉ ${MACHINES[t].cost}) · <b>R</b> rotér ${DIR_ARROW[i.rot]} · <b>Q</b> kopiér maskine`;
    $('#hint').innerHTML = h;
    $('#hint').classList.toggle('hidden', !this.g.state.settings.hints);
    // markerings-/indsæt-bar
    const bar = $('#selbar');
    if (t === 'paste' && i.clip) {
      const cost = i.clip.reduce((n, c) => n + MACHINES[c.t].cost, 0);
      bar.innerHTML = `<span>Indsætter ${i.clip.length} bygninger · ◉ ${fmt(cost)}</span><button class="btn sm" data-a="rot">↻ Rotér</button><button class="btn sm" data-a="x">✕</button>`;
      bar.classList.remove('hidden');
    } else if (i.sel && i.mode !== 'select' && i.selBuildings().length) {
      bar.innerHTML = `<span>${i.selBuildings().length} markeret</span><button class="btn sm" data-a="copy">📋 Kopiér</button><button class="btn sm" data-a="cut">✂ Flyt</button><button class="btn sm danger" data-a="del">🗑 Slet</button><button class="btn sm" data-a="x">✕</button>`;
      bar.classList.remove('hidden');
    } else bar.classList.add('hidden');
    bar.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', () => {
      const a = b.dataset.a;
      if (a === 'rot') i.rotate(false);
      else if (a === 'copy') i.copySel(false);
      else if (a === 'cut') i.copySel(true);
      else if (a === 'del') i.deleteSel();
      else { i.sel = null; if (i.tool === 'paste' || i.tool === 'select') i.setTool(null); }
      this.refreshTools();
    }));
  }

  /* ---------- topbar ---------- */
  refreshTop() {
    const g = this.g, st = g.state;
    $('#tb-level').textContent = st.level;
    $('#tb-rank').textContent = 'RANG ' + st.rank;
    $('#tb-xp').style.width = Math.min(100, (st.xp / xpForRank(st.rank)) * 100) + '%';
    $('#tb-coins').textContent = fmt(st.coins);
    $('#tb-income').textContent = '+' + fmt(g.incomePerMin()) + ' / min';
    const m = g.missions;
    const goal = m.goal;
    if (this._goalKey !== goal.key) {
      this._goalKey = goal.key;
      paintShapeCanvas($('#mission-icon'), goal);
    }
    $('#mission-label').textContent = 'MISSION · LEVEL ' + st.level;
    $('#mission-title').textContent = `Lever: ${goal.describe()}`;
    $('#mission-bar').style.width = (st.progress / m.required) * 100 + '%';
    $('#mission-count').textContent = `${fmt(st.progress)}/${fmt(m.required)}`;
    $('#orders-dot').classList.toggle('hidden', !st.orders.some((o) => !o.done && o.got === 0) || st.level < ORDERS_FROM_LEVEL);
  }

  /* ---------- infopanel ---------- */
  select(b) {
    this.selected = b || null;
    const p = $('#infopanel');
    if (!b) { p.classList.add('hidden'); p.innerHTML = ''; return; }
    p.classList.remove('hidden');
    this.renderInfo();
  }
  speedText(b) {
    const g = this.g;
    if (b.type === 'conveyor') return fmtDec(g.upg.beltSpeed() * 2, 1) + '/s';
    if (b.type === 'output' || b.type === 'trash' || b.type === 'crossing') return '∞';
    if (b.type === 'storage') return fmtDec(1 / b.duration(), 1) + '/s';
    return fmtDec(1 / b.duration(), 2) + '/s';
  }
  renderInfo() {
    const b = this.selected, g = this.g;
    if (!b) return;
    const d = b.def;
    const p = $('#infopanel');
    const inN = b.type === 'conveyor' ? '3 sider' : d.inputs ? d.inputs.length : b.type === 'output' || b.type === 'trash' ? 'Alle' : b.type === 'crossing' ? '4' : 0;
    const outN = b.type === 'conveyor' ? 1 : d.outputs ? d.outputs.length : b.type === 'crossing' ? '4' : 0;
    const machine = b.type !== 'conveyor';
    const canUp = machine && b.lvl < MAX_MACHINE_LVL && !['output', 'trash', 'crossing'].includes(b.type);
    const upCost = this.mkCost(b);
    let cfg = '';
    const sh = (list, key, cur) => `<div class="opts">${list.map((s) => `<button class="opt ${cur === s ? 'sel' : ''}" data-cfg="${key}" data-v="${s}" title="${SHAPE_TYPES[s].name}"><canvas width="60" height="60" data-shape="${s}"></canvas></button>`).join('')}</div>`;
    const cl = (list, key, cur) => `<div class="opts">${list.map((c) => `<button class="opt sw ${cur === c ? 'sel' : ''}" data-cfg="${key}" data-v="${c}" title="${COLORS[c].name}" style="background:${COLORS[c].hex}"></button>`).join('')}</div>`;
    const shapes = SHAPE_ORDER.filter((s) => g.unlocked.has('shape:' + s));
    const colors = COLOR_ORDER.filter((c) => g.unlocked.has('color:' + c));
    if (b.type === 'generator') cfg = `<div class="ip-sec"><h4>FORM</h4>${sh(shapes, 'shape', b.cfg.shape)}</div>`;
    if (b.type === 'morpher') cfg = `<div class="ip-sec"><h4>FORVANDL TIL</h4>${sh(SHAPE_ORDER.filter((s) => g.unlocked.has('shape:' + s) || s === 'H'), 'shape', b.cfg.shape)}</div>`;
    if (b.type === 'painter') cfg = `<div class="ip-sec"><h4>FARVE</h4>${cl(colors, 'color', b.cfg.color)}</div>`;
    if (b.type === 'rotator') cfg = `<div class="ip-sec"><h4>RETNING</h4><div class="opts"><button class="opt ${!b.cfg.ccw ? 'sel' : ''}" data-cfg="ccw" data-v="0">↻ Med uret</button><button class="opt ${b.cfg.ccw ? 'sel' : ''}" data-cfg="ccw" data-v="1">↺ Mod uret</button></div></div>`;
    if (b.type === 'sorter') {

  modal(title, body, opts = {}) {
    $('#modal-title').textContent = title;
    const m = $('#modal');
    m.className = 'panel ' + (opts.size || '');
    const b = $('#modal-body');
    b.innerHTML = '';
    if (typeof body === 'string') b.innerHTML = body; else b.appendChild(body);
    const foot = $('#modal-foot');
    foot.innerHTML = '';
    foot.classList.toggle('hidden', !opts.buttons);
    for (const bt of opts.buttons || []) {
      const el = document.createElement('button');
      el.className = 'btn ' + (bt.cls || '');
      el.textContent = bt.label;
      el.addEventListener('click', () => { this.g.audio.play('click'); if (bt.fn() !== false) this.closeModal(); });
      foot.appendChild(el);
    }
    this.modalLocked = !!opts.locked;
    $('#modal-x').classList.toggle('hidden', !!opts.locked);
    $('#modal-back').classList.remove('hidden');
    this.modalOpen = true;
    this.onClose = opts.onClose || null;
    b.scrollTop = 0;
    return b;
  }
  closeModal() {
    $('#modal-back').classList.add('hidden');
    this.modalOpen = false;

  drawSpark(cv, data) {
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const n = 120;
    const arr = data.slice(-n);
    const max = Math.max(1, ...arr);
    ctx.strokeStyle = 'rgba(120,160,255,.12)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(0, (H / 4) * i); ctx.lineTo(W, (H / 4) * i); ctx.stroke(); }
    if (!arr.length) return;
    const step = W / (n - 1);
    const off = n - arr.length;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(54,226,255,.45)');
    grad.addColorStop(1, 'rgba(54,226,255,0)');
    ctx.beginPath();
    ctx.moveTo(off * step, H);
    arr.forEach((v, i) => ctx.lineTo((off + i) * step, H - (v / max) * (H - 16) - 4));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.beginPath();
    arr.forEach((v, i) => ctx.lineTo((off + i) * step, H - (v / max) * (H - 16) - 4));
    ctx.strokeStyle = '#36e2ff';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#8d98bd';
    ctx.font = '700 22px "Segoe UI", sans-serif';
    ctx.fillText('maks ' + max + '/s', 12, 28);
  }

      <div class="btn-row"><button class="btn sm" data-s="save">💾 GEM</button><button class="btn sm" data-s="load">📂 INDLÆS</button><button class="btn sm" data-s="export">⬇ EKSPORTÉR</button><button class="btn sm" data-s="import">⬆ IMPORTÉR</button><button class="btn sm danger" data-s="reset">⚠ NULSTIL</button></div>
      <input type="file" accept=".json,application/json" class="hidden" data-file></div>`;

  bindSaveSection(body) {
    const g = this.g;
    const file = body.querySelector('[data-file]');
    body.querySelectorAll('[data-s]').forEach((el) => el.addEventListener('click', () => {
      const a = el.dataset.s;
      if (a === 'save') { g.saveNow(true); }
      else if (a === 'load') this.confirm('Indlæs gemt spil?', 'Fabrikken genindlæses fra sidste gemte version. Ændringer siden sidste gem går tabt.', 'Indlæs', () => g.reloadFromSave());
      else if (a === 'export') {
        g.saveNow();
        const blob = new Blob([g.saver.exportText()], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `grejsfigur-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        this.toast('⬇', 'Gemt fil eksporteret', link.download, 'cyan');
      } else if (a === 'import') file.click();
      else if (a === 'reset') this.confirm('Nulstil ALT?', 'Hele din fabrik, alle coins, levels, upgrades og achievements slettes permanent. Er du helt sikker?', 'Ja, slet alt', () => {
        setTimeout(() => this.confirm('Sidste chance', 'Det kan IKKE fortrydes.', 'Nulstil', () => g.newGame(), true), 50);
      }, true);
    }));
    file.addEventListener('change', () => {
      const f = file.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          g.saver.importText(String(r.result));
          g.reloadFromSave();
          this.toast('⬆', 'Gemt spil importeret', '', 'cyan');
        } catch (e) { this.toast('⚠️', 'Kunne ikke importere', e.message, 'bad'); }
      };
      r.readAsText(f);
    });
  }

  /* ---------- tutorial ---------- */
  tutorialSteps() {
    const g = this.g;
    const cnt = (t) => (t === 'conveyor' ? g.factory.belts.length : g.factory.machines.filter((b) => b.type === t).length);

      { title: 'VELKOMMEN TIL GREJSFIGUR', text: 'Du skal bygge din første <b>automatiserede fabrik</b>, der producerer geometriske figurer. Følg trinene – det tager kun et minut.', btn: 'Kom i gang', check: () => cnt('generator') >= 1 },
      { title: '1. Placér en Generator', text: 'Vælg <b>Generator</b> i byggemenuen (tast <kbd>2</kbd>) og klik på kortet. Tryk <kbd>R</kbd> for at dreje den – den farvede pil viser, hvor figurerne kommer ud.', check: () => cnt('generator') >= 1 },

      { title: '5. Fuldfør Level 1', text: 'Lever <b>20 grå cirkler</b>. Din mission står øverst. Flere generatorer = hurtigere!', check: () => g.state.level >= 2 },
      { title: 'Godt gået! 🎉', text: 'Nu kører det. Smarte tricks: <kbd>Q</kbd> kopierer en maskine, <kbd>E</kbd> markerer et område (<kbd>Ctrl+C</kbd>/<kbd>Ctrl+V</kbd>), højreklik sletter, <kbd>Ctrl+Z</kbd> fortryder. Hjulet zoomer og <kbd>WASD</kbd> flytter kameraet.', btn: 'Forstået' }
    ];
  }
  renderTutorial() {
    const g = this.g;
    const steps = this.tutorialSteps();
    const i = g.state.tut;
    const box = $('#tutorial');
    if (i >= steps.length) { box.classList.add('hidden'); return; }
    const s = steps[i];
    box.classList.remove('hidden');
    box.innerHTML = `<h4>TUTORIAL · ${i + 1}/${steps.length}</h4><h3>${s.title}</h3><p>${s.text}</p>
      <div class="steps">${steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="row">${s.btn ? `<button class="btn sm primary" data-t="next">${s.btn}</button>` : ''}<button class="btn sm" data-t="skip">Spring over</button></div>`;
    box.querySelectorAll('[data-t]').forEach((el) => el.addEventListener('click', () => {
      g.state.tut = el.dataset.t === 'skip' ? steps.length : i + 1;
      g.audio.play('click');
      this.renderTutorial();
    }));
  }
  checkTutorial() {
    const steps = this.tutorialSteps();
    const i = this.g.state.tut;
    if (i >= steps.length) return;
    const s = steps[i];
    if (s.check && s.check()) {
      this.g.state.tut++;
      this.g.audio.play('select');
      this.renderTutorial();
    }
  }

  /* ---------- per-frame ---------- */
  frame(dt) {
    this.t += dt;
    if (this.t >= 0.25) {
      this.t = 0;
      this.refreshTop();
      if (this.selected && this.g.factory.get(this.selected.x, this.selected.y) !== this.selected) this.select(null);
      this.updateInfo();
    }
    this.tutT += dt;
    if (this.tutT > 0.5) { this.tutT = 0; this.checkTutorial(); }
  }

  /* ---------- konfetti ---------- */
  confetti() {
    if (!this.g.state.settings.fx) return;
    const cv = $('#fx');
    const ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr;
    cv.height = innerHeight * dpr;
    const cols = ['#36e2ff', '#ff4fd8', '#ffd23f', '#3ddc84', '#b26bff', '#ff4d6d'];
    const ps = Array.from({ length: 160 }, () => ({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.42,
      vx: (Math.random() - 0.5) * 900, vy: -300 - Math.random() * 700, r: Math.random() * 6, vr: (Math.random() - 0.5) * 12,
      s: 5 + Math.random() * 7, c: cols[(Math.random() * cols.length) | 0], k: (Math.random() * 3) | 0
    }));
    let last = performance.now(), life = 0;
    const step = (ts) => {
      const dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      life += dt;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of ps) {
        p.vy += 900 * dt; p.vx *= 0.99;
        p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - life / 3);
        ctx.fillStyle = p.c;
        if (p.k === 0) ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        else if (p.k === 1) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2.4, 0, Math.PI * 2); ctx.fill(); }
        else { ctx.beginPath(); ctx.moveTo(0, -p.s / 2); ctx.lineTo(p.s / 2, p.s / 2); ctx.lineTo(-p.s / 2, p.s / 2); ctx.fill(); }
        ctx.restore();
      }
      if (life < 3) requestAnimationFrame(step);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    };
    requestAnimationFrame(step);
  }

  /* ---------- startmenu ---------- */
  showMenu() {
    const g = this.g;
    $('#menu').classList.remove('out');
    $('#hud').classList.add('hidden');
    const has = g.hasSave;
    $('#m-continue').textContent = has ? '▶ FORTSÆT' : '▶ START SPIL';
    $('#m-new').classList.toggle('hidden', !has);
    $('#m-save').innerHTML = has ? `Level ${g.state.level} · ◉ ${fmt(g.state.coins)} · ${fmt(g.factory.count)} bygninger · gemt kl. ${fmtClock(g.state.t)}` : 'Byg • automatisér • optimér – din første fabrik venter.';
    this.menuBg();
  }
  hideMenu() {
    $('#menu').classList.add('out');
    $('#hud').classList.remove('hidden');
    cancelAnimationFrame(this._menuRaf);
  }
  menuBg() {
    const cv = $('#menu-bg');
    const ctx = cv.getContext('2d');
    const keys = ['CrCrCrCr', 'SbSbSbSb', 'TyTyTyTy', 'DgDgDgDg', 'HpHpHpHp', 'CcCcSpSp', 'SrSr----', 'DwDwDwDw:CbCbCbCb', 'HyHyHyHy', 'TrTrCgCg', 'CpCp----:SySySySy', 'Hc----Hc'];
    const items = Array.from({ length: 34 }, (_, i) => ({
      s: Shape.get(keys[i % keys.length]), x: Math.random(), y: Math.random(), z: 0.3 + Math.random() * 0.9,
      r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, vy: 0.008 + Math.random() * 0.02
    }));
    let last = performance.now();
    const step = (ts) => {
      const dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = innerWidth, H = innerHeight;
      if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      // perspektiv-grid
      ctx.strokeStyle = 'rgba(54,226,255,.07)';
      ctx.lineWidth = 1;
      const off = (ts / 40) % 60;
      ctx.beginPath();
      for (let y = H * 0.62 + off * 0.5; y < H; y += 30 + (y - H * 0.6) * 0.25) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      for (let i = -12; i <= 12; i++) { ctx.moveTo(W / 2 + i * 30, H * 0.6); ctx.lineTo(W / 2 + i * 220, H); }
      ctx.stroke();
      for (const it of items) {
        it.y -= it.vy * dt * it.z;
        it.r += it.vr * dt;
        if (it.y < -0.1) { it.y = 1.1; it.x = Math.random(); }
        const size = 26 + it.z * 46;
        ctx.save();
        ctx.globalAlpha = 0.18 + it.z * 0.35;
        ctx.translate(it.x * W, it.y * H);
        ctx.rotate(it.r);
        drawShape(ctx, it.s, 0, 0, size);
        ctx.restore();
      }
      this._menuRaf = requestAnimationFrame(step);
    };
    cancelAnimationFrame(this._menuRaf);
    this._menuRaf = requestAnimationFrame(step);
  }
}

// =========================
// GAME
// =========================
const STEP = 1 / 30;
const OFFLINE_CAP = 8 * 3600;
class Game {
  constructor() {
    this.camera = new Camera();
    this.factory = new Factory(this);
    this.upg = new UpgradeSystem(this);
    this.missions = new MissionSystem(this);
    this.saver = new SaveSystem(this);
    this.audio = new AudioFX(this);
    this.history = new History(this);
    this.renderer = new Renderer(this, $('#game'));
    this.applyLoaded(this.saver.load());
    this.input = new Input(this);
    this.ui = new UI(this);
    this.started = false;
    this.acc = 0;
    this.secT = 0;
    this.saveT = 0;
    this.lastT = performance.now() / 1000;
    this.coinFrac = 0;
    window.addEventListener('resize', () => this.renderer.resize());
    this.renderer.resize();
    document.addEventListener('visibilitychange', () => this.onVisibility());
    window.addEventListener('pagehide', () => this.saveNow());
    window.addEventListener('beforeunload', () => this.saveNow());
    this.ui.showMenu();
    requestAnimationFrame((t) => this.loop(t));
  }
  applyLoaded({ state, stats, fresh }) {
    this.state = state;
    this.stats = stats;
    this.hasSave = !fresh;
    this.unlocked = new Set(state.unlocked);
    this.factory.load(state.buildings);
    this.state.buildings = [];
    this.camera.x = state.cam.x || 0;
    this.camera.y = state.cam.y || 0;
    this.camera.z = clamp(state.cam.z || 1, 0.22, 3);
    this.history.clear();
    this.rate = { gen: 0, del: 0, coins: 0 };
    this.series = { del: [], coins: [], gen: [] };
    this.window = { t: 0, coins: 0, shapes: 0, keys: {} };
    this.sessionT = 0;
    this.lastInteract = now();
    this.delSinceInteract = 0;
    this.missions.refillOrders();
  }

  /* ---------- flow ---------- */
  enterGame() {
    this.audio.init();
    this.ui.hideMenu();
    this.ui.buildList();
    this.ui.refreshTop();
    this.ui.renderTutorial();
    this.renderer.resize();
    const wasStarted = this.hasSave;
    this.started = true;
    this.hasSave = true;
    if (wasStarted) this.applyOffline(this.state.t);
    this.state.t = Date.now();
    this.saveNow();
  }
  toMenu() {
    this.saveNow();
    this.started = false;
    this.ui.select(null);
    this.ui.showMenu();
  }
  newGame() {
    this.saver.reset();
    this.applyLoaded({ state: defaultState(), stats: defaultStats(), fresh: true });
    this.ui.select(null);
    this.input.tool = null;
    this.input.sel = null;
    this.input.clip = null;
    this.ui._goalKey = null;
    this.ui.closeModal();
    this.enterGame();
  }
  reloadFromSave() {
    this.applyLoaded(this.saver.load());
    this.ui.select(null);
    this.ui._goalKey = null;
    this.ui.buildList();
    this.ui.refreshTop();
    this.ui.renderTutorial();
    this.toast('📂', 'Spil indlæst', `Level ${this.state.level}`);
  }
  toast(...a) { this.ui.toast(...a); }
  saveNow(show) {
    if (!this.started && !this.hasSave) return;
    const ok = this.saver.save();
    if (show) this.toast(ok ? '💾' : '⚠️', ok ? 'Spillet er gemt' : 'Kunne ikke gemme', ok ? fmtClock(Date.now()) : 'Browseren tillader ikke lokal lagring', ok ? 'cyan' : 'bad', 2);
  }
  centerCamera() {
    const bs = Array.from(this.factory.map.values());
    if (!bs.length) { this.camera.x = 0; this.camera.y = 0; return; }
    this.camera.x = (bs.reduce((n, b) => n + b.x, 0) / bs.length + 0.5) * TILE;
    this.camera.y = (bs.reduce((n, b) => n + b.y, 0) / bs.length + 0.5) * TILE;
  }

  /* ---------- økonomi ---------- */
  spend(c) {
    if (this.state.coins < c) return false;
    this.state.coins -= c;
    return true;
  }
  addCoins(c) {
    this.state.coins += c;
    this.stats.coinsEarned += c;
  }
  addXp(n) {
    const st = this.state;
    st.xp += n;
    while (st.xp >= xpForRank(st.rank)) {
      st.xp -= xpForRank(st.rank);
      st.rank++;
      const bonus = 40 * st.rank;
      this.addCoins(bonus);
      this.toast('🎖️', `Rang ${st.rank}!`, `Bonus ◉ ${fmt(bonus)}`, 'gold');
      this.audio.play('ach');
    }
  }
  /** sæt et felt til data (eller tom) og håndtér coins – bruges af History */
  setTile(x, y, data) {
    const f = this.factory;
    const old = f.get(x, y);
    const diff = invOf(data) - (old ? old.inv : 0);
    if (diff > 0 && this.state.coins < diff) return false;
    if (data && !this.unlocked.has(data.t)) return false;
    this.state.coins -= diff;
    if (old && data && old.type === data.t) {
      // samme type: opdatér på stedet (bevar figurer på båndet)
      old.r = data.r || 0;
      old.cfg = Object.assign({}, old.def.cfg || {}, data.c || {});
      old.lvl = data.l || 1;
      old.off = !!data.o;
      old.inv = invOf(data);
      f.markDirty();
      return true;
    }
    if (old) f.remove(x, y);
    if (data) f.create(Object.assign({}, data, { x, y }));
    return true;
  }
  onBuilt(type, x, y, quiet) {
    this.stats.built++;
    if (type === 'conveyor') this.stats.beltsBuilt++;
    if (!quiet && type !== 'conveyor') this.renderer.spark(x, y, MACHINES[type].color, 10);
    this.checkAchievements();
  }
  deliver(shape, out) {
    const isGoal = !this.state.levelDone && shape.key === this.missions.levelDef().goal;
    const coins = shape.value * this.upg.outputMult() * (isGoal ? 1.5 : 1);
    this.addCoins(coins);
    out.popCoins += coins;
    const s = this.stats;
    s.delivered++;
    if (s.keys[shape.key] !== undefined || Object.keys(s.keys).length < 400) s.keys[shape.key] = (s.keys[shape.key] || 0) + 1;
    if (shape.hasColor()) {
      s.painted++;
      for (const c of shape.colorSet()) if (!s.colors.includes(c)) s.colors.push(c);
    }
    if (shape.layers.length > s.maxLayers) s.maxLayers = shape.layers.length;
    if (shape.hasShape('H')) s.hex++;
    this.rate.del++;
    this.rate.coins += coins;
    const w = this.window;
    w.coins += coins;
    w.shapes++;
    w.keys[shape.key] = (w.keys[shape.key] || 0) + 1;
    this.delSinceInteract++;
    this.addXp(shape.value * 0.5);
    this.missions.onDeliver(shape);
    this.audio.play('deliver');
    if (Math.random() < 0.25) this.renderer.spark(out.x, out.y, '#ffd23f', 3);
    this.checkMilestones();
  }
  completeLevel() {
    const st = this.state;
    if (!st.levelDone) return;
    const lvl = st.level;
    const def = this.missions.levelDef(lvl);
    this.addCoins(def.coins);
    this.addXp(Math.round(def.coins * 0.3));
    const unlocks = [];
    for (const id of def.unlock) {
      if (this.unlocked.has(id)) continue;
      this.unlocked.add(id);
      unlocks.push({ id, label: unlockLabel(id) });
      if (MACHINES[id]) st.seenNew.push(id);
    }
    st.level++;
    st.progress = 0;
    st.levelDone = false;
    this.missions.refillOrders();
    this.ui.buildList();
    this.ui._goalKey = null;
    this.ui.refreshTop();
    this.audio.play('levelup');
    this.ui.showLevelComplete(lvl, def, unlocks);
    this.checkAchievements();
    this.saveNow();
  }
  completeOrder(o) {
    this.addCoins(o.coins);
    this.addXp(o.xp);
    this.stats.ordersDone++;
    this.audio.play('mission');
    this.toast('📋', 'Ordre leveret!', `${Shape.get(o.key).describe()} · ◉ +${fmt(o.coins)}`, 'gold');
    setTimeout(() => { this.missions.refillOrders(); }, 1500);
  }
  checkMilestones() {
    const st = this.state;
    for (const m of MILESTONES) {
      if (st.ms[m.n] || this.stats.delivered < m.n) continue;
      st.ms[m.n] = 1;
      this.addCoins(m.coins);
      this.addXp(m.xp);
      this.audio.play('mission');
      this.toast('🏁', `MILESTONE: ${fmt(m.n)} figurer`, `◉ +${fmt(m.coins)} · +${fmt(m.xp)} XP`, 'gold', 4);
    }
  }
  checkAchievements() {
    const st = this.state;
    for (const a of ACHIEVEMENTS) {
      if (st.ach[a.id]) continue;
      let ok = false;
      try { ok = a.test(this); } catch (e) { ok = false; }
      if (!ok) continue;
      st.ach[a.id] = Date.now();
      if (a.coins) this.addCoins(a.coins);
      if (a.xp) this.addXp(a.xp);
      this.audio.play('ach');
      this.toast(a.icon, 'ACHIEVEMENT: ' + a.name, a.desc + (a.coins ? ` · ◉ +${fmt(a.coins)}` : ''), 'gold', 4);
    }
  }

  /* ---------- statistik ---------- */
  incomePerMin() { return this.series.coins.slice(-60).reduce((a, b) => a + b, 0); }
  factorySummary() {
    const f = this.factory;
    const st = { working: 0, waiting: 0, noinput: 0, off: 0 };
    let util = 0, n = 0;
    for (const b of f.machines) {
      if (b.type === 'output' || b.type === 'trash' || b.type === 'crossing') continue;
      st[b.status] = (st[b.status] || 0) + 1;
      util += b.util;
      n++;
    }
    let used = 0, blocked = 0;
    for (const b of f.belts) { if (b.items.length) used++; if (b.items.length && !b.moving) blocked++; }
    const perMin = this.series.del.slice(-60).reduce((a, b) => a + b, 0);
    const gl = this.series.gen.slice(-10);
    const genPerSec = gl.length ? gl.reduce((a, b) => a + b, 0) / gl.length : 0;
    let advice = 'Alt kører fint. Byg videre og udvid produktionen!';
    if (!n) advice = 'Byg en generator, nogle transportbånd og en levering for at komme i gang.';
    else if (st.waiting > n * 0.3) advice = `${st.waiting} maskiner venter, fordi deres output er blokeret. Byg flere leveringer, del strømmen med splittere eller opgradér båndhastigheden.`;
    else if (st.noinput > n * 0.4) advice = `${st.noinput} maskiner mangler input. Byg flere generatorer eller opgradér produktionseffektiviteten.`;
    else if (blocked > f.belts.length * 0.3) advice = 'Mange bånd står stille. Find maskinen for enden af køen – den er din flaskehals.';
    return {
      perMin, genPerSec, income: this.incomePerMin(), st,
      machineUtil: n ? Math.round((util / n) * 100) : 0,
      beltUtil: f.belts.length ? Math.round((used / f.belts.length) * 100) : 0,
      beltsBlocked: blocked, advice
    };
  }
  onSecond() {
    const s = this.series;
    s.del.push(this.rate.del);
    s.coins.push(this.rate.coins);
    s.gen.push(this.rate.gen);
    for (const k in s) if (s[k].length > 120) s[k].shift();
    this.rate = { gen: 0, del: 0, coins: 0 };
    this.stats.playTime++;
    this.sessionT++;
    const minute = s.del.slice(-60).reduce((a, b) => a + b, 0);
    if (minute > this.stats.bestMinute) this.stats.bestMinute = minute;
    // automation: 5 min uden interaktion og 100 leveringer
    if (!this.stats.automation && now() - this.lastInteract >= 300 && this.delSinceInteract >= 100) this.stats.automation = 1;
    // AFK-rater (målt over 60 sek.)
    const w = this.window;
    w.t++;
    if (w.t >= 60) {
      const r = this.state.rates;
      r.coins = w.coins / w.t;
      r.shapes = w.shapes / w.t;
      r.keys = {};
      for (const k in w.keys) r.keys[k] = w.keys[k] / w.t;
      this.window = { t: 0, coins: 0, shapes: 0, keys: {} };
    }
    if (this.sessionT % 2 === 0) this.checkAchievements();
    this.saveT++;
    if (this.saveT >= 20) { this.saveT = 0; this.saveNow(); }
  }
  /** AFK-produktion beregnet ud fra målte rater */
  applyOffline(fromT) {
    const to = Date.now();
    const raw = (to - fromT) / 1000;
    const r = this.state.rates;
    if (raw < 60 || !(r.coins > 0)) return;
    const sec = Math.min(raw, OFFLINE_CAP);
    const shapes = Math.floor(r.shapes * sec);
    const coins = Math.floor(r.coins * sec);
    if (shapes <= 0 && coins <= 0) return;
    this.addCoins(coins);
    this.stats.delivered += shapes;
    this.addXp(coins * 0.3);
    for (const k in r.keys) {
      if (!Shape.valid(k)) continue;
      const n = Math.floor(r.keys[k] * sec);
      if (n > 0) this.missions.onDeliver(Shape.get(k), n);
    }
    this.stats.afk++;
    this.checkMilestones();
    this.checkAchievements();
    this.ui.showOffline({ from: fromT, to, sec, shapes, coins, capped: raw > OFFLINE_CAP });
  }
  onVisibility() {
    if (!this.started) return;
    if (document.hidden) {
      this.saveNow();
      this.hiddenAt = Date.now();
    } else if (this.hiddenAt) {
      const from = this.hiddenAt;
      this.hiddenAt = 0;
      this.applyOffline(from);
      this.lastT = performance.now() / 1000;
    }
  }

  /* ---------- loop ---------- */
  loop(ts) {
    const t = ts / 1000;
    const dt = Math.min(0.1, t - this.lastT);
    this.lastT = t;
    if (this.started) {
      this.acc += dt;
      let n = 0;
      while (this.acc >= STEP && n < 6) { this.factory.update(STEP); this.acc -= STEP; n++; }
      if (n >= 6) this.acc = 0;
      this.secT += dt;
      while (this.secT >= 1) { this.secT -= 1; this.onSecond(); }
      this.input.update(dt);
      this.renderer.render(dt, t);
      this.ui.frame(dt);
    }
    requestAnimationFrame((tt) => this.loop(tt));
  }
}

// BOOT

window.addEventListener('DOMContentLoaded', () => {
  window.GF = new Game();
});
</script>
