<script>
/* ---- js/core/fx.js ---- */
/* =========================================================
   FX – pooled particles, floating text and screen shake for a
   canvas. One FX.System per stage.
   ========================================================= */
BF.FX = (function () {
  const U = BF.U;

  class System {
    constructor(max = 600) {
      this.max = max;
      this.pool = [];
      this.live = [];
      this.texts = [];
      this.shakeT = 0; this.shakeAmp = 0;
      this.ox = 0; this.oy = 0;
    }
    get settings() { return (BF.save && BF.save.settings) || {}; }

    _get() {
      const p = this.pool.pop() || {};
      p.rot = 0; p.vr = 0; p.grav = 0; p.drag = 0; p.grow = 0; p.shape = 'circle'; p.glow = false; p.floor = null;
      return p;
    }

    /**
     * Emit n particles of a preset type.
     * opts: {n, color, colors, speed, spread(angle rad), angle, size, life}
     */
    emit(type, x, y, opts = {}) {
      const s = this.settings;
      if (s.particles === false && !opts.force) return;
      let n = opts.n || 10;
      if (s.performance) n = Math.ceil(n / 2);
      for (let i = 0; i < n; i++) {
        if (this.live.length >= this.max) return;
        const p = this._get();
        const ang = (opts.angle != null ? opts.angle : -Math.PI / 2) + U.rand(-1, 1) * (opts.spread != null ? opts.spread : Math.PI);
        const sp = (opts.speed || 200) * U.rand(0.4, 1);
        p.x = x + U.rand(-1, 1) * (opts.jitter || 0); p.y = y + U.rand(-1, 1) * (opts.jitterY != null ? opts.jitterY : (opts.jitter || 0));
        p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp;
        p.color = opts.colors ? U.pick(opts.colors) : (opts.color || '#ffd27a');
        p.size = (opts.size || 3) * U.rand(0.6, 1.3);
        p.life = p.maxLife = (opts.life || 0.6) * U.rand(0.6, 1.2);
        p.type = type;
        switch (type) {
          case 'spark': p.grav = 600; p.drag = 1.5; p.shape = 'streak'; p.glow = true; break;
          case 'ember': p.grav = -60; p.drag = 0.8; p.glow = true; break;
          case 'smoke': p.grav = -40; p.drag = 1.2; p.grow = 18; p.shape = 'soft'; break;
          case 'debris': p.grav = 900; p.drag = 0.3; p.shape = 'square'; p.vr = U.rand(-10, 10); p.floor = opts.floor || null; break;
          case 'confetti': p.grav = 260; p.drag = 1.8; p.shape = 'square'; p.vr = U.rand(-12, 12); break;
          case 'star': p.grav = 0; p.drag = 2.5; p.shape = 'star'; p.vr = U.rand(-4, 4); p.glow = true; break;
          case 'drip': p.grav = 700; p.drag = 0.2; p.glow = true; break;
          case 'ring': p.vx = 0; p.vy = 0; p.shape = 'ring'; p.grow = opts.grow || 160; break;
          case 'magic': p.grav = -30; p.drag = 2; p.glow = true; p.shape = 'star'; break;
          default: break;
        }
        this.live.push(p);
      }
    }

    /** Floating combat / feedback text. */
    text(x, y, str, opts = {}) {
      if (this.texts.length > 40) this.texts.shift();
      this.texts.push({
        x, y, str, color: opts.color || '#fff', size: opts.size || 22, life: opts.life || 1.0, maxLife: opts.life || 1.0,
        vy: opts.rise != null ? -opts.rise : -50, stroke: opts.stroke || '#2a1a10', font: opts.font || 'Baloo 2', weight: opts.weight || 800,
        pop: opts.pop !== false,
      });
    }

    shake(amp = 6, dur = 0.25) {
      if (this.settings.shake === false) return;
      this.shakeAmp = Math.max(this.shakeAmp, amp);
      this.shakeT = Math.max(this.shakeT, dur);
    }

    update(dt) {
      for (let i = this.live.length - 1; i >= 0; i--) {
        const p = this.live[i];
        p.life -= dt;
        if (p.life <= 0) { this.live.splice(i, 1); this.pool.push(p); continue; }
        p.vy += p.grav * dt;
        const d = Math.max(0, 1 - p.drag * dt);
        p.vx *= d; p.vy *= d;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt;
        p.size += p.grow * dt;
        if (p.floor != null && p.y > p.floor) { p.y = p.floor; p.vy *= -0.35; p.vx *= 0.6; }
      }
      for (let i = this.texts.length - 1; i >= 0; i--) {
        const t = this.texts[i];
        t.life -= dt; t.y += t.vy * dt; t.vy *= 0.97;
        if (t.life <= 0) this.texts.splice(i, 1);
      }
      if (this.shakeT > 0) {
        this.shakeT -= dt;
        const a = this.shakeAmp * Math.max(0, this.shakeT) * 4;
        this.ox = U.rand(-1, 1) * Math.min(a, this.shakeAmp);
        this.oy = U.rand(-1, 1) * Math.min(a, this.shakeAmp);
        if (this.shakeT <= 0) { this.ox = this.oy = 0; this.shakeAmp = 0; }
      }
    }

    draw(ctx) {
      const perf = this.settings.performance;
      ctx.save();
      for (const p of this.live) {
        const a = U.clamp(p.life / p.maxLife, 0, 1);
        ctx.globalAlpha = p.type === 'smoke' ? a * 0.35 : a;
        if (p.glow && !perf) ctx.globalCompositeOperation = 'lighter';
        else ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
        switch (p.shape) {
          case 'streak': {
            ctx.lineWidth = p.size * 0.8; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
            break;
          }
          case 'square':
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * (p.type === 'confetti' ? 0.5 : 1));
            ctx.restore(); break;
          case 'soft': {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); break;
          }
          case 'ring':
            ctx.lineWidth = 3 * a + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.stroke(); break;
          case 'star':
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); BF.FX.starPath(ctx, 0, 0, p.size, p.size * 0.45, 4); ctx.fill(); ctx.restore(); break;
          default:
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
      // floating text
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const t of this.texts) {
        const k = 1 - t.life / t.maxLife;
        const sc = t.pop ? (k < 0.15 ? U.easeOutBack(k / 0.15) : 1) : 1;
        ctx.globalAlpha = U.clamp(t.life / t.maxLife * 2, 0, 1);
        ctx.font = `${t.weight} ${Math.round(t.size * sc)}px "${t.font}", "Trebuchet MS", sans-serif`;
        ctx.lineWidth = Math.max(3, t.size / 5); ctx.lineJoin = 'round';
        ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, t.x, t.y);
        ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y);
      }
      ctx.restore();
    }

    clear() { this.pool.push(...this.live); this.live.length = 0; this.texts.length = 0; }
  }

  function starPath(ctx, x, y, r1, r2, points = 5) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 ? r2 : r1;
      const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.closePath();
  }

  return { System, starPath };
})();

</script>
<script>
/* ---- js/core/draw.js ---- */
/* =========================================================
   DRAW – the procedural art library.
   Every character, monster, weapon and backdrop is drawn in
   code with chunky outlines (no external images needed).
   Convention: characters are drawn facing RIGHT with their
   feet at (0,0); pass dir:-1 to mirror.
   ========================================================= */
BF.Draw = (function () {
  const U = BF.U;
  const OUT = '#2a1a10';
  const TAU = Math.PI * 2;

  /* ---------------- primitives ---------------- */
  function ell(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
  function circ(ctx, x, y, r) { ell(ctx, x, y, r, r); }
  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    r = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fs(ctx, fill, lw = 3, stroke = OUT) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
  }
  function line(ctx, x1, y1, x2, y2, color = OUT, lw = 3) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
  }
  function tri(ctx, x1, y1, x2, y2, x3, y3) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); }
  function shadow(ctx, x, y, rx, a = 0.25) { ctx.save(); ctx.globalAlpha = a; ell(ctx, x, y, rx, rx * 0.28); ctx.fillStyle = '#000'; ctx.fill(); ctx.restore(); }
  function eye(ctx, x, y, r, look = 1, pupil = '#1a1010', white = '#fff') {
    circ(ctx, x, y, r); fs(ctx, white, Math.max(1.2, r * 0.35));
    circ(ctx, x + look * r * 0.3, y, r * 0.55); ctx.fillStyle = pupil; ctx.fill();
    circ(ctx, x + look * r * 0.1, y - r * 0.3, r * 0.22); ctx.fillStyle = '#fff'; ctx.fill();
  }

  /* ---------------- metal colours ---------------- */
  function metalOf(w) {
    const m = BF.DATA.materials[w && w.materialId] || BF.DATA.materials.iron;
    return m;
  }
  /** Gradient for a metal part; heat 0..1 blends toward glowing orange. */
  function metalGrad(ctx, m, x0, x1, heat = 0) {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    const hot = (c) => (heat > 0 ? U.mix(c, heat > 0.6 ? '#fff0a0' : '#ff7a1a', U.clamp(heat, 0, 1)) : c);
    g.addColorStop(0, hot(m.light));
    g.addColorStop(0.45, hot(m.color));
    g.addColorStop(1, hot(m.dark));
    return g;
  }

  /* =========================================================
     WEAPONS  – local frame: grip at (0,0), weapon points UP (-y)
     ========================================================= */
  const SHAPES = {
    sword: {
      short:  { len: 40, w: 7 },  long: { len: 54, w: 7 }, knight: { len: 58, w: 9 }, heavy: { len: 60, w: 13 }, dragon: { len: 64, w: 11 },
    },
  };

  /** Build the path of the MAIN (cast) part. */
  function mainPath(ctx, type, shape) {
    ctx.beginPath();
    switch (type) {
      case 'sword': {
        const s = SHAPES.sword[shape] || SHAPES.sword.long;
        const L = s.len, w = s.w;
        if (shape === 'dragon') {
          ctx.moveTo(-w * 0.6, -10);
          for (let i = 0; i <= 6; i++) { const y = -10 - (L - 14) * (i / 6); ctx.lineTo(-w * (i % 2 ? 0.9 : 0.55), y); }
          ctx.lineTo(0, -10 - L);
          for (let i = 6; i >= 0; i--) { const y = -10 - (L - 14) * (i / 6); ctx.lineTo(w * (i % 2 ? 0.55 : 0.9), y); }
          ctx.closePath();
        } else if (shape === 'heavy') {
          ctx.moveTo(-w / 2, -10); ctx.lineTo(-w / 2 - 2, -10 - L * 0.7); ctx.lineTo(-w * 0.2, -10 - L); ctx.lineTo(w / 2 + 1, -10 - L * 0.85); ctx.lineTo(w / 2, -10); ctx.closePath();
        } else {
          ctx.moveTo(-w / 2, -10); ctx.lineTo(-w / 2, -10 - L + w * 1.3); ctx.lineTo(0, -10 - L); ctx.lineTo(w / 2, -10 - L + w * 1.3); ctx.lineTo(w / 2, -10); ctx.closePath();
        }
        break;
      }
      case 'axe': {
        const big = shape === 'war' || shape === 'frost' ? 1.3 : shape === 'battle' ? 1.12 : 1;
        const top = -44 * (shape === 'small' ? 0.85 : 1);
        ctx.moveTo(2, top + 2); // blade (right side)
        ctx.quadraticCurveTo(14 * big, top - 6 * big, 24 * big, top - 10 * big);
        ctx.quadraticCurveTo(18 * big, top + 11 * big, 24 * big, top + 30 * big);
        ctx.quadraticCurveTo(14 * big, top + 24 * big, 2, top + 18 * big);
        if (shape === 'battle' || shape === 'war' || shape === 'frost') { // back blade
          ctx.lineTo(-2, top + 18 * big);
          ctx.quadraticCurveTo(-11 * big, top + 22 * big, -17 * big, top + 26 * big);
          ctx.quadraticCurveTo(-13 * big, top + 9 * big, -17 * big, top - 6 * big);
          ctx.quadraticCurveTo(-10 * big, top - 2 * big, -2, top + 2);
        } else {
          ctx.lineTo(-5, top + 16); ctx.lineTo(-5, top + 4); ctx.lineTo(-2, top + 2);
        }
        ctx.closePath();
        break;
      }
      case 'hammer': {
        const top = -46;
        if (shape === 'maul') { ctx.rect(-17, top - 6, 34, 24); }
        else if (shape === 'war') { ctx.moveTo(-13, top); ctx.lineTo(10, top); ctx.lineTo(22, top + 7); ctx.lineTo(10, top + 14); ctx.lineTo(-13, top + 14); ctx.closePath(); }
        else if (shape === 'thunder') { ctx.moveTo(-18, top - 6); ctx.lineTo(18, top - 6); ctx.lineTo(22, top + 8); ctx.lineTo(18, top + 20); ctx.lineTo(-18, top + 20); ctx.lineTo(-22, top + 8); ctx.closePath(); }
        else { ctx.rect(-12, top, 24, 15); }
        break;
      }
      case 'bow': {
        const L = shape === 'short' ? 34 : shape === 'war' || shape === 'sun' ? 48 : 42;
        const bend = shape === 'war' ? 18 : 14;
        ctx.moveTo(1, -L);
        ctx.quadraticCurveTo(-bend - 4, -L * 0.5, -5, -5);
        ctx.lineTo(-5, 5);
        ctx.quadraticCurveTo(-bend - 4, L * 0.5, 1, L);
        ctx.lineTo(-3, L - 2);
        ctx.quadraticCurveTo(-bend + 4, L * 0.5, 0, 5);
        ctx.lineTo(0, -5);
        ctx.quadraticCurveTo(-bend + 4, -L * 0.5, -3, -L + 2);
        ctx.closePath();
        break;
      }
      case 'shield': {
        if (shape === 'kite') { ctx.moveTo(0, -30); ctx.quadraticCurveTo(24, -28, 22, -6); ctx.quadraticCurveTo(18, 18, 0, 32); ctx.quadraticCurveTo(-18, 18, -22, -6); ctx.quadraticCurveTo(-24, -28, 0, -30); ctx.closePath(); }
        else if (shape === 'tower') { rrectPath(ctx, -22, -36, 44, 72, 10); }
        else { ctx.arc(0, 0, shape === 'aegis' ? 30 : 24, 0, TAU); }
        break;
      }
      case 'spear': {
        const top = shape === 'lance' || shape === 'star' ? -80 : -72;
        if (shape === 'star') { starPathRaw(ctx, 0, top + 8, 13, 5, 4); }
        else { ctx.moveTo(0, top - 14); ctx.quadraticCurveTo(9, top, 3, top + 16); ctx.lineTo(-3, top + 16); ctx.quadraticCurveTo(-9, top, 0, top - 14); ctx.closePath(); }
        break;
      }
    }
  }
  function rrectPath(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function starPathRaw(ctx, x, y, r1, r2, n) {
    for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1; const a = (i / (n * 2)) * TAU - Math.PI / 2; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
    ctx.closePath();
  }

  /** Where each component sits in the weapon's local frame (for drawing + assembly targets). */
  function slotAnchor(type, slot, shape) {
    const A = {
      sword:  { guard: [0, -9], handle: [0, 1], pommel: [0, 13] },
      axe:    { handle: [0, -14], grip: [0, 8] },
      hammer: { handle: [0, -14], grip: [0, 8] },
      spear:  { handle: [0, -26], grip: [0, 8] },
      bow:    { string: [3, 0], grip: [-2, 0] },
      shield: { rim: [0, 0], strap: [0, 12] },
    };
    const a = (A[type] && A[type][slot]) || [0, 0];
    return { x: a[0], y: a[1] };
  }

  /** Draw a single component in the weapon frame (translated to its anchor already if `atAnchor`). */
  function component(ctx, type, slot, color, shape, lw = 2.5, atOrigin = false) {
    const a = atOrigin ? { x: 0, y: 0 } : slotAnchor(type, slot, shape);
    ctx.save(); ctx.translate(a.x, a.y);
    const dark = U.shade(color, -0.35);
    switch (slot) {
      case 'guard': {
        const w = shape === 'knight' || shape === 'dragon' ? 15 : 12;
        ctx.beginPath(); ctx.moveTo(-w, -2); ctx.quadraticCurveTo(0, -6, w, -2); ctx.lineTo(w, 3); ctx.quadraticCurveTo(0, 0, -w, 3); ctx.closePath();
        fs(ctx, color, lw);
        circ(ctx, 0, 0, 3); fs(ctx, dark, lw * 0.6);
        break;
      }
      case 'handle': {
        if (type === 'sword') { rrect(ctx, -3, -8, 6, 17, 2); fs(ctx, color, lw); for (let i = -5; i < 8; i += 4) line(ctx, -3, i, 3, i + 2, dark, 1.2); }
        else if (type === 'spear') { rrect(ctx, -2.5, -46, 5, 84, 2); fs(ctx, color, lw); }
        else { rrect(ctx, -3, -32, 6, 50, 2.5); fs(ctx, color, lw); }
        break;
      }
      case 'pommel': { circ(ctx, 0, 0, 4.5); fs(ctx, color, lw); circ(ctx, -1.3, -1.3, 1.4); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill(); break; }
      case 'grip': {
        if (type === 'bow') { rrect(ctx, -4, -7, 8, 14, 3); fs(ctx, color, lw); }
        else { rrect(ctx, -4, -6, 8, 12, 3); fs(ctx, color, lw); }
        for (let i = -4; i < 6; i += 3) line(ctx, -4, i, 4, i + 2, dark, 1.2);
        break;
      }
      case 'string': {
        const L = shape === 'short' ? 34 : shape === 'war' || shape === 'sun' ? 48 : 42;
        const pull = ctx.__bowPull || 0;
        ctx.beginPath(); ctx.moveTo(-2, -L + 1); ctx.lineTo(-2 + pull, 0); ctx.lineTo(-2, L - 1);
        ctx.strokeStyle = OUT; ctx.lineWidth = lw * 0.9 + 1.2; ctx.stroke();
        ctx.strokeStyle = color; ctx.lineWidth = lw * 0.6; ctx.stroke();
        break;
      }
      case 'rim': {
        ctx.save(); mainPath(ctx, 'shield', shape); ctx.strokeStyle = OUT; ctx.lineWidth = 8; ctx.stroke(); ctx.strokeStyle = color; ctx.lineWidth = 4.5; ctx.stroke(); ctx.restore();
        break;
      }
      case 'strap': {
        rrect(ctx, -16, -4, 32, 8, 3); fs(ctx, color, lw);
        circ(ctx, -12, 0, 1.6); circ(ctx, 12, 0, 1.6); ctx.fillStyle = '#e8d8a0'; ctx.fill();
        break;
      }
    }
    ctx.restore();
  }

  /**
   * Draw a complete weapon.
   * w: {designId, materialId, parts:{slot:{tpl,rarity}}, element}
   * opts: {heat, only:'main', glow(bool), lw, pull}
   */
  function weapon(ctx, w, x, y, angle = 0, scale = 1, opts = {}) {
    const design = BF.getDesign(w.designId) || BF.DATA.weapons.shortsword;
    const type = design.type, shape = design.shape;
    const m = metalOf(w);
    const lw = opts.lw || 2.4;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(angle); ctx.scale(scale, scale);
    if (type === 'bow') ctx.scale(-1, 1); // belly faces forward, string toward the archer
    ctx.__bowPull = opts.pull || 0;
    const partColor = (slot) => {
      const p = w.parts && w.parts[slot];
      const tpl = p && BF.DATA.parts[p.tpl];
      return tpl ? tpl.color : BF.DATA.parts['basic_' + slot].color;
    };
    const slots = BF.DATA.weaponTypes[type].slots;
    const behind = type === 'axe' || type === 'hammer' || type === 'spear' ? ['handle'] : [];
    if (opts.only !== 'main') behind.forEach((s) => slots.includes(s) && component(ctx, type, s, partColor(s), shape, lw));
    // main cast part
    const el = w.element || (design.element) || null;
    if (opts.glow && el && !(BF.save && BF.save.settings.performance)) {
      ctx.save(); ctx.shadowColor = BF.DATA.elements[el.type].color; ctx.shadowBlur = 14; mainPath(ctx, type, shape); ctx.fillStyle = BF.DATA.elements[el.type].color; ctx.fill(); ctx.restore();
    }
    mainPath(ctx, type, shape);
    ctx.fillStyle = metalGrad(ctx, m, -20, 20, opts.heat || 0); ctx.fill();
    ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.stroke();
    // details on the main part
    ctx.save(); mainPath(ctx, type, shape); ctx.clip();
    if (type === 'sword' && shape !== 'dragon') line(ctx, 0, -14, 0, -10 - (SHAPES.sword[shape] || SHAPES.sword.long).len * 0.7, U.rgba('#ffffff', 0.45), 1.6);
    if (type === 'shield') {
      ell(ctx, -8, -10, 10, 7, -0.6); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fill();
      if (shape === 'aegis') { ctx.fillStyle = '#ffd24a'; ctx.beginPath(); starPathRaw(ctx, 0, 0, 14, 6, 8); ctx.fill(); }
      else { circ(ctx, 0, 0, 6); fs(ctx, m.dark, 1.5); }
    }
    if (type === 'hammer' && shape === 'thunder') { ctx.beginPath(); ctx.moveTo(-2, -50); ctx.lineTo(4, -40); ctx.lineTo(-1, -40); ctx.lineTo(3, -30); ctx.lineTo(-5, -42); ctx.lineTo(0, -42); ctx.closePath(); ctx.fillStyle = '#ffe44d'; ctx.fill(); }
    if (type === 'axe' && shape === 'frost') { ctx.fillStyle = 'rgba(200,240,255,.7)'; for (let i = 0; i < 4; i++) { tri(ctx, 20 + i * 2, -50 + i * 9, 30, -46 + i * 9, 22, -42 + i * 9); ctx.fill(); } }
    // hot glow overlay
    if (opts.heat > 0.05) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = U.rgba('#ff6a1a', opts.heat * 0.35); ctx.fillRect(-60, -120, 120, 240); }
    ctx.restore();
    if (opts.only !== 'main') {
      slots.forEach((s) => { if (!behind.includes(s)) component(ctx, type, s, partColor(s), shape, lw); });
      if (type === 'sword' && shape === 'dragon') { circ(ctx, 0, -9, 3.5); fs(ctx, '#e0322a', 1.5); }
      if (type === 'bow' && shape === 'sun') { circ(ctx, -12, 0, 6); fs(ctx, '#ffd24a', 1.5); }
    }
    ctx.restore();
  }

  /* =========================================================
     CHARACTERS (warriors, smith, scout)
     ========================================================= */
  const SPECIES_EXTRA = {
    badger: { fur: '#8a8a8e', skin: '#f2eee6', armor: '#6a4a2a', cloth: '#b86a3a' },
    fox: { fur: '#e0762a', skin: '#fff1dc', armor: '#6a8a3a', cloth: '#3a5a2a' },
  };

  /**
   * Draw a warrior/critter.
   * opts: {t, walk(0..1), attack(0..1 phase or -1), hurt(0..1), dir, scale, weapon, species, colors, broken, cheer}
   */
  function critter(ctx, x, y, cls, opts = {}) {
    const def = BF.DATA.warriors[cls] || null;
    const species = opts.species || (def && def.species) || 'badger';
    const C = opts.colors || (def && def.colors) || SPECIES_EXTRA[species] || SPECIES_EXTRA.badger;
    const t = opts.t || 0, s = opts.scale || 1, dir = opts.dir || 1;
    const walk = opts.walk || 0;
    const ph = t * 11;
    const bob = walk ? Math.abs(Math.sin(ph)) * -3 : Math.sin(t * 2.2) * 1.2;
    const cheer = opts.cheer ? Math.abs(Math.sin(t * 8)) * -10 : 0;
    ctx.save();
    ctx.translate(x, y); ctx.scale(s * dir, s);
    shadow(ctx, 0, 0, 20);
    ctx.translate(0, bob + cheer);
    const wtype = opts.weapon ? (BF.getDesign(opts.weapon.designId) || {}).type : (def ? def.weaponType : null);
    const att = opts.attack != null && opts.attack >= 0 ? opts.attack : -1;

    // legs
    const l1 = walk ? Math.sin(ph) * 6 : 0, l2 = walk ? -Math.sin(ph) * 6 : 0;
    rrect(ctx, -9 + l2, -12, 8, 12, 3); fs(ctx, U.shade(C.cloth || '#555', -0.3), 2.5);
    rrect(ctx, 2 + l1, -12, 8, 12, 3); fs(ctx, U.shade(C.cloth || '#555', -0.2), 2.5);
    ell(ctx, -5 + l2, -1, 6, 3.5); fs(ctx, '#3a2a1a', 2);
    ell(ctx, 7 + l1, -1, 6, 3.5); fs(ctx, '#3a2a1a', 2);

    // back features
    if (species === 'hedgehog') {
      ctx.fillStyle = C.spikes; ctx.strokeStyle = OUT; ctx.lineWidth = 2.5;
      for (let i = 0; i < 7; i++) {
        const a = Math.PI * 0.55 + i * 0.28;
        const bx = -4 + Math.cos(a) * 12, by = -34 + Math.sin(a) * -16;
        tri(ctx, bx, by, bx + Math.cos(a) * 16, by - Math.sin(a) * 16, bx + Math.cos(a + 0.5) * 6, by - Math.sin(a + 0.5) * 6);
        fs(ctx, C.spikes, 2);
      }
    }
    if (species === 'tortoise') { ell(ctx, -10, -30, 17, 20, -0.2); fs(ctx, C.shell, 3); ctx.save(); ell(ctx, -10, -30, 17, 20, -0.2); ctx.clip(); ctx.strokeStyle = U.shade(C.shell, -0.35); ctx.lineWidth = 2; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(-30, -30 + i * 9); ctx.lineTo(10, -34 + i * 9); ctx.stroke(); } ctx.restore(); }
    if (species === 'owl') { ell(ctx, -9, -26, 9, 17, 0.2); fs(ctx, U.shade(C.fur, -0.2), 2.5); }
    if (species === 'fox') { ctx.save(); ctx.rotate(Math.sin(t * 3) * 0.1); ell(ctx, -18, -14, 13, 6, -0.5); fs(ctx, C.fur, 2.5); ell(ctx, -27, -9, 5, 4, -0.5); fs(ctx, '#fff', 2); ctx.restore(); }

    // back arm (for shield-bearers etc)
    ell(ctx, -8, -30, 5, 9, 0.3); fs(ctx, U.shade(C.fur, -0.15), 2.5);

    // torso
    ell(ctx, 0, -27, 14, 16); fs(ctx, C.cloth || '#666', 3);
    ctx.save(); ell(ctx, 0, -27, 14, 16); ctx.clip();
    rrect(ctx, -15, -40, 30, 18, 4); ctx.fillStyle = C.armor; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = U.rgba('#ffffff', 0.25); rrect(ctx, -10, -38, 8, 5, 2); ctx.fill();
    if (species === 'badger') { rrect(ctx, -9, -34, 20, 26, 4); ctx.fillStyle = '#b86a3a'; ctx.fill(); ctx.stroke(); }
    ctx.restore();
    rrect(ctx, -13, -18, 26, 4, 2); fs(ctx, '#5a3a1a', 2);
    circ(ctx, 2, -16, 2.4); fs(ctx, '#ffd24a', 1.5);

    // head
    const hx = 3, hy = -50;
    if (species === 'hare') {
      const earW = Math.sin(t * 3) * 0.08;
      ell(ctx, hx - 5, hy - 22, 4.5, 15, -0.2 + earW); fs(ctx, C.fur, 2.5); ell(ctx, hx - 5, hy - 21, 2, 10, -0.2 + earW); ctx.fillStyle = '#f2a0b0'; ctx.fill();
      ell(ctx, hx + 3, hy - 22, 4.5, 15, 0.15 - earW); fs(ctx, C.fur, 2.5); ell(ctx, hx + 3, hy - 21, 2, 10, 0.15 - earW); ctx.fillStyle = '#f2a0b0'; ctx.fill();
    }
    if (species === 'boar' || species === 'badger' || species === 'hedgehog' || species === 'mole') {
      tri(ctx, hx - 10, hy - 8, hx - 4, hy - 20, hx, hy - 10); fs(ctx, U.shade(C.fur, -0.1), 2.5);
    }
    if (species === 'fox') { tri(ctx, hx - 10, hy - 6, hx - 6, hy - 24, hx + 1, hy - 10); fs(ctx, C.fur, 2.5); tri(ctx, hx + 2, hy - 10, hx + 7, hy - 25, hx + 11, hy - 7); fs(ctx, C.fur, 2.5); }
    if (species === 'owl') { tri(ctx, hx - 12, hy - 8, hx - 11, hy - 22, hx - 3, hy - 13); fs(ctx, C.fur, 2.5); tri(ctx, hx + 12, hy - 8, hx + 11, hy - 22, hx + 3, hy - 13); fs(ctx, C.fur, 2.5); }
    // head base
    if (species === 'tortoise') { ell(ctx, hx + 2, hy + 2, 12, 11); fs(ctx, C.skin, 3); }
    else { ell(ctx, hx, hy, 14, 13); fs(ctx, C.fur, 3); }
    if (species === 'hedgehog') { // head spikes
      for (let i = 0; i < 4; i++) { const a = 2.2 + i * 0.35; tri(ctx, hx + Math.cos(a) * 11, hy - Math.sin(a) * 11, hx + Math.cos(a) * 25, hy - Math.sin(a) * 24, hx + Math.cos(a + 0.4) * 12, hy - Math.sin(a + 0.4) * 12); fs(ctx, C.spikes, 2); }
    }
    // face
    if (species === 'badger') {
      ell(ctx, hx + 2, hy - 1, 5, 13); ctx.fillStyle = '#fff'; ctx.fill();
      ell(ctx, hx + 8, hy + 4, 9, 6); fs(ctx, C.skin, 2.5);
      circ(ctx, hx + 16, hy + 2, 3); fs(ctx, '#1a1010', 1.5);
      eye(ctx, hx + 7, hy - 4, 3, 1);
    } else if (species === 'hedgehog') {
      ell(ctx, hx + 8, hy + 3, 10, 7, 0.1); fs(ctx, C.skin, 2.5);
      circ(ctx, hx + 18, hy + 2, 3); fs(ctx, '#1a1010', 1.5);
      eye(ctx, hx + 7, hy - 4, 3.2, 1);
    } else if (species === 'hare') {
      ell(ctx, hx + 7, hy + 4, 8, 6); fs(ctx, C.skin, 2.5);
      circ(ctx, hx + 14, hy + 2, 2.4); fs(ctx, '#f28aa0', 1.5);
      rrect(ctx, hx + 10, hy + 7, 4, 4, 1); fs(ctx, '#fff', 1.2);
      eye(ctx, hx + 5, hy - 4, 3.4, 1);
    } else if (species === 'mole') {
      ell(ctx, hx + 11, hy + 3, 7, 6); fs(ctx, C.skin, 2.5);
      for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; circ(ctx, hx + 17 + Math.cos(a) * 3, hy + 3 + Math.sin(a) * 3, 1.8); ctx.fillStyle = '#e07080'; ctx.fill(); }
      circ(ctx, hx + 5, hy - 4, 1.6); ctx.fillStyle = '#1a1010'; ctx.fill();
      // goggles
      line(ctx, hx - 12, hy - 5, hx + 2, hy - 5, '#5a3a1a', 2.5);
    } else if (species === 'boar') {
      ell(ctx, hx + 13, hy + 4, 7, 6); fs(ctx, C.skin, 2.5);
      circ(ctx, hx + 15, hy + 3, 1.3); circ(ctx, hx + 11, hy + 3, 1.3); ctx.fillStyle = '#3a1a1a'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(hx + 9, hy + 9); ctx.quadraticCurveTo(hx + 14, hy + 8, hx + 13, hy + 1); ctx.lineTo(hx + 11, hy + 8); ctx.closePath(); fs(ctx, '#fffbe8', 1.8);
      eye(ctx, hx + 5, hy - 5, 2.6, 1);
      for (let i = 0; i < 5; i++) tri(ctx, hx - 10 + i * 4, hy - 11, hx - 8 + i * 4, hy - 19, hx - 6 + i * 4, hy - 11), fs(ctx, U.shade(C.fur, -0.3), 1.5);
    } else if (species === 'tortoise') {
      circ(ctx, hx + 13, hy + 3, 1.4); ctx.fillStyle = OUT; ctx.fill();
      ctx.beginPath(); ctx.arc(hx + 6, hy + 5, 5, 0.2, 1.4); ctx.strokeStyle = OUT; ctx.lineWidth = 1.8; ctx.stroke();
      eye(ctx, hx + 7, hy - 3, 3, 1);
      // helmet
      ctx.beginPath(); ctx.arc(hx + 2, hy - 1, 13.5, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); fs(ctx, C.armor, 2.5);
    } else if (species === 'owl') {
      circ(ctx, hx - 3, hy - 1, 7); fs(ctx, '#f7d38a', 2); circ(ctx, hx + 8, hy - 1, 7); fs(ctx, '#f7d38a', 2);
      eye(ctx, hx - 2, hy - 1, 4, 1, '#1a1010', '#ffb347'); eye(ctx, hx + 9, hy - 1, 4, 1, '#1a1010', '#ffb347');
      tri(ctx, hx + 2, hy + 4, hx + 6, hy + 4, hx + 4, hy + 10); fs(ctx, '#f2b84a', 1.8);
    } else if (species === 'fox') {
      ctx.beginPath(); ctx.moveTo(hx + 2, hy + 2); ctx.lineTo(hx + 20, hy + 4); ctx.lineTo(hx + 4, hy + 11); ctx.closePath(); fs(ctx, C.skin, 2.5);
      circ(ctx, hx + 20, hy + 4, 2.5); fs(ctx, '#1a1010', 1.2);
      eye(ctx, hx + 6, hy - 4, 3, 1);
    }
    if (opts.hat === 'smith') { rrect(ctx, hx - 13, hy - 17, 24, 8, 3); fs(ctx, '#5a3a1a', 2.5); }
    if (opts.hat === 'scout') { ctx.beginPath(); ctx.moveTo(hx - 15, hy - 8); ctx.quadraticCurveTo(hx, hy - 24, hx + 15, hy - 8); ctx.closePath(); fs(ctx, '#3a6a3a', 2.5); line(ctx, hx - 4, hy - 16, hx - 14, hy - 26, '#e0322a', 2.5); }

    // front arm + weapon
    let wAng = 0.5, wx = 12, wy = -30, pull = 0;
    if (wtype === 'bow') {
      wAng = 0; wx = 16; wy = -30;
      pull = att >= 0 ? Math.sin(Math.min(1, att * 1.4) * Math.PI) * 12 : 0;
    } else if (wtype === 'shield') {
      wAng = 0; wx = 14 + (att >= 0 ? Math.sin(att * Math.PI) * 8 : 0); wy = -28;
    } else if (wtype === 'spear') {
      wAng = Math.PI / 2; wx = 4 + (att >= 0 ? Math.sin(att * Math.PI) * 18 : 0); wy = -26;
    } else if (att >= 0) {
      // overhead swing: wind up backwards, then strike forward/down
      wAng = att < 0.35 ? 0.5 - (att / 0.35) * 1.4 : -0.9 + U.easeOutCubic((att - 0.35) / 0.65) * 2.9;
    } else {
      wAng = 0.5;
    }
    if (opts.hammerPose != null) { wAng = opts.hammerPose; }
    if (opts.weapon && !opts.broken) {
      weapon(ctx, opts.weapon, wx, wy, wAng, 0.72, { pull, lw: 3, glow: false });
    } else if (opts.tool === 'hammer') {
      ctx.save(); ctx.translate(wx, wy); ctx.rotate(wAng);
      rrect(ctx, -2.5, -30, 5, 34, 2); fs(ctx, '#8a5a2f', 2.5);
      rrect(ctx, -10, -40, 20, 12, 2); fs(ctx, '#6a6a72', 2.5);
      ctx.restore();
    }
    ell(ctx, wx - 1, wy + 1, 5, 5); fs(ctx, C.fur, 2.5);
    if (species === 'mole') { for (let i = 0; i < 3; i++) line(ctx, wx + 2, wy - 2 + i * 2.5, wx + 7, wy - 1 + i * 3, '#f2d0d0', 1.6); }

    // hurt flash
    if (opts.hurt > 0) {
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = U.rgba('#ffffff', opts.hurt * 0.7); ctx.fillRect(-40, -90, 80, 95);
    }
    ctx.restore();
  }

  /* =========================================================
     ENEMIES
     ========================================================= */
  function enemy(ctx, def, x, y, opts = {}) {
    const a = def.art;
    const s = (opts.scale || 1) * (a.size || 1);
    const t = opts.t || 0;
    const att = opts.attack != null ? opts.attack : -1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s * (opts.dir || -1), s);
    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
    if (a.kind !== 'bat' && a.kind !== 'wraith') shadow(ctx, 0, 0, a.kind === 'quad' ? 26 : a.kind === 'wyrm' ? 40 : 20);
    else shadow(ctx, 0, 0, 16, 0.15);
    const fn = ENEMY_DRAW[a.kind] || ENEMY_DRAW.humanoid;
    fn(ctx, a, t, att, opts);
    if (opts.hurt > 0) {
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = U.rgba('#ffffff', opts.hurt * 0.75); ctx.fillRect(-90, -140, 180, 150);
    }

  /* =========================================================

     ========================================================= */
  /** Forge interior backdrop for crafting & menu. */
  function forgeBackdrop(ctx, W, H, t, opts = {}) {
    // wall
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2c1f24'); g.addColorStop(1, '#4a3028');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // bricks
    ctx.save(); ctx.globalAlpha = 0.35; ctx.strokeStyle = '#1a1014'; ctx.lineWidth = 3;
    for (let row = 0; row < 12; row++) {
      const y = row * 36;
      for (let col = -1; col < W / 70 + 1; col++) {
        const x = col * 70 + (row % 2 ? 35 : 0);
        rrect(ctx, x + 2, y + 2, 66, 32, 5); ctx.fillStyle = row % 3 === 0 ? '#3e2c2e' : '#35262a'; ctx.fill(); ctx.stroke();
      }
    }
    ctx.restore();
    // warm glow from furnace (left or right)
    const fx = opts.furnaceX != null ? opts.furnaceX : W * 0.18;
    const flick = 0.85 + Math.sin(t * 9) * 0.05 + Math.sin(t * 23) * 0.04;
    const rg = ctx.createRadialGradient(fx, H * 0.62, 10, fx, H * 0.62, W * 0.6);
    rg.addColorStop(0, U.rgba('#ff9a3a', 0.45 * flick)); rg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    // hanging tools silhouette
    ctx.save(); ctx.globalAlpha = 0.5;
    for (let i = 0; i < 5; i++) {
      const x = W * 0.55 + i * 60, y = 40;
      line(ctx, x, 20, x, y + 20, '#1a1014', 3);
      if (i % 2) { rrect(ctx, x - 12, y + 18, 24, 10, 3); ctx.fillStyle = '#1a1014'; ctx.fill(); rrect(ctx, x - 2, y + 26, 4, 36, 2); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(x, y + 18); ctx.lineTo(x - 10, y + 60); ctx.moveTo(x, y + 18); ctx.lineTo(x + 10, y + 60); ctx.strokeStyle = '#1a1014'; ctx.lineWidth = 4; ctx.stroke(); }
    }
    ctx.restore();
    // floor
    const fy = H * (opts.floor || 0.8);
    ctx.fillStyle = '#3a2618'; ctx.fillRect(0, fy, W, H - fy);
    ctx.strokeStyle = '#24160e'; ctx.lineWidth = 3;
    line(ctx, 0, fy, W, fy, '#24160e', 4);
    for (let x = 0; x < W; x += 90) line(ctx, x, fy, x - 30, H, 'rgba(0,0,0,.25)', 2);
  }

  /** Stone furnace with fire; heat 0..1 changes flame size/colour. */
  function furnace(ctx, x, y, w, h, t, heat = 0.3) {
    rrect(ctx, x, y, w, h, 16); fs(ctx, '#5a4a4a', 4);
    ctx.save(); rrect(ctx, x, y, w, h, 16); ctx.clip();
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 3;
    for (let r = 0; r < h / 26; r++) for (let c = -1; c < w / 44 + 1; c++) { rrect(ctx, x + c * 44 + (r % 2 ? 22 : 0), y + r * 26, 42, 24, 5); ctx.fillStyle = r % 2 ? '#6a5858' : '#625050'; ctx.fill(); ctx.stroke(); }
    ctx.restore();
    // mouth
    const mx = x + w * 0.18, my = y + h * 0.42, mw = w * 0.64, mh = h * 0.46;
    ctx.beginPath(); ctx.moveTo(mx, my + mh); ctx.lineTo(mx, my + mh * 0.4); ctx.quadraticCurveTo(mx + mw / 2, my - mh * 0.35, mx + mw, my + mh * 0.4); ctx.lineTo(mx + mw, my + mh); ctx.closePath();

    inner.addColorStop(0, U.mix('#3a0a00', '#ff9a2a', heat)); inner.addColorStop(1, U.mix('#8a2a00', '#fff2a0', heat));
    ctx.fillStyle = inner; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = OUT; ctx.stroke();
    // flames
    ctx.save(); ctx.clip();
    for (let i = 0; i < 7; i++) {
      const fx = mx + (i + 0.5) * (mw / 7);

      ctx.beginPath(); ctx.moveTo(fx - 12, my + mh); ctx.quadraticCurveTo(fx - 8, my + mh - fh * 0.6, fx, my + mh - fh); ctx.quadraticCurveTo(fx + 8, my + mh - fh * 0.6, fx + 12, my + mh); ctx.closePath();

  function anvil(ctx, x, y, s = 1) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    shadow(ctx, 0, 60, 80, 0.3);
    rrect(ctx, -40, 30, 80, 30, 6); fs(ctx, '#3a3a44', 4);
    ctx.beginPath(); ctx.moveTo(-26, 30); ctx.lineTo(-18, 0); ctx.lineTo(18, 0); ctx.lineTo(26, 30); ctx.closePath(); fs(ctx, '#4a4a56', 4);
    ctx.beginPath(); ctx.moveTo(-90, -24); ctx.quadraticCurveTo(-110, -22, -130, -8); ctx.quadraticCurveTo(-100, 0, -70, 2); ctx.lineTo(80, 2); ctx.lineTo(90, -24); ctx.closePath(); fs(ctx, '#5a5a68', 4);
    rrect(ctx, -70, -26, 150, 6, 3); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill();
    ctx.restore();
  }

  /** Parallax battle backdrop for an area. camX scrolls it. */
  function battleBackdrop(ctx, area, W, H, camX, t) {
    const groundY = H * 0.78;
    const sky = ctx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0, area.sky[0]); sky.addColorStop(1, area.sky[1]);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // sun / moon / glow
    if (area.id === 1 || area.id === 4) { circ(ctx, W * 0.8, 80, 38); ctx.fillStyle = area.id === 1 ? '#fff4b8' : '#ffffff'; ctx.fill(); }
    if (area.id === 2 || area.id === 5) { circ(ctx, W * 0.78, 70, 28); ctx.fillStyle = area.id === 2 ? '#e8f0ff' : '#ff6a4a'; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1; }
    // clouds / ash
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 260 - camX * 0.08 + t * 8) % (W + 300) + W + 300) % (W + 300) - 150, cy = 50 + (i % 3) * 30;
      ctx.fillStyle = area.id === 5 ? 'rgba(80,40,60,.5)' : area.id === 3 ? 'rgba(90,40,30,.45)' : 'rgba(255,255,255,.7)';
      ell(ctx, cx, cy, 60, 16); ctx.fill(); ell(ctx, cx + 30, cy - 10, 36, 16); ctx.fill();
    }
    // far layer
    const far = (i) => ((i * 220 - camX * 0.2) % (W + 440) + W + 440) % (W + 440) - 220;
    for (let i = 0; i < 7; i++) {
      const x = far(i);
      ctx.fillStyle = area.hills[1];
      ctx.beginPath();
      if (area.id === 3 || area.id === 5) { ctx.moveTo(x - 140, groundY); ctx.lineTo(x - 30, groundY - 190 - (i % 3) * 30); ctx.lineTo(x + 10, groundY - 180 - (i % 3) * 30); ctx.lineTo(x + 140, groundY); }
      else { ctx.moveTo(x - 160, groundY); ctx.quadraticCurveTo(x, groundY - 200 - (i % 2) * 50, x + 160, groundY); }
      ctx.closePath(); ctx.fill();
      if (area.id === 3 && i % 2 === 0) { ctx.save(); ctx.shadowColor = '#ff6a1f'; ctx.shadowBlur = 20; ell(ctx, x - 10, groundY - 185 - (i % 3) * 30, 14, 5); ctx.fillStyle = '#ff9a2a'; ctx.fill(); ctx.restore(); }
      if (area.id === 4) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(x - 50, groundY - 130 - (i % 2) * 38); ctx.quadraticCurveTo(x, groundY - 205 - (i % 2) * 50, x + 50, groundY - 130 - (i % 2) * 38); ctx.closePath(); ctx.fill(); }
      if (area.id === 5 && i % 3 === 1) { // castle tower
        rrect(ctx, x - 20, groundY - 260, 40, 200, 2); ctx.fillStyle = '#1a0a14'; ctx.fill();
        tri(ctx, x - 26, groundY - 258, x, groundY - 310, x + 26, groundY - 258); ctx.fill();
        rrect(ctx, x - 6, groundY - 220, 12, 18, 6); ctx.fillStyle = '#ff9a3a'; ctx.fill();
      }
    }
    // mid layer (trees / rocks)
    const mid = (i) => ((i * 150 - camX * 0.5) % (W + 300) + W + 300) % (W + 300) - 150;
    for (let i = 0; i < 9; i++) {
      const x = mid(i), y = groundY + 4;
      if (area.id === 1) { rrect(ctx, x - 5, y - 60, 10, 60, 3); fs(ctx, '#7a4a2a', 3); circ(ctx, x, y - 78, 30 + (i % 3) * 6); fs(ctx, area.hills[0], 3); circ(ctx, x - 12, y - 86, 8); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill(); }
      else if (area.id === 2) { rrect(ctx, x - 5, y - 40, 10, 40, 3); fs(ctx, '#3a2a1a', 3); for (let k = 0; k < 3; k++) { tri(ctx, x - 34 + k * 6, y - 30 - k * 30, x, y - 90 - k * 30, x + 34 - k * 6, y - 30 - k * 30); fs(ctx, k % 2 ? '#1f3a26' : '#244a2c', 3); } }
      else if (area.id === 3) { ctx.beginPath(); ctx.moveTo(x - 40, y); ctx.lineTo(x - 26, y - 50 - (i % 3) * 14); ctx.lineTo(x + 10, y - 60 - (i % 2) * 20); ctx.lineTo(x + 36, y); ctx.closePath(); fs(ctx, '#4a2a22', 3); if (i % 2) { line(ctx, x - 20, y - 10, x - 6, y - 40, '#ff6a1f', 3); } }
      else if (area.id === 4) { rrect(ctx, x - 4, y - 30, 8, 30, 3); fs(ctx, '#4a3a3a', 3); for (let k = 0; k < 3; k++) { tri(ctx, x - 30 + k * 6, y - 24 - k * 26, x, y - 76 - k * 26, x + 30 - k * 6, y - 24 - k * 26); fs(ctx, '#2f5a4a', 3); tri(ctx, x - 18 + k * 4, y - 44 - k * 26, x, y - 76 - k * 26, x + 18 - k * 4, y - 44 - k * 26); ctx.fillStyle = '#fff'; ctx.fill(); } }
      else { rrect(ctx, x - 20, y - 70, 40, 70, 3); fs(ctx, '#2a1a24', 3); for (let k = 0; k < 3; k++) { rrect(ctx, x - 20 + k * 15, y - 80, 10, 12, 1); fs(ctx, '#2a1a24', 3); } }

    ctx.fillStyle = area.ground; ctx.fillRect(0, groundY, W, H - groundY);

    const gd = U.shade(area.ground, -0.18);
    for (let i = 0; i < 16; i++) {
      const x = ((i * 90 - camX) % (W + 90) + W + 90) % (W + 90) - 45;
      ell(ctx, x, groundY + 30 + (i % 3) * 22, 18, 4); ctx.fillStyle = gd; ctx.fill();
      if (area.id === 1 && i % 3 === 0) { circ(ctx, x + 20, groundY + 12, 4); ctx.fillStyle = i % 2 ? '#ffd24a' : '#ff8ab0'; ctx.fill(); }
    }
    return groundY;
  }

  /** The smith's battle wagon with cannon. aim = angle. */
  function wagon(ctx, x, y, aim, t, recoil = 0) {
    ctx.save(); ctx.translate(x, y);
    shadow(ctx, 0, 0, 60, 0.3);
    // cannon barrel
    ctx.save(); ctx.translate(18, -62); ctx.rotate(aim);
    ctx.translate(-recoil * 10, 0);
    rrect(ctx, -10, -11, 62, 22, 8); fs(ctx, '#3a3a44', 4);
    rrect(ctx, 44, -14, 12, 28, 4); fs(ctx, '#2a2a34', 3);
    rrect(ctx, 0, -9, 40, 5, 2); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill();
    ctx.restore();
    // cart body
    rrect(ctx, -58, -60, 104, 40, 8); fs(ctx, '#8a5a2f', 4);
    for (let i = -48; i < 40; i += 18) line(ctx, i, -58, i, -22, '#6a4222', 2.5);
    rrect(ctx, -62, -64, 112, 10, 4); fs(ctx, '#a8733f', 3);
    // smith peeking
    ctx.save(); critter(ctx, -30, -56, null, { species: 'badger', t, scale: 0.7, hat: 'smith', colors: { fur: '#8a8a8e', skin: '#f2eee6', armor: '#6a4a2a', cloth: '#b86a3a' } }); ctx.restore();
    rrect(ctx, -58, -44, 104, 24, 6); fs(ctx, '#8a5a2f', 4);

    [-36, 26].forEach((wx) => {
      ctx.save(); ctx.translate(wx, -14); ctx.rotate(t * 2);
      circ(ctx, 0, 0, 16); fs(ctx, '#5a3a1a', 4);
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 4); line(ctx, -14, 0, 14, 0, '#3a2210', 3); }
      circ(ctx, 0, 0, 4); fs(ctx, '#c9a24a', 2);
      ctx.restore();
    });
    ctx.restore();
  }

  /** Loot pickup icon drawn in world. */
  function lootDrop(ctx, item, x, y, t, s = 1) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const col = item.rarity ? BF.DATA.rarities[item.rarity].color : '#ffd24a';
    if (item.rarity && BF.DATA.rarities[item.rarity].order >= 2) {
      ctx.save(); ctx.globalAlpha = 0.35 + Math.sin(t * 6) * 0.15; circ(ctx, 0, -8, 18); ctx.fillStyle = col; ctx.fill(); ctx.restore();

    drawItemGlyph(ctx, item, 0, -8, 1, t);
    ctx.restore();
  }

  /** Small glyph for any item kind at (x,y) with size ~ 24*s. */
  function drawItemGlyph(ctx, item, x, y, s, t = 0) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    switch (item.kind) {
      case 'gold': {
        for (let i = 0; i < 3; i++) { ell(ctx, -4 + i * 4, 6 - i * 5, 9, 5); fs(ctx, '#ffc93d', 2.2); ell(ctx, -4 + i * 4, 5 - i * 5, 5, 2.4); ctx.fillStyle = '#ffe89a'; ctx.fill(); }
        break;
      }
      case 'gem': {
        ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(10, -3); ctx.lineTo(0, 12); ctx.lineTo(-10, -3); ctx.closePath(); fs(ctx, '#52e0ff', 2.4);
        tri(ctx, 0, -12, 4, -3, -4, -3); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill();
        break;
      }
      case 'ore': {
        const m = BF.DATA.materials[item.id] || BF.DATA.materials.copper;
        ctx.beginPath(); ctx.moveTo(-12, 6); ctx.lineTo(-8, -6); ctx.lineTo(8, -6); ctx.lineTo(12, 6); ctx.closePath();
        ctx.fillStyle = metalGrad(ctx, m, -12, 12); ctx.fill(); ctx.lineWidth = 2.4; ctx.strokeStyle = OUT; ctx.stroke();
        line(ctx, -5, -3, 4, -3, 'rgba(255,255,255,.6)', 1.8);
        break;
      }
      case 'part': {
        const tpl = BF.DATA.parts[item.tpl];
        const col = tpl ? tpl.color : '#aaa';
        rrect(ctx, -11, -11, 22, 22, 5); fs(ctx, '#3a2a22', 2.4);
        ctx.save(); ctx.scale(0.9, 0.9);
        const slot = tpl ? tpl.slot : 'handle';
        const typeFor = { guard: 'sword', pommel: 'sword', handle: 'axe', grip: 'axe', string: 'bow', rim: 'shield', strap: 'shield' };
        ctx.save();
        if (slot === 'handle') { ctx.rotate(0.7); ctx.scale(0.4, 0.4); }
        else if (slot === 'rim') { ctx.scale(0.36, 0.36); }
        else if (slot === 'string') { ctx.scale(0.26, 0.26); }
        else if (slot === 'strap') { ctx.scale(0.55, 0.55); }
        component(ctx, typeFor[slot], slot, col, slot === 'rim' ? 'round' : 'long', slot === 'handle' || slot === 'rim' ? 5 : 2, true);
        ctx.restore();
        ctx.restore();
        break;
      }
      case 'special': {
        const sp = BF.DATA.specials[item.id];
        ctx.save(); ctx.rotate(Math.sin(t * 2) * 0.1);
        ctx.beginPath(); starPathRaw(ctx, 0, 0, 13, 6, 6); fs(ctx, sp ? sp.color : '#fff', 2.4);
        circ(ctx, 0, 0, 4); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fill();
        ctx.restore();
        break;
      }
      case 'cannonball': {
        const cb = BF.DATA.cannonballs[item.id] || BF.DATA.cannonballs.normal;
        circ(ctx, 0, 0, 10); fs(ctx, cb.color, 2.4); circ(ctx, -3, -3, 3); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
        break;
      }
      case 'blueprint': {
        rrect(ctx, -11, -13, 22, 26, 3); fs(ctx, '#3a6ab8', 2.4);
        for (let i = 0; i < 3; i++) line(ctx, -6, -6 + i * 6, 6, -6 + i * 6, '#bfe0ff', 1.6);
        ctx.beginPath(); starPathRaw(ctx, 7, -10, 5, 2, 5); ctx.fillStyle = '#ffc93d'; ctx.fill();
        break;

  /** Simple speech/scout bird for scout report. */
  function projectile(ctx, p, t) {
    ctx.save(); ctx.translate(p.x, p.y);
    const ang = Math.atan2(p.vy, p.vx);

      case 'stone': circ(ctx, 0, 0, 5); fs(ctx, '#8a8478', 2); break;
      case 'thorn': ctx.rotate(ang); tri(ctx, -10, -4, 12, 0, -10, 4); fs(ctx, '#8a6a3a', 2); break;
      case 'fire': case 'ice': case 'dark': {
        const col = p.kind === 'fire' ? '#ff7a2f' : p.kind === 'ice' ? '#7fd8ff' : '#a26bff';
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; circ(ctx, 0, 0, 12); ctx.fillStyle = U.rgba(col, 0.35); ctx.fill(); ctx.restore();

      }
      case 'cannonball': {
        const cb = BF.DATA.cannonballs[p.ammo] || BF.DATA.cannonballs.normal;
        circ(ctx, 0, 0, 10); fs(ctx, cb.color, 3); circ(ctx, -3, -3, 3); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
        if (p.ammo === 'explosive') { line(ctx, 4, -8, 8, -14, '#8a5a2f', 2); circ(ctx, 8, -15, 3 + Math.sin(t * 30)); ctx.fillStyle = '#ffd24a'; ctx.fill(); }
        break;
      }
      default: circ(ctx, 0, 0, 5); fs(ctx, '#fff', 2);
    }
    ctx.restore();
  }

  return {
    OUT, ell, circ, rrect, fs, line, tri, shadow, eye,
    metalGrad, mainPath, slotAnchor, component, weapon,
    critter, enemy, forgeBackdrop, furnace, anvil, battleBackdrop, wagon, lootDrop, drawItemGlyph, projectile,
  };
})();

/* ---- js/core/icons.js ---- */
/* =========================================================

BF.Icons = (function () {
  const D = BF.Draw;

  function render(key, w, h, fn) {
    if (cache.has(key)) return cache.get(key);
    const c = document.createElement('canvas');
    c.width = Math.round(w * DPR); c.height = Math.round(h * DPR);
    const ctx = c.getContext('2d');
    ctx.scale(DPR, DPR);
    try { fn(ctx, w, h); } catch (e) { console.warn('icon failed', key, e); }
    const url = c.toDataURL('image/png');
    cache.set(key, url);
    return url;

  /* ---- UI glyphs (upgrades, achievements, buttons) ---- */

      case 'forge': rrect(ctx, -18, -12, 36, 28, 6); fs(ctx, '#6a5858', 3); ctx.beginPath(); ctx.moveTo(-10, 16); ctx.quadraticCurveTo(0, -8, 10, 16); ctx.closePath(); fs(ctx, '#ff8a2a', 2.5); rrect(ctx, -6, -22, 12, 12, 2); fs(ctx, '#4a3a3a', 3); break;
      case 'fire': ctx.beginPath(); ctx.moveTo(0, -20); ctx.quadraticCurveTo(16, -2, 10, 12); ctx.quadraticCurveTo(0, 22, -10, 12); ctx.quadraticCurveTo(-16, -2, 0, -20); fs(ctx, '#ff7a2f', 3); ell(ctx, 0, 8, 5, 8); ctx.fillStyle = '#ffe44d'; ctx.fill(); break;
      case 'bellows': ctx.beginPath(); ctx.moveTo(-18, -12); ctx.lineTo(8, -4); ctx.lineTo(8, 4); ctx.lineTo(-18, 12); ctx.closePath(); fs(ctx, '#a8733f', 3); rrect(ctx, 6, -3, 14, 6, 2); fs(ctx, '#8b95a1', 2.5); break;
      case 'drop': ctx.beginPath(); ctx.moveTo(0, -20); ctx.quadraticCurveTo(16, 4, 0, 18); ctx.quadraticCurveTo(-16, 4, 0, -20); fs(ctx, '#ff9a2a', 3); break;

      case 'crown': ctx.beginPath(); ctx.moveTo(-18, 12); ctx.lineTo(-20, -10); ctx.lineTo(-9, 0); ctx.lineTo(0, -16); ctx.lineTo(9, 0); ctx.lineTo(20, -10); ctx.lineTo(18, 12); ctx.closePath(); fs(ctx, '#ffc93d', 3); break;
      case 'spark': ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(-10, 2); ctx.lineTo(0, 2); ctx.lineTo(-4, 20); ctx.lineTo(12, -4); ctx.lineTo(2, -4); ctx.closePath(); fs(ctx, '#ffe44d', 3); break;
      case 'lucky': ctx.beginPath(); ctx.arc(0, -2, 14, Math.PI * 0.85, Math.PI * 2.15); ctx.lineWidth = 12; ctx.strokeStyle = O; ctx.stroke(); ctx.lineWidth = 7; ctx.strokeStyle = '#c9d3de'; ctx.stroke(); break;
      case 'scroll': rrect(ctx, -14, -18, 28, 36, 4); fs(ctx, '#f2dfb8', 3); for (let i = 0; i < 3; i++) line(ctx, -8, -8 + i * 7, 8, -8 + i * 7, '#8a6a4a', 2.5); break;
      case 'ingot': ctx.beginPath(); ctx.moveTo(-18, 10); ctx.lineTo(-12, -8); ctx.lineTo(12, -8); ctx.lineTo(18, 10); ctx.closePath(); fs(ctx, '#c9d3de', 3); break;
      case 'sword': ctx.rotate(0.78); rrect(ctx, -3, -22, 6, 28, 2); fs(ctx, '#dfe6ee', 3); rrect(ctx, -10, 6, 20, 5, 2); fs(ctx, '#a8733f', 2.5); rrect(ctx, -2.5, 11, 5, 10, 2); fs(ctx, '#6a4222', 2.5); break;
      case 'skull': circ(ctx, 0, -3, 15); fs(ctx, '#efe9d6', 3); rrect(ctx, -8, 8, 16, 10, 3); fs(ctx, '#efe9d6', 3); circ(ctx, -6, -3, 4); circ(ctx, 6, -3, 4); ctx.fillStyle = O; ctx.fill(); break;
      case 'shield': ctx.beginPath(); ctx.moveTo(0, -18); ctx.quadraticCurveTo(16, -16, 16, -4); ctx.quadraticCurveTo(14, 12, 0, 20); ctx.quadraticCurveTo(-14, 12, -16, -4); ctx.quadraticCurveTo(-16, -16, 0, -18); fs(ctx, '#3f6fb5', 3); break;

      case 'chest': rrect(ctx, -18, -6, 36, 22, 3); fs(ctx, '#a8733f', 3); ctx.beginPath(); ctx.moveTo(-18, -6); ctx.quadraticCurveTo(0, -24, 18, -6); ctx.closePath(); fs(ctx, '#8a5a2f', 3); rrect(ctx, -4, -4, 8, 8, 2); fs(ctx, '#ffc93d', 2); break;
      case 'coin': circ(ctx, 0, 0, 16); fs(ctx, '#ffc93d', 3); circ(ctx, 0, 0, 9); ctx.strokeStyle = '#c9932a'; ctx.lineWidth = 3; ctx.stroke(); break;
      case 'gem': ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(16, -4); ctx.lineTo(0, 18); ctx.lineTo(-16, -4); ctx.closePath(); fs(ctx, '#52e0ff', 3); break;
      case 'clock': circ(ctx, 0, 0, 17); fs(ctx, '#f2dfb8', 3); line(ctx, 0, 0, 0, -10, O, 3); line(ctx, 0, 0, 8, 4, O, 3); break;
      case 'bench': rrect(ctx, -20, -6, 40, 8, 2); fs(ctx, '#a8733f', 3); line(ctx, -14, 2, -14, 16, O, 4); line(ctx, 14, 2, 14, 16, O, 4); break;
      case 'grind': circ(ctx, 0, -2, 15); fs(ctx, '#9a9282', 3); circ(ctx, 0, -2, 4); fs(ctx, '#5a5a5a', 2); line(ctx, -14, 18, 14, 18, O, 4); break;
      case 'storage': rrect(ctx, -18, -18, 36, 36, 3); fs(ctx, '#8a5a2f', 3); line(ctx, -18, 0, 18, 0, O, 3); line(ctx, 0, -18, 0, 18, O, 3); break;
      case 'magnet': ctx.beginPath(); ctx.arc(0, 0, 13, Math.PI, 0); ctx.lineWidth = 12; ctx.strokeStyle = O; ctx.stroke(); ctx.lineWidth = 7; ctx.strokeStyle = '#e0322a'; ctx.stroke(); line(ctx, -13, 0, -13, 14, O, 12); line(ctx, 13, 0, 13, 14, O, 12); line(ctx, -13, 4, -13, 14, '#dfe6ee', 7); line(ctx, 13, 4, 13, 14, '#dfe6ee', 7); break;
      case 'guild': rrect(ctx, -18, -4, 36, 20, 3); fs(ctx, '#3f6fb5', 3); tri(ctx, -22, -4, 0, -20, 22, -4); fs(ctx, '#e0322a', 3); break;
      case 'lock': rrect(ctx, -12, -2, 24, 18, 3); fs(ctx, '#8b95a1', 3); ctx.beginPath(); ctx.arc(0, -4, 8, Math.PI, 0); ctx.lineWidth = 5; ctx.strokeStyle = O; ctx.stroke(); break;
      default: circ(ctx, 0, 0, 14); fs(ctx, '#ffc93d', 3);
    }
    ctx.restore();
  }

  const Icons = {
    glyph(name, size = 40) { return img(render('g:' + name + size, size, size, (ctx) => glyph(ctx, name, size)), 'icon glyph', name); },
    glyphURL(name, size = 40) { return render('g:' + name + size, size, size, (ctx) => glyph(ctx, name, size)); },

    item(item, size = 44) {
      const key = 'i:' + item.kind + ':' + (item.id || item.tpl || '') + ':' + size;
      return img(render(key, size, size, (ctx) => D.drawItemGlyph(ctx, item, size / 2, size / 2, size / 30)), 'icon item', item.kind);
    },
    material(id, size = 44) { return Icons.item({ kind: 'ore', id }, size); },

    weapon(w, size = 72) {
      const partsKey = w.parts ? Object.values(w.parts).map((p) => p ? p.tpl : '').join(',') : '';
      const key = 'w:' + w.designId + ':' + w.materialId + ':' + partsKey + ':' + size;
      return img(render(key, size, size, (ctx) => {
        const d = BF.getDesign(w.designId);
        const t = d ? d.type : 'sword';
        const sc = size / (t === 'spear' ? 110 : t === 'shield' ? 80 : 90);
        const ang = t === 'shield' ? 0 : t === 'bow' ? 0.3 : 0.75;
        const oy = t === 'shield' ? 0 : t === 'bow' ? 0 : size * 0.18;
        const ox = t === 'shield' || t === 'bow' ? 0 : -size * 0.12;
        D.weapon(ctx, w, size / 2 + ox, size / 2 + oy, ang, sc, { lw: 2.6 / sc * 0.9 + 1.2 });
      }), 'icon weapon', w.name || 'weapon');
    },

    portrait(cls, size = 72, species) {
      const key = 'p:' + cls + ':' + (species || '') + ':' + size;
      return img(render(key, size, size, (ctx) => {
        ctx.save(); ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2); ctx.clip();
        const def = BF.DATA.warriors[cls];
        ctx.fillStyle = def ? BF.U.shade(def.colors.cloth, 0.55) : '#e8d8b0'; ctx.fillRect(0, 0, size, size);
        D.critter(ctx, size * 0.44, size * 1.22, cls, { scale: size / 62, species, hat: species === 'fox' ? 'scout' : species === 'badger' ? 'smith' : null });
        ctx.restore();
        ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2); ctx.lineWidth = 3; ctx.strokeStyle = D.OUT; ctx.stroke();
      }), 'icon portrait', cls);
    },

    enemy(id, size = 64) {
      const key = 'e:' + id + ':' + size;
      return img(render(key, size, size, (ctx) => {
        const def = BF.DATA.enemies[id];
        const art = def.art;
        const base = art.kind === 'quad' ? 70 : art.kind === 'wyrm' ? 130 : art.kind === 'golem' ? 100 : 80;
        const sc = size / (base * (art.size || 1)) * (def.boss ? 1.05 : 0.95);
        const yOff = art.kind === 'bat' || art.kind === 'wraith' ? size * 0.92 : size * 0.94;
        D.enemy(ctx, def, size / 2 + (art.kind === 'quad' ? -size * 0.06 : 0) + (art.kind === 'wyrm' ? size * 0.12 : 0), yOff, { scale: sc, t: 0.3, dir: -1 });
      }), 'icon enemy', id);
    },

    clear() { cache.clear(); },
  };
  return Icons;
})();

<script>
/* ---- js/core/ui.js ---- */
/* =========================================================
   UI – HUD, toasts, modals, canvas stages, shared widgets.
   ========================================================= */
BF.UI = (function () {
  const U = BF.U, h = U.h;
  const $ = (sel) => document.querySelector(sel);

  /* ---------------- HUD ---------------- */
  let hudEl = null, savedTimer = null;
  function buildHUD() {
    hudEl = $('#hud');
    hudEl.innerHTML = '';
    hudEl.append(
      h('div', { class: 'hud-left' },
        backLink(),
        h('button', { class: 'hud-level', id: 'hud-level', title: 'Player level', onclick: () => BF.Game.go('STATS') },
          h('span', { class: 'lvl-num', id: 'hud-lvl' }, '1'),
          h('span', { class: 'xp-wrap' }, h('span', { class: 'xp-bar', id: 'hud-xp' })),
          h('span', { class: 'xp-text', id: 'hud-xptext' }, '0 / 100 XP')),
        h('div', { class: 'hud-res', id: 'hud-res' })),
      h('div', { class: 'hud-right' },
        h('span', { class: 'hud-saved', id: 'hud-saved', 'aria-hidden': 'true' }, 'Saved'),
        h('button', { class: 'hud-btn', title: 'World map', onclick: () => BF.Game.go('WORLD_MAP') }, BF.Icons.glyph('map', 26), h('span', null, 'Map')),
        h('button', { class: 'hud-btn', title: 'Inventory', onclick: () => BF.Game.go('INVENTORY') }, BF.Icons.glyph('chest', 26), h('span', null, 'Items')),
        h('button', { class: 'hud-btn', title: 'Main menu', onclick: () => BF.Game.go('MAIN_MENU') }, BF.Icons.glyph('scroll', 26), h('span', null, 'Menu')))
    );
  }
  /** Link back to the GrejsAlley arcade page (progress is saved first). */
  const BACK_URL = 'GREJSALLEY.html';
  function backLink(extraCls = '') {
    return h('a', { class: 'back-link ' + extraCls, href: BACK_URL, title: 'Tilbage til GrejsAlley', onclick: () => { try { BF.Save.save(true); } catch (e) { /* ignore */ } } }, '‹ Tilbage');
  }
  function updateHUD() {
    if (!hudEl || !BF.save) return;
    const s = BF.save;
    const need = BF.Prog.xpToNext(s.playerLevel);
    const lvl = $('#hud-lvl'); if (!lvl) return;
    lvl.textContent = s.playerLevel;
    $('#hud-xp').style.width = (s.playerLevel >= BF.Prog.MAX_LEVEL ? 100 : U.clamp(s.xp / need * 100, 0, 100)) + '%';
    $('#hud-xptext').textContent = s.playerLevel >= BF.Prog.MAX_LEVEL ? 'MAX LEVEL' : `${U.fmt(s.xp)} / ${U.fmt(need)} XP`;
    const res = $('#hud-res');
    res.innerHTML = '';
    res.append(resChip(BF.Icons.glyphURL('coin', 28), U.fmt(s.gold), 'Gold', 'gold'));
    res.append(resChip(BF.Icons.glyphURL('gem', 28), U.fmt(s.gems), 'Gems', 'gems'));
    // Top owned ores
    const ores = BF.DATA.materialOrder.filter((m) => (s.ore[m] || 0) > 0).slice(-3);
    ores.forEach((m) => {
      const chip = resChip(null, s.ore[m], BF.DATA.materials[m].name + ' ore', 'ore');
      chip.prepend(BF.Icons.material(m, 26));
      res.append(chip);
    });
  }
  function resChip(src, value, label, cls) {
    return h('span', { class: 'res-chip ' + (cls || ''), title: label },
      src ? h('img', { src, alt: '', class: 'icon' }) : null,
      h('b', null, value));
  }
  function flashSaved(ok) {
    const el = $('#hud-saved'); if (!el) return;
    el.textContent = ok ? 'Saved' : 'Not saved';
    el.classList.toggle('bad', !ok);
    el.classList.add('show');
    clearTimeout(savedTimer); savedTimer = setTimeout(() => el.classList.remove('show'), 1100);
  }

  /* ---------------- toasts ---------------- */
  function toast(text, opts = {}) {
    const root = $('#toasts');
    const el = h('div', { class: 'toast ' + (opts.kind || 'info') },
      opts.icon ? (typeof opts.icon === 'string' ? h('img', { src: opts.icon, class: 'icon', alt: '' }) : opts.icon) : null,
      h('div', { class: 'toast-body' }, opts.title ? h('b', null, opts.title) : null, h('span', null, text)));
    root.append(el);
    while (root.children.length > 4) root.firstChild.remove();
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 350); }, opts.ms || 2600);
  }

  /* ---------------- modals ---------------- */
  let modalStack = [];
  function modal({ title, body, buttons = [], cls = '', dismissable = true, icon }) {
    const root = $('#modal-root');
    const box = h('div', { class: 'modal panel ' + cls, role: 'dialog', 'aria-modal': 'true' });
    const close = () => {
      wrap.classList.remove('in');
      modalStack = modalStack.filter((m) => m !== close);
      setTimeout(() => wrap.remove(), 200);
    };
    if (icon) box.append(h('div', { class: 'modal-icon' }, icon));
    if (title) box.append(h('h2', { class: 'modal-title' }, title));
    if (body) box.append(typeof body === 'string' ? h('div', { class: 'modal-body', html: body }) : h('div', { class: 'modal-body' }, body));
    if (buttons.length) {
      const row = h('div', { class: 'modal-actions' });
      buttons.forEach((b) => {
        const btn = h('button', { class: 'btn ' + (b.cls || ''), onclick: U.guard(() => { BF.Audio.sfx('click'); if (b.close !== false) close(); b.onClick && b.onClick(); }, 300) }, b.label);
        row.append(btn);
      });
      box.append(row);
    }
    const wrap = h('div', { class: 'modal-wrap', onclick: (e) => { if (dismissable && e.target === wrap) close(); } }, box);
    root.append(wrap);
    modalStack.push(close);
    requestAnimationFrame(() => wrap.classList.add('in'));
    const first = box.querySelector('.modal-actions .btn');
    if (first) setTimeout(() => first.focus(), 60);
    return close;
  }
  function confirm(title, text, okLabel = 'Confirm', danger = false) {
    return new Promise((resolve) => {
      modal({
        title, body: h('p', null, text), dismissable: false,
        buttons: [
          { label: 'Cancel', cls: 'ghost', onClick: () => resolve(false) },
          { label: okLabel, cls: danger ? 'danger' : 'primary', onClick: () => resolve(true) },
        ],
      });
    });
  }
  function closeTopModal() { const c = modalStack[modalStack.length - 1]; if (c) { c(); return true; } return false; }

  /* ---------------- canvas stage ---------------- */
  /**
   * Create a fixed-resolution canvas (logical W×H) that scales with CSS.
   * Returns helpers for pointer input in logical coordinates.
   */
  function stage(parent, W = 960, H = 540, cls = '') {
    const wrap = h('div', { class: 'stage ' + cls, style: { '--ar': String(W / H) } });
    const canvas = h('canvas', { class: 'stage-canvas', 'aria-label': 'Game view' });
    wrap.append(canvas);
    parent.append(wrap);
    const perf = BF.save && BF.save.settings.performance;
    const dpr = perf ? 1 : Math.min(2, window.devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const st = {
      el: wrap, canvas, ctx, W, H, dpr,
      fx: new BF.FX.System(perf ? 250 : 700),
      pointer: { x: W / 2, y: H / 2, down: false, inside: false },
      handlers: {},
      on(evt, fn) { this.handlers[evt] = fn; return this; },
      toLocal(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
      },
      begin() { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.save(); ctx.translate(st.fx.ox, st.fx.oy); },
      end() { ctx.restore(); },
    };
    const call = (name, e) => { const p = st.toLocal(e); st.pointer.x = p.x; st.pointer.y = p.y; st.handlers[name] && st.handlers[name](p, e); };
    canvas.addEventListener('pointerdown', (e) => {
      BF.Audio.unlock();
      st.pointer.down = true; st.pointer.inside = true;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      call('down', e); e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e) => { st.pointer.inside = true; call('move', e); });
    const up = (e) => { if (!st.pointer.down) return; st.pointer.down = false; call('up', e); };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('pointerleave', () => { st.pointer.inside = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    return st;
  }

  /* ---------------- small widgets ---------------- */
  function btn(label, onClick, cls = '', attrs = {}) {
    return h('button', Object.assign({ class: 'btn ' + cls, onclick: U.guard((e) => { BF.Audio.sfx('click'); onClick && onClick(e); }, 250) }, attrs), label);
  }
  function rarityChip(rarity) {
    const r = BF.DATA.rarities[rarity] || BF.DATA.rarities.common;
    return h('span', { class: 'chip rarity r-' + r.id, style: { '--rc': r.color } }, r.name);
  }
  function elementChip(el) {
    if (!el) return null;
    const E = BF.DATA.elements[el.type];
    return h('span', { class: 'chip element', style: { '--rc': E.color } }, `${E.name} +${Math.round(el.value)}`);
  }
  function statBar(label, value, max, color, suffix = '') {
    return h('div', { class: 'statbar' },
      h('span', { class: 'sb-label' }, label),
      h('span', { class: 'sb-track' }, h('span', { class: 'sb-fill', style: { width: U.clamp(value / max * 100, 0, 100) + '%', background: color || 'var(--ember)' } })),
      h('b', { class: 'sb-val' }, Math.round(value) + suffix));
  }
  const STAR_PATH = 'M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z';
  function stars(n, total = 5) {
    const el = h('span', { class: 'stars', role: 'img', 'aria-label': n + ' of ' + total + ' stars' });
    let html = '';
    for (let i = 0; i < total; i++) html += `<svg class="star${i < n ? ' on' : ''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_PATH}"/></svg>`;
    el.innerHTML = html;
    return el;
  }
  function screenHeader(title, subtitle, backTo = 'MAIN_MENU', extra) {
    return h('div', { class: 'screen-header' },
      btn('‹ Back', () => BF.Game.go(backTo), 'ghost small back'),
      h('div', { class: 'sh-titles' }, h('h1', null, title), subtitle ? h('p', null, subtitle) : null),
      extra || h('span'));
  }
  function tabs(list, current, onPick) {
    const row = h('div', { class: 'tabs', role: 'tablist' });
    list.forEach((t) => row.append(h('button', { class: 'tab' + (t.id === current ? ' on' : ''), role: 'tab', 'aria-selected': t.id === current ? 'true' : 'false', onclick: () => { BF.Audio.sfx('click'); onPick(t.id); } }, t.label, t.count != null ? h('span', { class: 'tab-count' }, t.count) : null)));
    return row;
  }

  return { backLink, buildHUD, updateHUD, flashSaved, toast, modal, confirm, closeTopModal, stage, btn, rarityChip, elementChip, statBar, stars, screenHeader, tabs };
})();

</script>
<script>
/* ---- js/core/state.js ---- */
/* =========================================================
   STATE MACHINE + MAIN LOOP
   Screens register in BF.Screens[STATE] with:
     enter(root, params), exit(), update(dt), draw(), onKey(e)
   ========================================================= */
BF.Game = (function () {
  const STATES = ['MAIN_MENU', 'WORLD_MAP', 'MISSION_SELECT', 'SCOUT', 'ORDER', 'CRAFTING', 'CRAFTING_RESULT', 'PRE_BATTLE', 'BATTLE',
    'MISSION_RESULT', 'SHOP', 'ARMORY', 'INVENTORY', 'BLUEPRINTS', 'UPGRADES', 'ACHIEVEMENTS', 'STATS', 'SETTINGS'];
  let current = null, currentName = null, transitioning = false;
  let lastT = 0, running = false, playtimeAcc = 0;

  function go(name, params = {}) {
    if (!BF.Screens[name]) { console.error('Unknown state', name); return; }
    if (transitioning) return;
    transitioning = true;
    const fade = document.getElementById('fade');
    const animate = !(BF.save && BF.save.settings.animations === false);
    fade.classList.add('on');
    setTimeout(() => {
      try { if (current && current.exit) current.exit(); } catch (e) { console.error(e); }
      const root = document.getElementById('screen');
      root.innerHTML = '';
      root.className = 'screen-' + name.toLowerCase().replace(/_/g, '-');
      BF.UI.closeTopModal();
      current = BF.Screens[name];
      currentName = name;
      transitioning = false;          // allow a screen to redirect from enter()
      const hud = document.getElementById('hud');
      hud.hidden = !!current.noHUD;
      try { current.enter(root, params); } catch (e) { console.error('enter failed', name, e); root.append(BF.U.h('p', { class: 'error' }, 'Something went wrong: ' + e.message)); }
      BF.UI.updateHUD();
      window.scrollTo(0, 0);
      fade.classList.remove('on');
    }, animate ? 170 : 0);
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;
    if (!document.hidden && current) {
      try {
        if (current.update) current.update(dt);
        if (current.draw) current.draw();
      } catch (e) { console.error(e); }
      // playtime tracking
      if (BF.save) {
        playtimeAcc += dt;
        if (playtimeAcc >= 1) { BF.save.stats.playtime += Math.floor(playtimeAcc); playtimeAcc -= Math.floor(playtimeAcc); }
      }
    }
    requestAnimationFrame(loop);
  }

  function start() {
    if (running) return;
    running = true;
    requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(loop); });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && BF.UI.closeTopModal()) return;
      if (current && current.onKey) current.onKey(e);
    });
  }

  return {
    STATES, go, start,
    get state() { return currentName; },
    get screen() { return current; },
  };
})();

</script>
