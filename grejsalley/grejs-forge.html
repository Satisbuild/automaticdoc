    const start = BF.UI.btn('Light the furnace →', startForging, 'primary big');
    els.main.append(h('div', { class: 'select-step parts-step' },
      h('div', { class: 'step-title' },
        BF.UI.btn('‹ Blueprint', showDesign, 'ghost small'),
        h('h2', null, '3 · Fit the components'), h('p', null, 'Looted parts add stats and elements. Parts you use are consumed.')),
      h('div', { class: 'parts-layout' }, h('div', { class: 'part-rows' }, slotRows), h('div', null, projBox, start))));
  }

  /* =========================================================
     MINIGAME FRAMEWORK
     ========================================================= */
  function startForging() {
    if (busy) return;
    const s = S();
    const design = BF.getDesign(sel.designId);
    const state = designState(design);
    if (!state.ok) { BF.UI.toast(state.why, { kind: 'bad' }); return; }
    // make sure chosen parts still exist
    for (const slot in sel.parts) {
      const p = sel.parts[slot];
      if (p.uid && !s.weaponParts.some((x) => x.uid === p.uid)) sel.parts[slot] = { tpl: 'basic_' + slot, rarity: 'common', uid: null };
    }
    s.ore[sel.materialId] -= design.cost;
    s.craftRefund = { materialId: sel.materialId, qty: design.cost };
    BF.Save.save();
    BF.UI.updateHUD();
    scores = {}; combo = 0; maxCombo = 0;
    buildStage();
    runGame(Melt());
  }

  function buildStage() {
    els.main.innerHTML = '';
    const wrap = h('div', { class: 'forge-layout' });
    const stageBox = h('div', { class: 'forge-stage' });
    els.side = h('aside', { class: 'forge-side panel' });
    wrap.append(stageBox, els.side);
    els.main.append(wrap);
    st = BF.UI.stage(stageBox, 960, 540, 'craft-canvas');
    st.on('down', (p) => { keyHeld = false; game && game.down && game.down(p); });
    st.on('move', (p) => game && game.move && game.move(p));
    st.on('up', (p) => game && game.up && game.up(p));
  }

  function renderSide() {
    if (!els.side || !game) return;
    const design = BF.getDesign(sel.designId);
    const mat = BF.DATA.materials[sel.materialId];
    const done = Object.keys(scores);
    const avg = done.length ? BF.Stats.overallScore(Object.assign({ melt: 0, pour: 0, construction: 0, shape: 0, assembly: 0 }, fillProjection()), maxCombo).overall : 0;
    const tier = BF.Stats.qualityTier(avg);
    const row = (label, key) => {
      const v = scores[key];
      const tierC = v != null ? BF.Stats.qualityTier(v).color : 'transparent';
      return h('div', { class: 'score-row' + (v != null ? ' has' : '') }, h('span', null, label), h('span', { class: 'sr-bar' }, h('span', { style: { width: (v || 0) + '%', background: tierC } })), h('b', null, v != null ? Math.round(v) + '%' : '—'));
    };
    els.side.innerHTML = '';
    els.side.append(
      h('div', { class: 'side-order' }, BF.Icons.weapon({ designId: sel.designId, materialId: sel.materialId, parts: sel.parts }, 58),
        h('div', null, h('b', null, `${mat.name} ${design.name}`), h('small', null, `for ${warrior().name}`))),
      h('div', { class: 'side-instr' }, h('h3', null, game.title), h('p', null, game.help), game.action ? h('button', { class: 'btn primary', id: 'game-action', disabled: game.actionDisabled ? game.actionDisabled() : false, onclick: () => { if (game && game.action) game.action(); } }, game.actionLabel) : null),
      h('div', { class: 'side-scores' },
        row('Melt', 'melt'), row('Pour', 'pour'), row('Construction', 'construction'), row('Shape', 'shape'), row('Assembly', 'assembly')),
      h('div', { class: 'side-combo' + (combo >= 2 ? ' hot' : '') }, h('span', null, 'Combo'), h('b', null, 'x' + combo), h('small', null, `best x${maxCombo} · bonus +${Math.round(BF.Stats.comboBonus(maxCombo))}%`)),
      h('div', { class: 'side-proj' }, h('span', null, 'Projected'), BF.UI.stars(done.length ? tier.stars : 0), h('b', { style: { color: tier.ink } }, done.length ? tier.name : '—')));
  }
  function refreshActionButton() {
    const b = document.getElementById('game-action');
    if (b && game && game.actionDisabled) b.disabled = game.actionDisabled();
  }
  /** Estimate for projection: unknown steps assume the average so far. */
  function fillProjection() {
    const keys = ['melt', 'pour', 'construction', 'shape', 'assembly'];
    const known = keys.filter((k) => scores[k] != null);
    const avg = known.length ? known.reduce((a, k) => a + scores[k], 0) / known.length : 0;
    const out = {};
    keys.forEach((k) => (out[k] = scores[k] != null ? scores[k] : avg));
    return out;
  }

  function runGame(g) {
    game = g;
    stepId = g.step;
    renderSteps();
    renderSide();
    if (st) st.fx.clear();
  }

  /** Called by a minigame when it's done. */
  function finishGame(key, score, perfect, next) {
    scores[key] = U.clamp(Math.round(score), 0, 100);
    renderSteps();
    renderSide();
    game.finished = true;
    busy = true;
    setTimeout(() => { busy = false; if (next) runGame(next()); else finalize(); }, 1100);
  }

  function comboEvent(kind, x, y) {
    if (kind === 'perfect') {
      combo++; maxCombo = Math.max(maxCombo, combo);
      if (combo >= 2) st.fx.text(x, y - 46, `COMBO x${combo}`, { color: '#ffcf4a', size: 22, life: 1.1 });
    } else if (kind === 'bad') {
      if (combo >= 2) st.fx.text(x, y - 46, 'Combo reset', { color: '#ff8a8a', size: 18, life: 1 });
      combo = 0;
    }
    renderSide();
  }

  function feedback(x, y, text, good) {
    const c = good === true ? '#ffe066' : good === 'ok' ? '#9be37a' : '#ff6a5a';
    st.fx.text(x, y, text, { color: c, size: good === true ? 34 : 28, life: 1.3, rise: 40 });
    if (good === true) { BF.Audio.sfx('perfect'); st.fx.emit('star', x, y, { n: 14, speed: 260, colors: ['#fff3b0', '#ffd24a'], size: 7, life: 0.9, force: true }); }
    else if (good === false) BF.Audio.sfx('miss');
  }

  /** Smith on the left of every station. */
  function drawSmith(ctx, pose, opts = {}) {
    D.critter(ctx, 110, 470, null, Object.assign({ species: 'badger', t, scale: 2.1, hat: 'smith', tool: opts.tool === false ? null : 'hammer', hammerPose: pose }, opts));
  }

  /** Shape profile of the main part: bbox + area rows (for the pour fill). */
  const profileCache = {};
  function profile(type, shape) {
    const key = type + ':' + shape;
    if (profileCache[key]) return profileCache[key];
    const c = document.createElement('canvas').getContext('2d');
    D.mainPath(c, type, shape);
    let x0 = 999, x1 = -999, y0 = 999, y1 = -999;
    const rows = {};
    for (let y = -130; y <= 70; y += 1) {
      let wRow = 0;
      for (let x = -70; x <= 70; x += 1) {
        if (c.isPointInPath(x, y)) { wRow++; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      }
      if (wRow) rows[y] = wRow;
    }
    const total = Object.values(rows).reduce((a, b) => a + b, 0);
    profileCache[key] = { x0, x1, y0, y1, w: x1 - x0 + 1, h: y1 - y0 + 1, rows, total };
    return profileCache[key];
  }

  /* =========================================================
     MINIGAME 1 – MELT
     ========================================================= */
  function Melt() {
    const mat = BF.DATA.materials[sel.materialId];
    const [lo, hi] = mat.melt;
    const fmax = BF.DATA.upgrades.forge.value(S().upgrades.forge);
    const bell = BF.DATA.upgrades.bellows.value(S().upgrades.bellows);
    const gMax = Math.ceil((Math.max(fmax, hi + 150) + 100) / 250) * 250;
    let T = 20, v = 0, prog = 0, over = 0, pumpT = 0, warnT = 0;
    const g = {
      step: 'melt', title: 'Melt the metal',
      help: `Hold the mouse (or Space) to pump the bellows. Keep the heat in the green band (${lo}–${hi}°C) until the melt bar is full, then tap the furnace. Too early or too hot lowers quality.`,
      actionLabel: 'Tap the furnace!', action: () => tap(), actionDisabled: () => prog === 0 && T < lo * 0.7, probe: () => ({ T, prog, lo, hi }),
      down() { BF.Audio.sfx('bellows'); },
      update(dt) {
        if (g.finished) return;
        const holding = (st.pointer.down || keyHeld);
        const boost = T < lo * 0.6 ? 2.4 : 1;
        // The furnace heats fast while pumped and cools slowly (it keeps its heat).
        if (holding) { v += 820 * bell * boost * dt; pumpT += dt; } else { v -= 520 * dt; }
        v = U.clamp(v, -170, 300 * bell * boost);
        T += v * dt;
        if (T < 20) { T = 20; v = Math.max(0, v); }
        if (T > fmax) { T = fmax; v = Math.min(0, v); }
        if (T >= lo) prog = Math.min(1, prog + dt / 1.3);
        if (T > hi) {
          over += dt; warnT -= dt;
          if (warnT <= 0) { warnT = 0.8; st.fx.text(700, 120, 'TOO HOT!', { color: '#ff6a5a', size: 22, life: 0.8 }); }
          if (Math.random() < dt * 12) st.fx.emit('smoke', 420, 250, { n: 1, speed: 40, color: '#555', size: 14, life: 1.6, spread: 0.4 });
        }
        const heat = U.clamp(T / hi, 0, 1.2);
        if (Math.random() < dt * (4 + heat * 20)) st.fx.emit('ember', U.rand(340, 520), 330, { n: 1, speed: 60 + heat * 80, colors: ['#ffb347', '#ff7a2f', '#fff0a0'], size: 2.4, life: 1.4, spread: 0.5 });
        if (holding && Math.random() < dt * 6) BF.Audio.sfx('furnace');
        refreshActionButton();
      },
      draw(ctx) {
        D.forgeBackdrop(ctx, 960, 540, t, { furnaceX: 430 });
        const heat = U.clamp((T - 20) / (hi - 20), 0, 1.1);
        D.furnace(ctx, 300, 150, 260, 300, t, heat);
        // crucible
        const cx = 430, cy = 360;
        D.rrect(ctx, cx - 44, cy - 30, 88, 56, 12); D.fs(ctx, '#5a5a62', 4);
        ctx.save(); D.ell(ctx, cx, cy - 26, 40, 9); ctx.clip();
        const liquid = U.clamp((T - lo * 0.7) / (lo * 0.3), 0, 1) * prog + prog * 0.2;
        ctx.fillStyle = U.mix(mat.color, T > lo ? '#ffdd66' : '#ff8a3a', U.clamp(liquid, 0, 1)); ctx.fillRect(cx - 50, cy - 40, 100, 30);
        ctx.restore();
        D.ell(ctx, cx, cy - 26, 40, 9); ctx.lineWidth = 3; ctx.strokeStyle = D.OUT; ctx.stroke();
        if (prog < 1) for (let i = 0; i < 4; i++) { D.rrect(ctx, cx - 26 + i * 14, cy - 34 - (i % 2) * 5, 12, 9, 2); D.fs(ctx, U.mix(mat.color, '#ff8a3a', U.clamp(T / lo, 0, 1)), 2); }
        // bellows (squash while pumping)
        const squash = (st.pointer.down || keyHeld) ? Math.abs(Math.sin(t * 10)) * 0.4 : 0;
        ctx.save(); ctx.translate(240, 430);
        ctx.beginPath(); ctx.moveTo(-50, -26 + squash * 20); ctx.lineTo(40, -6); ctx.lineTo(40, 6); ctx.lineTo(-50, 26 - squash * 20); ctx.closePath(); D.fs(ctx, '#a8733f', 3.5);
        for (let i = -1; i <= 1; i++) D.line(ctx, -30, i * (14 - squash * 10), 28, i * 3, '#6a4222', 2);
        D.rrect(ctx, 38, -5, 40, 10, 3); D.fs(ctx, '#8b95a1', 3);
        ctx.restore();
        drawSmith(ctx, -0.3 + squash * 1.4, { tool: false });
        // gauge
        const gx = 760, gy0 = 70, gy1 = 470;
        const yOf = (temp) => gy1 - (temp / gMax) * (gy1 - gy0);
        D.rrect(ctx, gx - 22, gy0 - 14, 44, gy1 - gy0 + 28, 20); D.fs(ctx, '#f2dfb8', 4);
        ctx.fillStyle = 'rgba(111,207,106,.45)'; ctx.fillRect(gx - 18, yOf(hi), 36, yOf(lo) - yOf(hi));
        D.line(ctx, gx - 22, yOf(lo), gx + 22, yOf(lo), '#3a7a2a', 2); D.line(ctx, gx - 22, yOf(hi), gx + 22, yOf(hi), '#3a7a2a', 2);
        ctx.fillStyle = 'rgba(224,50,42,.2)'; ctx.fillRect(gx - 18, yOf(fmax), 36, 4);
        const tempCol = T > hi ? '#e0322a' : T >= lo ? '#3aa83a' : U.mix('#5a8aff', '#ff8a3a', U.clamp(T / lo, 0, 1));
        D.rrect(ctx, gx - 8, yOf(T), 16, gy1 - yOf(T) + 8, 6); ctx.fillStyle = tempCol; ctx.fill();
        D.circ(ctx, gx, gy1 + 16, 20); D.fs(ctx, tempCol, 4);
        ctx.font = '700 12px "Baloo 2", sans-serif'; ctx.fillStyle = '#f2dfb8'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        for (let tick = 0; tick <= gMax; tick += 250) { D.line(ctx, gx + 22, yOf(tick), gx + 30, yOf(tick), '#f2dfb8', 2); ctx.fillText(tick + '°', gx + 34, yOf(tick)); }
        ctx.textAlign = 'right'; ctx.fillStyle = '#9be37a'; ctx.fillText(lo + '°', gx - 28, yOf(lo)); ctx.fillText(hi + '°', gx - 28, yOf(hi));
        // big readout
        ctx.textAlign = 'center';
        ctx.font = '800 44px "Baloo 2", sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = D.OUT; ctx.strokeText(Math.round(T) + '°C', 610, 90); ctx.fillStyle = tempCol === '#3aa83a' ? '#9be37a' : T > hi ? '#ff8a7a' : '#ffe8c0'; ctx.fillText(Math.round(T) + '°C', 610, 90);
        ctx.font = '800 18px "Baloo 2", sans-serif'; ctx.fillStyle = '#f2dfb8';
        const status = T > hi ? 'TOO HOT' : T >= lo ? 'IN THE ZONE' : T > lo * 0.7 ? 'ALMOST…' : 'TOO COLD';
        ctx.strokeText(status, 610, 128); ctx.fillText(status, 610, 128);
        // melt progress bar
        D.rrect(ctx, 320, 480, 220, 22, 11); D.fs(ctx, '#2a1a14', 3);
        D.rrect(ctx, 323, 483, 214 * prog, 16, 8); ctx.fillStyle = prog >= 1 ? '#9be37a' : '#ffb347'; ctx.fill();
        ctx.font = '800 14px "Baloo 2", sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(prog >= 1 ? 'MELTED – TAP NOW!' : 'MELT ' + Math.round(prog * 100) + '%', 430, 492);
        if (over > 0) { ctx.fillStyle = '#ff8a7a'; ctx.fillText(`Overheat penalty: ${over.toFixed(1)}s`, 610, 156); }
      },
      key(e, down) { if (e.code === 'Space') { if (down && !keyHeld) BF.Audio.sfx('bellows'); keyHeld = down; } if (down && e.code === 'Enter') tap(); },
    };
    function tap() {
      if (g.finished || (prog === 0 && T < lo * 0.7)) return;
      let score, text, good;
      if (prog < 1) { score = 20 + 40 * prog; text = 'TOO EARLY – QUALITY DOWN'; good = false; }
      else {
        if (T >= lo && T <= hi) { const c = (lo + hi) / 2, half = (hi - lo) / 2; const d = Math.abs(T - c) / half; score = 100 - Math.max(0, d - 0.5) * 12; }
        else { const out = T < lo ? lo - T : T - hi; score = 92 - out * 0.45; }
        score -= over * 18;
      }
      score = U.clamp(Math.round(score), 5, 100);
      const perfect = score >= 97;
      if (prog >= 1) { text = perfect ? 'PERFECT MELT!' : score >= 85 ? 'GOOD MELT' : score >= 60 ? 'QUALITY DOWN' : 'POOR MELT'; good = perfect ? true : score >= 85 ? 'ok' : false; }
      feedback(430, 250, text, good);
      BF.Audio.sfx('sizzle');
      st.fx.emit('spark', 430, 330, { n: 26, speed: 380, colors: ['#fff0a0', '#ffb347'], life: 0.7 });
      if (perfect) { S().stats.perfectMelts++; comboEvent('perfect', 430, 250); } else if (score < 80) comboEvent('bad', 430, 250);
      finishGame('melt', score, perfect, Pour);
    }
    return g;
  }

  /* =========================================================
     MINIGAME 2 – POUR
     ========================================================= */
  function Pour() {
    const design = BF.getDesign(sel.designId);
    const mat = BF.DATA.materials[sel.materialId];
    const prof = profile(design.type, design.shape);
    const sc = Math.min(320 / prof.h, 280 / prof.w);
    const ox = 470 - (prof.x0 + prof.w / 2) * sc, oy = 318 - (prof.y0 + prof.h / 2) * sc;   // screen = o + local*sc
    const topY = oy + prof.y0 * sc, botY = oy + prof.y1 * sc;
    const benchK = 1 + 0.06 * S().upgrades.bench;
    const maxRate = (0.5 * (0.9 + mat.hardness * 0.1)) / benchK;
    const LAG = 0.28;
    let fill = 0, rate = 0, packets = [], idle = 0, poured = false, overflowT = 0;
    // level (screen y) for a fill fraction, walking area rows from the bottom
    const rowsDesc = Object.keys(prof.rows).map(Number).sort((a, b) => b - a);
    function levelY(f) {
      let need = f * prof.total, acc = 0;
      for (const y of rowsDesc) { acc += prof.rows[y]; if (acc >= need) return oy + y * sc; }
      return topY;
    }
    const g = {
      step: 'pour', title: 'Pour into the mould',
      help: 'Hold to tip the crucible – the stream speeds up the longer you hold, and metal keeps falling for a moment after you let go. Aim for 95–100%. Overflow ruins the cast.',
      actionLabel: 'Set the mould', action: () => end(), actionDisabled: () => fill < 0.3 || packets.length > 0, probe: () => ({ fill }),
      update(dt) {
        if (g.finished) return;
        const holding = st.pointer.down || keyHeld;
        if (holding) { rate = Math.min(maxRate, (rate || 0.1) + 0.55 * dt); poured = true; idle = 0; if (Math.random() < dt * 10) BF.Audio.sfx('pour'); }
        else { rate = 0; if (poured && !packets.length) idle += dt; }
        if (rate > 0) packets.push({ a: rate * dt, t: LAG });
        for (let i = packets.length - 1; i >= 0; i--) { packets[i].t -= dt; if (packets[i].t <= 0) { fill += packets[i].a; packets.splice(i, 1); } }
        if (fill > 1) {
          overflowT += dt;
          if (Math.random() < dt * 30) st.fx.emit('drip', 470 + U.rand(-30, 30), topY, { n: 1, speed: 120, colors: ['#ffb347', '#ffdd66'], size: 4, life: 1, spread: 1.2 });
        }
        if (fill >= 1.12 && !packets.length) end();
        if (poured && idle > 2.5 && fill > 0.5) end();
        refreshActionButton();
      },
      draw(ctx) {
        D.forgeBackdrop(ctx, 960, 540, t, { furnaceX: 120 });
        drawSmith(ctx, -0.2, { tool: false });
        // mould block
        const bx = 470 - prof.w * sc / 2 - 50, by = topY - 34, bw = prof.w * sc + 100, bh = botY - topY + 70;
        D.rrect(ctx, bx, by, bw, bh, 14); D.fs(ctx, '#8a7a62', 4);
        ctx.save(); D.rrect(ctx, bx, by, bw, bh, 14); ctx.clip(); for (let i = 0; i < 60; i++) { ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.fillRect(bx + (i * 37) % bw, by + (i * 53) % bh, 4, 4); } ctx.restore();
        // cavity
        ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
        D.mainPath(ctx, design.type, design.shape); ctx.fillStyle = '#2a1e18'; ctx.fill();
        ctx.save(); D.mainPath(ctx, design.type, design.shape); ctx.clip();
        const ly = (levelY(Math.min(1, fill)) - oy) / sc;
        const grad = ctx.createLinearGradient(0, ly, 0, prof.y1);
        grad.addColorStop(0, '#fff2a0'); grad.addColorStop(0.3, '#ffb347'); grad.addColorStop(1, U.mix(mat.color, '#ff6a1f', 0.6));
        ctx.fillStyle = grad; ctx.fillRect(-80, ly, 160, 200);
        ctx.restore();
        D.mainPath(ctx, design.type, design.shape); ctx.lineWidth = 3 / sc; ctx.strokeStyle = D.OUT; ctx.stroke();
        ctx.restore();
        // target line at the top
        ctx.setLineDash([8, 6]); D.line(ctx, 470 - prof.w * sc / 2 - 30, topY, 470 + prof.w * sc / 2 + 30, topY, '#9be37a', 3); ctx.setLineDash([]);
        ctx.font = '800 14px "Baloo 2", sans-serif'; ctx.fillStyle = '#9be37a'; ctx.textAlign = 'left'; ctx.fillText('FULL', 470 + prof.w * sc / 2 + 34, topY + 5);
        // crucible
        const holding = st.pointer.down || keyHeld;
        const tilt = holding || packets.length ? 0.9 : 0.3;
        // crucible: its lip sits right above the stream
        ctx.save(); ctx.translate(484, topY - 62); ctx.rotate(-tilt * 0.8);
        D.rrect(ctx, 0, -26, 74, 50, 10); D.fs(ctx, '#5a5a62', 4);
        D.ell(ctx, 37, -24, 36, 8); ctx.fillStyle = '#ffcf6a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = D.OUT; ctx.stroke();
        D.line(ctx, 74, -4, 130, -4, '#6a4222', 6);
        ctx.restore();
        // stream
        if (rate > 0 || packets.length) {
          const lvl = levelY(Math.min(1, fill));
          const width = 4 + (rate / maxRate) * 10;
          ctx.save(); ctx.globalAlpha = 0.95;
          const sg = ctx.createLinearGradient(0, topY - 80, 0, lvl);
          sg.addColorStop(0, '#fff2a0'); sg.addColorStop(1, '#ff9a2a');
          ctx.fillStyle = sg; ctx.fillRect(484 - width / 2 + Math.sin(t * 30) * 1.5, topY - 60, width, lvl - topY + 60);
          ctx.restore();
          if (Math.random() < 0.5) st.fx.emit('spark', 484, lvl, { n: 1, speed: 160, colors: ['#fff0a0', '#ffb347'], size: 2, life: 0.4 });
        }
        // readout gauge
        const pct = fill * 100;
        const gx = 810, gy0 = 110, gy1 = 430;
        D.rrect(ctx, gx - 18, gy0 - 10, 36, gy1 - gy0 + 20, 14); D.fs(ctx, '#f2dfb8', 4);
        const yOf = (p) => gy1 - U.clamp(p / 120, 0, 1) * (gy1 - gy0);
        ctx.fillStyle = 'rgba(111,207,106,.5)'; ctx.fillRect(gx - 14, yOf(100), 28, yOf(95) - yOf(100));
        ctx.fillStyle = 'rgba(224,50,42,.35)'; ctx.fillRect(gx - 14, yOf(120), 28, yOf(100) - yOf(120));
        D.rrect(ctx, gx - 7, yOf(pct), 14, gy1 - yOf(pct), 6); ctx.fillStyle = pct > 100 ? '#e0322a' : pct >= 95 ? '#3aa83a' : '#ff9a2a'; ctx.fill();
        ctx.textAlign = 'center'; ctx.font = '800 42px "Baloo 2", sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = D.OUT;
        const txt = Math.round(pct) + '%'; ctx.strokeText(txt, gx, 70); ctx.fillStyle = pct > 100 ? '#ff8a7a' : pct >= 95 ? '#9be37a' : '#ffe8c0'; ctx.fillText(txt, gx, 70);
        ctx.font = '800 13px "Baloo 2", sans-serif'; ctx.fillStyle = '#f2dfb8'; ctx.fillText('TARGET 95–100%', gx, 460);
      },
      key(e, down) { if (e.code === 'Space') keyHeld = down; if (down && e.code === 'Enter' && fill >= 0.3) end(); },
    };
    function end() {
      if (g.finished) return;
      if (packets.length) { packets.forEach((p) => (fill += p.a)); packets = []; }
      const f = fill * 100;
      const score = f <= 100 ? f : 100 - (f - 100) * 4;
      const sc2 = U.clamp(Math.round(score), 0, 100);
      const perfect = sc2 >= 98 && f <= 100.5;
      const text = f > 101 ? 'OVERFLOW!' : perfect ? 'PERFECT POUR!' : sc2 >= 95 ? 'GREAT POUR' : sc2 >= 80 ? 'GOOD POUR' : sc2 >= 60 ? 'OKAY POUR' : 'POOR POUR';
      feedback(470, 200, text, perfect ? true : sc2 >= 80 ? 'ok' : false);
      BF.Audio.sfx('sizzle');
      st.fx.emit('smoke', 470, topY, { n: 14, speed: 60, color: '#bbb', size: 12, life: 1.6, spread: 0.8, jitter: 40 });
      if (perfect) { S().stats.perfectPours++; comboEvent('perfect', 470, 200); } else if (sc2 < 80) comboEvent('bad', 470, 200);
      finishGame('pour', sc2, perfect, Hammer);
    }
    return g;
  }

  /* =========================================================
     MINIGAME 3 – HAMMER
     ========================================================= */
  function Hammer() {
    const design = BF.getDesign(sel.designId);
    const mat = BF.DATA.materials[sel.materialId];
    const prof = profile(design.type, design.shape);
    const sc = Math.min(430 / prof.h, 150 / prof.w);
    // piece lies horizontally (rotated +90°): local y -> screen x (reversed)
    const cx = 560, cy = 290;
    const midLocal = (prof.y0 + prof.y1) / 2;
    const x0 = cx - (prof.y1 - midLocal) * sc, x1 = cx + (midLocal - prof.y0) * sc; // bar range
    const hammerK = BF.DATA.upgrades.hammer.value(S().upgrades.hammer);
    const anvilK = BF.DATA.upgrades.anvil.value(S().upgrades.anvil);
    let construction = Math.round(20 + (scores.pour || 50) * 0.25);
    let strikes = 10, pos = 0.1, dir = 1, strikeAnim = 0, strikeX = cx, heat = 1, dents = [], perfectCount = 0, redCount = 0;
    let speed = 0.5 + 0.28 * (mat.hardness - 1);
    let zone = newZone();
    function newZone() { const gw = 0.045 * anvilK; return { c: U.rand(0.14, 0.86), g: gw, y: gw + 0.09 }; }
    const g = {
      step: 'hammer', title: 'Hammer the blade',
      help: 'Click (or press Space) to strike when the glowing marker is over the GREEN zone. Yellow is okay, red dents the metal. Reach 100% construction within 10 strikes.',
      down() { strike(); },
      update(dt) {
        if (g.finished) return;
        pos += dir * speed * dt;
        if (pos > 1) { pos = 1; dir = -1; } if (pos < 0) { pos = 0; dir = 1; }
        strikeAnim = Math.max(0, strikeAnim - dt * 5);
        heat = Math.max(0.35, heat - dt * 0.04);
      },
      draw(ctx) {
        D.forgeBackdrop(ctx, 960, 540, t, { furnaceX: 60 });
        drawSmith(ctx, -0.2 - Math.sin(t * 2) * 0.1);
        D.anvil(ctx, cx, cy + 58, 1.9);
        // piece
        D.weapon(ctx, { designId: sel.designId, materialId: sel.materialId }, cx + midLocal * sc, cy, Math.PI / 2, sc, { only: 'main', heat, lw: 3 / sc });
        // dents
        dents.forEach((d) => { D.ell(ctx, d, cy + U.rand(-1, 1), 6, 3); ctx.fillStyle = 'rgba(40,20,10,.5)'; ctx.fill(); });
        // strike bar above the piece
        const by = cy - prof.w * sc / 2 - 60;
        D.rrect(ctx, x0 - 8, by - 12, x1 - x0 + 16, 24, 12); D.fs(ctx, '#5a1a14', 3);
        const zx = (p) => x0 + p * (x1 - x0);
        ctx.fillStyle = '#e0322a'; ctx.fillRect(x0, by - 8, x1 - x0, 16);
        ctx.fillStyle = '#ffd24a'; ctx.fillRect(zx(zone.c - zone.y), by - 8, zx(zone.c + zone.y) - zx(zone.c - zone.y), 16);
        ctx.fillStyle = '#5fd35a'; ctx.fillRect(zx(zone.c - zone.g), by - 8, zx(zone.c + zone.g) - zx(zone.c - zone.g), 16);
        // highlight zone on the metal
        ctx.save(); ctx.globalAlpha = 0.35 + Math.sin(t * 6) * 0.1; D.ell(ctx, zx(zone.c), cy, (zx(zone.c + zone.g) - zx(zone.c - zone.g)) / 2 + 4, prof.w * sc / 2 + 6); ctx.fillStyle = '#9be37a'; ctx.fill(); ctx.restore();
        // marker
        const mx = zx(pos);
        D.tri(ctx, mx - 10, by - 26, mx + 10, by - 26, mx, by - 8); D.fs(ctx, '#fff', 3);
        D.line(ctx, mx, by + 8, mx, cy - prof.w * sc / 2 - 4, 'rgba(255,255,255,.5)', 2);
        // hammer
        const hx = strikeAnim > 0 ? strikeX : mx;
        const lift = strikeAnim > 0 ? (1 - strikeAnim) * 30 : 70 + Math.sin(t * 4) * 6;
        ctx.save(); ctx.translate(hx + 60, cy - 20 - lift); ctx.rotate(strikeAnim > 0 ? -0.2 : -0.6);
        D.rrect(ctx, -6, -8, 12, 90, 5); D.fs(ctx, '#a8733f', 3.5);
        D.rrect(ctx, -34, -30, 68, 32, 6); D.fs(ctx, '#6a6a78', 3.5);
        ctx.restore();
        // construction bar
        ctx.textAlign = 'center'; ctx.font = '800 18px "Baloo 2", sans-serif'; ctx.fillStyle = '#f2dfb8';
        ctx.fillText('CONSTRUCTION', 560, 470);
        D.rrect(ctx, 380, 482, 360, 26, 13); D.fs(ctx, '#2a1a14', 3);
        D.rrect(ctx, 384, 486, 352 * construction / 100, 18, 9); ctx.fillStyle = construction >= 95 ? '#9be37a' : construction >= 70 ? '#ffd24a' : '#ff9a2a'; ctx.fill();
        ctx.font = '800 16px "Baloo 2", sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(construction + '%', 560, 496);
        ctx.textAlign = 'right'; ctx.font = '800 22px "Baloo 2", sans-serif'; ctx.lineWidth = 5; ctx.strokeStyle = D.OUT;
        ctx.strokeText(`Strikes left: ${strikes}`, 930, 50); ctx.fillStyle = '#ffe8c0'; ctx.fillText(`Strikes left: ${strikes}`, 930, 50);
      },
      key(e, down) { if (down && e.code === 'Space' && !e.repeat) strike(); },
    };
    function strike() {
      if (g.finished || strikes <= 0 || strikeAnim > 0.4) return;
      strikes--;
      const d = Math.abs(pos - zone.c);
      const zx = x0 + pos * (x1 - x0);
      strikeX = zx; strikeAnim = 1;
      S().stats.strikes++;
      let delta, text, good;
      if (d <= zone.g) { delta = Math.round(14 * hammerK); text = 'PERFECT STRIKE!'; good = true; perfectCount++; S().stats.perfectStrikes++; comboEvent('perfect', zx, cy - 80); BF.Audio.sfx('anvil', true); }
      else if (d <= zone.y) { delta = Math.round(7 * hammerK); text = 'GOOD'; good = 'ok'; BF.Audio.sfx('anvil', false); }
      else { delta = -6; text = 'BAD HAMMER STRIKE'; good = false; redCount++; dents.push(zx); comboEvent('bad', zx, cy - 80); BF.Audio.sfx('badhit'); st.fx.shake(6, 0.2); }
      construction = U.clamp(construction + delta, 0, 100);
      st.fx.text(zx, cy - 110, text, { color: good === true ? '#ffe066' : good === 'ok' ? '#9be37a' : '#ff6a5a', size: good === true ? 26 : 22, life: 1 });
      st.fx.text(zx + 40, cy - 70, (delta > 0 ? '+' : '') + delta + '%', { color: delta > 0 ? '#9be37a' : '#ff6a5a', size: 20, life: 0.9 });
      st.fx.emit('spark', zx, cy - 10, { n: good === true ? 34 : 16, speed: good === true ? 520 : 320, colors: ['#fff3b0', '#ffb347', '#ff7a2f'], size: 3, life: 0.6 });
      if (good === true) st.fx.emit('ring', zx, cy, { n: 1, color: '#ffe066', grow: 200, life: 0.35, force: true });
      if (good === true) st.fx.shake(3, 0.12);
      heat = Math.min(1, heat + 0.05);
      zone = newZone();
      speed *= 1.05;
      if (construction >= 100 || strikes <= 0) {
        const perfect = construction >= 100 && redCount === 0;
        setTimeout(() => {
          feedback(560, 200, construction >= 100 ? 'CONSTRUCTION 100%!' : construction >= 80 ? 'SOLID WORK' : 'NEEDS MORE WORK…', construction >= 100 ? true : construction >= 80 ? 'ok' : false);
        }, 250);
        finishGame('construction', construction, perfect, Shape);
      }
    }
    return g;
  }

  /* =========================================================
     MINIGAME 4 – SHAPE (grinding)
     ========================================================= */
  function Shape() {
    const design = BF.getDesign(sel.designId);
    const prof = profile(design.type, design.shape);
    const sc = Math.min(560 / prof.h, 170 / prof.w);
    const cx = 540, cy = 300;
    const tol = BF.DATA.upgrades.grind.value(S().upgrades.grind);
    const N = 64;
    const len = Math.min(520, prof.h * sc - 20);
    const amp = 38 + Math.random() * 18, freq = 1 + Math.random() * 0.8, ph = Math.random() * Math.PI;
    const pts = [];
    for (let i = 0; i < N; i++) { const k = i / (N - 1); pts.push({ x: cx - len / 2 + k * len, y: cy + Math.sin(k * Math.PI * 2 * freq + ph) * amp * Math.sin(k * Math.PI) }); }
    let progress = 0, active = false, samples = 0, accSum = 0, timeLeft = 8, started = false, lastGrind = 0;
    const g = {
      step: 'shape', title: 'Grind the edge', pts,
      help: `Press on the START circle and trace the glowing line to the end without lifting too far off it. Stay within ${tol}px for full marks. You have 8 seconds.`,
      down(p) {
        if (g.finished) return;
        const target = pts[Math.min(progress, N - 1)];
        if (U.dist(p.x, p.y, target.x, target.y) < 44) { active = true; started = true; }
      },
      move(p) {
        if (!active || g.finished) return;
        // look ahead a few points for the nearest
        let best = Infinity, bi = progress;
        for (let i = Math.max(0, progress - 2); i < Math.min(N, progress + 8); i++) {
          const d = U.dist(p.x, p.y, pts[i].x, pts[i].y);
          if (d < best) { best = d; bi = i; }
        }
        const acc = U.clamp(1 - Math.max(0, best - tol) / 34, 0, 1);
        samples++; accSum += acc;
        if (best < tol * 3.2 && bi > progress) progress = bi;
        if (performance.now() - lastGrind > 90) { BF.Audio.sfx('grind'); lastGrind = performance.now(); }
        st.fx.emit('spark', p.x, p.y, { n: 2, speed: 300, colors: acc > 0.8 ? ['#fff3b0', '#ffd24a'] : ['#ff7a5a'], size: 2.4, life: 0.4, angle: -2.4, spread: 0.6 });
        if (progress >= N - 1) end();
      },
      up() { active = false; },
      update(dt) {
        if (g.finished) return;
        if (started) { timeLeft -= dt; if (timeLeft <= 0) end(); }
      },
      draw(ctx) {
        D.forgeBackdrop(ctx, 960, 540, t, { furnaceX: 60 });
        drawSmith(ctx, 0.2, { tool: false });
        // workbench
        D.rrect(ctx, 230, 380, 640, 40, 8); D.fs(ctx, '#8a5a2f', 4);
        D.weapon(ctx, { designId: sel.designId, materialId: sel.materialId }, cx + ((prof.y0 + prof.y1) / 2) * sc, cy, Math.PI / 2, sc, { only: 'main', lw: 3 / sc });
        // grinding wheel
        ctx.save(); ctx.translate(860, 130); ctx.rotate(t * 12);
        D.circ(ctx, 0, 0, 56); D.fs(ctx, '#9a9282', 4);
        for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); D.line(ctx, 10, 0, 50, 0, 'rgba(0,0,0,.15)', 3); }
        D.circ(ctx, 0, 0, 10); D.fs(ctx, '#5a5a5a', 3);
        ctx.restore();
        // guide path
        ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = tol * 2 + 6; ctx.stroke();
        ctx.strokeStyle = 'rgba(255,220,120,.25)'; ctx.lineWidth = tol * 2; ctx.stroke();
        ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * 30; ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
        // traced part
        if (progress > 0) { ctx.beginPath(); for (let i = 0; i <= progress; i++) (i ? ctx.lineTo(pts[i].x, pts[i].y) : ctx.moveTo(pts[i].x, pts[i].y)); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 7; ctx.stroke(); ctx.strokeStyle = '#9be37a'; ctx.lineWidth = 3; ctx.stroke(); }
        ctx.restore();
        // start / end markers
        const sp = pts[Math.min(progress, N - 1)];
        if (!active) { D.circ(ctx, sp.x, sp.y, 22 + Math.sin(t * 6) * 3); ctx.lineWidth = 4; ctx.strokeStyle = '#9be37a'; ctx.stroke(); ctx.font = '800 14px "Baloo 2", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#9be37a'; ctx.fillText(progress ? 'CONTINUE' : 'START', sp.x, sp.y - 32); }
        const ep = pts[N - 1]; D.circ(ctx, ep.x, ep.y, 10); D.fs(ctx, '#ffd24a', 3);
        // readouts
        const acc = samples ? accSum / samples : 1;
        ctx.textAlign = 'right'; ctx.font = '800 22px "Baloo 2", sans-serif'; ctx.lineWidth = 5; ctx.strokeStyle = D.OUT;
        const l1 = `Time ${Math.max(0, timeLeft).toFixed(1)}s`, l2 = `Accuracy ${Math.round(acc * 100)}%`, l3 = `Traced ${Math.round(progress / (N - 1) * 100)}%`;
        [l1, l2, l3].forEach((l, i) => { ctx.strokeText(l, 780, 60 + i * 30); ctx.fillStyle = '#ffe8c0'; ctx.fillText(l, 780, 60 + i * 30); });
        // grinder under the pointer
        if (active) { ctx.save(); ctx.translate(st.pointer.x, st.pointer.y); ctx.rotate(t * 20); D.circ(ctx, 0, 0, 12); D.fs(ctx, '#9a9282', 3); D.line(ctx, -8, 0, 8, 0, 'rgba(0,0,0,.3)', 2); ctx.restore(); }
      },
    };
    function end() {
      if (g.finished) return;
      active = false;
      const cov = progress / (N - 1);
      const acc = samples ? accSum / samples : 0;
      const score = U.clamp(Math.round(cov * (0.25 + 0.75 * acc) * 100), 0, 100);
      const perfect = score >= 95;
      feedback(540, 180, perfect ? 'PERFECT SHAPE!' : score >= 85 ? 'SHARP EDGE' : score >= 60 ? 'ROUGH EDGE' : 'POOR SHAPE', perfect ? true : score >= 85 ? 'ok' : false);
      if (perfect) comboEvent('perfect', 540, 180); else if (score < 80) comboEvent('bad', 540, 180);
      finishGame('shape', score, perfect, Assemble);
    }
    return g;
  }

  /* =========================================================
     MINIGAME 5 – ASSEMBLE
     ========================================================= */
  function Assemble() {
    const design = BF.getDesign(sel.designId);
    const type = design.type;
    const prof = profile(type, design.shape);
    const slots = BF.DATA.weaponTypes[type].slots;
    const extentTop = Math.min(prof.y0, type === 'spear' ? -75 : -50), extentBot = type === 'shield' ? prof.y1 : 20;
    const sc = Math.min(360 / (extentBot - extentTop), 250 / Math.max(prof.w, 40));
    const ox = 400, oy = 290 - ((extentTop + extentBot) / 2) * sc;
    const snapR = 70 + S().upgrades.bench * 6;
    const perfR = BF.DATA.upgrades.bench.value(S().upgrades.bench);
    const behind = type === 'axe' || type === 'hammer' || type === 'spear' ? ['handle'] : [];
    const pieces = slots.map((slot, i) => {
      const a = D.slotAnchor(type, slot, design.shape);
      const tpl = BF.DATA.parts[sel.parts[slot].tpl];
      return { slot, color: tpl.color, name: tpl.name, tx: ox + a.x * sc, ty: oy + a.y * sc, x: 790 + (i % 2) * 70, y: 150 + i * 120, homeX: 790 + (i % 2) * 70, homeY: 150 + i * 120, placed: false, score: 0, wob: Math.random() * 6 };
    });
    let drag = null, dx = 0, dy = 0;
    const g = {
      step: 'assemble', title: 'Assemble the weapon', pieces,
      help: 'Drag each part onto its glowing outline. It snaps into place – drop it right on the mark for a Perfect Assembly.',
      down(p) {
        if (g.finished) return;
        const cand = pieces.filter((pc) => !pc.placed).sort((a, b) => U.dist(p.x, p.y, a.x, a.y) - U.dist(p.x, p.y, b.x, b.y))[0];
        if (cand && U.dist(p.x, p.y, cand.x, cand.y) < 70) { drag = cand; dx = cand.x - p.x; dy = cand.y - p.y; BF.Audio.sfx('click'); }
      },
      move(p) { if (drag) { drag.x = p.x + dx; drag.y = p.y + dy; } },
      up() {
        if (!drag) return;
        const pc = drag; drag = null;
        const d = U.dist(pc.x, pc.y, pc.tx, pc.ty);
        if (d <= snapR) {
          pc.placed = true;
          pc.score = d <= perfR ? 100 : U.clamp(Math.round(100 - (d - perfR) * 1.05), 50, 99);
          pc.x = pc.tx; pc.y = pc.ty;
          BF.Audio.sfx('snap');
          st.fx.emit('spark', pc.tx, pc.ty, { n: 14, speed: 260, colors: ['#fff3b0', '#ffd24a'], life: 0.5 });
          if (pc.score === 100) { st.fx.text(pc.tx, pc.ty - 40, 'PERFECT ASSEMBLY!', { color: '#ffe066', size: 24 }); BF.Audio.sfx('perfect'); S().stats.perfectAssemblies++; comboEvent('perfect', pc.tx, pc.ty); }
          else if (pc.score >= 75) st.fx.text(pc.tx, pc.ty - 40, 'GOOD FIT ' + pc.score + '%', { color: '#9be37a', size: 20 });
          else { st.fx.text(pc.tx, pc.ty - 40, 'POOR ASSEMBLY ' + pc.score + '%', { color: '#ff6a5a', size: 20 }); comboEvent('bad', pc.tx, pc.ty); }
          if (pieces.every((x) => x.placed)) end();
        } else {
          st.fx.text(pc.x, pc.y - 30, 'MISS!', { color: '#ff6a5a', size: 20 });
          BF.Audio.sfx('miss');
          pc.x = pc.homeX; pc.y = pc.homeY;
        }
      },
      update() {},
      draw(ctx) {
        D.forgeBackdrop(ctx, 960, 540, t, { furnaceX: 60 });
        drawSmith(ctx, 0.2, { tool: false });
        D.rrect(ctx, 200, 60, 520, 440, 20); D.fs(ctx, '#7a5230', 4);
        ctx.save(); D.rrect(ctx, 200, 60, 520, 440, 20); ctx.clip(); for (let i = 0; i < 12; i++) D.line(ctx, 200, 80 + i * 38, 720, 84 + i * 38, 'rgba(0,0,0,.12)', 2); ctx.restore();
        D.rrect(ctx, 730, 80, 200, 420, 16); D.fs(ctx, '#5a3a22', 4);
        ctx.font = '800 16px "Baloo 2", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#f2dfb8'; ctx.fillText('PARTS', 830, 108);
        const drawPiece = (pc, alpha = 1) => {
          ctx.save(); ctx.globalAlpha = alpha; ctx.translate(pc.x, pc.y); ctx.scale(sc, sc);
          D.component(ctx, type, pc.slot, pc.color, design.shape, 2.6 / sc * 1.2, true);
          ctx.restore();
        };
        // ghosts
        pieces.forEach((pc) => { if (!pc.placed) { ctx.save(); ctx.globalAlpha = 0.25 + Math.sin(t * 5 + pc.wob) * 0.1; ctx.translate(pc.tx, pc.ty); ctx.scale(sc, sc); D.component(ctx, type, pc.slot, '#9be37a', design.shape, 2 / sc, true); ctx.restore(); D.circ(ctx, pc.tx, pc.ty, perfR); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(155,227,122,.7)'; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]); } });
        pieces.filter((pc) => pc.placed && behind.includes(pc.slot)).forEach((pc) => drawPiece(pc));
        D.weapon(ctx, { designId: sel.designId, materialId: sel.materialId }, ox, oy, 0, sc, { only: 'main', lw: 3 / sc });
        pieces.filter((pc) => pc.placed && !behind.includes(pc.slot)).forEach((pc) => drawPiece(pc));
        pieces.filter((pc) => !pc.placed && pc !== drag).forEach((pc) => { drawPiece(pc); ctx.font = '700 12px "Baloo 2", sans-serif'; ctx.fillStyle = '#f2dfb8'; ctx.textAlign = 'center'; ctx.fillText(BF.DATA.slots[pc.slot].name, pc.homeX, pc.homeY + 56); });
        if (drag) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 16; drawPiece(drag); ctx.restore(); D.line(ctx, drag.x, drag.y, drag.tx, drag.ty, 'rgba(155,227,122,.4)', 2); }
      },
    };
    function end() {
      const avg = Math.round(pieces.reduce((a, p) => a + p.score, 0) / pieces.length);
      const perfect = pieces.every((p) => p.score === 100);
      setTimeout(() => feedback(460, 150, perfect ? 'PERFECT ASSEMBLY!' : avg >= 85 ? 'WELL FITTED' : 'LOOSE FIT', perfect ? true : avg >= 85 ? 'ok' : false), 300);
      finishGame('assembly', avg, perfect, null);
    }
    return g;
  }

  /* =========================================================
     FINISH – compute the weapon and hand it over
     ========================================================= */
  function finalize() {
    const s = S();
    const design = BF.getDesign(sel.designId);
    const lucky = BF.DATA.upgrades.lucky.value(s.upgrades.lucky);
    const critCraft = Math.random() < lucky;
    const parts = {};
    for (const slot in sel.parts) parts[slot] = { tpl: sel.parts[slot].tpl, rarity: sel.parts[slot].rarity };
    const w = BF.Stats.calculateWeaponStats({ designId: sel.designId, materialId: sel.materialId, parts, scores, maxCombo, critCraft });
    w.uid = U.uid('w'); w.crafted = new Date().toISOString(); w.owner = cls; w.kills = 0; w.broken = false;
    s.armory.push(w);
    if (s.armory.length > 300) {
      // keep the armory bounded – drop the oldest broken weapons first
      const idx = s.armory.findIndex((x) => x.broken);
      s.armory.splice(idx >= 0 ? idx : 0, 1);
    }
    // consume parts & special items
    for (const slot in sel.parts) { const uid = sel.parts[slot].uid; if (uid) s.weaponParts = s.weaponParts.filter((p) => p.uid !== uid); }
    if (design.epic) design.requires.forEach((r) => { s.inventory.special[r] = Math.max(0, (s.inventory.special[r] || 0) - 1); });
    delete s.craftRefund;
    // statistics
    const stt = s.stats;
    stt.weaponsCrafted++;
    stt.totalCraftScore += w.overall;
    stt.bestOverall = Math.max(stt.bestOverall, w.overall);
    stt.highestCombo = Math.max(stt.highestCombo, maxCombo);
    if (w.overall >= 100) stt.perfectWeapons++;
    if (critCraft) stt.critCrafts++;
    if (w.element) stt.elementalCrafted++;
    if (w.rarity === 'legendary' || w.rarity === 'mythic') stt.legendaryWeapons++;
    if (scores.construction >= 100 && scores.assembly >= 100 && scores.shape >= 100) stt.perfectForge++;
    if (!stt.materialsUsed.includes(w.materialId)) stt.materialsUsed.push(w.materialId);
    if (design.epic) { stt.epicCrafted++; if (!stt.epicTypes.includes(design.id)) stt.epicTypes.push(design.id); }
    if (s.session) s.session.equipped[cls] = w.uid;
    BF.Prog.checkAchievements();
    BF.Save.save();
    game = null;
    BF.Game.go('CRAFTING_RESULT', { uid: w.uid, cls });
  }

  /* =========================================================
     SCREEN
     ========================================================= */
  function onKeyDown(e) { if (game && game.key) { if (e.code === 'Space') e.preventDefault(); game.key(e, true); } }
  function onKeyUp(e) { if (game && game.key) game.key(e, false); if (e.code === 'Space') keyHeld = false; }

  return {
    enter(r, params = {}) {
      root = r; t = 0; game = null; st = null; busy = false; keyHeld = false;
      cls = params.cls;
      if (!BF.save.session || !cls || !BF.DATA.warriors[cls]) { BF.Game.go('ORDER'); return; }
      sel = { materialId: null, designId: null, parts: {} };
      scores = {}; combo = 0; maxCombo = 0;
      BF.Audio.music('forge');
      layout();
      // Pre-select a sensible default material (best owned & usable)
      const usable = BF.DATA.materialOrder.filter((id) => materialState(id).ok);
      sel.materialId = usable[usable.length - 1] || null;
      showMaterial();
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
    },
    exit() {
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      st = null; game = null;
    },
    update(dt) {
      t += dt;
      if (!st) return;
      st.fx.update(dt);
      if (game && game.update) game.update(dt);
    },
    draw() {
      if (!st || !game) return;
      st.begin();
      game.draw(st.ctx);
      st.fx.draw(st.ctx);
      st.end();
    },
    // exposed for tests
    _debug: () => ({ stepId, scores, game, sel }),
  };
})();

</script>
<script>
/* ---- js/screens/craftresult.js ---- */
/* =========================================================
   CRAFTING RESULT – the big reveal of the finished weapon.
   ========================================================= */
BF.Screens.CRAFTING_RESULT = (function () {
  const U = BF.U, h = U.h, D = BF.Draw;
  let st = null, t = 0, w = null, cls = null, starsShown = 0, tier = null;

  function statRow(label, value, prev, suffix = '') {
    const diff = prev != null ? Math.round(value - prev) : null;
    return h('div', { class: 'res-stat' }, h('span', null, label), h('b', { class: 'count-up', dataset: { to: value, suffix } }, '0' + suffix),
      diff != null && diff !== 0 ? h('small', { class: diff > 0 ? 'up' : 'down' }, (diff > 0 ? '▲ +' : '▼ ') + diff) : h('small', null, ''));
  }

  function countUp(root) {
    root.querySelectorAll('.count-up').forEach((el) => {
      const to = parseFloat(el.dataset.to), suffix = el.dataset.suffix || '';
      const dec = to % 1 !== 0 ? 1 : 0;
      const t0 = performance.now();
      const step = () => {
        const k = U.clamp((performance.now() - t0) / 900, 0, 1);
        el.textContent = (to * U.easeOutCubic(k)).toFixed(dec) + suffix;
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  return {
    enter(root, params = {}) {
      t = 0; starsShown = 0;
      w = BF.save.armory.find((x) => x.uid === params.uid);
      cls = params.cls;
      if (!w) { BF.Game.go('ORDER'); return; }
      tier = BF.Stats.qualityTier(w.overall);
      // previous weapon of this warrior type for comparison
      const prev = BF.save.armory.filter((x) => x.uid !== w.uid && BF.getDesign(x.designId).type === BF.getDesign(w.designId).type).slice(-1)[0] || null;
      const d = BF.DATA.warriors[cls] || BF.DATA.warriors.ironguard;
      const r = BF.DATA.rarities[w.rarity];
      const wrap = h('div', { class: 'result-layout' });
      const stageBox = h('div', { class: 'result-stage' });
      const qualityName = tier.id === 'perfect' || tier.id === 'masterwork' ? 'GOLD QUALITY' : tier.name.toUpperCase() + ' QUALITY';
      const info = h('div', { class: 'result-info panel', style: { '--rc': r.color } },
        h('small', { class: 'eyebrow' }, 'Weapon complete'),
        h('h1', null, w.name),
        h('div', { class: 'result-tier' }, BF.UI.stars(tier.stars), h('b', { style: { color: tier.ink } }, qualityName), BF.UI.rarityChip(w.rarity), w.critCraft ? h('span', { class: 'chip crit' }, 'CRITICAL CRAFT +12%') : null),
        h('div', { class: 'res-stats' },
          statRow('Power', w.power, prev && prev.power),
          statRow('Durability', w.maxDurability, prev && prev.maxDurability),
          statRow('Luck', w.luck, prev && prev.luck),
          statRow('Critical', w.crit, prev && prev.crit, '%'),
          statRow('Speed', w.speed, prev && prev.speed, '×'),
          statRow('Armor pen', w.armorPen, prev && prev.armorPen, '%')),
        w.element ? h('div', { class: 'res-el' }, BF.UI.elementChip(w.element)) : null,
        w.teamBonus ? h('div', { class: 'res-epic' }, h('b', null, 'Team bonus'), BF.getDesign(w.designId).bonusText.map((b) => h('small', null, '✦ ' + b))) : null,
        h('div', { class: 'res-scores' },
          [['Melt', 'melt'], ['Pour', 'pour'], ['Construction', 'construction'], ['Shape', 'shape'], ['Assembly', 'assembly']].map(([l, k]) =>
            h('div', { class: 'rs' }, h('span', null, l), h('b', { style: { color: BF.Stats.qualityTier(w.scores[k]).ink } }, Math.round(w.scores[k]) + '%'))),
          h('div', { class: 'rs' }, h('span', null, `Combo x${w.maxCombo}`), h('b', null, '+' + Math.round(w.comboBonus) + '%')),
          h('div', { class: 'rs total' }, h('span', null, 'Overall'), h('b', { style: { color: tier.ink } }, w.overall + '%'))),
        prev ? h('p', { class: 'muted small' }, `Compared with your last ${BF.getDesign(w.designId).type}: ${prev.name} (${prev.overall}%).`) : null,
        h('div', { class: 'result-actions' },
          BF.UI.btn(`Give to ${d.name} →`, () => { BF.Audio.sfx('whoosh'); BF.Game.go('ORDER'); }, 'primary big')));
      wrap.append(stageBox, info);
      root.append(wrap);
      st = BF.UI.stage(stageBox, 640, 520, 'result-canvas');
      countUp(info);
      BF.Audio.sfx(w.overall >= 95 ? 'rare' : 'levelup');
      st.fx.emit('confetti', 320, 200, { n: w.overall >= 85 ? 70 : 30, speed: 520, colors: [r.color, '#ffd24a', '#fff', '#ff8a3d'], size: 7, life: 2.2, force: true });
    },
    exit() { st = null; },
    update(dt) {
      if (!st) return;
      t += dt;
      st.fx.update(dt);
      // stars pop one by one
      if (starsShown < tier.stars && t > 0.6 + starsShown * 0.28) {
        starsShown++;
        BF.Audio.sfx('star');
        st.fx.emit('star', 180 + starsShown * 56, 470, { n: 10, speed: 200, colors: ['#ffe066', '#fff'], size: 6, life: 0.7, force: true });
      }
      if (Math.random() < dt * 10) st.fx.emit('magic', U.rand(160, 480), U.rand(120, 400), { n: 1, speed: 30, colors: [BF.DATA.rarities[w.rarity].color, '#fff'], size: 4, life: 1.2 });
    },
    draw() {
      if (!st) return;
      const ctx = st.ctx, W = st.W, H = st.H;
      const r = BF.DATA.rarities[w.rarity];
      st.begin();
      const bg = ctx.createRadialGradient(W / 2, H / 2 - 20, 20, W / 2, H / 2, W * 0.7);
      bg.addColorStop(0, U.mix(r.color, '#2a1a24', 0.55)); bg.addColorStop(1, '#1a1014');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      // light rays
      ctx.save(); ctx.translate(W / 2, H / 2 - 30); ctx.rotate(t * 0.25);
      for (let i = 0; i < 14; i++) { ctx.rotate(Math.PI * 2 / 14); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, -400); ctx.lineTo(40, -400); ctx.closePath(); ctx.fillStyle = U.rgba(r.color, 0.08); ctx.fill(); }
      ctx.restore();
      // weapon slides/spins in
      const k = U.clamp(t / 0.9, 0, 1);
      const s = U.easeOutBack(k);
      const design = BF.getDesign(w.designId);
      const type = design.type;
      const baseScale = type === 'spear' ? 3.4 : type === 'shield' ? 4.2 : type === 'bow' ? 4.2 : 3.9;
      const ang = type === 'shield' || type === 'bow' ? 0 : 0.6;
      const yOff = type === 'shield' || type === 'bow' ? 0 : 90;
      const float = Math.sin(t * 2) * 6;
      ctx.save();
      if (!(BF.save.settings.performance)) { ctx.shadowColor = r.color; ctx.shadowBlur = 40; }
      D.weapon(ctx, w, W / 2 - 20, H / 2 - 30 + yOff * 0.6 + float, ang + (1 - k) * 3, baseScale * s, { glow: true, lw: 2.4 / baseScale * 1.2 + 0.6 });
      ctx.restore();
      // shine sweep
      const sweep = ((t * 0.6) % 1.6) - 0.3;
      if (sweep > 0 && sweep < 1) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const gx = sweep * W;
        const g = ctx.createLinearGradient(gx - 60, 0, gx + 60, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
      }
      // stars
      for (let i = 0; i < 5; i++) {
        const on = i < starsShown;
        const sx = 208 + i * 56, sy = 470;
        const pop = on ? U.easeOutBack(U.clamp((t - 0.6 - i * 0.28) / 0.3, 0, 1)) : 1;
        ctx.save(); ctx.translate(sx, sy); ctx.scale(pop, pop);
        BF.FX.starPath(ctx, 0, 0, 22, 10, 5); D.fs(ctx, on ? '#ffd24a' : 'rgba(255,255,255,.12)', 3);
        ctx.restore();
      }
      st.fx.draw(ctx);
      st.end();
    },
  };
})();

</script>
<script>
/* ---- js/screens/battle.js ---- */
/* =========================================================
   PRE-BATTLE + BATTLE
   The battle renders BF.BattleSim, lets the player aim & fire
   the cannon and sweep up loot.
   ========================================================= */
(function () {
  const U = BF.U, h = U.h, D = BF.Draw;

  function squadFromSession() {
    const s = BF.save.session;
    if (!s) return null;
    const out = [];
    for (const cls of s.squad) {
      const w = BF.save.armory.find((x) => x.uid === s.equipped[cls]);
      if (!w || w.broken) return null;
      out.push({ cls, weapon: w });
    }
    return out;
  }

  /* =========================================================
     PRE_BATTLE – squad review with a transparent damage table
     ========================================================= */
  BF.Screens.PRE_BATTLE = {
    enter(root) {
      const squad = squadFromSession();
      if (!squad) { BF.Game.go('ORDER'); return; }
      const m = BF.DATA.missions[BF.save.session.missionId];
      const team = BF.Stats.teamBonus(squad.map((s) => s.weapon));
      const enemyIds = [...new Set(m.waves.flat().map((g) => g.enemy))];
      const tn = BF.TUNE.area[m.area] || [1, 1, 1, 1];

      const cards = h('div', { class: 'pb-squad' }, squad.map(({ cls, weapon }) => {
        const d = BF.DATA.warriors[cls];
        return h('div', { class: 'pb-card panel' },
          h('div', { class: 'pb-top' }, BF.Icons.portrait(cls, 56), h('div', null, h('b', null, d.name), h('small', null, `HP ${BF.Stats.warriorMaxHP(cls, BF.save.playerLevel)} · ${d.role}`))),
          h('div', { class: 'pb-weapon' }, BF.Icons.weapon(weapon, 64), h('div', null, h('b', null, weapon.name), BF.UI.stars(weapon.stars))),
          BF.UI.statBar('Power', weapon.power, Math.max(100, weapon.power * 1.2), '#ff8a3d'),
          BF.UI.statBar('Durability', weapon.durability, weapon.maxDurability, '#52a8ff'),
          weapon.element ? BF.UI.elementChip(weapon.element) : null);
      }));

      const table = h('table', { class: 'dmg-table' },
        h('thead', null, h('tr', null, h('th', null, 'Enemy'), h('th', null, 'HP'), squad.map(({ cls }) => h('th', null, BF.Icons.portrait(cls, 30))))),
        h('tbody', null, enemyIds.map((id) => {
          const e = BF.DATA.enemies[id];
          const hp = Math.round(e.hp * (e.boss ? 1 : m.enemyScale) * (e.boss ? tn[2] : tn[0]));
          return h('tr', null,
            h('td', { class: 'dt-enemy' }, h('div', null, BF.Icons.enemy(id, 34), h('span', null, e.name))),
            h('td', null, U.fmt(hp)),
            squad.map(({ cls, weapon }) => {
              const r = BF.Stats.expectedDamage(weapon, cls, e, team);
              const hits = Math.ceil(hp / Math.max(1, r.avg));
              const cls2 = r.typeMult > 1 || r.elMult > 1 ? 'good' : r.typeMult < 1 ? 'bad' : '';
              return h('td', { class: 'dt-cell ' + cls2, title: `Type ×${r.typeMult} · Armor ×${r.armorK.toFixed(2)}${weapon.element ? ' · Element ×' + r.elMult : ''}` },
                h('b', null, r.avg), h('small', null, `${hits} hit${hits > 1 ? 's' : ''}`));
            }));
        })));

      const ammo = BF.DATA.cannonOrder.filter((id) => BF.DATA.cannonballs[id].unlockLevel <= BF.save.playerLevel);
      const tb = Object.entries(team).filter(([, v]) => v > 0);
      root.append(h('div', { class: 'prebattle' },
        BF.UI.screenHeader('Ready for battle', `${m.id} · ${m.name} · ${m.waves.length} waves`, 'ORDER'),
        cards,
        h('div', { class: 'pb-grid' },
          h('section', { class: 'panel' }, h('h3', null, 'Damage per hit (average)'),
            h('div', { class: 'table-scroll' }, table),
            h('p', { class: 'muted small' }, 'Green = the enemy is weak to this weapon, red = it resists. Armour reduces damage; hammers pierce it.')),
          h('section', { class: 'panel' }, h('h3', null, 'Cannon ammo'),
            h('div', { class: 'ammo-list' }, ammo.map((id) => {
              const n = id === 'normal' ? '∞' : (BF.save.inventory.cannonballs[id] || 0);
              return h('div', { class: 'ammo-item' }, BF.Icons.item({ kind: 'cannonball', id }, 34), h('span', null, h('b', null, BF.DATA.cannonballs[id].name), h('small', null, BF.DATA.cannonballs[id].desc)), h('b', { class: 'ammo-n' }, n));
            })),
            tb.length ? h('div', { class: 'team-bonus' }, h('h3', null, 'Team bonus'), tb.map(([k, v]) => h('span', { class: 'chip good' }, `${U.cap(k.replace('Res', ' resist'))} +${Math.round(v * 100)}%`))) : null,
            h('p', { class: 'muted small' }, 'Tip: click or tap the battlefield to fire. Sweep the cursor over drops to collect loot before it fades!'))),
        h('div', { class: 'pb-actions' }, BF.UI.btn('March out! ⚔', () => BF.Game.go('BATTLE'), 'primary big'))));
    },
  };

  /* =========================================================
     BATTLE
     ========================================================= */
  BF.Screens.BATTLE = (function () {
    let st, sim, mission, area, t, camX, pickups, banners, chains, ammoSel, uiEls, squadRef, endTimer, ended, dropped, collected, lootLog, saveTimer, dirty, cardTimer, lastPointer;
    const GY = 420;

    function toScreen(x, y) { return { x: x - camX, y: GY - y }; }

    function banner(text, sub, color = '#ffe8c0', dur = 1.8) { banners.push({ text, sub, color, t: 0, dur }); }

    function spawnDrops(e) {
      const luck = squadRef.reduce((a, s) => a + (s.weapon.luck || 0), 0) * 0.003;
      const drops = BF.Loot.rollEnemyDrops(e.def, mission, { luck, team: sim.team });
      drops.forEach((it) => {
        dropped++;
        pickups.push({ item: it, x: e.x + U.rand(-10, 10), y: 40 + e.fly, vx: U.rand(-90, 90), vy: U.rand(260, 380), life: 11, t: 0, bob: Math.random() * 6 });
      });
    }

    function collect(p) {
      if (p.done) return;
      p.done = true;
      collected++;
      const res = BF.Loot.grant(p.item);
      lootLog.push(p.item);
      const sp = toScreen(p.x, p.y);
      const rar = BF.Loot.itemRarity(p.item);
      const col = p.item.kind === 'gold' ? '#ffd24a' : BF.DATA.rarities[rar].color;
      st.fx.text(sp.x, sp.y - 30, '+' + res.text + (res.soldFor ? ` (storage full: +${res.soldFor}g)` : ''), { color: col, size: p.item.kind === 'gold' ? 16 : 18, life: 1.2, rise: 60 });
      st.fx.emit('star', sp.x, sp.y - 10, { n: 6, speed: 160, colors: [col, '#fff'], size: 5, life: 0.5 });
      if (p.item.kind === 'gold') BF.Audio.sfx('coin');
      else if (BF.DATA.rarities[rar].order >= 2 || p.item.kind === 'special' || p.item.kind === 'blueprint') {
        BF.Audio.sfx('rare');
        if (p.item.kind === 'blueprint' || p.item.kind === 'special' || BF.DATA.rarities[rar].order >= 3) BF.UI.toast(BF.Loot.itemName(p.item), { kind: 'loot', title: 'Rare find!', icon: BF.Icons.item(p.item, 40) });
      } else BF.Audio.sfx('loot');
      dirty = true;
      BF.UI.updateHUD();
    }

    function handleEvents() {
      const stats = BF.save.stats;
      for (const ev of sim.events) {
        switch (ev.type) {
          case 'enemyHit': {
            const e = ev.enemy; const sp = toScreen(e.x, e.fly + 60 * (e.def.art.size || 1));
            const col = ev.crit ? '#ffe066' : ev.element ? BF.DATA.elements[ev.element].color : ev.weak === 'weak' ? '#9be37a' : ev.weak === 'resist' ? '#c9c0b0' : '#ffffff';
            if (ev.source !== 'dot' || ev.dmg >= 8) st.fx.text(sp.x + U.rand(-12, 12), sp.y, (ev.crit ? 'CRIT ' : '') + ev.dmg, { color: col, size: ev.crit ? 26 : ev.source === 'dot' ? 13 : 18, life: 0.8, rise: 70 });
            if (ev.weak === 'weak' && Math.random() < 0.3) st.fx.text(sp.x, sp.y - 22, 'WEAK!', { color: '#9be37a', size: 13, life: 0.7 });
            if (ev.weak === 'resist' && Math.random() < 0.3) st.fx.text(sp.x, sp.y - 22, 'RESIST', { color: '#c9c0b0', size: 13, life: 0.7 });
            if (ev.source !== 'dot') st.fx.emit('spark', sp.x, sp.y + 20, { n: ev.crit ? 12 : 5, speed: 240, colors: ['#fff', '#ffd27a'], size: 2.5, life: 0.35 });
            if (ev.source === 'warrior') BF.Audio.sfx(ev.crit ? 'crit' : 'hit');
            stats.highestDamage = Math.max(stats.highestDamage, ev.dmg);
            if (ev.crit) st.fx.shake(3, 0.1);
            break;
          }
          case 'kill': {
            const e = ev.enemy; const sp = toScreen(e.x, e.fly + 30);
            const col = e.def.art.skin || e.def.art.fur || e.def.art.body || e.def.art.stone || e.def.art.cap || '#888';
            st.fx.emit('smoke', sp.x, sp.y, { n: 10, speed: 90, color: '#e8e0d0', size: 10, life: 0.8, jitter: 16 });
            st.fx.emit('debris', sp.x, sp.y, { n: 10, speed: 320, colors: [col, U.shade(col, -0.3)], size: 6, life: 1.1, floor: GY + 6 });
            BF.Audio.sfx('death');
            stats.enemiesDefeated++;
            if (e.def.boss) { stats.bossesDefeated++; st.fx.shake(14, 0.6); banner(e.def.name.toUpperCase() + ' DEFEATED!', null, '#ffe066', 2.2); }
            if (ev.source === 'cannon') stats.cannonKills++;
            spawnDrops(e);
            break;
          }
          case 'warriorHit': {
            const w = ev.warrior; const sp = toScreen(w.x, 70);
            st.fx.text(sp.x, sp.y, ev.blocked ? 'BLOCK ' + ev.dmg : '-' + ev.dmg, { color: ev.blocked ? '#9fd6f2' : '#ff6a5a', size: 15, life: 0.7 });
            BF.Audio.sfx(ev.blocked ? 'block' : 'hurt');
            break;
          }
          case 'break': {
            const w = ev.warrior; const sp = toScreen(w.x + 14, 40);
            const mc = BF.DATA.materials[w.weapon.materialId];
            st.fx.emit('debris', sp.x, sp.y, { n: 18, speed: 360, colors: [mc.color, mc.light, mc.dark], size: 6, life: 1.2, floor: GY + 6, force: true });
            st.fx.text(sp.x, sp.y - 60, 'WEAPON BROKE!', { color: '#ff8a5a', size: 24, life: 1.6 });
            BF.Audio.sfx('break');
            stats.weaponsBroken++;
            st.fx.shake(5, 0.2);
            break;
          }
          case 'ko': {
            const sp = toScreen(ev.warrior.x, 90);
            st.fx.text(sp.x, sp.y, 'KNOCKED OUT', { color: '#ff6a5a', size: 20, life: 1.5 });
            break;
          }
          case 'swing': BF.Audio.sfx('swing'); break;
          case 'bowDraw': BF.Audio.sfx('arrow'); break;
          case 'cannonFire': {
            const sp = toScreen(sim.wagonX() + 60, 62);
            BF.Audio.sfx('cannon');
            st.fx.emit('smoke', sp.x + 30, sp.y, { n: 10, speed: 120, color: '#ddd', size: 12, life: 0.9, angle: -0.4, spread: 0.6 });
            st.fx.shake(4, 0.12);
            stats.cannonShots++;
            break;
          }
          case 'cannonLand': {
            const sp = toScreen(ev.x, ev.y);
            const cb = BF.DATA.cannonballs[ev.ammo];
            BF.Audio.sfx(ev.ammo === 'lightning' ? 'zap' : 'boom');
            st.fx.emit('spark', sp.x, sp.y, { n: 24, speed: 420, colors: [cb.color, '#fff', '#ffd27a'], size: 3, life: 0.6 });
            st.fx.emit('ring', sp.x, sp.y, { n: 1, color: cb.color === '#3a3a44' ? '#ffd27a' : cb.color, grow: cb.radius * 3.2, life: 0.35, force: true });
            st.fx.emit('smoke', sp.x, sp.y, { n: 8, speed: 80, color: ev.ammo === 'poison' ? '#8fe04a' : '#bbb', size: 14, life: 1, jitter: 20 });
            st.fx.shake(ev.ammo === 'explosive' ? 10 : 5, 0.2);
            if (!ev.hits) st.fx.text(sp.x, sp.y - 30, 'MISS', { color: '#c9c0b0', size: 14, life: 0.6 });
            break;
          }
          case 'chain': chains.push({ a: ev.from.x, ay: ev.from.fly + 30, b: ev.to.x, by: ev.to.fly + 30, t: 0.25 }); break;
          case 'wave': {
            if (!ev.boss) banner(`WAVE ${ev.index + 1} / ${ev.total}`, null, '#ffe8c0', 1.4);
            BF.Audio.sfx('whoosh');
            break;
          }
          case 'boss': {
            const def = BF.DATA.enemies[ev.enemy];
            banner('BOSS APPROACHES', def.name, '#ff6a5a', 2.6);
            BF.Audio.sfx('boss'); BF.Audio.music('boss');
            st.fx.shake(12, 0.8);
            break;
          }
          case 'bossTell': {
            const sp = toScreen(ev.enemy.x, 180);
            const txt = { stomp: 'GROUND STOMP!', volley: 'VOLLEY!', summon: 'CALLS FOR HELP!', slam: 'HEAVY SLAM!' }[ev.pattern];
            st.fx.text(sp.x, sp.y, txt, { color: '#ff8a5a', size: 22, life: 1.1 });
            break;
          }
          case 'stomp': case 'slam': st.fx.shake(ev.type === 'stomp' ? 12 : 8, 0.35); BF.Audio.sfx('boom'); { const sp = toScreen(ev.enemy.x - 40, 0); st.fx.emit('debris', sp.x, sp.y, { n: 20, speed: 380, colors: ['#8a7a62', '#5a4a3a'], size: 6, life: 1, floor: GY + 6 }); } break;
          case 'waveClear': st.fx.text(480, 150, 'Wave cleared!', { color: '#9be37a', size: 26, life: 1.4 }); break;
          case 'victory':
            banner('VICTORY!', 'Grab the loot!', '#ffe066', 3);
            BF.Audio.sfx('victory'); BF.Audio.music('map');
            st.fx.emit('confetti', 480, 120, { n: 80, speed: 520, colors: ['#ffd24a', '#ff8a3d', '#9be37a', '#52a8ff', '#fff'], size: 7, life: 2.4, force: true });
            endTimer = 3.4;
            break;
          case 'defeat':
            banner('DEFEAT', 'Your squad retreats…', '#ff6a5a', 3);
            BF.Audio.sfx('defeat');
            endTimer = 3.0;
            break;
          default: break;
        }
      }
      sim.events.length = 0;
    }

    function fireAt(px, py) {
      const wx = camX + px, wy = GY - py;
      if (!sim.canFire(ammoSel)) {
        if (ammoSel !== 'normal' && !(sim.ammo[ammoSel] > 0)) { ammoSel = 'normal'; renderAmmo(); }
        return;
      }
      sim.fireCannon(wx, Math.max(0, wy), ammoSel);
      if (ammoSel !== 'normal' && !(sim.ammo[ammoSel] > 0)) { ammoSel = 'normal'; }
      renderAmmo();
    }

    function pickupRadius() { return 46 + BF.save.upgrades.magnet * 14; }

    function tryCollect(px, py) {
      let got = false;
      const r = pickupRadius();
      for (const p of pickups) {
        if (p.done) continue;
        const sp = toScreen(p.x, p.y + 8);
        if (U.dist(px, py, sp.x, sp.y) < r) { collect(p); got = true; }
      }
      return got;
    }

    function renderAmmo() {
      const bar = uiEls.ammo;
      bar.innerHTML = '';
      BF.DATA.cannonOrder.forEach((id, i) => {
        const cb = BF.DATA.cannonballs[id];
        if (cb.unlockLevel > BF.save.playerLevel) return;
        const n = id === 'normal' ? '∞' : (sim.ammo[id] || 0);
        bar.append(h('button', {
          class: 'ammo-btn' + (ammoSel === id ? ' on' : ''), disabled: id !== 'normal' && !(sim.ammo[id] > 0), title: cb.desc + ` (key ${i + 1})`,
          onclick: () => { ammoSel = id; BF.Audio.sfx('click'); renderAmmo(); },
        }, BF.Icons.item({ kind: 'cannonball', id }, 30), h('span', null, cb.name), h('b', null, n), h('kbd', null, String(i + 1))));
      });
    }

    function renderCards() {
      const box = uiEls.cards;
      if (!box.children.length) {
        sim.warriors.forEach((w) => {
          box.append(h('div', { class: 'bw-card', dataset: { cls: w.cls } },
            BF.Icons.portrait(w.cls, 40),
            h('div', { class: 'bw-bars' },
              h('div', { class: 'bw-row' }, h('small', null, 'HP'), h('span', { class: 'bar hp' }, h('i')), h('b', { class: 'hp-t' })),
              h('div', { class: 'bw-row' }, h('small', null, 'DUR'), h('span', { class: 'bar dur' }, h('i')), h('b', { class: 'dur-t' }))),
            h('span', { class: 'bw-state' })));
        });
      }
      sim.warriors.forEach((w, i) => {
        const el = box.children[i];
        if (!el) return;
        const hpk = w.hp / w.maxHp, dk = w.weapon.durability / w.weapon.maxDurability;
        el.querySelector('.bar.hp i').style.width = U.clamp(hpk * 100, 0, 100) + '%';
        el.querySelector('.bar.dur i').style.width = U.clamp(dk * 100, 0, 100) + '%';
        el.querySelector('.bar.dur i').style.background = dk < 0.25 ? '#e0322a' : dk < 0.5 ? '#ffb347' : '#52a8ff';
        el.querySelector('.hp-t').textContent = Math.max(0, Math.round(w.hp));
        el.querySelector('.dur-t').textContent = Math.max(0, Math.round(w.weapon.durability));
        el.querySelector('.bw-state').textContent = w.state === 'fight' ? '' : w.weapon.broken ? 'Broken' : 'KO';
        el.classList.toggle('out', w.state !== 'fight');
      });
      const alive = sim.alive().length;
      uiEls.wave.textContent = sim.waveIndex < 0 ? 'Marching…' : `Wave ${sim.waveIndex + 1}/${mission.waves.length}`;
      uiEls.kills.textContent = `${sim.kills}/${sim.totalEnemies + (sim.enemies.filter((e) => e.summoned).length)} defeated · ${alive} on field`;
      uiEls.prog.style.width = U.clamp((sim.waveIndex + (alive ? 0.5 : 1)) / mission.waves.length * 100, 0, 100) + '%';
    }

    function endMission() {
      if (ended) return;
      ended = true;
      const sum = sim.summary();
      // write back weapon durability
      sim.warriors.forEach((w) => {
        const aw = BF.save.armory.find((x) => x.uid === BF.save.session.equipped[w.cls]);
        if (aw) { aw.durability = Math.max(0, Math.round(w.weapon.durability * 10) / 10); aw.broken = !!w.weapon.broken || aw.durability <= 0; aw.kills = (aw.kills || 0) + w.kills; }
      });
      // spend ammo
      for (const id in sum.ammoUsed) BF.save.inventory.cannonballs[id] = Math.max(0, (BF.save.inventory.cannonballs[id] || 0) - sum.ammoUsed[id]);
      BF.Game.go('MISSION_RESULT', { missionId: mission.id, summary: sum, dropped, collected, loot: lootLog.slice(), squad: squadRef.map((s) => ({ cls: s.cls, uid: s.weapon.uid })) });
    }

    async function retreat() {
      const ok = await BF.UI.confirm('Retreat?', 'The mission counts as failed. Loot you already picked up is kept.', 'Retreat', true);
      if (!ok || ended || !sim) return;
      sim.warriors.forEach((w) => { if (w.state === 'fight') w.state = 'retreat'; });
    }

    function onKey(e) {
      const i = parseInt(e.key, 10);
      if (i >= 1 && i <= 7) {
        const id = BF.DATA.cannonOrder[i - 1];
        if (id && BF.DATA.cannonballs[id].unlockLevel <= BF.save.playerLevel && (id === 'normal' || sim.ammo[id] > 0)) { ammoSel = id; renderAmmo(); }
      }
      if (e.code === 'Space' && lastPointer) { e.preventDefault(); fireAt(lastPointer.x, lastPointer.y); }
    }

    return {
      enter(root) {
        const squad = squadFromSession();
        if (!squad) { BF.Game.go('ORDER'); return; }
        mission = BF.DATA.missions[BF.save.session.missionId];
        area = BF.DATA.areas[mission.area - 1];
        squadRef = squad;
        t = 0; pickups = []; banners = []; chains = []; ammoSel = 'normal'; endTimer = null; ended = false; dropped = 0; collected = 0; lootLog = []; saveTimer = 0; dirty = false; cardTimer = 0; lastPointer = null;
        sim = new BF.BattleSim.Sim({
          mission, squad: squad.map((s) => ({ cls: s.cls, weapon: Object.assign({}, s.weapon) })), level: BF.save.playerLevel,
          upgrades: BF.save.upgrades, ammo: Object.assign({}, BF.save.inventory.cannonballs),
        });
        camX = sim.camX();
        BF.Audio.music('battle');
        uiEls = {};
        const top = h('div', { class: 'battle-top' },
          h('div', { class: 'bt-title' }, h('small', null, `${area.name} · ${mission.id}`), h('b', null, mission.name)),
          h('div', { class: 'bt-prog' }, uiEls.wave = h('b', null, ''), h('span', { class: 'bar' }, uiEls.prog = h('i')), uiEls.kills = h('small', null, '')),
          BF.UI.btn('Retreat', retreat, 'ghost small'));
        const stageBox = h('div', { class: 'battle-stage' });
        uiEls.ammo = h('div', { class: 'ammo-bar', role: 'toolbar', 'aria-label': 'Cannon ammo' });
        uiEls.cards = h('div', { class: 'bw-cards' });
        root.append(h('div', { class: 'battle-layout' }, top, stageBox, h('div', { class: 'battle-bottom' }, uiEls.ammo, uiEls.cards)));
        st = BF.UI.stage(stageBox, 960, 540, 'battle-canvas');
        st.on('down', (p) => { lastPointer = p; if (!tryCollect(p.x, p.y)) fireAt(p.x, p.y); });
        st.on('move', (p) => { lastPointer = p; tryCollect(p.x, p.y); });
        renderAmmo();
        renderCards();
        window.addEventListener('keydown', onKey);
      },
      exit() {
        window.removeEventListener('keydown', onKey);
        if (dirty) BF.Save.save();
        st = null; sim = null;
      },
      update(dt) {
        if (!st || !sim) return;
        t += dt;
        sim.update(dt);
        handleEvents();
        st.fx.update(dt);
        camX = U.lerp(camX, sim.camX(), Math.min(1, dt * 3));
        // pickups physics
        for (const p of pickups) {
          if (p.done) continue;
          p.t += dt;
          p.vy -= 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.y <= 0) { p.y = 0; p.vy = Math.abs(p.vy) > 60 ? -p.vy * 0.4 : 0; p.vx *= 0.6; }
          if (p.t > p.life) { p.done = true; p.expired = true; }
          else if (p.x - camX < -40) { p.done = true; p.expired = true; }
        }
        pickups = pickups.filter((p) => !p.done);
        // hover collection even when the pointer is still
        if (lastPointer && st.pointer.inside) tryCollect(lastPointer.x, lastPointer.y);
        banners.forEach((b) => (b.t += dt)); banners = banners.filter((b) => b.t < b.dur);
        chains.forEach((c) => (c.t -= dt)); chains = chains.filter((c) => c.t > 0);
        cardTimer -= dt; if (cardTimer <= 0) { cardTimer = 0.12; renderCards(); }
        saveTimer -= dt; if (dirty && saveTimer <= 0) { saveTimer = 4; dirty = false; BF.Save.save(); }
        if (endTimer != null) { endTimer -= dt; if (endTimer <= 0) { endTimer = null; endMission(); } }
      },
      draw() {
        if (!st || !sim) return;
        const ctx = st.ctx;
        st.begin();
        D.battleBackdrop(ctx, area, 960, 540, camX, t);
        // poison clouds
        sim.effects.forEach((f) => { const sp = toScreen(f.x, f.y); ctx.save(); ctx.globalAlpha = 0.25 + Math.sin(t * 5) * 0.05; D.ell(ctx, sp.x, GY - 10, f.r, f.r * 0.35); ctx.fillStyle = '#8fe04a'; ctx.fill(); ctx.restore(); });
        // wagon + aim
        const wagon = toScreen(sim.wagonX(), 0);
        const aimP = lastPointer || { x: 700, y: 300 };
        const aim = Math.atan2(aimP.y - (GY - 62), aimP.x - (wagon.x + 18));
        D.wagon(ctx, wagon.x, GY + 18, U.clamp(aim, -1.3, 0.4), sim.phase === 'march' ? t : 0, sim.cannon.recoil);
        // actors sorted for depth
        const lanes = [0, 12, -8, 18, -12, 6];
        const actors = [];
        sim.warriors.forEach((w, i) => { if (w.state !== 'out') actors.push({ kind: 'w', o: w, lane: lanes[i % lanes.length] }); });
        sim.enemies.forEach((e, i) => actors.push({ kind: 'e', o: e, lane: (i % 3) * 8 - 8 }));
        actors.sort((a, b) => a.lane - b.lane);
        for (const a of actors) {
          if (a.kind === 'w') {
            const w = a.o; const sp = toScreen(w.x, 0);
            if (sp.x < -80 || sp.x > 1040) continue;
            D.critter(ctx, sp.x, GY + a.lane, w.cls, { t: t + w.offset, scale: 1.35, walk: w.walk, attack: w.anim, hurt: w.hurt, weapon: w.weapon, broken: w.weapon.broken, dir: w.state === 'retreat' ? -1 : 1 });
            if (w.state === 'fight') {
              const bx = sp.x - 22, by = GY + a.lane - 118;
              ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx - 1, by - 1, 46, 11);
              ctx.fillStyle = '#e0322a'; ctx.fillRect(bx, by, 44, 5); ctx.fillStyle = '#6fdc5a'; ctx.fillRect(bx, by, 44 * U.clamp(w.hp / w.maxHp, 0, 1), 5);
              const dk = U.clamp(w.weapon.durability / w.weapon.maxDurability, 0, 1);
              ctx.fillStyle = '#2a2a3a'; ctx.fillRect(bx, by + 5, 44, 4); ctx.fillStyle = dk < 0.25 ? '#e0322a' : dk < 0.5 ? '#ffb347' : '#52a8ff'; ctx.fillRect(bx, by + 5, 44 * dk, 4);
            }
          } else {
            const e = a.o; const sp = toScreen(e.x, e.fly);
            if (sp.x < -160 || sp.x > 1140) continue;
            const alpha = e.dead ? U.clamp(1 - e.deadT / 0.8, 0, 1) : 1;
            if (alpha <= 0) continue;
            if (e.tell > 0) { ctx.save(); ctx.globalAlpha = 0.4 + Math.sin(t * 20) * 0.2; D.ell(ctx, sp.x, GY + a.lane, 60 * (e.def.art.size || 1), 16); ctx.fillStyle = '#ff3a2a'; ctx.fill(); ctx.restore(); }
            D.enemy(ctx, e.def, sp.x, sp.y + a.lane + (e.dead ? e.deadT * 30 : 0), { t: t + e.x * 0.01, walk: e.walk, attack: e.anim, hurt: e.hurt, alpha, frozen: e.slowT > 0 });
            if (e.burnT > 0 && Math.random() < 0.3) st.fx.emit('ember', sp.x + U.rand(-15, 15), sp.y + a.lane - 30, { n: 1, speed: 60, colors: ['#ff7a2f', '#ffb347'], size: 3, life: 0.6 });
            if (e.poisonT > 0 && Math.random() < 0.2) st.fx.emit('ember', sp.x, sp.y + a.lane - 30, { n: 1, speed: 40, colors: ['#8fe04a'], size: 3, life: 0.6 });
            if (!e.dead && !e.def.boss && e.hp < e.maxHp) {
              const bw = 40, bx = sp.x - bw / 2, by = sp.y + a.lane - 90 * (e.def.art.size || 1) - 8;
              ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
              ctx.fillStyle = '#ff5a4a'; ctx.fillRect(bx, by, bw * U.clamp(e.hp / e.maxHp, 0, 1), 5);
            }
            if (e.stunT > 0) { ctx.font = '800 16px "Baloo 2"'; ctx.fillStyle = '#ffe44d'; ctx.textAlign = 'center'; ctx.fillText('✦ ✦', sp.x, sp.y + a.lane - 100); }
          }
        }
        // projectiles
        sim.projectiles.forEach((p) => { if (p.t < 0) return; const sp = toScreen(p.x, p.y); D.projectile(ctx, { x: sp.x, y: sp.y, vx: p.vx, vy: p.vy, kind: p.kind, ammo: p.ammo }, t); });
        // lightning chains
        chains.forEach((c) => {
          const a = toScreen(c.a, c.ay), b = toScreen(c.b, c.by);
          ctx.save(); ctx.strokeStyle = '#ffe44d'; ctx.lineWidth = 3; ctx.shadowColor = '#ffe44d'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.moveTo(a.x, a.y);
          for (let k = 1; k < 6; k++) ctx.lineTo(U.lerp(a.x, b.x, k / 6) + U.rand(-10, 10), U.lerp(a.y, b.y, k / 6) + U.rand(-10, 10));
          ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
        });
        // loot
        pickups.forEach((p) => {
          const sp = toScreen(p.x, p.y);
          const blink = p.life - p.t < 3 && Math.sin(t * 20) > 0;
          if (!blink) D.lootDrop(ctx, p.item, sp.x, sp.y + Math.sin(t * 4 + p.bob) * (p.y === 0 ? 2 : 0), t, 1.15);
        });
        st.fx.draw(ctx);
        // boss bar
        const boss = sim.enemies.find((e) => e.def.boss && !e.dead);
        if (boss) {
          const bw = 520, bx = 480 - bw / 2, by = 22;
          D.rrect(ctx, bx - 6, by - 6, bw + 12, 30, 10); D.fs(ctx, 'rgba(20,10,14,.8)', 3);
          ctx.fillStyle = '#5a1a14'; ctx.fillRect(bx, by, bw, 18);
          ctx.fillStyle = '#e0322a'; ctx.fillRect(bx, by, bw * U.clamp(boss.hp / boss.maxHp, 0, 1), 18);
          ctx.font = '800 14px "Baloo 2", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(`${boss.def.name} · ${U.fmt(Math.max(0, boss.hp))} / ${U.fmt(boss.maxHp)}`, 480, by + 14);
        }
        // crosshair
        if (lastPointer && st.pointer.inside && endTimer == null) {
          const cb = BF.DATA.cannonballs[ammoSel];
          const ready = sim.canFire(ammoSel);
          ctx.save(); ctx.translate(lastPointer.x, lastPointer.y);
          ctx.strokeStyle = ready ? 'rgba(255,240,200,.9)' : 'rgba(255,120,100,.6)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(0, 0, cb.radius * 0.7, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
          D.line(ctx, -24, 0, -8, 0, ctx.strokeStyle, 2); D.line(ctx, 8, 0, 24, 0, ctx.strokeStyle, 2); D.line(ctx, 0, -24, 0, -8, ctx.strokeStyle, 2); D.line(ctx, 0, 8, 0, 24, ctx.strokeStyle, 2);
          if (!ready && sim.cannon.cd > 0) { ctx.beginPath(); ctx.arc(0, 0, 20, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - sim.cannon.cd / sim.cannon.reload)); ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 4; ctx.stroke(); }
          ctx.restore();
        }
        // banners
        banners.forEach((b) => {
          const k = b.t / b.dur;
          const a = k < 0.15 ? k / 0.15 : k > 0.8 ? (1 - k) / 0.2 : 1;
          const sc = k < 0.15 ? U.easeOutBack(k / 0.15) : 1;
          ctx.save(); ctx.globalAlpha = a; ctx.translate(480, 200); ctx.scale(sc, sc);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = '800 64px "Grenze Gotisch", serif'; ctx.lineWidth = 10; ctx.strokeStyle = '#1a0e0a'; ctx.strokeText(b.text, 0, 0); ctx.fillStyle = b.color; ctx.fillText(b.text, 0, 0);
          if (b.sub) { ctx.font = '800 24px "Baloo 2", sans-serif'; ctx.lineWidth = 6; ctx.strokeText(b.sub, 0, 50); ctx.fillStyle = '#fff'; ctx.fillText(b.sub, 0, 50); }
          ctx.restore();
        });
        st.end();
      },
      _sim: () => sim,
    };
  })();
})();
