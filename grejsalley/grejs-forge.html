<script>
/* ---- js/screens/missionresult.js ---- */
/* =========================================================
   MISSION RESULT – rewards, scores and unlocks.
   Rewards are applied once when the screen is entered.
   ========================================================= */
BF.Screens.MISSION_RESULT = (function () {
  const U = BF.U, h = U.h;

  function aggregateLoot(items) {
    const agg = { gold: 0, gem: 0, ore: {}, parts: {}, special: {}, cannonball: {}, blueprint: [] };
    items.forEach((it) => {
      if (it.kind === 'gold') agg.gold += it.amount;
      else if (it.kind === 'gem') agg.gem += it.amount;
      else if (it.kind === 'ore') agg.ore[it.id] = (agg.ore[it.id] || 0) + it.amount;
      else if (it.kind === 'part') agg.parts[it.rarity] = (agg.parts[it.rarity] || 0) + 1;
      else if (it.kind === 'special') agg.special[it.id] = (agg.special[it.id] || 0) + 1;
      else if (it.kind === 'cannonball') agg.cannonball[it.id] = (agg.cannonball[it.id] || 0) + it.amount;
      else if (it.kind === 'blueprint') agg.blueprint.push(it.id);
    });
    return agg;
  }

  return {
    enter(root, p = {}) {
      const s = BF.save;
      const m = BF.DATA.missions[p.missionId];
      if (!m || !p.summary) { BF.Game.go('WORLD_MAP'); return; }
      const sum = p.summary;
      const victory = sum.victory;
      const firstClear = victory && !s.completedMissions[m.id];

      // --- scores
      const weapons = (p.squad || []).map((x) => s.armory.find((w) => w.uid === x.uid)).filter(Boolean);
      const craftScore = weapons.length ? Math.round(weapons.reduce((a, w) => a + w.overall, 0) / weapons.length) : 0;
      const lootFrac = p.dropped ? p.collected / p.dropped : 1;
      const battleScore = Math.round(100 * (0.45 * (sum.standing / sum.squad) + 0.25 * sum.hpFrac + 0.3 * lootFrac) * (victory ? 1 : 0.6));
      const overall = Math.round(craftScore * 0.5 + battleScore * 0.5);

      // --- rewards
      const baseXP = 50 + 22 * m.globalIndex + (m.boss ? 60 : 0);
      let xp = Math.round(baseXP * (0.75 + overall / 200) * (victory ? (firstClear ? 1 : 0.6) : 0.3));
      const bonusGold = victory ? Math.round((30 + 25 * m.globalIndex) * (firstClear ? 1 : 0.4)) : 0;
      s.gold += bonusGold; s.stats.goldEarned += bonusGold;

      const warriorsBefore = s.warriors.slice(), areasBefore = s.unlockedAreas.slice();
      if (victory) {
        const prev = s.completedMissions[m.id];
        s.completedMissions[m.id] = { best: Math.max(prev ? prev.best : 0, overall), times: (prev ? prev.times : 0) + 1 };
        s.stats.missionsCompleted++;
        if (sum.standing === sum.squad) s.stats.flawless++;
      } else s.stats.missionsFailed++;
      const ups = BF.Prog.addXP(xp);
      BF.Prog.syncUnlocks();
      const newWarriors = s.warriors.filter((w) => !warriorsBefore.includes(w));
      const newAreas = s.unlockedAreas.filter((a) => !areasBefore.includes(a));
      s.session = null;
      BF.Shop.generate(m.id + ':' + Date.now());
      BF.Prog.checkAchievements();
      BF.Save.save(true);

      // --- UI
      const agg = aggregateLoot(p.loot || []);
      const lootRows = [];
      if (agg.gold) lootRows.push([BF.Icons.item({ kind: 'gold' }, 30), `+${U.fmt(agg.gold)} Gold`]);
      if (bonusGold) lootRows.push([BF.Icons.glyph('coin', 30), `+${U.fmt(bonusGold)} Gold (mission reward)`]);
      if (agg.gem) lootRows.push([BF.Icons.item({ kind: 'gem' }, 30), `+${agg.gem} Gems`]);
      for (const id in agg.ore) lootRows.push([BF.Icons.material(id, 30), `+${agg.ore[id]} ${BF.DATA.materials[id].name} ore`]);
      for (const r in agg.parts) lootRows.push([BF.Icons.item({ kind: 'part', tpl: 'gempommel' }, 30), h('span', { style: { color: BF.DATA.rarities[r].ink, fontWeight: 800 } }, `+${agg.parts[r]} ${BF.DATA.rarities[r].name} part${agg.parts[r] > 1 ? 's' : ''}`)]);
      for (const id in agg.special) lootRows.push([BF.Icons.item({ kind: 'special', id }, 30), h('span', { class: 'rare-text' }, `+${agg.special[id]} ${BF.DATA.specials[id].name}`)]);
      for (const id in agg.cannonball) lootRows.push([BF.Icons.item({ kind: 'cannonball', id }, 30), `+${agg.cannonball[id]} ${BF.DATA.cannonballs[id].name}`]);
      agg.blueprint.forEach((id) => lootRows.push([BF.Icons.item({ kind: 'blueprint', id }, 30), h('span', { class: 'rare-text' }, `Epic Blueprint: ${BF.DATA.epics[id].name}`)]));
      if (!lootRows.length) lootRows.push([BF.Icons.glyph('chest', 30), h('span', { class: 'muted' }, 'No loot collected')]);

      const scoreBox = (label, v) => h('div', { class: 'mr-score' }, h('small', null, label), h('b', { style: { color: BF.Stats.qualityTier(v).ink } }, v + '%'));
      const warriorRows = sum.warriors.map((w) => {
        const sq = (p.squad || []).find((x) => x.cls === w.cls); const aw = sq ? s.armory.find((x) => x.uid === sq.uid) : null;
        const state = w.state === 'fight' ? 'Victorious' : w.weapon.broken ? 'Weapon broke' : 'Knocked out';
        return h('div', { class: 'mr-warrior' + (w.state === 'fight' ? '' : ' down') },
          BF.Icons.portrait(w.cls, 42),
          h('div', null, h('b', null, BF.DATA.warriors[w.cls].name), h('small', null, `${state} · ${w.kills} kills · ${U.fmt(w.dealt)} damage`)),
          aw ? h('small', { class: 'mr-dur' }, `Durability ${Math.round(Math.max(0, w.weapon.durability))}/${w.weapon.maxDurability}`) : null);
      });

      const unlockBox = [];
      newWarriors.forEach((cls) => unlockBox.push(h('div', { class: 'callout good' }, BF.Icons.portrait(cls, 56), h('div', null, h('b', null, 'New warriors join you!'), h('p', null, `The ${BF.DATA.warriors[cls].name} (${BF.DATA.warriors[cls].role}) will fight at your side.`)))));
      newAreas.forEach((a) => unlockBox.push(h('div', { class: 'callout good' }, BF.Icons.glyph('map', 48), h('div', null, h('b', null, 'New area unlocked!'), h('p', null, `${BF.DATA.areas[a - 1].name} – ${BF.DATA.areas[a - 1].subtitle}.`)))));
      if (victory && m.id === '5-B') unlockBox.push(h('div', { class: 'callout good' }, BF.Icons.glyph('crown', 56), h('div', null, h('b', null, 'The realm is saved!'), h('p', null, 'The Ash King has fallen. Keep forging – every mission can be replayed for loot and better scores.'))));

      const next = BF.nextMissionId(m.id);
      root.append(h('div', { class: 'mresult' + (victory ? ' win' : ' lose') },
        h('div', { class: 'mr-head' },
          h('small', null, `${m.id} · ${m.name}`),
          h('h1', null, victory ? 'Mission complete' : 'Mission failed'),
          victory ? BF.UI.stars(overall >= 95 ? 5 : overall >= 85 ? 4 : overall >= 70 ? 3 : overall >= 50 ? 2 : 1) : h('p', null, 'Stronger weapons would have lasted longer. Improve your crafting, pick warriors that match the enemy weaknesses and try again.')),
        h('div', { class: 'mr-grid' },
          h('section', { class: 'panel' },
            h('h3', null, 'Battle report'),
            h('div', { class: 'mr-line' }, h('span', null, 'Enemies defeated'), h('b', null, `${sum.kills}`)),
            h('div', { class: 'mr-line' }, h('span', null, 'Loot collected'), h('b', null, `${p.collected}/${p.dropped}`)),
            h('div', { class: 'mr-line' }, h('span', null, 'XP'), h('b', { class: 'xp-text' }, `+${xp}`)),
            h('div', { class: 'mr-scores' }, scoreBox('Craft score', craftScore), scoreBox('Battle score', battleScore), scoreBox('Overall', overall)),
            h('div', { class: 'mr-warriors' }, warriorRows)),
          h('section', { class: 'panel' },
            h('h3', null, 'Loot'),
            h('ul', { class: 'mr-loot' }, lootRows.map(([ic, txt]) => h('li', null, ic, typeof txt === 'string' ? h('span', null, txt) : txt))),
            unlockBox)),
        h('div', { class: 'mr-actions' },
          BF.UI.btn('Return to map', () => BF.Game.go('WORLD_MAP', { missionId: victory && next ? next : m.id }), 'ghost big'),
          BF.UI.btn('Continue to the merchant →', () => BF.Game.go('SHOP', { from: 'mission', next: victory ? next : m.id }), 'primary big'))));

      if (victory) setTimeout(() => BF.Audio.sfx('coin'), 300);
      BF.Prog.showLevelUps(ups);
      BF.UI.updateHUD();
    },
  };
})();

</script>
<script>
/* ---- js/screens/shop.js ---- */
/* =========================================================
   SHOP – Mira the travelling merchant.
   ========================================================= */
BF.Screens.SHOP = (function () {
  const U = BF.U, h = U.h;
  let root, params;

  function describe(it) {
    switch (it.kind) {
      case 'ore': { const m = BF.DATA.materials[it.id]; return `Power ${m.power} · Durability ${m.durability} · Luck ${m.luck}${m.element ? ' · ' + BF.DATA.elements[m.element.type].name : ''}`; }
      case 'part': {
        const ps = BF.Stats.partStats(it);
        const bits = [ps.power && `+${ps.power} Power`, ps.durability && `+${ps.durability} Durability`, ps.luck && `+${ps.luck} Luck`, ps.crit && `+${ps.crit}% Crit`, ps.speed && `+${ps.speed}% Speed`, ps.element && `+${ps.element.value} ${BF.DATA.elements[ps.element.type].name}`].filter(Boolean);
        return `${BF.DATA.slots[BF.DATA.parts[it.tpl].slot].name} · ` + bits.join(' · ');
      }
      case 'cannonball': return BF.DATA.cannonballs[it.id].desc;
      case 'special': return BF.DATA.specials[it.id].desc;
      case 'blueprint': { const e = BF.DATA.epics[it.id]; return `Needs ${e.requires.map((r) => BF.DATA.specials[r].name).join(' + ')}. ${e.bonusText[0]}.`; }
      default: return '';
    }
  }

  function render() {
    root.innerHTML = '';
    const stock = BF.Shop.ensure();
    const s = BF.save;
    const disc = BF.Shop.discount();
    const grid = h('div', { class: 'shop-grid' });
    stock.forEach((o, i) => {
      const it = o.item;
      const price = BF.Shop.priceOf(o);
      const rar = BF.Loot.itemRarity(it);
      const locked = it.kind === 'ore' && !s.materials.includes(it.id);
      const card = h('div', { class: 'shop-card panel' + (o.sold ? ' sold' : ''), style: { '--rc': BF.DATA.rarities[rar].color } },
        h('div', { class: 'sc-icon' }, BF.Icons.item(it, 64)),
        h('b', { class: 'sc-name' }, BF.Loot.itemName(it)),
        BF.UI.rarityChip(rar),
        h('p', { class: 'sc-desc' }, describe(it)),
        locked ? h('small', { class: 'warn-text' }, 'You cannot forge this yet') : null,
        h('div', { class: 'sc-buy' },
          h('span', { class: 'price' + (s.gold < price ? ' short' : '') }, BF.Icons.glyph('coin', 22), U.fmt(price), disc < 1 ? h('s', null, U.fmt(o.price)) : null),
          o.sold ? h('span', { class: 'sold-stamp' }, 'SOLD OUT') : BF.UI.btn('Buy', () => {
            const r = BF.Shop.buy(i);
            if (!r.ok) { BF.Audio.sfx('error'); BF.UI.toast(r.error, { kind: 'bad' }); return; }
            BF.Audio.sfx('buy');
            BF.UI.toast('Bought ' + BF.Loot.itemName(it), { kind: 'good' });
            BF.Prog.checkAchievements();
            BF.Save.save();
            BF.UI.updateHUD();
            render();
          }, 'primary small', { disabled: s.gold < price })));
      grid.append(card);
    });

    const cap = BF.DATA.upgrades.storage.value(s.upgrades.storage);
    root.append(h('div', { class: 'shop' },
      BF.UI.screenHeader('The Wandering Wagon', 'Fresh stock arrives after every mission. When it\'s gone, it\'s gone.', 'WORLD_MAP',
        h('div', { class: 'shop-gold' }, BF.Icons.glyph('coin', 28), h('b', null, U.fmt(s.gold)))),
      h('div', { class: 'shop-body' },
        h('div', { class: 'merchant panel' },
          BF.Icons.portrait(null, 110, 'fox'),
          h('div', { class: 'speech' }, h('small', null, 'Mira the merchant'), h('p', null, U.pick([
            'Ores from three kingdoms, parts from four! Well… mostly from goblins.',
            'Everything must go! Except the bits that already went.',
            'Coin first, questions never.',
            'A smith with fine parts is a smith with live customers!']))),
          h('small', { class: 'muted' }, `Part storage: ${s.weaponParts.length}/${cap}`),
          disc < 1 ? h('small', { class: 'good-text' }, `Merchant Guild discount: ${Math.round((1 - disc) * 100)}%`) : null,
          BF.UI.btn('Sell parts', () => BF.Game.go('INVENTORY', { tab: 'parts' }), 'small')),
        grid),
      h('div', { class: 'shop-actions' },
        BF.UI.btn('Forge upgrades', () => BF.Game.go('UPGRADES'), ''),
        BF.UI.btn(params.next ? 'Onward to the next mission →' : 'Back to the map', () => BF.Game.go('WORLD_MAP', params.next ? { missionId: params.next } : {}), 'primary big'))));
  }

  return {
    enter(r, p = {}) { root = r; params = p; BF.Audio.music('map'); render(); },
  };
})();

</script>

(function () {

      return h('div', { class: 'compare panel' },

          h('label', { class: 'sort' }, 'Sort ', h('select', { id: 'armory-sort', onchange: (e) => { sort = e.target.value; render(); } },

  BF.Screens.INVENTORY = (function () {

        body = h('div', { class: 'inv-grid' }, BF.DATA.cannonOrder.map((id) => {
          const cb = BF.DATA.cannonballs[id]; const n = id === 'normal' ? '∞' : (s.inventory.cannonballs[id] || 0);
          return h('div', { class: 'inv-card panel' + (cb.unlockLevel <= s.playerLevel ? '' : ' locked') }, BF.Icons.item({ kind: 'cannonball', id }, 48),
            h('div', null, h('b', null, cb.name, ' ', h('span', { class: 'qty' }, '×' + n)), h('small', null, cb.desc), cb.unlockLevel > s.playerLevel ? h('small', { class: 'muted' }, `Unlocks at level ${cb.unlockLevel}`) : null));
        }));
      }
      root.append(h('div', { class: 'collection' },
        BF.UI.screenHeader('Materials & Inventory', 'Everything in your stores', back()),
        h('div', { class: 'toolbar' },
          BF.UI.tabs(tabs, tab, (id) => { tab = id; render(); }),
          (tab === 'ore' || tab === 'parts') ? h('label', { class: 'sort' }, 'Sort ', h('select', { id: 'inv-sort', onchange: (e) => { sort = e.target.value; render(); } },
            ['rarity', 'name', 'power', 'quantity'].map((v) => h('option', { value: v, selected: sort === v }, U.cap(v))))) : null),
        body));
    }
    return { enter(r, p = {}) { root = r; if (p.tab) tab = p.tab; render(); } };
  })();

  /* ---------------------------- BLUEPRINTS ---------------------------- */
  BF.Screens.BLUEPRINTS = {
    enter(root) {
      const s = BF.save;
      const groups = Object.keys(BF.DATA.weaponTypes).map((type) => {
        const list = Object.values(BF.DATA.weapons).filter((d) => d.type === type).sort((a, b) => a.unlockLevel - b.unlockLevel);
        return h('section', { class: 'bp-group' }, h('h3', null, BF.DATA.weaponTypes[type].name + 's', h('small', null, ' – ' + BF.DATA.weaponTypes[type].desc)),
          h('div', { class: 'bp-grid' }, list.map((d) => {
            const on = s.blueprints.includes(d.id);
            return h('div', { class: 'bp-card panel' + (on ? '' : ' locked') }, BF.Icons.weapon({ designId: d.id, materialId: on ? 'steel' : 'copper' }, 72),
              h('b', null, d.name), BF.UI.rarityChip(d.rarity),
              h('small', null, on ? `Base power ${d.basePower} · Durability ${d.baseDurability} · Ore ×${d.cost}` : `Unlocks at level ${d.unlockLevel}`));
          })));
      });
      const epics = h('section', { class: 'bp-group' }, h('h3', null, 'Epic Blueprints', h('small', null, ' – rare plans found on bosses. Give the whole team a bonus.')),
        h('div', { class: 'bp-grid' }, Object.values(BF.DATA.epics).map((d) => {
          const on = s.epicBlueprints.includes(d.id);
          return h('div', { class: 'bp-card epic panel' + (on ? '' : ' locked') },
            on ? BF.Icons.weapon({ designId: d.id, materialId: d.minMaterial }, 72) : BF.Icons.glyph('lock', 56),
            h('b', null, on ? d.name : 'Undiscovered'), BF.UI.rarityChip(d.rarity),
            on ? h('div', { class: 'bp-req' },
              d.requires.map((r) => h('span', { class: 'chip ' + ((s.inventory.special[r] || 0) > 0 ? 'good' : 'resist') }, `${BF.DATA.specials[r].name} ${(s.inventory.special[r] || 0) > 0 ? '✓' : '✗'}`)),
              h('small', null, `Min. material: ${BF.DATA.materials[d.minMaterial].name}`),
              d.bonusText.map((b) => h('small', { class: 'good-text' }, '✦ ' + b))) : h('small', { class: 'muted' }, 'Defeat bosses to find it.'));
        })));
      root.append(h('div', { class: 'collection' }, BF.UI.screenHeader('Blueprints', `${s.blueprints.length} designs known · ${s.epicBlueprints.length}/${Object.keys(BF.DATA.epics).length} epic`, back()), epics, groups));
    },
  };

  /* ---------------------------- UPGRADES ---------------------------- */
  BF.Screens.UPGRADES = (function () {
    let root;
    function render() {
      root.innerHTML = '';
      const s = BF.save;
      const grid = h('div', { class: 'upg-grid' }, BF.DATA.upgradeOrder.map((id) => {
        const u = BF.DATA.upgrades[id];
        const lvl = s.upgrades[id];
        const maxed = lvl >= u.max;
        const cost = maxed ? 0 : BF.upgradeCost(id, lvl);
        return h('div', { class: 'upg-card panel' + (maxed ? ' maxed' : '') },
          h('div', { class: 'upg-top' }, BF.Icons.glyph(u.icon, 48), h('div', null, h('b', null, u.name + (id === 'forge' ? ` ${lvl + 1}` : '')), h('div', { class: 'pips' }, Array.from({ length: u.max }, (_, i) => h('span', { class: 'pip' + (i < lvl ? ' on' : '') }))))),
          h('p', null, u.desc),
          h('div', { class: 'upg-effect' }, h('span', null, u.fmt(u.value(lvl))), maxed ? null : h('span', { class: 'arrow' }, '→'), maxed ? null : h('b', null, u.fmt(u.value(lvl + 1)))),
          maxed ? h('span', { class: 'chip good' }, 'MAXED') : BF.UI.btn(h('span', null, BF.Icons.glyph('coin', 20), ' ' + U.fmt(cost)), () => {
            if (s.gold < cost) { BF.Audio.sfx('error'); BF.UI.toast(`You need ${U.fmt(cost - s.gold)} more gold.`, { kind: 'bad' }); return; }
            s.gold -= cost; s.upgrades[id]++; s.stats.upgradesBought++;
            BF.Audio.sfx('anvil', true); BF.Audio.sfx('levelup');
            BF.UI.toast(`${u.name} upgraded!`, { kind: 'good', icon: BF.Icons.glyphURL(u.icon, 40) });
            BF.Prog.checkAchievements(); BF.Save.save(); BF.UI.updateHUD(); render();
          }, 'primary', { disabled: s.gold < cost }));
      }));
      root.append(h('div', { class: 'collection' }, BF.UI.screenHeader('Forge Upgrades', `Forge Level ${s.upgrades.forge + 1} · max furnace ${BF.DATA.upgrades.forge.value(s.upgrades.forge)}°C`, back()), grid));
    }
    return { enter(r) { root = r; render(); } };
  })();

  /* ---------------------------- ACHIEVEMENTS ---------------------------- */
  BF.Screens.ACHIEVEMENTS = {
    enter(root) {
      const s = BF.save;
      const all = BF.DATA.achievements;
      const got = all.filter((a) => s.achievements[a.id]).length;
      root.append(h('div', { class: 'collection' },
        BF.UI.screenHeader('Achievements', `${got} / ${all.length} badges earned`, back()),
        h('div', { class: 'ach-progress' }, h('span', { class: 'bar' }, h('i', { style: { width: (got / all.length * 100) + '%' } }))),
        h('div', { class: 'ach-grid' }, all.map((a) => {
          const on = !!s.achievements[a.id];
          return h('div', { class: 'ach-card panel' + (on ? ' on' : '') },
            h('div', { class: 'ach-badge' }, BF.Icons.glyph(on ? a.icon : 'lock', 44)),
            h('div', null, h('b', null, a.name), h('small', null, a.desc), h('small', { class: on ? 'good-text' : 'muted' }, on ? `Earned ${U.fmtDate(s.achievements[a.id])}` : `Reward: ${a.reward} gold`)));
        }))));
    },
  };

  /* ---------------------------- STATS ---------------------------- */
  BF.Screens.STATS = {
    enter(root) {
      const s = BF.save, st = s.stats;
      const avgCraft = st.weaponsCrafted ? Math.round(st.totalCraftScore / st.weaponsCrafted) : 0;
      const rows = [
        ['Player level', s.playerLevel], ['Weapons crafted', st.weaponsCrafted], ['Perfect weapons (100%)', st.perfectWeapons], ['Best weapon quality', st.bestOverall + '%'],
        ['Average crafting score', avgCraft + '%'], ['Total crafting score', U.fmt(st.totalCraftScore)], ['Highest combo', 'x' + st.highestCombo],
        ['Perfect melts', st.perfectMelts], ['Perfect pours', st.perfectPours], ['Perfect strikes', st.perfectStrikes], ['Perfect assemblies', st.perfectAssemblies],
        ['Enemies defeated', U.fmt(st.enemiesDefeated)], ['Bosses defeated', st.bossesDefeated], ['Highest damage (one hit)', U.fmt(st.highestDamage)],
        ['Cannon shots', U.fmt(st.cannonShots)], ['Cannon kills', st.cannonKills], ['Weapons broken', st.weaponsBroken],
        ['Missions completed', st.missionsCompleted], ['Missions failed', st.missionsFailed], ['Flawless missions', st.flawless],
        ['Gold earned', U.fmt(st.goldEarned)], ['Gems earned', U.fmt(st.gemsEarned)], ['Ore collected', U.fmt(st.oreCollected)], ['Loot collected', U.fmt(st.lootCollected)],
        ['Items bought', st.itemsBought], ['Upgrades bought', st.upgradesBought], ['Achievements', `${Object.keys(s.achievements).length}/${BF.DATA.achievements.length}`],
        ['Total playtime', U.fmtTime(st.playtime)],
      ];
      root.append(h('div', { class: 'collection' },
        BF.UI.screenHeader('Statistics', 'Your life at the forge, in numbers', back()),
        h('div', { class: 'stats-grid panel' }, rows.map(([l, v]) => h('div', { class: 'stat-row' }, h('span', null, l), h('b', null, String(v)))))));
    },
  };
})();

</script>
<script>
/* ---- js/screens/settings.js ---- */
/* =========================================================
   SETTINGS – audio/visual toggles and save management.
   ========================================================= */
BF.Screens.SETTINGS = (function () {
  const U = BF.U, h = U.h;
  let root;

  function toggle(key, label, desc) {
    const s = BF.save.settings;
    const id = 'set-' + key;
    return h('label', { class: 'set-row', for: id },
      h('span', null, h('b', null, label), h('small', null, desc)),
      h('input', { type: 'checkbox', id, class: 'switch', checked: !!s[key], onchange: (e) => {
        s[key] = e.target.checked;
        BF.Audio.applyVolumes();
        if (key === 'music' && s.music) { BF.Audio.unlock(); BF.Audio.music('map'); }
        if (key === 'performance') BF.Icons.clear();
        BF.Save.save(true);
        BF.Audio.sfx('click');
      } }));
  }
  function slider(key, label) {
    const s = BF.save.settings;
    const id = 'set-' + key;
    return h('label', { class: 'set-row', for: id }, h('span', null, h('b', null, label)),
      h('input', { type: 'range', id, min: 0, max: 1, step: 0.05, value: s[key], oninput: (e) => { s[key] = parseFloat(e.target.value); BF.Audio.applyVolumes(); }, onchange: () => { BF.Save.save(true); BF.Audio.sfx('click'); } }));
  }

  function exportSave() {
    const json = BF.Save.exportJSON();
    // Try a download; also show the text so it can be copied where downloads are blocked.
    try {
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `grejs-forge-save-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) { /* ignore – the textarea below still works */ }
    const ta = h('textarea', { class: 'save-text', readonly: true, rows: 8, id: 'export-text' });
    ta.value = json;
    BF.UI.modal({
      title: 'Export save', body: h('div', null, h('p', null, 'A JSON file should have downloaded. If not, copy the text below and keep it somewhere safe.'), ta),
      buttons: [
        { label: 'Copy text', cls: 'primary', close: false, onClick: () => {
          const done = () => BF.UI.toast('Save copied to clipboard.', { kind: 'good' });
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done).catch(() => { ta.select(); });
          else ta.select();
        } },
        { label: 'Close', cls: 'ghost' },
      ],
    });
  }

  function importSave() {
    const ta = h('textarea', { class: 'save-text', rows: 8, id: 'import-text', placeholder: 'Paste save JSON here…' });
    const file = h('input', { type: 'file', accept: '.json,application/json', id: 'import-file', onchange: (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { ta.value = String(r.result || ''); };
      r.readAsText(f);
    } });
    BF.UI.modal({
      title: 'Import save', body: h('div', null, h('p', null, 'Choose a Grejs Forge save file or paste its text. This replaces your current progress.'), file, ta),
      buttons: [
        { label: 'Cancel', cls: 'ghost' },
        { label: 'Import', cls: 'primary', onClick: () => {
          const res = BF.Save.importJSON(ta.value.trim());
          if (!res.ok) { BF.Audio.sfx('error'); BF.UI.toast(res.error, { kind: 'bad' }); return; }
          BF.Icons.clear();
          BF.UI.toast('Save imported.', { kind: 'good' });
          BF.Game.go('MAIN_MENU');
        } },
      ],
    });
  }

  async function resetSave() {
    const ok = await BF.UI.confirm('Reset save?', 'This deletes all progress on this device. Export first if you want a backup.', 'Delete everything', true);
    if (!ok) return;
    BF.Save.reset(); BF.Save.save(true);
    BF.UI.toast('Save deleted.', { kind: 'info' });
    BF.Game.go('MAIN_MENU');
  }

  return {
    enter(r) {
      root = r;
      root.append(h('div', { class: 'collection settings' },
        BF.UI.screenHeader('Settings', null, 'MAIN_MENU'),
        h('div', { class: 'set-grid' },
          h('section', { class: 'panel' }, h('h3', null, 'Audio'),
            toggle('music', 'Music', 'Procedural medieval tunes'), slider('musicVol', 'Music volume'),
            toggle('sound', 'Sound effects', 'Hammer, fire, battle and loot sounds'), slider('sfxVol', 'Effects volume')),
          h('section', { class: 'panel' }, h('h3', null, 'Visuals'),
            toggle('particles', 'Particles', 'Sparks, smoke and embers'),
            toggle('shake', 'Screen shake', 'Impacts shake the view'),
            toggle('animations', 'Animations', 'Screen transitions and fades'),
            toggle('performance', 'Performance mode', 'Fewer particles, no glow – for slower devices')),
          h('section', { class: 'panel' }, h('h3', null, 'Saving'),
            toggle('autosave', 'Auto-save', 'Save after crafting, missions, purchases, loot and upgrades'),
            h('p', { class: BF.Save.storageOK ? 'muted small' : 'warn-text small' }, BF.Save.storageOK ? `Last saved: ${BF.save.lastSaved ? new Date(BF.save.lastSaved).toLocaleString() : 'never'}` : 'Browser storage is blocked here, so progress only lasts until you close the page. Use Export to keep it.'),
            h('div', { class: 'set-actions' },
              BF.UI.btn('Save now', () => { const ok = BF.Save.save(true); BF.UI.toast(ok ? 'Game saved.' : 'Could not save in this browser.', { kind: ok ? 'good' : 'bad' }); }, ''),
              BF.UI.btn('Export save', exportSave, ''),
              BF.UI.btn('Import save', importSave, ''),
              BF.UI.btn('Reset save', resetSave, 'danger'))))));
    },
  };
})();

</script>
<!-- Boot -->
<script>
/* ---- js/main.js ---- */
/* =========================================================
   BOOT
   ========================================================= */
(function () {
  function boot() {
    const res = BF.Save.load();
    BF.Prog.syncUnlocks();
    BF.UI.buildHUD();
    BF.Game.start();
    // Anti-loss: a mission in progress resumes from CONTINUE on the menu.
    BF.Game.go('MAIN_MENU');
    if (res.corrupt) setTimeout(() => BF.UI.toast('Your save could not be read, so a new game was started. The old data was kept as a backup.', { kind: 'bad', ms: 5000 }), 600);
    if (res.refunded) setTimeout(() => BF.UI.toast(`Recovered ${res.refunded.qty} ${BF.DATA.materials[res.refunded.materialId].name} ore from an unfinished craft.`, { kind: 'info', ms: 4000 }), 900);
    if (BF.save.session) setTimeout(() => BF.UI.toast('You have a mission in progress – press Continue to resume.', { kind: 'info', ms: 4000 }), 1200);

    // Audio can only start after a user gesture.
    const unlock = () => { BF.Audio.unlock(); window.removeEventListener('pointerdown', unlock); window.removeEventListener('keydown', unlock); };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
    // Save when the tab is hidden or closed.
    document.addEventListener('visibilitychange', () => { if (document.hidden) BF.Save.save(); });
    window.addEventListener('pagehide', () => BF.Save.save());
    // UI click sound on every button (cheap global delegation for hover)
    document.addEventListener('pointerover', (e) => { if (e.target.closest && e.target.closest('.btn:not([disabled])') && e.pointerType === 'mouse') BF.Audio.sfx('hover'); });
  }
  // Wait for fonts so canvas text uses them (with a timeout fallback).
  const ready = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve();
  ready.then(boot, boot);

})();

</script>
