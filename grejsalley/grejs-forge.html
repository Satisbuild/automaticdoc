/* =========================================================
   GREJS FORGE – stylesheet
   One committed visual world: a soot-dark forge with warm
   parchment panels, chunky outlined buttons and ember accents.
   ========================================================= */
:root {
  color-scheme: dark;
  --soot: #1c1317;
  --soot-2: #281b20;
  --soot-3: #36262a;
  --wood: #5a3a22;
  --wood-2: #7a5230;
  --parch: #f3e2bf;
  --parch-2: #e6cd9c;
  --parch-3: #d8b983;
  --ink: #3a2415;
  --ink-soft: #6e5036;
  --line: #24160e;
  --ember: #ff8a3d;
  --ember-2: #e0602a;
  --gold: #ffc93d;
  --moss: #5fae45;
  --moss-2: #3d8a2a;
  --rust: #d9453a;
  --steel: #8b95a1;
  --frost: #52a8ff;
  --cream: #ffe8c0;
  --cream-soft: #d9c4a0;
  --radius: 14px;
  --font-display: 'Grenze Gotisch', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-body: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --hud-h: 64px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(255, 138, 61, 0.14), transparent 60%),
    radial-gradient(900px 500px at 110% 110%, rgba(122, 58, 138, 0.18), transparent 60%),
    var(--soot);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font-family: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0.3em 0; }
small { font-size: 0.82em; }
.muted { color: var(--cream-soft); opacity: 0.8; }
.panel .muted { color: var(--ink-soft); opacity: 1; }
.small { font-size: 0.85em; }
.center { text-align: center; }
.good-text { color: var(--moss-2); font-weight: 700; }
.warn-text { color: var(--rust); font-weight: 700; }
.rare-text { color: #b86bff; font-weight: 800; }
.icon { display: inline-block; vertical-align: middle; flex: none; }
kbd { font-family: var(--font-body); font-size: 0.7em; padding: 0 4px; border-radius: 4px; background: rgba(0, 0, 0, 0.25); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#app { min-height: 100vh; display: flex; flex-direction: column; }
#screen { flex: 1; width: 100%; max-width: 1320px; margin: 0 auto; padding: 14px 16px 28px; }
#screen.screen-main-menu { max-width: none; padding: 0; }

/* ---------------- fade between screens ---------------- */
#fade { position: fixed; inset: 0; background: var(--soot); opacity: 0; pointer-events: none; transition: opacity 0.17s ease; z-index: 50; }
#fade.on { opacity: 1; }

/* ---------------- panels ---------------- */
.panel {
  background: linear-gradient(180deg, var(--parch), var(--parch-2));
  color: var(--ink);
  border: 3px solid var(--line);
  border-radius: var(--radius);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55), inset 0 -3px 0 rgba(120, 80, 30, 0.2), 0 6px 0 rgba(0, 0, 0, 0.35);
  padding: 14px 16px;
}
.panel h3 { font-family: var(--font-display); font-size: 1.45rem; letter-spacing: 0.02em; margin-bottom: 8px; color: var(--ink); }

/* ---------------- buttons ---------------- */
.btn {
  --b1: #b9c2cc; --b2: #7e8995;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 800 1rem/1.1 var(--font-body);
  color: var(--line);
  background: linear-gradient(180deg, var(--b1), var(--b2));
  border: 3px solid var(--line);
  border-radius: 12px;
  padding: 9px 16px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), 0 4px 0 var(--line);
  cursor: pointer;
  transition: transform 0.06s ease, filter 0.15s ease;
  text-decoration: none;
  user-select: none;
  letter-spacing: 0.01em;
}
.btn:hover:not([disabled]) { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4), 0 1px 0 var(--line); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.6); }
.btn.primary { --b1: #ffb066; --b2: #ea6a2c; color: #2a1206; }
.btn.danger { --b1: #f07a6e; --b2: #b8302a; color: #2a0806; }
.btn.ghost { background: transparent; color: var(--cream); border-color: rgba(255, 232, 192, 0.55); box-shadow: none; }
.panel .btn.ghost { color: var(--ink); border-color: var(--ink-soft); }
.btn.danger-ghost { background: transparent; color: #ff9a8a; border-color: rgba(255, 138, 122, 0.6); box-shadow: none; }
.btn.big { font-size: 1.15rem; padding: 12px 22px; }
.btn.small { font-size: 0.85rem; padding: 6px 11px; border-radius: 10px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45), 0 3px 0 var(--line); }

/* ---------------- chips / stars / bars ---------------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; font-weight: 800; padding: 1px 8px; border-radius: 999px; border: 2px solid var(--line); background: #fff4dc; color: var(--ink); white-space: nowrap; letter-spacing: 0.02em; }
.chip.rarity, .chip.element { background: var(--rc); color: #1e120a; }
.chip.weak, .chip.good { background: #c7efb4; border-color: var(--moss-2); color: #1f4a12; }
.chip.resist { background: #f6c3bc; border-color: #9a2a22; color: #5a1410; }
.chip.boss { background: var(--rust); color: #fff; }
.chip.crit { background: var(--gold); }
.chip.epic-chip { background: #bf73ff; color: #1a0a2a; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.stars { display: inline-flex; gap: 1px; line-height: 1; vertical-align: middle; }
.stars .star { width: 1.15em; height: 1.15em; fill: rgba(58, 36, 21, 0.18); stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; }
.stars .star.on { fill: var(--gold); }
.statbar { display: grid; grid-template-columns: 78px 1fr 40px; align-items: center; gap: 8px; font-size: 0.85rem; margin: 3px 0; }
.sb-track { height: 10px; background: rgba(58, 36, 21, 0.18); border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
.sb-fill { display: block; height: 100%; }
.sb-val { text-align: right; font-variant-numeric: tabular-nums; }
.bar { display: inline-block; height: 10px; background: rgba(0, 0, 0, 0.35); border-radius: 6px; overflow: hidden; border: 2px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--ember); transition: width 0.15s linear; }

/* ---------------- HUD ---------------- */
#hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 8px 16px;
  background: linear-gradient(180deg, #4a3020, #33211a);
  border-bottom: 3px solid var(--line);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
}
.hud-left, .hud-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hud-level { display: flex; align-items: center; gap: 8px; background: transparent; border: none; color: var(--cream); cursor: pointer; padding: 0; }
.lvl-num { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, var(--ember-2)); border: 3px solid var(--line); font: 800 1.2rem var(--font-body); color: var(--line); box-shadow: 0 3px 0 var(--line); }
.xp-wrap { width: 110px; height: 12px; border: 2px solid var(--line); border-radius: 8px; background: rgba(0, 0, 0, 0.4); overflow: hidden; }
.xp-bar { display: block; height: 100%; background: linear-gradient(90deg, #9be37a, #5fae45); width: 0; transition: width 0.4s ease; }
.xp-text { font-size: 0.78rem; color: var(--cream-soft); font-variant-numeric: tabular-nums; }
.hud-res { display: flex; gap: 6px; flex-wrap: wrap; }
.res-chip { display: inline-flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(0, 0, 0, 0.4); border-radius: 999px; padding: 1px 10px 1px 3px; font-variant-numeric: tabular-nums; }
.res-chip .icon { width: 24px; height: 24px; }
.res-chip.gold b { color: var(--gold); }
.res-chip.gems b { color: #7fe6ff; }
.hud-btn { display: inline-flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, 0.25); border: 2px solid rgba(255, 232, 192, 0.3); color: var(--cream); border-radius: 10px; padding: 3px 9px 3px 5px; font-weight: 700; cursor: pointer; }
.hud-btn:hover { background: rgba(255, 255, 255, 0.08); }
.hud-btn .icon { width: 24px; height: 24px; }
.hud-saved { font-size: 0.75rem; color: var(--moss); opacity: 0; transition: opacity 0.3s; font-weight: 800; }
.hud-saved.show { opacity: 1; }
.hud-saved.bad { color: #ff8a7a; }

/* back link to GrejsAlley */
.back-link { display: inline-flex; align-items: center; gap: 4px; flex: none; font: 800 0.9rem var(--font-body); color: var(--cream); text-decoration: none; background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 232, 192, 0.45); border-radius: 10px; padding: 5px 10px; white-space: nowrap; }
.back-link:hover { background: var(--ember-2); border-color: var(--line); color: #fff; }
.back-link.menu-back { align-self: flex-start; }
@media (max-width: 480px) { .back-link { padding: 4px 7px; font-size: 0.8rem; } }

/* ---------------- toasts & modals ---------------- */
#toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 70; max-width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; align-items: center; gap: 10px; background: var(--parch); color: var(--ink); border: 3px solid var(--line); border-radius: 12px; padding: 8px 12px; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4); transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.2, 1.4, 0.4, 1); }
.toast.in { transform: none; }
.toast.good { border-color: var(--moss-2); }
.toast.bad { background: #ffd7cf; }
.toast.achievement, .toast.loot { background: linear-gradient(180deg, #fff1c2, #ffd87a); }
.toast-body { display: flex; flex-direction: column; font-size: 0.9rem; }
.toast .icon { width: 40px; height: 40px; }
.modal-wrap { position: fixed; inset: 0; background: rgba(10, 5, 8, 0.7); display: grid; place-items: center; z-index: 60; padding: 16px; opacity: 0; transition: opacity 0.2s; }
.modal-wrap.in { opacity: 1; }
.modal { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; transform: scale(0.92); transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1); }
.modal-wrap.in .modal { transform: none; }
.modal-title { font-family: var(--font-display); font-size: 2rem; text-align: center; margin: 4px 0 8px; }
.modal-icon { display: flex; justify-content: center; }
.modal-actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.modal .howto { padding-left: 20px; }
.modal .howto li { margin: 6px 0; }
.levelup-badge { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1a8, var(--gold) 45%, var(--ember-2)); border: 4px solid var(--line); font: 800 2.4rem var(--font-body); color: var(--line); box-shadow: 0 5px 0 var(--line); animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes pop { from { transform: scale(0.2) rotate(-30deg); } to { transform: none; } }
.unlock-list { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.unlock-list li { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.45); border: 2px solid var(--line); border-radius: 10px; padding: 5px 10px; }
.unlock-list li span { display: flex; flex-direction: column; }
.save-text { width: 100%; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; border: 2px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; background: #fffaf0; color: #222; }

/* ---------------- canvas stage ---------------- */
.stage { position: relative; width: 100%; max-width: calc((100vh - var(--chrome, 230px)) * var(--ar, 1.777)); margin: 0 auto; }
.stage-canvas { display: block; width: 100%; height: auto; border: 3px solid var(--line); border-radius: var(--radius); background: #120c0e; touch-action: none; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4); cursor: crosshair; }

/* ---------------- screen header / tabs ---------------- */
.screen-header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; margin-bottom: 14px; }
.sh-titles h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1; color: var(--cream); letter-spacing: 0.02em; }
.sh-titles p { color: var(--cream-soft); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: rgba(0, 0, 0, 0.25); border: 2px solid rgba(255, 232, 192, 0.35); color: var(--cream); border-radius: 10px; padding: 5px 12px; font-weight: 800; cursor: pointer; }
.tab.on { background: var(--parch); color: var(--ink); border-color: var(--line); }
.tab-count { margin-left: 6px; font-size: 0.75em; opacity: 0.75; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.sort select { font: 700 0.9rem var(--font-body); border: 2px solid var(--line); border-radius: 8px; padding: 3px 6px; background: var(--parch); color: var(--ink); }
.callout { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: rgba(255, 201, 61, 0.12); border: 2px dashed rgba(255, 201, 61, 0.55); border-radius: 12px; padding: 10px 14px; margin: 10px 0; color: var(--cream); }
.panel .callout { color: var(--ink); background: rgba(255, 201, 61, 0.2); border-color: #b8862a; }
.callout.good { background: rgba(95, 174, 69, 0.18); border-color: var(--moss-2); }
.callout.warn { border-color: var(--ember-2); }
.empty { color: var(--cream-soft); padding: 30px; text-align: center; }
.speech { position: relative; background: #fffaf0; color: var(--ink); border: 3px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25); }
.speech small { display: block; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; }
.speech.big p { font-size: 1.2rem; font-weight: 700; }

/* =========================================================
   MAIN MENU
   ========================================================= */
.menu-wrap { position: relative; min-height: calc(100vh - 0px); display: grid; grid-template-columns: 1fr minmax(320px, 420px); align-items: center; gap: 0; }
.menu-wrap .stage { max-width: none; --chrome: 0px; height: 100%; }
.menu-wrap .stage-canvas { border: none; border-radius: 0; height: 100vh; width: 100%; object-fit: cover; box-shadow: none; cursor: pointer; }
.menu-panel { position: relative; z-index: 2; padding: 26px 26px; background: linear-gradient(180deg, rgba(40, 27, 32, 0.96), rgba(28, 19, 23, 0.98)); border-left: 3px solid var(--line); height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.logo { text-align: center; }
.logo-small { display: block; font-size: 0.8rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ember); font-weight: 800; }
.logo-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.8rem, 5vw, 4.8rem); line-height: 0.95; color: var(--gold); text-shadow: 0 4px 0 var(--line), 0 0 30px rgba(255, 138, 61, 0.45); letter-spacing: 0.02em; }
.logo-sub { display: block; color: var(--cream-soft); font-weight: 700; letter-spacing: 0.08em; }
.menu-main { display: grid; gap: 10px; }
.menu-main .btn { width: 100%; }
.btn.continue { flex-direction: column; gap: 0; }
.btn.continue small { font-weight: 600; font-size: 0.72rem; opacity: 0.8; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.menu-grid .btn { font-size: 0.92rem; padding: 8px 10px; }
.menu-foot { text-align: center; color: var(--cream-soft); font-size: 0.78rem; }

/* =========================================================
   WORLD MAP
   ========================================================= */
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.map-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.map-box { position: relative; }
.map-box .stage { --chrome: 200px; max-width: none; }
.map-nodes { position: absolute; inset: 3px; pointer-events: none; }
.map-node { position: absolute; transform: translate(-50%, -50%); width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--line); background: #cbb88f; color: var(--ink); font: 800 1rem var(--font-body); display: grid; place-items: center; cursor: pointer; pointer-events: auto; box-shadow: 0 3px 0 var(--line); transition: transform 0.12s; }
.map-node:hover { transform: translate(-50%, -50%) scale(1.12); }
.map-node.open { background: radial-gradient(circle at 35% 30%, #ffe08a, var(--ember)); animation: pulse 1.6s ease-in-out infinite; }
.map-node.done { background: radial-gradient(circle at 35% 30%, #c9f2a8, var(--moss)); }
.map-node.locked { background: #8a8074; color: #4a4038; opacity: 0.8; }
.map-node.boss { width: 54px; height: 54px; }
.map-node.boss .icon { width: 30px; height: 30px; }
.map-node.sel { outline: 4px solid #fff; outline-offset: 2px; }
.node-check { position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--moss-2); color: #fff; font-style: normal; font-size: 12px; display: grid; place-items: center; border: 2px solid var(--line); }
@keyframes pulse { 0%, 100% { box-shadow: 0 3px 0 var(--line), 0 0 0 0 rgba(255, 201, 61, 0.7); } 50% { box-shadow: 0 3px 0 var(--line), 0 0 0 10px rgba(255, 201, 61, 0); } }
.area-label { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; background: rgba(255, 245, 220, 0.9); border: 2px solid #6a4a2a; border-radius: 8px; padding: 1px 10px; color: var(--ink); font: 800 0.95rem var(--font-display); letter-spacing: 0.03em; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.area-label small { font-family: var(--font-body); font-size: 0.65rem; color: var(--rust); }
.area-label.locked { opacity: 0.7; }
.map-panel { display: flex; flex-direction: column; gap: 10px; position: sticky; top: calc(var(--hud-h) + 12px); }
.mp-area { border-left: 6px solid var(--ac); padding-left: 10px; }
.mp-area h2 { font-family: var(--font-display); font-size: 1.9rem; }
.mp-area small { font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); }
.mp-title { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.mp-title h3 { margin: 0; font-size: 1.35rem; }
.mp-id { font-weight: 800; background: var(--ink); color: var(--parch); border-radius: 6px; padding: 0 6px; font-size: 0.85rem; }
.mp-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(58, 36, 21, 0.25); padding: 3px 0; }
.mp-enemies { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mp-enemy { display: flex; flex-direction: column; align-items: center; width: 72px; text-align: center; font-size: 0.72rem; font-weight: 700; line-height: 1.1; }
.map-panel > .btn { width: 100%; }

/* =========================================================
   SCOUT
   ========================================================= */
.scout-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; }
.scout-col { display: flex; flex-direction: column; gap: 14px; }
.scout-hero { display: flex; gap: 14px; align-items: center; }
.scout-hero .speech { flex: 1; }
.intel-row { display: grid; grid-template-columns: 160px 1fr; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed rgba(58, 36, 21, 0.25); }
.intel-row > span:first-child { font-weight: 800; color: var(--ink-soft); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
.rec-mat { display: inline-flex; align-items: center; gap: 6px; }
.loot-preview { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.enemy-list { display: grid; gap: 8px; }
.enemy-card { display: flex; gap: 10px; align-items: center; background: rgba(255, 255, 255, 0.4); border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.enemy-card.boss { background: rgba(217, 69, 58, 0.15); border-color: #8a1a14; }
.enemy-card > div { display: flex; flex-direction: column; gap: 2px; }
.wr { display: flex; flex-wrap: wrap; gap: 3px; }
.squad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.squad-card { display: flex; flex-direction: column; align-items: center; gap: 2px; background: rgba(255, 255, 255, 0.4); border: 3px solid rgba(58, 36, 21, 0.4); border-radius: 12px; padding: 8px; cursor: pointer; color: var(--ink); text-align: center; }
.squad-card.on { border-color: var(--line); background: #fff4d0; box-shadow: 0 0 0 3px var(--ember) inset; }
.sq-name { font-weight: 800; }
.scout-actions { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* =========================================================
   ORDER
   ========================================================= */
.order-header { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.order-header h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.6rem); }
.order-header small { color: var(--ember); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.order-header-actions { display: flex; gap: 8px; }
.order-queue { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
.queue-card { display: flex; align-items: center; gap: 8px; min-width: 210px; background: rgba(0, 0, 0, 0.25); border: 3px solid rgba(255, 232, 192, 0.3); border-radius: 14px; padding: 6px 10px; color: var(--cream); cursor: pointer; text-align: left; }
.queue-card.on { background: var(--parch); color: var(--ink); border-color: var(--line); }
.queue-card.ready { border-color: var(--moss); }
.qc-body { display: flex; flex-direction: column; flex: 1; }
.order-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 460px); gap: 16px; align-items: start; }
.order-left { display: flex; flex-direction: column; gap: 10px; }
.order-left .stage { --chrome: 380px; max-width: min(100%, 520px); }
.order-panel { position: relative; padding-top: 28px; }
.order-ribbon { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); background: var(--rust); color: #fff; font: 800 1.2rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 22px; border: 3px solid var(--line); border-radius: 8px; white-space: nowrap; }
.order-grid { display: grid; grid-template-columns: 150px 1fr; gap: 8px 12px; align-items: center; }
.order-grid > .og-l { font-weight: 800; color: var(--ink-soft); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
.big-type { font-family: var(--font-display); font-size: 2rem; color: var(--ember-2); letter-spacing: 0.05em; }
.req-parts { display: flex; flex-wrap: wrap; gap: 4px; }
.order-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.order-ready { text-align: center; max-width: 560px; margin: 30px auto; }
.order-ready h2 { font-family: var(--font-display); font-size: 2.2rem; }
.order-ready .order-actions { justify-content: center; }
.pick-list { display: grid; gap: 6px; }
.pick-weapon { display: flex; align-items: center; gap: 10px; text-align: left; background: rgba(255, 255, 255, 0.45); border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: pointer; color: var(--ink); }
.pick-weapon > div { flex: 1; display: flex; flex-direction: column; }

/* =========================================================
   CRAFTING
   ========================================================= */
.craft-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.craft-header > div { display: flex; flex-direction: column; line-height: 1.1; }
.craft-header small { color: var(--ember); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.7rem; }
.craft-header b { font-size: 1.2rem; }
.spacer { flex: 1; }
.craft-steps { list-style: none; display: flex; gap: 4px; padding: 0; margin: 14px 0 0; overflow-x: auto; }
.craft-steps li { flex: 1; min-width: 92px; display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.25); border: 2px solid rgba(255, 232, 192, 0.2); border-radius: 10px; padding: 5px 8px; font-size: 0.85rem; color: var(--cream-soft); }
.craft-steps li.done { border-color: var(--moss); color: var(--cream); }
.craft-steps li.now { background: var(--parch); color: var(--ink); border-color: var(--line); font-weight: 800; }
.craft-steps li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.st-num { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(0, 0, 0, 0.35); font-weight: 800; font-size: 0.75rem; flex: none; color: var(--cream); }
.craft-steps li.done .st-num { background: var(--moss-2); }
.craft-steps li.now .st-num { background: var(--ember-2); }
.step-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.step-title h2 { font-family: var(--font-display); font-size: 2rem; }
.step-title p { color: var(--cream-soft); flex-basis: 100%; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.pick-card { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left; background: linear-gradient(180deg, var(--parch), var(--parch-2)); border: 3px solid var(--line); border-radius: var(--radius); padding: 12px; color: var(--ink); cursor: pointer; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35); transition: transform 0.1s; font-family: var(--font-body); }
.pick-card:hover:not([disabled]) { transform: translateY(-3px); }
.pick-card.on { box-shadow: 0 0 0 4px var(--ember) inset, 0 5px 0 rgba(0, 0, 0, 0.35); }
.pick-card.disabled { filter: grayscale(0.7); opacity: 0.6; cursor: not-allowed; }
.pick-card.epic { background: linear-gradient(180deg, #f3e0ff, #d8b8f5); }
.pc-top { display: flex; align-items: center; gap: 10px; }
.pc-top > div { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.pc-top b { font-size: 1.1rem; }
.pc-owned, .pc-meta { font-size: 0.82rem; color: var(--ink-soft); font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pc-proj { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.85rem; font-weight: 700; }
.pc-proj small { flex-basis: 100%; color: var(--ink-soft); }
.pc-epic { display: flex; flex-direction: column; font-weight: 700; color: #5a2a8a; }
.pc-lock { margin-top: 4px; font-weight: 800; color: var(--rust); font-size: 0.85rem; }
.parts-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.part-rows { display: flex; flex-direction: column; gap: 10px; }
.part-row { background: rgba(0, 0, 0, 0.22); border: 2px solid rgba(255, 232, 192, 0.2); border-radius: 14px; padding: 8px 10px; }
.part-slot-name { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 4px; }
.part-options { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.part-opt { display: flex; align-items: center; gap: 8px; min-width: 220px; max-width: 260px; text-align: left; background: var(--parch); border: 3px solid var(--line); border-left: 8px solid var(--rc, #ccc); border-radius: 12px; padding: 6px 8px; color: var(--ink); cursor: pointer; font-family: var(--font-body); }
.part-opt span { display: flex; flex-direction: column; line-height: 1.15; }
.part-opt small { color: var(--ink-soft); }
.part-opt.on { box-shadow: 0 0 0 3px var(--ember); background: #fff4d0; }
.proj-box { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; margin-bottom: 12px; }
.proj-box .statbar { width: 100%; }
.proj-extra { display: flex; gap: 10px; font-size: 0.8rem; font-weight: 700; flex-wrap: wrap; justify-content: center; }
.parts-layout .btn.big { width: 100%; }
.forge-layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 14px; align-items: start; }
.forge-layout .stage { --chrome: 250px; }
.forge-side { display: flex; flex-direction: column; gap: 10px; }
.side-order { display: flex; align-items: center; gap: 10px; }
.side-order > div { display: flex; flex-direction: column; }
.side-instr h3 { margin-bottom: 2px; }
.side-instr p { font-size: 0.88rem; }
.side-instr .btn { width: 100%; margin-top: 8px; }
.score-row { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 6px; font-size: 0.86rem; opacity: 0.55; }
.score-row.has { opacity: 1; }
.sr-bar { height: 9px; border: 2px solid var(--line); border-radius: 6px; background: rgba(0, 0, 0, 0.12); overflow: hidden; }
.sr-bar span { display: block; height: 100%; transition: width 0.5s ease; }
.score-row b { text-align: right; font-variant-numeric: tabular-nums; }
.side-combo { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 0 8px; background: rgba(58, 36, 21, 0.1); border-radius: 10px; padding: 6px 10px; }
.side-combo b { font-size: 1.6rem; justify-self: end; }
.side-combo small { grid-column: 1 / -1; color: var(--ink-soft); }
.side-combo.hot { background: linear-gradient(90deg, #ffe08a, #ffb066); animation: glowpulse 1s ease-in-out infinite; }
@keyframes glowpulse { 50% { box-shadow: 0 0 16px rgba(255, 150, 60, 0.7); } }
.side-proj { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-weight: 800; }

/* =========================================================
   CRAFT RESULT
   ========================================================= */
.result-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.result-stage .stage { --chrome: 170px; }
.result-info h1 { font-family: var(--font-display); font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1; margin: 4px 0 8px; }
.eyebrow { font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ember-2); }
.result-tier { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.result-tier b { font-size: 1.1rem; letter-spacing: 0.06em; }
.res-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.res-stat { display: grid; grid-template-columns: 1fr auto; align-items: baseline; border-bottom: 1px dashed rgba(58, 36, 21, 0.3); }
.res-stat b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.res-stat small { grid-column: 1 / -1; font-weight: 800; }
.res-stat small.up { color: var(--moss-2); }
.res-stat small.down { color: var(--rust); }
.res-el, .res-epic { margin: 8px 0; display: flex; flex-direction: column; gap: 2px; }
.res-epic small { color: #5a2a8a; font-weight: 700; }
.res-scores { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin: 12px 0; }
.rs { background: rgba(58, 36, 21, 0.08); border-radius: 8px; padding: 4px 8px; display: flex; justify-content: space-between; gap: 6px; font-size: 0.85rem; }
.rs b { font-variant-numeric: tabular-nums; }
.rs.total { grid-column: 1 / -1; font-size: 1.15rem; background: rgba(58, 36, 21, 0.16); }
.result-actions .btn { width: 100%; }

/* =========================================================
   PRE-BATTLE & BATTLE
   ========================================================= */
.pb-squad { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 14px; }
.pb-top, .pb-weapon { display: flex; align-items: center; gap: 8px; }
.pb-top > div, .pb-weapon > div { display: flex; flex-direction: column; }
.pb-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
.table-scroll { overflow-x: auto; }
.dmg-table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
.dmg-table th, .dmg-table td { border-bottom: 1px solid rgba(58, 36, 21, 0.2); padding: 4px 6px; text-align: center; }
.dt-enemy { text-align: left !important; font-weight: 700; white-space: nowrap; }
.dt-enemy > div { display: flex; align-items: center; gap: 6px; }
.dt-cell b { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.dt-cell small { color: var(--ink-soft); }
.dt-cell.good { background: rgba(95, 174, 69, 0.22); }
.dt-cell.bad { background: rgba(217, 69, 58, 0.18); }
.ammo-list { display: grid; gap: 6px; }
.ammo-item { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.ammo-item span { display: flex; flex-direction: column; line-height: 1.15; }
.ammo-n { font-size: 1.2rem; }
.team-bonus { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.team-bonus h3 { flex-basis: 100%; }
.pb-actions { display: flex; justify-content: center; margin-top: 16px; }
.battle-layout { display: flex; flex-direction: column; gap: 10px; }
.battle-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; }
.bt-title { display: flex; flex-direction: column; line-height: 1.1; }
.bt-title small { color: var(--ember); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.7rem; }
.bt-title b { font-family: var(--font-display); font-size: 1.6rem; }
.bt-prog { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
.bt-prog .bar { width: 100%; }
.bt-prog .bar i { background: linear-gradient(90deg, var(--gold), var(--ember)); }
.bt-prog small { grid-column: 1 / -1; color: var(--cream-soft); }
.battle-stage .stage { --chrome: 290px; }
.battle-bottom { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.ammo-bar { display: flex; gap: 6px; flex-wrap: wrap; }
.ammo-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 0; width: 76px; padding: 4px 2px 3px; border-radius: 12px; border: 3px solid var(--line); background: var(--parch); color: var(--ink); cursor: pointer; font: 700 0.68rem var(--font-body); line-height: 1.1; box-shadow: 0 3px 0 var(--line); }
.ammo-btn.on { background: #ffd27a; box-shadow: 0 0 0 3px var(--ember), 0 3px 0 var(--line); }
.ammo-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.ammo-btn b { font-size: 0.9rem; }
.ammo-btn kbd { position: absolute; top: 2px; left: 4px; }
.bw-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.bw-card { display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 232, 192, 0.25); border-radius: 12px; padding: 4px 8px; position: relative; }
.bw-card.out { opacity: 0.45; filter: grayscale(1); }
.bw-bars { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.bw-row { display: grid; grid-template-columns: 30px 1fr 34px; gap: 4px; align-items: center; font-size: 0.7rem; }
.bw-row .bar { width: 100%; height: 8px; }
.bar.hp i { background: linear-gradient(90deg, #6fdc5a, #3d8a2a); }
.bw-row b { font-variant-numeric: tabular-nums; text-align: right; }
.bw-state { position: absolute; right: 8px; top: -8px; background: var(--rust); color: #fff; font-size: 0.65rem; font-weight: 800; border-radius: 6px; padding: 0 5px; }
.bw-state:empty { display: none; }

/* =========================================================
   MISSION RESULT
   ========================================================= */
.mr-head { text-align: center; margin-bottom: 14px; }
.mr-head small { color: var(--ember); font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.mr-head h1 { font-family: var(--font-display); font-size: clamp(2.6rem, 6vw, 4rem); color: var(--gold); text-shadow: 0 4px 0 var(--line); }
.mresult.lose .mr-head h1 { color: #ff8a7a; }
.mr-head .stars { font-size: 2.2rem; }
.mr-head .stars .star { stroke: #1a0e0a; }
.mr-head .stars .star:not(.on) { fill: rgba(255, 232, 192, 0.15); }
.mr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mr-line { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed rgba(58, 36, 21, 0.25); font-size: 1.05rem; }
.xp-text { color: var(--moss-2); }
.mr-scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.mr-score { background: rgba(58, 36, 21, 0.1); border-radius: 10px; padding: 6px; text-align: center; display: flex; flex-direction: column; }
.mr-score b { font-size: 1.6rem; }
.mr-warriors { display: grid; gap: 6px; }
.mr-warrior { display: flex; align-items: center; gap: 8px; }
.mr-warrior > div { flex: 1; display: flex; flex-direction: column; line-height: 1.15; }
.mr-warrior.down { opacity: 0.65; }
.mr-dur { color: var(--ink-soft); font-weight: 700; }
.mr-loot { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.mr-loot li { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.mr-actions { display: flex; justify-content: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }

/* =========================================================
   SHOP
   ========================================================= */
.shop-gold { display: flex; align-items: center; gap: 6px; font-size: 1.4rem; color: var(--gold); }
.shop-body { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; align-items: start; }
.merchant { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.shop-card { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; border-top: 8px solid var(--rc); }
.shop-card.sold { filter: grayscale(0.8); }
.sc-name { font-size: 1.05rem; line-height: 1.15; }
.sc-desc { font-size: 0.82rem; color: var(--ink-soft); flex: 1; }
.sc-buy { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; margin-top: 6px; }
.price { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 1.1rem; }
.price.short { color: var(--rust); }
.price s { font-size: 0.75rem; opacity: 0.6; }
.sold-stamp { font: 800 1.1rem var(--font-display); color: var(--rust); border: 3px solid var(--rust); border-radius: 6px; padding: 0 8px; transform: rotate(-8deg); letter-spacing: 0.08em; }
.shop-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

/* =========================================================
   COLLECTIONS (armory, inventory, blueprints, upgrades…)
   ========================================================= */
.weapon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.weapon-card { display: flex; gap: 10px; align-items: center; text-align: left; cursor: pointer; border-left: 8px solid var(--rc); font-family: var(--font-body); }
.weapon-card.sel { box-shadow: 0 0 0 4px var(--ember), 0 6px 0 rgba(0, 0, 0, 0.35); }
.weapon-card.broken { filter: grayscale(0.7); opacity: 0.75; }
.wc-body { display: flex; flex-direction: column; gap: 2px; }
.wc-tier { display: flex; gap: 6px; align-items: center; font-weight: 800; font-size: 0.85rem; }

.wc-stats { display: flex; gap: 8px; font-size: 0.82rem; font-weight: 700; flex-wrap: wrap; }
.compare { margin-bottom: 12px; overflow-x: auto; }
.compare table { width: 100%; border-collapse: collapse; }
.compare th, .compare td { padding: 4px 8px; text-align: center; border-bottom: 1px solid rgba(58, 36, 21, 0.2); }
.compare td.win { color: var(--moss-2); font-weight: 800; }
.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.inv-card { display: flex; gap: 10px; align-items: center; border-left: 8px solid var(--rc, var(--parch-3)); }
.inv-card > div { flex: 1; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.inv-card.locked { opacity: 0.55; filter: grayscale(0.7); }
.qty { color: var(--ember-2); }
.bp-group { margin-bottom: 18px; }
.bp-group h3 { font-family: var(--font-display); font-size: 1.7rem; color: var(--cream); margin-bottom: 8px; }
.bp-group h3 small { font-family: var(--font-body); font-size: 0.85rem; color: var(--cream-soft); }
.bp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.bp-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.bp-card.locked { opacity: 0.6; filter: grayscale(0.6); }
.bp-card.epic { background: linear-gradient(180deg, #f3e0ff, #d8b8f5); }
.bp-req { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.upg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.upg-card { display: flex; flex-direction: column; gap: 6px; }
.upg-card p { font-size: 0.86rem; color: var(--ink-soft); flex: 1; }
.upg-top { display: flex; gap: 10px; align-items: center; }
.upg-top b { font-size: 1.1rem; }
.pips { display: flex; gap: 3px; margin-top: 3px; }
.pip { width: 16px; height: 8px; border-radius: 4px; background: rgba(58, 36, 21, 0.2); border: 2px solid var(--line); }
.pip.on { background: var(--ember); }
.upg-effect { display: flex; gap: 6px; align-items: center; font-weight: 700; font-size: 0.88rem; flex-wrap: wrap; }
.upg-effect .arrow { color: var(--ember-2); }
.upg-card.maxed { background: linear-gradient(180deg, #e8f7d8, #c9e8b0); }
.ach-progress .bar { width: 100%; height: 14px; margin-bottom: 12px; }
.ach-progress .bar i { background: linear-gradient(90deg, var(--gold), var(--ember)); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.ach-card { display: flex; gap: 10px; align-items: center; opacity: 0.6; filter: grayscale(0.6); }
.ach-card.on { opacity: 1; filter: none; background: linear-gradient(180deg, #fff3c8, #ffd98a); }
.ach-card > div:last-child { display: flex; flex-direction: column; }
.ach-badge { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(58, 36, 21, 0.12); border: 3px solid var(--line); flex: none; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 24px; }
.stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed rgba(58, 36, 21, 0.25); }
.stat-row b { font-variant-numeric: tabular-nums; }
.set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed rgba(58, 36, 21, 0.25); cursor: pointer; }
.set-row > span { display: flex; flex-direction: column; }
.set-row small { color: var(--ink-soft); }
.switch { appearance: none; width: 50px; height: 28px; border-radius: 999px; background: #b8a88a; border: 3px solid var(--line); position: relative; cursor: pointer; flex: none; transition: background 0.2s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--line); transition: transform 0.2s; }
.switch:checked { background: var(--moss); }
.switch:checked::after { transform: translateX(22px); }
.set-row input[type='range'] { width: 150px; accent-color: var(--ember); }
.set-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.error { color: #ff8a7a; }

   RESPONSIVE
   ========================================================= */
@media (max-width: 1080px) {
  .map-layout, .order-main, .forge-layout, .result-layout, .scout-layout, .parts-layout, .pb-grid, .mr-grid, .shop-body { grid-template-columns: 1fr; }
  .map-panel { position: static; }
  .forge-side { display: grid; grid-template-columns: 1fr 1fr; }
  .stage { max-width: 100%; }
}
@media (max-width: 820px) {
  .menu-wrap { grid-template-columns: 1fr; min-height: 0; }
  .menu-wrap .stage-canvas { height: auto; aspect-ratio: 16 / 9; }
  .menu-panel { border-left: none; border-top: 3px solid var(--line); height: auto; }
  .xp-text, .hud-btn span { display: none; }
  .xp-wrap { width: 64px; }
  .res-chip.ore { display: none; }
  .forge-side { grid-template-columns: 1fr; }
  .battle-top { grid-template-columns: 1fr auto; }
  .bt-prog { grid-column: 1 / -1; grid-row: 2; }
  .battle-bottom { grid-template-columns: 1fr; }
  .intel-row { grid-template-columns: 1fr; gap: 2px; }
  .order-grid { grid-template-columns: 1fr; gap: 2px; }
  .res-stats { grid-template-columns: 1fr; }
  .screen-header { grid-template-columns: 1fr; gap: 6px; }
  .mr-scores { grid-template-columns: 1fr 1fr 1fr; }
  .ammo-btn { width: 64px; }
}
@media (max-width: 480px) {
  #hud { padding: 6px 10px; gap: 6px; }
  .hud-left, .hud-right { gap: 5px; }
  .xp-wrap { display: none; }
  .hud-btn { padding: 3px 4px; }
  .lvl-num { width: 34px; height: 34px; font-size: 1rem; }
  .res-chip.gems { display: none; }
  .menu-grid { grid-template-columns: 1fr 1fr; }
  .pick-grid, .weapon-grid, .inv-grid, .upg-grid, .ach-grid { grid-template-columns: 1fr; }
  .part-opt { min-width: 190px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

<script>
/* ---- js/core/util.js ---- */
/* =========================================================
   Grejs Forge – core utilities
   Everything lives on the global BF namespace so the game
   runs from plain <script> tags (works on file:// and any
   static host, no bundler, no modules needed).
   ========================================================= */
window.BF = window.BF || {};
BF.DATA = BF.DATA || {};
BF.Screens = BF.Screens || {};

BF.U = (function () {
  let uidCounter = Date.now() % 100000;

  const U = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    rand: (a, b) => a + Math.random() * (b - a),
    randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    chance: (p) => Math.random() < p,
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
    sign: (v) => (v < 0 ? -1 : 1),
    uid: (prefix) => (prefix || 'id') + '_' + (uidCounter++).toString(36) + Math.random().toString(36).slice(2, 6),

    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },

    /** Pick from a list using a weight accessor. */
    weightedPick(list, weightFn) {
      let total = 0;
      for (const it of list) total += Math.max(0, weightFn(it));
      if (total <= 0) return list[0];
      let r = Math.random() * total;
      for (const it of list) {
        r -= Math.max(0, weightFn(it));
        if (r <= 0) return it;
      }
      return list[list.length - 1];
    },

    easeOutCubic: (t) => 1 - Math.pow(1 - t, 3),
    easeInCubic: (t) => t * t * t,
    easeOutBack(t) {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
    easeOutElastic(t) {
      if (t === 0 || t === 1) return t;
      return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
    },

    /** Format a number with thousands separators. */
    fmt(n) {
      n = Math.round(n || 0);
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    },
    pct: (v) => Math.round(v) + '%',

    fmtTime(sec) {
      sec = Math.floor(sec || 0);
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      return (h ? h + 'h ' : '') + m + 'm ' + s + 's';
    },

    fmtDate(iso) {
      try {
        return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      } catch (e) { return ''; }
    },

    deepClone: (o) => JSON.parse(JSON.stringify(o)),

    hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
      const n = parseInt(hex, 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    },

    /** Lighten (amt>0) or darken (amt<0) a hex colour. amt in -1..1 */
    shade(hex, amt) {
      const { r, g, b } = U.hexToRgb(hex);
      const f = (c) => {
        const v = amt >= 0 ? c + (255 - c) * amt : c * (1 + amt);
        return Math.round(U.clamp(v, 0, 255));
      };
      return '#' + [f(r), f(g), f(b)].map((v) => v.toString(16).padStart(2, '0')).join('');
    },

    rgba(hex, a) {
      const { r, g, b } = U.hexToRgb(hex);
      return `rgba(${r},${g},${b},${a})`;
    },

    /** Mix two hex colours. */
    mix(h1, h2, t) {
      const a = U.hexToRgb(h1), b = U.hexToRgb(h2);
      const m = (x, y) => Math.round(x + (y - x) * t).toString(16).padStart(2, '0');
      return '#' + m(a.r, b.r) + m(a.g, b.g) + m(a.b, b.b);
    },

    /** Escape text for HTML insertion. */
    esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },

    /**
     * Tiny hyperscript helper: h('div', {class:'x', onclick:fn}, child, 'text')
     */
    h(tag, props, ...children) {
      const el = document.createElement(tag);
      if (props) {
        for (const k in props) {
          const v = props[k];
          if (v == null || v === false) continue;
          if (k === 'class') el.className = v;
          else if (k === 'style' && typeof v === 'object') {
            for (const sk in v) { if (sk.startsWith('--')) el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk]; }
          }
          else if (k === 'html') el.innerHTML = v;
          else if (k === 'text') el.textContent = v;
          else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
          else if (k === 'dataset') Object.assign(el.dataset, v);
          else if (v === true) el.setAttribute(k, '');
          else el.setAttribute(k, v);
        }
      }
      for (const c of children.flat(Infinity)) {
        if (c == null || c === false) continue;
        el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
      }
      return el;
    },

    /** Capitalise first letter. */
    cap: (s) => (s ? s[0].toUpperCase() + s.slice(1) : ''),

    /** Returns a function that ignores calls made within `ms` of the previous one. */
    guard(fn, ms = 250) {
      let last = 0;
      return function (...args) {
        const now = performance.now();
        if (now - last < ms) return;
        last = now;
        return fn.apply(this, args);
      };
    },

    /** Safe number coercion with fallback. */
    num(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    },
  };
  return U;
})();

BF.DATA.rarities = {

  uncommon:  { id: 'uncommon',  name: 'Uncommon',  color: '#74d86a', mult: 1.35, ink: '#2f7a1f', order: 1, weight: 26 },

  legendary: { id: 'legendary', name: 'Legendary', color: '#ffb52e', mult: 3.2,  ink: '#a86a00', order: 4, weight: 0.8 },
  mythic:    { id: 'mythic',    name: 'Mythic',    color: '#ff4f7e', mult: 4.3,  ink: '#b8204a', order: 5, weight: 0.2 },
};
BF.DATA.rarityOrder = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic'];

/** Elements used by weapons, enemies and cannonballs. */
BF.DATA.elements = {
  fire:      { id: 'fire',      name: 'Fire',      color: '#ff7a2f', glyph: '🔥' },
  ice:       { id: 'ice',       name: 'Ice',       color: '#7fd8ff', glyph: '❄' },
  lightning: { id: 'lightning', name: 'Lightning', color: '#ffe44d', glyph: '⚡' },
  poison:    { id: 'poison',    name: 'Poison',    color: '#8fe04a', glyph: '☠' },

  holy:      { id: 'holy',      name: 'Holy',      color: '#fff1a8', glyph: '✦' },
};

/** Crafting quality tiers (section 36 of the design). */
BF.DATA.qualityTiers = [
  { id: 'poor',       name: 'Poor',       min: 0,   stars: 1, color: '#9b8f80', ink: '#7a6a58', rarity: 'common' },
  { id: 'common',     name: 'Common',     min: 50,  stars: 2, color: '#e9e2d2', ink: '#4a3a2a', rarity: 'common' },
  { id: 'good',       name: 'Good',       min: 70,  stars: 3, color: '#74d86a', ink: '#2f7a1f', rarity: 'uncommon' },
  { id: 'excellent',  name: 'Excellent',  min: 85,  stars: 4, color: '#52a8ff', ink: '#1f5fae', rarity: 'rare' },
  { id: 'masterwork', name: 'Masterwork', min: 95,  stars: 5, color: '#bf73ff', ink: '#7a2fae', rarity: 'epic' },
  { id: 'perfect',    name: 'Perfect',    min: 100, stars: 5, color: '#ffc93d', ink: '#a86a00', rarity: 'legendary' },
];

<script>
/* ---- js/core/save.js ---- */
/* =========================================================
   SAVE SYSTEM – localStorage with validation, export/import.
   All reads/writes are wrapped so the game still runs when
   storage is blocked (private windows, sandboxed previews).
   ========================================================= */
BF.Save = (function () {
  const KEY = 'grejsforge_save_v1';
  const LEGACY_KEY = 'brambleforge_save_v1';   // saves made before the game was renamed
  const BACKUP_KEY = 'grejsforge_save_corrupt';
  let memoryFallback = null;   // used when localStorage is unavailable
  let storageOK = true;

  function defaults() {
    return {
      version: 1,
      createdAt: new Date().toISOString(),
      lastSaved: null,
      playerLevel: 1,
      xp: 0,
      gold: 120,
      gems: 0,
      materials: ['copper'],                 // unlocked material ids
      ore: { copper: 8 },                    // ore counts
      weaponParts: [],                       // part instances {uid,tpl,rarity}
      blueprints: [],                        // unlocked normal design ids (filled by level)
      epicBlueprints: [],                    // owned epic blueprint ids
      unlockedWeapons: [],                   // alias kept for compatibility (same as blueprints)
      unlockedAreas: [1],
      completedMissions: {},                 // id -> {best, times}
      warriors: ['ironguard'],
      upgrades: Object.fromEntries(BF.DATA.upgradeOrder.map((id) => [id, 0])),
      achievements: {},                      // id -> ISO date
      settings: { music: true, sound: true, particles: true, shake: true, animations: true, autosave: true, performance: false, musicVol: 0.5, sfxVol: 0.8 },
      inventory: { special: {}, cannonballs: { fire: 3 } },
      armory: [],                            // crafted weapons
      shop: { stock: [], generatedFor: null },
      session: null,                         // in-progress mission (anti-loss)
      stats: {
        weaponsCrafted: 0, perfectWeapons: 0, enemiesDefeated: 0, bossesDefeated: 0, goldEarned: 0, gemsEarned: 0,
        oreCollected: 0, missionsCompleted: 0, totalCraftScore: 0, highestCombo: 0, highestDamage: 0, playtime: 0,
        perfectMelts: 0, perfectPours: 0, perfectStrikes: 0, strikes: 0, perfectAssemblies: 0, perfectForge: 0,
        legendaryWeapons: 0, bestOverall: 0, critCrafts: 0, epicCrafted: 0, epicTypes: [], elementalCrafted: 0,
        materialsUsed: [], flawless: 0, cannonShots: 0, cannonKills: 0, weaponsBroken: 0, lootCollected: 0,
        bestPartRarity: -1, itemsBought: 0, upgradesBought: 0, missionsFailed: 0,
      },
      tutorialSeen: {},
    };
  }

  function storageGet() {
    try { return window.localStorage.getItem(KEY) || window.localStorage.getItem(LEGACY_KEY); } catch (e) { storageOK = false; return memoryFallback; }
  }
  function storageSet(str) {
    memoryFallback = str;
    try { window.localStorage.setItem(KEY, str); storageOK = true; return true; } catch (e) { storageOK = false; return false; }
  }

  /** Merge loaded data onto defaults, keeping only well-typed values. */
  function sanitize(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object') return d;
    const out = d;
    const U = BF.U;
    out.createdAt = typeof raw.createdAt === 'string' ? raw.createdAt : d.createdAt;
    out.playerLevel = U.clamp(Math.floor(U.num(raw.playerLevel, 1)), 1, 20);
    out.xp = Math.max(0, U.num(raw.xp, 0));
    out.gold = Math.max(0, Math.floor(U.num(raw.gold, d.gold)));
    out.gems = Math.max(0, Math.floor(U.num(raw.gems, 0)));

    if (Array.isArray(raw.materials)) out.materials = raw.materials.filter((m) => BF.DATA.materials[m]);
    if (!out.materials.includes('copper')) out.materials.unshift('copper');
    if (raw.ore && typeof raw.ore === 'object') {
      out.ore = {};
      for (const k in raw.ore) if (BF.DATA.materials[k]) out.ore[k] = Math.max(0, Math.floor(U.num(raw.ore[k], 0)));
    }
    if (Array.isArray(raw.weaponParts)) {
      out.weaponParts = raw.weaponParts.filter((p) => p && BF.DATA.parts[p.tpl] && BF.DATA.rarities[p.rarity])
        .map((p) => ({ uid: String(p.uid || U.uid('p')), tpl: p.tpl, rarity: p.rarity }));
    }
    if (Array.isArray(raw.epicBlueprints)) out.epicBlueprints = raw.epicBlueprints.filter((id) => BF.DATA.epics[id]);
    if (Array.isArray(raw.unlockedAreas)) out.unlockedAreas = raw.unlockedAreas.map(Number).filter((n) => n >= 1 && n <= BF.DATA.areas.length);
    if (!out.unlockedAreas.includes(1)) out.unlockedAreas.unshift(1);
    if (raw.completedMissions && typeof raw.completedMissions === 'object') {
      for (const k in raw.completedMissions) {
        if (BF.DATA.missions[k]) {
          const v = raw.completedMissions[k] || {};
          out.completedMissions[k] = { best: U.clamp(U.num(v.best, 0), 0, 100), times: Math.max(1, Math.floor(U.num(v.times, 1))) };
        }
      }
    }
    if (Array.isArray(raw.warriors)) out.warriors = raw.warriors.filter((w) => BF.DATA.warriors[w]);
    if (!out.warriors.includes('ironguard')) out.warriors.unshift('ironguard');
    if (raw.upgrades && typeof raw.upgrades === 'object') {
      for (const id of BF.DATA.upgradeOrder) out.upgrades[id] = U.clamp(Math.floor(U.num(raw.upgrades[id], 0)), 0, BF.DATA.upgrades[id].max);
    }
    if (raw.achievements && typeof raw.achievements === 'object') {
      for (const a of BF.DATA.achievements) if (raw.achievements[a.id]) out.achievements[a.id] = String(raw.achievements[a.id]);
    }
    if (raw.settings && typeof raw.settings === 'object') {
      for (const k in d.settings) {
        if (typeof d.settings[k] === 'boolean' && typeof raw.settings[k] === 'boolean') out.settings[k] = raw.settings[k];
        if (typeof d.settings[k] === 'number') out.settings[k] = U.clamp(U.num(raw.settings[k], d.settings[k]), 0, 1);
      }
    }
    if (raw.inventory && typeof raw.inventory === 'object') {
      const sp = raw.inventory.special || {}, cb = raw.inventory.cannonballs || {};
      out.inventory.special = {};
      for (const k in sp) if (BF.DATA.specials[k]) out.inventory.special[k] = Math.max(0, Math.floor(U.num(sp[k], 0)));
      out.inventory.cannonballs = {};
      for (const k in cb) if (BF.DATA.cannonballs[k] && k !== 'normal') out.inventory.cannonballs[k] = Math.max(0, Math.floor(U.num(cb[k], 0)));
    }
    if (Array.isArray(raw.armory)) {
      out.armory = raw.armory.filter((w) => w && typeof w === 'object' && BF.getDesign(w.designId) && BF.DATA.materials[w.materialId])
        .map((w) => {
          // numbers must be numbers
          ['power', 'durability', 'maxDurability', 'luck', 'crit', 'speed', 'armorPen', 'overall', 'kills'].forEach((k) => { w[k] = U.num(w[k], 0); });
          w.uid = String(w.uid || U.uid('w'));
          w.broken = !!w.broken;
          w.durability = U.clamp(w.durability, 0, w.maxDurability || w.durability);
          return w;
        }).slice(-300);
    }
    if (raw.shop && Array.isArray(raw.shop.stock)) out.shop = { stock: raw.shop.stock.filter((i) => i && i.kind), generatedFor: raw.shop.generatedFor || null };
    if (raw.session && typeof raw.session === 'object' && BF.DATA.missions[raw.session.missionId]) {
      out.session = raw.session;
      if (!out.session.equipped || typeof out.session.equipped !== 'object') out.session.equipped = {};
      if (!Array.isArray(out.session.squad)) out.session.squad = [];
    }
    if (raw.stats && typeof raw.stats === 'object') {
      for (const k in d.stats) {
        if (Array.isArray(d.stats[k])) out.stats[k] = Array.isArray(raw.stats[k]) ? raw.stats[k].slice(0, 50) : [];
        else out.stats[k] = U.num(raw.stats[k], d.stats[k]);
      }
    }
    if (raw.tutorialSeen && typeof raw.tutorialSeen === 'object') out.tutorialSeen = raw.tutorialSeen;
    if (raw.craftRefund && raw.craftRefund.materialId && BF.DATA.materials[raw.craftRefund.materialId]) {
      out.craftRefund = { materialId: raw.craftRefund.materialId, qty: Math.max(0, Math.floor(U.num(raw.craftRefund.qty, 0))) };
    }
    return out;
  }

  const Save = {
    KEY,
    defaults,
    get storageOK() { return storageOK; },

    /** Does a save exist? */
    exists() {
      const s = storageGet();
      return !!s;
    },

    /** Load (or create) the save into BF.save. Returns {fresh, corrupt} */
    load() {
      const raw = storageGet();
      let result = { fresh: !raw, corrupt: false };
      if (!raw) {
        BF.save = defaults();
      } else {
        try {
          BF.save = sanitize(JSON.parse(raw));
        } catch (e) {
          console.warn('[Grejs Forge] Corrupt save – starting fresh', e);
          try { localStorage.setItem(BACKUP_KEY, raw); } catch (err) { /* ignore */ }
          BF.save = defaults();
          result = { fresh: true, corrupt: true };
        }
      }
      // Anti-loss: refund material from a craft interrupted by closing the browser.
      if (BF.save.craftRefund) {
        const r = BF.save.craftRefund;
        BF.save.ore[r.materialId] = (BF.save.ore[r.materialId] || 0) + r.qty;
        delete BF.save.craftRefund;
        result.refunded = r;
      }
      BF.Prog && BF.Prog.syncUnlocks && BF.Prog.syncUnlocks(true);
      return result;
    },

    /** Persist BF.save. force=true ignores the auto-save setting. */
    save(force) {
      if (!BF.save) return false;
      if (!force && BF.save.settings && BF.save.settings.autosave === false) return false;
      BF.save.lastSaved = new Date().toISOString();
      let ok = false;
      try { ok = storageSet(JSON.stringify(BF.save)); } catch (e) { ok = false; }
      if (BF.UI && BF.UI.flashSaved) BF.UI.flashSaved(ok);
      return ok;
    },

    reset() {
      try { localStorage.removeItem(KEY); localStorage.removeItem(LEGACY_KEY); } catch (e) { /* ignore */ }
      memoryFallback = null;
      BF.save = defaults();
      BF.Prog && BF.Prog.syncUnlocks && BF.Prog.syncUnlocks(true);
    },

    exportJSON() {
      return JSON.stringify(BF.save, null, 2);
    },

    /** Import a JSON string. Returns {ok, error} */
    importJSON(str) {
      let data;
      try { data = JSON.parse(str); } catch (e) { return { ok: false, error: 'That file is not valid JSON.' }; }
      if (!data || typeof data !== 'object' || !('playerLevel' in data) || !('stats' in data)) {
        return { ok: false, error: 'This does not look like a Grejs Forge save.' };
      }
      BF.save = sanitize(data);
      BF.Prog && BF.Prog.syncUnlocks && BF.Prog.syncUnlocks(true);
      this.save(true);
      return { ok: true };
    },

    sanitize,
  };
  return Save;
})();

</script>

/* ---- js/core/audio.js ---- */
/* =========================================================
   AUDIO – every sound and the music are synthesised live with
   the Web Audio API. No audio files, 100% original.
   ========================================================= */
BF.Audio = (function () {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  let musicTimer = null, musicTrack = null, musicStep = 0, nextNoteTime = 0, unlocked = false;
  const lastPlayed = {};

  function ensure() {
    if (ctx) return ctx;
    if (!unlocked) return null;          // browsers only allow audio after a user gesture
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.connect(master);
      musicBus = ctx.createGain(); musicBus.connect(master);
      // white noise buffer reused by many effects
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      applyVolumes();
    } catch (e) { ctx = null; }
    return ctx;
  }

  function settings() { return (BF.save && BF.save.settings) || { sound: true, music: true, sfxVol: 0.8, musicVol: 0.5 }; }
  function applyVolumes() {
    if (!ctx) return;
    const s = settings();
    sfxBus.gain.value = s.sound ? s.sfxVol : 0;
    musicBus.gain.value = s.music ? s.musicVol * 0.55 : 0;
  }

  /* ---------- small synthesis helpers ---------- */
  function tone(freq, dur, opts = {}) {
    const t = opts.at || ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = opts.type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.slide), t + dur);
    const vol = opts.vol == null ? 0.3 : opts.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (opts.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(opts.bus || sfxBus);
    o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function noise(dur, opts = {}) {
    const t = opts.at || ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = opts.filter || 'bandpass';
    f.frequency.setValueAtTime(opts.freq || 1000, t);
    if (opts.sweep) f.frequency.exponentialRampToValueAtTime(opts.sweep, t + dur);
    f.Q.value = opts.q || 1;
    const g = ctx.createGain();
    const vol = opts.vol == null ? 0.3 : opts.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (opts.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(opts.bus || sfxBus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }

  /* ---------- sound effect library ---------- */
  const SFX = {
    click() { tone(660, 0.06, { type: 'triangle', vol: 0.18 }); tone(990, 0.05, { type: 'sine', vol: 0.08, at: ctx.currentTime + 0.02 }); },
    hover() { tone(880, 0.03, { type: 'sine', vol: 0.05 }); },
    anvil(good) {
      // metallic clang = inharmonic partials + noise transient
      const base = good ? 520 : 380;
      [1, 2.76, 5.4, 8.93].forEach((m, i) => tone(base * m, 0.5 / (i + 1) + 0.1, { type: 'sine', vol: 0.22 / (i + 1) }));
      noise(0.08, { freq: 3500, q: 0.8, vol: 0.35 });
    },
    badhit() { tone(140, 0.25, { type: 'square', vol: 0.12, slide: 70 }); noise(0.15, { freq: 400, vol: 0.2 }); },
    furnace() { noise(0.35, { freq: 300, sweep: 900, filter: 'lowpass', vol: 0.18 }); },
    bellows() { noise(0.25, { freq: 500, sweep: 250, filter: 'lowpass', vol: 0.12 }); },
    pour() { noise(0.2, { freq: 1800, q: 3, vol: 0.06 }); },
    sizzle() { noise(0.7, { freq: 5000, filter: 'highpass', vol: 0.12 }); },
    grind() { noise(0.09, { freq: 2600, q: 6, vol: 0.06 }); },
    snap() { tone(1200, 0.07, { type: 'square', vol: 0.08 }); tone(1800, 0.06, { type: 'triangle', vol: 0.08, at: ctx.currentTime + 0.03 }); },
    perfect() { [880, 1108, 1320, 1760].forEach((f, i) => tone(f, 0.18, { type: 'triangle', vol: 0.12, at: ctx.currentTime + i * 0.05 })); },
    miss() { tone(300, 0.2, { type: 'sawtooth', vol: 0.08, slide: 150 }); },
    swing() { noise(0.14, { freq: 800, sweep: 3000, q: 2, vol: 0.14 }); },
    hit() { tone(180, 0.1, { type: 'square', vol: 0.09, slide: 90 }); noise(0.08, { freq: 1200, vol: 0.18 }); },
    crit() { tone(240, 0.16, { type: 'square', vol: 0.12, slide: 60 }); noise(0.12, { freq: 2200, vol: 0.25 }); tone(1600, 0.1, { type: 'triangle', vol: 0.08 }); },
    arrow() { noise(0.12, { freq: 4000, sweep: 1500, q: 4, vol: 0.08 }); },
    block() { tone(700, 0.12, { type: 'triangle', vol: 0.12 }); noise(0.05, { freq: 2500, vol: 0.12 }); },
    hurt() { tone(220, 0.14, { type: 'sawtooth', vol: 0.07, slide: 120 }); },
    death() { tone(400, 0.3, { type: 'triangle', vol: 0.12, slide: 80 }); noise(0.25, { freq: 700, sweep: 200, vol: 0.12 }); },
    cannon() { tone(90, 0.35, { type: 'sine', vol: 0.4, slide: 40 }); noise(0.3, { freq: 600, sweep: 120, filter: 'lowpass', vol: 0.45 }); },
    boom() { tone(70, 0.5, { type: 'sine', vol: 0.4, slide: 30 }); noise(0.45, { freq: 900, sweep: 100, filter: 'lowpass', vol: 0.4 }); },
    zap() { for (let i = 0; i < 4; i++) tone(900 + Math.random() * 900, 0.06, { type: 'square', vol: 0.05, at: ctx.currentTime + i * 0.03 }); },
    loot() { tone(1320, 0.08, { type: 'triangle', vol: 0.1 }); tone(1760, 0.1, { type: 'triangle', vol: 0.1, at: ctx.currentTime + 0.05 }); },
    coin() { tone(1567, 0.07, { type: 'square', vol: 0.05 }); tone(2093, 0.14, { type: 'square', vol: 0.05, at: ctx.currentTime + 0.06 }); },
    rare() { [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.25, { type: 'sine', vol: 0.09, at: ctx.currentTime + i * 0.06 })); },
    levelup() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, { type: 'triangle', vol: 0.14, at: ctx.currentTime + i * 0.09 })); },
    boss() { [110, 104, 98].forEach((f, i) => tone(f, 0.7, { type: 'sawtooth', vol: 0.14, at: ctx.currentTime + i * 0.55, attack: 0.08 })); noise(1.6, { freq: 200, filter: 'lowpass', vol: 0.15 }); },
    victory() { [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i === 6 ? 0.8 : 0.2, { type: 'triangle', vol: 0.15, at: ctx.currentTime + i * 0.12 })); },
    defeat() { [392, 349, 311, 262].forEach((f, i) => tone(f, 0.45, { type: 'triangle', vol: 0.14, at: ctx.currentTime + i * 0.28 })); },
    break() { noise(0.3, { freq: 3000, q: 2, vol: 0.3 }); [1400, 2100, 900].forEach((f, i) => tone(f, 0.18, { type: 'square', vol: 0.05, at: ctx.currentTime + i * 0.04 })); },
    buy() { tone(988, 0.08, { type: 'square', vol: 0.05 }); tone(1319, 0.2, { type: 'square', vol: 0.05, at: ctx.currentTime + 0.08 }); },
    error() { tone(200, 0.15, { type: 'square', vol: 0.08 }); tone(160, 0.2, { type: 'square', vol: 0.08, at: ctx.currentTime + 0.12 }); },
    whoosh() { noise(0.3, { freq: 400, sweep: 2400, q: 1.5, vol: 0.1 }); },
    achievement() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.3, { type: 'sine', vol: 0.12, at: ctx.currentTime + i * 0.08 })); },
    star() { tone(1760, 0.2, { type: 'triangle', vol: 0.1 }); tone(2637, 0.25, { type: 'sine', vol: 0.06, at: ctx.currentTime + 0.04 }); },
  };

  /* ---------- procedural music ---------- */
  // D dorian scale, lute-like plucks over a drone. Tracks differ in tempo & pattern.
  const SCALE = [146.83, 164.81, 174.61, 196.0, 220.0, 246.94, 261.63, 293.66, 329.63, 349.23, 392.0, 440.0];
  const TRACKS = {
    forge: { bpm: 92, melody: [7, -1, 9, 7, 5, -1, 4, 5, 7, -1, 4, 2, 4, -1, 0, -1, 4, -1, 5, 7, 9, -1, 7, 5, 4, -1, 2, 4, 0, -1, -1, -1], bass: [0, 0, 3, 3, 4, 4, 0, 0], drum: false },
    map:   { bpm: 84, melody: [4, -1, 7, -1, 9, 7, 5, 4, 2, -1, 4, -1, 0, -1, -1, -1, 5, -1, 7, -1, 9, -1, 11, 9, 7, -1, 5, 4, 4, -1, -1, -1], bass: [0, 0, 5, 5, 3, 3, 4, 4], drum: false },
    battle:{ bpm: 132, melody: [7, 7, 9, 7, 11, -1, 9, 7, 5, 5, 7, 5, 4, -1, 2, -1, 7, 7, 9, 11, 12, -1, 11, 9, 7, -1, 5, 4, 7, -1, -1, -1], bass: [0, 0, 0, 0, 3, 3, 4, 4], drum: true },
    boss:  { bpm: 144, melody: [0, 1, 0, -1, 3, 2, 0, -1, 5, 4, 3, 1, 0, -1, 0, -1, 7, 6, 5, -1, 3, 2, 1, -1, 0, 1, 3, 5, 7, -1, 6, -1], bass: [0, 0, 0, 0, 1, 1, 0, 0], drum: true, minor: true },
  };
  const MINOR = [146.83, 155.56, 174.61, 196.0, 207.65, 233.08, 261.63, 293.66, 311.13, 349.23, 392.0, 415.3, 466.16];

  function pluck(freq, t, dur, vol) {
    tone(freq, dur, { type: 'triangle', vol, at: t, bus: musicBus, attack: 0.004 });
    tone(freq * 2, dur * 0.5, { type: 'sine', vol: vol * 0.25, at: t, bus: musicBus, attack: 0.004 });
  }
  function scheduler() {
    if (!ctx || !musicTrack) return;
    const tr = TRACKS[musicTrack];
    const stepDur = 60 / tr.bpm / 2;   // eighth notes
    const scale = tr.minor ? MINOR : SCALE;
    while (nextNoteTime < ctx.currentTime + 0.25) {
      const i = musicStep % tr.melody.length;
      const n = tr.melody[i];
      if (n >= 0) pluck(scale[n % scale.length] * (n >= scale.length ? 2 : 1), nextNoteTime, stepDur * 1.8, 0.16);
      if (musicStep % 4 === 0) {
        const b = tr.bass[Math.floor(musicStep / 4) % tr.bass.length];
        tone(scale[b] / 2, stepDur * 3.8, { type: 'sine', vol: 0.2, at: nextNoteTime, bus: musicBus, attack: 0.02 });
      }
      if (tr.drum) {
        if (musicStep % 4 === 0) tone(90, 0.15, { type: 'sine', vol: 0.3, at: nextNoteTime, bus: musicBus, slide: 45 });
        if (musicStep % 4 === 2) noise(0.08, { freq: 2500, q: 0.8, vol: 0.08, at: nextNoteTime, bus: musicBus });
      } else if (musicStep % 8 === 0) {
        // drone
        tone(scale[0] / 2, stepDur * 8, { type: 'sine', vol: 0.06, at: nextNoteTime, bus: musicBus, attack: 0.3 });
      }
      nextNoteTime += stepDur;
      musicStep++;
    }
  }

  return {
    unlock() {
      unlocked = true;
      const c = ensure();
      if (c && c.state === 'suspended') c.resume();
      if (c && musicTrack && !musicTimer) { musicStep = 0; nextNoteTime = c.currentTime + 0.1; musicTimer = setInterval(scheduler, 90); }
    },
    sfx(name, arg) {
      if (!ensure() || !settings().sound) return;
      const now = performance.now();
      if (lastPlayed[name] && now - lastPlayed[name] < 35) return; // avoid stacking the same sound
      lastPlayed[name] = now;
      try { SFX[name] && SFX[name](arg); } catch (e) { /* audio is optional */ }
    },
    music(track) {
      if (track === musicTrack) return;
      musicTrack = track;
      if (!ensure()) return;
      musicStep = 0;
      nextNoteTime = ctx.currentTime + 0.1;
      if (!musicTimer) musicTimer = setInterval(scheduler, 90);
    },
    stopMusic() { musicTrack = null; },
    applyVolumes,
  };
})();
