<script>
/* ---- js/systems/stats.js ---- */
/* =========================================================
   STATS – weapon stat calculation and battle damage formulas.
   Kept transparent: every multiplier is exposed so the UI can
   show the player exactly why a hit did what it did.
   ========================================================= */
BF.Stats = (function () {
  const U = BF.U;
  const WEIGHTS = { melt: 0.15, pour: 0.2, construction: 0.3, shape: 0.15, assembly: 0.2 };

  function qualityTier(overall) {
    const tiers = BF.DATA.qualityTiers;
    let t = tiers[0];
    for (const q of tiers) if (overall >= q.min) t = q;
    return t;
  }
  /** Quality multiplier: 0.4 at 0%, 1.3 at 100%. */
  const qualityMult = (overall) => 0.25 + 1.05 * U.clamp(overall, 0, 100) / 100;
  const comboBonus = (maxCombo) => U.clamp((maxCombo - 1) * 10 / 3, 0, 10);

  function overallScore(scores, maxCombo) {
    let base = 0;
    for (const k in WEIGHTS) base += U.clamp(scores[k] || 0, 0, 100) * WEIGHTS[k];
    const bonus = comboBonus(maxCombo || 0);
    return { base, bonus, overall: U.clamp(Math.round(base + bonus), 0, 100) };
  }

  /** Stats of one part instance (rarity-scaled). */
  function partStats(ref) {
    const out = { power: 0, durability: 0, luck: 0, crit: 0, speed: 0, armorPen: 0, element: null };
    if (!ref) return out;
    const tpl = BF.DATA.parts[ref.tpl];
    if (!tpl) return out;
    const m = (BF.DATA.rarities[ref.rarity] || BF.DATA.rarities.common).mult;
    const s = tpl.stats || {};
    out.power = Math.round((s.power || 0) * m);
    out.durability = Math.round((s.durability || 0) * m);
    out.luck = Math.round((s.luck || 0) * m);
    out.crit = +((s.crit || 0) * m).toFixed(1);
    out.speed = +((s.speed || 0) * m).toFixed(1);
    out.armorPen = +((s.armorPen || 0) * m).toFixed(1);
    if (s.element) out.element = { type: s.element.type, value: Math.round(s.element.value * m) };
    return out;
  }

  function weaponRarity(overall, isEpic) {
    const tier = qualityTier(overall);
    const order = BF.DATA.rarityOrder;
    let idx = order.indexOf(tier.rarity);
    if (isEpic) idx = Math.max(3, idx + 1);
    return order[U.clamp(idx, 0, order.length - 1)];
  }

  /**
   * Calculate final weapon stats from crafting results.
   * input: {designId, materialId, parts:{slot:{tpl,rarity}}, scores, maxCombo, critCraft}
   */
  function calculateWeaponStats(input) {
    const design = BF.getDesign(input.designId);
    const mat = BF.DATA.materials[input.materialId];
    const type = BF.DATA.weaponTypes[design.type];
    const { base, bonus, overall } = overallScore(input.scores, input.maxCombo);
    const qm = qualityMult(overall);
    const critK = input.critCraft ? 1.12 : 1;
    const construction = U.clamp(input.scores.construction || 0, 0, 100);
    const durQ = 0.25 + 1.05 * ((overall * 0.5 + construction * 0.5) / 100);

    let power = (design.basePower + mat.power * design.matScale) * qm * critK;
    let durability = (design.baseDurability + mat.durability * design.matScale) * durQ * critK;
    let luck = mat.luck + (overall >= 95 ? 5 : 0);
    let crit = type.crit * 100;
    let speed = 0;
    let armorPen = type.armorPen * 100;
    const elems = {};
    const addEl = (el, k = 1) => { if (el) elems[el.type] = (elems[el.type] || 0) + el.value * k; };
    addEl(mat.element, qm);
    addEl(design.element, 1);

    const partList = [];
    for (const slot of type.slots) {
      const ref = input.parts && input.parts[slot];
      const ps = partStats(ref);
      power += ps.power; durability += ps.durability; luck += ps.luck; crit += ps.crit; speed += ps.speed; armorPen += ps.armorPen;
      addEl(ps.element);
      partList.push({ slot, ref, stats: ps });
    }
    let element = null;
    for (const k in elems) if (!element || elems[k] > element.value) element = { type: k, value: Math.round(elems[k]) };

    const tier = qualityTier(overall);
    return {
      designId: design.id, name: `${mat.name} ${design.name}`, type: design.type, materialId: mat.id,
      parts: input.parts || {}, scores: Object.assign({}, input.scores), maxCombo: input.maxCombo || 0, comboBonus: bonus, baseScore: Math.round(base),
      overall, tier: tier.id, stars: tier.stars, rarity: weaponRarity(overall, !!design.epic),
      power: Math.round(power), durability: Math.round(durability), maxDurability: Math.round(durability),
      luck: Math.round(luck), crit: +(crit).toFixed(1), speed: +(design.speed * (1 + speed / 100)).toFixed(2), armorPen: Math.round(U.clamp(armorPen, 0, 90)),
      element, critCraft: !!input.critCraft, epic: !!design.epic, teamBonus: design.teamBonus || null,
      qualityMult: +qm.toFixed(2),
    };
  }

  /* ---------------- battle formulas ---------------- */
  const elemMult = (enemy, elType) => {
    if (!elType) return 1;
    if (enemy.weak.elements.includes(elType)) return 1.5;
    if (enemy.resist.elements.includes(elType)) return 0.25;
    return 1;
  };
  const typeMult = (enemy, wType) => (enemy.weak.types.includes(wType) ? 1.5 : enemy.resist.types.includes(wType) ? 0.6 : 1);

  /** Aggregate team bonuses from equipped epic weapons. */
  function teamBonus(weapons) {
    const tb = { attack: 0, crit: 0, defense: 0, speed: 0, loot: 0, stun: 0, fireRes: 0, iceRes: 0, holyRes: 0, darkRes: 0 };
    weapons.forEach((w) => { if (w && w.teamBonus) for (const k in w.teamBonus) tb[k] = (tb[k] || 0) + w.teamBonus[k]; });
    return tb;
  }

  /**
   * Damage of one hit. Returns {dmg, crit, parts} where parts explains the math.
   */
  function hitDamage(w, clsId, enemy, team, rng = Math.random) {
    const wType = BF.getDesign(w.designId).type;
    const typeDef = BF.DATA.weaponTypes[wType];
    let base = w.power * (clsId === 'shieldknights' ? 0.75 : 1);
    const tm = typeMult(enemy, wType);
    const pen = U.clamp(w.armorPen / 100, 0, 0.9);
    const armorK = 100 / (100 + enemy.armor * (1 - pen));
    const atk = 1 + (team ? team.attack : 0);
    const critChance = w.crit / 100 + w.luck * 0.002 + (team ? team.crit : 0);
    const crit = rng() < critChance;
    const cm = crit ? typeDef.critMult : 1;
    let dmg = base * tm * armorK * atk * cm;
    let elDmg = 0;
    if (w.element) elDmg = w.element.value * elemMult(enemy, w.element.type) * (crit ? 1.5 : 1) * (100 / (100 + enemy.armor * 0.25));
    dmg = (dmg + elDmg) * (0.9 + rng() * 0.2);
    return { dmg: Math.max(1, Math.round(dmg)), crit, typeMult: tm, armorK, elDmg };
  }

  /** Average expected damage per hit (for previews). */
  function expectedDamage(w, clsId, enemy, team) {
    const wType = BF.getDesign(w.designId).type;
    const typeDef = BF.DATA.weaponTypes[wType];
    const base = w.power * (clsId === 'shieldknights' ? 0.75 : 1);
    const tm = typeMult(enemy, wType);
    const pen = U.clamp(w.armorPen / 100, 0, 0.9);
    const armorK = 100 / (100 + enemy.armor * (1 - pen));
    const atk = 1 + (team ? team.attack : 0);
    const cc = U.clamp(w.crit / 100 + w.luck * 0.002 + (team ? team.crit : 0), 0, 1);
    const critAvg = 1 + cc * (typeDef.critMult - 1);
    const el = w.element ? w.element.value * elemMult(enemy, w.element.type) * (100 / (100 + enemy.armor * 0.25)) : 0;
    return { avg: Math.round((base * tm * armorK * atk + el) * critAvg), typeMult: tm, armorK, elMult: w.element ? elemMult(enemy, w.element.type) : 1 };
  }

  function cannonDamage(ammoId, level, barrelMult) {
    const cb = BF.DATA.cannonballs[ammoId] || BF.DATA.cannonballs.normal;
    return (14 + 4 * level) * barrelMult * cb.dmgMult;
  }

  function warriorMaxHP(clsId, level) {
    const d = BF.DATA.warriors[clsId];
    return Math.round(d.hp * (1 + 0.075 * (level - 1)));
  }

  return { WEIGHTS, qualityTier, qualityMult, comboBonus, overallScore, partStats, weaponRarity, calculateWeaponStats, elemMult, typeMult, teamBonus, hitDamage, expectedDamage, cannonDamage, warriorMaxHP };
})();

</script>
<script>
/* ---- js/systems/loot.js ---- */
/* =========================================================
   LOOT – drop tables, part generation and granting items.
   Item shapes:
     {kind:'gold', amount}  {kind:'gem', amount}
     {kind:'ore', id, amount}  {kind:'part', tpl, rarity}
     {kind:'special', id}  {kind:'cannonball', id, amount}
     {kind:'blueprint', id}
   ========================================================= */
BF.Loot = (function () {
  const U = BF.U, R = BF.DATA.rarities, ORDER = BF.DATA.rarityOrder;

  /** Roll a rarity up to `maxRarity`; luck (0..1) shifts odds upward. */
  function rollRarity(maxRarity = 'rare', luck = 0, floor = 'common') {
    const maxI = ORDER.indexOf(maxRarity), minI = ORDER.indexOf(floor);
    const list = ORDER.slice(minI, maxI + 1);
    return U.weightedPick(list, (r) => R[r].weight * (1 + luck * R[r].order * 1.5));
  }

  function partTemplates(areaId) {
    return Object.values(BF.DATA.parts).filter((p) => !p.basic && (p.minArea || 1) <= areaId);
  }
  function makePart(tpl, rarity) { return { kind: 'part', uid: U.uid('p'), tpl, rarity }; }
  function randomPart(areaId, maxRarity, luck = 0, floor = 'common') {
    const tpl = U.pick(partTemplates(areaId));
    return makePart(tpl.id, rollRarity(maxRarity, luck, floor));
  }

  function lootBonus() {
    return 0.06 * BF.save.upgrades.magnet;
  }

  /**
   * Drops for one defeated enemy.
   * ctx: {area, luck (0..1 from weapons), team}
   */
  function rollEnemyDrops(def, mission, extra = {}) {
    const area = BF.DATA.areas[mission.area - 1];
    const bonus = lootBonus() + (extra.luck || 0) + (extra.team ? extra.team.loot : 0);
    const drops = [];
    const k = 1 + bonus;
    // gold – always
    const gold = Math.round(U.randi(def.gold[0], def.gold[1]) * (1 + 0.1 * mission.index) * k);
    drops.push({ kind: 'gold', amount: gold });
    if (def.boss) drops.push({ kind: 'gold', amount: Math.round(gold * 0.5) }, { kind: 'gold', amount: Math.round(gold * 0.5) });
    // ore
    const oreRolls = def.boss ? 4 : 1;
    for (let i = 0; i < oreRolls; i++) {
      if (def.boss || U.chance(0.34 * k)) {
        const ore = U.weightedPick(area.ores, (o) => o.w);
        drops.push({ kind: 'ore', id: ore.id, amount: def.boss ? U.randi(2, 3) : 1 });
      }
    }
    // gems
    if (U.chance(area.gemChance * k * (def.boss ? 8 : 1))) drops.push({ kind: 'gem', amount: def.boss ? U.randi(2, 4) : 1 });
    // parts
    if (def.boss) {
      drops.push(randomPart(area.id, area.maxPart, 0.6 + bonus, 'uncommon'));
      drops.push(randomPart(area.id, area.maxPart, 0.3 + bonus, 'common'));
    } else if (U.chance(0.075 * k)) {
      drops.push(randomPart(area.id, area.maxPart, bonus));
    }
    // cannonballs
    if (U.chance(0.06 * k)) {
      const avail = BF.DATA.cannonOrder.filter((id) => id !== 'normal' && BF.DATA.cannonballs[id].unlockLevel <= BF.save.playerLevel);
      if (avail.length) drops.push({ kind: 'cannonball', id: U.pick(avail), amount: 2 });
    }
    // specials
    (def.specials || []).forEach((sp) => { if (U.chance(sp.chance * (1 + bonus * 0.5))) drops.push({ kind: 'special', id: sp.id }); });
    // epic blueprint
    const bpChance = def.boss ? 0.4 : 0.002;
    if (U.chance(bpChance)) {
      const missing = Object.keys(BF.DATA.epics).filter((id) => !BF.save.epicBlueprints.includes(id));
      if (missing.length) {
        // bosses prefer blueprints whose specials they drop
        const own = (def.specials || []).map((s) => s.id);
        const pref = missing.filter((id) => BF.DATA.epics[id].requires.some((r) => own.includes(r)));
        drops.push({ kind: 'blueprint', id: U.pick(pref.length ? pref : missing) });
      }
    }
    return drops;
  }

  /** Sell value of a part instance. */
  function partValue(p) {
    const r = R[p.rarity] || R.common;
    return Math.round(18 * Math.pow(r.mult, 2.3));
  }

  /** Human-readable name of an item. */
  function itemName(it) {
    switch (it.kind) {
      case 'gold': return `${U.fmt(it.amount)} Gold`;
      case 'gem': return `${it.amount} Gem${it.amount > 1 ? 's' : ''}`;
      case 'ore': return `${it.amount} ${BF.DATA.materials[it.id].name} Ore`;
      case 'part': return `${R[it.rarity].name} ${BF.DATA.parts[it.tpl].name}`;
      case 'special': return BF.DATA.specials[it.id].name;
      case 'cannonball': return `${it.amount}× ${BF.DATA.cannonballs[it.id].name}`;
      case 'blueprint': return `Epic Blueprint: ${BF.DATA.epics[it.id].name}`;
      default: return 'Item';
    }
  }
  function itemRarity(it) {
    switch (it.kind) {
      case 'part': return it.rarity;
      case 'special': return BF.DATA.specials[it.id].rarity;
      case 'blueprint': return 'legendary';
      case 'gem': return 'rare';
      case 'ore': return BF.DATA.materials[it.id].rarity;
      default: return 'common';
    }
  }

  /**
   * Add an item to the save. Returns {text, soldFor} (soldFor set if the
   * part didn't fit in storage and was auto-sold).
   */
  function grant(it) {
    const s = BF.save, st = s.stats;
    st.lootCollected++;
    switch (it.kind) {
      case 'gold': s.gold += it.amount; st.goldEarned += it.amount; break;
      case 'gem': s.gems += it.amount; st.gemsEarned += it.amount; break;
      case 'ore': s.ore[it.id] = (s.ore[it.id] || 0) + it.amount; st.oreCollected += it.amount; break;
      case 'part': {
        st.bestPartRarity = Math.max(st.bestPartRarity, R[it.rarity].order);
        const cap = BF.DATA.upgrades.storage.value(s.upgrades.storage);
        if (s.weaponParts.length >= cap) {
          const v = partValue(it); s.gold += v; st.goldEarned += v;
          return { text: itemName(it), soldFor: v };
        }
        s.weaponParts.push({ uid: it.uid || U.uid('p'), tpl: it.tpl, rarity: it.rarity });
        break;
      }
      case 'special': s.inventory.special[it.id] = (s.inventory.special[it.id] || 0) + 1; break;
      case 'cannonball': s.inventory.cannonballs[it.id] = (s.inventory.cannonballs[it.id] || 0) + it.amount; break;
      case 'blueprint': if (!s.epicBlueprints.includes(it.id)) s.epicBlueprints.push(it.id); break;
      default: break;
    }
    return { text: itemName(it) };
  }

  return { rollRarity, randomPart, makePart, partTemplates, rollEnemyDrops, grant, partValue, itemName, itemRarity, lootBonus };
})();

</script>
<script>
/* ---- js/systems/progression.js ---- */
/* =========================================================
   PROGRESSION – XP, levels, unlocks, achievements.
   ========================================================= */
BF.Prog = (function () {
  const U = BF.U;
  const MAX_LEVEL = 20;
  const xpToNext = (l) => 100 + (l - 1) * 70;

  /** What becomes available at exactly level l. */
  function unlocksAt(l) {
    const out = [];
    BF.DATA.materialOrder.forEach((id) => { const m = BF.DATA.materials[id]; if (m.unlockLevel === l) out.push({ kind: 'material', id, name: m.name }); });
    Object.values(BF.DATA.weapons).forEach((w) => { if (w.unlockLevel === l && l > 1) out.push({ kind: 'design', id: w.id, name: w.name }); });
    BF.DATA.cannonOrder.forEach((id) => { const c = BF.DATA.cannonballs[id]; if (c.unlockLevel === l && l > 1) out.push({ kind: 'cannonball', id, name: c.name }); });
    return out;
  }

  /** Make sure every unlock implied by level & progress is present. */
  function syncUnlocks() {
    const s = BF.save;
    if (!s) return;
    BF.DATA.materialOrder.forEach((id) => { if (BF.DATA.materials[id].unlockLevel <= s.playerLevel && !s.materials.includes(id)) s.materials.push(id); });
    Object.values(BF.DATA.weapons).forEach((w) => { if (w.unlockLevel <= s.playerLevel && !s.blueprints.includes(w.id)) s.blueprints.push(w.id); });
    s.unlockedWeapons = s.blueprints.slice();
    Object.values(BF.DATA.warriors).forEach((w) => { if ((!w.joinAfter || s.completedMissions[w.joinAfter]) && !s.warriors.includes(w.id)) s.warriors.push(w.id); });
    BF.DATA.areas.forEach((a, i) => {
      const bossId = a.missions[a.missions.length - 1].id;
      if (s.completedMissions[bossId] && BF.DATA.areas[i + 1] && !s.unlockedAreas.includes(a.id + 1)) s.unlockedAreas.push(a.id + 1);
    });
  }

  /** Add XP; returns an array of level-up records [{level, unlocks}]. */
  function addXP(n) {
    const s = BF.save;
    const ups = [];
    if (s.playerLevel >= MAX_LEVEL) return ups;
    s.xp += Math.round(n);
    while (s.playerLevel < MAX_LEVEL && s.xp >= xpToNext(s.playerLevel)) {
      s.xp -= xpToNext(s.playerLevel);
      s.playerLevel++;
      ups.push({ level: s.playerLevel, unlocks: unlocksAt(s.playerLevel) });
    }
    if (s.playerLevel >= MAX_LEVEL) s.xp = 0;
    if (ups.length) syncUnlocks();
    return ups;
  }

  /** Is a mission playable? */
  function missionUnlocked(id) {
    const s = BF.save;
    const m = BF.DATA.missions[id];
    if (!m || !s.unlockedAreas.includes(m.area)) return false;
    if (m.globalIndex === 0) return true;
    const prev = BF.DATA.missionOrder[m.globalIndex - 1];
    return !!s.completedMissions[prev] || !!s.completedMissions[id];
  }

  /** Warriors available for a mission (joined clans), formation order. */
  function availableWarriors() {
    return BF.DATA.warriorOrder.filter((id) => BF.save.warriors.includes(id));
  }

  /** Check achievements; award & toast new ones. Returns list. */
  function checkAchievements(silent) {
    const s = BF.save, fresh = [];
    for (const a of BF.DATA.achievements) {
      if (s.achievements[a.id]) continue;
      let ok = false;
      try { ok = a.check(s); } catch (e) { ok = false; }
      if (ok) {
        s.achievements[a.id] = new Date().toISOString();
        s.gold += a.reward; s.stats.goldEarned += a.reward;
        fresh.push(a);
      }
    }
    if (!silent) fresh.forEach((a, i) => setTimeout(() => {
      BF.Audio.sfx('achievement');
      BF.UI.toast(`${a.desc}  +${a.reward} gold`, { kind: 'achievement', title: 'Achievement: ' + a.name, icon: BF.Icons.glyphURL(a.icon, 40), ms: 3600 });
      BF.UI.updateHUD();
    }, 500 + i * 900));
    return fresh;
  }

  /** Show a level-up modal (queued for multiple levels). */
  function showLevelUps(ups, then) {
    if (!ups || !ups.length) { then && then(); return; }
    const up = ups[0];
    BF.Audio.sfx('levelup');
    const list = U.h('ul', { class: 'unlock-list' });
    const newWarriors = [];
    if (!up.unlocks.length) list.append(U.h('li', null, 'Warriors grow tougher: +7.5% HP for every clan.'));
    up.unlocks.forEach((u) => {
      let icon;
      if (u.kind === 'material') icon = BF.Icons.material(u.id, 34);
      else if (u.kind === 'design') icon = BF.Icons.weapon({ designId: u.id, materialId: 'iron' }, 38);
      else icon = BF.Icons.item({ kind: 'cannonball', id: u.id }, 34);
      const label = u.kind === 'material' ? 'New material' : u.kind === 'design' ? 'New blueprint' : 'New cannonball';
      list.append(U.h('li', null, icon, U.h('span', null, U.h('small', null, label), U.h('b', null, u.name))));
    });
    BF.UI.modal({
      cls: 'levelup', title: `LEVEL UP!`, icon: U.h('div', { class: 'levelup-badge' }, String(up.level)),
      body: U.h('div', null, U.h('p', { class: 'center' }, `You reached level ${up.level}.`), list, newWarriors),
      buttons: [{ label: 'Excellent!', cls: 'primary', onClick: () => showLevelUps(ups.slice(1), then) }],
      dismissable: false,
    });
  }

  return { MAX_LEVEL, xpToNext, unlocksAt, syncUnlocks, addXP, missionUnlocked, availableWarriors, checkAchievements, showLevelUps };
})();

</script>
<script>
/* ---- js/systems/shop.js ---- */
/* =========================================================
   SHOP – the travelling merchant. Stock rotates after every
   mission; bought items show SOLD OUT until the next rotation.
   ========================================================= */
BF.Shop = (function () {
  const U = BF.U;

  function discount() { return BF.DATA.upgrades.guild.value(BF.save.upgrades.guild); }
  function highestArea() { return Math.max(...BF.save.unlockedAreas); }

  function offer(item, basePrice) { return { item, price: Math.max(5, Math.round(basePrice)), sold: false }; }

  function generate(tag) {
    const s = BF.save;
    const area = BF.DATA.areas[highestArea() - 1];
    const stock = [];
    const slots = 6 + (s.upgrades.guild >= 3 ? 1 : 0);
    // ores: favour the newest unlocked materials
    const mats = s.materials.slice();
    const oreOffers = U.shuffle(mats.slice(-4)).slice(0, 3);
    oreOffers.forEach((id) => {
      const qty = U.randi(3, 6);
      stock.push(offer({ kind: 'ore', id, amount: qty }, BF.DATA.materials[id].price * qty * U.rand(0.9, 1.15)));
    });
    // parts
    const nParts = 2;
    for (let i = 0; i < nParts; i++) {
      const p = BF.Loot.randomPart(area.id, area.maxPart, 0.4, i === 0 ? 'uncommon' : 'common');
      const r = BF.DATA.rarities[p.rarity];
      stock.push(offer(p, 70 * Math.pow(r.mult, 2.2) * (1 + (area.id - 1) * 0.35)));
    }
    // cannonballs
    const balls = BF.DATA.cannonOrder.filter((id) => id !== 'normal' && BF.DATA.cannonballs[id].unlockLevel <= s.playerLevel);
    if (balls.length) {
      const id = U.pick(balls);
      stock.push(offer({ kind: 'cannonball', id, amount: 5 }, BF.DATA.cannonballs[id].price * 5));
    }
    // rare extras
    if (U.chance(0.18)) {
      const ids = Object.keys(BF.DATA.specials).filter((id) => {
        // only specials whose epic is relevant to reachable content
        return Object.values(BF.DATA.epics).some((e) => e.requires.includes(id));
      });
      const id = U.pick(ids);
      const r = BF.DATA.rarities[BF.DATA.specials[id].rarity];
      stock.push(offer({ kind: 'special', id }, 900 * r.mult));
    }
    if (U.chance(0.1)) {
      const missing = Object.keys(BF.DATA.epics).filter((id) => !s.epicBlueprints.includes(id));
      if (missing.length) stock.push(offer({ kind: 'blueprint', id: U.pick(missing) }, 5000));
    }
    while (stock.length > slots) stock.splice(U.randi(0, stock.length - 1), 1);
    // occasionally a slot is already sold out – keeps things tense
    if (stock.length > 3 && U.chance(0.3)) stock[U.randi(0, stock.length - 1)].sold = true;
    s.shop = { stock, generatedFor: tag || String(Date.now()) };
    return stock;
  }

  function ensure() {
    if (!BF.save.shop || !BF.save.shop.stock || !BF.save.shop.stock.length) generate('initial');
    return BF.save.shop.stock;
  }

  function priceOf(o) { return Math.max(1, Math.round(o.price * discount())); }

  /** Buy stock index i. Returns {ok, error}. */
  function buy(i) {
    const s = BF.save;
    const o = s.shop.stock[i];
    if (!o) return { ok: false, error: 'That item is gone.' };
    if (o.sold) return { ok: false, error: 'Sold out.' };
    const price = priceOf(o);
    if (s.gold < price) return { ok: false, error: `You need ${U.fmt(price - s.gold)} more gold.` };
    if (o.item.kind === 'part' && s.weaponParts.length >= BF.DATA.upgrades.storage.value(s.upgrades.storage)) return { ok: false, error: 'Your part storage is full. Sell parts or upgrade Storage Racks.' };
    if (o.item.kind === 'blueprint' && s.epicBlueprints.includes(o.item.id)) return { ok: false, error: 'You already own this blueprint.' };
    s.gold -= price;
    o.sold = true;
    const copy = Object.assign({}, o.item);
    if (copy.kind === 'part') copy.uid = U.uid('p');
    BF.Loot.grant(copy);
    s.stats.lootCollected--; // purchases don't count as loot
    s.stats.itemsBought++;
    return { ok: true };
  }

  return { generate, ensure, buy, priceOf, discount };
})();

</script>
<script>
/* ---- js/systems/battlesim.js ---- */
/* =========================================================
   BATTLE SIMULATION – pure game logic, no drawing.
   The battle screen renders this state and feeds in cannon
   shots; a headless test can run it on its own.
   World units: x grows to the right, GROUND is the floor line.
   ========================================================= */
BF.BattleSim = (function () {
  const U = BF.U;
  const GROUND = 0;                 // feet y in world space (renderer offsets it)
  const MARCH_SPEED = 75;
  const VIEW_W = 960;
  // Global balance knobs (tuned with a headless simulation)
  // Per-area multipliers: [hp, dmg, bossHp, bossDmg]
  const TUNE = BF.TUNE = BF.TUNE || {
    area: { 1: [1.6, 1.7, 1.6, 1.3], 2: [2.6, 3.0, 2.6, 2.0], 3: [2.8, 3.0, 1.8, 1.5], 4: [2.9, 3.4, 1.7, 1.4], 5: [2.0, 2.4, 1.25, 1.15] },
  };

  class Sim {
    /**
     * opts: {mission, squad:[{cls, weapon}], level, upgrades, ammo:{id:count}}
     */
    constructor(opts) {
      this.mission = opts.mission;
      this.level = opts.level || 1;
      this.upg = opts.upgrades || {};
      this.rng = opts.rng || Math.random;
      this.time = 0;
      this.phase = 'march';
      this.phaseT = 0;
      this.waveIndex = -1;
      this.squadX = 0;
      this.events = [];
      this.enemies = [];
      this.projectiles = [];
      this.effects = [];          // lingering area effects (poison clouds)
      this.kills = 0; this.bossKills = 0; this.totalEnemies = 0;
      this.mission.waves.forEach((w) => w.forEach((g) => { this.totalEnemies += g.count; }));
      this.team = BF.Stats.teamBonus(opts.squad.map((s) => s.weapon));
      // formation: order from front to back
      const order = BF.DATA.warriorOrder;
      const sorted = opts.squad.slice().sort((a, b) => order.indexOf(a.cls) - order.indexOf(b.cls));
      this.warriors = sorted.map((s, i) => {
        const def = BF.DATA.warriors[s.cls];
        const maxHp = BF.Stats.warriorMaxHP(s.cls, this.level);
        const ranged = def.weaponType === 'bow';
        return {
          cls: s.cls, def, weapon: Object.assign({}, s.weapon), startDur: s.weapon.durability,
          hp: maxHp, maxHp, offset: -i * 58 - (ranged ? 30 : 0), x: -i * 58 - (ranged ? 30 : 0),
          cd: 0.3 + i * 0.15, anim: -1, animDur: ranged ? 0.45 : 0.38, pendingHit: null,
          state: 'fight', hurt: 0, kills: 0, dealt: 0, walk: 1, ranged,
        };
      });
      this.cannon = { cd: 0, reload: BF.DATA.upgrades.loader.value(this.upg.loader || 0), barrel: BF.DATA.upgrades.barrel.value(this.upg.barrel || 0), recoil: 0 };
      this.ammo = Object.assign({}, opts.ammo || {});
      // Weapon wear grows with the area: tougher foes chew through metal faster.
      this.wear = [1.8, 3.4, 4.3, 6.0, 10.0][(this.mission.area || 1) - 1] || 1.8;
      this.ammoUsed = {};
    }

    emit(e) { this.events.push(e); }
    /** World x of the smith's wagon (behind the last warrior). */
    wagonX() { return this.squadX + Math.min(0, ...this.warriors.map((w) => w.offset)) - 150; }
    /** Camera left edge in world space (renderer uses the same value). */
    camX() { return this.wagonX() - 150; }
    alive() { return this.enemies.filter((e) => !e.dead); }
    fighters() { return this.warriors.filter((w) => w.state === 'fight'); }
    front() { const f = this.fighters(); return f.length ? f.reduce((a, b) => (a.x > b.x ? a : b)) : null; }

    spawnWave() {
      this.waveIndex++;
      const wave = this.mission.waves[this.waveIndex];
      const isBossWave = this.mission.boss && this.waveIndex === this.mission.waves.length - 1;
      let n = 0;
      wave.forEach((g) => {
        for (let i = 0; i < g.count; i++) { this.spawnEnemy(g.enemy, this.camX() + VIEW_W + 60 + n * 58 + U.rand(0, 20)); n++; }
      });
      this.emit({ type: 'wave', index: this.waveIndex, total: this.mission.waves.length, boss: isBossWave });
      if (isBossWave) this.emit({ type: 'boss', enemy: wave[0].enemy });
    }

    spawnEnemy(id, x) {
      const def = BF.DATA.enemies[id];
      const sc = def.boss ? 1 : (this.mission.enemyScale || 1);
      const tn = TUNE.area[this.mission.area] || [1, 1, 1, 1];
      const hp = Math.round(def.hp * sc * (def.boss ? tn[2] : tn[0]));
      const e = {
        id, def, hp, maxHp: hp, x, fly: def.flying ? 46 : 0,
        dmg: def.dmg * (1 + 0.6 * (sc - 1)) * (def.boss ? tn[3] : tn[1]),
        cd: U.rand(0.3, 1.0), anim: -1, animDur: def.boss ? 0.6 : 0.4, pendingHit: null,
        slowT: 0, burnT: 0, burnDps: 0, poisonT: 0, poisonDps: 0, stunT: 0, hurt: 0, dead: false,
        specialCd: def.boss ? 4.5 : 0, tell: 0, tellPattern: null, walk: 1, deadT: 0, summoned: false,
      };
      this.enemies.push(e);
      return e;
    }

    /* ------------ damage helpers ------------ */
    damageEnemy(e, dmg, src = {}) {
      if (e.dead) return;
      dmg = Math.max(1, Math.round(dmg));
      e.hp -= dmg; e.hurt = 1;
      this.emit({ type: 'enemyHit', enemy: e, dmg, crit: !!src.crit, source: src.source || 'warrior', element: src.element || null, weak: src.weak });
      if (src.warrior) src.warrior.dealt += dmg;
      if (e.hp <= 0) {
        e.dead = true; e.deadT = 0;
        this.kills++;
        if (e.def.boss) this.bossKills++;
        if (src.warrior) src.warrior.kills++;
        this.emit({ type: 'kill', enemy: e, source: src.source || 'warrior' });
      }
    }

    damageWarrior(w, raw, elType, fromEnemy) {
      if (w.state !== 'fight') return;
      const aura = this.warriors.some((o) => o.state === 'fight' && o.def.aura && o !== w) ? 0.12 : 0;
      let dmg = raw * (1 - w.def.defense) * (1 - Math.min(0.6, this.team.defense + aura));
      if (elType && this.team[elType + 'Res']) dmg *= 1 - this.team[elType + 'Res'];
      let blocked = false;
      if (w.def.block && this.rng() < w.def.block) { dmg *= 0.5; blocked = true; }
      dmg = Math.max(1, Math.round(dmg * (0.9 + this.rng() * 0.2)));
      w.hp -= dmg; w.hurt = 1;
      w.weapon.durability -= (blocked ? 0.8 : 0.4) * this.wear;
      this.emit({ type: 'warriorHit', warrior: w, dmg, blocked });
      if (w.hp <= 0) { w.hp = 0; w.state = 'retreat'; this.emit({ type: 'ko', warrior: w }); }
      else this.checkBreak(w);
    }

    checkBreak(w) {
      if (w.state === 'fight' && w.weapon.durability <= 0) {
        w.weapon.durability = 0;
        w.weapon.broken = true;
        w.state = 'retreat';
        this.emit({ type: 'break', warrior: w });
      }
    }

    /* ------------ cannon ------------ */
    canFire(ammo) {
      if (this.cannon.cd > 0 || this.phase === 'victory' || this.phase === 'defeat') return false;
      if (ammo !== 'normal' && !(this.ammo[ammo] > 0)) return false;
      return true;
    }
    /** Fire at world point (tx, ty) where ty is height above ground (positive = up). */
    fireCannon(tx, ty, ammo = 'normal') {
      if (!this.canFire(ammo)) return false;
      if (ammo !== 'normal') { this.ammo[ammo]--; this.ammoUsed[ammo] = (this.ammoUsed[ammo] || 0) + 1; }
      this.cannon.cd = this.cannon.reload;
      this.cannon.recoil = 1;
      const sx = this.wagonX() + 60, sy = 70;
      const flight = 0.5 + Math.min(0.35, Math.abs(tx - sx) / 1600);
      this.projectiles.push({ kind: 'cannonball', ammo, x: sx, y: sy, sx, sy, tx, ty: Math.max(0, ty), t: 0, flight, vx: 1, vy: 0, friendly: true });
      this.emit({ type: 'cannonFire' });
      return true;
    }

    cannonLand(p) {
      const cb = BF.DATA.cannonballs[p.ammo];
      const base = BF.Stats.cannonDamage(p.ammo, this.level, this.cannon.barrel);
      const hits = [];
      for (const e of this.alive()) {
        const ey = e.fly + 28 * (e.def.art.size || 1);
        const d = Math.hypot(e.x - p.tx, ey - p.ty);
        const reach = cb.radius + 18 * (e.def.art.size || 1);
        if (d <= reach) hits.push(e);
      }
      hits.sort((a, b) => Math.abs(a.x - p.tx) - Math.abs(b.x - p.tx));
      const targets = p.ammo === 'normal' || p.ammo === 'fire' || p.ammo === 'lightning' ? hits.slice(0, p.ammo === 'normal' ? 2 : 3) : hits;
      targets.forEach((e, i) => {
        let dmg = base * (i === 0 ? 1 : 0.6);
        dmg *= BF.Stats.elemMult(e.def, cb.element);
        dmg *= 100 / (100 + e.def.armor * 0.5);
        this.damageEnemy(e, dmg, { source: 'cannon', element: cb.element });
        if (cb.burn) { e.burnT = cb.burn; e.burnDps = base * 0.22; }
        if (cb.slow) e.slowT = cb.slow;
      });
      if (p.ammo === 'lightning' && targets[0]) {
        let from = targets[0];
        const hitSet = new Set(targets);
        for (let c = 0; c < cb.chain; c++) {
          const next = this.alive().filter((e) => !hitSet.has(e) && Math.abs(e.x - from.x) < 220).sort((a, b) => Math.abs(a.x - from.x) - Math.abs(b.x - from.x))[0];
          if (!next) break;
          hitSet.add(next);
          this.emit({ type: 'chain', from, to: next });
          this.damageEnemy(next, base * 0.6 * BF.Stats.elemMult(next.def, 'lightning'), { source: 'cannon', element: 'lightning' });
          from = next;
        }
      }
      if (cb.dot) this.effects.push({ kind: 'poison', x: p.tx, y: p.ty, r: cb.radius, t: cb.dot, dps: base * 0.35 });
      this.emit({ type: 'cannonLand', x: p.tx, y: p.ty, ammo: p.ammo, hits: targets.length });
    }

    /* ------------ main update ------------ */
    update(dt) {
      if (this.phase === 'victory' || this.phase === 'defeat') { this.time += dt; this.phaseT += dt; this.tickAnims(dt); return; }
      this.time += dt; this.phaseT += dt;
      this.cannon.cd = Math.max(0, this.cannon.cd - dt);
      this.cannon.recoil = Math.max(0, this.cannon.recoil - dt * 4);

      // phase machine
      const living = this.alive();
      if (this.phase === 'march') {
        this.squadX += MARCH_SPEED * dt;
        if (this.phaseT > (this.waveIndex < 0 ? 1.2 : 1.6)) { this.spawnWave(); this.phase = 'fight'; this.phaseT = 0; }
      } else if (this.phase === 'fight') {
        // keep marching until enemies are close
        const fr = this.front();
        const nearest = living.length ? Math.min(...living.map((e) => e.x)) : Infinity;
        if (fr && nearest - fr.x > 260) this.squadX += MARCH_SPEED * dt;
        if (!living.length && this.enemies.every((e) => e.deadT > 0.4 || !e.dead)) {
          if (this.waveIndex >= this.mission.waves.length - 1) { this.phase = 'victory'; this.phaseT = 0; this.emit({ type: 'victory' }); }
          else {
            // regroup from wherever the fight ended (never walk backwards)
            const fx = this.fighters().map((w) => w.x - w.offset);
            if (fx.length) this.squadX = Math.max(this.squadX, Math.max(...fx) - 40);
            this.phase = 'march'; this.phaseT = 0; this.emit({ type: 'waveClear', index: this.waveIndex });
          }
        }
      }
      if (!this.fighters().length && this.phase !== 'victory') {
        this.phase = 'defeat'; this.phaseT = 0; this.emit({ type: 'defeat' });
      }

      this.updateWarriors(dt);
      this.updateEnemies(dt);
      this.updateProjectiles(dt);
      this.updateEffects(dt);
      this.tickAnims(dt);
      // clean old corpses
      this.enemies = this.enemies.filter((e) => !e.dead || e.deadT < 1.2);
    }

    tickAnims(dt) {
      this.warriors.forEach((w) => { w.hurt = Math.max(0, w.hurt - dt * 5); });
      this.enemies.forEach((e) => { e.hurt = Math.max(0, e.hurt - dt * 5); if (e.dead) e.deadT += dt; });
    }

    updateWarriors(dt) {
      const living = this.alive();
      const spd = 1 + (this.team.speed || 0);
      for (const w of this.warriors) {
        if (w.state === 'out') continue;
        if (w.state === 'retreat') {
          w.x -= 150 * dt; w.walk = 1;
          if (w.x < this.camX() - 60) { w.state = 'out'; }
          continue;
        }
        const home = this.squadX + w.offset;
        // target selection
        let target = null, best = Infinity;
        for (const e of living) {
          const d = e.x - w.x - 12 * (e.def.art.size || 1);   // measure to the enemy's body edge
          if (d >= -40 && d < best) { best = d; target = e; }
        }
        const reach = w.def.range;
        let moving = false;
        if (target && best <= reach) {
          // in range – hold position and fight
        } else if (target && best < 700) {
          w.x += 95 * dt; moving = true;               // close in on the enemy
        } else if (Math.abs(w.x - home) > 2 && (this.phase === 'march' || w.x < home)) {
          w.x += U.clamp(home - w.x, -120 * dt, 120 * dt); moving = true;
        }
        w.walk = moving || this.phase === 'march' ? 1 : 0;

        w.cd -= dt;
        if (w.anim >= 0) {
          w.anim += dt / w.animDur;
          if (w.pendingHit && w.anim >= 0.55) { this.resolveWarriorHit(w, w.pendingHit); w.pendingHit = null; }
          if (w.anim >= 1) w.anim = -1;
        } else if (target && best <= reach && w.cd <= 0) {
          w.anim = 0; w.pendingHit = target;
          w.cd = w.def.atkInterval / (w.weapon.speed * spd);
          this.emit({ type: w.ranged ? 'bowDraw' : 'swing', warrior: w });
        }
      }
    }

    resolveWarriorHit(w, target) {
      if (w.state !== 'fight') return;
      w.weapon.durability -= (w.ranged ? 0.8 : 1) * this.wear;
      if (w.ranged) {
        const t = target.dead ? this.alive().sort((a, b) => a.x - b.x)[0] : target;
        if (t) {
          const ty = t.fly + 30 * (t.def.art.size || 1);
          this.projectiles.push({ kind: 'arrow', x: w.x + 18, y: 36, sx: w.x + 18, sy: 36, tx: t.x, ty, t: 0, flight: Math.max(0.2, Math.abs(t.x - w.x) / 900), target: t, warrior: w, friendly: true });
        }
      } else if (!target.dead) {
        this.applyWeaponHit(w, target);
        if (w.def.pierce) {
          const behind = this.alive().filter((e) => e !== target && e.x > target.x && e.x - target.x < 70).sort((a, b) => a.x - b.x).slice(0, w.def.pierce - 1);
          behind.forEach((e) => this.applyWeaponHit(w, e, 0.7));
        }
      }
      this.checkBreak(w);
    }

    applyWeaponHit(w, e, k = 1) {
      const r = BF.Stats.hitDamage(w.weapon, w.cls, e.def, this.team, this.rng);
      this.damageEnemy(e, r.dmg * k, { warrior: w, crit: r.crit, element: w.weapon.element ? w.weapon.element.type : null, weak: r.typeMult > 1 ? 'weak' : r.typeMult < 1 ? 'resist' : null });
      if (w.weapon.element && w.weapon.element.type === 'ice') e.slowT = Math.max(e.slowT, 1.2);
      if (this.team.stun && this.rng() < this.team.stun && !e.def.boss) e.stunT = 1.0;
      if (!e.dead && e.def.boss && this.team.stun && this.rng() < this.team.stun * 0.3) e.stunT = 0.5;
    }

    updateEnemies(dt) {
      const fighters = this.fighters();
      for (const e of this.enemies) {
        if (e.dead) continue;
        // status effects
        if (e.burnT > 0) { e.burnT -= dt; this.tickDot(e, e.burnDps * dt, 'fire'); }
        if (e.poisonT > 0) { e.poisonT -= dt; this.tickDot(e, e.poisonDps * dt, 'poison'); }
        if (e.dead) continue;
        e.slowT = Math.max(0, e.slowT - dt);
        if (e.stunT > 0) { e.stunT -= dt; e.walk = 0; continue; }
        const slow = e.slowT > 0 ? 0.5 : 1;
        if (!fighters.length) { e.walk = 0; continue; }
        // target: shield knights taunt, ranged enemies pick random
        const taunter = fighters.find((w) => w.def.taunt);
        let target = fighters.reduce((a, b) => (a.x > b.x ? a : b));
        if (taunter && Math.abs(taunter.x - e.x) < 320) target = taunter;
        const dist = e.x - target.x;
        let moving = false;
        if (dist > e.def.range) { e.x -= e.def.speed * slow * dt; moving = true; }
        e.walk = moving ? 1 : 0;

        // boss specials
        if (e.def.boss) this.bossLogic(e, dt, fighters);

        e.cd -= dt * slow;
        if (e.anim >= 0) {
          e.anim += dt / e.animDur;
          if (e.pendingHit && e.anim >= 0.5) {
            const t = e.pendingHit; e.pendingHit = null;
            if (e.def.range > 120) {
              const ty = 34;
              this.projectiles.push({ kind: e.def.projectile || 'stone', x: e.x - 16, y: e.fly + 40, sx: e.x - 16, sy: e.fly + 40, tx: t.x, ty, t: 0, flight: Math.max(0.25, Math.abs(e.x - t.x) / 650), target: t, enemy: e, friendly: false });
            } else if (t.state === 'fight' && Math.abs(e.x - t.x) <= e.def.range + 30) {
              this.damageWarrior(t, e.dmg, e.def.element, e);
            }
          }
          if (e.anim >= 1) e.anim = -1;
        } else if (dist <= e.def.range && e.cd <= 0 && !e.tell) {
          e.anim = 0;
          e.cd = e.def.atkInterval;
          e.pendingHit = e.def.range > 120 ? U.pick(fighters) : target;
          this.emit({ type: 'enemySwing', enemy: e });
        }
      }
    }

    tickDot(e, amount, el) {
      e._dotAcc = (e._dotAcc || 0) + amount;
      if (e._dotAcc >= 4) { const d = Math.floor(e._dotAcc); e._dotAcc -= d; this.damageEnemy(e, d * BF.Stats.elemMult(e.def, el), { source: 'dot', element: el }); }
    }

    bossLogic(e, dt, fighters) {
      if (e.tell > 0) {
        e.tell -= dt;
        if (e.tell <= 0) {
          e.tell = 0;
          const pat = e.tellPattern;
          if (pat === 'stomp') {
            fighters.forEach((w) => { if (Math.abs(w.x - e.x) < 260) this.damageWarrior(w, e.dmg * 0.9, e.def.element, e); });
            this.emit({ type: 'stomp', enemy: e });
          } else if (pat === 'volley') {
            for (let i = 0; i < 5; i++) {
              const t = U.pick(fighters);
              this.projectiles.push({ kind: e.def.projectile || 'stone', x: e.x - 20, y: 90, sx: e.x - 20, sy: 90 + i * 12, tx: t.x + U.rand(-20, 20), ty: 34, t: -i * 0.12, flight: 0.7, target: t, enemy: e, friendly: false, dmgK: 0.45 });
            }
            this.emit({ type: 'volley', enemy: e });
          } else if (pat === 'summon') {
            const count = this.alive().length;
            if (count < 6 && e.def.summon) {
              for (let i = 0; i < 2; i++) { const m = this.spawnEnemy(e.def.summon, e.x + 90 + i * 50); m.summoned = true; }
              this.emit({ type: 'summon', enemy: e });
            }
          } else if (pat === 'slam') {
            const t = fighters.reduce((a, b) => (a.x > b.x ? a : b));
            if (Math.abs(t.x - e.x) < e.def.range + 60) this.damageWarrior(t, e.dmg * 1.6, e.def.element, e);
            this.emit({ type: 'slam', enemy: e });
          }
        }
        return;
      }
      e.specialCd -= dt;
      if (e.specialCd <= 0) {
        const pats = e.def.patterns.filter((p) => p !== 'summon' || e.hp < e.maxHp * 0.75);
        e.tellPattern = U.pick(pats);
        e.tell = 0.9;
        e.specialCd = U.rand(4.5, 6.5) * (e.hp < e.maxHp * 0.4 ? 0.75 : 1);
        this.emit({ type: 'bossTell', enemy: e, pattern: e.tellPattern });
      }
    }

    updateProjectiles(dt) {
      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        const p = this.projectiles[i];
        p.t += dt;
        if (p.t < 0) continue;
        const k = U.clamp(p.t / p.flight, 0, 1);
        const px = p.x, py = p.y;
        // follow moving targets for arrows
        if (p.kind === 'arrow' && p.friendly && p.target && !p.target.dead) { p.tx = p.target.x; p.ty = p.target.fly + 30 * (p.target.def.art.size || 1); }
        const arc = p.kind === 'cannonball' ? 180 : p.kind === 'arrow' ? 40 : 70;
        p.x = U.lerp(p.sx, p.tx, k);
        p.y = U.lerp(p.sy, p.ty, k) + Math.sin(k * Math.PI) * arc;
        p.vx = p.x - px; p.vy = -(p.y - py);
        if (k >= 1) {
          this.projectiles.splice(i, 1);
          if (p.kind === 'cannonball') this.cannonLand(p);
          else if (p.friendly) {
            const t = p.target && !p.target.dead ? p.target : this.alive().sort((a, b) => Math.abs(a.x - p.tx) - Math.abs(b.x - p.tx))[0];
            if (t && Math.abs(t.x - p.tx) < 90) this.applyWeaponHit(p.warrior, t);
            this.emit({ type: 'arrowHit', x: p.tx, y: p.ty });
          } else {
            const t = p.target;
            if (t && t.state === 'fight' && Math.abs(t.x - p.tx) < 70) this.damageWarrior(t, p.enemy.dmg * (p.dmgK || 1), p.enemy.def.element, p.enemy);
            this.emit({ type: 'enemyShotLand', x: p.tx, y: p.ty, kind: p.kind });
          }
        }
      }
    }

    updateEffects(dt) {
      for (let i = this.effects.length - 1; i >= 0; i--) {
        const f = this.effects[i];
        f.t -= dt;
        if (f.t <= 0) { this.effects.splice(i, 1); continue; }
        this.alive().forEach((e) => { if (Math.abs(e.x - f.x) < f.r + 20) this.tickDot(e, f.dps * dt, 'poison'); });
      }
    }

    /** Summary used by the mission result screen. */
    summary() {
      const standing = this.warriors.filter((w) => w.state === 'fight');
      const hpFrac = standing.length ? standing.reduce((a, w) => a + w.hp / w.maxHp, 0) / this.warriors.length : 0;
      return {
        victory: this.phase === 'victory', kills: this.kills, totalEnemies: this.totalEnemies, bossKills: this.bossKills,
        standing: standing.length, squad: this.warriors.length, hpFrac, time: this.time,
        warriors: this.warriors.map((w) => ({ cls: w.cls, weapon: w.weapon, hp: w.hp, maxHp: w.maxHp, state: w.state, kills: w.kills, dealt: w.dealt })),
        ammoUsed: this.ammoUsed,
      };
    }
  }

  return { Sim, GROUND };
})();

</script>

<script>
/* ---- js/screens/menu.js ---- */
/* =========================================================
   MAIN MENU – animated forge scene + menu.
   ========================================================= */
BF.Screens.MAIN_MENU = (function () {
  const U = BF.U, h = U.h, D = BF.Draw;
  let st = null, t = 0, strikeT = 0, blade = null;

  function progressLine() {
    const s = BF.save;
    const done = Object.keys(s.completedMissions).length;
    if (s.session) {
      const m = BF.DATA.missions[s.session.missionId];
      return `Resume forging for “${m.name}”`;
    }
    if (!done) return 'No adventures yet';
    return `Level ${s.playerLevel} · ${done}/${BF.DATA.missionOrder.length} missions · ${U.fmt(s.gold)} gold`;
  }

  function play() {
    const s = BF.save;
    if (!s.tutorialSeen.intro) {
      s.tutorialSeen.intro = true;
      BF.Save.save(true);
      BF.UI.modal({
        cls: 'intro',
        title: 'Welcome to Grejs Forge',
        icon: BF.Icons.portrait(null, 96, 'badger'),
        body: h('div', null,
          h('p', null, 'You are Grejs, the badger smith of Green Valley. Goblins and worse are marching on the realm, and the warrior clans need weapons – good ones.'),
          h('ol', { class: 'howto' },
            h('li', null, h('b', null, 'Forge'), ' – melt metal, pour it, hammer it, grind it and assemble the parts. Every skill-game you nail makes the weapon stronger.'),
            h('li', null, h('b', null, 'Equip & battle'), ' – your warriors fight on their own. You ride behind them and fire the cannon.'),
            h('li', null, h('b', null, 'Loot & upgrade'), ' – sweep the cursor over drops to collect them, then buy better metal, parts and forge upgrades.'))),
        buttons: [{ label: 'To the map!', cls: 'primary', onClick: () => BF.Game.go('WORLD_MAP') }],
      });
    } else {
      BF.Game.go('WORLD_MAP');
    }
  }

  function cont() {
    if (BF.save.session) BF.Game.go('ORDER');
    else BF.Game.go('WORLD_MAP');
  }

  async function resetSave() {
    const ok = await BF.UI.confirm('Reset save?', 'This deletes your level, weapons, materials and achievements on this device. It cannot be undone.', 'Delete everything', true);
    if (!ok) return;
    BF.Save.reset();
    BF.Save.save(true);
    BF.UI.toast('Save deleted. A fresh forge awaits.', { kind: 'info' });
    BF.Game.go('MAIN_MENU');
  }

  return {
    noHUD: true,
    enter(root) {
      t = 0; strikeT = 0;
      blade = { designId: 'longsword', materialId: 'iron', parts: {} };
      const hasProgress = Object.keys(BF.save.completedMissions).length > 0 || BF.save.stats.weaponsCrafted > 0 || !!BF.save.session;
      const wrap = h('div', { class: 'menu-wrap' });
      root.append(wrap);
      st = BF.UI.stage(wrap, 960, 540, 'menu-stage');
      const menu = h('nav', { class: 'menu-panel', 'aria-label': 'Main menu' },
        BF.UI.backLink('menu-back'),
        h('div', { class: 'logo' },
          h('span', { class: 'logo-small' }, 'The badger smith\'s saga'),
          h('h1', { class: 'logo-title' }, 'Grejs Forge'),
          h('span', { class: 'logo-sub' }, 'Forge · Equip · Battle · Loot')),
        h('div', { class: 'menu-main' },
          BF.UI.btn(hasProgress ? 'Play' : 'New Game', play, 'primary big'),
          h('button', { class: 'btn big continue', disabled: !hasProgress, onclick: U.guard(() => { BF.Audio.sfx('click'); cont(); }) },
            h('span', null, 'Continue'), h('small', null, progressLine()))),
        h('div', { class: 'menu-grid' },
          BF.UI.btn('Armory', () => BF.Game.go('ARMORY')),
          BF.UI.btn('Materials', () => BF.Game.go('INVENTORY')),
          BF.UI.btn('Upgrades', () => BF.Game.go('UPGRADES')),
          BF.UI.btn('Blueprints', () => BF.Game.go('BLUEPRINTS')),
          BF.UI.btn('Achievements', () => BF.Game.go('ACHIEVEMENTS')),
          BF.UI.btn('Statistics', () => BF.Game.go('STATS')),
          BF.UI.btn('Settings', () => BF.Game.go('SETTINGS')),
          BF.UI.btn('Reset Save', resetSave, 'danger-ghost')),
        h('p', { class: 'menu-foot' }, BF.Save.storageOK ? 'Progress saves automatically in this browser.' : 'Storage is blocked here – progress will not be kept after you close the page.'));
      wrap.append(menu);
      st.on('down', () => { strikeT = 0.6; BF.Audio.unlock(); BF.Audio.music('forge'); });
      document.addEventListener('pointerdown', startMusicOnce, { once: true });
    },
    exit() { st = null; },
    update(dt) {
      if (!st) return;
      t += dt;
      strikeT += dt;
      st.fx.update(dt);
      // periodic hammer strike
      if (strikeT > 1.25) {
        strikeT = 0;
        const x = 600, y = 350;
        st.fx.emit('spark', x, y, { n: 22, speed: 420, colors: ['#fff3b0', '#ffb347', '#ff7a2f'], size: 3, life: 0.6 });
        st.fx.emit('ring', x, y, { n: 1, color: '#ffd27a', grow: 220, life: 0.35, force: true });
        BF.Audio.sfx('anvil', true);
      }
      if (Math.random() < dt * 8) st.fx.emit('ember', U.rand(120, 330), 380, { n: 1, speed: 40, colors: ['#ffb347', '#ff7a2f'], size: 2.2, life: 2.2, spread: 0.6 });
    },
    draw() {
      if (!st) return;
      const ctx = st.ctx, W = st.W, H = st.H;
      st.begin();
      D.forgeBackdrop(ctx, W, H, t, { furnaceX: 230 });
      D.furnace(ctx, 110, 180, 240, 250, t, 0.75);
      D.anvil(ctx, 610, 372, 1.05);
      // glowing blade on the anvil
      const cool = U.clamp(1 - strikeT / 1.25, 0, 1) * 0.4 + 0.55;
      D.weapon(ctx, blade, 520, 340, Math.PI / 2, 2.2, { only: 'main', heat: cool, lw: 1.4 });
      // smith hammering: raise then slam
      const k = strikeT / 1.25;
      const pose = k < 0.75 ? -0.2 - U.easeOutCubic(k / 0.75) * 1.3 : -1.5 + U.easeInCubic((k - 0.75) / 0.25) * 2.6;
      D.critter(ctx, 470, 470, null, { species: 'badger', t, scale: 2.4, hat: 'smith', tool: 'hammer', hammerPose: strikeT < 0.08 ? 1.1 : pose });
      st.fx.draw(ctx);
      // vignette
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,4,8,.55)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      st.end();
    },
  };
  function startMusicOnce() { BF.Audio.unlock(); BF.Audio.music('forge'); }
})();

</script>
<script>
/* ---- js/screens/map.js ---- */
/* =========================================================
   WORLD MAP / MISSION SELECT
   A hand-drawn parchment map with mission nodes (DOM buttons
   positioned over a canvas).
   ========================================================= */
(function () {
  const U = BF.U, h = U.h, D = BF.Draw;
  const NODE_OFF = [[-10, 5], [-5, -3], [0, 6], [5, -2], [10.5, -7]];

  function nodePos(area, i) {
    const o = NODE_OFF[i];
    return { x: U.clamp(area.map.x + o[0], 5, 95), y: U.clamp(area.map.y + o[1], 8, 92) };
  }

  function nextMission() {
    for (const id of BF.DATA.missionOrder) if (!BF.save.completedMissions[id]) return BF.Prog.missionUnlocked(id) ? id : null;
    return BF.DATA.missionOrder[BF.DATA.missionOrder.length - 1];
  }

  function Screen(mode) {
    let st = null, t = 0, selected = null, panel = null, mapCache = null, nodesEl = null;

    function drawMapBase(W, H) {
      // Pre-render static parchment into an offscreen canvas.
      const c = document.createElement('canvas');
      const dpr = st.dpr;
      c.width = W * dpr; c.height = H * dpr;
      const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
      const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W * 0.7);
      g.addColorStop(0, '#f6e7c4'); g.addColorStop(1, '#d9bc88');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // sea
      ctx.fillStyle = '#9cc7c9';
      ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H * 0.86); ctx.bezierCurveTo(W * 0.2, H * 0.94, W * 0.35, H * 0.86, W * 0.5, H * 0.95); ctx.lineTo(W * 0.62, H); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W * 0.9, 0); ctx.bezierCurveTo(W * 0.93, H * 0.08, W * 0.98, H * 0.12, W, H * 0.2); ctx.closePath(); ctx.fill();
      // paper noise
      for (let i = 0; i < 900; i++) { ctx.fillStyle = `rgba(120,80,30,${Math.random() * 0.06})`; ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
      // region blobs
      BF.DATA.areas.forEach((a) => {
        const x = a.map.x / 100 * W, y = a.map.y / 100 * H;
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = a.color;
        ctx.beginPath();
        for (let k = 0; k <= 20; k++) {
          const ang = k / 20 * Math.PI * 2;
          const r = 118 + Math.sin(ang * 3 + a.id) * 16 + Math.cos(ang * 5 + a.id * 2) * 10;
          ctx.lineTo(x + Math.cos(ang) * r * 1.15, y + Math.sin(ang) * r * 0.62);
        }
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1; ctx.lineWidth = 2.5; ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(90,60,30,.45)'; ctx.stroke(); ctx.setLineDash([]);
        ctx.restore();
        // decorations per area
        for (let k = 0; k < 7; k++) {
          const dx = x + Math.cos(k * 2.1 + a.id) * 85, dy = y + Math.sin(k * 1.7 + a.id) * 38;
          if (a.id === 1) { D.circ(ctx, dx, dy - 6, 7); D.fs(ctx, '#6fae4b', 2); }
          else if (a.id === 2) { D.tri(ctx, dx - 7, dy, dx, dy - 18, dx + 7, dy); D.fs(ctx, '#2f5a32', 2); }
          else if (a.id === 3) { D.tri(ctx, dx - 12, dy, dx - 2, dy - 20, dx + 10, dy); D.fs(ctx, '#8a4a32', 2); }
          else if (a.id === 4) { D.tri(ctx, dx - 10, dy, dx, dy - 18, dx + 10, dy); D.fs(ctx, '#e6f3fb', 2); }
          else { D.rrect(ctx, dx - 4, dy - 18, 8, 18, 1); D.fs(ctx, '#4a2a4a', 2); }
        }
      });
      // roads between areas
      ctx.strokeStyle = 'rgba(110,70,30,.55)'; ctx.lineWidth = 4; ctx.setLineDash([2, 10]); ctx.lineCap = 'round';
      ctx.beginPath();
      BF.DATA.areas.forEach((a, i) => {
        a.missions.forEach((m, j) => { const p = nodePos(a, j); const px = p.x / 100 * W, py = p.y / 100 * H; if (i === 0 && j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
      });
      ctx.stroke(); ctx.setLineDash([]);
      // compass
      ctx.save(); ctx.translate(W * 0.08, H * 0.16);
      D.circ(ctx, 0, 0, 30); D.fs(ctx, 'rgba(255,245,220,.7)', 2.5, '#6a4a2a');
      ctx.fillStyle = '#8a2a1a'; D.tri(ctx, 0, -28, 7, 0, -7, 0); ctx.fill();
      ctx.fillStyle = '#3a2a1a'; D.tri(ctx, 0, 28, 7, 0, -7, 0); ctx.fill();
      ctx.font = '700 14px "Grenze Gotisch", serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#3a2415'; ctx.fillText('N', 0, -34);
      ctx.restore();
      // cartouche title
      ctx.save(); ctx.translate(W * 0.3, H * 0.93);
      D.rrect(ctx, -170, -22, 340, 44, 10); D.fs(ctx, 'rgba(255,245,220,.85)', 3, '#6a4a2a');
      ctx.font = '800 30px "Grenze Gotisch", serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3a2415';
      ctx.fillText('The Realm of Grejs', 0, 2);
      ctx.restore();
      // frame
      ctx.lineWidth = 10; ctx.strokeStyle = '#6a4a2a'; ctx.strokeRect(5, 5, W - 10, H - 10);
      ctx.lineWidth = 2; ctx.strokeStyle = '#a8804a'; ctx.strokeRect(14, 14, W - 28, H - 28);
      return c;
    }

    function renderNodes() {
      nodesEl.innerHTML = '';
      BF.DATA.areas.forEach((a) => {
        const unlockedArea = BF.save.unlockedAreas.includes(a.id);
        // area label
        nodesEl.append(h('button', {
          class: 'area-label' + (unlockedArea ? '' : ' locked'), style: { left: a.map.x + '%', top: (a.map.y - 13) + '%' },
          onclick: () => { BF.Audio.sfx('click'); selectArea(a.id); },
        }, h('b', null, a.name), unlockedArea ? null : h('small', null, 'Locked')));
        a.missions.forEach((m, i) => {
          const p = nodePos(a, i);
          const done = BF.save.completedMissions[m.id];
          const open = BF.Prog.missionUnlocked(m.id);
          const cls = ['map-node', m.boss ? 'boss' : '', done ? 'done' : '', open && !done ? 'open' : '', !open ? 'locked' : '', selected === m.id ? 'sel' : ''].join(' ');
          nodesEl.append(h('button', {
            class: cls, style: { left: p.x + '%', top: p.y + '%' }, 'aria-label': `Mission ${m.id} ${m.name}${done ? ' (completed)' : open ? '' : ' (locked)'}`,
            onclick: () => { BF.Audio.sfx('click'); selectMission(m.id); },
          }, m.boss ? BF.Icons.glyph('skull', 30) : h('span', null, m.id.split('-')[1]), done ? h('i', { class: 'node-check' }, '✓') : null));
        });
      });
    }

    function selectArea(areaId) {
      const a = BF.DATA.areas[areaId - 1];
      const firstOpen = a.missions.find((m) => BF.Prog.missionUnlocked(m.id) && !BF.save.completedMissions[m.id]) || a.missions[0];
      selectMission(firstOpen.id);
    }

    function selectMission(id) {
      selected = id;
      renderNodes();
      renderPanel();
    }

    function renderPanel() {
      panel.innerHTML = '';
      const m = BF.DATA.missions[selected];
      if (!m) return;
      const a = BF.DATA.areas[m.area - 1];
      const open = BF.Prog.missionUnlocked(m.id);
      const areaOpen = BF.save.unlockedAreas.includes(a.id);
      const done = BF.save.completedMissions[m.id];
      const enemyIds = [...new Set(m.waves.flat().map((g) => g.enemy))];
      const s = BF.save;

      if (s.session) {
        const sm = BF.DATA.missions[s.session.missionId];
        panel.append(h('div', { class: 'callout warn' },
          h('b', null, 'Mission in progress'),
          h('p', null, `Your warriors are waiting in the forge for “${sm.name}”.`),
          BF.UI.btn('Return to the forge', () => BF.Game.go('ORDER'), 'primary small')));
      }

      panel.append(
        h('div', { class: 'mp-area', style: { '--ac': a.color } }, h('small', null, `Area ${a.id}`), h('h2', null, a.name), h('p', null, a.subtitle)),
        h('div', { class: 'mp-mission' },
          h('div', { class: 'mp-title' }, h('span', { class: 'mp-id' }, m.id), h('h3', null, m.name), m.boss ? h('span', { class: 'chip boss' }, 'BOSS') : null),
          h('div', { class: 'mp-row' }, h('span', null, 'Difficulty'), BF.UI.stars(m.stars)),
          h('div', { class: 'mp-row' }, h('span', null, 'Warriors'), h('b', null, `${Math.min(m.squad, BF.Prog.availableWarriors().length)} of ${m.squad} slots`)),
          h('div', { class: 'mp-row' }, h('span', null, 'Waves'), h('b', null, String(m.waves.length))),
          done ? h('div', { class: 'mp-row' }, h('span', null, 'Best score'), h('b', null, done.best + '%')) : null,
          h('div', { class: 'mp-enemies' }, enemyIds.map((id) => h('span', { class: 'mp-enemy', title: BF.DATA.enemies[id].name }, BF.Icons.enemy(id, 52), h('small', null, BF.DATA.enemies[id].name))))),
      );
      if (!areaOpen) panel.append(h('p', { class: 'muted' }, `Defeat the boss of ${BF.DATA.areas[a.id - 2].name} to open this area.`));
      else if (!open) panel.append(h('p', { class: 'muted' }, 'Complete the previous mission to unlock this one.'));
      const go = h('button', {
        class: 'btn primary big', disabled: !open || (!!s.session && s.session.missionId !== m.id),
        onclick: U.guard(() => { BF.Audio.sfx('click'); BF.Game.go('SCOUT', { missionId: m.id }); }),
      }, done ? 'Replay mission' : 'Scout this mission');
      panel.append(go);
      if (s.session && s.session.missionId !== m.id) panel.append(h('p', { class: 'muted small' }, 'Finish or abandon the mission in progress first.'));
    }

    return {
      enter(root, params = {}) {
        t = 0;
        BF.Audio.music('map');
        const wrap = h('div', { class: 'map-layout' });
        const left = h('div', { class: 'map-left' });
        const nav = h('div', { class: 'map-nav' },
          BF.UI.btn('Shop', () => BF.Game.go('SHOP'), 'small'),
          BF.UI.btn('Upgrades', () => BF.Game.go('UPGRADES'), 'small'),
          BF.UI.btn('Armory', () => BF.Game.go('ARMORY'), 'small'),
          BF.UI.btn('Blueprints', () => BF.Game.go('BLUEPRINTS'), 'small'),
          BF.UI.btn('Achievements', () => BF.Game.go('ACHIEVEMENTS'), 'small'));
        left.append(nav);
        const mapBox = h('div', { class: 'map-box' });
        left.append(mapBox);
        st = BF.UI.stage(mapBox, 960, 540, 'map-stage');
        nodesEl = h('div', { class: 'map-nodes' });
        mapBox.append(nodesEl);
        panel = h('aside', { class: 'map-panel panel' });
        wrap.append(left, panel);
        root.append(wrap);
        mapCache = drawMapBase(960, 540);
        selected = params.missionId || (BF.save.session && BF.save.session.missionId) || nextMission() || '1-1';
        if (params.area) { selectArea(params.area); } else selectMission(selected);
        // achievements for unlocked areas etc.
        BF.Prog.checkAchievements();
      },
      exit() { st = null; },
      update(dt) { t += dt; if (st) st.fx.update(dt); },
      draw() {
        if (!st) return;
        const ctx = st.ctx;
        st.begin();
        ctx.drawImage(mapCache, 0, 0, 960, 540);
        // fog over locked areas
        BF.DATA.areas.forEach((a) => {
          if (BF.save.unlockedAreas.includes(a.id)) return;
          const x = a.map.x / 100 * 960, y = a.map.y / 100 * 540;
          ctx.save(); ctx.globalAlpha = 0.55;
          for (let k = 0; k < 5; k++) {
            D.ell(ctx, x + Math.sin(t * 0.3 + k) * 20 + (k - 2) * 40, y + Math.cos(t * 0.4 + k) * 8, 90, 34);
            ctx.fillStyle = '#e8dcc4'; ctx.fill();
          }
          ctx.restore();
        });
        // pulsing highlight on the selected node
        const m = BF.DATA.missions[selected];
        if (m) {
          const p = nodePos(BF.DATA.areas[m.area - 1], m.index);
          ctx.save(); ctx.globalAlpha = 0.35 + Math.sin(t * 4) * 0.15;
          D.circ(ctx, p.x / 100 * 960, p.y / 100 * 540, 30 + Math.sin(t * 4) * 4); ctx.fillStyle = '#ffd24a'; ctx.fill();
          ctx.restore();
        }
        // the smith's wagon icon at the next mission
        const nm = nextMission();
        if (nm) {
          const mm = BF.DATA.missions[nm];
          const p = nodePos(BF.DATA.areas[mm.area - 1], mm.index);
          D.critter(ctx, p.x / 100 * 960 - 26, p.y / 100 * 540 + 4 + Math.sin(t * 3) * 2, null, { species: 'badger', t, scale: 0.55, hat: 'smith' });
        }
        st.end();
      },
    };
  }

  BF.Screens.WORLD_MAP = Screen('map');
  BF.Screens.MISSION_SELECT = Screen('select');
})();
