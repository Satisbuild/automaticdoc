<script>
/* ---- js/screens/scout.js ---- */
/* =========================================================
   SCOUT REPORT – intel before a mission + squad selection.
   ========================================================= */
BF.Screens.SCOUT = (function () {
  const U = BF.U, h = U.h;
  let mission = null, squad = [], root = null;

  /** Tally weaknesses & resistances over every enemy in the mission. */
  function analyse(m) {
    const counts = {};
    m.waves.flat().forEach((g) => { counts[g.enemy] = (counts[g.enemy] || 0) + g.count; });
    const weakT = {}, weakE = {}, resT = {}, resE = {};
    for (const id in counts) {
      const e = BF.DATA.enemies[id], n = counts[id] * (e.boss ? 6 : 1);
      e.weak.types.forEach((t) => (weakT[t] = (weakT[t] || 0) + n));
      e.weak.elements.forEach((t) => (weakE[t] = (weakE[t] || 0) + n));
      e.resist.types.forEach((t) => (resT[t] = (resT[t] || 0) + n));
      e.resist.elements.forEach((t) => (resE[t] = (resE[t] || 0) + n));
    }
    const sort = (o) => Object.entries(o).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
    return { counts, weakT: sort(weakT), weakE: sort(weakE), resT: sort(resT), resE: sort(resE), rawWeakT: weakT, rawResT: resT };
  }

  /** Suggest a squad: score each clan by the mission's weaknesses. */
  function suggestSquad(m, info) {
    const avail = BF.Prog.availableWarriors();
    const size = Math.min(m.squad, avail.length);
    const score = (cls) => {
      const t = BF.DATA.warriors[cls].weaponType;
      return (info.rawWeakT[t] || 0) - (info.rawResT[t] || 0) * 0.8 + (cls === 'shieldknights' ? 3 : 0) + (cls === 'ironguard' ? 1 : 0);
    };
    return avail.slice().sort((a, b) => score(b) - score(a)).slice(0, size);
  }

  function render() {
    root.innerHTML = '';
    const m = mission, a = BF.DATA.areas[m.area - 1];
    const info = analyse(m);
    const avail = BF.Prog.availableWarriors();
    const size = Math.min(m.squad, avail.length);
    const mat = BF.DATA.materials[a.recMaterial];
    const matOwned = BF.save.ore[a.recMaterial] || 0;
    const matUnlocked = BF.save.materials.includes(a.recMaterial);

    const typeName = (t) => BF.DATA.weaponTypes[t].name;
    const chipList = (list, fmt, cls) => list.length ? h('div', { class: 'chips' }, list.map((x) => h('span', { class: 'chip ' + cls }, fmt(x)))) : h('span', { class: 'muted' }, 'None');

    const scout = h('div', { class: 'scout-hero panel' },
      BF.Icons.portrait(null, 96, 'fox'),
      h('div', { class: 'speech' },
        h('small', null, 'Scout Report · Rook the Fox'),
        h('p', null, m.boss
          ? `Big trouble at ${m.name}. ${BF.DATA.enemies[m.waves[m.waves.length - 1][0].enemy].name} waits at the end. ${info.weakT.length ? 'Bring ' + info.weakT.slice(0, 2).map(typeName).join(' and ').toLowerCase() + 's.' : ''}`
          : `${Object.keys(info.counts).length} kinds of foes at ${m.name}. ${info.weakT.length ? 'They hate ' + info.weakT.slice(0, 2).map(typeName).join(' and ').toLowerCase() + 's.' : 'Nothing special – just hit hard.'} ${info.resT.length ? 'Careful: ' + info.resT.slice(0, 2).map(typeName).join(' and ').toLowerCase() + 's struggle here.' : ''}`)));

    const enemies = h('section', { class: 'panel scout-enemies' },
      h('h3', null, 'Enemies detected'),
      h('div', { class: 'enemy-list' }, Object.keys(info.counts).map((id) => {
        const e = BF.DATA.enemies[id];
        return h('div', { class: 'enemy-card' + (e.boss ? ' boss' : '') },
          BF.Icons.enemy(id, 64),
          h('div', null,
            h('b', null, e.name, ' ', h('span', { class: 'muted' }, '×' + info.counts[id])),
            h('small', null, `HP ${Math.round(e.hp * (e.boss ? 1 : m.enemyScale) * (BF.TUNE.area[m.area] || [1, 1, 1, 1])[e.boss ? 2 : 0])} · Armor ${e.armor}${e.def ? '' : ''}${e.range > 120 ? ' · Ranged' : ''}${e.flying ? ' · Flying' : ''}`),
            h('div', { class: 'wr' },
              e.weak.types.map((t) => h('span', { class: 'chip weak' }, '▲ ' + typeName(t))),
              e.weak.elements.map((t) => h('span', { class: 'chip weak' }, '▲ ' + BF.DATA.elements[t].name)),
              e.resist.types.map((t) => h('span', { class: 'chip resist' }, '▼ ' + typeName(t))),
              e.resist.elements.map((t) => h('span', { class: 'chip resist' }, '▼ ' + BF.DATA.elements[t].name)))));
      })));

    const intel = h('section', { class: 'panel scout-intel' },
      h('div', { class: 'intel-row' }, h('span', null, 'Area'), h('b', null, `${a.name} · Mission ${m.id}`)),
      h('div', { class: 'intel-row' }, h('span', null, 'Difficulty'), BF.UI.stars(m.stars)),
      h('div', { class: 'intel-row' }, h('span', null, 'Weakness'), chipList([...info.weakT.map(typeName), ...info.weakE.map((e) => BF.DATA.elements[e].name)], (x) => x, 'weak')),
      h('div', { class: 'intel-row' }, h('span', null, 'Resistant to'), chipList([...info.resT.map(typeName), ...info.resE.map((e) => BF.DATA.elements[e].name)], (x) => x, 'resist')),
      h('div', { class: 'intel-row' }, h('span', null, 'Recommended weapons'), chipList(info.weakT.length ? info.weakT.slice(0, 3) : ['sword'], typeName, 'good')),
      h('div', { class: 'intel-row' }, h('span', null, 'Recommended material'),
        h('span', { class: 'rec-mat' }, BF.Icons.material(a.recMaterial, 26), h('b', null, mat.name + '+'),
          h('small', { class: matUnlocked && matOwned ? 'good-text' : 'muted' }, matUnlocked ? ` (you have ${matOwned})` : ` (unlocks at level ${mat.unlockLevel})`))),
      h('div', { class: 'intel-row' }, h('span', null, 'Expected loot'),
        h('div', { class: 'loot-preview' },
          a.ores.map((o) => BF.Icons.material(o.id, 26)),
          BF.Icons.item({ kind: 'gold' }, 26), BF.Icons.item({ kind: 'gem' }, 26), BF.Icons.item({ kind: 'part', tpl: 'ironhandle' }, 26),
          [...new Set(m.waves.flat().flatMap((g) => (BF.DATA.enemies[g.enemy].specials || []).map((s) => s.id)))].map((id) => BF.Icons.item({ kind: 'special', id }, 26)),
          h('small', { class: 'muted' }, ` Parts up to ${BF.DATA.rarities[a.maxPart].name}`))));

    // squad picker
    const squadBox = h('section', { class: 'panel squad-pick' },
      h('h3', null, `Choose your squad (${squad.length}/${size})`),
      h('div', { class: 'squad-grid' }, avail.map((cls) => {
        const d = BF.DATA.warriors[cls];
        const on = squad.includes(cls);
        const t = d.weaponType;
        const tag = info.rawWeakT[t] ? 'Effective' : info.rawResT[t] ? 'Resisted' : '';
        return h('button', {
          class: 'squad-card' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false',
          onclick: () => {
            BF.Audio.sfx('click');
            if (on) squad = squad.filter((c) => c !== cls);
            else if (squad.length < size) squad.push(cls);
            else { squad.shift(); squad.push(cls); }
            render();
          },
        }, BF.Icons.portrait(cls, 60),
        h('span', { class: 'sq-name' }, d.name),
        h('small', null, `${typeName(t)} · ${d.role}`),
        tag ? h('span', { class: 'chip ' + (tag === 'Effective' ? 'weak' : 'resist') }, tag) : null);
      })),
      h('p', { class: 'muted small' }, `Every warrior in the squad needs a weapon. ${avail.length < m.squad ? 'More clans join as you complete missions.' : ''}`));

    const actions = h('div', { class: 'scout-actions' },
      BF.UI.btn('‹ Map', () => BF.Game.go('WORLD_MAP', { missionId: m.id }), 'ghost'),
      h('button', {
        class: 'btn primary big', disabled: squad.length !== size,
        onclick: U.guard(() => {
          BF.Audio.sfx('click');
          BF.save.session = { missionId: m.id, squad: squad.slice(), equipped: {}, started: new Date().toISOString() };
          BF.Save.save();
          BF.Game.go('ORDER');
        }),
      }, 'Open the forge →'));

    root.append(h('div', { class: 'scout-layout' },
      h('div', { class: 'scout-col' }, scout, intel, squadBox),
      h('div', { class: 'scout-col' }, enemies),
      actions));
  }

  return {
    enter(r, params = {}) {
      root = r;
      mission = BF.DATA.missions[params.missionId] || BF.DATA.missions['1-1'];
      if (BF.save.session && BF.save.session.missionId === mission.id) { BF.Game.go('ORDER'); return; }
      squad = suggestSquad(mission, analyse(mission));
      BF.Audio.music('map');
      render();
    },
    exit() {},
    analyse, suggestSquad,
  };
})();

</script>
<script>
/* ---- js/screens/order.js ---- */
/* =========================================================
   ORDER – warriors come into the forge with their requests.
   ========================================================= */
BF.Screens.ORDER = (function () {
  const U = BF.U, h = U.h;
  let root = null, st = null, t = 0, current = null;

  const weaponByUid = (uid) => BF.save.armory.find((w) => w.uid === uid);

  function session() { return BF.save.session; }

  /** Suggested design for a warrior: best unlocked of its type. */
  function suggestedDesign(type) {
    const list = Object.values(BF.DATA.weapons).filter((w) => w.type === type && BF.save.blueprints.includes(w.id));
    return list.sort((a, b) => b.unlockLevel - a.unlockLevel)[0];
  }

  function pickFromArmory(cls) {
    const s = session();
    const type = BF.DATA.warriors[cls].weaponType;
    const inUse = Object.entries(s.equipped).filter(([c]) => c !== cls).map(([, uid]) => uid);
    const list = BF.save.armory.filter((w) => !w.broken && BF.getDesign(w.designId).type === type && !inUse.includes(w.uid))
      .sort((a, b) => b.power - a.power);
    if (!list.length) { BF.UI.toast('No usable ' + type + 's in the armory.', { kind: 'bad' }); return; }
    const body = h('div', { class: 'pick-list' }, list.slice(0, 20).map((w) => h('button', {
      class: 'pick-weapon', onclick: () => {
        BF.Audio.sfx('snap');
        s.equipped[cls] = w.uid;
        BF.Save.save();
        close();
        render();
      },
    }, BF.Icons.weapon(w, 56), h('div', null, h('b', null, w.name), h('small', null, `Power ${w.power} · Durability ${Math.round(w.durability)}/${w.maxDurability} · ${BF.Stats.qualityTier(w.overall).name}`)), BF.UI.stars(w.stars))));
    const close = BF.UI.modal({ title: 'Equip from the armory', body, buttons: [{ label: 'Cancel', cls: 'ghost' }] });
  }

  async function abandon() {
    const ok = await BF.UI.confirm('Abandon mission?', 'Your warriors go home. Weapons you forged stay in the armory.', 'Abandon', true);
    if (!ok) return;
    BF.save.session = null;
    BF.Save.save();
    BF.Game.go('WORLD_MAP');
  }

  function render() {
    const s = session();
    root.innerHTML = '';
    const m = BF.DATA.missions[s.missionId];
    // who still needs a weapon?
    const need = s.squad.filter((c) => { const w = weaponByUid(s.equipped[c]); return !w || w.broken; });
    s.squad.forEach((c) => { const w = weaponByUid(s.equipped[c]); if (!w || w.broken) delete s.equipped[c]; });
    if (!current || !s.squad.includes(current)) current = need[0] || null;
    if (current && !need.includes(current) && need.length) current = need[0];

    const cards = h('div', { class: 'order-queue' }, s.squad.map((cls) => {
      const d = BF.DATA.warriors[cls];
      const w = weaponByUid(s.equipped[cls]);
      return h('button', {
        class: 'queue-card' + (cls === current ? ' on' : '') + (w ? ' ready' : ''),
        onclick: () => { BF.Audio.sfx('click'); current = cls; render(); },
      }, BF.Icons.portrait(cls, 56),
      h('span', { class: 'qc-body' }, h('b', null, d.name),
        w ? h('small', null, w.name) : h('small', { class: 'warn-text' }, 'Needs a ' + BF.DATA.weaponTypes[d.weaponType].name.toLowerCase())),
      w ? BF.Icons.weapon(w, 44) : null);
    }));

    const header = h('div', { class: 'order-header' },
      h('div', null, h('small', null, `Mission ${m.id} · ${BF.DATA.areas[m.area - 1].name}`), h('h1', null, m.name)),
      h('div', { class: 'order-header-actions' },
        BF.UI.btn('Abandon', abandon, 'ghost small'),
        BF.UI.btn('Scout report', () => { BF.UI.modal({ title: 'Scout report', body: scoutSummary(m), buttons: [{ label: 'Got it', cls: 'primary' }] }); }, 'small')));

    root.append(header, cards);

    if (current) {
      const d = BF.DATA.warriors[current];
      const type = BF.DATA.weaponTypes[d.weaponType];
      const sug = suggestedDesign(d.weaponType);
      const area = BF.DATA.areas[m.area - 1];
      const old = weaponByUid(s.equipped[current]);
      const line = d.lines[(m.globalIndex + d.id.length) % d.lines.length];
      const hasArmory = BF.save.armory.some((w) => !w.broken && BF.getDesign(w.designId).type === d.weaponType);

      const stageBox = h('div', { class: 'order-stage' });
      const panel = h('div', { class: 'order-panel panel' },
        h('div', { class: 'order-ribbon' }, 'Customer order'),
        h('div', { class: 'order-grid' },
          h('span', { class: 'og-l' }, 'Warrior'), h('b', null, `${d.name} – ${d.hero}`),
          h('span', { class: 'og-l' }, 'Requested weapon'), h('b', { class: 'big-type' }, type.name.toUpperCase()),
          h('span', { class: 'og-l' }, 'Suggested design'), h('b', null, sug ? sug.name : type.name),
          h('span', { class: 'og-l' }, 'Required parts'), h('div', { class: 'req-parts' },
            h('span', { class: 'chip' }, '1 ' + type.mainPart + ' (cast)'),
            type.slots.map((sl) => h('span', { class: 'chip' }, '1 ' + BF.DATA.slots[sl].name))),
          h('span', { class: 'og-l' }, 'Material'), h('b', null, 'Any metal'),
          h('span', { class: 'og-l' }, 'Recommended'), h('b', { class: 'rec' }, BF.Icons.material(area.recMaterial, 22), ' ', BF.DATA.materials[area.recMaterial].name + '+'),
          h('span', { class: 'og-l' }, 'Clan strength'), h('p', null, d.strength)),
        h('div', { class: 'order-actions' },
          BF.UI.btn(old ? 'Forge a new one' : 'Accept order', () => BF.Game.go('CRAFTING', { cls: current }), 'primary big'),
          hasArmory ? BF.UI.btn('Equip from armory', () => pickFromArmory(current), '') : null));
      const bubble = h('div', { class: 'speech big' }, h('p', null, '“' + line + '”'));
      root.append(h('div', { class: 'order-main' }, h('div', { class: 'order-left' }, stageBox, bubble), panel));
      st = BF.UI.stage(stageBox, 420, 300, 'order-canvas');
    } else {
      st = null;
      root.append(h('div', { class: 'order-ready panel' },
        h('h2', null, 'The squad is armed!'),
        h('p', null, 'Every warrior has a weapon. Check the damage preview, then march out.'),
        h('div', { class: 'order-actions' },
          BF.UI.btn('Review & march out →', () => BF.Game.go('PRE_BATTLE'), 'primary big'))));
    }
  }

  function scoutSummary(m) {
    const info = BF.Screens.SCOUT.analyse(m);
    const tn = (x) => BF.DATA.weaponTypes[x].name;
    return h('div', null,
      h('p', null, h('b', null, 'Weak to: '), [...info.weakT.map(tn), ...info.weakE.map((e) => BF.DATA.elements[e].name)].join(', ') || 'nothing special'),
      h('p', null, h('b', null, 'Resists: '), [...info.resT.map(tn), ...info.resE.map((e) => BF.DATA.elements[e].name)].join(', ') || 'nothing'),
      h('div', { class: 'loot-preview' }, Object.keys(info.counts).map((id) => BF.Icons.enemy(id, 48))));
  }

  return {
    enter(r) {
      root = r; t = 0; current = null;
      if (!BF.save.session) { BF.Game.go('WORLD_MAP'); return; }
      BF.Audio.music('forge');
      render();
      BF.Save.save();
    },
    exit() { st = null; },
    update(dt) { t += dt; if (st) st.fx.update(dt); },
    draw() {
      if (!st || !current) return;
      const ctx = st.ctx;
      st.begin();
      BF.Draw.forgeBackdrop(ctx, st.W, st.H, t, { furnaceX: 40, floor: 0.82 });
      // warrior walks in from the left, then idles
      const x = Math.min(210, -40 + t * 220);
      BF.Draw.critter(ctx, x, 262, current, { t, scale: 2.4, walk: x < 210 ? 1 : 0 });
      st.end();
    },
    weaponByUid,
  };
})();

</script>
<script>
/* ---- js/screens/crafting.js ---- */
/* =========================================================
   CRAFTING – the heart of the game.
   Selection steps (material → blueprint → parts) followed by
   five skill minigames: MELT, POUR, HAMMER, SHAPE, ASSEMBLE.
   Layout: smith (left) · station (middle) · order/stats (right)
   HUD resources on top, step progress at the bottom.
   ========================================================= */
BF.Screens.CRAFTING = (function () {
  const U = BF.U, h = U.h, D = BF.Draw;
  const STEPS = [
    { id: 'material', label: 'Material' }, { id: 'design', label: 'Blueprint' }, { id: 'parts', label: 'Parts' },
    { id: 'melt', label: 'Melt' }, { id: 'pour', label: 'Pour' }, { id: 'hammer', label: 'Hammer' },
    { id: 'shape', label: 'Shape' }, { id: 'assemble', label: 'Assemble' },
  ];
  let root, cls, stepId, sel, scores, combo, maxCombo, st, t, game, els = {}, keyHeld = false, busy = false;

  const S = () => BF.save;
  const warrior = () => BF.DATA.warriors[cls];
  const wType = () => warrior().weaponType;

  /* =========================================================
     LAYOUT
     ========================================================= */
  function layout() {
    root.innerHTML = '';
    const d = warrior();
    els.header = h('div', { class: 'craft-header' },
      BF.Icons.portrait(cls, 48),
      h('div', null, h('small', null, 'Forging for'), h('b', null, `${d.name} – ${BF.DATA.weaponTypes[d.weaponType].name}`)),
      h('span', { class: 'spacer' }),
      BF.UI.btn('Cancel craft', cancelCraft, 'ghost small'));
    els.main = h('div', { class: 'craft-main' });
    els.steps = h('ol', { class: 'craft-steps', 'aria-label': 'Crafting progress' });
    root.append(els.header, els.main, els.steps);
  }

  function renderSteps() {
    els.steps.innerHTML = '';
    const idx = STEPS.findIndex((s) => s.id === stepId);
    STEPS.forEach((s, i) => {
      const scoreKey = { melt: 'melt', pour: 'pour', hammer: 'construction', shape: 'shape', assemble: 'assembly' }[s.id];
      const v = scoreKey && scores[scoreKey] != null ? Math.round(scores[scoreKey]) + '%' : '';
      els.steps.append(h('li', { class: (i < idx ? 'done' : i === idx ? 'now' : '') }, h('span', { class: 'st-num' }, i < idx ? '✓' : String(i + 1)), h('span', { class: 'st-label' }, s.label), v ? h('b', null, v) : null));
    });
  }

  async function cancelCraft() {
    if (busy) return;
    const started = ['melt', 'pour', 'hammer', 'shape', 'assemble'].includes(stepId);
    const ok = await BF.UI.confirm('Cancel this craft?', started ? 'The metal is returned to your stores. Progress on this weapon is lost.' : 'Go back to the order board?', 'Cancel craft');
    if (!ok) return;
    if (started && S().craftRefund) {
      const r = S().craftRefund;
      S().ore[r.materialId] = (S().ore[r.materialId] || 0) + r.qty;
      delete S().craftRefund;
      BF.Save.save();
    }
    BF.Game.go('ORDER');
  }

  /* =========================================================
     STEP 1 – MATERIAL
     ========================================================= */
  function materialState(id) {
    const m = BF.DATA.materials[id];
    const s = S();
    const fmax = BF.DATA.upgrades.forge.value(s.upgrades.forge);
    if (!s.materials.includes(id)) return { ok: false, why: `Unlocks at level ${m.unlockLevel}` };
    if (fmax < m.melt[1]) {
      let need = 0; while (BF.DATA.upgrades.forge.value(need) < m.melt[1]) need++;
      return { ok: false, why: `Needs Forge Level ${need + 1}` };
    }
    if (!(s.ore[id] > 0)) return { ok: false, why: 'No ore in stock' };
    // must afford at least one design of the requested weapon type
    const costs = Object.values(BF.DATA.weapons).filter((d) => d.type === wType() && s.blueprints.includes(d.id)).map((d) => d.cost);
    const minCost = costs.length ? Math.min(...costs) : 1;
    if (s.ore[id] < minCost) return { ok: false, why: `Need ${minCost} ore for a ${BF.DATA.weaponTypes[wType()].name.toLowerCase()} (have ${s.ore[id]})` };
    return { ok: true };
  }

  function showMaterial() {
    stepId = 'material'; renderSteps();
    els.main.innerHTML = '';
    const s = S();
    const grid = h('div', { class: 'pick-grid' });
    BF.DATA.materialOrder.forEach((id) => {
      const m = BF.DATA.materials[id];
      const state = materialState(id);
      if (!s.materials.includes(id) && m.unlockLevel > s.playerLevel + 4) return;
      grid.append(h('button', {
        class: 'pick-card mat' + (state.ok ? '' : ' disabled') + (sel.materialId === id ? ' on' : ''), disabled: !state.ok,
        onclick: () => { BF.Audio.sfx('click'); sel.materialId = id; showDesign(); },
      },
      h('div', { class: 'pc-top' }, BF.Icons.material(id, 46), h('div', null, h('b', null, m.name), BF.UI.rarityChip(m.rarity))),
      h('div', { class: 'pc-owned' }, `In stock: ${s.ore[id] || 0}`),
      BF.UI.statBar('Power', m.power, 130, '#ff8a3d'),
      BF.UI.statBar('Durability', m.durability, 130, '#52a8ff'),
      BF.UI.statBar('Luck', m.luck, 14, '#74d86a'),
      h('div', { class: 'pc-meta' }, `Melt ${m.melt[0]}–${m.melt[1]}°C`, m.element ? BF.UI.elementChip(m.element) : null),
      state.ok ? null : h('div', { class: 'pc-lock' }, state.why)));
    });
    const totalOre = Object.values(s.ore).reduce((a, b) => a + b, 0);
    const help = [];
    if (totalOre === 0) {
      help.push(h('div', { class: 'callout warn' },
        h('b', null, 'Your ore bins are empty!'),
        s.gold >= 60
          ? h('p', null, 'Buy a few copper ingots from the miners\' cart.', ' ', BF.UI.btn('Buy 3 copper for 60 gold', () => { s.gold -= 60; s.ore.copper = (s.ore.copper || 0) + 3; BF.Audio.sfx('buy'); BF.Save.save(); BF.UI.updateHUD(); showMaterial(); }, 'small primary'))
          : h('p', null, 'The valley miners take pity on you.', ' ', BF.UI.btn('Take 2 free copper', () => { s.ore.copper = (s.ore.copper || 0) + 2; BF.Audio.sfx('loot'); BF.Save.save(); BF.UI.updateHUD(); showMaterial(); }, 'small primary'))));
    }
    els.main.append(h('div', { class: 'select-step' },
      h('div', { class: 'step-title' }, h('h2', null, '1 · Choose the metal'), h('p', null, 'Better metal means a stronger weapon – but it is expensive. Save your best ore for when it matters.')),
      help, grid));
  }

  /* =========================================================
     STEP 2 – BLUEPRINT
     ========================================================= */
  function designState(d) {
    const s = S();
    const have = s.ore[sel.materialId] || 0;
    if (have < d.cost) return { ok: false, why: `Needs ${d.cost} ${BF.DATA.materials[sel.materialId].name} ore (you have ${have})` };
    if (d.epic) {
      const missing = d.requires.filter((r) => !(s.inventory.special[r] > 0));
      if (missing.length) return { ok: false, why: 'Missing: ' + missing.map((r) => BF.DATA.specials[r].name).join(', ') };
      if (BF.DATA.materialOrder.indexOf(sel.materialId) < BF.DATA.materialOrder.indexOf(d.minMaterial)) return { ok: false, why: `Needs ${BF.DATA.materials[d.minMaterial].name} or better` };
    }
    return { ok: true };
  }

  function projected(designId, parts, q = 80) {
    return BF.Stats.calculateWeaponStats({ designId, materialId: sel.materialId, parts: parts || {}, scores: { melt: q, pour: q, construction: q, shape: q, assembly: q }, maxCombo: 1 });
  }

  function showDesign() {
    stepId = 'design'; renderSteps();
    els.main.innerHTML = '';
    const s = S();
    const type = wType();
    const list = Object.values(BF.DATA.weapons).filter((d) => d.type === type).sort((a, b) => a.unlockLevel - b.unlockLevel);
    const epics = Object.values(BF.DATA.epics).filter((d) => d.type === type && s.epicBlueprints.includes(d.id));
    const grid = h('div', { class: 'pick-grid' });
    [...epics, ...list].forEach((d) => {
      const unlocked = d.epic || s.blueprints.includes(d.id);
      const state = unlocked ? designState(d) : { ok: false, why: `Unlocks at level ${d.unlockLevel}` };
      const p = projected(d.id);
      grid.append(h('button', {
        class: 'pick-card design' + (d.epic ? ' epic' : '') + (state.ok ? '' : ' disabled'), disabled: !state.ok,
        onclick: () => { BF.Audio.sfx('click'); sel.designId = d.id; sel.parts = {}; showParts(); },
      },
      h('div', { class: 'pc-top' }, BF.Icons.weapon({ designId: d.id, materialId: sel.materialId }, 64), h('div', null, h('b', null, d.name), BF.UI.rarityChip(d.rarity), d.epic ? h('span', { class: 'chip epic-chip' }, 'EPIC') : null)),
      h('div', { class: 'pc-owned' }, `Uses ${d.cost} ore · Speed ×${d.speed}`),
      h('div', { class: 'pc-proj' }, h('small', null, 'At 80% quality:'), h('span', null, `Power ${p.power}`), h('span', null, `Durability ${p.maxDurability}`)),
      d.epic ? h('div', { class: 'pc-epic' }, d.bonusText.map((b) => h('small', null, '✦ ' + b)), h('small', { class: 'muted' }, 'Consumes: ' + d.requires.map((r) => BF.DATA.specials[r].name).join(' + '))) : null,
      state.ok ? null : h('div', { class: 'pc-lock' }, state.why)));
    });
    els.main.append(h('div', { class: 'select-step' },
      h('div', { class: 'step-title' },
        BF.UI.btn('‹ Material', showMaterial, 'ghost small'),
        h('h2', null, '2 · Choose the blueprint'), h('p', null, `${warrior().name} wants a ${BF.DATA.weaponTypes[type].name.toLowerCase()}. Bigger designs hit harder but use more ore.`)),
      grid));
  }

  /* =========================================================
     STEP 3 – PARTS
     ========================================================= */
  function showParts() {
    stepId = 'parts'; renderSteps();
    els.main.innerHTML = '';
    const s = S();
    const design = BF.getDesign(sel.designId);
    const slots = BF.DATA.weaponTypes[design.type].slots;

          const statTxt = [ps.power && `+${ps.power} Pow`, ps.durability && `+${ps.durability} Dur`, ps.luck && `+${ps.luck} Luck`, ps.crit && `+${ps.crit}% Crit`, ps.speed && `+${ps.speed}% Spd`, ps.element && `+${ps.element.value} ${BF.DATA.elements[ps.element.type].name}`].filter(Boolean).join(' · ') || 'No bonus';
          list.append(h('button', {
            class: 'part-opt' + (on ? ' on' : '') + ' r-' + o.rarity, style: { '--rc': BF.DATA.rarities[o.rarity].color },
            onclick: () => { BF.Audio.sfx('click'); sel.parts[slot] = { tpl: o.tpl, rarity: o.rarity, uid: o.uid }; renderRow(); updateProj(); },
          }, BF.Icons.item({ kind: 'part', tpl: o.tpl }, 38), h('span', null, h('b', null, tpl.name), h('small', null, (tpl.basic ? 'Basic · unlimited' : BF.DATA.rarities[o.rarity].name) + ' — ' + statTxt))));
        });
        row.append(list);
      };
      renderRow();
      return row;
    });
